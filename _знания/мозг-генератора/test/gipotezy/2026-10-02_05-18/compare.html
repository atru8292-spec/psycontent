а» добавляет тебе работу: теперь надо доказать, что опасность настоящая.\n\nТы отвечаешь за свои действия. За обвинения, за десять сообщений подряд с требованием ответить. Само появление тревоги ты заранее согласовать с собой не можешь.\n\nОн еще даже не ответил, а у тебя уже целое дело собрано. И все ради того, чтобы перестать считать себя дурой.","caption":"Фраза «я переживаю без причины» часто звучит как признание в чем-то постыдном. Даже перед психологом хочется сначала объяснить, почему имеешь право тревожиться.\n\nМеня зовут Юлия, я психолог, работаю с тревогой у людей от 20 до 40.\nЕсли хочешь прийти на консультацию, ссылка на запись в шапке профиля."},{"v":"h8","text":"Тревожишься, когда просишь вернуть долг? Сейчас научу тебя просто не накручивать. Сначала убери из сообщения «ты обещал». Человек почувствует давление. Дату тоже убери. У людей всякое бывает. Добавь «если тебе удобно». Еще смайлик. Ты же спокойно спрашиваешь, чего у тебя точка такая злая? Так. Теперь «мне нужны деньги» замени на «я тут вспомнила». Нужны ей. А человеку каково это читать? Все, отправляй. Что? Прочитал и молчит? Ну вот, опять ты накручиваешь. Напиши, что можно пока не возвращать. Чувствуешь, как сразу меньше поводов проверять телефон? И извинись. Человек из-за тебя чуть деньги не потерял.","caption":"Иногда после «просто не накручивай» ты начинаешь стыдиться самой просьбы. Вернуть долг вовремя обязан тот, кто его взял, даже если ты волнуешься и подбираешь слова.\nМеня зовут Юлия, я психолог, работаю с тревожными людьми от 20 до 40.\nПодписывайся, если хочется еще такого: здесь говорим о тревоге и отношениях."},{"v":"h7","text":"«Ты тревожишься, потому что накручиваешь. Просто перестань». Особенно приятно это услышать, когда ты уже час пытаешься успокоиться. Да, спасибо, теперь еще и виновата.\n\nЯ бы вообще убрала слово «просто» из таких разговоров.\n\nТы написала ему, как прошел день. Он ответил: «Нормально». Все. Обычно пишет подробнее, спрашивает про тебя, ставит смайлик. А тут одно слово. И у тебя сразу: почему так сухо? Он обиделся? Я что-то сказала? Может, ему уже надоели эти разговоры?\n\nТы сидишь с телефоном, перечитываешь это «нормально» и пытаешься понять, что случилось.\n\nА потом вспоминаешь: надо перестать накручивать.\n\nИ начинается еще один разговор, уже с собой. Ну что ты опять? Сколько можно? Нормальные люди спокойно занимаются своими делами. Почему тебе обязательно надо все испортить? Вот поэтому с тобой и тяжело.\n\nЯ считаю, здесь есть довольно жестокая путаница. Но первая тревога уже возникла. Ты увидела короткий ответ, испугалась. Ты ведь заранее согласия на этот испуг не давала.\n\nЗа сообщение, которое ты отправишь ему следом, ты отвечаешь. За обвинения, если начнешь обвинять, тоже.\n\nИ вот ты уже боишься его ответа, своего страха, следующей мысли. Когда ты говоришь себе «просто перестань», сколько обвинений ты успеваешь себе предъявить?","caption":"Слово «опять» иногда ранит сильнее самого упрека. С ним даже один тревожный вечер становится доказательством: «я всегда такая».\n\nМеня зовут Юлия, я психолог, работаю с тревожными людьми от 20 до 40.\nЕсли хочешь обсудить это на консультации, ссылка на запись в шапке профиля."},{"v":"zhh7","text":"Меня раздражает совет «просто перестань себя накручивать», потому что тревожному человеку после него приходится еще и оправдываться за свою тревогу.\n\nИ вот тебе говорят: хватит накручивать. Что ты начинаешь спрашивать у себя? Почему я опять все испортила? Почему все могут спокойно жить, а я даже здесь устраиваю проблему? Что со мной такое, если мне объяснили, что надо прекратить, а я продолжаю?\n\nВот. Тебе уже и тревожиться стыдно, и сказать об этом стыдно, потому что ответ ты знаешь заранее. Опять накрутила.\n\nЯ бы вообще осторожнее обращалась с этим «сама». Сама придумала, сама испугалась, сама теперь разбирайся. Очень удобная фраза для того, кто хочет побыстрее закончить разговор. Тебе после нее еще долго приходится разговаривать с собой, причем тем же самым тоном.\n\nИ я сейчас чуть в сторону скажу. Особенно странно слышать этот совет от людей, которые тут же начинают выяснять, почему ты такая напряженная, почему молчишь, почему у тебя такое лицо. Получается, переживать ты должна еще и так, чтобы никто ничего не заметил. Спокойно, аккуратно, желательно вообще без признаков того, что тебе трудно.\n\nУспокоилась? Нет?\n\nНо за то, чтобы по чужой команде перестать чувствовать тревогу, ты не отвечаешь.","caption":"Я бы убрала слово «просто» из многих психологических советов. Оно обещает легкость, а потом человеку приходится объяснять, почему у него опять не получилось.\nЯ Юлия, психолог, работаю с тревожными людьми от двадцати до сорока.\nЕсли захочешь прийти на консультацию, ссылка на запись в шапке профиля."},{"v":"живой","text":"Выбирай доброго. Если ты сейчас в поиске, ходишь на свидания, у меня для тебя один совет. Выбирай доброго человека. Самый яркий и самый остроумный пусть подождут. И я не про того, кто всегда удобный и на все согласен. Я про того, кто умеет быть внимательным, заботится, замечает и не хочет делать больно даже в ссоре. Сарказм, дерзость, флирт это весело, как смотреть на фейерверк. Но когда станет сложно, когда ссора, когда стресс, сарказм будет совсем не в кассу. Фейерверк впечатляет. А когда темно и холодно, хочется сидеть у костра, в тепле. Подписывайся, тут про отношения без сказок.","caption":""}]},{"id":"r_rod_1","topic":"мама обижается, если я не звоню каждый день","author":"Ольга","format":"reels_monolog","cards":[{"v":"zh","text":"Девочки, если пропущенный звонок мамы портит вам весь вечер, я вас обнимаю, мои дежурные по маминому настроению.\n\nУжин остывает, вы только сели, увидели ее имя на экране и уже прикидываете, сколько она ждет, каким голосом ответит, придется ли объяснять, почему вчера не звонили.\n\nПочему нельзя просто доесть? Потому что потом услышите: «Ну понятно, мать тебе уже не нужна». И придется доказывать, что нужна. Блять, опять.\n\nЗнакомо? Если каждый пропущенный вечер заканчивается обидой, вы постепенно начинаете звонить заранее, чтобы до нее вообще не дошло. Даже когда рассказывать нечего. Даже когда хочется тишины.\n\nИ вот вы живете отдельно, сами оплачиваете квартиру, решаете рабочие вопросы, а вечером у вас еще одна смена: убедить маму, что вы ее любите.\n\nДевочки, вы уже ЦЕЛУЮ взрослую жизнь тащите, и сверху ежедневное подтверждение, что вы хорошая дочь. С выходными там как?","caption":"Мне хочется спросить, можно ли в таком разговоре сказать: «Мам, я сегодня устала», и спокойно закончить звонок. Или после этого придется еще полчаса успокаивать маму.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nОтправьте тому, у кого тоже вечерняя смена на телефоне."},{"v":"h7","text":"«Мама обижается, если я не звоню КАЖДЫЙ день». Потому что «я просто занималась своими делами» звучит для вас как какое-то хреновое оправдание. Вечером.\n\nПредставьте: пришли домой, поставили макароны, включили сериал. Телефон лежит рядом. Вы видите время и думаете: надо позвонить. Потом серия закончилась, вы помыли посуду, пошли в душ.\n\nУтром сообщение: «Я так понимаю, мать тебе больше не нужна».\n\nИ все. Вы уже вспоминаете: могла ведь набрать, пока вода кипела. Могла после душа. Могла хотя бы написать. Сука, действительно могла.\n\nМеня здесь цепляет, как быстро исчезает ваше «я хотела спокойно побыть дома». Оно вообще куда делось?\n\nЯ сейчас чуть в сторону скажу. Слово «могла» вообще удивительное. Конечно, могла. Можно позвонить из ванной, из очереди, между двумя рабочими встречами. Технически почти всегда можно найти пять минут. Поэтому в таком споре вы заранее проиграли: свободные пять минут у вас обязательно обнаружатся.\n\nНо меня интересует другое. Почему каждая свободная минута уже как будто кому-то обещана?\n\nВы живете отдельно, покупаете продукты, платите за квартиру. А обычное «вчера мне хотелось тишины» до сих пор страшно произнести.\n\nЕсли мама обиделась, ваш вечер автоматически становится неправильным?","caption":"Иногда даже приятную новость придерживаешь до звонка: иначе мама спросит, почему узнала последней. И уже заранее подбираешь слова.\nЯ Ольга, психолог, работаю со взрослыми, которые живут отдельно от родителей, но все еще переживают из-за их обид.\nОтправьте тому, кто перед звонком маме готовит оправдания."},{"v":"h3h4","text":"«Мама обижается, если я не звоню каждый день».\n\nИ вот вы вечером набираете ее, хотя уже засыпаете. Спрашиваете, как дела, слушаете про соседку. Мама довольна. Фух, можно спать.\n\nА завтра закрутились, пропустили звонок. «Ну понятно, про мать совсем забыла».\n\nИ вы начинаете вспоминать: подождите, я же вчера звонила. И позавчера. Да всю неделю, блядь!\n\nНо эти звонки почему-то нигде не учитываются. Один пропущенный вечер, и вы СНОВА виноваты.\n\nИ постепенно вы уже проверяете время: успею сегодня, пока мама не начала?\n\nВы с мамой разговариваете или каждый вечер продлеваете себе статус хорошей дочери?","caption":"А фраза «могла бы и минутку найти» потом всплывает даже в отпуске, когда телефон лежит в номере.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые давно живут отдельно, а с родителями все еще сложно.\nОтправьте тому, кто тоже вечером смотрит на часы и вспоминает про звонок маме."},{"v":"h8","text":"Четыре признака, что вы звоните маме каждый день, чтобы она не обиделась.\nПервое. Вы заранее готовите оправдание. Задержались на работе, села батарейка. Просто «сегодня не хотелось разговаривать» звучит для вас как признание в преступлении.\nВторое. Свободное время хочется скрыть. Сказать, что весь вечер смотрели сериал? Блядь, тогда придется объяснять, почему для мамы десяти минут не нашлось.\nТретье. Вы раздражаетесь, когда партнер предлагает выключить телефон. Он хочет спокойно поужинать, а вы уже представляете завтрашнее: «Я всю ночь не спала».\nЧетвертое. Когда мама сама отменяет звонок, вы радуетесь. У нее гости, она занята. И вам вдруг МОЖНО провести вечер как хочется.\nЧье согласие вам нужно, чтобы сегодня не звонить?","caption":"«Я же волнуюсь» бывает очень трудно выдержать. Особенно когда вы уже написали, что доехали, поели и живы.\nЯ Ольга, психолог, работаю со взрослыми детьми 25-40 лет, которые живут отдельно от родителей.\nСохраните, если хочется вернуться к этому разговору."},{"v":"живой","text":"Когда люди говорят, что им не нужен психолог, они чаще всего добавляют: «я и так про себя все знаю и понимаю». Да, я тоже когда-то была проработанная, все прекрасно понимала. Вы можете вбить свой запрос в поиск, и он подберет вам вот столько книг. Как стать богаче, как построить отношения, как стать уверенней. Спросите чат-бота, он вам столько объяснений выдаст, что не унесете. И что, что-то поменялось? Проблема давно не в том, что мы чего-то не знаем. Мы не умеем чувствовать и боимся живого контакта, потому что в нем уязвимо и больно. А меняется что-то как раз там, в живом разговоре с человеком. Иначе так и будете говорить: головой я все понимаю, а в жизни ничего не меняется. Приходите в терапию, запись по ссылке в шапке профиля.","caption":""},{"v":"zhh7","text":"Девочки, которые звонят маме каждый день, чтобы она не обиделась, я вас уже по первому «ой, надо набрать» узнаю. Мои хорошие, у вас там телефон или журнал посещаемости?\n\nВот обычный вечер. Вы пришли домой, поставили макароны, телефон на зарядке в другой комнате. Поели, полезли за чистой футболкой, вспомнили про стирку. Потом берете телефон, там сообщение от мамы: понятно, тебе теперь совсем некогда.\n\nВсе. Футболка в руках, вечер закончился.\n\nЧто вы сейчас будете делать? Скорее всего, набирать маму и объяснять про макароны, зарядку, стирку.\n\nБлядь, даже макароны теперь должны выступить свидетелями.\n\nВы ведь часто еще до звонка подбираете голос. Бодрее надо. Если услышит усталость, спросит, что с вами, если раздражение, обидится, если коротко ответите, решит, что мешает. И вот вы уже стоите с этой футболкой и готовитесь звучать так, чтобы разговор прошел спокойно.\n\nЕсть силы? Сейчас найдутся.\n\nТогда можно выдохнуть.\n\nДевочки, вы уже вынесли переезды, работу, ремонты, очереди, сами вызываете сантехника и разбираетесь, почему опять списали деньги. СТОЛЬКО всего умеете, мои дорогие взрослые люди.\n\nИ опять двойка за незвонок.","caption":"Иногда после спокойного разговора с мамой вы наконец можете смотреть сериал, и только тут замечаете, что весь вечер ждали ее голоса.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые уже живут отдельно от родителей.\nСохраните, если узнали свои вечера."},{"v":"h6","text":"«Мама обижается, если я не звоню каждый день». И вот вы живете отдельно, платите за квартиру, покупаете продукты, но вечером у вас обязательная отметка: позвонить маме.\n\nЛежите уже под одеялом. Вспоминаете про звонок и сразу прикидываете: если пропущу сегодня, завтра придется объяснять. «Ты совсем про меня забыла». Блядь, еще и оправдываться. Ладно, проще сейчас набрать.\n\n«Привет, как дела?» Рассказывать особо нечего. Вы устали, мама смотрит телевизор. Пять минут поговорили, можно выдохнуть. На сегодня все, отметились.\n\nИ вот что меня здесь цепляет: такой звонок покупает вам сутки спокойствия. Завтра срок истечет, надо снова звонить. Даже если вчера вы прекрасно поговорили целый час. Этот час почему-то завтра уже НЕ считается.\n\nПостепенно вы начинаете думать о маме и сразу вспоминать, когда звонили последний раз. Как будто у вас в отношениях все время что-то просрочено.\n\nА если бы мама спокойно пережила вечер без звонка, о чем вам захотелось бы ей рассказать?","caption":"Иногда самое напряженное начинается с маминого «Что-то голос у тебя невеселый».\nМеня зовут Ольга, я психолог, работаю со взрослыми детьми, которые уже съехали от родителей.\nОтправьте тому, кому это сейчас знакомо."}]},{"id":"r_rod_1_2","topic":"мама обижается, если я не звоню каждый день","author":"Ольга","format":"reels_spisok","cards":[{"v":"h6","text":"Четыре признака, что мамины обиды за пропущенный звонок уже влияют на весь ваш день.\nПервое. Вы заранее оправдываетесь. Еще обед, а вы уже пишете: «Сегодня много работы, вечером могу не успеть». Чтобы к девяти не получить «про мать совсем забыли».\nВторое. Вам трудно закончить разговор. Уже стоите у кассы, но слушаете дальше. Сказать «мам, мне пора» страшнее, чем задержать очередь.\nТретье. Отдых начинается только после звонка. Мама довольна. Фух, блядь, теперь можно сериал. До этого даже на СВОЕМ диване сидите с ощущением, что что-то должны.\nЧетвертое. Вы радуетесь, когда у мамы свои планы. Она идет в гости, звонить сегодня не надо. И сразу столько сил, столько желания куда-то выйти.\nПолучается, даже свободный вечер вам должна разрешить мама?","caption":"«Можешь сегодня не звонить» иногда радует сильнее, чем приглашение на ужин. Особенно если за собственное «сегодня не смогу» потом приходится долго извиняться.\nЯ Ольга, психолог, работаю со взрослыми детьми 25-40 лет, которые уже живут отдельно от родителей.\nПодписывайтесь, если хочется еще такого: здесь говорим о родителях и своей взрослой жизни."},{"v":"живой","text":"Если у твоей девушки тревожная привязанность, вот три вещи, которые помогут ее понять. Первое. Когда ее накрывает, она может казаться агрессивной и слишком эмоциональной. В ее семье чувства не слышали, и она научилась кричать громче, чтобы ее услышали. Унизить тебя она не хочет. Второе. Она просит много контакта, потому что боится, что ты уйдешь. Ей нужно убедиться, что ты правда рядом. Контроль тут ни при чем. Третье. Она может устроить ссору в людном месте и ударить по больному. Знай, что ей в этот момент безумно страшно. А когда ребенку страшно, его берут на руки и успокаивают. Подписывайся, тут прокачиваем отношения.","caption":""},{"v":"h3h4","text":"Четыре признака, что вы звоните маме каждый день из страха ее обидеть.\nПервое. Вы заранее готовите оправдания. «Работала, потом магазин». Даже свободный вечер приходится объяснять уважительной причиной.\nВторое. Чужая обида для вас срочное дело. Коллега недоволен вашим отказом, и вы уже готовы задержаться. Ну сука, опять кому-то надо доказать, что вы хорошая.\nТретье. Вы скрываете приятное. Фото из ресторана маме потом отправите. Вдруг скажет: «На это время есть, а матери позвонить некогда».\nЧетвертое. Вам легче отдыхать, когда мама сама занята. «Сегодня не звони, мы в гостях». И вы прямо выдыхаете.","caption":"Иногда короткий звонок заканчивается, а мамино недовольство остается с вами до ночи. И вы еще перед сном отправляете сердечко, чтобы завтра разговор начался спокойно.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nПодписывайтесь, если хочется еще таких разборов отношений с родителями."},{"v":"zh","text":"Пять признаков «невнимательной дочери» по маминой версии, хотя вся ваша жизнь уже подстроена под ее звонки.\nПервое. От маминого имени на экране сжимается живот. Вы сразу вспоминаете, когда звонили последний раз.\nВторое. Отдых начинается после отчета маме. Уже лежите под одеялом, но набираете номер, иначе весь вечер будете ждать обиженного сообщения.\nТретье. Вы прерываете разговор с друзьями, чтобы ответить ей. Меня бесит это «тебе что, трудно взять трубку?». Блядь, у вас сейчас ужин.\nЧетвертое. Хорошие новости придерживаете. Про поездку расскажете потом, потому что мама обязательно спросит, почему для отпуска время нашлось, а для нее вчера нет.\nПятое. После пропущенного звонка тянет купить маме подарок. Уже выбираете доставку цветов, хотя еще утром никаких цветов в планах не было.\nСколько узнали у себя?","caption":"Особенно легко сорваться на звонок после короткого «ясно, отдыхай».\nЯ Ольга, психолог, работаю со взрослыми, которые живут отдельно от родителей, но все еще чувствуют себя перед ними виноватыми.\nПодписывайтесь, если хочется еще такого: здесь говорим об отношениях с родителями во взрослой жизни."},{"v":"h7","text":"Четыре признака, что вы звоните маме каждый день, чтобы она не обиделась, и уже перестали понимать, когда сами хотите с ней поговорить.\nПервое. Вы заранее готовите оправдание за пропущенный звонок. Просто «я вчера не хотела разговаривать» даже в голове звучит как преступление.\nВторое. Вот вы вечером включили сериал. Телефон рядом, и каждые десять минут вы проверяете время. Ладно, поставлю на паузу, быстро наберу. Сука, даже выходной приходится согласовывать с возможной маминой обидой.\nТретье. Все новости рассказали, завтра рано вставать, но мама вздыхает: «Ну понятно, у тебя свои дела». И вы остаетесь еще на двадцать минут. Так ежедневный звонок превращается в ДОЛГ, у которого мама каждый вечер заново устанавливает размер.\nЧетвертое. Вы радуетесь, когда мама сама не может разговаривать. И вам вдруг легко. Блин, вы всего лишь рады вечеру, за который никому не придется оправдываться. Вы давно звонили маме просто потому, что соскучились?","caption":"После маминого «можешь вообще не звонить» рука иногда сама тянется набрать еще раз. Хотя разговор только что закончился.\nМеня зовут Ольга, я психолог, работаю со взрослыми детьми, которые давно живут отдельно, но с родителями все еще сложно.\nПодписывайтесь, если хочется еще такого: здесь говорим об отношениях с родителями во взрослой жизни."},{"v":"zhh7","text":"Пять признаков тех, кому ежедневные звонки маме уже поперек горла, но пропустить страшно.\n\nПервое. От маминого имени на экране у вас сжимается живот. Просто не хотелось разговаривать, такого варианта в вашем списке вообще нет.\n\nВторое. Вы отдыхаете с оглядкой на время звонка. Телефон лежит рядом с подушкой.\n\nТретье. Ради маминого настроения вы прерываете время с другими людьми. Сели с мужем смотреть фильм, вспомнили про звонок, поставили на паузу, ушли на кухню, потому что при нем опять выслушивать про неблагодарность совсем не хочется. Меня злит, как легко это называют заботой о маме. Блядь, даже паузу нажимаете с чувством вины перед обоими.\n\nЧетвертое. Хорошую новость хочется придержать. Получили повышение, собираетесь в поездку, и сначала прикидываете, сколько вопросов будет про то, когда теперь найдете время для мамы.\n\nПятое. Пропущенный звонок становится расходом. На следующий день вы заказываете маме продукты, переводите деньги, покупаете что-нибудь без повода, хотя еще вчера таких планов не было. Даже чек сохраняете, вдруг понадобится напомнить.\n\nСколько у вас совпало?","caption":"Иногда разговор с мамой заканчивается, а вы еще полвечера проверяете, обычным ли голосом она попрощалась. Я бы эту часть тоже учитывала, когда слышу «тебе сложно пять минут поговорить?».\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nПодписывайтесь, если хочется еще таких разборов: здесь я говорю об отношениях с родителями во взрослой жизни."}]},{"id":"r_men_1","topic":"мужчины не плачут, а потом срываются на детей","author":"Михаил","format":"reels_spisok","cards":[{"v":"живой","text":"Всем привет, меня зовут Паша, и вот пять причин выбрать меня своим психологом. Причина первая. Я понимаю, о чем вы, когда вы говорите «кринж», «вайб» и «пикми». И «получку» с «хохмой» тоже понимаю. Причина вторая. У меня медицинское образование, я врач-психиатр и психотерапевт. Я знаю, почему крышечка подтекает и когда с этим надо к врачу. Причина третья. Со мной можно по-разному. Можем на сессии разобраться, почему попросить денег для вас как утонуть, а можем просто посидеть в тишине, потому что все заебало. Причина четвертая. Я не из тех, кто мило кивает. Я буду рядом, с пониманием, но не на стороне привычек, которые ломают вам жизнь. Причина пятая. Принимаю очно во Владивостоке и онлайн. Пишите в личку в телеграм.","caption":""},{"v":"zh","text":"Пять признаков отца, который запрещает себе раскисать. Я считаю, это слишком дорого обходится всей семье.\nПервое. Вы замечаете усталость только по телу: челюсть сжата, плечи болят, голова гудит. Но вслух все равно говорите, что нормально.\nВторое. Даже отдых надо заслужить. Сели на диван, ребенок зовет играть, и вы уже кричите: можно хоть минуту меня не трогать?\nТретье. Рассказать жене, что на работе было обидно, стыдно. Проще весь вечер отвечать через зубы.\nЧетвертое. Хорошие новости быстро превращаются в новые требования. Ребенок выиграл соревнование, вы уже объясняете, где он мог выступить лучше.\nПятое. Увидели счет за ремонт машины, потом ребенок забыл выключить лампу, и достается ему за всю сумму.\nСколько совпало?","caption":"После крика бывает стыдно даже зайти к ребенку в комнату. И тогда легко снова спрятаться в телефон, чтобы никто ничего не спрашивал.\nМеня зовут Михаил, я психолог, работаю со взрослыми мужчинами и отцами.\nОтправьте тому, кому сейчас это нужно."},{"v":"h7","text":"Четыре признака отцов, которые запрещают себе плакать, терпят весь день, а вечером срываются на детей.\nПервое. Про обиду вам легче сказать: «Меня достали». Поэтому получается коротко: «Все нормально, просто устал».\nВторое. Забота вызывает у вас злость. Вам говорят: «Сядь, я сам сделаю», а вы слышите что-то вроде: «Ты уже не справляешься». Да ладно, справляюсь я. Сейчас доделаю. Я считаю, вот это «еще способен» особенно жестокая мерка.\nТретье. Детские слезы кажутся вам преувеличением. Ребенок плачет, потому что развалилась башня из конструктора. Вы сначала говорите: «Собери заново». Он продолжает плакать. И тут уже: «Хватит реветь из-за ерунды!» Ладно, вернусь к башне. Ребенок ее потерял пять минут назад. Он еще расстроен.\nЧетвертое. Вас особенно задевает, когда ребенка утешают. Вы уже сказали «прекрати», а жена обнимает его, и внутри поднимается: «Так он вообще никогда не научится держать себя в руках». Вы ведь сами держите себя постоянно. Постоянно.\nА если вам больнее всего видеть, что с ним можно так, как с вами было нельзя?","caption":"Иногда фраза «я в его возрасте уже понимал» обрывается на самом интересном месте. Что именно вам пришлось понимать так рано?\nМеня зовут Михаил, я психолог, работаю с мужчинами 30-45 лет, в том числе с отцами.\nСохраните, если хочется вернуться к этой мысли."},{"v":"h6","text":"Четыре признака отцов, которые запрещают себе раскисать, а потом срываются на детей.\nПервое. О неприятностях вы говорите как о пустяках. Начальник унизил при всех, дома отвечаете: «Нормально, рабочие моменты».\nВторое. Усталость замечаете уже по крику. Ребенок разлил сок, вы орете, сами слышите свой голос. До этого целый вечер ходили со сжатыми зубами: «Да нормально я себя чувствую».\nТретье. Забота вас раздражает. Жена спрашивает: «Тебе тяжело?» Вы обрываете: «Давай без этого». Потому что еще чуть-чуть, и голос дрогнет. Этого только не хватало.\nЧетвертое. Детские слезы кажутся наглостью. «Из-за такой ерунды реветь!» Давайте так, ребенку сейчас разрешено расстроиться из-за сломанной машинки. А вам даже после унижения на работе нельзя.\nВот это «нельзя» вы и требуете от него.","caption":"Иногда «я в его возрасте так себя не вел» означает: «Меня бы за такое наказали».\nЯ Михаил, психолог, работаю с мужчинами 30-45 лет, с отцами.\nСохраните, если узнали себя."},{"v":"zhh7","text":"Пять признаков отцов, которые запрещают себе плакать, а потом срываются на детей.\n\nПервое. Вы замечаете свое состояние только тогда, когда уже болит голова.\n\nВторое. Отдыхать вам трудно, если дома кто-то еще чем-то занят.\n\nТретье. Детские слезы вы стараетесь остановить как можно быстрее.\nРебенок ревет из-за проигранной игры, а вы уже говорите, что из-за такой ерунды плакать стыдно, и меня злит совет учить мальчиков терпеть именно в такие минуты: вы сами сегодня проглотили обиду после разговора с начальником, пришли домой и теперь требуете от сына того же.\n\nЧетвертое. Хорошие новости вы встречаете списком новых обязанностей.\nВам повысили зарплату, жена обрадовалась, ребенок предлагает заказать пиццу, а вы уже объясняете, сколько теперь придется работать, что расслабляться рано, что еще кредит, и за весь вечер так и не произносите простую вещь: я доволен, у меня получилось, я этого ждал.\n\nПятое. На себя вы тратите деньги с длинным оправданием.\n\nСколько пунктов у вас совпало?","caption":"Фразу «папа устал» ребенок тоже слышит. Но после крика ему бывает трудно понять, можно ли сейчас подойти к папе с обычным вопросом.\nМеня зовут Михаил, я психолог, работаю с мужчинами и отцами от тридцати до сорока пяти.\nСохраните, если захотите вернуться к этому разговору."},{"v":"h8","text":"Четыре признака того, что вы запрещаете себе плакать и потом срываетесь на детей.\nПервое. Сочувствие хочется поскорее прекратить. Коллега спрашивает: «Тяжело вам сейчас?» Вы сразу: «Да нормально все». Еще поговорим, и голос дрогнет.\nВторое. Детские слезы вызывают злость. «Ну что ты ревешь из-за ерунды!» Себе вы это тоже говорите. Даже когда совсем тяжело.\nТретье. Вы обрываете все, от чего ком в горле. Закрыли трогательное видео, потерли лицо. Тут ребенок зовет, и вы уже рявкнули: «Слышал я!»\nЧетвертое. После вашего срыва ребенок вас обнимает, а вы сердитесь еще сильнее. «Все, иди играй». Потому что еще секунда такой нежности, и вы сами заплачете.","caption":"Иногда «соберись» означает буквально: стисни зубы, сглотни, отвечай ровным голосом. А вечером даже просьба найти пижаму звучит как последнее испытание.\nЯ Михаил, психолог, работаю с мужчинами от 30 до 45 лет, в том числе с отцами.\nПодписывайтесь, если хочется еще такого: здесь говорю о том, как мужчины справляются с чувствами и отцовством."},{"v":"h3h4","text":"Четыре признака отца, который запрещает себе плакать и срывается на детей.\nПервое. На работе вы проглатываете обиду. Начальник отчитал при всех, вы кивнули. Дома ребенок пролил сок, и голос уже слышно соседям.\nВторое. На вопрос «что случилось?» отвечаете «все нормально». Даже жене. Начнете рассказывать, еще голос дрогнет. Вот этого вы себе позволить не можете.\nТретье. Усталость тоже надо заслужить. Прилегли, увидели разбросанные игрушки, сразу встали: «Сколько можно за всеми убирать!»\nЧетвертое. Детские слезы вызывают злость: «Из такой ерунды реветь?» И тут же вспоминается: «Мне в его возрасте никто сопли не вытирал».\nВас больше злит, что он плачет, или что его утешают?","caption":"Иногда даже извинение перед ребенком застревает в горле: придется признать вслух, что самому было тяжело. Проще молча починить ему велосипед.\nМеня зовут Михаил, я психолог, работаю с мужчинами и отцами от 30 до 45 лет.\nСохраните, если хочется вернуться к этому разговору."}]},{"id":"r_men_1_2","topic":"мужчины не плачут, а потом срываются на детей","author":"Михаил","format":"reels_spisok","cards":[{"v":"живой","text":"Я психолог, и это не помешало мне обосраться. Поделюсь историей своего некрасивого успеха. В теории я знаю, что любой рост идет вместе со стыдом и страхом. Только знание не освобождает от того, чтобы все это прожить. С начала месяца у меня начало получаться то, к чему я шла. Как думаете, я обрадовалась? Да, конечно. Но честно, страха и стыда оказалось больше. Мне не хотелось никому рассказывать, начались бессонницы, а вчера я просто плакала от того, что у меня получается. Раньше в этом месте я сдувалась и возвращалась в точку ноль. Сейчас мне до одури страшно, мне стыдно, но я иду дальше. И для меня это большая победа.","caption":""},{"v":"h6","text":"Четыре признака отца, который запрещает себе плакать и потом срывается на детей.\nПервое. Вы быстро закрываете разговор о себе. На работе обидно до кома в горле, дома спрашивают, что случилось. «Нормально все».\nВторое. Вы замечаете напряжение, только когда уже огрызнулись. Челюсть сжата, голова болит, а вы весь вечер считаете, что просто ребенок слишком громко играет.\nТретье. Даже отдых надо заслужить. Сесть на диван можно, когда все сделано. Список, конечно, никогда не заканчивается. И любое «пап, помоги» звучит как еще одно требование.\nЧетвертое. Детские слезы злят особенно сильно. «Ну что ты ревешь из-за ерунды?» Смотрите, ребенку сейчас можно расстроиться из-за сломанной машинки. А вам из-за унижения на работе нельзя?","caption":"Фраза «я в его возрасте уже терпел» может звучать с гордостью. И одновременно выдавать обиду: почему ему можно попросить утешения?\nМеня зовут Михаил, я психолог, работаю с мужчинами от 30 до 45 лет, с отцами.\nПодписывайтесь, если хочется еще таких разборов: здесь говорим об отцовстве, чувствах и отношениях."},{"v":"h3h4","text":"Четыре признака отца, который запрещает себе раскисать и срывается на детей.\nПервое. Обиду вы сразу обесцениваете. Начальник унизил при коллегах, вы себе: «Переживу, маленький, что ли?» И продолжаете работать.\nВторое. Напряжение замечаете уже по голосу. Ребенок третий раз зовет посмотреть рисунок, и вы слышите собственное: «Да подожди ты!» Хотя еще минуту назад считали себя спокойным.\nТретье. Даже усталость надо заслужить. Сели на диван, тут же вспоминаете несобранный шкаф. Давайте так, у вас даже к дивану нужен допуск.\nЧетвертое. Детские слезы злят сильнее самого проступка. Разбил чашку, ладно. Но когда начинает плакать, хочется рявкнуть: «Прекрати!» Внутри уже звучит: «Я терплю. Почему ему можно?»","caption":"«Меня так воспитывали, я вырос нормальным» часто закрывает разговор именно там, где хочется спросить: какой ценой? Особенно если признаться в обиде на своего отца до сих пор стыдно.\nМеня зовут Михаил, я психолог, работаю с мужчинами от 30 до 45 лет, с отцами.\nПодписывайтесь, если хочется еще такого: здесь говорим об отцовстве, чувствах и отношениях."},{"v":"zh","text":"Пять признаков отца, который терпит до срыва. Такую выдержку я бы не хвалил.\nПервое. Даже дома у вас сжата челюсть. Ребенок второй раз спрашивает про мультик, и вы уже отвечаете сквозь зубы.\nВторое. В выходной вы ложитесь на диван, но любой шум воспринимаете как требование снова что-то сделать. Даже смех из детской.\nТретье. Меня злит совет «мужчины не плачут». Вы проглатываете обиду после разговора с начальником, потом кричите на сына из-за пролитого сока.\nЧетвертое. Ребенок прибегает показать рисунок, а у вас первая мысль: только бы сейчас ничего у меня не просил.\nПятое. Купить детям новую обувь легко, потратить на себя жалко. Свои кроссовки еще походят, и вообще, чего вам еще надо?\nСколько совпало?","caption":"После крика бывает стыдно даже подойти к ребенку. И тогда папа молча чинит ему игрушку, хотя хотел сказать, что погорячился.\nЯ Михаил, психолог, работаю с мужчинами и отцами.\nПодписывайтесь, если хочется еще такого: здесь про отцовство, чувства и отношения дома."},{"v":"h7","text":"Четыре признака, что вы привыкли сдерживать слезы и теперь срываетесь на детей из-за любой мелочи.\nПервое. Вы можете подробно рассказать, кто вас достал, и зависаете на вопросе: «А вам самому как?» А сказать «мне обидно» уже как будто унизительно. «Нормально мне. Просто все достали».\nВторое. Вы замечаете свое состояние, когда уже хочется рявкнуть. Челюсть сжата, от обычного вопроса дергаетесь, громкость телевизора бесит. До этого весь день было «нормально». Я бы здесь задержался на этом слове.\nТретье. Спокойная просьба близкого звучит для вас как очередное требование. «Пап, помоги» вызывает мгновенное «Да сколько можно!» Хотя ребенок сегодня обратился впервые.\nЧетвертое. Детские слезы злят вас сильнее самого проступка. Сын разлил сок, вы сказали убрать. Он расстроился, заплакал, и вот тут вас прямо подбрасывает: «Чего ревешь? Ничего же не случилось!» Я считаю, это важный момент: ребенок свободно делает то, за что вы сами себя мгновенно одергиваете. Вы свою обиду проглотили еще утром. И вчера тоже.\nЧто вас сильнее злит: разлитый сок или то, что ему можно плакать?","caption":"«Я в его возрасте уже понимал» часто вспоминается именно тогда, когда ребенок громко расстроен. В этой фразе легко пропустить, сколько с вас самого тогда требовали.\nМеня зовут Михаил, я психолог, работаю с мужчинами и отцами 30-45 лет.\nПодписывайтесь, если хочется еще таких разговоров: здесь про отцовство, чувства и отношения дома."},{"v":"zhh7","text":"Пять признаков отца, который привык терпеть до срыва.\n\nПервое. Вы замечаете напряжение только по телу: вечером болит голова, зажаты плечи, зубы стиснуты, но на вопрос жены, как прошел день, отвечаете, что нормально, хотя весь день хотелось послать всех подальше.\n\nВторой признак. Отдых тоже приходится терпеть: сели смотреть фильм с семьей, ребенок спрашивает, кто этот дядя, потом просит воды, потом снова что-то спрашивает, и вы уже повышаете голос.\n\nТретье. Взрослым вы отвечаете гораздо мягче, чем ребенку: начальник меняет задачу в конце дня, вы говорите, что сделаете, приятель отменяет встречу, вы пишете, что ничего страшного, а дома достаточно потерянного носка.\n\nЧетвертое. Хорошие новости вы сразу превращаете в следующую обязанность: сын принес хорошую отметку, вы спрашиваете про остальные предметы, получили прибавку, сразу считаете, сколько теперь можно откладывать.\n\nПятое. С деньгами вы легко оплачиваете всем нужное, но собственную покупку откладываете месяцами: куртка еще годится, кроссовки можно подклеить, без этого обойдусь, сейчас другие расходы.\n\nСколько совпало?","caption":"После крика бывает трудно подойти к ребенку: придется признать вслух, что сорвались. И разговор откладывается до вечера, до выходных, пока все снова не станет как обычно.\nЯ Михаил, психолог, работаю с мужчинами от тридцати до сорока пяти, в том числе с отцами.\nПодписывайтесь, если хочется еще таких разговоров: здесь про мужские переживания и отношения с детьми."}]},{"id":"r_vopros_2","topic":"«а о чем вообще говорить на первой сессии?»","author":"Юлия","format":"reels_scenka","cards":[{"v":"zhh7","text":"Б: Я не жду от тебя подготовленного рассказа.\nА: Ну как? Я приду, сяду, ты спросишь, что меня привело. И я скажу: не знаю.\nБ: А дальше я спрошу про это.\nА: А я буду сидеть и жаловаться, что мама опять позвонила, пока я ужинала.\nБ: Что тебе хочется сказать про этот звонок?\nА: Что я устала. Что хотела спокойно поесть. Я уже представляю, как ты слушаешь и думаешь: господи, какая ерунда, человек к маминому звонку придирается.\nБ: Ты ждешь, что я тебя осужу?\nА: Конечно.\nБ: И передо мной нужно заслужить право пожаловаться?\nА: Ну, если сразу пожаловаться, откуда ты поймешь, что я нормальная?\nБ: Что получилось бы с таким рассказом?\nА: Я бы выкинула все, за что меня можно осудить. И потом сидела бы у тебя, боялась что-нибудь ляпнуть. Получается, я могу начать прямо с того, что боюсь тебе рассказывать?\nБ: Да.","caption":"Я спокойно отношусь к паузам в разговоре. Иногда человек замолкает посреди фразы, и я оставляю ему место договорить.\nЯ Юлия, психолог, работаю с теми, кто впервые собирается в терапию.\nОтправь тому, кто пока боится записаться."},{"v":"h6","text":"А: Я не знаю, о чем говорить на первой сессии.\nБ: Что сейчас пришло в голову?\nА: Что я устала. Но это вам все говорят.\nБ: И что тогда?\nА: Ну вам же надоест слушать одно и то же.\nБ: Ты выбираешь, что мне понравится?\nА: Конечно. Хочется нормально начать, чтобы вы меня поняли.\nБ: А усталость куда?\nА: Потом. Когда придумаю, как рассказать, чтобы было интересно.\nБ: Ты кому сейчас помогаешь?\nА: Вам, получается. Чтобы вы со мной не мучились.\nБ: А кто здесь устал?","caption":"На первой встрече можно запнуться, забыть слово, начать с середины. Я не жду рассказа с красивой концовкой.\nЯ Юлия, психолог, работаю с теми, кто впервые собирается к психологу.\nОтправь тому, кто никак не решится записаться."},{"v":"h3h4","text":"А: Я впервые у психолога и вообще не знаю, что говорить.\nБ: С чего хотела начать?\nА: Составила список. Потом почти все вычеркнула.\nБ: Что ты вычеркнула?\nА: Что устала. Что мне обидно, когда мама перебивает.\nБ: Почему это вычеркнула?\nА: Ну все устают. И мамы у всех такие.\nБ: И что осталось?\nА: Ничего. Я подумала, вам надоест слушать мои жалобы.\nБ: Я сказала, что надоело?\nА: Нет. Я еще ничего толком не успела рассказать.\nБ: А сейчас кто тебя перебил?","caption":"На первую встречу можно прийти со списком в телефоне и ни разу его не открыть.\nЯ Юлия, психолог, работаю с теми, кто впервые собирается в терапию.\nОтправь тому, кто пока собирается с духом."},{"v":"zh","text":"Б: Мне подходит и «я не знаю, о чем говорить».\nА: Серьезно? Я думала, надо сначала разобраться, зачем я пришла.\nБ: А сейчас что хочется сказать?\nА: Вчера мама позвонила, я потом весь вечер злилась. Но это ерунда.\nБ: Почему ерунда?\nА: Ну люди приходят с настоящими проблемами, а я про звонок.\nБ: И поэтому про него промолчишь?\nА: Наверное. Еще подумаете, что мне просто заняться нечем.\nБ: Тебе важно, что я подумаю?\nА: Конечно. Я даже сейчас стараюсь как-то нормально все объяснить.\nБ: Как будто я оцениваю?\nА: Да. Получается, я уже могу рассказать, как боюсь вам не понравиться?\nБ: Да.","caption":"Я спокойно отношусь к заметкам в телефоне на первой встрече. Можно заглядывать в них, сбиваться, вспоминать что-то по ходу.\nЯ Юлия, психолог, пишу для тех, кто впервые собирается в терапию.\nОтправь тому, кто хочет записаться, но пока волнуется."},{"v":"h7","text":"А: Я пришла на первую сессию и вообще забыла, о чем говорить.\nБ: А до встречи были мысли?\nА: Сейчас смотрю на этот список и думаю: господи, ну кому это интересно слушать?\nБ: Ты сейчас переживаешь, интересно ли мне?\nА: Конечно.\nБ: И как тебе с этим?\nА: Неловко.\nБ: Уже думаешь, как я устану.\nА: Да я всегда так. Подруге хочу пожаловаться, сначала спрашиваю, как у нее дела. Если она устала, все, про себя потом. Начинаю ее слушать. А свое уже как-нибудь.\nБ: А если она готова слушать?\nА: Тогда стараюсь покороче. Или смешно рассказываю. Даже если плакать хочется.\nБ: Здесь тоже хочется рассказать смешно?\nА: Да. Я даже по дороге придумала, как начать. Там смешная история про работу. И сейчас злюсь на себя: забыла ее, сижу тут. Мне тяжело, а я думаю, как бы тебе со мной не заскучать.\nБ: А что случится, если я заскучаю?","caption":"У меня нет списка тем, которые обязательно надо успеть обсудить при знакомстве. Можно начать с фразы, которая пришла в голову уже в кабинете.\nЯ Юлия, психолог. Работаю с теми, кто впервые собирается к психологу.\nОтправь тому, кто собирается и пока волнуется."},{"v":"живой","text":"А: (давит бутылку) Пытаюсь выдавить майонез. Опять кетчуп.\nБ: Так это же кетчуп. Возьми майонез.\nА: Мне нужен майонез из этой бутылки.\nБ: Зачем?\nА: Может, я просто мало стараюсь. Рано или поздно должно получиться.\nБ: Дави сколько хочешь. Это кетчуп.\nА: Я еще разок попробую.\nБ: Ладно. Майонез будет тут, если что.\nА: (давит) Давай, давай!","caption":""}]},{"id":"r_vopros_2_2","topic":"«а о чем вообще говорить на первой сессии?»","author":"Юлия","format":"reels_otvet","cards":[{"v":"h7","text":"А о чем вообще говорить на первой сессии? Можно начать прямо с этого: «Я всю дорогу думала, что вам рассказывать, и ничего нормального не придумала».\n\nСерьезно.\n\nПредставь: ты открываешь заметки в телефоне и пишешь, о чем хочешь поговорить. Вчера звонила мама. Спросила, приедешь ли в выходные. Ты сказала, что устала и хочешь побыть дома. Мама ответила: «Ну понятно». Все. Два слова. А ты потом весь вечер ходила с телефоном, хотела написать, что все-таки приедешь, злилась, снова хотела написать.\n\nТы заносишь это в заметки. Потом перечитываешь и стираешь. Ну что за ерунда. Люди приходят с настоящими проблемами, а я буду рассказывать, как мне мама сказала «ну понятно»?\n\nИ вот на встрече вполне можно произнести: «Я хотела рассказать про звонок мамы, но это, наверное, глупо».\n\nЯ могу спросить: «Ты сейчас переживаешь, что я тоже сочту это глупым?»\n\nМне как психологу важно услышать и про звонок, и про то, как ты решила его вычеркнуть. Здесь можно остановиться и спросить:\n\n«А что ты собиралась рассказать до того, как решила, что мне это будет глупо слушать?»","caption":"Записи можно принести на встречу и заглядывать в них, если теряешь мысль. Мне бывает важно уточнить, что человек имеет в виду под привычным словом «нормально».\nМеня зовут Юлия, я психолог, работаю с теми, кто впервые собирается в терапию.\nПодписывайся, если хочется еще таких разговоров: здесь я рассказываю, как проходит терапия."},{"v":"живой","text":"«Зачем мне психолог, я и так все про себя знаю». Слышу это постоянно. Хорошо, смотри. Ты можешь прочитать двадцать книг про тревогу, спросить чат-бота, посмотреть все мои рилсы. И знать будешь много. А в два часа ночи все равно лежишь и прокручиваешь один разговор. Потому что знание живет в голове, а тревога живет в теле и в привычках. Их не прочитаешь, их меняют медленно, вместе с живым человеком, который рядом и видит то, чего ты сама не замечаешь. Так что знай себе на здоровье. А если надоело знать и хочется, чтобы стало по-другому, запись у меня в шапке профиля.","caption":""},{"v":"h3h4","text":"А о чем вообще говорить на первой сессии? Можно начать с того, что ты боишься выбрать какую-нибудь ерунду. Вот прямо так и сказать. Допустим, перед встречей ты перебираешь: про маму, про работу, про то, что он весь день не отвечал? Ну, последнее вроде стыдно. Люди с серьезными проблемами приходят, а ты со своими сообщениями. И уже сидя напротив меня, говоришь: «Наверное, это глупость». Вот тут я бы задержалась. Ты еще ничего не рассказала, а уже извиняешься за то, что тебе больно. И я бы спросила: «А чье согласие тебе нужно, чтобы считать это достаточно серьезным?»","caption":"Иногда перед первой встречей хочется даже записать все по пунктам. Я спокойно отношусь к тому, что ты принесешь список и в итоге заговоришь совсем о другом.\nМеня зовут Юлия, я психолог, помогаю разобраться тем, кто впервые собирается в терапию.\nПодписывайся, если хочется еще такого: здесь я рассказываю, что происходит у психолога."},{"v":"zhh7","text":"А о чем вообще говорить на первой сессии? Можно начать прямо с этого вопроса.\n\nВот ты садишься и говоришь: я хотела прийти, записалась, а теперь думаю, что у меня вообще ничего такого нет. У других проблемы серьезнее. И я могу спросить: а что происходило, когда ты решила записаться? Что тогда хотелось рассказать?\n\nЭто знакомая история даже с обычным сообщением подруге. Хочешь рассказать, что поссорилась с мамой, открываешь переписку, начинаешь печатать, потом стираешь. У подруги работа, дети, свои дела. Пишешь, что все нормально. И вроде никто тебе говорить не запрещал, но рассказ так и остался у тебя.\n\nЯ считаю, что требовать от себя такой ясности перед первой встречей слишком много. Ты ведь как раз приходишь с тем, в чем пока трудно разобраться.\n\nМне самой нужно время, чтобы тебя услышать и понять, как ты живешь, что тебя тревожит, о чем тебе особенно трудно говорить.\n\nПоэтому, если ты придешь и скажешь: я всю дорогу думала, о чем говорить, и теперь у меня пусто в голове, я спрошу, чего ты ожидала от этой встречи. С этого мы и начнем.","caption":"Перед встречей можно спросить меня, как устроена оплата или что делать, если опаздываешь. Такие вопросы тоже можно задавать, даже если они кажутся мелкими.\nЯ Юлия, психолог, работаю с теми, кто впервые решается прийти.\nПодписывайся, если хочется еще таких разговоров: здесь я рассказываю, как проходит работа с психологом."},{"v":"h6","text":"А о чем вообще говорить на первой сессии? Да хоть о том, как ты сейчас выбираешь слова. Вот ты приходишь, садишься и думаешь: про маму? Про отношения? Вдруг я начну какую-то ерунду рассказывать? Даже здесь хочется правильно начать, да? Допустим, ты говоришь: «Я расстроилась, что он весь вечер сидел в телефоне. Ну, это глупость, конечно». И я могу остановиться: «Подожди, ты сейчас рассказала, что тебе было обидно, и сразу назвала это глупостью». Ты еще толком историю рассказать не успела, а уже извиняешься, что заняла мое время. И мне хочется спросить: «Что я должна услышать, чтобы ты разрешила себе говорить дальше?»","caption":"Можно начать с «я даже сюда идти сомневалась». Мне важно услышать и эти сомнения.\nЯ Юлия, психолог. Помогаю тем, кто пока только думает пойти к психологу.\nПодписывайся, если хочется еще такого: здесь рассказываю, как проходит терапия."},{"v":"zh","text":"А о чем вообще говорить на первой сессии? Даже о том, что ты сейчас сидишь и понятия не имеешь, что сказать. Бывает, готовишься, как перед важным звонком: репетируешь первую фразу, чтобы все понятно объяснить. А потом садишься и говоришь: «Наверное, я зря пришла, у людей проблемы посерьезнее». Вот тут я спрошу, почему тебе понадобилось сравнить себя с другими именно сейчас, когда речь зашла о тебе. Мы уже разговариваем. Я слушаю и то, что ты рассказываешь, и как тебе со мной это говорить. У меня не будет экзамена на серьезность проблемы. И я не обещаю сразу все объяснить. Я начинаю с того, с чем ты пришла.","caption":"В начале разговора я тоже участвую: могу спросить, как тебе было решиться на встречу. Заготовленная история для этого не нужна.\nМеня зовут Юлия, я психолог, работаю с теми, кто впервые решается прийти.\nПодписывайся, если хочется еще такого: здесь я рассказываю, как проходит работа с психологом."}]},{"id":"r_money_1","topic":"стыдно просить повышение, хотя работаю больше всех","author":"Ольга","format":"reels_malysh","cards":[{"v":"h3h4","text":"Хорошие мои, вы работаете больше всех, а попросить повышение зарплаты стыдно?\n\nВ голове у вас звездочка за хорошее поведение. Ее дают, когда вы помогаете, соглашаетесь, ничего себе не просите. Вот какая ХОРОШАЯ.\n\nВ пятницу начальник приносит еще один отчет. Вы уже собирались домой, но берете. Еще звездочка.\n\nА заговорить про денежки страшненько. Вдруг звездочку снимут? Скажут: «Так вы ради денег старались?»\n\nБлядь, получается, за дополнительную работу вы расплачиваетесь еще и молчанием.\n\nВы ждете, когда заслуг станет столько, что просить будет прилично. Только у этой звездочки такое условие: хорошая девочка сама ничего не просит.\n\n«Я хочу обсудить повышение зарплаты».","caption":"Список своих задач вы можете написать за пять минут. А сообщение с просьбой о встрече переписывать весь вечер.\nЯ Ольга, психолог, работаю с женщинами, которые строят карьеру в найме.\nЕсли знакомо, напишите в комментариях «звездочка»."},{"v":"живой","text":"Он скинул тебе смешной рилс, а ты пролистала и даже реакцию не поставила. Вроде мелочь, да? Но если такие мелочи повторяются, они влияют на отношения намного сильнее, чем кажется. Отношения держатся на мелочах, которыми вы друг друга окликаете. Тот самый смешной рилс. Фотка заката из окна. Сообщение «как ты там». В них всегда есть что-то непроговоренное: я про тебя помню, я тебя вижу, ты мне важна. Понятно, ситуации бывают разные, мы не идеальны. Но если раз за разом никто не откликается, внутри появляется: я не интересна, я одна в этих отношениях. Отношения разрушают маленькие вещи, когда тебя раз за разом не замечают. Так что не жадничай на «ахаха» в ответ на рилс.","caption":""},{"v":"zh","text":"Девочки, хорошие мои, я за то, чтобы вы могли попросить денег без этого стыда, будто чужую конфетку взяли. Я называю это «жду наклейку».\n\nВы ждете наклейку, и вечером все уже ушли, и вы доделываете отчет, потому что хорошую девочку обязательно заметят и дадут ей награду, правда?\n\nВы ждете наклейку, и попросить повышение страшно, потому что тогда вы вроде как жадная, сами себе награду попросили, испортили всю хорошесть. Блядь, даже деньги за свою работу просить неловко.\n\nВы ждете наклейку, и каждый новый отчет становится еще одной попыткой показать, какая вы полезная, только руководитель уже привык, что вы столько делаете за эту зарплату.\n\nВы ждете наклейку, и можно потихоньку перестать ждать, что вам сами все предложат, и сказать: я хочу обсудить повышение.\n\nВы ждете наклейку годами.","caption":"Перед разговором о зарплате можно мысленно оправдываться даже за собственную ипотеку. Как будто руководителю надо сначала одобрить, на что вы потратите деньги.\nЯ Ольга, психолог, работаю с женщинами, которые работают в найме.\nЕсли знакомо, напишите в комментариях «жду»."},{"v":"h6","text":"Вам стыдно просить повышение, хотя вы работаете больше всех? Хорошая моя, ручки уже устали, а ротик начальнику про деньги ничего сказать не может.\n\nБудто у вас внутри дневничок. Туда за каждую выполненную задачу должны поставить пятерку. Подменили коллегу, пятерка. Закончили отчет вечером, еще пятерка. Теперь ждете: начальник посмотрит, какая вы хорошая, и сам прибавит зарплату.\n\nА попросить? Это же получается САМИ себе пятерку поставили. Наглость какая.\n\nБлядь, вот и сидите с полным дневничком и прежней зарплатой.\n\nА вы привыкли, что оценку ставит кто-то старший. Даже если этот старший половины ваших задач вообще не видел.\n\nМожно прийти без дневничка. Сказать: «У меня стало больше задач. Хочу обсудить повышение зарплаты».","caption":"Иногда руководитель узнает, сколько вы на себя взяли, только когда вы собираетесь увольняться. До этого все удобно: работа делается, вопросов нет.\nМеня зовут Ольга, я психолог, работаю с женщинами, которые работают в найме.\nЕсли знакомо, напишите в комментариях «дневничок»."},{"v":"h7","text":"Хорошая моя, вы работаете больше всех, а попросить повышение стыдно. Уже открыли переписку с руководителем, уже набрали первую строчку. И стерли. Лапки сразу вспотели: «Вдруг подумает, что я обнаглела?»\n\nДавайте я вам про зайчика расскажу. Есть такой зайчик, который очень хорошо помогает. Ему говорят: «Сделаешь?» Он делает. «Еще вот это?» И это делает. «Там вообще чужая задача, но выручишь?» Конечно, выручит. Зайчик же хороший.\n\nОй.\n\nЯ считаю, это очень дорогая привычка, быть человеком, с которым легко. Особенно на работе. Все знают: вам можно написать после шести, вы подхватите, разберетесь, доделаете. И вы сами уже говорите: «Да ладно, я САМА». Иногда раньше, чем вас успели попросить.\n\nБлядь, даже разговор еще не начался, а вы уже мысленно извиняетесь.\n\n«Я понимаю, сейчас сложный период».\n«Конечно, если возможности нет».\n«Мне в целом все нравится».\n\nРуководитель еще сообщения не получил. Вы уже успели сделать свою просьбу такой маленькой, чтобы она никому ничего не стоила.\n\nИ теперь само ваше желание, с которым другому человеку придется считаться, ощущается почти как проступок.\n\nВы просите больше денег за свою работу. Кого вы этим подводите?","caption":"Даже приглашение «давайте обсудим условия» иногда хочется закончить словами «извините за беспокойство». И ведь рабочий вопрос, какого хр*на мы заранее извиняемся.\nМеня зовут Ольга, я психолог, работаю с женщинами, которые устают в найме.\nЕсли знакомо, напишите в комментариях «стыдно»."},{"v":"zhh7","text":"Девочки, хорошие мои, я психолог, и мне очень хочется поговорить про это ваше «еще чуть-чуть».\n\nКак будто вам должны выдать наклеечку за хорошую работу, и вот с ней уже можно идти к начальнику и говорить про повышение.\n\nВот сегодня коллеги закончили работу, а вам прилетела дополнительная задача, и вы уже собирались закрыть ноутбук, но открыли файл, потому что такая возможность показать, какая вы полезная, и жалко ее упускать. Поесть потом. Сообщение про пересмотр зарплаты пока лежит в черновиках.\n\nОчень удобно для всех остальных, кстати.\n\nЕще чуть-чуть, и вы получите ту самую наклеечку. Только выдачу вы каждый раз переносите сами. Сделали дополнительную задачу, хорошо, теперь надо еще месяц без ошибок. Прошел месяц, хорошо, теперь дождемся окончания проекта. Блядь, у этой наклеечки условия все время меняются.\n\nПоэтому еще одна задача ощущается проще, чем разговор. Задача знакомая. Ее можно выполнить.\n\nА пока выбираете снова открыть файл, потому что там понятно, как стараться, и можно на вечер отложить этот неприятный момент, когда ваше желание услышит другой человек и у него будет собственная реакция.\n\nЕще чуть-чуть. Вы все еще ждете разрешения попросить.","caption":"Черновик сообщения начальнику иногда редактируют дольше, чем отчет за месяц. Даже слово «обсудить» кажется слишком требовательным.\nЯ Ольга, психолог, работаю с женщинами, которые работают в найме.\nЕсли узнали себя, напишите в комментариях «потом»."}]},{"id":"r_money_1_2","topic":"стыдно просить повышение, хотя работаю больше всех","author":"Ольга","format":"reels_monolog","cards":[{"v":"zh","text":"Сижу, листаю ленту, и опять этот прекрасный совет: стыдно просить повышение, просто станьте незаменимой. Ну охуеть теперь.\n\nВы уже подхватываете чужие задачи, отвечаете после работы, доделываете за коллегой, осталось ночевать у принтера, чтобы утром он чувствовал поддержку. И вот вы открываете чат с руководителем, начинаете писать про зарплату, стираете. Лучше еще один проект возьмете. Тогда уж точно будет за что просить.\n\nЭто «точно» все время отодвигается.\n\nЯ тоже умею сначала подготовиться, потом еще подготовиться, потом обнаружить, что весь день готовилась открыть рот.\n\nОчень удобно. Особенно работодателю.\n\nТак, пойду запишу еще один ролик, чтобы точно заслужить обед.","caption":"Руководитель вполне может привыкнуть, что вы все успеваете. Особенно если про вечер за ноутбуком в рабочем чате ни слова.\nЯ Ольга, психолог, работаю с женщинами, которые работают в найме.\nЕсли хотите обсудить это на консультации, пишите в директ слово «разбор»."},{"v":"h6","text":"«Я работаю больше всех, но попросить повышение стыдно. Вот возьму еще один проект, тогда точно будет за что».\n\nДевочки, вот это «тогда» может годами отодвигаться. Вы закрыли чужую задачу, остались вечером, спасли отчет. И что, теперь легко зайти к начальнику? Да блин, теперь кажется, что надо еще немного постараться.\n\nВы пытаетесь столько сделать, чтобы начальник просто не мог отказать. Чтобы повышение стало очевидным и вам вообще не пришлось говорить: «Я хочу больше денег».\n\nКак будто собираете чеки на каждую тысячу прибавки. Вот переработка, вот выходной, вот я за коллегу все доделала. Все оплачено, можно мне теперь?\n\nТолько у начальника все еще есть возможность сказать «нет». И вы снова идете работать, чтобы в следующий раз уж ТОЧНО хватило оснований.\n\nВы уже работаете за двоих. Просить будете, когда начнете за троих?","caption":"Особенно обидно, когда вашу дополнительную работу уже включили в планы отдела. Все привыкли, что вы столько успеваете.\n\nМеня зовут Ольга, я психолог, работаю с женщинами, которые работают в найме.\nЕсли хотите разобрать свою ситуацию на консультации, пишите в директ слово «разбор»."},{"v":"h3h4","text":"«Мне стыдно просить повышение, хотя я работаю больше всех».\n\nВы вечером доделываете отчет. Открываете чат начальницы, собираетесь попросить встречу про зарплату. И тут: «Может, сначала еще тот проект вытянуть?» Блядь, еще один. Чтобы уж точно заслужить.\n\nСмотрите, вы можете годами жить с негласным договором: я угадываю, что вам нужно, делаю больше, вы САМИ замечаете и меня награждаете. Красивый договор. Только начальница его вообще не подписывала.\n\nА попросить стыдно, потому что в этом договоре хорошую сотрудницу должны заметить без напоминаний. Приходится самой объявить: мой труд стоит дороже.\n\nСколько еще отчетов вы собираетесь написать вместо одного разговора?","caption":"У начальницы ваша готовность брать еще может давно записаться в «ее все устраивает». Особенно если на каждую новую задачу вы отвечаете: «Да, конечно».\nЯ Ольга, психолог, работаю с женщинами, которые строят жизнь и карьеру в найме.\nЕсли хотите обсудить это на консультации, пишите в директ слово «разбор»."},{"v":"h7","text":"«Я работаю больше всех в отделе, а попросить повышение мне стыдно. Вдруг решат, что я обнаглела?»\n\nИ вот вы открываете переписку с руководителем. Хотели написать про зарплату. Но там сообщение: «Кто сможет доделать презентацию к утру?» И вы уже печатаете: «Я возьму».\n\nТребовательной.\n\nВот что меня здесь цепляет. Вы можете пытаться заслужить такое повышение, которое вообще не придется просить. Чтобы руководитель САМ подошел и сказал: «Слушайте, вы столько делаете, давайте поднимем вам зарплату».\n\nВы доделываете ту презентацию вечером. Проверяете цифры, правите чужие слайды, отправляете готовое. Руководитель пишет: «Спасибо, очень выручили». Вы смотрите на это «спасибо» и беситесь. Блядь, опять спасибо. А деньги?\n\nЯ считаю эту молчаливую договоренность очень дорогой. Потому что оплачиваете ее вы. Вечерами, силами, еще одной задачей, которую уже некуда впихнуть.\n\nИ получается какая-то хреновая сделка: чем страшнее попросить, тем больше вы отдаете бесплатно. А просить после этого все равно страшно.\n\nСколько еще работы вы собираетесь сделать, чтобы ваше «я хочу больше денег» наконец перестало казаться вам наглостью?","caption":"Бывает, коллега спокойно обсуждает прибавку, а у вас даже от его уверенного тона сводит живот. Сам разговор о деньгах уже кажется чем-то неприличным.\nЯ Ольга, психолог, работаю с женщинами, которые работают в найме.\nЕсли хотите обсудить это на консультации, пишите в директ слово «разбор»."},{"v":"zhh7","text":"Я сейчас пью кофе и читаю совет: если стыдно просить повышение, просто покажите, что вы его заслужили. Ну сколько еще показывать, девочки?\n\nВы уже чужие задачи подхватили, новичка обучили, вечером на сообщения ответили, в отпуске файл нашли, скоро будете в офисе фикус поливать силой профессиональной мотивации.\n\nМеня бесит это бесконечное «сначала заслужите». Блядь, когда уже достаточно?\n\nВот вы закрыли свою работу, взяли кусок работы коллеги, руководитель сказал, что без вас бы вообще не справились. Думаете, ну теперь он видит, теперь понимает, сколько я делаю, наверняка сам поднимет вопрос о зарплате.\n\nПроходит время. Он снова приносит вам задачу. Зарплата та же.\n\nИ что вы делаете? Берете.\n\nЯ сама тоже могу мысленно отрепетировать разговор так, что собеседник там успеет и обидеться, и разочароваться, и посмотреть на меня с укором. Очень производительное воображение. Собеседник пока вообще занят обедом.\n\nЯ бы очень хотела, чтобы начальство читало мысли и само замечало этот внутренний счетчик.\n\nНо пока из молчания у нас отлично получается только еще одна задача. Сейчас допью кофе и тоже мысленно получу повышение. Охуенный финансовый план.","caption":"Особенно неловко бывает после похвалы: руководитель вас поблагодарил, и разговор о деньгах уже кажется чем-то, что испортит хороший момент.\nЯ Ольга, психолог, работаю с женщинами, которые устают быть удобными и дома, и на работе.\nЕсли хотите обсудить это на консультации, пишите в директ слово «разбор»."}]},{"id":"r_body_1","topic":"ненавижу себя в зеркале перед отпуском","author":"Юлия","format":"reels_poslanie","cards":[{"v":"h7","text":"Это для тебя, если перед отпуском ты смотришь в зеркало и думаешь: «Ну куда я поеду с таким телом». А теперь билеты куплены, и ты стоишь перед зеркалом, как будто тебя сейчас будут отчитывать.\n\nПеред отпуском к недовольству телом иногда добавляется очень неприятное чувство: будто ты собираешься отдыхать без разрешения. Слишком много себе позволяешь, учитывая, как ты выглядишь.\n\nПредставь: ты собираешь чемодан, достаешь купальник. Тот самый, который тебе понравился. Надеваешь, поворачиваешься боком. Втягиваешь живот. Отпускаешь. Опять втягиваешь. И уже думаешь, какую рубашку взять, чтобы все время прикрываться. Потом вспоминаешь про фотографии. Потом про пляж. За несколько минут ты успела испортить себе отпуск, до которого еще неделя.\n\nЯ сейчас чуть в сторону скажу. Меня в этой истории особенно цепляет, что отпуск у тебя уже есть. Ты нашла время, выбрала место, купила билеты. Все готово. Но внутри остается еще одна инстанция, которая говорит: «Подожди. Покажи, что ты заслужила». И ты послушно идешь к зеркалу.\n\nС теми ногами, которые тебе сейчас не нравятся. И даже с этим недовольством, раз оно пока есть.\n\nТебе уже можно в отпуск.","caption":"Бывает, из поездки привозишь десятки фотографий моря и одну свою, по плечи. Все остальные удалила еще в отеле.\nЯ Юлия, психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли знакомо, можешь написать в комментариях «знакомо»."},{"v":"h6","text":"Ты примеряешь купальник перед отпуском и думаешь: «Как я вообще в таком виде поеду?» Билеты куплены, ты так ждала моря. И вот стоишь перед зеркалом, злишься на себя, хочется все отменить. Как будто теперь придется извиняться за свой живот весь отпуск. Слушай, ты уже устроила себе проверку: достаточно ли ты похудела, чтобы тебе разрешалось отдыхать? И сама же себе отказала. Еще и ругаешь себя за то, что опять все испортила этими мыслями. Ты так хотела просто выдохнуть, а получила еще одно условие. Можно ехать без его выполнения.","caption":"Фраза «к отпуску надо привести себя в порядок» звучит так привычно, что ее жестокость легко пропустить. Будто вместе с купальником в чемодан обязательно нужно положить исправленную версию себя.\nЯ Юлия, психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хочется, напиши в комментариях одно слово: «знакомо»."},{"v":"zh","text":"Если перед отпуском ты смотришь в зеркало и ненавидишь себя, я хочу сказать, как много сил уходит на эти придирки. Изматывает примерять купальник и сразу смотреть на живот, поворачиваться боком и искать, где еще надо похудеть. Изматывает заранее представлять фотографии и думать, как встать, чтобы потом их никому не показывать. Изматывает злиться на себя за то, что опять переживаешь из-за внешности, ведь ты же взрослая, должна уже спокойно к этому относиться. Изматывает ждать от отпуска отдыха и одновременно требовать от себя срочно стать другой к дате вылета. Ты столько раз себя уже отругала. Изматывает еще и считать себя виноватой за это.","caption":"Купальник может хорошо сидеть, и все равно рука тянется взять сверху рубашку. Иногда еще до пляжа хочется спрятаться от чужого взгляда.\nЯ Юлия, психолог, работаю с девушками и женщинами от двадцати до сорока.\nЕсли хочется, напиши в комментариях одно слово: что чувствуешь перед отпуском."},{"v":"zhh7","text":"Если перед отпуском ты смотришь в зеркало и думаешь, что с таким телом вообще никуда ехать нельзя, я хочу сказать тебе вот что: ты уже замучилась.\n\nТы замучилась смотреть на себя по частям, и живот у тебя существует отдельно, и бедра отдельно, и руки, которые на фотографии обязательно надо куда-нибудь спрятать, и ты уже почти не видишь, как сидит купальник целиком. И еще поворачиваешься боком. Вдруг сбоку будет лучше.\n\nЯ каждый раз думаю: сколько же условий мы успеваем выставить себе даже для обычного отпуска.\n\nТы замучилась, и это особенно заметно в такой обычный момент: чемодан открыт, ты примеряешь шорты, собираешься положить их к остальным вещам, потом задерживаешься перед зеркалом, потом натягиваешь футболку пониже, потом решаешь, что шорты останутся дома. И вдруг хочется отменить вообще все. Хотя еще утром ты хотела к морю. Одни шорты, а вечер уже испорчен.\n\nУ тебя в этой примерочной слишком много народу, даже когда ты дома одна.\n\nИ злость на себя растет, потому что ты старалась, проверяла, переодевалась, а спокойнее так и не стало.\n\nТы замучилась быть под собственным надзором.","caption":"В примерочной к зеркалу часто добавляется еще и свет, под которым хочется немедленно переодеться обратно. Я бы учитывала и его, прежде чем выносить себе очередной приговор.\nЯ Юлия, психолог, работаю с девушками и женщинами от двадцати до сорока.\nЕсли хочется, напиши в комментариях одно слово: «знакомо»."},{"v":"h3h4","text":"Если перед отпуском ты смотришь на себя в купальнике и думаешь: «Господи, как я с этим телом поеду», послушай. Ты сейчас стоишь перед зеркалом и решаешь, можно ли тебе вообще радоваться поездке. Втянула живот, повернулась боком. Так вроде можно. Выдохнула, опять все испортила. И уже злишься на себя: почему я заранее собой не занялась? Сколько можно, ну сколько можно проверять, заслужила ли ты ходить в купальнике. Ты хотела отпуск, а получила еще одно место, где надо соответствовать. Даже радоваться страшно, вдруг слишком рано расслабилась. И да, живот тоже едет в отпуск.","caption":"На фотографиях из поездки потом можно искать только складку на боку и даже не заметить, как там смеешься.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хочется, напиши в комментариях, что у тебя чаще звучит перед зеркалом."},{"v":"живой","text":"Ой, а кто это у нас тут? Люди из трудных семей? Не знаете, как жить в этом ебанутом мире? Да перестаньте. С вами уже случилось самое страшное. Помните, когда было больно, а кричать нельзя? Вы это пережили маленьким ребенком. Вы все еще боитесь осуждения, когда начинаете проявляться. Так вас тогда отвергли, никто не был на вашей стороне. Боитесь, что если все станет хорошо, отношения, деньги, то случится что-то страшное и вас накажут. Поэтому выбираете трудности и тащите чужие проблемы. Напоминаю: тогда вы просто не могли убежать из дома. А сейчас можете. Эй, оглянитесь назад. Это все прошли вы. Выжили. Вы все можете. Просто устали.","caption":""}]},{"id":"r_body_1_2","topic":"ненавижу себя в зеркале перед отпуском","author":"Юлия","format":"reels_malysh","cards":[{"v":"h3h4","text":"Солнышко, ты перед отпуском смотришь в зеркало и прямо ненавидишь свой животик? Уже хочется отменить пляж. И еще ругаешь себя: ну почему я даже отдыху не могу порадоваться?\n\nПредставь, что внутри сидит строгий вахтер. Ты ему: «Я к морю». Он тебе: «С таким животом? Нельзя».\n\nОн очень боится, что тебя увидят и начнут обсуждать. Поэтому придирается первым. Все проверяет, все запрещает. Ему кажется: если оставить тебя дома, никто тебя не обидит.\n\nВот ты еще чемодан не собрала, а уже выслушала про себя столько гадостей. От себя же.","caption":"Перед отпуском даже привычный купальник вдруг хочется вернуть в магазин. Хотя еще месяц назад ты спокойно его носила.\nЯ Юлия, психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хочется поговорить об этом, ссылка на запись в шапке профиля."},{"v":"h6","text":"Милая, ты смотришь в зеркало перед отпуском и ненавидишь свой живот? Уже купила купальник, примерила, и все, ехать расхотелось. Еще и ругаешь себя: ну почему я такая, даже отпуск себе испортила.\n\nДавай я тебе кое-что скажу. Если ты привыкла, что все приятное надо заслужить, перед отдыхом внутри появляется строгая тетя. Сидит у входа на пляж и проверяет: животик убрала? Ножки красивые? Старалась вообще? И ты стоишь перед зеркалом, как перед этой тетей. Ждешь, когда разрешат.\n\nКонечно, тут хочется срочно себя переделать.\n\nТы уже решила, что именно из-за него тебе откажут в удовольствии.\n\nМожно ехать с этим животом. Даже если ты пока себе не нравишься.","caption":"Иногда особенно стыдно за отпускные фотографии: отдыхала, радовалась, а потом хочется все удалить.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хочется поговорить об этом, ссылка на запись на консультацию в шапке профиля."},{"v":"zh","text":"Мои хорошие, я сейчас к тем, кто перед отпуском смотрит на свой животик и начинает себя ругать. Опять недостаточно красивая для моря? Ох, малышка.\n\nБудто у зеркала сидит строгая тетя и решает, кого можно пустить на пляж. Тебя пока нельзя, сначала исправься.\n\nПочему ты ей веришь? Потому что столько раз слышала, как обсуждают чужие тела, что теперь заранее ждешь своей очереди. И сама себя ругаешь первой.\n\nСтрашно попасть на фотографию? Конечно. Ее ведь потом будут рассматривать. Хотя ты собиралась просто искупаться.\n\nПодожди. Ты уже работала, разбиралась с делами, уставала, организовала этот отпуск. А эта тетя еще и к твоему животу пристала!\n\nЯ бы ее с собой не брала. Даже если она уже уселась рядом.\n\nТы просто хотела отдохнуть.","caption":"Я особенно не люблю советы срочно привести себя в порядок перед поездкой. Будто покупка билетов запускает обязательную проверку внешности.\nЯ Юлия, психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"zhh7","text":"Моя хорошая, опять перед отпуском стоишь у зеркала и ругаешь животик?\n\nПочему именно сейчас так тяжело смотреть на себя? Потому что скоро тебя будут видеть. В купальнике, в коротком платье, сидящей, лежащей, с животом, который сидя складывается. И если ты привыкла ждать замечаний о своем теле, то перед поездкой зеркало становится такой строгой проверяющей тетей. Она смотрит и смотрит, и ей все мало.\n\nТы ей говоришь: я купальник купила. Она тебе: сначала похудей. Ты говоришь: я устала, мне бы полежать. Она тебе: с такими ногами? И ты уже сама продолжаешь этот разговор, хотя в комнате никого больше нет.\n\nУзнаешь?\n\nИ я сейчас не стану говорить, что тебе надо срочно понравиться себе. Представляю, как ты стоишь перед зеркалом, тебе плохо, а тут еще я со своим требованием полюбить каждую складочку. Спасибо большое, еще одно дело перед вылетом.\n\nПогоди. Ты уже работала, уставала, решала дела, дожила до этих свободных дней, собрала вещи. А теперь еще должна сдать живот на отлично? Серьезно? Проверяющая тетя совсем обнаглела.\n\nОно бывает очень убедительным. Особенно перед отпуском.\n\nТы уже устала себя проверять.","caption":"Иногда покупка купальника заканчивается обещанием больше ничего не есть сегодня. Я считаю важным говорить и об этой части подготовки к отпуску.\nЯ Юлия, психолог, работаю с девушками и женщинами от двадцати до сорока.\nЕсли хочешь прийти на консультацию, ссылка на запись в шапке профиля."},{"v":"h7","text":"Солнышко, ты смотришь в зеркало перед отпуском и прямо ненавидишь себя. Купальник давит, животик торчит, хочется все снять и вообще никуда не ехать.\n\nТы уже купила билет. А внутри как будто нужен еще один билетик, который тебе выдадут, когда ты станешь достаточно красивой.\n\nИ ты стоишь перед зеркалом и ждешь: ну что, мне уже можно? Или еще рано?\n\nОчень обидно, когда отпуск оплачен, чемодан открыт, до вылета три дня, а ты сама себе говоришь: тебя в таком виде туда пускать нельзя.\n\nВот ты примеряешь купальник. Поворачиваешься боком. Втягиваешь живот. Выдыхаешь, снова смотришь. Потом надеваешь рубашку сверху. Вроде получше. Потом думаешь, что в рубашке будет жарко. И уже представляешь, как будешь вставать с лежака, как будешь идти к воде, кто на тебя посмотрит. До моря ты еще даже не доехала, а сколько всего уже пришлось запретить себе прямо здесь, в комнате.\n\nМне хочется задержаться вот на этом «нельзя». Потому что оно очень жестокое. Ты собиралась отдыхать, и вдруг отдых становится чем-то, до чего еще надо дорасти. Заслужить. Доделать себя, и тогда уж ехать.\n\nТебе можно ехать в этом теле.","caption":"Иногда перед отпуском хочется отменить даже фотографии: «Сними лучше море, без меня». И потом в телефоне целая поездка, в которой тебя словно не было.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от двадцати до сорока.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля."}]},{"id":"r_teen_1","topic":"подросток закрылся в комнате и не разговаривает","author":"Михаил","format":"reels_rol","cards":[{"v":"zhh7","text":"Здравствуйте, я специалист по срочному извлечению разговоров из подростка. Закрылся в комнате и молчит? Поэтому стойте под дверью и напоминайте. Каждые несколько минут. Можно стучать.\n\nПереспросите.\n\nЯ вообще считаю, что у откровенности должен быть срок сдачи. Если родитель готов слушать сейчас, значит, сейчас и надо рассказывать. Через час у родителя сериал.\n\nЧто? Прекрасно.\n\nВот обычный вечер. Вы зовете ужинать, он отвечает из комнаты, что придет позже. Вы можете оставить ему еду, конечно, но мы с вами работаем на результат. Поэтому входите и сообщайте, что вся семья ждет.\n\nКстати, дверь он закрыл тихо или хлопнул? Тихо? Все равно подозрительно. Хлопнул? Тут уже можно обсуждать уважение. Очень полезное отступление, рекомендую. Когда первоначальная тема неизвестна, всегда можно поговорить о воспитании.\n\nТак, возвращаемся к контакту. В телефоне сидит? С другом переписывается? Значит, общаться способен. Немедленно спросите, почему другу можно написать, а вам нельзя ответить. Только сравнение произносите обиженно. Пусть к своему рассказу сразу приложит доказательства любви к вам.\n\nЕсли подросток совсем замолчал, скажите, что с вами он может говорить обо всем. Погромче.\n\nВсе, ваш план готов. Нет, ждать, пока он сам подойдет, в наш тариф не входит. Забирайте список вопросов, проходите домой. И дверь ему пока не давайте закрывать.","caption":"Иногда подростку проще написать из соседней комнаты: при личном разговоре каждую паузу уже заполняют вопросами.\nЯ Михаил, психолог, работаю с родителями подростков от двенадцати до семнадцати лет.\nЕсли знакомо, напишите в комментариях «дверь»."},{"v":"h7","text":"Подросток закрылся в комнате и не разговаривает? Уважаемые родители, подойдите к двери. Сейчас будем налаживать контакт.\n\nДля начала спокойно спросите: «Что случилось?» Если ответа нет, повторите громче. Возможно, подросток просто не понял, насколько спокойно вы спрашиваете. На третий раз можно добавить: «Я с тобой разговариваю!» Это такая специальная фраза, после которой человеку сразу хочется рассказать самое сокровенное.\n\nСказал: «Хочу побыть один»? Здесь важно проявить участие. Спросите: «От нас, что ли?» Пусть теперь займется вашим состоянием. Со своим он уже посидел, минут семь прошло.\n\nИ обязательно стойте у двери. А то отойдете, он решит, что просьбы иногда работают. Я считаю, ребенку важно понимать: если родитель пришел поддержать, уйти от поддержки уже нельзя.\n\nТак, вернемся к двери. Он молчит. Не уходите с пустыми руками. Попросите хотя бы открыть. Открыл? Теперь попросите посмотреть на вас. Посмотрел? Уберите эту физиономию, мы же нормально общаемся.\n\nИ вот наконец он говорит: «Все нормально». Тихо, ровно, даже улыбается. Поздравляю, нужный ответ получен. Можно идти ужинать.\n\nТолько завтра, когда снова спросите, как дела, обязательно предупредите: «Ты мне можешь все рассказывать». Дети любят понятные правила, поэтому сразу напомните и остальные: отвечать быстро, смотреть в глаза, обходиться без недовольства.\n\nА если действительно что-то случилось, пусть сначала успокоится. Мне еще его переживаний возле этой двери не хватало.","caption":"Иногда подростку проще написать вам из соседней комнаты, даже когда вы оба дома. Можно ответить там же, без требования выйти.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nЕсли знакомо, напишите в комментариях «дверь»."},{"v":"h6","text":"Подросток закрылся в комнате и не разговаривает? Уважаемые родители, сейчас научимся давать ему побыть одному. Подходим к двери. Стучим. Еще стучим. Вы же волнуетесь, пусть понимает.\n\nМолчит? Спрашиваем: «Ты на меня обиделся?» Теперь ему есть чем заняться: объяснить вам, что вы хороший родитель.\n\nГоворит «не знаю»? Помогаем: «Как можно не знать, что с тобой?» Пусть срочно разберется, вам же нужен ответ.\n\nРаздражается? Отлично, разговор пошел. Теперь можно обсудить еще и тон.\n\nПросит оставить его в покое? Тут важно рассказать, как вам больно это слышать. Подробно. Чтобы он сначала вас утешил.\n\nИ обязательно скажите: «Я же просто хочу помочь». Все, теперь ему еще и поблагодарить вас надо.\n\nОтдыхать от общения разрешаем только после разговора.","caption":"Когда на каждое «я устал» приходится объяснять, оправдываться и успокаивать родителя, даже короткий ответ становится отдельной работой.\nМожно сказать через дверь: «Ужин на кухне, если захочешь поговорить, я рядом» и дать паузу.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nЕсли хотите, напишите в комментариях свой вариант фразы через дверь."},{"v":"zh","text":"Служба поддержки родителей, здравствуйте. Я специалист по немедленной откровенности. Подросток закрылся в комнате? Отлично, начинайте разговор через дверь. Погромче, чтобы точно почувствовал вашу готовность слушать.\n\nПросит оставить его в покое? Да, ему сейчас тяжело даже разговаривать. Поэтому задайте сразу несколько вопросов, пусть выбирает.\n\nОтвечает одним словом? Прекрасно, силы на одно слово нашлись, требуйте остальные.\n\nНаписал вам сообщение из комнаты? Конечно, письменно ему легче. Но вы же в одной квартире! Пусть выйдет и скажет нормально.\n\nВы просто хотите узнать, что случилось? Тогда обязательно добавьте, сколько вы для него делаете. Откровенность прекрасно растет вместе с чувством долга.\n\nЯ гарантирую: скоро он начнет прислушиваться. К вашим шагам в коридоре.\n\nВсе, идите. Только без стука, вы же семья.","caption":"Разговор иногда начинается с сообщения «ужин на кухне, можешь взять позже». Ответ может прийти только вечером.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от двенадцати до семнадцати лет.\nЕсли хочется, напишите в комментариях свой способ предложить разговор без давления."},{"v":"h3h4","text":"Подросток закрылся в комнате и не разговаривает? Уважаемые родители, сейчас научимся вызывать его на откровенность. Сначала стучим: «Можешь мне все рассказать». Молчит? Добавляем: «Я с кем разговариваю?» Просит оставить его одного? Уточняем: «Что ты там скрываешь?» Тут важно стоять под дверью, чтобы человек чувствовал поддержку. Наконец сказал, что устал? Отлично, разговор пошел. Объясняем, кто в этой семье действительно устал. Сказал, что вы его не понимаете? Перечисляем все, что для него сделали. Только подробно, пусть проникнется. И обязательно в конце: «Почему ты мне ничего не рассказываешь?» Ответ ждем искренний. Правильный ответ я сейчас продиктую.","caption":"Можно сказать: «Я рядом, если понадоблюсь», и дать ему побыть одному.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nЕсли знакомо, напишите в комментариях «пауза»."}]},{"id":"r_teen_1_2","topic":"подросток закрылся в комнате и не разговаривает","author":"Михаил","format":"reels_spisok","cards":[{"v":"h6","text":"Четыре вещи, которые стоит понимать, если подросток закрылся в комнате и не разговаривает с вами.\nПервое. На простой вопрос ему бывает трудно ответить. «Как дела?» звучит коротко. Только дальше обычно идут оценки, уроки, планы.\nВторое. Переписываться с друзьями ему легче. Там можно отправить смешную картинку. И никто не скажет: «Раз настроение хорошее, давай обсудим учебу».\nТретье. Он выходит за чаем и стоит рядом. Но, пожалуйста, дайте ему допить этот чай без «ну наконец, рассказывай».\nЧетвертое. Он даже хорошее придерживает. Расскажешь про пятерку, услышишь: «Вот можешь ведь, если постараешься». Все, теперь придется соответствовать.\nПоверьте, трудно начать разговор, когда ты уже знаешь, чем он закончится.","caption":"«Можно я просто побуду рядом?» подростку тоже бывает трудно произнести. Поэтому он может молча устроиться на кухне, пока вы готовите.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разговоров."},{"v":"zh","text":"Пять признаков подро
