а нужно полностью загладить вину, и только потом можно помыть голову.\nЯ Ольга, психолог, работаю с мамами малышей до трех лет, в декрете.\nНапишите свой пункт в комментариях, если узнали себя."},{"v":"h3h4","text":"Четыре признака мамы, которая после злости на ребенка начинает себя наказывать.\nПервое. Вам стыдно просить помощи. Только что рявкнули, теперь сами укладывайте. Еще и отдыхать собрались? Какого хрена.\nВторое. Вы стараетесь срочно стать идеальной. Уже сил нет, но достаете краски: надо же перекрыть тот крик чем-нибудь хорошим.\nТретье. Вы молчите, когда обидно. Муж весь вечер в телефоне, а вы даже сказать боитесь. Сама сегодня орала, какие теперь претензии.\nЧетвертое. Вас бесит собственная усталость. Ребенок наконец уснул, вы легли и тут же: «Бедный малыш, еще и мать такая».\nСколько времени после крика вы еще живете без права на помощь?","caption":"Иногда даже рассказать мужу о тяжелом дне страшно: вдруг спросит, опять ли вы кричали. И весь разговор сведется к этому.\nМеня зовут Ольга, я психолог, работаю с мамами детей до трех лет, в декрете.\nЕсли хочется, добавьте в комментариях свой пункт."},{"v":"zhh7","text":"Пять признаков мамы, которая за злость на ребенка готова себя СОЖРАТЬ, и я хочу, чтобы вы узнали, как это выглядит после того, как вы уже успокоились.\n\nПервое.\n\nВторое. Вы отменяете себе отдых: собирались полежать, пока ребенок спит, но после своего крика идете мыть плиту, разбирать вещи, делать хоть что-нибудь полезное, потому что хорошая мама сейчас должна постараться, заслужить, исправить. И вот это меня бесит: блядь, вы уже устали до крика, и теперь в наказание у вас будет еще меньше сил, причем даже десять минут с закрытыми глазами кажутся какой-то наглостью.\n\nТретье.\n\nЧетвертое. Хорошее вы сразу обесцениваете: вечером ребенок забрался к вам на колени, вы вместе посмеялись, почитали, но в голове все равно только утренний срыв, будто целый день можно оценить по одному вашему голосу.\n\nПятое. Вы начинаете экономить на себе именно после срыва: крем закончился, кофе хочется, но рука закрывает корзину, потому что хреновая мать еще и деньги на себя тратит, прекрасно вообще.\n\nСколько пунктов узнали?","caption":"Даже извинение перед ребенком иногда продолжается внутри целый вечер: он уже занят своими делами, а вы все подбираете слова. Я бы хотела, чтобы об этой части материнского дня тоже можно было говорить вслух.\nЯ Ольга, психолог, работаю с мамами малышей до трех лет, в декрете.\nЕсли хочется, добавьте в комментариях свой пункт."},{"v":"zh","text":"Пять признаков мамы, которая злится на ребенка, а потом весь день себя за это грызет.\nПервое. Ребенок уже играет, а вы все еще стискиваете зубы и вспоминаете, каким голосом сказали ему отстать.\nВторое. Отменяете себе отдых. Хотели полежать, но после крика встаете мыть посуду: отдыхать сегодня как будто слишком нагло.\nТретье. Скрываете от мужа, что вам тяжело. Меня бесит, сколько мам остаются с этим одни: блядь, еще придется объяснять, как можно устать от собственного ребенка.\nЧетвертое. Ребенок обнимает вас, а вы думаете, что он такой ласковый, и вспоминаете, как утром на него наорали.\nПятое. На ребенка после срыва тратитесь легко, себе даже кофе купить жалко. Игрушку ему берете, свой стаканчик отменяете.\nСколько пунктов узнали?","caption":"Иногда после тяжелого дня вы рассказываете мужу только про свой крик. Про то, что с самого утра даже в туалет ходили с ребенком на руках, уже молчите.\nЯ Ольга, психолог, работаю с мамами малышей до трех лет, в том числе в декрете.\nЕсли хочется, напишите в комментариях свой пункт."}]},{"id":"r_mama_1_2","topic":"я злюсь на ребенка, а потом ненавижу себя за это","author":"Ольга","format":"reels_monolog","cards":[{"v":"zhh7","text":"Я называю самосудом вот это мамино: накричала на ребенка и теперь весь вечер доказываю себе, какая я хреновая мать.\n\nСамосуд это когда ребенок перед сном перевернул чашку, вы весь день с ним, вам еще вытирать пол, переодевать его, укладывать, и вы рявкнули: ну сколько можно! Он заплакал, вы обняли его, вытерли воду, нашли сухую пижаму. Но потом вы сидите рядом с кроваткой и смотрите на его щеку, на руку поверх одеяла, и думаете: как я вообще могла.\n\nЯ тут каждый раз хочу спросить: а куда вы собираетесь деть весь следующий день? С его недосыпом, прилипшей кашей, ребенком, который снова потянет за футболку, пока вы жуете. Вы ведь собираетесь прожить такой же день, только теперь еще запретили себе злиться. Блядь, какая тяжелая задача.\n\nМне важно это назвать, потому что со стороны у вас просто тихий вечер, ребенок уснул, мама сидит рядом.\n\nСамосуд это когда вы уже можете сказать ребенку: прости, я накричала. И говорите. А потом он засыпает, и вы продолжаете шепотом перечислять себе все обвинения, потому что в вашей голове хорошая мама должна мучиться достаточно долго. Сколько? До утра хватит?","caption":"Иногда после такого вечера даже сообщение подруге стирают, оставляя только «мы сегодня плохо спали».\nЯ Ольга, психолог, работаю с мамами малышей до трех лет, в декрете.\nЕсли хотите прийти на консультацию, пишите в директ слово «разбор»."},{"v":"h3h4","text":"«Я злюсь на ребенка, а потом ненавижу себя за это».\n\nВот он размазал йогурт по дивану. Вы рявкнули. Блядь, опять. Сели рядом, извинились, обняли. А внутри все еще: «Ну какая же я ужасная мать».\n\nИ вы начинаете: «Ты любишь маму? Иди ко мне. Ну обними».\n\nРебенок уже машинку катает, а вам нужна его улыбка. СРОЧНО. Потому что с ней можно наконец выдохнуть: он меня любит, значит, я еще хорошая.\n\nВ какой-то момент вы начинаете ждать, что ребенок успокоит вас после вашего же крика.\n\nА если он пока сердится на вас?","caption":"После извинения очень хочется сразу услышать: «Все хорошо». У малыша может еще дрожать губа, даже когда вы уже готовы обниматься.\n\nЯ Ольга, психолог, работаю с мамами малышей до трех лет.\nЕсли хотите поговорить на консультации, пишите в директ слово «разбор»."},{"v":"h6","text":"«Я накричала на ребенка и теперь ненавижу себя». Девочки, в этой ненависти можно застрять надолго. Даже когда сам крик длился пять секунд.\n\nВот он опять перевернул чашку. Вы вытираете лужу, он лезет туда руками. «Да сколько можно!» И ВСЕ, понеслось: «Я ужасная мать. Зачем вообще рожала». Блядь, уже и всю свою жизнь пересмотрели из-за этой чашки.\n\nРебенок через несколько минут несет вам машинку. А у вас внутри все еще та кухня, ваш голос, его испуганное лицо. Вы смотрите на него и снова вспоминаете, какая вы плохая.\n\nИ что, от этого легче вернуться к нему? Да куда там. Даже машинку взять трудно, когда в голове: «Как я могу сейчас играть, после того что сделала?»\n\nВы уже запрещаете себе следующую хорошую минуту с ним.","caption":"Бывает, даже его смех потом больно слышать: «Как он мне радуется, я же на него орала». И вы снова прокручиваете тот момент, хотя он зовет вас смотреть, как едет машинка.\n\nЯ Ольга, психолог, работаю с мамами малышей до трех лет, в декрете.\nЕсли хотите поговорить об этом на консультации, пишите в директ слово «разбор»."},{"v":"zh","text":"Я называю самосудом то, что вы устраиваете себе после крика на ребенка. И вы бы слышали, как жестоко вы с собой разговариваете.\n\nСамосуд это когда ребенок размазал кашу по столу, вы рявкнули, он заплакал, и вы уже забыли, как убирали эту кашу третий раз за утро. В голове осталось только его лицо. Блядь, зачем я так.\n\nСамосуд это когда вы его обняли, успокоили, он уже играет, а вы все еще прокручиваете свой голос и каждое слово. И что, легче стало? Нет. Теперь даже сесть с чаем как будто стыдно.\n\nСамосуд это когда вы обещаете себе больше никогда не злиться, и завтра любое раздражение уже пугает: опять начинается, я же обещала, почему я такая.\n\nСамосуд это когда вечером ребенок прижимается к вам, а вы вспоминаете утренний крик и думаете, что он просто маленький и еще не понимает, какая ему досталась мама.","caption":"Иногда после такого вечера даже сказать «я устала» трудно. Тут же хочется добавить: «Но это меня не оправдывает».\nМеня зовут Ольга, я психолог, работаю с мамами малышей до трех лет.\nЕсли хотите прийти на консультацию, пишите в директ слово «разбор»."},{"v":"h7","text":"«Я злюсь на ребенка, потом кричу, а потом ненавижу себя».\n\nВот обычный вечер. Вы укладываете ребенка. Он просит воды, потом другую игрушку, потом убрать эту игрушку. Вы уже полчаса хотите в туалет. На кухне остывает ваш ужин. Вы говорите тихо, еще раз тихо, потом сквозь зубы. И наконец: «Да ложись ты уже!»\n\nВсе. Теперь у вас внутри блядь какой суд.\n\nТам есть обвинение: «Ты взрослая, должна справляться». Есть доказательства: ребенок испугался, вы это видели. А про то, что вы весь вечер одна, что сменить вас некому, что вы даже поесть не успели, туда почему-то документы не принимают.\n\nЯ бы задержалась вот где: пока вы заняты тем, какая вы ужасная, вашу нагрузку можно оставить совершенно без внимания. Даже вам самой.\n\nИ завтра вечером снова будет остывать тарелка.\n\nВы можете очень подробно помнить каждое свое резкое слово и совершенно потерять из виду часы, в которые ваши обычные человеческие потребности все время откладывались.\n\nКрик имеет значение. Испуг ребенка имеет значение. И весь вечер до крика тоже имеет значение.\n\nЕсли мы обсуждаем только ваш голос, кто будет обсуждать вашу нагрузку?","caption":"После такого вечера еще можно полчаса читать про бережное воспитание. И лечь еще позже, чтобы завтра снова вставать к ребенку.\nЯ Ольга, психолог, работаю с мамами малышей до трех лет, в том числе в декрете.\nЕсли хотите прийти на консультацию, пишите в директ слово «разбор»."}]},{"id":"r_stud_1","topic":"не могу сесть за диплом, хотя времени почти нет","author":"Юлия","format":"reels_monolog","cards":[{"v":"h3h4","text":"«До сдачи диплома неделя, почему я опять не могу сесть и написать хоть страницу?»\n\nОткрываешь ноутбук, меняешь шрифт на титульном листе. Ну вот, уже полчаса дипломом занимаешься. Сам текст страшно трогать.\n\nПока ты ничего толком не написала, можно думать: я вообще способная, просто времени мало. А если постараешься, напишешь и получится средне? Вдруг решишь, что это и есть все, на что ты способна?\n\nПусть пока будет пустая страница. Зато еще можно представить, какой прекрасной она получится.\n\nКакую оценку себе ты боишься получить вместе с оценкой диплома?","caption":"Особенно тяжело, когда раньше учеба давалась легко. Сесть над трудной задачей бывает почти стыдно: как будто способная студентка должна сразу знать, что писать.\n\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nОтправь тому, у кого тоже горит диплом."},{"v":"zh","text":"Я называю это проверкой: ты садишься за диплом и чувствуешь, что сейчас выяснится, способна ли ты вообще написать что-то толковое.\n\nПроверка это когда ты открываешь файл, читаешь свой абзац, и он кажется таким глупым, что хочется закрыть ноутбук. Ну вот, столько училась, и что ты можешь? Через минуту ты уже в телефоне.\n\nПроверка это когда ты понимаешь, что боишься увидеть собственный текст, потому что по нему тут же начнешь оценивать всю себя. Кривая фраза, и ты уже бездарность.\n\nПроверка это когда ты ждешь, что завтра появится уверенность и ты наконец сядешь спокойно, и каждый вечер переносишь эту надежду на следующее утро. А срок все ближе.\n\nПроверка это когда ты снова выбираешь отложить, потому что пустой файл пока позволяет думать: я способная, просто еще не начала. И ты держишь его пустым, чтобы еще хотя бы сегодня этого про себя не выяснять.","caption":"В советах про диплом часто предлагают просто открыть файл. Я бы еще спросила, какую оценку себе ты готовишь за первый же абзац.\nЯ Юлия, психолог, работаю со студентами.\nСохрани, если сейчас тоже зависаешь над дипломом."},{"v":"h6","text":"«До сдачи диплома две недели, а я даже файл открыть не могу». И ведь ты понимаешь, что каждый день будет только тяжелее. Ну сядь уже, напиши хоть что-нибудь. Ты себе это сколько раз говорила?\n\nОткрываешь ноутбук. Читаешь требования, меняешь шрифт на титульном листе. Потом телефон. Прошел час, текста все еще нет.\n\nЕсть одна неприятная штука: пока диплом существует у тебя в голове, он может получиться отличным. Ты еще можешь написать его так, чтобы научрук удивился. А первые страницы уже можно прочитать и сказать: слабовато.\n\nИ вот тут откладывание дает тебе запасное объяснение: «Я просто поздно начала. Было бы больше времени, я бы показала, на что способна».\n\nМожно даже злиться на себя за лень и одновременно держаться за это объяснение. Потому что мысль «я старалась, и получилось средне» слишком больно бьет по тому, какой ты привыкла себя считать.\n\nПросто вместе с дипломом будто сдаешь на проверку всю себя.\n\nКогда диплом стал экзаменом на то, чего ты вообще стоишь?","caption":"Особенно тяжело бывает отправить научруку сырой кусок текста. Хочется, чтобы он сразу увидел ту работу, которую ты пока только представляешь.\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nОтправь тому, у кого диплом тоже завис."},{"v":"h7","text":"«До сдачи диплома две недели, а я опять весь день собираюсь за него сесть».\n\nТы открываешь ноутбук, находишь файл. Там название, содержание, полторы страницы введения. Смотришь на них и думаешь: ну это вообще что? Надо сначала нормально разобраться в теме. И идешь искать еще одну статью. Потом еще одну. К вечеру у тебя двенадцать вкладок, усталость и ощущение, что дипломом ты сегодня занималась. Только в самом дипломе все те же полторы страницы.\n\nА потом ты пишешь абзац. И он какой-то обычный. Слова повторяются. Мысль путается. Ты хотела сказать умнее, но получилось вот так. И сразу хочется закрыть файл. Ну правда, зачем сидеть и смотреть на собственное разочарование?\n\nЯ думаю, это особенно тяжело, когда ты привыкла держаться за мысль: если я действительно постараюсь, у меня получится очень хорошо. И диплом вдруг требует ее проверить. Прямо здесь, в документе, где каждое предложение видно.\n\nИ чем он ближе, тем труднее открыть файл: теперь в нем должен случиться почти подвиг.\n\nТы боишься, что, когда наконец постараешься, сказать «я просто еще не взялась» уже не получится?","caption":"Даже название файла «финальная версия» иногда давит еще до первой написанной страницы. Как будто черновику уже назначили защиту.\n\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nОтправь тому, у кого сейчас тоже открыт пустой файл диплома."},{"v":"zhh7","text":"Я называю это отсрочкой: ты откладываешь диплом и еще на один вечер сохраняешь возможность написать его хорошо. Я считаю, тут очень легко себя обмануть, потому что снаружи все выглядит как обычное нежелание работать.\n\nОтсрочка это когда ты открываешь документ, видишь заголовок, под ним пустое место, и сразу хочется еще почитать, уточнить тему, посмотреть, как вообще люди пишут введение. Ты ведь собираешься писать, правда собираешься, только сначала надо разобраться. И вот ты уже читаешь чужой диплом, потом другой, и у всех там такие уверенные формулировки, а у тебя пока даже первое предложение какое-то глупое. Лучше его удалить. Завтра начнешь нормально, сегодня уже все равно поздно.\n\nОтсрочка это когда ты признаешь, что тебе страшно увидеть, как ты пишешь сейчас. И появляется неприятный вопрос: вдруг я вообще хуже разбираюсь в своей теме, чем мне хотелось думать?\n\nОтсрочка это когда ты снова выбираешь пока ничего не писать, и на несколько минут действительно становится легче, потому что сегодня ты еще не увидишь следующую неудачную фразу. Срок уже совсем близко, тебе стыдно за потерянный день, ты ругаешь себя, и все равно пустой документ кажется безопаснее написанного. Ты закрываешь его и обещаешь себе завтра доказать, что можешь.","caption":"Со списком литературы бывает проще: там хотя бы понятно, где поставить точку. А собственную мысль можно переписывать бесконечно.\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nОтправь тому, кто тоже застрял с дипломом."}]},{"id":"r_stud_1_2","topic":"не могу сесть за диплом, хотя времени почти нет","author":"Юлия","format":"reels_scenka","cards":[{"v":"живой","text":"А (до психологии): Да пошел он нахер, мудила.\nА (после психологии): Слушай, я думаю, это проявление его избегающей привязанности. Я же тебе рассказывала, у него была холодная мать. Он проецирует на меня ее образ и боится открыться, показать нежность. Вдруг я узнаю его слабые места и в ссоре ткну туда иголкой.\nА (после психологии, помолчав): Да пошел он нахер, мудила.","caption":""},{"v":"h7","text":"А: Не могу сесть за диплом, хотя времени почти нет. Открываю ноутбук, смотрю на документ и ухожу делать чай.\nБ: Что ты ждешь от себя, когда открываешь документ?\nА: Что наконец соберусь и напишу нормально.\nБ: А если начало получится так себе?\nА: Я его сотру, конечно. Зачем оставлять ерунду? Мне потом самой стыдно будет это читать.\nБ: И что тогда ты скажешь себе про себя?\nА: Что я зря считала себя способной.\nБ: Пока страницы пустые, это еще можно не проверять.\nА: Там сразу придется выбирать слова, путаться, замечать, что целый кусок мне непонятен.\nБ: Откладывая текст, ты откладываешь эту встречу с собой.\nА: Но я же каждый вечер себя ругаю.\nБ: Ленивая, зато способная. Такой еще можно себе казаться.\nА: То есть я могу ругать себя за лень и все еще верить, что написала бы прекрасно?\nБ: Да, именно.","caption":"К пустому документу легко предъявлять огромные требования: он пока ни одному из них не противоречит. Мне как психологу особенно интересен этот момент, когда даже собственный черновик кажется опасно кому-то показывать.\nМеня зовут Юлия, я психолог, работаю со студентами.\nПодписывайся, если хочется еще такого: здесь про учебу, отношения и то, как мы с собой обходимся."},{"v":"h6","text":"А: Не могу сесть за диплом, хотя времени почти нет.\nБ: Что мешает открыть файл?\nА: Открываю. Читаю требования. Закрываю. Уже саму себя достала.\nБ: Представь, что написала. Что дальше?\nА: Его прочитают. Вдруг скажут, что это какая-то ерунда?\nБ: И что тогда?\nА: Значит, я столько училась и все равно ничего не умею.\nБ: А если напишешь в последний момент?\nА: Ну, там понятно. Я торопилась, какой уж тут хороший диплом.\nБ: Тогда виноват будет дедлайн.\nА: Но я правда могу лучше, если нормально сяду!\nБ: И пока это никто не проверил.\nА: Получается, я оставляю себе «могла бы», пока ничего не написала?\nБ: Да.","caption":"Даже попросить научрука посмотреть сырой абзац бывает страшно. Он обсуждает текст, а ты уже слышишь оценку всего, чему училась.\nЯ Юлия, психолог, работаю со студентами от восемнадцати до двадцати трех.\nПодписывайся, если хочется еще такого: здесь про учебу, тревогу и отношения."},{"v":"zhh7","text":"Б: Я думаю, тебе страшнее написать плохой диплом, чем опоздать.\nА: Подожди, я вообще хочу его написать и забыть.\nБ: А если сядешь, чего боишься?\nА: Вот вчера открыла введение, прочитала свой абзац и закрыла. Там такая ерунда, что мне даже научной руководительнице отправлять стыдно. Она ведь сразу все поймет.\nБ: Что именно она поймет?\nА: Что я вообще ничего не понимаю в своей теме.\nБ: Пока файл закрыт, это можно не проверять.\nА: Ну прекрасно. Получается, я специально себе все порчу?\nБ: Как ты объяснишь себе плохой результат?\nА: Что времени было мало.\nБ: А если времени хватало и ты старалась?\nА: Тогда придется признать, что я старалась и все равно получилось плохо. А пока откладываю, могу думать, что написала бы хорошо, если бы села раньше. Так проще объяснить себе плохой результат.\nБ: Да.","caption":"Я с осторожностью отношусь к совету «просто убери телефон». Иногда телефон уже лежит в другой комнате, а файл все равно закрыт.\nЯ Юлия, психолог, работаю со студентами.\nПодписывайся, если хочется еще такого: здесь про учебу, тревогу и отношения."},{"v":"h3h4","text":"А: Не могу сесть за диплом, времени почти нет.\nБ: Что мешает начать?\nА: Вдруг напишу ерунду? Я же должна в этом разбираться.\nБ: И если ерунду?\nА: Значит, зря училась. Все поймут, что я ничего не умею.\nБ: Прямо по черновику?\nА: Ну да. Хотя черновик никто пока не увидит.\nБ: Ты его увидишь.\nА: Да. Пока ничего нет, я еще могу написать хорошо.\nБ: Можно оставаться способной.\nА: Ага. Просто способной, которая никак не соберется. Знакомая история.\nБ: Так меньше страшно?\nА: Получается, я откладываю момент, когда сама себя назову тупой.\nБ: Да.","caption":"Можно полвечера выбирать шрифт для титульного листа: диплом открыт, работа вроде идет. До собственных мыслей на странице так и не дошла.\nЯ Юлия, психолог, работаю со студентами.\nПодписывайся, если хочется еще такого: здесь про учебу, тревогу и отношения."},{"v":"zh","text":"Б: Диплом тяжело начать, когда черновик должен подтвердить, что ты умная.\nА: Мне просто нужно собраться. Сдавать скоро, я опять выбираю шрифт.\nБ: А если сесть и написать как получится?\nА: Получится ерунда. Другие уже главы отправляют, я даже начать не могу.\nБ: И что эта ерунда будет говорить о тебе?\nА: Что я ничего не понимаю. Зря вообще поступила.\nБ: Даже если это первый черновик?\nА: Ну я же должна хоть что-то уметь к выпуску.\nБ: Пока текста нет, что ты про себя думаешь?\nА: Что могла бы нормально написать, если бы наконец собралась.\nБ: Эту надежду страшно проверить?\nА: Получается, пока откладываю, могу верить, что у меня получится хорошо.\nБ: Да.","caption":"Пустой файл с названием «Диплом_финал» уже звучит требовательно.\nЯ Юлия, психолог, работаю со студентами.\nПодписывайся, если хочется еще такого: здесь про тревогу, учебу и отношения."}]},{"id":"r_gnezdo_1","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","author":"Михаил","format":"reels_poslanie","cards":[{"v":"zhh7","text":"Это для тех, кто после отъезда детей просыпается и думает: ну и зачем мне теперь вставать, мои дорогие специалисты по чужим завтракам и потерянным носкам.\n\nВы столько лет хотели спокойно выпить чай, и вот чай можно пить спокойно. А вам почему-то плохо.\n\nВот вы стоите на кухне, открываете холодильник и по привычке прикидываете, что приготовить побольше. Потом вспоминаете: сегодня хватит совсем немного. Закрываете холодильник. И вдруг садитесь. Даже есть расхотелось.\n\nЯ бы здесь очень осторожно относился к бодрым предложениям наконец заняться собой. Да подождите вы с этим «наконец». Человек еще к тишине за стеной привыкает, а ему уже предлагают записаться куда-нибудь и радоваться свободе.\n\nКстати, вы ведь могли сами помогать с переездом, выбирать билеты, складывать вещи. Уговаривать ребенка ехать, потому что там работа или учеба лучше. И теперь особенно стыдно признаться, что хочется обратно того самого вечера, когда все дома. Вы же сами были за.\n\nБыли. И сейчас за. Только скучаете.\n\nУ вас сегодня слезы от того, что любимая чашка стоит чистая уже несколько дней.\n\nВы по ним скучаете. Очень.","caption":"Отдельно я бы оставил место для обиды: дети могут редко звонить, а родителю бывает стыдно даже признать, что он ждет звонка. Взрослость детей этого ожидания сама по себе не отменяет.\nЯ Михаил, психолог, работаю с женщинами и мужчинами от сорока пяти до шестидесяти.\nЕсли хочется, напишите в комментариях, чего вам сейчас не хватает дома."},{"v":"zh","text":"Хочу сказать тем, у кого дети уехали, а утром хоть обратно под одеяло: мои дорогие, домашний штаб остался без привычной работы. И вы еще себя за это ругаете?\n\nПочему вставать незачем? Раньше утро само давало ответ: кого разбудить, кого накормить, кому напомнить про ключи.\n\nЗа детей рады, а самим тоскливо? Конечно.\n\nПроверяете телефон, хотя обещали себе не дергать? Хочется хоть ненадолго снова оказаться внутри их дня.\n\nПодождите. Да вы столько лет вынесли с этими завтраками, тревогами, ночными ожиданиями, целую диспетчерскую на себе держали! А теперь тишина, и никто даже смену не принял.\n\nВот и растерялись.","caption":"Особенно странно бывает в магазине: рука тянется за тем, что любил ребенок, а дома это теперь некому есть.\nЯ Михаил, психолог, работаю с женщинами и мужчинами от 45 до 60 лет.\nЕсли хочется, напишите в комментариях, чего вам сейчас не хватает дома."},{"v":"h3h4","text":"Это для тех, у кого дети выросли и уехали, а утром появилась мысль: «И зачем теперь вставать?» Вы ведь ждали, когда можно будет выспаться, спокойно выпить чай. И вот тишина. Даже чай какой-то невкусный. Потом еще себя ругаете: дети устроились, все нормально, чего мне опять надо? Давайте так, годами у вашего утра был готовый ответ: кого разбудить, накормить, куда проводить. Вы открывали глаза и уже знали, зачем встаете. Теперь этот ответ исчез. А вопрос о себе остался, и с непривычки на него трудно ответить.","caption":"Иногда особенно больно от их «У нас все хорошо»: можно выдохнуть, а привычного разговора о том, чем помочь, уже нет. И вы еще держите телефон в руке.\nМеня зовут Михаил, я психолог, работаю с людьми от 45 до 60 лет.\nЕсли хочется, напишите в комментариях, чего вам сейчас не хватает."},{"v":"h7","text":"Это для тех, у кого дети выросли и уехали, и теперь утром лежишь с мыслью: «Ради чего вставать?» И тут же себя ругаешь: дети устроились, все нормально, чего мне еще надо? Послушайте, вы скучаете еще и по тому, как начинался ваш день. Столько лет еще до завтрака было понятно, кому вы сегодня нужны и что надо сделать. Даже подумать о себе толком не успевали. А теперь можно спокойно выпить чай. Можно. Только сесть с этой чашкой почему-то тяжело. Я считаю, мы слишком быстро требуем от себя радоваться свободному времени. Ваша привычная жизнь закончилась, и вы по ней скучаете. Даже если очень рады за детей. Тут радость вполне уживается с пустотой.","caption":"Бывает, что тяжелее всего слышать: «Ну теперь поживете для себя!» Как будто вы давно составили план и только ждали свободной квартиры.\nМеня зовут Михаил, я психолог, работаю с людьми от 45 до 60 лет.\nЕсли знакомо, напишите в комментариях одно слово: «утро»."},{"v":"h6","text":"Это для тех, у кого дети выросли и уехали, а утром вы лежите и думаете: «И зачем теперь вставать?» И вам стыдно. Дети самостоятельные, все вроде получилось. Надо радоваться. Послушайте, вместе с детьми из дома исчезло множество готовых ответов на вопрос «что мне сейчас делать». Разбудить, приготовить, дождаться. Вы годами вставали, и день уже был кем-то занят. А теперь проснулись, и каждое дело нужно еще зачем-то выбрать. Даже завтрак. Тут еще и себя ругать за то, что свобода пока совсем не радует? Вы можете скучать даже по вечному «что у нас поесть?». Да, по этому тоже.","caption":"Чашку для себя можно достать сразу, а кастрюлю по привычке взять на всю семью.\nМеня зовут Михаил, я психолог, работаю с женщинами и мужчинами от 45 до 60 лет.\nЕсли хочется, напишите в комментариях, по какой домашней мелочи вы скучаете."}]},{"id":"r_gnezdo_1_2","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","author":"Михаил","format":"reels_malysh","cards":[{"v":"zh","text":"Мои хорошие, а если быть «слабым», когда дети выросли и уехали, вполне нормально? Утром вы лежите под одеялом и ругаете себя: надо радоваться за них, а мне так грустно. Ваш домик стал тихим. Вы столько лет просыпались, потому что кому-то пора вставать, кому-то нужен завтрак. Теперь к этой тишине еще надо привыкнуть.\n\nСлабый человек тот, кто сидит за завтраком чуть дольше, потому что ему хочется услышать знакомый голос, а ему говорят: «Ну хватит уже раскисать».\n\nСлабый человек тот, кто просит детей иногда звонить, потому что ему тоже нужно тепло, а ему говорят: «Дай им спокойно жить».\n\nСлабый человек тот, кто признается, что пока не знает, чем заполнить свое утро, и хочет немного времени, а ему говорят: «Займись уже чем-нибудь».\n\nГде здесь слабость? Разве скучать запрещено?","caption":"Я бы не торопил человека искать увлечение сразу после прощания.\nМеня зовут Михаил, я психолог, работаю с женщинами и мужчинами от сорока пяти до шестидесяти лет.\nЕсли хочется поговорить об этом на консультации, напишите мне в личные сообщения."},{"v":"h3h4","text":"Дорогие мои, дети выросли и уехали, а вы утром лежите и думаете: зачем вставать? И еще ругаете себя: ну что я совсем раскис.\n\nПредставьте календарик. Много лет в каждой клеточке было понятно: ребенка разбудить, накормить, вечером дождаться. Даже когда уставали, было ясно, для чего начинается день.\n\nА теперь клеточки пустые. И от этой пустоты бывает страшно. Получается, вы скучаете еще и по тому, как легко находился ответ на вопрос: что мне сегодня делать?\n\nСвои желания столько лет вписывали куда поместятся. Теперь для них целый день. Сразу и не сообразишь, чего хочется.","caption":"Даже долгожданная тишина в доме может оказаться тяжелой. Можно радоваться самостоятельности детей и хотеть, чтобы они еще немного пожили рядом.\nЯ Михаил, психолог, работаю с женщинами и мужчинами от 45 до 60 лет.\nПодписывайтесь, если хочется еще таких разговоров."},{"v":"h7","text":"Дети выросли и уехали, а вы, дорогие мои, просыпаетесь и не знаете, зачем теперь вставать. Вот прямо лежите и думаете: ну встану. Ну чай налью. И дальше что?\n\nЗнаете, у вас много лет был такой внутренний календарик. В нем каждый день было понятно, для чего вы нужны. Все равно было понятно: завтра надо разбудить, накормить, спросить, как прошло, дождаться.\n\nИ вот дети уехали. Календарик остался. Вы утром в него заглядываете привычным движением, а там пустая страница. И следующая тоже пока пустая.\n\nЯ вот к этому «наконец-то» отношусь осторожно. У человека целая привычная жизнь закончилась. Ему бы немного места для грусти. А ему уже предлагают радоваться свободе.\n\nВот обычное утречко. Вы идете на кухню и по привычке думаете, что приготовить. Кто что любит, кто опять уйдет без завтрака. На секунду все как раньше. Потом вспоминаете: сегодня здесь завтракаете только вы. И стоите перед открытым холодильником. Есть вроде хочется. Решать, что приготовить себе, почему-то тяжело.\n\nБез обвинений себя в том, что мешаете детям взрослеть.\n\nВам тоже нужно время привыкнуть к их взрослению.","caption":"Иногда тяжелее всего становится после хорошего звонка: поговорили, порадовались за детей, положили телефон, и дома снова тихо. Такую грусть бывает особенно стыдно кому-то показать.\n\nМеня зовут Михаил, я психолог, работаю с женщинами и мужчинами от 45 до 60 лет.\nЕсли хочется об этом поговорить, напишите мне в личные сообщения, договоримся о консультации."},{"v":"h6","text":"Дорогие мои, дети выросли и уехали, а вы лежите утром и думаете: зачем теперь вставать? И еще ругаете себя: ну что я, маленький, что ли, радоваться надо.\n\nСмотрите, у вас внутри много лет звенел колокольчик. Вставайте, вас ждут. Завтрак нужен. Рубашку найти. Выслушать перед выходом: «Я туда больше не пойду!»\n\nВы могли ужасно уставать от этого звона. А теперь тихо. И от этой тишины грустно, даже страшно.\n\nПотому что вместе с детьми уехало привычное ощущение: мое утро кому-то нужно. Каждый день вам об этом напоминали, иногда прямо из соседней комнаты.\n\nТеперь колокольчик молчит, и вы уже решили, что стали бесполезными. Вот так быстро себя списали.","caption":"Особенно больно бывает, когда дети звонят довольные, а после разговора хочется плакать. За них можно радоваться и одновременно скучать по своей жизни рядом с ними.\nМеня зовут Михаил, я психолог, работаю с женщинами и мужчинами от 45 до 60 лет.\nПодписывайтесь, если хочется еще таких разговоров."},{"v":"zhh7","text":"Дорогие мои, я хочу спросить: а что если побыть «эгоистом», когда дети выросли и уехали, совершенно нормально?\n\nВот обычная история: взрослый ребенок звонит вечером, рассказывает про работу, потом говорит, что побежал, его ждут. Вы кладете телефон и еще сидите с ним в руке.\n\nИ стоит появиться желанию потратить время или деньги на себя, тут же находится внутренний голос: ну вот, стали эгоистом. Как будто собственное желание обязательно должно пройти проверку, достаточно ли оно полезно семье. Я считаю такую проверку жестокой. Человек и так потерял привычный смысл утра, а ему еще стыдно искать собственный.\n\nЭтот «эгоист» тот, кто готовит себе любимый завтрак, хотя больше никто его не ест, и слышит: «Для себя одной столько возни, зачем?»\n\nЭтот «эгоист» тот, кто тратит часть денег на поездку, о которой давно думал, и слышит: «Лучше бы детям отдали, им сейчас нужнее».\n\nЭтот «эгоист» тот, кто записывается туда, где ему интересно, и однажды пропускает привычный вечерний звонок, потому что занят, и слышит: «Ну вот, теперь у вас своя жизнь, до нас дела нет».\n\nЧто здесь эгоистичного? Кому вы этим вредите?","caption":"Даже привычка покупать слишком много хлеба может напоминать, сколько людей раньше было дома. Такие мелочи порой задевают сильнее самого прощания.\nМеня зовут Михаил, я психолог, работаю с женщинами и мужчинами в середине жизни.\nЕсли хотите поговорить об этом на консультации, напишите мне в личные сообщения."}]},{"id":"r_razvod_1","topic":"«ради детей надо сохранить семью»","author":"Ольга","format":"reels_rol","cards":[{"v":"h3h4","text":"Ради детей сохраняем семью, даже если дома все друг друга ненавидят. Я подготовила инструкцию. Ругаетесь на кухне? Закрывайте дверь. Ребенок все слышит? Включайте ему мультики погромче. Спрашивает, почему папа обзывает маму? Объясните: папа устал. Вы тоже устали? Ну вы же взрослая, потерпите. Блядь, у нас тут сохранение семьи, соберитесь. Так, ребенок просит вас развестись. Это он маленький, ничего не понимает. Обязательно скажите, что живете вместе ради НЕГО. Пусть знает, сколько стоит его счастливое детство. Итак, мама терпит, папа продолжает, ребенок чувствует себя виноватым. Все на месте. Семья сохранена.","caption":"«Я ради тебя осталась» ребенку потом тоже придется как-то переварить. Даже если вы сказали это всего один раз.\nЯ Ольга, психолог, работаю с женщинами 30-45, которые думают о разводе или уже развелись.\nОтправьте той, кому сейчас нужно это услышать."},{"v":"h7","text":"Вы думаете о разводе, но вам говорят, что ради детей надо сохранить семью? Проходите, сейчас объясню, как правильно. Садитесь. Только дверь прикройте, чтобы дети ничего не услышали. У нас тут все ради них.\n\nПервое.\n\nТеперь давайте обычный вечер разберем. Допустим, вы приготовили ужин. Муж пришел, посмотрел в тарелку, сказал: «Опять эта херня». Ребенок сидит рядом. Ваши действия? Правильно, улыбнуться. Можно сказать: «Папа устал». Очень удобная фраза, девочки, запишите.\n\nПоэтому плакать идем в ванную. Воду включили, дверь закрыли. Если ребенок стучит, говорим: «Я моюсь». Моетесь второй час? Ну, тщательно моетесь. Имеете право.\n\nТеперь главное. При ребенке обязательно скажите: «Мы с папой вместе ради тебя». Пусть знает, сколько для него делается. А то ходит счастливый, просит велосипед, вообще не в курсе стоимости своего детства.\n\nБлядь, простите, это я на ваш вопрос про мужа. Конечно, можно и его попросить что-нибудь сделать. Только аккуратно. Нам сейчас еще его недовольства не хватало. Вы же пришли семью сохранять.\n\nТак. Покрепче. Чтобы потом никто не сказал, что вы мало старались. Подпись поставьте: «Наше счастье». Комментарии лучше закрыть, люди любят лезть в чужую семью.\n\nВсе, инструктаж окончен. За сохранность брака назначаем ответственного. Сколько вашему ребенку? Семь? Подходит.","caption":"После слов «мы вместе ради тебя» ребенку бывает страшно даже попроситься ночевать к другу. Вдруг без него родители разойдутся?\nЯ Ольга, психолог, работаю с женщинами 30-45 лет, которые думают о разводе или уже развелись.\nОтправьте тому, кому сейчас нужно это услышать."},{"v":"h6","text":"Вы собираетесь разводиться, но у вас дети? Проходите, я как раз веду собрание. Семью сохраняем ради ребенка. Обязательно сообщите ему, ради кого вы остались. Пусть знает, сколько стоит его счастливое детство. Муж бесит? Смотрите на ребенка. Вот причина, по которой вы все это терпите. Очень сближает. Поругались на кухне? Утром сидим с каменными лицами. Ребенок сам догадается, кого сегодня можно обнять, чтобы второй родитель не обиделся. Охренеть, какая чуткость растет. Захочет к бабушке на выходные? Напомните: мама ради тебя ВСЕ, а ты маму одну оставишь? Так, вопрос с заднего ряда. Кто отвечает за этот брак? Конечно, взрослые. Ребенок просто должен быть достаточно счастливым, чтобы мы не зря мучились.","caption":"Фраза «мы живем вместе ради тебя» может превратить обычное детское недовольство в неблагодарность. Даже пожаловаться на свой день становится неловко.\nЯ Ольга, психолог, работаю с женщинами от 30 до 45, которые думают о разводе или уже развелись.\nОтправьте тому, кому сейчас нужно это услышать."},{"v":"zh","text":"Здравствуйте, я ваша классная руководительница. Разводиться собрались? Ради детей семью надо сохранить, я всегда это говорю. Очень хороший совет, всем подходит. Так, дома постоянно ругаетесь? Ну, дверь на кухню закрывайте. Ребенок слышит? Телевизор погромче, господи, все приходится подсказывать. Муж с вами месяцами не разговаривает? Прекрасно, значит, тихо. Уже наладили обстановку. Ребенок просит вас разойтись? Что он понимает, у него даже по математике тройка. Вы главное объясните, что терпите ради него. Пусть знает, сколько мама для него делает. Блядь, опять плачете. На выпускной сможете вместе прийти? Вот, значит, семья функционирует. Я же говорила, все решаемо. Все, идите, сохраняйте. И ребенка предупредите, чтобы в сочинении про семью написал, как вы летом на дачу ездили. Кухню туда не надо.","caption":"Иногда ребенок ждет папину командировку, потому что дома наконец можно спокойно делать уроки. Про это обычно молчат, когда рассказывают, как важно жить вместе.\nЯ Ольга, психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nОтправьте тому, кому сейчас это нужно."},{"v":"zhh7","text":"Так, мамы, здравствуйте. Я сегодня проведу собрание о сохранении семьи ради детей. Папы прийти не смогли, поэтому за сохранение семьи отвечаете вы. Очень удобно, сразу все ответственные на месте.\n\nТак.\n\nМуж с вами неделями не разговаривает? Прекрасно, дома тихо. При ребенке обзывает? Ну, значит, разговаривает, контакт есть. Вы уж определитесь, что вам надо, а то мужчина старается, и все мимо.\n\nЯ сама сторонница индивидуального подхода. Каждой маме индивидуально объясняю, что она должна потерпеть.\n\nВот, допустим, обычный вечер. Вы пришли с работы, приготовили ужин, ребенок делает домашку, муж сидит в телефоне. Вы просите его помочь с математикой, он говорит, что вы его достали. Ребенок поднимает голову, смотрит на вас, потом тихонько закрывает тетрадь.\n\nИ вот тут очень важно улыбнуться. Прямо зубами. Чтобы ребенок понял: у нас все хорошо, мама улыбается, папа дома, математику временно отменяем.\n\nТолько без выяснения отношений, пожалуйста. Дети все чувствуют. Поэтому чувствуйте потише. Обиделись, пошли в ванную, включили воду, поплакали, вышли с огурцами. Я имею в виду нарезку к ужину. У нас тут все практично, я херни не посоветую.\n\nБлядь, опять вы про развод. Мы столько труда вложили, чтобы вы научились сохранять семью без участия второго взрослого.\n\nТак, все, собрание окончено. Идите домой, сохраняйте. Мужу передайте, что от него ничего не требуется.","caption":"Ребенок может скучать по папе и одновременно спокойно засыпать дома, где больше никто не кричит.\nЯ Ольга, психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nОтправьте тому, кому сейчас нужно это услышать."}]},{"id":"r_razvod_1_2","topic":"«ради детей надо сохранить семью»","author":"Ольга","format":"reels_monolog","cards":[{"v":"h3h4","text":"«Ради детей надо сохранить семью», слышите вы, когда говорите о разводе. Любой ценой? Блядь, ребенку уже выставили счет.\n\nВот вы остались. Муж опять вас унизил, вы промолчали. Вечером он играет с сыном, сын хохочет. И вы думаете: «Ну вот, ради этого и терплю».\n\nА завтра сын грустит, огрызается. И хочется сказать: «Я ради тебя столько вынесла, а ты...»\n\nСлышите? Ему уже надо быть счастливым, чтобы ваши мучения имели смысл.\n\nРешение о браке принимаете вы, взрослые. А ребенок теперь еще и ОБЯЗАН показать, что оно того стоило?","caption":"«Я с твоим отцом только ради тебя» может вылететь в ссоре. И ребенок потом боится сказать, что ему дома тоже плохо.\nЯ Ольга, психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nПодписывайтесь, если хочется еще таких разговоров о разводе, детях и чувстве вины."},{"v":"zhh7","text":"Я против этого «ради детей надо сохранить семью», когда женщине предлагают терпеть что угодно, лишь бы папа продолжал жить дома.\n\nНужен. Согласна.\n\nИз того, что ребенку нужны оба родителя, почему-то делают вывод, что женщина обязана сохранить брак. Любой ценой. И цену эту очень удобно оставить за кадром.\n\nВот вы сидите вечером за столом. Муж с вами со вчерашнего дня не разговаривает. Ребенок просит передать картошку, вы тянетесь за миской, муж отодвигает руку. Мелочь, да? Сцену никто не устроил, тарелки целы. Только ребенок уже смотрит по очереди на вас обоих и решает, можно ли сейчас рассказать, что произошло в школе. Или лучше поесть побыстрее.\n\nСемья сохранена. Все дома.\n\nИ вы сидите, жуете эту картошку и думаете: зато у него есть папа.\n\nБлядь, сколько всего можно сложить в это «ради него».\n\nИ когда вам говорят, что вы обязаны сохранить семью, вам заодно предлагают отвечать за поведение двух взрослых. Охренеть задача.\n\nОна уже думает о последствиях, о жилье, о разговорах с детьми.\n\nА если вы уже давно пытаетесь сохранить детям хоть какой-то спокойный вечер?","caption":"Иногда ребенок первым спрашивает, почему родители разговаривают только через него. Формально все еще живут вместе, и эту подробность в советах про сохранение семьи обычно пропускают.\nЯ Ольга, психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nПодписывайтесь, если хочется еще таких разговоров о браке, разводе и чувстве вины."},{"v":"zh","text":"Я против этого «ради детей надо сохранить семью», когда женщине предлагают терпеть все подряд.\n\nСейчас мне скажут: ну конечно, психологам лишь бы всех развести, а детям нужен отец! Да, детям нужен отец. У него после развода вполне остается возможность быть отцом.\n\nНо вот вы сидите за ужином, муж опять проходится по вам, вы молчите, чтобы при ребенке не началось, и ребенок тоже молчит, даже сок боится попросить. Зато семья сохранена. Блять, галочку поставили.\n\nЧто именно мы сохранили для ребенка в этом ужине? Он уже участвует во всем этом: подбирает момент, следит за лицами, старается никого не рассердить. Даже если вы ни разу при нем не кричали.\n\nРазвод сам по себе спокойствия не гарантирует. Вам все равно придется договариваться, решать бытовые вопросы, отвечать за свои слова и поступки рядом с ребенком. У отца остается своя часть ответственности. Ее тоже нельзя целиком повесить на вас.\n\nА если вы думаете о разводе именно потому, что вам важно, как живут ваши дети?","caption":"«Папа сегодня в хорошем настроении?» иногда становится первым вопросом ребенка, когда он возвращается домой. Я бы такую подробность из разговора о сохранении семьи не вычеркивала.\nЯ Ольга, психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nПодписывайтесь, если хочется еще таких разговоров: здесь про отношения, развод и чувство вины."},{"v":"h7","text":"«Ради детей надо сохранить семью». Особенно удобно говорить это женщине, которая уже думает о разводе, потому что в этой семье ей давно хреново. Сказали, и теперь ей еще доказывать, что она хорошая мать. Прекрасно устроились.\n\nЯ с этой фразой спорю вот почему. В ней очень быстро исчезает второй взрослый. Сначала речь вроде бы про семью, про детей, про общее будущее. А через минуту уже обсуждают только вас. Вы должны потерпеть. Вы должны подобрать слова. Вы должны подумать о последствиях. Муж в это время вообще где?\n\nВот представьте обычный вечер. Вы просите его посидеть с ребенком, пока закончите работу. Он отвечает: «Ты же знаешь, я устал». Вы тоже устали. Начинается знакомый разговор, ребенок сидит рядом, вы замолкаете, чтобы при нем опять не ругаться. Потом доделываете все ночью.\n\nА когда говорите, что так жить больше не хотите, слышите: «Ты собираешься разрушить семью? Подумай о ребенке».\n\nИ вот тут меня бесит. Сука, как ловко вся семья оказалась у вас в руках именно в ту минуту, когда вы собрались уходить. До этого ваша просьба была обычным бытовым нытьем, можно было отмахнуться. Теперь ваше решение вдруг определяет судьбу всех.\n\nПонимаете, что происходит? Его отказ участвовать остается маленьким эпизодом: ну устал человек. Ваше желание выйти из этой жизни становится огромным событием: мать разрушает семью.\n\nЯ сейчас даже немного в сторону уйду. Меня цепляет само слово «сохранить». Как будто семья уже лежит перед вами готовая, хорошая, осталось аккуратно ее донести. Только вы почему тогда каждую ночь доделываете все одна? Что именно вам предлагают сохранить в таком виде? И сколько вашего молчания для этого понадобится?\n\nЛадно, вернусь. Дети действительно зависят от решений взрослых. У развода есть последствия, с которыми придется считаться. Но фраза «ради детей» часто выдает женщине ответственность сразу за ДВОИХ. За собственные решения и за то, захочет ли муж вообще что-нибудь менять.\n\nА его желание вы каким способом должны обеспечить? Еще понятнее объяснить? Подождать подходящего настроения? Вы уже подождали, ребенок за это время успел подрасти.\n\nВы можете отвечать за то, как разговариваете с ребенком, какие договоренности предлагаете, что делаете сами. У его отца тоже есть своя часть. Она остается его частью даже тогда, когда он обижается, устает или считает, что все нормально.\n\nСамо ваше присутствие в квартире эту часть за него не выполняет.\n\nПочему сохранение семьи начинается с требования к вам остаться, а его участие можно обсуждать потом?","caption":"Иногда «потом поговорим» длится так долго, что ребенок уже сам умеет разогревать ужин. А разговор все еще ждет удобного момента.\nМеня зовут Ольга, я психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nПодписывайтесь, если хочется еще таких разговоров: здесь про отношения, развод и жизнь после него."},{"v":"h6","text":"«Ради детей надо сохранить семью». И вот вы опять думаете: уйду, значит, детям жизнь испорчу. Останусь, значит, хорошая мать.\n\nМеня в этом совете бесит одна вещь: детям потом приходится оправдывать ваше решение остаться.\n\nВы весь вечер с мужем сквозь зубы разговаривали. Ребенок принес двойку, нагрубил. И вас накрывает: «Я ради тебя все это терплю. Ты хотя бы учись нормально!»\n\nБлядь, ему теперь еще и учиться надо так, чтобы мамины мучения имели смысл.\n\nРешение о браке принадлежит взрослым. Сколько пятерок должен принести ребенок, чтобы вы наконец почувствовали, что терпели не зря?","caption":"Даже если «я ради тебя терплю» остается в голове, детское недовольство может бесить сильнее: вам самой столько приходится проглатывать.\nМеня зовут Ольга, я психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nПодписывайтесь, если хочется еще таких разговоров: здесь про брак, развод и чувство вины."}]},{"id":"r_pereezd_1","topic":"переехала в другой город и за год ни с кем не подружилась","author":"Юлия","format":"reels_spisok","cards":[{"v":"zhh7","text":"Пять признаков одиночества после переезда, которое слишком легко списать на занятость. А предложить кому-нибудь встретиться вечером все еще некому. Я считаю, это заслуживает внимания даже при хорошей работе и прекрасной квартире.\nПервое. Ты замечаешь, как давно тебя никто не обнимал. С мамой поговорила, подруге голосовое отправила, на работе весь день отвечала людям, но вечером хочется просто к кому-нибудь прислониться.\nВторое. Особенно неприятен момент, когда занятие закончилось, ты вышла на улицу, и дальше опять целый вечер. Купить кофе можно. Посидеть с кем-то за этим кофе сложнее.\nТретье. С коллегой легко обсуждать отпуск, с соседкой можно поболтать у лифта, а написать ей в субботу кажется уже какой-то навязчивостью. Меня цепляет, как быстро здесь появляется мысль: у всех уже есть друзья, куда я лезу.\nЧетвертое. Хорошая новость особенно остро напоминает, что рядом никого нет. Но ужинать сегодня опять будешь одна, и это почему-то чувствуется сильнее именно в удачный день.\nПятое. Ты открываешь билеты раньше, чем афишу. Потому что там можно написать: я приеду, увидимся?\nСколько у тебя совпало?","caption":"Иногда самым трудным оказывается указать человека, которому можно оставить запасные ключи. Вроде маленький вопрос, а ответить некому.\nЯ Юлия, психолог, работаю с людьми 25-35 лет, которые обживаются после переезда.\nЕсли хочется, добавь в комментариях свой пункт."},{"v":"zh","text":"Пять примет одиночества после переезда, которые я бы не списывала на взрослую жизнь и занятость.\nПервое. От голосового старой подруги у тебя ком в горле. Переслушиваешь, хотя она просто рассказывает, как сходила в магазин.\nВторое. Ты заранее забиваешь выходные делами: продукты, уборка, забрать заказ. Свободный вечер еще надо как-то пережить.\nТретье. Ты боишься позвать коллегу на кофе, потому что вдруг навязываешься. Мне обидно, сколько встреч отменяется еще до приглашения.\nЧетвертое. Хорошая новость заставляет тебя зависнуть над списком контактов. Хочется рассказать кому-то, кто потом спросит, как все прошло.\nПятое. Тебе жалко денег на кафе в одиночку, но ты легко доплачиваешь за доставку, чтобы вечером кто-нибудь позвонил в дверь. Хотя бы курьер.\nСколько у тебя совпало?","caption":"Старым друзьям тоже бывает трудно сказать, что здесь ты все еще одна. Особенно когда весь год отправляла им фотографии красивых улиц.\nЯ Юлия, психолог, работаю с людьми после переезда, которым сейчас от двадцати пяти до тридцати пяти.\nЕсли хочется, добавь в комментариях свой пункт."},{"v":"h6","text":"Четыре знакомые вещи для тех, кто переехал год назад и так ни с кем не подружился.\nПервое. Тебя утомляют разговоры о себе. Коллеге надо объяснять, где ты жила, кем работала. Господи, можно сразу к той части, где мы уже друг друга знаем?\nВторое. После встречи ты выносишь вердикт: «Не мои люди». Были паузы, шутили невпопад. Со старой подругой можно молчать час, и ты вообще об этом не думаешь.\nТретье. Свободный вечер целиком уходит на звонок домой. Там тебя понимают с полуслова. А здесь опять рассказывать сначала.\nЧетвертое. Ты тоже прячешь самое интересное. С новой знакомой говоришь про работу и погоду, свои странные истории придерживаешь. Потом идешь домой: «С ней я какая-то скучная».\nА сколько она успела узнать о тебе?","caption":"Иногда новой знакомой достается только вежливая версия тебя, хотя старые друзья любят тебя как раз за все остальные.\nЯ Юлия, психолог, работаю с теми, кто после переезда привыкает к новой жизни.\nЕсли узнала себя, напиши в комментариях свой пункт."},{"v":"h7","text":"Четыре признака, что ты переехала, за год ни с кем не подружилась и уже устала знакомиться. Сразу.\nПервое. Рассказывать о себе стало скучно. Ну сколько можно, я же целый человек, у меня еще много, много всякого есть.\nВторое. Ты быстро решаешь, что человек тебе не подходит. Встретились на кофе, поговорили про работу, аренду, погоду. Пришла домой: «Вообще ничего общего». А со старой подругой можно сорок минут обсуждать, кто что ел, и тебе хорошо. Я бы тут задержалась.\nТретье. Все самое живое ты оставляешь для старых друзей. Новым знакомым достается: «Да нормально, работаю, потихоньку осваиваюсь». А потом звонишь подруге в другом городе и наконец говоришь своим голосом. Злишься, перебиваешь, смеешься над какой-то ерундой.\nЧетвертое. После приятной встречи тебе бывает особенно одиноко. А дома хочется плакать. И так хочется, чтобы хоть кто-нибудь сказал: «Ты чего сегодня такая тихая?» Сам заметил. Я считаю, по этому тоже очень скучают после переезда.\nТы скучаешь по друзьям или по себе рядом с ними?","caption":"У старых друзей даже твое «ладно» бывает с историей. Новый знакомый пока слышит только слово.\nЯ Юлия, психолог, работаю с людьми 25-35 лет, которые переехали и обживаются на новом месте.\nЕсли хочется, добавь в комментариях свой пункт."},{"v":"h3h4","text":"Четыре признака у тех, кто за год после переезда так и не нашел друзей.\nПервое. Ты готовишься к обычной встрече как к собеседованию. Даже историю про выходные выбираешь: эта скучная, тут я выгляжу глупо. Давайте так, с тобой кофе пьют. Тебя сейчас никто на работу не принимает.\nВторое. Тебе трудно предложить просто погулять. Надо найти выставку, классное место, еще что-нибудь. Иначе зачем человеку тратить на тебя вечер?\nТретье. Ты скрываешь мелкие трудности. Коллеге говоришь, что уже освоилась, хотя вчера расплакалась в автобусе. Хочется сначала стать человеком, с которым легко.\nЧетвертое. Когда встречу отменяют, тебе даже легче. Фух, сегодня можно никого не впечатлять.","caption":"Дружба часто начинается с разговора, в котором ты ничего интересного не сказала.\nЯ Юлия, психолог, работаю с людьми от 25 до 35, которые переехали.\nЕсли узнала себя, напиши свой пункт в комментариях."}]},{"id":"r_pereezd_1_2","topic":"переехала в другой город и за год ни с кем не подружилась","author":"Юлия","format":"reels_monolog","cards":[{"v":"h7","text":"Ты переехала в другой город, прошел год, и тебе до сих пор некому написать: «Слушай, выйдем кофе выпить?»\n\nВот, допустим, коллега позвала тебя на день рождения. Ты пришла, принесла подарок, села.\n\nА ты вдруг сама себе кажешься какой-то плоской. Работаю. Иногда хожу в зал. Люблю гулять. Все? Это вся я?\n\nИ ведь у тебя есть что рассказать. Просто у каждой истории такой длинный вход. Чтобы объяснить, почему ты засмеялась, надо сначала рассказать про бывшую работу, потом про подругу, потом про то, какую фразу она однажды сказала. Ты уже открыла рот и думаешь: господи, сейчас придется полчаса объяснять, кто все эти люди. Ладно. И спрашиваешь у соседки, где она купила платье.\n\nПотом едешь домой: «Ну, нормально посидели». И внутри пусто. Еще один вечер, после которого подруга почему-то не появилась.\n\nЯ бы вот здесь задержалась. Потому что ты можешь очень скучать по тому, какой ты была рядом со своими.\n\nТы говоришь: «Я здесь ни с кем не подружилась». А по кому ты скучаешь сильнее: по подруге или по себе рядом с ней?","caption":"Со старыми друзьями даже слово «опять» экономит полчаса объяснений. После переезда вдруг замечаешь, сколько общей жизни помещалось в одном слове.\nМеня зовут Юлия, я психолог, работаю с теми, кто после переезда заново обживается и ищет своих.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"zh","text":"Я называю это одиночеством, когда ты уже год живешь в новом городе, знаешь, где купить хороший хлеб, и все равно гулять в субботу идешь одна.\n\nОдиночество это когда ты открываешь переписку с подругой из прежнего города, хочешь позвать ее на кофе и тут же вспоминаешь, сколько теперь между вами ехать. Ну вот. Опять забыла.\n\nОдиночество это когда ты говоришь, что тебе и одной хорошо, и правда спокойно пьешь кофе, идешь куда хочешь, только смешную вывеску фотографируешь, чтобы хоть кому-нибудь отправить.\n\nОдиночество это когда ты уже перестаешь ждать, что коллега сама предложит встретиться после работы, и выбираешь снова написать первой, и полчаса переделываешь простое приглашение погулять, чтобы звучало как-нибудь безразличнее.\n\nОдиночество это когда мама спрашивает, как ты устроилась, и ты рассказываешь про квартиру, работу, удобный автобус, потому что сказать, что тебе здесь даже некому предложить зайти в гости, почему-то стыдно.","caption":"Иногда весь список мест, куда хочется сходить, так и лежит в заметках. Одно кафе ты уже успела вычеркнуть: оно закрылось.\nЯ Юлия, психолог, работаю с теми, кто после переезда пытается обжиться.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"h6","text":"«Я переехала год назад и так ни с кем не подружилась». И ведь ты выходишь из дома, общаешься. Вот сходила с новой знакомой на кофе. Она приятная, поговорили нормально. Возвращаешься домой и думаешь: ну, опять просто поболтали.\n\nА со старой подругой можно созвониться, полчаса обсуждать какую-то ерунду и чувствовать, что вы близкие.\n\nСо старой подругой у тебя уже есть целая жизнь. Она знает, почему ты замолчала, как ты шутишь, про кого говоришь «ну, этот». С новой знакомой приходится рассказывать себя с начала. Где работала, почему уехала, кто у тебя остался там. Устаешь уже на вопросе «расскажи о себе».\n\nИ вот этой усталостью ты иногда меряешь встречу: если так тяжело, значит, своего человека опять не нашла.\n\nТы приходишь знакомиться, а внутри ждешь, что тебя уже узнают.","caption":"Даже любимая история о себе может надоесть, когда рассказываешь ее пятый раз за месяц. Иногда так хочется, чтобы человек напротив просто сказал: «Да, помню».\n\nЯ Юлия, психолог, работаю с теми, кому 25-35 и кто обживается после переезда.\nЕсли хочется поговорить на консультации, ссылка на запись в шапке профиля."},{"v":"h3h4","text":"«Я год живу в новом городе и ни с кем не подружилась». А знакомиться ты пробовала. Вот с коллегой сходили на кофе, посмеялись. На следующий день она сама тебе ничего не написала. И ты уже думаешь: ну понятно, ей со мной было скучно. Второй раз звать как-то унизительно, да?\n\nТы приходишь знакомиться и сразу проверяешь, нужна ли ты. Написала первой? Почему опять я? Не позвали на выходных? Все, я лишняя.\n\nИ ты отходишь. Вы еще только кофе выпили, а ты уже пережила конец дружбы.","caption":"Особенно обидно, когда дома были люди, которым можно было написать просто «пойдем?». Здесь даже приглашение на кофе сочиняешь полчаса.\nЯ Юлия, психолог, работаю с теми, кто в 25-35 переехал и привыкает к новой жизни.\nЕсли хочется об этом поговорить, ссылка на запись на консультацию в шапке профиля."},{"v":"zhh7","text":"Я называю это ожиданием: ты уже год живешь в новом городе, знаешь, где купить хлеб вечером, и все еще ждешь, когда здесь появится человек, которому можно просто написать: пойдем погуляем.\n\nВот в это кафе хочется с кем-то зайти, сесть у окна, долго выбирать, потом попробовать из чужой чашки, потому что чужое почему-то всегда интереснее. И чтобы человек уже знал, что ты будешь долго выбирать. Ну вот такую мелочь знал. Я думаю, именно по этим мелочам особенно скучаешь после переезда.\n\nСначала надо было разобрать коробки, потом освоиться на работе, потом пережить зиму, и ты вполне искренне думала, что к весне уже будет с кем посидеть у окна. А теперь снова осень. Ты заходишь в то кафе, узнаешь девушку за стойкой, она узнает тебя, и ты даже радуешься этому, а потом садишься за столик и опять пишешь подруге в другой город.\n\nОжидание, это когда ты уже перестала ждать, что подруга вдруг окажется рядом, и понимаешь, что кафе само тебя ни с кем не познакомит, и все равно перед выходом проверяешь телефон. Вдруг сегодня кто-нибудь напишет тебе: я рядом, ты дома?","caption":"В новом городе даже спонтанная встреча часто требует переписки, календаря и нескольких переносов. Я бы оставила в этом календаре место и для тоски по прежней легкости.\nМеня зовут Юлия, я психолог, работаю с людьми, которые переехали и заново обживаются.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля."}]},{"id":"r_dengi_1","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","author":"Михаил","format":"reels_monolog","cards":[{"v":"h3h4","text":"«Зарабатываю нормально, но все время боюсь, что денег не хватит».\n\nЗарплата пришла, счета оплачены, на накопления отложили. Садитесь вечером, открываете приложение банка и опять считаете: а если уволят? А если машина сломается?\n\nИ вроде все сходится. Можно выдохнуть. Но вы уже думаете: расслаблюсь, перестану шевелиться, вот тогда точно останусь без денег.\n\nБоялся, работал, деньги пришли. Значит, страх помог. Ну как его теперь отпустить, если вы ему каждый месяц приписываете свои результаты?\n\nВы сами работали, договаривались, решали задачи. А в конце месяца внутри опять: «Хорошо, что я переживал. Иначе бы ничего этого не было».","caption":"Даже отпуск тогда приходится оправдывать: «Отдохну, чтобы потом лучше работать».\nЯ Михаил, психолог, работаю с мужчинами от 30 до 45 лет.\nОтправьте тому, кто даже после зарплаты переживает о деньгах."},{"v":"zh","text":"Перепроверка. Я считаю ее ловушкой, если вы нормально зарабатываете, но снова и снова открываете приложение банка, чтобы убедиться, что денег хватит.\n\nПерепроверка это когда вы вечером смотрите на остаток, прикидываете платежи, на все хватает, и вы наконец откладываете телефон. Можно ужинать.\n\nПерепроверка это когда через несколько минут появляется мысль: вдруг я что-то упустил? И вы опять берете телефон, хотя с деньгами за это время ничего не произошло. Просто спокойствие закончилось.\n\nНу сколько можно считать один и тот же остаток?\n\nПерепроверка это когда вы все равно выбираете еще раз посмотреть, потому что это быстро снимает тревогу, и постепенно привыкаете: чтобы спокойно поужинать, сначала надо проверить счет. Деньги на ужин у вас есть. Спокойно сесть за стол без проверки уже трудно.","caption":"Я бы еще спросил, в какой момент вы открываете приложение. Иногда рука тянется к телефону сразу после разговора о сокращениях, даже если речь шла о чужой работе.\n\nЯ Михаил, психолог, работаю с мужчинами от тридцати до сорока пяти.\nСохраните, если узнали свои вечера."},{"v":"h7","text":"«Я нормально зарабатываю, но все время боюсь, что денег не хватит». Зарплата пришла, обязательные платежи вы уже посчитали, на жизнь остается. И все равно вечером вы открываете приложение банка. Просто проверить.\n\nПосмотрели на остаток. Выдохнули. Закрыли. Через час опять хочется посмотреть.\n\nДопустим, сидите вечером дома, выбираете, что заказать на ужин. Видите сумму и ловите себя на мысли: дороговато. Открываете банк. Там хватает и на ужин, и на все, что вы запланировали до следующей зарплаты. Заказываете. Пока ждете доставку, еще раз заходите в приложение. Проверяете списание. Остаток. Ну, теперь все понятно.\n\nИ что, вопрос с деньгами на сегодня закрыт? На несколько минут, да. Потом возникает: а вдруг завтра какая-нибудь трата? И рука опять тянется к телефону. Ужин еще не приехал, а вы уже несколько раз убедились, что можете его оплатить.\n\nЯ считаю, здесь есть очень неприятная ловушка. Только каждый такой выдох после проверки приучает вас успокаиваться именно этим способом. И следующую тревогу уже хочется решать знакомым движением: открыть, посмотреть, закрыть.\n\nСколько еще раз нужно увидеть те же деньги, чтобы поверить, что они у вас есть?","caption":"У банковского приложения нет ответа на вопрос «а вдруг завтра». Даже когда все расходы до зарплаты уже посчитаны.\nЯ Михаил, психолог, работаю с мужчинами от 30 до 45 лет.\nОтправьте тому, кому сейчас это знакомо."},{"v":"h6","text":"«Зарплата нормальная, а я все равно боюсь, что денег не хватит». Знакомо? Деньги пришли, вы открыли приложение банка. Сумма приличная. Но уже через минуту в голове: ипотека, машина, ребенку понадобятся деньги, родители стареют. И все, сумма кажется маленькой.\n\nПосмотрите, что вы сейчас с ней сделали. Вы мысленно выставили себе счет за несколько лет вперед. И оплачивать его собираетесь из того, что есть на карте сегодня. Какая зарплата выдержит такой счет?\n\nПричем будущие расходы вы учитываете охотно. Даже те, которые пока только возможны. А будущие зарплаты в этот расчет почему-то не попали.\n\nВот поэтому прибавка может радовать совсем недолго. К ней быстро добавляется еще один будущий расход, и снова мало.\n\nА почему в ваших подсчетах машина точно потребует ремонта через три года, а вы следующую зарплату уже не получите?","caption":"Особенно убедительно звучат суммы с пометкой «на всякий случай». У них даже даты нет, но место в бюджете они уже заняли.\nЯ Михаил, психолог, работаю с мужчинами от 30 до 45 лет.\nОтправьте тому, кому это сейчас знакомо."},{"v":"zhh7","text":"Я называю это вечной нехваткой: вы нормально зарабатываете, деньги на счете есть, и все равно вечером открываете приложение банка с мыслью, что надо бы еще подкопить. Я считаю, с этим стоит разобраться, потому что так можно годами увеличивать доход и каждый месяц чувствовать себя человеком, которому вот совсем чуть чуть осталось до финансовой беды.\n\nВечная нехватка это когда вы смотрите на свой счет, видите сумму, которой еще недавно были бы очень довольны, и сразу начинаете считать, на сколько месяцев ее хватит, если завтра исчезнет работа. Посчитали. Вроде хватает надолго. Но ведь работу можно искать дольше, и цены растут, и вообще кто знает, что будет. И сумма уже выглядит какой то скромной.\n\nВечная нехватка это когда вы вспоминаете, как сами себе обещали: вот накоплю столько, тогда выдохну. Вы накопили, открыли приложение, посмотрели, даже порадовались, и буквально через минуту решили, что лучше бы иметь вдвое больше. Ну, для надежности.\n\nВечная нехватка это когда вы наконец накопили ровно столько, сколько сами считали достаточным, сидите вечером с телефоном в руке и уже объясняете себе, почему теперь этого мало.","caption":"Когда доход нестабильный и есть обязательные платежи, вопрос о запасе вполне конкретный. Я бы отдельно смотрел на то, как часто меняется ваша собственная сумма «мне хватит».\nМеня зовут Михаил, я психолог, работаю с мужчинами от 30 до 45 лет.\nСохраните, если хотите вернуться к этой мысли."}]},{"id":"r_dengi_1_2","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","author":"Михаил","format":"reels_scenka","cards":[{"v":"h6","text":"А: Зарабатываю нормально, но постоянно боюсь, что денег не хватит.\nБ: И что вы делаете?\nА: Открываю приложение банка. Смотрю остаток. Вроде хватает, можно выдохнуть.\nБ: Надолго?\nА: Пока приложение открыто. Потом думаю: вдруг я что-то упустил?\nБ: И проверяете снова?\nА: Конечно. Мне нужно убедиться, что все под контролем.\nБ: Проверка успокаивает. Ненадолго.\nА: Ну да. Поэтому я и проверяю, когда опять страшно.\nБ: И учитесь успокаиваться только после проверки.\nА: Получается, без приложения я уже собственному расчету не верю?\nБ: Даже когда деньги есть.\nА: Я уже остаток помню. Открываю, чтобы снова стало спокойно.\nБ: Вот именно.","caption":"Особенно легко зависнуть в этих проверках вечером: лежите в кровати, приложение закрыли, телефон пока держите в руке.\nЯ Михаил, психолог, работаю с мужчинами от тридцати до сорока пяти.\nПодписывайтесь, если хочется еще такого: здесь говорю о мужской тревоге, работе и отношениях."},{"v":"zh","text":"Б: Проверка счета ради спокойствия может сделать вас тревожнее.\nА: Я нормально зарабатываю, откладываю, но сегодня опять полез проверять остаток.\nБ: Полегчало?\nА: Да. Потом снова открыл приложение. Вдруг что-то упустил.\nБ: Со счетом что-то случилось?\nА: Ничего. Другие вообще без накоплений живут, и ничего, спят спокойно.\nБ: Вы привыкли успокаиваться через проверку.\nА: И что, перестать смотреть? Вдруг денег правда уже мало?\nБ: Вы только что смотрели.\nА: Да знаю я. Но все равно страшно.\nБ: И чего сейчас хочется?\nА: Опять проверить. Получается, я уже без проверки успокоиться не могу?\nБ: Именно.","caption":"Приложение банка можно открыть уже в кровати, когда все покупки оплачены и никаких платежей сегодня больше нет.\nМеня зовут Михаил, я психолог, работаю со взрослыми мужчинами.\nПодписывайтесь, если хочется еще такого: здесь говорю о мужской тревоге и требованиях к себе."},{"v":"zhh7","text":"Б: Я считаю, постоянная проверка счета может подкармливать страх безденежья.\nА: Подождите, я нормально зарабатываю, у меня даже отложено. Но постоянно думаю, вдруг денег не хватит.\nБ: Посмотрели. Стало спокойнее?\nА: Да, конечно. Вот сегодня после магазина открыл, посмотрел остаток, вроде нормально. Закрыл. Потом сел обедать и снова полез проверять.\nБ: Значит, спокойствие уже прошло.\nА: А я могу себе позволить и все равно потом проверяю, сколько осталось.\nБ: И каждый раз проверка ненадолго успокаивает.\nА: Там сумма больше, я ее только что видел, и все равно открываю еще раз.\nБ: Так закрепляется привычка успокаиваться проверкой.\nА: То есть я привыкаю каждый раз лезть в приложение? А если перестану смотреть, мне станет еще тревожнее. Буду сидеть над обедом и думать, вдруг я что-то упустил.\nБ: Потому что вы привыкли получать спокойствие именно так.\nА: Поэтому мне снова хочется посмотреть, даже когда я уже знаю остаток и денег хватает.\nБ: Да.","caption":"У банковского приложения удобная особенность: оно всегда под рукой. Даже пока остывает обед.\n\nЯ Михаил, психолог, работаю с мужчинами от тридцати до сорока пяти.\nПодписывайтесь, если хочется еще такого: здесь говорю о тревоге, работе и отношениях."},{"v":"живой","text":"А (критик): Как же я себя ненавижу. Ничего не достигла, сижу на работе и даже сосредоточиться не могу. Какая я жалкая. Все коллеги нормально живут, семьи, улыбаются, а я...\nБ: Так, стоп. О чем мы говорили на сессии? Самокритика.\nА: Ну допустим.\nБ: Критик долбит, чтобы я была продуктивной. Работает?\nА: Нет. Сил вообще нет.\nБ: Хорошее в голове сейчас не найду, это понятно. Тогда просто встану, подышу воздухом пять минут.\nА: Может, поможет.\nБ: Как же сложно.","caption":""},{"v":"h7","text":"А: Зарабатываю нормально, но постоянно боюсь, что денег не хватит. А я опять открываю приложение банка.\nБ: И становится спокойнее?\nА: Да. Смотрю на остаток, вроде выдыхаю. Потом думаю: так, подождите, с карты же еще что-то списывалось. Надо посмотреть, сколько там точно осталось.\nБ: Получается, спокойствие держится до следующего сомнения.\nА: Деньги сами себя считать не будут.\nБ: Остаток вы уже знаете. Что даст еще одна проверка?\nА: Ну... я успокоюсь. Бывает, открываю приложение, еще пока загружается, уже легче. Даже смешно сейчас это говорить. Получается, мне достаточно туда зайти?\nБ: Уже само действие обещает вам облегчение.\nА: Но я ведь ничего плохого не делаю, просто смотрю.\nБ: Я бы обратил внимание на связку: страшно, проверил, отпустило.\nА: И могу наконец спокойно слушать дальше.\nБ: Без нее снова страшно.\nА: Я все жду, когда денег будет достаточно, чтобы перестать туда лазить. А привычка успокаиваться через приложение остается?\nБ: Да. Сумма меняется, привычка остается.","caption":"Банковское приложение всегда под рукой. Можно даже не заметить, как проверка счета становится таким же привычным движением, как проверка сообщений.\nМеня зовут Михаил, я психолог, работаю с мужчинами от тридцати до сорока пяти.\nПодписывайтесь, если хочется еще такого. Здесь говорю о мужской тревоге, работе и отношениях."},{"v":"h3h4","text":"А: Зарабатываю нормально, но постоянно боюсь, что денег не хватит.\nБ: Что делаете, когда страшно?\nА: Открываю приложение банка. Проверяю, сколько осталось.\nБ: И отпускает?\nА: Да. Потом опять лезу проверять. Деньги ведь на месте.\nБ: А спокойствие уже кончилось.\nА: Ну и что плохого? Я же просто проверяю.\nБ: Вы привыкаете успокаиваться только проверкой.\nА: Получается, без приложения я уже себе не верю?\nБ: Вам снова нужно подтверждение.\nА: Деньги лежат. А я опять иду убеждаться, что выживу.\nБ: Именно.","caption":"Телефон всегда под рукой, поэтому проверка легко помещается между двумя рабочими сообщениями. Со стороны ее вообще никто не замечает.\nМеня зовут Михаил, я психолог, работаю с мужчинами от тридцати до сорока пяти.\nПодписывайтесь, если хочется еще таких разговоров: здесь про тревогу, деньги и отношения."}]}];const V=["h3h4","h6","h7","h8","zh","zhh7","живой"];const KEY='psycont_compare_2026-10-02_05-18';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const app=document.getElementById('app');
T.forEach((t,ti)=>{const sec=document.createElement('section');
sec.innerHTML='<h2>'+(ti+1)+'. '+esc(t.topic)+'</h2><div class="n">'+esc(t.author)+' · '+esc(t.format)+'</div>';
const g=document.createElement('div');g.className='grid';
t.cards.forEach((c,ci)=>{const k=t.id+'#'+ci;const d=document.createElement('div');d.className='c';
d.innerHTML='<div class="who">'+esc(c.v)+'</div><div class="t">'+esc(c.text)+'</div>'+(c.caption?'<div class="cap">'+esc(c.caption)+'</div>':'')+
'<div class="row"><button data-a="live">Живой</button><button data-a="pub" class="okb">Так можно публиковать</button><button data-a="ai" class="badb">Нейросеть</button></div>';
const paint=()=>{const s=S[k]||{};d.querySelectorAll('button').forEach(b=>{const a=b.dataset.a;const on=a==='pub'?!!s.pub:s.lab===a;b.classList.toggle('on',on);b.classList.toggle('ok',a==='pub');b.classList.toggle('bad',a==='ai')})};
d.querySelectorAll('button').forEach(b=>b.onclick=()=>{const s=S[k]||(S[k]={});const a=b.dataset.a;if(a==='pub')s.pub=!s.pub;else s.lab=s.lab===a?null:a;save();paint();count()});
paint();g.appendChild(d)});sec.appendChild(g);app.appendChild(sec)});
function count(){let n=0;Object.values(S).forEach(s=>{if(s.lab||s.pub)n++});document.getElementById('cnt').textContent='Отмечено: '+n;
const r={};V.forEach(v=>r[v]={live:0,pub:0,ai:0,all:0});
T.forEach(t=>t.cards.forEach((c,ci)=>{const s=S[t.id+'#'+ci]||{};const x=r[c.v];if(!x)return;x.all++;if(s.lab==='live')x.live++;if(s.lab==='ai')x.ai++;if(s.pub)x.pub++}));
document.getElementById('tbl').innerHTML='<table><tr><th>Вариант</th><th>Текстов</th><th>Живой</th><th>Публиковать</th><th>Нейросеть</th></tr>'+V.map(v=>'<tr><td>'+esc(v)+'</td><td>'+r[v].all+'</td><td>'+r[v].live+'</td><td>'+r[v].pub+'</td><td>'+r[v].ai+'</td></tr>').join('')+'</table>'}
count();
document.getElementById('rev').onclick=()=>{document.body.classList.toggle('reveal');document.getElementById('rev').textContent=document.body.classList.contains('reveal')?'Скрыть':'Показать, где что'};
</script></body></html>
