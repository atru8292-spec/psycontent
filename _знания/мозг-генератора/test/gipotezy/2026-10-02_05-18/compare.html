стка, которому сейчас тяжело общаться. Я бы не спешил требовать, чтобы он вышел из комнаты и все объяснил.\nПервое. От вопросов у него напрягается даже тело: плечи поднимаются, челюсть сжата, ответы становятся короче.\nВторое. Он лежит в тишине, но после такого отдыха сил поговорить все равно нет.\nТретье. Переписывается с друзьями, а вам отвечает одним словом. Меня тревожит, когда это сразу называют издевательством над родителями: с друзьями можно просто обменяться картинками.\nЧетвертое. Хорошую новость тоже оставляет при себе. Потому что следом обычно идут вопросы, подробности, планы, а он уже устал.\nПятое. Перестает просить деньги даже на привычные мелочи. Если каждая просьба заканчивается долгим разговором, проще обойтись.\nСколько пунктов вы узнали?","caption":"Если молчание появилось резко, подросток плохо спит, пропускает еду или школу, я бы предложил обратиться за помощью. Для начала можно написать ему: «Вижу, что тебе тяжело. Могу посидеть рядом, если захочешь».\nЯ Михаил, психолог, работаю с родителями подростков от двенадцати до семнадцати лет.\nЕсли хотите обсудить вашу ситуацию на консультации, напишите мне в личные сообщения."},{"v":"h3h4","text":"Четыре вещи о подростке, который закрылся в комнате и не хочет с вами разговаривать.\nПервое. На вопросы отвечает «не знаю». Иногда он знает, но уже представляет следующие десять вопросов.\nВторое. Прячет даже небольшие неприятности. Рассказать про двойку для него значит сразу получить план, что теперь делать. А он еще сам переваривает.\nТретье. Злится на «ты же сам сказал». Сказал, потом передумал. Теперь каждую фразу приходится проверять: вдруг запомнят.\nЧетвертое. Выходит спросить, что на ужин, будто ничего не случилось. Можно побыть рядом, поговорить, и никто пока ничего про тебя не выясняет.","caption":"В переписке подростку иногда легче сказать что-то важное: фразу можно стереть, переписать, отправить позже. Поэтому сообщение из соседней комнаты тоже считается разговором.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов."},{"v":"zhh7","text":"Пять признаков подростка, которому сейчас тяжело даже разговаривать.\n\nПервое. От вопросов у него буквально напрягается тело: вы еще только спрашиваете, как прошел день, а он уже поднимает плечи, сжимает челюсть, отворачивается, словно сейчас придется отвечать у доски.\n\nВторое. Он лежит в комнате весь вечер, но отдых как будто ничего ему не дает: трудно начать домашнее задание, трудно пойти в душ, даже выбрать, чем заняться, трудно.\n\nТретье. Он избегает даже тех, с кем обычно хорошо: пропускает семейный ужин, оставляет сообщения друзей без ответа, просит пока его не трогать, хотя никто с ним сегодня не ссорился.\n\nЧетвертое. Он перестает просить деньги на привычные вещи, отказывается обсуждать покупки, отвечает, что ничего ему не надо, и разговор быстро заканчивается.\n\nПятое. Хорошая новость вызывает у него тревогу: получил хорошую оценку, вы обрадовались, сказали, что наконец взялся за голову, а он замолчал и ушел к себе.\n\nСколько пунктов вы узнали?","caption":"Одна закрытая дверь сама по себе мало о чем говорит. Важно, изменилось ли привычное поведение подростка и как долго это продолжается. Для начала можно предложить принести ужин и оставить разговор на потом.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от двенадцати до семнадцати лет.\nЕсли хотите обсудить, что происходит у вас дома, напишите мне в личные сообщения для записи на консультацию."},{"v":"h7","text":"Четыре вещи о подростке, который закрылся в комнате и почти перестал с вами разговаривать: иногда он заранее подсчитывает, сколько сил ему будет стоить обычный разговор.\nПервое. Вы спрашиваете, как прошел день, и правда хотите знать. Но у него в голове уже продолжение: сейчас придется объяснять, почему такой голос, что с оценками, с кем поссорился. «Нормально».\nВторое. Допустим, сказал за ужином: «Контрольную плохо написал». Вы сразу включились: надо разобраться, найти репетитора, поговорить с учителем.\nТретье. Он охотнее говорит о чем угодно постороннем. Про игру, фильм, какую-то совершенно странную историю из интернета. Я считаю, мы часто недооцениваем, сколько удовольствия в разговоре, после которого от тебя ничего не требуется.\nЧетвертое. Вчера сам пришел, рассказал, вы наконец почувствовали близость. Сегодня опять дверь закрыта. И хочется спросить: «Ну вчера же могли нормально поговорить?» Вот тут, поверьте, легко случайно сделать вчерашнюю откровенность обязательством на сегодня.\nА у вас дома можно рассказать что-то и на этом закончить?","caption":"После подросткового «не знаю» взрослому часто хочется задать еще несколько уточняющих вопросов. Пауза в такой момент бывает очень неловкой для обоих.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nЕсли хотите обсудить ваши отношения с подростком, напишите мне в личные сообщения, чтобы записаться на консультацию."}]},{"id":"r_vybor_1","topic":"почему я снова выбираю тех, кто меня не выбирает","author":"Ольга","format":"reels_scenka","cards":[{"v":"живой","text":"Б: Страх уходит, когда начинаешь доверять.\nА: Но если я доверюсь, я потеряю контроль.\nБ: Именно.\nА: И тогда может случиться что угодно. А вдруг я не выдержу?\nБ: Так и есть.\nА: Но это звучит ужасно.\nБ: Это звучит реалистично.\nА: А если я ошибусь?\nБ: Ошибки и есть жизнь.\nА: Но я хочу знать, что все будет хорошо.\nБ: Вот это и мешает почувствовать, что уже хорошо.\nА: То есть чтобы перестать бояться, надо согласиться, что страх останется?\nБ: Да.\nА: Но это же парадокс.\nБ: Именно.","caption":""},{"v":"zhh7","text":"Б: По-моему, вы пытаетесь заслужить, чтобы вас выбрали.\nА: Ну приехали.\nБ: А когда он пропадает?\nА: Вот сегодня предложила встретиться, он прочитал и молчит. Зато мою историю посмотрел. И я уже думаю, что выложить еще, чтобы он ответил. Блядь, даже подруге фотографию отправила, спросила, нормально ли выгляжу.\nБ: И что будет, если ответит?\nА: Выдохну. Почувствую, что я ему все-таки нужна.\nБ: Конечно.\nА: И каждый раз надеюсь, что теперь он.\nБ: Его внимание труднее получить.\nА: И поэтому оно для меня столько значит?\nБ: Что вы хотите от него услышать?\nА: Что я ему нужна. И я снова выбираю человека, чей выбор мне придется заслуживать. Потому что тогда я наконец поверю, что меня есть за что выбрать.\nБ: Да.","caption":"Я бы еще спросила, что вы вообще знаете об этом человеке, кроме того, как он вам отвечает. Иногда даже любимую еду назвать трудно.\nЯ Ольга, психолог, работаю с девушками и женщинами от двадцати двух до тридцати пяти.\nОтправьте той, кому сейчас это нужно."},{"v":"h3h4","text":"А: Опять залипла на мужчину, которому я особо не нужна.\nБ: Что вам в нем нравится?\nА: Когда отвечает, я прям оживаю. НАКОНЕЦ заметил, сука.\nБ: А на встрече как?\nА: Да скучно. Я даже подруге пишу под столом.\nБ: И потом опять ждете сообщения?\nА: Да! Думаю, что написать, чтобы он захотел встретиться.\nБ: Его интерес уже стал вашим призом.\nА: Блин, я даже забыла, как сама хотела домой.\nБ: Пока добиваетесь его, выбирать самой некогда.\nА: Ну вдруг он выберет меня, и все наладится?\nБ: А вы тогда выберете его?","caption":"Подруге уже отправлены скрины, его ответ разобран по словам. До обсуждения того, как вам было рядом с ним, опять не дошли.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nОтправьте той, с кем разбираете эти переписки."},{"v":"zh","text":"Б: Я считаю, вы ждете от него доказательства своей ценности.\nА: Он мне нравится. Просто опять прочитал и пропал, блядь.\nБ: И что вы теперь делаете?\nА: Думаю, что написать, чтобы ему наконец стало интересно.\nБ: А с тем, кто сам вам пишет?\nА: Скучно. Подруги нормально встречаются, а мне надо кого-то добиваться.\nБ: Что изменится, если этот все-таки выберет вас?\nА: Значит, я правда классная. Раз даже он захотел.\nБ: А пока молчит?\nА: Значит, со мной что-то не так. Пиздец.\nБ: И хочется добиться ответа?\nА: Да. Я будто жду, чтобы он подтвердил, что я достойна.\nБ: Да.","caption":"Уже и подруге скриншот отправили: посмотри, я нормально написала?\nИ сидите вместе, разгадываете его «ясно».\nЯ Ольга, психолог, работаю с молодыми женщинами и их отношениями.\nОтправьте той, с кем разбираете такие переписки."},{"v":"h6","text":"А: Опять влюбилась в мужчину, которому я особо не нужна.\nБ: Когда вас к нему особенно тянет?\nА: Когда пропадает. Сразу думаю, что написать, как заинтересовать.\nБ: Чего ждете от его ответа?\nА: Что он наконец захочет со мной увидеться. Сам захочет.\nБ: И что тогда подумаете о себе?\nА: Что со мной все нормально. Что я ему нужна.\nБ: А когда мужчина сразу хочет быть рядом?\nА: Есть такой. Пишет, зовет. Я даже ответить ему забываю.\nБ: Там уже нечего доказывать про себя.\nА: Получается, чем меньше я нужна, тем важнее понравиться?\nБ: Тем больше хочется доказать, что вы достойны.\nА: Блядь. Если даже он меня выберет, значит, я правда хорошая.","caption":"Можно весь вечер придумывать ответ на одно «привет», пока сообщения от других даже открывать не хочется. И подруге уже отправлены скриншоты: помоги понять, есть у меня шанс?\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nОтправьте той, кому сейчас это нужно."},{"v":"h7","text":"А: Я снова выбираю мужчину, который меня не выбирает. Он отвечает через раз. И я все равно жду, как дура, с телефоном в руке.\nБ: Что вы почувствуете?\nА: Облегчение. Блядь, обычное сообщение отправила, а ощущение, будто все испортила.\nБ: Его ответ как будто должен подтвердить, что с вами все нормально.\nА: Я тогда думаю: ну ВОТ, получилось, наконец.\nБ: И хочется снова получить это подтверждение.\nА: Получается, я сама все закончила, даже не попробовав?\nБ: А что для вас будет значить, если ничего не получится?\nА: И хочется еще что-нибудь написать, чтобы он понял, какая я вообще.\nБ: Чем меньше внимания, тем больше хочется доказать, что вы его достойны.\nА: Да. И я уже подбираю сообщение, на которое он точно ответит. Чтобы легкое было, смешное, без претензий. Я столько сил трачу на то, чтобы ему было удобно меня захотеть.\nБ: Я бы здесь задержалась. Вам самой с ним удобно?\nА: Мне с ним тревожно. Но когда он появляется, я сразу все забываю. Надо ответить удачно, пока он снова не пропал.\nБ: А когда вы успеваете его выбирать?","caption":"Особенно затягивают эти внезапные «скучаю», после которых опять приходится самой вытягивать разговор. Уже и подругу просишь проверить сообщение перед отправкой.\nЯ Ольга, психолог, работаю с девушками и женщинами, которым от двадцати двух до тридцати пяти.\nОтправьте той, с кем вы уже разбирали такую переписку."}]},{"id":"r_vybor_1_2","topic":"почему я снова выбираю тех, кто меня не выбирает","author":"Ольга","format":"reels_malysh","cards":[{"v":"h6","text":"Зайка, вы опять выбираете человека, который вас не выбирает. Он второй день молчит, а вы уже придумали сообщение, на которое он точно ответит.\n\nПредставьте дверцу. Вы постучали, никто не открыл. И вы остались: вдруг надо потише? Повеселее? Может, подарочек принести?\n\nЕсли вы привыкли добиваться тепла, закрытая дверца дает вам очень знакомое занятие. Стараться. Угадывать. Еще немножко стараться.\n\nИ тут, блядь, даже забываешь спросить, нравится ли вам вообще этот человек. Очень хочется, чтобы он открыл. Чтобы выбрал ВАС. Тогда можно будет выдохнуть: получилось, я достаточно хорошая.\n\nПоэтому его редкое «привет» так радует. Дверца чуть приоткрылась, и вы готовы еще неделю возле нее сидеть.\n\nА вам вообще нравится тот, кто там живет?","caption":"Можно так ждать приглашения на свидание, что согласиться даже на неудобное время.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nПодписывайтесь, если хочется еще таких разговоров про отношения и про себя в них."},{"v":"zhh7","text":"Девочки, хорошие мои, я называю это заслуживанием: когда вы снова выбираете человека, который вас держит в ожидании, и очень стараетесь ему понравиться. Как будто у него есть наклейка «хорошая», и вам обязательно нужно ее получить. Я бы очень хотела, чтобы мы поменьше называли это большой любовью.\n\nВы ждете, что он выберет вас, и вот уже пятница, вы спрашиваете, увидитесь ли вечером, он отвечает «посмотрим», и вы оставляете вечер свободным. Телефон лежит рядом, вы поглядываете, думаете, можно ли еще написать, или это уже слишком, или вы вообще зря спросили. Одно слово прислал. А у вас вокруг этого слова уже весь вечер устроился.\n\nВы ждете, что он выберет вас, и начинаете подбирать себя под него: здесь помолчать, здесь пошутить, здесь показать, что у вас тоже полно дел, здесь потерпеть. Очень много работы, девочки. Вы уже и сообщение переписали, и подруге отправили проверить, нормально ли звучит, и убрали вопросительный знак, чтобы получилось полегче. Блядь, даже знаку вопроса теперь надо заслужить право там стоять.\n\nВы ждете, чтобы он подтвердил вашу ценность.","caption":"В переписке «посмотрим» занимает одну строчку. В вашем календаре оно иногда занимает целые выходные.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nПодписывайтесь, если хочется еще таких разговоров: здесь я пишу про отношения и то, как мы в них с собой обращаемся."},{"v":"h3h4","text":"Девочки, вы снова выбираете того, кто вас не выбирает, и внутри больно-больно.\n\nПредставьте дверцу. Вам хочется, чтобы человек открыл ее и позвал вас к себе.\n\nЕсли раньше приходилось заслуживать внимание, закрытая дверца дает знакомое задание: постарайтесь еще. Будьте интереснее, терпеливее, удобнее. Тогда откроют.\n\nОн неделю молчит, потом присылает: «Соскучился». И все, блядь, вы опять стучите. Ну вот же, почти получилось!\n\nПоэтому человек, которому вы сразу понравились, может казаться скучным. Там ваше старание вообще никому не понадобилось. Даже обидно.\n\nА здесь хочется ДОКАЗАТЬ, что вас можно выбрать.\n\nМожно потихоньку отойти от дверцы.\n\nВы уже достаточно старались.","caption":"Особенно трудно остановиться после редкого теплого вечера: вы потом еще месяц помните, каким он бывает хорошим. И ждете повторения.\nЯ Ольга, психолог, работаю с девушками и женщинами 22-35 лет.\nПодписывайтесь, если хочется еще таких разговоров про отношения и про себя в них."},{"v":"h7","text":"Девочки, вы опять выбрали человека, который вас не выбирает, и теперь внутри боится маленькая вы: вдруг я ему совсем не нужна?\n\nВот вам человек пишет вечером: «Соскучился». Вы улыбаетесь, предлагаете встретиться в субботу. Он отвечает: «Пока не знаю, ближе к делу решим».\n\nИ вы уже держите субботу свободной.\n\nПодруга зовет куда-нибудь, вы говорите: «Я пока не знаю».\n\nИ дальше начинается: может, слишком быстро ответила? Может, зря предложила встретиться? Надо было полегче. Посмешнее. Без этого своего желания увидеться, которое теперь кажется каким-то огромным, неудобным.\n\nСука, сколько работы ради одной субботы.\n\nДверца закрыта, а вы разглядываете свои пальчики. Наверное, стучала неправильно.\n\nКогда важного человека приходилось долго добиваться, его согласие становилось особенным. Оно означало: получилось, я достаточно хорошая, ко мне захотели.\n\nДа, вот этот, который третью неделю не может определиться с кофе. Его решение почему-то должно сообщить вам, достойны ли вы любви.\n\nЯ считаю, это очень жестокая работа для человека.\n\nНо сколько всего должно поместиться в это сообщение: и встреча, и облегчение, и подтверждение, что с вами все в порядке.\n\nЕсли он согласится на кофе, что это должно доказать про вас?","caption":"Особенно обидно бывает отменить свои планы ради встречи, которая так и осталась под вопросом. А потом еще стыдиться, что вообще на нее рассчитывали.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 22 до 35.\nПодписывайтесь, если хочется еще такого: здесь говорим про отношения и все, что в них болит."},{"v":"zh","text":"Хорошие мои, я называю это догонялками: вы снова тянетесь к тому, кто вас не выбирает, и я очень хочу, чтобы вы поняли, почему так трудно остановиться.\n\nВ этих догонялках вы видите, что ваше сообщение прочитано, ответа нет, и уже придумываете еще одно, повеселее, чтобы человеку захотелось к вам повернуться.\n\nВ этих догонялках вам кажется, что осталось чуть постараться, стать поудобнее, ничего лишнего не попросить, и тогда вас наконец выберут. Блядь, как же вы устали.\n\nВ этих догонялках хочется получить свое маленькое «можно»: можно быть рядом, можно обнять, можно больше никуда не бежать.\n\nВ этих догонялках вы пытаетесь заслужить взаимность.","caption":"Я бы отдельно поговорила про сообщение «просто спросить, как дела», которое вы переписываете весь вечер.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nПодписывайтесь, если хочется еще такого: здесь говорю про отношения и то, как мы в них с собой обращаемся."}]},{"id":"r_zlost_1","topic":"«я вообще никогда не злюсь»","author":"Юлия","format":"reels_monolog","cards":[{"v":"zh","text":"Меня раздражает фраза «хорошие девочки не злятся». Злятся. И на любимых людей тоже, потому что даже любимые могут обидеть, надавить, потребовать слишком много.\n\nНо когда тебе снова говорят, что злиться нехорошо, ты начинаешь спрашивать себя: я что, неблагодарная? Почему я такая злая? Как мне успокоиться, чтобы никого не расстроить?\n\n«Не злись, она же мама». Да, мама. И на маму ты тоже можешь сердиться, продолжая ее любить.\n\n«Будь мудрее». Если под мудростью каждый раз понимают, что ты должна все проглотить, сколько еще тебе придется молчать?\n\nИ вот ты уже говоришь: я вообще никогда не злюсь.\n\nЗа оскорбления, угрозы, свои поступки ты отвечаешь. Требование никогда не сердиться, чтобы оставаться хорошей, ты выполнять не обязана.","caption":"Даже сказанное спокойным голосом «мне это не подходит» могут назвать грубостью. Я бы не спешила соглашаться с такой оценкой.\nЯ Юлия, психолог, работаю с женщинами, которым привычно быть хорошими и удобными.\nСохрани, если тебе трудно признать, что ты тоже злишься."},{"v":"h3h4","text":"«Я вообще никогда не злюсь», говоришь ты, когда подруга опять отменяет встречу за час.\n\nТы уже собралась. Вечер освободила. Но у нее на работе завал, ну как тут злиться?\n\n«Войди в положение». Входишь. Сразу, даже пальто снять не успела.\n\n«Ты же понимаешь». Понимаешь. У нее сложный день, она устала.\n\n«Ну что ты из-за ерунды». И вот ты уже проверяешь, достаточно ли серьезная причина у тебя расстроиться.\n\nА у него найдутся. Всегда найдутся.\n\nМожно понимать, почему подруга отменила встречу, и злиться, что твой вечер сорвался. Ей даже не обязательно быть плохой, чтобы ты имела право сердиться.","caption":"Иногда после такого вечера хочется отменить уже следующую встречу. А сказать «я тогда разозлилась» все еще кажется ужасно невежливым.\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nОтправь той, которая всегда входит в чужое положение."},{"v":"zhh7","text":"Меня раздражает фраза «хорошие дочери на маму не злятся».\n\nНо после этой фразы ты начинаешь спрашивать себя: что со мной не так? Я правда такая неблагодарная? Как мне перестать злиться, чтобы снова быть нормальной дочерью?\n\nЯ с этим не согласна.\n\nЕсть еще прекрасное «будь выше этого». Обычно ты слышишь его как раз тогда, когда уже хочется сказать: со мной так нельзя. И тебе предлагают подняться куда-то повыше, где ты ничего не хочешь, ничего не требуешь, все понимаешь. Ну хорошо, ты понимаешь, что человек устал, переживает, у него тяжелый день. И что, теперь тебе совсем нельзя сердиться на то, как он с тобой разговаривает? Усталость ты поняла. Слова ты тоже услышала.\n\nА потом добавляют: «Ты же добрая, откуда в тебе столько злости?»\n\nТы же добрая, значит, потерпишь. Ты же взрослая, значит, промолчишь. Ты же любишь, значит, опять уступишь.\n\nЕму тоже можно это чувствовать. Дальше вам придется выбирать слова, договариваться, иногда останавливать разговор. Тут есть за что отвечать.\n\nТы отвечаешь за свои слова и поступки: за оскорбление, за угрозу, за то, что ударила. Само чувство злости еще никому не причинило вреда.","caption":"Даже мысленное «как же ты меня достала» иногда кажется себе ужасной грубостью. Хотя вслух ты сказала только: «Сегодня я не приеду».\n\nЯ Юлия, психолог, работаю с женщинами, которые привыкли быть удобными и хорошими.\nСохрани, если трудно признаться себе в злости."},{"v":"h6","text":"Подруга отменяет встречу, когда ты уже приехала, а ты ругаешь себя: ну зачем я так остро реагирую?\n\nИ потом говоришь: «Я вообще никогда не злюсь». Настолько быстро, что подруга еще сообщение дописывает, а ты уже виновата.\n\n«Она же не специально». Допустим. Ты все равно потратила время, собралась, приехала. Чтобы злиться, тебе теперь надо доказать, что она специально хотела тебя обидеть?\n\n«Из-за такой ерунды?» Как будто на злость надо собрать документы.\n\n«Будь выше этого». Выше, еще выше. Там уже собственных чувств не слышно.\n\nИ каждый раз ты остаешься хорошей: все понимаешь, всех оправдываешь. Только к себе у тебя много, много вопросов. Почему обиделась? Почему такая чувствительная? Почему опять испортила себе настроение?\n\nМожно злиться на человека, у которого были уважительные причины. Даже если ты эти причины понимаешь.","caption":"Иногда «все нормально» отправляется раньше, чем ты успеваешь понять, как тебе вообще. А потом даже подруге сказать о своей обиде неловко: ты ведь уже ее успокоила.\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nОтправь той, которая всегда «все понимает»."},{"v":"h7","text":"«Я вообще никогда не злюсь. Ну на что злиться, у всех же свои обстоятельства». И вот ты уже одета, ждешь подругу, а она пишет, что встреча отменяется. Ты отвечаешь: «Да, конечно, понимаю». Потом снимаешь серьги, переодеваешься, и почему-то уже ничего сегодня не хочется.\n\nНо куда в этом разговоре делось то, что ты ее ждала?\n\nДа.\n\n«Ну войди в положение». Ты уже вошла. Ты там, кажется, с вещами поселилась. А свое положение ты успела заметить?\n\nЯ здесь вот о чем думаю. Хорошая, удобная женщина часто требует от своей злости доказательств. Причем очень серьезных. Кто-то должен сделать что-то ужасное, намеренно, без единой уважительной причины. Тогда, возможно, ей можно будет разозлиться. Возможно. Еще надо проверить, достаточно ли ужасное.\n\nИ вот тут я бы вернулась к началу. Ты сказала: «Я никогда не злюсь». А потом столько сил потратила, чтобы объяснить себе, почему злиться нельзя.\n\nЯ считаю, к своей злости можно допустить чуть меньше следствия. Без проверки всех обстоятельств, без оправдательного приговора каждому, кто тебя расстроил.\n\nПодруга могла иметь полное право отменить встречу. Ты имеешь полное право злиться, что она отменилась.","caption":"Иногда после «все нормально» очень хочется до конца вечера никому не отвечать. А признать свое недовольство все еще кажется грубостью.\nЯ Юлия, психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nСохрани, если хочется вернуться к этому разговору."}]},{"id":"r_zlost_1_2","topic":"«я вообще никогда не злюсь»","author":"Юлия","format":"reels_poslanie","cards":[{"v":"zh","text":"Если ты говоришь «я вообще никогда не злюсь» и потом часами думаешь, почему согласилась, я хочу сказать тебе про злость. Можно злиться, когда слышишь «тебе что, трудно?», и тебе действительно трудно, потому что ты уже отложила свои дела и опять взялась за чужие. Можно злиться, когда тебе говорят «ты слишком остро реагируешь», и признавать, что тебя это задело, даже если всем удобно считать это ерундой. Можно злиться, когда слышишь «будь выше этого», и перестать ждать, что твою обиду наконец заметят, если ты будешь достаточно спокойной. Можно злиться и сказать, что сегодня ты больше ничего на себя не возьмешь, даже если от тебя ждали согласия. Можно злиться на любимых.","caption":"Иногда злость слышна только в том, как резко ты ставишь чашку, пока вслух говоришь: «Да, конечно».\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть удобными.\nПодписывайся, если хочется еще таких разговоров: здесь я пишу про чувства, отношения и привычку всем угождать."},{"v":"h3h4","text":"Если ты говоришь «я вообще никогда не злюсь», а потом полвечера вспоминаешь, как с тобой разговаривали, послушай. Тебе опять отменили встречу в последний момент. Ты написала: «Все нормально». И сидишь, внутри кипит, но уже сама себя уговариваешь. «Ну войди в положение». Вошла. Уже придумала пять причин, почему человек так поступил. «Чего ты из-за ерунды?» И вот ты доказываешь себе, что встреча была важной, вечер ты освободила, вообще-то ждала. «Будь выше этого». Куда еще выше? Ты уже собственную злость услышать не можешь. Тебе можно злиться и на человека, которого ты понимаешь.","caption":"Иногда «я все понимаю» вылетает раньше, чем успеваешь сказать: «Мне жаль, я хотела тебя увидеть».\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nПодписывайся, если хочется еще таких разговоров: здесь про отношения, злость и привычку всем угождать."},{"v":"h6","text":"Если ты говоришь «я вообще никогда не злюсь», а после встречи с подругой еще полвечера споришь с ней в голове, послушай. Она тебя перебивала. Ты улыбалась, ждала, пока договорит, и снова пыталась рассказать свое. А теперь думаешь: «Почему меня вообще никто не слушает?» И тут же себя останавливаешь. «Она же хороший человек». Хороший. И перебивала. «Она ничего плохого не хотела». Верю. Тебе все равно хотелось закончить фразу. «Ну что ты из-за ерунды». Слушай, ты уже полвечера пытаешься договорить, хотя бы в голове. Можно злиться на хорошего человека. Его хорошесть остается при нем.","caption":"Иногда даже мысленно сказать «я на нее злюсь» кажется предательством. Особенно если она столько раз тебе помогала.\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nПодписывайся, если хочется еще таких разговоров: здесь про чувства, которым трудно дать место."},{"v":"zhh7","text":"Если ты говоришь «я вообще никогда не злюсь», я хочу спросить: а тебе вообще можно злиться?\n\nТы можешь злиться, когда слышишь «ты же добрая», и вдруг получается, что теперь тебе придется согласиться, подвинуть свои планы и еще проследить, чтобы никто рядом не почувствовал себя виноватым. И почему каждый твой отказ опять требует доказательств, что ты хороший человек? Я бы здесь очень внимательно отнеслась к этому «же». В нем уже как будто записано твое согласие.\n\nТы можешь злиться, когда слышишь «ну что ты из-за такой ерунды», и начинаешь сама уменьшать то, что с тобой произошло. Подумаешь, опять попросили помочь. Подумаешь, опять в последний момент. Ты ведь действительно можешь, у тебя свободный вечер. Только ты собиралась провести его дома, поесть, помыть голову и никуда больше не собираться. И вот ты уже стоишь в прихожей, ищешь ключи и объясняешь себе, что отказать было бы как-то некрасиво. А дома остается остывать твой ужин.\n\nЯ считаю, твой вечер тоже считается. Даже если ты собиралась просто лежать.\n\nТы можешь злиться, даже если тобой довольны.","caption":"Иногда слово «нет» уже написано в сообщении, а потом его стирают и отправляют «хорошо». Мне хочется, чтобы между этими двумя сообщениями было чуть больше места.\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть удобными и хорошими.\nПодпишись, если хочется еще таких разговоров: здесь я пишу о злости, отношениях и привычке всем угождать."},{"v":"живой","text":"Это для тех, кто вечером лежит и думает: «я опять ничего не успела». Послушай меня минуту. Ты сегодня встала, хотя не хотелось. Отвела, приготовила, ответила, выслушала, не сорвалась. Или сорвалась, но потом извинилась. Это все делала ты. Просто в твоем списке дел этого нет, потому что ты считаешь только то, что не сделала. Я не буду говорить, что завтра станет легче. Я скажу, что уже сейчас ты делаешь очень много. А устала ты, потому что тащишь это одна и без выходных. Сохрани и включи себе, когда снова будешь лежать и считать.","caption":""},{"v":"h7","text":"Если ты говоришь «я вообще никогда не злюсь», а потом полвечера ругаешь себя за то, что чужая просьба тебе в тягость, послушай.\n\nДопустим, у тебя выходной. Ты собиралась просто побыть дома. Без полезных дел, без подвигов. И тебя просят помочь. Ты соглашаешься, конечно. Но пока собираешься, думаешь: «Почему опять я? Почему мой выходной можно вот так забрать?» И сразу себя одергиваешь. Человеку же помощь нужна. Что ты начинаешь.\n\nНо тебе этого мало, ты еще требуешь от себя, чтобы внутри все было радостно.\n\nЯ считаю, это очень жесткое требование. Помочь и ни на секунду не пожалеть о своих планах. Уступить и даже мысленно не поворчать. Ты себе вообще оставляешь место в этом выходном?\n\n«Будь выше этого». И ты стараешься подняться так высоко, чтобы собственных желаний оттуда уже было не видно. Ну прекрасно. Всем удобно, тебя самой почти нет.\n\nТы никого не оскорбила, никому не отомстила. Ты сидишь, завязываешь шнурки и думаешь, что хотела провести этот день иначе.\n\nТебе можно помочь человеку без восторга.","caption":"Иногда после «спасибо, ты меня очень выручила» хочется побыть в тишине, и отвечать сердечком совсем не хочется. Даже благодарность бывает трудно принять, когда ты все еще жалеешь о своих планах.\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nПодписывайся, если хочется еще таких разговоров: здесь говорю о чувствах, которые мы привыкли себе запрещать."}]},{"id":"r_humor_1","topic":"когда ты психолог, а подруги приходят «просто поговорить»","author":"Ольга","format":"reels_rol","cards":[{"v":"h6","text":"Девочки, если ваша подруга психолог, приходите к ней ПРОСТО поговорить. Я подготовила инструкцию. Сначала спросите, как дела. Ответ можно пропустить, у вас сорок скриншотов переписки, надо успеть. Скажите: «Ты только как подруга послушай». Потом: «А с профессиональной точки зрения он почему так написал?» Если спросит, что вы сами чувствуете, скажите: «Блядь, я откуда знаю, ты же училась». Обязательно уточните, какой у него тип привязанности. По слову «ок» уже должно быть понятно. Если предложит обсудить это на консультации, обидьтесь. Вы же близкие люди. И в конце спросите, как ей самой удается отдыхать. Пока отвечает, пришлите еще скриншот. Он поставил точку. Тут отдых подождет.","caption":"Еще отдельное голосовое: «Слушай на обычной скорости, там интонации важны».\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nДобавьте в комментариях свой пункт к инструкции."},{"v":"h3h4","text":"Девочки, учимся приходить к подруге психологу «просто поговорить». Сначала спросите, как она. Ответ можно промотать. Теперь голосовое на восемнадцать минут. В конце обязательно: «Ты как специалист что скажешь?» Она устала? Скажите: «Мне даже поговорить с тобой теперь нельзя?» Отлично, чувство вины подключили. Блядь, работает. Она предлагает записаться на консультацию? «Ты что, на мне зарабатывать собралась?» Она отвечает как подруга? «А где твоя профессиональная этика?» Запомнили? Она у нас специалист, когда нужен разбор, и подруга, когда речь про оплату. Так, домашнее задание: написать ей в одиннадцать вечера «Ты спишь?» И сразу следом: «Мне кажется, ты меня ИЗБЕГАЕШЬ. С чем это связано?»","caption":"У фразы «тебе же самой интересно» тоже есть постоянная прописка в таких разговорах. Особенно когда уже открыли переписку с бывшим за последние полгода.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nДобавьте в комментариях свою фразу для этого инструктажа."},{"v":"zh","text":"Девочки, я научу вас получать бесплатные консультации у подруги психолога. Я сама пользуюсь, прекрасно работает. Пишите: привет, как ты? Ответа ждать необязательно, сразу отправляйте голосовое про бывшего. Да, длинное. Она профессионал, разберется. Если спросит, чего вы хотите, говорите: просто поговорить. Это волшебные слова, после них консультация становится дружбой. Она устала? Конечно, поэтому текстом, пусть перед сном прочитает. Блять, мы же заботимся. Предлагает записаться? Прекрасно, скажите, что только ей доверяете. Пусть почувствует себя особенной. Да, платить особенным людям очень неловко. Обещаю, скоро она начнет отвечать еще до вашего сообщения. Зачем спрашивать про ее жизнь? Вдруг у нее все хорошо, вы только расстроитесь. Все, идите звоните. Она как раз ужинает.","caption":"У сообщения «есть минутка?» бывает продолжение размером с аудиокнигу. Особенно когда следом прилетает «я еще предысторию забыла».\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nДобавьте в комментариях свою фразу из таких переписок."},{"v":"zhh7","text":"Я решила просто с вами поговорить, вы же психолог, вам это легко.\n\nВы только слушайте как подруга, ладно? По дружбе. И потом скажите, какой у него тип привязанности, почему я выбираю таких мужчин и что мне ему ответить.\n\nКороче, вчера я написала ему, что устала, а он ответил: понятно. И все. Вот вы как психолог скажите, что это означает? Он понял? Или он написал, что понял, чтобы я подумала, что он понял? Я уже подруге переслала, она сказала, что он козел. Но у нее никакого образования, поэтому хочется все-таки профессионально услышать, что он козел.\n\nБлядь, я скрин забыла приложить. Сейчас.\n\nОй, а давайте вы ему сами напишете? У вас формулировки спокойные, взрослые. Я создам чат, вы туда зайдете просто как моя подруга. Профессию можно сразу указать, чтобы он нормально себя вел. И его маму добавим, она тоже должна услышать. Вы же семейный психолог, вам даже интереснее будет, вся семья в сборе.\n\nОплата? Господи, я с вами дружу вообще-то. Я вам тоже помогаю. Помните, сказала, что вам эта помада идет? От души сказала. И ссылку на кофточку прислала, вы просили.\n\nСука, теперь я еще и виноватой себя чувствую.\n\nВсе, идите уже спать. Я пока вторую часть наговорю, утром начнете с нее.","caption":"Особенно хорошее дополнение к такому голосовому: «Можете пока слушаете посуду помыть». Забота о вашем свободном времени.\nЯ Ольга, психолог, работаю с девушками и женщинами.\nЕсли знакомо, напишите в комментариях «голосовое»."},{"v":"h7","text":"Если ваша подруга психолог, поздравляю, теперь у вас есть человек, которому можно в час ночи написать «ты спишь?» и сразу отправить одиннадцать голосовых. Главное, сразу обозначьте: вы пришли ПРОСТО поговорить. Слово «просто» освобождает вас от записи, оплаты и необходимости спросить, как у нее дела. Начните с «ты же меня знаешь». Так вы сразу дадите понять, что всю предысторию она обязана помнить. Особенно переписку с вашим бывшим за март. Скриншоты, конечно, отправьте заново. Там появились новые обстоятельства: он поставил точку. Раньше писал без точки. Только обязательно добавьте: «Как подруга скажи». А если скажет «да пошел он», уточните: «Ну ты же психолог, что значит пошел? Я тоже так могу». Я вообще считаю, дружба должна обогащать. Вот пусть она вас и обогащает. Знаниями. Например, вы поссорились с мужчиной. Пишите подруге: «Есть минутка?» Ответа ждать необязательно, минутка уже началась. Сначала расскажите ссору. Потом предыдущую. Потом что его мама сказала на даче. Потом вашу маму, потому что она предупреждала. Если подруга спросит, чего вы сейчас от нее хотите, возмутитесь: «Блядь, я тебе душу открываю, а ты мне анкету устроила». Если она скажет, что устала, поддержите: «Бедная. А представляешь, каково мне?» Что? Кстати, на день рождения подарите ей свечку. С надписью «Береги себя». Сука, обожаю полезные подарки.","caption":"Еще есть сообщение «можно вопрос по твоей работе?», после которого телефон хочется положить в холодильник.\nОсобенно когда следом прилетает «только ответь как человек».\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nНапишите в комментариях свой пункт для этого инструктажа."}]},{"id":"r_humor_1_2","topic":"когда ты психолог, а подруги приходят «просто поговорить»","author":"Ольга","format":"reels_scenka","cards":[{"v":"zhh7","text":"Б: Я считаю, психологу можно просто сплетничать с подругой.\nА: Подождите, она рассказывает, что опять поругалась с парнем, и я должна просто сидеть? Я уже спросила, что она чувствует, где это в теле, как у них в семье обходились со злостью. Она пока только сняла пальто.\nБ: А зачем вы спросили?\nА: Картошка ведь тоже бывает навязанной.\nБ: Она просила разобраться?\nА: Сижу с кетчупом и важной информацией.\nБ: Можно оставить вопросы при себе.\nА: А я иногда хочу сказать: блять, он опять? И предложить десерт.\nБ: Вы сейчас с подругой?\nА: Да. Мы весь вечер обсуждали ее парня, потом мою кофту, потом официанта. И никто ничего не осознал. Даже официант. Просто принес счет и ушел.\nБ: А вам было хорошо?\nА: Вообще да. Мы смеялись, она доела мою картошку, я пожаловалась на доставку. Получается, можно оставить вопрос про отношения с мамой до того момента, когда мама действительно позвонит?\nБ: Да.","caption":"Увидела совет задавать близким побольше терапевтических вопросов. Я бы после третьего уже попросила передать соль и сменить тему.\n\nЯ Ольга, психолог, работаю с девушками и женщинами.\nЕсли хотите на консультацию, пишите в директ слово «разбор»."},{"v":"живой","text":"Б: Здравствуйте, давайте знакомиться. Ко мне можно на ты.\nА: Да, хорошо. Давай сразу к делу. Мне тридцать два, и у меня ни разу не было долгих отношений.\nБ: Вижу, мы пропустили знакомство и сразу к делу.\nА: Ну да. Я и с мужчинами так знакомлюсь. Не люблю эти «расскажи о себе».\nБ: Как будто боитесь потерять время.\nА: Конечно. Зачем тратить, если не подходим?\nБ: А что вы теряете, когда пропускаете знакомство?\nА: Ну... романтику какую-то. Может, возможность узнать друг друга.\nБ: А вы хотели бы, чтобы вас узнали получше?\nА: Да не особо.\nБ: А что так?\nА: Ну... вдруг я такая не понравлюсь.","caption":""},{"v":"h3h4","text":"А: Я к вам ПРОСТО поговорить. Вы же психолог.\nБ: Как подруги поболтаем?\nА: Конечно. Я переписку принесла. Почему я таких выбираю?\nБ: А обо мне спросите?\nА: Да! Вы как психолог что об этом думаете?\nБ: Думаю, я устала.\nА: От клиентов? Тогда отвлекитесь, давайте мой случай разберем.\nБ: Да я охуела.\nА: Вы злитесь? Это у вас контрперенос?\nБ: Это моя кухня.","caption":"Чай остывает, переписка листается. Где-то между «вам еще печеньку?» и «а что он этим хотел сказать?» встреча получила новую профессию.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nЕсли хотите на консультацию, пишите в директ слово «разбор»."},{"v":"h6","text":"А: Я к вам просто поговорить. Вы же психолог.\nБ: Слушаю.\nА: Бывший опять написал. Как думаете, он мудак?\nБ: Как подруга скажу: мудак.\nА: Подождите, мне нужно ваше профессиональное мнение.\nБ: Зачем?\nА: Я ему скрин отправлю. Пусть прочитает мнение специалиста.\nБ: С моим именем?\nА: Конечно. И что вы психолог, обязательно подпишите.\nБ: Еще печать поставить?\nА: ДА! А то скажет, что подруги меня защищают.\nБ: Я и есть подруга.\nА: Тогда позовите еще психологов. Соберем консилиум.\nБ: Вместо девичника?","caption":"А еще желательно голосовым. Только без смеха, пожалуйста, документ серьезный.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами.\nЕсли хотите на консультацию, пишите в директ слово «разбор»."},{"v":"h7","text":"А: Ты же психолог, я к тебе просто поговорить. Вино принесла. Только скажи, почему он опять пропал и что у него там с привязанностью.\nБ: Я бы спросила у него.\nА: Потому что в интернете он вполне себе свободен.\nБ: Я тоже вижу только «занят».\nА: Я тебе переписку открою. Тут голосовые еще. Вино пока уберем, тебе надо сосредоточиться.\nБ: Мне уже хочется вина.\nА: Но мы просто сидим, по дружбе.\nБ: А про меня спросишь?\nА: Конечно! Устала? Я поэтому тебя и берегу, никуда не зову. Просто к тебе домой пришла, чтобы ты могла лежать.\nБ: И слушать людей лежа.\nА: Ну я же своя! Со мной можно расслабиться.\nБ: Я вообще собиралась сплетничать.\nА: Блин, я уже сама запуталась. Мне хочется, чтобы ты поняла его, поняла меня, объяснила нашу переписку... А потом мы вместе сказали: «Да пошел он нахер». Вот это можно?\nБ: Да пошел он нахер.","caption":"Меня особенно веселит в этом приглашении слово «расслабься». Рядом уже открыт телефон, подготовлены скриншоты и увеличен шрифт, чтобы мне было удобно.\nЯ Ольга, психолог, работаю с девушками и женщинами, которым от двадцати двух до сорока.\nЕсли хотите на консультацию, пишите в директ слово «разбор»."},{"v":"zh","text":"Б: Я психолог, и с подругами хочу разговаривать по очереди.\nА: Но я же пришла просто поговорить.\nБ: Я тоже.\nА: У меня вообще проблемы, мне надо выговориться.\nБ: У меня тоже.\nА: А другие психологи вроде всегда готовы слушать.\nБ: Вы с ними дружите?\nА: Блять, а печенье я зачем принесла?\nБ: Чтобы вместе поесть.\nА: И мне теперь еще спрашивать, как вы?\nБ: Было бы здорово.\nА: То есть у нас обеих будет очередь поговорить?\nБ: Да.","caption":"К чаю я вполне могу прийти с покупным печеньем и собственной жалобой на жизнь. Даже если в переписке уже назначили меня самой устойчивой.\nЯ Ольга, психолог, работаю с девушками и женщинами.\nЕсли хотите прийти на консультацию, пишите в директ слово «разбор»."}]},{"id":"r_malysh_1","topic":"почему так страшно сказать «нет»","author":"Ольга","format":"reels_malysh","cards":[{"v":"zh","text":"Зайка, я называю это перепугом: сказать «нет» страшно, будто после этого вас сразу разлюбят.\n\nЭто когда между вами и близким человеком будто ниточка, и любое его недовольство означает: все, пиздец, сейчас порвется, и вы скорее соглашаетесь, лишь бы она держалась.\n\nЭто когда в телефоне просьба приехать в выходные, и у вас свои планы, и вы уже пишете, что приедете, потому что представить чужую обиду страшнее, чем отменить свой выходной.\n\nЭто когда вы признаете, что очень хотите отказаться, и все еще ждете, что найдутся такие слова, после которых вам позволят и никто даже губки не надует.\n\nЭто когда вы все-таки пишете, что приехать не сможете, и оставляете человеку возможность расстроиться, и ниточка пока цела, хотя вам страшно.","caption":"Иногда после отказа хочется сразу дописать длинное объяснение: про работу, усталость, запись к врачу. Как будто без уважительной причины ваше «нет» вообще не считается.\nЯ Ольга, психолог, работаю с женщинами, которым трудно перестать быть удобными.\nОтправьте той, кому сейчас трудно отказать."},{"v":"zhh7","text":"Милые, я называю этот страх сказать нет переполохом: вы еще никому не отказали, а уже страшно, что на вас рассердятся и перестанут любить.\n\nСтрашно сказать нет, когда в пятницу приходит сообщение с просьбой выйти в выходной, и вы смотрите на него, и вам хочется положить телефон, потому что вы уже представляли, как завтра выспитесь и спокойно позавтракаете, и тут колокольчик начинает: сейчас обидятся, сейчас подумают, что вы всех подвели, сейчас будут разговаривать с вами другим голосом. И вы печатаете: да, конечно. Блядь. Уже отправили. И сидите, смотрите на это свое «конечно», хотя никакого конечно у вас внутри вообще не было.\n\nСтрашно сказать нет, когда вы признаете, что ваше «да» часто появляется именно в этот момент: стало тревожно, согласились, чуть отпустило. Колокольчик замолчал. Все довольны. Можно пока выдохнуть.\n\nЧтобы отказать и получить подтверждение: с вами все еще хотят общаться, вас все еще ценят, вы все еще хорошая.\n\nСтрашно сказать нет, когда вы соглашаетесь ради этого подтверждения, и ваш выходной снова занят, и колокольчик тихий, и вы опять остались без того, чего хотели.\n\nСтрашно сказать нет, когда вы ждете потери близости.","caption":"Иногда самое трудное начинается после отказа, когда сообщение уже прочитали и долго ничего не отвечают. И очень хочется дописать: «Ладно, я смогу».\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nСохраните, если хочется вернуться к этому разговору."},{"v":"h6","text":"Вам страшно сказать «нет», хорошая моя? Уже согласились выйти в субботу за коллегу, а у самой животик сжался: вы же хотели отдохнуть.\n\nСмотрите, у вас будто есть билетик: «Меня любят, пока я удобная». Помогла, согласилась, потерпела. Все, билетик действует, можно оставаться со своими.\n\nА тут надо отказать. И ручки уже печатают: «Да, конечно». Потому что вдруг человек рассердится? Вдруг ваш билетик заберут?\n\nБлядь, опять целый выходной отдали, чтобы вас продолжали считать хорошей.\n\nВот почему даже вежливый отказ приходится объяснять так долго. Вы словно продлеваете этот билетик: «Я хорошая, правда, у меня уважительная причина».\n\n«В субботу я не выйду».","caption":"Особенно тяжело, когда в ответ прилетает короткое «понятно». Сразу хочется дописать еще три сообщения с оправданиями.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nСохраните, если перед отказом у вас тоже начинается внутренняя проверка."},{"v":"h3h4","text":"Вам страшно сказать «нет», хорошие мои, аж животик сжимается?\n\nВнутри у вас колокольчик. Только кто-то недоволен, он звенит: «СРОЧНО сделайте человеку хорошо!»\n\nВы привыкли отвечать за чужое настроение. Кто-то расстроился, вам надо что-то сделать, чтобы он снова был довольный. Тогда колокольчик замолкает.\n\nВот подруга просит приехать. Вы уже в пижамке, сил нет. Говорите: «Сегодня не смогу». Она: «Ну понятно».\n\nДзынь. Блядь, уже снимаем пижамку.\n\nМожно дать колокольчику позвенеть. Пусть подруга побудет недовольной вашим ответом.\n\nЕе недовольство не обязывает вас соглашаться.","caption":"Иногда после отказа вы отправляете еще пять сообщений с объяснениями, хотя вас уже ни о чем не спрашивают. И ждете заветное «да все нормально», чтобы наконец выдохнуть.\nЯ Ольга, психолог для женщин, которые устали быть удобными.\nОтправьте той, которая даже отказ старается сделать приятным."},{"v":"h7","text":"Девочки, вам страшно сказать «нет», даже когда вы совершенно точно хотите отказаться.\n\nДавайте я вам про стульчик расскажу.\n\nПредставьте: у вас есть свой стульчик рядом с близкими. Вы там сидите, вас любят, вам рады. И вот, если в вашей семье на отказ отвечали обидой, молчанием, «ну спасибо, доченька», вы могли усвоить одну очень простую вещь. У этого стульчика есть условие: соглашайтесь.\n\nИ теперь при каждом «нет» внутри начинается: ой-ой, мой стульчик сейчас заберут. Мое МЕСТО.\n\nВот она говорит: «В воскресенье приезжай, поможешь мне». У вас на это воскресенье свои планы. И уже открываете рот сказать, что не приедете, но представляете ее голос: «Ясно. Значит, на мать времени нет».\n\nВсе.\n\nНачинаете проверять свои планы: достаточно ли они важные? Отдых вообще считается? Может, можно утром приехать, быстро помочь и вернуться? И воскресенье уже поделили, хотя вас пока только спросили.\n\nБлядь, даже отказу нужен больничный, чтобы его приняли.\n\nМеня в этом особенно трогает, сколько сил вы тратите, чтобы сохранить за собой место рядом с человеком.\n\nКогда вы говорите «да», что становится спокойнее: ваши отношения или ваш страх лишиться места в них?","caption":"«Я подумаю» тоже бывает страшно произнести. Ведь тогда другому придется немного побыть без вашего согласия.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nОтправьте той, которая перед каждым «нет» готовит целую объяснительную."}]},{"id":"r_malysh_1_2","topic":"почему так страшно сказать «нет»","author":"Ольга","format":"reels_malysh","cards":[{"v":"zh","text":"Хорошая моя, я сейчас сижу с телефоном, увидела совет «просто научитесь отказывать» и хочу его немножко поправить. Скажите маме, скажите начальнику, скажите всем, желательно улыбнитесь и сразу станьте уверенной женщиной. Блядь, еще инструкцию к улыбке приложите.\n\nВнутри как будто есть кнопочка тревоги. Если раньше на отказ обижались, ругались, переставали разговаривать, эта кнопочка запомнила: соглашаться безопаснее. Теперь коллега просит доделать ее работу, у вас свой вечер занят, а кнопочка уже пищит. И вы говорите: ладно, присылайте.\n\nЯ сама тоже умею подготовить к короткому отказу целое сочинение. Очень убедительное.\n\nКнопочке нужно постепенно узнать, что чужое недовольство можно пережить. Поэтому для начала хватит маленького отказа там, где безопасно.\n\nСочинение я, конечно, все равно мысленно приложу.","caption":"Иногда после отказа вы еще отправляете сердечко, чтобы проверить, с вами точно продолжают дружить.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными для всех.\nПодписывайтесь, если хочется еще таких объяснений: здесь говорим об отказах, вине и отношениях."},{"v":"h7","text":"Лапушки, вам страшно сказать «нет», даже когда вы уже точно знаете, что соглашаться не хотите.\n\nДавайте я покажу, какая тут может быть кнопочка. На ней написано: «Все довольны». Вы нажимаете ее каждый раз, когда соглашаетесь.\n\nИ вот теперь подруга пишет: «Сможешь отвезти меня в аэропорт в субботу? Только выехать надо в пять утра».\n\nА вы всю неделю мечтали выспаться. Прямо ждали эту субботу. Уже представляли, как проснетесь сами, без будильника.\n\nПишете: «Слушай, в этот раз не смогу».\n\nСмотрите на эти шесть слов.\n\nСтираете.\n\nПотому что уже представляете, как она прочитает. Как расстроится. Как подумает: ну понятно, когда мне надо, ее рядом нет. И вот тут, девочки, вы уже разговариваете с обиженной подругой у себя в голове. Настоящая пока вообще ничего не знает. Она, может, чай пьет.\n\nА у вас внутри уже пиздец, дружба под угрозой.\n\nВы пишете: «Да, конечно».\n\nИ сразу легче. Даже приятно на секунду. Все хорошо, вы хорошая, подруга довольна. Кнопочка сработала.\n\nПотом уже вспоминаете про пять утра. Про дорогу. Про свою субботу. И злитесь. На нее тоже: ну могла же такси заказать.\n\nСколько ваших «да» было сказано ради этого облегчения?","caption":"Иногда хватает ответа «ясно» без смайлика, чтобы вы начали предлагать помощь, которой у вас даже не просили. Человек еще ничего не потребовал, а вы уже дописываете: «Хотя давай я что-нибудь придумаю».\nЯ Ольга, психолог. Работаю с женщинами, которым привычнее быть удобными, чем говорить о своих желаниях.\nПодписывайтесь, если хочется еще таких разговоров. Здесь про отношения, чужие ожидания и место для себя."},{"v":"h6","text":"Милая, вам страшно сказать «нет»: вдруг на вас обидятся и больше с вами дружить не будут?\n\nПредставьте стульчик за общим столом. Ваш стульчик. Если раньше место за столом зависело от того, насколько вы послушная, вы могли запомнить: чтобы сидеть со всеми, надо соглашаться.\n\nИ вот вы взрослая. Вам пишут: «Подмените меня в субботу?» У вас свои планы. Но ручки уже печатают: «Да, конечно».\n\nПотому что внутри страшно: сейчас откажу, и мой стульчик уберут. Блядь, всего одну субботу попросили, а вы уже мысленно остались одна.\n\nПоэтому так хочется оправдаться. Объяснить, почему вам можно отказать. Получить разрешение сохранить свое место.\n\nДавайте стульчик пока оставим. Скажите: «В субботу я не могу». И точка, маленькая точечка.\n\nТеперь пусть вам ответят.","caption":"Иногда после отказа хочется дописать: «Но в следующий раз обязательно!» И вы уже обещаете следующую субботу, хотя вас про нее пока никто не спрашивал.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nПодписывайтесь, если хочется еще такого: здесь говорим о границах, семье и отношениях."},{"v":"h3h4","text":"Милая, вам страшно сказать «нет», потому что вдруг с вами перестанут дружить?\n\nПредставьте стульчик за общим столом. Если раньше вас принимали, пока вы соглашались, вы привыкли: чтобы стульчик оставался вашим, надо говорить «да». Возражаете? Ой, сейчас заберут.\n\nИ вот подруга просит помочь с переездом в субботу. А вы хотели полежать. Просто полежать, девочки, ножки вытянуть. Но уже отвечаете: «Конечно, приеду». Блядь, опять без выходного.\n\nМожно оставить себе стульчик, даже когда подруга недовольна. Сказать: «В субботу я не смогу». И остаться сидеть.","caption":"Десять причин отказа дают собеседнику десять возможностей предложить, как вам все-таки согласиться.\nЯ Ольга, психолог, работаю с женщинами, которые устали быть удобными.\nПодписывайтесь, если хочется еще такого: здесь говорим об отношениях, в которых вашим желаниям тоже есть место."},{"v":"zhh7","text":"Зайка, я сейчас сижу с чаем, только что увидела совет «просто научитесь отказывать» и хочу очень бережно спросить: вы серьезно? Просто скажите, просто выдержите паузу, просто перестаньте всем нравиться, просто станьте другим человеком к четвергу, желательно до обеда.\n\nБлядь, как у вас все просто.\n\nИ я тоже умею написать отказ, перечитать, добавить объяснение, потом еще одно. Психолог сидит, чай остывает, объяснения растут.\n\nСмотрите, как это бывает. Подруга пишет: помогите мне сегодня с одной штукой, вы же быстро разберетесь. А у вас своя работа до вечера, потом вы собирались наконец поесть и лечь. Вы уже понимаете, что сил нет. И пальцы начинают печатать: да, конечно.\n\nЕще до того, как вы решили согласиться.\n\nВы отправили «конечно», подруга прислала сердечко, все, она довольна, отношения вроде целы. Можно выдохнуть.\n\nНа несколько минут.\n\nПотом вы смотрите на свою работу, на время, на это обещание помочь и понимаете, сколько всего теперь придется впихнуть в вечер. Свои силы вы посчитаете позже.\n\nВы пытаетесь заранее объяснить все так хорошо, чтобы человеку было совсем невозможно обидеться.\n\nЯ тоже иногда пишу отказ с пояснительной запиской.","caption":"Иногда самое долгое в отказе происходит уже после отправки: телефон лежит рядом, и вы ждете, каким тоном вам ответят. Даже обычное «ок» в этот момент хочется расшифровать.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nПодписывайтесь, если хочется еще такого: здесь говорю про отношения, границы и страх кого-нибудь расстроить."}]},{"id":"r_malysh_2","topic":"обида на маму, которую стыдно признать","author":"Юлия","format":"reels_malysh","cards":[{"v":"zhh7","text":"Хорошие мои, кто опять обиделся на маму и теперь сам себя за это ругает? Я к вам. К тем, кто даже обижаться старается прилично, чтобы мама случайно ничего не заметила.\n\nСтыдно? Конечно.\n\nХорошие.\n\nИногда мама еще ничего не сказала, а ты уже сама себе все высказала. Очень удобно, конечно. Даже звонить никому не надо.\n\nВот обычный разговор. Ты рассказываешь маме, что купила платье. Просто захотелось поделиться. А она спрашивает, куда тебе столько платьев, лучше бы деньги отложила. И ты уже объясняешь, что была скидка, что давно ничего себе не покупала, что вообще имеешь право.\n\nПотом кладешь телефон и думаешь: ну чего я завелась? Она же волнуется за меня. Из-за платья обижаться, совсем уже.\n\nЯ считаю, мы слишком быстро требуем от взрослой дочери понимания. Мама устала, мама переживает, мама иначе не умеет. Все про маму уже объяснили. А дочь еще даже не успела сказать, что ей было неприятно.\n\nТы.\n\nНо ты уже сколько раз выслушала, объяснила, поняла, еще раз объяснила и потом сама себя отругала! Господи, у маминого «я же добра тебе желаю» уже есть штатный переводчик. Ты.\n\nЯ поняла.\n\nТебе было больно.","caption":"Иногда после разговора с мамой хочется удалить собственное сообщение, хотя там всего лишь написано: «Мне это неприятно». Я бы оставила этой фразе место в переписке.\n\nЯ Юлия, психолог, работаю со взрослыми дочерьми от 25 до 40.\nЕсли хочется, напиши в комментариях одно слово: «знакомо»."},{"v":"h3h4","text":"Милая, тебе обидно на маму, и ты себя за это ругаешь. Она столько для тебя сделала. Как же ты теперь на нее обижаешься, да?\n\nПредставь, что у тебя в пальчике заноза. Ты говоришь: «Ой, больно». А мама отвечает: «Я тебе эти варежки всю ночь вязала». И ты уже прячешь пальчик. Варежки хорошие. Мама старалась.\n\nВот и с обидой так. Вспоминаешь мамины старания и сразу замолкаешь. Даже внутри себя. Как будто сначала надо доказать, что мама совсем ничего хорошего тебе не дала. Тогда разрешат сказать, что больно.\n\nТы имеешь право обижаться на маму.","caption":"Иногда после маминого звонка хочется плакать, хотя весь разговор ты отвечала: «Да, мам, все хорошо». Признаться себе в этом бывает труднее, чем рассказать подруге.\nЯ Юлия, психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли хочется, напиши в комментариях одно слово: «обидно»."},{"v":"h7","text":"Солнышко, тебе обидно на маму, и тебе стыдно даже это произнести. Она еще ничего не услышала, а ты уже виновата.\n\nДавай я тебе про колючку расскажу. Вот попала тебе в ладошку колючка. Больно. Ты хочешь сказать «ой», показать, где болит. А потом вспоминаешь: мама ведь старалась. Мама устала. Маме самой было тяжело. И ты ладошку закрываешь. Пусть никто не видит.\n\nКолючка там осталась.\n\nВот ты звонишь маме и говоришь: «Я так устала, сегодня просто сил нет». А она тебе: «Я в твои годы с двумя детьми справлялась, и никто мне не помогал».\n\nТы уже почти готова извиниться за то, что пожаловалась.\n\nПодожди. Ты же позвонила сказать, что устала.\n\nИ я думаю, самое тяжелое здесь вот что: признать обиду для тебя почти равно обвинить маму.\n\nОсобенно если раньше на твое «мне обидно» ты слышала: «После всего, что я для тебя сделала?» Тогда у тебя появлялась еще одна забота. Маме тоже становилось плохо, и надо было скорее все поправить. Сказать, что ты погорячилась. Что ты все понимаешь. Улыбнуться. Колючку спрятать поглубже.\n\nДа, мне было обидно.","caption":"Иногда после такого звонка еще отправляешь маме сердечко. Хочется убедиться, что она на тебя не сердится.\nЯ Юлия, психолог, работаю со взрослыми дочерьми от 25 до 40.\nЕсли хочется, напиши в комментариях одно слово: «обидно»."},{"v":"h6","text":"Милая, тебе обидно на маму, и ты тут же себя ругаешь: как я могу, она столько для меня сделала.\n\nВот мама сказала: «С тобой всегда сложно». Тебе больно. Но ты уже объясняешь себе: она устала, у нее заботы, надо понять.\n\nИ обиду в коробочку. Крышечку закрыла. Все, маму поняла. А тебя кто поймет?\n\nТы так стараешься пожалеть маму, что даже наедине с собой боишься признать: ее слова меня ранили. Вдруг ей станет обидно. Хотя она сейчас вообще в другой квартире, чай пьет.\n\nМожно пока оставить эту коробочку открытой. Без решения, кто у вас хороший, кто плохой. Просто тебе было больно, и ты все еще любишь маму.\n\nОбида этого не отменяет.","caption":"Иногда признать «я обижена» страшно еще и потому, что следующим вопросом будет: «И что теперь, ссориться?» Ссору можно пока вообще не планировать.\nЯ Юлия, психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли хочется, напиши в комментариях одно слово: «обидно»."},{"v":"zh","text":"Мои хорошие дочки, опять обиделись на маму и сами себе выговор устроили? Я с этим выговором не согласна.\n\nРассказала маме, как тебе тяжело, а она сразу про то, сколько сама в жизни пережила. И ты уже жалеешь, что рот открыла.\n\nСтыдно? Потому что маме было трудно, и ты привыкла это учитывать даже тогда, когда больно тебе.\n\nПредставь рюкзачок. Туда ты складываешь мамины трудности, ее усталость, все, что она для тебя сделала. А свою обиду тоже туда, поглубже. Пусть лежит тихонько.\n\nБоишься, что обида сделает тебя неблагодарной?\n\nПодожди, хорошая. Ты ведь хотела, чтобы тебя хоть немного пожалели.\n\nДевочки, вы уже столько маминых переживаний унесли, вам бы грузчика в помощь!\n\nДа, ты благодарна. Да, ты обижена.","caption":"Иногда сообщение маме начинается с «мне обидно», а после правок от него остается «все хорошо». Я бы не торопилась верить этому «хорошо».\nЯ Юлия, психолог, работаю со взрослыми дочерьми и их отношениями с мамой.\nЕсли хочется, напиши в комментариях слово «обидно»."},{"v":"h8","text":"Милая, мама говорит: «Можешь не приезжать, отдохни», а тебе обидно, аж плакать хочется. И ты себя ругаешь: ну чего опять, она же по-хорошему.\n\nПредставь, что ты долго стояла. Ножки устали, а садиться нельзя. Надо помогать, надо быть хорошей девочкой, мама ждет.\n\nИ вдруг тебе ставят стульчик. Садись, отдыхай.\n\nИ тут хочется спросить: а раньше так можно было? Когда я приезжала уставшая, когда боялась тебя расстроить, тогда тоже можно было?\n\nМамина бережность сейчас может напоминать, как сильно ее раньше не хватало. Вот почему обидно даже от добрых слов. Можно пока посидеть с этой обидой. Ты давно нуждалась в такой заботе.","caption":"Особенно стыдно, когда мама добавляет: «Тебе теперь вообще не угодишь».\nЯ Юлия, психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли знакомо, можешь написать в комментариях «обидно»."}]},{"id":"r_malysh_2_2","topic":"обида на маму, которую стыдно признать","author":"Юлия","format":"reels_malysh","cards":[{"v":"h3h4","text":"Милая, ты обижаешься на маму и сразу себя ругаешь: «Она столько для меня сделала, как я могу?»\n\nСмотри, у тебя в пальчике заноза. Ты говоришь: «Больно». А тебе отвечают: «Мама устала. Маме тоже тяжело». И ты такая: ой, тогда ладно. Только заноза осталась.\n\nТы выросла и теперь сама себе объясняешь, почему мама тогда так поступила. Она была одна. Она много работала. Она переживала. И ждешь, что теперь обида пройдет.\n\nНо той маленькой тебе тоже было больно. Она еще ничего про мамины трудности не знала. Она ждала, что мама пожалеет.\n\nМожно пожалеть ее сейчас. Без этого твоего «сама виновата».\n\nТы можешь понимать маму и все еще обижаться на нее.","caption":"Иногда даже мысленно сказать «мама меня обидела» страшно, будто она услышит. И ты снова подбираешь слова помягче.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли хочется поговорить об этом, ссылка на запись на консультацию в шапке профиля."},{"v":"zh","text":"Милая, я думаю, что обидчивую дочку слишком быстро ругают. Что если быть такой дочкой нормально, даже когда ты уже большая?\n\nОбида как маленькая заноза: больно, а тебе говорят, что там совсем ничего нет. И ты еще стыдишься своего «ой».\n\nОбидчивая дочь это та, которая хочет спокойно доесть за общим столом, когда мама обсуждает ее вес, и слышит: «Тебе уже ничего сказать нельзя».\nОбидчивая дочь это та, которая просит маму оставить при себе подробности ее личной жизни, и слышит: «Подумаешь, рассказала, чего ты обижаешься».\nОбидчивая дочь это та, которая хочет услышать хоть одно теплое слово после маминых замечаний, и слышит: «Ты всегда всем недовольна».\n\nРазве это делает тебя плохой?","caption":"После такого разговора иногда еще пишешь маме: «Прости, я погорячилась». Про ее слова в переписке уже ни слова.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми.\nЕсли хочешь поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"h7","text":"Милая, тебе обидно на маму, и ты стыдишься даже самой себе в этом признаться.\n\nВот мама звонит. Обычный разговор, спрашивает, поела ли ты, тепло ли оделась. Ты отвечаешь, потом она говорит: «Ну что ты такая кислая, я же просто спросила». И ты сразу делаешь голос повеселее. Да все хорошо, мам, просто устала.\n\nПоложила трубку и сидишь. Тебе обидно, что опять пришлось изображать хорошее настроение, чтобы мама не расстроилась. И тут же стыдно: она заботится, а я придираюсь. Ну что такого она сказала? Ничего ужасного. Почему я опять так реагирую?\n\nЯ считаю, в этом месте с собой обходятся очень жестоко. Ты еще толком не успела почувствовать, что тебе больно, а уже должна объяснить, почему имеешь на это право. Причем объяснить так, чтобы мама осталась хорошей.\n\nТебе страшно, что, если разрешить себе эту обиду, потом уже не получится любить маму как раньше. Что ты станешь холодной, злой, отвернешься. Поэтому проще опять сказать себе: забудь, она же мама.\n\nТы можешь любить маму и быть на нее обиженной.","caption":"Иногда признаться в обиде мешает мысль: «У других было гораздо хуже». И собственную историю ты снова оставляешь без внимания.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли хочешь поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"zhh7","text":"Милая, я вот думаю: что, если быть обидчивой дочерью нормально, когда мамины слова делают тебе больно?\n\nОбидчивая дочь это та, которая просит маму поберечь ее, когда за столом мама рассказывает всем, как она опять поправилась, опять без мужчины, опять что-то у нее в жизни не так, и слышит: «Ой, ну что ты такая нежная, слова тебе сказать нельзя». И ты сидишь, улыбаешься, потому что гости, потому что праздник, потому что сейчас еще придется объяснять всем, почему у тебя такое лицо. А внутри больно.\n\nОбидчивая дочь это та, которая после такого разговора выходит на кухню, чтобы хоть немного побыть одной, и слышит: «Ну вот, теперь еще и праздник всем испортила». Я тут каждый раз думаю про эту улыбку за столом. А ты просто хотела прийти к маме, поесть, поговорить.\n\nОбидчивая дочь это та, которая потом все-таки говорит маме, что ей было обидно, и слышит: «Я тебя растила, ночей не спала, а ты мне теперь претензии предъявляешь». Неблагодарная.\n\nРазве обида делает тебя плохой дочерью? Разве тебе нельзя быть задетой?","caption":"Иногда после такого разговора ты еще отправляешь маме сердечко. Я бы не спешила считать это знаком, что обида прошла.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"h6","text":"Милая, мама сказала «опять ты все усложняешь», тебе обидно, и тут же стыдно за свою обиду.\n\nКак будто у тебя внутри есть коробочка. Мама сказала больное, ты туда все сложила, крышечку закрыла. Все, мама хорошая. Можно дальше разговаривать.\n\nА открыть страшно. Вдруг там окажется, что мама тебя правда обидела? И ты сразу: она устала, ей тоже тяжело, я сама слишком остро реагирую.\n\nСмотри, ты уже маму утешила. Хотя больно сейчас тебе.\n\nТы можешь так беречь ее даже внутри собственной головы. Даже когда она ничего про твою обиду не узнает.\n\nКоробочку можно оставить открытой. Тебе можно любить ее, скучать по ней и все равно признавать: да, это было обидно.","caption":"Иногда после маминой колкости хочется первой ей позвонить. Проверить, что она хотя бы на тебя не обиделась.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли захочется об этом поговорить, ссылка на запись на консультацию в шапке профиля."}]},{"id":"r_drug_1","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","author":"Михаил","format":"reels_monolog","cards":[{"v":"h7","text":"«Когда у него все хорошо, он пропадает. Когда плохо, сразу вспоминает обо мне».\n\nВот вы вечером на кухне, собирались поесть, включить что-нибудь. Приходит сообщение: «Можешь поговорить? Мне совсем паршиво». Вы звоните. Еда остывает, вы слушаете, задаете вопросы, вместе разбираете, что ему сказали, что он ответил. Он выдыхает: «Спасибо. Только с тобой можно нормально поговорить».\n\nИ вот на этом «только с тобой» вы опять остаетесь.\n\nТеплый.\n\nПроходит несколько дней. Вы спрашиваете: «Как ты?» Получаете: «Да уже нормально, спасибо». Еще через неделю видите фотографии с выходных. Компания, поездка, какая-то смешная история, о которой вы впервые узнаете из подписи под фото.\n\nИ сидите с телефоном: подождите, мы же вроде близкие?\n\nМне кажется, самое болезненное здесь вот что: вы знаете человека в подробностях, пока ему плохо. Знаете, чего он боится ночью, какие слова его задели, о чем он стесняется говорить другим. А как выглядит его обычный хороший день, уже приходится угадывать по фотографиям.\n\nМожно.\n\nПолучается странная близость: чужую беду вы узнаете сразу, чужую радость получаете вместе со всеми подписчиками.\n\nЕсли ему долго будет хорошо, что останется от вашей дружбы?","caption":"Иногда свое хорошее сообщение так и остается в черновиках: у друга ведь сейчас тяжелый период. Потом период заканчивается, а привычка придерживать собственные новости остается.\nЯ Михаил, психолог, работаю с людьми от 25 до 40 лет.\nОтправьте тому, кому сейчас нужен этот разговор."},{"v":"h6","text":"Друг молчит месяцами, а потом пишет: «Выручай, мне плохо». И вы сразу на связи. Чай остывает, сериал стоит на паузе, вы слушаете голосовые и думаете, как ему помочь.\n\nИ вы даже рады: наконец поговорили. Наконец вы ему нужны.\n\nЧерез неделю вы пишете: «Как ты?» Он отвечает: «Все наладилось!» Вы начинаете рассказывать про свой день. И тут разговор заканчивается. Ну, у него уже все хорошо.\n\nВ таких разговорах у вас есть понятная роль: выслушать, успокоить, помочь. И к этому можно так привыкнуть, что обычное «давай поболтаем» уже кажется недостаточным поводом написать. Надо быть полезным. Просто прийти со своей жизнью как будто неловко.\n\nИ вот вы помните, из-за чего он поругался с начальником, чего боялся, что ему помогло.\n\nА он вообще знает, что сейчас происходит у вас?","caption":"Бывает, свое сообщение откладываешь: «Расскажу потом, ему сейчас тяжело». Потом ему становится хорошо, и разговор снова откладывается.\n\nМеня зовут Михаил, я психолог, работаю с людьми от 25 до 40 лет.\nСохраните, если хочется вернуться к этому разговору."},{"v":"zh","text":"Вы сейчас вспомнили друга, который пишет только когда ему плохо, и уже ругаете себя за то, что устали его слушать? Вот с этим выводом я бы подождал.\n\nЯ как психолог задам вам профессиональный вопрос. Простой.\n\nКогда у него все хорошо… вы об этом вообще узнаете?\n\nОн пишет вам про отпуск, зовет поужинать, спрашивает, как прошел ваш день? Или вы узнаете, что он прекрасно провел выходные, из фотографий, а в личных сообщениях снова надо срочно поговорить?\n\nИ вы уже записали себя в худшие друзья. Быстро вы. Даже вопрос еще не дослушали.\n\nТак я переспрошу. В этой дружбе для вас место есть? С вашим обычным вторником, без катастрофы?\n\nПопробуйте как-нибудь прийти в этот разговор со своим вторником. Хоть с рассказом про суп.\n\nЛадно. Суп тоже заслуживает внимания.","caption":"На сообщение «можно тебя набрать?» вы уже заранее откладываете свои дела. Хотя вас еще даже не спросили, есть ли у вас силы слушать.\nЯ Михаил, психолог, работаю с людьми от двадцати пяти до сорока.\nСохраните, если вам знакомо."},{"v":"h3h4","text":"«Когда у друга все хорошо, он пропадает. Как что случилось, сразу пишет мне».\n\nВот вечером прилетает голосовое: «Мы расстались». Вы сорок минут слушаете, потом еще спрашиваете, как он спал. Через неделю они помирились. Вы зовете его выпить кофе. «Да, надо как-нибудь». И тишина до следующей ссоры.\n\nОбидно еще и потому, что вчера вы чувствовали себя очень близкими. Он столько вам рассказал. Но откровенность легко принять за близость: вы знаете все, что у человека болит, и почти ничего о том, чем он живет, когда ему хорошо.\n\nИ вот вопрос: если у него все наладится, останется ли вам место в его жизни?","caption":"Иногда даже о примирении узнаешь из сторис. Хотя весь вечер после ссоры провели вместе в переписке.\nЯ Михаил, психолог, работаю с людьми от 25 до 40 лет.\nСохраните, если хочется вернуться к этому вопросу."},{"v":"zhh7","text":"Вы сейчас увидели тему и уже оправдываете друга?\n\nКогда этот человек появляется, он спрашивает, как вы?\n\nПодождите.\n\nТак.\n\nВот вечером приходит голосовое. Вы видите имя и еще до прослушивания думаете: понятно, что-то случилось. Потому что, когда у него все спокойно, в вашем чате тоже спокойно. Очень спокойно. Последнее сообщение ваше, еще с прошлого месяца.\n\nВы слушаете. Там опять тяжелый разговор, опять кто-то обидел, опять надо решить, что ответить. Вы ставите чайник, потом забываете про чай, записываете ответ, стираете, записываете покороче.\n\nПотом вы говорите, что у вас тоже день так себе. И тут разговор как-то заканчивается. Он устал, ему завтра рано, он потом спросит подробнее.\n\nА через какое-то время видите фотографии: компания, поездка, довольное лицо. И одновременно вам неприятно.\n\nЯ считаю, вы слишком быстро перескакиваете к этому пункту. В том самом разговоре ваша фраза про тяжелый день так и осталась без ответа.\n\nВернусь.\n\nПредлагаю на секунду представить ваш чат с вывеской: «Прием жалоб. Чайник включен». Вы ведь отвечаете.\n\nСмешно получилось?\n\nЛадно, я пойду. А вы как?","caption":"Самое неловкое бывает, когда человек благодарит за поддержку, а вы уже жалеете, что открыли сообщение. И даже себе стыдно в этом признаться.\nЯ Михаил, психолог, работаю с людьми от двадцати пяти до сорока.\nСохраните, если хочется вернуться к этому вопросу."}]},{"id":"r_drug_1_2","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","author":"Михаил","format":"reels_spisok","cards":[{"v":"h7","text":"Четыре признака дружбы, в которой вам звонят, когда все плохо, и пропадают, когда жизнь наладилась.\nПервое. По его сообщению вы уже понимаете: что-то случилось. Еще даже не открыли, там просто «Привет, как ты?», а вы уже перебираете: опять расстались, на работе неприятности, нужны деньги?\nВторое. Вы узнаете о хорошем вместе со всеми. Про ссору с партнером вам рассказывали до двух ночи. Про примирение узнаете из фотографии в соцсетях.\nТретье. Допустим, вы предлагаете встретиться в субботу. Он отвечает: «Ой, сейчас столько всего, давай потом». Вы пишете еще раз через неделю и чувствуете себя уже каким-то навязчивым человеком. Хотя совсем недавно он звонил вам каждый вечер, и вы отменяли свои планы, чтобы поговорить.\nЧетвертое. Когда у него опять все рушится, вам становится легче. И одновременно чувствуете: наконец-то мы снова близки, наконец-то я нужен. Я бы здесь задержался.\nА что у вас остается общего, когда ему хорошо?","caption":"Фраза «я только тебе могу это рассказать» очень сближает. После нее особенно трудно признаться, что вам тоже хочется внимания.\nМеня зовут Михаил, я психолог, работаю с людьми от 25 до 40 лет.\nПодписывайтесь, если хочется еще таких разборов: здесь говорим об отношениях и о том, как мы в них себя чувствуем."},{"v":"zh","text":"Пять признаков дружбы, в которой вас вспоминают только в трудные дни.\nПервое. От сообщения друга вы напрягаетесь еще до того, как прочитали. Уже думаете, что случилось и сколько времени займет разговор.\nВторое. Вы ставите фильм на паузу, потому что у человека опять тяжелый вечер, и потом уже ничего смотреть не хочется.\nТретье. Вы знаете все подробности его ссоры, а он каждый раз спрашивает, где вы сейчас работаете. Меня злит, как легко это списывают на плохую память.\nЧетвертое. О хороших новостях вы узнаете из ленты. Для вас находятся долгие голосовые про расставание, про новую любовь хватает фотографии для всех.\nПятое. Вам неловко напомнить о деньгах, которые вы одолжили. Он уже ездит в отпуск, а вы все подбираете момент, чтобы своим вопросом ничего ему не испортить.\nСколько у вас совпало?","caption":"Я бы обратил внимание и на обычное сообщение без всякого повода: как вы, что у вас нового.\nМеня зовут Михаил, я психолог, работаю с людьми от двадцати пяти до сорока.\nПодписывайтесь, если хочется еще такого: здесь я говорю об отношениях и том, что нам в них трудно."},{"v":"zhh7","text":"Пять признаков дружбы, в которой вас вспоминают только когда плохо.\nПервое. Вы напрягаетесь, когда видите имя друга на экране, и еще до ответа пытаетесь вспомнить, сколько у вас сегодня сил и сможете ли вы хотя бы полчаса его слушать.\nВторое. Ваш отдых легко отменяется чужим тяжелым вечером: вы выключаете фильм, выходите из душа, переносите сон, потому что человек попросил всего десять минут и вам кажется жестоким сейчас отказать.\nТретье. Вы знаете, с кем он поссорился, что ему написали, кто его обидел, и можете пересказать последние разговоры почти дословно, а он снова спрашивает, как называется компания, в которой вы работаете.\nЧетвертое. Меня раздражает совет просто порадоваться за человека, потому что вы вполне можете радоваться и одновременно замечать, что на счастливый вечер вас почему-то снова не позвали, хотя на самый тяжелый вечер ваше время нашлось сразу.\nПятое. Друг может подробно обсудить с вами, сколько потратил на поездку, ужин, подарок, но ваше предложение вместе сходить куда-нибудь снова оказывается слишком дорогим, слишком сложным, давайте потом, сейчас совсем неудобно.\nСколько совпало у вас?","caption":"Иногда после долгого молчания приходит короткое «Выручишь?», и вы уже набираете ответ, хотя сами собирались рассказать этому человеку важную новость.\nЯ Михаил, психолог, работаю с людьми от двадцати пяти до сорока.\nПодписывайтесь, если хочется еще таких разговоров: здесь я пишу об отношениях и о том, как мы обращаемся с собой."},{"v":"h3h4","text":"Четыре признака, что вы привыкли дружить с теми, кто пропадает, когда у них все хорошо.\nПервое. Вы радуетесь даже тревожному сообщению. «Можно позвонить? Все ужасно». Наконец появился. Что случилось, вы узнаете потом.\nВторое. Ради такого звонка вы отменяете свои планы. Ужин остынет, сериал подождет. Сейчас вы нужны, такое нельзя упустить.\nТретье. О своих трудностях говорить неловко. Уже набрали «у меня тоже тяжелый день» и стерли. У человека же проблемы, куда еще со своими.\nЧетвертое. От его хороших новостей вам становится грустно. Помирились, работу нашли, жизнь наладилась. Вы уже знаете, что дальше.\nПолучается, вы ждете следующего кризиса, чтобы снова побыть друзьями.","caption":"После двух часов разговора иногда выясняется, что вас даже не спросили, как вы. И все равно приятно, что позвонили.\nЯ Михаил, психолог, работаю с людьми от 25 до 40 лет.\nПодписывайтесь, если хочется еще такого: здесь говорим об отношениях и о том, что в них трудно заметить."},{"v":"h6","text":"Четыре признака дружбы, где человек пропадает, когда все хорошо, и возвращается, когда плохо.\nПервое. О хорошем вы узнаете из фотографий. Новые отношения, отпуск. Вам написать времени нет. Но после расставания находится целый вечер на разговор.\nВторое. Ваше общение начинается с «можно тебе позвонить?». И вы уже понимаете: опять что-то случилось. Обычное «как дела?» постепенно вообще исчезает.\nТретье. Ваши радости быстро заканчиваются. Вы рассказываете про повышение, слышите «круто», и дальше сорок минут обсуждаете его начальника. Получается, поговорили. Только про вас опять ничего.\nЧетвертое. Вы радуетесь сообщению с жалобой. Давайте честно, вы уже соскучились. Наконец вас вспомнили, наконец можно поговорить.\nА просто так вам можно написать?","caption":"После такого разговора бывает особенно неловко самому попросить внимания: «У него и так столько проблем». И ваш рассказ опять остается на потом.\nЯ Михаил, психолог, работаю с людьми от двадцати пяти до сорока.\nПодписывайтесь, если хочется еще такого: здесь говорим об отношениях и о том, что трудно сказать вслух."}]},{"id":"r_mama_1","topic":"я злюсь на ребенка, а потом ненавижу себя за это","author":"Ольга","format":"reels_spisok","cards":[{"v":"h6","text":"Четыре признака для мам, которые злятся на ребенка, а потом ненавидят себя за это.\nПервое. После срыва вы отменяете себе отдых. Хотели полежать, пока ребенок спит, теперь драите кухню. Какая пауза, ее еще заслужить надо.\nВторое. Вы боитесь рассказать, как прошел день. Мужу говорите «нормально», хотя плакали вместе с ребенком. Вдруг еще он подтвердит, что вы ужасная мать.\nТретье. Вы обещаете себе больше никогда не злиться. Блядь, даже на работу столько терпения никто от вас не требовал. А тут завтра опять каша на полу, и вы уже заранее виноваты.\nЧетвертое. Чем сильнее вы себя ругаете, тем меньше просите помощи. «Я накричала, мне и исправлять. САМА». Даже когда есть кому подхватить.\nИ сколько отдыха вы себе уже отменили в наказание?","caption":"Иногда даже душ приходится оправдывать: «Я быстро, только голову помою».\nЯ Ольга, психолог, работаю с мамами малышей до трех лет, в декрете.\nЕсли узнали себя, напишите в комментариях свой пункт."},{"v":"h7","text":"Четыре признака, что после злости на ребенка вы наказываете себя еще большей нагрузкой.\nПервое. Вы отменяете собственную усталость. А то, что вы второй день едите стоя, ну подумаешь. Еще и отдыхать собралась, охренела вообще.\nВторое. Запретили играть с розеткой, ребенок плачет, и вы уже готовы предложить ему все игрушки, мультик, печенье. Пусть только перестанет.\nТретье. Вы добавляете себе дел именно тогда, когда сил закончились. Ребенок уже спокойно листает книжку, а вы обещаете еще одну, еще. Спать хочется до тошноты, но закончить чтение страшно: вдруг он решит, что вы его мало любите.\nЧетвертое. Муж предлагает погулять с ребенком, а вы: «Я сама». Ему достанется прогулка, мне тишина? Слишком хорошо для меня. Я злюсь на эту идею, что заботу о ребенке надо использовать как наказание для матери.\nПосле каждого такого раза вы становитесь к себе все жестче.\nСколько еще часов без помощи вы себе назначили за сегодняшний крик?","caption":"Иногда даже душ после срыва кажется незаслуженным удовольствием. Будто сначал
