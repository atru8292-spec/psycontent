<header><h1>Варианты вслепую</h1><span class="n" id="cnt"></span><button id="rev">Показать, где что</button></header>
<main><p class="n">Прочитай тексты каждой темы и отметь: «Живой» (похоже на живого психолога), «Так можно публиковать», «Нейросеть». Один текст в каждой теме настоящий. Ответы сохраняются в этом браузере.</p>
<div id="app"></div>
<div id="score"><h2>Счет по вариантам</h2><div id="tbl"></div></div></main>
<script>
const T=[{"id":"r_mif_1","topic":"«психолог просто слушает и кивает за мои деньги»","author":"Михаил","format":"reels_monolog","cards":[{"v":"zh","text":"Мне совсем не нравится фраза «психолог просто слушает и кивает за мои деньги». Платить за одни кивки действительно странно. Только эта фраза сводит всю работу к тому, что видно снаружи: вы говорите, человек напротив слушает.\n\nУ психолога есть задача: вместе с вами разобраться, что происходит, где вы застреваете и над чем будете работать. Он должен уметь объяснить, зачем задает вопросы и что вы вообще делаете на встречах.\n\nНо после этой фразы вы уже спрашиваете себя: зачем платить, если можно поговорить с другом? Мне что, самому все рассказывать и самому искать выход? А если ничего не меняется, я плохо стараюсь?\n\nВы можете говорить о том, что вас беспокоит, задавать вопросы, сообщать, когда вам что-то не подходит. Вы не обязаны угадывать, как сделать консультацию полезной. За то, чтобы у вашей совместной работы были понятная цель и смысл, отвечает психолог.","caption":"На первой встрече вполне можно спросить, как будут проходить консультации.\nЯ Михаил, психолог. Работаю с людьми, которые впервые обращаются за помощью.\nОтправьте тому, кто сомневается, стоит ли идти."},{"v":"живой","text":"Дети, у которых было сложное детство, очень много думают. Про таких говорят: живут в своей голове. Но я добавлю одну вещь, как психолог, который много работает с такими людьми. Если человек очень много думает, скорее всего, он очень мало чувствует. Потому что он научился прятаться от всего пиздеца в голову. Анализировал обстановку дома, настроение родителей. Там было безопасно, только там был контроль. А чувствовать было больно, страшно и одиноко. Так что бесконечное обдумывание часто способ не встречаться с тревогой. В следующий раз, когда заметишь, что опять жуешь эту мыслительную жвачку, спроси себя по-доброму: котенок, а какое чувство я сейчас не хочу чувствовать? Если узнал себя, в описании есть еще.","caption":""},{"v":"h6","text":"«Психолог просто слушает и кивает за мои деньги». Да, платить за «угу» обидно. Только кивок еще ничего не говорит о том, какую работу делает человек.\n\nВот вы рассказываете: всю неделю работали, в субботу отказались помочь знакомому с переездом. И теперь ругаете себя: «Совсем обленился. Мог бы и помочь». Психолог слушает. Вы думаете: ну понятно, тоже считает меня ленивым.\n\nПодождите, вы уже и за него решили.\n\nВ этом рассказе есть вещь, которую легко пропустить: целая рабочая неделя у вас вообще не считается нагрузкой. А свободная суббота считается долгом перед любым, кто попросит помощи. Получается, чтобы спокойно полежать, вам сначала нужно добиться, чтобы вообще никому ничего от вас не было нужно.\n\nКивок означает, что он следит за вашим рассказом. Согласия с обвинением в лени вы пока от него не получали.\n\nИ как вообще ваша свободная суббота оказалась чужой?","caption":"На первой встрече бывает неловко даже спросить, что сейчас происходит. Особенно если кажется, что специалисту виднее и перебивать его неудобно.\nМеня зовут Михаил, я психолог. Работаю с людьми 25-40 лет, которые впервые идут к психологу.\nОтправьте тому, кто тоже спрашивает: «За что тут платить?»"},{"v":"h3h4","text":"«Психолог просто слушает и кивает за мои деньги». Кивать сорок минут действительно мало.\n\nНо вот вы рассказываете: «Мне было обидно, когда муж на меня накричал. Хотя он устал, у него работа сложная, я тоже выбрала момент…»\n\nПодождите. Вы успели оправдать его раньше, чем договорили про свою обиду. И сами этого даже не заметили.\n\nРабота психолога здесь начинается с вопроса: «А почему его усталость для вас важнее того, что вам больно?»\n\nВы отвечаете за то, чтобы рассказать, как у вас происходит. Психолог отвечает за работу с этим. Просто молча посидеть рядом недостаточно.\n\nВы ведь и дома можете час объяснять, почему с вами так можно.","caption":"Можно прямо спросить психолога: «Что мы сейчас делаем и как это связано с моим запросом?»\nЯ Михаил, психолог. Работаю с людьми 25-40 лет, которые впервые приходят к психологу.\nОтправьте тому, кто пока сомневается, зачем идти."},{"v":"h7","text":"«Психолог просто слушает и кивает за мои деньги».\n\nКивание само по себе никакой ценности работе не добавляет. Я бы тоже хотел понимать, за что плачу.\n\nДопустим, вы рассказываете, как начальник написал вам вечером в выходной. Вы были с семьей, увидели сообщение, открыли ноутбук. Потом весь вечер злились.\n\nИ рассказываете вы примерно так: «У него тоже сроки, я понимаю. Вообще он нормальный человек. И я мог заранее это доделать. Конечно, неприятно, но сейчас у всех такая работа».\n\nВы еще минут десять объясняете, почему начальника можно понять. Психолог слушает. И спрашивает: «А почему вам понадобилось столько объяснений, прежде чем сказать, что вы злитесь?»\n\nИ даже тут хочется добавить: «Хотя я, наверное, преувеличиваю».\n\nЯ считаю, ради таких моментов имеет смысл внимательно слушать.\n\nПри этом один удачный вопрос еще ничего волшебным образом не меняет. И пауза сама по себе глубины разговору не придает. Можно молчать очень многозначительно, толку от этого тоже бывает мало.\n\nЕсли вы уже платите за возможность говорить, почему вопрос «что мы здесь делаем?» должен оставаться при вас?","caption":"На первой встрече можно обсудить, как вы будете понимать, что работа вам полезна. Мне такой вопрос помогает сразу говорить с человеком понятнее.\nМеня зовут Михаил, я психолог, работаю с людьми 25-40 лет, которые впервые приходят к психологу.\nОтправьте тому, кто пока сомневается, зачем идти."},{"v":"zhh7","text":"Я не согласен с фразой «психолог просто слушает и кивает за мои деньги».\n\nДа, психолог слушает. Но одних кивков для работы недостаточно. У разговора должна быть понятная вам цель, психолог задает вопросы, помогает разобраться, что именно происходит, вместе с вами ищет способы справляться с вашей трудностью.\n\nИногда человек впервые может договорить, его никто не перебивает, не торопит, не объясняет, что у других жизнь сложнее.\n\nА после фразы про кивки человек начинает спрашивать совсем другое. Я что, настолько слабый, что сам разобраться не могу? Мне правда придется платить, чтобы меня кто-нибудь выслушал? А вдруг я просто выкину деньги и буду выглядеть дураком?\n\nЯ считаю совершенно разумным хотеть понимать, за что вы платите.\n\nИ все же ответственность за качество помощи нельзя целиком переложить на вас. Вы отвечаете за свои решения, за то, что готовы обсуждать и пробовать, за участие в работе в пределах своих возможностей. У психолога своя ответственность: понимать, что он делает, объяснять это вам, замечать, когда работа буксует, и обсуждать это с вами.\n\nВы можете прийти растерянным и без готового запроса. Организовать профессиональную работу на встрече обязан психолог.","caption":"На первой встрече можно прямо сказать: «Я раньше у психолога не был и пока не понимаю, как это работает». Я бы хотел услышать этот вопрос в самом начале.\n\nМеня зовут Михаил, я психолог, работаю с людьми 25-40 лет, которые впервые обращаются за помощью.\nОтправьте тому, кто сомневается, стоит ли идти к психологу."}]},{"id":"r_mif_1_2","topic":"«психолог просто слушает и кивает за мои деньги»","author":"Михаил","format":"reels_rol","cards":[{"v":"h7","text":"Вы считаете, что психолог просто слушает и кивает за ваши деньги? Совершенно правильно. Я лично за понятный сервис.\n\nПервое.\n\nВас попросили выйти на работу в субботу. Вы согласились. Потом весь вечер злитесь, что опять согласились.\n\nНо психологу почему-то мало. «Что вы подумали, когда вас попросили?» Какая разница? Я же сказал: согласились. Результат есть, субботы нет.\n\nВы отвечаете: «Я подумал, что отказать неудобно». И тут он опять: «Что, по вашему ожиданию, случилось бы, если бы вы отказали?»\n\nВы говорите: «Решат, что я ненадежный сотрудник». Он уточняет: «Кто решит? Вам такое говорили?»\n\nПока вы объясняете, какой вы слабый человек, выясняется, что отказ у вас в голове сразу означает испорченные отношения. Вы еще рта не открыли, уже мысленно лишились уважения, премии и нормальной атмосферы в коллективе. Но мы же договорились: тряпка. Зачем теперь пересматривать?\n\nЯ считаю, специалист обязан уважать вашу версию.\n\nПсихолог?\n\nВы все равно большую часть времени говорили. Он сидел. Иногда спрашивал. Видимых работ мало.\n\nПоэтому при записи сразу уточняйте: «Вы точно будете только кивать?» Иначе есть риск заплатить и лишиться любимого объяснения, почему у вас ничего не меняется.","caption":"Со стороны трудно увидеть, какую работу психолог делает, пока слушает: что уточняет, какие связи замечает, к чему возвращает разговор. При этом решения в вашей жизни остаются за вами.\nМеня зовут Михаил, я психолог, работаю с людьми 25-40 лет, которые впервые идут к психологу.\nПодписывайтесь, если хочется еще такого: здесь говорю о психологии через обычные жизненные ситуации."},{"v":"zhh7","text":"К психологу собрались? Послушайте, я вас бесплатно послушаю и покиваю. Зачем платить за то, что любой нормальный человек умеет? Садитесь, рассказывайте. Только покороче, у меня еще дела.\n\nТак, на работе переживаете. Начальник сухо ответил на сообщение, и вы теперь думаете, что вами недовольны. Понятно. Да забудьте вы. Все, вопрос решили. Видите, даже кивать пока не понадобилось.\n\nА что именно он написал? «Обсудим завтра»? Ну конечно, тут любой занервничает. Хотя, знаете, если вы работу нормально сделали, чего нервничать? Сделали нормально? Тогда перестаньте. Не уверены? Тогда надо было лучше делать. Все же логично.\n\nВы пробовали, и опять начинаете? Значит, плохо пробовали. Тут надо прямо решить. Проснулись утром и решили: сегодня я уверенный человек. Я сам так делаю. Правда, у меня начальника нет, но какая разница, принцип универсальный.\n\nКстати, про сообщения. Мне вчера тоже сухо ответили. Я написал еще раз, потом позвонил, потом спросил у общего знакомого, все ли нормально. И прекрасно успокоился.\n\nЯ, между прочим, уже десять минут вас слушаю. И киваю. Вы заметили? Очень качественно киваю. А вы все еще переживаете.\n\nТолько потом не говорите, что вас никто не слушает. Я слушал, свидетели есть, чай еще даже не остыл.\n\nВсе, идите. В следующий раз приходите уже с хорошими новостями.","caption":"В работе я возвращаюсь к вопросу, какие выводы человек делает из чужого короткого ответа. Одно «обсудим завтра» иногда занимает весь вечер.\nМеня зовут Михаил, я психолог, работаю с людьми от 25 до 40 лет, которые впервые обращаются за помощью.\nПодписывайтесь, если хочется еще такого: здесь я говорю о психологии и о том, как устроена работа с психологом."},{"v":"zh","text":"Здравствуйте, я администратор, помогу вам подобрать психолога, который просто слушает и кивает. Да, за ваши деньги. У нас все продумано.\n\nРассказываете, как опять согласились выйти на работу в выходной, он кивает. Спрашиваете, как отказать начальнику, он кивает поглубже. Очень опытный специалист.\n\nЧто мешает вам отказать? Ой, такие вопросы у нас запрещены. Вдруг вы обнаружите, что уже заранее представляете увольнение, хотя начальник еще даже ничего не сказал. И придется с этим разбираться. Зачем вам такие хлопоты за ваши же деньги?\n\nПопробовать другой ответ? Между встречами? Господи, у вас же выходной.\n\nЯ лично гарантирую: сколько бы вы к нам ни ходили, все останется знакомым. Даже начальник будет доволен.\n\nПроходите, присаживайтесь. Только голову держите ровно, специалисту нужно видеть, куда кивать.","caption":"На первой встрече можно прямо спросить, что мы будем делать с вашей проблемой. Объяснить, как устроена работа, моя ответственность.\nМеня зовут Михаил, я психолог, работаю с людьми от 25 до 40 лет, которые впервые обращаются за помощью.\nПодписывайтесь, если хочется еще такого: здесь я рассказываю о психологии и о том, как проходит терапия."},{"v":"h6","text":"Вы пришли к психологу, чтобы он просто слушал и кивал за ваши деньги? Проходите, я готов. Так. Вы ошиблись в рабочем письме и теперь ждете увольнения. Угу. Начальник написал «зайдите ко мне». Ну все, конечно, увольнение. Киваю. Вы уже мысленно собираете вещи? Продолжайте, у нас еще сорок минут. Спросить, увольняли ли у вас вообще кого-нибудь за опечатку? Зачем портить беседу. Более того, вы ведь сами сказали, что всегда все портите. Я записал. Проверять будем? Что вы, мы же вам доверяем. Получается, что одну опечатку мы уже обсудили, а всю вашу профессиональную пригодность еще успеем. На следующей встрече можете принести другое письмо. Главное, чтобы вы ни в чем не усомнились.","caption":"В КПТ психолог может спросить, на чем держится ваш вывод, и предложить проверить его между встречами.\nМеня зовут Михаил, я психолог, работаю с людьми 25-40 лет, которые впервые обращаются за помощью.\nПодписывайтесь, если хочется еще такого: здесь говорю о психологии понятными словами."},{"v":"h3h4","text":"Коллеги, клиент говорит: «Вы просто слушаете и киваете за мои деньги». Так, главное, продолжайте кивать. Спрашивать, с чем он хочет разобраться, опасно. Появится конкретная задача. Потом еще придется выяснять, что вы вместе делаете и зачем. Нам это надо? Он говорит: «Я опять согласился, хотя хотел отказать». Киваем сочувственно. Спросить, чего он боялся, нельзя. Вдруг выяснится, что он ждет скандала после каждого отказа. Это уже материал для работы, коллеги, осторожнее. А если клиент спросит, что изменилось за месяц? Кивните поглубже. Пусть видит: работа идет.","caption":"Одного кивания для работы мало: я могу предложить проверить мысль «если я откажу, меня разлюбят». Решать, кому и в чем отказать, будете вы.\nЯ Михаил, психолог, работаю с людьми 25-40 лет, которые впервые идут к психологу.\nПодписывайтесь, если хочется еще такого: здесь говорим о психологии на понятных жизненных ситуациях."},{"v":"живой","text":"Уважаемые родители, рассаживаемся. Тема урока: доверие. Как сделать, чтобы ребенок вам доверял? Правильно. Нужно, чтобы он не доверял больше никому. Особенно себе. Чтобы ни одна мысль, которая приходит ему в голову, не вызывала у него доверия. Это первый класс, вторая четверть. Он вам говорит: вы на меня орете. Кто на тебя орет? Никто на тебя не орет, я разговариваю, понятно? Он говорит: вы меня наказываете. Мы не наказываем. Мы воспитываем, это разные вещи. Он говорит: я не могу. Ты все можешь, ты просто не хочешь. Что за вопросы вы задаете? Вы что, тупая? Лично я не обзываюсь. Я выстраиваю гипотезу. Вот. Почувствовали? Сразу доверие между нами возникло. И с ребенком так же. Тогда в семье будут теплые доверительные отношения.","caption":""},{"v":"h8","text":"«Психолог просто слушает и кивает за мои деньги». Одного кивания действительно мало, тут я с вами согласен.\n\nПредставьте: вы рассказываете о ссоре, психолог молчит, и вы уже думаете: скучно рассказываю. Добавляете подробности, объясняете, кто кому кем приходится. Ну вот, еще и психолога надо заинтересовать.\n\nВы пришли со своей болью и тут же взялись развлекать человека, которому заплатили за помощь.\n\nРабота психолога включает и такие вопросы: «Почему мое молчание для вас означает, что вы мне скучны?»\n\nВы приносите то, с чем вам трудно. Интересный рассказ вы ему не должны.","caption":"Можно прийти и десять минут искать слова. Можно сбиться, забыть, с чего начали, сказать: «Я пока не понимаю, как это объяснить».\n\nМеня зовут Михаил, я психолог, работаю с людьми 25-40 лет, которые впервые решаются прийти к психологу.\nОтправьте тому, кто сомневается, стоит ли идти."}]},{"id":"r_vopros_1","topic":"«а зачем мне психолог, если у меня есть подруги»","author":"Ольга","format":"reels_otvet","cards":[{"v":"h7","text":"А зачем мне психолог, если у меня есть подруги? Потому что с подругой вам приходится учитывать еще и вашу дружбу.\n\nВот вы поссорились с мужчиной. Позвонили подруге, рассказали, как он с вами разговаривал, что сказал. Поплакали. Она вас выслушала, разозлилась вместе с вами, сказала: «Все, хватит, собирай вещи». И вы в тот вечер тоже решили, что хватит.\n\nПотом вы помирились.\n\nИ теперь вам надо как об этом сказать подруге? И вы уже заранее слышите: «Ну я так и знала, ты опять к нему вернешься».\n\nБлядь, теперь еще перед подругой объясняться.\n\nИ вы начинаете редактировать рассказ. «Да мы просто поговорили». «Да он вообще понял».\n\nНо подруге вы выдаете версию, которую сможете защитить.\n\nУ психолога можно оставить историю в том месте, где вы сами ничего не понимаете. «Я вернулась. Я скучала. Я до сих пор злюсь. И мне хочется, чтобы вы сейчас со мной согласились, потому что объяснять свой выбор я задолбалась».\n\nУ вас для этого есть отдельное время.\n\nИ вот вопрос: сколько из того, что вы рассказываете подруге, вы заранее поправляете, чтобы она за вас меньше переживала?","caption":"Бывает, подруга после разговора пишет: «Ну что там у вас?» А вы смотрите на сообщение и откладываете ответ, потому что сами еще ничего не решили.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nОтправьте той, с кем хочется это обсудить."},{"v":"h6","text":"А зачем мне психолог, если у меня есть подруги? Потому что с подругами у вас тоже есть привычная роль. Вот вы та, которая ВСЕ вывозит. Выслушаете, приедете, успокоите. И когда вам самой хреново, подруга говорит: «Ну ты сильная, ты справишься». Она вас любит. И привыкла, что вы справляетесь. А вы уже рот открыли попросить помощи и... ладно, чего ее грузить. Блядь, опять справились. У психолога можно разбирать даже то, благодаря чему вас любят близкие. Например, сколько вам стоит каждый раз быть той самой подругой, на которую всегда можно положиться. И куда девается ваше «я больше не могу».","caption":"Иногда даже «спасибо, что ты всегда рядом» хочется услышать с продолжением: «А как ты сама?»\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 22 до 35 лет.\nСохраните, если хочется вернуться к этой мысли."},{"v":"zhh7","text":"А зачем мне психолог, если у меня есть подруги? Я вот сижу с телефоном, только что увидела ролик про то, что лучшая терапия для женщины это вечер с подругами. И там все прекрасно: вас выслушают, обнимут, бывшего обосрут, нового одобрят, заодно решат, увольняться ли вам, какую челку стричь и почему во всем виновата его мать. Полный консилиум, еще и с доставкой еды.\n\nПодруги и психолог делают разную работу.\n\nИ я сама люблю обсудить что-нибудь с близкими, и советы раздаю, когда меня вообще никто об этом не просил. Да, диплом в этот момент молча лежит где-то в стороне.\n\nВы рассказываете подруге, что мама попросила приехать в единственный свободный день, вы собирались просто полежать дома, но уже купили билет. Подруга говорит: ну скажи, что устала. Вы отвечаете: она обидится. Подруга: ну пусть обижается. Только билет у вас уже в телефоне.\n\nПсихолог может задержаться именно здесь. Что для вас случится, если мама обидится? Как у вас в семье вообще обходятся с отказом? Почему мамино недовольство так быстро становится вашей задачей?\n\nХотя бывшего я тоже мысленно могу обосрать. Просто мне еще и работать надо.","caption":"Подруга может помнить вашу маму с выпускного. Психологу придется расспрашивать, и иногда уже в этом рассказе обнаруживаются детали, которые близкие давно считают привычными.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nОтправьте тому, кому сейчас нужен этот разговор."},{"v":"h3h4","text":"А зачем мне психолог, если у меня есть подруги? Чтобы у вас был разговор, в котором можно оставить все внимание себе. Вот вы рассказываете подруге про ссору с мужем. Она слушает, потом говорит: «Ой, у меня тоже такая херня, я вчера всю ночь плакала». И вы уже спрашиваете, что случилось у нее. Вы ее любите, вам важно, как она. С психологом можно занимать весь разговор собой. Его чувства тоже существуют, он сам с ними работает. Вам можно договорить, даже если ваша история занимает ВСЮ встречу.","caption":"Даже с самой близкой подругой можно придержать подробность, потому что она потом будет переживать весь вечер. Иногда еще и успокаивающее сообщение отправляете: «Я уже нормально, не волнуйся».\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nОтправьте тому, кто тоже задается этим вопросом."},{"v":"zh","text":"А зачем мне психолог, если у меня есть подруги? Потому что даже близкой подруге бывает страшно сказать все. Вот сейчас сижу с телефоном, только что увидела совет заменить психолога разговором с подругой. Она и выслушает, и поддержит, и причины найдет, и ваши отношения починит, пока макароны варятся. Блядь, дайте ей поесть. Например, вы молчите о повышении, потому что подруга сейчас без работы, и заранее бережете ее от своей радости. Я сама умею придержать хорошую новость, чтобы никого случайно не задеть. С психологом можно разбирать, как вы решаете, что разрешено рассказать о себе, и почему чужая возможная реакция так вас ограничивает. Подругам я бы все-таки оставила право спокойно доесть. Моим особенно, я разговорчивая.","caption":"Подруга вполне может искренне порадоваться вашему повышению. А вы уже решили за нее и весь вечер обсуждали только ее собеседования.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nСохраните, если этот вопрос у вас тоже возникал."},{"v":"живой","text":"Как понять, что у тебя расстройство личности? Если ты не пролистала это видео, скорее всего, его у тебя нет. Все. Потому что при расстройстве личности человек обычно не сомневается в том, как он думает. Он не сидит и не гадает, все ли с ним в порядке. А если ты сидишь и гадаешь, то, скорее всего, у тебя просто яркие черты характера, с которыми можно прийти к психологу и разобраться. Диагноз по рилсу никто не ставит, и я тоже. Все, тема закрыта, всего хорошего.","caption":""}]},{"id":"r_vopros_1_2","topic":"«а зачем мне психолог, если у меня есть подруги»","author":"Ольга","format":"reels_malysh","cards":[{"v":"h3h4","text":"Вы спрашиваете: «Зачем мне психолог, если есть подруги?» Солнышки, сейчас объясню.\n\nВот вы рассказываете подруге про очередную ссору. Она говорит: «Да пошел он нахер». И вам тепло: моя, понимает.\n\nА потом подруга говорит: «Слушайте, вы ведь тоже его задеваете». Все. Теперь еще надо выяснить, она вообще за кого.\n\nВот тут узелок. Можно начать спорить, оправдываться, беречь подругу от своей злости.\n\nУ психолога можно сказать: «Я сейчас на вас злюсь. Мне кажется, вы меня обвиняете». И мы этот узелок вместе разбираем. Я выдержу, что вам сейчас со мной неприятно.\n\nВам не нужно сначала помириться со мной, чтобы продолжить разговор.","caption":"Подруге тоже бывает нужна поддержка, даже когда вы пришли со своей бедой. На встрече с психологом можно весь час говорить о себе, без очереди «теперь ты».\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 22 до 35.\nПодписывайтесь, если хочется еще таких объяснений про отношения и себя в них."},{"v":"h7","text":"Девочки, вы рассказываете подруге про ссору с парнем, а потом начинаете его защищать. Хотя вообще собирались поплакать.\n\nПредставьте, что разговор с подругой похож на маленькую скамеечку. Вы сидите рядом. Переживает.\n\nВот вы говорите: «Он опять отменил нашу встречу в последний момент. Мне обидно».\n\nОна отвечает: «Да сколько можно! Я уже видеть его не могу».\n\nИ вы вдруг: «Ну подожди, у него правда много работы. Вообще он заботливый. Я просто сегодня расстроилась».\n\nВсе. Уже защищаете его. Блядь, вы же пришли пожаловаться.\n\nНо теперь на вашей скамеечке сидит еще и подружкина злость.\n\nИ вот эту часть я считаю очень важной. Пока вы рассказываете о себе, вы одновременно заботитесь о том, что происходит между вами и подругой.\n\nВернусь к скамеечке. На встрече с психологом место заранее приготовлено для ваших переживаний. Можно принести туда ВСЕ противоречие целиком: «Я на него злюсь. Я его люблю. Мне хочется уйти. Мне хочется, чтобы он меня обнял».\n\nДаже рядом с любимой подругой.\n\nСколько места для вас остается в вашем разговоре?","caption":"Иногда после откровенного разговора хочется написать подруге: «Ты только не переживай, у меня все нормально». И разговор о вашей боли продолжается уже заботой о ней.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 22 до 35 лет.\nПодписывайтесь, если хочется еще таких разговоров: здесь про отношения, семью и то, что трудно сказать вслух."},{"v":"живой","text":"Большие тети-дяди тебе этого не скажут, поэтому у тебя сердечко бо-бо, животик бо-бо, и бабайки в голове пугают. Сейчас тетя расскажет, как бабайкам дать пизды.\nТы думаешь, что бабайки настоящие. Если нападешь на бабайку, бабайки дадут тебе пизды. Ты будешь маленький и беззащитный, все будут смеяться и бросят тебя.\nПоэтому ты от бабаек убегаешь. Но бабайки придуманные. Вот тут мир, вот тут ты, а вот тут твои бабайки.\nЕсли бабайки придуманные, ты на них наорешь, пошлешь нахер, и ничего не случится. Они так и останутся придуманными. Мир не меняется. Меняются глаза.","caption":""},{"v":"zh","text":"Милая, я против идеи, что с хорошими подругами психолог уже лишний. Вот вы опять сидите у подруги на кухне, рассказываете, как мама обиделась на ваше решение.\n\nСейчас мне скажут: ну конечно, психолог пришла, подруг отменяет, деньги за разговоры хочет.\n\nДа, деньги за работу я беру. И подруга правда может очень помочь.\n\nТолько представьте: вы пришли со своим тяжелым рюкзачком, она со своим. Вы слушаете друг друга, делитесь, иногда придерживаете чужой груз. И блять, у обеих уже плечи болят.\n\nВ терапии можно весь разговор разбирать ваш рюкзачок. Что туда попало, почему вы это носите, почему каждый раз соглашаетесь взять еще. Психологу при этом своя очередь выговориться не нужна.\n\nДружба и терапия совместимы.","caption":"Иногда самое трудное начинается еще до разговора: вы уже решаете, что подруга сегодня устала и вашу историю лучше придержать. Я бы оставила место и для этой трудности.\nЯ Ольга, психолог, работаю с девушками и женщинами.\nПодписывайтесь, если хочется еще таких разговоров: здесь я пишу про отношения, семью и то, как в них бывает трудно."},{"v":"zhh7","text":"Хорошие мои, я против идеи, что психолог вам точно ни к чему, если есть подруги. Вот вы рассказали подруге, что опять согласились приехать к маме, хотя собирались отдохнуть, и теперь сидите злитесь.\n\nДа, я психолог, за встречи со мной платят. Подруги еще и чаем напоят. Тут у них серьезное преимущество.\n\nУ вас внутри клубочек. Там и злость на маму, и нежность к ней, и желание побыть дома, и страх, что она обидится.\n\nА у подруги свой клубочек.\n\nИ вот она говорит: ну съездите, мама же скучает, моя тоже скучает, я стараюсь приезжать.\n\nВы ее любите. И теперь вам хочется объяснить, что вы тоже хорошая дочь, вы тоже стараетесь, просто устали.\n\nОх, блять, еще и тут надо объясняться.\n\nНа встрече с психологом можно дольше оставаться с вашим клубочком.\n\nМне важно, чтобы в таком разговоре вы могли сказать даже то, с чем я лично не соглашусь, и нам хватило места это обсудить.\n\nПоэтому я бы предложила посмотреть, что происходит с вами, когда близкий человек отвечает на вашу жалобу своим мнением.\n\nВы продолжаете рассказывать? Или начинаете оправдываться?","caption":"Иногда подруге самой сейчас тяжело, и вы откладываете свой разговор до лучших времен. Я считаю важным учитывать и это.\nМеня зовут Ольга, я психолог, работаю с молодыми женщинами.\nПодписывайтесь, если хочется еще таких разговоров: здесь я говорю об отношениях, семье и чувствах."},{"v":"h6","text":"Вы рассказываете подруге, как вам плохо, и тут же добавляете: «Ой, ладно, у тебя своих проблем хватает». Девочки, давайте я объясню, что тут происходит.\n\nПредставьте, что у вас рюкзачок. Там лежит ВСЕ, что накопилось. Вы начинаете доставать: вот ссора с мамой, вот страх остаться одной. Подруга слушает, грустнеет. И вы такая: «Блядь, еще и ее расстроила».\n\nНачинаете складывать тяжеленькое обратно. Подругу жалко. Вам важно, чтобы ей рядом с вами тоже было хорошо.\n\nНа встрече с психологом время выделено вам. Можно достать из рюкзачка даже вот это: «Я боюсь, что вам уже тяжело меня слушать». Можно вместе разобраться, почему вы так бережете того, кому пришли рассказать о своей боли.\n\nЗабота о слушателе тоже занимает место в разговоре.","caption":"Иногда даже перед встречей с подругой вы уже выбираете, какую часть истории она выдержит. Мне как психологу важно услышать и то, что осталось за пределами этого отбора.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nПодписывайтесь, если хочется еще таких разговоров про отношения и то, как нам в них живется."}]},{"id":"r_post_1","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","author":"Юлия","format":"reels_spisok","cards":[{"v":"zh","text":"Пять признаков девушки, у которой весь вечер зависит от того, напишет ли он.\nПервое. Тело реагирует на каждый звук телефона. Плечи напрягаются, рука уже тянется к экрану, даже если ты знаешь, что это рабочий чат.\nВторое. Отдых все время на паузе. Фильм идет, но ты перематываешь одну сцену, потому что опять проверяла переписку.\nТретье. Подруге отвечаешь через раз. Ее голосовое подождет, вдруг сейчас придет его сообщение.\nЧетвертое. Хорошую новость оставляешь на потом, расскажешь, когда он спросит про твой день.\nПятое. На доставку жалко денег, а платный расклад о том, напишет ли он, уже лежит в корзине.\nСколько совпало?","caption":"Иногда сообщение приходит, и ты специально ждешь перед ответом. Пусть тоже подумает, где ты, хотя сама все это время держишь телефон в руке.\nЯ Юлия, психолог, работаю с девушками в начале отношений.\nОтправь той, кому сейчас это знакомо."},{"v":"живой","text":"Пять признаков, что человек прошел в жизни настоящий ад. Первый. Ему неловко, когда о нем искренне заботятся или делают комплименты. Забота для него что-то непривычное, с подвохом: я теперь что-то должен. Второй. Ему физически больно просить о помощи. Он лучше умрет. Третий. Он считывает настроение людей за полсекунды. По голосу, по тому, как человек моргает, как открывает дверь. Четвертый. Он не умеет отдыхать без чувства вины. Если ничего не делает, кажется, что сейчас кто-то придет и накажет за безделье. И пятый. Когда в жизни все хорошо, ему жутко тревожно. Мозг привык, что тишина бывает перед настоящим лютым пиздецом. Сколько пунктов насчитали у себя?","caption":""},{"v":"h7","text":"Четыре признака того, что, пока он не пишет первым, ты весь вечер пытаешься понять, насколько ты ему нужна.\nПервое. Включаешь сериал, кладешь телефон рядом, экраном вверх. Через несколько минут уже понятия не имеешь, о чем там говорят.\nВторое. Почему вчера так ответила? Почему много рассказывала? Почему первой закончила разговор? Вот тут я бы остановилась. Он несколько часов молчит, а ты уже проверяешь, достаточно ли хорошо себя вела.\nТретье. Написать самой хочется, но ты запрещаешь себе. Сообщение уже придумано, там обычное «как день?». И тут начинается: я вчера писала, теперь его очередь. Сериал идет дальше, ты опять пропустила половину. Зато первой не написала.\nЧетвертое. Его теплый ответ может тебя вообще не успокоить. Потому что, если ты все-таки напишешь, он ответит, спросит про тебя, разговор пойдет, внутри останется: ну это же я начала. Контакт уже есть, он с тобой разговаривает, а ты мысленно вычитаешь собственное участие. Если ты напишешь первой, его нежность уже не считается?","caption":"Можно даже выключить уведомления и все равно каждые пять минут открывать чат. Особенно обидно, когда он наконец пишет, а ты сначала считаешь, сколько часов прошло.\nМеня зовут Юлия, я психолог, работаю с девушками 20-30 лет, которые начинают отношения.\nСохрани, если хочешь вернуться к этому разговору."},{"v":"h3h4","text":"Четыре признака у девушек, которые весь вечер ждут, когда он напишет первым.\nПервое. Тебе трудно заняться своим. Сериал идет, рабочий файл открыт, но вдруг он написал, пока ты смотрела в ноутбук?\nВторое. Ты откладываешь даже приятное. Подруга зовет поболтать, а ты думаешь: сейчас он появится, и я буду занята. Он еще ничего не предложил. Ты уже освободила вечер.\nТретье. От его молчания ты становишься себе менее симпатичной. Еще днем нравилась себе на фото. Теперь увеличиваешь лицо: может, зря я это выложила?\nЧетвертое. Сообщение пришло, тебе сразу легче. И вдруг отвечать даже лень.\nА поговорить с ним тебе вообще хотелось?","caption":"Написать самой тоже бывает трудно: хочется убедиться, что он сам захотел тебя найти. Даже готовое сообщение стираешь.\nЯ Юлия, психолог, работаю с девушками 20-30 лет, которые начинают отношения.\nСохрани, если узнала свой вечер."},{"v":"h6","text":"Четыре признака девушки, которая весь вечер ждет, когда он напишет первым.\nПервое. Твои планы становятся условными. Фильм включила, но каждые две минуты проверяешь телефон. Вдруг он предложит встретиться? Жалко потратить вечер.\nВторое. Тебя раздражают чужие сообщения. Телефон загорелся, ты хватаешь его, а там подруга прислала видео. Ну почему опять ты. И самой стыдно, подруга вообще ни в чем не виновата.\nТретье. Ты заранее оправдываешься перед ним. Он еще ничего не написал, а ты уже придумываешь, чем была занята, чтобы выглядеть человеком, у которого есть дела. Дела, кстати, есть. Ты их отложила.\nЧетвертое. После его сообщения тебе вдруг хочется отложить телефон. Душ принять, поесть, фильм досмотреть. Все, про меня помнят. Теперь можно заняться собой.\nА до его сообщения твой вечер кому принадлежал?","caption":"Даже написать первой бывает страшно: тогда уже не узнаешь, вспомнил бы он сам. И сидишь с готовым сообщением, стираешь, набираешь снова.\nЯ Юлия, психолог, работаю с девушками 20-30 лет, когда отношения только начинаются.\nОтправь той, кому сейчас это знакомо."},{"v":"zhh7","text":"Пять признаков того, что ты уже подстраиваешь весь вечер под мужчину, который сам тебе не пишет.\nПервое, тело реагирует на каждый звук телефона. Ты еще не посмотрела на экран, а уже задержала дыхание, схватила телефон, и плечи поднялись. Там уведомление о доставке.\nВторое, отдых постоянно прерывается. Включила сериал, поставила на паузу, открыла переписку, вернулась к сериалу и уже забыла, о чем они разговаривают.\nТретье, на остальных людей у тебя заканчивается терпение. Подруга присылает голосовое, ты видишь уведомление и думаешь, ну зачем сейчас, я же жду. Меня цепляет, как быстро в таком ожидании люди, которые сами хотят с тобой поговорить, начинают мешать.\nЧетвертое, хорошая новость остается какой-то незаконченной. Например, на работе приняли твою идею, ты весь день хотела рассказать ему, написала, а он молчит.\nПятое, тебе становится легко потерять деньги, лишь бы остаться свободной на случай его сообщения. Он тебя никуда не позвал. Сколько пунктов у тебя совпало?","caption":"Когда он наконец пишет, можно так обрадоваться, что уже забыть, каким был весь вечер до этого. Я бы оставила эту часть тоже в разговоре об отношениях.\nЯ Юлия, психолог, работаю с девушками, у которых отношения только начинаются.\nСохрани, если хочется вернуться к этому позже."}]},{"id":"r_post_1_2","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","author":"Юлия","format":"reels_monolog","cards":[{"v":"h3h4","text":"Он не пишет первым, и ты весь вечер проверяешь телефон.\n\nОткрыла чат. Закрыла. Через минуту опять открыла. Уже набрала «как день?», потом стерла. Ну потому что вдруг навязываешься. Вдруг он ответит из вежливости. Лучше подождать.\n\nА чего ты ждешь? Чтобы он тоже захотел поговорить? Да. И еще чтобы можно было наконец показать, как ты сама этого хочешь.\n\nВот он написал, и сразу можно отправить смешное видео, рассказать про день, спросить про встречу. Все это у тебя было готово еще два часа назад.\n\nКак будто скучать по нему можно только после его сообщения.","caption":"Бывает, даже подруге стыдно сказать, что ждешь: ей уже три раза объявила, что тебе все равно.\nЯ Юлия, психолог, работаю с девушками, которые только начинают отношения.\nПодписывайся, если хочется еще таких разговоров про влюбленность, тревогу и близость."},{"v":"zhh7","text":"Мои дорогие девочки, которые ждут, когда он напишет первым, ну что, телефон уже протерли до дыр?\n\nВот ты поела, включила сериал, положила телефон рядом. Экраном вверх, конечно. Вдруг напишет. Через пару минут проверяешь, работает ли звук. Работает. Потом открываешь переписку, хотя уведомления не было. Зачем? Вдруг пропустила.\n\nОн был в сети? Был. И что, легче стало? Ну куда там. Теперь у тебя новый вопрос: если он заходил, почему мне ничего не написал? До этого ты хотя бы могла думать, что занят. Теперь приходится придумывать, чем именно он занят и почему это занятие интереснее тебя.\n\nТы листаешь вашу переписку и ищешь момент, в котором стала ему меньше нравиться.\n\nНайдешь какую-нибудь свою фразу. Обязательно найдешь. Даже обычное «как прошел день» при таком настроении начинает выглядеть подозрительно. Слишком заинтересованная. Слишком доступная. Ну все, выдала себя с головой, спросила человека про день.\n\nПочему?\n\nЯ каждый раз думаю, сколько значения мы можем втиснуть в этот маленький пустой экран. А ты вроде просто сидишь дома в носках, с остывшим чаем, и ждешь короткое «как ты?».\n\nИ это он еще ничего не написал.","caption":"Даже сообщение от доставки в такой вечер открываешь с надеждой. Потом злишься на несчастную пиццу за то, что она опять приехала вместо него.\nМеня зовут Юлия, я психолог, работаю с девушками, которые только начинают отношения.\nПодписывайся, если хочется еще таких разговоров о тревоге, симпатии и ожидании взаимности."},{"v":"zh","text":"Девочки, которые весь вечер ждут, когда он напишет первым, я бы у вас телефон аккуратно забрала. Родная, ты уже погоду открыла, лишь бы снова взять его в руки.\n\nЧто, вдруг сообщение пришло без звука? Проверила. Пусто. Почему через минуту опять туда? Потому что хочется наконец увидеть: он сам вспомнил, сам захотел, значит, я ему нужна.\n\nНаписать самой страшно? Да, тогда останется вопрос: а без моего сообщения он бы вообще объявился?\n\nНу подожди. Ты ведь собиралась просто поужинать.\n\nА теперь телефон лежит рядом с тарелкой, экраном вверх, и каждый раз, когда он гаснет, ты его трогаешь. Как будто там что-то варится и надо проверять готовность.\n\nДевочка моя, за этот вечер ты уже успела ему надоесть, разочаровать его, проиграть какой-то другой девушке и мысленно уйти с гордо поднятой головой. Все сама, без единого сообщения.\n\nОн еще молчит. Ты уже мысленно рассталась и ждешь, когда он тебя вернет.","caption":"Иногда еще и подругу просишь написать тебе, чтобы проверить, работают ли уведомления. И очень хочется, чтобы дело оказалось в телефоне.\nЯ Юлия, психолог, работаю с девушками, у которых отношения только начинаются.\nПодписывайся, если хочется еще таких разговоров про отношения и тревогу в них."},{"v":"живой","text":"Умное говно, которое вам подают под соусом психологии: «ты сама притянула себе такого мужика». Давайте так. Мы никого не притягиваем. Мы просто живем свою жизнь, мы не управляем потоками вселенной и не знаем, кто к нам придет. Самое опасное в этой фразе, что она заставляет копаться в себе в поисках причины чужого говна. А почему я его притянула? А что со мной не так? Может, у меня с мамой плохие отношения? Стоп. В ваших руках другое. Оставить этого человека в жизни или вышвырнуть его нафиг. Сколько времени вы позволили ему остаться и на каких условиях.","caption":""},{"v":"h6","text":"Он не пишет первым, а ты весь вечер проверяешь телефон. Открыла переписку, закрыла. Через минуту снова открыла. Ну да, вдруг сообщение появилось, а телефон решил тебе об этом не говорить.\n\nТы уже придумала, что написать. Даже набрала: «Как день?» И стерла. Вчера ты первая написала. Сегодня надо выдержать.\n\nИ вот тут у тебя появляется условие: хотеть с ним поговорить можно, когда он сам тебя позвал. Тогда ты спокойно ответишь, спросишь про день, расскажешь про свой. Только пусть он начнет.\n\nА если написать самой? Может, он отвечает из вежливости? Может, я навязываюсь? Может, без меня он вообще бы про меня не вспомнил?\n\nТы уже ждешь подтверждения, что тебе можно быть такой заинтересованной. Прямо такой, какой ты сейчас сидишь с телефоном в руке.\n\nВот он написал. Ты обрадовалась. И сколько теперь будешь ждать, прежде чем ответить, чтобы он не понял, как сильно ты ждала?","caption":"Особенно обидно, когда он потом отвечает тепло. Даже злиться вроде неудобно.\nМеня зовут Юлия, я психолог, работаю с девушками 20-30 лет, когда отношения только начинаются.\nПодписывайся, если хочется еще таких разговоров про отношения и все эти «что он обо мне подумает»."},{"v":"h7","text":"Он не пишет первым, и ты весь вечер проверяешь телефон, хотя сама могла бы написать ему за десять секунд. Но вот именно первой и не хочется. Потому что тогда ты так и не узнаешь: он вообще собирался про тебя вспомнить?\n\nПроверила.\n\nИ начинается этот вечер. Ты смотришь сериал, пропускаешь кусок, возвращаешь назад. Берешь телефон, кладешь телефон. Уже придумала, что ему написать. Можно скинуть смешное видео. Можно спросить, как прошел день. Даже набрала «ну как ты там?» и стерла. Потому что хочется, чтобы он сам. Сам.\n\nЯ думаю, вот это «сам» здесь очень важное. Ты ждешь, что у него посреди его обычного вечера появится мысль о тебе. Без напоминания.\n\nИ тут я чуть в сторону уйду. Мы ведь умеем обесценить даже то, чего очень ждали. Он наконец написал, ты выдохнула, улыбнулась. Потом посмотрела на время: почти одиннадцать. А почему так поздно? Чем он был занят весь вечер? И вот ты уже читаешь его «как дела?» и думаешь: наверное, просто скучно стало.\n\nА ты пытаешься получить ответ до сна, чтобы завтра уже знать, как себя с ним вести.\n\nИ сколько вечеров ты готова отдать одному вопросу: «Если я не напомню о себе, ты меня вспомнишь?»","caption":"Иногда самое обидное сообщение в такой вечер приходит от доставки. Уже успела обрадоваться.\nЯ Юлия, психолог, работаю с девушками, которые только начинают отношения.\nПодписывайся, если хочется еще таких разговоров про отношения и то, что происходит у тебя внутри."}]},{"id":"r_tg_1","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","author":"Михаил","format":"reels_malysh","cards":[{"v":"живой","text":"Если вы не можете перестать листать рилсы и заняться делом, я как клинический психолог хочу терапевтически спросить. А может быть, вы... ну... заебались? А? Я понимаю, вы уже записали себя в конченые. Но вдруг есть маленький шанс, что вы в ахуе от нагрузки, и мозг пытается залипнуть хоть на чем-то приятном. А? Думаете все-таки, что ленивая скотина? Записала. Ну и все же предлагаю попробовать выключить. Нет, не рилсы, не пугаемся. Бесконечный поток требований к себе. Как вам идея? Вдруг дело в нем. Так, навскидку.","caption":""},{"v":"zh","text":"Хорошие мои, я психолог, и я против того, чтобы вы прямо сейчас записывали себя в худшие сотрудники. Да, пока смотрите этот ролик.\n\nЗадам профессиональный вопрос. Медленно.\n\nВы сегодня правда ничего не смогли сделать?\n\nНичего?\n\nПисьмо отправили. Задачу закрыли. Но это же ерунда, любой сумеет. Зато в таблице ошиблись, и вот уже страшно: сейчас вас раскусят.\n\nУ вас внутри маленькая лупа. Вы наводите ее на каждую ошибку, рассматриваете, пугаетесь. Все, что получилось, остается за краем.\n\nУдобно вы себя проверили. Сразу с приговором.\n\nДавайте лупу на готовый отчет наведем. Пусть тоже побудет важным.\n\nСам он себя не сделал.\n\nВсе, я пошел.","caption":"На удаленке особенно легко решить, что коллеги весь день работают без заминок. Их переписки с вопросами и переделанные черновики вам просто не видны.\nЯ Михаил, психолог, работаю с теми, кто трудится в офисе и на удаленке.\nНапишите в комментариях одну рабочую задачу, которую вы зря считаете ерундой."},{"v":"h7","text":"Вы боитесь, что на работе вас раскусят, хороший мой человек.\n\nИ вы сидите на созвоне, взрослый специалист, у вас работа, задачи, зарплата. А внутри: «Только бы меня сейчас ничего не спросили».\n\nДавайте я покажу одну маленькую печать. На ней написано: «Повезло».\n\nПредставьте, вы закончили сложную задачу. Разобрались, уточнили детали, исправили то, что сначала пошло криво. На встрече руководитель говорит: «Хорошо получилось, спасибо».\n\nУмница.\n\nНо тут появляется печать.\n\n«Повезло».\n\nЗадача просто подходящая попалась. Коллега подсказал. Руководитель сегодня добрый. Да и вообще, если бы они знали, сколько времени вы потратили…\n\nВсе.\n\nИ дальше на этой же встрече вас спрашивают про деталь, которую вы пока не проверили. Вы говорите: «Уточню и вернусь».\n\nОй.\n\nТеперь вы верите себе сразу: «Я ничего не знаю».\n\nПолучается, что у этой печати удивительное расписание. Когда вы справились, она тут как тут. Когда чего-то не знаете, она отдыхает.\n\nЯ считаю, это очень жестокий способ оценивать свою работу.\n\nИ мне хочется спросить: сколько раз вам нужно справиться, чтобы слово «повезло» наконец перестало объяснять вообще все?","caption":"Особенно легко поставить эту печать, когда работа далась с усилием: «Настоящий специалист сделал бы быстрее». Хотя в рабочем результате обычно никто не видит ваши черновики.\nМеня зовут Михаил, я психолог для людей от 25 до 35, которые работают в офисе и на удаленке.\nНапишите в комментариях свое объяснение, почему успех опять «не считается»."},{"v":"h3h4","text":"Хорошие мои, вы боитесь, что на работе вас раскусят и поймут: вы ничего не умеете?\n\nПредставьте, внутри есть коробочка с такой надписью. Вы складываете туда все, что про себя знаете. Только, смотрите, что получается.\n\nСдали сложную задачу. Вам говорят: «Отличная работа». Вы уже тянетесь положить это в коробочку, но тут: «Да просто повезло. Тема знакомая попалась». Все, убрали.\n\nА ошибку положили. Аккуратненько. Даже маленькую.\n\nКонечно, с такой коробочкой страшно идти на совещание.\n\nДавайте положим туда и выполненную задачу. Вместе со всеми вашими «повезло».\n\nЭту работу все равно сделали вы.","caption":"После повышения даже обычный вопрос коллеге может казаться признанием: «Зря вы меня сюда взяли».\nЯ Михаил, психолог, работаю со специалистами от 25 до 35 лет в офисе и на удаленке.\nЕсли знакомо, напишите в комментариях «повезло»."},{"v":"zhh7","text":"Хорошие мои, я психолог, и я хочу притормозить ваше «сейчас на работе поймут, что я ничего не умею».\n\nЧто?\n\nЧто именно не получилось?\n\nВот, допустим, сегодня на созвоне вас спросили, почему в отчете такая разница. Вы посмотрели на экран. Ответа сразу нет. Нужно открыть таблицу, проверить, вспомнить, откуда взялись данные. И вы говорите, что уточните и вернетесь с ответом.\n\nВсе.\n\nНо пока коллега задает следующий вопрос, у вас внутри уже достали большой штамп. На нем написано: «Ничего не умеет». И хлоп вам на весь рабочий день.\n\nЯ бы этот штамп пока накрыл колпачком. Пусть посидит тихонько.\n\nИ дальше вы идете пить чай, отвечаете в чате, продолжаете работать, но этот штамп уже с вами. Кто-то написал «можем обсудить?» и вы читаете это с готовым выводом: ага, заметили. Сейчас будут спрашивать, как я вообще сюда попал.\n\nХотя в сообщении пока только просьба обсудить.\n\nПоэтому чужой вопрос так пугает. Вы сами заранее решили, что он сейчас подтвердит.\n\nТак. Штамп закрыли. Мне пора.\n\nЧто конкретно вы сегодня не смогли сделать?","caption":"Уточняющий вопрос руководителя особенно трудно читать в чате: интонацию приходится додумывать самому.\nЯ Михаил, психолог, работаю с молодыми специалистами в офисе и на удаленке.\nЕсли хочется, напишите в комментариях слово «раскусят»."},{"v":"h6","text":"Хорошие мои, вы боитесь, что на работе вас раскусят и поймут, что вы ничего не умеете? Даже когда отчет сдали и начальник доволен.\n\nПредставьте, у вас внутри копилка: туда складывается все, что вы уже умеете. Сделали отчет, вот вам монетка.\n\nНо тут вы говорите: «Там просто было. И коллега помог». И монетку обратно достаете. С другой работой то же самое: «Повезло».\n\nПолучается, вы работаете, работаете, а в копилке пусто. Конечно, страшно: вдруг завтра спросят, что вы умеете, и показать нечего.\n\nДавайте эту монетку оставим. Да, коллега помог. Да, задача была знакомая. В этом отчете есть ваша работа.","caption":"Фраза «любой бы справился» тоже обнуляет сделанное. При этом от коллег мы редко требуем, чтобы каждое их задание было подвигом.\nЯ Михаил, психолог, работаю с людьми от 25 до 35 лет в офисе и на удаленке.\nНапишите в комментариях свое любимое объяснение, почему успех «не считается»."}]},{"id":"r_tg_1_2","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","author":"Михаил","format":"reels_monolog","cards":[{"v":"живой","text":"Иногда нужно очень сильно охуеть, чтобы жизнь начала меняться. Охуеть это когда ты просыпаешься и видишь все как есть, и тебе противно, потому что ты наконец поняла правду. Больно, неприятно, но с этого все и сдвигается. Охуеть это когда видишь свой вклад: ты это выбирала, терпела и ничего не делала. Хорошая новость в том, что раз когда-то ты это выбрала, теперь можешь от этого отказаться. Охуеть это когда перестаешь ждать, что он изменится, деньги упадут с неба, проблемы решатся сами. Охуеть это когда выбираешь себя, даже если другим от этого неудобно. Эгоизм тут ни при чем. Ты просто вспомнила, что ты тоже есть.","caption":""},{"v":"h7","text":"«Боюсь, что на работе меня раскусят и поймут, что я ничего не умею». Задачи закрываются, зарплата приходит, коллеги к вам обращаются. А внутри все равно: ну пока пронесло. Пока никто особенно внимательно не смотрел.\n\nДопустим, вы подготовили отчет. Разобрались в данных, нашли расхождение, уточнили у коллеги, переделали выводы. Руководитель пишет: «Спасибо, хороший отчет». Что вы себе говорите? «Ну, там задача простая была. И коллега помог. И вообще, он, наверное, толком не читал».\n\nВсе. Отчет приняли, а себе вы его не засчитали.\n\nЯ считаю, это самое выматывающее в таком страхе.\n\nКстати, про помощь коллеги. А вы можете задать один вопрос и потом мысленно отдать коллеге весь свой отчет. Он подсказал, значит, без него я бы ничего не смог. Вот, опять свое участие стерли.\n\nА потом в этом же отчете находят опечатку. И тут никаких скидок. Тут сразу: «Я так и знал. Сейчас начнут проверять остальное».\n\nПредыдущий отчет уже забыт. Все начинается с нуля.\n\nКак вы вообще сможете убедиться, что умеете работать, если каждый раз, когда получается, вы говорите: «Это не считается»?","caption":"Иногда даже сохраненное «спасибо» от руководителя неловко перечитывать: будто слишком много значения придаете обычному сообщению. Собственную опечатку при этом помните месяцами.\n\nЯ Михаил, психолог, работаю с людьми 25-35 лет, в офисе и на удаленке.\nЕсли хотите обсудить это на консультации, напишите мне в личные сообщения."},{"v":"h3h4","text":"«На работе меня скоро раскусят. Просто пока задачи попадались легкие».\n\nВы подготовили отчет, руководитель доволен. И вы тут же: «Да ладно, там любой бы справился». Хотя вчера сидели над ним весь вечер.\n\nВсе, что получилось, сразу списываете: задача простая, коллега подсказал, повезло.\n\nИ что, следующий удачный отчет поможет? Вы ведь и ему найдете объяснение.\n\nВы каждый раз меняете условия зачета, как только справились. Что вообще должно получиться, чтобы вы это себе засчитали?","caption":"В резюме бывает проще признать свои достижения: там хотя бы приходится написать, что именно вы сделали.\nМеня зовут Михаил, я психолог, работаю со специалистами от 25 до 35, в офисе и на удаленке.\nПодписывайтесь, если хочется еще таких разборов."},{"v":"h6","text":"«Боюсь, что на работе меня раскусят». Вы вчера нормально провели встречу, ответили на вопросы, руководитель сказал: «Хорошая работа». А вы уже нашли объяснение: просто вопросы были легкие. И презентацию вы делали по готовому шаблону. Ну, с шаблоном любой справится, да?\n\nРабота сделана, но в вашу пользу она не засчитывается. Повезло. Помогли. Попалась простая задача. Получается, вы каждый раз сдаете экзамен и каждый раз выбрасываете ведомость с хорошей оценкой.\n\nИ что, следующую встречу вести спокойнее? Конечно, страшно. У вас ведь снова как будто нет ни одного подтверждения, что вы умеете работать. Хотя вчера оно было. Вы его собственноручно вычеркнули.\n\nБолее того, даже подготовку вы записали себе в минус: «Настоящий специалист и так бы знал».\n\nА какой результат вы вообще согласитесь засчитать себе?","caption":"Готовые шаблоны и помощь коллег входят в обычную рабочую жизнь. В вакансии ведь редко пишут: «Все изобретать самостоятельно, вопросы запрещены».\nМеня зовут Михаил, я психолог, работаю с людьми 25-35 лет, в офисе и на удаленке.\nПодписывайтесь, если хочется еще таких разборов."},{"v":"zh","text":"Я называю это обнулением: вы справились с работой, и тут же объяснили себе, почему это ничего не говорит о ваших способностях.\n\nОбнуление это когда вы отправили отчет, руководитель написал, что все хорошо, и вы уже нашли объяснение: задача простая, времени было достаточно, да и коллега подсказал. Ну конечно, такое любой мог сделать.\n\nОбнуление это когда вы замечаете, что сами собрали этот отчет, сами разобрались, сами проверили, и все равно вычеркиваете свою работу из доказательств, что вы что-то умеете. Коллега ведь подсказал. Значит, не считается.\n\nОбнуление это когда вы ждете, что следующий удачный отчет наконец вас убедит, и снова находите причину его не засчитывать. Сколько их тогда нужно? Да сколько угодно, если каждый раз начинать с нуля.\n\nОбнуление это когда хорошему отзыву вы верите до первой правки, и вот руководитель просит уточнить один пункт, и вы думаете: ну все, заметил. Теперь поймет, что я вообще ничего не умею.","caption":"Особенно убедительным кажется отзыв, в котором нашли недочет. Его вы можете помнить дословно, хотя сообщение с благодарностью уже потерялось в переписке.\nЯ Михаил, психолог, работаю с людьми, которые работают в офисе и на удаленке.\nЕсли хотите обсудить это на консультации, напишите мне в личные сообщения."},{"v":"zhh7","text":"Обнуление. Вот как я называю эту привычку считать все свои рабочие результаты случайностью, и я считаю ее очень несправедливой к себе.\n\nОбнуление это когда вы отправляете отчет, который собирали весь день, руководитель пишет, что все хорошо, можно отдавать дальше, и вы сразу находите объяснение, почему это ничего про вас не говорит. Задача была простая, данные уже лежали в папке, коллега подсказал, как лучше оформить.\n\nОбнуление это когда в том же отчете находят одну неточность, и тут вы уже совершенно уверены, кто за нее отвечает. Вы. Без оговорок про усталость, спешку, путаную задачу. Причем я сейчас чуть в сторону скажу: отвечать за ошибку вполне нормально, ее можно исправить. И что, после исправления легче? На минуту. Потом вы вспоминаете, что ошибку успели увидеть.\n\nПотому что этот опыт вы каждый раз списываете.\n\nОбнуление это когда из всего рабочего дня вы выбираете ту самую неточность, вспоминаете ее вечером, пока чистите зубы, и отчет, который вы сделали и который уже используют, целиком исчезает из вашей оценки себя. Остается только эта ошибка. И мысль: вот теперь они точно поняли, кого наняли.","caption":"Иногда похвалу еще и неловко пересказать близким: будто вы хвастаетесь. Зато рабочую ошибку можно обсуждать весь вечер.\nМеня зовут Михаил, я психолог, работаю с людьми в офисе и на удаленке.\nЕсли хотите прийти на консультацию, напишите мне в личные сообщения."}]},{"id":"r_car_1","topic":"как поддержать подругу с депрессией и не сделать хуже","author":"Ольга","format":"reels_spisok","cards":[{"v":"zhh7","text":"Пять признаков, что вашей подруге с депрессией тяжело даже от того, чем вы хотите ее порадовать.\nПервое. Ей тяжело даже разговаривать. Голос тихий, ответы короткие, она быстро устает, и вы начинаете думать, что разговор ей неприятен.\nВторое. Она оставляет сообщения без ответа, хотя сама говорила, что ей одиноко. Допустим, вы написали: пойдем в субботу гулять? Она открыла сообщение и замолчала.\nТретье. Она отдыхает и продолжает чувствовать себя разбитой. Может провести выходной дома и в понедельник с трудом подняться. Меня бесит совет просто хорошенько выспаться. Блядь, человек уже пробует.\nЧетвертое. Ей трудно принимать решения о деньгах, даже небольших. Покупка продуктов может зависнуть, потому что нужно выбрать, сравнить, решить, чего вообще хочется.\nПятое. Хорошие новости могут ее расстроить. Вы нашли билеты на концерт ее любимой группы, а она плачет. Потому что помнит, как раньше ждала таких вечеров, и сейчас почти ничего не чувствует. Еще и видит ваше разочарование.\nСколько пунктов вы узнали у своей подруги?","caption":"Я бы отдельно обсудила с подругой, можно ли писать ей без ожидания ответа. Иногда договоренность «я буду присылать тебе что-нибудь, отвечай, когда сможешь» снимает лишнее напряжение.\nЯ Ольга, психолог, работаю с девушками и женщинами от двадцати до сорока.\nЕсли хотите, напишите в комментариях свой пункт."},{"v":"h6","text":"Четыре вещи, которые важно понимать, если у вашей подруги депрессия и вы хотите ее поддержать.\nПервое. Она долго отвечает даже на «как ты?». Ответить бывает тяжело: надо подобрать слова, объяснить состояние, еще и успокоить вас.\nВторое. Она раздражается на предложения погулять, заняться спортом, найти хобби. Блин, ей сейчас душ принять тяжело. От списка полезных занятий хочется сказать: «Сука, я теперь ЕЩЕ и это должна».\nТретье. Она смеется при встрече, а потом снова отменяет планы. По одному хорошему вечеру трудно понять, сколько у человека сил.\nЧетвертое. Она уверяет вас, что ей лучше. Иногда хочется освободиться от необходимости показывать улучшение. Особенно когда вы столько для нее делаете.\nПопробуйте предложить что-то конкретное: «Я могу привезти еду. Оставлю у двери, если общаться тяжело».","caption":"«Ты попробовала то, что я советовала?» легко превращает следующий разговор в отчет.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хочется, напишите свой пункт: какая поддержка вам была нужна."},{"v":"zh","text":"Пять вещей о подруге с депрессией, которые я прошу учитывать, если вы хотите ее поддержать.\nПервое. Она устает даже от душа.\nВторое. Она лежит весь выходной и все равно чувствует себя разбитой. Меня бесит совет «просто соберись», блядь, сил от него не прибавляется.\nТретье. Она читает ваши сообщения и молчит. Иногда даже ответить любимой подруге трудно, особенно когда кажется, что придется изображать бодрость.\nЧетвертое. Она откладывает покупку самого необходимого.\nПятое. Она избегает даже хороших новостей. Вы рассказываете про отпуск, она рада за вас и одновременно чувствует, как далеко ей самой до такого удовольствия.\nСколько пунктов вы узнали?","caption":"Я бы предложила конкретную помощь: «Могу завтра привезти продукты, напишите, если вам это подходит». И заранее сказала бы, что принимать меня в гости и развлекать не придется.\nЯ Ольга, психолог, работаю с девушками и женщинами от двадцати до сорока.\nЕсли хочется, напишите в комментариях свой пункт: какая поддержка вам помогла."},{"v":"h3h4","text":"Четыре реакции подруги с депрессией, которые легко принять на свой счет.\nПервое. Она молчит в ответ на ваше «Как ты?». Чтобы ответить, приходится понять, как она, подобрать слова, еще и вас поберечь. Сообщение короткое, работы дофига.\nВторое. Раздражается на «Скажи, чем помочь». «Блядь, мне теперь еще придумать тебе задание».\nТретье. Отказывается от встречи. Даже с любимой подругой нужно разговаривать, реагировать, как-то участвовать. Сил на это может просто не быть.\nЧетвертое. Сама вас успокаивает: «Все нормально, честно». Ей плохо, и она еще переживает, что вы расстроитесь.\nМожно написать: «Оставлю тебе еду у двери. Отвечать необязательно».","caption":"«Я завтра заеду» тоже лучше согласовать: неожиданный визит может оказаться дополнительной нагрузкой. Достаточно короткого «Можно оставить пакет у двери?».\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хочется, напишите свой пункт: какая поддержка вам подходит?"},{"v":"живой","text":"Вот что люди с депрессией хотели бы, чтобы вы понимали. Первое. Депрессия не выбор и не вопрос силы воли. Человек не может просто взять себя в руки. Второе. Когда он отвечает через несколько дней или в последний момент отменяет встречу, дело в его состоянии. На вас он не злится. Третье. Причины не всегда видны со стороны. Бывает, снаружи все нормально, и от этого ему не легче. Четвертое. Вам может казаться, что он плохо старается. Но встать с кровати, принять душ, ответить на сообщение сейчас для него как мешки ворочать. И пятое. Это все тот же человек. Его характер и чувства никуда не делись, просто ему очень тяжело. И сейчас ему поддержка нужна больше, чем когда-либо.","caption":""},{"v":"h7","text":"Четыре вещи о подруге с депрессией, которые важно понимать, если вы хотите ее поддержать.\n\nПервое. Она может долго отвечать даже на очень теплое сообщение. И все равно смотрит на сообщение, потом закрывает.\n\nВторое. Она может отказаться от того, что обычно любит. Я вообще считаю, что возможность побыть рядом с кислым лицом очень недооценена. Потому что изображать приятную компанию, когда внутри все заебало, это отдельная нагрузка.\n\nТретье. Вот вы спрашиваете: «Что я могу для тебя сделать?» А у нее в голове пусто. Сука, даже помощь теперь надо организовать. Например, вы предлагаете: «Я могу привезти еды в четверг. Тебе подойдет?»\n\nЧетвертое. Она может прятать от вас, что ей по-прежнему плохо. Подруге может стать страшно разочаровать даже того, кто ее поддерживает. Ваше «ну как, помогло?» она слышит как просьбу предъявить результат. Хотя вам просто хочется знать, как она.\n\nА рядом с вами ей можно сказать: «Спасибо. Мне все еще плохо»?","caption":"Иногда после откровенного разговора человек сам начинает вас утешать: «Ты только не переживай за меня». Так в разговоре появляется еще одна задача для него.\nЯ Ольга, психолог, работаю с девушками и женщинами от двадцати до сорока.\nЕсли хочется, напишите в комментариях свой пункт."}]},{"id":"r_car_1_2","topic":"как поддержать подругу с депрессией и не сделать хуже","author":"Ольга","format":"reels_rol","cards":[{"v":"h6","text":"У вашей подруги депрессия? Я подготовила инструкцию, как ее поддержать. Не отвечает на сообщения? Пишите чаще. Пусть знает, что теперь у нее еще и двадцать сообщений, на которые надо ответить. Отменила встречу? Напомните, как долго вы освобождали вечер. Чувство вины бодрит, всем известно. На вопрос «Чем помочь?» говорит «Не знаю»? Требуйте конкретики. Блядь, вы же готовы помочь, пусть хотя бы техническое задание составит. Засмеялась над видео? Отлично, поймали. Срочно спросите, почему на кота силы есть, а на прогулку с вами нет. И обязательно расскажите, как вам тяжело видеть ее такой. Подробно. Можно поплакать. Так, кто тут кого поддерживает? Все правильно. Сначала пусть утешит вас, вы же ради нее старались.","caption":"При депрессии даже выбрать между супом и макаронами бывает тяжело. «Я могу привезти еду и оставить у двери» дает подруге меньше работы, чем «скажи, что тебе нужно».\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хотите на консультацию, пишите в директ слово «разбор»."},{"v":"zhh7","text":"Так, подруга с депрессией? Я научу вас поддерживать, проходите. Лежит, сил даже помыться нет? Отлично, предложите пробежку. На душ сил нет, на пробежку сейчас появятся. Я бы еще марафон записала. Сообщения читает, ответить трудно? Шлите вопросительные знаки. Блядь, ну на десятый точно взбодрится. Отменила встречу, потому что весь день собиралась и выдохлась? Срочно организуйте сюрприз с гостями. Пусть еще всем чай сделает, сразу почувствует себя нужной. Говорит, что всем мешает? Тут обязательно расскажите, как вы измотались, пока ее поддерживали. Чтобы уж наверняка поняла. Еду привезти? Посидеть рядом спокойно? Ну что вы, так она пропустит нашу воспитательную программу. У меня тут комплексный подход, я всем довольна. Все, идите. И скажите ей, чтобы к вашему приходу уже повеселела.","caption":"Иногда предложение «могу заказать вам ужин, отвечать сейчас необязательно» дает человеку возможность принять помощь без долгого разговора.\nЯ Ольга, психолог, работаю с девушками и женщинами, которым от двадцати до сорока.\nЕсли хотите прийти на консультацию, пишите в директ слово «разбор»."},{"v":"zh","text":"Здравствуйте, я ведущая тренинга для подруг, которые лучше знают, как вам полегчает. Так, она отменяет встречи, потому что сил нет? Прекрасно, приезжайте без предупреждения. Пусть еще вас обслужит, чай поставит, сразу взбодрится.\n\nНа сообщения трудно отвечать, даже слова подобрать тяжело? Пишите чаще. Вопросительные знаки отдельно. Потом добавьте, что вы обиделись. Появится срочное дело, уже хорошо.\n\nПлачет и просит просто посидеть рядом? Ну сидеть каждый может, вы же помогать пришли. Рассказывайте, кому еще хуже, пока ей за свои слезы стыдно не станет.\n\nБлядь, опять плачет? Добавьте благодарность. Пусть перечислит, что у нее хорошего. Я сама этот метод придумала: человек рыдает, одновременно выполняет задание, продуктивность растет.\n\nВсе, идите спасайте. И обязательно потом спросите, почему она вам больше ничего не рассказывает.","caption":"Предложение «я могу привезти еды и оставить у двери» иногда гораздо легче принять: можно получить помощь без необходимости поддерживать разговор.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от двадцати до сорока.\nЕсли хотите прийти на консультацию, пишите в директ слово «разбор»."},{"v":"h3h4","text":"Если у подруги депрессия, главное, чтобы после вашей поддержки она выглядела повеселевшей. Я подготовила инструкцию. Отказывается встретиться? Скажите, что ради нее отменили планы. Теперь у нее есть мотивация. Отвечает одним словом? Напишите: «Ты на меня обиделась?» Пусть объяснит, успокоит вас. Плачет? Расскажите, как вам тяжело видеть ее такой. Получится взаимная поддержка, прекрасно. Говорит, что даже душ принять сил нет? Предложите вечеринку. Душ, одежда, такси, люди. ВЕСЕЛО же. И обязательно спросите: «Ну что, я тебя хоть немного отвлекла?» Вы же, блядь, старались. Так, улыбнулась? Отлично, помощь оказана. Можно расходиться.","caption":"Можно написать: «Привезу еды, оставлю у двери. Отвечать и встречать меня не нужно».\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хотите прийти на консультацию, пишите в директ слово «разбор»."},{"v":"живой","text":"Служба поддержки встретившихся со взрослой жизнью, здравствуйте. Что у вас случилось? Девушка, дышите спокойно. Так. Вы хотите быть успешной бизнесвумен и еще, чтобы вас содержали. Поняла. И чтобы любили такой, какая вы есть, и похудеть до сорока пяти. Так. А еще никому ничего не доказывать, но чтобы бывший увидел и захлебнулся. Поняла. И мужчину с характером, но чтобы рот не открывал и делал, что скажете. А, еще на детокс-ретрит, и бургер вот этот съесть тоже не против. И отношения без драмы. Но чтобы он бежал за вами под дождем и всем за вас морды набил. Вот, уже спокойнее говорите. Все нормально, девушка, не вижу никаких противоречий. Обращайтесь.","caption":""},{"v":"h7","text":"Если ваша подруга с депрессией перестала отвечать на сообщения, сейчас я научу вас правильно ее поддерживать. Я веду занятие, телефоны достали. Нам потребуется чат и уверенность, что вы лучше знаете, сколько сил у другого человека.\n\nНачинаем с простого: «Как ты?» Отправили. Ждем. Через десять минут: «Ау». Через двадцать: «Ты куда пропала?» Через полчаса можно звонить. Она же увидела сообщение. Значит, техническая возможность ответить существует. Собраться, подобрать слова, объяснить свое состояние, выдержать разговор. Ну сколько там дел, господи.\n\nЕсли пишет: «Сил нет», предложите встретиться. Она уже отменила две встречи? Прекрасно, у нас есть материал для разговора. Напишите: «Для меня ты могла бы сделать исключение». Очень полезная фраза. Сразу понятно, что к душу, одежде и дороге добавляется еще один небольшой пункт: доказать, что она вас любит.\n\nДопустим, у вас была договоренность на пятницу. Вы забронировали столик, она днем пишет: «Прости, я сегодня не вывезу». Вот здесь главное быстро перечислить все, что вы ради нее сделали. Столик. Время освободили. Даже волосы помыли. Пусть оценит масштаб. Блядь, мы тут тоже стараемся. Можно отправить голосовое. Минут на семь. Чтобы она услышала, как вы переживаете.\n\n«Спасибо». «Потом».\n\nПодробно.\n\nОтлично.\n\nИ последнее. Если после всего этого она напишет: «Прости, пожалуйста, я очень ценю тебя, просто мне сейчас трудно», обязательно спросите: «А ты представляешь, как трудно мне?»\n\nВот теперь у нас ПОДДЕРЖКА.\n\nЕсли она начала утешать вас, занятие прошло успешно.","caption":"Иногда предложение «Могу оставить тебе еду у двери, отвечать сейчас не нужно» помещается в те силы, которые у человека еще остались. Даже благодарность может требовать сил.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хотите прийти на консультацию, пишите в директ слово «разбор»."}]},{"id":"r_mif_2","topic":"«тревогу надо просто перестать накручивать»","author":"Юлия","format":"reels_rol","cards":[{"v":"h3h4","text":"Тебе не отвечают на сообщение, и ты тревожишься? Так, сейчас научу. Просто перестань накручивать. Как перестать? Ну просто. Ты же сама начала, сама и заканчивай. Телефон убери. Думаешь о сообщении без телефона? Тогда мысли убери тоже. Почему он молчит, почему был в сети, в чем я виновата? Вот это все выключай. Кнопки нет? Странно, в инструкции написано «просто». Так. Теперь ты еще и злишься на себя, что опять накрутила? Отлично, значит, ответственность приняла. Следующий пункт: успокойся немедленно. Нам тут тревожные люди портят статистику легкости метода.","caption":"После «сама себя накрутила» бывает стыдно даже попросить поддержки, будто сначала надо доказать, что ты пыталась успокоиться.\nЯ Юлия, психолог, работаю с тревожными людьми от 20 до 40.\nНапиши свой пункт из инструкций «просто успокойся»."},{"v":"живой","text":"Люди красивые, пледов много, чай горячий, салфеток достаточно. Про телефон забудете. Плакать можно, молчать разрешается. Тренер огонь, сервис присутствует, базара нет, цена достойная. Случайных здесь нет, места быстро заканчиваются. (в сторону) Кто-нибудь нажал на кнопочку или мы не снимали?","caption":""},{"v":"h7","text":"Тревожишься, потому что тебе долго не отвечают? Служба поддержки «Просто перестань накручивать», здравствуй. Так. Сообщение прочитано, ответа нет, ты уже три раза открыла переписку. Понятно. Решение у нас стандартное: прекрати об этом думать. Что значит «как»? Обычно головой. Ты же головой начала, вот ей и прекращай.\n\nНет, дополнительной инструкции у нас нет. Все остальные как-то справляются. По крайней мере, нам они об этом не пишут. Возможно, тоже боятся показаться навязчивыми. Но это я отвлеклась, вернемся к тебе.\n\nПолностью.\n\nТак. Сама.\n\nЯ бы на твоем месте уже давно отложила телефон. А если бы снова взяла, то строго спросила бы себя: ну что, опять? Сразу чувствуешь, что за тобой кто-то следит. Даже когда дома никого.\n\nТы говоришь, после этого становится еще тревожнее? Конечно, теперь надо успеть успокоиться. Вечер идет. Ты уже сорок минут переживаешь из-за сообщения и двадцать минут из-за того, что переживаешь из-за сообщения. Тут любой начнет нервничать, столько времени потеряно.\n\nТолько второе сообщение не отправляй. Вдруг он поймет, что ты ждешь ответа. Ты должна выглядеть человеком, который вообще ничего не ждет. Очень спокойно ждет, я имею в виду. Телефон рядом, звук включен, лицо свободное.\n\nЧто?\n\nПросто перестань накручивать.\n\nОценишь мою работу? Только честно. Я ведь тебя успокоила?","caption":"После слов «ты опять накручиваешь» бывает стыдно даже спросить, во сколько вы встречаетесь. За чужую скорость ответа ты не отвечаешь.\nЯ Юлия, психолог, работаю с тревожными людьми от 20 до 40.\nНапиши в комментариях свою фразу из серии «просто успокойся»."},{"v":"h8","text":"Ты перечитываешь свое «хорошо, отдыхай» и думаешь: вдруг он решил, что я обиделась? Может, сердечко добавить?\n\nТебе говорят: «Просто перестань накручивать». Да, и теперь ты еще виновата, что никак не можешь успокоиться. Сообщение уже из двух слов, а вопросов много, много. Достаточно тепло? Точно без упрека? Почему я вообще такая?\n\nЭтот совет требует от тебя выключить тревогу, пока ты пытаешься гарантировать, что тебя правильно поняли. Ну какая тут гарантия. Даже сердечко можно прочитать как издевку.\n\nТы отвечаешь за то, что пишешь. За грубость, если нагрубила. Но сколько еще сердечек нужно добавить, чтобы отвечать и за то, как человек их прочитает?","caption":"Иногда следом хочется отправить «ты точно не обиделся?», хотя человек уже пожелал спокойной ночи.\nЯ Юлия, психолог, работаю с тревожными людьми от 20 до 40 лет.\nОтправь тому, кто тоже подолгу выбирает смайлик."},{"v":"zh","text":"Служба поддержки, здравствуй, я помогу тебе перестать накручивать. У нас все просто: перестань. Уже пробовала? Прекрасно, значит, умеешь. Теперь делай это успешно. Мысль сама появилась? Так, самовольное появление мыслей у нас запрещено. Ты должна была заранее подумать, как об этом не думать. Особенно перед сном. Легла, закрыла глаза, проверила: тревоги нет? Еще раз проверь. Вдруг пропустила. Появилась? Значит, плохо проверяла. Теперь добавь переживание, что ты сама себе все портишь. Это для мотивации. Я разработала прекрасную систему: если тебе спокойно, наш совет работает, если тревожно, ты недостаточно старалась. Жалобу хочешь оставить? Конечно. Только сначала успокойся, с тревогой жалобы не принимаем. Все, иди, переставай. Следующий!","caption":"Иногда человек уже стыдится признаться, что снова тревожится, ведь ему столько раз объясняли, как это легко прекратить. И еще извиняется, что испортил вечер.\nЯ Юлия, психолог, работаю с тревожными людьми от 20 до 40.\nЕсли хочется, напиши в комментариях свой пункт из таких советов."},{"v":"h6","text":"Тревожишься, когда тебе долго не отвечают? Сейчас научу тебя просто перестать накручивать. Телефон положи. Все, спокойно живи свою жизнь. Положила, но думаешь об ответе? Значит, плохо положила. Почему ты вообще об этом думаешь? Тебе же сказали: перестань. Так, теперь проверяй каждые пять минут, достаточно ли ты спокойна. Сердце стучит? Непорядок. Опять переживаешь? Добавь вопрос: «Почему я даже успокоиться нормально не могу?» Очень полезный вопрос, особенно перед сном. Теперь у тебя еще много, много всяких почему. Почему он молчит? Почему я тревожусь? Почему я такая? Что? До моего инструктажа ты переживала только из-за сообщения? Ну вот, теперь займись собой. Я же объяснила: все дело в тебе.","caption":"Можно чувствовать тревогу и при этом дать человеку время ответить. Ты отвечаешь за свои действия, включая десятое сообщение подряд.\nМеня зовут Юлия, я психолог, работаю с тревожными людьми от 20 до 40.\nЕсли хочешь, напиши свою любимую фразу из серии «просто успокойся»."},{"v":"zhh7","text":"Добро пожаловать, я твоя тренер по спокойствию. Тревожишься? Просто перестань себя накручивать. Все, основную часть мы прошли. Теперь практика. Написала человеку, он молчит, ты переживаешь? Прекрасно, запрети себе переживать. Получилось? Как снова думаешь об этом? Я же дала инструкцию. Значит, плохо запрещаешь. Добавь строгости. Теперь следи за каждой мыслью, чтобы ни одна тревожная не проскочила. Даже ночью. Особенно ночью, там у тебя вообще никакого контроля. Устала? Конечно, спокойствие требует дисциплины. Я лично считаю, что ты еще слишком бережно с собой разговариваешь. Попробуй добавить, что нормальные люди уже давно бы успокоились. Вот, теперь еще и стыдно. Отлично, будет чем заняться вместо тревоги. Все, иди. И чтобы к следующему занятию никаких переживаний.","caption":"Особенно удобно прислать «просто успокойся» и пропасть до завтра.\nЯ Юлия, психолог, работаю со взрослыми, которым тревога мешает жить.\nЕсли хочется, напиши в комментариях свой пункт из таких советов."}]},{"id":"r_mif_2_2","topic":"«тревогу надо просто перестать накручивать»","author":"Юлия","format":"reels_monolog","cards":[{"v":"h3h4","text":"«Он не отвечает? Просто перестань себя накручивать». Как будто ты сидела спокойно и решила: так, чем бы испортить себе вечер?\n\nТы видишь прочитанное сообщение, ждешь, открываешь переписку. Потом вспоминаешь: надо перестать накручивать. И начинаешь проверять уже себя. Почему я опять тревожусь? Почему не могу спокойно подождать? Что со мной такое?\n\nОн молчит. И ты опять не справилась с заданием быть спокойной.\n\nТы отвечаешь за свои поступки: что напишешь, что скажешь, будешь ли обвинять человека. А с этим «просто перестань» приходится еще оправдываться перед собой за каждую страшную мысль.\n\nКак будто тревога теперь еще и проступок.","caption":"Иногда после слов «возьми себя в руки» хочется еще и спрятать телефон, чтобы никто не видел, как часто ты его проверяешь. Стыдно становится даже ждать ответа.\nМеня зовут Юлия, я психолог, работаю с тревожными людьми от 20 до 40.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"zh","text":"Меня раздражает совет «просто перестань себя накручивать», потому что после него ты еще и виновата в том, что тебе тревожно.\n\nТы ведь уже пыталась успокоиться, отвлечься, сказать себе, что все нормально, и тревога все равно возвращалась. Если бы хватало слова «перестань», ты бы давно перестала.\n\nНо тебе говорят, что ты сама себя накручиваешь, и вот ты уже спрашиваешь: почему я опять все испортила? Почему я даже успокоиться нормально не могу? Что со мной вообще не так?\n\nДаже попросить поддержки неловко: тебе же уже объяснили, что ты сама это устроила.\n\nЯ бы здесь отделила ответственность от вины. Ты отвечаешь за свои поступки, в том числе когда тревожно. За само появление тревоги ты себя виноватой назначать не обязана.","caption":"Слово «просто» в таких советах обычно звучит очень уверенно. И разговор о том, как тебе тяжело, на нем часто заканчивается.\nЯ Юлия, психолог, работаю с тревогой у людей от двадцати до сорока.\nЕсли хочешь прийти на консультацию, ссылка на запись в шапке профиля."},{"v":"h6","text":"«Просто перестань себя накручивать», слышишь ты, когда тревожишься из-за сообщения без ответа. Ну прекрасно. Теперь ты еще и виновата, что тебе страшно.\n\nТы написала человеку, он молчит. Ты уже думаешь: обиделся? Я что-то не то сказала? Потом вспоминаешь: хватит накручивать, нормальные люди так не переживают.\n\nТебе хочется найти причину, которая оправдает твою тревогу. Вот, вчера он тоже сухо ответил. И встречу перенес. Значит, я имею право переживать!\n\nУпрек «сама себя накрутил
