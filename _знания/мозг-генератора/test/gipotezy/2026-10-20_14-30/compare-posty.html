<script>
const T=[{"id":"r_mif_1_post","topic":"«психолог просто слушает и кивает за мои деньги»","author":"Михаил","format":"post","cards":[{"v":"zh2","text":"Меня раздражает фраза «психолог просто слушает и кивает за мои деньги».\n\nПсихолог задает вопросы, вместе с вами проверяет привычные выводы, помогает пробовать другие способы действовать. И должен уметь объяснить, что вы делаете на встречах и как это связано с тем, с чем вы пришли.\n\nНо человеку, который еще ни разу не обращался за помощью, уже подбросили сомнения: я что, сам не могу разобраться? Мне настолько некому выговориться, что придется платить? Меня послушают, похвалят, и я еще буду за это благодарен?\n\nИ вот вам уже стыдно записаться. Вроде взрослый человек, работа есть, обязанности выполняете, могли бы и сами справиться.\n\nВы отвечаете за то, чтобы по возможности честно говорить о том, что с вами происходит, спрашивать, если непонятно, сообщать, если вам что-то не подходит. Психолог отвечает за свою работу, в том числе за понятный вам смысл встреч. Подсказывать ему, как вам помогать, вы не обязаны.\n\nЕсли хотите разобраться, почему вам трудно просить помощи, приходите.","caption":""},{"v":"zh3","text":"Меня раздражает это снисходительное: «Психолог просто слушает и кивает за ваши деньги».\n\nЕсли принять это всерьез, обращаться за помощью вообще как будто стыдно. Взрослый человек, а платите за то, чтобы вас выслушали. Совсем, видимо, сами уже ничего не можете.\n\nИ вы начинаете спрашивать себя: «Мне что, поговорить больше не с кем? Почему другие сами справляются? Я совсем слабый, если мне нужен психолог?»\n\nВот с этим мне трудно согласиться. Вы вполне можете уметь решать сложные задачи и при этом нуждаться в помощи с тем, что происходит с вами.\n\nСлушать психологу действительно нужно. Еще ему нужно вместе с вами разобраться, что вы хотите изменить, предложить способы работы и обсуждать, помогают ли они. Вы вправе спросить: «Что мы сейчас делаем и как это связано с моей проблемой?»\n\nВы отвечаете за свое участие. Психолог отвечает за свою работу и должен уметь объяснить, в чем она состоит. Догадываться, за что вы платите, вы не обязаны.","caption":""},{"v":"живой","text":"Родная страна — не просто точка на карте. Это\nконтейнер\n: язык, коды, ощущение «я свой/своя».\nИ когда человек уезжает, он теряет прежде всего этот контейнер. В этот момент активируется та же система привязанности, что и в отношениях с матерью.\nМы часто говорим: мама и деньги, мама и стыд, мама и отношения. Но задумывались ли вы, что отношения с матерью влияют и на проживание эмиграции?\nПочему в одной стране одни чувствуют возможности, а другие — холод и отвержение? Потому что эмиграция — это\nвторичная сепарация:\nона либо повторяет ранний сценарий, либо даёт шанс его завершить.\nЕсли ранняя сепарация была\nподдержана\n— человек может горевать и адаптироваться. Если\nтравматичной\n— новая страна бессознательно переживается как материнский объект: «меня не принимают» или «я должна заслужить право быть здесь».\n3 марта\nна\nбесплатном\nвебинаре Анна расскажет, как материнская фигура влияет на взрослую жизнь и как это видеть в терапии.\nТакже — подробнее о специализации, стартующей в апреле.\n\nРегистрация","caption":""}]},{"id":"r_vopros_1_post","topic":"«а зачем мне психолог, если у меня есть подруги»","author":"Ольга","format":"post","cards":[{"v":"живой","text":"Всем плевать.\n«А можно я брошу работу?..»\n«Хочу быть домохозяйкой, это ужасно?..»\n«МИХАИЛ, А Я НОРМАЛЬНЫЙ?»\nДрузья мои, каждый день я получаю от вас десятки писем в Директ о том, что вы прямо точно «неправильные». «Со мной что-то не так» буквально звучит в каждом сообщении.\nЯ хочу открыть вам одну маленькую тайну.\nВСЕМ ПЛЕВАТЬ.\nПсихолог не знает, как вам «правильно жить», ведь такому на психфаке вообще не учат. Он без понятия, можно ли конкретно в вашем случае бросить вуз или нельзя, да и не ему это решать.\nЧто касается остальных, особенно тех, кто лезет с советами, своим ценным мнением и рекомендациями. Вы не поверите, но на самом деле им пофиг.\nРаботаете ли, за сколько вы снимаете квартиру и почему путешествуете, а не покупаете дачу.\nВсем по барабану, у людей своих задач полно. Единственное исключение — это родители. Им может и не плевать, но, по большому счёту, их вопросы и реакция — обычная тревожность.\nНапример, на месте «когда замуж» легко могло бы стоять «почему ты ешь так мало белка».\nДрузья мои, не надо класть себя в прокрустово ложе и пытаться свериться с миром, который якобы диктует вам правила жизни. Никто не диктует. Это вы так низко себя ставите, что вам какой угодно дегенерат из соцсетей может напеть, что ваше главное предназначение в жизни — жить на Бали и заниматься йогой.\nИ ему кстати тоже будет плевать, не поверите.\nДрузья, у нас полный sold-out вип-билетов на встречу в Москве 15-го июля.\nДобавили ещё немного доп. мест. Если вы тоже хотите встретиться со мной после лекции и в камерной атмосфере посидеть и пообщаться:\nдополнительные вип-билеты","caption":""},{"v":"zh2","text":"Читаю «зачем мне психолог, если есть подруги» и зависаю с телефоном в руке.\n\nПотому что дальше подруге обычно выдают целую должностную инструкцию: выслушай, успокой, объясни, почему я опять ему написала, только без осуждения, будь на связи ночью, помни все ссоры с сентября и, пожалуйста, никаких своих проблем сегодня. У тебя же все нормально.\n\nОху*ть, девочки. Подруга вообще когда спит?\n\nВот вы снова помирились с мужчиной, на которого жаловались подруге весь вечер. Уже открыли переписку с ней и закрыли. Она ведь скажет: «Ну я же тебе говорила». И теперь вы встречаетесь с ним тайком еще и от нее, потому что стыдно признаться: все понимаете, все равно хотите к нему.\n\nПодруга может вас любить, злиться за вас, уставать слушать про него и очень хотеть, чтобы вы уже ушли. У нее есть свои чувства и право сказать: сегодня я больше не могу.\n\nС психологом можно начать прямо с этого: «Мне стыдно вам рассказывать, я боюсь, что вы тоже начнете меня ругать». И вместе разбираться, что происходит: чего вы ждете от этого мужчины, почему возвращаетесь, как замолкаете, когда боитесь разочаровать человека напротив.\n\nЯ и сама сейчас увлеклась и почти выдала подруге инструкцию, как ей правильно дружить. Вот уж спасибо.\n\nЕсли хотите понять, почему у вас снова получается именно так, приходите.","caption":""},{"v":"zh3","text":"«Зачем мне психолог, если есть подруги?» Читаю комментарий, сижу с телефоном и уже хочу ответить голосовым.\n\nПодруге можно позвонить после ссоры, переслать переписку, поплакать, услышать: «Я приеду, что купить?» И я очень за такую дружбу.\n\nНо дальше в комментариях от подруги уже ждут, что она всегда выслушает, задаст правильный вопрос, поймет, почему вы опять вернулись к бывшему, спокойно примет ваше решение вернуться еще раз, и все это вечером, когда она укладывает ребенка и завтра ей вставать на работу.\n\nБл*ть, ей самой бы с кем поговорить.\n\nВот вы рассказываете, что согласились на секс, хотя хотелось просто уснуть. Подруга говорит: «Ой, у нас тоже такое». И вы уже спрашиваете, что у нее случилось, утешаете ее, а про себя заканчиваете: «Да ладно, у меня все нормально».\n\nВы любите подругу и хотите ее поддержать. Только свое «я опять согласилась, потому что боялась его обидеть» так и оставили без внимания.\n\nВ терапии у вас есть место, где можно продолжить именно об этом. Психологу можно сказать, что вы устали от его вопросов, с ним можно не согласиться, и вам не придется потом расспрашивать его о личной жизни, чтобы он тоже почувствовал вашу заботу.\n\nЯ сама люблю идею, что хороший разговор многое решит. Очень хочется, чтобы стало легче уже сегодня.\n\nИ поддержка подруги правда может помочь. А если вы снова соглашаетесь, терпите и потом плачете в ванной, с этим можно прийти к психологу. Даже если у вас прекрасные подруги.","caption":""}]},{"id":"r_post_1_post","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","author":"Юлия","format":"post","cards":[{"v":"zh3","text":"Милая, ты уже проверила, работает ли интернет, потому что он не пишет?\n\nСообщения в общем чате приходят, реклама приходит, от него ничего. Ну что за ерунда, ты ведь собиралась просто поужинать и посмотреть сериал. Теперь перематываешь назад, потому что опять смотрела, когда он был в сети.\n\nХочется спросить у тех, кто советует «просто займись собой»: вы думаете, она сейчас очень увлечена этим ожиданием? Меня этот совет каждый раз задевает.\n\nПочему ты открываешь переписку, хотя уведомления включены? Вдруг пропустила. Очень хочется, чтобы он уже написал и ты перестала гадать, нравишься ли ему еще.\n\nПочему сама не напишешь? Уже писала первой вчера и теперь хочешь узнать, вспомнит ли он о тебе сам. Хотя подожди. Ты уже придумала спросить, как прошло его совещание. Повод вроде приличный, можно отправить.\n\nИ тут же останавливаешь себя: вдруг я навязываюсь?\n\nВот это особенно жалко, хорошая моя. Ты уже стесняешься того, что хочешь с ним поговорить. Стираешь набранное, кладешь телефон экраном вниз и через минуту переворачиваешь обратно.\n\nТы за вечер уже поела с телефоном у тарелки, пропустила половину серии, ответила подруге «потом послушаю» на ее голосовое, проверила его страницу, свою последнюю реплику, время его последнего захода. Еще чуть-чуть, и начнешь проверять, правильно ли ты вчера пожелала спокойной ночи.\n\nХочется же получить обычное «как твой день?» и наконец спокойно пойти мыть голову.","caption":""},{"v":"живой","text":"Тут, девочки, пару дней назад я прочитала в новостях инициативу о том, чтобы принять у нас закон против домашнего насилия.\n\nМеня это удивило, ибо я почему-то была уверена, что у нас этот закон есть. Не знаю откуда такая уверенность,  наверное от здравого смысла.\nИ тут сегодня вижу другую новость. И в этой новости прекрасно (нет) всё. Следим за текстом:\n\"Председатель комитета Госдумы по защите семьи Нина Останина...\" - Мисс государственная заботушка о семье\n\"...заявила, что запрет домашнего насилия заставит россиян отказаться от вступления в брак.«Парни будут бояться» «импульсивных» заявлений в полицию от женщин и откажутся от брака\"\nЧего бл%ть? Прям вот заявила?\nНу давайте попробуем прочитать это с позиции здравого смысла, я думаю это звучит примерно так:\nОстанина: \"Вы что а&уели запрещать домашнее насилие? Ведь мужчины ради этого женятся,  а без этого не будут\"\nСюр!\n\n\n\nУ меня тоже есть заявление:\nА давайте перестанем в государственных масштабах считать мужчин пугливыми ланями, которые боятся женщин,  и одновременно козлами с поносом, которые ну никак не могут сдерживаться в своих порывах! Может тогда и они (мужчины) перестанут приписывать себе это поведение как нормальное, а?!","caption":""},{"v":"zh2","text":"Мои хорошие, кто тоже берет телефон, чтобы проверить, не пропустила ли сообщение, пока проверяла телефон?\n\nОн сегодня сам тебе не писал, и ты решила подождать. Пусть тоже захочет, вспомнит, спросит, как ты. Разве это плохо?\n\nНо вот ты уже идешь в душ с телефоном, кладешь его на стиральную машину экраном вверх и оставляешь звук погромче. Вдруг напишет, а ты пропустишь. Хотя сама ждешь его ответа с обеда.\n\nПочему просто не написать? Потому что ты уже начинала последние разговоры и теперь хочешь узнать: если ты замолчишь, он вообще тебя вспомнит?\n\nПочему заходишь к нему на страницу? Хочется понять, чем он занят. Увидела, что он только что был в сети, и стало еще больнее: телефон у него в руках, написать он может.\n\nИ тут начинается. Может, я ему надоела? Может, вчера слишком много рассказала? Зачем вообще отправила то фото?\n\nДорогая, погоди. Меня прямо злит, как быстро ты начинаешь себя ругать, когда он молчит. Ты уже и фотографию готова удалить, и вчерашнюю шутку считаешь глупой, и жалеешь, что сказала, как тебе было с ним хорошо.\n\nДА ТЫ ЗА ВЕЧЕР УЖЕ УСПЕЛА СОСКУЧИТЬСЯ, ОБИДЕТЬСЯ, ПОПРОЩАТЬСЯ И ПРИДУМАТЬ ОТВЕТ НА ЕГО «ПРИВЕТ».\n\nА подруге завтра скажешь: «Да ничего особенного, дома сидела».","caption":""}]},{"id":"r_money_1_post","topic":"стыдно просить повышение, хотя работаю больше всех","author":"Ольга","format":"post","cards":[{"v":"живой","text":"Почему даже в браке понимание стадий не всегда приносит спокойствие\n\nКогда вы замужем не первый год,\nотношения неизбежно меняются.\nЭто не плохо. Это не «что-то пошло не так», это просто факт.\nМожно знать, что есть этапы, кризисы, переходы. Можно понимать, что романтика трансформируется, что близость становится глубже, но тише. Можно читать много об этом всем. И всё равно внутри может быть:\n\nтревога\n\nощущение отдаления\n\nбольше раздражения, чем раньше\n\nгрусть по тому «как было в начале»\n\nсомнение «это нормально или мы теряем друг друга?»\nПотому что каждый этап брака касается наших чувств очень глубоко. И тут у каждого свое:\nстрах быть ненужной, страх остаться одной внутри отношений, страх перестать быть важной.\nВ терапии\nмы не просто определяем на каком этапе пара, мы аккуратно разбираем:\n\nчто именно изменилось между вами\n\nчто изменилось внутри вас\n\nгде естественный этап брака, а где накопленная усталость или непроговорённая боль\nИногда становится легче уже от того, что вы перестаёте держать это в себе.\nЕсли вы сейчас в точке, где:\n\nотношения изменились\n\nвы стали чаще сомневаться\n\nустали все анализировать в одиночку\n\nне хотите разрушить то, что можно сохранить\nМожно разобрать это индивидуально!\n\nНапишите мне в личные сообщения\n@an_smy\nслово\n«брак»\n, и я расскажу, как проходит первая встреча.\nБывает достаточно одного честного разбора, чтобы перестать паниковать и начать понимать, что с вами происходит.","caption":""},{"v":"zh2","text":"Только что прочитала: «Если вы ценный сотрудник, вас сами повысят». Сижу с телефоном и злюсь.\n\nКонечно. Надо просто поработать за себя, подхватить за коллегу, ответить в отпуске, выйти с температурой, освоить обязанности уволенного сотрудника и научить офисный принтер уважать людей. Тогда начальник обязательно все поймет.\n\nБл*ть, как удобно. Особенно начальнику.\n\nВы опять закрываете ноутбук последней, по дороге домой покупаете готовую еду, потому что готовить уже сил нет, и репетируете разговор про зарплату. А утром руководитель просит взять еще один проект, и вы соглашаетесь. Про деньги опять молчите.\n\nПотому что попросить страшно: вдруг он спросит, с чего вы вообще решили, что вам надо больше платить. И придется вслух говорить, что вы хорошо работаете, пока он смотрит и оценивает. Уже стыдно, хотя разговор пока только у вас в голове.\n\nВот вы и берете еще работу. Надеетесь заслужить повышение так убедительно, чтобы самой ничего не просить. Пусть заметят, предложат, подтвердят, что вы правда молодец. Тогда можно будет спокойно взять деньги.\n\nЯ тоже люблю, когда люди сами понимают, что мне нужно. Желательно сразу и правильно.\n\nТолько руководитель видит, что вы берете больше задач за прежнюю зарплату, и вполне может считать, что вас все устраивает. Вам нужен отдельный разговор: вот что я теперь делаю, вот за какие результаты отвечаю, хочу обсудить повышение до такой суммы. Даже если вам все еще стыдно это произносить.","caption":""},{"v":"zh3","text":"«Сначала станьте незаменимой». Читаю совет о повышении зарплаты и сижу с телефоном, охрен*ваю.\n\nПодхватите чужие задачи, проявите инициативу, задержитесь, помогите новичку, будьте той, на кого всегда можно положиться. Зарплату обсудите потом, когда докажете свою ценность. Видимо, когда начнете еще и директору напоминать, где он припарковался.\n\nДевочки, вы уже работаете за двоих. Просить все еще стыдно.\n\nКоллега в шесть закрывает ноутбук, вы доделываете отчет, который он не успел, дома ужинаете перед рабочей почтой. И собираетесь поговорить о деньгах, но начальник опять просит срочно выручить. Вы соглашаетесь. Вот закончу, тогда точно будет с чем к нему идти.\n\nПотому что страшно услышать: «Мы думали, вы за дело переживаете, а вам только деньги нужны». И вы берете еще работу, чтобы уж точно никто не подумал, что вы жадная. Только после очередного отчета попросить почему-то все так же стыдно.\n\nБл*ть, как меня бесит совет добавить вам работы в этот момент.\n\nСама хороша, конечно: могла закрыть этот пост, сижу, дочитываю рекомендации.\n\nВам нужна конкретная договоренность с руководителем о вашей нагрузке и оплате. Разговор можно начать с того, что уже есть: «Сейчас я веду еще и задачи ушедшей коллеги. Хочу обсудить повышение зарплаты».","caption":""}]},{"id":"d_ne_podhodit_1_post","topic":"что делать, если психолог вам не подошел","author":"Михаил","format":"post","cards":[{"v":"zh2","text":"«Психолог мне не подходит, но вдруг я просто сопротивляюсь?»\n\nМеня беспокоит, когда человеку советуют с этим обязательно остаться в терапии. Особенно если он уже собирается на встречу и заранее придумывает, как бы сказать помягче, чтобы психолог не обиделся.\n\nВы платите за встречу, хотите поговорить о том, что вас мучает, и снова тратите ее на то, чтобы быть удобным. Потом еще злитесь на себя: даже здесь ничего сказать не смогли.\n\nВ терапии бывает трудно. Можно сердиться, стыдиться, хотеть закрыть тему. Но по одному этому я не могу решить за вас, что вам нужно продолжать.\n\nЕсли вы скажете мне: «Я после наших встреч чувствую себя хуже и уже боюсь приходить», я спрошу, что именно происходит. Вы уходите с тяжелыми мыслями? Я слишком быстро задаю вопросы? Вы соглашаетесь со мной, потому что боитесь спорить, а дома понимаете, что думаете совсем иначе?\n\nМне важно услышать конкретный момент. Например: «Вы предложили задание, я сказал, что попробую, хотя уже понимал, что сил на него нет». Здесь можно остановиться и обсудить, как получилось, что вы согласились, и что я могу изменить в нашей работе.\n\nМолча продолжать терапию бывает похоже на поход к парикмахеру, которому вы каждый раз говорите «все хорошо», а дома прячете волосы под шапку. Только говорить психологу, что вам плохо рядом с ним, часто гораздо страшнее.\n\nЯ не обещаю, что после такого разговора вам со мной станет комфортно. И требовать, чтобы вы остались и обязательно все обсудили, я тоже не буду.\n\nЧтобы уйти, вам достаточно решить, что вы не хотите продолжать. Доказывать мне, что я вам действительно не подошел, не нужно.","caption":""},{"v":"zh3","text":"«Психолог мне не подошел. Теперь еще надо объяснить ему, почему я ухожу».\n\nМеня задевает, когда к этому добавляют: раз хочется уйти, значит, вы сопротивляетесь и надо продолжать. Получается, вы уже сомневаетесь, можно ли уйти, а вам предлагают еще и доказать, что у вас достаточно веская причина.\n\nВы можете заранее подбирать слова, чтобы психолог не обиделся. На встрече сказать, что все нормально, оплатить следующую, а потом весь вечер злиться на себя: опять согласились, хотя собирались отказаться.\n\nМне важно, чтобы об этом можно было сказать прямо на встрече. Даже если вы пока можете объяснить только так: «Я после наших разговоров чувствую себя каким-то неправильным и уже боюсь вам отвечать».\n\nЯ спрошу, в какой момент вы так себя почувствовали. Что я сказал, как вы это поняли, чего ожидали от меня тогда. Возможно, я поторопился с выводом или предложил задание, смысл которого толком не объяснил. Мне нужно разобраться и в том, что сделал я.\n\nЕсли вам слишком быстро, слишком много вопросов, непонятно, зачем мы опять обсуждаем одну и ту же ситуацию, мы можем это обсудить и попробовать работать иначе. Я не могу обещать, что после такого разговора вам со мной обязательно станет комфортно.\n\nИ вы можете решить уйти.\n\nДля этого достаточно написать: «Я решил закончить наши встречи». Подробный отчет о моих ошибках, убедительная причина и мое согласие вам не требуются. Отдельную встречу для завершения вы тоже можете не выбирать.\n\nЕсли придете ко мне, мы будем обсуждать в том числе то, как вам со мной работается. Я буду слушать и уточнять.","caption":""},{"v":"живой","text":"КОГДА РОДСТВЕННИКИ ДАВЯТ - КАК УДЕРЖАТЬ СЕБЯ И СВОИ ГРАНИЦЫ\nОн пришёл на сессию и рассказал:\n— «Родители жены буквально\nвторглись\nв наши решения по покупке новой техники для дома. Сначала казалось, что это просто советы: «Смотри, вот это удобнее», «Так дешевле», «А ты уверен, что это нужно?»… Но с каждым словом\nдавление росло\n. Мне становилось тяжело, казалось, что я теряю\nконтроль\nнад своим выбором и своей семьёй».\n— «И что вы почувствовали?» — спросила я.\n— «\nГнев\n, раздражение… и одновременно\nтревогу\n, что если скажу что-то прямо, жена обидится, родители расстроятся. Я хотел обороняться, но понимал — это приведёт к\nконфликту\n».\n— «Что сделали дальше?» — уточнила я.\n— «Я сделал\nпаузу\n. Глубоко вдохнул, спросил себя: „Что важно лично мне? Как хочу действовать?“ Потом сказал спокойно: „\nСпасибо за мнение, мы обсудим и примем решение сами\n“. Постановка границы была\nмягкой\n, без резких слов».\n— «И как это прошло?»\n— «Невероятно легко. Родители почувствовали мою\nуверенность\nи\nуважение\n. Мы не поссорились, атмосфера осталась\nдружелюбной\n. Я сам чувствовал\nспокойствие\n, и при этом сохранил своё мнение и\nконтроль\nнад своей семьёй».\nВывод:\nЧасто родственники уверены, что знают лучше, и это создаёт\nдавление\n.\nНо внутренняя опора и контакт с собой помогают:\n— услышать свои желания\n— мягко, но\nтвёрдо\nобозначить границы\n— сохранить\nмир\nи\nуважение\nвокруг\nТак мы учимся\nуправлять\nэмоциями\n, не теряя себя, и показываем, что можно сохранять себя в любых обстоятельствах.\nА как вы обычно справляетесь, когда кто-то пытается давить на ваши решения?","caption":""}]},{"id":"z_zapis_2_post","topic":"открываю запись на осень: с чем ко мне можно прийти","author":"Юлия","format":"post","cards":[{"v":"живой","text":"«Здравствуйте, Михаил! Вы говорите, что с собой надо общаться как с лучшим другом, поддерживать и тд. Но что делать, если не получается? Я действительно верю в своих близких, знаю, какой классный потенциал у них есть, но когда дело касается меня — сомневаюсь. С самооценкой все в порядке, она плавает только на моментах моей сильной неуверенности в своих силах, когда недостаточно практики и «доказательств». Как отпустить «поводья», расслабиться и позволить себе делать? И реально поддерживать себя так, как и своих друзей и семью?»\nНачнём с того, что сомневаться в себе, когда вы занимаетесь чем-то новым и в чём рука ещё «не набита» — нормально. Вы же адекватный человек и понимаете, что делать всё гениально с первого раза — такая себе история.\nПообщайтесь с собой и выясните, почему у вас к себе такие жёсткие требования и откуда эта чрезмерная требовательность вообще взялась? Если вы ориентируетесь на профи и думаете «как я могу встать рядом с ними, они такие классные, а я ещё ничего не умею», то нужно понять важную вещь — АБСОЛЮТНО каждый человек с чего-то начинал.\nФредди Меркьюри, к примеру, сначала играл на школьных вечерах и юбилеях, а не сразу на многотысячных аренах. Генри Форд, основавший Ford Motor, до этого потерпел крах с первой компанией по производству автомобилей. А Мерил Стрип на кастинге в Кинг-Конга и вовсе обозвали уродиной, но именно ей принадлежит рекорд по количеству номинаций на Оскар.\nЕсли у вас что-то не получается и вы где-то проваливаетесь, это не значит, что вы «тупой/недостаточно талантливый/какой-то не такой». Работайте над собой, поддерживайте и любите себя, продолжайте набираться опыта, перенимайте его у тех, кто вдохновляет вас.\nИ поймите главное — идеальный момент не настанет. Не будет такого дня, в который у вас вдруг раз и получится. Самореализация — это путь с ошибками и провалами. И пройти его вы должны, будучи в первую очередь опорой самой(самому) себе.\nУспехов!","caption":""},{"v":"zh3","text":"Ты уже спросила, любит ли он тебя. Почему же снова хочется спросить?\n\nЯ открываю запись на осень и зову тебя в терапию, если ты узнаешь себя в этом ожидании: сейчас он ответит, объяснит, обнимет, и наконец можно будет успокоиться.\n\nОн отвечает, ты выдыхаешь, а вечером замечаешь, что он был в сети и тебе ничего не написал. И опять проверяешь телефон, перечитываешь переписку, пытаешься понять, где ты сказала что-то лишнее.\n\nТы хочешь спросить, все ли между вами хорошо, и боишься, что он разозлится: сколько можно об одном и том же. Поэтому молчишь, хотя весь вечер думаешь только об этом.\n\nМне хочется, чтобы у тебя было место, где можно говорить об этом столько, сколько тебе нужно. Даже если ты уже спрашивала. Даже если тебе самой кажется, что пора бы успокоиться.\n\nНа первой встрече ты расскажешь, что сейчас происходит и с чем тебе тяжело. Я буду слушать, задавать вопросы, и мы обсудим, как можем работать вместе.\n\nЧтобы записаться, напиши мне в личные сообщения. Приходи, будем разбираться вместе.","caption":""},{"v":"zh2","text":"Ты уже хочешь спать, но заходишь проверить, вдруг он все-таки ответил.\n\nИ вот он в сети, а твое сообщение так и висит непрочитанным. Ты перечитываешь его: слишком много написала? Зря спросила про встречу? Завтра рано вставать, но телефон все еще у тебя в руке.\n\nЯ открываю запись на осень. И зову тебя, если ты узнаешь себя в этом ожидании.\n\nЕсли после хорошего свидания ты весь день гадаешь, понравилась ли ему. Если хочешь сказать, что тебе обидно, но пишешь «все нормально», потому что боишься: начнешь говорить о своих желаниях, и он уйдет.\n\nМне грустно от того, сколько всего приходится проглатывать, когда страшно стать ненужной.\n\nНа первой встрече ты сможешь рассказать, что сейчас происходит в твоих отношениях, что мучает, чего хочется. Я буду слушать, задавать вопросы, и мы обсудим, как можем работать дальше. Можно прийти, даже если пока получается сказать только: «Я устала так жить».\n\nЕсли хочешь разобраться, почему с тобой так происходит, напиши мне в личные сообщения. Приходи.","caption":""}]}];const V=["zh3","zh2","живой"];const KEY='psycont_compare_2026-10-20_14-30compare-posty';
