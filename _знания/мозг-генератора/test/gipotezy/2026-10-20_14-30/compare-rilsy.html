время: успею сегодня, пока мама не начала?\n\nВы с мамой разговариваете или каждый вечер продлеваете себе статус хорошей дочери?","caption":"А фраза «могла бы и минутку найти» потом всплывает даже в отпуске, когда телефон лежит в номере.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые давно живут отдельно, а с родителями все еще сложно.\nОтправьте тому, кто тоже вечером смотрит на часы и вспоминает про звонок маме."},{"v":"zh2","text":"Девочки, кто звонит маме каждый вечер, потому что иначе завтра придется выслушивать, как вы про нее забыли, вы мои ответственные.\n\nУвидела опять совет: ну позвоните маме, вам что, сложно? И я прямо разозлилась.\n\nВот вы пришли домой. Пакет с продуктами поставили у двери, ужин греется, телефон рядом. И вы вспомнили, что маме сегодня еще не звонили. Есть хочется? Хочется. Но сначала мама, потому что после ужина можно уснуть, а утром будет это тихое: ну здравствуй, вспомнила наконец.\n\nИ вы набираете. Мама спрашивает, почему голос такой. Устали? От чего это вы так устали? Вы объясняете, что день тяжелый, и тут же добавляете бодрости, потому что она уже притихла и вы знаете, что сейчас услышите: ладно, я поняла, тебе со мной разговаривать тяжело.\n\nБлять, ужин остыл.\n\nВы уже и поесть не успели, и виноваты, и теперь надо еще поговорить нормально, чтобы мама положила трубку довольная.\n\nИ вот это меня цепляет сильнее всего. Вы ведь даже злитесь тихо, чтобы она не услышала.\n\nСколько вечеров вы уже так провели, девочки? И сколько раз потом говорили себе: да ладно, всего-то позвонила маме.","caption":"Меня особенно цепляет, когда взрослый человек радуется, что у мамы разрядился телефон. Наконец можно провести вечер без объяснительной.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nПодписывайтесь, если хочется еще таких разговоров про маму, себя и чувство вины."}]},{"id":"r_rod_1_2","topic":"мама обижается, если я не звоню каждый день","author":"Ольга","format":"reels_spisok","cards":[{"v":"живой","text":"Если у твоей девушки тревожная привязанность, вот три вещи, которые помогут ее понять. Первое. Когда ее накрывает, она может казаться агрессивной и слишком эмоциональной. В ее семье чувства не слышали, и она научилась кричать громче, чтобы ее услышали. Унизить тебя она не хочет. Второе. Она просит много контакта, потому что боится, что ты уйдешь. Ей нужно убедиться, что ты правда рядом. Контроль тут ни при чем. Третье. Она может устроить ссору в людном месте и ударить по больному. Знай, что ей в этот момент безумно страшно. А когда ребенку страшно, его берут на руки и успокаивают. Подписывайся, тут прокачиваем отношения.","caption":""},{"v":"zh3","text":"Четыре признака, что вы живете отдельно, но до сих пор планируете свой день так, чтобы мама не обиделась.\n\nПервое. Подруга позвала в кино, вы покупаете билет и сразу пишете маме, во сколько начнется сеанс, когда закончится, почему телефон будет без звука.\n\nВторой признак. Увидели звонок на совещании, вышли в коридор, шепотом объясняете, что сейчас неудобно. Мама говорит: «Я тебя совсем не слышу». Вы повторяете громче, коллеги ждут.\n\nТретье. Муж спросил, будете ли ужинать, а вы ему рукой показываете: тихо, тихо. Потому что мама услышит и начнет: «Все, я поняла, я вам мешаю». Блядь, меня прямо бесит, сколько стараний иногда нужно приложить, чтобы спокойно закончить обычный звонок.\n\nЧетвертое. Иногда вы скрываете от мамы хорошее. Купили билеты на выходные, радуетесь, но рассказывать пока не будете. Она спросит, с кем едете, потом вспомнит, что вы давно к ней не приезжали, потом скажет: «На всех у тебя время находится».\n\nА мама потом скажет: «Ты мне совсем ничего о себе не рассказываешь».\n\nЧто вы в последний раз ей не рассказали?","caption":"Меня особенно цепляет мамино «могли бы и каждый день звонить, нам много не надо». Взрослая дочь при этом уже несколько минут подбирает причину закончить разговор.\nМожете добавить в комментариях свой пункт."},{"v":"zh_h7_staryy","text":"Пять признаков тех, кому ежедневные звонки маме уже поперек горла, но пропустить страшно.\n\nПервое. От маминого имени на экране у вас сжимается живот. Просто не хотелось разговаривать, такого варианта в вашем списке вообще нет.\n\nВторое. Вы отдыхаете с оглядкой на время звонка. Телефон лежит рядом с подушкой.\n\nТретье. Ради маминого настроения вы прерываете время с другими людьми. Сели с мужем смотреть фильм, вспомнили про звонок, поставили на паузу, ушли на кухню, потому что при нем опять выслушивать про неблагодарность совсем не хочется. Меня злит, как легко это называют заботой о маме. Блядь, даже паузу нажимаете с чувством вины перед обоими.\n\nЧетвертое. Хорошую новость хочется придержать. Получили повышение, собираетесь в поездку, и сначала прикидываете, сколько вопросов будет про то, когда теперь найдете время для мамы.\n\nПятое. Пропущенный звонок становится расходом. На следующий день вы заказываете маме продукты, переводите деньги, покупаете что-нибудь без повода, хотя еще вчера таких планов не было. Даже чек сохраняете, вдруг понадобится напомнить.\n\nСколько у вас совпало?","caption":"Иногда разговор с мамой заканчивается, а вы еще полвечера проверяете, обычным ли голосом она попрощалась. Я бы эту часть тоже учитывала, когда слышу «тебе сложно пять минут поговорить?».\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nПодписывайтесь, если хочется еще таких разборов: здесь я говорю об отношениях с родителями во взрослой жизни."},{"v":"zh2","text":"Четыре признака того, что вы живете отдельно, но до сих пор планируете день так, чтобы мама не обиделась из-за звонка.\nПервое, вы заранее оправдываетесь за свою занятость. Рабочая встреча еще не началась, а вы уже отправили маме расписание, предупредили, когда освободитесь, объяснили, почему сегодня позже. И все равно посреди разговора с начальником проверяете телефон под столом. Потому что там может быть мамино «понятно, тебе некогда».\nВторое, рядом с близким человеком вы постоянно смотрите на время. Вы стоите у кафе без куртки, говорите «да, поела», «да, тепло оделась», и ваша тарелка остывает.\nТретье, вы злитесь, когда мама наконец берет трубку. И меня, блядь, бесит, сколько потом люди ругают себя за эту злость. Подробно.\nЧетвертое, вы скрываете от мамы хорошие дни. На вопрос, почему вчера не звонили, хочется сказать, что замотались, устали, рано легли. Говорите только, что устали. И вот вы уже оправдываетесь за то, что вам было хорошо.","caption":"Меня особенно цепляет мамино «я же не мешаю?», когда вы уже вышли из-за стола, чтобы ответить. Обед потом доедаете холодным.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые съехали от родителей, но все еще переживают из-за их обид.\nЕсли хочется, добавьте в комментариях свой пункт."},{"v":"h3h4_staryy","text":"Четыре признака, что вы звоните маме каждый день из страха ее обидеть.\nПервое. Вы заранее готовите оправдания. «Работала, потом магазин». Даже свободный вечер приходится объяснять уважительной причиной.\nВторое. Чужая обида для вас срочное дело. Коллега недоволен вашим отказом, и вы уже готовы задержаться. Ну сука, опять кому-то надо доказать, что вы хорошая.\nТретье. Вы скрываете приятное. Фото из ресторана маме потом отправите. Вдруг скажет: «На это время есть, а матери позвонить некогда».\nЧетвертое. Вам легче отдыхать, когда мама сама занята. «Сегодня не звони, мы в гостях». И вы прямо выдыхаете.","caption":"Иногда короткий звонок заканчивается, а мамино недовольство остается с вами до ночи. И вы еще перед сном отправляете сердечко, чтобы завтра разговор начался спокойно.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nПодписывайтесь, если хочется еще таких разборов отношений с родителями."}]},{"id":"r_men_1","topic":"мужчины не плачут, а потом срываются на детей","author":"Михаил","format":"reels_spisok","cards":[{"v":"zh2","text":"Четыре признака отцов, которые привыкли держать себя в руках, а дома срываются на детей.\n\nПервое, вы рассказываете о трудностях, только когда уже справились. На работе сократили отдел, вы остались за троих, жена спрашивает, как день, вы говорите: нормально. А потом сидите на кухне и злитесь, что никто даже не представляет, как вам тяжело.\n\nВторой признак, вы замечаете усталость, когда уже невозможно никого слышать. Но ребенок зовет посмотреть рисунок, и у вас вырывается: сколько можно меня дергать! Он уходит с листком. И вот это меня особенно задевает: человек весь день терпел, а ребенок подошел как раз тогда, когда сил терпеть уже нет.\n\nТретье, вам трудно отдыхать рядом с семьей. Жена смеется, ребенок пересказывает вам шутку, а вы раздраженно просите тишины. Только теперь все сидят тихо и стараются вас лишний раз не трогать.\n\nЧетвертое, детские слезы злят вас сильнее самой неприятности. Но ребенок продолжает плакать, и вы начинаете требовать, чтобы он немедленно успокоился. Чем громче он плачет, тем громче говорите вы.\n\nКогда вам самому хочется плакать, кому дома достается?","caption":"Иногда отец после ссоры приносит ребенку яблоко, поправляет одеяло, спрашивает про уроки. Подойти и сказать «я накричал на тебя, прости» ему гораздо труднее.\nМеня зовут Михаил, я психолог, работаю с мужчинами и отцами от 30 до 45 лет.\nСохраните, если узнали себя и хотите вернуться к этому позже."},{"v":"живой","text":"Всем привет, меня зовут Паша, и вот пять причин выбрать меня своим психологом. Причина первая. Я понимаю, о чем вы, когда вы говорите «кринж», «вайб» и «пикми». И «получку» с «хохмой» тоже понимаю. Причина вторая. У меня медицинское образование, я врач-психиатр и психотерапевт. Я знаю, почему крышечка подтекает и когда с этим надо к врачу. Причина третья. Со мной можно по-разному. Можем на сессии разобраться, почему попросить денег для вас как утонуть, а можем просто посидеть в тишине, потому что все заебало. Причина четвертая. Я не из тех, кто мило кивает. Я буду рядом, с пониманием, но не на стороне привычек, которые ломают вам жизнь. Причина пятая. Принимаю очно во Владивостоке и онлайн. Пишите в личку в телеграм.","caption":""},{"v":"h3h4_staryy","text":"Четыре признака отца, который запрещает себе плакать и срывается на детей.\nПервое. На работе вы проглатываете обиду. Начальник отчитал при всех, вы кивнули. Дома ребенок пролил сок, и голос уже слышно соседям.\nВторое. На вопрос «что случилось?» отвечаете «все нормально». Даже жене. Начнете рассказывать, еще голос дрогнет. Вот этого вы себе позволить не можете.\nТретье. Усталость тоже надо заслужить. Прилегли, увидели разбросанные игрушки, сразу встали: «Сколько можно за всеми убирать!»\nЧетвертое. Детские слезы вызывают злость: «Из такой ерунды реветь?» И тут же вспоминается: «Мне в его возрасте никто сопли не вытирал».\nВас больше злит, что он плачет, или что его утешают?","caption":"Иногда даже извинение перед ребенком застревает в горле: придется признать вслух, что самому было тяжело. Проще молча починить ему велосипед.\nМеня зовут Михаил, я психолог, работаю с мужчинами и отцами от 30 до 45 лет.\nСохраните, если хочется вернуться к этому разговору."},{"v":"zh_h7_staryy","text":"Пять признаков отцов, которые запрещают себе плакать, а потом срываются на детей.\n\nПервое. Вы замечаете свое состояние только тогда, когда уже болит голова.\n\nВторое. Отдыхать вам трудно, если дома кто-то еще чем-то занят.\n\nТретье. Детские слезы вы стараетесь остановить как можно быстрее.\nРебенок ревет из-за проигранной игры, а вы уже говорите, что из-за такой ерунды плакать стыдно, и меня злит совет учить мальчиков терпеть именно в такие минуты: вы сами сегодня проглотили обиду после разговора с начальником, пришли домой и теперь требуете от сына того же.\n\nЧетвертое. Хорошие новости вы встречаете списком новых обязанностей.\nВам повысили зарплату, жена обрадовалась, ребенок предлагает заказать пиццу, а вы уже объясняете, сколько теперь придется работать, что расслабляться рано, что еще кредит, и за весь вечер так и не произносите простую вещь: я доволен, у меня получилось, я этого ждал.\n\nПятое. На себя вы тратите деньги с длинным оправданием.\n\nСколько пунктов у вас совпало?","caption":"Фразу «папа устал» ребенок тоже слышит. Но после крика ему бывает трудно понять, можно ли сейчас подойти к папе с обычным вопросом.\nМеня зовут Михаил, я психолог, работаю с мужчинами и отцами от тридцати до сорока пяти.\nСохраните, если захотите вернуться к этому разговору."},{"v":"zh3","text":"Четыре признака отцов, которые привыкли сдерживать слезы и обиду, а теперь все чаще срываются на детей.\n\nПервое, вы подробно объясняете, почему злитесь, и почти никогда не говорите, что вам больно.\n\nВторой признак, вы сердитесь, когда о вас заботятся. Жена спрашивает, что случилось, предлагает поговорить, а вы отвечаете, что все нормально, хватит уже спрашивать. Жена уходит в другую комнату, вы сидите на кухне один. Поговорили.\n\nТретье, ребенку достается за то, за что взрослому вы бы ничего не сказали. Сын перед сном просит еще посидеть рядом. Вы уже согласились, потом он просит воды, потом поправить одеяло, и вы вдруг кричите: сколько можно, я тебе весь вечер посвятил! Он сразу замолкает и говорит, что уже ничего не надо. Вот это меня особенно задевает.\n\nЧетвертое, чужие слезы вам трудно выдерживать. В том числе слезы собственного ребенка. Он плачет из-за проигранного матча, а вы начинаете объяснять, что надо было лучше играть. Но сын уже вытирает лицо рукавом и отворачивается. Папа рядом, а поплакать при нем нельзя.\n\nЕсли сын однажды скажет вам, что у него все нормально, тем же голосом, каким вы отвечаете жене, вы ему поверите?","caption":"Иногда отец после срыва покупает ребенку что-нибудь вкусное, потому что заговорить о случившемся ему стыдно. А ребенок продолжает гадать, можно ли уже подойти к папе.\nПодписывайтесь, если хочется еще таких разговоров об отцовстве, злости и отношениях с детьми."}]},{"id":"r_men_1_2","topic":"мужчины не плачут, а потом срываются на детей","author":"Михаил","format":"reels_spisok","cards":[{"v":"zh2","text":"Отцы, которые весь день держатся, а вечером орут из-за пролитого сока, ну что, крепкие вы мои.\n\nМеня злит, когда вам снова предлагают просто собраться.\n\nИ вот вы открываете дверь. Ребенок бежит показывать рисунок, вы киваете, снимаете ботинки, он тянет вас за рукав. Вам бы сейчас хоть немного тишины.\n\nА потом он опрокидывает стакан.\n\nСок течет по столу, капает на ваши брюки, и вы кричите так, будто ребенок сделал это специально, лично против вас, после всего вашего сегодняшнего дня.\n\nОн про ваш день ничего не знает. Он вам динозавра нес показать.\n\nВы потом стоите с тряпкой. Сок уже вытерли, брюки можно постирать, а он унес рисунок в комнату. И вам стыдно. Так стыдно, что даже подойти трудно. Проще спросить из коридора, собрал ли он рюкзак.\n\nПотому что окружающие вполне могут считать вас спокойным человеком.\n\nА дома сын уже умеет по тому, как вы положили ключи, понять, можно сегодня подойти с рисунком или лучше сразу уйти к себе.\n\nСколько ему еще учиться угадывать ваше настроение?","caption":"После крика ребенок иногда сам начинает вас успокаивать: «Пап, я больше не буду». И тогда особенно трудно услышать, насколько сильно он испугался.\nМеня зовут Михаил, я психолог, работаю с мужчинами и отцами.\nПодписывайтесь, если хочется еще таких разговоров о мужских переживаниях и отношениях с детьми."},{"v":"zh3","text":"Четыре признака отца, который привык все терпеть и потом срывается на детей.\nПервое, вы соглашаетесь, даже когда уже злитесь. На работе вам передают чужую задачу перед самым уходом, вы говорите: «Ладно, сделаю». Домой приезжаете поздно, ребенок просит помочь собрать конструктор, и тут вы можете резко ответить. Теперь он тихо собирает один.\nВторое, близкие узнают, что вам плохо, когда вы уже повысили голос. Жена спрашивает, как дела, вы отвечаете: «Нормально». Потом дома кто-то включает телевизор погромче. И вы взрываетесь: «Можно хоть немного обо мне подумать?» Меня здесь очень задевает, сколько всего мужчина успевает вынести молча, прежде чем вообще скажет, что ему тяжело.\nТретье, вам трудно принять помощь даже дома. Вы отвечаете ему, глядя в телефон, и надеетесь, что сегодня он быстро уснет.\nЧетвертое, вам особенно трудно выдержать детские слезы. Сын проиграл в настольную игру и плачет. Хочется, чтобы он немедленно собрался, вытер лицо и нормально разговаривал. Вы ведь сами весь день именно так и делали. Вы уже кричите «успокойся» громче, чем плачет ваш ребенок.","caption":"После крика бывает стыдно даже подойти к ребенку, и отец до вечера с ним почти не разговаривает. Если срывы повторяются, с этим стоит обратиться к психологу.\nЯ Михаил, психолог, работаю с мужчинами и отцами, чаще от тридцати до сорока пяти.\nЕсли узнали себя, можете написать в комментариях свой пункт."},{"v":"живой","text":"Я психолог, и это не помешало мне обосраться. Поделюсь историей своего некрасивого успеха. В теории я знаю, что любой рост идет вместе со стыдом и страхом. Только знание не освобождает от того, чтобы все это прожить. С начала месяца у меня начало получаться то, к чему я шла. Как думаете, я обрадовалась? Да, конечно. Но честно, страха и стыда оказалось больше. Мне не хотелось никому рассказывать, начались бессонницы, а вчера я просто плакала от того, что у меня получается. Раньше в этом месте я сдувалась и возвращалась в точку ноль. Сейчас мне до одури страшно, мне стыдно, но я иду дальше. И для меня это большая победа.","caption":""},{"v":"zh_h7_staryy","text":"Пять признаков отца, который привык терпеть до срыва.\n\nПервое. Вы замечаете напряжение только по телу: вечером болит голова, зажаты плечи, зубы стиснуты, но на вопрос жены, как прошел день, отвечаете, что нормально, хотя весь день хотелось послать всех подальше.\n\nВторой признак. Отдых тоже приходится терпеть: сели смотреть фильм с семьей, ребенок спрашивает, кто этот дядя, потом просит воды, потом снова что-то спрашивает, и вы уже повышаете голос.\n\nТретье. Взрослым вы отвечаете гораздо мягче, чем ребенку: начальник меняет задачу в конце дня, вы говорите, что сделаете, приятель отменяет встречу, вы пишете, что ничего страшного, а дома достаточно потерянного носка.\n\nЧетвертое. Хорошие новости вы сразу превращаете в следующую обязанность: сын принес хорошую отметку, вы спрашиваете про остальные предметы, получили прибавку, сразу считаете, сколько теперь можно откладывать.\n\nПятое. С деньгами вы легко оплачиваете всем нужное, но собственную покупку откладываете месяцами: куртка еще годится, кроссовки можно подклеить, без этого обойдусь, сейчас другие расходы.\n\nСколько совпало?","caption":"После крика бывает трудно подойти к ребенку: придется признать вслух, что сорвались. И разговор откладывается до вечера, до выходных, пока все снова не станет как обычно.\nЯ Михаил, психолог, работаю с мужчинами от тридцати до сорока пяти, в том числе с отцами.\nПодписывайтесь, если хочется еще таких разговоров: здесь про мужские переживания и отношения с детьми."},{"v":"h3h4_staryy","text":"Четыре признака отца, который запрещает себе раскисать и срывается на детей.\nПервое. Обиду вы сразу обесцениваете. Начальник унизил при коллегах, вы себе: «Переживу, маленький, что ли?» И продолжаете работать.\nВторое. Напряжение замечаете уже по голосу. Ребенок третий раз зовет посмотреть рисунок, и вы слышите собственное: «Да подожди ты!» Хотя еще минуту назад считали себя спокойным.\nТретье. Даже усталость надо заслужить. Сели на диван, тут же вспоминаете несобранный шкаф. Давайте так, у вас даже к дивану нужен допуск.\nЧетвертое. Детские слезы злят сильнее самого проступка. Разбил чашку, ладно. Но когда начинает плакать, хочется рявкнуть: «Прекрати!» Внутри уже звучит: «Я терплю. Почему ему можно?»","caption":"«Меня так воспитывали, я вырос нормальным» часто закрывает разговор именно там, где хочется спросить: какой ценой? Особенно если признаться в обиде на своего отца до сих пор стыдно.\nМеня зовут Михаил, я психолог, работаю с мужчинами от 30 до 45 лет, с отцами.\nПодписывайтесь, если хочется еще такого: здесь говорим об отцовстве, чувствах и отношениях."}]},{"id":"r_vopros_2","topic":"«а о чем вообще говорить на первой сессии?»","author":"Юлия","format":"reels_scenka","cards":[{"v":"zh2","text":"Б: Можно начать прямо с этого: я не знаю, что говорить.\nА: Ужасно же.\nБ: Какую, например?\nА: Ну, что мама позвонила, я не взяла трубку. Потом весь ужин смотрела на телефон, думала, она обиделась. Уже набрала ей сообщение, стерла, опять набрала. Но с таким вообще приходят?\nБ: А ты весь ужин переживала.\nА: Ну да. Взрослая женщина сидит перед тарелкой макарон и боится маме не перезвонить.\nБ: Чтобы я что подумала?\nА: Господи, я еще даже не пришла, уже объясняю, почему имею право про этот звонок рассказать.\nБ: Да. Я бы предложила здесь задержаться.\nА: У меня даже заметка в телефоне есть. Я ее все переписываю.\nБ: Что ты из нее убираешь?\nА: Все, что кажется глупым. Про звонок убрала, кстати. Получается, можно открыть эту заметку и сказать: вот это я хотела рассказать, но испугалась, что ты послушаешь и подумаешь, зачем она вообще ко мне пришла?\nБ: Да.","caption":"Мне хочется, чтобы перед первой встречей тебе не приходилось репетировать даже собственные переживания. Если пока трудно придумать, с чего начать, приходи с этим вопросом.\nЯ Юлия, психолог, помогаю тем, кто собирается на первую встречу.\nПодписывайся, если хочется еще: здесь я рассказываю, как проходит терапия."},{"v":"zh3","text":"Б: Можно прийти без заготовленной темы.\nА: А если я сяду и буду молчать?\nБ: А пока представляла, что хотелось рассказать?\nА: Как мама звонит, а я смотрю на телефон и жду, когда перестанет. Потом сама перезваниваю, потому что вдруг что случилось. Хотя знаю, что она спросит, почему я сразу не ответила.\nБ: Что мешает рассказать об этом?\nА: Ну люди приходят, когда у них правда что-то случилось. Ты вообще поймешь, зачем я пришла?\nБ: Ты боишься, что я сочту это ерундой?\nА: Конечно.\nБ: И сейчас ты решаешь, что мне можно рассказать?\nА: Да.\nБ: А что тебе хотелось сказать до этих объяснений?\nА: Что я иногда очень не хочу брать трубку. И мне стыдно это произносить, даже тебе. Получается, я могу вот так и начать? Без всей этой речи про то, какая у меня хорошая мама?\nБ: Да.","caption":"Я могу спросить, как тебе было решиться и записаться. Иногда мы начинаем знакомство с того, что ты чуть не отменила встречу.\nМеня зовут Юлия, я психолог, помогаю тем, кто впервые решается на терапию.\nПодписывайся, если хочется еще таких сценок: здесь я рассказываю, как проходят встречи с психологом."},{"v":"h3h4_staryy","text":"А: Я впервые у психолога и вообще не знаю, что говорить.\nБ: С чего хотела начать?\nА: Составила список. Потом почти все вычеркнула.\nБ: Что ты вычеркнула?\nА: Что устала. Что мне обидно, когда мама перебивает.\nБ: Почему это вычеркнула?\nА: Ну все устают. И мамы у всех такие.\nБ: И что осталось?\nА: Ничего. Я подумала, вам надоест слушать мои жалобы.\nБ: Я сказала, что надоело?\nА: Нет. Я еще ничего толком не успела рассказать.\nБ: А сейчас кто тебя перебил?","caption":"На первую встречу можно прийти со списком в телефоне и ни разу его не открыть.\nЯ Юлия, психолог, работаю с теми, кто впервые собирается в терапию.\nОтправь тому, кто пока собирается с духом."},{"v":"zh_h7_staryy","text":"Б: Я не жду от тебя подготовленного рассказа.\nА: Ну как? Я приду, сяду, ты спросишь, что меня привело. И я скажу: не знаю.\nБ: А дальше я спрошу про это.\nА: А я буду сидеть и жаловаться, что мама опять позвонила, пока я ужинала.\nБ: Что тебе хочется сказать про этот звонок?\nА: Что я устала. Что хотела спокойно поесть. Я уже представляю, как ты слушаешь и думаешь: господи, какая ерунда, человек к маминому звонку придирается.\nБ: Ты ждешь, что я тебя осужу?\nА: Конечно.\nБ: И передо мной нужно заслужить право пожаловаться?\nА: Ну, если сразу пожаловаться, откуда ты поймешь, что я нормальная?\nБ: Что получилось бы с таким рассказом?\nА: Я бы выкинула все, за что меня можно осудить. И потом сидела бы у тебя, боялась что-нибудь ляпнуть. Получается, я могу начать прямо с того, что боюсь тебе рассказывать?\nБ: Да.","caption":"Я спокойно отношусь к паузам в разговоре. Иногда человек замолкает посреди фразы, и я оставляю ему место договорить.\nЯ Юлия, психолог, работаю с теми, кто впервые собирается в терапию.\nОтправь тому, кто пока боится записаться."},{"v":"живой","text":"А: (давит бутылку) Пытаюсь выдавить майонез. Опять кетчуп.\nБ: Так это же кетчуп. Возьми майонез.\nА: Мне нужен майонез из этой бутылки.\nБ: Зачем?\nА: Может, я просто мало стараюсь. Рано или поздно должно получиться.\nБ: Дави сколько хочешь. Это кетчуп.\nА: Я еще разок попробую.\nБ: Ладно. Майонез будет тут, если что.\nА: (давит) Давай, давай!","caption":""}]},{"id":"r_vopros_2_2","topic":"«а о чем вообще говорить на первой сессии?»","author":"Юлия","format":"reels_otvet","cards":[{"v":"живой","text":"«Зачем мне психолог, я и так все про себя знаю». Слышу это постоянно. Хорошо, смотри. Ты можешь прочитать двадцать книг про тревогу, спросить чат-бота, посмотреть все мои рилсы. И знать будешь много. А в два часа ночи все равно лежишь и прокручиваешь один разговор. Потому что знание живет в голове, а тревога живет в теле и в привычках. Их не прочитаешь, их меняют медленно, вместе с живым человеком, который рядом и видит то, чего ты сама не замечаешь. Так что знай себе на здоровье. А если надоело знать и хочется, чтобы стало по-другому, запись у меня в шапке профиля.","caption":""},{"v":"zh3","text":"А о чем вообще говорить на первой сессии?\n\nОткрывают заметки, составляют список, потом перечитывают и половину удаляют. Про это стыдно, это какая ерунда, а это я вообще должна была давно сама решить. И в итоге приходят с ощущением, что говорить особенно не о чем. Хотя еще вчера из-за того, что удалили, не могли уснуть.\n\nНу вот, допустим, ты весь вечер проверяла, ответил ли тебе мужчина. Отложила телефон, взяла обратно, открыла переписку, посмотрела, когда он был в сети. Хотела спросить, увидитесь ли вы в выходные, но решила подождать, пока сам напишет. Уже пора спать, а ты все проверяешь.\n\nА когда представляешь, как расскажешь это психологу, становится неловко. Взрослая женщина, работаешь, сама оплачиваешь квартиру, и вот пришла поговорить, почему тебе не ответили на сообщение.\n\nВот здесь я могу спросить: «Ты сейчас переживаешь, что я тоже сочту это глупостью?»\n\nПоэтому начало первой встречи вполне может звучать так: «Я даже записала, о чем хочу поговорить, а теперь мне стыдно это читать».\n\nС этого мы уже можем начать разговор.","caption":"Перед первой встречей можно спросить меня, как все устроено: сколько она длится, где мы встретимся, как пройдет оплата. Такие вопросы я тоже жду.\nМеня зовут Юлия, я психолог, помогаю решиться на первую встречу и освоиться в терапии.\nНапиши в комментариях, о чем тебе было бы неловко спросить психолога."},{"v":"h3h4_staryy","text":"А о чем вообще говорить на первой сессии? Можно начать с того, что ты боишься выбрать какую-нибудь ерунду. Вот прямо так и сказать. Допустим, перед встречей ты перебираешь: про маму, про работу, про то, что он весь день не отвечал? Ну, последнее вроде стыдно. Люди с серьезными проблемами приходят, а ты со своими сообщениями. И уже сидя напротив меня, говоришь: «Наверное, это глупость». Вот тут я бы задержалась. Ты еще ничего не рассказала, а уже извиняешься за то, что тебе больно. И я бы спросила: «А чье согласие тебе нужно, чтобы считать это достаточно серьезным?»","caption":"Иногда перед первой встречей хочется даже записать все по пунктам. Я спокойно отношусь к тому, что ты принесешь список и в итоге заговоришь совсем о другом.\nМеня зовут Юлия, я психолог, помогаю разобраться тем, кто впервые собирается в терапию.\nПодписывайся, если хочется еще такого: здесь я рассказываю, что происходит у психолога."},{"v":"zh2","text":"А о чем вообще говорить на первой сессии? Можно прямо об этом. О том, что ты сидишь передо мной и понятия не имеешь, что сейчас говорить.\n\nИ вот ты вечером открываешь заметки в телефоне, пишешь, стираешь, снова пишешь.\n\nЯ против того, чтобы человек еще до нашей встречи успел себя за это отругать.\n\nДопустим, ты начинаешь рассказывать, как поссорилась с мамой. Хотела сказать коротко, но пришлось объяснить, почему вообще ей позвонила, что она сказала про твою работу, почему ты промолчала. И вдруг ты останавливаешься: «Ой, я, наверное, какую-то ерунду рассказываю. Я столько времени уже говорю».\n\nВот тут я могу спросить: «Ты сейчас переживаешь, что мне скучно тебя слушать?»\n\nИли: «Как ты решила, что рассказываешь ерунду?»\n\nКстати, я могу уточнить, кого ты сейчас имеешь в виду, попросить вернуться к твоим словам, спросить, что ты почувствовала. Я участвую в разговоре.\n\nЕсли у тебя есть вопросы ко мне, их тоже можно задать.\n\nМне хочется услышать тебя, в том числе когда ты путаешься, замолкаешь, вспоминаешь что-то по дороге. Так я и работаю: слушаю, спрашиваю и оставляю тебе возможность меня поправить.","caption":"Иногда перед первой встречей хочется спросить даже о том, где сесть. Я спокойно отношусь к таким вопросам.\nМеня зовут Юлия, я психолог, работаю с теми, кто впервые решается на терапию.\nНапиши в комментариях свой вопрос о первой встрече."},{"v":"zh_h7_staryy","text":"А о чем вообще говорить на первой сессии? Можно начать прямо с этого вопроса.\n\nВот ты садишься и говоришь: я хотела прийти, записалась, а теперь думаю, что у меня вообще ничего такого нет. У других проблемы серьезнее. И я могу спросить: а что происходило, когда ты решила записаться? Что тогда хотелось рассказать?\n\nЭто знакомая история даже с обычным сообщением подруге. Хочешь рассказать, что поссорилась с мамой, открываешь переписку, начинаешь печатать, потом стираешь. У подруги работа, дети, свои дела. Пишешь, что все нормально. И вроде никто тебе говорить не запрещал, но рассказ так и остался у тебя.\n\nЯ считаю, что требовать от себя такой ясности перед первой встречей слишком много. Ты ведь как раз приходишь с тем, в чем пока трудно разобраться.\n\nМне самой нужно время, чтобы тебя услышать и понять, как ты живешь, что тебя тревожит, о чем тебе особенно трудно говорить.\n\nПоэтому, если ты придешь и скажешь: я всю дорогу думала, о чем говорить, и теперь у меня пусто в голове, я спрошу, чего ты ожидала от этой встречи. С этого мы и начнем.","caption":"Перед встречей можно спросить меня, как устроена оплата или что делать, если опаздываешь. Такие вопросы тоже можно задавать, даже если они кажутся мелкими.\nЯ Юлия, психолог, работаю с теми, кто впервые решается прийти.\nПодписывайся, если хочется еще таких разговоров: здесь я рассказываю, как проходит работа с психологом."}]},{"id":"r_money_1","topic":"стыдно просить повышение, хотя работаю больше всех","author":"Ольга","format":"reels_malysh","cards":[{"v":"zh2","text":"Стыдно. Хорошая моя, вы работаете за себя, за коллегу, которая заболела, доделываете вечером то, что начальник вспомнил перед самым уходом, и все равно вам стыдно спросить про повышение. Как будто сейчас большие дяди посмотрят на вас и скажут: ой, а мы думали, вы просто хорошая.\n\nСтыдно, и вот вы сидите вечером с ноутбуком на кухне, ужин уже холодный, дописываете презентацию к утру, и начальник присылает: «Спасибо, выручаете!» Вы отвечаете: «Да, конечно», ставите улыбочку, хотя заебались так, что хочется закрыть ноутбук прямо посреди слайда. И все равно где-то внутри надеетесь: ну теперь он точно понял. Теперь увидел. После такой презентации уже сам предложит.\n\nИ вот это ожидание меня злит: вы каждый вечер расплачиваетесь своим временем за надежду, что однажды вам ничего не придется просить.\n\nВы ведь собирались поговорить о зарплате, а уже приготовились узнать о себе что-нибудь ужасное.\n\nСтыдно, и вы снова выбираете еще одну задачу: с ней хотя бы понятно, что делать, куда нажать, кому отправить готовый файл. Можно снова почувствовать себя полезной и еще немного отложить тот разговор, в котором у вас есть собственная просьба.\n\nСтыдно попросить денег, когда привыкли ждать похвалы.","caption":"Начальник может искренне радоваться, что вы справляетесь, и месяцами не поднимать вопрос о зарплате. Особенно если на каждую новую задачу вы отвечаете: «Да, успею».\n\nЯ Ольга, психолог, работаю с женщинами, которые работают в найме.\nСохраните, если перед разговором о зарплате хочется взять еще одну задачу."},{"v":"живой","text":"Он скинул тебе смешной рилс, а ты пролистала и даже реакцию не поставила. Вроде мелочь, да? Но если такие мелочи повторяются, они влияют на отношения намного сильнее, чем кажется. Отношения держатся на мелочах, которыми вы друг друга окликаете. Тот самый смешной рилс. Фотка заката из окна. Сообщение «как ты там». В них всегда есть что-то непроговоренное: я про тебя помню, я тебя вижу, ты мне важна. Понятно, ситуации бывают разные, мы не идеальны. Но если раз за разом никто не откликается, внутри появляется: я не интересна, я одна в этих отношениях. Отношения разрушают маленькие вещи, когда тебя раз за разом не замечают. Так что не жадничай на «ахаха» в ответ на рилс.","caption":""},{"v":"zh3","text":"Стыдно, хорошая моя, вы столько всего делаете, а сказать начальнику, что хотите больше денег, почему-то стыдно. Как будто вы сейчас попросите наклеечку за хорошее поведение, и взрослая тетя посмотрит на вас и скажет: ну ты сама-то как считаешь, заслужила? И вы сразу начнете вспоминать, где ошиблись, куда опоздали, на какое письмо ответили только на следующий день.\n\nСтыдно, и вот уже пятница, вы сидите над чужим отчетом, потому что коллега ушла, а в понедельник его надо сдавать. Начальник пишет: спасибо, вы нас очень выручили. Вы смотрите на это спасибо, потом на время, потом опять на спасибо. И отвечаете: да, конечно, все будет готово. Хотя вы вообще-то хотели написать про зарплату. Даже открыли отдельное сообщение. И закрыли.\n\nБлядь, меня вот это очень злит: вы даже в собственном сообщении начальнику стараетесь ничего у него не попросить. Чтобы ему было приятно вас хвалить, чтобы вы остались той сотрудницей, с которой никаких сложностей.\n\nСтыдно попросить больше денег. Попросить вас поработать в выходные ему вполне удобно.","caption":"Перед разговором о зарплате так и хочется извиниться за беспокойство. Хотя начальник обсуждает с вами рабочие вопросы весь день.\nЯ Ольга, психолог, работаю с женщинами, которые устают на работе и продолжают требовать от себя еще.\nСохраните, если давно откладываете этот разговор."},{"v":"zh_h7_staryy","text":"Девочки, хорошие мои, я психолог, и мне очень хочется поговорить про это ваше «еще чуть-чуть».\n\nКак будто вам должны выдать наклеечку за хорошую работу, и вот с ней уже можно идти к начальнику и говорить про повышение.\n\nВот сегодня коллеги закончили работу, а вам прилетела дополнительная задача, и вы уже собирались закрыть ноутбук, но открыли файл, потому что такая возможность показать, какая вы полезная, и жалко ее упускать. Поесть потом. Сообщение про пересмотр зарплаты пока лежит в черновиках.\n\nОчень удобно для всех остальных, кстати.\n\nЕще чуть-чуть, и вы получите ту самую наклеечку. Только выдачу вы каждый раз переносите сами. Сделали дополнительную задачу, хорошо, теперь надо еще месяц без ошибок. Прошел месяц, хорошо, теперь дождемся окончания проекта. Блядь, у этой наклеечки условия все время меняются.\n\nПоэтому еще одна задача ощущается проще, чем разговор. Задача знакомая. Ее можно выполнить.\n\nА пока выбираете снова открыть файл, потому что там понятно, как стараться, и можно на вечер отложить этот неприятный момент, когда ваше желание услышит другой человек и у него будет собственная реакция.\n\nЕще чуть-чуть. Вы все еще ждете разрешения попросить.","caption":"Черновик сообщения начальнику иногда редактируют дольше, чем отчет за месяц. Даже слово «обсудить» кажется слишком требовательным.\nЯ Ольга, психолог, работаю с женщинами, которые работают в найме.\nЕсли узнали себя, напишите в комментариях «потом»."},{"v":"h3h4_staryy","text":"Хорошие мои, вы работаете больше всех, а попросить повышение зарплаты стыдно?\n\nВ голове у вас звездочка за хорошее поведение. Ее дают, когда вы помогаете, соглашаетесь, ничего себе не просите. Вот какая ХОРОШАЯ.\n\nВ пятницу начальник приносит еще один отчет. Вы уже собирались домой, но берете. Еще звездочка.\n\nА заговорить про денежки страшненько. Вдруг звездочку снимут? Скажут: «Так вы ради денег старались?»\n\nБлядь, получается, за дополнительную работу вы расплачиваетесь еще и молчанием.\n\nВы ждете, когда заслуг станет столько, что просить будет прилично. Только у этой звездочки такое условие: хорошая девочка сама ничего не просит.\n\n«Я хочу обсудить повышение зарплаты».","caption":"Список своих задач вы можете написать за пять минут. А сообщение с просьбой о встрече переписывать весь вечер.\nЯ Ольга, психолог, работаю с женщинами, которые строят карьеру в найме.\nЕсли знакомо, напишите в комментариях «звездочка»."}]},{"id":"r_money_1_2","topic":"стыдно просить повышение, хотя работаю больше всех","author":"Ольга","format":"reels_monolog","cards":[{"v":"h3h4_staryy","text":"«Мне стыдно просить повышение, хотя я работаю больше всех».\n\nВы вечером доделываете отчет. Открываете чат начальницы, собираетесь попросить встречу про зарплату. И тут: «Может, сначала еще тот проект вытянуть?» Блядь, еще один. Чтобы уж точно заслужить.\n\nСмотрите, вы можете годами жить с негласным договором: я угадываю, что вам нужно, делаю больше, вы САМИ замечаете и меня награждаете. Красивый договор. Только начальница его вообще не подписывала.\n\nА попросить стыдно, потому что в этом договоре хорошую сотрудницу должны заметить без напоминаний. Приходится самой объявить: мой труд стоит дороже.\n\nСколько еще отчетов вы собираетесь написать вместо одного разговора?","caption":"У начальницы ваша готовность брать еще может давно записаться в «ее все устраивает». Особенно если на каждую новую задачу вы отвечаете: «Да, конечно».\nЯ Ольга, психолог, работаю с женщинами, которые строят жизнь и карьеру в найме.\nЕсли хотите обсудить это на консультации, пишите в директ слово «разбор»."},{"v":"zh2","text":"Только что увидела совет: если стесняетесь просить повышение, сначала докажите свою ценность. Сижу, перечитываю и бешусь. Вы уже закрываете задачи за двоих, обучаете новенькую, отвечаете вечером, выходите из отпуска с ноутбуком, осталось директору кота к ветеринару отвезти. Потом, видимо, можно будет осторожно спросить про деньги.\n\nБлядь, сколько еще доказывать?\n\nВот вы вечером доделываете презентацию. Подруга присылает голосовое, зовет встретиться, вы отвечаете, что опять никак. Руководитель пишет: «Спасибо, очень выручили». Вы радуетесь, ну приятно же, когда заметили. И думаете: завтра скажу про повышение.\n\nУтром открываете переписку. Он просит срочно поправить еще пару слайдов. Вы пишете «конечно», а подготовленное сообщение про зарплату остается в заметках.\n\nПочему? Вы уже представляете, как он прочитает и подумает: вот ведь, все ей мало. Мы ее ценим, доверяем, а она деньги считает.\n\nИ вы соглашаетесь еще поработать. Чтобы он точно понял, какая вы хорошая. А потом еще чуть-чуть. Сука, вы уже ужин разогреваете второй раз, потому что первый остыл, пока вы вносили правки.\n\nЯ тоже сейчас чуть не сказала: «Да просто спросите уже». Поймала себя. Мне легко возмущаться советом в телефоне, а вам завтра сидеть напротив своего руководителя и ждать его ответа.\n\nВот это и трудно: попросить больше, когда очень хочется, чтобы вами всегда были довольны.","caption":"«Вы же наша палочка-выручалочка» звучит особенно паршиво, когда коллеги уже ушли домой, а вы все еще на работе.\nМеня зовут Ольга, я психолог, работаю с женщинами, которые устают тащить все на работе и дома.\nПодписывайтесь, если хочется еще таких разговоров про работу, отношения и чувство вины."},{"v":"zh3","text":"Только что увидела совет: стесняетесь просить повышение, сначала покажите, на что способны. Сижу с чаем и думаю: девочки, куда еще показывать? Вы уже делаете свою работу, доделываете за коллегой, отвечаете после шести, обучаете новенькую, знаете, кому звонить, когда опять ничего не работает. Осталось начальнику на отпуск чемодан собрать, чтобы окончательно убедился.\n\nИ вот это «сначала заслужите» меня бесит.\n\nВот понедельник. Вы собирались поговорить с руководителем про зарплату. Даже вечером набрали в заметках, сколько задач у вас прибавилось. Открываете эти заметки перед работой и думаете: сейчас отчет сдам, он увидит результат, тогда будет удобнее зайти.\n\nСдали. Руководитель пишет: спасибо, отлично, и сразу спрашивает, сможете ли вы еще помочь с презентацией. Вы пишете: конечно. Хотя собирались сегодня уйти вовремя, у вас запись к врачу, и теперь опять придется звонить, переносить.\n\nБлядь, да он уже сказал, что вы отлично работаете.\n\nЯ сейчас сама разошлась и уже готова возмущаться вашим начальником, хотя вообще его не знаю.\n\nА вы пока добавляете себе еще задач, надеясь, что после них разговор наконец начнет руководитель.\n\nСколько еще нужно сделать, чтобы он сам догадался?","caption":"Особенно обидно потом услышать на увольнении: «А почему вы раньше не сказали, что вас зарплата не устраивает?» Вы ведь считали, что по количеству работы все понятно.\nПодписывайтесь, если хочется еще таких разговоров про работу, отношения и страх оказаться неудобной."},{"v":"zh_h7_staryy","text":"Я сейчас пью кофе и читаю совет: если стыдно просить повышение, просто покажите, что вы его заслужили. Ну сколько еще показывать, девочки?\n\nВы уже чужие задачи подхватили, новичка обучили, вечером на сообщения ответили, в отпуске файл нашли, скоро будете в офисе фикус поливать силой профессиональной мотивации.\n\nМеня бесит это бесконечное «сначала заслужите». Блядь, когда уже достаточно?\n\nВот вы закрыли свою работу, взяли кусок работы коллеги, руководитель сказал, что без вас бы вообще не справились. Думаете, ну теперь он видит, теперь понимает, сколько я делаю, наверняка сам поднимет вопрос о зарплате.\n\nПроходит время. Он снова приносит вам задачу. Зарплата та же.\n\nИ что вы делаете? Берете.\n\nЯ сама тоже могу мысленно отрепетировать разговор так, что собеседник там успеет и обидеться, и разочароваться, и посмотреть на меня с укором. Очень производительное воображение. Собеседник пока вообще занят обедом.\n\nЯ бы очень хотела, чтобы начальство читало мысли и само замечало этот внутренний счетчик.\n\nНо пока из молчания у нас отлично получается только еще одна задача. Сейчас допью кофе и тоже мысленно получу повышение. Охуенный финансовый план.","caption":"Особенно неловко бывает после похвалы: руководитель вас поблагодарил, и разговор о деньгах уже кажется чем-то, что испортит хороший момент.\nЯ Ольга, психолог, работаю с женщинами, которые устают быть удобными и дома, и на работе.\nЕсли хотите обсудить это на консультации, пишите в директ слово «разбор»."},{"v":"живой","text":"Умное говно, которое вам подают под соусом психологии: ты сама притянула себе в жизнь такого мужика. Давайте так, мы никого не притягиваем, мы просто живем свою жизнь, мы не управляем потоками вселенной и не знаем, кто к нам придет. Самое опасное в этой фразе: она заставляет вас копаться в себе в поисках причины чужого говна. А почему я его притянула? А что со мной не так? Может быть у меня плохие отношения с мамой или слабая фигура отца? Но вы выбираете, оставить этого человека в своей жизни или вышвырнуть его нафиг? Здесь уже да, ваша зона ответственности. Не за то, что он пришел, а за то, сколько времени вы позволили ему остаться и на каких условиях.","caption":""}]},{"id":"r_body_1","topic":"ненавижу себя в зеркале перед отпуском","author":"Юлия","format":"reels_poslanie","cards":[{"v":"zh2","text":"Это тебе, если ты примеряешь купальник перед отпуском и думаешь: с таким животом я вообще куда собралась? Моя хорошая, ты ведь уже почти решила оставить его дома. И платье тоже. В чемодане лежит огромная футболка, в которой жарко, зато можно сесть и перестать каждую секунду втягивать живот.\n\nЯ каждый раз сержусь, когда вижу эти призывы срочно подготовить тело к морю. Ну конечно. Билеты купила, отпуск согласовала, чемодан достала, теперь еще изволь пройти осмотр у самой себя. Повернись боком. Наклонись. Сядь. О, сидя складка появилась, все, поездку отменяем.\n\nИ ведь ты можешь понимать, насколько это жестоко, и все равно продолжать. Подтянуть купальник повыше, отвернуться, снова посмотреть. Может, при другом свете будет лучше? На секунду нравится. Потом замечаешь еще что-нибудь.\n\nПослушай, ты до этого чемодана еще добралась. Доделывала работу, отвечала на сообщения, выясняла, что можно взять в ручную кладь, искала бронь, которую точно куда-то сохранила. ГОСПОДИ, ТЫ ДАЖЕ ОТПУСК ОРГАНИЗОВАЛА. Там отдельный отдел нужен, а ты одна.\n\nМне хочется сказать тебе это без уговоров полюбить каждую складку, без еще одного требования, которое придется выполнять перед вылетом.\n\nТы уже достаточно себя обругала.","caption":"Меня особенно злит реклама похудения рядом с фотографиями пляжа. Как будто вместе с билетом тебе уже выдали замечание к внешности.\nЯ Юлия, психолог, работаю с девушками и женщинами от 20 до 40.\nСохрани, чтобы включить себе перед отпуском."},{"v":"zh_h7_staryy","text":"Если перед отпуском ты смотришь в зеркало и думаешь, что с таким телом вообще никуда ехать нельзя, я хочу сказать тебе вот что: ты уже замучилась.\n\nТы замучилась смотреть на себя по частям, и живот у тебя существует отдельно, и бедра отдельно, и руки, которые на фотографии обязательно надо куда-нибудь спрятать, и ты уже почти не видишь, как сидит купальник целиком. И еще поворачиваешься боком. Вдруг сбоку будет лучше.\n\nЯ каждый раз думаю: сколько же условий мы успеваем выставить себе даже для обычного отпуска.\n\nТы замучилась, и это особенно заметно в такой обычный момент: чемодан открыт, ты примеряешь шорты, собираешься положить их к остальным вещам, потом задерживаешься перед зеркалом, потом натягиваешь футболку пониже, потом решаешь, что шорты останутся дома. И вдруг хочется отменить вообще все. Хотя еще утром ты хотела к морю. Одни шорты, а вечер уже испорчен.\n\nУ тебя в этой примерочной слишком много народу, даже когда ты дома одна.\n\nИ злость на себя растет, потому что ты старалась, проверяла, переодевалась, а спокойнее так и не стало.\n\nТы замучилась быть под собственным надзором.","caption":"В примерочной к зеркалу часто добавляется еще и свет, под которым хочется немедленно переодеться обратно. Я бы учитывала и его, прежде чем выносить себе очередной приговор.\nЯ Юлия, психолог, работаю с девушками и женщинами от двадцати до сорока.\nЕсли хочется, напиши в комментариях одно слово: «знакомо»."},{"v":"h3h4_staryy","text":"Если перед отпуском ты смотришь на себя в купальнике и думаешь: «Господи, как я с этим телом поеду», послушай. Ты сейчас стоишь перед зеркалом и решаешь, можно ли тебе вообще радоваться поездке. Втянула живот, повернулась боком. Так вроде можно. Выдохнула, опять все испортила. И уже злишься на себя: почему я заранее собой не занялась? Сколько можно, ну сколько можно проверять, заслужила ли ты ходить в купальнике. Ты хотела отпуск, а получила еще одно место, где надо соответствовать. Даже радоваться страшно, вдруг слишком рано расслабилась. И да, живот тоже едет в отпуск.","caption":"На фотографиях из поездки потом можно искать только складку на боку и даже не заметить, как там смеешься.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хочется, напиши в комментариях, что у тебя чаще звучит перед зеркалом."},{"v":"zh3","text":"Это тебе, если до отпуска осталось несколько дней, а ты стоишь перед зеркалом в купальнике и думаешь: ну куда я такая поеду. Милая, ты уже и боком повернулась, и живот втянула, и ткань поправила. А потом ты злишься на себя: взрослая женщина, отпуск оплатила, купальник купила, стою тут, чуть не плачу из-за складки. Меня очень задевает, как быстро мы начинаем себя добивать именно там, где нам уже плохо. И вот ты берешь телефон, чтобы посмотреть, можно ли вернуть купальник, видишь фотографию девушки в таком же, увеличиваешь ее, снова смотришь в зеркало. Ну все, теперь еще и сравнила. Я сейчас думаю о том, сколько всего ты успела сделать до этого зеркала. На работе дела закончила, отпуск согласовала, билеты проверила, жилье забронировала, зарядку нашла, крем купила, сто раз прочитала, какого размера можно взять чемодан. Господи, с чемоданом уже разобралась, теперь бы еще самой себе пройти проверку перед вылетом. И мне хочется побыть с тобой именно в эту минуту, пока купальник еще на тебе и чемодан открыт. Ты можешь сейчас совсем себе не нравиться. И все равно хотеть на море.","caption":"Мне грустно, когда перед отпуском женщина заранее просит подругу: «Только меня не фотографируй». Иногда она уже знает, что потом весь вечер будет увеличивать снимок и разглядывать себя.\nСохрани, если перед поездкой начинаешь себя ругать."},{"v":"живой","text":"Ой, а кто это у нас тут? Люди из трудных семей? Не знаете, как жить в этом ебанутом мире? Да перестаньте. С вами уже случилось самое страшное. Помните, когда было больно, а кричать нельзя? Вы это пережили маленьким ребенком. Вы все еще боитесь осуждения, когда начинаете проявляться. Так вас тогда отвергли, никто не был на вашей стороне. Боитесь, что если все станет хорошо, отношения, деньги, то случится что-то страшное и вас накажут. Поэтому выбираете трудности и тащите чужие проблемы. Напоминаю: тогда вы просто не могли убежать из дома. А сейчас можете. Эй, оглянитесь назад. Это все прошли вы. Выжили. Вы все можете. Просто устали.","caption":""}]},{"id":"r_body_1_2","topic":"ненавижу себя в зеркале перед отпуском","author":"Юлия","format":"reels_malysh","cards":[{"v":"zh3","text":"Так, мои хорошие, кто опять примеряет купальник и собирается оставить себя дома? Малышка, ты куда собралась? На море? А почему тогда стоишь перед зеркалом и говоришь себе такие гадости?\n\nЯ сейчас увидела очередное «успей привести тело в порядок к отпуску» и прямо разозлилась. Потому что ты, возможно, уже стоишь вот так. Купальник надела, повернулась боком, втянула животик. Выдохнула. Все, настроение испортила.\n\nИ ведь ты уже представляла этот отпуск. Как утром пойдешь к воде, как будешь долго плавать, как попросишь тебя сфотографировать. А перед зеркалом думаешь: ладно, на фотографиях буду только по плечи. В воду зайду побыстрее. Пока иду обратно, прикроюсь полотенцем.\n\nПодожди. Ты уже отпуск согласовала, рабочие дела доделала, билеты купила, чемодан достала, зарядку нашла, крем от солнца положила. Даже крошечный шампунь перелила, хотя крышечка у него, конечно, закрывается через раз. Столько всего сделала. И теперь еще должна за оставшиеся вечера срочно стать довольной каждым сантиметром?\n\nИ на фотографиях из отпуска тебе тоже можно быть.","caption":"Меня особенно огорчает совет повесить тесный купальник на видное место «для мотивации». Представляю, как женщина приходит домой уставшая и снова видит напоминание, что собой положено быть недовольной."},{"v":"zh2","text":"Зайка, ты из тех, кто перед отпуском примеряет купальник и сразу хочет отменить море? И купальник, и билеты, и вообще, кто разрешил тебе так выглядеть?\n\nЧемодан открытый лежит, до отпуска несколько дней, ты вроде ждала его, считала, сколько осталось рабочих пятниц. А теперь стоишь перед зеркалом, тянешь ткань на животе, поворачиваешься боком, втягиваешь, отпускаешь. И снова втягиваешь. Уже дышать нормально себе запрещаешь.\n\nЧто, животик с собой едет? Да, маленькая. Он тоже.\n\nА сейчас стыдно? Будто ты обещала всем приехать красивой и подвела?\n\nВот тут мне очень хочется спросить: кому ты обещала? Людям на соседних лежаках? Женщине, которая будет выдавать полотенца? Мужчине, который пройдет мимо с кукурузой?\n\nМеня злит, сколько вокруг советов срочно привести себя в порядок перед отпуском. Читаешь их и начинаешь думать, что в нынешнем виде тебя туда выпускать рано. Еще чуть-чуть потерпи, еще поработай над собой, еще заслужи право спокойно лежать.\n\nЕще и купальник должна была весь год радовать? Ну серьезно.\n\nТы ничего не должна за этот отпуск своим телом.","caption":"Иногда еще до поездки решаешь, что на всех фотографиях будешь только по плечи. Мне грустно, сколько приятных моментов мы заранее себе урезаем.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от двадцати до сорока.\nПодписывайся, если хочется еще таких разговоров: здесь про тревогу, отношения и то, как мы с собой обращаемся."},{"v":"h3h4_staryy","text":"Солнышко, ты перед отпуском смотришь в зеркало и прямо ненавидишь свой животик? Уже хочется отменить пляж. И еще ругаешь себя: ну почему я даже отдыху не могу порадоваться?\n\nПредставь, что внутри сидит строгий вахтер. Ты ему: «Я к морю». Он тебе: «С таким животом? Нельзя».\n\nОн очень боится, что тебя увидят и начнут обсуждать. Поэтому придирается первым. Все проверяет, все запрещает. Ему кажется: если оставить тебя дома, никто тебя не обидит.\n\nВот ты еще чемодан не собрала, а уже выслушала про себя столько гадостей. От себя же.","caption":"Перед отпуском даже привычный купальник вдруг хочется вернуть в магазин. Хотя еще месяц назад ты спокойно его носила.\nЯ Юлия, психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хочется поговорить об этом, ссылка на запись в шапке профиля."},{"v":"живой","text":"Большие тетя-дядя тебе это не сказать, поэтому у тебя сердечко бубо, животик бубо, бабайки в голове пугают. Чужая тетя скажет, как бабайкам дать пизды, это ты. Ты думать мир у тебя голова настоящий. Ты думать, что бабайки настоящие. Если ты на бабай нападешь, то бабайки дадут тебе пизды. Ты будешь плакать ты маленький и беззащитный, и все над тобой будут смеяться, бросят тебя, и ты останешься один. Поэтому ты от бабайка убегать, но бабайки не настоящие. Бабайки придуманные. Вот тут твои бабайки. Это мир, это ты, а это твои бабайки. Ты думать, если бить бабайка, бабайки тебя побить. Но если бабайки придуманные, ты на них наорешь, пошлешь на хуй, бабайки останутся придуманными. Вот так ты, бабайка, боятся, а вот так, бабайка, не боятся. Мир не меняться, глаза меняться.","caption":""},{"v":"zh_h7_staryy","text":"Моя хорошая, опять перед отпуском стоишь у зеркала и ругаешь животик?\n\nПочему именно сейчас так тяжело смотреть на себя? Потому что скоро тебя будут видеть. В купальнике, в коротком платье, сидящей, лежащей, с животом, который сидя складывается. И если ты привыкла ждать замечаний о своем теле, то перед поездкой зеркало становится такой строгой проверяющей тетей. Она смотрит и смотрит, и ей все мало.\n\nТы ей говоришь: я купальник купила. Она тебе: сначала похудей. Ты говоришь: я устала, мне бы полежать. Она тебе: с такими ногами? И ты уже сама продолжаешь этот разговор, хотя в комнате никого больше нет.\n\nУзнаешь?\n\nИ я сейчас не стану говорить, что тебе надо срочно понравиться себе. Представляю, как ты стоишь перед зеркалом, тебе плохо, а тут еще я со своим требованием полюбить каждую складочку. Спасибо большое, еще одно дело перед вылетом.\n\nПогоди. Ты уже работала, уставала, решала дела, дожила до этих свободных дней, собрала вещи. А теперь еще должна сдать живот на отлично? Серьезно? Проверяющая тетя совсем обнаглела.\n\nОно бывает очень убедительным. Особенно перед отпуском.\n\nТы уже устала себя проверять.","caption":"Иногда покупка купальника заканчивается обещанием больше ничего не есть сегодня. Я считаю важным говорить и об этой части подготовки к отпуску.\nЯ Юлия, психолог, работаю с девушками и женщинами от двадцати до сорока.\nЕсли хочешь прийти на консультацию, ссылка на запись в шапке профиля."}]},{"id":"r_teen_1","topic":"подросток закрылся в комнате и не разговаривает","author":"Михаил","format":"reels_rol","cards":[{"v":"живой","text":"Добрый день. Комфортно ли будет на ты перейти? Хорошо, меня зовут Виолета. Ко мне можно обращаться Вита, на ты. Как я могу к тебе обращаться? Расскажи, что тебя привело. Ранее ты не обращалась никаким специалистам, неврологам, психиатрам и так далее? Волнение, это нормально, особенно на первой встрече. Давай про сам формат поделюсь, расскажу немного о себе. Я работаю с мыслями, с убеждениями, с чувствами. Именно смысл, как она влияет на нас. Ты можешь рассказать просто о себе все, что хочешь, все, что придет на ум. Что ты посчитаешь важным поделиться именно сейчас со мной. Либо я задаю вопросы, и ты можешь ответить на них, можешь сказать, что тебе некомфортно. На моих сессиях можно материться, плакать, курить. Все будет происходить только так, как тебе комфортно. Я использую разные методы. Даю упражнения и на сессии после. И если тебе что-то не подходит, ты можешь об этом всегда сказать и не делать это через силу. Ты можешь меня останавливать, если тебе где-то некомфортно, где-то тебе покажется, что грубо. Или как-то не так сформулировано, ты можешь сказать: стоп. И мы вернемся в точку, с чего мы начали. Я иногда буду опускать глаза, потому что я веду записи для себя. Все, что мы сейчас обсуждаем, это строго конфиденциально. Я никуда это не выношу, никакие клиентские истории. Это все остается у меня. Просто, чтобы ты знала, не переживала. Ранее ты сказала, что у тебя это первый опыт терапии. Верно?","caption":""},{"v":"zh_h7_staryy","text":"Здравствуйте, я специалист по срочному извлечению разговоров из подростка. Закрылся в комнате и молчит? Поэтому стойте под дверью и напоминайте. Каждые несколько минут. Можно стучать.\n\nПереспросите.\n\nЯ вообще считаю, что у откровенности должен быть срок сдачи. Если родитель готов слушать сейчас, значит, сейчас и надо рассказывать. Через час у родителя сериал.\n\nЧто? Прекрасно.\n\nВот обычный вечер. Вы зовете ужинать, он отвечает из комнаты, что придет позже. Вы можете оставить ему еду, конечно, но мы с вами работаем на результат. Поэтому входите и сообщайте, что вся семья ждет.\n\nКстати, дверь он закрыл тихо или хлопнул? Тихо? Все равно подозрительно. Хлопнул? Тут уже можно обсуждать уважение. Очень полезное отступление, рекомендую. Когда первоначальная тема неизвестна, всегда можно поговорить о воспитании.\n\nТак, возвращаемся к контакту. В телефоне сидит? С другом переписывается? Значит, общаться способен. Немедленно спросите, почему другу можно написать, а вам нельзя ответить. Только сравнение произносите обиженно. Пусть к своему рассказу сразу приложит доказательства любви к вам.\n\nЕсли подросток совсем замолчал, скажите, что с вами он может говорить обо всем. Погромче.\n\nВсе, ваш план готов. Нет, ждать, пока он сам подойдет, в наш тариф не входит. Забирайте список вопросов, проходите домой. И дверь ему пока не давайте закрывать.","caption":"Иногда подростку проще написать из соседней комнаты: при личном разговоре каждую паузу уже заполняют вопросами.\nЯ Михаил, психолог, работаю с родителями подростков от двенадцати до семнадцати лет.\nЕсли знакомо, напишите в комментариях «дверь»."},{"v":"zh2","text":"Четыре признака, что подростку трудно рассказать вам о своих проблемах, хотя ему очень нужна ваша поддержка.\nПервое, он сообщает только то, что уже исправил. Переписал контрольную, помирился с другом, договорился с учителем.\nВторое, на обычный вопрос он отвечает так, будто вы его уже ругаете. Спросили, как в школе, он бросил «нормально» и закрыл дверь.\nТретье, он отказывается от того, чего сам ждал. Собирался на день рождения, выбирал подарок, а теперь говорит, что никуда не пойдет. Проще сказать, что вечеринка дурацкая, и провести вечер в комнате. Вы слышите, что ему никто не нужен, а он весь вечер проверяет, написал ли хоть кто-нибудь.\nЧетвертое, он приходит к вам без всякого дела. С разговором о школе вы к нему не подступитесь, зато вечером он вдруг садится на кухне, пока вы пьете чай. Спрашивает, что смотрите, берет печенье, показывает какое-то смешное видео. Вот это короткое сидение на кухне иногда единственное, на что он сегодня решился. Сможете побыть с ним, даже если сегодня он ничего не расскажет?","caption":"Если подросток неделями почти не выходит, перестал нормально спать, есть или ходить в школу, предложите вместе обратиться к специалисту. Я бы не ждал, пока он сам сумеет объяснить, что происходит.\nМеня зовут Михаил, я психолог, помогаю родителям подростков от двенадцати до семнадцати лет.\nСохраните, чтобы вернуться, когда снова окажетесь перед закрытой дверью."},{"v":"h3h4_staryy","text":"Подросток закрылся в комнате и не разговаривает? Уважаемые родители, сейчас научимся вызывать его на откровенность. Сначала стучим: «Можешь мне все рассказать». Молчит? Добавляем: «Я с кем разговариваю?» Просит оставить его одного? Уточняем: «Что ты там скрываешь?» Тут важно стоять под дверью, чтобы человек чувствовал поддержку. Наконец сказал, что устал? Отлично, разговор пошел. Объясняем, кто в этой семье действительно устал. Сказал, что вы его не понимаете? Перечисляем все, что для него сделали. Только подробно, пусть проникнется. И обязательно в конце: «Почему ты мне ничего не рассказываешь?» Ответ ждем искренний. Правильный ответ я сейчас продиктую.","caption":"Можно сказать: «Я рядом, если понадоблюсь», и дать ему побыть одному.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nЕсли знакомо, напишите в комментариях «пауза»."},{"v":"zh3","text":"Я как председатель родительского комитета предлагаю разобраться с подростками, которые закрываются у себя в комнате. Вы весь день ждали возможности поговорить, а он пришел, снял кроссовки, сказал «нормально» и закрыл дверь.\n\nОн просит немного побыть одному? Сразу уточните, сколько именно. Вам же нужно планировать вечер. Пять минут, десять, до ужина? И что конкретно он собирается делать один? Лежать? А вместе с вами лежать нельзя? Вы тоже можете молча посидеть рядом и через каждые полминуты спрашивать, долго ли еще.\n\nВот обычный вечер. Он пришел после школы, рюкзак бросил возле стола, даже любимый бутерброд на кухне не взял. Вы заглянули, спросили, будет ли есть. Он сказал: «Потом». Тут, конечно, можно тарелку оставить. Но у нас с вами родительское собрание по вопросам общения, поэтому с тарелкой придется зайти и остаться.\n\nВы же старались. Сыр нарезали. Огурец помыли. И теперь имеете полное право узнать, что у него с настроением, кто написал в чат и почему вчера он смеялся, а сегодня лежит. Огурец просто так никто не моет.\n\nИ обязательно скажите, что вам можно доверять. Для убедительности позвоните бабушке прямо при нем: «Представляешь, опять закрылся, ничего не говорит». Пусть услышит, сколько взрослых заинтересованы в его личной жизни. Можете еще в семейный чат написать, там обычно быстро подключаются.\n\nУжин остынет, уроки останутся, спать ляжете позже, зато вы покажете, насколько для вас важен душевный разговор.\n\nИ пусть своими словами объяснит, почему он больше ничего вам не рассказывает.","caption":"Когда подросток заранее просит «только бабушке не рассказывайте», ему важно знать, кто еще услышит его историю. Я бы отнесся к этой просьбе серьезно.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nОтправьте тому, кому сейчас трудно поговорить со своим подростком."}]},{"id":"r_teen_1_2","topic":"подросток закрылся в комнате и не разговаривает","author":"Михаил","format":"reels_spisok","cards":[{"v":"zh2","text":"Добрый вечер, родители, начинаем вебинар «Как разговорить подростка за один вечер». Подросток закрылся в комнате, вы стоите в коридоре и думаете: вчера еще вместе смеялись над видео, сегодня из него слова не вытащишь. Поэтому главное сейчас обеспечить ему столько родительского внимания, чтобы спрятаться от него было физически невозможно.\n\nНачнем с простого. Вы постучали, он ответил: потом. Отлично, человек владеет речью, можем продолжать. Спросите, когда именно потом. Через минуту? После ужина? Во сколько записать ваше потом? Пусть сразу почувствует, что дома его готовы выслушать по предварительному согласованию с точностью до секунды.\n\nОн говорит, что устал? Напомните, во сколько вы сегодня встали. У вас работа, магазин, пакет порвался возле подъезда, огурцы собирали всем двором, и при этом силы на разговор с собственным ребенком нашлись.\n\nВот представьте: ужин готов, вы накрыли, его тарелка стоит на столе, вы уже второй раз греете котлету и злитесь, потому что тоже хотели спокойно поесть. Тут очень важно войти и сообщить: я вообще-то совершенно спокойно спрашиваю! Желательно погромче, чтобы он сквозь наушники точно услышал ваше спокойствие.\n\nОн начал отвечать резко? Прекрасно, разговор пошел. Немедленно обсудите тон. Сейчас разберемся с интонацией слова «потом». Я считаю, без правильной интонации вообще бессмысленно рассказывать родителям о своих неприятностях.\n\nПоздравляю, контакт установлен. Теперь он знает: если дома заметят, что ему плохо, вечер будет очень долгим.","caption":"Меня тревожит, когда родители уже стоят по разные стороны двери и каждый ждет от другого чего-то пугающего: один ждет беды, другой очередного допроса. Иногда подростку проще выйти на кухню, если там можно сначала молча съесть бутерброд.\nЯ Михаил, психолог, помогаю родителям подростков от 12 до 17 лет.\nНапишите «потом», если узнаете ваши разговоры через дверь."},{"v":"h3h4_staryy","text":"Четыре вещи о подростке, который закрылся в комнате и не хочет с вами разговаривать.\nПервое. На вопросы отвечает «не знаю». Иногда он знает, но уже представляет следующие десять вопросов.\nВторое. Прячет даже небольшие неприятности. Рассказать про двойку для него значит сразу получить план, что теперь делать. А он еще сам переваривает.\nТретье. Злится на «ты же сам сказал». Сказал, потом передумал. Теперь каждую фразу приходится проверять: вдруг запомнят.\nЧетвертое. Выходит спросить, что на ужин, будто ничего не случилось. Можно побыть рядом, поговорить, и никто пока ничего про тебя не выясняет.","caption":"В переписке подростку иногда легче сказать что-то важное: фразу можно стереть, переписать, отправить позже. Поэтому сообщение из соседней комнаты тоже считается разговором.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов."},{"v":"zh3","text":"Четыре признака, что подростку сейчас трудно, хотя из комнаты вы слышите только «отстаньте».\n\nПервое, подросток избегает даже приятных разговоров. Раньше мог долго рассказывать, что они с друзьями собираются делать в выходные, теперь на любое предложение отвечает: «Не знаю».\n\nВторой признак, он перестает отвечать друзьям. Но подросток может смотреть короткие видео и при этом неделю не открывать сообщение приятеля.\n\nТретье, он сердится, когда вы проявляете заботу. Вы приносите чай, заходите, ставите чашку, спрашиваете, что случилось. Он повышает голос, вы обижаетесь и уходите. Вот это меня особенно огорчает: вы действительно хотели побыть рядом, а он мог испугаться, что сейчас придется отвечать на вопросы, расплачется при вас или услышит, что сам во всем виноват.\n\nЧетвертое, подросток сам ищет повод выйти, но ничего важного не говорит. Спрашивает, где зарядка, стоит рядом, пока вы готовите, заглядывает в кастрюлю. Зарядку попросить проще, чем сказать: мне одиноко, побудьте со мной.\n\nСможет ли он побыть с вами, если пока не готов ничего объяснять?","caption":"Через закрытую дверь иногда проще спросить: «Тебе принести поесть или оставить на кухне?» На конкретный вопрос подростку бывает легче ответить. А вы сможете позаботиться о нем, даже если поговорить сегодня не получилось."},{"v":"живой","text":"Я не чувствую любви к родителю, потому что рядом с ним было больно и страшно. Я не благодарна человеку, который не ценит семью и дар жизни. Я ограничила контакт с родителем, потому что так чувствую себя спокойнее. Я глупая, повелась на внушение психолога, который настроил меня против семьи. Я все еще боюсь семьи и детей, потому что боюсь быть такой же матерью, как моя. Я просто еще не понимаю, что материнство это счастье. Я часто чувствую себя ничтожной без причины, потому что росла в атмосфере страха, стыда, критики, эмоционального насилия. Я просто слабая, ленивая, неуверенная в себе. Мне сложно доверять людям и строить близкие отношения, потому что долгое время для моей психики близость была связана с болью. Я просто драматизирую и не умею нормально общаться.","caption":""},{"v":"zh_h7_staryy","text":"Пять признаков подростка, которому сейчас тяжело даже разговаривать.\n\nПервое. От вопросов у него буквально напрягается тело: вы еще только спрашиваете, как прошел день, а он уже поднимает плечи, сжимает челюсть, отворачивается, словно сейчас придется отвечать у доски.\n\nВторое. Он лежит в комнате весь вечер, но отдых как будто ничего ему не дает: трудно начать домашнее задание, трудно пойти в душ, даже выбрать, чем заняться, трудно.\n\nТретье. Он избегает даже тех, с кем обычно хорошо: пропускает семейный ужин, оставляет сообщения друзей без ответа, просит пока его не трогать, хотя никто с ним сегодня не ссорился.\n\nЧетвертое. Он перестает просить деньги на привычные вещи, отказывается обсуждать покупки, отвечает, что ничего ему не надо, и разговор быстро заканчивается.\n\nПятое. Хорошая новость вызывает у него тревогу: получил хорошую оценку, вы обрадовались, сказали, что наконец взялся за голову, а он замолчал и ушел к себе.\n\nСколько пунктов вы узнали?","caption":"Одна закрытая дверь сама по себе мало о чем говорит. Важно, изменилось ли привычное поведение подростка и как долго это продолжается. Для начала можно предложить принести ужин и оставить разговор на потом.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от двенадцати до семнадцати лет.\nЕсли хотите обсудить, что происходит у вас дома, напишите мне в личные сообщения для записи на консультацию."}]},{"id":"r_vybor_1","topic":"почему я снова выбираю тех, кто меня не выбирает","author":"Ольга","format":"reels_scenka","cards":[{"v":"h3h4_staryy","text":"А: Опять залипла на мужчину, которому я особо не нужна.\nБ: Что вам в нем нравится?\nА: Когда отвечает, я прям оживаю. НАКОНЕЦ заметил, сука.\nБ: А на встрече как?\nА: Да скучно. Я даже подруге пишу под столом.\nБ: И потом опять ждете сообщения?\nА: Да! Думаю, что написать, чтобы он захотел встретиться.\nБ: Его интерес уже стал вашим призом.\nА: Блин, я даже забыла, как сама хотела домой.\nБ: Пока добиваетесь его, выбирать самой некогда.\nА: Ну вдруг он выберет меня, и все наладится?\nБ: А вы тогда выберете его?","caption":"Подруге уже отправлены скрины, его ответ разобран по словам. До обсуждения того, как вам было рядом с ним, опять не дошли.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nОтправьте той, с кем разбираете эти переписки."},{"v":"zh3","text":"А: Меня уже бесит это «выбирайте тех, кто выбирает вас». Спасибо, блядь, я бы с удовольствием. Только мне опять нравится тот, у кого на меня вечно какие-то другие планы. А я все равно жду.\n\nБ: Что он делает, когда встреча отменяется?\n\nА: Пишет, что завал, предлагает как-нибудь потом. Я уже оделась, подруге сказала, что занята, сижу с телефоном. Потом отвечаю: конечно, понимаю, напиши, как освободишься. И еще смайлик ставлю, чтобы никакого недовольства.\n\nБ: И что вы делаете потом?\n\nА: Господи, я уже согласна просто сидеть рядом, пока он отвечает кому-то в телефоне.\n\nБ: А если ничего ему не предлагать?\n\nА: Мне ведь говорят: отношения требуют усилий.\n\nБ: Что для вас будет значить его уход?\n\nА: Я прямо могу составить список, что исправить.\n\nБ: Когда он отдаляется, вы стараетесь сильнее?\n\nА: Да.\n\nБ: Что вы ждете вместе с ответом?\n\nА: Что я все-таки ему нужна. Получается, я уже пытаюсь заслужить его интерес и даже не спрашиваю себя, нравится ли мне вообще, как он со мной обращается.\n\nБ: Да, вы это заметили.","caption":"Мне грустно, когда девушка перед отправкой сообщения убирает вопрос про встречу, чтобы показаться легкой. И оставляет только «как день?».\n\nЯ Ольга, психолог, работаю с девушками и молодыми женщинами.\nНапишите «знакомо», если узнали себя."},{"v":"живой","text":"Б: Страх уходит, когда начинаешь доверять.\nА: Но если я доверюсь, я потеряю контроль.\nБ: Именно.\nА: И тогда может случиться что угодно. А вдруг я не выдержу?\nБ: Так и есть.\nА: Но это звучит ужасно.\nБ: Это звучит реалистично.\nА: А если я ошибусь?\nБ: Ошибки и есть жизнь.\nА: Но я хочу знать, что все будет хорошо.\nБ: Вот это и мешает почувствовать, что уже хорошо.\nА: То есть чтобы перестать бояться, надо согласиться, что страх останется?\nБ: Да.\nА: Но это же парадокс.\nБ: Именно.","caption":""},{"v":"zh2","text":"Б: Иногда вы пытаетесь добиться выбора человека, которому вы уже отказали бы.\nА: В смысле отказала бы? Я вообще-то жду, когда он напишет.\nБ: А вы как живете, пока ждете?\nА: Ну вот подруга звала поужинать, я сказала, что пока не знаю. Потому что он обмолвился, что, возможно, освободится. Я даже голову заранее помыла. Вечером он выложил фотку из бара, и я осталась дома. С чистой головой, охуенно.\nБ: И чего захотелось после этой фотографии?\nА: Написать ему.\nБ: Что должно случиться на этой встрече?\nА: А от него жду хоть какого-нибудь вопроса про себя.\nБ: И если он наконец спросит?\nА: Хочется переиграть тот вечер, быть такой, от которой он телефон из рук не выпускает.\nБ: Чтобы что про себя почувствовать?\nА: Что со мной все нормально. Получается, я уже злюсь на него, мне даже рассказать ему особо нечего, я заранее знаю, что он пропустит мимо ушей. Но все равно хочу, чтобы именно он меня выбрал. Тогда вроде можно перестать себя переделывать?\nБ: Да.","caption":"Меня бесит совет «просто займитесь собой»: можно сидеть на любимой тренировке и проверять, посмотрел ли он сторис.\nЯ Ольга, психолог, работаю с девушками и женщинами, которым знакомы такие отношения.\nЕсли узнали себя, напишите «знакомо»."},{"v":"zh_h7_staryy","text":"Б: По-моему, вы пытаетесь заслужить, чтобы вас выбрали.\nА: Ну приехали.\nБ: А когда он пропадает?\nА: Вот сегодня предложила встретиться, он прочитал и молчит. Зато мою историю посмотрел. И я уже думаю, что выложить еще, чтобы он ответил. Блядь, даже подруге фотографию отправила, спросила, нормально ли выгляжу.\nБ: И что будет, если ответит?\nА: Выдохну. Почувствую, что я ему все-таки нужна.\nБ: Конечно.\nА: И каждый раз надеюсь, что теперь он.\nБ: Его внимание труднее получить.\nА: И поэтому оно для меня столько значит?\nБ: Что вы хотите от него услышать?\nА: Что я ему нужна. И я снова выбираю человека, чей выбор мне придется заслуживать. Потому что тогда я наконец поверю, что меня есть за что выбрать.\nБ: Да.","caption":"Я бы еще спросила, что вы вообще знаете об этом человеке, кроме того, как он вам отвечает. Иногда даже любимую еду назвать трудно.\nЯ Ольга, психолог, работаю с девушками и женщинами от двадцати двух до тридцати пяти.\nОтправьте той, кому сейчас это нужно."}]},{"id":"r_vybor_1_2","topic":"почему я снова выбираю тех, кто меня не выбирает","author":"Ольга","format":"reels_malysh","cards":[{"v":"zh2","text":"Ждете, милая, что он напишет, и телефон кладете рядышком, и звук проверяете, хотя прекрасно знаете, что звук включен.\n\nЖдете, и ведь у вас своя жизнь, работа, подруга зовет поужинать, вы даже платье приготовили, но он утром написал, что, возможно, вечером получится встретиться. И вы подруге отвечаете, что пока непонятно, хотя еще вчера все было понятно. Вы хотели с ней увидеться.\n\nЖдете, и мне так обидно за этот ваш вечер, потому что вы уже помыли голову, уже поглядываете на время, уже проголодались, и ужин откладываете: вдруг вместе поедите. А он появляется ближе к ночи и пишет, что замотался. И следом присылает: «Соскучился». Все. Вы улыбаетесь.\n\nЖдете, и постепенно у вас появляется очень важное дело: понравиться ему настолько, чтобы он наконец захотел быть с вами. И вы уже подбираете сообщение повеселее, убираете вопрос про встречу, чтобы не давить, перечитываете свои слова. Блядь, как же много работы у человека, который просто хотел сходить на свидание.\n\nЖдете, когда он выберет вас, чтобы перестать искать, что с вами не так.","caption":"Меня особенно цепляет это «возможно, увидимся». Один человек еще ничего не решил, а другая уже отменила свои планы.\nЯ Ольга, психолог, работаю с девушками и женщинами, которым знакомы такие отношения.\nОтправьте той, которая опять оставила вечер свободным."},{"v":"живой","text":"Дети, у которых было сложное детство, очень много думают. Они еще часто очень умны и про них можно сказать: люди, которые всегда в голове. Но я добавлю важное, как психолог, много помогающий таким людям. С вероятностью 99% то, что они очень много думают, значит, что они очень мало чувствуют. Потому что они научились защищаться от всего пиздеца, убегая в голову, анализируя обстановку дома и настроение своих родителей. Потому что там было безопасно и только там был контроль. А соприкасаться с чувствами было больно, было страшно и одиноко. Поэтому не забывайте. Чрезмерное обдумывание это один из способов избегать тревожных и неприятных чувств. Если в следующий раз вы заметите, как опять жуете эту мыслительную жвачку, искренне по-доброму, спросите себя: котенок, а есть ли какое-то сейчас чувство, которое я избегаю? Если ты часто избегаешь, читай описание.","caption":""},{"v":"zh3","text":"Еще немножко, хорошая моя, еще немножко постарайтесь, и он обязательно вас выберет.\n\nТолько вы уже взрослая, сидите на кухне с телефоном, и вам очень хочется, чтобы мужчина сам спросил, как прошел ваш день.\n\nЕще немножко, и вы найдете правильное сообщение. Уже написали, что соскучились, потом стерли, потому что вдруг ему покажется, что вы слишком привязались, потом отправили смешное видео. Смешное видео вроде безопасно. Посмотрит, улыбнется, вспомнит про вас. И вы проверяете, посмотрел ли.\n\nЕще немножко, и вы станете совсем удобной: спокойно отнесетесь к тому, что он пропал, обрадуетесь, когда объявится, спросите про его работу и про то, как он устал, и про ваши сутки ожидания можно пока промолчать. Он же наконец написал. Жалко сейчас все испортить.\n\nЕще немножко, и он заметит, какая вы умница. И вот тут мне, блядь, очень хочется остановиться. Вы всерьез стараетесь хорошо справиться с общением, в котором вам все время одиноко.\n\nЕще немножко, и вы опять выбираете того, рядом с кем можно стараться. Вы уже знаете, чем заняться: подобрать слова, подождать, понять, простить отмененную встречу. А просто признать, что он сам почти ничего для вашего общения не делает, очень больно. Тогда придется допустить, что вы можете сделать все прекрасно и все равно остаться без его любви.\n\nЕще немножко. Вы опять стараетесь за двоих.","caption":"Иногда подруге вы говорите: «Я бы давно перестала ему писать». А свой чат открываете снова, потому что вчера он был такой нежный.\nЯ Ольга, психолог, работаю с девушками и женщинами, которым трудно в отношениях.\nСохраните, если хотите вернуться к этому разговору."},{"v":"zh_h7_staryy","text":"Девочки, хорошие мои, я называю это заслуживанием: когда вы снова выбираете человека, который вас держит в ожидании, и очень стараетесь ему понравиться. Как будто у него есть наклейка «хорошая», и вам обязательно нужно ее получить. Я бы очень хотела, чтобы мы поменьше называли это большой любовью.\n\nВы ждете, что он выберет вас, и вот уже пятница, вы спрашиваете, увидитесь ли вечером, он отвечает «посмотрим», и вы оставляете вечер свободным. Телефон лежит рядом, вы поглядываете, думаете, можно ли еще написать, или это уже слишком, или вы вообще зря спросили. Одно слово прислал. А у вас вокруг этого слова уже весь вечер устроился.\n\nВы ждете, что он выберет вас, и начинаете подбирать себя под него: здесь помолчать, здесь пошутить, здесь показать, что у вас тоже полно дел, здесь потерпеть. Очень много работы, девочки. Вы уже и сообщение переписали, и подруге отправили проверить, нормально ли звучит, и убрали вопросительный знак, чтобы получилось полегче. Блядь, даже знаку вопроса теперь надо заслужить право там стоять.\n\nВы ждете, чтобы он подтвердил вашу ценность.","caption":"В переписке «посмотрим» занимает одну строчку. В вашем календаре оно иногда занимает целые выходные.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nПодписывайтесь, если хочется еще таких разговоров: здесь я пишу про отношения и то, как мы в них с собой обращаемся."},{"v":"h3h4_staryy","text":"Девочки, вы снова выбираете того, кто вас не выбирает, и внутри больно-больно.\n\nПредставьте дверцу. Вам хочется, чтобы человек открыл ее и позвал вас к себе.\n\nЕсли раньше приходилось заслуживать вним
