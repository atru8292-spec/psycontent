итаешь, сколько дней осталось. С каждым днем страшнее, и ты все сильнее себя ругаешь, и все труднее открыть файл. Откладываешь, потому что боишься написать плохо и решить, что теперь про тебя все понятно.","caption":"Особенно тяжело бывает после вопроса в общем чате: «Кто уже отправил вторую главу?» Можно закрыть переписку и весь вечер представлять, как остальные уже заканчивают.\n\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nОтправь тому, кто сейчас боится открыть свой диплом."},{"v":"zh_h7_staryy","text":"Я называю это отсрочкой: ты откладываешь диплом и еще на один вечер сохраняешь возможность написать его хорошо. Я считаю, тут очень легко себя обмануть, потому что снаружи все выглядит как обычное нежелание работать.\n\nОтсрочка это когда ты открываешь документ, видишь заголовок, под ним пустое место, и сразу хочется еще почитать, уточнить тему, посмотреть, как вообще люди пишут введение. Ты ведь собираешься писать, правда собираешься, только сначала надо разобраться. И вот ты уже читаешь чужой диплом, потом другой, и у всех там такие уверенные формулировки, а у тебя пока даже первое предложение какое-то глупое. Лучше его удалить. Завтра начнешь нормально, сегодня уже все равно поздно.\n\nОтсрочка это когда ты признаешь, что тебе страшно увидеть, как ты пишешь сейчас. И появляется неприятный вопрос: вдруг я вообще хуже разбираюсь в своей теме, чем мне хотелось думать?\n\nОтсрочка это когда ты снова выбираешь пока ничего не писать, и на несколько минут действительно становится легче, потому что сегодня ты еще не увидишь следующую неудачную фразу. Срок уже совсем близко, тебе стыдно за потерянный день, ты ругаешь себя, и все равно пустой документ кажется безопаснее написанного. Ты закрываешь его и обещаешь себе завтра доказать, что можешь.","caption":"Со списком литературы бывает проще: там хотя бы понятно, где поставить точку. А собственную мысль можно переписывать бесконечно.\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nОтправь тому, кто тоже застрял с дипломом."},{"v":"живой","text":"Ой, а кто это у нас тут? Люди из дисфункциональных семей? Не знаете, как жить в этом ебанутом мире? Да перестаньте. С вами случилось уже все самое страшное. Помните, когда больно, а кричать нельзя? Ну вы же выжили, будучи маленьким ребенком. И я помню. Вы все еще боитесь осуждения, когда начинаете проявляться. Так вас изначально отвергли. Помните тогда, никто не поддержал из родителей. Никто не был на вашей стороне. А, боитесь, что если у вас появится все самое лучшее, отношения мечты, высокий доход, то случится что-то самое страшное. Например, вас накажут. Поэтому вы выбираете трудности и взваливаете на себя чужие проблемы. Напоминаю, вы тогда просто не могли убежать из дома. А сейчас? Тотально не уверены в себе? Хуйня. Эй, дорогуши, оглянитесь-ка назад. Это все прошли вы. Вы справились, вы смогли, вы выжили. Сохранили свою жизнь. Пережили гребаный армагеддон. Эх, кто эти красивые непобедимые рыцари воли? Вы все можете. Просто устали. И уже закалились так, что вот это все семечки. У вас есть такой опыт. Ого. Сила внутри вас. Эй, огромная.","caption":""}]},{"id":"r_stud_1_2","topic":"не могу сесть за диплом, хотя времени почти нет","author":"Юлия","format":"reels_scenka","cards":[{"v":"zh_h7_staryy","text":"Б: Я думаю, тебе страшнее написать плохой диплом, чем опоздать.\nА: Подожди, я вообще хочу его написать и забыть.\nБ: А если сядешь, чего боишься?\nА: Вот вчера открыла введение, прочитала свой абзац и закрыла. Там такая ерунда, что мне даже научной руководительнице отправлять стыдно. Она ведь сразу все поймет.\nБ: Что именно она поймет?\nА: Что я вообще ничего не понимаю в своей теме.\nБ: Пока файл закрыт, это можно не проверять.\nА: Ну прекрасно. Получается, я специально себе все порчу?\nБ: Как ты объяснишь себе плохой результат?\nА: Что времени было мало.\nБ: А если времени хватало и ты старалась?\nА: Тогда придется признать, что я старалась и все равно получилось плохо. А пока откладываю, могу думать, что написала бы хорошо, если бы села раньше. Так проще объяснить себе плохой результат.\nБ: Да.","caption":"Я с осторожностью отношусь к совету «просто убери телефон». Иногда телефон уже лежит в другой комнате, а файл все равно закрыт.\nЯ Юлия, психолог, работаю со студентами.\nПодписывайся, если хочется еще такого: здесь про учебу, тревогу и отношения."},{"v":"zh2","text":"Б: Пока диплом только в голове, его никто не критикует.\nА: Скоро мне начнет сниться, как научная руководительница спрашивает, где текст, а я опять обещаю прислать.\nБ: Что мешает прислать хотя бы кусочек?\nА: Там нечего присылать. Я вчера открыла документ, написала предложение, прочитала, стерла. Потом пошла искать еще одну статью.\nБ: И что тогда скажет руководительница?\nА: Что я делала все это время? Как вообще дошла до диплома? Остальные уже главы отправляют, исправляют замечания, спорят о чем-то. А я даже спросить ничего не могу, сразу станет понятно, насколько я отстала.\nБ: Пока молчишь, она этого не узнает.\nА: Просто каждый раз кажется, что надо еще немного подготовиться.\nБ: Когда поймешь, что уже можно показывать?\nА: Без этого ужасного молчания, когда сидишь перед человеком и понимаешь, что сейчас он во всем разочаруется.\nБ: А если она найдет, что исправить?\nА: Вот этого и боюсь. Она просто пришлет замечания, а я решу, что она наконец поняла, какая я бестолковая. Пока ничего не отправляю, могу еще думать, что у меня получится хороший диплом.\nБ: Да.","caption":"Меня особенно цепляет этот момент: студентка уже стесняется написать руководительнице даже обычное «здравствуйте», потому что столько раз обещала прислать текст.\nИ теперь к документу страшно даже возвращаться.\n\nЯ Юлия, психолог, работаю со студентами.\nПодписывайся, если хочется еще такого: здесь про тревогу, учебу и взросление."},{"v":"живой","text":"А (до психологии): Да пошел он нахер, мудила.\nА (после психологии): Слушай, я думаю, это проявление его избегающей привязанности. Я же тебе рассказывала, у него была холодная мать. Он проецирует на меня ее образ и боится открыться, показать нежность. Вдруг я узнаю его слабые места и в ссоре ткну туда иголкой.\nА (после психологии, помолчав): Да пошел он нахер, мудила.","caption":""},{"v":"zh3","text":"А: Только не говори мне «просто начни». Я каждый день собираюсь начать. Срок сдачи уже скоро, я даже друзьям перестала отвечать, потому что они спрашивают, как диплом.\nБ: Что происходит, когда открываешь файл?\nА: Открываю, читаю свой абзац, думаю, какая ерунда.\nБ: Что будет, если оставить этот абзац?\nА: Все уже присылают главы, обсуждают правки, а я отправлю вот это, и она поймет, что я ничего не понимаю.\nБ: Она уже видела этот абзац?\nА: Мне даже представить стыдно.\nБ: Какого ответа ты ждешь?\nА: Что с таким текстом меня вообще нельзя допускать к защите.\nБ: И что делаешь после этого?\nА: Закрываю его. Иду мыть чашку, потом еще зачем-нибудь встаю. Ладно, я поняла, что боюсь ее ответа. Только мне все еще страшно. Где обещанное желание писать?\nБ: А что ты сейчас заметила?\nА: Что я сижу над своим абзацем, а в голове уже слушаю, как меня отчитывают. Хотя руководительница даже не знает, что я сегодня открывала диплом.\nБ: Да. Ты уже ответила за нее.","caption":"Меня раздражает совет «просто сядь и сделай», когда его повторяют человеку, который уже сидит перед открытым документом. Он вполне может просидеть так весь вечер.\n\nЯ Юлия, психолог, работаю со студентами, которым тревожно учиться и взрослеть.\nПодписывайся, если хочется еще таких разговоров про учебу, отношения и тревогу."},{"v":"h3h4_staryy","text":"А: Не могу сесть за диплом, времени почти нет.\nБ: Что мешает начать?\nА: Вдруг напишу ерунду? Я же должна в этом разбираться.\nБ: И если ерунду?\nА: Значит, зря училась. Все поймут, что я ничего не умею.\nБ: Прямо по черновику?\nА: Ну да. Хотя черновик никто пока не увидит.\nБ: Ты его увидишь.\nА: Да. Пока ничего нет, я еще могу написать хорошо.\nБ: Можно оставаться способной.\nА: Ага. Просто способной, которая никак не соберется. Знакомая история.\nБ: Так меньше страшно?\nА: Получается, я откладываю момент, когда сама себя назову тупой.\nБ: Да.","caption":"Можно полвечера выбирать шрифт для титульного листа: диплом открыт, работа вроде идет. До собственных мыслей на странице так и не дошла.\nЯ Юлия, психолог, работаю со студентами.\nПодписывайся, если хочется еще такого: здесь про учебу, тревогу и отношения."}]},{"id":"r_gnezdo_1","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","author":"Михаил","format":"reels_poslanie","cards":[{"v":"живой","text":"Лени не существует, это признак перегруза. То есть ты хочешь сказать, что я не ленивая, я просто истощилась. Ну, ну. Но я же ничего не делала. Да может, раньше делала слишком много. Но люди вокруг делают намного больше меня. Выходит, я просто хуже и слабее других. Да, пусть. Ты серьезно? Да. Ну, это же ужасно. А что такого? И что мне теперь с этим делать? Перестать гнаться за чужими нормами. Ну хорошо, а за какой тогда? За своей. А вдруг она слишком маленькая. Маленькая норма тоже норма. А если я тогда никогда вообще ничего не добьюсь и не сделаю? А без достижений ты что, никто? Ну, я просто человек. Именно.","caption":""},{"v":"h3h4_staryy","text":"Это для тех, у кого дети выросли и уехали, а утром появилась мысль: «И зачем теперь вставать?» Вы ведь ждали, когда можно будет выспаться, спокойно выпить чай. И вот тишина. Даже чай какой-то невкусный. Потом еще себя ругаете: дети устроились, все нормально, чего мне опять надо? Давайте так, годами у вашего утра был готовый ответ: кого разбудить, накормить, куда проводить. Вы открывали глаза и уже знали, зачем встаете. Теперь этот ответ исчез. А вопрос о себе остался, и с непривычки на него трудно ответить.","caption":"Иногда особенно больно от их «У нас все хорошо»: можно выдохнуть, а привычного разговора о том, чем помочь, уже нет. И вы еще держите телефон в руке.\nМеня зовут Михаил, я психолог, работаю с людьми от 45 до 60 лет.\nЕсли хочется, напишите в комментариях, чего вам сейчас не хватает."},{"v":"zh3","text":"Это для вас, если дети выросли, уехали, а вы утром лежите и думаете: ну и для чего мне теперь вставать?\n\nА вы почему-то плачете на кухне. И еще проверяете, чтобы по телефону голос был нормальный, бодрый. Вдруг услышат и начнут переживать.\n\nПоэтому рассказываете, что у вас все хорошо, спрашиваете, поел ли он, и заканчиваете разговор, хотя хотели еще немного послушать, как у него прошел день.\n\nЯ вот на этом «радоваться надо» каждый раз останавливаюсь.\n\nИ вот утром вы по привычке ставите на стол вторую чашку. Потом убираете ее обратно. Вы столько раз мечтали спокойно выпить чай. А теперь сидите и даже не знаете, чего вам самой или самому хочется на завтрак. Раньше покупали то, что любят дети.\n\nТеперь вам трудно признаться, что хочется услышать из комнаты самое обыкновенное: «А у нас есть что-нибудь поесть?» Даже смешно немного. Столько лет отвечали на этот вопрос, иногда сквозь зубы. Сейчас готовы подробно рассказать про все, что есть в холодильнике.\n\nВам их очень не хватает.","caption":"В разговоре с уехавшими детьми иногда все время уходит на бытовые вопросы. До рассказа о том, что сегодня вас рассмешило или расстроило, так и не доходят.\n\nЕсли вы подолгу не можете встать, почти ничего не радует и трудно заниматься обычными делами, стоит обратиться к психологу или психиатру. Об этом можно говорить, даже когда у детей все хорошо."},{"v":"zh_h7_staryy","text":"Это для тех, кто после отъезда детей просыпается и думает: ну и зачем мне теперь вставать, мои дорогие специалисты по чужим завтракам и потерянным носкам.\n\nВы столько лет хотели спокойно выпить чай, и вот чай можно пить спокойно. А вам почему-то плохо.\n\nВот вы стоите на кухне, открываете холодильник и по привычке прикидываете, что приготовить побольше. Потом вспоминаете: сегодня хватит совсем немного. Закрываете холодильник. И вдруг садитесь. Даже есть расхотелось.\n\nЯ бы здесь очень осторожно относился к бодрым предложениям наконец заняться собой. Да подождите вы с этим «наконец». Человек еще к тишине за стеной привыкает, а ему уже предлагают записаться куда-нибудь и радоваться свободе.\n\nКстати, вы ведь могли сами помогать с переездом, выбирать билеты, складывать вещи. Уговаривать ребенка ехать, потому что там работа или учеба лучше. И теперь особенно стыдно признаться, что хочется обратно того самого вечера, когда все дома. Вы же сами были за.\n\nБыли. И сейчас за. Только скучаете.\n\nУ вас сегодня слезы от того, что любимая чашка стоит чистая уже несколько дней.\n\nВы по ним скучаете. Очень.","caption":"Отдельно я бы оставил место для обиды: дети могут редко звонить, а родителю бывает стыдно даже признать, что он ждет звонка. Взрослость детей этого ожидания сама по себе не отменяет.\nЯ Михаил, психолог, работаю с женщинами и мужчинами от сорока пяти до шестидесяти.\nЕсли хочется, напишите в комментариях, чего вам сейчас не хватает дома."},{"v":"zh2","text":"Это для тех, у кого дети выросли, уехали, а вы утром открываете глаза и думаете: и зачем мне теперь вставать, кому я вообще нужен?\n\nИ еще себя ругаете? Вроде взрослый человек, пора бы заняться собой, столько лет мечтали спокойно выпить чай. Вот он, чай. Пейте сколько хотите. Только раньше вы его пили и прислушивались, как поворачивается ключ в двери. Теперь допили, помыли чашку, и до вечера никто не придет.\n\nМеня задевает, когда человеку в таком состоянии бодро предлагают наконец пожить для себя. Как будто он сейчас скажет: точно, что же я сразу не догадался, сейчас запишусь куда-нибудь и перестану скучать.\n\nПогодите вы с этим.\n\nИ теперь вы можете прекрасно понимать, что они взрослые, и все равно покупать лишний йогурт. Тот самый, который любили они. В магазине взяли как обычно, дома поставили в холодильник и только тут вспомнили.\n\nТеперь дома тихо, и вы впервые можете почувствовать, насколько устали за все эти годы.\n\nВы очень любите детей. И очень скучаете по ним.\n\nЗа это себя ругать еще и сверху?","caption":"Иногда тяжелее всего возвращаться из магазина: раньше по дороге домой вы знали, кого там застанете. И к этой перемене тоже приходится привыкать.\nЯ Михаил, психолог, работаю с женщинами и мужчинами от 45 до 60 лет.\nЕсли хочется, напишите в комментариях, по какой домашней мелочи вы скучаете."}]},{"id":"r_gnezdo_1_2","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","author":"Михаил","format":"reels_malysh","cards":[{"v":"h3h4_staryy","text":"Дорогие мои, дети выросли и уехали, а вы утром лежите и думаете: зачем вставать? И еще ругаете себя: ну что я совсем раскис.\n\nПредставьте календарик. Много лет в каждой клеточке было понятно: ребенка разбудить, накормить, вечером дождаться. Даже когда уставали, было ясно, для чего начинается день.\n\nА теперь клеточки пустые. И от этой пустоты бывает страшно. Получается, вы скучаете еще и по тому, как легко находился ответ на вопрос: что мне сегодня делать?\n\nСвои желания столько лет вписывали куда поместятся. Теперь для них целый день. Сразу и не сообразишь, чего хочется.","caption":"Даже долгожданная тишина в доме может оказаться тяжелой. Можно радоваться самостоятельности детей и хотеть, чтобы они еще немного пожили рядом.\nЯ Михаил, психолог, работаю с женщинами и мужчинами от 45 до 60 лет.\nПодписывайтесь, если хочется еще таких разговоров."},{"v":"zh3","text":"Дорогие мои мамы и папы, у которых дети выросли, а вы теперь утром лежите и думаете: ну и зачем мне вставать? Ребенок устроился, живет отдельно, сам покупает продукты. Радоваться надо. А вам хочется, чтобы он хоть спросил, где у него носочки.\n\nСтыдно, что хочется быть нужными? Понимаю.\n\nВаш домик теперь тихий. Вы этой тишины когда-то очень хотели. Особенно когда в воскресенье в семь утра кто-нибудь начинал искать зарядку и заодно будил всех остальных. А теперь можно спать. И почему-то лежать грустно.\n\nИ вот утро. Вы ставите на стол лишнюю чашку. Рука сама потянулась. Потом убираете ее обратно и думаете: господи, ну что я как маленький, люди детей замуж выдают, в другие страны провожают, а я тут из-за чашки.\n\nТак, подождите. Давайте я сейчас тоже обойдусь без бодрого предложения немедленно найти хобби. Меня задевает, как быстро окружающие начинают занимать вас делами, когда вы говорите, что вам одиноко. Запишитесь туда, съездите сюда. Вы, может, сегодня просто хотели вместе позавтракать.\n\nВам тоже нужна близость.","caption":"Взрослые дети могут даже не догадываться, что родители ждут звонка: при встрече все улыбаются и говорят, что все хорошо. Если утро за утром вы чувствуете бессмысленность и вам трудно заниматься обычными делами, об этом стоит поговорить с психологом.\nЯ Михаил, психолог, работаю с женщинами и мужчинами от 45 до 60.\nЕсли знакомо, напишите в комментариях «скучаю»."},{"v":"zh_h7_staryy","text":"Дорогие мои, я хочу спросить: а что если побыть «эгоистом», когда дети выросли и уехали, совершенно нормально?\n\nВот обычная история: взрослый ребенок звонит вечером, рассказывает про работу, потом говорит, что побежал, его ждут. Вы кладете телефон и еще сидите с ним в руке.\n\nИ стоит появиться желанию потратить время или деньги на себя, тут же находится внутренний голос: ну вот, стали эгоистом. Как будто собственное желание обязательно должно пройти проверку, достаточно ли оно полезно семье. Я считаю такую проверку жестокой. Человек и так потерял привычный смысл утра, а ему еще стыдно искать собственный.\n\nЭтот «эгоист» тот, кто готовит себе любимый завтрак, хотя больше никто его не ест, и слышит: «Для себя одной столько возни, зачем?»\n\nЭтот «эгоист» тот, кто тратит часть денег на поездку, о которой давно думал, и слышит: «Лучше бы детям отдали, им сейчас нужнее».\n\nЭтот «эгоист» тот, кто записывается туда, где ему интересно, и однажды пропускает привычный вечерний звонок, потому что занят, и слышит: «Ну вот, теперь у вас своя жизнь, до нас дела нет».\n\nЧто здесь эгоистичного? Кому вы этим вредите?","caption":"Даже привычка покупать слишком много хлеба может напоминать, сколько людей раньше было дома. Такие мелочи порой задевают сильнее самого прощания.\nМеня зовут Михаил, я психолог, работаю с женщинами и мужчинами в середине жизни.\nЕсли хотите поговорить об этом на консультации, напишите мне в личные сообщения."},{"v":"zh2","text":"Мои хорошие, у кого дети выросли и уехали, а вы теперь утром лежите и думаете: вставать для кого? Собрание родителей, которые всех вырастили, открыто. Хотя бы сегодня можно прийти без справки и домашней выпечки.\n\nИ вот ребенок живет отдельно. Сам покупает хлеб. Сам решает, надевать ли шапку. Тут, конечно, еще большой вопрос, но проверять уже неудобно.\n\nПотом все-таки встаете, достаете большую сковородку, потому что всегда жарили завтрак на всех, и стоите с ней посреди кухни. Одному человеку столько не нужно. Убираете обратно.\n\nИ вы еще себя ругаете: другие путешествуют, записываются куда-то, радуются свободе. А я сижу, жду сообщения. Уже написал, что доехал, уже все хорошо, можно выдохнуть. Только хочется, чтобы он еще что-нибудь написал. Хоть про то, что чайник купил.\n\nЯ против того, чтобы человека в этот момент торопили срочно наслаждаться жизнью. Особенно когда он сам уже весь вечер себя за это пилит.\n\nДорогие мои, да вы человека вырастили! Да за одни поделки из природных материалов вам положен отдельный отпуск.\n\nВы хотели, чтобы он вырос. И вы все равно по нему скучаете.","caption":"Иногда тяжелее всего становится после звонка: поговорили хорошо, а потом опять тишина. Если неделями ничего не радует и трудно делать обычные дела, я бы предложил обратиться за помощью к психологу или психиатру.\nЯ Михаил, психолог, работаю с женщинами и мужчинами от 45 до 60 лет.\nОтправьте тому, у кого сейчас опустел дом."},{"v":"живой","text":"Да пошел он нахуй, мудила. Слушай, я думаю, что это проявление его избегающего стиля привязанности. Я ж тебе рассказывала, что у него была холодная избегающая мать. И я думаю, что он проецирует на меня ее образ, и он боится показать свою уязвимость, открыться мне, проявить какую-то нежность, потому что думает, что если я узнаю его слабые стороны, то в случае ссора или конфликта я могу прям иголкой в них ткнуть. Да пошел он нахуй, мудила.","caption":""}]},{"id":"r_razvod_1","topic":"«ради детей надо сохранить семью»","author":"Ольга","format":"reels_rol","cards":[{"v":"zh3","text":"Здравствуйте, мамы, я ведущая тренинга «Сохранить семью ради детей». Папы сегодня отсутствуют, у них дела. Начнем без них, мы уже привыкли.\n\nВот, например, у дочери школьный концерт. Она выучила песню, вечером вам на кухне спела, потом спросила, придет ли папа. Вы мужу написали, напомнили, костюм погладили, с работы отпросились. Он сказал, что постарается. Какой молодец, уже старается. Сразу его похвалите, чтобы у него закрепилось желание когда-нибудь постараться еще.\n\nДочь спрашивает, почему папа опять не пришел? Тут главное правильно ответить. Папа работает. У папы дела. Папа очень хотел. Что значит, вы не знаете, хотел ли он? Ну придумайте, господи, у вас же хорошо получается: костюм нашли, букет купили, теперь найдите папе уважительную причину.\n\nВас бесит, что вы ему уже три раза объясняли, как это для нее важно? Ну объясните в четвертый. Вы же мать, вы умеете находить подход к детям. С мужем тоже постарайтесь: выберите момент, подберите слова, дождитесь, когда он поест. Хрен с вашим вечером, у нас семья.\n\nУговорите. Пусть еще открытку ему сделает, напишет, как любит. Папам тоже нужно внимание, иначе откуда у них возьмется желание проводить время с семьей? Мы же здесь все взрослые женщины, понимаем.\n\nИ обязательно сделайте общее фото. Поставьте мужа рядом с дочерью, попросите его обнять ее, сами улыбайтесь. Подпишите: «Наша семья». Очень полезно потом пересматривать, когда опять захочется развестись. Вот же вы все вместе, вот же улыбается ребенок. Какие еще вам нужны доказательства?\n\nФото мужу отправьте. Пусть узнает, как хорошо вы сегодня провели время.","caption":"Меня злит, когда маме предлагают еще и объяснять ребенку каждый папин пропуск. Особенно когда папа сам вполне может позвонить дочери и поговорить с ней."},{"v":"zh_h7_staryy","text":"Так, мамы, здравствуйте. Я сегодня проведу собрание о сохранении семьи ради детей. Папы прийти не смогли, поэтому за сохранение семьи отвечаете вы. Очень удобно, сразу все ответственные на месте.\n\nТак.\n\nМуж с вами неделями не разговаривает? Прекрасно, дома тихо. При ребенке обзывает? Ну, значит, разговаривает, контакт есть. Вы уж определитесь, что вам надо, а то мужчина старается, и все мимо.\n\nЯ сама сторонница индивидуального подхода. Каждой маме индивидуально объясняю, что она должна потерпеть.\n\nВот, допустим, обычный вечер. Вы пришли с работы, приготовили ужин, ребенок делает домашку, муж сидит в телефоне. Вы просите его помочь с математикой, он говорит, что вы его достали. Ребенок поднимает голову, смотрит на вас, потом тихонько закрывает тетрадь.\n\nИ вот тут очень важно улыбнуться. Прямо зубами. Чтобы ребенок понял: у нас все хорошо, мама улыбается, папа дома, математику временно отменяем.\n\nТолько без выяснения отношений, пожалуйста. Дети все чувствуют. Поэтому чувствуйте потише. Обиделись, пошли в ванную, включили воду, поплакали, вышли с огурцами. Я имею в виду нарезку к ужину. У нас тут все практично, я херни не посоветую.\n\nБлядь, опять вы про развод. Мы столько труда вложили, чтобы вы научились сохранять семью без участия второго взрослого.\n\nТак, все, собрание окончено. Идите домой, сохраняйте. Мужу передайте, что от него ничего не требуется.","caption":"Ребенок может скучать по папе и одновременно спокойно засыпать дома, где больше никто не кричит.\nЯ Ольга, психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nОтправьте тому, кому сейчас нужно это услышать."},{"v":"zh2","text":"Мамы, здравствуйте, я веду сегодняшнее родительское собрание. Кто собирается разводиться, пока уберите заявления, у нас еще чаепитие.\n\nЯ вообще считаю, мамы, мы слишком много внимания уделяем всяким настроениям. Любите вы друг друга, скучаете, хотите вместе проводить время. У нас в анкете таких граф нет. Мать есть? Есть. Отец есть? Есть. Адрес совпадает? Поздравляю, СЕМЬЯ сохранена. Даже ручку зеленую достану, приятно же поставить галочку за хороших людей.\n\nТак, вы руку тянули. У вас сын перед ужином спрашивает, папа сегодня в хорошем настроении? Какой внимательный мальчик. Другие дети в телефонах сидят, ваш уже по звуку ключей понимает, можно ли попросить помочь с математикой. Пригодится в коллективе.\n\nТолько давайте без этих ваших вздохов, я вам тут, блин, семью сохраняю.\n\nРебенок сидит между вами, жует и старается вилкой лишний раз по тарелке не стукнуть. Зато ужинаете вместе.\n\nНет, папу на собрание я не приглашала. Он работает. Вы тоже работаете? Ну вы же пришли, значит, можете. К тому же кто у вас переживает за семью? Вы. Вот с вами и обсуждаем, как вам еще постараться. Очень удобно, когда ответственный человек уже найден.\n\nЧто, он вчера сказал, что после школы не хочет домой? Ну конечно. Дома же надо следить, кто с кем разговаривает, кому сейчас можно задать вопрос, кого лучше развеселить. Ответственности много. Ничего, втянется.\n\nТак, мамы, собрание заканчиваем. Главное, чтобы вы оставались вместе. Кто будет следить, чтобы дома все друг друга выдерживали?\n\nПравильно. Ребенок. Вы же ради него все это затеяли, черт возьми.","caption":"Меня бесит, как легко матери поручают отвечать еще и за участие отца: сама попроси, сама напомни, сама придумай, как ему сблизиться с ребенком. После развода у него по-прежнему есть ребенок и своя родительская ответственность.\nЯ Ольга, психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nОтправьте той, кому сейчас это нужно услышать."},{"v":"h3h4_staryy","text":"Ради детей сохраняем семью, даже если дома все друг друга ненавидят. Я подготовила инструкцию. Ругаетесь на кухне? Закрывайте дверь. Ребенок все слышит? Включайте ему мультики погромче. Спрашивает, почему папа обзывает маму? Объясните: папа устал. Вы тоже устали? Ну вы же взрослая, потерпите. Блядь, у нас тут сохранение семьи, соберитесь. Так, ребенок просит вас развестись. Это он маленький, ничего не понимает. Обязательно скажите, что живете вместе ради НЕГО. Пусть знает, сколько стоит его счастливое детство. Итак, мама терпит, папа продолжает, ребенок чувствует себя виноватым. Все на месте. Семья сохранена.","caption":"«Я ради тебя осталась» ребенку потом тоже придется как-то переварить. Даже если вы сказали это всего один раз.\nЯ Ольга, психолог, работаю с женщинами 30-45, которые думают о разводе или уже развелись.\nОтправьте той, кому сейчас нужно это услышать."},{"v":"живой","text":"Как же я себя ненавижу? Я реально ничего не достигла, сижу на работе, не могу даже сконцентрироваться. Господи, какая я жалкая. Как я жалею себя, вон все вообще коллеги нормально живут, строят семьи, ходят на работу, улыбаются, а я... Как же я от себя устала? Как же я себя ненавижу? Я такая жалкая. Так, стоп. О чем мы там говорили? Самокритика, да? Симптом депрессии. Ну сложно, конечно, вот и поверить, но допустим. Так, значит, критик меня долбит, чтобы я была продуктивной, это не работает. Ну это мы с ним сейчас в терапии общаемся, у меня нет сил никаких с ним взаимодействовать, что я могу сделать. В мыслях я сейчас ничего позитивного не найду, они у меня в руминации превращаются, концентрироваться на работе, я не могу, сижу туплю. Значит, можно чуть-чуть отвлечься. Да, сделаю поведенческую активацию, подышу воздухом 5 минут. Может, это поможет? Как же сложно.","caption":""}]},{"id":"r_razvod_1_2","topic":"«ради детей надо сохранить семью»","author":"Ольга","format":"reels_monolog","cards":[{"v":"zh3","text":"Читаю сейчас комментарий «ради детей надо сохранить семью» и уже закрыла приложение, но сижу и думаю: почему после этого разговаривать с мужем, искать психолога, придумывать совместные выходные, звать его ужинать и напоминать ему, что у ребенка в субботу выступление, опять должна женщина? Еще и рубашку ему погладить, чтобы на семейной фотографии все получилось убедительно.\n\nБлядь, ну сколько у нее обязанностей.\n\nПредставьте обычный вечер. Вы позвали всех ужинать, муж пришел с телефоном, ребенок рассказывает, как его взяли в школьный спектакль. Муж угукнул, продолжает смотреть в экран. Ребенок спрашивает: «Пап, ты придешь?» Вы уже знаете, что сейчас услышите про работу, поэтому быстро говорите: «Папа постарается, кушай пока».\n\nПотом напоминаете мужу про спектакль. Потом еще раз. Потом он говорит, что ничего не обещал, а вы сидите рядом с ребенком, смотрите на дверь и злитесь на себя, потому что опять сказали ему, что папа постарается.\n\nЯ сама сейчас поймала себя на желании придумать для этой женщины такие слова, чтобы муж наконец услышал. Ну вот, тоже туда же.\n\nЕсли ради детей семью сохраняете только вы, что ради детей делает муж?","caption":"Иногда женщина уже выбрала семейного психолога, узнала стоимость и предложила время. Муж отказался, а родственники все равно спрашивают у нее: «Вы точно все попробовали?»\n\nЯ каждый раз злюсь на это «вы».\nНапишите «знакомо», если вам тоже так говорили."},{"v":"живой","text":"Выбирай доброго, а не самого яркого. Если ты сейчас в процессе поиска партнера, ходишь на свидание, то у меня для тебя один важный совет. Выбирай доброго человека. Не самого яркого, не самого остроумного, а доброго. И я не про того, который будет всегда удобный и согласен на все, а про того, кто умеет быть внимательным, кто умеет заботиться, кто замечает и не хочет делать больно даже в ссоре. Сарказм, дерзость, флирт это может быть весело, как смотреть за фейерверком. Но когда правда станет сложно, когда будут ссоры, когда будет стресс, сарказм и дерзость, будут совсем не в кассу. Фейерверк впечатляет, но когда становится темно и холодно, хочется сидеть у костра или у камина в тепле, а не смотреть на красивое небо. Подписывайся, тут про счастливые отношения.","caption":""},{"v":"h3h4_staryy","text":"«Ради детей надо сохранить семью», слышите вы, когда говорите о разводе. Любой ценой? Блядь, ребенку уже выставили счет.\n\nВот вы остались. Муж опять вас унизил, вы промолчали. Вечером он играет с сыном, сын хохочет. И вы думаете: «Ну вот, ради этого и терплю».\n\nА завтра сын грустит, огрызается. И хочется сказать: «Я ради тебя столько вынесла, а ты...»\n\nСлышите? Ему уже надо быть счастливым, чтобы ваши мучения имели смысл.\n\nРешение о браке принимаете вы, взрослые. А ребенок теперь еще и ОБЯЗАН показать, что оно того стоило?","caption":"«Я с твоим отцом только ради тебя» может вылететь в ссоре. И ребенок потом боится сказать, что ему дома тоже плохо.\nЯ Ольга, психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nПодписывайтесь, если хочется еще таких разговоров о разводе, детях и чувстве вины."},{"v":"zh_h7_staryy","text":"Я против этого «ради детей надо сохранить семью», когда женщине предлагают терпеть что угодно, лишь бы папа продолжал жить дома.\n\nНужен. Согласна.\n\nИз того, что ребенку нужны оба родителя, почему-то делают вывод, что женщина обязана сохранить брак. Любой ценой. И цену эту очень удобно оставить за кадром.\n\nВот вы сидите вечером за столом. Муж с вами со вчерашнего дня не разговаривает. Ребенок просит передать картошку, вы тянетесь за миской, муж отодвигает руку. Мелочь, да? Сцену никто не устроил, тарелки целы. Только ребенок уже смотрит по очереди на вас обоих и решает, можно ли сейчас рассказать, что произошло в школе. Или лучше поесть побыстрее.\n\nСемья сохранена. Все дома.\n\nИ вы сидите, жуете эту картошку и думаете: зато у него есть папа.\n\nБлядь, сколько всего можно сложить в это «ради него».\n\nИ когда вам говорят, что вы обязаны сохранить семью, вам заодно предлагают отвечать за поведение двух взрослых. Охренеть задача.\n\nОна уже думает о последствиях, о жилье, о разговорах с детьми.\n\nА если вы уже давно пытаетесь сохранить детям хоть какой-то спокойный вечер?","caption":"Иногда ребенок первым спрашивает, почему родители разговаривают только через него. Формально все еще живут вместе, и эту подробность в советах про сохранение семьи обычно пропускают.\nЯ Ольга, психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nПодписывайтесь, если хочется еще таких разговоров о браке, разводе и чувстве вины."},{"v":"zh2","text":"Читаю сейчас комментарий «ради детей надо сохранить семью» и никак не могу закрыть.\n\nБлядь, как удобно. Вы ОДНА должны сохранить то, в чем вас двое.\n\nВот обычный вечер. Вы зовете всех ужинать, ребенок рассказывает, как его выбрали выступать на школьном празднике. Муж смотрит в телефон. Вы тихо просите его послушать, он раздражается: ну слышу я, чего ты начинаешь. И вы сразу улыбаетесь ребенку, задаете еще вопрос, подкладываете картошку, только бы ужин прошел спокойно.\n\nЯ тоже могу разозлиться на такой совет и захотеть сразу сказать: да сколько можно, уходите уже. И мне приходится себя останавливать. Я ведь понятия не имею, как вы живете, чего хотите, о чем вы с мужем говорили и готов ли он что-то менять. Решать за вас мне тоже очень удобно. Мне потом с этим решением не жить.\n\nЯ против того, чтобы вас заранее назначали виноватой в разводе, если вы больше не можете все это вытягивать.\n\nЕсли ради детей стараетесь только вы, что именно собирается сохранять их отец?","caption":"Иногда женщина уже знает расписание возможных встреч детей с папой, но все еще боится произнести слово «развод» вслух. Слишком многие успели объяснить ей, какой матерью она после этого станет.\nМеня зовут Ольга, я психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nПодписывайтесь, если хочется еще таких разговоров про отношения, развод и жизнь после него."}]},{"id":"r_pereezd_1","topic":"переехала в другой город и за год ни с кем не подружилась","author":"Юлия","format":"reels_spisok","cards":[{"v":"живой","text":"Если вы узнаете себя хотя бы в трех из шести описаний, вас можно назвать взрослым ребенком из дисфункциональной семьи. Первое, человек-решала, или по-другому «я все сама». Внешне это выглядит как сильная воля и надежность, но внутри хроническая усталость и ощущение, что опоры нет нигде кроме вас. Второе, неконфликтный миротворец. Вы профессионально сглаживаете углы и превращаете любую историю в первоклассный стендап и готова сделать что угодно, лишь бы не было конфликта. Другие называют вас очень легким человеком, а вы потом доплакиваете один, потому что все эмоции так остаются внутри. Третье, профессиональный выживальщик. Вы быстро адаптируетесь к любым условиям, новая работа, переезд, токсичный начальник, ничего, я справлюсь. Там, где другие бы уже ушли, вы продолжаете терпеть, потому что хаос это ваша стихия, а боль вы едите на завтрак. Четвертое, человек, у которого никогда нет проблем. Он просто немножечко устал. Вы живете в постоянном стрессе и последний раз отдыхали в утробе матери. Уже не очень понимаете, чего вообще хотите и часто чувствуете себя одиноким даже среди людей. Но при этом думаете, ну у других же хуже, мне грех жаловаться. Пятая, родитель для своих родителей. Сдать маме анализы, купить таблетки, закинуть денег на карту, заставить купить пуховик, записать к врачу, решить очередную проблему и вроде это уже давно не ваша ответственность, но внутри ощущение, что если не вы, то никто. И шестое, человек, который всегда делает недостаточно. Вы много работаете над собой, над жизнью, над отношениями, но внутри чувство: все еще мало, я могла бы лучше. Сил нет, но планка к себе только растет. И вы гораздо жестче к себе, чем к кому бы то ни было еще. А теперь правильные ответы в описании.","caption":""},{"v":"h3h4_staryy","text":"Четыре признака у тех, кто за год после переезда так и не нашел друзей.\nПервое. Ты готовишься к обычной встрече как к собеседованию. Даже историю про выходные выбираешь: эта скучная, тут я выгляжу глупо. Давайте так, с тобой кофе пьют. Тебя сейчас никто на работу не принимает.\nВторое. Тебе трудно предложить просто погулять. Надо найти выставку, классное место, еще что-нибудь. Иначе зачем человеку тратить на тебя вечер?\nТретье. Ты скрываешь мелкие трудности. Коллеге говоришь, что уже освоилась, хотя вчера расплакалась в автобусе. Хочется сначала стать человеком, с которым легко.\nЧетвертое. Когда встречу отменяют, тебе даже легче. Фух, сегодня можно никого не впечатлять.","caption":"Дружба часто начинается с разговора, в котором ты ничего интересного не сказала.\nЯ Юлия, психолог, работаю с людьми от 25 до 35, которые переехали.\nЕсли узнала себя, напиши свой пункт в комментариях."},{"v":"zh2","text":"Четыре признака, что ты уже год живешь в новом городе, а близкого человека рядом так и не появилось, хотя с людьми ты общаешься почти каждый день.\n\nПервое, тебе проще помочь, чем попросить. Но когда сама заболеваешь, заказываешь доставку из аптеки и даже знакомой по соседству ничего не пишешь.\n\nВторое, на выходные у тебя много планов, которые ты снова откладываешь. В субботу ты долго выбираешь, куда сходить, потом уже поздно собираться, потом наступает воскресенье.\n\nТретье, со старыми друзьями ты становишься все бодрее. Они спрашивают, как тебе живется, и ты рассказываешь про район, работу, погоду, новый диван. Про диван можно долго. И вот это меня злит: человек еще ничего тебе не сказал, а ты уже приготовилась объяснять, почему тебе бывает плохо в городе, который ты сама выбрала.\n\nЧетвертое, ты скучаешь по человеку еще до того, как успела с ним подружиться. Хорошо поговорили после работы, вместе дошли до метро, она сказала, что надо как-нибудь повторить.\n\nА тебе кому можно написать: слушай, у меня сегодня такой день?","caption":"Иногда после переезда хочется услышать совсем простое: я рядом, могу зайти. И от вопроса «Ну что, уже освоилась?» почему-то хочется плакать.\nМеня зовут Юлия, я психолог, работаю с людьми, которые переехали и заново устраивают жизнь в свои 25-35.\nЕсли хочется, добавь в комментариях свой пункт."},{"v":"zh_h7_staryy","text":"Пять признаков одиночества после переезда, которое слишком легко списать на занятость. А предложить кому-нибудь встретиться вечером все еще некому. Я считаю, это заслуживает внимания даже при хорошей работе и прекрасной квартире.\nПервое. Ты замечаешь, как давно тебя никто не обнимал. С мамой поговорила, подруге голосовое отправила, на работе весь день отвечала людям, но вечером хочется просто к кому-нибудь прислониться.\nВторое. Особенно неприятен момент, когда занятие закончилось, ты вышла на улицу, и дальше опять целый вечер. Купить кофе можно. Посидеть с кем-то за этим кофе сложнее.\nТретье. С коллегой легко обсуждать отпуск, с соседкой можно поболтать у лифта, а написать ей в субботу кажется уже какой-то навязчивостью. Меня цепляет, как быстро здесь появляется мысль: у всех уже есть друзья, куда я лезу.\nЧетвертое. Хорошая новость особенно остро напоминает, что рядом никого нет. Но ужинать сегодня опять будешь одна, и это почему-то чувствуется сильнее именно в удачный день.\nПятое. Ты открываешь билеты раньше, чем афишу. Потому что там можно написать: я приеду, увидимся?\nСколько у тебя совпало?","caption":"Иногда самым трудным оказывается указать человека, которому можно оставить запасные ключи. Вроде маленький вопрос, а ответить некому.\nЯ Юлия, психолог, работаю с людьми 25-35 лет, которые обживаются после переезда.\nЕсли хочется, добавь в комментариях свой пункт."},{"v":"zh3","text":"Четыре признака, что после переезда ты хочешь подружиться, но боишься навязаться и поэтому остаешься одна.\n\nПервое, тебе нужно заранее знать, что тебе обрадуются. Коллега говорит, что собирается после работы выпить кофе, и ты спрашиваешь, где тут вообще хороший кофе, долго обсуждаешь меню, но предложить пойти вместе так и не решаешься.\n\nВторое, ты стесняешься сказать, что тебе нужна помощь. Но спросить у знакомой, можно ли указать ее телефон для экстренной связи в анкете, почти невозможно. Ты оставляешь номер мамы, которая живет за тысячу километров, и надеешься, что звонить ей никто не будет.\n\nТретье, ты откладываешь встречи до того момента, когда будешь поинтереснее. И снова ешь одна, листая чужие фотографии из ресторана.\n\nЧетвертое, ты до сих пор бережешь хорошие новости для подруг из прежнего города. Новым знакомым тоже ничего не рассказываешь, им придется долго объяснять, почему для тебя это так важно.\n\nА кто в новом городе знает, что у тебя сегодня был хороший день?","caption":"Иногда хочется позвать знакомую погулять, и ты полчаса придумываешь повод, хотя тебе просто хочется ее увидеть. Меня каждый раз трогает, сколько осторожности бывает в таком коротком сообщении.\nЕсли хочется, допиши в комментариях свой пункт."}]},{"id":"r_pereezd_1_2","topic":"переехала в другой город и за год ни с кем не подружилась","author":"Юлия","format":"reels_monolog","cards":[{"v":"zh_h7_staryy","text":"Я называю это ожиданием: ты уже год живешь в новом городе, знаешь, где купить хлеб вечером, и все еще ждешь, когда здесь появится человек, которому можно просто написать: пойдем погуляем.\n\nВот в это кафе хочется с кем-то зайти, сесть у окна, долго выбирать, потом попробовать из чужой чашки, потому что чужое почему-то всегда интереснее. И чтобы человек уже знал, что ты будешь долго выбирать. Ну вот такую мелочь знал. Я думаю, именно по этим мелочам особенно скучаешь после переезда.\n\nСначала надо было разобрать коробки, потом освоиться на работе, потом пережить зиму, и ты вполне искренне думала, что к весне уже будет с кем посидеть у окна. А теперь снова осень. Ты заходишь в то кафе, узнаешь девушку за стойкой, она узнает тебя, и ты даже радуешься этому, а потом садишься за столик и опять пишешь подруге в другой город.\n\nОжидание, это когда ты уже перестала ждать, что подруга вдруг окажется рядом, и понимаешь, что кафе само тебя ни с кем не познакомит, и все равно перед выходом проверяешь телефон. Вдруг сегодня кто-нибудь напишет тебе: я рядом, ты дома?","caption":"В новом городе даже спонтанная встреча часто требует переписки, календаря и нескольких переносов. Я бы оставила в этом календаре место и для тоски по прежней легкости.\nМеня зовут Юлия, я психолог, работаю с людьми, которые переехали и заново обживаются.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"h3h4_staryy","text":"«Я год живу в новом городе и ни с кем не подружилась». А знакомиться ты пробовала. Вот с коллегой сходили на кофе, посмеялись. На следующий день она сама тебе ничего не написала. И ты уже думаешь: ну понятно, ей со мной было скучно. Второй раз звать как-то унизительно, да?\n\nТы приходишь знакомиться и сразу проверяешь, нужна ли ты. Написала первой? Почему опять я? Не позвали на выходных? Все, я лишняя.\n\nИ ты отходишь. Вы еще только кофе выпили, а ты уже пережила конец дружбы.","caption":"Особенно обидно, когда дома были люди, которым можно было написать просто «пойдем?». Здесь даже приглашение на кофе сочиняешь полчаса.\nЯ Юлия, психолог, работаю с теми, кто в 25-35 переехал и привыкает к новой жизни.\nЕсли хочется об этом поговорить, ссылка на запись на консультацию в шапке профиля."},{"v":"zh2","text":"Ты сейчас смотришь этот ролик и думаешь, что все после переезда уже нашли себе друзей, кроме тебя?\n\nНу конечно. Даже незнакомые люди из ленты успели найти компанию, устроить совместный отпуск, поссориться, помириться, выложить фотографии с чужого дня рождения. Ты за год нашла хороший хлеб возле дома.\n\nДавай еще грамоту тебе выдадим: «Хуже всех переехала». За хлеб хотя бы похвалим.\n\nМне каждый раз обидно, когда человек вот так с собой разговаривает.\n\nВот ты лежишь вечером на диване, листаешь телефон. В комнате тихо, на кухне остывает чай. Попадается видео: компания сидит за столом, кто-то смеется, кто-то тянется через весь стол за картошкой.\n\nПотом заходишь в профиль. Проверяешь, давно ли девушка переехала. Полгода назад. Прекрасно. Ты тут вдвое дольше.\n\nЛюди просто хорошо проводят вечер, а ты сидишь с телефоном и стыдишь себя за то, что тебе больно на них смотреть.\n\nИ самое грустное для меня вот что. Ты ведь сначала смотрела на этот стол и думала, что тебе тоже хочется так сидеть, смеяться, тянуться за картошкой. Ты могла бы даже вслух сказать: «Я бы тоже пошла».\n\nНо к концу вечера говоришь уже другое: «Кто меня вообще позовет».","caption":"Иногда тяжелее всего в новом городе вечером в пятницу: рабочие чаты затихли, и до понедельника тебе может вообще никто не написать. Меня очень трогает, сколько стыда люди чувствуют, когда признаются, что им хочется компании.\nЯ Юлия, психолог, работаю с теми, кто после переезда привыкает к новой жизни.\nОтправь тому, кто тоже пока осваивается в новом городе."},{"v":"zh3","text":"Девочки, кто год назад переехал и до сих пор в выходные разговаривает в основном с кассиром, ну что, опять решили, что с вами скучно? Милые мои, вы уже и кассиру, наверное, боитесь надоесть.\n\nМеня прямо задевает, как быстро ты начинаешь себя ругать.\n\nВот есть коллега, с которой вы вместе смеетесь на обеде.\n\nИ ты открываешь переписку. Пишешь: «Может, в субботу кофе?»\n\nПочему сразу хочется добавить «если ты, конечно, свободна»? Потому что страшно получить отказ. Дописываешь. Потом еще: «Если нет, вообще без проблем». Потом смотришь на все это и стираешь. У нее наверняка свои подруги, свои планы, зачем ей еще ты.\n\nИ я сейчас думаю: ты же квартиру искала, коробки таскала, ездила смотреть жилье с чужими шторами и подозрительным диваном, разбиралась, куда нести документы, где покупать продукты, почему автобус опять уехал куда-то без тебя.\n\nА тут кофе. Две чашки кофе, господи.\n\nСама ли начала разговор. Был ли вообще повод ее звать.\n\nВ субботу ты снова пойдешь за кофе одна. А в понедельник она спросит: «Как выходные?» И ты опять ответишь: «Да нормально».","caption":"После переезда иногда особенно не хватает возможности написать кому-то: «Я рядом, выйдешь?»\nМеня трогает, сколько близости бывает в таком коротком сообщении.\nОтправь той, с кем хотелось бы выпить кофе."},{"v":"живой","text":"Бытует ужасно вредная точка зрения, которую высказывают люди совсем не разбирающиеся в теме. Они говорят, да ладно, мы все впадаем в депрессию и ничего страшного все как-то выгребают, возьми себя в руки, соберись, хватит уже себя жалеть. Представьте, чтобы кто-то сказал нечто подобное человеку, страдающему диабетом. Да ладно, что ты, хватит баловать себя этими инсулиновыми штучками, просто возьми себя в руки. Депрессия, как мы увидим, это настолько же реальное заболевание, как и диабет. Это биология, а не «ой, да хватит себя жалеть».","caption":""}]},{"id":"r_dengi_1","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","author":"Михаил","format":"reels_monolog","cards":[{"v":"zh3","text":"Еще немного. Сейчас вроде хватает: за квартиру заплатили, продукты купили, на счете что-то осталось. Но вы вечером сидите на кухне, открываете приложение банка и считаете, сколько месяцев сможете прожить, если завтра останетесь без работы. Получается прилично. Вы даже выдыхаете. Потом думаете: ну это если ничего не случится. И начинаете считать заново, уже с учетом ремонта машины, лечения, помощи родителям. Ужин за это время остыл.\n\nНакопили. Меня беспокоит, что вы дошли до своей суммы и тут же решили, что ее мало.\n\nВот прямо сейчас сидите над остывшим ужином и вспоминаете, что собирались купить новые кроссовки. Старые уже протекают, вы их утром сушили. Деньги на новые есть. Но если купить, на счете останется меньше, чем вы сегодня решили иметь для спокойствия. Ну, походите пока в старых. Только ноги завтра опять будут мокрые, и злиться вы будете на себя: зарабатываю, работаю, почему мне даже это так трудно купить?\n\nМеня здесь задевает вот что: вы действительно стараетесь, действительно зарабатываете, а вечером снова сидите с ощущением, будто ничего не накопили. Еще немного, и купите кроссовки. Завтра пока снова сушить старые.","caption":"Иногда особенно трудно тратить после повышения зарплаты: теперь вы знаете, сколько могли бы откладывать, и за каждую покупку приходится перед собой отчитываться.\n\nЯ Михаил, психолог, работаю с мужчинами от 30 до 45.\nОтправьте тому, кто постоянно считает, хватит ли денег."},{"v":"h3h4_staryy","text":"«Зарабатываю нормально, но все время боюсь, что денег не хватит».\n\nЗарплата пришла, счета оплачены, на накопления отложили. Садитесь вечером, открываете приложение банка и опять считаете: а если уволят? А если машина сломается?\n\nИ вроде все сходится. Можно выдохнуть. Но вы уже думаете: расслаблюсь, перестану шевелиться, вот тогда точно останусь без денег.\n\nБоялся, работал, деньги пришли. Значит, страх помог. Ну как его теперь отпустить, если вы ему каждый месяц приписываете свои результаты?\n\nВы сами работали, договаривались, решали задачи. А в конце месяца внутри опять: «Хорошо, что я переживал. Иначе бы ничего этого не было».","caption":"Даже отпуск тогда приходится оправдывать: «Отдохну, чтобы потом лучше работать».\nЯ Михаил, психолог, работаю с мужчинами от 30 до 45 лет.\nОтправьте тому, кто даже после зарплаты переживает о деньгах."},{"v":"zh_h7_staryy","text":"Я называю это вечной нехваткой: вы нормально зарабатываете, деньги на счете есть, и все равно вечером открываете приложение банка с мыслью, что надо бы еще подкопить. Я считаю, с этим стоит разобраться, потому что так можно годами увеличивать доход и каждый месяц чувствовать себя человеком, которому вот совсем чуть чуть осталось до финансовой беды.\n\nВечная нехватка это когда вы смотрите на свой счет, видите сумму, которой еще недавно были бы очень довольны, и сразу начинаете считать, на сколько месяцев ее хватит, если завтра исчезнет работа. Посчитали. Вроде хватает надолго. Но ведь работу можно искать дольше, и цены растут, и вообще кто знает, что будет. И сумма уже выглядит какой то скромной.\n\nВечная нехватка это когда вы вспоминаете, как сами себе обещали: вот накоплю столько, тогда выдохну. Вы накопили, открыли приложение, посмотрели, даже порадовались, и буквально через минуту решили, что лучше бы иметь вдвое больше. Ну, для надежности.\n\nВечная нехватка это когда вы наконец накопили ровно столько, сколько сами считали достаточным, сидите вечером с телефоном в руке и уже объясняете себе, почему теперь этого мало.","caption":"Когда доход нестабильный и есть обязательные платежи, вопрос о запасе вполне конкретный. Я бы отдельно смотрел на то, как часто меняется ваша собственная сумма «мне хватит».\nМеня зовут Михаил, я психолог, работаю с мужчинами от 30 до 45 лет.\nСохраните, если хотите вернуться к этой мысли."},{"v":"zh2","text":"Только что увидел совет: если боитесь остаться без денег, накопите побольше. Отложите на случай увольнения, на случай болезни, на ремонт машины, на случай, если уволят, заболеете и машина решит поучаствовать. Желательно в один вторник.\n\nВы нормально зарабатываете, платите по счетам, у вас даже есть накопления. Но вечером все равно открываете приложение банка. Вроде утром уже смотрели. И что там могло измениться? Да ничего.\n\nА потом вспоминаете, что на работе обсуждали сокращение расходов. Никто вам ничего про увольнение не говорил, но мало ли. И вы снова открываете приложение, считаете, на сколько месяцев хватит денег, если завтра останетесь без работы. Сначала с привычными расходами, потом без отпуска, потом уже думаете, можно ли будет продать машину.\n\nУжин перед вами остывает. Жена спрашивает, будете ли вы есть. Вы говорите: сейчас, секунду, мне тут надо кое-что проверить.\n\nИ вот что меня в этом особенно цепляет: вы ведь действительно стараетесь.\n\nНо приложение банка такой гарантии вам не выдаст. Хоть всю ночь обновляйте.\n\nВы сейчас деньги считаете или пытаетесь наконец перестать бояться?","caption":"Иногда мужчина знает остаток на счете до рубля, а сколько можно спокойно потратить на себя, ответить затрудняется. Любая покупка кажется лишней, даже давно запланированная.\nМеня зовут Михаил, я психолог, работаю с мужчинами от тридцати до сорока пяти.\nПодписывайтесь, если хочется еще таких разговоров про тревогу, деньги и ответственность за близких."},{"v":"живой","text":"Как меня бесит, я сейчас лежу, смотрю рилсы и бешусь. И зачем я это делаю, что я лежу и бешусь? Но не могу перестать беситься, не прокомментировать вот эту бредятину: песня или книга или фильм, который заменит вам пять лет терапии. Цитата или отрывок из интервью, который заменит вам год терапии. Куриная ножка, которая заменит вам неделю в терапии. Какая-нибудь птичка, облака на небе, которая заменит вам год терапии. Сука, ничто не заменит вам терапии. И мне тоже видимо она нужна. Но я к тому, что не надо сравнивать жопу с пальцем. Это несовместимо, безусловно книга или фильм, или песня, или прогулка, или разговор с близким человеком могут иметь терапевтический эффект с точки зрения поддержки, нахождения новых смыслов, отреагирования каких-то эмоций. Ну конечно, потому что психика наша расцветает и живет. И получает новый опыт в этих процессах, безусловно. Но терапия отличается тем, что терапевт создает такую среду, в которой вы получаете именно тот опыт, который необходим вам для того, чтобы решить ваш запрос. А фильм, книга, утка, голубь, плед, граммофон, они создают случайную, стихийную возможность получить терапевтическое воздействие. Поэтому никакой год, пять лет, недели терапии вам ничто не заменит, кроме самой целенаправленной терапии. Если она, конечно, вам нужна, у вас есть на это запрос. Я психолог, как вы поняли. Но, естественно, этим видео вряд ли я себя зарекомендовала.","caption":""}]},{"id":"r_dengi_1_2","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","author":"Михаил","format":"reels_scenka","cards":[{"v":"h3h4_staryy","text":"А: Зарабатываю нормально, но постоянно боюсь, что денег не хватит.\nБ: Что делаете, когда страшно?\nА: Открываю приложение банка. Проверяю, сколько осталось.\nБ: И отпускает?\nА: Да. Потом опять лезу проверять. Деньги ведь на месте.\nБ: А спокойствие уже кончилось.\nА: Ну и что плохого? Я же просто проверяю.\nБ: Вы привыкаете успокаиваться только проверкой.\nА: Получается, без приложения я уже себе не верю?\nБ: Вам снова нужно подтверждение.\nА: Деньги лежат. А я опять иду убеждаться, что выживу.\nБ: Именно.","caption":"Телефон всегда под рукой, поэтому проверка легко помещается между двумя рабочими сообщениями. Со стороны ее вообще никто не замечает.\nМеня зовут Михаил, я психолог, работаю с мужчинами от тридцати до сорока пяти.\nПодписывайтесь, если хочется еще таких разговоров: здесь про тревогу, деньги и отношения."},{"v":"zh2","text":"Б: Вы можете сильнее тревожиться, постоянно проверяя счет.\nА: Подождите, я нормально зарабатываю, платежи закрыты, деньги отложены. Но вдруг что случится? Я открываю приложение, смотрю остаток.\nБ: Надолго вам становится спокойнее?\nА: Потом думаю: машина сломается, работу потеряю, родителям понадобится помощь.\nБ: Вы забыли остаток?\nА: Нет, я его помню. Практически до копейки.\nБ: А потом снова хочется убедиться?\nА: Да. Вчера с сыном ужинали, он принес рисунок, положил рядом с тарелкой. Я сказал: сейчас посмотрю. И опять полез в банк, хотя поступлений никаких не ждал.\nБ: Что случится, если сразу не проверить?\nА: У других тоже семьи, кредиты, они же как-то спокойно ужинают.\nБ: Вы уже привыкли успокаиваться этой проверкой.\nА: Получается, я каждый раз лезу в приложение, чтобы отпустило, меня ненадолго отпускает, и я все больше привыкаю: пока счет не проверил, спокойно сидеть за столом не получится?\nБ: Именно.","caption":"Меня задевает, сколько обычных вечеров можно провести с банковским приложением в руке, когда дома вас ждут к столу.\nЯ Михаил, психолог, работаю с мужчинами от тридцати до сорока пяти.\nНапишите «знакомо», если тоже помните остаток, но все равно проверяете."},{"v":"живой","text":"А (критик): Как же я себя ненавижу. Ничего не достигла, сижу на работе и даже сосредоточиться не могу. Какая я жалкая. Все коллеги нормально живут, семьи, улыбаются, а я...\nБ: Так, стоп. О чем мы говорили на сессии? Самокритика.\nА: Ну допустим.\nБ: Критик долбит, чтобы я была продуктивной. Работает?\nА: Нет. Сил вообще нет.\nБ: Хорошее в голове сейчас не найду, это понятно. Тогда просто встану, подышу воздухом пять минут.\nА: Может, поможет.\nБ: Как же сложно.","caption":""},{"v":"zh_h7_staryy","text":"Б: Я считаю, постоянная проверка счета может подкармливать страх безденежья.\nА: Подождите, я нормально зарабатываю, у меня даже отложено. Но постоянно думаю, вдруг денег не хватит.\nБ: Посмотрели. Стало спокойнее?\nА: Да, конечно. Вот сегодня после магазина открыл, посмотрел остаток, вроде нормально. Закрыл. Потом сел обедать и снова полез проверять.\nБ: Значит, спокойствие уже прошло.\nА: А я могу себе позволить и все равно потом проверяю, сколько осталось.\nБ: И каждый раз проверка ненадолго успокаивает.\nА: Там сумма больше, я ее только что видел, и все равно открываю еще раз.\nБ: Так закрепляется привычка успокаиваться проверкой.\nА: То есть я привыкаю каждый раз лезть в приложение? А если перестану смотреть, мне станет еще тревожнее. Буду сидеть над обедом и думать, вдруг я что-то упустил.\nБ: Потому что вы привыкли получать спокойствие именно так.\nА: Поэтому мне снова хочется посмотреть, даже когда я уже знаю остаток и денег хватает.\nБ: Да.","caption":"У банковского приложения удобная особенность: оно всегда под рукой. Даже пока остывает обед.\n\nЯ Михаил, психолог, работаю с мужчинами от тридцати до сорока пяти.\nПодписывайтесь, если хочется еще такого: здесь говорю о тревоге, работе и отношениях."},{"v":"zh3","text":"А: Мне говорят: расслабьтесь, вы нормально зарабатываете. Спасибо, очень помогло. Только вечером опять считаю, хватит ли нам денег.\nБ: Что вы делаете, когда становится страшно?\nА: Открываю приложение банка, смотрю остаток, вычитаю квартиру, продукты, платежи. Потом еще раз, вдруг что забыл. Жена зовет ужинать, я говорю: сейчас, только проверю.\nБ: Посчитали. На расходы хватает?\nА: Хватает, еще остается. Закрываю приложение, иду на кухню, жена уже поела. Мой ужин остыл.\nБ: А потом снова открываете приложение?\nА: Кто будет платить?\nБ: Какую сумму вы хотите увидеть, чтобы успокоиться?\nА: Накопил.\nБ: Когда проверяете, надолго вам становится легче?\nА: Пока не придумаю следующий расход.\nБ: Вы каждый раз ищете уверенность, что денег хватит при любых обстоятельствах.\nА: Получается, я посмотрел остаток, успокоился, придумал новую беду и снова проверяю. Денег столько же. А я уже весь вечер с телефоном вместо ужина.\nБ: Да. Снова проверяете ради короткого облегчения.","caption":"Меня особенно задевает, сколько обычной жизни мужчины пропускают, пока пытаются предусмотреть каждый будущий расход. Даже покупку любимого кофе приходится отдельно себе обосновывать.\n\nЯ Михаил, психолог, работаю со взрослыми мужчинами.\nПодписывайтесь, если хочется еще такого: здесь про тревогу, работу и отношения."}]}];const V=["zh3","zh2","zh_h7_staryy","h3h4_staryy","живой"];const KEY='psycont_compare_2026-10-20_14-30compare-rilsy';
