ание, закрытая дверца дает знакомое задание: постарайтесь еще. Будьте интереснее, терпеливее, удобнее. Тогда откроют.\n\nОн неделю молчит, потом присылает: «Соскучился». И все, блядь, вы опять стучите. Ну вот же, почти получилось!\n\nПоэтому человек, которому вы сразу понравились, может казаться скучным. Там ваше старание вообще никому не понадобилось. Даже обидно.\n\nА здесь хочется ДОКАЗАТЬ, что вас можно выбрать.\n\nМожно потихоньку отойти от дверцы.\n\nВы уже достаточно старались.","caption":"Особенно трудно остановиться после редкого теплого вечера: вы потом еще месяц помните, каким он бывает хорошим. И ждете повторения.\nЯ Ольга, психолог, работаю с девушками и женщинами 22-35 лет.\nПодписывайтесь, если хочется еще таких разговоров про отношения и про себя в них."}]},{"id":"r_zlost_1","topic":"«я вообще никогда не злюсь»","author":"Юлия","format":"reels_monolog","cards":[{"v":"h3h4_staryy","text":"«Я вообще никогда не злюсь», говоришь ты, когда подруга опять отменяет встречу за час.\n\nТы уже собралась. Вечер освободила. Но у нее на работе завал, ну как тут злиться?\n\n«Войди в положение». Входишь. Сразу, даже пальто снять не успела.\n\n«Ты же понимаешь». Понимаешь. У нее сложный день, она устала.\n\n«Ну что ты из-за ерунды». И вот ты уже проверяешь, достаточно ли серьезная причина у тебя расстроиться.\n\nА у него найдутся. Всегда найдутся.\n\nМожно понимать, почему подруга отменила встречу, и злиться, что твой вечер сорвался. Ей даже не обязательно быть плохой, чтобы ты имела право сердиться.","caption":"Иногда после такого вечера хочется отменить уже следующую встречу. А сказать «я тогда разозлилась» все еще кажется ужасно невежливым.\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nОтправь той, которая всегда входит в чужое положение."},{"v":"zh3","text":"Меня сердит, когда женщине говорят: «На маму злиться нельзя, она тебе жизнь дала». Всегда.\n\nВот это требование быть благодарной каждую минуту меня особенно возмущает. Ты можешь помнить, сколько мама для тебя сделала. Можешь помогать ей, любить ее, беспокоиться о ее здоровье. И злиться, когда она опять говорит, что с твоим характером от тебя любой мужчина уйдет.\n\nЕще говорят: «Я же тебе добра желаю». И вроде бы после этого уже неудобно возражать. Только ты слышишь от нее, что неправильно живешь, неправильно выбираешь, неправильно выглядишь, и тебе от этого больно. Добрые намерения мамы ты должна учитывать, а собственную обиду куда девать?\n\nТы уже переживаешь, тебе и без того тяжело, и тут мама добавляет: «Я тебя предупреждала».\n\nА потом еще: «Будешь матерью, поймешь». И что, после этого ты обязана спокойно выслушивать любые замечания?\n\nСказать ей, с чем ты не согласна, закончить неприятный разговор, отказаться обсуждать свою внешность ты тоже можешь. Ты можешь расстроиться из-за ее слов.\n\nТы отвечаешь за то, как обходишься с мамой. Обеспечить ей дочь, которая никогда на нее не злится, ты не обязана.","caption":"Иногда «я никогда не злюсь» уточняется так: «Я боюсь даже представить, что скажу маме о своей злости». Уже за одно несогласие можно услышать, что ты жестокая.\nКакое слово ты обычно слышишь в ответ на свое «нет»? Напиши в комментариях."},{"v":"живой","text":"Иногда вам нужно очень сильно охуеть, чтобы жизнь начала меняться. Охуеть это когда вы просыпаетесь и начинаете видеть реальность, такой, какая она есть на самом деле, и вам становится от этого тошно и противно, потому что вы наконец-то понимаете правду. Это больно, неприятно, но это первый шаг на пути изменения. Охуеть это когда вы начинаете видеть свой вклад в собственное дерьмо, что вы это выбрали, терпели и ничего не делали. Но хорошая новость состоит в том, что если вы когда-то сами это выбрали, вы теперь можете от этого отказаться и выбрать что-то другое, более подходящее вам сейчас. Охуеть это когда вы перестаете надеяться на чудо, что он изменится, деньги упадут с неба, проблемы решатся сами собой. Охуеть это понять, что чуда не будет и что вы то самое чудо, на которое стоит рассчитывать. Охуеть это когда вы выбираете себя, даже если это больно для других. Это не про эгоизм, про то, что вы наконец-то вспомнили про себя и свои потребности.","caption":""},{"v":"zh2","text":"А что, если иногда быть злой нормально?\n\n«Злая» женщина говорит, что устала и сегодня заказывать еду будут все вместе, потому что она тоже только пришла с работы, тоже голодная, и ей тоже хочется сесть, а ей отвечают: «Что ты сразу начинаешь? Мы же просто спросили, что у нас на ужин». И ты уже открываешь холодильник. Хотя ты даже пальто снять не успела. Вот это меня очень задевает: тебя уже поторопили с ужином, а ты еще чувствуешь себя виноватой за то, каким голосом ответила.\n\n«Злая» женщина после ужина просит всех убрать за собой тарелки, потому что она хочет посидеть с остальными, пока они пьют чай, а ей отвечают: «Ну зачем портить вечер из-за такой ерунды?» И вот ты стоишь у раковины, вода шумит, из комнаты доносится смех, и ты моешь, моешь, моешь. Ты ведь добрая. Ты же у нас никогда не злишься. А тебе в этот момент хочется оставить эту кастрюлю, зайти в комнату и спросить, почему вы все отдыхаете, а я до сих пор обслуживаю наш общий вечер.\n\nТы можешь сердиться на людей, которых любишь.","caption":"Бывает, на следующий день ты извиняешься за свой тон. И все еще ждешь, что кто-нибудь вспомнит, о чем ты тогда просила.\n\nЯ Юлия, психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nЕсли знакомо, напиши в комментариях «злюсь»."},{"v":"zh_h7_staryy","text":"Меня раздражает фраза «хорошие дочери на маму не злятся».\n\nНо после этой фразы ты начинаешь спрашивать себя: что со мной не так? Я правда такая неблагодарная? Как мне перестать злиться, чтобы снова быть нормальной дочерью?\n\nЯ с этим не согласна.\n\nЕсть еще прекрасное «будь выше этого». Обычно ты слышишь его как раз тогда, когда уже хочется сказать: со мной так нельзя. И тебе предлагают подняться куда-то повыше, где ты ничего не хочешь, ничего не требуешь, все понимаешь. Ну хорошо, ты понимаешь, что человек устал, переживает, у него тяжелый день. И что, теперь тебе совсем нельзя сердиться на то, как он с тобой разговаривает? Усталость ты поняла. Слова ты тоже услышала.\n\nА потом добавляют: «Ты же добрая, откуда в тебе столько злости?»\n\nТы же добрая, значит, потерпишь. Ты же взрослая, значит, промолчишь. Ты же любишь, значит, опять уступишь.\n\nЕму тоже можно это чувствовать. Дальше вам придется выбирать слова, договариваться, иногда останавливать разговор. Тут есть за что отвечать.\n\nТы отвечаешь за свои слова и поступки: за оскорбление, за угрозу, за то, что ударила. Само чувство злости еще никому не причинило вреда.","caption":"Даже мысленное «как же ты меня достала» иногда кажется себе ужасной грубостью. Хотя вслух ты сказала только: «Сегодня я не приеду».\n\nЯ Юлия, психолог, работаю с женщинами, которые привыкли быть удобными и хорошими.\nСохрани, если трудно признаться себе в злости."}]},{"id":"r_zlost_1_2","topic":"«я вообще никогда не злюсь»","author":"Юлия","format":"reels_poslanie","cards":[{"v":"zh3","text":"Если ты говоришь «я вообще никогда не злюсь», а потом полвечера плачешь из-за отмененной встречи, хорошая моя, у меня к тебе вопрос. Куда ты свою злость дела?\n\nВот ты ждешь ее в гости. Договорились заранее, ты отказалась от других планов, после работы зашла в магазин, приготовила ужин. Она пишет за двадцать минут до встречи: «Слушай, я сегодня дома останусь, вообще сил нет».\n\nИ ты сидишь на кухне. Ужин готов на двоих. Уже отправила сердечко, уже пожелала ей отдохнуть. А самой хочется спросить: ты раньше сказать могла?\n\nМеня в этом месте прямо злит, сколько объяснений тебе приходится самой себе предъявлять, прежде чем признать: мне сейчас обидно, и я злюсь. Даже у себя на кухне, где тебя никто не слышит.\n\nА еще бывает: «Ты же добрая, чего ты злишься?» И ты опять проверяешь себя. Может, правда добрая бы сейчас спокойно убрала вторую тарелку, поела и пошла смотреть сериал? Ну конечно. Еще и контейнер подруге собрала бы, бедная же устала.\n\nДа, на любимых тоже можно злиться.","caption":"Иногда «я вообще никогда не злюсь» произносят с такой гордостью, что мне хочется спросить, сколько всего пришлось молча стерпеть ради этой репутации.\nЯ Юлия, психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nСохрани, если тебе трудно признать свою злость."},{"v":"h3h4_staryy","text":"Если ты говоришь «я вообще никогда не злюсь», а потом полвечера вспоминаешь, как с тобой разговаривали, послушай. Тебе опять отменили встречу в последний момент. Ты написала: «Все нормально». И сидишь, внутри кипит, но уже сама себя уговариваешь. «Ну войди в положение». Вошла. Уже придумала пять причин, почему человек так поступил. «Чего ты из-за ерунды?» И вот ты доказываешь себе, что встреча была важной, вечер ты освободила, вообще-то ждала. «Будь выше этого». Куда еще выше? Ты уже собственную злость услышать не можешь. Тебе можно злиться и на человека, которого ты понимаешь.","caption":"Иногда «я все понимаю» вылетает раньше, чем успеваешь сказать: «Мне жаль, я хотела тебя увидеть».\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nПодписывайся, если хочется еще таких разговоров: здесь про отношения, злость и привычку всем угождать."},{"v":"живой","text":"Это для тех, кто вечером лежит и думает: «я опять ничего не успела». Послушай меня минуту. Ты сегодня встала, хотя не хотелось. Отвела, приготовила, ответила, выслушала, не сорвалась. Или сорвалась, но потом извинилась. Это все делала ты. Просто в твоем списке дел этого нет, потому что ты считаешь только то, что не сделала. Я не буду говорить, что завтра станет легче. Я скажу, что уже сейчас ты делаешь очень много. А устала ты, потому что тащишь это одна и без выходных. Сохрани и включи себе, когда снова будешь лежать и считать.","caption":""},{"v":"zh2","text":"Если ты говоришь «я вообще никогда не злюсь» и очень стараешься никого не обидеть, меня для тебя особенно раздражает совет: «Будь добрее, на близких злиться нельзя». Почему нельзя? Близкий человек может перебить, обмануть, пообещать и забыть. Ты можешь на него злиться и продолжать его любить.\n\nЕще говорят: «Ты же взрослая, могла бы спокойно реагировать». И мне хочется спросить того, кто это произносит: спокойно реагировать на что именно? На грубость? На то, что тебя снова поставили перед фактом? Потому что у нас как будто достаточно заметить, что женщина рассердилась, и все, можно обсуждать только ее тон. Что ей сказали, что сделали, о чем с ней договаривались, уже никто не спрашивает.\n\nЕсть еще мое нелюбимое: «Ты же понимаешь, он не специально». Допустим, понимаешь. Ты ведь можешь понимать человека и все равно сердиться из-за того, что он сделал. Тебе больно, ты потратила время, тебе придется отменять свои планы. Его намерения ты уже учла. А с тем, что случилось с тобой, куда теперь?\n\nТы отвечаешь за то, что делаешь со своей злостью. Чувствовать ее тебе можно.","caption":"Иногда «я никогда не злюсь» соседствует с длинным списком людей, которым больше не хочется звонить. Мне хочется, чтобы об этом тоже можно было говорить.\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть удобными и хорошими.\nСохрани, если снова захочется ругать себя за злость."},{"v":"zh_h7_staryy","text":"Если ты говоришь «я вообще никогда не злюсь», я хочу спросить: а тебе вообще можно злиться?\n\nТы можешь злиться, когда слышишь «ты же добрая», и вдруг получается, что теперь тебе придется согласиться, подвинуть свои планы и еще проследить, чтобы никто рядом не почувствовал себя виноватым. И почему каждый твой отказ опять требует доказательств, что ты хороший человек? Я бы здесь очень внимательно отнеслась к этому «же». В нем уже как будто записано твое согласие.\n\nТы можешь злиться, когда слышишь «ну что ты из-за такой ерунды», и начинаешь сама уменьшать то, что с тобой произошло. Подумаешь, опять попросили помочь. Подумаешь, опять в последний момент. Ты ведь действительно можешь, у тебя свободный вечер. Только ты собиралась провести его дома, поесть, помыть голову и никуда больше не собираться. И вот ты уже стоишь в прихожей, ищешь ключи и объясняешь себе, что отказать было бы как-то некрасиво. А дома остается остывать твой ужин.\n\nЯ считаю, твой вечер тоже считается. Даже если ты собиралась просто лежать.\n\nТы можешь злиться, даже если тобой довольны.","caption":"Иногда слово «нет» уже написано в сообщении, а потом его стирают и отправляют «хорошо». Мне хочется, чтобы между этими двумя сообщениями было чуть больше места.\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть удобными и хорошими.\nПодпишись, если хочется еще таких разговоров: здесь я пишу о злости, отношениях и привычке всем угождать."}]},{"id":"r_humor_1","topic":"когда ты психолог, а подруги приходят «просто поговорить»","author":"Ольга","format":"reels_rol","cards":[{"v":"zh2","text":"Девочки, добро пожаловать на мой мастер-класс «Как сэкономить на терапии, если подруга уже потратилась на образование». Я сама веду, сама рекомендую, отзывы пока собираем с одной стороны.\n\nУ подруги день рождения. Вы приходите с букетом, садитесь поближе, спрашиваете, как она себя чувствует. Пока она отвечает, можно вспомнить, с чего у вас все началось с Игорем.\n\nНачинаете с того, что буквально один вопрос. Почему Игорь прочитал и молчит? Только для понимания ситуации придется показать переписку с августа. Там голосовые, но вы включите на полуторной скорости. Вы же уважаете чужое время, у человека праздник.\n\nЕсли она тянется за салатом, продолжайте. Психологи умеют слушать и жевать, их этому наверняка учат.\n\nВот, она говорит, что по переписке трудно понять, что происходит между вами и Игорем. Какая добросовестная! Поэтому Игоря вы тоже пригласили. Он пока внизу паркуется. Сейчас поднимется, и вы быстренько все обсудите, пока горячее не принесли.\n\nЕсли подруга просит сегодня обойтись без психологических разборов, поддержите. Конечно, дорогая, никаких разборов. Просто скажи, что со мной, почему я так реагирую, что мне ему ответить и как сделать, чтобы он понял. По-дружески.\n\nДа, я слышу возражение из зала: вдруг она обидится? На что, блядь? Вы ей доверяете самое личное.\n\nТорт уже вынесли? Прекрасно. Пока зажигают свечи, успеете спросить про маму. Там коротко, буквально с детства.\n\nВы же пришли к близкому человеку, принесли цветы, доверились. Пусть объяснит, как вам с этим справиться.\n\nСвечи пока не задувайте. У меня еще ОДИН вопрос.","caption":"Мне уже хочется подарить имениннице вечер, в котором ее дослушают до конца. Даже если она рассказывает, как выбирала отель.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nОтправьте подруге, которая тоже работает психологом."},{"v":"zh3","text":"Девочки, добро пожаловать на мой мастер-класс «Как дружить с психологом и экономить».\n\nНачинаем с заботы. Пишем: «Привет, как ты?» И сразу записываем голосовое. Пока она отвечает, как у нее дела, вы как раз успеете рассказать, что у вас произошло. Очень удобно, обе поучаствовали.\n\nВот вчера, допустим, мужчина ответил мне «понятно». Без смайлика. Я отправила подруге скриншот, предыдущую переписку, объяснила, каким голосом он обычно говорит «понятно», и попросила просто глянуть.\n\nЕще я всегда говорю: «Можешь ответить, когда будет время». И через пятнадцать минут отправляю вопросительный знак.\n\nГлавное, не соглашайтесь на ее первое обычное человеческое мнение. Скажет она: «Спроси у него». Ну спасибо, блядь, спросить я и сама могла. Вы попросите профессионально. Какие у него особенности, почему он так написал, что мне ответить, чтобы он все понял, и желательно готовым сообщением, я скопирую.\n\nЕсли подруга заговорила про оплату, спокойно напомните, сколько лет вы знакомы. Вспомните, как помогли ей выбрать платье. Она тогда сорок минут крутилась перед зеркалом, и вы совершенно бесплатно сказали, что синее лучше.\n\nА она вам стоимость консультации. Охуеть, конечно.\n\nИ обязательно добавьте: «Я теперь вообще боюсь тебе что-нибудь рассказывать». Пусть успокоит вас, объяснит, что дружба ей дорога, и предложит, как вам дальше общаться.\n\nА если она скажет, что готова просто пить с вами кофе и разговаривать про отпуск, соглашайтесь. Встречу назначайте заранее, место выбирайте тихое, где вас никто не перебьет.\n\nИ захватите переписку. На большом экране ей удобнее будет.","caption":"Больше всего меня веселит уточнение «буквально одним словом», когда следом присылают переписку за весь август.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого: здесь про отношения, семью и привычку всем быть удобной."},{"v":"h3h4_staryy","text":"Девочки, учимся приходить к подруге психологу «просто поговорить». Сначала спросите, как она. Ответ можно промотать. Теперь голосовое на восемнадцать минут. В конце обязательно: «Ты как специалист что скажешь?» Она устала? Скажите: «Мне даже поговорить с тобой теперь нельзя?» Отлично, чувство вины подключили. Блядь, работает. Она предлагает записаться на консультацию? «Ты что, на мне зарабатывать собралась?» Она отвечает как подруга? «А где твоя профессиональная этика?» Запомнили? Она у нас специалист, когда нужен разбор, и подруга, когда речь про оплату. Так, домашнее задание: написать ей в одиннадцать вечера «Ты спишь?» И сразу следом: «Мне кажется, ты меня ИЗБЕГАЕШЬ. С чем это связано?»","caption":"У фразы «тебе же самой интересно» тоже есть постоянная прописка в таких разговорах. Особенно когда уже открыли переписку с бывшим за последние полгода.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nДобавьте в комментариях свою фразу для этого инструктажа."},{"v":"живой","text":"Здравствуйте, да, да, да, очень, очень приятно, очень. Да, проходите. В каком подходе я работаю? Моя ж ты умничка, все подходы она знает. Щас я скажу, это же все сразу на свои места расставит. Да, в саркастическом. Знаете такое? Не знаете? Странно, очень, очень. Что у вас случилось? Давайте там очень важное что-то явно. Мама, границы нарушают. Вот злодейка, бармалейка какая, что ж с ней делать-то вообще. Ну, не сепарироваться же, правильно? Конечно. Это дураки только сепарироваются. А с ней вот поговорить надо. Конечно, чтобы она что, правильно, другим человеком стала. Это ж чем дальше, тем легче всегда. Чем старше человек, тем просто за секунду он другим человеком становится. Конечно, сколько ей? 68, о, все. Вот она ровно за 68 секунд вы с ней разговариваете и прям наблюдаете трансформацию. Вот все ей скажите, да, что вот она должна, там вот это все. Да, этот разговор вообще, это просто как волшебная палочка работает. Конечно, она вам сразу вот так вот глаза к небу вскинет, скажет Боже. Да твои же границы, это вообще это священный Грааль для меня. Я теперь же ни в жизнь вообще их не переступлю. Да, буду их уважать, буду каждое слово взвешивать вообще. Да, да, да, да, вот разговор так и ну я, слушайте, но я специалист, все-таки, да, дипломированный, вы сами знаете. Конечно, саркастический подход, все, да, да, конечно, конечно научный, а какой еще? Естественно, все, отлично идите, да, идите, разговаривайте, все, все, всего хорошего.","caption":""},{"v":"zh_h7_staryy","text":"Я решила просто с вами поговорить, вы же психолог, вам это легко.\n\nВы только слушайте как подруга, ладно? По дружбе. И потом скажите, какой у него тип привязанности, почему я выбираю таких мужчин и что мне ему ответить.\n\nКороче, вчера я написала ему, что устала, а он ответил: понятно. И все. Вот вы как психолог скажите, что это означает? Он понял? Или он написал, что понял, чтобы я подумала, что он понял? Я уже подруге переслала, она сказала, что он козел. Но у нее никакого образования, поэтому хочется все-таки профессионально услышать, что он козел.\n\nБлядь, я скрин забыла приложить. Сейчас.\n\nОй, а давайте вы ему сами напишете? У вас формулировки спокойные, взрослые. Я создам чат, вы туда зайдете просто как моя подруга. Профессию можно сразу указать, чтобы он нормально себя вел. И его маму добавим, она тоже должна услышать. Вы же семейный психолог, вам даже интереснее будет, вся семья в сборе.\n\nОплата? Господи, я с вами дружу вообще-то. Я вам тоже помогаю. Помните, сказала, что вам эта помада идет? От души сказала. И ссылку на кофточку прислала, вы просили.\n\nСука, теперь я еще и виноватой себя чувствую.\n\nВсе, идите уже спать. Я пока вторую часть наговорю, утром начнете с нее.","caption":"Особенно хорошее дополнение к такому голосовому: «Можете пока слушаете посуду помыть». Забота о вашем свободном времени.\nЯ Ольга, психолог, работаю с девушками и женщинами.\nЕсли знакомо, напишите в комментариях «голосовое»."}]},{"id":"r_humor_1_2","topic":"когда ты психолог, а подруги приходят «просто поговорить»","author":"Ольга","format":"reels_scenka","cards":[{"v":"h3h4_staryy","text":"А: Я к вам ПРОСТО поговорить. Вы же психолог.\nБ: Как подруги поболтаем?\nА: Конечно. Я переписку принесла. Почему я таких выбираю?\nБ: А обо мне спросите?\nА: Да! Вы как психолог что об этом думаете?\nБ: Думаю, я устала.\nА: От клиентов? Тогда отвлекитесь, давайте мой случай разберем.\nБ: Да я охуела.\nА: Вы злитесь? Это у вас контрперенос?\nБ: Это моя кухня.","caption":"Чай остывает, переписка листается. Где-то между «вам еще печеньку?» и «а что он этим хотел сказать?» встреча получила новую профессию.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nЕсли хотите на консультацию, пишите в директ слово «разбор»."},{"v":"zh3","text":"Б: Я тоже хочу поболтать с подругой.\nА: Так я и пришла поболтать! Вот кофе вам взяла, булочку. Сейчас расскажу, что он написал, вы скажете, почему я таких выбираю, и дальше уже нормально посидим. Я даже скриншоты по порядку разложила, чтобы вам удобнее было.\nБ: А булочку когда едим?\nА: Да хоть сейчас, я могу рассказывать, пока вы жуете. Вот тут мне нужно ваше профессиональное мнение. Как подруги, конечно.\nБ: А от подруги что хотите?\nА: Ну, чтобы вы сказали, что он охренел.\nБ: А про мой день спросите?\nА: Конечно! Устали?\nБ: Быстро получится?\nА: Наверное.\nБ: А если я просто посочувствую?\nА: Блядь. То есть я вам даже булочку спокойно съесть не даю? Сижу с кофе и жду, что вы сейчас со мной поработаете?\nБ: Ага.","caption":"Мне нравится, когда подруги рассказывают о своем. Иногда я сама хочу пожаловаться на ерунду и вместе посмеяться, без поиска причин.\n\nЯ Ольга, психолог, работаю с девушками и женщинами.\nНапишите «знакомо», если у вас тоже бывает работа после работы."},{"v":"zh2","text":"Девочки, я подруга психолога, и сегодня я научу вас получать от дружбы максимум.\n\nНачинаете с сообщения: «Ты сейчас можешь просто по дружески поговорить?» Обязательно добавьте «минутку». Минутку человек найдет всегда. А дальше вы уже созвонились, куда она денется.\n\nДопустим, мужчина весь вечер был в сети и вам ничего не написал. Вы уже посмотрели, на кого он подписался, увеличили фотографию женщины с собакой, выяснили, что собака его сестры. Но осадочек остался. Вот с этим и звоните.\n\nПодруга говорит, что ужинает? Прекрасно, пусть ест, вы совершенно спокойно относитесь к звукам посуды. Мы же близкие люди. Можно даже сказать: «Жуй, жуй, я пока расскажу предысторию». Предысторию начинайте с вашего знакомства с этим мужчиной. У подруги как раз суп остынет.\n\nЯ вообще считаю, что нам с такими подругами охуенно повезло. Кто еще сможет по слову «понятно» определить, что именно мужчина имел в виду? Поэтому сразу отправляйте скриншоты. Все. Даже где вы обсуждаете доставку суши. Она специалист, сама найдет важное.\n\nИ вот здесь подруга может вдруг сообщить, что устала и сегодня весь день работала. Спокойно. Скажите: «Господи, со мной можешь расслабиться, я же своя». И продолжайте с того места, где он поставил точку вместо сердечка.\n\nНо я ей потом сердечко отправила.\n\nТак. Мне подруга написала, что ей тяжело от наших разговоров. Сейчас перешлю вам скриншот. Кто-нибудь здесь еще психолог?","caption":"Меня особенно цепляет момент, когда подруга уже третий раз говорит, что хочет спать, и все равно сидит с телефоном. А утром ей прилетает: «Ну что, ты подумала про мою ситуацию?»\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого: здесь про отношения, семью и наши привычки друг с другом."},{"v":"живой","text":"Б: Здравствуйте, давайте знакомиться. Ко мне можно на ты.\nА: Да, хорошо. Давай сразу к делу. Мне тридцать два, и у меня ни разу не было долгих отношений.\nБ: Вижу, мы пропустили знакомство и сразу к делу.\nА: Ну да. Я и с мужчинами так знакомлюсь. Не люблю эти «расскажи о себе».\nБ: Как будто боитесь потерять время.\nА: Конечно. Зачем тратить, если не подходим?\nБ: А что вы теряете, когда пропускаете знакомство?\nА: Ну... романтику какую-то. Может, возможность узнать друг друга.\nБ: А вы хотели бы, чтобы вас узнали получше?\nА: Да не особо.\nБ: А что так?\nА: Ну... вдруг я такая не понравлюсь.","caption":""},{"v":"zh_h7_staryy","text":"Б: Я считаю, психологу можно просто сплетничать с подругой.\nА: Подождите, она рассказывает, что опять поругалась с парнем, и я должна просто сидеть? Я уже спросила, что она чувствует, где это в теле, как у них в семье обходились со злостью. Она пока только сняла пальто.\nБ: А зачем вы спросили?\nА: Картошка ведь тоже бывает навязанной.\nБ: Она просила разобраться?\nА: Сижу с кетчупом и важной информацией.\nБ: Можно оставить вопросы при себе.\nА: А я иногда хочу сказать: блять, он опять? И предложить десерт.\nБ: Вы сейчас с подругой?\nА: Да. Мы весь вечер обсуждали ее парня, потом мою кофту, потом официанта. И никто ничего не осознал. Даже официант. Просто принес счет и ушел.\nБ: А вам было хорошо?\nА: Вообще да. Мы смеялись, она доела мою картошку, я пожаловалась на доставку. Получается, можно оставить вопрос про отношения с мамой до того момента, когда мама действительно позвонит?\nБ: Да.","caption":"Увидела совет задавать близким побольше терапевтических вопросов. Я бы после третьего уже попросила передать соль и сменить тему.\n\nЯ Ольга, психолог, работаю с девушками и женщинами.\nЕсли хотите на консультацию, пишите в директ слово «разбор»."}]},{"id":"r_malysh_1","topic":"почему так страшно сказать «нет»","author":"Ольга","format":"reels_malysh","cards":[{"v":"h3h4_staryy","text":"Вам страшно сказать «нет», хорошие мои, аж животик сжимается?\n\nВнутри у вас колокольчик. Только кто-то недоволен, он звенит: «СРОЧНО сделайте человеку хорошо!»\n\nВы привыкли отвечать за чужое настроение. Кто-то расстроился, вам надо что-то сделать, чтобы он снова был довольный. Тогда колокольчик замолкает.\n\nВот подруга просит приехать. Вы уже в пижамке, сил нет. Говорите: «Сегодня не смогу». Она: «Ну понятно».\n\nДзынь. Блядь, уже снимаем пижамку.\n\nМожно дать колокольчику позвенеть. Пусть подруга побудет недовольной вашим ответом.\n\nЕе недовольство не обязывает вас соглашаться.","caption":"Иногда после отказа вы отправляете еще пять сообщений с объяснениями, хотя вас уже ни о чем не спрашивают. И ждете заветное «да все нормально», чтобы наконец выдохнуть.\nЯ Ольга, психолог для женщин, которые устали быть удобными.\nОтправьте той, которая даже отказ старается сделать приятным."},{"v":"живой","text":"У нашего мозга есть две приколюхи. Первое это умение создавать нейронные связи и формировать привычки, а второе это то, что он одинаково реагирует как на фантазию, так и на реальность. Именно поэтому у нас до сих пор существует мастурбация. И вот когда вы начинаете фантазировать не о цели, не о розовой машине, не о бизнесе, а о том, как вы его создаете, вы начинаете формировать нейронные связи, чтобы пойти и делать. То есть если вы какое-то время будете думать о том, как этого достичь, то в какой-то момент вы просто встанете и пойдете делать, потому что в вашем мозгу сформируются нейронные связи на действие. А если вы будете фантазировать о цели, то ваш мозг будет думать, что вы ее достигли. Вы о ней подумали, вы о ней пофантазировали, вы получили удовольствие от этой фантазии и достигать ничего не нужно.","caption":""},{"v":"zh2","text":"Хорошая моя, вы сейчас ролик смотрите и одновременно придумываете, как бы отказать человеку, чтобы он ни капельки не расстроился?\n\nЯ сегодня опять увидела совет: просто научитесь говорить «нет». И меня прямо бесит это «просто».\n\nСестра пишет: забери меня завтра из аэропорта. Прилет в семь утра, значит, вам вставать в пять, а вы всю неделю ждали субботы, чтобы наконец поспать. Уже купили что к завтраку, чистую пижаму приготовили. Такой у вас был грандиозный план. Поспать и спокойно поесть.\n\nВы начинаете писать, что завтра не сможете. И тут внутри звоночек: сейчас она обидится. Напишет сухое «понятно». Потом маме расскажет, что на вас рассчитывать нельзя. И вот вы уже представляете следующий семейный ужин, где все разговаривают, а с вами как будто чуть холоднее.\n\nСестра пока вообще ничего такого не сказала. Она билет переслала и пошла чемодан собирать. А вы уже успели с ней поссориться у себя в голове, почувствовать себя виноватой, придумать оправдание и стереть свой ответ.\n\nИ пишете: конечно, встречу.\n\nПотом сидите злая. На нее, потому что могла бы такси взять. На себя, потому что опять согласились. И еще ругаете себя за злость: ну сестра же, что вам, трудно? Блядь, трудно. Вставать в пять трудно. Особенно когда вы этого совсем не хотели.\n\nРот уже умеет говорить «нет». Вы пока боитесь, что после этого вас перестанут любить.","caption":"Меня особенно цепляет, когда человек еще и извиняется за то, что долго отвечал: все это время он подбирал максимально безобидный отказ.\nЯ Ольга, психолог, работаю с женщинами, которым трудно перестать быть удобными.\nЕсли узнали себя, напишите в комментариях «знакомо»."},{"v":"zh3","text":"Страшно, мои хорошие, сказать маме «я сегодня не приеду», хотя вы уже взрослая, сами платите за квартиру и можете вообще целую курицу приготовить, а тут смотрите на телефон и никак не решаетесь ответить.\n\nСтрашно, и вот вы стоите на кухне в субботу, только налили себе кофе, собирались весь день провести дома, потому что за неделю устали так, что даже разговаривать ни с кем не хочется. Мама звонит и спрашивает, во сколько вас завтра ждать. Именно во сколько. Вы ведь обычно приезжаете, помогаете, остаетесь поесть, потом еще сидите, потому что она просит побыть подольше. И вы уже открываете рот, чтобы сказать «часам к двенадцати».\n\nИ кофе уже остывает, и выходной вы уже мысленно отменили, хотя еще ничего ей не ответили. Вот тут мне очень жалко вас. Вы даже свое желание побыть дома успеваете обсудить с собой так, будто совершили что-то ужасное.\n\nСтрашно, потому что одним своим «да» вы можете быстро все поправить. Мама снова заговорит обычным голосом, спросит, что приготовить, и вы почувствуете облегчение. Блядь, как же хочется этого облегчения. Даже если завтра придется встать по будильнику и поехать, а вечером злиться на себя, что опять согласились. Зато сейчас мама с вами ласковая.\n\nСтрашно проверить, будет ли мама любить вас после вашего «нет».","caption":"Меня злит совет «просто откажите»: потом вы еще полвечера сочиняете сообщение, чтобы мама точно не обиделась.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли всем угождать.\nСохраните, если перед отказом долго подбираете слова."},{"v":"zh_h7_staryy","text":"Милые, я называю этот страх сказать нет переполохом: вы еще никому не отказали, а уже страшно, что на вас рассердятся и перестанут любить.\n\nСтрашно сказать нет, когда в пятницу приходит сообщение с просьбой выйти в выходной, и вы смотрите на него, и вам хочется положить телефон, потому что вы уже представляли, как завтра выспитесь и спокойно позавтракаете, и тут колокольчик начинает: сейчас обидятся, сейчас подумают, что вы всех подвели, сейчас будут разговаривать с вами другим голосом. И вы печатаете: да, конечно. Блядь. Уже отправили. И сидите, смотрите на это свое «конечно», хотя никакого конечно у вас внутри вообще не было.\n\nСтрашно сказать нет, когда вы признаете, что ваше «да» часто появляется именно в этот момент: стало тревожно, согласились, чуть отпустило. Колокольчик замолчал. Все довольны. Можно пока выдохнуть.\n\nЧтобы отказать и получить подтверждение: с вами все еще хотят общаться, вас все еще ценят, вы все еще хорошая.\n\nСтрашно сказать нет, когда вы соглашаетесь ради этого подтверждения, и ваш выходной снова занят, и колокольчик тихий, и вы опять остались без того, чего хотели.\n\nСтрашно сказать нет, когда вы ждете потери близости.","caption":"Иногда самое трудное начинается после отказа, когда сообщение уже прочитали и долго ничего не отвечают. И очень хочется дописать: «Ладно, я смогу».\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nСохраните, если хочется вернуться к этому разговору."}]},{"id":"r_malysh_1_2","topic":"почему так страшно сказать «нет»","author":"Ольга","format":"reels_malysh","cards":[{"v":"h3h4_staryy","text":"Милая, вам страшно сказать «нет», потому что вдруг с вами перестанут дружить?\n\nПредставьте стульчик за общим столом. Если раньше вас принимали, пока вы соглашались, вы привыкли: чтобы стульчик оставался вашим, надо говорить «да». Возражаете? Ой, сейчас заберут.\n\nИ вот подруга просит помочь с переездом в субботу. А вы хотели полежать. Просто полежать, девочки, ножки вытянуть. Но уже отвечаете: «Конечно, приеду». Блядь, опять без выходного.\n\nМожно оставить себе стульчик, даже когда подруга недовольна. Сказать: «В субботу я не смогу». И остаться сидеть.","caption":"Десять причин отказа дают собеседнику десять возможностей предложить, как вам все-таки согласиться.\nЯ Ольга, психолог, работаю с женщинами, которые устали быть удобными.\nПодписывайтесь, если хочется еще такого: здесь говорим об отношениях, в которых вашим желаниям тоже есть место."},{"v":"zh_h7_staryy","text":"Зайка, я сейчас сижу с чаем, только что увидела совет «просто научитесь отказывать» и хочу очень бережно спросить: вы серьезно? Просто скажите, просто выдержите паузу, просто перестаньте всем нравиться, просто станьте другим человеком к четвергу, желательно до обеда.\n\nБлядь, как у вас все просто.\n\nИ я тоже умею написать отказ, перечитать, добавить объяснение, потом еще одно. Психолог сидит, чай остывает, объяснения растут.\n\nСмотрите, как это бывает. Подруга пишет: помогите мне сегодня с одной штукой, вы же быстро разберетесь. А у вас своя работа до вечера, потом вы собирались наконец поесть и лечь. Вы уже понимаете, что сил нет. И пальцы начинают печатать: да, конечно.\n\nЕще до того, как вы решили согласиться.\n\nВы отправили «конечно», подруга прислала сердечко, все, она довольна, отношения вроде целы. Можно выдохнуть.\n\nНа несколько минут.\n\nПотом вы смотрите на свою работу, на время, на это обещание помочь и понимаете, сколько всего теперь придется впихнуть в вечер. Свои силы вы посчитаете позже.\n\nВы пытаетесь заранее объяснить все так хорошо, чтобы человеку было совсем невозможно обидеться.\n\nЯ тоже иногда пишу отказ с пояснительной запиской.","caption":"Иногда самое долгое в отказе происходит уже после отправки: телефон лежит рядом, и вы ждете, каким тоном вам ответят. Даже обычное «ок» в этот момент хочется расшифровать.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nПодписывайтесь, если хочется еще такого: здесь говорю про отношения, границы и страх кого-нибудь расстроить."},{"v":"zh2","text":"Страшно, хорошая моя, сказать, что вы в субботу не можете посидеть с чужим ребенком, хотя вы правда не можете, вы всю неделю ждали выходного, чтобы проснуться без будильника, спокойно позавтракать и чтобы хотя бы до обеда никто ничего у вас не просил. И вот вы уже пишете, во сколько его привезут. А сами смотрите на эту переписку и чуть не плачете.\n\nСтрашно признаться себе, что вы согласились, потому что очень хотели поскорее получить в ответ: «Спасибо, ты меня так выручила». Получили, выдохнули. Человек доволен, все хорошо, вы по-прежнему нужны. А потом, блядь, вспомнили про свою субботу. И разозлились на человека, который попросил, хотя он пока даже не знает, что вы собирались отказать.\n\nСтрашно еще и потому, что вы надеетесь: сейчас он сам догадается. Вы напишете, что неделя была тяжелая, что вы совсем вымотались, и он скажет: «Господи, конечно, отдыхай». Сколько сил уходит на то, чтобы осторожно рассказать о своей усталости и дождаться, когда другой человек сам разрешит вам остаться дома. А он отвечает: «Да он спокойный, вы вместе мультики посмотрите».\n\nСтрашно сказать «нет» и узнать, останутся ли с вами.","caption":"Особенно тяжело, когда свободный вечер приходится оправдывать занятостью. Сказать «я иду к врачу» бывает проще, чем «я хочу побыть дома».\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nСохраните, если трудно отказывать."},{"v":"zh3","text":"Хорошая моя, вы опять сказали «да», а теперь хочется плакать? Я вот сейчас сижу с телефоном, прочитала совет: «Просто научитесь отказывать». И сижу, возмущаюсь. Просто скажите, просто перестаньте бояться, просто спокойно выдержите, когда подруга обидится, перестанет вам писать и еще общим знакомым расскажет, какая вы эгоистка. Ну да, блядь. Делов на минуту.\n\nА потом подруга просит помочь с переездом в субботу.\n\nВы всю неделю ждали выходного. Хотели проснуться без будильника и хотя бы позавтракать сидя. Подруга пишет: «Слушай, выручишь? Там немного вещей».\n\nИ вы смотрите на сообщение, уже понимаете, что придется встать рано, ехать через весь город, таскать коробки, а потом еще вечером доделывать свое. Вам совсем туда не хочется.\n\nНо вы печатаете: «Да, конечно».\n\nВот вы еще на кухне, даже чай не допили, а уже оправдываетесь перед подругой, которая пока ничего такого не сказала.\n\nИ меня ужасно злит это «просто откажите». Я сама сейчас разошлась, хотя собиралась объяснить ласково.\n\nВы боитесь, что после отказа она больше не позвонит.","caption":"Иногда после вашего «не смогу» подруга отвечает: «Хорошо, спрошу еще у кого-нибудь». А вы уже успели придумать объяснение на полстраницы.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nПодписывайтесь, если хочется еще таких разговоров о границах, близости и вечном желании всем угодить."},{"v":"живой","text":"Папа не замечал меня, и поэтому я выбрала быть бедной. Да, конечно, никто так не формулирует, но бессознательный сценарий зачастую звучит именно так. И это наша первая из 10 видео в серии разговоров о деньгах и заработках. Иногда наша неспособность зарабатывать это не столько страх денег, сколько жизнь в стиле послания. Посмотрите, что вы со мной наделали. Вы мне причинили столько боли, что теперь я вот шатаюсь такой по миру и не могу заработать себе на жизнь, не могу найти работу. Глубокая вера в собственную никчемность это одна из причин почему отношения с деньгами как-то не складываются. Вот представьте, что ребенку довольно долго транслировали, что ты какая-то вот всем неудобная, тебя много. Такой человек вырастает без ощущения внутреннего права, что он может быть видимым, что он может занимать место, просить, говорить вслух о том, сколько стоят его услуги. Ему вообще как будто бы хронически нельзя иметь потребности. И если психика сформирована вокруг ощущения, что я это пустое место, то представьте вот каково вообще тут выдерживать любое движение в сторону денег, где нужно быть видимым, четким, последовательным. Есть еще и другой мотив, например, месть. Человек как будто бы все время показывает родителям последствия их отношения к нему. Посмотрите как вы меня поломали, не нравится? Вот живите с этим. В каком-то смысле можно сказать, что зарабатывание денег это такая взрослая игра. Если идти в эту игру у вас как-то слишком много сопротивления, то здесь можно вообще поисследовать. Чему конкретно я там сопротивляюсь? И вообще ради чего я продолжаю проигрывать. И если бы мой способ жить, это было некое послание, то кто должен это послание получить? Ты моя соведущая или нет? Если соведущая, то не кусай меня.","caption":""}]},{"id":"r_malysh_2","topic":"обида на маму, которую стыдно признать","author":"Юлия","format":"reels_malysh","cards":[{"v":"живой","text":"Когда люди говорят, что им не нужен психолог, они чаще всего добавляют «я и так про себя и про других, все знаю и понимаю». Часто бываешь на приеме у психолога? Один раз была в жизни, больше никогда не пойду. А я и так все знаю про себя. Ну то есть я осознаю, девушка, что тогда была ты проработанная. Да, проработанная, я все прекрасно понимала. Но терапия ведь никогда не была про знания и понимания. Точнее, это всегда было лишь верхушкой айсберга. Вы можете в Google вбить свой запрос, и он вот столько подберет вам книг. И как стать богаче, и как построить отношения, и стать уверенней. Люди ходят к чату GPT. Опишите ему свою проблему, он вам столько знаний и понимания даст, что вы даже все не унесете. Поменяется ли что-то от этого в вашей жизни? Потому что проблема никогда не была в незнании уж точно не у современного человека. Проблема в том, что мы не умеем чувствовать. У нас нет контакта с собой через чувство. Мы боимся людей, потому что в этом чувственном контакте много уязвимости и боли. Мы боимся контакта с миром. Интеллектуализация, кстати, книги, знания, чат GPT. Это защитная функция психики. А пока вы в привычных защитах, вы не построите в своей жизни ничего нового. На уровне головы может быть, но не в реальности. Мы обкладываемся этими знаниями, но меняется ли что-то на самом деле, кроме того, что мы теперь все знаем. Кто мы по типу личности, кто есть абьюзер, у кого какой тип привязанности и прочее. Отсюда вот сюда не провалилось. И от книг и знаний, и от бесконечной рефлексии не провалится. Терапия это про живой контакт. Уязвимый контакт, да. Но именно в этом живом контакте рождается что-то новое. Именно этот живой контакт исцеляет. А пока вы ищете новые знания, вы так и будете продолжать говорить, я головой все понимаю, но в жизни почему-то ничего не меняется. А оно и не поменяется. Приходите в терапию. Запись по ссылке в шапке профиля.","caption":""},{"v":"zh2","text":"Ну что, маленькая моя, мамина взрослая умница. На маму обиделась, а теперь еще и себя ругаешь?\n\nСмеешь, представляешь.\n\nВот ты приезжаешь к ней в воскресенье. По дороге покупаешь ее любимое печенье, потому что у тебя хорошая новость, тебя повысили, хочется вместе попить чаю и рассказать.\n\nРассказываешь. А мама спрашивает, кто теперь будет заниматься ребенком, если ты собираешься еще больше работать.\n\nИ ты уже объясняешь, что график останется прежним, что муж тоже умеет забирать из сада, что ты все продумала. Чай остывает. Про повышение ты больше ничего не рассказываешь.\n\nА потом мама складывает тебе с собой котлеты, ищет крышку для контейнера, говорит, чтобы ты осторожнее ехала. И тут ты сама себя начинаешь отчитывать. Вот же, заботится. А я сижу тут со своей дурацкой обидой.\n\nЯ опять увидела совет взрослым дочерям: вспоминайте, сколько мама для вас сделала. И я злюсь, потому что ты и так помнишь.\n\nОй, да ты уже целое министерство маминого понимания.\n\nИ верю, что тебе больно.","caption":"Иногда после разговора с мамой дочь еще пишет ей: «Доехала, спасибо за еду ❤️». А потом долго сидит в машине у дома. Я каждый раз думаю, как много мы можем чувствовать одновременно.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми.\nПодписывайся, если хочется еще таких разговоров. Здесь я пишу про мам, обиды и свою взрослую жизнь."},{"v":"zh3","text":"Девочки, мои хорошие, кто опять обиделся на маму и теперь ругает себя за то, что обиделся? Ты?\n\nВот ты ей звонишь. Тебя повысили. Ты ждала этого разговора с начальницей, переживала, согласуют ли, и теперь хочется рассказать маме. Даже улыбаешься, пока идут гудки.\n\nМама слушает и говорит: «Ну наконец-то. В твоем возрасте уже давно пора».\n\nИ ты замолкаешь. Потому что еще минуту назад радовалась, а сейчас чувствуешь себя какой-то отставшей, которую наконец согласились взять.\n\nМама спрашивает: «Что ты молчишь?» Ты отвечаешь: «Мам, мне обидно». И слышишь: «Господи, тебе слова нельзя сказать».\n\nВсе. Дальше ты объясняешь, что нормально к ней относишься, что понимаешь, она хотела как лучше, что ты благодарна. До новой должности вы уже толком и не договорили.\n\nДа уж. Повышение получила, начальнице ответила, документы подписала, домой продукты донесла. ВЗРОСЛАЯ. А после разговора с мамой сидишь на кухне и оправдываешься перед ней уже мысленно. Еще много, много, много раз.\n\nИ все равно хотеть, чтобы в тот вечер она сказала тебе что-нибудь теплое.\n\nТебе больно, когда мама тебя обесценивает.","caption":"Мне грустно, когда взрослые дочери начинают говорить о своей обиде с длинного объяснения, какая мама хорошая. Будто без этого я сразу подумаю о них что-то плохое. Со мной можно говорить о маме и без вступления в ее защиту."},{"v":"h3h4_staryy","text":"Милая, тебе обидно на маму, и ты себя за это ругаешь. Она столько для тебя сделала. Как же ты теперь на нее обижаешься, да?\n\nПредставь, что у тебя в пальчике заноза. Ты говоришь: «Ой, больно». А мама отвечает: «Я тебе эти варежки всю ночь вязала». И ты уже прячешь пальчик. Варежки хорошие. Мама старалась.\n\nВот и с обидой так. Вспоминаешь мамины старания и сразу замолкаешь. Даже внутри себя. Как будто сначала надо доказать, что мама совсем ничего хорошего тебе не дала. Тогда разрешат сказать, что больно.\n\nТы имеешь право обижаться на маму.","caption":"Иногда после маминого звонка хочется плакать, хотя весь разговор ты отвечала: «Да, мам, все хорошо». Признаться себе в этом бывает труднее, чем рассказать подруге.\nЯ Юлия, психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли хочется, напиши в комментариях одно слово: «обидно»."},{"v":"zh_h7_staryy","text":"Хорошие мои, кто опять обиделся на маму и теперь сам себя за это ругает? Я к вам. К тем, кто даже обижаться старается прилично, чтобы мама случайно ничего не заметила.\n\nСтыдно? Конечно.\n\nХорошие.\n\nИногда мама еще ничего не сказала, а ты уже сама себе все высказала. Очень удобно, конечно. Даже звонить никому не надо.\n\nВот обычный разговор. Ты рассказываешь маме, что купила платье. Просто захотелось поделиться. А она спрашивает, куда тебе столько платьев, лучше бы деньги отложила. И ты уже объясняешь, что была скидка, что давно ничего себе не покупала, что вообще имеешь право.\n\nПотом кладешь телефон и думаешь: ну чего я завелась? Она же волнуется за меня. Из-за платья обижаться, совсем уже.\n\nЯ считаю, мы слишком быстро требуем от взрослой дочери понимания. Мама устала, мама переживает, мама иначе не умеет. Все про маму уже объяснили. А дочь еще даже не успела сказать, что ей было неприятно.\n\nТы.\n\nНо ты уже сколько раз выслушала, объяснила, поняла, еще раз объяснила и потом сама себя отругала! Господи, у маминого «я же добра тебе желаю» уже есть штатный переводчик. Ты.\n\nЯ поняла.\n\nТебе было больно.","caption":"Иногда после разговора с мамой хочется удалить собственное сообщение, хотя там всего лишь написано: «Мне это неприятно». Я бы оставила этой фразе место в переписке.\n\nЯ Юлия, психолог, работаю со взрослыми дочерьми от 25 до 40.\nЕсли хочется, напиши в комментариях одно слово: «знакомо»."}]},{"id":"r_malysh_2_2","topic":"обида на маму, которую стыдно признать","author":"Юлия","format":"reels_malysh","cards":[{"v":"zh3","text":"Моя хорошая, тебе на маму обидно, а ты уже себя за это отругала?\n\nВот ты звонишь рассказать, что тебя повысили. Ты еще до звонка улыбаешься, думаешь, как скажешь, с чего начнешь. Мама спрашивает, сколько теперь будут платить, ты отвечаешь, и она говорит: «Ну смотри, лишь бы со здоровьем потом не началось. Ты и так вечно уставшая».\n\nИ ты уже объясняешь, что справишься, что там нормальный график, что ты все обдумала. Повышение свое защищаешь. Перед мамой. Хотя позвонила порадоваться вместе.\n\nМеня очень трогает, как быстро ты находишь для мамы доброе объяснение. Даже с мокрыми глазами продолжаешь: она хотела как лучше.\n\nТы уже вынесла переезды с пакетами, собеседования, ремонт у соседей, рабочие созвоны с температурой, мамино «я только спросила» после получасового разговора. Господи, ты даже разобралась, куда у нее пропал звук в телефоне. Снова.\n\nИ все равно после звонка сидишь на кухне, а подруге про повышение пока не пишешь. Уже кажется, что радоваться особенно нечему. Хотя час назад тебе очень хотелось рассказать.\n\nИ позвонила самому близкому человеку, чтобы он побыл рядом с тобой в этой радости.\n\nТы ждала, что мама порадуется.","caption":"Иногда маме рассказывают хорошую новость только через неделю, когда уже отпраздновали с теми, кто обрадуется. А потом еще переживают, что рассказали ей последней.\nЕсли хочется, напиши в комментариях, каких слов тебе от мамы не хватает."},{"v":"h3h4_staryy","text":"Милая, ты обижаешься на маму и сразу себя ругаешь: «Она столько для меня сделала, как я могу?»\n\nСмотри, у тебя в пальчике заноза. Ты говоришь: «Больно». А тебе отвечают: «Мама устала. Маме тоже тяжело». И ты такая: ой, тогда ладно. Только заноза осталась.\n\nТы выросла и теперь сама себе объясняешь, почему мама тогда так поступила. Она была одна. Она много работала. Она переживала. И ждешь, что теперь обида пройдет.\n\nНо той маленькой тебе тоже было больно. Она еще ничего про мамины трудности не знала. Она ждала, что мама пожалеет.\n\nМожно пожалеть ее сейчас. Без этого твоего «сама виновата».\n\nТы можешь понимать маму и все еще обижаться на нее.","caption":"Иногда даже мысленно сказать «мама меня обидела» страшно, будто она услышит. И ты снова подбираешь слова помягче.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли хочется поговорить об этом, ссылка на запись на консультацию в шапке профиля."},{"v":"zh_h7_staryy","text":"Милая, я вот думаю: что, если быть обидчивой дочерью нормально, когда мамины слова делают тебе больно?\n\nОбидчивая дочь это та, которая просит маму поберечь ее, когда за столом мама рассказывает всем, как она опять поправилась, опять без мужчины, опять что-то у нее в жизни не так, и слышит: «Ой, ну что ты такая нежная, слова тебе сказать нельзя». И ты сидишь, улыбаешься, потому что гости, потому что праздник, потому что сейчас еще придется объяснять всем, почему у тебя такое лицо. А внутри больно.\n\nОбидчивая дочь это та, которая после такого разговора выходит на кухню, чтобы хоть немного побыть одной, и слышит: «Ну вот, теперь еще и праздник всем испортила». Я тут каждый раз думаю про эту улыбку за столом. А ты просто хотела прийти к маме, поесть, поговорить.\n\nОбидчивая дочь это та, которая потом все-таки говорит маме, что ей было обидно, и слышит: «Я тебя растила, ночей не спала, а ты мне теперь претензии предъявляешь». Неблагодарная.\n\nРазве обида делает тебя плохой дочерью? Разве тебе нельзя быть задетой?","caption":"Иногда после такого разговора ты еще отправляешь маме сердечко. Я бы не спешила считать это знаком, что обида прошла.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"живой","text":"То есть, либо я хорошо сдаю экзамены, либо в Агаповке остаюсь до конца жизни. Абсолютно точно. Ты помнишь, что тебе мама сказала? Почему у других получается? Ты не можешь. Вот. Это же легко взять просто и все на соточку сдать. Или ты тупой. Нет, мне просто хочется, чтобы они гордились. А когда мама тебе в 5 лет сказала, что ты молодец, тебе что, не хватило? Если редко говорит, значит, не заслуживаешь. Короче, запоминай. Если ошибешься, будешь на всю жизнь заклеймен неудачником. Ясно.","caption":""},{"v":"zh2","text":"Моя хорошая, ты опять от мамы приехала и плачешь? А потом еще ругаешь себя, потому что мама тебе контейнер с котлетами положила, а ты, неблагодарная такая, сидишь и обижаешься.\n\nВот ты приехала к ней в гости. Хотела просто чаю попить, рассказать, что на работе происходит. Даже пирог купила, который она любит. Села, куртку еще толком снять не успела, и мама говорит: ты опять поправилась? Ты отвечаешь, что тебе неприятно. А она удивляется: ну что ты такая обидчивая, я же любя.\n\nИ все. Про работу ты уже рассказывать не хочешь. Сидишь, чай мешаешь, ждешь, когда можно будет собираться, чтобы мама снова не расстроилась, что ты так быстро уходишь.\n\nЗнаешь, меня очень задевает, когда дочери приходится еще и доказывать, что ей достаточно больно, чтобы обижаться.\n\nДевочки, вы уже столько раз выдержали и обидное замечание, и мамины слезы, и собственные извинения, что я бы вам после таких чаепитий котлеты выдавала вместе с отпуском.\n\nТебе незачем отказываться от хороших воспоминаний, чтобы признать сегодняшний вечер тяжелым.\n\nТы можешь обижаться на маму.","caption":"Иногда дочь уже дома пишет маме: «Спасибо за котлеты». А мужу говорит, что просто устала, потому что пересказывать разговор опять больно.\nЯ Юлия, психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли знакомо, можешь написать в комментариях «обидно»."}]},{"id":"r_drug_1","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","author":"Михаил","format":"reels_monolog","cards":[{"v":"zh_h7_staryy","text":"Вы сейчас увидели тему и уже оправдываете друга?\n\nКогда этот человек появляется, он спрашивает, как вы?\n\nПодождите.\n\nТак.\n\nВот вечером приходит голосовое. Вы видите имя и еще до прослушивания думаете: понятно, что-то случилось. Потому что, когда у него все спокойно, в вашем чате тоже спокойно. Очень спокойно. Последнее сообщение ваше, еще с прошлого месяца.\n\nВы слушаете. Там опять тяжелый разговор, опять кто-то обидел, опять надо решить, что ответить. Вы ставите чайник, потом забываете про чай, записываете ответ, стираете, записываете покороче.\n\nПотом вы говорите, что у вас тоже день так себе. И тут разговор как-то заканчивается. Он устал, ему завтра рано, он потом спросит подробнее.\n\nА через какое-то время видите фотографии: компания, поездка, довольное лицо. И одновременно вам неприятно.\n\nЯ считаю, вы слишком быстро перескакиваете к этому пункту. В том самом разговоре ваша фраза про тяжелый день так и осталась без ответа.\n\nВернусь.\n\nПредлагаю на секунду представить ваш чат с вывеской: «Прием жалоб. Чайник включен». Вы ведь отвечаете.\n\nСмешно получилось?\n\nЛадно, я пойду. А вы как?","caption":"Самое неловкое бывает, когда человек благодарит за поддержку, а вы уже жалеете, что открыли сообщение. И даже себе стыдно в этом признаться.\nЯ Михаил, психолог, работаю с людьми от двадцати пяти до сорока.\nСохраните, если хочется вернуться к этому вопросу."},{"v":"zh2","text":"Четыре признака, что друг вспоминает о вас только тогда, когда ему плохо.\n\nПервое: вы заранее знаете, с чем он звонит. Увидели имя на экране и уже думаете: поссорились, уволили, опять кто-то подвел. Потом он мирится, находит работу, выдыхает. И на ваше сообщение про встречу отвечает через неделю.\n\nВторое: о хорошем в его жизни вы узнаете вместе со всеми. Из фотографий. И меня здесь злит совет просто порадоваться за человека.\n\nТретье: вы сокращаете собственные новости. Он позвонил после расставания, и как тут рассказывать, что вам предложили работу, о которой вы мечтали? Оставляете на потом.\n\nЧетвертое: вы ловите себя на том, что ждете его неприятностей. Но когда он пишет, что опять разошлись, вы вместе с тревогой чувствуете облегчение: теперь снова будете разговаривать каждый день. И вам стыдно за это облегчение, поэтому вы молчите о нем даже с другими близкими.\n\nЕсли у него завтра все наладится, вы снова останетесь без друга?","caption":"Меня настораживает, когда человек уже извиняется за обычное приглашение: «Понимаю, у тебя сейчас все хорошо, но, может, увидимся?»\nЯ Михаил, психолог, работаю с людьми от двадцати пяти до сорока.\nСохраните, если вам знакомо такое ожидание."},{"v":"h3h4_staryy","text":"«Когда у друга все хорошо, он пропадает. Как что случилось, сразу пишет мне».\n\nВот вечером прилетает голосовое: «Мы расстались». Вы сорок минут слушаете, потом еще спрашиваете, как он спал. Через неделю они помирились. Вы зовете его выпить кофе. «Да, надо как-нибудь». И тишина до следующей ссоры.\n\nОбидно еще и потому, что вчера вы чувствовали себя очень близкими. Он столько вам рассказал. Но откровенность легко принять за близость: вы знаете все, что у человека болит, и почти ничего о том, чем он живет, когда ему хорошо.\n\nИ вот вопрос: если у него все наладится, останется ли вам место в его жизни?","caption":"Иногда даже о примирении узнаешь из сторис. Хотя весь вечер после ссоры провели вместе в переписке.\nЯ Михаил, психолог, работаю с людьми от 25 до 40 лет.\nСохраните, если хочется вернуться к этому вопросу."},{"v":"zh3","text":"«Кажется, мы дружим, только когда у нее все плохо».\n\nВот вечером приходит голосовое. Она плачет, они опять поссорились, она не понимает, что делать. Вы уже собирались спать, но садитесь на кухне, включаете сообщение потише, отвечаете. Потом еще одно слушаете. Даже утром первым делом спрашиваете, как она.\n\nЧерез несколько дней они мирятся. Вы узнаете об этом из фотографии в сторис. Пишете, что рады за нее, заодно предлагаете встретиться в выходные. Она ставит сердечко. Про выходные ничего не отвечает.\n\nЯ, кстати, иногда начинаю искать сложные объяснения, а все оказывается проще: подруга правда закрутилась, отложила ответ, забыла. Написала позже, предложила другой день, спросила про вас. Такое бывает.\n\nМеня здесь особенно задевает, как постепенно вы перестаете что-либо ей рассказывать. Хорошую новость оставляете до встречи. Когда у нее случается очередная ссора, новость уже кажется несвоевременной. Ну куда вы сейчас со своим повышением, она вон плачет. Потом вы забываете, что вообще хотели поделиться.\n\nНо вдруг отвлечете, вдруг она с ним, вдруг ей сейчас совсем не до разговоров.\n\nВы ведь помните, как ей бывает тяжело.\n\nОна знает, как вам без нее?","caption":"Иногда подруга помнит все подробности своих ссор, которые вы вместе обсуждали, и даже не знает, что вы сменили работу. Мне грустно от того, сколько неловкости бывает вокруг обычного желания рассказать о себе.\nЕсли узнаете такую дружбу, напишите в комментариях «знакомо»."},{"v":"живой","text":"Что, если быть плохой дочерью, это нормально? Ведь плохая дочь это та, которая не молчит, а защищает себя. И ей в этот момент говорят, ты неблагодарная. Плохая дочь это та, которая спорит в тот момент, когда от нее ждут согласия, и ей говорят, ты невежливая, так нельзя. Плохая дочь это та, которая говорит, я сделаю по-своему, а ей говорят, не имеешь права, сделаешь по-своему, и я от тебя отрекусь. Разве это плохо, тогда быть плохой дочерью? А может быть, это совсем не значит, что вы плохая дочь?","caption":""}]},{"id":"r_drug_1_2","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","author":"Михаил","format":"reels_spisok","cards":[{"v":"zh_h7_staryy","text":"Пять признаков дружбы, в которой вас вспоминают только когда плохо.\nПервое. Вы напрягаетесь, когда видите имя друга на экране, и еще до ответа пытаетесь вспомнить, сколько у вас сегодня сил и сможете ли вы хотя бы полчаса его слушать.\nВторое. Ваш отдых легко отменяется чужим тяжелым вечером: вы выключаете фильм, выходите из душа, переносите сон, потому что человек попросил всего десять минут и вам кажется жестоким сейчас отказать.\nТретье. Вы знаете, с кем он поссорился, что ему написали, кто его обидел, и можете пересказать последние разговоры почти дословно, а он снова спрашивает, как называется компания, в которой вы работаете.\nЧетвертое. Меня раздражает совет просто порадоваться за человека, потому что вы вполне можете радоваться и одновременно замечать, что на счастливый вечер вас почему-то снова не позвали, хотя на самый тяжелый вечер ваше время нашлось сразу.\nПятое. Друг может подробно обсудить с вами, сколько потратил на поездку, ужин, подарок, но ваше предложение вместе сходить куда-нибудь снова оказывается слишком дорогим, слишком сложным, давайте потом, сейчас совсем неудобно.\nСколько совпало у вас?","caption":"Иногда после долгого молчания приходит короткое «Выручишь?», и вы уже набираете ответ, хотя сами собирались рассказать этому человеку важную новость.\nЯ Михаил, психолог, работаю с людьми от двадцати пяти до сорока.\nПодписывайтесь, если хочется еще таких разговоров: здесь я пишу об отношениях и о том, как мы обращаемся с собой."},{"v":"h3h4_staryy","text":"Четыре признака, что вы привыкли дружить с теми, кто пропадает, когда у них все хорошо.\nПервое. Вы радуетесь даже тревожному сообщению. «Можно позвонить? Все ужасно». Наконец появился. Что случилось, вы узнаете потом.\nВторое. Ради такого звонка вы отменяете свои планы. Ужин остынет, сериал подождет. Сейчас вы нужны, такое нельзя упустить.\nТретье. О своих трудностях говорить неловко. Уже набрали «у меня тоже тяжелый день» и стерли. У человека же проблемы, куда еще со своими.\nЧетвертое. От его хороших новостей вам становится грустно. Помирились, работу нашли, жизнь наладилась. Вы уже знаете, что дальше.\nПолучается, вы ждете следующего кризиса, чтобы снова побыть друзьями.","caption":"После двух часов разговора иногда выясняется, что вас даже не спросили, как вы. И все равно приятно, что позвонили.\nЯ Михаил, психолог, работаю с людьми от 25 до 40 лет.\nПодписывайтесь, если хочется еще такого: здесь говорим об отношениях и о том, что в них трудно заметить."},{"v":"живой","text":"Всем привет, меня зовут Паша и это мои 5 причин, почему вы можете выбрать меня в качестве своего психолога. Причина первая, я могу понять, о чем вы, когда вы используете в своей речи такие слова, как бимба, пикми, вайб, кринж, а также... Сухая доколась, получка и хохма. Шнелли, Пеппо, вот а факт. Причины номер два, у меня есть медицинское образование, я врач психиатр и врач психотерапевт, а учиться на это, ну нахуй. Это значит, что я понимаю в психопатологии и знаю, почему ваша крыша подтекает и зачем вам нужно обратиться за помощью. Причины номер три, со мной можно по-разному. На сессии мы можем посмотреть через эксперимент, почему для вас попросить денег это словно утонуть в колодце с говном, а можем просто посидеть в тишине, потому что все же так заебало и наконец-то хочется отдохнуть. Причина номер четыре, я не из тех психологов, которые просто мило кивают головой и говорят, чем я могу вам сейчас помочь. Я из тех, кто будет рядом с вами, с пониманием, с принятием, но не на стороне привычек, которые разрушают вашу жизнь. Причина номер пять, мне доступна гипнотерапия. Я принимаю очно в городе Владивосток и онлайн по всему миру. Записывайтесь ко мне через личные сообщения в телеграм.","caption":""},{"v":"zh3","text":"Четыре признака друзей, которые появляются, когда им плохо, и пропадают, когда все хорошо.\n\nПервое, они рассчитывают, что вы всегда сможете поговорить. Но другу плохо, поэтому вы берете трубку. А он может даже не знать, что вы сменили работу.\n\nВторое, встретиться с ними получается только срочно. Когда вы предлагаете спокойно поужинать в выходные, они отвечают: «Давай спишемся». И дальше тишина. И все-таки обидно: на ваше приглашение он так и не ответил. Вот это меня задевает.\n\nТретье, рядом с ними вы сокращаете собственные неприятности. Начинаете рассказывать, что вам тяжело, слышите: «Да, понимаю, у меня вообще ужас», и дальше снова слушаете.\n\nЧетвертое, вам бывает тревожно слышать, что у друга все наладилось. Вроде бы дорогой вам человек, надо радоваться, а вы уже понимаете, что теперь он исчезнет до следующей беды. А когда ему хорошо, вы скучаете по нему в одиночку.\n\nКогда вы в последний раз разговаривали просто потому, что он по вам соскучился?","caption":"Я замечаю, как трудно бывает признаться: вы уже устали отвечать, но по самому другу все равно скучаете. Особенно если раньше вы могли часами обсуждать любую ерунду.\nСохраните, если хотите вернуться к этому разговору."},{"v":"zh2","text":"Вы сейчас смотрите это видео и уже оправдываете подругу, которая месяцами молчит, пока у нее все хорошо?\n\nВот вечер, вы наконец легли, телефон рядом заряжается. Приходит сообщение: «Вы спите?» И вы уже знаете, что дальше. Она поссорилась с мужем. Или на работе ужас. Вы вытаскиваете провод, садитесь на кровати и пишете: рассказывайте.\n\nТолько общаетесь вы, конечно, на ты. Это я уже со своим «вы» в вашу переписку залез.\n\nА потом она присылает сердечко. Спасибо, вы очень помогли.\n\nИ пропадает.\n\nПричем вы узнаете, что у нее все наладилось. По фотографиям. Вот они вместе уехали на выходные, вот она смеется в ресторане, вот новая работа. И вы даже рады. Правда рады. Просто открываете вашу переписку, а там последнее сообщение от вас: «Как вы там?»\n\nЛадно, предлагаю хотя бы в телефоне переименовать ее в «У нее опять новости». Пусть будет немного интриги.\n\nИ вот вы знаете все подробности ее ссоры с мужем. Она до сих пор не знает, что вы сменили работу.","caption":"Иногда особенно обидно увидеть в общей компании, как внимательно подруга расспрашивает других. Оказывается, она умеет и слушать, и запоминать, и сама писать первой.\n\nМеня зовут Михаил, я психолог, работаю со взрослыми от 25 до 40.\nПодписывайтесь, если хочется еще таких разговоров об отношениях и о себе."}]},{"id":"r_mama_1","topic":"я злюсь на ребенка, а потом ненавижу себя за это","author":"Ольга","format":"reels_spisok","cards":[{"v":"zh2","text":"Четыре признака мамы, которая после злости на ребенка еще полдня себя наказывает.\n\nПервое, вы лишаете себя отдыха. Ребенок уснул, можно наконец сесть с кофе, но вы вспоминаете, как рявкнули на него перед сном, и идете оттирать стульчик. Потом раковину. Потом достаете из корзины белье. Кофе остывает, через сорок минут ребенок просыпается, и вы встречаете его еще более уставшей.\n\nВторой признак, вы перестаете просить мужа о помощи. Теперь попросить его остаться с ребенком страшно: вдруг скажет, что вы и так целый день дома, еще и орете.\n\nТретье, вы пытаетесь срочно стать идеальной. Вот это меня, блядь, особенно злит: мама уже на пределе, но после срыва требует от себя еще больше.\n\nЧетвертое, вам трудно поверить, что ребенку с вами хорошо. Он приносит книжку, забирается на колени, сует вам под нос любимый разворот. А вы смотрите на него и думаете: господи, как ты вообще ко мне идешь, я же такая хреновая мать.\n\nСколько времени после срыва вы еще проводите вот так, рядом с ребенком, ненавидя себя?","caption":"Меня особенно цепляет это обещание себе: завтра ни разу не раздражаться. Уже с утра приходится следить за каждым своим вздохом.\nЯ Ольга, психолог, работаю с мамами малышей до трех лет.\nПодписывайтесь, если хочется еще таких разговоров: здесь о декрете, материнской злости и отношениях в семье."},{"v":"zh_h7_staryy","text":"Пять признаков мамы, которая за злость на ребенка готова себя СОЖРАТЬ, и я хочу, чтобы вы узнали, как это выглядит после того, как вы уже успокоились.\n\nПервое.\n\nВторое. Вы отменяете себе отдых: собирались полежать, пока ребенок спит, но после своего крика идете мыть плиту, разбирать вещи, делать хоть что-нибудь полезное, потому что хорошая мама сейчас должна постараться, заслужить, исправить. И вот это меня бесит: блядь, вы уже устали до крика, и теперь в наказание у вас будет еще меньше сил, причем даже десять минут с закрытыми глазами кажутся какой-то наглостью.\n\nТретье.\n\nЧетвертое. Хорошее вы сразу обесцениваете: вечером ребенок забрался к вам на колени, вы вместе посмеялись, почитали, но в голове все равно только утренний срыв, будто целый день можно оценить по одному вашему голосу.\n\nПятое. Вы начинаете экономить на себе именно после срыва: крем закончился, кофе хочется, но рука закрывает корзину, потому что хреновая мать еще и деньги на себя тратит, прекрасно вообще.\n\nСколько пунктов узнали?","caption":"Даже извинение перед ребенком иногда продолжается внутри целый вечер: он уже занят своими делами, а вы все подбираете слова. Я бы хотела, чтобы об этой части материнского дня тоже можно было говорить вслух.\nЯ Ольга, психолог, работаю с мамами малышей до трех лет, в декрете.\nЕсли хочется, добавьте в комментариях свой пункт."},{"v":"zh3","text":"Четыре признака мамы, которая злится на ребенка, а потом еще долго себя за это наказывает.\nПервое, вы отменяете себе отдых. Ребенок уснул, вы идете оттирать стульчик, складывать вещи, делать хоть что-нибудь полезное.\nВторое, вы скрываете от мужа, насколько устали. Он спрашивает, как прошел день, вы отвечаете: нормально.\nТретье, вы пытаетесь срочно стать самой терпеливой мамой на свете. Вот вы укладывали ребенка, он снова встал, попросил пить, потом другую пижаму, вы рявкнули и увидели, как он замолчал. Все, блядь. И вот тут меня особенно цепляет, сколько требований вы себе добавляете за одну минуту.\nЧетвертое, вы перестаете верить, когда ребенку с вами хорошо. Он смеется, лезет обниматься, зовет играть, а вы смотрите на него и думаете: сейчас радуется, а потом вырастет и вспомнит, какая я была ужасная. Меня бесит, как легко мама может вычеркнуть все, что делала для ребенка целый день, и помнить только эти несколько секунд.\nА сколько времени вы потом разговариваете с собой тем самым голосом, за который себя ненавидите?","caption":"Иногда мама даже подруге пишет «я ужасная мать», стирает и отправляет фотографию ребенка.\nМне хочется знать, что она хотела написать до этой фотографии.\nЕсли узнали себя, напишите в комментариях одно слово: «знакомо»."},{"v":"живой","text":"5 реальных признаков от психотерапевта, что человек прошел настоящий ад в своей жизни. Первый, ему некомфортно, когда о нем искренне заботятся или делают комплименты. Потому что забота для него это что-то сильно непривычное, с подвохом и ощущением, что я что-то тебе за это должен. Два, ему физически больно просить о помощи. Они лучше умрут. Третий пункт, он считывает настроение людей за 0,3 секунды. По тону голоса, по тому, как человек моргает, по тому, как открывает дверь. Эти люди не умеют отдыхать без чувства вины. Если они ничего не делают, то у них возникает ощущение, что сейчас кто-то придет и накажет их за то, что они бездельничают. Пятый признак, когда у этих людей в жизни все хорошо, им жутко тревожно. Мозг привык, что тишина обычно перед настоящим лютым пиздецом. Сколько пунктов вы насчитали у себя?","caption":""},{"v":"h3h4_staryy","text":"Четыре признака мамы, которая после злости на ребенка начинает себя наказывать.\nПервое. Вам стыдно просить помощи. Только что рявкнули, теперь сами укладывайте. Еще и отдыхать собрались? Какого хрена.\nВторое. Вы стараетесь срочно стать идеальной. Уже сил нет, но достаете краски: надо же перекрыть тот крик чем-нибудь хорошим.\nТретье. Вы молчите, когда обидно. Муж весь вечер в телефоне, а вы даже сказать боитесь. Сама сегодня орала, какие теперь претензии.\nЧетвертое. Вас бесит собственная усталость. Ребенок наконец уснул, вы легли и тут же: «Бедный малыш, еще и мать такая».\nСколько времени после крика вы еще живете без права на помощь?","caption":"Иногда даже рассказать мужу о тяжелом дне страшно: вдруг спросит, опять ли вы кричали. И весь разговор сведется к этому.\nМеня зовут Ольга, я психолог, работаю с мамами детей до трех лет, в декрете.\nЕсли хочется, добавьте в комментариях свой пункт."}]},{"id":"r_mama_1_2","topic":"я злюсь на ребенка, а потом ненавижу себя за это","author":"Ольга","format":"reels_monolog","cards":[{"v":"живой","text":"Если вы не можете перестать листать рилсы и заняться делом, то я как клинический психолог хочу терапевтически спросить. А может быть вы... ну... заебались? А? Ну... я понимаю вы уже записали себя в конченные, но все-таки. Может быть есть такой маленький шанс, что вы в ахуе от нагрузки. И мозг пытается залипнуть на чем-то хоть мало-мальски приятного. А? А? Думаете все-таки вы ленивая скотина, да? Записал. Ну все же, предлагаю попробовать выключить. Не рилсы, не рилсы, не пугаемся. Бесконечный поток требований к себе. Как вам идея? Вдруг дело в нем? Мало ли. Так, навскидку.","caption":""},{"v":"zh3","text":"Девочки, кто после резкого «да постой ты спокойно» уже мысленно лишил себя права называться хорошей мамой?\n\nИ меня прямо задевает, как быстро вы доходите до этого последнего пункта.\n\nВот вы собираетесь гулять. Ребенок уже просился на улицу, вы достали комбинезон, присели перед ним в коридоре, вам жарко, потому что свою куртку вы зачем-то надели первой. Он убирает ногу. Вы ловите носок, поправляете пятку, он садится на пол и стягивает то, что вы только что натянули.\n\nВы просите: ну дай ножку. Еще раз просите. Потом уже громче. Потом резко: «Да хватит уже!»\n\nРебенок смотрит на вас, и тут вы начинаете ненавидеть себя.\n\nА он сейчас вообще хочет снять второй носок. И вы сидите перед ним с этим ботинком, вам стыдно, вы целуете его в макушку и обещаете себе больше НИКОГДА.\n\nБлядь, вы даже сейчас продолжаете стоять в застегнутой куртке и потеть.\n\nНо к вечеру вы вспоминаете весь день и говорите мужу: «Я сегодня ужасно себя вела».\n\nА он спрашивает, что случилось. И вы рассказываете только про ботинок.","caption":"Еще можно услышать от близких: «Да ты же сама хотела ребенка». После такого в следующий раз проще промолчать, даже когда очень хочется с кем-нибудь поговорить.\nЯ злюсь, когда маме приходится сначала доказывать, что она любит своего ребенка, чтобы рассказать, как ей трудно."},{"v":"zh2","text":"Девочки, кто после резкого «да хватит уже» мысленно собирается сдавать экзамен на право быть матерью? Мои хорошие, вы там себе хоть один пересдавать разрешаете?\n\nРебенок весь вечер висит на вас, вы идете в туалет, он следом, закрываете дверь, он плачет, открываете, пытаетесь застегнуть штаны одной рукой. Потом вы садитесь поесть, и он лезет к вам на колени, задевает тарелку, макароны летят на пол. И вы орете: «Да дай ты мне хоть поесть!»\n\nОн замирает. И вас тут же накрывает: господи, он же маленький. Он просто хотел ко мне. Какая же я ужасная мать.\n\nМеня прямо злит, как быстро мы начинаем добивать себя в этом месте. Блядь, вы еще даже со стула не встали, а уже вынесли себе приговор.\n\nНормальная мать, видимо, могла бы питаться запахом макарон с пола.\n\nЯ сейчас чуть в сторону, но меня особенно цепляет вот это: даже вечером вы можете решить, что отдыхать вам сегодня как-то стыдно. Хотели посмотреть сериал, а вместо этого ищете, чем крик вредит ребенку. Читаете до ночи, пугаетесь еще сильнее, утром встаете совершенно разбитая.\n\nИ чего вы от себя утром ждете? Терпения, конечно. Теперь вы обязаны быть еще терпеливее, ведь вчера провалились.\n\nСколько часов вы уже себя ругаете за те несколько секунд на кухне?","caption":"Иногда мама потом еще и мужу боится сказать, как прошел вечер. Вдруг он тоже посмотрит на нее с ужасом.\nЯ Ольга, психолог, работаю с мамами малышей до трех лет.\nЕсли знакомо, можете написать в комментариях «знакомо»."},{"v":"h3h4_staryy","text":"«Я злюсь на ребенка, а потом ненавижу себя за это».\n\nВот он размазал йогурт по дивану. Вы рявкнули. Блядь, опять. Сели рядом, извинились, обняли. А внутри все еще: «Ну какая же я ужасная мать».\n\nИ вы начинаете: «Ты любишь маму? Иди ко мне. Ну обними».\n\nРебенок уже машинку катает, а вам нужна его улыбка. СРОЧНО. Потому что с ней можно наконец выдохнуть: он меня любит, значит, я еще хорошая.\n\nВ какой-то момент вы начинаете ждать, что ребенок успокоит вас после вашего же крика.\n\nА если он пока сердится на вас?","caption":"После извинения очень хочется сразу услышать: «Все хорошо». У малыша может еще дрожать губа, даже когда вы уже готовы обниматься.\n\nЯ Ольга, психолог, работаю с мамами малышей до трех лет.\nЕсли хотите поговорить на консультации, пишите в директ слово «разбор»."},{"v":"zh_h7_staryy","text":"Я называю самосудом вот это мамино: накричала на ребенка и теперь весь вечер доказываю себе, какая я хреновая мать.\n\nСамосуд это когда ребенок перед сном перевернул чашку, вы весь день с ним, вам еще вытирать пол, переодевать его, укладывать, и вы рявкнули: ну сколько можно! Он заплакал, вы обняли его, вытерли воду, нашли сухую пижаму. Но потом вы сидите рядом с кроваткой и смотрите на его щеку, на руку поверх одеяла, и думаете: как я вообще могла.\n\nЯ тут каждый раз хочу спросить: а куда вы собираетесь деть весь следующий день? С его недосыпом, прилипшей кашей, ребенком, который снова потянет за футболку, пока вы жуете. Вы ведь собираетесь прожить такой же день, только теперь еще запретили себе злиться. Блядь, какая тяжелая задача.\n\nМне важно это назвать, потому что со стороны у вас просто тихий вечер, ребенок уснул, мама сидит рядом.\n\nСамосуд это когда вы уже можете сказать ребенку: прости, я накричала. И говорите. А потом он засыпает, и вы продолжаете шепотом перечислять себе все обвинения, потому что в вашей голове хорошая мама должна мучиться достаточно долго. Сколько? До утра хватит?","caption":"Иногда после такого вечера даже сообщение подруге стирают, оставляя только «мы сегодня плохо спали».\nЯ Ольга, психолог, работаю с мамами малышей до трех лет, в декрете.\nЕсли хотите прийти на консультацию, пишите в директ слово «разбор»."}]},{"id":"r_stud_1","topic":"не могу сесть за диплом, хотя времени почти нет","author":"Юлия","format":"reels_monolog","cards":[{"v":"zh3","text":"Откладываешь. До сдачи уже совсем мало времени, ты открываешь диплом, перечитываешь последние строчки и тут же находишь, что еще нужно посмотреть перед тем, как писать. Одну статью, требования кафедры, сообщение научной руководительницы. Ну надо же сначала разобраться. И вот ты уже час сидишь за ноутбуком, устала, а в документе все тот же абзац.\n\nОткладываешь, когда смотришь на этот абзац и заранее представляешь, как его прочитают. Здесь спросят, откуда ты это взяла, здесь скажут, что вывод слишком простой, здесь вообще станет понятно, что ты плохо разбираешься в собственной теме. И ты удаляешь предложение, которое только что написала. С ним ведь уже можно спорить, его можно назвать слабым. Пустое место пока никто не оценивал.\n\nОткладываешь, когда за одним неудачным предложением у тебя сразу следует: как я вообще доучилась до последнего курса? Но ты уже вспоминаешь, как отвечала на семинаре, что не поняла на лекции, где подсмотрела в конспект, и находишь еще много, много, много доказательств, что с дипломом ты тоже не справишься.\n\nОткладываешь, потому что боишься дописать и решить: вот на что я способна, даже когда стараюсь.","caption":"Можно весь вечер просидеть дома «за дипломом» и отказать себе даже в ужине с подругой. А потом еще ругать себя за то, что совсем не устала бы, если бы действительно работала.\nМне грустно, когда за такой вечер ты еще и называешь себя бездельницей.\nОтправь той, с кем сейчас пишешь диплом."},{"v":"h3h4_staryy","text":"«До сдачи диплома неделя, почему я опять не могу сесть и написать хоть страницу?»\n\nОткрываешь ноутбук, меняешь шрифт на титульном листе. Ну вот, уже полчаса дипломом занимаешься. Сам текст страшно трогать.\n\nПока ты ничего толком не написала, можно думать: я вообще способная, просто времени мало. А если постараешься, напишешь и получится средне? Вдруг решишь, что это и есть все, на что ты способна?\n\nПусть пока будет пустая страница. Зато еще можно представить, какой прекрасной она получится.\n\nКакую оценку себе ты боишься получить вместе с оценкой диплома?","caption":"Особенно тяжело, когда раньше учеба давалась легко. Сесть над трудной задачей бывает почти стыдно: как будто способная студентка должна сразу знать, что писать.\n\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nОтправь тому, у кого тоже горит диплом."},{"v":"zh2","text":"Откладываешь, когда до сдачи диплома уже страшно считать дни, ты садишься за стол, открываешь ноутбук и вдруг решаешь, что сначала надо разобрать загрузки. Там документы с первого курса, какие-то билеты, фотографии расписания. Ты все это раскладываешь по папкам, и вроде даже занята учебой. Файл с дипломом тоже здесь. Ты его видишь. Только открывать пока не будешь, сначала закончишь уборку, чтобы уже спокойно сесть и начать.\n\nОткладываешь, когда представляешь, как откроешь этот файл, перечитаешь написанное и окажется, что ты вообще ничего не понимаешь в своей теме. Что научная руководительница спросит, какую мысль ты здесь хотела доказать, и ты будешь сидеть перед сообщением, печатать ответ, стирать, снова печатать.\n\nИ мне очень горько, что человек может так себя испугать, что даже собственный черновик становится страшно открыть.\n\nЧай уже остыл, в комнате темно, ты сидишь перед ноутбуком и сч
