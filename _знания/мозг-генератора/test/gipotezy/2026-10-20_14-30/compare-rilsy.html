<style>
:root{--bg:#F7F3EC;--ink:#2E2A45;--muted:#6B6680;--acc:#5B4FA0;--soft:#E7E2F2;--line:#E4DED2;--ok:#5F7A3A;--bad:#B4533F;--card:#fff}

<header><h1>Варианты вслепую</h1><span class="n" id="cnt"></span><button id="dl">Скачать мои оценки</button><button id="rev">Показать, где что</button></header>
<main><p class="n">Прочитай тексты каждой темы и отметь: «Живо» (похоже на живого психолога), «Так можно публиковать», «Нейросеть». Один текст в каждой теме настоящий. Ответы сохраняются в этом браузере.</p>

<script>
const T=[{"id":"r_mif_1","topic":"«психолог просто слушает и кивает за мои деньги»","author":"Михаил","format":"reels_monolog","cards":[{"v":"zh_h7_staryy","text":"Я не согласен с фразой «психолог просто слушает и кивает за мои деньги».\n\nДа, психолог слушает. Но одних кивков для работы недостаточно. У разговора должна быть понятная вам цель, психолог задает вопросы, помогает разобраться, что именно происходит, вместе с вами ищет способы справляться с вашей трудностью.\n\nИногда человек впервые может договорить, его никто не перебивает, не торопит, не объясняет, что у других жизнь сложнее.\n\nА после фразы про кивки человек начинает спрашивать совсем другое. Я что, настолько слабый, что сам разобраться не могу? Мне правда придется платить, чтобы меня кто-нибудь выслушал? А вдруг я просто выкину деньги и буду выглядеть дураком?\n\nЯ считаю совершенно разумным хотеть понимать, за что вы платите.\n\nИ все же ответственность за качество помощи нельзя целиком переложить на вас. Вы отвечаете за свои решения, за то, что готовы обсуждать и пробовать, за участие в работе в пределах своих возможностей. У психолога своя ответственность: понимать, что он делает, объяснять это вам, замечать, когда работа буксует, и обсуждать это с вами.\n\nВы можете прийти растерянным и без готового запроса. Организовать профессиональную работу на встрече обязан психолог.","caption":"На первой встрече можно прямо сказать: «Я раньше у психолога не был и пока не понимаю, как это работает». Я бы хотел услышать этот вопрос в самом начале.\n\nМеня зовут Михаил, я психолог, работаю с людьми 25-40 лет, которые впервые обращаются за помощью.\nОтправьте тому, кто сомневается, стоит ли идти к психологу."},{"v":"живой","text":"Дети, у которых было сложное детство, очень много думают. Про таких говорят: живут в своей голове. Но я добавлю одну вещь, как психолог, который много работает с такими людьми. Если человек очень много думает, скорее всего, он очень мало чувствует. Потому что он научился прятаться от всего пиздеца в голову. Анализировал обстановку дома, настроение родителей. Там было безопасно, только там был контроль. А чувствовать было больно, страшно и одиноко. Так что бесконечное обдумывание часто способ не встречаться с тревогой. В следующий раз, когда заметишь, что опять жуешь эту мыслительную жвачку, спроси себя по-доброму: котенок, а какое чувство я сейчас не хочу чувствовать? Если узнал себя, в описании есть еще.","caption":""},{"v":"zh3","text":"Меня раздражает, когда про психолога говорят: «Он просто слушает и кивает за ваши деньги».\n\nИ вот вы думаете: ну расскажу я все это еще одному человеку. Дальше что? Он посочувствует? Скажет, что мне надо меньше переживать? Я за это должен платить?\n\nУ меня бы тоже возник вопрос, за что здесь платить.\n\nНо психолог во время разговора тоже работает.\n\nДопустим, вы никак не можете сказать начальнику, что больше не готовы работать по выходным. Вы уже обсуждали это с друзьями, они поддержали, вы даже придумали, как начать разговор. Наступает пятница, начальник снова пишет, и вы соглашаетесь. А потом злитесь на себя: ведь все же понятно, чего я опять промолчал?\n\nПросто посочувствовать вам здесь действительно мало. В работе с психологом можно подробно разобраться, чего именно вы ожидаете от начальника, почему вам настолько трудно отказать и что происходит в тот момент, когда вы уже собираетесь сказать, но снова соглашаетесь.\n\nСо своей стороны вы можете рассказывать, как у вас на самом деле, пробовать то, о чем договорились, говорить, если что-то вам не подходит. А объяснить, что вы вместе делаете и зачем, обязан психолог.","caption":"Можно прямо на первой встрече сказать: «Я впервые и пока вообще не понимаю, как здесь все устроено». Я бы хотел, чтобы об этом спрашивали свободнее.\n\nМеня зовут Михаил, я психолог, работаю с людьми 25-40 лет, которые впервые обращаются за помощью.\nОтправьте тому, кто давно думает о первой встрече."},{"v":"zh2","text":"Меня раздражает, когда про психолога говорят: «Он просто слушает и кивает за ваши деньги».\n\nНо человеку, который еще ни разу не был у психолога, уже успели объяснить: вас там послушают, пожалеют, и за это придется заплатить. Ну и какие вопросы вы начинаете себе задавать? За что я вообще буду платить? Может, мне просто некому пожаловаться? Я что, совсем уже не могу сам со своей жизнью справиться?\n\nИ вот вы еще никуда не пришли, ни с кем не поговорили, но вам уже неловко. Как будто придется признаться, что вы покупаете себе внимание. Меня особенно злит вот это: человек и так долго собирается обратиться за помощью, а ему еще предлагают постыдиться того, что он собирается.\n\nИ еще мне хочется убрать отсюда одну неприятную обязанность, которую люди на себя берут. Вам совершенно незачем приходить и стараться быть таким интересным, глубоким, правильно отвечающим человеком, чтобы психологу было с вами приятно работать. Подбирать достойные обсуждения проблемы, заранее готовить умные выводы, извиняться, что опять говорите об одном и том же. И вот это вот все.\n\nВы отвечаете за то, что готовы рассказать, попробовать, обсудить. Психолог отвечает за свою работу и должен уметь объяснить, что он предлагает и зачем. Вам не нужно выполнять работу за двоих, чтобы потом еще решить, что вы недостаточно старались.","caption":"На первой встрече вполне можно сказать: «Я никогда у психолога не был и пока не понимаю, как тут все устроено». Я бы хотел услышать об этом сразу.\nМеня зовут Михаил, я психолог, работаю со взрослыми, которые впервые обращаются за помощью.\nОтправьте тому, кто давно собирается, но пока сомневается."},{"v":"h3h4_staryy","text":"«Психолог просто слушает и кивает за мои деньги». Кивать сорок минут действительно мало.\n\nНо вот вы рассказываете: «Мне было обидно, когда муж на меня накричал. Хотя он устал, у него работа сложная, я тоже выбрала момент…»\n\nПодождите. Вы успели оправдать его раньше, чем договорили про свою обиду. И сами этого даже не заметили.\n\nРабота психолога здесь начинается с вопроса: «А почему его усталость для вас важнее того, что вам больно?»\n\nВы отвечаете за то, чтобы рассказать, как у вас происходит. Психолог отвечает за работу с этим. Просто молча посидеть рядом недостаточно.\n\nВы ведь и дома можете час объяснять, почему с вами так можно.","caption":"Можно прямо спросить психолога: «Что мы сейчас делаем и как это связано с моим запросом?»\nЯ Михаил, психолог. Работаю с людьми 25-40 лет, которые впервые приходят к психологу.\nОтправьте тому, кто пока сомневается, зачем идти."}]},{"id":"r_mif_1_2","topic":"«психолог просто слушает и кивает за мои деньги»","author":"Михаил","format":"reels_rol","cards":[{"v":"zh2","text":"Я вам как друг говорю: зачем платить психологу, если я могу вас послушать? Садитесь, рассказывайте. Кивать я умею, сочувственно смотреть тоже, салфетки на кухне. Все условия.\n\nЧто у вас случилось? Начальник при всех сказал, что вы ничего нормально сделать не можете? Понятно. Секунду.\n\nВсе, я с вами. Значит, вы теперь по вечерам открываете рабочую почту, проверяете, вдруг опять что прислал, и даже в выходной думаете, что в понедельник вас вызовут и уволят. Ну так увольняйтесь первыми. Чего тут обсуждать?\n\nИпотека? Да, с ипотекой сложнее. Тогда оставайтесь. Видите, уже два варианта нашли, причем совершенно бесплатно. А психолог бы еще спрашивал, что вы чувствуете. Мы с вами взрослые люди, чего чувствовать, когда ипотека.\n\nВы плакали в туалете после совещания? Ну зачем вы так близко к сердцу. Я бы ему сразу ответил. Прямо при всех. У меня бы он быстро понял, с кем разговаривает. Хотя я его, конечно, никогда не видел, и работу вашу не знаю, и сколько вы ее искали, тоже. Но уверенности у меня достаточно, можете пользоваться.\n\nКстати, я завтра спрошу у Марины, у нее тоже начальник тяжелый. Что значит, вы просили никому? Так я без фамилии. Скажу, знакомый из вашего отдела. Там много людей, почти никто сразу не догадается.\n\nСтранно. Я же все сделал.\n\nТолько договоримся: в следующий раз рассказывайте сразу с хорошим концом. Мне так легче вас поддерживать.","caption":"Я могу остановиться на вашем «вроде все нормально» и спросить, почему вы уже третью ночь проверяете рабочую почту. Если хотите понять, как проходит такая работа, приходите знакомиться.\nМеня зовут Михаил, я психолог, работаю с людьми, которые впервые решились обратиться.\nПодписывайтесь, если хочется еще таких роликов: здесь говорю о терапии и том, с чем в нее приходят."},{"v":"h3h4_staryy","text":"Коллеги, клиент говорит: «Вы просто слушаете и киваете за мои деньги». Так, главное, продолжайте кивать. Спрашивать, с чем он хочет разобраться, опасно. Появится конкретная задача. Потом еще придется выяснять, что вы вместе делаете и зачем. Нам это надо? Он говорит: «Я опять согласился, хотя хотел отказать». Киваем сочувственно. Спросить, чего он боялся, нельзя. Вдруг выяснится, что он ждет скандала после каждого отказа. Это уже материал для работы, коллеги, осторожнее. А если клиент спросит, что изменилось за месяц? Кивните поглубже. Пусть видит: работа идет.","caption":"Одного кивания для работы мало: я могу предложить проверить мысль «если я откажу, меня разлюбят». Решать, кому и в чем отказать, будете вы.\nЯ Михаил, психолог, работаю с людьми 25-40 лет, которые впервые идут к психологу.\nПодписывайтесь, если хочется еще такого: здесь говорим о психологии на понятных жизненных ситуациях."},{"v":"zh3","text":"Сейчас я вам как друг объясню, почему платить психологу вообще незачем. Вы мне позвоните, я вас послушаю, покиваю. Бесплатно. Я, кстати, очень хорошо киваю, у меня на рабочих созвонах большой опыт.\n\nЧто вы хотели обсудить? Начальник опять попросил поработать в выходные, вы согласились, теперь злитесь и на него, и на себя? Просто откажите.\n\nСейчас расскажу, что у нас вчера руководитель устроил, вы просто послушайте. Там такое было. Нет, вашу историю я помню, конечно. У вас тоже начальник.\n\nВсе. Только давайте покороче, я сейчас в магазин зайду, там связь плохая.\n\nВам хочется договорить? Конечно, говорите. Я умею слушать. Угу. Угу. Сейчас, тут скидка по карте или без? Это я кассиру. Продолжайте, я все слышу. Вы в субботу сидели за ноутбуком, друзья прислали фотографии со встречи, и вы даже отвечать им не захотели. Ну, зато работу сделали.\n\nВас злит, что я перебиваю и все упрощаю? Ого. С психологом вы тоже так разговариваете? Ему говорите, когда вам что-то не подходит? И он это с вами обсуждает? Да, за ваши деньги еще бы он спорил. Хотя со мной вы сейчас тоже спорите, а я совершенно бесплатно обижаюсь. Сервис тот же.\n\nЯ могу минут десять, пока до дома иду. Только без сложных вопросов, пожалуйста, я после работы.\n\nТак что договорились. Когда начальник снова напишет, звоните мне. Я вам еще раз скажу: просто откажите. Если опять согласитесь, тоже звоните. Я скажу, что предупреждал.","caption":"На первой встрече можно прямо спросить психолога: «Что мы будем делать, кроме разговоров?» Я бы хотел, чтобы вы понимали, зачем я задаю вопросы и что мы вместе пытаемся выяснить.\nМеня зовут Михаил, я психолог, работаю со взрослыми, которые впервые решились обратиться.\nПодписывайтесь, если хочется еще такого: здесь я рассказываю о психологии и о том, как проходит терапия."},{"v":"живой","text":"Уважаемые родители, рассаживаемся. Тема урока: доверие. Как сделать, чтобы ребенок вам доверял? Правильно. Нужно, чтобы он не доверял больше никому. Особенно себе. Чтобы ни одна мысль, которая приходит ему в голову, не вызывала у него доверия. Это первый класс, вторая четверть. Он вам говорит: вы на меня орете. Кто на тебя орет? Никто на тебя не орет, я разговариваю, понятно? Он говорит: вы меня наказываете. Мы не наказываем. Мы воспитываем, это разные вещи. Он говорит: я не могу. Ты все можешь, ты просто не хочешь. Что за вопросы вы задаете? Вы что, тупая? Лично я не обзываюсь. Я выстраиваю гипотезу. Вот. Почувствовали? Сразу доверие между нами возникло. И с ребенком так же. Тогда в семье будут теплые доверительные отношения.","caption":""},{"v":"zh_h7_staryy","text":"К психологу собрались? Послушайте, я вас бесплатно послушаю и покиваю. Зачем платить за то, что любой нормальный человек умеет? Садитесь, рассказывайте. Только покороче, у меня еще дела.\n\nТак, на работе переживаете. Начальник сухо ответил на сообщение, и вы теперь думаете, что вами недовольны. Понятно. Да забудьте вы. Все, вопрос решили. Видите, даже кивать пока не понадобилось.\n\nА что именно он написал? «Обсудим завтра»? Ну конечно, тут любой занервничает. Хотя, знаете, если вы работу нормально сделали, чего нервничать? Сделали нормально? Тогда перестаньте. Не уверены? Тогда надо было лучше делать. Все же логично.\n\nВы пробовали, и опять начинаете? Значит, плохо пробовали. Тут надо прямо решить. Проснулись утром и решили: сегодня я уверенный человек. Я сам так делаю. Правда, у меня начальника нет, но какая разница, принцип универсальный.\n\nКстати, про сообщения. Мне вчера тоже сухо ответили. Я написал еще раз, потом позвонил, потом спросил у общего знакомого, все ли нормально. И прекрасно успокоился.\n\nЯ, между прочим, уже десять минут вас слушаю. И киваю. Вы заметили? Очень качественно киваю. А вы все еще переживаете.\n\nТолько потом не говорите, что вас никто не слушает. Я слушал, свидетели есть, чай еще даже не остыл.\n\nВсе, идите. В следующий раз приходите уже с хорошими новостями.","caption":"В работе я возвращаюсь к вопросу, какие выводы человек делает из чужого короткого ответа. Одно «обсудим завтра» иногда занимает весь вечер.\nМеня зовут Михаил, я психолог, работаю с людьми от 25 до 40 лет, которые впервые обращаются за помощью.\nПодписывайтесь, если хочется еще такого: здесь я говорю о психологии и о том, как устроена работа с психологом."}]},{"id":"r_vopros_1","topic":"«а зачем мне психолог, если у меня есть подруги»","author":"Ольга","format":"reels_otvet","cards":[{"v":"zh2","text":"А зачем мне психолог, если у меня есть подруги?\n\nВот сейчас сижу с телефоном, увидела очередное «лучший психолог это подруга», и меня уже понесло. Подруга выслушает, подруга обнимет, подруга приедет с едой, составит сообщение вашему мужику, отредактирует, согласует с остальными девочками и лично проконтролирует отправку. Все, можно открывать кабинет, диплом выдадим за салат.\n\nНапример, вы рассказываете подруге, что мужчина опять весь вечер говорил о своей работе. Вы тоже хотели рассказать, вас сегодня повысили, вы даже купили пирожные по дороге. Но он устал, у него начальник идиот, потом он включил сериал. И вы решили, что расскажете завтра. Пирожные вместе съели. За повышение так и не выпили.\n\nПодруга говорит: ну скажи ты ему! Ты имеешь право, это вообще-то важный день. И вы согласны. Вы даже знаете, какими словами сказать. Только приходите домой, он спрашивает, что на ужин, и вы идете разогревать суп.\n\nСука, вот это место хочется понять. Как вы каждый раз доходите до того, что ваша хорошая новость может подождать.\n\nЕсли хотите разобраться, почему вы так хорошо умеете рассказывать подругам о своей боли и так боитесь сказать о ней человеку рядом, приходите.","caption":"Иногда подруга уже злится на вашего мужчину, а вы начинаете его защищать. И под конец разговора еще чувствуете себя виноватой, что вообще рассказали.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 22 до 35 лет.\nСохраните, если хотите к этому вернуться."},{"v":"h3h4_staryy","text":"А зачем мне психолог, если у меня есть подруги? Чтобы у вас был разговор, в котором можно оставить все внимание себе. Вот вы рассказываете подруге про ссору с мужем. Она слушает, потом говорит: «Ой, у меня тоже такая херня, я вчера всю ночь плакала». И вы уже спрашиваете, что случилось у нее. Вы ее любите, вам важно, как она. С психологом можно занимать весь разговор собой. Его чувства тоже существуют, он сам с ними работает. Вам можно договорить, даже если ваша история занимает ВСЮ встречу.","caption":"Даже с самой близкой подругой можно придержать подробность, потому что она потом будет переживать весь вечер. Иногда еще и успокаивающее сообщение отправляете: «Я уже нормально, не волнуйся».\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nОтправьте тому, кто тоже задается этим вопросом."},{"v":"zh3","text":"А зачем мне психолог, если у меня есть подруги?\n\nВот сейчас сижу с телефоном, только что увидела очередное: поговорите с подругой, и никакой психолог вам не понадобится. И меня бесит, как легко подруге выдают дополнительную работу. Выслушать, успокоить, понять, почему вы снова согласились на то, чего совсем не хотели, подобрать слова, обязательно правильные, еще и быть на связи в тот момент, когда вас накрыло. Желательно ночью. Утром ей на работу, но это уже технические подробности.\n\nБлядь, она вообще соглашалась?\n\nНо вот вы собрались рассказать подруге, что опять дали маме денег, хотя сами откладывали на отпуск. Открыли переписку. И вспомнили, сколько подруга в прошлый раз вас поддерживала, как вы уверенно говорили, что больше такого не будет. И теперь придется признаться, что опять было.\n\nПоэтому вы пишете: «Да все нормально, у тебя как?»\n\nВсе. Поговорили.\n\nНа встрече с психологом у вас есть время, за которое вы договорились заниматься вашими трудностями. Вам можно снова прийти с тем, о чем уже говорили.\n\nДаже если вчера вы целый час убеждали меня, что больше маме денег не дадите.","caption":"Подруге тоже бывает страшно сказать лишнее, особенно когда она видит, как вам больно. Иногда она молчит просто потому, что дорожит вами.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nСохраните, если вам знакомо это «да все нормально»."},{"v":"zh_h7_staryy","text":"А зачем мне психолог, если у меня есть подруги? Я вот сижу с телефоном, только что увидела ролик про то, что лучшая терапия для женщины это вечер с подругами. И там все прекрасно: вас выслушают, обнимут, бывшего обосрут, нового одобрят, заодно решат, увольняться ли вам, какую челку стричь и почему во всем виновата его мать. Полный консилиум, еще и с доставкой еды.\n\nПодруги и психолог делают разную работу.\n\nИ я сама люблю обсудить что-нибудь с близкими, и советы раздаю, когда меня вообще никто об этом не просил. Да, диплом в этот момент молча лежит где-то в стороне.\n\nВы рассказываете подруге, что мама попросила приехать в единственный свободный день, вы собирались просто полежать дома, но уже купили билет. Подруга говорит: ну скажи, что устала. Вы отвечаете: она обидится. Подруга: ну пусть обижается. Только билет у вас уже в телефоне.\n\nПсихолог может задержаться именно здесь. Что для вас случится, если мама обидится? Как у вас в семье вообще обходятся с отказом? Почему мамино недовольство так быстро становится вашей задачей?\n\nХотя бывшего я тоже мысленно могу обосрать. Просто мне еще и работать надо.","caption":"Подруга может помнить вашу маму с выпускного. Психологу придется расспрашивать, и иногда уже в этом рассказе обнаруживаются детали, которые близкие давно считают привычными.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nОтправьте тому, кому сейчас нужен этот разговор."},{"v":"живой","text":"Как понять, что у тебя расстройство личности? Если ты не пролистала это видео, скорее всего, его у тебя нет. Все. Потому что при расстройстве личности человек обычно не сомневается в том, как он думает. Он не сидит и не гадает, все ли с ним в порядке. А если ты сидишь и гадаешь, то, скорее всего, у тебя просто яркие черты характера, с которыми можно прийти к психологу и разобраться. Диагноз по рилсу никто не ставит, и я тоже. Все, тема закрыта, всего хорошего.","caption":""}]},{"id":"r_vopros_1_2","topic":"«а зачем мне психолог, если у меня есть подруги»","author":"Ольга","format":"reels_malysh","cards":[{"v":"zh3","text":"Милая, вы сидите на кухне у подруги, чай уже остыл, вы опять рассказываете про свою ссору, и тут кто-нибудь обязательно скажет: «Вот зачем платить психологу, когда можно так поговорить?» Я с этим спорю.\n\nДевочки, подруги бывают такие умные, что я бы сама с удовольствием посидела у них на кухне. Еще и накормят. Очень серьезное преимущество, между прочим.\n\nВы говорите, что опять поссорились с мужчиной. Подруга помнит, как вы плакали в прошлый раз, и в позапрошлый, и как она сидела рядом, пока вы собирались ему позвонить. Она вас любит и уже злится: «Блять, ну сколько можно, уходи от него».\n\nИ вы киваете. Даже соглашаетесь. А про то, что утром хотели его обнять, уже молчите. Подруга столько вас поддерживала, и теперь вам стыдно признаться, что вы снова хотите к нему.\n\nС психологом можно разбирать и эту часть тоже. Говорить, что вы злитесь, скучаете, хотите уйти, хотите остаться, и вам самой уже неловко от того, сколько раз за один разговор вы передумали.\n\nИ в своей работе я должна замечать, когда уже слишком хочется решить за вас. Потому что дальше с вашим решением будете жить вы.\n\nКакую часть своей истории вы пока никому не рассказываете?","caption":"Иногда подруге тоже нужно спросить: «У тебя сегодня есть силы меня послушать?» Мне нравится, когда в дружбе можно честно ответить и сохранить близость.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nПодписывайтесь, если хочется еще таких разговоров: здесь про отношения, семью и то, как нам бывает рядом с близкими."},{"v":"живой","text":"Большие тети-дяди тебе этого не скажут, поэтому у тебя сердечко бо-бо, животик бо-бо, и бабайки в голове пугают. Сейчас тетя расскажет, как бабайкам дать пизды.\nТы думаешь, что бабайки настоящие. Если нападешь на бабайку, бабайки дадут тебе пизды. Ты будешь маленький и беззащитный, все будут смеяться и бросят тебя.\nПоэтому ты от бабаек убегаешь. Но бабайки придуманные. Вот тут мир, вот тут ты, а вот тут твои бабайки.\nЕсли бабайки придуманные, ты на них наорешь, пошлешь нахер, и ничего не случится. Они так и останутся придуманными. Мир не меняется. Меняются глаза.","caption":""},{"v":"zh_h7_staryy","text":"Хорошие мои, я против идеи, что психолог вам точно ни к чему, если есть подруги. Вот вы рассказали подруге, что опять согласились приехать к маме, хотя собирались отдохнуть, и теперь сидите злитесь.\n\nДа, я психолог, за встречи со мной платят. Подруги еще и чаем напоят. Тут у них серьезное преимущество.\n\nУ вас внутри клубочек. Там и злость на маму, и нежность к ней, и желание побыть дома, и страх, что она обидится.\n\nА у подруги свой клубочек.\n\nИ вот она говорит: ну съездите, мама же скучает, моя тоже скучает, я стараюсь приезжать.\n\nВы ее любите. И теперь вам хочется объяснить, что вы тоже хорошая дочь, вы тоже стараетесь, просто устали.\n\nОх, блять, еще и тут надо объясняться.\n\nНа встрече с психологом можно дольше оставаться с вашим клубочком.\n\nМне важно, чтобы в таком разговоре вы могли сказать даже то, с чем я лично не соглашусь, и нам хватило места это обсудить.\n\nПоэтому я бы предложила посмотреть, что происходит с вами, когда близкий человек отвечает на вашу жалобу своим мнением.\n\nВы продолжаете рассказывать? Или начинаете оправдываться?","caption":"Иногда подруге самой сейчас тяжело, и вы откладываете свой разговор до лучших времен. Я считаю важным учитывать и это.\nМеня зовут Ольга, я психолог, работаю с молодыми женщинами.\nПодписывайтесь, если хочется еще таких разговоров: здесь я говорю об отношениях, семье и чувствах."},{"v":"h3h4_staryy","text":"Вы спрашиваете: «Зачем мне психолог, если есть подруги?» Солнышки, сейчас объясню.\n\nВот вы рассказываете подруге про очередную ссору. Она говорит: «Да пошел он нахер». И вам тепло: моя, понимает.\n\nА потом подруга говорит: «Слушайте, вы ведь тоже его задеваете». Все. Теперь еще надо выяснить, она вообще за кого.\n\nВот тут узелок. Можно начать спорить, оправдываться, беречь подругу от своей злости.\n\nУ психолога можно сказать: «Я сейчас на вас злюсь. Мне кажется, вы меня обвиняете». И мы этот узелок вместе разбираем. Я выдержу, что вам сейчас со мной неприятно.\n\nВам не нужно сначала помириться со мной, чтобы продолжить разговор.","caption":"Подруге тоже бывает нужна поддержка, даже когда вы пришли со своей бедой. На встрече с психологом можно весь час говорить о себе, без очереди «теперь ты».\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 22 до 35.\nПодписывайтесь, если хочется еще таких объяснений про отношения и себя в них."},{"v":"zh2","text":"Девочки, я против идеи, что с хорошими подругами психолог вам уже точно ни к чему. Вот вы сидите у подруги на кухне, чай остывает, вы рассказываете, как опять побоялись попросить прибавку. Она вас любит, слушает. Казалось бы, чего еще надо?\n\nВы говорите, что начальник опять добавил вам работу, а вы опять согласились. Подруга вздыхает: «Господи, у меня сегодня то же самое». И рассказывает свое. Вы спрашиваете, что ей ответили, вспоминаете ее начальницу, обсуждаете, куда ей отправить резюме. Уже достали телефон, уже ищете знакомую, которая вроде искала сотрудника.\n\nА про свою прибавку вы так и не договорили.\n\nИ вот это меня трогает: женщина пришла рассказать, как ей тяжело, а через полчаса уже помогает кому-то еще. Блядь, даже чай допить не успела.\n\nУ психолога можно тоже начать спрашивать: «А у вас как дела?» Только психолог вернет разговор к вам. У вас есть оплаченное время, в котором вам можно занимать место, долго подбирать слова, повторяться, злиться на начальника и потом вдруг признаться, что вы боитесь услышать: «С вашей работой вообще-то справится кто угодно».\n\nМожет, вы правда умеете дружить. И вам все равно трудно говорить о себе достаточно долго.","caption":"Иногда после хорошей встречи вы знаете все новости подруги, а она так и не узнала, зачем вы просили увидеться. И обе вполне искренне рады друг другу.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nПодписывайтесь, если хочется еще таких разговоров: здесь про отношения, семью и то, о чем трудно сказать вслух."}]},{"id":"r_post_1","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","author":"Юлия","format":"reels_spisok","cards":[{"v":"zh_h7_staryy","text":"Пять признаков того, что ты уже подстраиваешь весь вечер под мужчину, который сам тебе не пишет.\nПервое, тело реагирует на каждый звук телефона. Ты еще не посмотрела на экран, а уже задержала дыхание, схватила телефон, и плечи поднялись. Там уведомление о доставке.\nВторое, отдых постоянно прерывается. Включила сериал, поставила на паузу, открыла переписку, вернулась к сериалу и уже забыла, о чем они разговаривают.\nТретье, на остальных людей у тебя заканчивается терпение. Подруга присылает голосовое, ты видишь уведомление и думаешь, ну зачем сейчас, я же жду. Меня цепляет, как быстро в таком ожидании люди, которые сами хотят с тобой поговорить, начинают мешать.\nЧетвертое, хорошая новость остается какой-то незаконченной. Например, на работе приняли твою идею, ты весь день хотела рассказать ему, написала, а он молчит.\nПятое, тебе становится легко потерять деньги, лишь бы остаться свободной на случай его сообщения. Он тебя никуда не позвал. Сколько пунктов у тебя совпало?","caption":"Когда он наконец пишет, можно так обрадоваться, что уже забыть, каким был весь вечер до этого. Я бы оставила эту часть тоже в разговоре об отношениях.\nЯ Юлия, психолог, работаю с девушками, у которых отношения только начинаются.\nСохрани, если хочется вернуться к этому позже."},{"v":"zh2","text":"Четыре признака того, что ты уже подстраиваешь свою жизнь под парня, который не пишет первым.\n\nПервое, ты боишься оказаться занятой. Подруга зовет прогуляться, ты отвечаешь, что пока не знаешь, хотя никаких планов у тебя нет. Просто вдруг он предложит встретиться? Только лежишь ты с телефоном в руке, полностью готовая за двадцать минут собраться и куда угодно поехать.\n\nВторое, ты перестаешь рассказывать про себя. Открываешь переписку, смотришь на свое последнее сообщение, закрываешь.\n\nТретье, тебя начинают раздражать люди, которые тебе пишут. Телефон загорается, ты хватаешь его, а там подруга прислала фотографию кота. И господи, ну зачем сейчас этот кот. Мне прямо обидно за эту подругу: она увидела смешное, вспомнила о тебе, захотела поделиться.\n\nЧетвертое, когда он наконец пишет, тебе уже почти нечего ему сказать. И тут приходит его обычное «как день?». Отправляешь «нормально, у тебя?». Все, что ты хотела рассказать, опять оставила при себе.","caption":"Меня особенно цепляет, сколько сил уходит на ответ, который должен выглядеть так, будто ты совсем его не ждала.\nМеня зовут Юлия, я психолог, работаю с девушками, которым тревожно в начале отношений.\nОтправь той, с кем хочется об этом поговорить."},{"v":"живой","text":"Пять признаков, что человек прошел в жизни настоящий ад. Первый. Ему неловко, когда о нем искренне заботятся или делают комплименты. Забота для него что-то непривычное, с подвохом: я теперь что-то должен. Второй. Ему физически больно просить о помощи. Он лучше умрет. Третий. Он считывает настроение людей за полсекунды. По голосу, по тому, как человек моргает, как открывает дверь. Четвертый. Он не умеет отдыхать без чувства вины. Если ничего не делает, кажется, что сейчас кто-то придет и накажет за безделье. И пятый. Когда в жизни все хорошо, ему жутко тревожно. Мозг привык, что тишина бывает перед настоящим лютым пиздецом. Сколько пунктов насчитали у себя?","caption":""},{"v":"zh3","text":"Четыре признака того, что ты уже проводишь вечер в ожидании его сообщения, даже если говоришь себе, что просто иногда проверяешь телефон.\nПервое, ты перестаешь понимать, чем вообще занималась. Открыла ноутбук закончить работу, увидела телефон рядом, проверила переписку, потом еще раз.\nВторое, ты оставляешь вечер свободным, хотя вы ни о чем не договаривались. Мне так жалко этих вечеров, когда ты уже отказалась от встречи, а он даже не знает, что ты его ждешь.\nТретье, ты заранее оправдываешься за желание написать. Придумываешь вопрос про фильм, ищешь смешное видео, вспоминаешь, что он советовал тебе какую-то кофейню. Удаляешь набранное, потому что в прошлый раз тоже написала первая.\nЧетвертое, когда он наконец пишет, тебе уже почти безразлично, что именно. Он прислал короткое «как ты», и ты сразу оживаешь, отвечаешь подробно, спрашиваешь про него. А про свою хорошую новость расскажешь потом, когда он спросит. Весь вечер ты так хотела поговорить с ним, и теперь снова сидишь с телефоном и ждешь.\nА если он сегодня так и не спросит?","caption":"Увидела совет: «Просто убери телефон подальше». Я бы еще спросила, сколько раз за вечер девушка встанет за ним в другую комнату. Иногда она и сама уже злится, что снова идет проверять."},{"v":"h3h4_staryy","text":"Четыре признака у девушек, которые весь вечер ждут, когда он напишет первым.\nПервое. Тебе трудно заняться своим. Сериал идет, рабочий файл открыт, но вдруг он написал, пока ты смотрела в ноутбук?\nВторое. Ты откладываешь даже приятное. Подруга зовет поболтать, а ты думаешь: сейчас он появится, и я буду занята. Он еще ничего не предложил. Ты уже освободила вечер.\nТретье. От его молчания ты становишься себе менее симпатичной. Еще днем нравилась себе на фото. Теперь увеличиваешь лицо: может, зря я это выложила?\nЧетвертое. Сообщение пришло, тебе сразу легче. И вдруг отвечать даже лень.\nА поговорить с ним тебе вообще хотелось?","caption":"Написать самой тоже бывает трудно: хочется убедиться, что он сам захотел тебя найти. Даже готовое сообщение стираешь.\nЯ Юлия, психолог, работаю с девушками 20-30 лет, которые начинают отношения.\nСохрани, если узнала свой вечер."}]},{"id":"r_post_1_2","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","author":"Юлия","format":"reels_monolog","cards":[{"v":"zh3","text":"Ты сейчас смотришь это видео и заодно проверяешь, не написал ли он?\n\nДавай хотя бы слово «опять» пока уберем. Вы знакомы со вторника.\n\nМеня очень задевает, как быстро девушка начинает себя ругать за такой вечер.\n\nВот ты приготовила ужин, включила сериал, телефон положила рядом с тарелкой. Звук включен. Ты точно услышишь сообщение. Но все равно берешь телефон, потому что вдруг случайно выключила звук, вдруг уведомление не пришло, вдруг он написал в другом приложении. Проверила. Ничего.\n\nВозвращаешься к сериалу, а там уже непонятно, почему героиня плачет. Перематываешь назад. И тут же опять берешь телефон.\n\nИ ты сидишь с этим желанием, а потом начинаешь с собой торговаться. Если до девяти не напишет, я больше не смотрю. Ладно, до половины десятого. Он, наверное, еще занят. Хотя в приложение заходил. Хотя я тоже захожу и сразу никому не отвечаю. Вот, сама все понимаю, чего тогда сижу.\n\nА ужин уже холодный. Ты идешь греть его, берешь телефон с собой и по дороге придумываешь подпись к тому самому видео. Чтобы легко получилось. Чтобы он ни за что не догадался, сколько времени ты сегодня его ждала.","caption":"Я каждый раз цепляюсь за это «просто попалось». Иногда девушка долго выбирает, что отправить, чтобы у него нашелся повод ответить. А потом еще перечитывает собственное сообщение: достаточно ли беззаботно получилось."},{"v":"живой","text":"Умное говно, которое вам подают под соусом психологии: «ты сама притянула себе такого мужика». Давайте так. Мы никого не притягиваем. Мы просто живем свою жизнь, мы не управляем потоками вселенной и не знаем, кто к нам придет. Самое опасное в этой фразе, что она заставляет копаться в себе в поисках причины чужого говна. А почему я его притянула? А что со мной не так? Может, у меня с мамой плохие отношения? Стоп. В ваших руках другое. Оставить этого человека в жизни или вышвырнуть его нафиг. Сколько времени вы позволили ему остаться и на каких условиях.","caption":""},{"v":"h3h4_staryy","text":"Он не пишет первым, и ты весь вечер проверяешь телефон.\n\nОткрыла чат. Закрыла. Через минуту опять открыла. Уже набрала «как день?», потом стерла. Ну потому что вдруг навязываешься. Вдруг он ответит из вежливости. Лучше подождать.\n\nА чего ты ждешь? Чтобы он тоже захотел поговорить? Да. И еще чтобы можно было наконец показать, как ты сама этого хочешь.\n\nВот он написал, и сразу можно отправить смешное видео, рассказать про день, спросить про встречу. Все это у тебя было готово еще два часа назад.\n\nКак будто скучать по нему можно только после его сообщения.","caption":"Бывает, даже подруге стыдно сказать, что ждешь: ей уже три раза объявила, что тебе все равно.\nЯ Юлия, психолог, работаю с девушками, которые только начинают отношения.\nПодписывайся, если хочется еще таких разговоров про влюбленность, тревогу и близость."},{"v":"zh2","text":"Ты сейчас смотришь это видео и ждешь, когда сверху появится уведомление от него?\n\nТы хотела спокойно провести вечер. Заказала еду, включила сериал, устроилась поудобнее. Но он весь день не пишет первым, и ты уже несколько раз открывала вашу переписку. Последнее сообщение твое. Вчерашнее.\n\nВидишь смешную картинку, сохраняешь, открываешь чат. И закрываешь. Вчера ты написала первая, сегодня опять ты, он, наверное, уже думает, что у тебя вообще никаких других занятий нет.\n\nИ вот ты сидишь с остывшей едой, сериал идет, герои куда-то переехали, ты пропустила, куда именно, потому что смотрела, когда он был в сети. Был недавно. Тебе ничего не написал.\n\nМеня здесь особенно огорчает, как быстро ты начинаешь ругать себя. Сидишь, подбираешь слова для одного сообщения так, будто он уже попросил оставить его в покое.\n\nНу ты, конечно, быстро себя записала в самые надоедливые девушки. Даже сообщение для этого отправлять не понадобилось.\n\nТебе хочется с ним поговорить.\n\nА он даже не знает, что ты хотела написать.","caption":"Иногда подруга пишет в тот же вечер, и ты отвечаешь ей сразу, без черновика. С ним даже обычное «как дела» успеваешь отредактировать до пустой строки.\nМеня зовут Юлия, я психолог, работаю с девушками, которые начинают отношения.\nПодписывайся, если хочется еще таких разговоров о близости и тревоге рядом с тем, кто нравится."},{"v":"zh_h7_staryy","text":"Мои дорогие девочки, которые ждут, когда он напишет первым, ну что, телефон уже протерли до дыр?\n\nВот ты поела, включила сериал, положила телефон рядом. Экраном вверх, конечно. Вдруг напишет. Через пару минут проверяешь, работает ли звук. Работает. Потом открываешь переписку, хотя уведомления не было. Зачем? Вдруг пропустила.\n\nОн был в сети? Был. И что, легче стало? Ну куда там. Теперь у тебя новый вопрос: если он заходил, почему мне ничего не написал? До этого ты хотя бы могла думать, что занят. Теперь приходится придумывать, чем именно он занят и почему это занятие интереснее тебя.\n\nТы листаешь вашу переписку и ищешь момент, в котором стала ему меньше нравиться.\n\nНайдешь какую-нибудь свою фразу. Обязательно найдешь. Даже обычное «как прошел день» при таком настроении начинает выглядеть подозрительно. Слишком заинтересованная. Слишком доступная. Ну все, выдала себя с головой, спросила человека про день.\n\nПочему?\n\nЯ каждый раз думаю, сколько значения мы можем втиснуть в этот маленький пустой экран. А ты вроде просто сидишь дома в носках, с остывшим чаем, и ждешь короткое «как ты?».\n\nИ это он еще ничего не написал.","caption":"Даже сообщение от доставки в такой вечер открываешь с надеждой. Потом злишься на несчастную пиццу за то, что она опять приехала вместо него.\nМеня зовут Юлия, я психолог, работаю с девушками, которые только начинают отношения.\nПодписывайся, если хочется еще таких разговоров о тревоге, симпатии и ожидании взаимности."}]},{"id":"r_tg_1","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","author":"Михаил","format":"reels_malysh","cards":[{"v":"zh_h7_staryy","text":"Хорошие мои, я психолог, и я хочу притормозить ваше «сейчас на работе поймут, что я ничего не умею».\n\nЧто?\n\nЧто именно не получилось?\n\nВот, допустим, сегодня на созвоне вас спросили, почему в отчете такая разница. Вы посмотрели на экран. Ответа сразу нет. Нужно открыть таблицу, проверить, вспомнить, откуда взялись данные. И вы говорите, что уточните и вернетесь с ответом.\n\nВсе.\n\nНо пока коллега задает следующий вопрос, у вас внутри уже достали большой штамп. На нем написано: «Ничего не умеет». И хлоп вам на весь рабочий день.\n\nЯ бы этот штамп пока накрыл колпачком. Пусть посидит тихонько.\n\nИ дальше вы идете пить чай, отвечаете в чате, продолжаете работать, но этот штамп уже с вами. Кто-то написал «можем обсудить?» и вы читаете это с готовым выводом: ага, заметили. Сейчас будут спрашивать, как я вообще сюда попал.\n\nХотя в сообщении пока только просьба обсудить.\n\nПоэтому чужой вопрос так пугает. Вы сами заранее решили, что он сейчас подтвердит.\n\nТак. Штамп закрыли. Мне пора.\n\nЧто конкретно вы сегодня не смогли сделать?","caption":"Уточняющий вопрос руководителя особенно трудно читать в чате: интонацию приходится додумывать самому.\nЯ Михаил, психолог, работаю с молодыми специалистами в офисе и на удаленке.\nЕсли хочется, напишите в комментариях слово «раскусят»."},{"v":"живой","text":"Если вы не можете перестать листать рилсы и заняться делом, я как клинический психолог хочу терапевтически спросить. А может быть, вы... ну... заебались? А? Я понимаю, вы уже записали себя в конченые. Но вдруг есть маленький шанс, что вы в ахуе от нагрузки, и мозг пытается залипнуть хоть на чем-то приятном. А? Думаете все-таки, что ленивая скотина? Записала. Ну и все же предлагаю попробовать выключить. Нет, не рилсы, не пугаемся. Бесконечный поток требований к себе. Как вам идея? Вдруг дело в нем. Так, навскидку.","caption":""},{"v":"zh3","text":"Милые мои, вы сейчас даже этот ролик смотрите и думаете, что остальные на работе умеют работать, а вы пока просто удачно притворяетесь?\n\nВот смотрите. Вы закончили отчет. Сидите дома за компьютером, отправляете файл руководителю, он пишет: «Спасибо, все понятно, забираю на встречу». И вы вроде бы можете закрыть ноутбук. Работу приняли.\n\nНо вам страшненько. Потому что вы знаете, как вы этот отчет делали.\n\nВы открывали прошлый отчет. Искали, как посчитать нужный показатель. Написали коллеге, правильно ли вы поняли вопрос. Потом еще исправили формулу, потому что сначала получили какую-то ерунду.\n\nИ теперь вы сидите перед этим «спасибо» и думаете: если бы руководитель видел, сколько я возился, он бы понял, кого вообще взял на работу.\n\nВы ведь сравниваете себя с коллегой, который, по вашему представлению, сразу все знает, сразу понимает задачу, открывает пустой файл и делает правильно. Причем желательно до обеда.\n\nОчень удобный коллега. Особенно потому, что вы никогда не видели, как он работает весь день.\n\nОн получил файл, с которым пойдет на встречу.\n\nЭтот файл собрали вы. Вместе со всеми своими вопросами и исправлениями.","caption":"Коллеги обычно видят готовый результат. Все ваши открытые вкладки видите только вы.\nКак вы объясняете себе удачно выполненную работу? Можно одним словом."},{"v":"h3h4_staryy","text":"Хорошие мои, вы боитесь, что на работе вас раскусят и поймут: вы ничего не умеете?\n\nПредставьте, внутри есть коробочка с такой надписью. Вы складываете туда все, что про себя знаете. Только, смотрите, что получается.\n\nСдали сложную задачу. Вам говорят: «Отличная работа». Вы уже тянетесь положить это в коробочку, но тут: «Да просто повезло. Тема знакомая попалась». Все, убрали.\n\nА ошибку положили. Аккуратненько. Даже маленькую.\n\nКонечно, с такой коробочкой страшно идти на совещание.\n\nДавайте положим туда и выполненную задачу. Вместе со всеми вашими «повезло».\n\nЭту работу все равно сделали вы.","caption":"После повышения даже обычный вопрос коллеге может казаться признанием: «Зря вы меня сюда взяли».\nЯ Михаил, психолог, работаю со специалистами от 25 до 35 лет в офисе и на удаленке.\nЕсли знакомо, напишите в комментариях «повезло»."},{"v":"zh2","text":"Мои хорошие, я сейчас сижу с телефоном, только что увидел совет: боитесь, что на работе вас раскусят, просто вспоминайте свои достижения. И меня прямо задело это «просто». Вспомните проекты, выпишите благодарности, перечитайте похвалу начальника, получите грамоту, кубок, пусть директор торжественно внесет вашу фотографию в переговорную.\n\nХочется спросить: а если вы и тогда решите, что фотограф удачно поймал единственный момент, когда у вас было умное лицо?\n\nДавайте я про маленького сторожа расскажу. Представьте, у вас внутри сидит такой сторож и собирает сведения о том, как вы работаете. Очень серьезный.\n\nИ вот вы сегодня показываете отчет. Вчера до вечера проверяли расчеты, нашли расхождение, переделали таблицу, утром еще раз все посмотрели. Начальник говорит: спасибо, теперь понятно, почему мы теряем деньги на этом проекте.\n\nНо сторож уже объясняет: таблицу помогла собрать коллега, данные вообще прислали готовые, начальник сегодня добрый. И потом, что тут сложного? Любой бы справился.\n\nА потом вы замечаете, что на последнем слайде оставили прошлогоднюю дату. И вот тут сторож сразу оживился. Вот! Нашел! Он же говорил, что вы ничего не умеете.\n\nВы сидите перед ноутбуком, ручки уже холодные, коллеги обсуждают следующий проект, а вы пытаетесь вспомнить, кто успел увидеть эту дату.\n\nВот что меня здесь особенно задевает: вы действительно работали, думали, проверяли, и к вечеру сами рассказываете об этом дне так, будто только перепутали дату.\n\nВы нашли, да. Коллега помогала. Вы тоже работали.","caption":"Особенно трудно бывает отвечать на вопрос о своих результатах на собеседовании: вы перечисляете задачи и тут же объясняете, кто вам помогал.\nЯ Михаил, психолог, работаю с теми, кто тревожится из-за работы в офисе и на удаленке.\nПодписывайтесь, если хочется еще таких объяснений: здесь говорю о работе, тревоге и сомнениях в себе."}]},{"id":"r_tg_1_2","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","author":"Михаил","format":"reels_monolog","cards":[{"v":"zh2","text":"Б: Вы можете хорошо работать и бояться, что вас раскусят.\nА: Тогда почему я каждый отчет проверяю до тошноты? Все уже отправили, ушли ужинать, а я сижу, открываю исходную таблицу, сверяю суммы. Потому что руководитель спросит, откуда взялась цифра, и я зависну.\nБ: И что он тогда про вас решит?\nА: И вот сейчас он задаст обычный вопрос, а я даже ответить нормально не смогу.\nБ: Что было с последним отчетом?\nА: Отправил. Руководитель написал, что все хорошо, можно показывать заказчику. Но я же перед этим весь вечер проверял, даже ужин остыл рядом с ноутбуком.\nБ: Чему вы приписали хороший результат?\nА: Ну, тому, что перепроверил.\nБ: И следующий отчет вы проверяете еще дольше?\nА: До следующего задания.\nБ: А хорошо выполненную работу себе засчитываете?\nА: Получается, вообще ни разу. Я же каждый раз говорю себе, что просто вовремя все проверил. Поэтому после удачного отчета я все равно ничего не умею, просто пока никто не заметил. И к следующему снова готовлюсь так, будто меня сейчас поймают.\nБ: Именно.","caption":"Меня особенно цепляет, сколько вечеров человек может потратить, чтобы потом сказать про свою работу: «Ну там любой бы справился». Коллегам достается готовый отчет, домашним обещание скоро освободиться.\nЯ Михаил, психолог, работаю с теми, кто трудится в офисе и на удаленке.\nМожете написать в комментариях свое привычное оправдание успеха."},{"v":"живой","text":"Иногда нужно очень сильно охуеть, чтобы жизнь начала меняться. Охуеть это когда ты просыпаешься и видишь все как есть, и тебе противно, потому что ты наконец поняла правду. Больно, неприятно, но с этого все и сдвигается. Охуеть это когда видишь свой вклад: ты это выбирала, терпела и ничего не делала. Хорошая новость в том, что раз когда-то ты это выбрала, теперь можешь от этого отказаться. Охуеть это когда перестаешь ждать, что он изменится, деньги упадут с неба, проблемы решатся сами. Охуеть это когда выбираешь себя, даже если другим от этого неудобно. Эгоизм тут ни при чем. Ты просто вспомнила, что ты тоже есть.","caption":""},{"v":"zh3","text":"Недоверие к себе. Это когда вы отправляете рабочий отчет, который сами собрали, проверили, переделали после обсуждения, и теперь сидите перед открытым чатом, потому что руководитель начал что-то печатать. И вот приходит сообщение: «А откуда данные в последнем столбце?» Но вы уже думаете, как будете объяснять дома, почему вам снова нужно искать работу.\n\nОтчет получился, потому что задача простая, коллега подсказал, времени дали достаточно, похожую таблицу уже делали раньше. Меня здесь особенно задевает, как старательно можно перечислять обстоятельства своей работы и при этом вообще не учитывать, что работали вы.\n\nЭто когда вы замечаете в том же отчете опечатку и вот тут уже никаких обстоятельств не учитываете. Тут вы сразу готовы поверить, что ничего не умеете. Ну подумаешь, весь день собирали данные, сверяли, уточняли. Зато месяц написали неправильно.\n\nЯ в работе часто замечаю именно это: вы можете подробно рассказать, что сделали, и тут же объяснить, почему этого недостаточно. Вечером руководитель пишет, что отчет согласовали и завтра можно отправлять заказчику. Вы отвечаете «отлично», закрываете ноутбук и думаете: главное, чтобы в следующий раз тоже повезло.","caption":"В работе я часто спрашиваю, какой результат вы согласились бы признать своей заслугой. Иногда с ответом сложнее, чем с самой задачей.\nЯ Михаил, психолог, работаю с теми, кто тревожится о себе и своей работе в офисе или на удаленке.\nСохраните, если узнаете свои мысли после рабочего дня."},{"v":"zh_h7_staryy","text":"Обнуление. Вот как я называю эту привычку считать все свои рабочие результаты случайностью, и я считаю ее очень несправедливой к себе.\n\nОбнуление это когда вы отправляете отчет, который собирали весь день, руководитель пишет, что все хорошо, можно отдавать дальше, и вы сразу находите объяснение, почему это ничего про вас не говорит. Задача была простая, данные уже лежали в папке, коллега подсказал, как лучше оформить.\n\nОбнуление это когда в том же отчете находят одну неточность, и тут вы уже совершенно уверены, кто за нее отвечает. Вы. Без оговорок про усталость, спешку, путаную задачу. Причем я сейчас чуть в сторону скажу: отвечать за ошибку вполне нормально, ее можно исправить. И что, после исправления легче? На минуту. Потом вы вспоминаете, что ошибку успели увидеть.\n\nПотому что этот опыт вы каждый раз списываете.\n\nОбнуление это когда из всего рабочего дня вы выбираете ту самую неточность, вспоминаете ее вечером, пока чистите зубы, и отчет, который вы сделали и который уже используют, целиком исчезает из вашей оценки себя. Остается только эта ошибка. И мысль: вот теперь они точно поняли, кого наняли.","caption":"Иногда похвалу еще и неловко пересказать близким: будто вы хвастаетесь. Зато рабочую ошибку можно обсуждать весь вечер.\nМеня зовут Михаил, я психолог, работаю с людьми в офисе и на удаленке.\nЕсли хотите прийти на консультацию, напишите мне в личные сообщения."},{"v":"h3h4_staryy","text":"«На работе меня скоро раскусят. Просто пока задачи попадались легкие».\n\nВы подготовили отчет, руководитель доволен. И вы тут же: «Да ладно, там любой бы справился». Хотя вчера сидели над ним весь вечер.\n\nВсе, что получилось, сразу списываете: задача простая, коллега подсказал, повезло.\n\nИ что, следующий удачный отчет поможет? Вы ведь и ему найдете объяснение.\n\nВы каждый раз меняете условия зачета, как только справились. Что вообще должно получиться, чтобы вы это себе засчитали?","caption":"В резюме бывает проще признать свои достижения: там хотя бы приходится написать, что именно вы сделали.\nМеня зовут Михаил, я психолог, работаю со специалистами от 25 до 35, в офисе и на удаленке.\nПодписывайтесь, если хочется еще таких разборов."}]},{"id":"r_car_1","topic":"как поддержать подругу с депрессией и не сделать хуже","author":"Ольга","format":"reels_spisok","cards":[{"v":"h3h4_staryy","text":"Четыре реакции подруги с депрессией, которые легко принять на свой счет.\nПервое. Она молчит в ответ на ваше «Как ты?». Чтобы ответить, приходится понять, как она, подобрать слова, еще и вас поберечь. Сообщение короткое, работы дофига.\nВторое. Раздражается на «Скажи, чем помочь». «Блядь, мне теперь еще придумать тебе задание».\nТретье. Отказывается от встречи. Даже с любимой подругой нужно разговаривать, реагировать, как-то участвовать. Сил на это может просто не быть.\nЧетвертое. Сама вас успокаивает: «Все нормально, честно». Ей плохо, и она еще переживает, что вы расстроитесь.\nМожно написать: «Оставлю тебе еду у двери. Отвечать необязательно».","caption":"«Я завтра заеду» тоже лучше согласовать: неожиданный визит может оказаться дополнительной нагрузкой. Достаточно короткого «Можно оставить пакет у двери?».\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хочется, напишите свой пункт: какая поддержка вам подходит?"},{"v":"живой","text":"Вот что люди с депрессией хотели бы, чтобы вы понимали. Первое. Депрессия не выбор и не вопрос силы воли. Человек не может просто взять себя в руки. Второе. Когда он отвечает через несколько дней или в последний момент отменяет встречу, дело в его состоянии. На вас он не злится. Третье. Причины не всегда видны со стороны. Бывает, снаружи все нормально, и от этого ему не легче. Четвертое. Вам может казаться, что он плохо старается. Но встать с кровати, принять душ, ответить на сообщение сейчас для него как мешки ворочать. И пятое. Это все тот же человек. Его характер и чувства никуда не делись, просто ему очень тяжело. И сейчас ему поддержка нужна больше, чем когда-либо.","caption":""},{"v":"zh3","text":"Четыре вещи, которые важно понимать, если у вашей подруги депрессия и вы хотите ее поддержать, но уже боитесь написать что-нибудь лишнее.\nПервое, она может любить вас и оставлять сообщения без ответа. Вы спросили, как она, она прочитала, и дальше тишина.\nВторое, она отменяет даже то, чего сама ждала. Допустим, вы собрались в кино, она выбрала фильм, купила билет, а перед выходом пишет, что останется дома. Но, блядь, ей сейчас еще и доказывать придется, что она правда не может.\nТретье, она может растеряться от вашего «скажи, чем помочь». Чтобы ответить, ей нужно понять, чего она хочет, решить, сколько вашего времени можно занять, и попросить. А она сегодня с обедом определиться не смогла. Конкретное предложение привезти еды ей бывает проще принять.\nЧетвертое, она смеется с вами, а завтра снова не может встать. Только ей после этого бывает страшно признаться, что утром опять плохо. Вы ведь так обрадовались. Чтобы получить поддержку, вашей подруге не нужно каждый раз доказывать, насколько ей плохо.","caption":"Если подруга говорит, что хочет умереть, отнеситесь к этому серьезно: при непосредственной опасности оставайтесь с ней и вызывайте экстренную помощь.\nМне важно, чтобы вы тоже могли обратиться за поддержкой.\nНапишите в комментариях, какую помощь вам было легче всего принять."},{"v":"zh2","text":"Четыре реакции подруги с депрессией, из-за которых вы можете решить, что ваша поддержка ей вообще не нужна.\nПервое, она пропадает именно после вашего «пиши в любое время». Вы искренне хотите помочь, она читает и думает: с чем писать?\nВторой признак, от ваших предложений ей хочется плакать. А она сидит с телефоном в руке и прикидывает: надо помыть голову, найти чистую одежду, потом улыбаться, поддерживать разговор. Блядь, вот это особенно тяжело: очень хотеть увидеть подругу и понимать, что даже собраться сейчас трудно.\nТретье, она защищает от вас свои рабочие успехи. На работе кое-как собралась, провела созвон, получила похвалу. Рассказала вам, услышала «ну вот, значит, все уже хорошо» и замолчала. Потому что после созвона она легла и до вечера даже поесть не встала.\nЧетвертое, она может засмеяться рядом с вами, а вечером снова написать, что ей ужасно.\nЕй придется доказывать вам, что ей плохо, даже после того, как вы вместе посмеялись?","caption":"Я бы еще договорилась, можно ли приходить без гостевого режима: без уборки к моему приходу, угощения и извинений за посуду. Иногда человек отменяет встречу, потому что сил принимать гостей совсем нет.\n\nЯ Ольга, психолог, работаю с девушками и женщинами.\nНапишите в комментариях свой пункт: какая поддержка вам помогла."},{"v":"zh_h7_staryy","text":"Пять признаков, что вашей подруге с депрессией тяжело даже от того, чем вы хотите ее порадовать.\nПервое. Ей тяжело даже разговаривать. Голос тихий, ответы короткие, она быстро устает, и вы начинаете думать, что разговор ей неприятен.\nВторое. Она оставляет сообщения без ответа, хотя сама говорила, что ей одиноко. Допустим, вы написали: пойдем в субботу гулять? Она открыла сообщение и замолчала.\nТретье. Она отдыхает и продолжает чувствовать себя разбитой. Может провести выходной дома и в понедельник с трудом подняться. Меня бесит совет просто хорошенько выспаться. Блядь, человек уже пробует.\nЧетвертое. Ей трудно принимать решения о деньгах, даже небольших. Покупка продуктов может зависнуть, потому что нужно выбрать, сравнить, решить, чего вообще хочется.\nПятое. Хорошие новости могут ее расстроить. Вы нашли билеты на концерт ее любимой группы, а она плачет. Потому что помнит, как раньше ждала таких вечеров, и сейчас почти ничего не чувствует. Еще и видит ваше разочарование.\nСколько пунктов вы узнали у своей подруги?","caption":"Я бы отдельно обсудила с подругой, можно ли писать ей без ожидания ответа. Иногда договоренность «я буду присылать тебе что-нибудь, отвечай, когда сможешь» снимает лишнее напряжение.\nЯ Ольга, психолог, работаю с девушками и женщинами от двадцати до сорока.\nЕсли хотите, напишите в комментариях свой пункт."}]},{"id":"r_car_1_2","topic":"как поддержать подругу с депрессией и не сделать хуже","author":"Ольга","format":"reels_rol","cards":[{"v":"живой","text":"Служба поддержки встретившихся со взрослой жизнью, здравствуйте. Что у вас случилось? Девушка, дышите спокойно. Так. Вы хотите быть успешной бизнесвумен и еще, чтобы вас содержали. Поняла. И чтобы любили такой, какая вы есть, и похудеть до сорока пяти. Так. А еще никому ничего не доказывать, но чтобы бывший увидел и захлебнулся. Поняла. И мужчину с характером, но чтобы рот не открывал и делал, что скажете. А, еще на детокс-ретрит, и бургер вот этот съесть тоже не против. И отношения без драмы. Но чтобы он бежал за вами под дождем и всем за вас морды набил. Вот, уже спокойнее говорите. Все нормально, девушка, не вижу никаких противоречий. Обращайтесь.","caption":""},{"v":"h3h4_staryy","text":"Если у подруги депрессия, главное, чтобы после вашей поддержки она выглядела повеселевшей. Я подготовила инструкцию. Отказывается встретиться? Скажите, что ради нее отменили планы. Теперь у нее есть мотивация. Отвечает одним словом? Напишите: «Ты на меня обиделась?» Пусть объяснит, успокоит вас. Плачет? Расскажите, как вам тяжело видеть ее такой. Получится взаимная поддержка, прекрасно. Говорит, что даже душ принять сил нет? Предложите вечеринку. Душ, одежда, такси, люди. ВЕСЕЛО же. И обязательно спросите: «Ну что, я тебя хоть немного отвлекла?» Вы же, блядь, старались. Так, улыбнулась? Отлично, помощь оказана. Можно расходиться.","caption":"Можно написать: «Привезу еды, оставлю у двери. Отвечать и встречать меня не нужно».\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хотите прийти на консультацию, пишите в директ слово «разбор»."},{"v":"zh3","text":"Девочки, начинаем тренинг «Как поддержать подругу». Садитесь, я научу вас помогать так, чтобы уже завтра подруга написала: спасибо, мне лучше, дальше я сама. И больше вообще ничего вам не рассказывала. Очень удобно, сразу виден результат.\n\nИтак, у подруги депрессия, вы пришли ее навестить. Она открыла дверь в той же футболке, в которой вы видели ее в прошлый раз, на кухне чашки, продукты из доставки стоят в пакете. Вот тут сразу начинаем с бодрого: «Ну ты себя совсем запустила».\n\nПрекрасное начало. Подруга наверняка до вашего прихода считала, что у нее дома охуенно чисто.\n\nИ, девочки, самое главное: ждите улучшения при вас. Вы же пришли помогать. Улыбнулась вашей шутке? Все, можно выдохнуть: «Вот видишь, можешь же, когда захочешь».\n\nЕсли вдруг заплакала, срочно вспоминайте, у кого жизнь тяжелее. У вас наверняка найдется знакомая с кредитом, ремонтом и начальником, который пишет ночью. Чем подробнее расскажете, тем быстрее подруга поймет, что расстраиваться ей совершенно незачем. Слезы продолжаются? Можно немного обидеться. Вы старались, принесли еду, отменили свои дела, а она сидит и плачет. Где, блядь, положительный отзыв?\n\nВсе, я сейчас выйду из роли. Меня злит, когда от нее требуют еще и показать, как хорошо ей помогли.\n\nПредложить помочь записаться к психиатру, сходить вместе, если ей страшно. Если она говорит, что собирается причинить себе вред, оставайтесь рядом и вызывайте экстренную помощь.\n\nЗа ужин и ваше присутствие она может быть благодарна. Сил улыбнуться у нее сегодня может не быть.","caption":"Иногда подруга перестает рассказывать о своем состоянии, потому что каждый разговор заканчивается ее обещанием завтра собраться. Я бы хотела, чтобы рядом с близкими можно было честно сказать: сегодня все еще тяжело.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 20 до 40.\nОтправьте тому, кто сейчас старается поддержать подругу."},{"v":"zh_h7_staryy","text":"Так, подруга с депрессией? Я научу вас поддерживать, проходите. Лежит, сил даже помыться нет? Отлично, предложите пробежку. На душ сил нет, на пробежку сейчас появятся. Я бы еще марафон записала. Сообщения читает, ответить трудно? Шлите вопросительные знаки. Блядь, ну на десятый точно взбодрится. Отменила встречу, потому что весь день собиралась и выдохлась? Срочно организуйте сюрприз с гостями. Пусть еще всем чай сделает, сразу почувствует себя нужной. Говорит, что всем мешает? Тут обязательно расскажите, как вы измотались, пока ее поддерживали. Чтобы уж наверняка поняла. Еду привезти? Посидеть рядом спокойно? Ну что вы, так она пропустит нашу воспитательную программу. У меня тут комплексный подход, я всем довольна. Все, идите. И скажите ей, чтобы к вашему приходу уже повеселела.","caption":"Иногда предложение «могу заказать вам ужин, отвечать сейчас необязательно» дает человеку возможность принять помощь без долгого разговора.\nЯ Ольга, психолог, работаю с девушками и женщинами, которым от двадцати до сорока.\nЕсли хотите прийти на консультацию, пишите в директ слово «разбор»."},{"v":"zh2","text":"Девочки, добро пожаловать на инструктаж для подруг. Куртки можете оставить, мы быстро. У нас человек третий день сообщения не открывает, придется срочно объяснить ему, как пользоваться телефоном.\n\nНачинаем с переписки. Вы написали, она молчит. Сразу отправляем вопросительные знаки, потом голосовое, потом еще одно, где вы уже обиделись. Я бы еще позвонила по видео. Пусть покажет лицо, мы проверим, достаточно ли убедительно она выглядит.\n\nТеперь представим: вы приехали к ней, стоите в прихожей, пакет с продуктами режет пальцы, она открывает в той же футболке, в которой была позавчера. На кухне чашка с засохшим чаем, хлеб прямо в пакете на столе, мусор приготовлен у двери и так там и остался. Тут главное сразу сказать: господи, я бы в таком сраче тоже загрустила. Отлично зашли.\n\nСадимся пить чай. Она говорит, что даже любимый сериал включать бессмысленно, все равно ничего не радует. Тут у нас готов целый развлекательный отдел: стендап, танцы, прогулка, поездка за город, собака, еще одна собака, ремонт. На каждое предложение она качает головой? Обязательно произнесите: тебе просто НРАВИТСЯ страдать.\n\nИ финальный прием: спрашиваем, чем помочь. Она отвечает, что не знает. Ну тут, блядь, можно спокойно уходить. Техническое задание отсутствует, помощь оказана в полном объеме.\n\nЕсли подруга говорит, что хочет умереть, спросите прямо, собирается ли она причинить себе вред. При непосредственной опасности оставайтесь рядом и вызывайте экстренную помощь.\n\nИ, пожалуйста, суп можно отдать до того, как человек повеселеет.","caption":"Меня особенно цепляет, когда подруга начинает извиняться за то, что с ней теперь скучно. Сидит у себя дома и переживает, что плохо вас развлекает.\nЯ Ольга, психолог, работаю с девушками и женщинами от двадцати до сорока.\nОтправьте тому, кто сейчас переживает за подругу."}]},{"id":"r_mif_2","topic":"«тревогу надо просто перестать накручивать»","author":"Юлия","format":"reels_rol","cards":[{"v":"zh3","text":"Слушай, это я, твоя подруга, сейчас научу тебя спокойно жить. Я твое сообщение прочитала и сразу поняла: тебе надо просто перестать накручивать. Видишь, как удобно, даже встречаться не пришлось, я тебе голосовым помогла.\n\nЧто у вас там случилось? Ты спросила, как у него день, он ответил «нормально», и теперь ты думаешь, что он на тебя обиделся?\n\nТы уже разогревала ужин два раза, потому что сидишь с телефоном и перечитываешь переписку?\n\nНет, я тебя внимательно слушаю. Ты говоришь, что у тебя само получается возвращаться к переписке, даже когда телефон лежит экраном вниз. Ну переверни его еще раз. Убери подальше. Только звук оставь, вдруг он напишет. Хотя, если будешь ждать звук, тоже начнешь накручивать. Выключи звук. Но тогда придется проверять. Слушай, ну ты как-то сама определись, я за тебя все решить не могу.\n\nЧто значит, от моих советов тебе еще хуже? Подожди, я же ничего плохого не сказала. Я сказала перестать накручивать. Это хороший совет. Короткий, понятный, бесплатно.\n\nПолучается, тебе осталось всего ничего: перестать тревожиться, перестать себя ругать и перестать расстраиваться, что пока ничего из этого не вышло. Видишь, мы уже почти разобрались.\n\nТы замолчала. Полегчало? Ну слава богу. А то я уже думала, чем еще тебе помочь. Я же переживаю за тебя, правда. Мне хочется, чтобы ты могла вот так взять и спокойно провести вечер. Поэтому в следующий раз сразу мне пиши, без этих долгих объяснений. Можно одним словом: «тревожно». Я тебе сразу отвечу: «перестань». Сохрани мое голосовое, будешь включать, когда понадобится. И обязательно напиши потом, что помогло. Мне будет приятно.","caption":"Иногда после такого разговора ты еще и просишь прощения у подруги за испорченный вечер.\nМне грустно, когда за поддержкой становится стыдно обращаться.\nНапиши в комментариях свой вариант «полезного» совета."},{"v":"живой","text":"Люди красивые, пледов много, чай горячий, салфеток достаточно. Про телефон забудете. Плакать можно, молчать разрешается. Тренер огонь, сервис присутствует, базара нет, цена достойная. Случайных здесь нет, места быстро заканчиваются. (в сторону) Кто-нибудь нажал на кнопочку или мы не снимали?","caption":""},{"v":"zh_h7_staryy","text":"Добро пожаловать, я твоя тренер по спокойствию. Тревожишься? Просто перестань себя накручивать. Все, основную часть мы прошли. Теперь практика. Написала человеку, он молчит, ты переживаешь? Прекрасно, запрети себе переживать. Получилось? Как снова думаешь об этом? Я же дала инструкцию. Значит, плохо запрещаешь. Добавь строгости. Теперь следи за каждой мыслью, чтобы ни одна тревожная не проскочила. Даже ночью. Особенно ночью, там у тебя вообще никакого контроля. Устала? Конечно, спокойствие требует дисциплины. Я лично считаю, что ты еще слишком бережно с собой разговариваешь. Попробуй добавить, что нормальные люди уже давно бы успокоились. Вот, теперь еще и стыдно. Отлично, будет чем заняться вместо тревоги. Все, иди. И чтобы к следующему занятию никаких переживаний.","caption":"Особенно удобно прислать «просто успокойся» и пропасть до завтра.\nЯ Юлия, психолог, работаю со взрослыми, которым тревога мешает жить.\nЕсли хочется, напиши в комментариях свой пункт из таких советов."},{"v":"zh2","text":"Я твой тренер по спокойствию, и сегодня я научу тебя просто переставать накручивать. Так, что у тебя? Начальница вечером написала: «Завтра надо поговорить». И ты теперь думаешь, что тебя уволят? Ну вот зачем ты об этом думаешь? Не думай. Что значит, мысль сама возвращается? Ты ей скажи, что у нас занятие оплачено и мы сейчас заняты спокойствием. Прекрасно. Мне кажется, ты недостаточно хочешь спать. А, ты уже легла? Телефон поставила на зарядку, потом сняла, открыла переписку, посмотрела, была ли она в сети? Все. Нет? Подушку перевернула, воды попила, опять взяла телефон? Ты взрослый человек, у тебя работа, банковское приложение, контейнеры с крышками, ты способна управлять своей жизнью. Давай хотя бы одной мыслью поуправляем. Отмени ее. Кнопка где? Ну я же образно говорю, зачем ты все усложняешь. Только телефон для записи не бери, ты опять полезешь смотреть, прочитала ли начальница твое «Хорошо». Да, я поняла, она прочитала и ничего не ответила. И что? Ты же написала «Хорошо». На «Хорошо» можно ничего не отвечать. Хотя точку ты, конечно, зря поставила, выглядит суховато. Ой, только сейчас не начинай про точку, мы с тобой уже почти успокоились. Просто лежи. Глаза закрой. Расслабь лицо. Ты чего плачешь? Я же тебе помогаю. Давай так: утром напишешь мне, что все обошлось, и я выложу твой отзыв. Если все обошлось, значит, мой метод работает. Если тебя уволят, значит, ты все-таки плохо переставала.","caption":"Меня злит, когда после такого совета человек еще и извиняется за то, что ему страшно.\nТы можешь решить, будешь ли писать начальнице ночью, но заснуть по команде получается далеко не всегда.\nЯ Юлия, психолог, работаю со взрослыми, которым тревога мешает жить.\nЕсли знакомо, напиши в комментариях «перестань»."},{"v":"h3h4_staryy","text":"Тебе не отвечают на сообщение, и ты тревожишься? Так, сейчас научу. Просто перестань накручивать. Как перестать? Ну просто. Ты же сама начала, сама и заканчивай. Телефон убери. Думаешь о сообщении без телефона? Тогда мысли убери тоже. Почему он молчит, почему был в сети, в чем я виновата? Вот это все выключай. Кнопки нет? Странно, в инструкции написано «просто». Так. Теперь ты еще и злишься на себя, что опять накрутила? Отлично, значит, ответственность приняла. Следующий пункт: успокойся немедленно. Нам тут тревожные люди портят статистику легкости метода.","caption":"После «сама себя накрутила» бывает стыдно даже попросить поддержки, будто сначала надо доказать, что ты пыталась успокоиться.\nЯ Юлия, психолог, работаю с тревожными людьми от 20 до 40.\nНапиши свой пункт из инструкций «просто успокойся»."}]},{"id":"r_mif_2_2","topic":"«тревогу надо просто перестать накручивать»","author":"Юлия","format":"reels_monolog","cards":[{"v":"zh3","text":"«Ты всегда можешь успокоиться, если просто перестанешь себя накручивать». Меня раздражает это «всегда».\n\nВот тут бывают два разных случая.\n\nДопустим, он задержался и не написал.\n\nПотом он отвечает: затянулось на работе. При этом ты знаешь: за сам разговор он тебя наказывать не будет.\n\nА теперь тот же вечер, тот же телефон. Только вчера он сказал: еще раз спросишь, где я, можешь собирать вещи. Раньше он уже выгонял тебя ночью, забирал ключи, переставал отвечать после ссоры, а потом смеялся, когда ты рассказывала, как испугалась.\n\nИ сегодня ты думаешь, можно ли вообще ему написать. Потому что помнишь, что случилось в прошлый раз. Ты удаляешь набранное сообщение и сидишь одетая, хотя давно пора спать.\n\nКогда такой девушке предлагают просто перестать накручивать, я злюсь.\n\nТы отвечаешь за то, как разговариваешь с ним. Он отвечает за свои угрозы. Твоя тревожность эту ответственность с него не снимает.\n\nВ таком случае нужна помощь с безопасностью: близкий, у которого можно остаться, специалист по домашнему насилию, психолог.\n\nВ первом случае ты ждешь сообщения и боишься, что тебя разлюбили. Во втором ты сидишь с ключами в кармане, потому что боишься, что тебя снова выставят за дверь.","caption":"Иногда ты рассказываешь подруге только, сколько сообщений ему отправила. А про то, что он сказал тебе вчера, умалчиваешь, потому что стыдно снова это обсуждать. Мне хочется услышать и эту часть."},{"v":"zh_h7_staryy","text":"Меня раздражает совет «просто перестань себя накручивать», потому что тревожному человеку после него приходится еще и оправдываться за свою тревогу.\n\nИ вот тебе говорят: хватит накручивать. Что ты начинаешь спрашивать у себя? Почему я опять все испортила? Почему все могут спокойно жить, а я даже здесь устраиваю проблему? Что со мной такое, если мне объяснили, что надо прекратить, а я продолжаю?\n\nВот. Тебе уже и тревожиться стыдно, и сказать об этом стыдно, потому что ответ ты знаешь заранее. Опять накрутила.\n\nЯ бы вообще осторожнее обращалась с этим «сама». Сама придумала, сама испугалась, сама теперь разбирайся. Очень удобная фраза для того, кто хочет побыстрее закончить разговор. Тебе после нее еще долго приходится разговаривать с собой, причем тем же самым тоном.\n\nИ я сейчас чуть в сторону скажу. Особенно странно слышать этот совет от людей, которые тут же начинают выяснять, почему ты такая напряженная, почему молчишь, почему у тебя такое лицо. Получается, переживать ты должна еще и так, чтобы никто ничего не заметил. Спокойно, аккуратно, желательно вообще без признаков того, что тебе трудно.\n\nУспокоилась? Нет?\n\nНо за то, чтобы по чужой команде перестать чувствовать тревогу, ты не отвечаешь.","caption":"Я бы убрала слово «просто» из многих психологических советов. Оно обещает легкость, а потом человеку приходится объяснять, почему у него опять не получилось.\nЯ Юлия, психолог, работаю с тревожными людьми от двадцати до сорока.\nЕсли захочешь прийти на консультацию, ссылка на запись в шапке профиля."},{"v":"zh2","text":"Меня раздражает совет «Просто перестань себя накручивать». Ну правда, если бы ты могла просто взять и выключить тревогу, ты бы уже это сделала.\n\nВот это «ты же сама понимаешь» меня особенно задевает. Да, понимаешь. Ты вообще можешь прекрасно понимать, что близкий человек занят, что у него работа, что он ответит позже. И при этом бояться, что он сердится, что ты ему надоела, что он больше не хочет с тобой общаться. Ты все разумные объяснения уже перебрала. Иногда даже вслух себе их повторила. И все равно тревожно.\n\nКогда тебе тревожно, ты можешь написать близкому двадцать сообщений, потребовать немедленного ответа, обвинить его в равнодушии. За эти действия ты отвечаешь. Другой человек может сказать, что ему тяжело от такого общения, может отказаться постоянно быть на связи. У него есть такое право, даже когда тебе страшно.\n\nЯ против того, чтобы человек извинялся уже за само свое состояние. Можно обсуждать, как ты поступила, что сказала, чем обидела, что теперь нужно исправить.\n\nТы отвечаешь за то, как обходишься с людьми, когда тебе страшно. За само чувство страха ты перед ними не виновата.","caption":"Иногда человек уже молчит о своей тревоге, потому что заранее знает, что ему ответят. И окружающим кажется, что он наконец успокоился.\nМеня зовут Юлия, я психолог, работаю со взрослыми, которым трудно справляться с тревогой.\nОтправь тому, кто устал слышать «просто не накручивай»."},{"v":"h3h4_staryy","text":"«Он не отвечает? Просто перестань себя накручивать». Как будто ты сидела спокойно и решила: так, чем бы испортить себе вечер?\n\nТы видишь прочитанное сообщение, ждешь, открываешь переписку. Потом вспоминаешь: надо перестать накручивать. И начинаешь проверять уже себя. Почему я опять тревожусь? Почему не могу спокойно подождать? Что со мной такое?\n\nОн молчит. И ты опять не справилась с заданием быть спокойной.\n\nТы отвечаешь за свои поступки: что напишешь, что скажешь, будешь ли обвинять человека. А с этим «просто перестань» приходится еще оправдываться перед собой за каждую страшную мысль.\n\nКак будто тревога теперь еще и проступок.","caption":"Иногда после слов «возьми себя в руки» хочется еще и спрятать телефон, чтобы никто не видел, как часто ты его проверяешь. Стыдно становится даже ждать ответа.\nМеня зовут Юлия, я психолог, работаю с тревожными людьми от 20 до 40.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"живой","text":"Выбирай доброго. Если ты сейчас в поиске, ходишь на свидания, у меня для тебя один совет. Выбирай доброго человека. Самый яркий и самый остроумный пусть подождут. И я не про того, кто всегда удобный и на все согласен. Я про того, кто умеет быть внимательным, заботится, замечает и не хочет делать больно даже в ссоре. Сарказм, дерзость, флирт это весело, как смотреть на фейерверк. Но когда станет сложно, когда ссора, когда стресс, сарказм будет совсем не в кассу. Фейерверк впечатляет. А когда темно и холодно, хочется сидеть у костра, в тепле. Подписывайся, тут про отношения без сказок.","caption":""}]},{"id":"r_rod_1","topic":"мама обижается, если я не звоню каждый день","author":"Ольга","format":"reels_monolog","cards":[{"v":"zh3","text":"Вы сейчас ролик смотрите и краем глаза проверяете, сколько времени, потому что маме еще не позвонили?\n\nЯ злюсь, когда вижу советы вроде «ну позвони, тебе что, сложно». Сидите вечером на кухне, ужин уже разогрели, телефон рядом, и вроде можно поесть, посмотреть что-нибудь, просто помолчать. Но вы помните, что вчера мама сказала: «Ну ладно, раз тебе некогда».\n\nИ сегодня вы звоните пораньше. Чтобы снова этого не услышать.\n\nИ вот это «тебе что, сложно» меня особенно бесит. Блять, вы уже собственный ужин согласовываете с тем, успеет ли мама расстроиться.\n\nА во вторник вы устали. Во вторник вам просто нечего сказать.\n\nНо пропустить вторник нельзя, потому что в среду вы услышите: «Я уж думала, ты про меня забыла». И будете перечислять, что делали, почему закрутились, почему поздно освободились. Хотя телефон вы вчера держали в руках. И ролики смотрели. И подруге ответили.\n\nВот за подругу вы себя отдельно доедаете. Ей, значит, написать смогли.\n\nА сегодня в девять вечера будете объяснять маме, куда вы вчера пропали.\n\nВы никуда не пропали. Вы вчера были дома.","caption":"Иногда мама сама заканчивает разговор словами «ну все, отдыхай». А на следующий вечер вы опять спешите позвонить до девяти, даже если еще едете домой. И заранее придумываете, что сегодня рассказать."},{"v":"zh_h7_staryy","text":"Девочки, которые звонят маме каждый день, чтобы она не обиделась, я вас уже по первому «ой, надо набрать» узнаю. Мои хорошие, у вас там телефон или журнал посещаемости?\n\nВот обычный вечер. Вы пришли домой, поставили макароны, телефон на зарядке в другой комнате. Поели, полезли за чистой футболкой, вспомнили про стирку. Потом берете телефон, там сообщение от мамы: понятно, тебе теперь совсем некогда.\n\nВсе. Футболка в руках, вечер закончился.\n\nЧто вы сейчас будете делать? Скорее всего, набирать маму и объяснять про макароны, зарядку, стирку.\n\nБлядь, даже макароны теперь должны выступить свидетелями.\n\nВы ведь часто еще до звонка подбираете голос. Бодрее надо. Если услышит усталость, спросит, что с вами, если раздражение, обидится, если коротко ответите, решит, что мешает. И вот вы уже стоите с этой футболкой и готовитесь звучать так, чтобы разговор прошел спокойно.\n\nЕсть силы? Сейчас найдутся.\n\nТогда можно выдохнуть.\n\nДевочки, вы уже вынесли переезды, работу, ремонты, очереди, сами вызываете сантехника и разбираетесь, почему опять списали деньги. СТОЛЬКО всего умеете, мои дорогие взрослые люди.\n\nИ опять двойка за незвонок.","caption":"Иногда после спокойного разговора с мамой вы наконец можете смотреть сериал, и только тут замечаете, что весь вечер ждали ее голоса.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые уже живут отдельно от родителей.\nСохраните, если узнали свои вечера."},{"v":"живой","text":"Когда люди говорят, что им не нужен психолог, они чаще всего добавляют: «я и так про себя все знаю и понимаю». Да, я тоже когда-то была проработанная, все прекрасно понимала. Вы можете вбить свой запрос в поиск, и он подберет вам вот столько книг. Как стать богаче, как построить отношения, как стать уверенней. Спросите чат-бота, он вам столько объяснений выдаст, что не унесете. И что, что-то поменялось? Проблема давно не в том, что мы чего-то не знаем. Мы не умеем чувствовать и боимся живого контакта, потому что в нем уязвимо и больно. А меняется что-то как раз там, в живом разговоре с человеком. Иначе так и будете говорить: головой я все понимаю, а в жизни ничего не меняется. Приходите в терапию, запись по ссылке в шапке профиля.","caption":""},{"v":"h3h4_staryy","text":"«Мама обижается, если я не звоню каждый день».\n\nИ вот вы вечером набираете ее, хотя уже засыпаете. Спрашиваете, как дела, слушаете про соседку. Мама довольна. Фух, можно спать.\n\nА завтра закрутились, пропустили звонок. «Ну понятно, про мать совсем забыла».\n\nИ вы начинаете вспоминать: подождите, я же вчера звонила. И позавчера. Да всю неделю, блядь!\n\nНо эти звонки почему-то нигде не учитываются. Один пропущенный вечер, и вы СНОВА виноваты.\n\nИ постепенно вы уже проверяете
