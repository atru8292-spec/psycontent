<style>
:root{--bg:#F7F3EC;--ink:#2E2A45;--muted:#6B6680;--acc:#5B4FA0;--soft:#E7E2F2;--line:#E4DED2;--ok:#5F7A3A;--bad:#B4533F;--card:#fff}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

main{max-width:1500px;margin:0 auto;padding:16px}
section{margin:0 0 32px}h2{font-size:16px;margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:12px;margin-top:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.t{white-space:pre-wrap}.cap{white-space:pre-wrap;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}

button.on{background:var(--acc);border-color:var(--acc);color:#fff}button.on.bad{background:var(--bad);border-color:var(--bad)}button.on.ok{background:var(--ok);border-color:var(--ok)}
.who{display:none;font-weight:600;color:var(--acc)}body.reveal .who{display:block}
table{border-collapse:collapse;width:100%;max-width:640px;background:var(--card)}td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}
#score{display:none;overflow-x:auto}body.reveal #score{display:block}.c{min-width:0;overflow-wrap:anywhere}

<main><p class="n">Прочитай тексты каждой темы и отметь: «Живо» (похоже на живого психолога), «Так можно публиковать», «Нейросеть». Один текст в каждой теме настоящий. Ответы сохраняются в этом браузере.</p>

<script>
const T=[{"id":"k_nabor_1","topic":"виды усталости, от которых отпуск не спасает","author":"Ольга","format":"carousel","cards":[{"v":"живой","text":"Слайд 1: ЛЕНЬ НЕ СУЩЕСТВУЕТ под одним симптомом могут жить разные монстры\nСлайд 2: Почти никто не хочет быть ленивым. Зато огромное количество людей боится оказаться ленивым. О-оу. И под словом «лень» действительно может жить целый зоопарк совершенно разных существ.\nСлайд 3: «Я ПРОСТО ЛЕНИВЫЙ ЧЕЛОВЕК» На самом деле установка: «Если я не могу делать через силу, значит со мной что-то не так». Сэр Выжатый До Капли Существо, которое годами тащило все на себе и теперь стоит на берегу болота с табличкой \"лэйзи\".\nСлайд 4: «МНЕ ПРОСТО НЕ ХВАТАЕТ ДИСЦИПЛИНЫ» На самом деле установка: «Я должен идеально выполнить задачу с первого раза». Перфекционист-Таксидермист Он не начинает проект, пока не убедится, что сможет сразу сделать идеальное чучело.\nСлайд 5: да я и сам крыса, а еще вдруг я все испорчу второго раза не будет\nСлайд 6: «Я ПОСТОЯННО ОТКЛАДЫВАЮ» На самом деле установка: «Я не уверен, что справлюсь». Пророк Позора Ходит за человеком и заранее рассказывает, как все закончится катастрофой.\nСлайд 7: я не хочу рассказывать про Пророка Прозора, я ваще ничо не хочу\nСлайд 8: «МНЕ НИЧЕГО НЕ ХОЧЕТСЯ» произошла утрата контакта с потребностями, эмоциональное истощение, адаптивное существование «Я СЛИШКОМ ДОЛГО ЖИЛ ЧУЖИМИ ЖЕЛАНИЯМИ» Похититель Желаний Маленькое существо, которое много лет складывало все \"хочу\" куда-то.\nСлайд 9: я тоже Похититель Желаний, я, маленькое существо, которое много лет складывало все \"хочу\" в сумки и банки, чтобы никто не нашел, я берегу желания, чтобы никто их не испортил, не сказал, что они глупенькие\nСлайд 10: э-э-эм... я ничо не хочу, потому что у всех желания большие, а мои какие-то дурацкие\nСлайд 11: «Я МОГУ РАБОТАТЬ ТОЛЬКО В ПОСЛЕДНИЙ МОМЕНТ» На самом деле установка: «Только дедлайн создает достаточный уровень адреналина, чтобы я начал двигаться». Дракон Последней Ночи Просыпается только в три часа ночи перед сдачей проекта и питается паникой.\nСлайд 12: ЦИЦГЕЛЬ-ЦИГЕЛЬ-АЙ-ЛЮ-ЛЮ, МАЙ ФРЭНД! да я до трех и не ложусь, ведь ночью я эффективнее\nСлайд 13: Самая большая проблема слова «лень» в том, что оно ничего не объясняет. Это не причина. Под словом «лень» могут прятаться усталость, страх, тревога, выгорание, перфекционизм, потерянные желания и даже многолетнее перенапряжение. Поэтому прежде чем ругать себя за лень, стоит познакомиться с тем существом, которое живет под этим названием.\nСлайд 14: КАК ПОНЯТЬ, КАКОЙ МОНСТР ЖИВЕТ ВНУТРИ ВАШЕЙ ЛЕНИ? Если вы все откладываете, задайте себе вопрос, что я почувствую, если начну прямо сейчас? Если ответ: «стыд», «неловкость», «я облажаюсь». Возможно, рядом ходит Пророк Позора. Если задача вызывает желание сначала все изучить, подготовиться, собрать информацию и только потом начать, задавайте вопрос: «Какой минимально несовершенный результат я готов показать миру?». Если ответ: «Никакой», это Перфекционист Таксидермист. Если на вопрос «Когда в последний раз я делал что-то не потому что надо, а потому что хочется?» ответ приходится долго искать, ваши желания давно собирает в банки Похититель Желаний. Если вы можете работать только под дедлайн: «Смогу ли я сделать это сейчас, если убрать срочность?». Если без паники тело вообще не запускается, рядом дремлет Дракон Последней Ночи. Если вы называете себя ленивым уже несколько лет: «Когда я в последний раз чувствовал себя отдохнувшим?» Не выходным, не «съездили в отпуск», не «я полежал час», а по-настоящему восстановленным. Если вспомнить трудно, возможно, вы встретили Сэра Выжатого До Капли.\nСлайд 15: Если бы слово «лень» исчезло из языка, как бы я описал свое состояние? Я устал(а)? Мне страшно? Мне неинтересно? Я не вижу смысла? Я не верю, что получится? Я не понимаю, чего хочу? Очень часто именно здесь монстр впервые показывает свое настоящее имя. Я, Геннадий!\nСлайд 16: я люблю кушоть, но мне сказали это в другой пост мне\nСлайд 17: бл, Гена, ты все испортил! вот не надо было мне этот пост писать, все не тааааак! все монстру под хвоооост!","caption":""},{"v":"zh3","text":"Слайд 1: От какой усталости отпуск не спасает\nДля тех, кто вернулся с моря и уже к обеду хочет, чтобы все отстали.\n\nСлайд 2: «Я устала все помнить»\nВы лежите у бассейна и записываете в телефон: купить ребенку кроссовки, записать его к врачу, продлить страховку.\n\nМуж спрашивает, где лежит крем от солнца. В той сумке, которую вы собрали. Рядом с панамой, которую тоже положили вы.\n\nВы еще даже не искупались, зато уже знаете, что вся семья будет делать после отпуска.\n\nСлайд 3: «Я устала быть доступной»\nВы закрыли ноутбук, но рабочий чат проверяете за завтраком, на пляже и перед сном. Вдруг без вас ошибутся, сорвут срок, а потом придется объяснять начальнику, почему вы не ответили.\n\nКоллега пишет: «Извини, что дергаю, тут на минутку».\n\nБл*ть, как меня бесит это «на минутку». Вы потом весь ужин думаете, правильно ли они отправили документы.\n\nСлайд 4: «Я устала заслуживать отдых»\nУ вас свободный вечер. Можно лечь, заказать еду, включить сериал.\n\nНо сначала вы ставите стирку, разбираете продукты, протираете плиту, потому что лежать при таком бардаке как-то стыдно.\n\nКогда наконец садитесь, уже пора спать.\n\nСлайд 5: «Я устала следить, чтобы никто не обиделся»\nНа отдыхе вы хотите остаться в номере, но муж уже выбрал экскурсию. Вы соглашаетесь: иначе он будет весь вечер спрашивать, зачем вообще куда-то ехали.\n\nМаме по телефону говорите, что скучаете. Про то, как хорошо вам несколько дней без звонков, молчите.\n\nК вечеру хочется поесть одной. Без необходимости объяснять, почему у вас такое лицо.\n\nСлайд 6: Отпуск закончился, и вы снова за всех отвечаете\nМеня злит совет «вам просто надо отдохнуть», когда женщина уже съездила в отпуск, выспалась, а дома ее снова спрашивают, что приготовить и когда у ребенка прием.\n\nОна может хорошо отдохнуть за неделю. А потом опять каждый день помнить за всех, отвечать всем и соглашаться, чтобы никто не дулся.\n\nИ к пятнице снова еле дойти до кровати.\n\nСлайд 7: Что можно сказать до следующего отпуска\nКогда вы устали все организовывать:\n«В этот раз жилье и билеты выбираешь и бронируешь ты. Я готова обсудить варианты».\n\nКогда вас дергают по работе:\n«Я буду недоступна до понедельника. По срочным вопросам пишите коллеге, которому я передала дела».\n\nКогда вы соглашаетесь ради чужого настроения:\n«Я сегодня останусь в номере. Ты можешь пойти на экскурсию».\n\nКогда домашние ждут, пока вы все сделаете:\n«Я сегодня отдыхаю. Ужин приготовьте без меня».\n\nСлайд 8: От чего вы устали сильнее всего: помнить, отвечать, заслуживать отдых или следить, чтобы никто не обиделся?","caption":"Я злюсь, когда женщине советуют получше отдохнуть, а потом продолжают спрашивать у нее даже то, что могут найти сами.\nОтправьте той, которой в отпуске тоже приходится все организовывать."},{"v":"zh2","text":"Слайд 1: Какая усталость едет с вами в отпуск\nДля тех, кто сменил работу на море, но продолжает за всех думать, отвечать и все успевать.\n\nСлайд 2: Семейный диспетчер\nВы нашли отель, проверили паспорта, собрали аптечку, знаете, где детская панама и когда заканчивается завтрак.\n\nМуж спрашивает, что у вас сегодня по плану. Вы вообще-то тоже впервые в этом городе.\n\nМеня бесит совет «просто делегируйте». Особенно когда после него женщине предлагают составить всем списки и проследить, чтобы никто ничего не забыл. Заеб*сь отдохнули.\n\nСлайд 3: Сотрудница, которая «только ответит»\nВы обещали себе не открывать рабочий чат. Но коллега пишет, что без вас никак, и вы садитесь на край лежака с телефоном.\n\nПотом ищете файл, объясняете, кому его отправить, проверяете, получили ли.\n\nВ море уже все сходили. Вы даже футболку не сняли.\n\nСказать «я в отпуске» страшно: вдруг решат, что на вас нельзя положиться, и следующий интересный проект отдадут другой.\n\nСлайд 4: Удобная попутчица\nВам хочется остаться в номере, заказать еду и помолчать. Но все собрались на экскурсию, и вы уже надеваете кроссовки.\n\nПотому что иначе начнется: ну мы же вместе приехали, ну что ты опять, ну испортишь всем настроение.\n\nВечером вы лежите лицом к стене и злитесь, что вас опять уговорили. На вопрос «тебе понравилось?» отвечаете: «Да, красиво».\n\nСлайд 5: Отличница даже на пляже\nВы просыпаетесь без будильника и сразу проверяете время. Половина утра прошла, а вы еще НИЧЕГО не сделали.\n\nНадо успеть на завтрак, позаниматься, прочитать книгу, сходить в тот самый ресторан. Просто полежать жалко: отпуск короткий, деньги потрачены.\n\nДаже перед сном вы перебираете, что сегодня не успели.\n\nСлайд 6: «Все отдохнули, кроме меня»\nРебенок вспоминает бассейн, муж показывает фотографии, коллеги благодарят за помощь.\n\nА вы накануне выхода на работу сидите над открытым чемоданом. Купальник еще влажный, стирка уже вторая, и хочется плакать от мысли, что завтра опять вставать по будильнику.\n\nЯ злюсь, когда женщине в этот момент советуют получше планировать отдых. Она и так весь отпуск планировала.\n\nСлайд 7: Что можно сказать до отпуска\nЕсли вы обычно за всех организуете, всем отвечаете и со всеми соглашаетесь, пригодятся конкретные договоренности.\n\n«Ты полностью собираешь вещи ребенку. Список и проверка тоже на тебе».\n\n«В отпуске я рабочие сообщения не читаю. Все текущие задачи передала Ольге».\n\n«Завтра я остаюсь в отеле. На экскурсию езжайте без меня».\n\n«Я хочу провести день без планов. Пожалуйста, ничего на меня не бронируйте».\n\nСлайд 8: В какой роли вы чаще всего уезжаете в отпуск? Напишите название или расскажите свой вариант.","caption":"Увидела очередной список вещей для семейного отпуска. Почему-то даже мужские носки в нем должна проверить женщина. Уже на этапе чемодана хочется отдельный номер.\n\nЯ Ольга, психолог, работаю с женщинами, которые работают и тянут на себе дом.\nОтправьте той, с кем давно хотите просто полежать у моря."}]},{"id":"k_nabor_2","topic":"какие бывают внутренние критики","author":"Михаил","format":"carousel","cards":[{"v":"живой","text":"Слайд 1: А я сегодня попросил таксиста закрыть окно, потому что мне дуло.\nСударь, да вы безумец.\nСлайд 2: А я не ответила на рабочее сообщение в одиннадцать ночи и просто ушла спать.\nСвятые угодники. Вот это характер!\nСлайд 3: А я отдал переделать кофе, потому что принесли невкусный.\nЛегенда. Ты легенда!\nСлайд 4: А мне предложили помощь, и я сказала «да». Без «ой, да ладно, не надо».\nПолегче! У меня уже давление.\nСлайд 5: А я отменил встречу, потому что устал. Без болезней и смерти троюродной бабушки.\nИ даже не написал «сорри, если что»?\nСлайд 6: Такими темпами мы заживем как люди!\nОй, не говори.","caption":""},{"v":"zh3","text":"Слайд 1: Четыре внутренних критика, которых легко узнать по своим мыслям\nДля тех, кто ругает себя даже после вполне удачного дня.\n\nСлайд 2: «Надо было лучше»\nВы отправили отчет вовремя, руководитель написал «спасибо», можно закрывать ноутбук. Но вы снова открываете файл и находите предложение, которое стоило сократить.\n\nТеперь дома рассказываете, что отчет получился так себе. Про то, что вы закончили сложную работу, даже не упоминаете.\n\nСлайд 3: «Другие уже успели»\nВы собирались записаться на занятия английским, открыли телефон, увидели, что знакомая выступает на конференции за границей.\n\nИ вот уже стыдно выбирать группу для начинающих. Закрываете расписание: в вашем возрасте вроде бы пора свободно говорить. Учиться так и не записались.\n\nСлайд 4: «Рано отдыхать»\nВы убрали квартиру и сели смотреть сериал. Через несколько минут вспоминаете про белье в сушилке, потом про продукты на завтра, потом решаете заодно протереть плиту.\n\nСериал продолжает играть в пустой комнате. Вы обещаете себе сесть, когда все закончите. Уже пора спать.\n\nСлайд 5: «Сами виноваты»\nКоллега прислал свою часть работы поздно вечером, хотя обещал утром. Вы доделываете общее задание и ругаете себя: надо было напомнить, проверить, заранее попросить.\n\nНа следующий день коллега спокойно пьет кофе, а вы извиняетесь перед руководителем за задержку. Вы ведь могли все предусмотреть. Конечно.\n\nСлайд 6: Внутреннего критика легко принять за собственную разумность\nВы говорите себе: «Я просто понимаю, где недоработал», и еще час проверяете уже отправленное письмо, пропускаете обед, отменяете встречу.\n\nМеня беспокоит, как легко мы соглашаемся с таким обращением с собой. Особенно когда можем подробно объяснить, за что себя ругаем.\n\nСлайд 7: Что можно сказать себе без требования немедленно стать лучше\n«Надо было лучше»:\nЯ нашел одну неточность. Остальную работу я сделал.\n\n«Другие уже успели»:\nЯ хочу выучить язык. Могу записаться в начинающую группу.\n\n«Рано отдыхать»:\nБелье уберу завтра. Сегодня я уже достаточно поработал.\n\n«Сами виноваты»:\nЯ отвечаю за свою часть. Коллега обещал прислать свою утром.\n\nСлайд 8: Какая фраза вашего внутреннего критика здесь пропущена?\nНапишите ее в комментариях так, как вы обычно говорите себе.","caption":"Увидел в ленте очередное «будьте к себе требовательнее» и подумал о тех, кто даже выходной заканчивает списком своих недоработок. Им еще добавить требований?\nОтправьте тому, кто извиняется даже за собственный отдых."},{"v":"zh2","text":"Слайд 1: Как вы себя ругаете: узнайте своего внутреннего критика\nДля тех, кто после обычного рабочего дня еще и отчитывает себя за то, как его прожил.\n\nСлайд 2: Редактор переписки\n«Надо было написать нормально».\n\nВы уже договорились о встрече, человек ответил «отлично», а вы снова открываете переписку. Здесь слишком сухо, здесь восклицательный знак лишний, здесь вообще зачем столько слов?\n\nУжин остывает, пока вы перечитываете сообщение, к которому собеседник давно потерял интерес.\n\nСлайд 3: Знаток задним числом\n«Это же было очевидно».\n\nВы согласились взять еще одну задачу и теперь сидите с ноутбуком, пока дома все легли. И ругаете себя: надо было сразу понять, что до пятницы вы столько не сделаете.\n\nВ понедельник вы еще ждали данные от коллеги и рассчитывали закончить раньше. Но сегодня судите себя так, будто уже тогда знали, кто задержит ответ и где придется все переделать.\n\nСлайд 4: Начальник без выходных\n«Сначала сделайте что-нибудь полезное».\n\nВы легли на диван, включили сериал и вспомнили про белье в машинке. Потом про пыль, письмо, продукты, которые надо заказать.\n\nЧерез полчаса вы складываете носки и злитесь на себя за то, что опять целый вечер ничего толком не сделали.\n\nСериал все еще на паузе.\n\nСлайд 5: Специалист по чужим успехам\n«В вашем возрасте уже пора».\n\nВы собирались написать подруге про свою прибавку. Открыли телефон, увидели, что знакомая купила квартиру, и стерли набранное сообщение.\n\nПрибавка та же, вы ей еще минуту назад радовались. Теперь сидите и считаете, сколько вам до первого взноса.\n\nПодруга так и не узнала вашу хорошую новость.\n\nСлайд 6: Проверяющий на случайность\n«В этот раз просто повезло».\n\nВас поблагодарили за работу, и вы сразу объясняете: задача была легкая, коллега помог, заказчик оказался спокойный.\n\nА вечером вспоминаете одну опечатку и думаете, как вообще могли ее пропустить.\n\nЗа удачный результат вы благодарите всех по списку. За опечатку отвечаете лично.\n\nСлайд 7: Что можно ответить себе без натянутого «я молодец»\nПосле ошибки:\n«Я отправил файл без вложения. Сейчас дошлю».\n\nПосле похвалы:\n«Я подготовил этот отчет и проверил расчеты. Коллега помог с оформлением».\n\nКогда устали:\n«Сегодня я закончил две задачи. Третью перенесу на завтра».\n\nСлайд 8: Какого критика вы узнали по первой же реплике? Напишите его имя в комментариях.","caption":"Опять встретил совет быть к себе построже ради результата. Меня злит, как легко его дают людям, которые даже за отдых умудряются себя отчитать.\n\nЯ Михаил, психолог, помогаю тем, кто все время себя ругает.\nОтправьте тому, кто слишком часто собой недоволен."}]},{"id":"k_perevod_1","topic":"«у меня низкая самооценка»: как это выглядит в обычном дне","author":"Юлия","format":"carousel","cards":[{"v":"zh3","text":"Слайд 1: «У меня низкая самооценка»: как это выглядит в обычном дне\nДля тех, кто извиняется за просьбу и долго вспоминает одно чужое замечание.\n\nСлайд 2: «Да ничего особенного, мне просто повезло»\n\nТебя хвалят за работу, а ты сразу объясняешь, что тебе помогли, задача была простая, любая бы справилась. Потом открываешь файл и снова все проверяешь. Вдруг тебя похвалили зря и завтра это заметят.\n\nСлайд 3: «Мне куда угодно, выбирайте»\n\nТы посмотрела меню и поняла, что ужин в этом ресторане тебе сейчас дороговат. Но подруги уже обсуждают, что закажут, и ты соглашаешься. Сказать про деньги неловко: вдруг придется уговаривать всех из-за тебя менять планы. Дома считаешь, сколько осталось до зарплаты.\n\nСлайд 4: «Извини, можно еще один вопрос?»\n\nТы заплатила за консультацию, тебе объяснили слишком быстро, и половину ты пропустила. Но переспросить стыдно, ведь остальные, наверное, сразу понимают. Извиняешься, просишь повторить и добавляешь: «Я, наверное, туплю».\n\nСлайд 5: «Наверное, я слишком остро реагирую»\n\nПодруга при всех пересказала то, что ты просила оставить между вами. Ты расстроилась, а теперь подбираешь слова, чтобы ей было попроще услышать твою просьбу. Уже готова написать: «Я понимаю, ты ничего такого не хотела». Про то, как тебе было стыдно за столом, пока убрала.\n\nСлайд 6: Иногда ты вполне можешь сказать, что тебе нравится в себе\n\nИ все равно после недовольного «ну как знаешь» отменяешь свое решение.\n\nТы собиралась провести выходной дома, уже отказалась от встречи, но теперь пишешь, что приедешь. Потому что страшно: еще пару раз откажешь, и тебя вообще перестанут звать.\n\nСлайд 7: Можно сказать короче, даже если пока неловко\n\nНа похвалу: «Спасибо, я много над этим работала».\n\nПодругам: «Мне сейчас дорого. Давайте выберем другое место».\n\nНа консультации: «Повтори, пожалуйста, я пока не поняла».\n\nПодруге: «Я просила никому об этом не рассказывать. Мне было неприятно».\n\nСлайд 8: Какую свою обычную фразу ты узнала? Напиши ее в комментариях.","caption":"Меня особенно задевает это «я, наверное, туплю», когда девушке просто слишком быстро объяснили. Она еще толком ничего не спросила, а уже себя отругала.\nОтправь той, которая извиняется даже за второй вопрос."},{"v":"zh2","text":"Слайд 1: «У меня низкая самооценка»: как это выглядит в обычном дне\nДля тех, кто умеет поддерживать подруг, но себя ругает даже за просьбу о помощи.\n\nСлайд 2: «Мне просто повезло»\n\nТы несколько вечеров готовила презентацию, проверяла каждую таблицу, отвечала на вопросы. Руководитель говорит, что ты отлично справилась, и ты сразу рассказываешь, кто тебе помог. Про свою работу почему-то забываешь.\n\nПотом страшно браться за следующую задачу. Вдруг теперь поймут, что зря тебя хвалили?\n\nСлайд 3: «Да мне все равно, выбирайте»\n\nПодруги выбирают ресторан, ты открыла меню, увидела цены и поняла, что тебе сейчас дорого. Но все уже согласились. Писать про деньги неловко: вдруг с тобой больше не захотят никуда ходить.\n\nИ ты идешь, а потом до зарплаты считаешь, сколько осталось на продукты.\n\nСлайд 4: «Не хочу его напрягать»\n\nТы заболела, дома закончились продукты. Он спрашивает, нужно ли что-нибудь привезти, и ты отвечаешь, что справишься. Хотя очень хочется попросить суп, лекарства и немного побыть рядом.\n\nТы заказываешь доставку, лежишь одна и думаешь, какой он невнимательный. При этом он слышал от тебя, что ничего не нужно.\n\nСлайд 5: «Наверное, глупость скажу»\n\nНа встрече у тебя есть предложение, ты уже записала его в блокнот, но начинаешь с извинения. Потом долго объясняешь, что можешь ошибаться.\n\nПока ты объясняешь, разговор уходит дальше. А вечером ты снова думаешь, почему тебя никто не слушает.\n\nСлайд 6: Подруге ты бы так не сказала\n\nПодруга ошиблась в письме, и ты говоришь: «Исправишь, бывает».\n\nТы сама ошиблась в письме, и уже думаешь, как завтра смотреть коллегам в глаза, вдруг они теперь считают тебя бестолковой.\n\nМеня задевает, сколько сил можно потратить на то, чтобы осудить себя раньше, чем это успеет сделать кто-нибудь другой. Даже когда никто и не собирался.\n\nСлайд 7: Что можно сказать, когда хочется сразу отказаться от своих слов\n\nКогда хвалят:\n«Спасибо, я много над этим работала».\n\nКогда тебе дорого:\n«Я сейчас рассчитываю на меньшую сумму. Давайте выберем другое место».\n\nКогда нужна помощь:\n«Да, привези, пожалуйста, продукты. Мне сегодня тяжело».\n\nКогда предлагаешь идею:\n«У меня есть предложение».\n\nТы можешь волноваться, запинаться и все равно договорить.\n\nСлайд 8: Какую фразу ты говоришь чаще всего, когда боишься, что о тебе плохо подумают?","caption":"Увидела в комментариях знакомое: «Я просто стараюсь никого не напрягать». И подумала, как редко при этом спрашивают, сколько приходится терпеть самой.\nЯ Юлия, психолог, работаю с девушками и женщинами от 20 до 35 лет.\nОтправь той, кому сейчас трудно попросить даже о маленькой помощи."},{"v":"живой","text":"Слайд 1: так психолог опишет запрос аудитории своем контенте в этом аудитория на самом деле узнает себя\nСлайд 2: нет опоры на себя, меняет мнение, как только слышит чужое уверенное «нет, лучше так», не может понять, чего хочет на ужин/куда идти/что делать, пока кто-то не предложит, если на нее как-то не так посмотрели весь день перебирает, что не так, хорошо чувствует себя только когда рядом у других хорошее настроение\nСлайд 3: живет не свою жизнь, ставит цели, которые при ближайшем рассмотрении вообще никак не вяжутся с тем, чего она хочет, на вопрос «а ты чего хочешь» не знает ответа, “вроде, все хорошо, но настроение постоянно плохое”\nСлайд 4: низкая самоценность, в ответ на «как круто ты это сделала» говорит «да ну, ерунда, это не сложно», если хвалят, свой успех объясняет тем, что повезло, помогли, так совпало, в разговоре часто ставит свое мнение ниже чужого, только после внешней оценки чувствует удовлетворение тем, что сделал\nСлайд 5: высокий уровень тревоги, продумывает разговор заранее, репетирует, что скажет, приходит сильно заранее, не выносит «впритык», читает про симптомы, проверяет, все ли в порядке со здоровьем, не любит, когда планы меняются в последний момент, “если я обо всем подумаю заранее, ничего плохого не случится”","caption":""}]},{"id":"k_perevod_2","topic":"границы, созависимость, выгорание: как эти слова выглядят дома и на работе","author":"Ольга","format":"carousel","cards":[{"v":"zh2","text":"Слайд 1: Границы, созависимость, выгорание: как узнать их в обычной жизни\nДля тех, кто слышит эти слова в каждом втором рилсе и пытается понять, что происходит у себя дома и на работе.\n\nСлайд 2: «Я сейчас закончу разговор»\nМама снова обсуждает ваш вес. Вы просите сменить тему, она продолжает, и вы прощаетесь. Потом еще сидите с телефоном в руке, потому что страшно: сейчас напишет, какая вы неблагодарная.\n\nТак могут выглядеть границы. Вы говорите, что вам подходит, и решаете, что будете делать, если человек продолжит. Другой человек при этом вполне может обидеться.\n\nСлайд 3: «Я останусь дома, вдруг он опять расстроится»\nВы уже оделись на встречу с подругой, но муж ходит хмурый. Вы начинаете выяснять, что случилось, предлагаете ужин, отменяете встречу. Подруге пишете, что устали. Потом злитесь на мужа, хотя он даже не просил остаться.\n\nТак может выглядеть созависимый способ строить отношения: вы раз за разом отказываетесь от своего, чтобы близкий был доволен, и боитесь, что без вашей постоянной заботы он уйдет или совсем перестанет справляться.\n\nСлайд 4: «Я вернулась из отпуска и уже хочу обратно»\nНа работе вы открываете знакомую задачу и долго смотрите в экран. Коллега просит уточнить мелочь, вы отвечаете резко, потом извиняетесь. Вечером хватает сил заказать еду и лечь. Раньше вы хотя бы хотели встретиться с друзьями.\n\nТак может выглядеть выгорание: после долгой перегрузки вы чувствуете себя выжатой, все чаще раздражаетесь на людей и с трудом делаете работу, с которой раньше справлялись.\n\nСлайд 5: Одной ссоры для таких выводов мало\nУвидела очередное видео, где по одной переписке уже определили созависимость. Бл*дь, как удобно все стало.\n\nВы можете разозлиться, помочь мужу вместо встречи или устать к пятнице. Важно, как вы живете из недели в неделю: можете ли отказать, остается ли у вас своя жизнь, возвращаются ли силы после отдыха.\n\nСлайд 6: Когда трудно объяснить, что с вами происходит\nВместо спора о терминах можно сказать конкретно:\n\n«Когда ты обсуждаешь мою внешность, я заканчиваю разговор».\n\n«Я хочу пойти к подруге. Мне тревожно оставлять тебя расстроенным, и все же я пойду».\n\n«Я уже несколько недель еле справляюсь. Давайте решим, какие задачи можно снять и кто их возьмет».\n\nСлайд 7: Какое из этих слов вы чаще всего слышите в ответ на обычный рассказ о своей жизни?","caption":"Иногда уже страшно рассказать, что поругались с мужем. Подруга еще чай не допила, а отношения вам уже разобрала по терминам.\n\nЯ Ольга, психолог, помогаю разобраться в отношениях и в себе, когда от советов из соцсетей уже каша в голове.\nОтправьте тому, с кем хочется поговорить об этом по-человечески."},{"v":"живой","text":"Слайд 1: так психолог опишет запрос аудитории своем контенте в этом аудитория на самом деле узнает себя\nСлайд 2: нет опоры на себя, меняет мнение, как только слышит чужое уверенное «нет, лучше так», не может понять, чего хочет на ужин/куда идти/что делать, пока кто-то не предложит, если на нее как-то не так посмотрели весь день перебирает, что не так, хорошо чувствует себя только когда рядом у других хорошее настроение\nСлайд 3: живет не свою жизнь, ставит цели, которые при ближайшем рассмотрении вообще никак не вяжутся с тем, чего она хочет, на вопрос «а ты чего хочешь» не знает ответа, “вроде, все хорошо, но настроение постоянно плохое”\nСлайд 4: низкая самоценность, в ответ на «как круто ты это сделала» говорит «да ну, ерунда, это не сложно», если хвалят, свой успех объясняет тем, что повезло, помогли, так совпало, в разговоре часто ставит свое мнение ниже чужого, только после внешней оценки чувствует удовлетворение тем, что сделал\nСлайд 5: высокий уровень тревоги, продумывает разговор заранее, репетирует, что скажет, приходит сильно заранее, не выносит «впритык», читает про симптомы, проверяет, все ли в порядке со здоровьем, не любит, когда планы меняются в последний момент, “если я обо всем подумаю заранее, ничего плохого не случится”","caption":""},{"v":"zh3","text":"Слайд 1: Границы, созависимость, выгорание: как это выглядит в обычной жизни\nЧтобы понимать, что происходит дома и на работе, когда вы снова говорите: «Ладно, я сама».\n\nСлайд 2: Границы: вы уже отказались, но все еще оправдываетесь\n\nМама просит приехать в субботу. У вас планы, вы говорите об этом, а потом до вечера объясняете, почему перенести встречу с подругой никак нельзя.\n\nВам страшно, что мама обидится и назовет вас неблагодарной.\n\nВы можете закончить разговор: «Мам, я в субботу занята. Созвонимся в воскресенье». Вы решаете, когда приедете. Мама решает, как к этому отнестись.\n\nСлайд 3: Границы на работе: вы перестаете обещать то, на что у вас нет времени\n\nРуководитель приносит еще одну задачу. Вы уже знаете, что придется отменить вечерние планы, но отвечаете: «Да, конечно».\n\nА потом злитесь, когда он уходит домой вовремя. Бл*ть, ему хорошо.\n\nУстановить границу здесь можно конкретно: «Сегодня успею только одну задачу. Какую делаем первой?»\n\nСлайд 4: Созависимость: вы устраиваете свой день вокруг чужого состояния\n\nПартнер раздражен, и вы отменяете встречу, потому что боитесь оставить его одного в плохом настроении. На работе прикрываете коллегу, который снова сорвал срок, и сами остаетесь доделывать.\n\nТак может выглядеть созависимый способ строить отношения: вы постоянно спасаете, проверяете, уговариваете, а собственными планами жертвуете, чтобы сохранить отношения или чувствовать себя нужной.\n\nПо одному такому вечеру выводов не сделать. Важна повторяемость.\n\nСлайд 5: Выгорание: вы открываете рабочий чат и уже хотите закрыть ноутбук\n\nРаньше вы спорили о проекте, предлагали идеи. Теперь отвечаете «принято», делаете необходимый минимум, а вечером раздражаетесь, когда дома просят выбрать фильм. Вы весь день принимали решения и больше ничего решать не хотите.\n\nСлайд 6: «Просто откажи» звучит легко, пока вам самой ничего не грозит\n\nМеня злит, когда в ленте советуют поставить начальника на место, будто завтра вам точно будет чем платить за квартиру.\n\nВы можете понимать, где ваш предел, и пока бояться его обозначить. Особенно если раньше за отказ вас наказывали молчанием, скандалом или угрозой увольнения.\n\nИмеет смысл учитывать, от кого вы зависите, на какую поддержку можете рассчитывать и что сейчас безопасно сказать.\n\nСлайд 7: Что можно сказать вместо очередного «ладно, я сама»\n\nМаме:\n«Я понимаю, что ты расстроена. В субботу я все равно не приеду».\n\nПартнеру:\n«Я могу тебя выслушать. Отменять встречу сегодня я не буду».\n\nКоллеге:\n«Свою часть я закончила. Твою сегодня взять не смогу».\n\nРуководителю:\n«Последние недели я регулярно работаю по вечерам. Давайте пересмотрим объем задач и сроки».\n\nСлайд 8: Какое слово вам чаще всего попадается в ленте: границы, созависимость или выгорание?","caption":"Иногда читаешь советы в ленте и получаешь еще один повод себя ругать: даже отказывать надо уметь уверенно. Я в работе всегда хочу понять, чем человек рискует, когда говорит «нет».\n\nЯ Ольга, психолог. Помогаю разобраться, как все эти слова из соцсетей относятся к вашей жизни.\nПодписывайтесь, если хочется еще таких разборов про отношения, работу и себя."}]},{"id":"k_golos_1","topic":"что думает человек, который всем отвечает «все нормально»","author":"Михаил","format":"carousel","cards":[{"v":"zh3","text":"Слайд 1: Что вы оставляете за словами «все нормально»\nДля тех, кто отвечает так, даже когда очень хочется рассказать\n\nСлайд 2: «Все нормально, просто устал»\n\nВы пришли домой и сидите в куртке. На работе пришлось переделать чужой отчет, свой вы закончите ночью, а близкому отвечаете, что день прошел обычно.\n\nРассказывать долго. Он ведь тоже устал. Сейчас еще и вас придется выслушивать.\n\nСлайд 3: «Все нормально, я понимаю»\n\nПодруга снова отменила встречу за час до выхода. Вы уже оделись и выбрали кафе, в котором хотели вместе посидеть.\n\nВ сообщении пишете: «Конечно, отдыхай». Сказать, что вам обидно, страшнее: вдруг теперь она будет встречаться с вами из обязанности.\n\nСлайд 4: «Все нормально, справлюсь»\n\nКоллега спрашивает, нужна ли помощь. Вы отказываетесь, хотя уже понятно, что обедать опять будете за компьютером.\n\nЕсли согласиться, придется признать, что вы уже который день не успеваете. А вдруг коллега решит, что вам вообще зря поручили эту работу?\n\nСлайд 5: «Все нормально, ничего не случилось»\n\nПартнер весь вечер смотрит в телефон. Вы хотели рассказать хорошую новость, начали, услышали рассеянное «угу» и замолчали.\n\nКогда он наконец спрашивает, почему вы тихий, отвечаете, что просто нечего рассказывать. Просить его послушать уже как будто унизительно.\n\nСлайд 6: Вы ждете, что вас спросят еще раз\n\nВы отвечаете «все нормально» и надеетесь, что близкий задержится рядом: «Вы сегодня сами на себя не похожи. Точно все в порядке?»\n\nА он говорит: «Ну хорошо» и идет заниматься своими делами.\n\nСлайд 7: Что сказать, когда привычное «все нормально» уже произнесли\n\n«Я поторопился с ответом. День был тяжелый. У вас есть немного времени послушать?»\n\n«Мне обидно, что встреча сорвалась. Я очень ее ждал».\n\n«Мне нужна помощь с отчетом. Можете проверить расчеты?»\n\nМожно начать с одного конкретного предложения.\n\nСлайд 8: Что вы чаще всего имеете в виду, когда говорите «все нормально»?","caption":"Сегодня снова увидел совет: «Просто скажите близким, что вам нужно». Меня в этом «просто» всякий раз задевает, сколько мы пропускаем: человеку иногда страшно даже попросить его выслушать.\n\nМне хочется, чтобы о таких разговорах мы говорили чуть бережнее.\nПодписывайтесь, если хочется еще таких разборов обычных разговоров и отношений."},{"v":"живой","text":"Слайд 1: Я очень хочу помощи и поэтому иду спасать других, потому что если я спасу достаточное количество людей, мне не придется признавать, что я сама в ней нуждаюсь.\nСлайд 2: Если я буду благодарна за крошки любви от Других, то однажды надеюсь соберется целый торт. А пока я гордо называю это мужеством радоваться малому.\nСлайд 3: Если я все время шучу, никто не заметит, что половину своей личности я собрала из мемов, книг и попыток не расплакаться в общественном месте.","caption":""},{"v":"zh2","text":"Слайд 1: Что хочется сказать вместо «все нормально»\nДля тех, кто отвечает так даже близким, а потом плачет в ванной с включенной водой.\n\nСлайд 2: «Все нормально, вы же отдыхаете»\n\nМама звонит из отпуска, спрашивает, как дела. Я собирался рассказать, что на работе сокращения и я уже открываю вакансии по ночам. Но слышу, как она радуется морю, и спрашиваю, теплая ли вода.\n\nТеперь до конца их отпуска у меня все должно быть хорошо.\n\nСлайд 3: «Все нормально, я понимаю, что ты занят»\n\nЯ хотел рассказать, как прошла встреча, к которой готовился всю неделю. Ты отвечаешь, что сейчас совсем некогда.\n\nВечером уже странно возвращаться к этому самому. Подожду, вдруг спросишь.\n\nПотом ты рассказываешь про свой день, и мы ложимся спать.\n\nСлайд 4: «Все нормально, я сам разберусь»\n\nДруг предлагает помочь с переездом. Я уже набираю ответ: приезжай, пожалуйста.\n\nПотом вспоминаю, что у него дети, работа, суббота одна. Пишу, что вещей немного.\n\nВечером сижу на полу среди коробок, ем холодную булку и злюсь, что никто даже не приехал.\n\nСлайд 5: «Все нормально, я уже забыл»\n\nПри друзьях ты пошутил про мою зарплату. Все засмеялись, я тоже.\n\nДома спрашиваешь, чего я такой тихий. Хочу сказать, что мне было стыдно и обидно, но уже представляю: опять ты все принимаешь близко к сердцу.\n\nПоэтому улыбаюсь. Теперь еще и обнять тебя надо, чтобы ты точно поверил.\n\nСлайд 6: «Все нормально». Только спросите еще раз\n\nЯ понимаю, как это выглядит: вы спросили, я ответил, вы пошли дальше.\n\nНо мне хочется, чтобы вы задержались рядом. Потому что самому сказать «мне сейчас очень нужен кто-нибудь» страшно.\n\nВдруг вы ответите, что сегодня никак, и я останусь с этим уже после того, как попросил.\n\nСлайд 7: Когда хочется ответить чуть честнее\n\nМожно сказать ровно столько, сколько вы сейчас готовы:\n\n«Мне тяжело, но рассказывать пока трудно».\n\n«Я боюсь вас нагрузить. У вас есть силы меня послушать?»\n\n«Я сказал, что справлюсь, и поторопился. Помощь все-таки нужна».\n\n«Я все еще переживаю из-за той шутки. Хочу об этом поговорить».\n\nСлайд 8: Какого ответа вам хотелось бы услышать, когда вы говорите «все нормально»?","caption":"Меня тревожит, как легко принять спокойный ответ и побежать дальше. Особенно когда человек всегда был тем, у кого можно попросить помощи.\n\nЯ Михаил, психолог, работаю со взрослыми, которые пытаются разобраться в себе, работе и отношениях.\nПодписывайтесь, если хочется еще таких разговоров: здесь пишу о том, что бывает трудно сказать даже близким."}]},{"id":"k_golos_2","topic":"тревога в три часа ночи","author":"Юлия","format":"carousel","cards":[{"v":"zh3","text":"Слайд 1: Почему в три часа ночи ты еще и ругаешь себя за тревогу\nДля тех, кто лежит без сна и считает, сколько осталось до будильника.\n\nСлайд 2: «Надо же было вспомнить об этом ночью»\n\nДнем начальница написала, что завтра хочет поговорить. Ты ответила «хорошо», закончила работу, поужинала. А сейчас лежишь и перебираешь, где могла ошибиться. Написать ей в три часа ночи ты не решаешься, и до утра приходится ждать без ответа.\n\nСлайд 3: «Я уже все обдумала. Почему опять?»\n\nТы вспомнила переписку, проверила, что отправила нужный файл, даже придумала, что скажешь завтра. На минуту стало спокойнее. Потом подумала: вдруг начальница недовольна чем-то другим?\n\nСлайд 4: «Я сама себе порчу завтрашний день»\n\nТы берешь телефон посмотреть время и сразу считаешь, сколько еще получится поспать. Теперь страшно и из-за разговора, и из-за того, что утром будешь уставшей, растеряешься, забудешь нужные слова.\n\nТы еще лежишь в кровати, а уже требуешь от себя хорошо провести завтрашний разговор.\n\nСлайд 5: «Другие бы просто уснули»\n\nИ ты сердишься на себя, потому что очень хочется тоже повернуться на бок и заснуть. Ты ведь понимаешь, что ночью ничего не выяснишь.\n\nПонимаешь. И все равно боишься услышать утром, что тобой недовольны. От этого особенно обидно: ты уже объяснила себе все разумными словами, а легче пока не стало.\n\nСлайд 6: Тебе страшно, и ты очень хочешь спать.\n\nТы пока не знаешь, о чем она хочет поговорить. Уже за одно это ожидание тебе тяжело, и ты еще называешь себя глупой за то, что лежишь без сна.\n\nСлайд 7: Какая мысль чаще всего приходит к тебе среди ночи? Напиши, если хочется поделиться.","caption":"Меня особенно задевает это ночное «ну хватит уже, спи». Как будто ты с удовольствием лежишь и переживаешь, а утром тебе никуда не надо."},{"v":"zh2","text":"Слайд 1: Что хочется услышать, когда в три часа ночи тревожно\nДля тех, кто лежит без сна и еще ругает себя за это.\n\nСлайд 2:\nА: Начальник вечером написал: «Завтра обсудим». Я уже всю переписку перечитала. Вдруг я что-то пропустила и он собирается меня уволить?\nБ: И спросить сейчас нельзя, и до утра с этим страшно.\n\nСлайд 3:\nА: Я уже представляю, как буду искать работу, чем платить за квартиру. Через несколько часов вставать, а я даже телефон отложить не могу.\nБ: Ты надеешься найти хоть что-нибудь, после чего получится уснуть.\n\nСлайд 4:\nА: Да. И злюсь на себя. Нормальные люди спят, я из двух слов устроила катастрофу.\nБ: Мне так жалко, что ты сейчас еще и называешь себя ненормальной. Тебе уже страшно потерять работу.\n\nСлайд 5:\nА: Но ведь я сама все это придумываю.\nБ: Ты пока не знаешь, о чем он хочет поговорить. А ночью ты лежишь одна, никто не отвечает, и страшные догадки некому даже пересказать.\n\nСлайд 6:\nА: Я психологию читаю, все про тревогу понимаю. Почему я опять так?\nБ: Можно понимать, как ты тревожишься, и все равно испугаться. Ты сейчас лежишь без сна, боишься за работу и считаешь часы до будильника.\n\nСлайд 7: Какие слова тебе хотелось бы услышать в такую ночь? Можно написать совсем коротко.","caption":"Меня задевает, как быстро человек начинает стыдить себя за бессонную ночь. Будто утром ему предстоит еще и оправдываться за то, что было страшно.\n\nЯ Юлия, психолог, работаю со взрослыми, которым тревога мешает жить.\nПодписывайся, если хочется еще таких разговоров. Здесь пишу о тревоге и о том, как мы с собой обращаемся."},{"v":"живой","text":"Слайд 1: Она чувствует вину, когда кто-то рядом злится или грустит. Ей кажется, что это ее ошибка.\nСлайд 2: Она чувствует вину за все.\nДаже за то, к чему не имеет отношения. Кто-то рядом злится? Она виновата. Планы рушатся? Это она что-то упустила. Все идет не так, значит, она ошиблась.\nСлайд 3: Ей кажется, что если она будет стараться сильнее, все станет хорошо.\nСлайд 4: Откуда это?\nИз детства. Где она отвечала за настроение мамы. Где если папа грустил, значит, она плохо себя вела. Где за все наказывали ее.\nСлайд 5: Ей не говорили: «Ты здесь ни при чем».\nЕй говорили: «Ты должна была подумать».\nСлайд 6: Как это выглядит сейчас:\nОна извиняется, когда на нее наступают в метро. Она чувствует себя виноватой, когда берет выходной. Она переживает, если кто-то в компании грустит, и пытается его развеселить. Она берет на себя работу коллег, потому что «им тяжело». Она терпит в отношениях, потому что «он и так устает, я не должна его нагружать».\nСлайд 7: В следующий раз, когда кто-то рядом расстроен, попробуй вместо «что я сделала не так?» спросить «что у тебя случилось?».\nСлайд 8: Я психолог. Ко мне приходят, когда устали быть виноватыми за все. Напиши в комментариях, как у тебя это проявляется.","caption":""}]},{"id":"k_mysl_1","topic":"что я поняла про отношения за годы работы психологом","author":"Ольга","format":"carousel","cards":[{"v":"zh3","text":"Слайд 1: Что отвечать, когда вас уговаривают терпеть родных\nЧто я поняла за годы работы психологом. Для тех, кто после разговора с мамой весь вечер приходит в себя.\n\nСлайд 2: «Она же добра вам желает»\n\nВы рассказали маме про новую работу, а она уже объяснила, что вас обманут, вы опять ничего не проверили и вообще надо было спросить ее.\n\nТеперь вы сидите перед открытым предложением о работе и боитесь соглашаться. Хотя до звонка радовались.\n\nМеня бесит, когда вам предлагают быть благодарной еще и за это. Мама вполне может хотеть помочь. И вам вполне может быть хрен*во от того, как она это делает.\n\nСлайд 3: «Мама обидится, если вы не приедете»\n\nВы приезжаете, выслушиваете замечания про вес, мужа и порядок в квартире. На обратном пути плачете, дома просите вас не трогать.\n\nЗато мама довольна: дочь приехала.\n\nЯ за то, чтобы в решении про семейный ужин учитывали и вас. Вы тоже будете за этим столом.\n\nСлайд 4: «У вас же мама одна»\n\nВы это помните. Поэтому даже вечером с температурой берете трубку, потому что вдруг случилось что-то серьезное.\n\nМама спрашивает, почему вы так редко звоните. Вы объясняете, извиняетесь и через полчаса обнаруживаете, что она так и не спросила, как вы.\n\nВам тоже хочется, чтобы мама беспокоилась о вас.\n\nСлайд 5: «Родственные связи надо поддерживать»\n\nВы сами звоните, предлагаете встретиться, подбираете подарок. Когда вы перестаете писать первой, мама тоже молчит.\n\nА потом спрашивает, куда вы пропали.\n\nМеня здесь задевает, что поддерживать отношения почему-то поручили только дочери. Мама тоже умеет набирать номер.\n\nСлайд 6: «Но я хочу общаться с мамой»\n\nВы можете скучать по ней, любить ваши разговоры про дачу и злиться, когда она начинает обсуждать ваше тело.\n\nВам доступно больше вариантов: созвониться на десять минут, встретиться в кафе, отказаться обсуждать вес, уйти домой раньше.\n\nЧтобы закончить неприятный разговор, вам достаточно того, что вам неприятно. Доказывать, что мама ужасная, не требуется.\n\nСлайд 7: Что можно сказать маме без длинного оправдания\n\n«Мам, я хочу рассказать про работу. Советы попрошу, если понадобятся».\n\n«Мой вес я обсуждать не буду. Если продолжишь, я закончу разговор».\n\n«В воскресенье я останусь дома. Увидимся в другой день».\n\n«Я понимаю, что ты расстроилась. Сегодня я все равно не приеду».\n\nМама может остаться недовольна. Вы можете выполнить то, о чем предупредили.\n\nСлайд 8: Что вам чаще говорят, когда вы отказываетесь ехать к родным?\nНапишите эту фразу в комментариях.","caption":"Иногда дочь полчаса подбирает сообщение маме, хотя ей нужно сообщить только одно: в воскресенье она занята. И мне очень жаль, сколько сил уходит на попытку написать так, чтобы мама точно не обиделась.\nКакая фраза от родных вам уже надоела?"},{"v":"zh2","text":"Слайд 1: Что я поняла про отношения за годы работы психологом\nКак мы оправдываем родных, после общения с которыми приходится приходить в себя.\n\nСлайд 2: «Мы же добра тебе желаем»\n\nВы приехали пообедать, и за супом вам объяснили, что вы поправились, мужа выбрали странного и работу пора менять. Потом мама положила вам еды с собой.\n\nИ вот вы едете домой и ругаете себя за злость: она же старалась, контейнеры собирала.\n\nБл*ть, можно взять котлеты и все равно злиться на то, как с вами разговаривали.\n\nСлайд 3: «Мама обидится, если вы не приедете»\n\nВы уже обещали подруге встретиться. Столик заказали, платье достали, давно хотелось просто посидеть и поболтать.\n\nНо маме неудобно в другой день, поэтому подруге вы пишете: «Прости, семейное».\n\nМама довольна. Подруга постепенно перестает вас звать. А вы снова думаете, что никак не получается увидеться.\n\nСлайд 4: «Ну это же семья»\n\nКогда им нужно, вы берете трубку на работе, ищете врача, заказываете продукты, приезжаете.\n\nКогда помощь нужна вам, у всех дела, спина, погода и «ты у нас сильная, справишься».\n\nМеня бесит, когда взрослой женщине предлагают гордиться тем, что на нее можно все свалить.\n\nСлайд 5: «Вы теперь предлагаете из-за каждой ссоры переставать общаться?»\n\nС родными можно поссориться, услышать друг друга, извиниться, договориться и дальше разговаривать иначе.\n\nЯ против того, чтобы вы годами терпели унижения только потому, что человек вам родственник.\n\nЕсли вы уже просили не обсуждать ваш вес, а за следующим ужином вас снова разглядывают и подкладывают салат «тебе полезно», вы вправе уйти раньше десерта.\n\nСлайд 6: Что можно сказать родным, когда вы уже все объясняли\n\n«Мам, мой вес мы сегодня не обсуждаем».\n\n«В воскресенье у меня планы. Могу приехать в среду».\n\n«Я слышу, что ты расстроилась. Сегодня я все равно останусь дома».\n\n«Если ты продолжишь меня оскорблять, я закончу разговор».\n\nСлайд 7: Какой семейной фразой вас чаще всего уговаривают потерпеть? Напишите в комментариях.","caption":"Меня особенно цепляет это «ну потерпи, ты же умная». Как будто вместе с умом женщине выдали обязанность молча все проглатывать.\n\nЯ Ольга, психолог, работаю с женщинами от 25 до 40.\nПодписывайтесь, если хочется еще таких разговоров про отношения с близкими и право решать за себя."},{"v":"живой","text":"Слайд 1: ПСИХОЛОГ СЕРГЕЙ ФИНЬКО Возможно, это забыл рассказать тебе твой психолог Запоминай @SERGEY_FINKO_ANGEL\nСлайд 2: Желание во всем быть лучшим, это системное унижение в детстве.\nСлайд 3: Самые большие деньги зарабатывают не нарциссы и не психопаты. А те, кто очень рано потерял чувство безопасности.\nСлайд 4: Нарочитая доброта в человеке говорит о подавленном гневе и боли.\nСлайд 5: Безответственность формируется чаще у гиперопекаемых детей.\nСлайд 6: Люди редко боятся близости. Чаще они боятся того, что близость снова закончится болью.\nСлайд 7: Чем сильнее человек обесценивает свои потребности, тем выше вероятность, что в детстве за них приходилось расплачиваться наказанием.\nСлайд 8: Сверх чувствительные эмпаты уже с детства выживали.\nСлайд 9: Твой психолог Ты знаешь, что делать.","caption":""}]},{"id":"k_mysl_2","topic":"слова для той, кто устала быть сильной","author":"Юлия","format":"carousel","cards":[{"v":"zh2","text":"Слайд 1: Слова для той, кто устала быть сильной\nЕсли ты все еще справляешься, но уже плачешь из-за просьбы купить хлеб по дороге домой.\n\nСлайд 2: «Я стала какой-то злой»\n\nТы только села поесть, и тебя опять зовут: найти зарядку, посмотреть сообщение, решить, что делать завтра. Ты отвечаешь резко и потом весь вечер себя ругаешь.\nТебе так хотелось хотя бы доесть, пока никто ничего от тебя не просит.\n\nСлайд 3: «Я совсем обленилась»\n\nТы сидишь в машине у дома, хотя давно могла подняться. Пакет с продуктами стоит рядом, мороженое уже тает.\nНаверху тебя сразу о чем-нибудь спросят. А здесь можно еще немного посидеть в тишине.\n\nСлайд 4: «Мне уже ничего не хочется»\n\nПодруга предлагает встретиться, и ты заранее думаешь, как будешь слушать, задавать вопросы, стараться быть приятной компанией.\nТы скучаешь по ней. И все равно отказываешься, потому что даже на разговор сейчас нужны силы, которых к вечеру почти нет.\n\nСлайд 5: «Я ведь сама сказала, что справлюсь»\n\nСказала. Когда еще высыпалась, когда задач было меньше, когда думала, что тебе помогут.\nТеперь ты засыпаешь с открытым списком дел и просыпаешься с мыслью, что опять всех подводишь.\n\nСлайд 6: Ты можешь любить своих близких и злиться, когда они снова зовут тебя из другой комнаты\n\nОсобенно если ты сама весь день откладывала и душ, и еду, и звонок подруге, потому что кому-то постоянно нужна была помощь.\n\nЗа эту злость ты еще и просишь у себя прощения. Хотя тебе самой сегодня очень хотелось услышать: «Полежи, я сделаю».\n\nСлайд 7: Каких слов тебе сейчас больше всего хочется от близкого человека? Можно написать всего одну фразу.","caption":"Меня злит, когда женщину хвалят за то, что она все тянет, и тут же просят взять еще.\nЯ Юлия, психолог, работаю с женщинами от 28 до 45 лет.\nЕсли откликается, можешь написать в комментариях «устала»."},{"v":"zh3","text":"Слайд 1: Когда ты устала быть сильной и ругаешь себя за это\nНесколько слов для тебя, если ты все еще справляешься, но уже хочешь, чтобы кто-нибудь помог.\n\nСлайд 2: «Я стала какая-то злая»\n\nТы только села, а тебя уже спрашивают, что на ужин. Ты говоришь, что в холодильнике есть еда, и слышишь: «А что именно?»\n\nИ хочется крикнуть: открой, посмотри, выбери сам. Хотя бы сегодня мне хочется просто поесть.\n\nСлайд 3: «Я уже ничего не хочу»\n\nТебя спрашивают, как ты хочешь провести выходные, и ты заранее представляешь: придется выбрать место, всех собрать, проверить погоду, заказать билеты.\n\nТы говоришь, что хочешь остаться дома. И снова слышишь, что тебя никуда не вытащишь.\n\nСлайд 4: «Мне трудно попросить о помощи»\n\nТы уже представляешь, сколько придется объяснять: где лежит, кому позвонить, во сколько забрать. А потом еще ответить на вопросы, пока ты наконец лежишь с закрытыми глазами.\n\nСлайд 5: «Я завидую, и мне стыдно»\n\nПодруга рассказывает, что муж сам записал ребенка к врачу и отвез. Ты рада за нее и одновременно думаешь: почему у нас даже об этом должна помнить я?\n\nТебе тоже хочется иногда узнать вечером, что все уже сделали без твоего участия. И спокойно допить чай.\n\nСлайд 6: Тебе тоже хочется, чтобы о тебе позаботились\n\nТы можешь уметь готовить, зарабатывать, договариваться, решать сложные вопросы и при этом хотеть, чтобы тебе принесли ужин и спросили, как ты.\n\nТебе уже сейчас тяжело. Ты еще отвечаешь на сообщения и помнишь, что завтра нужно купить молоко. Поэтому дома могут даже не замечать, насколько ты устала.\n\nСлайд 7: Какие слова тебе хочется услышать, когда ты говоришь: «Я устала»?\nНапиши одну фразу в комментариях.","caption":"Увидела сегодня очередное «сильная женщина справится со всем». И подумала, сколько всего ей теперь будет неловко попросить.\nМне хочется, чтобы дома можно было прямо сказать: сегодня я больше ничего не могу.\nДобавь в комментариях свой пункт, с чем ты устала справляться одна."},{"v":"живой","text":"Слайд 1: «Не нравится, уходи». Очередной популярно-психологический п*здец.\nВ десятых нас научили: что-то не так, срочно уходи, все это тебе не подходит.\nСлайд 2: В комментариях к прошлому посту: «ой, да просто уходите от мудаков и все», «ну не надо с ними общаться, зачем это», «прекращайте контакт и идите дальше».\nАга, конечно. Спасибо, бл*дь. Как же я сама, бл*дь, не догадалась.\nСлайд 3: Избавить себя от мудаков нельзя.\nНу невозможно. Есть сложные родственники. Есть родители в классе твоего ребенка, которые ведут себя как полнейшие мудаки. Есть начальник, коллеги или наоборот, твои клиенты. Даже когда ты от них избавляешься, общаться все равно приходится.\nСлайд 4: И плохо тоже бывает нужно.\nСитуации, где тебе некомфортно, могут быть тебе необходимы: учеба, любые перемены. Изменения в жизни вообще редко строятся через легкость и комфорт.\nСлайд 5: Уйдешь в момент, когда стало некомфортно, останешься в ж*пе. Причем в любой сфере.\nСлайд 6: Про отношения то же самое.\nОтношения переживают ссоры, конфликты, кризисы. Иногда просто период без эмоций. Уходить, потому что «что-то не понравилось в человеке», глупо: идеального человека не будет, и идеальных отношений тоже.\nСлайд 7: Что я видела как психолог.\nЯ не видела ни одних простых и счастливых отношений. Все какие-то сложные. Причем охренеть какие сложные. На все я смотрела и думала: «я бы так не смогла». Со стороны, особенно голосом твоих подружек, будет казаться, что у тебя п*здец. Но решать только тебе.\nСлайд 8: П*здец первого типа можно отшлифовать, свыкнуться и договориться. С таким живут, и живут хорошо.\nП*здец второго типа разрушает тебя и делает несчастной. Вот из такого действительно нужно уходить.\nУдарило в левую пятку «что-то не так», это повод подумать, но еще никак не решение.\nСлайд 9: Если блоги показывают слишком гламурную жизнь, почитай Достоевского, сбалансируй восприятие мира.\nСлайд 10: А тебе советовали «просто уходи»? Расскажи в комментариях, чем кончилось.","caption":""}]},{"id":"k_obzor_1","topic":"популярные способы успокоиться: что правда помогает, а что только обещает","author":"Михаил","format":"carousel","cards":[{"v":"живой","text":"Слайд 1: Моя профдеформация психолога\nСлайд 2: Я больше не умею просто смотреть кино.\nСразу замечаю, кто на кого давит и зачем. Думаю, чего герои хотят, и достраиваю историю в голове. В любом разговоре я слышу не только слова. Замечаю, кто не решается возразить, кто шутит от страха, а кто заботится о других, чтобы не заметили его самого.\nСлайд 3: Когда слышу «мне все равно», я не верю.\nДля меня «я ничего не чувствую» или «у меня все нормально» не бывают окончательным ответом. Мне сразу дико интересно, что произошло за два шага до этих слов.\nСлайд 4: Люди редко ругаются из-за грязных носков или чашек.\nОбычно за бытовыми ссорами прячутся совсем другие вопросы: «Я для тебя важен?», «Ты меня вообще видишь?», «На тебя можно положиться?». Хотя, признаю, иногда носки это просто носки, которые реально надо убрать с пола.\nСлайд 5: Я почти не верю в слово «внезапно».\nСлайд 6: Я не могу перестать смотреть на мир как терапевт.\nКак бы мне ни хотелось что-то внутри себя отключить, я все равно смотрю за слова и действия. Все равно думаю про мотивы.\nСлайд 7: Правда, если человек ведет себя как мудак, это не только травма.\nПрофессия не обязывает меня оправдывать все трудным детством.\nСлайд 8: А что ваша работа изменила в вас? Замечаете детали, которые не видят другие? Мешает это или помогает? Пишите в комментариях.","caption":""},{"v":"zh3","text":"Слайд 1: Вы подышали, а тревога осталась. Что вообще помогает успокоиться?\nРазбираем популярные способы: чего от них ждать и когда вы только сильнее переживаете.\n\nСлайд 2: Медленно подышать\nВы сидите перед собеседованием, сердце колотится, ладони мокрые. Можно дышать чуть медленнее и мягче, без огромных вдохов через силу.\n\nТак иногда удается уменьшить телесное напряжение. Обещать, что через минуту вы совершенно спокойны, я бы не стал. На собеседование можно зайти и с колотящимся сердцем.\n\nСлайд 3: Назвать пять предметов вокруг\nВы замечаете стол, окно, чашку, называете цвета, чувствуете ступнями пол. Это может помочь переключить внимание, когда вы уже представляете, как провалите собеседование и останетесь без работы.\n\nТолько искать предметы до полного исчезновения тревоги необязательно. Можно закончить и пойти разговаривать.\n\nСлайд 4: Погуглить, точно ли все хорошо\nВы ищете причину головной боли, находите знакомое описание, немного успокаиваетесь. Потом замечаете слово «иногда» и открываете следующую статью. Спать ложитесь позже, страшных вариантов знаете больше.\n\nСлайд 5: Спросить близкого еще раз\n«Ты точно на меня не злишься?»\n\nОн отвечает, вы успокаиваетесь, потом вспоминаете, каким голосом он это сказал, и спрашиваете снова. Уже неловко, но хочется наконец убедиться.\n\nПоддержка близкого помогает. Требовать от него все более убедительного ответа можно очень долго.\n\nСлайд 6: Отменить встречу\nВы пишете, что сегодня никак, и сразу становится легче. Через неделю приглашение приходит снова, и вы уже заранее придумываете причину отказаться.\n\nСлайд 7: Почему после облегчения иногда тревожнее\nЕсли вы каждый раз проверяете, переспрашиваете или уходите и сразу чувствуете облегчение, вам все труднее обходиться без этих действий.\n\nВ следующий раз хочется проверить быстрее. Вы так и не узнаете, что произошло бы, если бы вы немного поволновались и продолжили свой день.\n\nВот это меня особенно беспокоит в советах «срочно уберите тревогу любой ценой».\n\nСлайд 8: Что попробовать, когда снова хочется успокоиться\n• Если вам помогает дыхание, подышите мягко и без усилий.\n• Если хочется повторно спросить близкого, отложите вопрос хотя бы до конца ужина.\n• Если страшно идти на встречу, попробуйте прийти ненадолго вместо отмены.\n• Если из-за тревоги вы регулярно плохо спите, пропускаете работу или избегаете общения, обратитесь к психологу или психотерапевту.\n\nСлайд 9: Какой совет «от тревоги» вам дают чаще всего? Напишите его в комментариях.","caption":"Когда вижу обещание успокоить любого за минуту, сразу хочется спросить: а что делать тем, у кого через минуту все еще колотится сердце? Им ведь потом еще и за это бывает стыдно.\nЯ Михаил, психолог, работаю со взрослыми от 20 до 40 лет, которым мешает тревога.\nМожете добавить в комментариях свой способ успокоиться."},{"v":"zh2","text":"Слайд 1: Перечитываете сообщение и все равно тревожно?\nРазберем, какие способы успокоиться могут помочь и от каких вы только сильнее устаете.\n\nСлайд 2: Медленно подышать\nВы отправили сообщение начальнику, положили телефон экраном вниз, а сами уже представляете разговор об увольнении.\n\nМожно поставить ноги на пол и немного подышать спокойно, без огромных вдохов, чуть удлиняя выдох. Если кружится голова, вернитесь к обычному дыханию.\n\nТребовать от себя полного спокойствия я бы точно не стал.\n\nСлайд 3: Назвать предметы вокруг\nВы лежите в кровати и мысленно объясняете начальнику, почему допустили ошибку. Хотя он пока даже сообщение не открыл.\n\nПосмотреть вокруг, почувствовать одеяло, назвать несколько предметов в комнате бывает полезно: так легче переключить внимание на то, что происходит сейчас.\n\nКровать, шкаф, чашка. Увольнение пока происходит только у вас в голове.\n\nСлайд 4: Спросить у всех, точно ли все нормально\nВы пересылаете подруге переписку, просите мужа оценить тон сообщения, потом ищете в интернете, что означает ответ «хорошо» без смайлика.\n\nПодруга уже легла спать, муж раздражается, а вы остались с телефоном и новым вопросом: вдруг они просто вас утешают?\n\nВот к совету «переспрашивайте, пока не успокоитесь» я отношусь настороженно.\n\nСлайд 5: Запретить себе тревожиться\n«Просто отпустите» звучит замечательно, пока вам не нужно понять, что именно делать.\n\nВы убираете телефон, тревожная мысль возвращается, и теперь вы еще злитесь на себя: даже расслабиться нормально не получается.\n\nМеня раздражают такие советы. Человек и так напуган, а ему добавляют еще одну задачу, которую он должен выполнить идеально.\n\nСлайд 6: Почему после проверки снова хочется проверить\nВы получили подтверждение, что все хорошо, и вам полегчало. Но вскоре возникает новое «а вдруг», и вы снова тянетесь к телефону.\n\nЕсли каждый раз снимать тревогу проверкой, можно постепенно привыкнуть проверять все чаще. Тогда даже короткое ожидание ответа становится трудно выдержать.\n\nНасторожиться можно, когда успокоения хватает лишь до следующего вопроса.\n\nСлайд 7: Что можно сделать, пока вам не ответили\nПоставьте ноги на пол, осмотритесь, немного подышите в удобном темпе.\n\nЕсли вы уже проверили отправленное сообщение, закройте переписку до выбранного времени.\n\nСкажите себе: «Я пока не знаю, что он думает. Следующий шаг сделаю, когда получу ответ».\n\nМожно поужинать, принять душ, продолжить свое дело, даже если вы еще тревожитесь.\n\nСлайд 8: Какой совет про тревогу вас больше всего раздражает?\nНапишите в комментариях свой вариант.","caption":"Сегодня снова увидел совет «просто перестаньте накручивать». Хотелось бы спросить автора, какую кнопку он предлагает нажать.\n\nМеня зовут Михаил, я психолог, помогаю взрослым жить с меньшей тревогой.\nЕсли хотите, добавьте в комментариях свой способ успокоиться."}]},{"id":"k_obzor_2","topic":"фильмы про отношения с мамой, которые стоит посмотреть взрослой дочери","author":"Ольга","format":"carousel","cards":[{"v":"живой","text":"Слайд 1: Моя профдеформация психолога\nСлайд 2: Я больше не умею просто смотреть кино.\nСразу замечаю, кто на кого давит и зачем. Думаю, чего герои хотят, и достраиваю историю в голове. В любом разговоре я слышу не только слова. Замечаю, кто не решается возразить, кто шутит от страха, а кто заботится о других, чтобы не заметили его самого.\nСлайд 3: Когда слышу «мне все равно», я не верю.\nДля меня «я ничего не чувствую» или «у меня все нормально» не бывают окончательным ответом. Мне сразу дико интересно, что произошло за два шага до этих слов.\nСлайд 4: Люди редко ругаются из-за грязных носков или чашек.\nОбычно за бытовыми ссорами прячутся совсем другие вопросы: «Я для тебя важен?», «Ты меня вообще видишь?», «На тебя можно положиться?». Хотя, признаю, иногда носки это просто носки, которые реально надо убрать с пола.\nСлайд 5: Я почти не верю в слово «внезапно».\nСлайд 6: Я не могу перестать смотреть на мир как терапевт.\nКак бы мне ни хотелось что-то внутри себя отключить, я все равно смотрю за слова и действия. Все равно думаю про мотивы.\nСлайд 7: Правда, если человек ведет себя как мудак, это не только травма.\nПрофессия не обязывает меня оправдывать все трудным детством.\nСлайд 8: А что ваша работа изменила в вас? Замечаете детали, которые не видят другие? Мешает это или помогает? Пишите в комментариях.","caption":""},{"v":"zh3","text":"Слайд 1: 4 фильма про отношения с мамой, которые стоит посмотреть взрослой дочери\nЧтобы узнать себя, а маме или партнеру показать, о чем бывает трудно сказать вслух.\n\nСлайд 2: «Леди Берд»: почему дочь перестает рассказывать о себе\n\nМама хочет, чтобы дочь добилась большего, и постоянно объясняет, что ей стоит исправить. Дочь огрызается, скрывает планы, все меньше делится.\n\nМне ужасно жалко обеих. Мама старается, дочь хочет хоть раз договорить без замечаний.\n\nЕсли дочь поделилась планами, можно сначала спросить: «Выслушать или помочь разобраться?»\n\nСлайд 3: «Я краснею»: почему дочь говорит, что все нормально\n\nМэй старается быть удобной для мамы, скрывает свои увлечения и пугается того, как сильно может разозлиться.\n\nЗнакомо взрослым дочерям, которые уже оплачивают квартиру, но перед звонком маме придумывают, как рассказать про выходные, чтобы та не расстроилась.\n\nБл*дь, сколько сил уходит на обычный разговор.\n\nЕсли дочь рассказала что-то неожиданное, можно сказать: «Мне нужно привыкнуть. Расскажи, что тебе в этом нравится».\n\nСлайд 4: «Осенняя соната»: почему дочь замолкает после замечания\n\nЕва играет для мамы на рояле. Мама, профессиональная пианистка, показывает, как сыграть лучше.\n\nВсе вроде бы про музыку. Только Ева сидит рядом и снова чувствует, насколько она до мамы недотягивает.\n\nОчень больно смотреть, как взрослая дочь все еще ждет одобрения.\n\nКогда дочь показывает вам что-то свое, попробуйте спросить: «А тебе самой нравится, как получилось?» Дайте ей ответить до того, как начнете оценивать.\n\nСлайд 5: «Все везде и сразу»: почему дочь просит оставить ее в покое\n\nЭвелин представляет девушку своей дочери дедушке как подругу. Джой снова сталкивается с тем, что мама скрывает важную часть ее жизни.\n\nПосле такого можно уйти, отказаться от разговора, попросить больше не идти следом. Дочь уже пыталась объяснить, чего ей хочется.\n\nЕсли близкая просит побыть одной, можно ответить: «Хорошо. Я буду на связи, если захочешь поговорить». И действительно дать ей время.\n\nСлайд 6: Что сказать дочери после такого фильма\n\n«Я замечаю, что ты стала меньше мне рассказывать. Я часто начинаю давать советы?»\n\n«Когда я волнуюсь, я могу говорить резко. Понимаю, что тебе от этого тяжело».\n\n«Ты можешь со мной не соглашаться».\n\n«Я сейчас хочу возразить, но сначала послушаю тебя».\n\nДальше дочери нужно время ответить.\n\nСлайд 7: Какой фильм про маму вам хотелось бы показать своей маме?","caption":"Меня в таких фильмах больше всего цепляет момент, когда дочь уже открыла рот и передумала говорить.\nИногда хочется поставить на паузу и просто посидеть.\nОтправьте подборку тому, с кем хотели бы посмотреть один из этих фильмов."},{"v":"zh2","text":"Слайд 1: Фильмы про маму, после которых легче понять взрослую дочь\nЧто можно увидеть в ее молчании, ссорах и желании все решать самой.\n\nСлайд 2: «Леди Берд»\nДочь скрывает, куда подает документы.\n\nМама много работает, переживает о деньгах и будущем дочери, а в разговорах снова получается перечисление того, что дочь делает неправильно.\n\nИ вот девушка уже подает документы тайком.\n\nВзрослая дочь тоже может рассказывать о своих решениях последней. Иногда она боится, что ее начнут отговаривать раньше, чем она успеет договорить.\n\nБлизким здесь пригодится простое: «Расскажите, почему вы этого хотите». И дать ей закончить.\n\nСлайд 3: «Я краснею»\nДочь прячет от мамы то, от чего у нее горят глаза.\n\nПодруги, любимая группа, концерт, на который ужасно хочется. Мэй приходится выбирать, чем можно поделиться дома, потому что мама далеко не все одобрит.\n\nМеня, бл*дь, злит, как легко взрослые высмеивают чужой восторг. А потом удивляются, почему дочь ничего не рассказывает.\n\nЕсли она прячет от вас свои увлечения, попробуйте попросить показать любимую песню. Без комментария про то, какую музыку слушали в ваше время.\n\nСлайд 4: «Все везде и сразу»\nДочь приводит любимого человека и следит за каждым маминым словом.\n\nДжой приходит с девушкой, а Эвелин представляет ее дедушке как подругу.\n\nВроде семья собралась вместе. Только Джой опять приходится слушать, как мама рассказывает о ее жизни удобную для семьи версию.\n\nЕсли дочь заранее просит, как представить ее партнера, лучше уточнить и договориться.\n\nСлайд 5: «Храбрая сердцем»\nДочь срывается, когда за нее уже все решили.\n\nЭлинор готовит Мериду к будущему, которое считает правильным. Мерида все отчаяннее пытается объяснить, что жить так не хочет.\n\nВ жизни обходятся без медведей. Могут прислать адрес квартиры поближе к маме, договориться о собеседовании через знакомых, а потом обидеться на отказ.\n\nКогда дочь резко отвечает на такую помощь, спросите, нужна ли ей помощь вообще.\n\nСлайд 6: Что можно сказать дочери после такого фильма\n«Бывает, что вы заранее решаете мне что-то не рассказывать? Боитесь моей реакции?»\n\n«Вам сейчас хочется, чтобы я послушала, или вместе подумаем, что делать?»\n\n«Я уже собиралась объяснять, почему вы неправы. Подождите, я попробую вас услышать».\n\nПоследнее особенно трудно, когда очень хочется немедленно спасти собственного ребенка от его собственной жизни. Тут я всем нам сочувствую.\n\nСлайд 7: Какой фильм про отношения с мамой вы бы добавили? Напишите свой вариант в комментариях.","caption":"Иногда после семейного фильма хочется сразу позвонить маме. Иногда хочется сначала немного побыть в тишине.\nЯ Ольга, психолог, работаю со взрослыми дочерьми от двадцати пяти до сорока.\nЕсли хочется, добавьте в комментариях свой фильм."}]},{"id":"k_dialog_1","topic":"первая сессия глазами клиентки","author":"Юлия","format":"carousel","cards":[{"v":"zh3","text":"Слайд 1: Как начать первую сессию, если боишься сказать что-нибудь глупое\nПример разговора для тех, кто заранее репетирует, что расскажет психологу. А говорит клиентка, Б отвечает психолог.\n\nСлайд 2:\nА: Я в телефоне записала, что хотела рассказать. Но сейчас читаю, и вроде ничего такого. У других, наверное, серьезнее.\nБ: А дома, когда записывала, что тебя расстраивало?\nА: Я опять весь вечер проверяла, ответил ли он, и даже ужинать села с телефоном в руке.\n\nСлайд 3:\nА: Наверное, надо сначала про родителей? Я как-то неправильно начала.\nБ: Ты уже несколько раз проверила у меня, правильно ли рассказываешь. Что ты боишься сделать неправильно?\nА: Потратить все время на ерунду, а потом вы скажете, что вообще непонятно, зачем я пришла.\n\nСлайд 4:\nБ: Я пока такого не говорила. По чему ты решила, что я могу так подумать?\nА: Вы помолчали, и я подумала, что вам уже скучно.\nБ: И что тебе захотелось сделать, когда ты решила, что мне скучно?\n\nСлайд 5:\nА: Быстрее закончить про телефон и рассказать что-нибудь поважнее. Хотя я из-за этого и пришла, потому что уже устала ждать его сообщений.\nБ: Получается, даже здесь тебе хочется пропустить то, из-за чего ты переживаешь, чтобы я осталась довольна разговором?\nА: Да. Я еще и за вами слежу, интересно вам или нет.\n\nСлайд 6:\nА: А почему вы молчали?\nБ: Я слушала и ждала, захочешь ли ты продолжить. Если мое молчание тебя тревожит, можешь спросить меня прямо, как сейчас.\nА: Я боялась, что спрашивать об этом невежливо.\n\nСлайд 7:\nА: Я сейчас больше думаю о том, что вы обо мне подумаете, и поэтому теряюсь.\nА: Я записала, о чем хотела поговорить. Можно я прочитаю?\nА: Я хочу об этом рассказать, но мне стыдно. Можно пока без подробностей?\n\nСлайд 8: Что тебе страшнее всего произнести на первой встрече с психологом? Можешь написать одной фразой.","caption":"Мне жаль, когда перед первой встречей приходится еще и готовить рассказ, за который точно не будет стыдно. Я спокойно отношусь к записям в телефоне, паузам и словам «я потеряла мысль».\n\nЯ Юлия, психолог. Помогаю тем, кто впервые решается прийти и пока волнуется.\nОтправь тому, кто давно хочет записаться, но боится первой встречи."},{"v":"zh2","text":"Слайд 1: Что говорить на первой сессии, если боишься сказать глупость\nКак может выглядеть разговор с психологом, когда ты пришла впервые.\n\nСлайд 2:\nА: Я к психологу первый раз. Записала все в телефоне, потом половину удалила. Вроде читаю, и стыдно из-за такого приходить.\nБ: А что ты решила удалить?\n\nСлайд 3:\nА: Что меня расстраивает, когда подруга читает мои сообщения и не отвечает. Ей же некогда. А я сижу, проверяю, потом удаляю вопрос, чтобы не навязываться.\nБ: Ты ждешь ответа, расстраиваешься и потом сама себя за это ругаешь?\n\nСлайд 4:\nА: Да. И сейчас думаю, что вы слушаете и вам смешно. Взрослая женщина пришла жаловаться на переписку.\nБ: Я слышу, как тебе тяжело об этом говорить. Что я сейчас сказала или сделала, что ты подумала, будто мне смешно?\n\nСлайд 5:\nА: Вы ничего такого не сделали. Просто замолчали, и я сразу подумала, что сказала глупость.\nБ: Спасибо, что сказала мне об этом. Если ты будешь переживать, как я на тебя реагирую, мы можем это обсуждать прямо здесь.\n\nСлайд 6:\nА: А если вы спросите что-то про семью, а я пока не хочу рассказывать?\nБ: Так и скажи. Я могу спросить, что тебя тревожит в этом разговоре. Ты можешь ответить, что пока и это обсуждать трудно.\n\nСлайд 7: Фразы, которые можно сказать психологу на первой встрече\nА: Я боюсь, что вы решите, будто я пришла с ерундой.\n\nА: Когда вы молчите, мне кажется, что я говорю что-то неправильно.\n\nА: Я пока не готова отвечать на этот вопрос.\n\nСлайд 8: Если хочешь прийти, но переживаешь, что даже начать разговор не получится, приходи с этим. Можешь так и сказать: «Я очень волнуюсь и не знаю, с чего начать».","caption":"Меня огорчает, когда человек еще до встречи пытается угадать, с чем ему разрешат прийти. И уже готовит извинения за то, что займет время.\n\nМеня зовут Юлия, я психолог, работаю с теми, кто впервые собирается к психологу.\nОтправь тому, кто давно хочет записаться, но пока боится."},{"v":"живой","text":"Слайд 1: Федя: «Побудьте с этим чувством». Что за тупой совет? Я с ним третий день, куда еще-то?\nКлава: А с каким чувством?\nСлайд 2: Федя: Да злюсь я! Бесит все, аж зубы сводит.\nКлава: Во, «я злюсь». Уже понятнее. А что хочется сделать, чтоб отпустило?\nСлайд 3: Федя: Булку сожрать. Рилсики полистать. Бывшему написать...\nКлава: Давай секунд двадцать с этим повременим.\nСлайд 4: Федя: Ну сижу. Злая, голодная. Дальше-то что?\nКлава: Вот теперь заметь, как злость ощущается в теле. В груди давит? Живот крутит?\nСлайд 5: Федя: В груди давит. И челюсть сжала, будто бывший уже ответил.\nКлава: Побудь немного с этими ощущениями. Можешь про себя сказать: «Я злюсь. В груди давит, челюсть сжата».\nСлайд 6: Федя: Ну я все еще злюсь. Где эффект?\nКлава: А злость и не обязана пройти за двадцать секунд. Ты сейчас ее заметила, побыла с ней. Вот уже бывшему писать не хочется, и сухомятки не нажралась...\nСлайд 7: Федя: А-а-а. Так бы и сказали! А то «побудь с чувством».\nКлава: Ага! Запиши на будущее: назвать чувство, заметить, куда пытаешься от него убежать, понаблюдать за ощущениями в теле, назвать их.","caption":""}]},{"id":"k_dialog_2","topic":"разговор с внутренним критиком перед важной встречей","author":"Михаил","format":"carousel","cards":[{"v":"zh2","text":"Слайд 1: Что ответить себе перед важной встречей\nРазговор для тех, кто знает свою работу, но перед звонком уже готов извиняться.\n\nСлайд 2: А: Сейчас все поймут, что я здесь случайно. Спросит руководитель какую-нибудь мелочь, и выяснится, что меня вообще зря взяли.\n\nБ: Вы еще даже ссылку на встречу не открыли, а уже представляете, как вас увольняют. Давайте пока оставим вам возможность хотя бы выступить.\n\nСлайд 3: А: Надо еще раз проверить презентацию. И расчеты. До звонка семь минут, я как раз успею переделать первый слайд.\n\nБ: Вы уже проверяли расчеты, потом меняли заголовок, потом возвращали прежний. Воды так и не попили.\n\nСлайд 4: А: Коллега наверняка расскажет лучше. Он говорит спокойно, а я даже собственное имя сейчас произнесу как вопрос.\n\nБ: Вы слышите, как уверенно он говорит, и вспоминаете каждую свою запинку.\n\nСлайд 5: А: Если я знаю тему, я должен отвечать сразу. Начну думать вслух, они решат, что я плаваю.\n\nБ: И поэтому вы говорите «да, конечно», хотя хотите уточнить вопрос. А после встречи сидите над задачей, которую поняли только наполовину.\n\nСлайд 6: А: Лучше я сегодня просто послушаю. Если спросят, тогда скажу.\n\nБ: А потом коллега предложит то, что вы собирались сказать, все начнут обсуждать, и вы опять будете злиться на себя весь вечер.\n\nСлайд 7: А: И что мне сказать себе, когда перед встречей опять начнется: сейчас опозорюсь, все забуду, на любой вопрос должен ответить сразу?\n\nБ: «Я могу волноваться и смотреть в свои записи. Если мне нужно подумать, я скажу: дайте минуту. Если у меня нет точного ответа, скажу: проверю и вернусь с ним после встречи».\n\nСлайд 8: Что вы чаще всего говорите себе за минуту до важной встречи?","caption":"Меня раздражает совет «просто будьте увереннее». Особенно когда человек и так полночи готовился, потому что боится подвести команду.\n\nМеня зовут Михаил, я психолог, работаю со специалистами, которым около тридцати.\nОтправьте тому, кто перед каждым созвоном заново сдает экзамен на право работать."},{"v":"zh3","text":"Слайд 1: Что ответить себе, когда перед встречей вы уже уверены, что опозоритесь\nРазговор для тех, кто знает свою работу, но снова переделывает первый слайд в полночь.\n\nСлайд 2: «Они поймут, что я ничего не знаю»\n\nА: Завтра спросят что-нибудь, я растеряюсь, и все поймут, что зря меня назначили вести проект.\nБ: На какой вопрос вы пока не можете ответить?\nА: По срокам согласования. Их еще не подтвердили.\n\nСлайд 3: «Я обязан знать все»\n\nА: Я веду проект. Значит, должен сразу отвечать на любые вопросы.\nБ: Что вы обычно делаете, когда у вас нет точных данных?\nА: Уточняю у коллег и возвращаюсь с ответом. Но завтра мне почему-то стыдно даже представить, что придется так сказать.\n\nСлайд 4: «Они будут сидеть и смотреть»\n\nА: Я скажу, что уточню сроки, а они замолчат. Я начну оправдываться и пообещаю закончить раньше, хотя мы это даже с командой не обсуждали.\nБ: Что вы уже будете знать в этот момент?\nА: Что они молчат. Что они обо мне думают, я знать не буду.\n\nСлайд 5: «Надо еще подготовиться»\n\nА: Поэтому я опять открыл презентацию. Уже час меняю формулировки, до вопросов по срокам так и не дошел.\nБ: Что вы хотите получить от еще одной правки?\nА: Хочу наконец почувствовать, что завтра точно никто ко мне не придерется.\n\nСлайд 6: «А если я все-таки растеряюсь?»\n\nА: Я могу забыть даже то, что хорошо знаю. И стоять перед всеми, искать нужную вкладку.\nБ: Что вы сможете сделать прямо на встрече?\nА: Сказать: «Секунду, открою расчеты». Мне будет неловко. Открыть файл я все равно смогу.\n\nСлайд 7: Три фразы, которые можно сказать себе перед встречей\n\n«Я пока не знаю срок согласования. Остальную часть проекта я могу объяснить».\n\n«Если меня спросят о том, чего я не знаю, я уточню вопрос и договорюсь, когда вернусь с ответом».\n\n«Я могу волноваться, заглядывать в записи и брать время на расчеты».\n\nСлайд 8: За какую заминку на встрече вы потом ругаете себя весь вечер?","caption":"Меня каждый раз задевает, как легко перед важной встречей мы начинаем требовать от себя безупречного выступления. Коллеге разрешаем открыть записи, себе за ту же паузу потом устраиваем разбор до ночи.\nОтправьте тому, кто сегодня снова переделывает первый слайд."},{"v":"живой","text":"Слайд 1: Федя: «Побудьте с этим чувством». Что за тупой совет? Я с ним третий день, куда еще-то?\nКлава: А с каким чувством?\nСлайд 2: Федя: Да злюсь я! Бесит все, аж зубы сводит.\nКлава: Во, «я злюсь». Уже понятнее. А что хочется сделать, чтоб отпустило?\nСлайд 3: Федя: Булку сожрать. Рилсики полистать. Бывшему написать...\nКлава: Давай секунд двадцать с этим повременим.\nСлайд 4: Федя: Ну сижу. Злая, голодная. Дальше-то что?\nКлава: Вот теперь заметь, как злость ощущается в теле. В груди давит? Живот крутит?\nСлайд 5: Федя: В груди давит. И челюсть сжала, будто бывший уже ответил.\nКлава: Побудь немного с этими ощущениями. Можешь про себя сказать: «Я злюсь. В груди давит, челюсть сжата».\nСлайд 6: Федя: Ну я все еще злюсь. Где эффект?\nКлава: А злость и не обязана пройти за двадцать секунд. Ты сейчас ее заметила, побыла с ней. Вот уже бывшему писать не хочется, и сухомятки не нажралась...\nСлайд 7: Федя: А-а-а. Так бы и сказали! А то «побудь с чувством».\nКлава: Ага! Запиши на будущее: назвать чувство, заметить, куда пытаешься от него убежать, понаблюдать за ощущениями в теле, назвать их.","caption":""}]},{"id":"k_prod_1","topic":"как проходит работа со мной: первая встреча и что дальше","author":"Михаил","format":"carousel","cards":[{"v":"zh3","text":"Слайд 1: Что будет на первой встрече со мной\nЕсли вы думаете о психологе, но пока даже не представляете, с чего начать разговор.\n\nСлайд 2: Я приглашаю к себе тех, кто устал заранее готовиться к каждому разговору\nВы несколько раз переписываете сообщение, потому что боитесь показаться навязчивым. После разговора весь вечер вспоминаете, что сказали, и уже пропускаете мимо ушей то, что рассказывают дома. А когда думаете о психологе, начинаете репетировать еще и эту встречу.\n\nСлайд 3: На первую встречу можно прийти без готового объяснения\nМожно сказать: «Я долго собирался и сейчас вообще не понимаю, что говорить».\n\nЯ буду задавать вопросы: что сейчас происходит, в какие моменты вам особенно трудно, как вы с этим справляетесь. Мне важно услышать, как вы живете, включая то, что вам кажется неловким или незначительным.\n\nСлайд 4: Мы обсудим, что вы хотите изменить в своей жизни\nНапример, вы хотите отправлять рабочее сообщение и возвращат
