ься к делам, спокойно отказывать в просьбе, засыпать без повторного разбора каждого разговора.\n\nВам может быть трудно сразу сформулировать такую цель. Тогда будем уточнять ее вместе.\n\nСлайд 5: Что мы будем делать дальше\nЯ работаю в КПТ. Мы будем разбирать конкретные ситуации: что вы подумали, чего испугались, как поступили и что получилось.\n\nЕсли вы переписываете каждое сообщение, обсудим, какой реакции вы ждете, и договоримся, какой другой способ действовать вы готовы попробовать между встречами. Потом посмотрим, что получилось и где понадобилась помощь.\n\nСлайд 6: Что можно сказать мне прямо на встрече\n«Я сейчас согласился, хотя мне это не подходит».\n\n«Я боюсь, что вы сочтете мою проблему ерундой».\n\n«Я не понял, зачем мы это обсуждаем».\n\n«Мне трудно выполнить то, о чем мы договорились».\n\nВы можете спрашивать, возражать и говорить, когда вам слишком трудно.\n\nСлайд 7: Напишите мне, если хотите записаться на первую встречу.","caption":"Меня беспокоит, когда человек откладывает обращение, потому что считает свои трудности слишком мелкими. Об этом тоже можно поговорить на встрече.\nМеня зовут Михаил, я психолог, помогаю тем, кто решается обратиться за помощью.\nПодписывайтесь, если хочется больше понятных разговоров о тревоге и работе с психологом."},{"v":"живой","text":"Слайд 1: ЛЕНЬ НЕ СУЩЕСТВУЕТ под одним симптомом могут жить разные монстры\nСлайд 2: Почти никто не хочет быть ленивым. Зато огромное количество людей боится оказаться ленивым. О-оу. И под словом «лень» действительно может жить целый зоопарк совершенно разных существ.\nСлайд 3: «Я ПРОСТО ЛЕНИВЫЙ ЧЕЛОВЕК» На самом деле установка: «Если я не могу делать через силу, значит со мной что-то не так». Сэр Выжатый До Капли Существо, которое годами тащило все на себе и теперь стоит на берегу болота с табличкой \"лэйзи\".\nСлайд 4: «МНЕ ПРОСТО НЕ ХВАТАЕТ ДИСЦИПЛИНЫ» На самом деле установка: «Я должен идеально выполнить задачу с первого раза». Перфекционист-Таксидермист Он не начинает проект, пока не убедится, что сможет сразу сделать идеальное чучело.\nСлайд 5: да я и сам крыса, а еще вдруг я все испорчу второго раза не будет\nСлайд 6: «Я ПОСТОЯННО ОТКЛАДЫВАЮ» На самом деле установка: «Я не уверен, что справлюсь». Пророк Позора Ходит за человеком и заранее рассказывает, как все закончится катастрофой.\nСлайд 7: я не хочу рассказывать про Пророка Прозора, я ваще ничо не хочу\nСлайд 8: «МНЕ НИЧЕГО НЕ ХОЧЕТСЯ» произошла утрата контакта с потребностями, эмоциональное истощение, адаптивное существование «Я СЛИШКОМ ДОЛГО ЖИЛ ЧУЖИМИ ЖЕЛАНИЯМИ» Похититель Желаний Маленькое существо, которое много лет складывало все \"хочу\" куда-то.\nСлайд 9: я тоже Похититель Желаний, я, маленькое существо, которое много лет складывало все \"хочу\" в сумки и банки, чтобы никто не нашел, я берегу желания, чтобы никто их не испортил, не сказал, что они глупенькие\nСлайд 10: э-э-эм... я ничо не хочу, потому что у всех желания большие, а мои какие-то дурацкие\nСлайд 11: «Я МОГУ РАБОТАТЬ ТОЛЬКО В ПОСЛЕДНИЙ МОМЕНТ» На самом деле установка: «Только дедлайн создает достаточный уровень адреналина, чтобы я начал двигаться». Дракон Последней Ночи Просыпается только в три часа ночи перед сдачей проекта и питается паникой.\nСлайд 12: ЦИЦГЕЛЬ-ЦИГЕЛЬ-АЙ-ЛЮ-ЛЮ, МАЙ ФРЭНД! да я до трех и не ложусь, ведь ночью я эффективнее\nСлайд 13: Самая большая проблема слова «лень» в том, что оно ничего не объясняет. Это не причина. Под словом «лень» могут прятаться усталость, страх, тревога, выгорание, перфекционизм, потерянные желания и даже многолетнее перенапряжение. Поэтому прежде чем ругать себя за лень, стоит познакомиться с тем существом, которое живет под этим названием.\nСлайд 14: КАК ПОНЯТЬ, КАКОЙ МОНСТР ЖИВЕТ ВНУТРИ ВАШЕЙ ЛЕНИ? Если вы все откладываете, задайте себе вопрос, что я почувствую, если начну прямо сейчас? Если ответ: «стыд», «неловкость», «я облажаюсь». Возможно, рядом ходит Пророк Позора. Если задача вызывает желание сначала все изучить, подготовиться, собрать информацию и только потом начать, задавайте вопрос: «Какой минимально несовершенный результат я готов показать миру?». Если ответ: «Никакой», это Перфекционист Таксидермист. Если на вопрос «Когда в последний раз я делал что-то не потому что надо, а потому что хочется?» ответ приходится долго искать, ваши желания давно собирает в банки Похититель Желаний. Если вы можете работать только под дедлайн: «Смогу ли я сделать это сейчас, если убрать срочность?». Если без паники тело вообще не запускается, рядом дремлет Дракон Последней Ночи. Если вы называете себя ленивым уже несколько лет: «Когда я в последний раз чувствовал себя отдохнувшим?» Не выходным, не «съездили в отпуск», не «я полежал час», а по-настоящему восстановленным. Если вспомнить трудно, возможно, вы встретили Сэра Выжатого До Капли.\nСлайд 15: Если бы слово «лень» исчезло из языка, как бы я описал свое состояние? Я устал(а)? Мне страшно? Мне неинтересно? Я не вижу смысла? Я не верю, что получится? Я не понимаю, чего хочу? Очень часто именно здесь монстр впервые показывает свое настоящее имя. Я, Геннадий!\nСлайд 16: я люблю кушоть, но мне сказали это в другой пост мне\nСлайд 17: бл, Гена, ты все испортил! вот не надо было мне этот пост писать, все не тааааак! все монстру под хвоооост!","caption":""},{"v":"zh2","text":"Слайд 1: Как пройдет первая встреча со мной и что будет дальше\nДля тех, кто хочет к психологу, но пока даже не знает, с чего начать разговор.\n\nСлайд 2: Я приглашаю вас, если после обычного разговора вы еще полвечера подбираете правильный ответ\nКоллега давно ушел домой, а вы вспоминаете, как он переспросил про вашу работу, и уже думаете, что он считает вас некомпетентным. Хотели посмотреть фильм, но снова прокручиваете разговор.\n\nСлайд 3: Возможно, вы точно так же откладываете встречу с психологом\nОткрываете страницу записи, начинаете сообщение и стираете. Как объяснить, что случилось, если на работе справляетесь, с близкими общаетесь, а вечером хочется только, чтобы вас никто не трогал?\n\nКо мне можно прийти и с таким описанием. Заранее формулировать все правильно не требуется.\n\nСлайд 4: На первой встрече я помогу начать разговор\nСпрошу, что сейчас труднее всего, как давно вы это замечаете и в каких ситуациях вам особенно тяжело. Можно взять один недавний вечер и рассказать, как вы его провели.\n\nОбсудим, что вы хотели бы изменить, и вы сможете спросить меня о том, что вас волнует в нашей работе.\n\nСлайд 5: Дальше будем разбирать конкретные ситуации из вашей жизни\nНапример, коллега задал вопрос, вы решили, что плохо справляетесь, и весь вечер переделывали уже готовую работу.\n\nВ КПТ мы вместе проверяем такие выводы и подбираем другие способы действовать. Между встречами я могу предложить небольшое задание, заранее обсудив с вами, для чего оно нужно и насколько выполнимо.\n\nСлайд 6: Что можно сказать на первой встрече\n«Я долго собирался и сейчас вообще не понимаю, о чем говорить».\n\n«Мне трудно об этом рассказывать. Можно вы пока поспрашиваете?»\n\n«Я боюсь, что вы посчитаете мою проблему ерундой».\n\n«Объясните, пожалуйста, зачем вы об этом спрашиваете».\n\nЯ готов обсуждать с вами и то, с чем вы пришли, и то, как вам со мной разговаривается.\n\nСлайд 7: Если узнаете себя и хотите разобраться, приходите ко мне. Напишите мне, чтобы договориться о первой встрече.","caption":"Мне важно, чтобы на встрече вы могли переспросить, помолчать или сказать, что я вас неправильно понял.\n\nМеня зовут Михаил, я психолог, помогаю в том числе тем, кто впервые решается обратиться.\nПодписывайтесь, если хочется больше понятных разговоров о себе и о том, как проходит терапия."}]},{"id":"k_prod_2","topic":"кому подойдет консультация для пар и как к ней прийти","author":"Ольга","format":"carousel","cards":[{"v":"zh3","text":"Слайд 1: Как прийти на консультацию для пары, если вы уже устали ссориться\nКому я предлагаю встретиться и что будем делать в первый раз.\n\nСлайд 2: Зову к себе пары, которые снова поругались из-за обычного вопроса\nСпросили, кто заберет ребенка, а через десять минут уже обсуждаете, кому в этой семье вообще можно на кого-то рассчитывать. Потом надо ехать за ребенком, покупать хлеб, готовить ужин. Разговор заканчиваете, потому что пора выходить. Обида остается.\n\nСлайд 3: Еще зову тех, кто уже боится начинать разговор\nВы весь день собираетесь сказать, что вам не хватает времени вдвоем. Вечером видите, что партнер устал, и решаете потерпеть до выходных. В выходные тоже молчите, потому что наконец спокойно, жалко портить.\n\nБл*дь, как же тяжело жить вместе и каждый раз решать, можно ли сегодня сказать о себе.\n\nСлайд 4: «Мы ведь уже сто раз это обсуждали»\nВерю. Меня как раз задевает совет «просто поговорите». Вы садитесь разговаривать, один начинает перечислять обиды, другой оправдывается, первый злится еще сильнее, и вот вы опять кричите.\n\nНа консультации я помогаю вам заметить, в какой момент вы перестаете слышать друг друга и что каждый делает дальше.\n\nСлайд 5: На первой встрече можно начать с последней ссоры\nЯ попрошу каждого рассказать, что произошло, что особенно задело и с чем хочется получить помощь. Буду задавать вопросы и помогать вам говорить по очереди, чтобы у обоих была возможность закончить мысль.\n\nСлайд 6: Как предложить партнеру пойти вместе\nМожно сказать так:\n\n«Я устала от того, как мы ссоримся. Хочу попробовать сходить вместе к психологу. Мне важно услышать тебя и самой договорить, потому что дома у нас пока плохо получается. Как ты к этому относишься?»\n\nДля первой встречи достаточно одной ситуации, которую вы оба помните. Дома заранее разбирать ее заново необязательно.\n\nСлайд 7: Приходите ко мне на консультацию для пары. Напишите мне в личные сообщения «хотим на консультацию», чтобы обсудить запись.","caption":"Начать можно своими словами, даже если пока получается только «мы задолбались».\n\nЯ Ольга, психолог, работаю с парами, которые часто ссорятся.\nПодписывайтесь, если хочется еще таких разговоров: здесь я пишу о ссорах, близости и жизни вдвоем."},{"v":"живой","text":"Слайд 1: так психолог опишет запрос аудитории своем контенте в этом аудитория на самом деле узнает себя\nСлайд 2: нет опоры на себя, меняет мнение, как только слышит чужое уверенное «нет, лучше так», не может понять, чего хочет на ужин/куда идти/что делать, пока кто-то не предложит, если на нее как-то не так посмотрели весь день перебирает, что не так, хорошо чувствует себя только когда рядом у других хорошее настроение\nСлайд 3: живет не свою жизнь, ставит цели, которые при ближайшем рассмотрении вообще никак не вяжутся с тем, чего она хочет, на вопрос «а ты чего хочешь» не знает ответа, “вроде, все хорошо, но настроение постоянно плохое”\nСлайд 4: низкая самоценность, в ответ на «как круто ты это сделала» говорит «да ну, ерунда, это не сложно», если хвалят, свой успех объясняет тем, что повезло, помогли, так совпало, в разговоре часто ставит свое мнение ниже чужого, только после внешней оценки чувствует удовлетворение тем, что сделал\nСлайд 5: высокий уровень тревоги, продумывает разговор заранее, репетирует, что скажет, приходит сильно заранее, не выносит «впритык», читает про симптомы, проверяет, все ли в порядке со здоровьем, не любит, когда планы меняются в последний момент, “если я обо всем подумаю заранее, ничего плохого не случится”","caption":""},{"v":"zh2","text":"Слайд 1: Как прийти на консультацию для пары, если вы постоянно ссоритесь\nКому я предлагаю встретиться и что мы будем делать на первой встрече.\n\nСлайд 2: Я зову к себе пары, которые уже устали мириться после одного и того же разговора\n\nВы просите убрать телефон за ужином, партнер отвечает, что ему даже дома нельзя расслабиться, и через полчаса вы уже вспоминаете отпуск, его маму и кто сколько делает по дому.\n\nУжин остыл. Вы ОПЯТЬ думаете, зачем вообще начали.\n\nСлайд 3: Вы помирились, но рассказать что-то друг другу уже боитесь\n\nХотели обсудить расходы, открыли приложение банка и закрыли. В прошлый раз после такого разговора вы два дня общались только про продукты.\n\nИ вроде дома тихо, только вы сидите рядом и подбираете безопасную тему. Бл*дь, даже с человеком, с которым живете.\n\nСлайд 4: «Просто поговорите спокойно». Меня этот совет уже бесит\n\nВы бы рады. Но один спрашивает все настойчивее, потому что боится снова остаться без ответа, второй замолкает, потому что ждет очередных обвинений. Тогда первый повышает голос, второй уходит в другую комнату.\n\nНа встрече я помогу вам разобрать, как вы оба раз за разом доходите до этого места.\n\nСлайд 5: На первой встрече я попрошу каждого рассказать, что происходит\n\nВозьмем конкретную ссору: кто с чего начал, что услышал другой, в какой момент вы перестали друг друга понимать. Я буду задавать вопросы обоим и помогать говорить по очереди, чтобы каждый смог закончить мысль.\n\nЕще обсудим, чего каждый из вас хочет от встреч со мной.\n\nСлайд 6: Как предложить партнеру пойти вместе\n\n«Я устала от наших ссор. После последней я весь вечер хотела к тебе подойти и боялась, что мы снова начнем. Мне хочется, чтобы мы могли разговаривать. Ты готов пойти со мной к психологу и попробовать?»\n\nДля записи достаточно, чтобы вы оба согласились прийти. Заранее решать, кто виноват, точно не требуется.\n\nСлайд 7: Приходите ко мне на консультацию для пары. Напишите мне, если хотите записаться.","caption":"Предлагать партнеру помощь бывает неловко: вдруг услышит в этом еще одну претензию. Можно прямо сказать, что вы волнуетесь перед этим разговором.\n\nЯ Ольга, психолог, работаю с парами, которые часто ссорятся.\nОтправьте тому, с кем хочется попробовать поговорить по-другому."}]}];const V=["zh3","zh2","живой"];const KEY='psycont_compare_2026-10-20_14-30compare-karuseli';

sec.innerHTML='<h2>'+(ti+1)+'. '+esc(t.topic)+'</h2><div class="n">'+esc(t.author)+' · '+esc(t.format)+'</div>';

paint();g.appendChild(d)});sec.appendChild(g);app.appendChild(sec)});
