<style>

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:10px}
.c{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}

<header><h1>Варианты вслепую</h1><span class="n" id="cnt"></span><button id="rev">Показать, где что</button></header>
<main><p class="n">Прочитай тексты каждой темы и отметь: «Живой» (похоже на живого психолога), «Так можно публиковать», «Нейросеть». Один текст в каждой теме настоящий. Ответы сохраняются в этом браузере.</p>

<script>
const T=[{"id":"r_mif_1","topic":"«психолог просто слушает и кивает за мои деньги»","author":"Михаил","format":"reels_monolog","cards":[{"v":"h1","text":"«Зачем платить психологу, если он просто слушает и кивает?» Я бы за одни кивки тоже платить не стал.\n\nДопустим, вы рассказываете, что опять взяли работу на выходные. Начальник попросил, пришлось согласиться. И психолог спрашивает, что случилось бы, если бы вы отказали.\n\nВы говорите, что вас бы уволили. А такое уже случалось? Нет. Кого-нибудь увольняли за отказ? Тоже нет. Но вы каждую пятницу соглашаетесь так, будто увольнение уже завтра.\n\nВот это я считаю важной работой.\n\nА если психолог только кивает, вы вправе спросить, что вы вместе делаете и зачем.","caption":"На первой встрече вполне уместен вопрос о том, как будут проходить ваши встречи. Психологу стоит объяснить это понятными словами.\nМеня зовут Михаил, я психолог, работаю с людьми 25-40 лет, которые впервые приходят за помощью.\nОтправьте тому, кто пока сомневается, стоит ли идти к психологу."},{"v":"h4","text":"«Зачем платить психологу? Я и другу могу выговориться». Можете. Но слушать и сочувственно кивать для работы психолога недостаточно.\n\nВот начальник написал: «Зайдите ко мне». Вы уже вспоминаете, где ошиблись. Открываете вчерашний отчет, проверяете каждую цифру. Хотя он еще ничего не сказал.\n\nЯ бы спросил: «Почему вы решили, что вас будут ругать?» И мы бы разобрали, как вы из двух слов сделали вывод, из-за которого теперь страшно идти в кабинет.\n\nВы можете рассказывать как получается, хоть путаться, хоть повторяться. А объяснить, что мы делаем и зачем, обязан психолог. Просто сидеть и ждать, когда вам станет легче, недостаточно.","caption":"На первой встрече тоже можно спрашивать, как будет устроена работа.\nЯ Михаил, психолог, работаю с теми, кто впервые обращается за помощью.\nОтправьте тому, кто сомневается, стоит ли идти к психологу."},{"v":"h3","text":"«Психолог просто слушает и кивает за мои деньги». Одних кивков для терапии мало. Тут я с вами согласен.\n\nВот вы говорите: «Я раздражаю начальника». Спрашиваю: «Что он сделал?» Оказывается, вы написали ему, он прочитал и пока молчит. Все. А вы уже вспоминаете свои ошибки и собираетесь извиняться.\n\nЕсли просто кивать, можно вместе с вами обсуждать, как вам исправиться. Поэтому в терапии важно спросить: «Откуда мы знаем, что он раздражен?»\n\nВы уже назначили себя виноватым. Начальник еще даже ничего не сказал.","caption":"На первой встрече можно сказать прямо: «Я хочу понимать, что мы здесь делаем».\nЯ Михаил, психолог. Работаю с людьми 25-40 лет, которые впервые обращаются к психологу.\nОтправьте тому, кто сомневается, стоит ли идти."},{"v":"живой","text":"Дети, у которых было сложное детство, очень много думают. Про таких говорят: живут в своей голове. Но я добавлю одну вещь, как психолог, который много работает с такими людьми. Если человек очень много думает, скорее всего, он очень мало чувствует. Потому что он научился прятаться от всего пиздеца в голову. Анализировал обстановку дома, настроение родителей. Там было безопасно, только там был контроль. А чувствовать было больно, страшно и одиноко. Так что бесконечное обдумывание часто способ не встречаться с тревогой. В следующий раз, когда заметишь, что опять жуешь эту мыслительную жвачку, спроси себя по-доброму: котенок, а какое чувство я сейчас не хочу чувствовать? Если узнал себя, в описании есть еще.","caption":""},{"v":"h0","text":"«Зачем платить психологу? Я и с другом могу поговорить». Да, можете. И хорошо, если есть с кем. Только на консультации ваши слова еще и проверяют.\n\nДопустим, вы говорите: «Друзья встретились без меня. Я им надоел». И уже решили больше им не писать.\n\nКивать тут действительно мало. Психолог спросит: откуда вы знаете, что надоели? Вам это сказали? Или вы увидели фотографию и сами все решили?\n\nВот это уже неприятный вопрос. Вы пришли рассказать, какие друзья плохие, а выясняется, что успели поссориться с ними у себя в голове.\n\nРешать, стоит ли выяснить у друзей, что произошло, будете вы.","caption":"На консультации можно спросить, зачем психолог задает конкретный вопрос.\n\nЯ Михаил, психолог, работаю со взрослыми, которые еще ни разу не были на консультации.\nОтправьте тому, кто сомневается, есть ли смысл идти к психологу."},{"v":"h2","text":"«Психолог просто слушает и кивает за мои деньги». Если этим все и ограничивается, я тоже спрошу: за что тут платить?\n\nНо посмотрите. Вы рассказываете, что опять взяли чужую работу. Коллега попросил, вы согласились, сидели до ночи. «Ну неудобно же отказать».\n\nИ вот психолог задерживается на этом «неудобно». Что случится, если откажете? Коллега решит, что вы плохой человек? Почему его просьбы достаточно, чтобы вы отменили свои планы?\n\nНу вот, пришли пожаловаться на коллегу. И обнаружили, что сами считаете любой отказ чем-то постыдным.\n\nПри этом вы вправе понимать, над чем вы вместе работаете и зачем он задает эти вопросы.","caption":"На первой встрече вопросов бывает много, потому что психологу нужно разобраться в вашей ситуации.\nЯ Михаил, психолог, работаю с людьми от 25 до 40, которые еще ни разу не были у психолога.\nОтправьте тому, кто сомневается, стоит ли идти на первую консультацию."},{"v":"h5","text":"«Зачем платить психологу? Друг тоже может выслушать». Может. Но если на сессиях вас только слушают и больше ничего не происходит, вопрос вполне справедливый.\n\nДопустим, вы рассказываете, как десять раз проверяете сообщение начальнику. Друг скажет: «Да нормально вы написали, отправляйте уже».\n\nПсихологу важно разобраться: что случится, если вы проверите всего один раз? Вы боитесь ошибки. Перечитываете, становится спокойнее. И вот подвох: в следующий раз отправить без десяти проверок еще страшнее. Хотя сообщение было нормальным уже в первый раз.\n\nКивать тут маловато, согласен. Психолог должен помочь вам разобраться, как вы сами того не замечая усиливаете свою тревогу. И объяснить, что вы будете с этим делать на сессиях.","caption":"На первой встрече вполне уместен вопрос: «Как мы будем работать с моей проблемой?» Понятный ответ важнее количества умных слов.\nМеня зовут Михаил, я психолог, работаю с людьми 25-40 лет, которые впервые обращаются за помощью.\nОтправьте тому, кто сомневается, стоит ли идти к психологу."}]},{"id":"r_vopros_1","topic":"«а зачем мне психолог, если у меня есть подруги»","author":"Ольга","format":"reels_otvet","cards":[{"v":"h3","text":"А зачем мне психолог, если у меня есть подруги? Чтобы говорить без обязанности поддерживать в ответ. Вот вы рассказываете подруге, что опять поругались с партнером. Она вздыхает: «Блин, у меня тоже все хреново». И вы уже спрашиваете, что у нее случилось. Потому что любите ее. Через полчаса вы знаете все про ее ссору, а про свою успели сказать две фразы. В терапии можно занимать разговор целиком. Психологу не нужно, чтобы вы потом спросили: «А ты как?» Сколько вы вообще успеваете рассказать о себе, прежде чем начинаете заботиться о собеседнице?","caption":"Еще бывает, что подруга знает вашего партнера, любит вашу маму и завтра придет к вам на день рождения.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nОтправьте тому, кому сейчас нужен разговор целиком про себя."},{"v":"h2","text":"А зачем мне психолог, если у меня есть подруги? Чтобы у вас было место, где не надо заботиться еще и о дружбе. Вот вы рассказываете подруге про ссору с мужем. Она злится вместе с вами. И тут вы начинаете: «Ну вообще он хороший, просто устал». Блин, вы еще сами злитесь, но уже его защищаете. Вам ведь потом с ним жить, вместе к подруге в гости ходить. И вы заранее думаете, как она будет на него смотреть. У психолога этой общей компании нет. Можно договорить, что вас бесит, без срочного «зато он хороший».","caption":"Подруга тоже умеет слушать и поддерживать. Но бывает, что вы оставляете половину рассказа при себе, потому что знаете: она сейчас сама еле вывозит.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nОтправьте тому, кто тоже задает этот вопрос."},{"v":"h1","text":"Зачем мне психолог, если у меня есть подруги? Чтобы разобраться даже в том, за что вас хочется пожалеть. Вот вы рассказываете подруге, что опять согласились помочь, хотя сил нет, а потом весь вечер злились. Она говорит «Да они охуели уже, столько на вас вешать». И становится легче, вас поняли. Но мне как психологу еще интересно, почему вы согласились. Что случится, если вы откажете? Вы боитесь обидеть человека? Или потом будете считать себя плохой подругой? И вот тут я бы задержалась. Потому что все вокруг могут пожалеть вас, а вы завтра снова согласитесь и снова будете злиться.","caption":"Подруга тоже умеет задавать неудобные вопросы. Только дружба взаимная, ей тоже нужно место для своих переживаний. На встрече с психологом можно весь час говорить о себе.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nСохраните, если тоже задавались этим вопросом."},{"v":"h5","text":"А зачем мне психолог, если у меня есть подруги? Чтобы можно было поговорить о себе и не переживать за собеседника. Вот вы рассказываете подруге, как мама опять вас достала. Подруга вспоминает свою маму, начинает плакать. И вы уже утешаете ее, хотя сами пришли поплакать. Охренеть, поговорили. Подруга ничего плохого не сделала, у нее тоже болит. Психолог сам отвечает за свои переживания. Вам не придется сворачивать свой разговор, потому что ему тоже надо выговориться.","caption":"Даже самой близкой подруге бывает стыдно признаться, что вы ей завидуете.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nОтправьте тому, кто тоже задается этим вопросом."},{"v":"h0","text":"Зачем мне психолог, если у меня есть подруги? Чтобы говорить даже о том, что вы скрываете ради вашей дружбы. Вот вы расстались с мужчиной. Подруга слушала вас до двух ночи, потом приезжала, когда вам было хреново. Вместе решили: все, хватит. А через неделю вы к нему вернулись. И теперь перед звонком подруге думаете: «Только бы про него не спросила». Блядь, еще и здесь приходится выкручиваться. В терапии вам не приходится учитывать, сколько психолог уже потратила на вас сил. Можно сказать: «Я снова к нему вернулась» и разбираться, что вас туда тянет.","caption":"Подруга тоже может спокойно принять ваше возвращение. Но даже с ней бывает стыдно признаться, что вы снова сделали то, на что сами вчера ругались.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nОтправьте той, кто стесняется снова рассказать подруге про своего бывшего."},{"v":"h4","text":"Зачем мне психолог, если у меня есть подруги? Вот подруга выходит замуж. Вы радуетесь за нее, но вас накрывает: «Блядь, почему у меня опять ничего?» И ей вы рассказываете только про радость. Потому что любите ее, хотите сохранить дружбу. А зависть куда? С кем ее обсудить, если вы в одной компании? С психологом можно сказать все это вслух. И всю встречу обсуждать свою зависть, без необходимости потом спрашивать: «Ну, а у тебя как дела?»","caption":"Подруга тоже может быть психологом. Но она уже участвует в вашей жизни, у вас есть своя история отношений.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nСохраните, если тоже задавались этим вопросом."},{"v":"живой","text":"Как понять, что у тебя расстройство личности? Если ты не пролистала это видео, скорее всего, его у тебя нет. Все. Потому что при расстройстве личности человек обычно не сомневается в том, как он думает. Он не сидит и не гадает, все ли с ним в порядке. А если ты сидишь и гадаешь, то, скорее всего, у тебя просто яркие черты характера, с которыми можно прийти к психологу и разобраться. Диагноз по рилсу никто не ставит, и я тоже. Все, тема закрыта, всего хорошего.","caption":""}]},{"id":"r_post_1","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","author":"Юлия","format":"post","cards":[{"v":"h4","text":"Ты открываешь чат с ним, хотя телефон даже не вибрировал. Вдруг пропустила?\n\nПотом кладешь телефон экраном вверх. Включаешь сериал. Через две минуты снова проверяешь.\n\nТебе важно, чтобы он сам написал. Потому что тогда можно хоть ненадолго успокоиться: «Вспомнил обо мне. Значит, я ему нужна».\n\nНаписать первой ты вполне можешь. Уже даже придумала что. Но тут же: «Если напишу, он просто ответит. А сам бы он вообще вспомнил?»\n\nВот поэтому сообщение, которое отправляется за пять секунд, превращается в ожидание на весь вечер. Ты хочешь узнать, тянется ли он к тебе, когда ты сама ничего для этого не делаешь.\n\nИ начинаются проверки. В сети был? Сторис посмотрел? Посмотрел. «То есть в телефон зайти успел, а мне написать нет?»\n\nТы уже злишься. Решила, что сегодня точно писать не будешь. Потом видишь что-то смешное и думаешь: «Это можно скинуть. Я же просто делюсь». И опять останавливаешь себя.\n\nА когда он наконец пишет, облегчение быстро проходит. Теперь хочется понять, почему так поздно. Чем занимался. Почему раньше не мог. Вопросов снова много, много.\n\nА завтра вечером придется проверять заново.\n\nЕсли разговоры все время начинаешь ты, поговори с ним об этом прямо. Ему важно знать, что тебе тоже хочется получать сообщения первой.","caption":""},{"v":"живой","text":"Родная страна — не просто точка на карте. Это\nконтейнер\n: язык, коды, ощущение «я свой/своя».\nИ когда человек уезжает, он теряет прежде всего этот контейнер. В этот момент активируется та же система привязанности, что и в отношениях с матерью.\nМы часто говорим: мама и деньги, мама и стыд, мама и отношения. Но задумывались ли вы, что отношения с матерью влияют и на проживание эмиграции?\nПочему в одной стране одни чувствуют возможности, а другие — холод и отвержение? Потому что эмиграция — это\nвторичная сепарация:\nона либо повторяет ранний сценарий, либо даёт шанс его завершить.\nЕсли ранняя сепарация была\nподдержана\n— человек может горевать и адаптироваться. Если\nтравматичной\n— новая страна бессознательно переживается как материнский объект: «меня не принимают» или «я должна заслужить право быть здесь».\n3 марта\nна\nбесплатном\nвебинаре Анна расскажет, как материнская фигура влияет на взрослую жизнь и как это видеть в терапии.\nТакже — подробнее о специализации, стартующей в апреле.\n\nРегистрация","caption":""},{"v":"h3","text":"Он весь вечер не пишет, а ты проверяешь телефон даже по дороге из кухни в комнату.\n\nЗвук включен. Телефон рядом. Сообщение ты точно услышишь. Но все равно открываешь переписку: вдруг пропустила?\n\nУже придумала, что ему написать. Даже набрала «как день?». Посмотрела на эти два слова и стерла. Потому что сразу появляется вопрос: «А если я сейчас напишу, как я узнаю, написал бы он сам?»\n\nТебе хочется получить сообщение, к которому ты никак не приложила руку. Чтобы он сам вспомнил, сам захотел, сам нашел повод. Без твоего смешного видео, вопроса, фотографии.\n\nИ постепенно весь вечер превращается в проверку. Смотришь сериал, но после каждой сцены тянешься к телефону. Подруга прислала голосовое, ты открываешь уведомление и чувствуешь разочарование: опять она. Заходишь посмотреть, был ли он в сети. Был. Значит, телефон в руках держал. Почему тогда мне ничего?\n\nКаждый час тишины ты начинаешь считать ответом на вопрос, насколько ты ему нужна. Хотя он этого вопроса даже не слышал.\n\nА написать самой теперь трудно: хочется сохранить возможность получить то самое сообщение, которое он отправит по собственной инициативе.\n\nПоэтому даже если ты в итоге напишешь и вы прекрасно проболтаете до ночи, внутри может остаться: «А сам бы он обо мне вспомнил?»","caption":""},{"v":"h2","text":"Ты открываешь переписку с ним, хотя точно знаешь: нового сообщения нет.\n\nВ голове уже: «Если бы хотел, написал бы». И все, вечер занят. Даже когда смотришь сериал, телефон лежит экраном вверх. Вдруг напишет.\n\nТы ждешь подтверждения, что он сам о тебе вспомнил. Без напоминания. Что ему тоже хочется поговорить с тобой.\n\nСообщение уже придумала, но останавливаешь себя: «Ну сколько можно самой». Если напишешь, потом ведь начнется: «Он просто ответил из вежливости. Я бы молчала, он бы и не вспомнил».\n\nИ вот ты проверяешь телефон, чтобы узнать, нужна ли ты ему. Только ответа на такой большой вопрос одно сообщение дать не может.\n\nОн наконец пишет. Ты радуешься, отвечаешь. Через пару минут замечаешь: про твой день не спросил. «Почему я у него все спрашиваю, а он у меня ничего?» Ну вот, сообщение дождались. Теперь ждем вопроса.\n\nНаписал, но поздно. Ответил тепло, но вдруг он со всеми такой.\n\nПри этом тебе действительно важно, чтобы он тоже проявлял инициативу. Особенно если ты постоянно начинаешь разговор и предлагаешь увидеться.\n\nПосмотри на ваше общение за последние недели: он сам ищет возможности побыть с тобой? Это скажет о его интересе больше, чем то, кто первым написал сегодня вечером.","caption":""},{"v":"h0","text":"Он весь вечер не пишет, и ты проверяешь телефон даже по дороге из комнаты на кухню.\n\nВ голове уже: «Я ему вообще нужна?» Хотя днем вы нормально общались и никто ни с кем не ссорился.\n\nНаписать самой? Ты даже открываешь чат. Но тут же: «Вчера я первая написала. Сегодня пусть он». Закрываешь. И ждешь дальше.\n\nТебе важно, чтобы он сам вспомнил о тебе. Без подсказки. Тогда можно будет хоть немного успокоиться: «Значит, тоже хочет со мной поговорить».\n\nЕсли напишешь сама и он ответит, останется вопрос: «А без моего сообщения он бы вообще написал?» Ты хочешь убедиться, что ему нужна, и засчитываешь только то, что он сделал сам.\n\nПриходит уведомление. Берешь телефон, там сообщение из общего чата. Да что ж такое, еще и они сегодня разговорились.\n\nА потом он наконец пишет. Ты рада, но сразу отвечать уже не хочется: «Я тут весь вечер ждала, а ты только сейчас?» Он еще даже не знает, что ты успела расстроиться и разозлиться.\n\nТак каждый вечер без его сообщения становится проверкой ваших отношений. И даже после хорошего разговора завтра снова хочется убедиться, что он про тебя помнит.\n\nЕсли ты постоянно ждешь, что он напишет первым, скажи ему, что тебе важно тоже получать от него сообщения, без твоей инициативы. Он вполне может считать, что у вас все хорошо, пока ты каждый вечер гадаешь, интересна ли ему вообще.","caption":""},{"v":"h1","text":"Ты весь вечер проверяешь, не написал ли он, но сама первой писать не хочешь.\n\nУже и душ приняла, и сериал включила, а телефон все равно рядом, экраном вверх. Потому что сейчас его сообщение должно ответить на вопрос, который ты ему даже не задавала. Он вообще вспоминает обо мне сам?\n\nНаписать хочется. Открываешь чат, набираешь что-нибудь про свой день, стираешь. Если напишешь сама, так и не узнаешь, собирался ли он тебе написать. Придется ждать.\n\nЯ бы здесь обратила внимание на то, чего ты ждешь от этого сообщения. Тебе нужно почувствовать, что он сам захотел с тобой поговорить. Без напоминания о себе.\n\nНо дальше начинается мучительная штука. Он был в сети, сообщение так и не пришло, и ты уже думаешь, что ему с тобой скучно. Вспоминаешь, что говорила на свидании. Зачем вообще столько рассказывала? Надо было раньше уйти.\n\nОх, уже и свидание успела испортить себе задним числом. Хотя еще днем вспоминала его с улыбкой.\n\nА если все-таки пишешь и он отвечает тепло, успокоиться трудно. Сама ведь начала. Вдруг он просто вежливый?\n\nТак можно переписываться весь вечер и все равно чувствовать себя ненужной.\n\nПо одному вечеру ты не узнаешь, насколько ему нужны ваши отношения. Но если разговоры постоянно начинаешь только ты, скажи ему, что тебе хочется, чтобы он тоже сам тебе писал. Это желание не нужно прятать и молча ждать, догадается ли он.","caption":""},{"v":"h5","text":"Ты опять открываешь переписку с ним, хотя телефон даже не вибрировал.\n\nМожно самой написать «как день?». Но ты уже писала вчера. И теперь хочется дождаться: вспомнит он о тебе сам или нет?\n\nЕго сообщение должно ответить на вопрос, который ты вслух ему пока не задаешь: «Я тебе вообще нужна?»\n\nТы даже знаешь, что отправить. Видела кое-что смешное, хотела рассказать. Уже открыла переписку. Потом закрыла: «Нет, пусть хоть сегодня сам».\n\nЕсли он ответит на твое сообщение, сомнения останутся. «Ну ответил. Я же спросила». Тебе важно, чтобы он сам захотел поговорить с тобой, без напоминания.\n\nИ вот ты смотришь, когда он был в сети. Заходишь в сторис. Он успел что-то выложить, а тебе ничего. Обидно же. Особенно когда ты весь вечер помнишь о нем.\n\nПостепенно ты уже считаешь, кто сколько раз написал первым. Вчера ты, позавчера тоже ты. Сегодня нельзя, иначе «я опять навязываюсь». Даже обычное желание поболтать приходится сдерживать.\n\nПо одному вечеру этого не понять. Но если общение постоянно начинается только с твоего сообщения, стоит обсудить с ним, хочет ли он сам поддерживать связь. Ты уже слишком много вечеров пытаешься угадать ответ по телефону.","caption":""}]},{"id":"r_tg_1","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","author":"Михаил","format":"post_tg","cards":[{"v":"h2","text":"Вас похвалили, а вы ждете подвоха\n\nРуководитель пишет: «Хорошая работа». Вы отвечаете «спасибо» и тут же думаете: «В следующий раз точно поймет, что я ничего не умею».\n\nПохвала прошла мимо. Уже вечером вы прикидываете, как справиться со следующей задачей, чтобы никто ничего не заподозрил. Хотя с этой вы справились. И с предыдущей тоже.\n\nПосмотрите, как вы объясняете себе хороший результат. «Просто задача была легкая». «Коллега подсказал». «Я же три вечера все перепроверял, иначе бы точно наделал ошибок».\n\nПомощь коллеги считается. Лишние часы считаются. Ваши умения? Нет, их пока недостаточно доказали.\n\nВот тут я бы поспорил. Чтобы воспользоваться подсказкой, тоже нужно понимать, что делаешь. И подготовка входит в работу. Почему все, что вы сделали для результата, вдруг стало доказательством вашей несостоятельности?\n\nТак страх и сохраняется. Перед новой задачей вы снова думаете: «Теперь точно не вывезу». Сидите допоздна, проверяете уже проверенное. Когда все получается, говорите себе: «Хорошо, что так долго возился». И убеждаетесь, что без этих лишних часов вас обязательно раскроют.\n\nПри таком подсчете можно годами хорошо работать и чувствовать себя человеком, которого взяли по ошибке.\n\nКогда обсуждаете выполненную задачу, называйте свой вклад конкретно: что вы решили, с чем разобрались. Помощь коллеги тоже упомяните. Только свою часть работы из рассказа не вычеркивайте.","caption":""},{"v":"живой","text":"Всем плевать.\n«А можно я брошу работу?..»\n«Хочу быть домохозяйкой, это ужасно?..»\n«МИХАИЛ, А Я НОРМАЛЬНЫЙ?»\nДрузья мои, каждый день я получаю от вас десятки писем в Директ о том, что вы прямо точно «неправильные». «Со мной что-то не так» буквально звучит в каждом сообщении.\nЯ хочу открыть вам одну маленькую тайну.\nВСЕМ ПЛЕВАТЬ.\nПсихолог не знает, как вам «правильно жить», ведь такому на психфаке вообще не учат. Он без понятия, можно ли конкретно в вашем случае бросить вуз или нельзя, да и не ему это решать.\nЧто касается остальных, особенно тех, кто лезет с советами, своим ценным мнением и рекомендациями. Вы не поверите, но на самом деле им пофиг.\nРаботаете ли, за сколько вы снимаете квартиру и почему путешествуете, а не покупаете дачу.\nВсем по барабану, у людей своих задач полно. Единственное исключение — это родители. Им может и не плевать, но, по большому счёту, их вопросы и реакция — обычная тревожность.\nНапример, на месте «когда замуж» легко могло бы стоять «почему ты ешь так мало белка».\nДрузья мои, не надо класть себя в прокрустово ложе и пытаться свериться с миром, который якобы диктует вам правила жизни. Никто не диктует. Это вы так низко себя ставите, что вам какой угодно дегенерат из соцсетей может напеть, что ваше главное предназначение в жизни — жить на Бали и заниматься йогой.\nИ ему кстати тоже будет плевать, не поверите.\nДрузья, у нас полный sold-out вип-билетов на встречу в Москве 15-го июля.\nДобавили ещё немного доп. мест. Если вы тоже хотите встретиться со мной после лекции и в камерной атмосфере посидеть и пообщаться:\nдополнительные вип-билеты","caption":""},{"v":"h5","text":"Стыдно гуглить по работе?\n\nКоллега задал вопрос, вы быстро нашли ответ в интернете, написали ему и подумали: «Хорошо, что он не видел, как я гуглил».\n\nОтвет нашли, человеку помогли, но себе засчитали только одно: сразу не знали.\n\nВы ждете от настоящего специалиста, что он все умеет без подготовки. Поэтому все, что пришлось уточнить, перечитать или спросить, вычеркиваете из своих достижений. Получилось? Конечно, получилось, вы же весь вечер разбирались. Будто этот вечер работал кто-то другой.\n\nЯ бы спросил: а умение разобраться куда делось? Вы нашли нужную информацию, поняли ее и использовали. Но у вас оно проходит по разряду «выкрутился».\n\nТак и появляется страх разоблачения. Вы знаете всю свою работу изнутри: где запутались, к кому обратились, сколько раз переделали. Коллеги видят готовый результат. И вы решаете, что они просто многого о вас не знают. Узнали бы про черновики, сразу изменили бы мнение.\n\nС такими правилами опыта можно набраться сколько угодно. Уверенности больше не станет: каждую удачу вы объясните подготовкой, помощью или поиском в интернете.\n\nКогда будете рассказывать о своей работе, хоть на встрече с руководителем, включите туда и то, в чем пришлось разобраться. Не вычеркивайте половину сделанного только потому, что в начале вы этого еще не умели.","caption":""},{"v":"h3","text":"Боюсь, что на работе меня раскусят\n\nВы уже проверили отчет, но перед отправкой открываете его еще раз: вдруг там ошибка, по которой все поймут, что вы вообще случайно попали на эту должность.\n\nОшибиться в таблице теперь означает: «Ну вот, наконец все увидят, какой я специалист».\n\nИ вы начинаете подстраховываться. Проверяете каждую мелочь. Просите коллегу подтвердить то, что сами знаете. Готовитесь к короткому созвону так, будто придется защищать диплом.\n\nЗадача сдана, все в порядке. Можно бы записать себе: «Я справился». Но внутри звучит другое: «Повезло, что перепроверил. И коллега помог. Без этого точно бы провалился».\n\nПолучается замкнутый круг. Вы боитесь разоблачения, тратите лишние часы на проверки, справляетесь и решаете, что именно эти лишние часы вас спасли. Перед следующей задачей снова страшно. У вас уже целая папка законченных проектов, а ощущения, что вы умеете работать, все нет.\n\nКонечно, проверка нужна. Особенно там, где ошибка дорого стоит. Но у четвертого перечитывания обычного письма часто уже другая задача: получить полную уверенность, что к вам никто не придерется. Такой уверенности письмо дать не может.\n\nКогда в следующий раз захочется сказать «просто повезло», спросите себя: «Что именно я сделал, чтобы задача получилась?» Вашу часть работы тоже пора учитывать.","caption":""},{"v":"h0","text":"Вас хвалят, а вам неловко\n\nКоллега благодарит вас за помощь, а вы отвечаете: «Да там дел на пять минут», и сразу меняете тему.\n\nВы быстро разобрались. Получилось легко. Значит, хвалить особенно не за что.\n\nЯ бы здесь спросил: а почему пять минут обесценивают все, что вы умеете? Вы ведь потратили их на задачу, с которой другой человек пришел к вам за помощью.\n\nЕсть такая ловушка: все, что вы уже освоили, вы перестаете считать настоящим умением. «Это же очевидно». «Тут любой разберется». «Я просто знаю, куда нажать».\n\nЗамечательно. Даже знание, куда нажать, себе не засчитали.\n\nВспомните первые недели на работе. Вы могли полчаса искать нужный документ и уточнять, кому его отправить. Сейчас делаете это между делом. Но в голове никакой прибавки: просто задача теперь кажется слишком простой, чтобы считать ее доказательством своей компетентности.\n\nА вот незнакомая задача сразу идет в счет: «Ну все, сейчас выяснится, что я ничего не понимаю».\n\nИ получается, что вы каждый месяц узнаете больше, а уверенности столько же. Все знакомое вы уже исключили из оценки. Оцениваете себя только по тому, чего пока не знаете.\n\nКогда в следующий раз захочется сказать «это любой сможет», вспомните себя в первый месяц на этой работе. Вы тогда смогли бы?","caption":""},{"v":"h4","text":"«Хоть бы не спросили, как я сделал»\n\nВы сдали задачу, получили «отлично», а потом подумали: «Знали бы они, сколько я гуглил».\n\nИ похвала уже как будто не считается. Вы же искали примеры, переделывали, в одном месте спросили коллегу. Теперь страшно, что вам дадут задачу посложнее и все выяснится.\n\nДавайте посмотрим, что именно должно выясниться. Что вы не знали готового ответа? Что первый вариант не получился? Пока что вы описали обычную работу специалиста. Но у себя в голове уже записали это в доказательства собственной непригодности.\n\nВы ждете от себя очень конкретного признака: если я действительно умею, я должен сразу знать, как сделать. Без поисков и чужой помощи. И все, что получилось с усилиями, вы отказываетесь считать своим умением.\n\nВы закрыли сложную задачу, но помните прежде всего тот вечер, когда сидели перед экраном и думали: «Вообще не понимаю, с чего начать». Разобрались потом? Да. Только это у вас почему-то уже не считается.\n\nУ коллеги вы видите готовый результат. Его открытые вкладки и переписку с вопросом «слушай, ты с таким сталкивался?» вы можете вообще не увидеть.\n\nЯ бы здесь пересмотрел само требование к себе. Почему специалист должен все знать заранее? На работе постоянно приходится разбираться с тем, чего раньше не делал.\n\nЕсли вы нашли решение, проверили его и сделали задачу, у вас есть вполне конкретное умение. Даже если по дороге пришлось много гуглить.","caption":""},{"v":"h1","text":"Вы опять перечитываете письмо перед отправкой?\n\nПисьмо готово, вы уже проверили цифры, но открываете его еще раз. Вдруг там такая глупость, что коллеги сразу поймут, кого вообще взяли на работу.\n\nИ вот вы уже подбираете другое слово вместо «предлагаю». Слишком уверенно звучит. Вдруг спросят, почему вы так решили, и придется объяснять.\n\nКогда страшно, что вас раскусят, даже обычное письмо становится проверкой того, имеете ли вы право здесь работать. Поэтому отправить его после обычной проверки трудно. Хочется сначала полностью успокоиться.\n\nЯ бы здесь обратил внимание на то, что происходит ПОСЛЕ отправки. Коллеги приняли ваше предложение, работа идет дальше. Казалось бы, можно выдохнуть и признать, что вы справились.\n\nНо вы думаете примерно так: «Хорошо, что десять раз проверил. Иначе точно опозорился бы».\n\nИ к следующей задаче снова подходите с ощущением, что ничего не умеете.\n\nОбидная штука. Работы сделано уже немало, а веры в себя столько же, сколько в первый день.\n\nПроверять работу полезно. Но если каждую проверку продолжать до полного спокойствия, можно потратить час и все равно найти повод сомневаться. Тревоге всегда найдется еще одно слово, которое стоит заменить.\n\nС обычным рабочим письмом попробуйте заранее решить, что именно нужно проверить, и отправить его, когда это сделано. Даже если вы еще волнуетесь. Чтобы узнать, как коллеги оценят вашу работу, придется однажды отправить ее без десятой проверки.","caption":""}]},{"id":"r_car_1","topic":"как поддержать подругу с депрессией и не сделать хуже","author":"Ольга","format":"carousel","cards":[{"v":"h3","text":"Слайд 1: Подруга в депрессии и перестала вам отвечать\n\nСлайд 2: Вы пишете подруге: «Давайте выйдем погулять, вам станет легче». Сообщение прочитано. Ответа нет. Вы уже думаете, что сказали что-то обидное.\n\nПри депрессии даже приятное предложение может звучать как список дел: встать, помыться, одеться, поддерживать разговор. «Бл*ть, я даже зубы сегодня не почистила».\n\nСлайд 3: «Она читает сообщения и молчит»\n\nЧтобы ответить, подруге приходится собирать слова, объяснять свое состояние, думать, как вы отреагируете.\n\nМожно написать: «Отвечать сейчас необязательно. Я просто хотела дать знать, что помню о вас».\n\nСлайд 4: «Она отказывается от всего, что я предлагаю»\n\nКино, кафе, прогулка требуют участия. Если подруга отказывается, а вы предлагаете еще пять вариантов, ей приходится пять раз объяснять, почему она сейчас ничего не может.\n\nПредложите что-то маленькое и конкретное: «Могу оставить продукты у двери. Подойдет?» И дайте ей возможность отказаться.\n\nСлайд 5: «Она раздражается, когда я ее подбадриваю»\n\n«Соберитесь, вы же сильная» добавляет еще одно требование: продемонстрировать силу. Когда человек едва справляется с душем, это тяжело слышать.\n\nЯ бы убрала из разговора оценку ее характера. Можно сказать: «Похоже, сейчас вам очень тяжело. Хотите рассказать или просто посидим?»\n\nСлайд 6: «Она извиняется, что испортила мне вечер»\n\nПодруга может чувствовать обязанность быть приятной даже рядом с вами. Улыбаться, интересоваться вашими делами, благодарить за каждую минуту.\n\nНазову это «забота с домашним заданием»: помощь получена, теперь надо показать, что стало лучше. Скажите прямо: «Можно молчать. Мне сейчас ничего изображать не нужно».\n\nСлайд 7: Если после каждого разговора вы спрашиваете: «Ну что, уже лучше?», встреча постепенно становится проверкой. Подруга начинает готовить отчет о своем состоянии или избегать общения.\n\nДепрессия требует профессиональной помощи. Можно предложить конкретное участие: «Если захотите, помогу найти специалиста или доехать на прием». Решение остается за ней.\n\nСлайд 8: Начните с одного вопроса: «Что я могу взять на себя, чтобы вам сегодня было чуть проще?»\n\nИ если услышите «не знаю», можно предложить ОДНУ вещь. «Я могу привезти ужин. Хотите?»","caption":"Иногда очень хочется расшевелить подругу, потому что самой страшно видеть ее такой. Этот страх тоже можно обсудить с кем-то, кому вы доверяете.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40.\nПодписывайтесь, если хочется еще таких разговоров: здесь про отношения и то, как мы себя в них чувствуем."},{"v":"h1","text":"Слайд 1: Подруга в депрессии, вы не знаете, что сказать\n\nСлайд 2: Подруга пишет, что весь день лежит, и вы предлагаете ей выйти погулять, чтобы стало легче.\n\nВы хотите помочь. А ей уже тяжело даже сходить в душ. Теперь нужно еще объяснить вам, почему на прогулку она не пойдет.\n\nСлайд 3: Я бы убрала из поддержки ожидание, что подруга должна сразу почувствовать себя лучше.\n\nПри депрессии сил на разговор тоже может не хватать. А тут ЕЩЕ нужно обрадоваться вашему предложению, чтобы вы не расстроились. Бл*дь, еще и вас успокаивать.\n\nСлайд 4: Подруга читает сообщения и молчит.\n\nОтветить бывает трудно, особенно когда вы спрашиваете, стало ли лучше. Если все по-прежнему, она может откладывать ответ, потому что боится вас разочаровать. Напишите, что ответа не ждете. И правда оставьте ей эту возможность.\n\nСлайд 5: Подруга соглашается встретиться, потом отменяет.\n\nКогда договаривались, ей хотелось увидеться. К вечеру сил хватило только добраться до кровати. Это не значит, что ваша дружба ей безразлична. Если после каждой отмены приходится оправдываться, в следующий раз проще вообще ничего не планировать.\n\nСлайд 6: Подруга говорит, что ей ничего не помогает.\n\nВам хочется напомнить, сколько хорошего есть в ее жизни. Но она и сама это знает. От этого особенно хреново, потому что появляется вина за свое состояние. Я бы оставила разговор о том, как ей сейчас, без попытки ее переубедить.\n\nСлайд 7: Предложите подруге одну конкретную помощь, на которую легко ответить. Например, заказать ей ужин, если самой готовить тяжело.\n\nЕсли она согласится, помогите с едой и не ждите, что она сразу оживится.","caption":"Я бы спросила себя, выдержу ли я, если после моей помощи подруге все еще будет плохо.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 20 до 40.\nПодписывайтесь, если хочется еще таких разговоров, здесь я пишу про отношения и то, с чем нам бывает тяжело."},{"v":"h5","text":"Слайд 1: Подруга с депрессией перестала отвечать на сообщения\n\nСлайд 2: Вы пишете подруге: «Давайте вытащу вас погулять». Сообщение прочитано, ответа нет. Вы хотите помочь, но ей сейчас тяжело даже решить, сможет ли она выйти. Еще нужно подобрать ответ, чтобы вас не обидеть.\n\nСлайд 3: При депрессии даже простые дела могут требовать огромных усилий. И ваше предложение добавляет еще одно: ответить, договориться, собраться. «Она старается ради меня. А я даже ответить нормально не могу».\n\nСлайд 4: Подруга отвечает одним словом\n\nРаньше вы переписывались весь вечер, теперь получаете только «спасибо». На длинный разговор у нее может просто не хватать сил. Вопрос «Вы на меня обиделись?» добавит необходимость успокоить еще и вас.\n\nСлайд 5: Подруга соглашается, потом отменяет встречу\n\nВчера ей хотелось увидеться. Сегодня она с трудом встала с кровати. Обещание встретиться осталось, силы закончились. «Мы же договорились» она и сама прекрасно помнит. Именно поэтому ей так стыдно написать, что она снова останется дома.\n\nСлайд 6: Подруга перестает рассказывать, как ей плохо\n\nВы советовали прогулки, спорт, режим сна. Теперь на вопрос о самочувствии она отвечает: «Нормально». Признаться, что ничего из этого не сделала, тяжело. Она ждет нового вопроса: «А вы хоть попробовали?» И разговор хочется поскорее закончить.\n\nСлайд 7: Помощь начинает ощущаться как проверка\n\n«Ну что, погуляли? Записались? Стало лучше?» Кажется, вы просто интересуетесь. А подруга уже думает: «Бл*ть, я опять всех подвела». Если ей приходится отчитываться после каждого предложения, она начинает избегать даже тех, кто ей дорог.\n\nСлайд 8: Предложите одну конкретную помощь, на которую легко ответить: например, привезти готовую еду и оставить у двери.\n\nЗаранее уточните, подходит ли это ей. После такой помощи ей не нужно принимать вас в гостях или рассказывать, стало ли ей лучше.","caption":"Близким тоже бывает страшно: хочется срочно найти хоть что-нибудь, что поможет. Отсюда и десять советов подряд.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40 лет.\nПодписывайтесь, если хочется еще таких разборов про отношения и то, как нам бывает тяжело."},{"v":"h4","text":"Слайд 1: Подруга с депрессией не отвечает на сообщения\n\nСлайд 2: Вы пишете подруге: «Как ты?», видите, что прочитано, и ждете ответа.\n\nА ей теперь нужно подобрать слова. Решить, сколько рассказывать. Успокоить вас, если вы испугаетесь.\n\nСлайд 3: Подруга читает сообщения и молчит.\n\nПри депрессии бывает трудно даже коротко объяснить, как прошел день. Особенно когда весь день лежала и сама себя за это ругала. Она может хотеть вашего общения и при этом откладывать ответ до вечера. Потом до завтра.\n\nСлайд 4: Подруга опять отменяет встречу.\n\nВы уже выбрали тихое кафе, чтобы ей было комфортно. Но до кафе еще нужно помыться, одеться, выйти из дома. Она соглашалась, потому что хотела увидеться. А когда пришло время собираться, сил на все это не оказалось.\n\nСлайд 5: Подруга говорит «не знаю», когда вы спрашиваете, чем помочь.\n\nЧтобы ответить, ей нужно придумать задачу для вас. Потом решить, не слишком ли много она просит. В голове уже: «Бл*ть, даже это нормально объяснить не могу». Ваше предложение она услышала.\n\nСлайд 6: Подруга почти не реагирует на ваши попытки ее порадовать.\n\nВы принесли любимый десерт, а она съела пару ложек и убрала. При депрессии привычные вещи могут перестать радовать. Если ждать улыбки, ей придется ЕЩЕ и изображать, что стало лучше, чтобы вас не расстроить.\n\nСлайд 7: Подруга начинает отвечать «все нормально», хотя ей по-прежнему плохо.\n\nТак бывает, когда после каждого честного ответа начинается обсуждение: куда сходить, чем заняться, что попробовать. Ей приходится объяснять, почему она опять ничего не может. И в следующий раз проще промолчать.\n\nСлайд 8: Договоритесь с подругой об одном небольшом деле, которое вы возьмете на себя. Например, привезете готовый ужин, если она согласна.\n\nПусть ей не придется ради вашей помощи собираться, развлекать вас и показывать, что ей уже лучше.","caption":"Я бы убрала из поддержки проверку «ну что, помогло?». Подруга может быть рада, что вы рядом, даже если сегодня совсем этого не видно.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40.\nПодписывайтесь, если хочется еще таких разговоров. Здесь я пишу об отношениях и о том, как нам бывает трудно."},{"v":"h0","text":"Слайд 1: Подруга в депрессии и перестала отвечать вам.\n\nСлайд 2: Вы пишете подруге: «Давай погуляем, тебе станет легче». Она молчит. Вы хотели помочь.\n\nНо ей сейчас трудно даже помыть голову. Чтобы встретиться, придется одеться, выйти из дома, поддерживать разговор. И выслушать вопросы, почему прогулка ее не развеселила.\n\nСлайд 3: Подруга читает сообщения и молчит.\n\nОтветить тоже бывает тяжело. Особенно когда надо объяснить, как дела, а сказать получается только «все так же».\n\nОтсутствие ответа само по себе ничего не говорит о вашей дружбе. Сообщение без вопроса в конце сейчас может оказаться легче.\n\nСлайд 4: Подруга снова отменяет встречу.\n\nКогда договаривались, она правда рассчитывала прийти. Утром встала, дошла до ванной и поняла, что больше ничего не может.\n\nПосле отмены ей еще и стыдно: «Опять подвела. Лучше вообще ничего не обещать».\n\nСлайд 5: Подруга соглашается с советами, но ничего не делает.\n\n«Да, надо наладить сон». «Да, попробую гулять».\n\nЗнать, что могло бы помочь, и суметь это сделать сейчас для нее две разные задачи. Новые советы добавляют ЕЩЕ одну: потом объяснять вам, почему она снова не справилась.\n\nСлайд 6: Подруга смеется с вами, а потом говорит, что ей по-прежнему плохо.\n\nПри депрессии бывают минуты, когда человек смеется и отвлекается. По одному такому вечеру нельзя понять, что он уже поправился.\n\n«Ты же вчера была веселая» заставляет ее доказывать, что ей действительно тяжело.\n\nСлайд 7: Подруга начинает отвечать: «Все нормально».\n\nОна заметила, что после честного ответа начинается разговор о том, что ей нужно сделать. Сил на этот разговор тоже нет.\n\nБл*ть, еще и отчитываться о прогулках. Проще сказать «нормально» и остаться со всем одной.\n\nСлайд 8: Предложите подруге одну конкретную помощь: привезти готовую еду и оставить у двери, если она согласна.\n\nБез обязательной встречи и разговора о самочувствии. Пусть ей не придется развлекать вас в благодарность за ужин.","caption":"При депрессии нужна профессиональная помощь. Дружеская поддержка тоже важна, но отвечать за выздоровление подруги вам не нужно.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40 лет.\nПодписывайтесь, если хочется еще таких разговоров. Здесь я пишу об отношениях и о том, что с нами происходит."},{"v":"живой","text":"Пять признаков, что человек прошел в жизни настоящий ад. Первый. Ему неловко, когда о нем искренне заботятся или делают комплименты. Забота для него что-то непривычное, с подвохом: я теперь что-то должен. Второй. Ему физически больно просить о помощи. Он лучше умрет. Третий. Он считывает настроение людей за полсекунды. По голосу, по тому, как человек моргает, как открывает дверь. Четвертый. Он не умеет отдыхать без чувства вины. Если ничего не делает, кажется, что сейчас кто-то придет и накажет за безделье. И пятый. Когда в жизни все хорошо, ему жутко тревожно. Мозг привык, что тишина бывает перед настоящим лютым пиздецом. Сколько пунктов насчитали у себя?","caption":""},{"v":"h2","text":"Слайд 1: Подруга с депрессией снова отменила встречу\n\nСлайд 2: Вы уже собрались выходить, и тут от подруги: «Прости, сегодня не смогу».\n\nХочется ответить: «Давай все равно, тебе надо развеяться». Вы хотите помочь. Но теперь ей нужно еще и объяснять, почему она не может даже посидеть с вами в кафе.\n\nСлайд 3: При депрессии даже душ и короткий разговор могут требовать огромных усилий. А тут еще надо убедить близких, что тебе действительно плохо.\n\nБл*ть, как тяжело оправдываться, когда сил едва хватает встать с кровати.\n\nСлайд 4: Подруга отменяет планы в последний момент.\n\nКогда вы договаривались, она могла искренне хотеть встретиться. Сегодня собраться и выйти оказалось слишком трудно. Она и сама может злиться на себя: «Опять всех подвела». Уговоры добавляют еще одну задачу: отказать вам и выдержать ваше разочарование.\n\nСлайд 5: Подруга читает сообщения и молчит.\n\nОтветить бывает трудно даже любимому человеку. Нужно подобрать слова, рассказать, как дела, задать вопрос в ответ. Сообщение «Я думаю о тебе, отвечать сейчас необязательно» позволяет ей получить ваше тепло без еще одного обязательства.\n\nСлайд 6: На вопрос «Чем тебе помочь?» подруга отвечает: «Не знаю».\n\nЕй нужно придумать помощь и решить, о чем допустимо попросить. Это тоже силы. Конкретное предложение проще: например, привезти ужин. Тогда достаточно согласиться или отказаться.\n\nСлайд 7: При встрече подруга шутит и выглядит оживленной.\n\nС вами ей действительно может стать легче на какое-то время. Это НЕ означает, что депрессия прошла. После встречи сил опять может не быть. «Ты же вчера нормально смеялась» заставляет ее доказывать, что сегодняшнее состояние тоже настоящее.\n\nСлайд 8: Если подруге с депрессией тяжело общаться, предложите одну небольшую помощь, которую реально можете оказать. Например, привезти еду в удобное ей время.\n\nИ оставьте ей возможность отказаться без объяснений. Ей должно быть легко принять вашу помощь и легко сказать, что сегодня она не готова.","caption":"Когда подруга молчит, легко подумать: «Я ей больше не нужна». Понятно, что вам тоже хочется ответа и близости.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40.\nПодписывайтесь, если хочется еще таких разговоров. Здесь пишу об отношениях и о том, что с нами происходит."}]},{"id":"r_mif_2","topic":"«тревогу надо просто перестать накручивать»","author":"Юлия","format":"post","cards":[{"v":"h0","text":"«Ты сама себя накручиваешь. Просто перестань».\n\nЕсли бы это работало, ты бы давно перестала. Уж поверь, желания у тебя хватает.\n\nОн долго не отвечает. Ты уже несколько раз открыла переписку, вспомнила вчерашний разговор и думаешь: «Я что-то лишнее сказала?»\n\nА после совета «не накручивай» появляется еще одна забота. Теперь надо следить, чтобы ты даже в голове ничего лишнего не подумала. «Опять начинаю. Ну что со мной такое».\n\nПрекрасно, теперь ты еще и виновата в том, что тебе страшно.\n\nТы можешь часами ругать себя за тревогу и все это время продолжать тревожиться.\n\nПервая тревожная мысль появляется без твоего согласия. Ты отвечаешь за то, что делаешь дальше. Написать человеку десять сообщений с вопросом «ты точно не злишься?» или дождаться ответа. Обвинить его или сказать, что тебя беспокоит.\n\nМожно пока тревожиться и оставить переписку в покое. За каждую мысль, которая пришла тебе в голову, ты отвечать не обязана.","caption":""},{"v":"живой","text":"Тут, девочки, пару дней назад я прочитала в новостях инициативу о том, чтобы принять у нас закон против домашнего насилия.\n\nМеня это удивило, ибо я почему-то была уверена, что у нас этот закон есть. Не знаю откуда такая уверенность,  наверное от здравого смысла.\nИ тут сегодня вижу другую новость. И в этой новости прекрасно (нет) всё. Следим за текстом:\n\"Председатель комитета Госдумы по защите семьи Нина Останина...\" - Мисс государственная заботушка о семье\n\"...заявила, что запрет домашнего насилия заставит россиян отказаться от вступления в брак.«Парни будут бояться» «импульсивных» заявлений в полицию от женщин и откажутся от брака\"\nЧего бл%ть? Прям вот заявила?\nНу давайте попробуем прочитать это с позиции здравого смысла, я думаю это звучит примерно так:\nОстанина: \"Вы что а&уели запрещать домашнее насилие? Ведь мужчины ради этого женятся,  а без этого не будут\"\nСюр!\n\n\n\nУ меня тоже есть заявление:\nА давайте перестанем в государственных масштабах считать мужчин пугливыми ланями, которые боятся женщин,  и одновременно козлами с поносом, которые ну никак не могут сдерживаться в своих порывах! Может тогда и они (мужчины) перестанут приписывать себе это поведение как нормальное, а?!","caption":""},{"v":"h2","text":"«Просто перестань себя накручивать».\n\nЕсли бы это делалось по команде, ты бы уже перестала. Уж поверь, желающих часами мучиться из-за того, что еще даже не случилось, немного.\n\nНо после такого совета появляется еще одна мысль: «Я сама все порчу. Ничего же не произошло, зачем я опять об этом думаю?»\n\nИ вот ты уже тревожишься и ругаешь себя за тревогу. Отлично помогли, конечно.\n\nТы боишься перестать переживать. Потому что тогда будто потеряешь бдительность и что-нибудь пропустишь.\n\nОтправила важное письмо. Перечитала. Все правильно. Закрыла почту, но через пять минут снова открываешь: «А вдруг я все-таки что-то напутала?» Хочется проверить еще раз, чтобы потом не сказать себе: «Знала же, что надо было посмотреть».\n\nПока переживаешь, кажется, что делаешь все возможное, чтобы ничего плохого не случилось. Поэтому совет «перестань накручивать» звучит почти как «да брось ты, пусть все идет как идет».\n\nНо ты отвечаешь за содержание письма. Проверить его перед отправкой вполне достаточно. Даже если после проверки тебе все еще страшно.\n\nТебе не нужно оставаться в тревоге до вечера, чтобы доказать, что ты серьезно относишься к своей работе.","caption":""},{"v":"h3","text":"«Тревожишься? Просто перестань себя накручивать».\n\nАга. Осталось найти, где это выключается.\n\nОн прочитал сообщение и молчит. Ты уже думаешь: обиделся? Я что-то лишнее сказала? Ему надоело со мной общаться? И тут вспоминаешь этот прекрасный совет.\n\nТеперь вопросов еще больше. Почему я опять накручиваю? Почему не могу нормально реагировать? Вдруг я своей тревогой все испорчу?\n\nТы уже следишь и за его ответом, и за каждой своей мыслью. В голове будто проверяющий сидит: «Так, опять подумала плохое. Прекращай немедленно».\n\nИ ты принимаешь сам факт тревоги за свой проступок. Как будто специально села и решила испортить себе вечер. Очень хотелось, видимо.\n\nПервая страшная мысль часто появляется раньше, чем ты успеваешь что-то решить. За его молчание ты тоже отвечать не можешь. Он сам знает, почему пока не ответил.\n\nТвоя ответственность начинается с того, что ты делаешь дальше. Отправляешь ли десять сообщений подряд. Требуешь ли объяснений. Говоришь ли: «Я волнуюсь, когда ты надолго пропадаешь».\n\nДля этого совершенно необязательно сначала стать спокойной.\n\nМожно сидеть с тревогой, хотеть немедленного ответа и все-таки оставить телефон в покое. Даже если в голове пока шумно.","caption":""},{"v":"h4","text":"«Просто не думай о плохом, и тревога пройдет».\n\nЕсли бы мысли выключались по просьбе, ты бы давно это сделала.\n\nОн долго не отвечает. Ты уже думаешь: «Я что-то не то сказала?» Потом вспоминаешь, что сама себя накручиваешь, и начинаешь ругать себя: «Ну почему я опять так? Нормальные люди спокойно ждут».\n\nБудто тревога доказывает, что ты какая-то неправильная. Уже и спросить у кого-то поддержки стыдно. Тебе же объяснили: ты сама виновата, надо просто перестать.\n\nВот с этим я не согласна. Первая тревожная мысль приходит без твоего согласия. Ты еще ничего не успела сделать, а в голове уже: «Он больше не хочет со мной общаться».\n\nДальше у тебя есть выбор. Перечитывать переписку, искать, где ты все испортила, отправлять еще одно сообщение. Или оставить телефон и дождаться ответа, даже если внутри пока тревожно.\n\nТы отвечаешь за свои действия. Обязанности немедленно успокоиться у тебя нет. Чтобы отложить телефон, тебе не нужно сначала перестать переживать.","caption":""},{"v":"h1","text":"«Просто перестань себя накручивать, и тревога пройдет».\n\nЯ с этим советом не согласна. Особенно с этим прекрасным «просто».\n\nТы ждешь ответа на сообщение и уже думаешь, что человек обиделся. Открываешь переписку, перечитываешь свое последнее сообщение. Вроде ничего такого. Тогда почему молчит?\n\nА потом вспоминаешь, что надо перестать накручивать. И начинаешь ругать себя еще и за это. Другие спокойно живут, а ты даже со своими мыслями справиться не можешь.\n\nТеперь тебе тревожно и стыдно, что тревожно. Спасибо, помогли.\n\nТы не выбираешь первую мысль, которая приходит в голову. Она уже появилась, пока ты вообще сообразила, что происходит. И от приказа себе успокоиться она не исчезнет.\n\nЗато дальше есть вещи, которые зависят от тебя. Открыть переписку в десятый раз. Написать еще одно сообщение, чтобы проверить, точно ли все хорошо. Эти проверки дают короткую передышку, и потом снова хочется проверить.\n\nТы можешь отвечать за свои действия, даже когда внутри тревожно.\n\nЕсли уже перечитала сообщение и ничего нового там нет, отложи телефон и займись тем, что собиралась делать. Для этого тебе не нужно сначала полностью успокоиться.","caption":""},{"v":"h5","text":"«Просто перестань себя накручивать», говорят тебе, когда ты тревожишься.\n\nСпасибо, осталось найти кнопку.\n\nПосле такого совета ты еще и ругаешь себя: «Он просто не ответил. Что я опять начинаю? Почему я не могу нормально?»\n\nИ теперь надо разобраться сразу с двумя вещами. Почему он молчит и что с тобой не так.\n\nТы ведь уже пытаешься успокоиться. Перечитываешь переписку: вроде все хорошо было. Проверяешь, когда он заходил. Думаешь: «Вот ответит, и я выдохну».\n\nОн отвечает. Ты выдыхаешь. Потом замечаешь, что как-то коротко. Сердечко обычно ставил. И опять хочется уточнить, все ли нормально.\n\nТы ищешь такую ясность, после которой тревожиться будет незачем. Чтобы точно знать: он доволен, отношениям ничего не угрожает, ты нигде не ошиблась. Только получить такую гарантию на все будущие сообщения невозможно. Даже от самого любящего человека.\n\nСовет «перестань накручивать» заставляет тебя считать каждую новую тревогу своим провалом. Будто ты плохо старалась.\n\nТы не выбираешь испугаться из-за короткого ответа. Зато можешь решать, что делать дальше. Проверять чужой телефон, требовать немедленного ответа, обвинять человека только потому, что тебе страшно, за это ты отвечаешь.\n\nЕсли его молчание мешает вам договориться о встрече, спроси про встречу. Выяснять по каждому сообщению, любит ли он тебя еще, можно бесконечно.","caption":""}]},{"id":"r_rod_1","topic":"мама обижается, если я не звоню каждый день","author":"Ольга","format":"reels_spisok","cards":[{"v":"h4","text":"Четыре признака, что ежедневные звонки маме вас уже достали, но пропустить страшно.\nПервое. Вы звоните заранее, если вечером куда-то идете. Иначе весь вечер будете думать: «ВСЕ, обиделась».\nВторое. Вы оправдываетесь за пропущенный звонок. Рассказываете про совещания, хотя могли просто смотреть сериал. «Блядь, опять объяснять, что я делала».\nТретье. На мамино «ну наконец-то» начинаете говорить веселее. Пусть рассказывает сколько хочет, лишь бы перестала обижаться. Свою усталость обсудите потом с мужем.\nЧетвертое. Вас бесит, когда мама спокойно обходится без звонка. Вы весь день мучились, а она гуляла с подругой и прекрасно себя чувствовала.\nВы уже привыкли отвечать за мамино настроение. Хотя она умеет справляться и без вас.","caption":"После маминого «можешь вообще не звонить» рука сама тянется набрать ее снова.\nЯ Ольга, психолог. Работаю со взрослыми детьми 25-40 лет, которые съехали от родителей, но все еще переживают из-за их обид.\nЕсли узнали себя, напишите в комментариях «звонки»."},{"v":"h2","text":"Четыре признака для тех, чья мама обижается, если ей не звонить каждый день.\nПервое. Вы заранее готовите оправдания. Еще работаете, а уже думаете: «Скажу, что совещание затянулось».\nВторое. Мамин вздох отменяет ваш отдых. Собирались смотреть сериал, но теперь выясняете: «Мам, ну что опять?» Блядь, вечер уже занят.\nТретье. Вам трудно закончить разговор. Уже нечего рассказывать, но страшно первыми положить трубку: вдруг решит, что надоела.\nЧетвертое. Вы злитесь, когда у мамы все хорошо. Звоните после работы, готовитесь выслушивать претензии, а она весело рассказывает про соседку.\nМама уже забыла, что обиделась. А вы весь день переживали, как ее успокоить.","caption":"После такого звонка еще можно сорваться на человека рядом, который вообще ничего не сделал. И потом сидеть с мыслью: «Почему меня все так раздражает?»\nЯ Ольга, психолог. Работаю со взрослыми, которые живут отдельно, но с родителями все еще сложно.\nЕсли узнали себя, напишите в комментариях свой пункт."},{"v":"h0","text":"Четыре привычки тех, чья мама обижается, если ей не звонить каждый день.\nПервое. Вы заранее готовите оправдание. Еще даже телефон не взяли, уже решаете, достаточно ли убедительно звучит «задержалась на работе».\nВторое. Звоните, когда вам совершенно нечего сказать. Просто НАДО, иначе завтра выслушивать, какая вы неблагодарная.\nТретье. Не можете спокойно провести вечер с партнером. Смотрите на телефон: мама уже написала «Ты где?». Блядь, опять объяснять, почему вы были в кино.\nЧетвертое. Радуетесь, когда мама не берет трубку. Звонок был, теперь можно спокойно заняться своими делами.\nВы вообще хотели сегодня с ней поговорить или вам нужно было избежать ее обиды?","caption":"Даже после сорока минут разговора можно услышать: «Ну ладно, беги, тебе же некогда». И завтра снова звонить с ощущением, что вчера маме чего-то недодали.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nЕсли узнали себя, напишите в комментариях свой пункт."},{"v":"h3","text":"Четыре признака, что мамино требование звонить каждый день уже влияет на вашу отдельную жизнь.\nПервое. Вы заранее придумываете оправдание. Еще рабочий день идет, а в голове уже: «Скажу, что было совещание». Просто устать для вас недостаточная причина.\nВторое. Вы злитесь, когда звонит телефон. «Блядь, опять отчитываться». Но трубку берете веселым голосом, иначе придется еще объяснять, что с настроением.\nТретье. Вы торопите близких. Ужин, разговор, фильм надо закончить до маминого сна.\nЧетвертое. Вам стыдно сказать, почему забыли позвонить. «Было так хорошо, что весь вечер о тебе не вспоминала».\nПолучается, даже счастливый вечер требует ОПРАВДАНИЯ?","caption":"«Звонок занимает всего пять минут». А объяснения, почему вчера вы были недоступны, могут занять весь сегодняшний разговор.\nМеня зовут Ольга, я психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nЕсли откликнулось, напишите в комментариях свой пункт."},{"v":"живой","text":"Вот что люди с депрессией хотели бы, чтобы вы понимали. Первое. Депрессия не выбор и не вопрос силы воли. Человек не может просто взять себя в руки. Второе. Когда он отвечает через несколько дней или в последний момент отменяет встречу, дело в его состоянии. На вас он не злится. Третье. Причины не всегда видны со стороны. Бывает, снаружи все нормально, и от этого ему не легче. Четвертое. Вам может казаться, что он плохо старается. Но встать с кровати, принять душ, ответить на сообщение сейчас для него как мешки ворочать. И пятое. Это все тот же человек. Его характер и чувства никуда не делись, просто ему очень тяжело. И сейчас ему поддержка нужна больше, чем когда-либо.","caption":""},{"v":"h5","text":"Четыре признака для тех, кто звонит маме каждый день, лишь бы она не обиделась.\nПервое. Вы звоните, даже когда говорить совершенно не хочется. Стоите у кассы с пакетами: «Лучше сейчас, потом начнется».\nВторое. Вы заранее придумываете оправдание. Просто устали после работы? Слабовато. Надо объяснить, почему ПРАВДА не могли позвонить.\nТретье. Вы скрываете, что хорошо провели вечер. Скажете про ресторан с друзьями, услышите: «А для матери минуты нет». Блядь, уже и поужинать спокойно нельзя.\nЧетвертое. Вы радуетесь, когда мама сама не берет трубку. Сразу легче: вы позвонили, обижаться не на что.\nВы уже проверяете, довольна ли мама, прежде чем решить, как провести свой вечер. Знакомо?","caption":"Можно жить отдельно и все равно объяснять маме, почему вчера легли спать без звонка. Особенно бесит, когда после разговора вы еще пишете ей что-нибудь ласковое, чтобы точно не обиделась.\nЯ Ольга, психолог. Работаю со взрослыми детьми, которые съехали от родителей, но все еще отчитываются.\nЕсли узнали себя, напишите в комментариях свой пункт."},{"v":"h1","text":"Четыре признака, что ежедневные звонки маме стали для вас обязанностью, которую страшно пропустить.\nПервое. Вы заранее готовите оправдание. Еще рабочий день не закончился, а вы уже придумываете, как объяснить маме, почему вчера не набрали.\nВторое. Отдых начинается только после звонка. Фильм включили, но сначала надо поговорить с мамой, иначе весь вечер будете ждать обиженного сообщения. Блядь, даже кино спокойно не посмотреть.\nТретье. Вы злитесь на близких, когда мама звонит. Муж что-то спрашивает, вы огрызаетесь, потому что сейчас важно услышать, каким тоном она сказала привет.\nЧетвертое. Вы радуетесь, когда мама не берет трубку. Звонок в списке есть, вы попытались, сегодня к вам никаких претензий.\nЯ бы здесь спросила себя, почему пропущенный разговор приносит ТАКОЕ облегчение.","caption":"Если мама обиделась, вы можете потом весь вечер проверять, прочитала ли она ваше сообщение.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nЕсли узнали себя, напишите в комментариях свой пункт."}]},{"id":"r_men_1","topic":"мужчины не плачут, а потом срываются на детей","author":"Михаил","format":"reels_spisok","cards":[{"v":"живой","text":"Если у твоей девушки тревожная привязанность, вот три вещи, которые помогут ее понять. Первое. Когда ее накрывает, она может казаться агрессивной и слишком эмоциональной. В ее семье чувства не слышали, и она научилась кричать громче, чтобы ее услышали. Унизить тебя она не хочет. Второе. Она просит много контакта, потому что боится, что ты уйдешь. Ей нужно убедиться, что ты правда рядом. Контроль тут ни при чем. Третье. Она может устроить ссору в людном месте и ударить по больному. Знай, что ей в этот момент безумно страшно. А когда ребенку страшно, его берут на руки и успокаивают. Подписывайся, тут прокачиваем отношения.","caption":""},{"v":"h4","text":"Четыре признака у отцов, которые весь день терпят, а дома срываются на детей.\nПервое. Вы обрываете себя, когда хочется плакать. После тяжелого разговора ком в горле, но вы уже командуете себе: «Соберись, хватит».\nВторое. Признаться, что обидно, трудно. Сказать «все достали» гораздо проще. Даже жене вы рассказываете только, кто вас разозлил.\nТретье. Просьба ребенка становится последней каплей. Он просит помочь с конструктором, вы кричите: «Дайте мне хоть пять минут!» До этого вы весь вечер молчали, что сил уже нет.\nЧетвертое. Детские слезы раздражают особенно сильно. Хочется сказать: «Из-за такой ерунды реветь?» К себе у вас ровно такое же требование.\nЧто вы говорите себе, когда хочется плакать?","caption":"На вопрос «Что случилось?» легко ответить «Ничего», даже когда очень хочется рассказать.\nМеня зовут Михаил, я психолог, работаю с мужчинами 30-45 лет, в том числе с отцами.\nЕсли узнали себя, можете написать в комментариях свой пункт."},{"v":"h2","text":"Четыре признака папы, который привык скрывать переживания и срывается на детей.\nПервое. После неприятного разговора на работе вы говорите: «Да плевать». Но всю дорогу домой спорите с начальником в голове.\nВторое. На вопрос жены «Что случилось?» отвечаете: «Ничего». Рассказывать стыдно: «Подумает, что я ною».\nТретье. Детский шум становится последней каплей. Утром спокойно слушали эту игрушку, вечером готовы выкинуть ее в окно. Ну и зачем ей вообще десять мелодий?\nЧетвертое. Вас особенно раздражают детские слезы: «Из-за такой ерунды?» Себе вы тоже говорите: «Хватит ныть», даже когда действительно тяжело.\nВы можете злиться, но сказать «мне больно» вам до сих пор стыдно.","caption":"После крика можно весь вечер ругать себя и еще сильнее замкнуться. Так близкие и не узнают, что происходило с вами до срыва.\nМеня зовут Михаил, я психолог, работаю с мужчинами 30-45 лет, в том числе с отцами.\nЕсли хочется, добавьте в комментариях свой пункт."},{"v":"h1","text":"Четыре признака для отцов, которые весь день терпят, а вечером кричат на детей.\nПервое. Вам трудно признать, что вас обидели. Начальник при всех отчитал, вы весь вечер прокручиваете разговор и убеждаете себя, что ерунда.\nВторое. Вы стыдитесь усталости. Хочется полчаса побыть без детей, но вы же отец, чего разнылись. Я не понимаю, почему отцовство должно отменять усталость.\nТретье. Предложение помочь вас задевает. Жена предлагает подменить вас с ребенком, и сразу хочется доказать, что сами справитесь.\nЧетвертое. Детские слезы раздражают сильнее самого проступка. Разбил чашку, ладно, но зачем теперь реветь? И вы требуете немедленно успокоиться.\nРебенку достаются те же слова, которыми вы затыкаете себя, когда вам тяжело.","caption":"После крика бывает стыдно даже подойти к ребенку. И вы снова молчите, потому что признать свой срыв тоже тяжело.\nМеня зовут Михаил, я психолог, работаю с мужчинами 30-45 лет, с отцами.\nЕсли узнали себя, напишите в комментариях свой пункт."},{"v":"h5","text":"Четыре признака, что вы весь день терпите, а дома заводитесь от любой мелочи.\nПервое. Обиду вы проглатываете. Начальник при всех сказал обидную вещь, вы промолчали. Вечером все еще спорите с ним в голове.\nВторое. Признаться, что вам тяжело, стыдно. Жена спрашивает, что случилось, вы отвечаете: «Все нормально». Еще не хватало жаловаться.\nТретье. Детский шум становится невыносимым. Ребенок уронил карандаш, вы уже кричите. Карандаш! Утром вы бы даже внимания не обратили.\nЧетвертое. Слезы ребенка вызывают злость. Хочется сразу сказать: «Хватит ныть, ничего страшного». И себе вы говорите то же самое, когда хочется плакать.","caption":"После срыва стыдно, и вы снова молчите о том, как вам тяжело. Даже если очень хочется, чтобы кто-нибудь выслушал.\nМеня зовут Михаил, я психолог, работаю с мужчинами 30-45 лет, в том числе с отцами.\nЕсли узнали себя, напишите в комментариях «знакомо»."},{"v":"h3","text":"Четыре признака отцов, которые запрещают себе плакать, а потом срываются на детей.\nПервое. О неприятностях вы говорите только после того, как все решили. На работе унизили, дома отвечаете: «Нормально». Рассказывать, пока еще больно, стыдно.\nВторое. Тело напрягается раньше, чем вы замечаете обиду. Стиснули зубы, вцепились в руль. «Ладно, переживу».\nТретье. Даже отдых должен вас оправдывать. Сели поиграть, ребенок позвал, и сразу злость: «Я за весь день хоть десять минут заслужил?»\nЧетвертое. Особенно злит, как легко ребенок плачет. Проиграл, расстроился, побежал обниматься. А у вас внутри: «Я с утра терплю, а тебе можно?»\nЗнакомая мысль?","caption":"Фраза «хватит реветь» часто уже звучала у мужчины в голове до того, как он произнес ее ребенку.\nЯ Михаил, психолог, работаю с мужчинами и отцами от 30 до 45 лет.\nЕсли захотите, напишите в комментариях свой пункт."},{"v":"h0","text":"Четыре признака для отцов, которые срываются на детей, а потом себя ругают.\nПервое. Про обиду вам трудно говорить. Начальник унизил, вы промолчали. Дома ребенок разлил сок, и тут вы уже высказались.\nВторое. Испуг быстро превращается в крик. Ребенок потерялся в магазине, нашелся, вы его отчитываете. Сказать «я за тебя испугался» почему-то труднее.\nТретье. Даже усталость приходится оправдывать. «Другие справляются». Отлично, теперь еще и уставать стыдно.\nЧетвертое. Детские слезы особенно злят. В голове: «Я же терплю. Почему ему можно?»\nИ ребенок получает крик, хотя вы сами сейчас едва справляетесь.","caption":"После срыва отец может молча помогать ребенку с уроками, надеясь так помириться. Ребенок при этом все еще гадает, папа на него злится или уже нет.\nЯ Михаил, психолог, работаю с мужчинами от 30 до 45 лет, в том числе с отцами.\nЕсли узнали себя, можете написать в комментариях свой пункт."}]},{"id":"r_vopros_2","topic":"«а о чем вообще говорить на первой сессии?»","author":"Юлия","format":"reels_scenka","cards":[{"v":"h0","text":"А: Я впервые у психолога. Даже не знаю, что рассказывать.\nБ: Что сейчас приходит в голову?\nА: Что вы ждете, а я ничего сказать не могу.\nБ: Я могу подождать.\nА: Вы же решите, что я какая-то глупая.\nБ: Ты боишься, что я тебя осужу?\nА: Конечно. Я даже дома репетировала, как все объяснить.\nБ: Ох, сколько подготовки.\nА: И все забыла. Теперь сижу и извиняюсь.\nБ: Перед кем ты еще так извиняешься?\nА: Перед всеми, наверное. Если сразу понятно объяснить не получается.\nБ: Что они делают, когда не понимают?","caption":"На первой встрече ты тоже можешь задавать вопросы психологу. Например, как устроена работа и что делать, если о чем-то пока трудно говорить.\nЯ Юлия, психолог. Помогаю тем, кто впервые собирается на терапию.\nНапиши в комментариях «впервые», если пока присматриваешься."},{"v":"h2","text":"А: Я не знаю, о чем говорить на первой сессии.\nБ: Что хочется сказать сейчас?\nА: Мне плохо. Но это как-то глупо звучит.\nБ: Почему глупо?\nА: У всех проблемы. Я вас только загружу.\nБ: Боишься, что мне надоест тебя слушать?\nА: Да. Вы же тоже живой человек.\nБ: Конечно. И я пришла тебя слушать.\nА: А если я буду ныть и повторяться?\nБ: Ты уже заботишься, чтобы мне было удобно.\nА: Да я со всеми так. Вдруг надоем.\nБ: А кто тогда слушает тебя?","caption":"На первую встречу можно прийти без записей и готовой истории.\nЯ Юлия, психолог, работаю с теми, кто впервые собирается на терапию.\nЕсли хочется, напиши в комментариях, что тебя пугает в первой встрече."},{"v":"h5","text":"А: Я не знаю, о чем говорить на первой сессии.\nБ: Что сейчас приходит в голову?\nА: Что вы сидите и ждете, а я молчу.\nБ: Я тебя сейчас тороплю?\nА: Нет. Но вы же ждете чего-то толкового.\nБ: А молчать со мной страшно?\nА: Вы решите, что зря тратите на меня время.\nБ: Ох, еще и за меня переживаешь.\nА: Я просто хочу нормально начать.\nБ: Мы уже начали.\nА: С того, что я боюсь вам не понравиться?\nБ: С кем еще ты боишься не понравиться?","caption":"Перед встречей можно подготовить целый список и растеряться, когда тебя наконец слушают.\nЯ Юлия, психолог, работаю с теми, кто впервые собирается на терапию.\nНапиши «впервые», если пока только присматриваешься к терапии."},{"v":"h1","text":"А: Я пришла на первую сессию и не знаю, что говорить.\nБ: О чем думала по дороге?\nА: Что у меня ничего такого ужасного не случилось.\nБ: И что тогда?\nА: Вы послушаете и скажете, что я зря пришла.\nБ: Я пока слушаю.\nА: Я просто плачу после работы. Даже рассказывать особо нечего.\nБ: Погоди. Мне хочется про это услышать.\nА: Ну это же скучно. Все устают после работы.\nБ: Ты переживаешь, что мне скучно?\nА: Да. Хотела сначала придумать, как рассказать поинтереснее.","caption":"Я бы предложила начать даже с того, как ты собиралась на встречу. Что хотела рассказать и что решила оставить при себе.\nМеня зовут Юлия, я психолог, помогаю тем, кто впервые собирается в терапию.\nНапиши в комментариях слово «начало», если тоже думаешь, с чего начать."},{"v":"h4","text":"А: Я пришла к психологу, а что говорить, не знаю.\nБ: Что сейчас приходит в голову?\nА: Что у меня какая-то ерунда. Даже рассказывать стыдно.\nБ: Что за ерунда?\nА: Мама обиделась, что я отказалась приехать. Теперь переживаю.\nБ: О чем переживаешь?\nА: Что она там одна. И что я плохая дочь.\nБ: А рассказывать почему стыдно?\nА: Вам люди такое рассказывают. А я опять про маму.\nБ: Ты боишься, что я подумаю?\nА: Что я ною. И вам уже надоело меня слушать.\nБ: Кто тебе обычно говорит, что ты ноешь?","caption":"На первой встрече можно достать заметки из телефона, если так спокойнее.\nЯ Юлия, психолог, работаю с теми, кто впервые собирается на терапию.\nНапиши в комментариях «начало», если тоже не знаешь, с чего начать."},{"v":"h3","text":"А: Я впервые у психолога. О чем вообще говорить?\nБ: С чего тебе хочется?\nА: Я даже темы подготовила, потом все вычеркнула.\nБ: Почему вычеркнула?\nА: Ну, работа, мама, устала. Вам такое каждый день рассказывают.\nБ: И что?\nА: Хочется хоть что-нибудь интересное рассказать. Чтоб вы не скучали.\nБ: Ты сейчас обо мне думаешь?\nА: Конечно. Сидеть, слушать мое нытье. Я бы сама устала.\nБ: А ты уже устала?\nА: Да. Еще дома, пока выбирала, что вам понравится.\nБ: Мне понравится или тебе хочется рассказать?","caption":"Можно принести список тем и замолчать на первом пункте. Я могу спросить про это молчание. Иногда разговор начинается именно там.\nМеня зовут Юлия, я психолог, помогаю решиться на первую встречу.\nНапиши в комментариях одно слово: о чем тебе страшно заговорить?"},{"v":"живой","text":"А: (давит бутылку) Пытаюсь выдавить майонез. Опять кетчуп.\nБ: Так это же кетчуп. Возьми майонез.\nА: Мне нужен майонез из этой бутылки.\nБ: Зачем?\nА: Может, я просто мало стараюсь. Рано или поздно должно получиться.\nБ: Дави сколько хочешь. Это кетчуп.\nА: Я еще разок попробую.\nБ: Ладно. Майонез будет тут, если что.\nА: (давит) Давай, давай!","caption":""}]},{"id":"r_money_1","topic":"стыдно просить повышение, хотя работаю больше всех","author":"Ольга","format":"post","cards":[{"v":"h0","text":"Вы уже делаете работу за двоих, а перед разговором о повышении думаете: «Может, еще рано просить?»\n\nХочется доработать до такого момента, когда руководитель сам скажет: «Вам пора поднять зарплату». Тогда и просить не придется. И чувствовать себя наглой тоже.\n\nВот поэтому можно месяцами брать дополнительные задачи.\n\nПотому что отказ в голове звучит совсем паршиво: «Я переоценила себя. Они теперь думают, что я охренела». Простите, охр*нела. Даже в посте приходится себя поправлять.\n\nИ вы снова соглашаетесь подхватить работу коллеги. Потом задерживаетесь, чтобы закончить свою. Начальник пишет «спасибо, вы очень выручили», и вы думаете: «Ну теперь он точно видит».\n\nВидит. Что вам можно поручить еще.\n\nБл*н, как удобно получается. Компания уже пользуется вашей дополнительной работой, а вы все еще доказываете себе, что имеете право за нее попросить денег.\n\nТолько гарантии согласия у вас все равно нет. Даже если вы сделаете больше всех.\n\nЗдесь придется допустить неприятную вещь: руководитель может отказать, а вы при этом можете вполне обоснованно просить повышение. Его ответ зависит и от бюджета, и от того, хочет ли компания вообще увеличивать расходы.\n\nНазначьте отдельный разговор о зарплате с учетом того, сколько работы вы теперь выполняете. Брать еще одну задачу, чтобы окончательно набраться смелости, уже не нужно.","caption":""},{"v":"h2","text":"«Я больше всех работаю. Почему я еще должна выпрашивать повышение?»\n\nВам хочется, чтобы он САМ заметил, сколько вы делаете, и предложил больше денег.\n\nПотому что тогда вы поверите: «Меня здесь ценят». А если пришлось просить, в голове сразу: «Ну да, выпросила. Сам бы он мне ничего не предложил».\n\nИ вот вы опять берете задачу, которую больше некому делать. Заканчиваете после работы. Начальник пишет «спасибо, выручили», и вы думаете: «Ну теперь он точно видит».\n\nЧерез месяц денег столько же. Задач уже больше. Бл*ть, хоть бы раз это «спасибо» в зарплату превратилось.\n\nИдти просить теперь еще обиднее. Вы столько сделали, а вам предлагают самой объяснять, почему вы заслуживаете больше.\n\nТак разговор о зарплате становится проверкой: насколько вы важны этому человеку? Если он сам предложит повышение, значит, важны. Если молчит, значит, можно еще постараться.\n\nОх, девочки. Начальник при этом вполне может думать: вас все устраивает. Вы же соглашаетесь на новые задачи и про деньги ничего не говорите. Он доволен. Вы ждете, когда он наконец оценит.\n\nНа встречу про зарплату стоит идти с тем, как выросла ваша работа и какую сумму вы хотите за нее получать. Просьба о повышении сама по себе ничего не говорит о том, насколько вас ценят. Это станет понятнее по тому, как с вами обсудят деньги.","caption":""},{"v":"живой","text":"Взросление: Примирение через любовь\nВ финале «Бао» мать и взрослый сын вместе готовят пельмени. Это продолжения, нового этапа их отношений. Взросление не означает разрыва, а сепарация — не конец любви. Это переход к новому типу связи, где есть место и близости, и свободе. Мать учится принимать сына как взрослого, а сын ценит её любовь, возвращаясь, чтобы разделить с ней простые радости.\nПсихоанализ учит нас, что взросление — это всегда баланс между зависимостью и автономией. Если в детстве ребёнок получил достаточно тепла и поддержки, он может смело шагнуть в мир, зная, что у него есть надёжный тыл. Для матери этот процесс требует мужества: отпустить — значит довериться, что любовь не исчезнет, даже если ребёнок уходит.\nСлова поддержки для Вас\nЕсли вы, как мать из «Бао», боитесь отпустить своего ребёнка, помните: ваша любовь — это фундамент, который навсегда останется с ним. Отпуская, вы не теряете, а даёте ему крылья, зная, что он вернётся, потому что вы научили его ценить дом. Если вы — сын или дочь, стремящиеся к самостоятельности, не бойтесь идти вперёд. Ваше взросление — не предательство, а дар, который вы возвращаете миру, оставаясь связанными с теми, кто вас вырастил. Любовь не исчезает, она трансформируется, становясь глубже и свободнее.","caption":""},{"v":"h4","text":"Взять еще чужую задачу вам проще, чем спросить про свою зарплату.\n\nПотому что просьба о повышении для вас звучит как признание: «Я хочу больше». И тут стыдно. Вдруг решат, что зажралась?\n\nА если начальник сам заметит, сколько вы делаете, и повысит зарплату, тогда спокойно. Вы ничего не выпрашивали. Вас ценят. САМИ заметили.\n\nКоллега в отпуске, вы подхватили ее работу. Новый проект тоже у вас. Начальник пишет вечером, вы отвечаете, хотя уже легли. И каждый раз где-то внутри: «Ну теперь-то он видит».\n\nОн видит, что вы справляетесь. Вы ждете, что он еще и поймет, сколько вам за это надо платить. У него такого пункта в голове может вообще не быть.\n\nИ вот это, б*ять, обидно. Вы уже столько сделали, что просьба о деньгах кажется почти унизительной. Как будто вам теперь еще надо доказывать очевидное.\n\nПоэтому вы берете следующую задачу. Вдруг после нее наконец предложат сами.\n\nПросить страшно еще и потому, что могут отказать. Пока вы молчите, остается надежда: «Просто пока не заметили».\n\nДля разговора о повышении хватит того, что у вас вырос объем работы. Начните с этого на встрече с руководителем и обсудите конкретную сумму. Вам не нужно брать еще один проект, чтобы получить право спросить про деньги.","caption":""},{"v":"h1","text":"«Если я сама попрошу повышение, получится, что выпросила».\n\nИ вы ждете, когда руководитель сам заметит, сколько вы делаете, и предложит больше денег. Тогда можно будет спокойно их взять. Он сам решил, значит, правда ценит.\n\nЯ бы здесь спросила, почему после вашей просьбы деньги вдруг становятся какими-то незаслуженными. Работу вы уже сделали. Откуда это ощущение, что теперь придется клянчить?\n\nПотому что вам хочется получить подтверждение, что вы нужны, без подсказки. Если человек сам заметил ваши усилия, ему веришь. А если пришлось сказа
