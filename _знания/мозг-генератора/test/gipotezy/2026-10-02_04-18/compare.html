. Руководитель просит поправить ссылки, а тебе уже стыдно отправлять следующую версию.\n\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nЕсли узнаешь себя, напиши в комментариях «диплом»."},{"v":"h5","text":"«Почему я не могу сесть за диплом? Времени уже почти нет».\n\nОткрываешь файл, перечитываешь начало. «Что за ерунда я написала». Закрываешь. Завтра попробуешь еще раз.\n\nЕсли каждая кривая фраза для тебя означает «я тупая», писать страшно. Черновик ведь обязательно будет кривым.\n\nНо ты уже представляешь, как научрук читает и думает: «И чему она вообще научилась?»\n\nПока диплом недописан, остается объяснение: «Я просто еще не успела нормально сделать».\n\nНичего себе задача для одного диплома. Как тут спокойно писать, если на защите будто решат, умная ты вообще или нет?","caption":"Замечание «здесь нужно переделать» легко услышать как «ты ничего не умеешь». Особенно когда самой хочется хоть раз сделать все без замечаний.\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nЕсли знакомо, можешь написать в комментариях «диплом»."},{"v":"h2","text":"«До сдачи диплома неделя. Почему я опять весь день его не пишу?»\n\nОткрываешь файл, читаешь первые две строчки. И надо срочно убрать со стола. Очень вовремя, конечно.\n\nЕсли тебе важно написать диплом так, чтобы никто не придрался, садиться за него страшно. Пока текста нет, можно думать: «Я бы хорошо написала, если бы собралась». А готовый текст уже можно прочитать и раскритиковать.\n\nИ ты тянешь. Когда останется одна ночь, появится объяснение: «Просто времени не хватило».\n\nТы уже боишься оценки за диплом, который еще даже не написан.","caption":"Даже просьба научрука уточнить формулировку может звучать в голове как «ты вообще ничего не понимаешь». Хотя он видел всего один абзац.\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nЕсли узнала себя, можешь написать в комментариях «диплом»."},{"v":"h3","text":"«До сдачи диплома две недели, а я опять весь вечер листаю телефон».\n\nОткрываешь файл. Смотришь на заголовок. Ну, сначала надо найти еще одну статью. Потом уже точно начну.\n\nЗнаешь, чем так удобен ненаписанный диплом? Он пока может получиться идеальным. В голове ты все красиво свяжешь, убедительно объяснишь. А пишешь первый абзац и видишь: слова повторяются, мысль теряется, звучит как-то глупо.\n\nИ хочется закрыть файл.\n\nСрок уже горит. Зато диплом в голове все еще прекрасный.","caption":"Даже замечание научного руководителя про один абзац может ощущаться как оценка всех твоих способностей. Особенно когда от диплома ждешь доказательства, что все эти годы училась не зря.\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nЕсли знакомо, напиши в комментариях «диплом»."},{"v":"живой","text":"Иногда нужно очень сильно охуеть, чтобы жизнь начала меняться. Охуеть это когда ты просыпаешься и видишь все как есть, и тебе противно, потому что ты наконец поняла правду. Больно, неприятно, но с этого все и сдвигается. Охуеть это когда видишь свой вклад: ты это выбирала, терпела и ничего не делала. Хорошая новость в том, что раз когда-то ты это выбрала, теперь можешь от этого отказаться. Охуеть это когда перестаешь ждать, что он изменится, деньги упадут с неба, проблемы решатся сами. Охуеть это когда выбираешь себя, даже если другим от этого неудобно. Эгоизм тут ни при чем. Ты просто вспомнила, что ты тоже есть.","caption":""}]},{"id":"r_gnezdo_1","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","author":"Михаил","format":"post_tg","cards":[{"v":"h5","text":"Дети уехали. Для кого готовить завтрак?\n\nРаньше с утра уже было понятно, что делать. Кто во сколько встает, что нужно купить, о чем напомнить. Вы могли сердиться, что опять все на вас. Мечтали спокойно выпить чай.\n\nТеперь можно. А вы сидите на кухне и думаете: «И что мне делать весь день?»\n\nПотом еще себя ругаете: «У детей все хорошо. Живут своей жизнью. Чего я раскис?»\n\nУ них действительно может быть все хорошо. И вам при этом может быть очень тяжело.\n\nКогда годами многое делаешь для детей, их жизнь помогает устраивать и свою. Есть ради кого подняться, выйти из дома, приготовить ужин, даже если самому ничего не хочется. Ваши собственные желания все это время могли ждать. «Потом разберусь, сейчас некогда».\n\nИ вдруг это «потом» наступило. Только понять, чего вы хотите для себя, с первого свободного утра не получается.\n\nА вам уже советуют: займитесь собой, найдите увлечение, радуйтесь свободе. Будто вы столько лет только и ждали, когда наконец сможете записаться в бассейн. Да вы сейчас можете даже любимую еду не вспомнить. Все последние годы покупали то, что любят домашние.\n\nВы уже много сделали. Вырастили детей, участвовали в их жизни, привыкли каждый день быть им нужными в самых обычных делах. Теперь этих дел стало меньше, и вы чувствуете пустоту.\n\nМожно радоваться, что дети устроились, и скучать по жизни, в которой они каждый вечер приходили домой. Вам сейчас грустно, даже если все сложилось хорошо.","caption":""},{"v":"h3","text":"Дети уехали. Зачем теперь вставать?\n\nРаньше с утра все было понятно: кого разбудить, что приготовить, кому напомнить про теплую куртку. Потом дети выросли, появились другие заботы. Но в голове все равно крутилось: как они, поели ли, когда вернутся.\n\nТеперь можно поспать. Можно спокойно выпить кофе. Вы ведь столько раз об этом мечтали. И вот сидите на кухне и думаете: «Ну и зачем мне теперь вставать?»\n\nА следом ругаете себя: «Дети устроились, у них все хорошо. Радоваться надо. Что я опять развожу тоску?»\n\nЯ бы здесь остановился. Годами ответ на вопрос «зачем вставать» приходил к вам сам. Кто-то просыпался в соседней комнате, просил завтрак, искал ключи.\n\nИ вместе с детьми из дома уехала эта ежедневная понятность. Любовь осталась. Дел по хозяйству хватает. А привычного ответа, ради чего все это сегодня, больше нет.\n\nПоэтому совет «ну займитесь наконец собой» может даже злить. Как будто вы только и ждали свободной комнаты, чтобы немедленно стать человеком с увлечениями и планами. Вы еще к тишине за завтраком не привыкли, а от вас уже требуют интересной новой жизни.\n\nВы многое сделали. Довели до момента, когда дети могут жить отдельно. И сейчас вам грустно, пусто, вы скучаете по самой обычной жизни рядом с ними.\n\nВы имеете право скучать по тому, от чего когда-то уставали.\n\nИ пока не знать, чего хочется дальше.","caption":""},{"v":"живой","text":"Почему дочери тревожных матерей выбирают мужчин, которых надо спасать (и никак не спасти)\nОни выбирают мужчин, у которых проблемы с деньгами, зависимость, созависимая бывшая, «никак не встанет на ноги», или просто он «такой ранимый и глубокий, его никто не понимает».\nИ это не случайность. Это сценарий. Который начинается гораздо раньше, чем она встретила первого «сложного» мужчину.\nУ этой женщины мама была тревожной. Не просто «переживательной», а той, для которой мир был угрозой - от ипохондрии до страданий с мужем-алкоголиком.\nИ дочь учится одной роли: «Я должна быть той, кто успокаивает маму, решает, сглаживает, тащит, ставить чувства мамы на первое место и не обращать внимание как мне во всем этом».\nДочь тревожной матери не ищет партнёра. Она ищет проект! Ибо только рядом с тем, кому «плохо», она чувствует себя нужной. Только когда она спасает - она существует. Только когда он без неё пропадёт - она ценна!\nПотому что она на не умеет и не знает как иначе. Её не учили безопасному семейному гнездышку, ее учили: любовь - это страдание. Любовь - это жертва. Любовь - это когда ты отдаёшь все силы, а взамен получаешь только придуманную самой собой же надежду, что «когда-нибудь он оценит».\nНо он не оценит. Потому что он не просил его спасать!! Он просто нашёл ту, которая согласилась НЕСТИ ЕГО НА СЕБЕ. Потому что он - не жертва обстоятельств, он просто её вторая метафорическая \"мама\". Только в мужском обличье. И требующая того же: «Сделай мне хорошо, успокой меня, вытащи меня, докажи, что я имею право существовать».\nИ она бежит годами через его срывы, измены, долги, обещания, которые он не выполняет. Она бежит, потому что остановиться для неё - значит признать, что вся её жизнь была посвящена спасению того, кого спасти невозможно! И...перейти из зоны \"спасу его\" в зону \"я виновата, что не смогла...\"","caption":""},{"v":"h1","text":"Дети уехали. Дома непривычно тихо\n\nВы просыпаетесь и впервые можете спокойно полежать. Никого не нужно будить, никуда торопить. Только почему-то никакой радости от этого свободного утра.\n\nИ вы начинаете себя ругать. Дети устроились, живут своей жизнью, все получилось как вы хотели. Надо бы радоваться. А вы лежите и думаете, чем вообще занять этот день.\n\nЯ считаю, что мы слишком легко говорим родителям взрослых детей: «Ну вот, теперь поживите для себя». Спасибо, конечно. А как это делается, если столько лет утро начиналось с того, что кому-то что-то от вас нужно?\n\nУ вас годами был готовый ответ на вопрос, зачем вставать. Даже когда вы уставали и мечтали, чтобы вас хоть на выходных оставили в покое. Завтрак, разговор перед выходом, вечером услышать ключ в двери. Среди всех этих хлопот было простое чувство, что вас ждут и ваше участие нужно прямо сейчас.\n\nВы уже сделали огромную работу. Помогли детям вырасти и уйти в свою жизнь. Но вместе с их отъездом закончилась и привычная часть вашей жизни. Дела, которые задавали порядок каждому дню, вдруг исчезли. А желания, которые вы годами откладывали, по команде не просыпаются.\n\nВы скучаете по своему месту в их повседневной жизни. По возможности просто зайти в комнату и поговорить, без звонка и вопроса, удобно ли сейчас.","caption":""},{"v":"h0","text":"Дети съехали. Утром особенно пусто\n\nПросыпаетесь, и вроде можно спокойно выпить кофе. Никого не надо будить, никуда провожать. Только вставать почему-то не хочется. Лежите и думаете: «А зачем? Можно и еще полежать».\n\nПотом сами себя ругаете: «У детей все хорошо. Я должен радоваться. Люди мечтают пожить для себя, а мне опять все не так».\n\nИ тут еще обязательно найдется кто-нибудь с бодрым: «Зато теперь сколько свободного времени!» Спасибо, конечно. Только вы пока понятия не имеете, что с ним делать.\n\nГодами у вашего утра была понятная причина. Нужно приготовить завтрак, спросить, во сколько вернутся, решить что-то по дому. Даже когда это раздражало, вы знали, зачем встаете.\n\nВы уже многое сделали, чтобы дети могли жить самостоятельно. В это ушли годы заботы и сил. Теперь они справляются, а вы остались без привычного порядка, который каждый день подсказывал, чем заняться.\n\nИ скучаете вы еще по тому, как жили рядом. Можно было спросить что-нибудь из соседней комнаты. Услышать, как хлопнула входная дверь. Узнать, что случилось, без отдельного звонка. Теперь даже для обычного разговора приходится выбирать время.\n\nЯ бы не стал требовать от человека немедленно наслаждаться свободой после такой перемены. Откуда взяться этому наслаждению по расписанию?","caption":""},{"v":"h4","text":"Дети съехали, и ничего не радует\n\nУтром можно спокойно выпить чай. Никто ничего не ищет, никого не надо будить. Вы столько раз мечтали о тишине. Теперь сидите на кухне и думаете: «И что мне сегодня делать?»\n\nПотом сами себя одергиваете: «У них все хорошо. Чего я опять недоволен?» И стараетесь пореже звонить, чтобы не мешать. А когда ребенок звонит сам, сразу спрашиваете, все ли у него есть. Хоть что-нибудь нужно купить, привезти?\n\nВам хочется снова поучаствовать в его жизни. Столько лет утром было понятно, зачем вставать. Даже когда вы злились и мечтали, чтобы вас оставили в покое, ваши заботы кому-то были нужны. Теперь приходится самим решать, чем занять день. И пока ничего особенно не хочется.\n\nВы уже очень многое сделали, чтобы дети могли жить самостоятельно. Но вместе с их отъездом закончилась и привычная жизнь, в которой вам каждый день находилось место. К такому трудно привыкнуть за неделю.\n\nЯ бы здесь не торопился с советом найти хобби. От него легко услышать еще один упрек: дети выросли, теперь срочно станьте интересным человеком.\n\nВам правда есть по чему скучать.","caption":""},{"v":"h2","text":"Дети уехали. Зачем теперь вставать?\n\nЕсли после отъезда детей вы просыпаетесь и думаете: «И что мне теперь делать весь день?» Эти слова для вас.\n\nДела, конечно, есть. Работа, магазин, стирка. Только раньше вы знали, ради чего торопитесь домой. По дороге прикидывали, что приготовить на ужин. Теперь можно задержаться сколько угодно. И от этого почему-то хочется плакать.\n\nА потом вы себя ругаете: «Сами же хотели, чтобы они стали самостоятельными. Вот и радуйтесь. У людей настоящие проблемы».\n\nВот еще, теперь и на тоску нужно получить право.\n\nВы годами вставали, потому что кому-то нужно было помочь собраться, что-то напомнить, куда-то отвезти. Даже когда дети стали старше, вы знали, кто сегодня придет домой. Это давало дню понятный смысл без долгих размышлений.\n\nИ вы уже сделали огромную работу. Дети выросли, у них появилась своя жизнь. Но ваша привычная жизнь тоже изменилась. Утром больше нет той спешки, от которой вы так уставали. А вместе с ней исчезло ощущение: «Без меня тут никак».\n\nСвободное время появилось сразу. Собственные желания после многих лет «потом, сейчас некогда» так быстро не возвращаются. Поэтому вопрос «зачем вставать?» может пугать даже человека, который очень рад за своих детей.\n\nЯ бы не стал требовать от вас немедленно найти хобби и наслаждаться свободой.\n\nВы можете радоваться за детей и все равно плакать, когда возвращаетесь в тихую квартиру.","caption":""}]},{"id":"r_razvod_1","topic":"«ради детей надо сохранить семью»","author":"Ольга","format":"carousel","cards":[{"v":"h1","text":"Слайд 1: «Разводиться нельзя, у нас же дети»\n\nСлайд 2: Вы уже думаете о разводе, но представляете, как ребенок спросит, почему папа теперь живет отдельно. И сразу решаете потерпеть еще.\n\nПочему сохранить семью считается вашей обязанностью, даже если муж ничего менять не собирается?\n\nСлайд 3: Удобно придумали, бл*дь. Муж может месяцами игнорировать ваши просьбы, а отвечать за сохранение семьи почему-то должны вы.\n\nВы снова подбираете слова, откладываете разговор, стараетесь его не раздражать. Но наладить отношения за ДВОИХ у вас не получится.\n\nСлайд 4: Ребенок может тяжело переживать развод. Скучать по папе, злиться, просить, чтобы все вернулось. Я бы не стала обещать вам, что он сразу все поймет.\n\nНо его грусть еще не доказывает, что вы приняли неправильное решение.\n\nСлайд 5: Это вина за детскую грусть. Ребенок плачет, и вы уже готовы отменить свое решение, лишь бы он снова улыбался.\n\nТак легко начать считать себя хорошей мамой только в те дни, когда ребенок доволен. Но вы не можете устроить ему жизнь, в которой он никогда не расстроится.\n\nСлайд 6: Вы отвечаете за то, как обращаетесь с ребенком во время развода. Например, когда злитесь на бывшего, можно позвонить подруге и выговориться ей. Ребенку не нужно слушать, какой у него ужасный отец, или решать, кого из родителей ему теперь жалеть.\n\nСлайд 7: Если думаете о разводе, продумайте, как сохранить ребенку привычный распорядок хотя бы в ближайшие недели. Кто заберет его из школы, где он будет ночевать.\n\nОбязанности оставаться в браке ради него у вас нет.","caption":"Я бы спросила себя, что именно ребенок получает от того, что мы продолжаем жить вместе. Ответ бывает гораздо сложнее, чем просто наличие папы дома.\n\nЯ Ольга, психолог, помогаю женщинам, которые думают о разводе или уже развелись.\nОтправьте это той, кто сейчас остается в браке ради детей."},{"v":"h0","text":"Слайд 1: «Ради детей я пока не буду разводиться»\n\nСлайд 2: Вы уже думаете, как будете жить отдельно. Потом смотрите на ребенка: «У него же будет праздник, все дети придут с папами. И что, я все испорчу?»\n\nИ снова откладываете разговор с мужем. Кажется, хорошая мать должна потерпеть.\n\nСлайд 3: Удобно придумали: за отношения двух взрослых теперь отвечает ваша любовь к ребенку. Сколько же на женщину навешали, бл*дь.\n\nЕсли муж вас унижает, запись «женат» в документах этого не отменяет.\n\nСлайд 4: У решения «терплю ради ребенка» есть неприятная ловушка. Вы можете начать ждать, что ребенок хотя бы оценит вашу жертву.\n\nВы весь вечер молчали после очередной ссоры с мужем, а он еще и уроки делать отказывается. В голове: «Я ради тебя здесь живу. Мог бы хоть слушаться».\n\nСлайд 5: Так у ребенка появляется долг за ваше терпение. Вы можете даже ни разу не сказать ему про этот долг вслух.\n\nНо его обычное недовольство начинает особенно злить. Вы столько вынесли ради него, а он смеет быть недовольным. Хотя ребенок вас оставаться не просил.\n\nСлайд 6: Сохранить отношения можно, если ОБА готовы что-то менять. Например, муж перестает оскорблять вас во время ссор, берет на себя ежедневные дела с детьми. Вы можете обсуждать разногласия без страха.\n\nСмотреть стоит на то, что происходит дома. Одного обещания «теперь все будет хорошо» мало.\n\nСлайд 7: Вы отвечаете за то, чтобы ребенок получал заботу и не участвовал в ваших ссорах. Отношения с мужем тоже требуют взрослого решения, которое нельзя поручить ребенку.\n\nНо обсуждать с мужем нужно конкретно: что каждый из вас готов менять, чтобы вместе стало возможно жить.","caption":"Фраза «я ради тебя осталась» может очень проситься наружу, особенно когда сил уже нет. С ребенком ей делать нечего. Ее нужно обсуждать со взрослым, который способен вас поддержать.\n\nМеня зовут Ольга, я психолог, работаю с женщинами 30-45 лет, которые думают о разводе или уже развелись.\nОтправьте тому, кому сейчас нужен этот разговор."},{"v":"h3","text":"Слайд 1: «Ради детей надо сохранить семью»\n\nСлайд 2: Вы снова думаете о разводе. Потом представляете, как ребенок спросит: «А папа теперь будет жить отдельно?» И закрываете вопрос. Ладно, потерплю. Ради него. Даже если вечером опять придется сидеть на кухне и ждать, в каком настроении муж вернется.\n\nСлайд 3: «Ради детей надо сохранить семью». Удобная фраза, конечно. Особенно когда ее говорят только вам. Муж орет, отказывается обсуждать проблемы, а сохранять семью почему-то должна жена. Бл*дь, у него тоже есть ребенок. И своя доля ответственности за происходящее дома.\n\nСлайд 4: У фразы «я терплю ради ребенка» есть неприятное продолжение: ребенку легко оказаться виноватым в вашем несчастье. Особенно если он слышит: «Давно бы ушла, но куда я с тобой?» Представляете, с чем ему теперь жить?\n\nСлайд 5: Это можно назвать долгом за мамино терпение. Ребенок начинает стараться его вернуть: получает пятерки, ничего не просит, скрывает свои неприятности. Ведь мама и так столько вынесла ради него. Даже обычное «я сегодня злюсь на тебя» становится слишком дорогим удовольствием.\n\nСлайд 6: Решение о браке остается у взрослых. Ребенку можно сказать: «Мы с папой решаем, как будем жить дальше. Ты можешь расстраиваться и задавать вопросы. Тебе ничего не нужно исправлять».\n\nСлайд 7: Вы отвечаете за то, чтобы ребенок был в безопасности, получал заботу и понимал, что происходит. Его грусть при разводе тоже потребует вашего внимания. Но поручать ему сохранение брака слишком тяжело. Можно начать с одной фразы: «Это НАШЕ взрослое решение».","caption":"Меня особенно цепляет, когда «ради детей» говорят только женщине. Хочется спросить: а папе эту речь уже прочитали?\nЯ Ольга, психолог, помогаю женщинам от 30 до 45 лет разобраться с разводом и жизнью после него.\nОтправьте тому, кому сейчас важно это услышать."},{"v":"h4","text":"Слайд 1: «У нас дети, какой еще развод?»\n\nСлайд 2: Вы снова думаете о расставании и сами себя останавливаете: «Ребенку нужна полная семья».\n\nУдобно придумано: взрослым х*рово, но менять ничего нельзя, потому что дети. Только ребенку жить в этой же квартире. Он тоже слышит, как вы разговариваете.\n\nСлайд 3: «Ради детей» легко превращается в причину терпеть то, с чем вы давно не согласны. Муж опять вас унизил, вы проглотили. Потом ребенок просит поиграть, и вы срываетесь на него. Сил на спокойный разговор уже нет.\n\nСлайд 4: А потом вы говорите: «Я только ради тебя с твоим отцом живу».\n\nРебенок может услышать в этом: «Маме плохо из-за меня». И начать меньше просить, тише играть, следить за вашим настроением.\n\nСлайд 5: Сохранить брак можно. Для этого нужны изменения, в которых участвуют оба взрослых. Например, муж перестает оскорблять вас при разногласиях, и вы можете обсуждать проблемы без унижений.\n\nСамо по себе решение «ладно, останусь» ничего этого не меняет.\n\nСлайд 6: Вы отвечаете за свои решения и за то, как обращаетесь с ребенком. Вы не ОБЯЗАНЫ в одиночку добиваться, чтобы муж захотел сохранить отношения.\n\nЕсли он продолжает унижать вас и отказывается что-либо менять, ваших стараний на двоих не хватит.\n\nСлайд 7: Когда думаете, оставаться ли вместе, начните с простого вопроса: что конкретно изменится в нашей жизни, если я останусь?\n\nОтвет «у ребенка будут оба родителя дома» еще ничего не говорит о том, как ему будет дома жить.","caption":"Я бы особенно осторожно относилась к словам «потом ребенок спасибо скажет». Он ведь вас об этой жертве не просил.\n\nЯ Ольга, психолог. Работаю с женщинами, которые думают о разводе или уже развелись.\nОтправьте тому, кому сейчас нужно это прочитать."},{"v":"h2","text":"Слайд 1: «Ради детей я должна остаться с мужем»\n\nСлайд 2: Вы снова ждете, пока дети уснут, чтобы поговорить с мужем. Днем улыбались, вечером опять поругались. Уже думаете о разводе, потом вспоминаете детей и отменяете собственные мысли. Бл*дь, как будто детям вместе со свидетельством о рождении выдали право запретить вам уходить.\n\nСлайд 3: Сохранить брак ради детей звучит заботливо. Но у этой заботы появляется опасное продолжение: «Я столько терпела ради вас». Ребенок слышит, что мама годами жила плохо из-за него. Теперь ему еще и надо доказать, что все это было не зря.\n\nСлайд 4: Получил плохую оценку, нагрубил, захотел жить отдельно. И тут: «Я тебе всю жизнь отдала». Ох, девочки. Детство с таким счетом очень тяжело оплачивать.\n\nСлайд 5: За решение остаться вместе отвечаете вы с мужем. Дети НЕ должны оправдывать его хорошими оценками или благодарностью. И чинить ваши отношения им тоже не под силу. Даже если ребенок очень просит, чтобы вы никогда не разводились.\n\nСлайд 6: Само по себе «мы остались вместе» ничего не говорит о том, как живется детям. Важнее, могут ли родители прекратить унижать друг друга, договариваться и менять то, из-за чего дома страшно или тяжело.\n\nСлайд 7: Когда будете решать, оставаться ли с мужем, назовите конкретно, что должно измениться в вашей совместной жизни и готов ли он участвовать. Одного «ради детей» для такого решения недостаточно.","caption":"Меня настораживает, когда от женщины требуют сохранить семью, даже не спрашивая, что в этой семье происходит.\n\nМеня зовут Ольга, я психолог, помогаю женщинам, которые думают о разводе или уже развелись.\nОтправьте это той, кому сейчас нужно такое услышать."},{"v":"h5","text":"Слайд 1: «Какой развод? У нас же дети»\n\nСлайд 2: Вы думаете о расставании и сразу представляете: дети вечером спрашивают, где папа. От этой мысли страшно. И вы снова решаете потерпеть, сгладить очередную ссору, ничего ему не предъявлять. «Лишь бы у них был отец».\n\nСлайд 3: Получается, чтобы он оставался отцом, вы должны оставаться его женой. Удобно устроено, бл*н. Вы ОДНА отвечаете даже за его отношения с детьми. Хотя позвонить ребенку, забрать его из школы, провести с ним выходной вполне может сам отец.\n\nСлайд 4: Муж снова обещал погулять с ребенком и забыл. Вы придумываете объяснение: «Папа устал». Потом молчите о своей обиде, чтобы не поссориться.\n\nСлайд 5: Вы боитесь, что после развода он перестанет заниматься детьми. Такой риск действительно есть, и от него больно. Но уже сейчас вы берете на себя его ответственность: напоминаете, уговариваете, организуете. Сохраненный брак сам по себе участия отца не гарантирует.\n\nСлайд 6: Вы отвечаете за свои решения и за то, как обращаетесь с детьми. Его участие зависит и от него самого. При разводе придется решать, где дети живут, как видятся с папой, кто оплачивает расходы. Это задачи обоих родителей. Вам не нужно заслуживать его помощь хорошим поведением.\n\nСлайд 7: Решение о разводе требует времени. Начните с конкретного: какие обязанности с детьми отец уже берет на себя без ваших напоминаний? Обсудите с ним, за что он готов отвечать дальше. Оценивайте и его поступки, когда решаете, как жить вашей семье.","caption":"Особенно тяжело, когда муж говорит: «Уйдешь, сама будешь с ними возиться». После такой фразы страшно даже обсуждать расставание.\n\nЯ Ольга, психолог. Работаю с женщинами 30-45 лет, которые думают о разводе или уже развелись.\nОтправьте тому, кому сейчас нужно это прочитать."},{"v":"живой","text":"Выбирай доброго. Если ты сейчас в поиске, ходишь на свидания, у меня для тебя один совет. Выбирай доброго человека. Самый яркий и самый остроумный пусть подождут. И я не про того, кто всегда удобный и на все согласен. Я про того, кто умеет быть внимательным, заботится, замечает и не хочет делать больно даже в ссоре. Сарказм, дерзость, флирт это весело, как смотреть на фейерверк. Но когда станет сложно, когда ссора, когда стресс, сарказм будет совсем не в кассу. Фейерверк впечатляет. А когда темно и холодно, хочется сидеть у костра, в тепле. Подписывайся, тут про отношения без сказок.","caption":""}]},{"id":"r_pereezd_1","topic":"переехала в другой город и за год ни с кем не подружилась","author":"Юлия","format":"reels_spisok","cards":[{"v":"h5","text":"Четыре признака, что после переезда тебе хочется друзей, но страшно оказаться лишней.\nПервое. Ты ждешь, когда тебе напишут. Сама уже писала первой и теперь считаешь: «Следующий раз ее очередь». Ох, уже и тут приходится считать.\nВторое. На работе ты со всеми ладишь, но предложить вместе пообедать трудно. «Вдруг у них свои планы?» И снова ешь одна.\nТретье. Старой подруге можешь написать, что тебе плохо. С новой знакомой встречаешься только в хорошем настроении: «Кому нужны мои проблемы?»\nЧетвертое. Даже приглашению в гости ты не веришь: «Она просто из вежливости». Отказываешься и ждешь, позовут ли еще.\nТы хочешь сначала убедиться, что тебе рады. А другой человек после твоего отказа думает, что тебе с ним неинтересно.","caption":"Со старыми друзьями можно молчать и знать, что все хорошо. С новыми даже пауза в разговоре пугает: «Все, ей со мной скучно».\nМеня зовут Юлия, я психолог, помогаю людям после переезда освоиться на новом месте.\nЕсли хочешь поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"h0","text":"Четыре признака, что после переезда ты ищешь подруг, но ждешь от них близости, как со старыми.\nПервое. После встречи тебе хочется домой. Весь вечер подбирала слова, даже пошутить боялась. Со своими можно было просто сидеть и есть.\nВторое. Позвать знакомую погулять кажется навязчивостью. «Мы же еще толком не знакомы».\nТретье. Ты быстро решаешь: «Не мой человек». Разговор закончился на работе и погоде. Ну да, до разговоров про самое личное вы пока не добрались.\nЧетвертое. Даже хороший вечер ты не считаешь дружбой. Посмеялись, договорились встретиться снова. Но позвонить ей и поплакать пока нельзя. И ты опять говоришь себе: «У меня здесь никого».","caption":"Старой подруге ты отправляешь голосовое прямо из кровати. Новой знакомой переписываешь сообщение три раза, чтобы не показаться странной.\nЯ Юлия, психолог, работаю с людьми после переезда.\nЕсли хочешь прийти на консультацию, ссылка на запись в шапке профиля."},{"v":"живой","text":"Когда люди говорят, что им не нужен психолог, они чаще всего добавляют: «я и так про себя все знаю и понимаю». Да, я тоже когда-то была проработанная, все прекрасно понимала. Вы можете вбить свой запрос в поиск, и он подберет вам вот столько книг. Как стать богаче, как построить отношения, как стать уверенней. Спросите чат-бота, он вам столько объяснений выдаст, что не унесете. И что, что-то поменялось? Проблема давно не в том, что мы чего-то не знаем. Мы не умеем чувствовать и боимся живого контакта, потому что в нем уязвимо и больно. А меняется что-то как раз там, в живом разговоре с человеком. Иначе так и будете говорить: головой я все понимаю, а в жизни ничего не меняется. Приходите в терапию, запись по ссылке в шапке профиля.","caption":""},{"v":"h4","text":"Четыре признака, что после переезда ты хочешь подружиться, но боишься оказаться лишней.\nПервое. На работе идешь обедать одна. Коллеги собираются вместе, но лично тебя никто не позвал. «Наверное, у них своя компания».\nВторое. Чтобы написать знакомой, тебе нужен повод. Просто спросить, как дела, неловко. «Мы же пока не настолько близки».\nТретье. Тебя зовут в гости, а ты первым делом спрашиваешь, кто еще будет. Страшно весь вечер просидеть рядом с людьми, которые обсуждают общих знакомых.\nЧетвертое. Даже после хорошей встречи ты ждешь, когда тебе напишут первой. Хочется проверить: ей тоже понравилось или она просто была вежливой?\nСколько раз ты уже решила за других, что им не до тебя?","caption":"Со старыми друзьями можно написать «мне скучно» и ничего не объяснять. С новыми даже предложение выпить кофе перечитываешь перед отправкой.\nЯ Юлия, психолог, работаю с людьми 25-35 лет, которые осваиваются после переезда.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"h2","text":"Четыре привычки тех, кто год живет в новом городе и все еще без друзей.\nПервое. После встречи тебе кажется: «Все как-то поверхностно». Поговорили про работу, выпили кофе. Но ведь с подругой дома ты могла говорить обо всем.\nВторое. Ты стесняешься написать без повода. Смешное видео отправляешь старым друзьям. Новым знакомым пока только по делу.\nТретье. Тебя утомляет рассказывать о себе. Опять объяснять, где работала, почему переехала. Ну сколько можно знакомиться, хочется уже дружить!\nЧетвертое. Отмена встречи для тебя означает: «Я ей неинтересна». Даже если человек предложил другой день, тебе уже хочется отказаться.\nТы ждешь, что с новыми людьми сразу будет так же легко, как с теми, кто знает тебя десять лет.","caption":"Со старыми друзьями можно полчаса молчать и чувствовать себя прекрасно. С новым человеком пауза за столом уже кажется поводом больше не встречаться.\nМеня зовут Юлия, я психолог, работаю с людьми 25-35 лет, которые переехали.\nЕсли хочется об этом поговорить, приходи на консультацию, ссылка на запись в шапке профиля."},{"v":"h3","text":"Четыре признака для тех, кто переехал и за год так ни с кем не подружился.\nПервое. Знакомиться утомительно. Коллега спрашивает, чем ты увлекаешься, и хочется вздохнуть: опять рассказывать про себя с самого начала.\nВторое. Ты быстро решаешь: «Это чужие люди». Со старыми друзьями можно молчать, с новыми приходится придумывать темы.\nТретье. Позвать знакомую на кофе неловко. «Если бы ей было интересно, сама бы написала». От человека после двух встреч ты уже ждешь, что он поймет, как тебе одиноко.\nЧетвертое. После хорошей встречи особенно тянет домой. Весь вечер ты объясняла, какая ты. А хочется к тем, кто уже знает.","caption":"У старых друзей было время запомнить, какой кофе ты пьешь и почему не любишь свой день рождения. В новом городе снова приходится все это рассказывать, даже когда сил хватает только на «привет».\nЯ Юлия, психолог, работаю с теми, кто в 25-35 лет переехал и обживается на новом месте.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"h1","text":"Четыре признака, в которых ты узнаешь себя, если за год в новом городе так и не нашла друзей.\nПервое. Тебя утомляет рассказывать о себе. Старой подруге можно сразу пожаловаться, а тут опять объясняй, где работаешь. Да сколько можно эту биографию!\nВторое. Разговоры с коллегами кажутся пустыми. Обсудили выходные, разошлись, и ты уже решила, что вам не о чем говорить.\nТретье. Ты ждешь, чтобы тебя позвали еще раз. Самой написать неловко, вдруг человеку просто было скучно в тот вечер.\nЧетвертое. После приятной встречи тебе особенно одиноко. Посмеялись, но никто пока не знает, почему звонок мамы испортил тебе настроение.\nЯ думаю, ты ждешь той близости, к которой привыкла. А со старой подругой тебе было так же легко в первый день?","caption":"В старом городе дружба могла начаться с того, что вы каждый день оказывались рядом. После переезда даже кофе приходится специально планировать, и меня раздражает, как легко эту трудность называют неумением дружить.\nЯ Юлия, психолог, работаю с людьми 25-35 лет, которые переехали и привыкают к новой жизни.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля."}]},{"id":"r_dengi_1","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","author":"Михаил","format":"post","cards":[{"v":"h3","text":"Зарплата пришла, денег хватает, а вы снова открываете приложение банка. Просто убедиться, что все нормально.\n\nПосмотрели на остаток. Вроде выдохнули. Через час опять хочется проверить. Хотя вы за этот час даже ничего не купили.\n\nУ мозга очень простая логика. Было тревожно, вы проверили счет, стало легче. Значит, проверять важно. Значит, без проверки опасно. И в следующий раз он снова требует: зайди, убедись.\n\nВы ведь просто хотели держать деньги под контролем. А получилось, что теперь приходится регулярно подтверждать себе: пока все хорошо.\n\nДопустим, на обязательные расходы хватает, запас есть, до следующей зарплаты все посчитано. Но вечером появляется мысль: «А вдруг что случится?» Вы открываете банк. Цифры те же. На несколько минут легче.\n\nВедь каждая проверка дает облегчение только на время. Потом хочется получить его еще раз. Отсюда и ощущение: зарабатываю больше, а спокойнее почему-то не становится.\n\nУ этого есть простое название: привычка успокаиваться проверкой. Деньги в ней участвуют, но сумма на счете уже мало что меняет.\n\nЕсли расходы и запас вы уже посчитали, назначьте следующую проверку на конкретный день. Когда снова потянет открыть приложение, можно себе сказать: «Я это уже проверил. Следующая проверка в пятницу».","caption":""},{"v":"h1","text":"Зарплата пришла, все платежи закрыты, а вы опять считаете, хватит ли денег.\n\nЯ бы здесь посмотрел, сколько раз вы пытаетесь себя успокоить расчетами. Проверки могут поддерживать страх остаться без денег, даже когда с доходом все в порядке.\n\nУ мозга есть привычка запоминать, после какого действия стало легче. Испугались, открыли приложение банка, пересчитали остаток, выдохнули. В следующий раз тревога появляется, и вы уже знаете, куда нажать.\n\nПостепенно становится трудно успокоиться без проверки. Хотя с деньгами за это время ничего не случилось.\n\nВот вы вечером сидите на диване. Днем уже считали, на продукты хватит, кредит оплачен, запас есть. Но вдруг машина сломается? Открываете банк еще раз. Потом прикидываете ремонт, вспоминаете про страховку и начинаете считать заново.\n\nДа сколько же можно считать одни и те же деньги. Очень хочется наконец увидеть такую сумму, после которой получится спокойно закрыть приложение.\n\nТолько очередной расчет помогает ненадолго. Завтра найдется еще один расход, который вы сегодня не предусмотрели. И снова захочется проверить.\n\nТак страх остается с вами даже после прибавки к зарплате.\n\nЕсли бюджет уже посчитан и обязательные расходы покрыты, назначьте время следующего расчета. До него возвращайтесь к цифрам, только если действительно изменились доходы или расходы.\n\nСчитать деньги полезно. Но заново пересчитывать весь бюджет каждый раз, когда стало страшно, вам не нужно.","caption":""},{"v":"h0","text":"Зарплаты хватает, запас есть, но вы все равно думаете: «Сейчас нормально. А вдруг потом все закончится?»\n\nУ тревоги есть неприятная особенность: вы можете начать считать ее полезной. Пока переживаете, вы внимательнее к расходам, лишний раз проверяете счет. Деньги пока не закончились. И появляется убеждение: «Вот поэтому и не закончились. Я же все время слежу».\n\nПолучается, даже успокоиться страшно. Вдруг расслабитесь и все упустите.\n\nПришла зарплата. Вы оплатили счета, отложили часть денег. Вроде хватает. Но вечером снова открываете приложение банка. Вспоминаете про страховку на машину, прикидываете расходы до конца месяца. Закрываете. Через полчаса хочется проверить еще раз.\n\nЦифры те же. На несколько минут стало спокойнее, и этого хватило, чтобы захотелось повторить проверку.\n\nВот ведь какая штука: деньги у вас есть, а почувствовать себя спокойно вы можете только после очередного подсчета.\n\nЕсли вы узнаете себя, полезно разделить две вещи. Следить за деньгами нужно, для этого достаточно понятного бюджета и проверки по делу. Постоянно беспокоиться о них тоже можно, только дополнительных денег от этого на счете не появится.\n\nПеред очередной проверкой спросите себя: появился новый расход или мне снова стало страшно? Если ничего не изменилось, пересчитывать остаток еще раз не нужно.","caption":""},{"v":"живой","text":"Финал: шрамы в тишине\nФинал фильма — это психоаналитический тупик. Подрик и Колм, израненные, стоят у моря. Пожар, смерть Дженни, гибель Доминика — всё это оставляет их в пустоте, где нет примирения, только шрамы. Колм, лишившийся пальцев и дома, цепляется за музыку, как за иллюзию смысла. Подрик, потерявший друга и осла, обретает в гневе новую силу, но за ней — бездна. Этот финал — как сессия анализа, где нет ответов, только вопросы о том, как жить с болью.\nПочему это разрывает душу?\nФильм заставляет чувствовать: ужас, что мы не успеем, боль, когда нас отталкивают, и тоску по простому теплу — будь то друг или осёл. Он спрашивает: что держит нас в живых? Любовь? Творчество? Или способность выстоять, когда всё горит?","caption":""},{"v":"h4","text":"Деньги на счете есть, а вы опять считаете, сколько протянете, если потеряете работу.\n\nИ вроде зарабатываете нормально. На расходы хватает, что-то откладываете. Но спокойно становится только сразу после зарплаты. Да и то ненадолго.\n\nУ мозга есть привычка запоминать, от чего стало легче. Если тревога отпустила после проверки счета, он усваивает: надо проверять, иначе опасно. И в следующий раз снова хочется открыть приложение. Даже если с деньгами за это время ничего не случилось.\n\nВот вы вечером сидите дома. Вспомнили про платеж за машину. Открыли банк, прикинули расходы. Все сходится. Выдохнули.\n\nЧерез полчаса: «А если на работе начнут сокращать?» Снова считаете. Теперь уже на сколько месяцев хватит накоплений. Цифра приличная, но тут же вспоминаете, что машина может сломаться.\n\nВсе, опять мало.\n\nПотому что вы ждете от расчета гарантии, что деньги точно будут всегда. Такую гарантию банковское приложение вам не даст.\n\nПланировать расходы полезно. Но если расчет уже готов, а вы десятый раз его проверяете, чтобы успокоиться, эта привычка поддерживает тревогу.\n\nДля начала назначьте время, когда вы разбираетесь с бюджетом. Если новых расходов или изменений в доходе нет, оставьте расчеты до этого времени.","caption":""},{"v":"h2","text":"Зарплата выросла, а вы все так же думаете: «Вдруг денег не хватит?»\n\nВы рассчитывали, что начнете больше зарабатывать и наконец выдохнете. Доход поднялся. На обычные расходы хватает, откладывать получается. Почему тогда опять страшно?\n\nЕсли после каждого роста дохода вы находите новую причину переживать, у вас могло закрепиться одно условие: «Я успокоюсь, когда буду уверен, что денег хватит при любых обстоятельствах».\n\nВот это «при любых» и портит всю затею. Вы требуете от денег гарантии на всю будущую жизнь. Очень хотелось бы такую купить. Но кто ее продает?\n\nНа месяц хватает? Хорошо. А если потеряю работу? Есть запас? А если искать придется целый год?\n\nИ вот вы вечером считаете, сколько сможете прожить без зарплаты. Получается вполне приличный срок. На минуту легче. Потом вспоминаете, что машина уже старая. Пересчитываете с учетом ремонта.\n\nПри этом сегодня вас никто не увольнял, машина ездит. Но вы уже мысленно оплачиваете все неприятности сразу.\n\nТак сумма, с которой вы обещали себе успокоиться, постоянно растет. Ведь к ней каждый раз добавляется еще одно «а вдруг».\n\nЗаранее определите, на какие расходы и на какой срок вам нужен запас.\n\nДаже когда этот запас собран, тревога может остаться. Само по себе это еще не означает, что денег мало.","caption":""},{"v":"h5","text":"Деньги на счете есть, но вы снова открываете приложение банка. Проверили, выдохнули. Через час опять хочется проверить.\n\nТакая проверка сама может поддерживать страх, что денег не хватит. Даже если вы нормально зарабатываете и на все обязательные расходы хватает.\n\nУ мозга есть привычка запоминать, после какого действия стало спокойнее. Испугались, посмотрели остаток, отпустило. Он усвоил: когда страшно, надо срочно проверить деньги.\n\nДопустим, вечером вы уже посчитали расходы до следующей зарплаты. Все сходится. Потом лежите в кровати и думаете: «А если машина сломается?»\n\nСнова берете телефон. Сумма прежняя, на минуту легче. Но завтра найдется новый повод испугаться. Машина, работа, зубы. На все случаи жизни гарантию банк вам, конечно, не выдаст.\n\nС каждой такой проверкой становится привычнее искать подтверждение, что все в порядке. Поэтому даже хороший остаток радует ненадолго.\n\nЕсли узнаете себя, назначьте время, когда будете смотреть счет и считать расходы. Между этими проверками не открывайте приложение только потому, что стало тревожно.\n\nВы уже посчитали, что денег хватает до зарплаты. Этот расчет остается верным и в тот момент, когда вам снова страшно.","caption":""}]}];const V=["h0","h1","h2","h3","h4","h5","живой"];const KEY='psycont_compare_2026-10-02_04-18';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const app=document.getElementById('app');
T.forEach((t,ti)=>{const sec=document.createElement('section');
sec.innerHTML='<h2>'+(ti+1)+'. '+esc(t.topic)+'</h2><div class="n">'+esc(t.author)+' · '+esc(t.format)+'</div>';
const g=document.createElement('div');g.className='grid';
t.cards.forEach((c,ci)=>{const k=t.id+'#'+ci;const d=document.createElement('div');d.className='c';
d.innerHTML='<div class="who">'+esc(c.v)+'</div><div class="t">'+esc(c.text)+'</div>'+(c.caption?'<div class="cap">'+esc(c.caption)+'</div>':'')+
'<div class="row"><button data-a="live">Живой</button><button data-a="pub" class="okb">Так можно публиковать</button><button data-a="ai" class="badb">Нейросеть</button></div>';
const paint=()=>{const s=S[k]||{};d.querySelectorAll('button').forEach(b=>{const a=b.dataset.a;const on=a==='pub'?!!s.pub:s.lab===a;b.classList.toggle('on',on);b.classList.toggle('ok',a==='pub');b.classList.toggle('bad',a==='ai')})};
d.querySelectorAll('button').forEach(b=>b.onclick=()=>{const s=S[k]||(S[k]={});const a=b.dataset.a;if(a==='pub')s.pub=!s.pub;else s.lab=s.lab===a?null:a;save();paint();count()});
paint();g.appendChild(d)});sec.appendChild(g);app.appendChild(sec)});
function count(){let n=0;Object.values(S).forEach(s=>{if(s.lab||s.pub)n++});document.getElementById('cnt').textContent='Отмечено: '+n;
const r={};V.forEach(v=>r[v]={live:0,pub:0,ai:0,all:0});
T.forEach(t=>t.cards.forEach((c,ci)=>{const s=S[t.id+'#'+ci]||{};const x=r[c.v];if(!x)return;x.all++;if(s.lab==='live')x.live++;if(s.lab==='ai')x.ai++;if(s.pub)x.pub++}));
document.getElementById('tbl').innerHTML='<table><tr><th>Вариант</th><th>Текстов</th><th>Живой</th><th>Публиковать</th><th>Нейросеть</th></tr>'+V.map(v=>'<tr><td>'+esc(v)+'</td><td>'+r[v].all+'</td><td>'+r[v].live+'</td><td>'+r[v].pub+'</td><td>'+r[v].ai+'</td></tr>').join('')+'</table>'}
count();
document.getElementById('rev').onclick=()=>{document.body.classList.toggle('reveal');document.getElementById('rev').textContent=document.body.classList.contains('reveal')?'Скрыть':'Показать, где что'};
</script></body></html>
