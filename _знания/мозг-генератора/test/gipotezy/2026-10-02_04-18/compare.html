ть, внутри сразу начинается сомнение. Вдруг он согласится просто потому, что вы пристали?\n\nИ вот вы подхватываете задачи за коллегой, задерживаетесь, уже второй месяц делаете больше, чем договаривались. Перед встречей с руководителем решаете поднять вопрос о зарплате. Он хвалит вас, говорит, как хорошо, что на вас можно положиться. Вам приятно. И вы опять молчите. Сейчас еще про деньги спросить, как-то неудобно.\n\nБл*дь, даже после похвалы приходится искать разрешение попросить за свою работу больше.\n\nТак можно долго ждать повышения как доказательства, что вас наконец оценили. И каждое молчание руководителя воспринимать лично, хотя зарплату он может вообще не пересматривать, пока сотрудник сам этот вопрос не поднимет.\n\nЯ бы обсуждала с ним конкретно, сколько задач прибавилось и какую сумму вы хотите получать за эту работу. Ему придется ответить на ваш запрос.","caption":""},{"v":"h3","text":"Вам стыдно просить повышение, поэтому вы берете еще одну задачу. Вдруг после нее начальник сам догадается.\n\nВы уже работаете больше всех. Подхватываете срочное, помогаете коллегам, отвечаете вечером. Но сказать «я хочу обсудить свою зарплату»... Как будто надо сначала еще немного заслужить.\n\nВот это «еще немного» может длиться годами.\n\nУ психики есть удобный способ обходиться со стыдом: откладывать просьбу до момента, когда вам точно никто не откажет. Когда вы будете настолько хороши, что повышение предложат сами. И вам останется скромно сказать: «Ой, спасибо».\n\nТолько условия этого конкурса вы придумываете себе сами.\n\nЗакрыли сложный проект? Ну, это моя работа. Спасли чужой? Ну, там ничего особенного. Полгода тянете обязанности ушедшей коллеги? Надо еще показать, что справляюсь.\n\nБл*дь, а когда уже можно?\n\nПотому что попросить сейчас страшно: вдруг откажут, и вы услышите в этом «вы недостаточно хорошая».\n\nПоэтому вы пытаетесь заработать такое количество заслуг, которое избавит вас от самой просьбы. От необходимости назвать сумму и дождаться ответа.\n\nТак появляется молчаливый договор: я буду ОЧЕНЬ стараться, а вы сами поймете, чего я жду.\n\nВы свою часть выполняете каждый день. А начальник вообще знает, что у вас с ним такой договор?","caption":""},{"v":"h5","text":"Вы опять доделываете работу за коллегой, а попросить прибавку к зарплате стыдно. Еще и думаете: «Вот закончу этот проект, тогда точно можно».\n\nТак вы можете годами готовиться к разговору о деньгах. И каждый раз находить себе еще работу.\n\nПотому что у вас есть условие: чтобы повышение считалось заслуженным, начальник должен предложить его САМ. Заметить, сколько вы делаете, позвать и сказать: «Пора вам поднять зарплату».\n\nА если пришлось попросить, внутри сразу: «Я напрашиваюсь. Вдруг он вообще считает, что мне и так много платят?»\n\nВы ждете, что вас оценят без подсказки. Тогда можно будет спокойно принять деньги и чувствовать, что вы их заслужили. Просьба будто портит все: теперь непонятно, вас правда ценят или вы просто выпросили.\n\nВот вы берете еще одну задачу. Отвечаете вечером. Подменяете коллегу. Ну теперь же он увидит?\n\nБл*н, начальнику удобно. Работа сделана, про деньги вы молчите. Ему вполне может казаться, что вас все устраивает.\n\nИ чем дольше вы ждете, тем обиднее. Вы ведь уже столько сделали, чтобы он догадался.\n\nДоговоритесь о встрече и обсудите оплату того объема работы, который уже выполняете. Еще один проект для допуска к этому разговору вам не нужен.","caption":""}]},{"id":"r_body_1","topic":"ненавижу себя в зеркале перед отпуском","author":"Юлия","format":"reels_poslanie","cards":[{"v":"h4","text":"Если перед отпуском ты смотришь в зеркало и думаешь: «Ну как я в таком виде пойду на пляж», послушай. Ты уже представляешь, как кто-то посмотрит на твой живот, что подумает, с кем сравнит. До отпуска еще неделя, а ты уже переживаешь чужое осуждение. И сама говоришь себе все самое обидное первой. Будто если заранее себя поругать, чужие слова потом меньше заденут. Только тебе больно уже сейчас. Ты собиралась отдохнуть, но теперь еще должна срочно похудеть, чтобы спокойно раздеться. Ты можешь поехать в отпуск с тем телом, которое у тебя сейчас.","caption":"Даже покупка купальника превращается в мучение, когда единственное требование к нему: «Чтобы ничего не было видно». Тут уже трудно понять, какой цвет тебе вообще нравится.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от 20 до 40 лет.\nЕсли хочешь прийти на консультацию, ссылка на запись в шапке профиля."},{"v":"h3","text":"Это для тебя, если перед отпуском ты примеряешь купальник и думаешь: «Ну как я с таким животом поеду?» Ты уже представляешь, как будешь сидеть на пляже, втягивать живот, прикрываться полотенцем. И злишься на себя: почему опять не похудела, почему не взялась за себя раньше? Послушай. Когда ты годами говоришь себе «вот похудею, тогда расслаблюсь», перед отпуском собственное тело начинает бесить. Отдых уже близко, а ты все еще требуешь от себя заслужить его другой внешностью. Ты можешь купаться с этим животом.","caption":"На отпускных фотографиях потом тоже начинается: эту удалить, эту никому не показывать. И целый день у моря оценивается по одной складке на снимке.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от 20 до 40 лет.\nЕсли захочешь поговорить на консультации, ссылка на запись в шапке профиля."},{"v":"h2","text":"Если перед отпуском ты смотришь в зеркало и думаешь: «Ну куда я с таким животом», я хочу тебе кое-что сказать. Ты надеваешь купальник и уже представляешь, как кто-то посмотрит, что подумает, с кем тебя сравнит. Еще никуда не приехала, а уже столько претензий к себе. Даже боком повернулась, чтобы проверить, насколько все «плохо». Да что ж такое, тебе уже и перед зеркалом нельзя выдохнуть. От этого собственное тело раздражает еще сильнее. Тебе не нужно сначала понравиться себе, чтобы поехать отдыхать.","caption":"Можно очень хотеть на пляж и одновременно стесняться раздеться.\nЯ Юлия, психолог, работаю с девушками и женщинами от 20 до 40 лет.\nЕсли хочешь поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"h5","text":"Если перед отпуском ты смотришь в зеркало и думаешь: «Как я вообще в таком виде выйду на пляж», послушай меня минуту. Ты примеряешь купальник, поворачиваешься боком, втягиваешь живот. И уже представляешь, кто что скажет. Даже если никто еще ничего не сказал.\n\nВ этот момент ты рассматриваешь себя глазами людей, чьей оценки боишься. И злишься на тело, потому что хочешь спокойно отдыхать, без чужих замечаний и стыда.\n\nНу вот, еще до моря надо выдержать пляж у себя в голове.\n\nТы уже устала от этой проверки.","caption":"Даже комплимент «ты похудела» может напомнить, что твой вес все время замечают. После такого бывает трудно поверить, что на пляже тебя оставят в покое.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли захочешь поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"h1","text":"Если перед отпуском ты примеряешь купальник и хочется вообще никуда не ехать, я хочу тебе кое-что сказать. Ты смотришь на живот, поворачиваешься боком, втягиваешь его и уже представляешь, как на тебя будут смотреть на пляже. И злишься на себя, что опять не похудела. Ты еще дома, до отпуска две недели, а уже пытаешься угадать, кому что в тебе не понравится. Как будто все эти незнакомые люди будут решать, можно ли тебе купаться. Я бы тут тоже устала. Можно ехать и с тем животом, который у тебя сейчас.","caption":"На фотографиях из отпуска потом бывает трудно вспомнить, было ли тебе хорошо в тот день. Ты занята тем, как получилась, и удаляешь даже снимок, на котором смеешься.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от 20 до 40 лет.\nЕсли захочешь поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"h0","text":"Это для тебя, если перед отпуском ты примеряешь купальник и думаешь: «Господи, какая я ужасная». Втягиваешь живот, поворачиваешься боком. Уже и ехать никуда не хочется. Ты еще дома, а в голове уже кто то на пляже рассматривает тебя и критикует. И ты начинаешь ругать себя первой. Если твое тело постоянно обсуждали, ты привыкаешь заранее искать, к чему придерутся. Даже когда рядом никого нет. Ну сколько можно, ты ведь просто купальник надела. Ты можешь ехать в отпуск и с животом, который тебе сейчас не нравится.","caption":"Обидно купить купальник, который понравился, и потом выбирать другой, потому что он больше закрывает.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от 20 до 40 лет.\nЕсли захочешь поговорить об этом на консультации, ссылка на запись в шапке профиля."},{"v":"живой","text":"Ой, а кто это у нас тут? Люди из трудных семей? Не знаете, как жить в этом ебанутом мире? Да перестаньте. С вами уже случилось самое страшное. Помните, когда было больно, а кричать нельзя? Вы это пережили маленьким ребенком. Вы все еще боитесь осуждения, когда начинаете проявляться. Так вас тогда отвергли, никто не был на вашей стороне. Боитесь, что если все станет хорошо, отношения, деньги, то случится что-то страшное и вас накажут. Поэтому выбираете трудности и тащите чужие проблемы. Напоминаю: тогда вы просто не могли убежать из дома. А сейчас можете. Эй, оглянитесь назад. Это все прошли вы. Выжили. Вы все можете. Просто устали.","caption":""}]},{"id":"r_teen_1","topic":"подросток закрылся в комнате и не разговаривает","author":"Михаил","format":"carousel","cards":[{"v":"h4","text":"Слайд 1: Подросток закрылся в комнате и молчит\n\nСлайд 2: Вы спрашиваете: «Как дела в школе?» Подросток отвечает «нормально» и закрывает дверь. А вы ведь просто хотели поговорить.\n\nНо если следом обычно идут вопросы про оценки, уроки и его настроение, даже короткий ответ обещает ему длинный разговор.\n\nСлайд 3: Подросток уходит в комнату сразу после школы.\n\nДома тоже нужно объяснять, что случилось и почему у него такое лицо. А он сам еще толком не понял. Закрытая дверь дает ему время, когда можно вообще ничего не объяснять.\n\nСлайд 4: На ваши вопросы подросток отвечает: «Не знаю».\n\nВы спрашиваете, что его расстроило, предлагаете варианты. Он пожимает плечами. Даже с близким человеком разговор становится еще одним заданием, если обязательно нужно дать понятный ответ.\n\nСлайд 5: Подросток резко говорит: «Да все нормально!»\n\nВы слышите грубость и хотите разобраться. Он ждет, что сейчас придется объяснять еще и свой тон. Когда короткого ответа регулярно недостаточно, подросток начинает обрывать разговор заранее. Вы только подошли, а он уже раздражен.\n\nСлайд 6: Подросток весь вечер молчит, потом присылает вам смешное видео.\n\nТак тоже можно побыть вместе. Посмеяться и ничего серьезного не обсуждать. Если в ответ сразу спросить: «Ну теперь расскажешь, что случилось?», в следующий раз он может оставить это видео у себя.\n\nСлайд 7: Когда подросток сам начинает что-то рассказывать, дайте ему договорить. С советами и дополнительными вопросами можно подождать.\n\nЕму важно убедиться, что с вами можно поделиться одной мелочью и на этом закончить разговор.","caption":"Родителю тоже тяжело стоять перед закрытой дверью. Хочется хоть что-нибудь узнать, чтобы меньше тревожиться.\n\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов."},{"v":"живой","text":"Всем привет, меня зовут Паша, и вот пять причин выбрать меня своим психологом. Причина первая. Я понимаю, о чем вы, когда вы говорите «кринж», «вайб» и «пикми». И «получку» с «хохмой» тоже понимаю. Причина вторая. У меня медицинское образование, я врач-психиатр и психотерапевт. Я знаю, почему крышечка подтекает и когда с этим надо к врачу. Причина третья. Со мной можно по-разному. Можем на сессии разобраться, почему попросить денег для вас как утонуть, а можем просто посидеть в тишине, потому что все заебало. Причина четвертая. Я не из тех, кто мило кивает. Я буду рядом, с пониманием, но не на стороне привычек, которые ломают вам жизнь. Причина пятая. Принимаю очно во Владивостоке и онлайн. Пишите в личку в телеграм.","caption":""},{"v":"h2","text":"Слайд 1: Подросток закрыл дверь и больше не разговаривает\n\nСлайд 2: Вы стучите в комнату: «Как день прошел?» В ответ: «Нормально». Спрашиваете еще что-нибудь, и подросток уже раздражается. Вы ведь просто хотели поговорить. А теперь даже непонятно, как к собственному ребенку подойти.\n\nСлайд 3: Если разговоры регулярно заканчиваются советами или замечаниями, подросток заранее ждет продолжения. Расскажешь про двойку, придется объяснять, почему не подготовился. Про ссору с другом, услышишь, что сам виноват. Поэтому на вопрос «Как дела?» он старается ответить так, чтобы вопросов больше не было.\n\nСлайд 4: «Нормально», «не знаю», «ничего».\n\nКороткие ответы помогают быстрее закончить разговор. Подросток уже знает: скажешь, что устал, начнут выяснять, от чего. Ведь «ты только в школе был». Ох, после такого объяснять свою усталость второй раз совсем не хочется.\n\nСлайд 5: «Я же сказал, ничего не случилось».\n\nВы замечаете, что подросток расстроен, и спрашиваете снова. Он отрицает все еще громче. Рассказать ему сейчас трудно: придется вспоминать неприятное, отвечать на вопросы, еще и успокаивать вас. Проще остаться в комнате.\n\nСлайд 6: «Можно я спокойно поем?»\n\nПодросток вышел на кухню, а вы наконец можете спросить про оценки и невыполненные дела. Даже за ужином придется объясняться. В следующий раз он заберет тарелку к себе.\n\nСлайд 7: Чем меньше подросток рассказывает, тем сильнее вы тревожитесь и тем больше спрашиваете. Он начинает избегать даже обычных разговоров: вдруг опять дойдет до учебы? Так вы оба хотите спокойного общения, но каждый новый вопрос заканчивается закрытой дверью.\n\nСлайд 8: Предложите подростку попить с вами чай и оставьте школьные вопросы на другой разговор. Пусть он сможет посидеть рядом, даже молча, без необходимости рассказывать, что произошло.","caption":"Родителям тоже бывает одиноко возле этой закрытой двери. Особенно когда раньше ребенок рассказывал все еще с порога.\n\nМеня зовут Михаил, я психолог, помогаю родителям подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разговоров."},{"v":"h3","text":"Слайд 1: Подросток закрылся в комнате и молчит\n\nСлайд 2: Вы спрашиваете через дверь: «Что случилось?» Тишина. Через десять минут пробуете еще раз. Вам важно понять, как он. А у подростка уже новая задача: объяснить и свое настроение, и то, почему он сразу вам не ответил.\n\nСлайд 3: «Оставьте меня в покое».\n\nКогда подросток повторяет это из комнаты, разговор уже кажется ему слишком большим. Придется рассказать, что произошло, ответить на вопросы, выслушать советы. Даже на вашу заботу сейчас нужны силы.\n\nСлайд 4: «Да все нормально».\n\nТак подросток часто пытается закрыть тему. Он знает: скажет «поссорился с другом», и начнется обсуждение переписки, характера друга, его собственных поступков. Вроде рассказал всего одну вещь, а теперь нужно объяснять весь день. Проще оставить подробности при себе.\n\nСлайд 5: «Я потом выйду».\n\nПодросток уже готов выйти из комнаты, но представляет ваше: «Ну наконец. И что это было?» Теперь даже поход на кухню обещает разговор, к которому он еще не готов. Он остается у себя подольше.\n\nСлайд 6: «А что у нас на ужин?»\n\nПосле часа молчания подросток выходит с обычным вопросом. Вы ждете объяснений, он начинает с еды. Если сразу спросить про закрытую дверь, эта маленькая попытка вернуться к общению быстро закончится.\n\nСлайд 7: Когда подросток выйдет и спросит про ужин, просто ответьте про ужин. Пусть у него будет возможность побыть рядом с вами без отчета о том, почему он молчал.","caption":"Иногда родитель уже приготовил целую речь, пока ребенок сидел в комнате. И очень трудно оставить ее при себе, когда дверь наконец открылась.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов."},{"v":"h1","text":"Слайд 1: Подросток закрылся в комнате и молчит\n\nСлайд 2: Вы спрашиваете, как прошел день. Подросток бросает «Нормально» и закрывает дверь. Хочется пойти следом, ведь вы просто спросили. Но если разговоры о школе обычно заканчиваются советами и проверкой уроков, он уже ждет продолжения.\n\nСлайд 3: Я бы предложил вспомнить, что происходит, когда подросток все же рассказывает о проблеме. Поссорился с другом, и вы сразу предлагаете позвонить его маме. Пожаловался на оценку, и вот вы уже открываете дневник. Поделился, и теперь придется останавливать вашу помощь. Уф, сколько хлопот после одного рассказа.\n\nСлайд 4: Подросток отвечает одним словом даже на простые вопросы. Так он пытается закончить разговор, пока вы не стали расспрашивать дальше. Особенно если за рассказом о прогулке обычно следуют вопросы о каждом участнике.\n\nСлайд 5: Подросток просит поговорить потом, а вы слышите отказ и обижаетесь. Ему бывает важно самому выбрать момент. Сразу после школы сил хватает только добраться до комнаты. Если приходится еще и доказывать, почему сейчас хочется тишины, проще вообще ничего не сказать.\n\nСлайд 6: Подросток рассказывает про смешное видео, но умалчивает о ссоре с другом. Шуткой можно поделиться спокойно. А после рассказа о ссоре взрослые могут начать звонить, выяснять отношения, требовать подробностей. И подросток остается с проблемой один, лишь бы все это не началось.\n\nСлайд 7: Когда подросток все же что-то расскажет, сначала спросите, нужна ли ему ваша помощь. И дождитесь ответа, прежде чем предлагать решение. Если он хочет только выговориться, побудьте рядом и послушайте. К решению можно вернуться, когда он будет готов его обсуждать.","caption":"Я понимаю родительское желание немедленно все исправить. Особенно когда ребенок сидит за закрытой дверью, а вы гадаете, что случилось.\n\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов."},{"v":"h5","text":"Слайд 1: После школы от подростка только «нормально»\n\nСлайд 2: Вы спрашиваете, как прошел день, подросток бросает «нормально» и закрывает дверь своей комнаты. Вы остаетесь в коридоре: «Я же просто спросил». Но если вчера рассказ о школе закончился советами и замечаниями, сегодня он уже ждет продолжения.\n\nСлайд 3: Подросток отвечает одним словом даже на простой вопрос.\n\nЕсли после «получил тройку» вы подробно выясняете, как он готовился, короткое «нормально» помогает избежать нового разбора. Вам хочется понять, что случилось. Он прикидывает, сколько вопросов придется выдержать, если ответить честно.\n\nСлайд 4: Подросток раздражается: «Можно меня сейчас не трогать?»\n\nВы еще ничего не успели сказать, а он уже защищается. Такое бывает, когда подросток заранее ждет замечаний.\n\nСлайд 5: Подросток рассказывает о неприятности, а потом обрывает разговор: «Все, забудь».\n\nНапример, он поссорился с другом, а вы сразу объясняете, как надо было ответить. Эх, мы уже помогаем, хотя даже историю не дослушали. В следующий раз он может решить, что проще вообще ничего не рассказывать.\n\nСлайд 6: Чем меньше подросток рассказывает, тем сильнее вам хочется расспросить его.\n\nВы заходите еще раз, уточняете за ужином, спрашиваете перед сном. Он начинает избегать даже обычных разговоров: вдруг опять придется объясняться.\n\nСлайд 7: Когда подросток снова начнет что-то рассказывать, дослушайте без советов и замечаний. Даже если очень хочется поправить его уже на второй фразе.\n\nПодростку нужен опыт разговора с вами, после которого ему не приходится защищать каждое свое решение.","caption":"Перед закрытой дверью легко почувствовать себя лишним. Особенно если раньше ребенок рассказывал вам даже то, о чем вы не спрашивали.\n\nЯ Михаил, психолог, помогаю родителям подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов."},{"v":"h0","text":"Слайд 1: Подросток закрылся в комнате и молчит\n\nСлайд 2: Вы стучите в дверь: «Что случилось?» В ответ: «Ничего, отстань». Еще утром разговаривали, а теперь даже смотреть на вас не хочет. Вы волнуетесь и спрашиваете снова. Подросток раздражается сильнее, и уже хочется потребовать, чтобы он открыл дверь.\n\nСлайд 3: Если за рассказом о неприятностях сразу следуют советы и вопросы, подросток заранее ждет долгого разговора. Сказал, что поссорился с другом, и вот уже нужно объяснять, кто виноват и почему. У него на это сейчас нет сил. Проще вообще ничего не рассказывать.\n\nСлайд 4: «Все нормально» помогает быстро закончить разговор. Подростку может быть стыдно, обидно, он сам еще толком не понимает, что произошло. А тут нужно подобрать слова для родителей. Даже заботливый вопрос в такой момент требует сил.\n\nСлайд 5: «Да оставьте меня уже!» особенно больно слышать, когда вы просто хотите помочь. Но после третьего вопроса подросток может ждать, что сейчас придется отвечать на десять следующих. Конечно, обидно: вы пришли поддержать, а получилось почти собеседование.\n\nСлайд 6: Подросток вышел на кухню, взял чай и сел рядом, но ничего не рассказывает. Он уже выбрал побыть с вами. Если сразу спросить: «Ну, теперь объяснишь?», он может уйти обратно. Рядом с родителями тоже хочется посидеть молча, особенно после тяжелого дня.\n\nСлайд 7: Когда подросток сам начнет рассказывать, дайте ему закончить без расспросов и советов. Даже если решение кажется очевидным. Ему важно убедиться, что можно поделиться неприятным и потом спокойно пойти пить чай, без обязательного разбора всей ситуации.","caption":"После резкого «отстань» легко обидеться и самому замолчать до вечера. Родителю тоже бывает нужна пауза, чтобы спокойно вернуться к разговору.\n\nЯ Михаил, психолог, помогаю родителям подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов."}]},{"id":"r_vybor_1","topic":"почему я снова выбираю тех, кто меня не выбирает","author":"Ольга","format":"reels_monolog","cards":[{"v":"живой","text":"Умное говно, которое вам подают под соусом психологии: «ты сама притянула себе такого мужика». Давайте так. Мы никого не притягиваем. Мы просто живем свою жизнь, мы не управляем потоками вселенной и не знаем, кто к нам придет. Самое опасное в этой фразе, что она заставляет копаться в себе в поисках причины чужого говна. А почему я его притянула? А что со мной не так? Может, у меня с мамой плохие отношения? Стоп. В ваших руках другое. Оставить этого человека в жизни или вышвырнуть его нафиг. Сколько времени вы позволили ему остаться и на каких условиях.","caption":""},{"v":"h0","text":"«Он сам мне вообще не пишет. Почему я все равно жду его сообщения?»\n\nВы можете так зацепиться за человека, потому что его внимание стало доказательством: со мной все нормально, меня можно любить.\n\nОн отвечает через сутки, вы решаете больше не писать. Потом приходит «Как дела?», и все. Вы уже улыбаетесь в телефон. Бля, одного сообщения хватило, чтобы вчерашнее «больше никогда» отменилось.\n\nЕсли любовь раньше приходилось заслуживать, это знакомая история: еще немного постараюсь, и меня наконец выберут.\n\nВ голове сразу: «Значит, я все-таки недостаточно хороша».\n\nИ вы продолжаете добиваться человека, рядом с которым постоянно сомневаетесь в себе.","caption":"Даже рассказывая о нем подруге, вы вспоминаете тот единственный вечер, когда он был внимательным. Остальные встречи почему-то пропускаете.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nОтправьте этот ролик той, кому сейчас нужно это услышать."},{"v":"h5","text":"«Он опять пропал. Наверное, я ему что-то не то написала».\n\nИ вот вы уже перечитываете переписку. Вчера собирались забить на него, сегодня думаете, как написать, чтобы он захотел встретиться.\n\nЕго молчание вы принимаете за доказательство, что с вами что-то не так. И теперь нужно добиться ответа, чтобы выдохнуть: «Фух, я ему все-таки нужна».\n\nБлядь, он уже третью встречу отменяет, а вы переживаете, достаточно ли интересно с вами общаться.\n\nВы так заняты тем, чтобы он вас выбрал, что даже не спрашиваете себя: вам самой нравится, как он с вами обращается?","caption":"Одно его «привет» после недели молчания, и вы уже забыли, как злились вчера. Только отмененная встреча от этого никуда не делась.\nЯ Ольга, психолог, работаю с девушками и женщинами 22-35 лет.\nОтправьте подруге, если она сейчас ждет такого сообщения."},{"v":"h1","text":"«Почему я опять хочу быть с мужчиной, которому я не нужна?»\n\nЯ бы тут посмотрела, что происходит после его отказа. Он отвечает через сутки, встречу снова откладывает, и вы уже час выбираете, что ему написать. Надо как-то поинтереснее. Полегче. Чтобы точно ответил.\n\nЕго внимание становится доказательством, что с вами все в порядке.\n\nБлядь, сколько сил уходит на одно сухое сообщение.\n\nВам уже трудно понять, нравится ли вам вообще этот мужчина. Вы заняты другим вопросом, почему он вас не хочет. И ждете, что именно он поможет вам перестать чувствовать себя ненужной.","caption":"Одно теплое сообщение после недели молчания может обрадовать так, что вы тут же забудете, как злились накануне. Я бы не торопилась называть это сильными чувствами к человеку.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nОтправьте той, кому сейчас нужно это услышать."},{"v":"h4","text":"«Почему я опять жду сообщения от мужчины, которому явно не до меня?»\n\nКогда чужое равнодушие для вас означает «со мной что-то не так», очень хочется добиться внимания именно этого человека. Чтобы он передумал. Тогда и вы сможете перестать считать себя какой-то неправильной.\n\nВот он неделю не пишет. Вы уже решили, что хватит. А вечером от него: «Как ты?» Все, вы улыбаетесь в телефон, хотя днем злились. И снова тянете разговор. Блядь, опять все сама.\n\nЭти два слова так радуют, потому что появляется надежда: «Значит, я ему все-таки нужна».","caption":"Даже подругам уже стыдно рассказывать, что вы снова с ним общаетесь. И приходится защищать его перед ними, хотя самой хочется спросить, какого хр*на он вообще объявился.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nОтправьте этот ролик той, кому сейчас нужно это услышать."},{"v":"h2","text":"«Он толком не пишет, а я все равно жду именно его».\n\nЕсли вы привыкли добиваться внимания, чужое равнодушие становится задачей: «Вот понравлюсь ему, значит, со мной все нормально».\n\nОн три дня молчит. Вы уже злитесь, собираетесь забить. Потом прилетает «как ты?», и вы улыбаетесь в телефон. Блять, всего два слова! А у вас такое облегчение, будто он наконец сказал, что хочет быть с вами.\n\nВы на минуту перестали сомневаться в себе. Он вспомнил, значит, вы ему нужны.\n\nВы уже хотите получить от него подтверждение, что вас можно любить. И когда он снова пропадает, приходится добиваться этого заново.","caption":"Даже подругам рассказываете прежде всего о том, что он наконец написал. До разговора о том, хорошо ли вам с ним, дело так и не доходит.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nОтправьте тому, кому сейчас это нужно."},{"v":"h3","text":"Вы снова выбираете человека, который вас не выбирает, и пытаетесь стать для него интереснее. Вот он ответил на ваше сообщение одним словом. Вы уже придумываете что-нибудь смешное. Потом удаляете. Блядь, слишком навязчиво. Надо полегче.\n\nВ таких отношениях легко увлечься самой задачей: добиться, чтобы вас наконец ВЫБРАЛИ. Кажется, тогда получится поверить, что с вами все в порядке. Как будто вы на собеседовании, где вам никак не сообщат результат, а вы все приносите новые рекомендации.\n\nИ вот вы уже столько знаете о том, как ему понравиться. А он вам вообще нравится?","caption":"Подругам вы уже объясняете, почему он занят. Хотя он даже не просил его оправдывать.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nОтправьте той, с кем хочется это обсудить."}]},{"id":"r_zlost_1","topic":"«я вообще никогда не злюсь»","author":"Юлия","format":"post_tg","cards":[{"v":"h1","text":"«На маму нельзя злиться»\n\nЯ с этим совершенно не согласна. Даже если мама тебя любит. Даже если очень много для тебя сделала.\n\nКогда тебе говорят, что на маму злиться нельзя, ты все равно чувствуешь, как внутри все закипает. Только тут же начинаешь себя ругать. Она ведь волнуется, зачем я так реагирую, могла бы и промолчать.\n\nИ вот ты уже виновата. Хотя пять минут назад тебе было обидно.\n\nМама опять прокомментировала твой вес или объяснила, почему мужчина с тобой долго не останется. Ты замолчала, потом весь вечер прокручивала разговор, а утром позвонила ей как обычно. Еще и спросила, не обиделась ли она.\n\nА твоя обида куда делась? Ее ты даже обсудить с собой толком не успела.\n\n«Она же тебе добра желает». Допустим. Но от слов про твой вес тебе больно. Добрые намерения этого не отменяют.\n\nПотом добавляют, что ты слишком чувствительная. И ты уже пытаешься стать такой, которой можно сказать что угодно. Вот это меня возмущает. Человеку сказали гадость, а исправлять предлагают его чувствительность.\n\nЕсли ты привыкла считать свою злость чем-то недопустимым, тебе проще найти ошибку в себе. Надо было спокойнее ответить, надо было понять, надо было потерпеть.\n\nТы отвечаешь за то, что делаешь со своей злостью. За оскорбления, например. Но само чувство никого не оскорбляет и плохой дочерью тебя не делает.\n\nИ можешь закончить разговор, в котором снова обсуждают твой вес, даже если мама этим недовольна.","caption":""},{"v":"h5","text":"«Он же не хотел тебя обидеть»\n\nИ что, теперь тебе даже злиться нельзя?\n\nТебя перебили в третий раз. Ты еще договорить не успела, а тебе уже объясняют, почему ты неправильно думаешь. Хочется сказать: «Дай мне закончить». Но ты улыбаешься и замолкаешь. «Он просто такой. Не специально же».\n\nА потом говоришь про себя: «Я спокойная, меня сложно разозлить».\n\nТы успела разозлиться. И тут же потребовала от себя доказательств: он точно хотел сделать тебе больно? Он вообще понимает, что делает? Может, ты сама придираешься?\n\nЯ бы тут спросила: почему для твоей злости обязательно нужен человек, который намеренно тебе вредит?\n\n«Он же хотел как лучше». Допустим. Но он без спроса решил за тебя, что тебе делать. Добрые намерения у него есть. Согласия твоего нет.\n\n«На правду не обижаются». Ага, очень удобно. Теперь можно обсуждать твою внешность за общим столом, и ты еще должна поблагодарить за честность?\n\n«Ты слишком остро реагируешь». После этого так легко начать подбирать слова помягче, пока от твоего недовольства вообще ничего не останется.\n\nЕсли ты привыкла быть хорошей, тебе трудно злиться на человека, которого ты любишь. Сразу кажется, что ты несправедливая и неблагодарная. Поэтому ты объясняешь себе его поведение, пока уже сама не понимаешь, почему хочется плакать.\n\nТы отвечаешь за то, что делаешь со своей злостью. Оскорблять, унижать, мстить человеку нельзя. Но само чувство никому не причиняет вреда.\n\nТебе можно попросить человека больше так не делать, даже если он ничего плохого не хотел.","caption":""},{"v":"живой","text":"Почему даже в браке понимание стадий не всегда приносит спокойствие\n\nКогда вы замужем не первый год,\nотношения неизбежно меняются.\nЭто не плохо. Это не «что-то пошло не так», это просто факт.\nМожно знать, что есть этапы, кризисы, переходы. Можно понимать, что романтика трансформируется, что близость становится глубже, но тише. Можно читать много об этом всем. И всё равно внутри может быть:\n\nтревога\n\nощущение отдаления\n\nбольше раздражения, чем раньше\n\nгрусть по тому «как было в начале»\n\nсомнение «это нормально или мы теряем друг друга?»\nПотому что каждый этап брака касается наших чувств очень глубоко. И тут у каждого свое:\nстрах быть ненужной, страх остаться одной внутри отношений, страх перестать быть важной.\nВ терапии\nмы не просто определяем на каком этапе пара, мы аккуратно разбираем:\n\nчто именно изменилось между вами\n\nчто изменилось внутри вас\n\nгде естественный этап брака, а где накопленная усталость или непроговорённая боль\nИногда становится легче уже от того, что вы перестаёте держать это в себе.\nЕсли вы сейчас в точке, где:\n\nотношения изменились\n\nвы стали чаще сомневаться\n\nустали все анализировать в одиночку\n\nне хотите разрушить то, что можно сохранить\nМожно разобрать это индивидуально!\n\nНапишите мне в личные сообщения\n@an_smy\nслово\n«брак»\n, и я расскажу, как проходит первая встреча.\nБывает достаточно одного честного разбора, чтобы перестать паниковать и начать понимать, что с вами происходит.","caption":""},{"v":"h0","text":"«На близких нельзя злиться»\n\nС чего бы? Близкий человек вполне может тебя разозлить. Даже любимый. Даже если он много для тебя сделал.\n\nНо ты говоришь: «Я вообще никогда не злюсь». И тут же объясняешь, почему: мама переживает, муж устал, подруга сейчас в тяжелом периоде.\n\nТы так хорошо понимаешь каждого, что до своей злости просто не доходишь. Уже нашла объяснение, уже пожалела человека. А сама почему весь вечер ходишь с комом в горле?\n\n«Он же не специально».\n\nИ ты начинаешь думать: «Тогда чего я обижаюсь? Глупо как-то». Но человек может задеть тебя без всякого намерения. Рассказать при всех то, что ты просила оставить между вами.\n\n«Ей сейчас и так тяжело».\n\nИ вот ты уже слушаешь резкие замечания и молчишь. Еще и спрашиваешь потом, как она себя чувствует. Твое «со мной так нельзя» придется отложить. У нее же проблемы.\n\n«Будь умнее, не обращай внимания».\n\nОх, сколько всего предлагают проглотить под видом ума. После такой фразы злиться еще и стыдно: «Я что, совсем не умею себя держать?»\n\nПохоже, ты считаешь, что для злости нужно сначала доказать: человек плохой и сделал все нарочно. А если у него нашлось объяснение, ты уже как будто не имеешь права сердиться.\n\nЯ бы вообще убрала этот суд над человеком.\n\nТы отвечаешь за то, что делаешь со своей злостью. Оскорблять человека, пугать его, унижать нельзя. Сказать, что тебя задело, и попросить больше так не делать вполне можно.\n\nЧтобы сказать близкому, что тебе больно, тебе не нужно сначала признать его плохим человеком.","caption":""},{"v":"h4","text":"«На близких злиться нельзя»\n\nЕще как можно. Я бы вообще с этой фразой была осторожна.\n\nПосле нее ты лежишь ночью и думаешь: «Почему меня все бесит? Они же ничего плохого не хотели». Потом вспоминаешь, сколько для тебя сделали, и становится стыдно. Уже и злость свою обсуждать вроде неприлично.\n\n«Она же добра тебе желает».\n\nДопустим, мама приехала помочь с ребенком. Ты правда рада, что удалось спокойно сходить к врачу. Но заодно услышала, что ребенка ты кормишь неправильно и дома у тебя вечный бардак. И вот ты уже убеждаешь себя: «Она устала. Нельзя было ее просить».\n\nХотя тебе было обидно это слушать. Помощь ты тоже заметила.\n\n«Он столько для тебя делает».\n\nДа, делает. Забрал тебя с работы, когда шел дождь. А вечером при друзьях рассказал то, что ты просила оставить между вами. Ты хочешь сказать, что злишься, но вспоминаешь про поездку. Как будто теперь должна промолчать.\n\nВот здесь и появляется это «я никогда не злюсь». Ты успеваешь запретить себе злость раньше, чем толком поймешь, что тебя задело. У близкого ведь нашлось оправдание. А у тебя сразу нашлась вина.\n\n«Надо быть благодарной».\n\nСогласна. Только благодарность за помощь не обязывает соглашаться со всем, что человек потом говорит и делает. Он помог тебе. Это важно. Тебе больно от его слов. Это тоже важно.\n\nТы отвечаешь за то, как обходишься со своей злостью. Кричать, унижать, мстить, конечно, нельзя. Но само чувство никому не причиняет вреда. И близкому человеку не обязательно понравится, что ты чем-то недовольна. Его недовольство еще не делает тебя виноватой.\n\nЕсли тебя задели, ты можешь сказать об этом и попросить больше так не делать. Даже если этот человек очень много тебе помогал.","caption":""},{"v":"h2","text":"«Хорошие девочки не злятся»\n\nС этим я категорически не согласна. Очень удобно получается для всех, кроме самой девочки.\n\nТы говоришь: «Я вообще никогда не злюсь». Но после разговора с мамой почему-то хочется выключить телефон. После просьбы коллеги доделать за нее работу болит голова. Ты соглашаешься, а потом лежишь и думаешь: «Почему опять я?»\n\nУ тебя есть объяснение для каждого. Мама переживает. Коллега устала. Ты понимаешь, почему они так поступают, и считаешь, что теперь злиться нельзя. Ведь у них причины! А твое «мне это надоело» даже рассматривать как-то неловко.\n\n«Она же тебе добра желает».\nИ ты снова слушаешь, что тебе пора похудеть или родить. Потом еще ругаешь себя: «Она заботится, чего я завелась?» Можно понимать ее намерения и злиться на ее слова. Одновременно.\n\n«Из-за такой ерунды?»\nДа, чашку можно помыть. Только ты уже просила убирать за собой. И вчера просила. Злость появилась еще до этой чашки, когда твою просьбу в очередной раз пропустили мимо ушей.\n\n«Будь умнее, промолчи».\nКак интересно: от тебя опять ждут, что ты все проглотишь. А тому, кто тебя задел, можно ничего в себе не менять.\n\nЕсли злиться для тебя означает быть плохой, ты начинаешь искать в себе вину раньше, чем успеваешь понять, что тебя обидело. «Я придираюсь. Я слишком чувствительная». Только обида никуда не девается.\n\nТы отвечаешь за то, что делаешь со своей злостью. За оскорбления, угрозы, удар. Само чувство никому не причиняет вреда и не требует оправданий.\n\nТебе не нужно сначала доказать, что он плохой.","caption":""},{"v":"h3","text":"«Я вообще никогда не злюсь»\n\nПодожди. Даже когда тебя перебивают, отменяют ваши планы в последний момент и берут твои вещи без спроса?\n\nМне хочется спросить: куда в этот момент девается твое «мне так не подходит»?\n\nУ хорошей, удобной девочки часто есть одно условие: злиться можно, только если человек, который тебя разозлил, согласится, что повод серьезный. Вот поэтому ты столько объясняешь. Почему тебе неприятно. Почему ты попросила так больше не делать. Почему это уже пятый раз.\n\nИ ждешь, что тебе наконец скажут: «Да, тут ты имеешь право».\n\nНо обычно слышишь знакомое.\n\n«На что тут злиться?» И ты начинаешь искать причину посолиднее. Просто того, что с тобой так обошлись, как будто мало. Нужно еще доказать, что любая другая на твоем месте тоже возмутилась бы.\n\n«Я же ничего плохого не хотела». И ты уже успокаиваешь человека, который задел тебя. Он хотел как лучше, значит, тебе теперь неудобно сказать, как получилось.\n\n«Ты слишком остро реагируешь». И разговор уходит в твою чувствительность. Про вещь, которую взяли без спроса, можно больше не говорить.\n\nТы отвечаешь за то, что делаешь со злостью: за крик, оскорбления, попытки наказать. Чужое согласие с твоими чувствами в твою ответственность не входит.\n\nМожно сказать: «Я злюсь, потому что мы договорились, а ты снова отменил все в последний момент».\n\nДаже если в ответ тебе скажут, что злиться тут совершенно не на что.","caption":""}]},{"id":"r_humor_1","topic":"когда ты психолог, а подруги приходят «просто поговорить»","author":"Ольга","format":"reels_rol","cards":[{"v":"h2","text":"Привет! Вы сейчас свободны? Я просто поболтать. Тут с мужем опять. Я вам переписку переслала, там немного, сорок скринов. Посмотрите, кто из нас прав.\n\nТолько честно, как психолог. Как подруга вы меня уже поддержали, спасибо.\n\nА можно я ему дам ваш номер? Вы ему объясните, он вас послушает. Меня он вообще не слышит.\n\nЗавтра заняты? А во сколько заканчивается последняя консультация? Вот после нее и созвонимся. Вам же уже никуда не надо.\n\nИ, пожалуйста, все между нами. Я даже вашей подруге ничего не рассказываю. Ну, кроме Кати.\n\nЗа консультацию платить? Блядь, я же вам тоже мемы присылаю.","caption":"Еще переписку могут прислать с пометкой «прочитайте, когда отдохнете», чтобы вечер точно не пропал.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 22 до 40 лет.\nПодписывайтесь, если хочется еще такого: здесь про отношения и привычку быть для всех удобной."},{"v":"h0","text":"Слушай, давай вечером кофе попьем? Ты же психолог, я тебе про мужа расскажу. Только вопросы подготовь, я сама не знаю, с чего начать. И давай где потише, мне надо поплакать.\n\nТы сегодня после шести не работаешь? ОТЛИЧНО, значит, свободна.\n\nТолько без твоего «ну он козел». Так я и сама могу. Ты мне нормально объясни, почему я его выбрала.\n\nБлядь, ну чего ты вздыхаешь? Я же к тебе как к подруге пришла. Мне важно, чтобы ты была собой. Только собой спокойной, внимательной и чтобы про себя пока ничего не рассказывала.\n\nЗа кофе переведи мне половину. Мы же просто посидели.","caption":"А потом подруга спрашивает, как ваши дела, когда вы уже надеваете куртку.\nЯ [имя], психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого. Здесь говорим про отношения и все, что в них бесит."},{"v":"h4","text":"Слушай, ты же психолог, мне ПРОСТО поговорить. Ты сегодня после клиентов свободна? Отлично, будешь уже настроена. Я тебе пока переписку с мужем скину, там немного, с февраля. Прочитай до встречи, чтобы мы время не теряли. И скажи, почему я так реагирую. Только подробно, ты же меня знаешь. Нахуй мне объяснять чужому человеку всю жизнь, если у меня есть ты? Что с меня? Вино принесу! Только пить тебе нельзя, мне важно, чтобы ты внимательно слушала. А про тебя потом поговорим. Я нас записала на каждую среду. Если отменишь, предупреди заранее, я тяжело переношу отвержение.","caption":"После такого разговора подруга помнит все про ваш брак и даже не знает, что вы сменили работу. Зато вино принесла.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого, здесь я говорю про отношения и все, что в них бесит."},{"v":"h1","text":"Девочки, если ваша подруга психолог, зовите ее на кофе. Скажите, что соскучились. Я бы сразу выбрала тихое место, чтобы нормально обсудить, почему вас все бесят. Начните с работы, потом про мужа, и маму обязательно. Она задает вопросы? Сука, как же она хорошо слушает. Если предложит записаться на консультацию, обидьтесь. Вы же подруги. Еще можете вечером прислать переписку с мужем. Там всего сорок скриншотов, пусть быстренько посмотрит, кто прав. А если она начнет рассказывать про себя, скажите, что сейчас совсем нет сил на чужие проблемы. Она психолог, она поймет.","caption":"Я бы насторожилась уже на сообщении «Ты только послушай, отвечать ничего не надо». Следом обычно прилетает «Ну и что мне теперь делать?».\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого, здесь я говорю про отношения и все, что в них бесит."},{"v":"h5","text":"Девочки, если ваша подруга психолог, начинайте с «Я просто поболтать». Потом присылайте восемь голосовых про бывшего. Переписку тоже приложите, ей нужен контекст.\n\nНа кофе сразу спрашивайте, почему вас тянет к таким мужикам. Пусть поработает, пока капучино остывает.\n\nЕсли предложит записаться на консультацию, удивляйтесь: «Ой, теперь с подругами только за деньги?»\n\nОбязательно добавьте: «Я же тебя как психолога не спрашиваю». И следом: «Но это у него нарциссизм или что?»\n\nБлядь, удобно же. Она уже знает вашу маму.\n\nЕсли подруга тоже захочет выговориться, скажите, что у вас сейчас нет ресурса. Вы же пришли отдыхать.","caption":"А потом подруга еще думает, стоит ли рассказывать вам о своих проблемах. Вдруг упадет в ваших глазах как специалист.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого, здесь я говорю про отношения и привычку быть удобной."},{"v":"живой","text":"Уважаемые родители, рассаживаемся. Тема урока: доверие. Как сделать, чтобы ребенок вам доверял? Правильно. Нужно, чтобы он не доверял больше никому. Особенно себе. Чтобы ни одна мысль, которая приходит ему в голову, не вызывала у него доверия. Это первый класс, вторая четверть. Он вам говорит: вы на меня орете. Кто на тебя орет? Никто на тебя не орет, я разговариваю, понятно? Он говорит: вы меня наказываете. Мы не наказываем. Мы воспитываем, это разные вещи. Он говорит: я не могу. Ты все можешь, ты просто не хочешь. Что за вопросы вы задаете? Вы что, тупая? Лично я не обзываюсь. Я выстраиваю гипотезу. Вот. Почувствовали? Сразу доверие между нами возникло. И с ребенком так же. Тогда в семье будут теплые доверительные отношения.","caption":""},{"v":"h3","text":"Девочки, если ваша подруга психолог, приходите к ней «просто поговорить». Я объясню, как правильно. Сначала спросите, как дела. Ответ можно пропустить, у вас там скрины накопились. Присылайте все, пусть вникает. Если отвечает коротко, уточните: «А как психолог ты что скажешь?» Если предлагает записаться, возмутитесь: «Сука, мы же подруги». Если говорит, что устала, напомните: «Я к тебе ПРОСТО по дружбе». Главное, регулярно спрашивайте, почему она сама ничего не рассказывает. Нам нужна взаимность. Начала рассказывать? Отлично. Скажите: «Ну ты же психолог, ты разберешься. Так вот, он мне опять написал».","caption":"Отдельный жанр: «Ты только меня сейчас не анализируй». Следом приходит скрин переписки с просьбой разобрать каждое слово.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого: здесь про отношения и наши привычки в них."}]},{"id":"r_malysh_1","topic":"почему так страшно сказать «нет»","author":"Ольга","format":"reels_malysh","cards":[{"v":"живой","text":"Большие тети-дяди тебе этого не скажут, поэтому у тебя сердечко бо-бо, животик бо-бо, и бабайки в голове пугают. Сейчас тетя расскажет, как бабайкам дать пизды.\nТы думаешь, что бабайки настоящие. Если нападешь на бабайку, бабайки дадут тебе пизды. Ты будешь маленький и беззащитный, все будут смеяться и бросят тебя.\nПоэтому ты от бабаек убегаешь. Но бабайки придуманные. Вот тут мир, вот тут ты, а вот тут твои бабайки.\nЕсли бабайки придуманные, ты на них наорешь, пошлешь нахер, и ничего не случится. Они так и останутся придуманными. Мир не меняется. Меняются глаза.","caption":""},{"v":"h1","text":"Хорошие мои, вам страшненько отказать маме, даже когда на выходные уже есть планы?\n\nПредставьте, что у вас есть стульчик рядом с любимыми людьми. И вы привыкли, что сидеть на нем можно, пока вы соглашаетесь. Сказали ДА, вас любят. Отказали, и уже ждете, что стульчик заберут.\n\nМама просит приехать, и вы отменяете свои планы. Потом злитесь. Заебались уже все отменять. Но еще страшнее услышать ее холодное «понятно» и весь вечер думать, как теперь помириться. Хотя вы даже не ссорились.\n\nВы правда хотите приехать или боитесь, что мама перестанет с вами разговаривать?","caption":"Даже ответ без привычного сердечка потом можно перечитывать и искать, где человек обиделся.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nЕсли узнали себя, напишите в комментариях слово «нет»."},{"v":"h5","text":"Девочки, вы устали, вас просят помочь, и отказать страшненько. Вдруг обидятся?\n\nПредставьте маленький звоночек. Когда за ваше «нет» вас ругали или переставали с вами разговаривать, он учился звенеть: «СРОЧНО соглашайся, иначе с тобой опять будут плохо обращаться».\n\nТеперь подруга просит помочь с переездом. Вы хотели отлежаться в выходной. Уже набираете: «Извини, я не смогу». И представляете, как она недовольно читает сообщение.\n\nЗвоночек звенит. Вы стираете отказ и пишете: «Во сколько приехать?»\n\nБлядь, вы уже согласились, а она даже обидеться не успела.\n\nПусть звоночек чуть позвенит, пока вы отправляете свой ответ. Чужое недовольство не обязывает вас менять решение.","caption":"После отказа еще тянет дописать пять объяснений и предложить помощь на следующей неделе.\n\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nНапишите в комментариях, кому вам труднее всего отказать."},{"v":"h4","text":"Хорошие мои, вас просят помочь, вы уже устали, но сказать «нет» страшно. Животик сжался. «Вдруг обидится?»\n\nЕсли раньше после вашего отказа с вами переставали разговаривать, вы запомнили: чтобы меня любили, надо соглашаться. Будто между вами дверца. Сказали «нет», и ее закроют.\n\nТеперь подруга просит приехать. Вы хотите остаться дома, но уже пишете: «Конечно, сейчас буду». Блядь, даже сумку собрали, хотя сил только лежать.\n\nДавайте дверцу пока оставим в покое. Не надо сразу писать следом: «Ладно, я приеду».\n\nПодруга может расстроиться из-за вашего отказа и все равно вас любить.","caption":"После отказа бывает особенно трудно выдержать паузу в переписке. Рука сама тянется отправить еще одно объяснение, хотя вы уже все объяснили.\nЯ Ольга, психолог, работаю с женщинами, которым трудно перестать быть удобными.\nЕсли знакомо, напишите в комментариях слово «нет»."},{"v":"h2","text":"Хорошая моя, вас просят помочь, вы уже еле стоите, но отказать страшно? Сердечко стучит: «Сейчас обидится. Потом вообще со мной разговаривать перестанет».\n\nВнутри у вас звоночек. Он научился звенеть, когда близкий человек недоволен. Особенно если раньше за вашим «нет» следовало молчание, пока вы не уступите.\n\nТеперь подруга просит приехать. Вы хотите остаться дома. И уже набираете: «Да, конечно».\n\nБлядь, вы еще даже не отказали, а уже испугались, что вас бросят.\n\nЗвоночек торопит: «Соглашайтесь, скорее!»\n\nМожно сказать, что сегодня вы не приедете.\n\nПодруга может расстроиться из-за вашего отказа и завтра снова вам позвонить.","caption":"Длинное объяснение отказа тоже бывает попыткой добиться, чтобы человек совсем не расстроился. Даже температуру готовы подробно описать, лишь бы поверил.\nЯ Ольга, психолог. Работаю с женщинами, которым трудно перестать быть удобными.\nНапишите в комментариях «нет», если узнали себя."},{"v":"h0","text":"Милые, вас просят помочь в выходной, и вам страшненько отказать? Хотя вы уже с ног валитесь.\n\nПредставьте домик, где вас любят. Если раньше за отказ с вами переставали разговаривать или называли эгоисткой, вы запомнили: чтобы меня впустили, надо говорить ДА.\n\nВы выросли. Коллега просит подменить ее в субботу. Вы хотите остаться дома, но уже отвечаете: «Конечно». И думаете: «Блядь, зачем я согласилась?»\n\nПотому что вам кажется: сейчас скажу «нет», и меня больше не захотят видеть в этом домике.\n\nНачните с маленького отказа человеку, который уже спокойно принимал ваши «нет».\n\nЧеловек может расстроиться и все равно хорошо к вам относиться.","caption":"После отказа так и тянет дописать пять сообщений с объяснениями. Как будто одного «в субботу я занята» недостаточно.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nЕсли знакомо, напишите в комментариях «знакомо»."},{"v":"h3","text":"Вам страшно сказать «нет», хорошие мои? Уже согласились помочь в субботу, хотя хотели лежать под одеялком. И теперь: «Блядь, опять согласилась».\n\nПредставьте: у вас есть стульчик за семейным столом. Если место за ним зависело от того, насколько вы удобная, вы учились его беречь. Помогли, уступили, промолчали. Можно сидеть. Отказали, кто-то рассердился. Ой, сейчас стульчик заберут.\n\nИ вот сегодня коллега просит выйти за нее. Вы уже чувствуете, как ваш стульчик шатается. Быстренько говорите «ДА», чтобы вас оставили рядом. Даже когда очень устали.\n\nМожно дать себе маленькую паузу. Пусть просьба побудет без вашего согласия хотя бы минутку.\n\n«Я подумаю и отвечу».","caption":"Особенно трудно, когда после отказа человек замолкает. Так и тянет дописать: «Ладно, давай помогу». Еще до того, как он вообще ответил.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nЕсли знакомо, напишите в комментариях «стульчик»."}]},{"id":"r_malysh_2","topic":"обида на маму, которую стыдно признать","author":"Юлия","format":"reels_malysh","cards":[{"v":"живой","text":"Если вы не можете перестать листать рилсы и заняться делом, я как клинический психолог хочу терапевтически спросить. А может быть, вы... ну... заебались? А? Я понимаю, вы уже записали себя в конченые. Но вдруг есть маленький шанс, что вы в ахуе от нагрузки, и мозг пытается залипнуть хоть на чем-то приятном. А? Думаете все-таки, что ленивая скотина? Записала. Ну и все же предлагаю попробовать выключить. Нет, не рилсы, не пугаемся. Бесконечный поток требований к себе. Как вам идея? Вдруг дело в нем. Так, навскидку.","caption":""},{"v":"h4","text":"Милая, тебе обидно на маму, и ты сразу себя ругаешь? «Она столько для меня сделала. Как я вообще могу на нее злиться?»\n\nСмотри, обида как заноза. Если ее получила от мамы, она все равно колется. Даже если мама тебя любит. Даже если много хорошего для тебя сделала.\n\nЕсли в детстве на твое «мне больно» мама отвечала «ты меня расстраиваешь», ты училась быстренько ее жалеть. Своя заноза подождет. Маме же плохо.\n\nИ теперь мама сказала что-то обидное, а ты уже переживаешь, как бы ее не огорчить.\n\nТы можешь любить маму и сердиться на нее.","caption":"Бывает, после маминого звонка плачешь, а потом сама ей перезваниваешь: вдруг она расстроилась. До своей обиды так и не добираешься.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nПодписывайся, если хочется еще таких разговоров. Здесь про отношения с мамой и свою взрослую жизнь."},{"v":"h0","text":"Милая, ты обиделась на маму и сразу себя ругаешь: «Она столько для меня сделала. Чего я опять начинаю?»\n\nСмотри, обида бывает как заноза. Мама сказала что-то больное, а тебе велели потерпеть: «Мама устала. Мама хотела как лучше». И ты решила, что жаловаться нельзя.\n\nЗаноза осталась. Ты выросла, мама сегодня ласковая, а тебе все еще больно. И ты думаешь: «Ну что я за дочь такая?»\n\nОх, еще и виноватой себя назначила. Больно тебе, а жалеть опять надо маму.\n\nМожно признать: «Да, мне обидно».\n\nТы можешь любить маму и все еще быть на нее обиженной.","caption":"После разговора ты еще час придумываешь, как надо было ответить. Особенно если опять промолчала, чтобы мама не расстроилась.\nЯ Юлия, психолог, работаю со взрослыми дочерьми.\nПодписывайся, если хочется еще таких разговоров о маме и о себе."},{"v":"h2","text":"Милая, ты обижаешься на маму, а потом ругаешь себя: «Она столько для меня сделала. Как я могу?»\n\nПредставь, что в пальчике заноза. Больно. А тебе говорят: «Ты что, хочешь сказать, мама плохая?» И ты прячешь ручку. Пусть лучше болит, только бы маму не расстроить.\n\nЕсли в ответ на твою обиду мама сама обижалась, ты училась сразу брать свои слова обратно. Даже когда она тебя правда задела. Ох, тебе еще и маму утешать пришлось.\n\nТебе не нужно оправдывать каждое мамино слово.","caption":"Бывает, рассказываешь, как мама тебя задела, и сразу добавляешь: «Но вообще она хорошая». Как будто без этой приписки тебя никто не станет слушать.\n\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nПодписывайся, если хочется еще таких разговоров про маму и про себя рядом с ней."},{"v":"h1","text":"Милая, тебе обидно на маму, и ты сразу себя ругаешь? Она столько для тебя сделала, а ты опять чем-то недовольна.\n\nЕсли мама случайно прищемила тебе пальчик, он ведь болит. Даже если мама устала. Даже если она очень тебя любит.\n\nНо если на твои слезы тебе говорили, как маме тяжело, ты привыкла сначала жалеть ее. И теперь только вспомнишь что-то обидное, уже начинаешь маму оправдывать. До себя даже не доходишь.\n\nОх, маленькая, тебе же тоже было больно.\n\nТы можешь любить маму и обижаться на нее.","caption":"Вспоминаешь мамину резкую фразу и тут же думаешь, что у нее самой было тяжелое детство. Я бы хотела, чтобы в этом разговоре с собой нашлось место и тому, что пережила ты.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nПодписывайся, если хочется еще таких разговоров, здесь я пишу про отношения с мамой и жизнь взрослой дочери."},{"v":"h5","text":"Милая, ты обижаешься на маму и тут же себя ругаешь: «Она столько для меня сделала. Как я могу?»\n\nПредставь, что у тебя в пальчике заноза. Ты говоришь: «Больно». А мама отвечает: «Ну что ты опять выдумываешь».\n\nЗаноза осталась. Только теперь ты еще и стесняешься плакать.\n\nМама сказала что-то обидное, ты расстроилась. А потом услышала, что ты неблагодарная. И теперь каждый раз, когда больно, сама себе говоришь: «Какая же я плохая дочь».\n\nОх, еще и виноватой себя назначила.\n\nМожно хотя бы здесь признать: «Да, мне было больно». Даже если мама старалась и многое тебе дала.\n\nБлагодарность маме не отменяет обиду на нее.","caption":"Бывает, уже собираешься рассказать, что мама сказала, и сначала объясняешь, как ей самой было тяжело. До своей боли так и не доходишь.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми.\nПодписывайся, если хочется еще таких разговоров про маму и свою взрослую жизнь."},{"v":"h3","text":"Хорошая моя, тебе обидно на маму, и тут же стыдно: она столько для тебя сделала, как ты вообще смеешь?\n\nПредставь, что у тебя есть коробочка. Мама сказала что-то больное, ты положила туда обиду. И сразу крышечку закрыла. Вдруг мама увидит и расстроится?\n\nЕсли в детстве на твои слезы мама отвечала: «Ты меня неблагодарностью до могилы доведешь», ты привыкла беречь ее даже в тот момент, когда самой больно.\n\nТеперь ты уже взрослая. Мама вообще в другой квартире. А ты все равно держишь коробочку закрытой. Даже самой себе сказать «мне было больно» стыдно, словно мама услышит.\n\nЛюбить маму и обижаться на нее можно одновременно.","caption":"Иногда после разговора с мамой ты еще долго мысленно подбираешь ей оправдания. Хотя объяснять ей свои чувства ты даже не собиралась.\nЯ Юлия, психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nПодписывайся, если хочется еще таких разговоров: здесь про отношения с мамой и свою взрослую жизнь."}]},{"id":"r_drug_1","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","author":"Михаил","format":"post","cards":[{"v":"h4","text":"Друг молчал месяц, а после ссоры с партнером написал вам, и вы уже отложили свои дела, чтобы его выслушать.\n\nВы даже рады: наконец поговорим. Спрашиваете, что случилось, сидите с телефоном до ночи. Про свой день так и не рассказали. Ладно, ему сейчас тяжело.\n\nПотом у него все налаживается. Вы пишете: «Ну как ты?» Получаете «Все хорошо, спасибо!» И снова тишина.\n\nВы знаете подробности каждой ссоры, но о том, что они помирились и вместе уехали отдыхать, узнаете из сторис. Как все.\n\nИ вот что здесь трудно заметить: вы тоже начинаете ждать чужих неприятностей. Конечно, вы не желаете другу плохого. Просто после сообщения «Мне ужасно, можно позвонить?» у вас появляется знакомое чувство: «Я ему все еще нужен».\n\nА написать без повода уже неловко. «У него все хорошо, чего я буду лезть». Свои трудности вы придерживаете: «У него и так хватает проблем».\n\nДруг при этом вполне может быть к вам привязан. Только он привык обращаться к вам за помощью. А вы каждый раз соглашаетесь на разговор, в котором обсуждается только его жизнь. Так можно годами дружить и чувствовать себя одиноко.\n\nПредложите встретиться просто так, когда у него все спокойно. Вам тоже нужно понять, хочет ли он проводить с вами время, когда его не требуется спасать.","caption":""},{"v":"h5","text":"Друг пишет «Можно вам позвонить?», и вы сразу думаете: «Что у него опять случилось?»\n\nВы уже привыкли: если он появился, значит, ему плохо. Когда у него все хорошо, вы узнаете о его жизни из сторис, как все остальные.\n\nИ постепенно даже радоваться его сообщениям перестаете. Еще не открыли переписку, уже прикидываете, есть ли сегодня силы долго его слушать.\n\nВ такой дружбе легко привыкнуть к мысли: «Я ему нужен, когда надо помочь». Вы знаете, как его успокоить, что спросить, когда лучше просто послушать. А вот зачем звонить ему в обычный вторник, уже непонятно. Проблемы нет. Повода вроде тоже.\n\nПотом он снова появляется, и вы откладываете свои новости. Он же сейчас переживает, куда тут с вашим повышением или смешной историей с работы.\n\nА когда ему становится легче, разговор заканчивается. Свои новости вы так и не рассказали.\n\nИ вы еще себя одергиваете: «У человека трудный период, а я тут обижаюсь». Но трудный период прошел. Вы ведь и после него никуда не делись.\n\nНо вам хочется, чтобы он интересовался вами и в спокойные дни.\n\nСкажите другу, что вам хочется общаться и тогда, когда у него все хорошо. Что вы скучаете по обычным разговорам и тоже хотите рассказывать, как у вас дела.","caption":""},{"v":"h2","text":"Друг неделями не отвечает, а потом пишет «мне очень плохо», и вы уже спрашиваете, когда ему удобно созвониться.\n\nХотя еще вчера думали: «Все, больше первым писать не буду». Но тут же человеку плохо. Свое недовольство можно отложить.\n\nИ вместе с тревогой за него приходит облегчение: он про вас помнит. Вы ему нужны. Значит, дружба еще есть.\n\nКогда вы скучали по человеку, его просьба о помощи ощущается как возвращение близости. Вы снова разговариваете по вечерам, знаете, что у него происходит. Даже появляется мысль: «Наконец-то нормально общаемся».\n\nПотом он мирится с партнером, находит работу, начинает выбираться из своей истории. Вы пишете: «Как ты?» Получаете «Все отлично!» и снова узнаете о его жизни из сторис, как все.\n\nТак, а куда делись ваши разговоры?\n\nВы можете искренне хотеть помочь и одновременно надеяться: теперь он останется, будет интересоваться вами, предложит встретиться. Поэтому каждый раз готовы забыть, сколько ваших сообщений осталось без ответа.\n\nПостепенно даже про свое трудно рассказать. У него расставание, какие тут ваши проблемы на работе. А когда у него все хорошо, до разговора опять не доходит.\n\nСама просьба о помощи еще не говорит о том, сколько места у вас в жизни друг друга. Это становится видно потом, когда помощь уже не нужна.\n\nЕсли узнаете эту историю, предложите встретиться в спокойный период. И скажите, что вам хочется общаться и тогда, когда у него все хорошо. Вам ведь тоже нужен друг, которому можно позвонить со своими новостями.","caption":""},{"v":"h3","text":"Друг неделями не отвечает, а потом пишет ночью: «Мне очень плохо. Можно позвонить?»\n\nВы берете трубку. Слушаете, успокаиваете, на следующий день спрашиваете, как он. Он отвечает подробно. Несколько дней вы снова близкие люди.\n\nПотом у него все налаживается. Ваше «как прошли выходные?» остается без ответа. Встретиться? «Да, обязательно, сейчас разгребусь». Зато в сторис он вполне разгребся: гости, поездка, ужин.\n\nИ вот что здесь особенно неприятно. В какой-то момент вам становится трудно радоваться его хорошим новостям. «Мы помирились», «нашел работу», «все решилось». Вы рады за него, конечно. И одновременно думаете: «Ну все, теперь опять пропадет».\n\nПотом еще и стыд: «Что со мной такое? Другу хорошо, а я расстроился».\n\nПослушайте, вам хочется остаться в его жизни и после того, как вы помогли. Рассказать, что у вас происходит. Обсудить какую-нибудь ерунду. Выпить кофе без двухчасового разговора о том, как все ужасно.\n\nКогда близость доступна только во время чужой беды, начинаешь ждать эту беду. Просто потому, что вместе с ней человек снова появляется. Самому от этого противно, и признаться в таком трудно.\n\nМожно сказать ему прямо: «Я замечаю, что мы много общаемся, когда тебе плохо, а потом ты пропадаешь. Мне тебя и в обычные дни не хватает».","caption":""},{"v":"h0","text":"Друг написал «Как вы?», и вы сразу подумали: «Что у него опять случилось?»\n\nВы уже знаете, что после пары сообщений будет длинный рассказ о ссоре, увольнении или очередном провале. И заранее прикидываете, хватит ли у вас сил сегодня его выслушать.\n\nВы помните, из-за чего он плакал месяц назад. А как он сейчас живет, приходится узнавать у общих знакомых. Встретиться за это время так и не получилось.\n\nПосле разговора он пишет: «Спасибо, только с вами могу нормально поговорить». Вам тепло. Значит, доверяет. Значит, вы важны.\n\nА потом снова тишина.\n\nВ такой дружбе легко привыкнуть чувствовать себя нужным именно тогда, когда человеку плохо. Его проблемы дают вам уверенность: «Без меня он бы не справился». Поэтому даже когда вы злитесь на эти исчезновения, отказать трудно. Вдруг подведете?\n\nПодождите, а куда делось ваше право просто поужинать и лечь спать? Почему ради дружбы вы опять должны разбирать чужую ссору до часу ночи?\n\nЧеловек правда может вам доверять. Но доверия в тяжелые дни мало, чтобы вы чувствовали себя близкими. Вам хочется, чтобы с вами тоже хотели погулять, посмеяться, узнать, как прошла ваша неделя.\n\nСкажите другу, что вам хочется общаться и тогда, когда у него все хорошо.","caption":""},{"v":"h1","text":"Друг пишет после месяца тишины, и вы уже понимаете, что у него опять что-то случилось.\n\nВы еще сообщение не открыли, а уже думаете, найдется ли вечером час его выслушать. И одновременно рады, что он наконец объявился. Вы скучали по человеку, а теперь снова будете разбирать его проблемы.\n\nВ такие вечера легко почувствовать близость. Он рассказывает личное, спрашивает вашего мнения, говорит, что только с вами может поговорить. Конечно, это трогает. Вы ему нужны.\n\nПотом у него все налаживается. На ваше предложение встретиться он отвечает, что неделя забита. Следующая тоже. Постепенно вы перестаете звать, чтобы опять не чувствовать себя навязчивым.\n\nИ тут новая беда. Время поговорить с вами сразу нашлось. Надо же.\n\nЧеловек привыкает обращаться к вам за поддержкой, а вы привыкаете получать его внимание именно в эти моменты. И соглашаетесь на очередной долгий разговор, потому что иначе общения вообще почти нет. Вы ведь хотите побыть с другом.\n\nМне кажется важным прямо назвать, чего здесь вам не хватает. Хочется быть нужным и тогда, когда у человека все хорошо. Просто поесть вместе, рассказать про свой день, посмеяться. Без обязательного происшествия.\n\nПредложите встретиться в обычный день и скажите, что скучаете по такому общению. В дружбе должно находиться время и на вашу жизнь.","caption":""},{"v":"живой","text":"КОГДА РОДСТВЕННИКИ ДАВЯТ - КАК УДЕРЖАТЬ СЕБЯ И СВОИ ГРАНИЦЫ\nОн пришёл на сессию и рассказал:\n— «Родители жены буквально\nвторглись\nв наши решения по покупке новой техники для дома. Сначала казалось, что это просто советы: «Смотри, вот это удобнее», «Так дешевле», «А ты уверен, что это нужно?»… Но с каждым словом\nдавление росло\n. Мне становилось тяжело, казалось, что я теряю\nконтроль\nнад своим выбором и своей семьёй».\n— «И что вы почувствовали?» — спросила я.\n— «\nГнев\n, раздражение… и одновременно\nтревогу\n, что если скажу что-то прямо, жена обидится, родители расстроятся. Я хотел обороняться, но понимал — это приведёт к\nконфликту\n».\n— «Что сделали дальше?» — уточнила я.\n— «Я сделал\nпаузу\n. Глубоко вдохнул, спросил себя: „Что важно лично мне? Как хочу действовать?“ Потом сказал спокойно: „\nСпасибо за мнение, мы обсудим и примем решение сами\n“. Постановка границы была\nмягкой\n, без резких слов».\n— «И как это прошло?»\n— «Невероятно легко. Родители почувствовали мою\nуверенность\nи\nуважение\n. Мы не поссорились, атмосфера осталась\nдружелюбной\n. Я сам чувствовал\nспокойствие\n, и при этом сохранил своё мнение и\nконтроль\nнад своей семьёй».\nВывод:\nЧасто родственники уверены, что знают лучше, и это создаёт\nдавление\n.\nНо внутренняя опора и контакт с собой помогают:\n— услышать свои желания\n— мягко, но\nтвёрдо\nобозначить границы\n— сохранить\nмир\nи\nуважение\nвокруг\nТак мы учимся\nуправлять\nэмоциями\n, не теряя себя, и показываем, что можно сохранять себя в любых обстоятельствах.\nА как вы обычно справляетесь, когда кто-то пытается давить на ваши решения?","caption":""}]},{"id":"r_mama_1","topic":"я злюсь на ребенка, а потом ненавижу себя за это","author":"Ольга","format":"post","cards":[{"v":"h3","text":"Вы накричали на ребенка и теперь лежите с мыслью: «Какая же я ужасная мать».\n\nА можно вопрос? У вас дома после этого кто-нибудь получает выходной, кроме совести? Та, я смотрю, опять работает в ночную смену.\n\n«Он же маленький, он вообще ни в чем не виноват». Да. И вот вы уже третий раз прокручиваете, каким голосом сказали «ХВАТИТ». Ребенок давно спит, а вы продолжаете суд над собой.\n\nПри этом из памяти как-то выпало, что вы ели стоя. В туалет ходили под стук в дверь. Просили дать вам полчаса, услышали «сейчас», и это «сейчас» закончилось укладыванием.\n\nА взорвались, когда ребенок вылил воду. Из-за воды! Ну точно, думаю вы, совсем охр*нела.\n\nДевочки, у самоненависти есть очень удобный для всей семьи эффект: она оставляет всю проблему внутри вас.\n\nВы плохая. Вам надо исправиться. Вам надо стать терпеливее. Остальные могут продолжать жить как жили. Бл*ть, как удачно все устроилось.\n\nПока вы мысленно лишаете себя звания матери, вопрос «почему я опять осталась одна со всем этим?» даже не попадает на обсуждение.\n\nПотом вы решаете завтра быть ласковее. И завтра снова едите стоя, ждете обещанные полчаса и к вечеру злитесь от звука собственного имени.\n\nИзвиниться перед ребенком можно: «Я накричала. Прости, тебе было страшно».\n\nИ разговор со взрослым тоже нужен: «Я сегодня дошла до крика. Завтра с семи до восьми ребенок с тобой. Мне нужен час, в который меня никто не зовет».","caption":""},{"v":"h2","text":"Вы накричали на ребенка, а теперь лежите рядом и думаете: «Какая же я ужасная мать».\n\nА сколько часов надо себя ненавидеть, чтобы завтра стать мамой, которая спокойно выдержит любое «не хочу»? До двух ночи хватит или лучше вообще не спать?\n\n«Но если я себя не отругаю, я опять сорвусь».\n\nДа вы себя уже так отругали, что страшно вспомнить. Почему же вчерашняя ругань не помогла сегодня?\n\nВы пытаетесь наказать себя так сильно, чтобы НИКОГДА больше не злиться на ребенка. Вспоминаете его лицо, когда повысили голос. Он уже спит, а вы снова прокручиваете эту минуту. Даже чай себе налить как будто стыдно. «Он плакал из-за меня, а я тут отдыхать собралась».\n\nБл*ть, даже после тяжелого дня вам теперь нельзя просто посидеть.\n\nСамонаказание дает ощущение, что вы что-то делаете: поняли, раскаялись, значит, в следующий раз удержитесь. Только утром ребенок снова отказывается одеваться. Вы снова торопитесь. И сил у вас ровно столько же, только теперь еще страшно: «Вдруг я опять начну орать».\n\nНо ненависть к себе не добавляет ни сна, ни помощи. Другой взрослый даже может не знать, насколько вы уже вымотаны. Вы ведь сами себе все объяснили: «Просто я плохая».\n\nКогда ребенок успокоится, договоритесь с близким взрослым о конкретном времени, когда он полностью берет заботу о нем на себя. Без ваших подсказок из соседней комнаты. Вам нужна возможность выдохнуть до следующего срыва, и просить об этом можно уже сейчас.","caption":""},{"v":"живой","text":"«Здравствуйте, Михаил! Вы говорите, что с собой надо общаться как с лучшим другом, поддерживать и тд. Но что делать, если не получается? Я действительно верю в своих близких, знаю, какой классный потенциал у них есть, но когда дело касается меня — сомневаюсь. С самооценкой все в порядке, она плавает только на моментах моей сильной неуверенности в своих силах, когда недостаточно практики и «доказательств». Как отпустить «поводья», расслабиться и позволить себе делать? И реально поддерживать себя так, как и своих друзей и семью?»\nНачнём с того, что сомневаться в себе, когда вы занимаетесь чем-то новым и в чём рука ещё «не набита» — нормально. Вы же адекватный человек и понимаете, что делать всё гениально с первого раза — такая себе история.\nПообщайтесь с собой и выясните, почему у вас к себе такие жёсткие требования и откуда эта чрезмерная требовательность вообще взялась? Если вы ориентируетесь на профи и думаете «как я могу встать рядом с ними, они такие классные, а я ещё ничего не умею», то нужно понять важную вещь — АБСОЛЮТНО каждый человек с чего-то начинал.\nФредди Меркьюри, к примеру, сначала играл на школьных вечерах и юбилеях, а не сразу на многотысячных аренах. Генри Форд, основавший Ford Motor, до этого потерпел крах с первой компанией по производству автомобилей. А Мерил Стрип на кастинге в Кинг-Конга и вовсе обозвали уродиной, но именно ей принадлежит рекорд по количеству номинаций на Оскар.\nЕсли у вас что-то не получается и вы где-то проваливаетесь, это не значит, что вы «тупой/недостаточно талантливый/какой-то не такой». Работайте над собой, поддерживайте и любите себя, продолжайте набираться опыта, перенимайте его у тех, кто вдохновляет вас.\nИ поймите главное — идеальный момент не настанет. Не будет такого дня, в который у вас вдруг раз и получится. Самореализация — это путь с ошибками и провалами. И пройти его вы должны, будучи в первую очередь опорой самой(самому) себе.\nУспехов!","caption":""},{"v":"h1","text":"Ребенок наконец уснул, а вы вспоминаете, как на него орали, и ненавидите себя.\n\nИ сколько часов надо себя грызть, чтобы завтра стать спокойной мамой? До полуночи хватит или лучше вообще не спать?\n\nЯ бы очень хотела, чтобы это работало. Но вы и так знаете, что кричать на ребенка плохо.\n\nВы думаете, что если перестанете себя ругать, то совсем обнаглеете. Будете орать и считать, что все прекрасно. Охренеть, бл*ть, сколько доверия к себе. Даже пожалеть себя страшно.\n\nПосле срыва вы обещаете себе завтра быть самой терпеливой. Поэтому завтра снова терпите все подряд.\n\nРебенок лезет вам под футболку, вам уже неприятно, но вы позволяете. Он требует взять его на руки, пока вы едите, и вы откладываете ложку. С третьего раза закрываете дверь в туалет и тут же открываете, потому что он плачет, а вы же решили больше не злиться.\n\nЗлость при этом никуда не делась. Вы просто запретили себе замечать ее, пока еще можете спокойно сказать, что сейчас доедите.\n\nА потом ребенок разливает воду, и вы срываетесь. И опять обещаете себе стать еще терпеливее. Девочки, куда еще?\n\nЯ считаю, злость надо замечать раньше, чем вы начинаете кричать. Для этого придется перестать ругать себя уже за само чувство. Вам может быть неприятно, тесно, громко. Даже рядом с любимым ребенком.\n\nЕсли чувствуете, что сейчас сорветесь, положите малыша в безопасную кроватку и отойдите на пару минут. Он может плакать, и вам будет тяжело это слышать. Но вам обоим сейчас нужна пауза.","caption":""},{"v":"h0","text":"Вы накричали на ребенка и теперь лежите рядом с ним: «Как же я себя ненавижу».\n\nА у вас после укладывания еще и суд над собой? Ребенок уснул, можно выдохнуть. Но вам срочно надо вспомнить каждую секунду и решить, что вы за мать такая.\n\n«Если я себя прощу, я вообще перестану сдерживаться».\n\nТо есть завтра вы будете терпеливее, если сегодня еще пару часов себя погрызете? Охрен*ть у нас требования к мамам. Даже мучиться надо с пользой.\n\nВы пытаетесь наказать себя так сильно, чтобы больше никогда не сорваться. И пока ругаете себя, есть ощущение, что вы что-то делаете: «Я же понимаю, как это ужасно. Мне же стыдно».\n\nТолько утром все остается как было.\n\nРебенок опять выплевывает кашу. Вы опять едите стоя. На предложение мужа отдохнуть отвечаете: «Сначала тут уберу». Вы уже злитесь, но просить сменить вас кажется стыдным. Сами же должны справляться.\n\nПотом кричите. И вот теперь отдыхать вам совсем нельзя, вы же виноваты. Бл*дь, так вы к следующему вечеру еще больше вымотаетесь.\n\nКрик может пугать ребенка. Но ребенку от вашей ненависти к себе спокойнее не становится. Ему нужно, чтобы вы успокоились и снова были рядом, могли обнять, поговорить без крика.\n\nПосле такого вечера договоритесь с мужем или другим близким взрослым, когда завтра он побудет с ребенком, а вы отдохнете. Помощь вам нужна ДО того, как вы снова сорветесь.","caption":""},{"v":"h4","text":"Вы опять накричали на ребенка и теперь лежите с мыслью: «Какая же я хреновая мать»?\n\nА вы рассчитывали, что после пятого «мам» подряд у вас откроется дополнительный запас терпения? Где-то рядом с запасом сна?\n\n«Он же маленький. Я взрослая, должна себя контролировать». Да. Только, бл*ть, взрослым тоже нужно допивать чай и ходить в туалет.\n\nПосмотрите, что происходит перед этим криком.\n\nВы уже встали поесть, но ребенок потянул за руку. Ладно, сначала ему. Муж спросил, можно ли ему в душ. Конечно, идите. А вы все еще хотите в туалет, но малыш только устроился у вас на коленях. Потерпите.\n\nПотом он опрокидывает чашку. И вас срывает.\n\nОн просит как умеет. А вы считаете, что обязаны откликнуться СРАЗУ, даже когда уже совсем нечем.\n\nИ после крика опять занимаетесь только им: обнимаете, успокаиваете, обещаете себе больше никогда. Ваш обед так и стоит на столе.\n\nВот что меня здесь волнует: вы ругаете себя за крик и продолжаете жить так, что вам даже поесть некогда.\n\nЕсли накричали, стоит вернуться к ребенку и сказать, что кричать на него было неправильно. А с другим взрослым дома договориться о времени, когда ребенком целиком занимается он. Даже если малыш зовет маму. Вам нужен перерыв еще до того, как вы сорвались.","caption":""},{"v":"h5","text":"Ребенок уже играет после вашего крика, а вы все еще думаете: «Как я могла? Он же маленький».\n\nИ что, теперь до вечера нельзя ни поесть нормально, ни посмеяться? Хорошая мать после срыва обязана сидеть и ненавидеть себя?\n\n«Если я перестану себя ругать, значит, мне вообще пофиг».\n\nОхренеть, девочки. Еще и страдать надо как следует, чтобы доказать, что вы любите своего ребенка.\n\nВы вспоминаете, как он вздрогнул от вашего голоса. Он подходит с книжкой, вы его обнимаете, но внутри все равно: «Не заслужила я обниматься».\n\nВечером муж предлагает побыть с малышом, пока вы полежите. И тут же мысль: «Я и так сегодня плохая мать. Еще и ребенка на него скину».\n\nВы наказываете себя, потому что хотите хоть как-то исправить то, что случилось. Кажется, если достаточно себя сожрать, то вы точно усвоите урок и больше никогда не сорветесь.\n\nТолько к вечеру вы голодная, вымотанная, все еще прокручиваете этот крик. Ребенок снова не дает надеть ему пижаму. И у вас опять все кипит. Бл*ть, вы же весь день старались стать лучше.\n\nВы мучаетесь, значит, вроде бы что-то делаете с произошедшим. Но ребенок от ваших мучений не понимает, почему мама кричала и виноват ли он.\n\nКогда успокоитесь, подойдите к нему, простыми словами признайте, что накричали и так делать нельзя. Обнимите, если он хочет.\n\nА если вам предлагают передышку, соглашайтесь. После срыва вам нужна помощь, и ее не надо сначала заслужить идеальным поведением.","caption":""}]},{"id":"r_stud_1","topic":"не могу сесть за диплом, хотя времени почти нет","author":"Юлия","format":"reels_monolog","cards":[{"v":"h4","text":"«До сдачи диплома неделя. Почему я опять весь день ничего не пишу?»\n\nБывает, ты тянешь до последнего, потому что тогда плохую оценку можно объяснить: «Ну я же писала за три ночи». А если потратишь месяц, постараешься и все равно получишь тройку? Тут уже страшнее: «Получается, я больше ничего не умею?»\n\nВот ты открываешь документ. Читаешь последний абзац, он какой-то дурацкий. И идешь мыть кружку. Потом решаешь, что с чистым столом будет легче. До вечера диплом так и открыт.\n\nИ как тут начать, если ты собираешься по одному диплому решить, умная ты вообще или нет?","caption":"Даже замечание научрука про оформление может звучать в голове как «ты ничего не понимаешь». Хотя он просил всего лишь поправить ссылки.\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nЕсли узнаешь себя, напиши в комментариях «диплом»."},{"v":"h0","text":"«Мне скоро сдавать диплом, почему я опять делаю что угодно, только бы его не писать?»\n\nОткрываешь документ. Перечитываешь заголовок. И вдруг надо срочно разобрать файлы на ноутбуке. Ну конечно, без порядка в папках диплом никак.\n\nЕсли тебе страшно показать, на что ты способна, откладывание дает удобную надежду: «Я бы написала хорошо, если бы времени было больше».\n\nПока текста нет, никто не может его прочитать и сказать, что получилось плохо. Даже ты сама.\n\nА когда садишься писать, приходится столкнуться с тем, что получается сейчас. С кривыми фразами, с пробелами в знаниях.\n\nИ вот вопрос: ты боишься плохого диплома или того, что после него сама решишь, что ты глупая?","caption":"Так и хочется еще поправить перед отправкой научруку.\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nЕсли узнаешь себя, напиши в комментариях «откладываю»."},{"v":"h1","text":"«Мне скоро сдавать диплом, почему я опять весь день ничего не пишу?»\n\nТы открываешь файл, поправляешь титульный лист и уходишь искать еще одну статью. Ну надо же подготовиться. Хотя статей уже столько, что читать их до следующего выпуска.\n\nЯ бы здесь спросила, что тебе страшно увидеть, когда ты начнешь писать.\n\nПока текста нет, ты еще можешь думать, что напишешь хорошо, просто нужно собраться. А первые абзацы получаются корявыми, и ты сразу решаешь, что вообще ничего не умеешь.\n\nПоэтому тянешь, даже когда сроки уже горят.","caption":"В дипломе даже замечание про оформление легко принять на свой счет
