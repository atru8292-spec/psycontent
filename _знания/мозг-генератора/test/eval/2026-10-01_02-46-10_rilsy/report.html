<script>
const DATA=[{"id":"otvet_1","author":"Михаил","format":"reels_otvet","asked":"reels_otvet","intent":"kak_v_terapii","topic":"«а если психолог мне не поможет?»","text":"Текст на экране: А если психолог мне не поможет?\nРечь: А если психолог мне не поможет? Такое бывает. И об этом можно говорить прямо, в том числе самому психологу. Допустим, вы приходите с мыслью: «Я все время думаю, что обо мне подумают». Мы обсуждаем вашу ситуацию, я предлагаю объяснение. Вы киваете, хотя внутри: «Вообще мимо. Но неудобно спорить, он же специалист». Я бы спросил: «Вам правда подходит то, что я сказал, или вы сейчас боитесь меня обидеть?» Если вы соглашаетесь из вежливости, я могу этого не заметить. Мне нужно услышать и ваше недовольство. Психологу тоже можно сказать: «Вы меня не поняли».","caption":"Можно начать встречу с того, что вы сомневаетесь, стоит ли вообще сюда ходить. Заранее доверять незнакомому человеку вы не обязаны.\nЯ Михаил, психолог. Работаю с тревогой, неуверенностью и трудностями в отношениях.\nОтправьте тому, кто боится первой встречи с психологом.","judge":{"zhivo":4,"zacep":3,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":[],"worst":"«И об этом можно говорить прямо, в том числе самому психологу» — общая вводная, задерживает узнаваемую сцену.","best":"Вообще мимо. Но неудобно спорить, он же специалист","verdict":"publikovat","why":"Узнаваемая сцена: даже у психолога человек боится спорить и изображает согласие. Признание «я могу этого не заметить» добавляет доверия, а конкретную фразу для встречи хочется сохранить."},"guard":[{"rule":"dvoetochiya","quote":"ихологу. Допустим, вы приходите с мыслью: «Я все время думаю, что обо мне подумаю | агаю объяснение. Вы киваете, хотя вн"}],"cut":["Вот это уже важно для нашей работы."],"before":null},{"id":"monolog_1","author":"Михаил","format":"reels_monolog","asked":"reels_monolog","intent":"mif","topic":"«уверенность надо в себе воспитать»","text":"Текст на экране: Сначала стану увереннее, потом решусь\n\nРечь: «Говорите себе у зеркала: я уверенный человек». Я не люблю этот совет. С ним легко начать ждать: вот поверю в себя, тогда и рот открою.\n\nНа совещании у вас есть идея. Вы уже три раза проговорили ее в голове, но молчите. Вдруг глупость? И потом еще ругаете себя: даже настроиться нормально не смог.\n\nА откуда возьмется уверенность, если вы каждый раз молчите и так и не узнаете, что будет, если высказаться?\n\nВолнение может остаться. Но после разговора у вас появится конкретный опыт: я волновался, высказался, меня выслушали.\n\nВы уже это делали.","caption":"Даже если вашу идею не поддержали, вы получили полезный опыт. Теперь вы знаете, что можете услышать возражение и продолжить разговор.\nЯ Михаил, психолог. Работаю с тревогой, неуверенностью и трудностями в отношениях.\nПодписывайтесь, если хочется еще таких разборов про себя и отношения.","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":["Вы уже это делали."],"worst":"«Вы уже это делали.» — отдельный мини-вывод сбивает: разговор пока только воображаемый, а фраза звучит как напоминание о реальном прошлом.","best":"«Вы уже три раза проговорили ее в голове, но молчите.»","verdict":"publikovat","why":"Узнаваемая сцена и понятный сдвиг: ожидая уверенности, человек лишает себя опыта, из которого она появляется. Речь легко произнести, а подпись удачно отвечает на вопрос: что, если идею не поддержат?"},"guard":[{"rule":"dvoetochiya","quote":"«Говорите себе у зеркала: я уверенный человек». Я не люблю этот с | овет. С ним легко начать ждать: вот поверю в себя, т"}],"cut":["Вы отвечаете за то, скажете ли свою мысль.","В следующий раз будет на что опереться."],"before":null},{"id":"spisok_1","author":"Ольга","format":"reels_spisok","asked":"reels_spisok","intent":"uznavanie","topic":"мама кричит на детей, а потом себя ненавидит","text":"Текст на экране: Мама, у которой все спрашивают\nРечь: Четыре признака, что вы дома отвечаете вообще за все.\nПервое. На работе вспоминаете, что ребенку нужны сменные кроссовки. Рабочий день еще идет, а вы уже мысленно собираете рюкзак.\nВторое. Ложитесь отдохнуть и прислушиваетесь, что там на кухне. Сейчас кто-нибудь обязательно позовет. Какой, блядь, отдых, если вы все еще дежурите.\nТретье. От предложения мужа «ну скажи, что сделать, я сделаю» хочется орать.\nЧетвертое. После крика на ребенка вы ненавидите себя и обещаете лучше себя контролировать. Мысль, что дома пора всем разделить обязанности, даже не приходит. Вы уже решили: опять исправляться должны только вы.","caption":"Можно весь вечер молчать, чтобы никого не обидеть, а потом сорваться на вопрос про носки. И весь вечер после этого обсуждать только свой крик. Куда делось все, что было до него?\nЯ Ольга, психолог, работаю с мамами, которых достали быт и отношения с мужем.\nОтправьте той, которая уже устала отвечать за все.","judge":{"zhivo":4,"zacep":3,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":[],"worst":"«Четыре признака, что вы дома отвечаете вообще за все.» — стандартный заход списком, слабее конкретных бытовых сцен дальше.","best":"Какой, блядь, отдых, если вы все еще дежурите.","verdict":"publikovat","why":"Кроссовки, ожидание окрика с кухни и мужское «скажи, что сделать» дают точное узнавание. Главное открытие: после срыва мама собирается исправлять только себя, а распределение обязанностей снова остается за скобками — это хочется переслать."},"guard":[{"rule":"ne_x_a_y","quote":"не обидеть, а"}],"cut":["Даже чтобы получить помощь, вам нужно сначала все придумать и объяснить."],"before":null},{"id":"istoriya_1","author":"Юлия","format":"reels_istoriya","asked":"reels_istoriya","intent":"svoya_istoriya","topic":"как я сама пришла в анализ и говорила, что все хорошо","text":"Текст на экране: Я говорила, что все хорошо\n\nРечь: Я пришла в анализ и говорила, что у меня все хорошо. [добавь: твой случай про начало анализа. Как ты объясняла, что все хорошо, и о чем тебе было трудно заговорить. Одна конкретная деталь.] Ведь сказать «мне плохо» бывает стыдно. Ты сразу начинаешь перечислять: работа есть, крыша над головой есть, никто не умер. Ну чего тебе еще? И уже сама себя отчитываешь за то, что вообще открыла рот. Даже в кабинете, куда ты пришла именно поговорить о себе. А сколько должно случиться плохого, чтобы ты перестала себя одергивать?","caption":"«У других хуже» легко сказать себе прямо перед тем, как заплакать. И потом еще извиниться за слезы.\nМеня зовут Юлия, я психолог. Работаю с женщинами 30-45 лет, которым одиноко или трудно в отношениях.\nСохрани, если хочется вернуться к этому разговору.","judge":{"zhivo":4,"zacep":3,"ponyatno":5,"polza":4,"interesno":3,"snyat":2,"ai_markers":["Сохрани, если хочется вернуться к этому разговору."],"worst":"[добавь: твой случай про начало анализа. Как ты объясняла, что все хорошо, и о чем тебе было трудно заговорить. Одна конкретная деталь.] — Вместо самой истории оставлено задание автору: снимать пока нечего.","best":"«У других хуже» легко сказать себе прямо перед тем, как заплакать. И потом еще извиниться за слезы.","verdict":"popravit","why":"Самоотчитывание узнаваемое, подпись хочется переслать. Но начало обещает личную историю, которой пока нет: без конкретного случая получается знакомое рассуждение психолога, а не рассказ о себе."},"guard":[{"rule":"zaglushka","quote":"[добавь: твой случай про начало анализа. Как ты объясняла, что все хорошо, и о чем тебе было трудно заговорить. Одна кон"},{"rule":"dvoetochiya","quote":"говорила, что у меня все хорошо. [добавь: твой случай про начало анализа. Как ты | т стыдно. Ты сразу начинаешь перечисл"}],"cut":["Получается, прежде чем рассказать, как тебе живется, нужно доказать, что ты имеешь право жаловаться."],"before":null},{"id":"poslanie_1","author":"Ольга","format":"reels_poslanie","asked":"reels_poslanie","intent":"podderzhka","topic":"мама, которая вечером считает, что опять ничего не успела","text":"Текст на экране: Тем, кто злится и винит себя\nРечь: Это для тех, кто вечером злится на мужа и тут же себя ругает: «Он ведь помог. Какого черта я опять недовольна?» Вы попросили его постирать. Рассказали, что с чем можно класть. Потом он из ванной: «А какой режим?» Потом вы напомнили развесить. И вот он постирал, а вы свои дела опять отложили. Блядь, конечно, вы злитесь. Вам хочется хоть одно дело целиком убрать из головы. Совет «просто попроси» меня бесит именно поэтому. Муж здесь живет. Стирка тоже его дело. Вы уже весь день помните, объясняете, напоминаете. Даже когда делает он, помнить обо всем приходится вам.","caption":"«Ты бы сказала, я бы сделал» особенно бесит, когда вы сами без всяких объявлений заметили пустой холодильник.\nЯ Ольга, психолог, работаю с мамами, которые устали от быта и отношений с мужем.\nПодписывайтесь, если хочется еще такого. Здесь говорим о семейной жизни, от которой хочется выть.","judge":{"zhivo":5,"zacep":4,"ponyatno":5,"polza":5,"interesno":5,"snyat":5,"ai_markers":[],"worst":"«Тем, кто злится и винит себя» — слишком общая надпись: бытовая сцена в речи цепляет гораздо точнее.","best":"«Блядь, конечно, вы злитесь.»","verdict":"publikovat","why":"Вопрос про режим и напоминание развесить мгновенно узнаются. Текст объясняет, почему помощь мужа не разгрузила голову: хочется переслать ему или подруге, а короткие реплики легко произнести в кадре."},"guard":[{"rule":"dvoetochiya","quote":"ером злится на мужа и тут же себя ругает: «Он ведь помог. Какого черта я опять не | о с чем можно класть. Потом он из ва"}],"cut":[],"before":null},{"id":"scenka_1","author":"Юлия","format":"reels_scenka","asked":"reels_scenka","intent":"kak_v_terapii","topic":"первые месяцы терапии, когда «все хорошо»","text":"Текст на экране: «Я думала, мне станет легче»\nПерсонажи: А это я, Б это психолог\nА: Я к тебе хожу, почему меня все раздражает?\nБ: Например, что?\nА: Муж опять договорился, что в выходные едем к его маме.\nБ: Ты хочешь ехать?\nА: Я хочу спокойно собраться и никому не портить настроение.\nБ: А ехать хочешь?\nА: Нет. Но я же должна учиться спокойнее ко всему относиться.\nБ: Что тебе хочется самой?\nА: Остаться дома. Но тогда муж будет недоволен.\nБ: А сейчас кто недоволен?","caption":"Меня злят обещания, что после терапии ты обязательно станешь счастливой. Близкие тоже могут быть недовольны переменами, особенно если привыкли к твоему согласию.\nЯ Юлия, психолог, работаю с женщинами от 30 до 45, с одиночеством и сложностями в отношениях.\nПодписывайся, если хочется еще таких сценок, здесь я говорю об отношениях и о том, как проходит терапия.","judge":{"zhivo":5,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":[],"worst":"Подписывайся, если хочется еще таких сценок, здесь я говорю об отношениях и о том, как проходит терапия. — Длинная стандартная приписка после сильного финала.","best":"А сейчас кто недоволен?","verdict":"publikovat","why":"Узнаваемый разговор: героиня хочет научиться спокойнее делать то, чего не хочет. Последняя реплика разворачивает привычную логику «лишь бы муж был доволен» — ради этого сценку досмотрят и перешлют."},"guard":[],"cut":[],"before":null},{"id":"rol_1","author":"Ольга","format":"reels_rol","asked":"reels_rol","intent":"yumor","topic":"муж «помогает» по дому","text":"Текст на экране: Инструктаж для мужей. Готовим ужин\nРечь: Мужчины, жена попросила приготовить ужин? Без паники. Она рядом, справится. Сначала спросите, что готовить. Потом, где макароны. Даже если знаете. Важно, чтобы она участвовала. Воду налили? Уточните, сколько. Закипела? Позовите жену посмотреть. Пачку не читайте, жена быстрее ответит. Теперь спросите, что будут дети. Если она скажет «то же самое», переспросите: «А они точно будут?» Отлично, она уже встала и сама достает котлеты. Стойте рядом. Спрашивайте, чем помочь. Сели есть? Обязательно скажите: «Ну вот, попросила, я приготовил. Почему ты злая?» Тарелки оставьте. Инструктаж по тарелкам вы еще не проходили, нахуй.","caption":"Однажды на детском празднике я считала, сколько раз муж посмотрел в телефон: одиннадцать. Я психолог, у меня супервизия, а я сижу и считаю.\nЯ Ольга, психолог, работаю с мамами, которые устали от быта и мужа.\nНапишите «знакомо» в комментариях, если у вас тоже такой помощник.","judge":{"zhivo":5,"zacep":4,"ponyatno":5,"polza":4,"interesno":5,"snyat":5,"ai_markers":[],"worst":"Я психолог, у меня супервизия, а я сижу и считаю. — Непонятно, при чем здесь супервизия; история про телефон не связана с ужином.","best":"Обязательно скажите: «Ну вот, попросила, я приготовил. Почему ты злая?»","verdict":"publikovat","why":"Узнаваемая бытовая сценка с нарастающим абсурдом: муж приготовил, а жена всё равно руководила каждым шагом. Хочется переслать подруге или мужу; слабая подпись самому ролику не мешает."},"guard":[{"rule":"dvoetochiya","quote":"и она скажет «то же самое», переспросите: «А они точно будут?» Отлично, она уже в | м помочь. Сели есть? Обязательно ска"}],"cut":[],"before":null},{"id":"doska_1","author":"Михаил","format":"reels_doska","asked":"reels_doska","intent":"mehanizm","topic":"почему трудно отказать","text":"Текст на экране: Почему я соглашаюсь, а потом злюсь?\nРечь: «Скажу да, лишь бы от меня отстали». Знакомая мысль?\nРисую: кружок «Страшно отказать».\nКоллега просит доделать задачу вечером. У вас свои планы, но уже крутится: «Откажу, решит, что на меня нельзя положиться».\nРисую: второй кружок «Согласился», стрелка от первого.\nВы говорите: «Ладно, присылай». И сразу становится легче. Все, объясняться не придется, коллега доволен.\nРисую: третий кружок «Отпустило», стрелка от второго.\nВот это облегчение и закрепляет привычку. Вы еще даже задачу не открыли, а уже получили награду за согласие: тревога стихла. Злость на себя придет позже.\nРисую: стрелка от «Отпустило» обратно к «Страшно отказать».\nПри следующей просьбе снова хочется сказать «да».\nИтог на схеме: три кружка «Страшно отказать», «Согласился», «Отпустило», соединенные в круг.","caption":"Согласие быстро снимает тревогу. Поэтому в следующий раз отказать снова трудно.\nЯ Михаил, психолог. Работаю с тревогой, неуверенностью и трудностями в отношениях.\nЕсли узнали себя, можете написать в комментариях «знакомо».","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":[],"worst":"Если узнали себя, можете написать в комментариях «знакомо». — Формальная просьба о комментарии, которая ничего не добавляет к ролику.","best":"Вы еще даже задачу не открыли, а уже получили награду за согласие: тревога стихла.","verdict":"publikovat","why":"Узнаваемая ситуация и небанальное объяснение: привычку соглашаться закрепляет моментальное облегчение, хотя потом человек злится. Схема помогает понять механизм, а инструкции позволяют сразу снять ролик."},"guard":[{"rule":"ne_x_a_y","quote":"не открыли, а"},{"rule":"dvoetochiya","quote":"чером. У вас свои планы, но уже крутится: «Откажу, решит, что на меня нельзя поло | Вы говорите: «Ладно, присылай». И ср"}],"cut":["В этот момент согласиться кажется проще, чем выдержать чужое недовольство.","Вы привыкаете соглашаться, чтобы поскорее перестать бояться."],"before":null},{"id":"bezslov_1","author":"Ольга","format":"reels_bez_slov","asked":"reels_bez_slov","intent":"yumor","topic":"хочу просто полежать, чтобы никто ничего не хотел","text":"Экран 1: Все, я легла. Сегодня детей укладывает муж.\nЭкран 2: Муж: «А где их пижамы?»\nЭкран 3: Муж: «Они говорят, что уже чистили зубы. Верить?»\nЭкран 4: Муж: «Какую сказку читать? Эту они не хотят».\nЭкран 5: Я: «Бл*дь, я лежу или работаю техподдержкой?»\nЭкран 6: Муж: «А чего ты не отдыхаешь?»","caption":"Пижамы найти, про зубы решить, сказку подобрать. Потом еще вспомнить, что младшая без своего зайца вообще не уснет.\nЯ Ольга, психолог для мам, которых достали быт и муж.\nЕсли хотите разобрать, как это устроено у вас, пишите в директ слово «разбор».","judge":{"zhivo":5,"zacep":5,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":[],"worst":"«Если хотите разобрать, как это устроено у вас, пишите в директ слово „разбор“». Шаблонная продажа после живой сценки.","best":"Бл*дь, я лежу или работаю техподдержкой?","verdict":"publikovat","why":"Мамы узнают свой «отдых», когда муж делает, а руководить всё равно приходится им. Последняя реплика отлично добивает сценку: хочется переслать мужу или подруге."},"guard":[{"rule":"dvoetochiya","quote":"Муж: «А где их пижамы?» | Муж: «Они говорят, что уже чистили зубы. Вер | Муж: «Какую сказку читать? Эту они не хотят»"}],"cut":[],"before":null},{"id":"auto_1","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"выходные в одиночестве","text":"Текст на экране: Тем, кто стесняется сказать «мне одиноко»\nРечь: Это для тебя, если в субботу ты листаешь переписки и думаешь: «Кому бы написать, чтобы не выглядеть навязчивой?» Потом ругаешь себя: взрослая женщина, могла бы уже придумать, чем заняться. Ты умеешь себя занять. Убраться, сходить за продуктами, включить сериал. Только тебе хочется, чтобы кто-нибудь сам написал: «Ты как? Давай увидимся». Ты тоже помнишь о людях, спрашиваешь, как дела, предлагаешь встретиться. И устаешь каждый раз гадать: человек правда хочет меня видеть или просто соглашается? Тебе хочется знать, что о тебе вспоминают и без твоего «привет».","caption":"Когда я впервые пришла в анализ, два месяца рассказывала, как у меня все хорошо. А перед каждой сессией плакала в машине.\nЯ Юлия, психолог, работаю с женщинами 30-45 лет, которым одиноко или трудно в отношениях.","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":[],"worst":"Ты тоже помнишь о людях, спрашиваешь, как дела, предлагаешь встретиться. — Перечисление чуть тормозит речь: переживание уже понятно без него.","best":"Тебе хочется знать, что о тебе вспоминают и без твоего «привет».","verdict":"publikovat","why":"Узнаваемая суббота и точное попадание: занять себя умеешь, хочется чужой инициативы, а не очередного занятия. Ролик легко произнести и хочется переслать человеку, которому всегда пишешь первой."},"guard":[{"rule":"dvoetochiya","quote":"субботу ты листаешь переписки и думаешь: «Кому бы написать, чтобы не выглядеть н | авязчивой?» Потом ругаешь себя: взрос"}],"cut":["Хотеть приглашения, ждать сообщения, расстраиваться из-за тишины совершенно понятно.","Если хочется, напиши в комментариях, каких слов тебе сейчас не хватает."],"before":null},{"id":"post_1","author":"Ольга","format":"post","asked":"post","intent":"podderzhka","topic":"крикнула на ребенка и ненавижу себя","text":"Если вы опять накричали на ребенка и теперь думаете: «Блядь, что я за мать», у меня есть вопрос.\n\nА сколько человек у вас дома могут просто спросить: «Что у нас на ужин?» И почему ответ обязаны знать именно вы?\n\n«Ну муж же помогает. Это я психованная, мне все мало».\n\nПомогает, да. Вы попросили сварить макароны, сказали, где кастрюля, напомнили выключить плиту. Потом из ванной ответили, что дать ребенку к макаронам. Охренеть, отдохнули.\n\nОн сделал поручение. Вы все это время помнили, что нужно сделать, объясняли и проверяли. Голова так и осталась занята ужином, хотя руки наконец освободились.\n\nИ тут ребенок третий раз зовет вас посмотреть какую-нибудь штуку. Вы орете. Потом сидите рядом со спящим ребенком и ненавидите себя. Вспоминаете только свой крик. Все, что вы тащили до него, уже будто не считается.\n\nКрик пугает ребенка, и вам больно, что вы его напугали.\n\nМуж здесь тоже живет. Вы хотите хоть часть вечера вообще не думать о кастрюле. Без просьб, объяснений и проверки.","caption":"","judge":{"zhivo":4,"zacep":5,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":["Голова так и осталась занята ужином, хотя руки наконец освободились.","Без просьб, объяснений и проверки."],"worst":"«Крик пугает ребенка, и вам больно, что вы его напугали». Повторяет уже показанное и прерывает живой рассказ обязательной правильной оговоркой.","best":"Охренеть, отдохнули.","verdict":"publikovat","why":"Узнаваемая сцена с макаронами объясняет, почему помощь мужа не принесла отдыха. Есть что переслать: после срыва женщина замечает только свой крик, а предшествующую нагрузку перестает учитывать."},"guard":[{"rule":"odushevlenie","quote":"время помнили"},{"rule":"dvoetochiya","quote":"ть накричали на ребенка и теперь думаете: «Блядь, что я за мать», у меня есть воп | человек у вас дома могут просто спро"}],"cut":["Но по одному этому вечеру нельзя решить, что вы плохая мать.","Если каждое домашнее дело мужу сначала нужно поручить, вы продолжаете работать даже тогда, когда он его делает."],"before":null},{"id":"tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"жду, когда станет не страшно, и тогда начну","text":"Уверенность приходит после\n\nЖдать уверенности перед первым шагом можно годами. Потому что вы ждете чувства, которое появляется, когда у вас уже есть опыт: «Я попробовал. Было страшно. Я справился».\n\nУ мозга есть привычка опираться на то, что с вами уже происходило. Если вы каждый раз откладываете трудный разговор, ему просто нечего вспомнить в вашу пользу. Откуда взяться мысли «я справлюсь», если до попытки дело так и не дошло?\n\nВот вы хотите написать, что предложенное время вам неудобно. Набрали сообщение. Перечитали. «Вдруг решат, что я капризничаю? Ладно, подстроюсь».\n\nСообщение удалено. Стало легче. Но вы так и не узнали, что случилось бы, если бы вы попросили перенести встречу. Поэтому в следующий раз снова страшно.\n\nЯ не люблю, когда самооценку пытаются лечить аффирмациями у зеркала. Можно сколько угодно говорить себе «я уверенный человек». Только вечером вы вспомните, как опять побоялись отправить обычное сообщение.\n\nНачать можно с небольшой просьбы, которую вы давно откладываете. Не обязательно сразу идти на самый трудный разговор в вашей жизни.\n\nИ здесь важно: вам могут отказать. Вы попросили, услышали ответ, расстроились и решили, что делать дальше. Оказалось, что отказ можно пережить.\n\nУверенный человек тоже думает: «А вдруг плохо отреагируют?» У него просто уже есть опыт, что он выдержит чужую реакцию.\n\nВы можете отправить сообщение с дрожащими руками. Оно все равно будет отправлено.","caption":"","judge":{"zhivo":4,"zacep":3,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":["Я попробовал. Было страшно. Я справился","Вы можете отправить сообщение с дрожащими руками. Оно все равно будет отправлено."],"worst":"«Уверенность приходит после» — заголовок сообщает готовый вывод, но не цепляет знакомой ситуацией.","best":"Я не люблю, когда самооценку пытаются лечить аффирмациями у зеркала.","verdict":"publikovat","why":"В удалённом сообщении легко узнать себя. Есть полезный поворот: уверенность появляется не потому, что вам обязательно согласятся, а потому, что вы сможете пережить отказ; это хочется сохранить."},"guard":[{"rule":"rublenye","quote":"Ладно, подстроюсь». Сообщение удалено. Стало легче."},{"rule":"dvoetochiya","quote":"ое появляется, когда у вас уже есть опыт: «Я попробовал. Было страшно. Я справилс | И здесь важно: вам могут отказать. В"}],"cut":["Одним словам трудно поверить, когда собственный опыт говорит другое.","Уверенность растет и из такого опыта."],"before":null}];const KEY='eval-2026-10-01_02-46-10_rilsy';
