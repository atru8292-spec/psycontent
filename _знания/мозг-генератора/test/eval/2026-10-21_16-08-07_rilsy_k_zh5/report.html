<script>
const DATA=[{"id":"k_nabor_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"uznavanie","topic":"виды усталости, от которых отпуск не спасает","text":"Слайд 1: «Тебе надо в отпуск».\nБесит, когда это говорит муж, который даже даты поездки ждет от вас.\n\nОт чего вы устаете, кроме работы.\n\nСлайд 2: «Я устала всем напоминать»\nМуж готов собрать чемодан, если вы скажете, что положить. Даже отдыхая, вы помните за двоих. Иначе зарядку опять придется искать в чужом городе.\n\nСлайд 3: «Я устала успокаивать»\nМама обиделась, что вы уезжаете без нее. Вы уже час объясняете, что любите ее, и обещаете звонить каждый день.\n\nСлайд 4: «Я устала выбирать за всех»\nГостиницу выбираете вы, ресторан тоже. На каждый вопрос муж отвечает: «Мне без разницы». А когда ему шумно или дорого, объяснять свой выбор опять вам.\n\nСлайд 5: «Я устала заслуживать отдых»\nПеред поездкой вы перемываете ВСЕ, доделываете отложенные дела и оставляете полный холодильник. Потому что уехать с грязной, блядь, плитой для вас почти стыдно.\n\nСлайд 6: В отпуске тоже можно целыми днями стараться, чтобы никто вами не был недоволен.\n\nСлайд 7: Отпуск заканчивается, а вы уже злитесь на вопрос: «Ну что, отдохнула?»\nВы надеялись наконец перестать обо всем заботиться. Но близкие поехали вместе с привычкой во всем полагаться на вас.\n\nСлайд 8: Какая забота о других едет с вами в каждый отпуск?","caption":"Иногда дома действительно меньше хлопот, чем в совместной поездке.","judge":null,"guard":[],"cut":["За право отдохнуть приходится еще и утешать."],"before":null},{"id":"k_perevod_1","author":"Юлия","format":"carousel","asked":"carousel","intent":"perevod_repliki","topic":"«у меня низкая самооценка»: как это выглядит в обычном дне","text":"Слайд 1: Почему я все время думаю, что со мной что-то не так?\n\nСлайд 2: «У меня низкая самооценка».\nВ обычном дне это может звучать так: «Наверное, она лучше знает». Даже когда подруга объясняет тебе, почему твой парень тебе подходит.\n\nСлайд 3: «Наверное, я слишком многого хочу».\nПеревод: мне обидно, что он снова отменил встречу, но я уже сомневаюсь, достаточно ли у меня причин расстраиваться.\n\nСлайд 4: «Я, наверное, неправильно поняла».\nПеревод: мама назвала мой выбор глупым, и теперь я ищу, в чем она права. Хотя до разговора мне нравилось мое решение.\n\nСлайд 5: «Да мне все равно, выбирай ты».\nПеревод: я хочу в другое кафе, но боюсь, что подруга сочтет меня капризной. Проще согласиться, чем потом переживать, не испортила ли я встречу.\n\nСлайд 6: Чужое недовольство еще ничего не доказывает про тебя.\n\nСлайд 7: «Почему я себе совсем не доверяю?»\nДаже выбрать кафе становится трудно: вдруг твой выбор кому-то не понравится?\n\nСлайд 8: Сегодня предложи подруге то кафе, куда сама хочешь сходить. Дай ей возможность ответить, прежде чем решишь за нее, что твое предложение ей не понравится.","caption":"Иногда близкие даже не догадываются, сколько всего тебе «все равно».","judge":null,"guard":[],"cut":["Когда ты считаешь чужое мнение убедительнее своего, тебе приходится каждый раз заново доказывать себе, что ты вправе чего-то хотеть."],"before":null},{"id":"k_golos_2","author":"Юлия","format":"carousel","asked":"carousel","intent":"podderzhka","topic":"тревога в три часа ночи","text":"Слайд 1: 4 мысли, за которые ты ругаешь себя в три часа ночи\nКогда после ссоры страшно, что любимый человек тебя разлюбит.\n\nСлайд 2: «Надо было промолчать»\nТы сказала, что тебе обидно, он рассердился, и теперь ты жалеешь, что заговорила. Сохранить близость кажется важнее, чем объяснить, что тебя задело.\n\nСлайд 3: «Он теперь уйдет»\nНочью после ссоры ты уже представляешь расставание.\n\nСлайд 4: «Нужно написать еще одно сообщение»\nТы уже объяснила, почему расстроилась, но дописываешь подробности и убираешь резкие слова. Очень хочется получить ответ, с которым получится дождаться утра.\n\nСлайд 5: После ссоры ты можешь жалеть даже о той просьбе, которая по-прежнему для тебя важна.\n\nСлайд 6: «Я все испортила»\nОбвиняя себя, ты сохраняешь надежду: если подобрать правильные слова, он снова станет нежным. Признать, что его ответ нельзя заранее угадать, бывает страшнее, чем снова искать свою ошибку. Поэтому ночью так легко согласиться, что ты слишком многого хотела, хотя еще днем твоя просьба казалась тебе вполне обычной.\n\nСлайд 7: За тревожную ночь ты успеваешь поругать себя и за ссору, и за сообщения, и за то, что до сих пор переживаешь. Какая мысль после ссоры чаще всего мешает тебе уснуть?","caption":"Что ты чаще всего пытаешься объяснить любимому человеку среди ночи?","judge":null,"guard":[],"cut":["Когда боишься потерять любимого, трудно поверить, что он может злиться на тебя и продолжать тебя любить."],"before":null},{"id":"k_mysl_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"poziciya","topic":"что я поняла про отношения за годы работы психологом","text":"Слайд 1: Я не советую терпеть унижение ради родственных связей.\n\nСлайд 2: «Мама же хочет как лучше»\nПосле разговора с мамой вы отменяете встречу с мужчиной: она опять объяснила, почему с ребенком вы никому всерьез не нужны. Забота получилась дороговата.\n\nСлайд 3: «Она обидится, если я откажусь»\nВы едете к родителям на выходные, хотя уже договорились с подругой. Мамино недовольство кажется достаточной причиной отменить собственные планы. Снова.\n\nСлайд 4: «Мы же семья»\nПоэтому мама считает нормальным при всех обсуждать ваш развод. Меня бесит эта семейная привилегия: близость почему-то дает право говорить то, что посторонним даже объяснять стыдно.\n\nСлайд 5: Родство само по себе не делает обидные слова заботой.\n\nСлайд 6: «Зато она всегда поможет»\nМама действительно забирает внука из садика. И при этом постоянно называет вас плохой матерью.\n\nСлайд 7: «Теперь вообще с родными не разговаривать?»\nБлизкие могут поссориться, наговорить лишнего, потом признать, что обидели, и перестать так делать. Я смотрю именно на это: меняется ли что-нибудь после вашего «мне больно», или вам снова предлагают потерпеть ради семьи.\n\nСлайд 8: Я психолог, работаю в системном семейном подходе. Помогаю женщинам разбираться в отношениях с партнером и родными, когда за собственные решения приходится оправдываться перед всей семьей.","caption":"Какие слова родные чаще всего называют заботой?","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"}],"cut":["Благодарность за помощь может мешать признать, насколько больно слышать такое от мамы."],"before":null},{"id":"k_obzor_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"obyasnenie","topic":"популярные способы успокоиться: что правда помогает, а что только обещает","text":"Слайд 1: 4 способа успокоиться, пока близкий не отвечает\nПочему после некоторых хочется проверять чат еще чаще.\n\nСлайд 2: «Спрошу подругу, все ли нормально»\nВы отправляете ей скриншот переписки. Она уверяет, что никто на вас не обиделся. Становится легче, пока не приходит мысль: вдруг она утешает?\n\nСлайд 3: «Перечитаю, что я написал»\nВы ищете резкость в своем сообщении, вспоминаете вчерашний разговор. Кажется, еще немного подумаете и точно поймете, почему близкий молчит.\n\nСлайд 4: «Поговорю с кем-нибудь»\nВы рассказываете подруге, как тяжело переносите молчание. Она слушает, вы обсуждаете другие дела.\n\nСлайд 5: «Займусь своими делами»\nВы включаете выбранный фильм. Поначалу отвлекаетесь на мысли о переписке, потом замечаете, что следите за сюжетом. Вечер продолжается, хотя близкий пока молчит.\n\nСлайд 6: Облегчение на минуту тоже кажется убедительным результатом.\n\nСлайд 7: «Мне каждый раз нужно подтверждение»\nКогда вы успокаиваетесь только после проверки или чужих заверений, вы привыкаете искать уверенность при каждом сомнении. Поэтому следующую паузу в переписке бывает еще труднее выдержать.\n\nСлайд 8: Что вы обычно делаете, когда близкий долго не отвечает?\nПеречитываете переписку, спрашиваете подругу, занимаетесь делами? Или у вас свой способ?","caption":"Близкие тоже могут уставать от необходимости постоянно подтверждать, что все хорошо.","judge":null,"guard":[],"cut":["Поддержка помогает пережить ожидание, даже когда объяснения по-прежнему нет.","Занимаясь своими делами без ответа, вы постепенно убеждаетесь: ожидание можно пережить."],"before":null},{"id":"k_dialog_2","author":"Михаил","format":"carousel","asked":"carousel","intent":"uznavanie","topic":"разговор с внутренним критиком перед важной встречей","text":"Слайд 1: Перед важной встречей вы готовите оправдания за каждое свое слово.\n\nСлайд 2:\nА: Я знаю, что хочу предложить. Но перед встречей начинаю искать, к чему придерутся.\nБ: И мысленно отвечаете на замечания, которых пока никто не сделал?\n\nСлайд 3:\nА: Да. Открываю свои записи и вижу только недостатки. Здесь очевидно, здесь наверняка спросят то, чего я не знаю.\nБ: Собственную подготовку вы уже перестали замечать.\n\nСлайд 4:\nА: Зато если заранее себя покритиковать, я лучше подготовлюсь.\nБ: Подготовка когда-нибудь заканчивается?\nА: Когда пора подключаться к встрече. Обычно я еще переписываю первую фразу.\n\nСлайд 5: Внутренний критик требует подготовиться даже к чужому недовольству.\n\nСлайд 6:\nА: Мне надо быть уверенным, что я не скажу глупость.\nБ: Вы пытаетесь заранее исключить любую возможность смутиться. Поэтому готового предложения вам мало, нужна еще гарантия, что никто не усмехнется и не переспросит.\n\nСлайд 7:\nА: И на самой встрече я начинаю с того, что идея пока сырая.\nБ: Хотя вчера она казалась вам вполне продуманной?\nА: Да. Хочется самому назвать все недостатки, пока остальные не успели. В итоге половину времени объясняю, почему предложение может не сработать.\n\nСлайд 8: А свое предложение так и не успеваете толком объяснить.","caption":"За что вы заранее ругаете себя перед важной встречей?","judge":null,"guard":[],"cut":[],"before":null},{"id":"k_prod_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"priglashenie","topic":"как проходит работа со мной: первая встреча и что дальше","text":"Слайд 1: «Сначала поймите, чего вы хотите от психолога». С таким требованием легко месяцами откладывать первую встречу.\n\nСлайд 2: Вы соглашаетесь встретиться с подругой, хотя хотели отказаться, потом злитесь на себя. Перечитываете сообщение партнеру, чтобы он точно не обиделся. А психологу боитесь показаться человеком с надуманными проблемами.\n\nСлайд 3: На первую встречу ко мне можно прийти с этим страхом показаться нелепым.\n\nСлайд 4: Я спрошу, что вас беспокоит и как это мешает вам жить. Вместе выберем конкретную ситуацию: например, вы хотели отказать подруге, но согласились, потому что боялись ее обидеть.\n\nСлайд 5: Но каждый такой отказ от собственных планов мешает проверить, действительно ли она рассердится.\n\nСлайд 6: Дальше будем разбирать такие предположения и пробовать действовать иначе. Например, отказывать в небольшой просьбе, замечать реакцию подруги, обсуждать, что получилось и что оказалось трудным. Темп будем выбирать вместе.\n\nСлайд 7: Для записи достаточно написать мне в личные сообщения: «Хочу на первую встречу, переживаю, что не смогу объяснить свой запрос». Подробно рассказывать все в переписке не требуется.\n\nСлайд 8: Я работаю в КПТ. Приглашаю на первую встречу.","caption":"Если страх чужой оценки мешает вам отказывать, просить и выбирать, приглашаю познакомиться, запись через личные сообщения.\n\nМихаил, психолог, работаю в КПТ. Пишу про тревогу и страх того, что о вас подумают.","judge":null,"guard":[],"cut":["Когда вы заранее уверены, что подруга обидится, согласиться кажется безопаснее.","Ко мне можно прийти, если из-за тревоги о чужом мнении вы постоянно уступаете и откладываете свои планы.","Мне важно, чтобы на встрече вы могли говорить и о том, что кажется вам недостаточно серьезным для психолога."],"before":null}];const KEY='eval-2026-10-21_16-08-07_rilsy_k_zh5';
let R={};try{R=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}};
const V={publikovat:'публиковать',popravit:'поправить',v_korzinu:'в корзину'};
const fs=[...new Set(DATA.map(d=>d.format))];const fsel=document.getElementById('f');
fs.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;fsel.appendChild(o)});
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const f=fsel.value,v=document.getElementById('v').value;const m=document.getElementById('m');m.innerHTML='';let n=0;
DATA.forEach(d=>{const j=d.judge||{};if(f&&d.format!==f)return;if(v==='mine'&&R[d.id]&&R[d.id].mark)return;if(v&&v!=='mine'&&j.verdict!==v)return;n++;
const c=document.createElement('div');c.className='card';const r=R[d.id]||{};
c.innerHTML='<div class="meta"><b>'+esc(d.id)+'</b> · '+esc(d.author)+' · '+esc(d.format)+(d.asked!==d.format?' (просили '+esc(d.asked)+')':'')+' · '+esc(d.intent)+'<br>'+esc(d.topic)+'</div>'
+(d.error?'<div class="mk">Ошибка: '+esc(d.error)+'</div>':'')
+(j.verdict?'<div><span class="tag v-'+j.verdict+'">'+V[j.verdict]+'</span><span class="why">'+esc(j.why)+'</span></div>':'')
+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'
+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')
+((d.cut||[]).length?'<div class="cut">Вычеркнула: '+d.cut.map(x=>'<s>'+esc(x)+'</s>').join(' ')+'</div>':'')
+((j.ai_markers||[]).length?'<div class="mk">'+j.ai_markers.map(x=>'«'+esc(x)+'»').join(' ')+'</div>':'')
+(j.worst?'<div class="why">Худшее: '+esc(j.worst)+'</div>':'')
+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')
