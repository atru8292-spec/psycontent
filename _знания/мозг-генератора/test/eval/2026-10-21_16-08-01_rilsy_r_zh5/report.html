<script>
const DATA=[{"id":"r_mif_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: Я плачу, чтобы меня выслушали?\nРечь: Услышал совет: психологу платят за то, чтобы он слушал и кивал, так что лучше поговорить с подругой. Меня задевает, что человеку предлагают заранее согласиться на такую работу: вы рассказываете, психолог кивает, вы снова рассказываете, уже сами спрашиваете себя, как прошла неделя.\n\nСлушать необходимо. Одного кивания недостаточно.\n\nЧто вы вправе ждать за свои деньги? Психолог помогает разобраться, почему вы снова соглашаетесь с мамой, хотя собирались отказать, и пробовать говорить по-другому. Вам должно быть понятно, над чем вы вместе работаете.\n\nНапример, на встрече вы репетируете отказ. Начинаете привычное «Мам, я бы с радостью, но…», останавливаетесь и пробуете еще раз: «В воскресенье я не приеду».","caption":"Иногда на встрече приходится спорить, переспрашивать и говорить, что вам непонятно.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Услышал совет: психологу платят за то, чтобы он слушал | гают заранее согласиться на такую работу: вы рассказываете, пси"}],"cut":[],"before":null},{"id":"r_vopros_1","author":"Ольга","format":"reels_otvet","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Зачем мне психолог, если есть подруги?\nРечь: А зачем мне психолог, если у меня есть подруги? Чтобы у вас было время, когда можно заботиться только о себе. «Теперь и подруге поплакаться нельзя, за все платить надо!» Можно, дружбу пока никто не отменял. Подруги действительно помогают. Только вы тоже их любите, знаете про их трудности и учитываете, сколько они могут сейчас выслушать. С психологом вам не нужно заботиться о нем в ответ. А подруге вы можете сказать: «Да ладно, у меня нормально. Ты лучше расскажи, чем у вас с мужем закончилось», хотя самой все еще хреново.","caption":"Даже с близкими бывает трудно занимать много места в разговоре.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_post_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Текст на экране: Он молчит, ты весь вечер ждешь\nРечь: Четыре признака, что ты уже подстраиваешь свой вечер под парня, который тебе даже не написал.\nТы откладываешь ответ подруге. Она предлагает встретиться, но ты пока не знаешь, вдруг он сегодня захочет увидеться. Он ничего не обещал, вы ни о чем не договаривались, а ты уже оставила для него весь вечер.\nТебе трудно досмотреть даже одну серию. Ты возвращаешься в переписку, проверяешь, прочитал ли он последнее сообщение, потом приходится перематывать, потому что ты пропустила разговор героев. Ты все время пытаешься заметить перемену: может быть, сейчас он появился в сети и наконец напишет.\nК вечеру ты начинаешь злиться на себя. Ну зачем я вчера столько рассказывала, зачем отправила второе сообщение, зачем вообще показала, что он мне понравился. Как же жестоко получается: он молчит, а виноватой у тебя снова оказываешься ты. И уже стыдишься того, что вчера говорила совершенно искренне.\nТы перестаешь замечать, нравится ли тебе самой с ним общаться. Стоит ему написать, и ты так рада, что отвечаешь даже на вопрос, который он задает уже третий раз. Ты помнишь, сколько ждала его сообщения, но почти не замечаешь, что он опять ничего не спросил о том, что ты ему рассказывала. Тебе становится достаточно самого факта: он вспомнил.\nСколько пунктов у тебя совпало?","caption":"В начале знакомства вы еще оба выбираете.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не договаривались, а"},{"rule":"dvoetochiya","quote":"Ты все время пытаешься заметить перемену: может быть, сейчас он появился в сети и | не понравился. Как же жестоко получа"}],"cut":["Когда очень хочется убедиться, что ты ему нравишься, собственные планы начинают казаться помехой: вдруг именно из-за них ты упустишь его приглашение.","Так можно весь вечер просидеть за любимым сериалом и совсем не отдохнуть.","Когда причина его молчания неизвестна, ты перебираешь собственные поступки, будто где-то обязательно найдется ошибка, которую еще можно исправить."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Текст на экране: Коробочка для ваших успехов\nРечь: Коллега сказала, что справилась с задачей, но это не считается: она ведь спросила совета. Меня задело, как легко она вычеркнула собственную работу.\n\nПолучилось быстро, значит, задача легкая, пришлось подумать, значит, долго возилась, помогли разобраться, значит, сама ничего не умеет. Похвалили? Значит, пока еще не раскусили.\n\nПредставьте коробочку с надписью «случайно». Вы складываете туда все, что у вас получилось. Аккуратненько так. А когда страшно, что вас уволят, вспоминаете только ошибки.\n\nВам нужно учиться признавать свой вклад, даже когда вам помогли: совет дал коллега, а задачу после этого закончили вы.\n\nЗа подсказку коллеги диплом обратно никто не забирает.\n\nПодписывайтесь, здесь про тревогу, неловкость и жизнь, когда постоянно думаешь, что о тебе подумают.","caption":"Какой свой рабочий успех вы до сих пор считаете случайностью?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"правилась с задачей, но это не считается: она ведь спросила совета. Меня задело, | авать свой вклад, даже когда вам помо"}],"cut":["Так вы ни за что себе умение не засчитаете.","Конечно, тогда кажется, что вы ничего не умеете: собственные удачи вы заранее убрали из рассмотрения.","Это тоже ваше умение."],"before":null},{"id":"r_car_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Текст на экране: Подруга с депрессией: когда поддержка особенно нужна\nРечь: Четыре признака, что подруге с депрессией нужна поддержка, хотя она об этом не просит.\nОна перестает отвечать на сообщения. Чем дольше молчит, тем неловче возвращаться: уже надо объяснять, куда пропала, извиняться, спрашивать про ваши дела. Напишите, что отвечать сразу необязательно и вы еще свяжетесь.\nДаже небольшую помощь ей трудно организовать. На вопрос «Что тебе привезти?» она отвечает «Ничего»: выбирать, составлять список и договариваться сейчас тоже тяжело. В итоге может остаться без ужина. Лучше предложить конкретно: «Я могу привезти суп к семи, подойдет?»\nВстречи она отменяет заранее. Может бояться, что будет молчать весь вечер, испортит вам настроение, придется изображать бодрость. Предложите короткую прогулку без компании и расспросов.\nИногда она смеется и сама вас утешает. Привычка быть хорошей подругой может сохраняться, даже когда ей совсем плохо. Если решить, что она уже справилась, она снова останется без поддержки. Один веселый разговор ничего не говорит о том, как проходит вся ее неделя.\nПредложите помочь записаться к специалисту и сходить вместе. Совет «соберись» из дружеской программы вычеркиваем.","caption":"Какая поддержка помогала вам, когда даже отвечать было трудно?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Подруга с депрессией: когда поддержка особенно нужна | дольше молчит, тем неловче возвращаться: уже надо объяснять, куда"}],"cut":["Так она может потерять общение, которого ей самой очень не хватает.","И лишается возможности побыть рядом с вами.","Подписывайтесь: здесь про маму, которая все тащит сама, мужа, который «помогает», и злость, за которую потом стыдно."],"before":null},{"id":"r_mif_2","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"Текст на экране: Может, я опять себя накручиваю?\nРечь: «Перестань себя накручивать», говорит подруга, когда ты ждешь ответа насчет встречи. Меня злит, что теперь ты еще и ругаешь себя за тревогу.\n\nОн третий раз оставляет твой вопрос без ответа, и ты начинаешь: почему я такая нервная? Почему мне больше всех надо? Может, я все испорчу своими вопросами?\n\nЧто ты испортишь, если спросишь, увидитесь ли вы в выходные? Ты хочешь договориться о встрече. Тебе предлагают научиться спокойно ждать человека, который ничего не обещает.","caption":"В какой ситуации тебе советовали перестать себя накручивать?","judge":null,"guard":[],"cut":["Подписывайся, здесь про то, почему умные и самостоятельные женщины остаются одни и как перестать выбирать тех, кто не выбирает тебя."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Я опять сегодня не позвонила маме\nРечь: Ко мне часто приходят с виной перед мамой, которой надо звонить каждый день.\n\nИ я замечаю одну вещь: вы можете разговаривать с ней долго, внимательно слушать, помнить, с кем она поссорилась, а на следующий день снова чувствовать себя плохой дочерью. Потому что сегодня вы еще не позвонили. Вчерашний разговор вам уже как будто не засчитывается.\n\nДопустим, вы договорились с мужем посмотреть фильм. Мама пишет: «Ну понятно, мать тебе больше не нужна». Вы ставите фильм на паузу и звоните, хотя вам сейчас совершенно нечего рассказать. Потом злитесь на себя, на маму, иногда еще и на мужа, который спрашивает, скоро ли вы.\n\nПочему так трудно пропустить один вечер? Потому что после маминой обиды вы начинаете сомневаться, хорошая ли вы дочь вообще. И меня злит именно это: вчера вы час слушали маму, сегодня занялись своими делами, и теперь должны объяснять, почему она вам по-прежнему дорога.\n\nВ работе я вижу, как постепенно меняется сама причина звонка. Вы уже набираете маму заранее, чтобы потом весь вечер не мучиться из-за ее упреков. Следите за временем, торопитесь закончить свои дела, раздражаетесь, если разговор затягивается. Мама слышит ваш голос ежедневно, а вы все реже хотите ей звонить.\n\nА что ваша мама говорит, если вы пропустили день?","caption":"Подписывайтесь, если узнаете себя: здесь про маму и злость на близких.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"И я замечаю одну вещь: вы можете разговаривать с ней долго, вн | ись с мужем посмотреть фильм. Мама пишет: «Ну понятно, "}],"cut":["Получается, каждый день надо заново доказывать, что вы ее любите.","И это особенно обидно: вы столько стараетесь сохранить близость, что у вас почти не остается разговоров, которых вы сами ждали."],"before":null},{"id":"r_men_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Все держите в себе, срываетесь на детей\nРечь: Четыре признака того, что вы привыкли держать переживания в себе и дома все чаще срываетесь на детей.\nНа вопрос жены отвечаете только про дела. Забрал, оплатил, договорился. Даже когда день был тяжелым, вы перечисляете, что успели сделать, и пропускаете, как вас задел разговор с начальником. Рассказать об этом кажется жалобой. Жена слышит, что все нормально, и вы остаетесь без поддержки, которая сейчас очень нужна. Причем сами можете считать, что ей ваши дела давно безразличны.\nПосле неприятного разговора вы часами придумываете ответы. На работе промолчали, зато потом знаете каждое слово, которое надо было сказать. Признаться себе, что было обидно, трудно: вроде взрослый мужик, должен справляться. Вы продолжаете спорить с коллегой мысленно, даже когда уже пришли домой. Ребенок рассказывает про свой день, а вы слышите только половину и раздражаетесь, когда он просит послушать.\nПросьбы ребенка кажутся последней каплей. Вы еще толком ничего не обсудили, а уже хочется рявкнуть: да сколько можно от меня хотеть. Ребенок получает резкий ответ и в следующий раз идет с просьбой к маме.\nВас особенно злит, когда жена утешает плачущего ребенка. Он расстроился из-за проигрыша, жена его обнимает, а вам хочется вмешаться: хватит уже реветь. Вы начинаете требовать от него такой же сдержанности и упускаете возможность самому его утешить. Хотя любите его и потом жалеете о своей резкости.\nСколько пунктов узнали у себя?","caption":"Подписывайтесь, если трудно говорить о переживаниях и страшно показаться слабым.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не обсудили, а"},{"rule":"dvoetochiya","quote":"Признаться себе, что было обидно, трудно: вроде взрослый мужик, должен справлятьс | чего не обсудили, а уже хочется рявк"}],"cut":["Когда вы весь день запрещаете себе растеряться, обидеться, попросить помощи, обычную просьбу сына или дочери бывает трудно спокойно выслушать.","Если вы привыкли считать собственные слезы слабостью, вам бывает трудно смотреть, как сын плачет и получает тепло."],"before":null},{"id":"r_vopros_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: Я даже не знаю, что тебе рассказывать\nПерсонажи: А это психолог, Б это клиентка\nА: Ты можешь начать с того, что не знаешь, о чем говорить.\nБ: Но я же сама записалась. Другие приходят с серьезными проблемами, а я буду сидеть и жаловаться на мамины звонки?\nА: А что ты хотела рассказать про звонки?\nБ: Она звонит каждый день, обижается, если я не отвечаю, и я потом весь вечер оправдываюсь. Хотя она волнуется, я понимаю.\nА: Ты уже объясняешь мне, почему мама так делает.\nБ: Ну вдруг ты решишь, что я неблагодарная. Мама хочет поговорить, а я тут деньги плачу, чтобы на нее пожаловаться. Красота.\nА: Ты уже знаешь, что я решу?\nБ: Нет. Но хочется сразу объяснить, что мама у меня хорошая.\nА: И что тогда ты оставляешь за этим объяснением?\nБ: Что иногда я не беру трубку, потому что опять придется выслушивать, как редко я звоню. Вот это я и хотела рассказать.","caption":"Подпишись, если узнаешь себя: здесь про страх остаться одной и отношения.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_money_1","author":"Ольга","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"Текст на экране: Как попросить денежку и не стать плохой\nРечь: Просить прибавку стыдно, и вы берете еще одну чужую задачу, чтобы начальник уж точно заметил, какая вы хорошая.\n\nПросить стыдно, потому что вы все еще ждете звездочку за старание: вот поработаю хорошенько, доделаю за всех, и мне сами дадут денежку.\n\nПросить страшно, и вы надеетесь однажды столько сделать, чтобы начальнику самому стало неловко платить вам столько же.\n\nПросить придется даже после всего сделанного.","caption":"Руководитель может быть вполне доволен тем, сколько задач вы выполняете за нынешнюю зарплату. У него при этом может вообще не возникать мысли, что вы ждете пересмотра условий. Особенно обидно бывает, когда коллеге повышают зарплату после разговора, а вы уже несколько месяцев задерживаетесь и молчите. В такой момент легко решить, что ваши старания ничего не стоят. Хотя вы с коллегой могли одинаково хорошо работать, только о ее ожиданиях начальник уже знал.","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"}],"cut":["Вы можете работать больше всех и все равно бояться, что за просьбу вас сочтут наглой.","Поэтому каждый раз хочется еще немножко постараться, чтобы уж наверняка заслужить."],"before":null},{"id":"r_body_1","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Если перед отпуском тяжело смотреть в зеркало\nРечь: Если ты перед отпуском смотришь в зеркало и думаешь, что с такой внешностью лучше вообще никуда не ехать, это тебе.\n\nТы уже собрала вещи, купила билеты, но вместо радости ругаешь себя за то, как выглядишь. Еще и за то, что переживаешь из-за внешности, когда могла бы радоваться отпуску. Ну что опять со мной?\n\nПочему заранее стыдно за фотографии, которых еще нет? Потому что ты уже представляешь, как будешь их рассматривать и искать, что в себе раскритиковать. Зачем вообще тогда фотографироваться? Хочется хотя бы на отдыхе обойтись без очередного повода себя ненавидеть.\n\nИ вот ты уже думаешь, в чем поедешь на экскурсию, отказываешься от любимого платья, заранее просишь тебя не снимать. До поездки еще неделя, а ты уже устала.\n\nВ такой момент легко решить, что ты капризная и неблагодарная. Отпуск есть, возможность уехать есть, чего тебе еще надо? Но ты ведь ждешь от себя гораздо большего, чем собрать чемодан. Тебе нужно понравиться себе настолько, чтобы наконец перестать проверять, как ты выглядишь, и заняться тем, ради чего едешь.\n\nТы заранее боишься собственного недовольства, потому что знаешь, как долго потом будешь себя ругать.\n\nТребовать от женщины, чтобы она еще и отдых заслужила своей внешностью, уже совсем наглость.","caption":"Хочется вернуться довольной собой, с удачными фотографиями и ощущением, что все получилось. А потом кто-нибудь спрашивает, почему так мало снимков и точно ли хорошо отдохнула. Хотя за кадром вполне мог остаться прекрасный день. Удовольствие от поездки бывает трудно показать другим, особенно когда от тебя ждут красивого отчета.","judge":null,"guard":[],"cut":["Когда каждый выход из номера кажется проверкой, радоваться поездке действительно трудно.","На отпуск иногда возлагают столько надежд, что обычная поездка начинает казаться слишком скромным событием."],"before":null},{"id":"r_teen_1","author":"Михаил","format":"reels_rol","asked":"reels_auto","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Текст на экране: Родительское собрание. Разговор через дверь\nРечь: Сегодня на родительском собрании я научу вас разговорить подростка, который закрылся в комнате. Главное, сразу выясните, почему он вам ничего не рассказывает. Желательно через дверь, чтобы слышали все домашние.\n\nПросит дать ему полчаса? Ну конечно, а вы пока будете волноваться. Объясните подробно, как вам тяжело от его молчания. Пусть сначала вас успокоит, потом уже разбирается, из-за чего сам расстроился.\n\nОтвечает «не знаю»? Прекрасно, значит, можно предложить свои варианты. Двойка, поссорился с другом, опять что-то скрывает. Перебирайте, пока он хоть на что-нибудь не отреагирует. Повысил голос? Вот, разговор уже пошел.\n\nПозже вышел и начал рассказывать, что его больше не зовут гулять? Подождите, так сразу слушать нельзя. Сначала выясните, почему он не мог сказать об этом раньше, когда вы спрашивали. У вас ведь тоже дела, вы уже собирались спать.\n\nИ обязательно напомните: вы же предупреждали насчет этих друзей. Подросток должен понимать, что любой откровенный разговор заканчивается вашей правотой. Тогда в следующий раз он заранее будет знать, чем все закончится.","caption":"Родителям бывает страшно обнаружить, что они больше не знают всего, что происходит у подростка. Особенно если раньше он рассказывал даже то, о чем никто не спрашивал. В такой момент легко принять закрытую дверь за доказательство, что вы стали ему чужими. При этом подросток может долго подбирать слова именно потому, что ваше мнение для него много значит. А родитель за это время успевает решить, что его помощь уже совсем не нужна.","judge":null,"guard":[{"rule":"kancelyarit","quote":"При этом"}],"cut":[],"before":null},{"id":"r_vybor_1","author":"Ольга","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Почему мне опять нужен именно он?\nПерсонажи: А это клиентка, Б это психолог\nА: Мне опять советуют выбирать тех, кто выбирает меня. Спасибо, блин, я бы рада. Но мне нужен тот, кто вечно занят.\nБ: Как вы с ним договариваетесь встретиться?\nА: Предлагаю пятницу, он занят. Предлагаю воскресенье, молчит. Я уже собственные выходные отменяю на случай, если он вдруг сможет.\nБ: Что вам в нем нравится?\nА: Он интересный. Хотя мы в основном обсуждаем, когда он освободится. Офигенное знакомство, конечно.\nБ: Допустим, он сам предложил встретиться. Что вы подумали бы?\nА: Наконец я ему понравилась! Но мы сейчас представим, и что? Меня отпустит?\nБ: Пока посмотрим. Что вы хотели бы узнать о нем на встрече?\nА: Даже не знаю. Я обычно стараюсь понравиться, рассказываю что-нибудь смешное, слежу, чтобы ему было интересно.\nБ: А вам интересно?\nА: Я даже не проверяла. Я все выясняю, достаточно ли я хороша, чтобы он захотел встретиться еще.","caption":"Когда вы в последний раз спрашивали себя, нравится ли вам он?","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_zlost_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"Текст на экране: Я вообще никогда не злюсь\nРечь: Тебе тоже говорили, что в семье всегда надо сглаживать углы?\n\nТут бывают два разных случая. Ты можешь спокойно сказать мужу, что тебя не устраивает, он выслушает, вы договоритесь. Ты редко злишься, потому что тебя слышат.\n\nА можешь молчать, потому что уже знаешь: услышишь «не начинай» и «ты опять все испортила».\n\nВ чем разница? Во втором случае ты боишься, что за любое недовольство муж накажет тебя молчанием. Даже себе признаться, что злишься, становится трудно. Если так происходит постоянно, стоит обратиться за помощью.\n\nМуж снова пригласил гостей, хотя ты просила оставить воскресенье для отдыха. Ты достаешь тарелки, а подруге пишешь, что все хорошо.","caption":"Что тебе обычно говорили в ответ на твое недовольство?","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_humor_1","author":"Ольга","format":"reels_auto","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"","caption":"","judge":null,"guard":[],"error":"OpenAI error 429: {\n    \"error\": {\n        \"message\": \"You have no credits remaining. Add credits to continue using the API at https://platform.openai.com/settings/organization/billing/.\",\n        \"type\": \"insufficient_quota\",\n        \"param\": null,\n        \"code\": \"credit_balance_exhausted\"\n    }\n}\n","cut":[],"before":null},{"id":"r_malysh_1","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"","caption":"","judge":null,"guard":[],"error":"OpenAI error 429: {\n    \"error\": {\n        \"message\": \"You have no credits remaining. Add credits to continue using the API at https://platform.openai.com/settings/organization/billing/.\",\n        \"type\": \"insufficient_quota\",\n        \"param\": null,\n        \"code\": \"credit_balance_exhausted\"\n    }\n}\n","cut":[],"before":null},{"id":"r_malysh_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"","caption":"","judge":null,"guard":[],"error":"OpenAI error 429: {\n    \"error\": {\n        \"message\": \"You have no credits remaining. Add credits to continue using the API at https://platform.openai.com/settings/organization/billing/.\",\n        \"type\": \"insufficient_quota\",\n        \"param\": null,\n        \"code\": \"credit_balance_exhausted\"\n    }\n}\n","cut":[],"before":null},{"id":"r_drug_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Текст на экране: Мне уже не хочется отвечать\nРечь: Вы уже ругаете себя за то, что вам тяжело открыть очередное сообщение от друга, у которого опять все плохо.\n\nКогда у него все хорошо, вы узнаете об этом по фотографиям с людьми, с которыми он почему-то успевает встречаться. Ваше предложение увидеться так и осталось без ответа. Зато теперь он спрашивает, можете ли вы поговорить.\n\nИ вы уже решили, что стали плохим другом? Конечно, ведь хороший друг должен помнить подробности его расставания, угадывать, когда звонить, и собственную жизнь пока придержать до лучших времен.\n\nПредложите как-нибудь революционную вещь: выпить кофе, пока у обоих все нормально. Даже без срочного разбора чужой переписки.\n\nВы тоже хотите рассказывать, смеяться, выбирать, куда пойти в субботу. Хотите, чтобы друг помнил, чего вы ждали, и спросил, получилось ли.\n\nВы пишете: «Меня взяли на ту работу». Через неделю приходит ответ: «Поздравляю. Слушай, мы опять поругались. Можешь набрать?»","caption":"О чем друзья забывают спросить у вас?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Предложите как-нибудь революционную вещь: выпить кофе, пока у обоих все нормально | Вы пишете: «Меня взяли на ту работу»"}],"cut":[],"before":null},{"id":"r_mama_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Текст на экране: Злитесь на ребенка, потом ненавидите себя?\nРечь: Четыре признака, что после злости на ребенка вы начинаете себя наказывать.\nВы стараетесь весь день ему угодить. После того как повысили голос, соглашаетесь на еще один мультик, хотя собирались выключать, и отменяете свои дела ради игры. Вам хочется убедиться, что ребенок по-прежнему к вам тянется, поэтому его обычное недовольство из-за выключенного мультика вы переживаете как подтверждение: вот, испортила с ним отношения.\nОтдых приходится заслуживать заново. Муж собирается погулять с ребенком, но вы решаете пойти вместе: как можно радоваться тишине, если час назад накричали на сына за разбросанные игрушки? Меня злит, что мама в такой момент отказывает себе даже в получасе покоя: ОТДЫХ вычеркивается первым, хотя без передышки ей еще труднее выдержать следующий каприз.\nПодругам вы рассказываете только хорошее. Про новые слова ребенка рассказать можно, про свое желание, чтобы вас хотя бы полчаса никто не трогал, уже стыдно, особенно после утреннего срыва. Постепенно вы перестаете говорить, как вам на самом деле тяжело, и даже в компании близких подруг чувствуете
