<script>
const DATA=[{"id":"k_nabor_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"uznavanie","topic":"виды усталости, от которых отпуск не спасает","text":"Слайд 1: «Да вам просто в отпуск надо».\nУвидела этот совет в комментариях и разозлилась: женщина еще отпуск не выбрала, а ей уже надо организовать всем отдых.\n\nСлайд 2: Устала решать за всех.\nМуж готов забронировать жилье. Только сначала вы выберите город, даты, район, проверьте отзывы и пришлите ссылку. Офигенно вы делегировали.\n\nСлайд 3: Устала обо всем помнить.\nВы уже уехали, но пишете мужу: у дочери завтра занятие, подарок племяннику в шкафу, маме обещали позвонить. Без напоминаний вы ждете, что обязательно что-нибудь забудут.\n\nСлайд 4: Устала заранее мирить всех.\nВыбираете, куда пойти, и сразу прикидываете: мужу будет скучно, дети заноют, мама обидится.\n\nСлайд 5: Устала оправдывать свой отдых.\nПеред поездкой без семьи вы готовите на несколько дней, стираете, оставляете подробные инструкции. Хочется уехать так, чтобы никто потом не сказал: «Бросила нас тут».\n\nСлайд 6: Даже в отпуске вы проверяете семейный чат, потому что боитесь потом услышать: «Ну ты же знала, могла предупредить».\n\nСлайд 7: Устала потом все исправлять.\nПосле прошлой поездки вы разбирались с пропущенными занятиями и неоплаченными счетами. Теперь проще самой проверить заранее. Бл*н, при таком раскладе даже отдых требует дополнительной работы.\n\nСлайд 8: Что вы продолжаете делать за всех даже в отпуске?\nВыбираете, напоминаете, мирите или объясняете, почему вообще решили отдохнуть?","caption":"Когда близкие говорят «мы бы справились», полезно договориться, что именно каждый берет на себя целиком. Например: «На время моей поездки ты следишь за расписанием дочери, договариваешься, кто ее отвезет, и сам пишешь преподавателю, если планы поменяются». В таком разговоре легко обнаружить, что муж согласился только отвозить, а следить за временем и предупреждать об изменениях по привычке продолжаете вы. Лучше выяснить это до отъезда, когда еще можно спокойно обсудить подробности.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не выбрала, а"}],"cut":["До собственных желаний вы опять не добрались.","У вас могли быть разные представления об одной договоренности."],"before":null},{"id":"k_nabor_2","author":"Михаил","format":"carousel","asked":"carousel","intent":"uznavanie","topic":"какие бывают внутренние критики","text":"Слайд 1: Четыре внутренних критика, которых можно узнать по тому, за что вы себя ругаете.\n\nСлайд 2: Недавно прочитал комментарий: «Если перестану себя ругать, вообще ничего делать не буду».\nМеня настораживает, как легко мы соглашаемся жить с постоянными упреками, лишь бы совсем не облениться.\n\nСлайд 3: «Надо было сказать иначе»\nПосле встречи с друзьями вы вспоминаете свою шутку и придумываете, как следовало ответить. Друзья зовут снова, но вы уже решили поменьше говорить.\n\nСлайд 4: «Любой бы с этим справился»\nВы наконец разобрались с семейными счетами, которые откладывали месяц. Теперь ругаете себя за то, что возились так долго.\n\nСлайд 5: «Сначала сделайте все дела»\nВы отказываетесь от прогулки, чтобы прибраться. Потом замечаете грязное зеркало, потом вспоминаете про стирку.\n\nСлайд 6: «Лучше вообще ничего не просите»\nВы хотите попросить партнера провести выходной вдвоем, но заранее называете себя навязчивым. Соглашаетесь на его планы, потом ругаете себя за то, что промолчали.\n\nСлайд 7: Вы можете послушаться внутреннего критика, а потом получить от себя же упрек за то, что послушались.\n\nСлайд 8: Какой упрек вы чаще всего слышите от себя: про разговоры, сделанные дела, отдых или просьбы к близким?","caption":"Когда вы заранее ругаете себя за просьбу, вы можете принять собственную догадку за ответ близкого. Партнер еще ничего не сказал, а вы уже уверены, что просите слишком многого. Здесь полезно разделить две вещи: что он действительно говорил раньше и что вы сейчас предполагаете. Например: «Он сказал, что в субботу занят. Я решил, что ему вообще не хочется проводить со мной время».","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не сказал, а"}],"cut":["Порадоваться опять нечему.","Отдыхать без упреков сегодня снова не получится.","С такой разницей проще понять, что именно стоит обсудить с партнером."],"before":null},{"id":"k_perevod_1","author":"Юлия","format":"carousel","asked":"carousel","intent":"perevod_repliki","topic":"«у меня низкая самооценка»: как это выглядит в обычном дне","text":"Слайд 1: Почему я так быстро решаю, что со мной что-то не так?\n\nСлайд 2: «У меня просто низкая самооценка».\nУслышала это в ролике, и меня смутило слово «просто»: с таким объяснением легко пропустить, как именно ты себя обижаешь каждый день.\n\nСлайд 3: «Наверное, я ей надоела».\nПодруга отказалась встретиться, и ты уже стесняешься написать снова.\n\nСлайд 4: «Я слишком многого хочу».\nТы попросила парня провести выходной вместе, он недоволен. И ты уже пересматриваешь свою просьбу: вдруг с тобой действительно слишком сложно?\n\nСлайд 5: «Мне ничего нельзя сказать».\nМама раскритиковала твои планы, ты расстроилась. Потом еще и ругаешь себя за обиду, потому что мама сказала, что только хотела помочь.\n\nСлайд 6: «Я какая-то эгоистка».\nТы отказалась помочь подруге с переездом, потому что у тебя свои планы. Подруга расстроилась, и теперь ты собираешься отменить все свое.\n\nСлайд 7: Ты можешь вполне нравиться себе до первого чужого недовольства, а потом одного отказа хватает, чтобы усомниться во всем хорошем, что ты о себе знала.\n\nСлайд 8: Сегодня сохрани свои планы, если уже отказалась помогать подруге с переездом. Дождись, когда вы снова пообщаетесь: у тебя появится возможность узнать, что происходит с дружбой после твоего отказа.","caption":"Когда ты сразу предлагаешь все исправить, подруга может даже не узнать, чего тебе стоило согласие. Она слышит твое «ладно, приеду» и рассчитывает на помощь. Позже ты злишься, что она опять попросила слишком много, хотя своих сомнений ты ей так и не сказала.","judge":null,"guard":[],"cut":["Иногда эта мысль означает: мне трудно поверить, что меня хотят видеть, когда мне отказывают.","Отношения становятся запутаннее, когда ты соглашаешься из страха, что тебя сочтут плохой подругой.","При этом подруга вполне может расстроиться из-за отказа и продолжать дорожить тобой."],"before":null},{"id":"k_perevod_2","author":"Ольга","format":"carousel","asked":"carousel","intent":"obyasnenie","topic":"границы, созависимость, выгорание: как эти слова выглядят дома и на работе","text":"Слайд 1: Я закрыла рилс, где обещали научить отказывать так, чтобы никто не обиделся.\n\nСлайд 2: Вы читаете про границы, созависимость и выгорание, а потом полчаса сочиняете маме сообщение, что в воскресенье не приедете.\nГлавное, чтобы она поняла и согласилась.\n\nСлайд 3: Вы говорите, что учитесь отказывать на работе.\nКоллега просит доделать за нее отчет, и вы перечисляете свои задачи. Может, она сама увидит, что вам некогда, и заберет просьбу обратно.\n\nСлайд 4: Вы просите домашних дать вам час тишины.\nНа онлайн-сессиях я слышу «Синий трактор», пока мамы прячутся в ванной, чтобы поговорить без детей.\n\nСлайд 5: Вы уже отказали, но все еще ждете, когда вам разрешат.\n\nСлайд 6: Мама отвечает: «Ну понятно, у тебя своя жизнь». Коллега вздыхает: «Ладно, сама как-нибудь».\nИ вы уже готовы приехать и доделать, потому что чужое недовольство для вас означает: вы поступили плохо, надо исправлять.\n\nСлайд 7: Меня бесит обещание подобрать такие слова, после которых все будут довольны, бл*н.\nВы можете объяснить свой отказ очень бережно. Мама все равно рассчитывала на ваш приезд, коллега хотела уйти пораньше. Теперь им придется менять планы, и они могут злиться.\n\nСлайд 8: Иногда мама понимает ваш отказ и все равно обижается.","caption":"После чьего недовольного ответа вам труднее всего оставить свой отказ в силе?","judge":null,"guard":[],"cut":["Даже этот час приходится устраивать так, чтобы никому не помешать."],"before":null},{"id":"k_golos_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"uznavanie","topic":"что думает человек, который всем отвечает «все нормально»","text":"Слайд 1: Вы отвечаете «все нормально» и заранее придумываете, как оправдать свою обиду.\n\nСлайд 2: «Да ничего не случилось».\nПартнер отменил ваши планы, потому что договорился встретиться с друзьями. Вы уже представили, как он спросит, почему из этого надо делать проблему.\n\nСлайд 3: «Я понимаю, ты устал».\nВы тоже устали, но весь вечер занимались домашними делами. Прежде чем попросить помочь, вы пытаетесь решить, достаточно ли вам тяжело для такой просьбы.\n\nСлайд 4: «Я совсем не обижаюсь».\nОн забыл про вашу договоренность. Вы молчите, потому что боитесь услышать, что вам вечно мало внимания, и снова начать перечислять все хорошее, что он делает.\n\nСлайд 5: Я вижу из окна, как тревожные клиенты приезжают заранее и минут двадцать сидят в машине перед сессией.\n\nСлайд 6: «Я просто не хочу ссориться».\nМеня настораживает, когда ссорой вы называете уже саму попытку сказать партнеру, что вам обидно. До его ответа вы уже считаете себя виноватым.\n\nСлайд 7: «Наверное, я сам себя накрутил».\nВы откладываете разговор, пока не сможете доказать, что обиделись обоснованно. Перебираете сообщения, вспоминаете точные слова, а партнер тем временем уверен, что вы обо всем договорились.\n\nСлайд 8: Он так и не узнает, почему вы весь вечер молчали.","caption":"Что вы чаще всего оставляете невысказанным, когда отвечаете «все нормально»?","judge":null,"guard":[],"cut":["Даже когда разговор уже назначен, начать его бывает трудно."],"before":null},{"id":"k_golos_2","author":"Юлия","format":"carousel","asked":"carousel","intent":"podderzhka","topic":"тревога в три часа ночи","text":"Слайд 1: 4 мысли в три часа ночи, за которые ты зря себя ругаешь\nКогда после ссоры никак не получается успокоиться.\n\nСлайд 2: У меня в кабинете по использованным салфеткам иногда оценивают, хорошо ли поработали.\nМне грустно слышать такую оценку: даже поплакав, нужно еще доказать себе, что стало лучше.\n\nСлайд 3: «Я опять себя накрутила».\nТы вспоминаешь, как он сказал: «Мне надоели твои претензии», и пытаешься понять, собирается ли он уходить.\n\nСлайд 4: «Надо было промолчать».\nТы попросила проводить выходные вместе, вы поссорились, и теперь собственная просьба кажется ошибкой. До разговора тебе хотя бы не приходилось бояться расставания.\n\nСлайд 5: «Может, написать, что я погорячилась?»\nТы уже набираешь извинение, хотя по-прежнему обижена. Очень хочется получить привычное «спокойной ночи» и убедиться, что он все еще с тобой.\n\nСлайд 6: «Я же уже разбиралась со своей тревогой».\nТеперь ты ругаешь себя еще и за то, что снова лежишь без сна. Как будто после всей работы над собой тебе положено спокойно переносить любую ссору.\n\nСлайд 7: В три часа ночи тебе может казаться, что ты согласна на прежние обиды, лишь бы он снова разговаривал с тобой тепло.\n\nСлайд 8: За какую ночную мысль ты чаще всего себя ругаешь?","caption":"Случалось тебе ночью извиняться только ради того, чтобы снова получить теплый ответ?","judge":null,"guard":[],"cut":["Ты испугалась за ваши отношения."],"before":null},{"id":"k_mysl_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"poziciya","topic":"что я поняла про отношения за годы работы психологом","text":"Слайд 1: Почему я опять звоню маме, если после разговора с ней мне так хрен*во?\n\nСлайд 2: «Зато мама довольна».\nСегодня увидела комментарий: «Я звоню, чтобы мама не обижалась». Меня бесит, как легко здесь пропускают подробность: что происходит с дочерью после звонка?\n\nСлайд 3: «Я уже привыкла».\nЗа годы работы я замечаю: женщины подробно объясняют, почему мама расстроится, и вскользь добавляют, что сами потом несколько дней приходят в себя.\n\nСлайд 4: «Мы же просто поговорили».\nМама опять спросила, когда вы займетесь ребенком, раскритиковала мужа, напомнила, что вы редко приезжаете. Вы закончили звонок и теперь срываетесь на домашних.\n\nСлайд 5: «Зато я хорошая дочь».\nЕсли ради этого звания вам каждый раз приходится терпеть унижение, вы слишком дорого за него платите.\n\nСлайд 6: Мама может искренне желать вам добра, и вам все равно может быть плохо от того, как она с вами разговаривает.\n\nСлайд 7: «Что сказать сегодня?»\nЕсли мама снова начинает критиковать вашего мужа: «Мама, я заканчиваю разговор. Обсуждать, какой у меня ужасный муж, я больше не буду». И закончите звонок, даже если мама обидится.\n\nСлайд 8: Я семейный психолог, работаю с женщинами 25-40 лет в системном семейном подходе. Ко мне приходят, когда трудно общаться с родными и потом стыдно за свою злость.","caption":"Подписывайтесь, если узнали себя: здесь про отношения с родными и злость, за которую потом стыдно.","judge":null,"guard":[],"cut":[],"before":null},{"id":"k_mysl_2","author":"Юлия","format":"carousel","asked":"carousel","intent":"podderzhka","topic":"слова для той, кто устала быть сильной","text":"Слайд 1: Тебя хвалят за силу и снова оставляют разбираться со всем самой.\n\nСлайд 2: Сегодня увидела комментарий: «Зато ты сильная, со всем справишься». Меня задевает это «зато», когда женщине, которая просит поддержки, снова объясняют, сколько она может вынести.\n\nСлайд 3: «Ты лучше знаешь, что купить».\nТы знаешь, потому что каждый раз проверяешь, что закончилось, составляешь список и отвечаешь на звонки из магазина.\n\nСлайд 4: «Ты только скажи, чем помочь».\nТы уже говорила, что устала. Теперь тебе еще нужно придумать ему дело, объяснить подробности и напомнить, когда пора начинать.\n\nСлайд 5: «Ну ты же всегда справлялась».\nТы справлялась и тогда, когда плакала от усталости. Просто к его возвращению ты уже успевала успокоиться и закончить дела.\n\nСлайд 6: Ты устала быть той, у кого первой заканчивается терпение и которая первой начинает что-то делать.\n\nСлайд 7: «Ты стала какая-то злая».\nТы и сама себя за это ругаешь. Тебя злит, что он спокойно ждет твоей просьбы, пока ты каждый день замечаешь, что нужно вам обоим.\n\nСлайд 8: Ты хотела, чтобы он заметил твою усталость и включился без очередных напоминаний.","caption":"Подписывайся, если узнаешь себя: здесь говорим о том, почему в отношениях ты снова остаешься со всем одна.","judge":null,"guard":[],"cut":["Сегодня хотя бы не требуй от себя еще и благодарности за похвалу твоей силе."],"before":null},{"id":"k_obzor_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"obyasnenie","topic":"популярные способы успокоиться: что правда помогает, а что только обещает","text":"Слайд 1: «Перечитайте переписку, и сразу успокоитесь». Меня в таком совете смущает обещание: тревожные люди часто уже перечитали ее несколько раз.\n\nСлайд 2: «Я проверю, нормально ли написал».\nВы снова читаете свое сообщение другу, ищете грубость в слове «ладно». После проверки становится легче, но вскоре хочется проверить еще раз.\n\nСлайд 3: «Я спрошу, как это выглядит».\nПодруга говорит, что вы никого не обидели. Вы успокаиваетесь, потом вспоминаете пропущенную подробность и отправляете ей еще один скриншот.\n\nСлайд 4: «Я буду думать только хорошее».\nВы убеждаете себя, что друг точно доволен общением. Но он пока молчит, и вам приходится снова придумывать доказательства, что все хорошо.\n\nСлайд 5: Если вы каждый раз успокаиваетесь только после проверки, вы можете все сильнее нуждаться в следующей проверке.\n\nСлайд 6: «Я пока не знаю, почему он молчит».\nТакая мысль может помочь: вам больше не нужно срочно выбирать между «он занят» и «я ему надоел». Ответа действительно пока нет.\n\nСлайд 7: «Я займусь тем, что собирался».\nВы идете гулять, хотя еще переживаете из-за сообщения. Если ждать полного спокойствия, можно весь вечер просидеть над перепиской.\n\nСлайд 8: Сегодня после обычного сообщения другу закройте переписку и вернитесь к одному запланированному делу, даже если еще хочется проверить.","caption":"Подписывайтесь, если узнаете себя: здесь разбираем тревогу, неловкость и привычку постоянно думать, что о вас подумают.","judge":null,"guard":[],"cut":["Это помогает продолжать свой день."],"before":null},{"id":"k_obzor_2","author":"Ольга","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"фильмы про отношения с мамой, которые стоит посмотреть взрослой дочери","text":"Слайд 1: 4 фильма про отношения с мамой, в которых взрослая дочь узнает себя\nИ сможет показать близким то, что трудно объяснить.\n\nСлайд 2: Увидела под отрывком из «Леди Берд»: «Зачем она так разговаривает с матерью?»\nБл*н, меня бесит, как быстро за грубостью дочери перестают замечать, из-за чего ей больно.\n\nСлайд 3: «Леди Берд»: дочь спорит, но продолжает спрашивать мамино мнение\nОни ругаются даже при выборе платья. Меня цепляет, как сильно дочери все еще нужно понравиться маме, от которой она хочет уехать.\n\nСлайд 4: «Я краснею»: дочь скрывает то, что ей нравится\nМэй хочет на концерт и боится разочаровать маму.\n\nСлайд 5: Иногда дочери проще соврать маме о своих планах, чем выдержать ее разочарование и потом весь вечер доказывать, что она по-прежнему ее любит.\n\nСлайд 6: «Храбрая сердцем»: дочь спорит о том, как ей жить\nМерида отказывается от замужества, которое устраивает мама. Особенно люблю здесь то, что обеим приходится узнавать друг друга заново, хотя они давно живут рядом.\n\nСлайд 7: «Все везде и сразу»: дочь снова приводит свою девушку к семье\nДжой продолжает надеяться, что мама признает их отношения.\n\nСлайд 8: Какой фильм вы бы посмотрели вместе с мамой?","caption":"После фильма можно спросить: «В какой сцене тебе больше всего хотелось, чтобы они наконец услышали друг друга?»","judge":null,"guard":[],"cut":["Посмотрите, сколько приходится прятать дочери, когда мама уверена, что знает о ней все.","Больно смотреть, как много попыток дочь делает, прежде чем отдалиться."],"before":null},{"id":"k_dialog_1","author":"Юлия","format":"carousel","asked":"carousel","intent":"kak_v_terapii","topic":"первая сессия глазами клиентки","text":"Слайд 1: «Я записалась к психологу и теперь репетирую, что скажу». Меня беспокоит, сколько требований к себе можно принести уже на первую встречу.\n\nСлайд 2: «Надо рассказать все по порядку».\nТы заранее решаешь, с чего начать: сколько вы вместе, когда он стал реже звонить, почему ты продолжаешь ждать. Начать можно с того, что сегодня особенно трудно.\n\nСлайд 3: «Вдруг моя проблема покажется глупой».\nТы собираешься рассказать, как ждешь его сообщения, и тут же добавляешь, что другим гораздо тяжелее. Я могу спросить, какого ответа ты сейчас ждешь от меня.\n\nСлайд 4: «Надо отвечать, когда меня спрашивают».\nТы можешь согласиться с моим предположением, хотя я поняла тебя неправильно. Мне важно услышать, где я ошиблась, даже если тебе трудно меня поправить.\n\nСлайд 5: «Если я заплакала, значит, встреча прошла хорошо».\nУ меня в кабинете стоит коробка салфеток, и клиенты иногда оценивают встречу по тому, сколько взяли. Меня настораживает, когда ты начинаешь требовать от себя еще и слез.\n\nСлайд 6: На первой встрече мы можем говорить о том, как ты стараешься понравиться мне прямо сейчас.\n\nСлайд 7: «Я сейчас пытаюсь понять, что вы хотите услышать, и поэтому мне трудно рассказать, как все было».\n\nСлайд 8: Я работаю в психоанализе с теми, кто впервые собирается к психологу. Записаться ко мне можно по ссылке в шапке профиля.","caption":"Если ты уже несколько раз составляла рассказ для психолога и каждый раз решала, что звучит как ерунда, с этого тоже можно начать нашу встречу. На первой встрече я буду слушать, задавать вопросы, и ты тоже сможешь спросить, как мы будем работать. Записаться ко мне можно по ссылке в шапке профиля.\n\nЯ Юлия, работаю в психоанализе и принимаю тех, кто идет к психологу впервые.","judge":null,"guard":[],"cut":["Эту фразу можно сказать психологу, даже если вы только познакомились.","Мне важно услышать и то, с чем ты пришла, и то, о чем тебе трудно говорить со мной.","Если я чего-то не пойму, мы сможем к этому вернуться."],"before":null},{"id":"k_dialog_2","author":"Михаил","format":"carousel","asked":"carousel","intent":"uznavanie","topic":"разговор с внутренним критиком перед важной встречей","text":"Слайд 1: Я насторожился, услышав: «Без самокритики я встречу провалю».\nКак вы ругаете себя, пытаясь подготовиться.\n\nСлайд 2:\nА: Там будут люди опытнее меня. Я открою рот, и все поймут, что меня зря позвали.\nБ: О чем вас попросили рассказать на встрече?\n\nСлайд 3:\nА: О своей работе. Но вдруг спросят то, чего я не знаю?\nБ: Что вы себе скажете, если придется ответить «я уточню»?\nА: Что нормальный специалист должен был подготовиться лучше.\n\nСлайд 4:\nА: Я уже несколько раз переписал, как представлюсь. Все звучит глупо.\nБ: А примеры своей работы успели подобрать?\nА: Нет, я пока пытаюсь придумать, как сразу произвести хорошее впечатление.\n\nСлайд 5: Вы репетируете оправдания перед людьми, которые пока ничего вам не сказали.\n\nСлайд 6:\nА: Если я перестану себя подгонять, то вообще расслаблюсь и опозорюсь.\nБ: Сколько времени вы сегодня потратили на подготовку?\nА: Трудно сказать. Я все время думал, что недостаточно хорош для этой встречи.\n\nСлайд 7: Перед сегодняшней встречей попробуйте сказать себе: «Сейчас я подберу один пример своей работы, который поможет ответить на вопросы».\nТребование стать достаточно хорошим выполнить гораздо труднее.\n\nСлайд 8: Какую фразу вы чаще всего говорите себе перед важной встречей?","caption":"После встречи критик часто вспоминает одну запинку и пропускает все вопросы, на которые вы спокойно ответили.","judge":null,"guard":[],"cut":["Когда вы называете конкретное действие, вам проще начать готовиться."],"before":null},{"id":"k_prod_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"priglashenie","topic":"как проходит работа со мной: первая встреча и что дальше","text":"Слайд 1: А если я и перед психологом буду стараться выглядеть нормально?\n\nСлайд 2: Недавно увидел вопрос: как рассказать психологу о своих трудностях, если сразу хочется добавить, что вообще вы справляетесь?\n\nСлайд 3: Вы переписываете сообщение подруге, чтобы она точно не обиделась. Соглашаетесь приехать к родным, хотя собирались отдохнуть. Потом злитесь на себя и заранее придумываете, как объясните свой отказ в следующий раз.\n\nСлайд 4: Когда вы все время думаете, что о вас подумают, перед психологом тоже хочется выглядеть спокойным и рассудительным.\nИ тогда вы рассказываете только то, за что точно не будет стыдно.\n\nСлайд 5: На первой встрече я предложу разобрать одну такую ситуацию: что произошло, чего вы испугались, что сделали потом. Спрошу, что вам хотелось бы изменить, и расскажу, как мы можем работать.\n\nСлайд 6: Дальше будем разбирать, как ваши предположения о чужой реакции влияют на ваши поступки. Например, почему вы соглашаетесь помочь еще до того, как поняли, есть ли у вас время.\n\nСлайд 7: Если вы узнали себя, приглашаю вас на первую встречу.\nНапишите мне в личные сообщения, чтобы договориться о времени. Заранее готовить связный рассказ о себе не требуется.\n\nСлайд 8: Можно начать с того самого сообщения, которое вы несколько раз переписали.","caption":"Если перед первой встречей вы уже думаете, как рассказать о себе и не показаться капризным, требовательным или неблагодарным, приглашаю вас ко мне. Об этой тревоге тоже можно сказать прямо во время разговора. На первой встрече мы разберем ситуацию, в которой вам трудно, и обсудим, что вы хотите изменить. Я объясню, как предлагаю работать дальше, а вы сможете задать вопросы. Для записи напишите мне в личные сообщения.\n\nЯ Михаил, работаю в КПТ, пишу про тревогу и страх чужой оценки.","judge":null,"guard":[],"cut":["Мне понятна эта неловкость: даже здесь страшно показаться слабым."],"before":null},{"id":"k_prod_2","author":"Ольга","format":"carousel","asked":"carousel","intent":"priglashenie","topic":"кому подойдет консультация для пар и как к ней прийти","text":"Слайд 1: Вы можете годами мириться и так ни разу не договориться.\n\nСлайд 2: Увидела под постом про домашние дела: «Мы уже сто раз это обсуждали».\nМеня бесит, как легко паре предлагают обсудить все в сто первый раз, будто раньше они просто хреново старались.\n\nСлайд 3:\nА: Я попросила мужа собрать ребенка, потом напомнила про сменку, потом сама проверила рюкзак. Он говорит, что я вечно недовольна.\nБ: Вы хотели хоть раз выйти из дома, проверив только свою сумку.\n\nСлайд 4:\nА: Он говорит: «Скажи, что сделать». Я начинаю объяснять и уже злюсь.\nБ: Потому что вам опять нужно помнить за двоих, распределять дела и проверять, закончил ли он.\n\nСлайд 5:\nА: Потом я ору, он перестает со мной разговаривать, и я еще извиняюсь.\nБ: Вы можете искренне помириться вечером и утром снова поссориться из-за того, кто собирает ребенка.\n\nСлайд 6: К парному психологу можно прийти с этим вашим «ОПЯТЬ начинается».\nНа первой встрече я попрошу обоих рассказать про одну обычную ссору: кто что сказал, как другой ответил, в какой момент вы перестали друг друга слышать.\n\nСлайд 7: Если вы узнаете свои утра, сборы и вечерние примирения, приходите ко мне вдвоем.\nДля записи напишите в директ слово «разбор».\n\nСлайд 8: Вы ведь уже устали каждый раз ссориться об одном.","caption":"Если перед общей поездкой вы заранее ждете ссоры из-за сборов, с этим можно прийти на консультацию для пары. На первой встрече я выслушаю вас обоих и помогу разобрать, как вы снова доходите до знакомой ссоры. Напишите в директ слово «разбор», чтобы записаться ко мне.\n\nЯ Ольга, работаю с парами в системной семейной терапии.","judge":null,"guard":[{"rule":"schet_vsluh","quote":"сто раз"}],"cut":["Вам обоим будет место в разговоре, даже если сейчас каждый уверен, что другой все пересказывает неправильно."],"before":null}];const KEY='eval-2026-10-21_15-23-00_rilsy_k_zh4';

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const f=fsel.value,v=document.getElementById('v').value;const m=document.getElementById('m');m.innerHTML='';let n=0;
DATA.forEach(d=>{const j=d.judge||{};if(f&&d.format!==f)return;if(v==='mine'&&R[d.id]&&R[d.id].mark)return;if(v&&v!=='mine'&&j.verdict!==v)return;n++;
const c=document.createElement('div');c.className='card';const r=R[d.id]||{};
c.innerHTML='<div class="meta"><b>'+esc(d.id)+'</b> · '+esc(d.author)+' · '+esc(d.format)+(d.asked!==d.format?' (просили '+esc(d.asked)+')':'')+' · '+esc(d.intent)+'<br>'+esc(d.topic)+'</div>'
+(d.error?'<div class="mk">Ошибка: '+esc(d.error)+'</div>':'')
+(j.verdict?'<div><span class="tag v-'+j.verdict+'">'+V[j.verdict]+'</span><span class="why">'+esc(j.why)+'</span></div>':'')
+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'
+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')
+((d.cut||[]).length?'<div class="cut">Вычеркнула: '+d.cut.map(x=>'<s>'+esc(x)+'</s>').join(' ')+'</div>':'')
+((j.ai_markers||[]).length?'<div class="mk">'+j.ai_markers.map(x=>'«'+esc(x)+'»').join(' ')+'</div>':'')
+(j.worst?'<div class="why">Худшее: '+esc(j.worst)+'</div>':'')
+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')
+'<div class="rate"><button data-m="ok" class="'+(r.mark==='ok'?'on':'')+'">Живо</button><button data-m="bad" class="'+(r.mark==='bad'?'on':'')+'">Не живо</button><input placeholder="что не так" value="'+esc(r.note||'')+'"></div>';
c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
c.querySelector('input').onchange=e=>{R[d.id]={...(R[d.id]||{}),note:e.target.value};save()};
m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
fsel.onchange=render;document.getElementById('v').onchange=render;
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,ratings:R},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ocenki-2026-10-21_15-23-00_rilsy_k_zh4.json';a.click()};
render();
</script></body></html>
