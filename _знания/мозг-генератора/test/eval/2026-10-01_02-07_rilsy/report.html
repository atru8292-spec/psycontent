<script>
const DATA=[{"id":"tema_1","author":"Ольга","format":"post","asked":"post","intent":"uznavanie","topic":"я достигаторша и перфекционистка, выгораю, но остановиться не могу","text":"Вы сделали семь дел из восьми и легли спать с ощущением, что опять нихрена не успели.\n\nВроде мелочь, да? Один пункт остался. Но вы уже лежите под одеялом и считаете, во сколько завтра встать, чтобы его закрыть. Желательно до работы. Чтобы дальше идти по плану.\n\nСемь готовых дел? Ну это само собой. А вот восьмое, сука, почему висит?\n\nИногда за этим стоит привычка засчитывать себе сделанное только тогда, когда закончено ВСЕ. Пока хоть что-то осталось, вы чувствуете себя человеком, который недоработал. И отдыхаете с этим ощущением. Если вообще удается.\n\nОтправили отчет, вспомнили про непрочитанное сообщение. Ответили на сообщение, заметили посуду. Уже засыпаете, и тут мысль: «Я же английским сегодня так и не позанималась».\n\nУстали вы вполне по-настоящему. Только внутри усталость ничего не доказывает.\n\nИ вы продолжаете, потому что очень хочется наконец лечь спокойно. Без претензий к себе.\n\nПроблема в том, что список пополняется быстрее, чем вы его закрываете. Спокойно лечь снова придется завтра.\n\nА семь сделанных дел вам когда-нибудь засчитают?","caption":"","judge":{"zhivo":4,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":null,"ai_markers":["Только внутри усталость ничего не доказывает.","Спокойно лечь снова придется завтра.","А семь сделанных дел вам когда-нибудь засчитают?"],"worst":"Спокойно лечь снова придется завтра. — По-русски звучит криво: придется откладывать отдых или завтра наконец получится отдохнуть?","best":"А вот восьмое, сука, почему висит?","verdict":"popravit","why":"Начало цепляет, бытовая цепочка узнаваема, мат звучит органично. Но объяснение довольно знакомое; поправить туманную фразу про усталость и концовку, где вдруг появляется кто-то, кто должен засчитать дела вместо самой женщины."},"guard":[{"rule":"vvodnye","quote":"по-настоящему"}],"cut":["Там все еще висит один пункт, из-за которого вам кажется, что сегодня вы сделали недостаточно."],"before":null}];const KEY='eval-2026-10-01_02-07_rilsy';

fs.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;fsel.appendChild(o)});
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const f=fsel.value,v=document.getElementById('v').value;const m=document.getElementById('m');m.innerHTML='';let n=0;
DATA.forEach(d=>{const j=d.judge||{};if(f&&d.format!==f)return;if(v==='mine'&&R[d.id]&&R[d.id].mark)return;if(v&&v!=='mine'&&j.verdict!==v)return;n++;
const c=document.createElement('div');c.className='card';const r=R[d.id]||{};
c.innerHTML='<div class="meta"><b>'+esc(d.id)+'</b> · '+esc(d.author)+' · '+esc(d.format)+(d.asked!==d.format?' (просили '+esc(d.asked)+')':'')+' · '+esc(d.intent)+'<br>'+esc(d.topic)+'</div>'

+(j.verdict?'<div><span class="tag v-'+j.verdict+'">'+V[j.verdict]+'</span><span class="why">'+esc(j.why)+'</span></div>':'')
+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')

+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')

m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}

render();
</script></body></html>
