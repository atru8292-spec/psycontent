<script>
const DATA=[{"id":"r_post_1","author":"Юлия","format":"post","asked":"post","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Ты открываешь переписку с ним, хотя точно знаешь, что новых сообщений нет.\n\nТелефон со звуком, ты бы услышала. Но все равно проверяешь. Вдруг пропустила. Вдруг он прямо сейчас печатает.\n\nИ ведь ты сама могла бы написать. Уже придумала что, даже набрала, потом стерла. Потому что тогда останется вопрос, написал бы он вообще, если бы ты его не трогала?\n\nТы ждешь подтверждения, что он сам про тебя вспомнил. Захотел поговорить. Что ты ему нужна без напоминания о себе.\n\nИ начинается. Смотришь, когда он был в сети. Заходишь в его сторис и злишься, что на это время есть. Решила заняться своими делами, но фильм идет, а ты уже третий раз берешь телефон.\n\nА потом он пишет, и ты сразу оживаешь. Хотя пять минут назад собиралась больше ему никогда не отвечать. Ну как же, теперь можно спокойно поужинать, ты ему все еще нравишься.\n\nМеня здесь злит, как быстро целый вечер превращается в ожидание чужого решения. Ты уже даже не спрашиваешь себя, хочется ли тебе с ним общаться. Тебе нужно, чтобы он выбрал тебя.\n\nНо одного сообщения хватает до следующего вечера.\n\nЕсли тебе хочется написать, напиши. И учитывай, как он общается с тобой в целом, предлагает ли увидеться, интересуется ли твоей жизнью. Если разговор каждый раз начинаешь и поддерживаешь только ты, это тоже важно, даже когда он мило отвечает.","caption":"","judge":null,"guard":[],"cut":["Вот это я бы и предложила заметить.","Потому что вопрос остался тот же, нужна ли ты ему, когда сама ничего для этого не делаешь."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"На работе хвалят, а вам страшнее\n\nВам говорят, что вы хорошо справились, и тут же становится тревожно. Теперь от вас будут ждать такого же результата. А вы до сих пор думаете, что в прошлый раз просто повезло.\n\nЯ бы здесь посмотрел, как именно вы добиваетесь хорошего результата. Потому что бесконечные проверки могут поддерживать страх, что вас однажды раскусят.\n\nЕсли перед отправкой вы десять раз проверили документ и все прошло хорошо, появляется мысль, что именно десятая проверка вас и спасла. В следующий раз отправить после второй уже страшно.\n\nДопустим, вы подготовили отчет. Все сходится, вы проверили расчеты, можно отправлять. Но еще раз перечитываете выводы. Потом смотрите, как такие отчеты оформляют коллеги. Меняете пару слов и возвращаете обратно. Уже вечер, а вы все еще сидите над готовым файлом.\n\nНачальник доволен. А вы думаете: «Еще бы, я весь вечер провозился. Нормальный человек сделал бы за час».\n\nВот это обидно.\n\nПохвала в такой ситуации мало помогает. Вы уверены, что справились только благодаря лишним часам и проверкам. И продолжаете считать, что без них сразу станет видно, как мало вы умеете. Хотя вы пока даже не знаете, что получится без десятого перечитывания.\n\nЯ бы начал с обычного рабочего письма, где цена ошибки невелика. Проверить смысл, адресата и вложение, затем отправить, даже если хочется снова открыть и перечитать.\n\nТревога после отправки еще может остаться. Само по себе это чувство не означает, что в письме ошибка. Чтобы понять, сколько проверок вам действительно нужно, придется отправить хотя бы одно письмо без привычных десяти перечитываний.","caption":"","judge":null,"guard":[],"cut":["У мозга есть привычка запоминать, что помогло избежать неприятностей.","Вы сделали работу, получили хороший отзыв и даже тут нашли повод усомниться в себе."],"before":null},{"id":"r_car_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Слайд 1: Подруга не знает, чем ей помочь\n\nСлайд 2: Вы спрашиваете подругу с депрессией, что для нее сделать, и она снова отвечает, что не знает. Вы готовы помочь. Но ей сейчас трудно даже решить, что поесть, а тут нужно придумать вам занятие и понять, хватит ли сил на встречу.\n\nСлайд 3: Подруга долго выбирает между прогулкой и чаем, потом вообще замолкает. Я бы здесь сократила вопросы. Конкретное предложение принести ужин сегодня проще, чем просьба составить целый план помощи.\n\nСлайд 4: Подруга извиняется за бардак, хотя вы пришли ее поддержать. Она начинает убирать чашки и спрашивает, не скучно ли вам. Ей трудно принять, что рядом с вами можно побыть без сил. Бл*дь, ей сейчас ЕЩЕ и гостей развлекать. Я бы спокойно сказала, что уборка подождет.\n\nСлайд 5: Подруга шутит, пока вы сидите на кухне, и вам кажется, что ей уже лучше. Я рада таким моментам, но по одному смешному разговору нельзя понять, как она чувствует себя все остальное время.\n\nСлайд 6: Подруга раздраженно отвечает на предложение сходить куда-нибудь. Вам обидно, вы ведь старались. Но очередное предложение может звучать для нее как еще одна задача, с которой она не справилась. Лучше убрать нажим и дать ей возможность отказаться без долгих объяснений.\n\nСлайд 7: Если подруге приходится каждый раз придумывать, как ее поддержать, потом благодарить и успокаивать вас, она может начать говорить, что ничего не нужно. Я называю это усталостью от организации помощи. Сил мало, а помощь тоже требует от нее работы.\n\nСлайд 8: Предложите подруге одно конкретное дело, которое возьмете на себя, например привезти продукты. Договоритесь, подходит ли ей это. Пусть ей не придется одновременно принимать помощь и заботиться о том, довольны ли вы.","caption":"Я бы еще спросила себя, могу ли я побыть рядом с подругой, когда она сегодня совсем невеселая. Без попытки срочно ее расшевелить.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40 лет.\nОтправьте это тому, кто хочет поддержать подругу и теряется.","judge":null,"guard":[],"cut":["При депрессии простое решение может требовать много сил.","Хороший момент правда может случиться даже в очень тяжелый день."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Мама обидится, если сегодня не позвонить\nРечь: Четыре признака для тех, кому мама предъявляет за пропущенный звонок.\nПервое. Вы звоните, когда рассказать вообще нечего. Просто чтобы завтра не слушать «Ты про меня совсем забыла».\nВторое. Вы заранее оправдываетесь. Еще только собираетесь вечером встретиться с друзьями, а маме УЖЕ объяснили, почему будете заняты. Я считаю, это дохуя отчетности для взрослой женщины.\nТретье. Вам трудно закончить разговор. Вы хотите спать, но мама вздохнула, и вы еще двадцать минут слушаете про соседку. Иначе решит, что вам на нее наплевать.\nЧетвертое. После звонка вы проверяете, каким голосом она попрощалась. Вроде поговорили, а облегчения нет, потому что мама осталась недовольна. Вы звоните снова, чтобы выяснить, что случилось.\nУзнали свои разговоры с мамой?","caption":"Пропущенный звонок еще можно объяснить работой. А вот сказать, что вы весь вечер смотрели сериал и просто не хотели разговаривать, уже страшно.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно, но все еще переживают из-за родителей.\nПодписывайтесь, если хочется еще такого, здесь я говорю об отношениях с родителями во взрослой жизни.","judge":null,"guard":[],"cut":[],"before":null}];const KEY='eval-2026-10-02_03-49-04_rilsy_probe_h1';
let R={};try{R=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}};
const V={publikovat:'публиковать',popravit:'поправить',v_korzinu:'в корзину'};
const fs=[...new Set(DATA.map(d=>d.format))];const fsel=document.getElementById('f');
fs.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;fsel.appendChild(o)});
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const f=fsel.value,v=document.getElementById('v').value;const m=document.getElementById('m');m.innerHTML='';let n=0;
DATA.forEach(d=>{const j=d.judge||{};if(f&&d.format!==f)return;if(v==='mine'&&R[d.id]&&R[d.id].mark)return;if(v&&v!=='mine'&&j.verdict!==v)return;n++;
const c=document.createElement('div');c.className='card';const r=R[d.id]||{};
c.innerHTML='<div class="meta"><b>'+esc(d.id)+'</b> · '+esc(d.author)+' · '+esc(d.format)+(d.asked!==d.format?' (просили '+esc(d.asked)+')':'')+' · '+esc(d.intent)+'<br>'+esc(d.topic)+'</div>'
+(d.error?'<div class="mk">Ошибка: '+esc(d.error)+'</div>':'')
+(j.verdict?'<div><span class="tag v-'+j.verdict+'">'+V[j.verdict]+'</span><span class="why">'+esc(j.why)+'</span></div>':'')
+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'
+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')
+((d.cut||[]).length?'<div class="cut">Вычеркнула: '+d.cut.map(x=>'<s>'+esc(x)+'</s>').join(' ')+'</div>':'')
+((j.ai_markers||[]).length?'<div class="mk">'+j.ai_markers.map(x=>'«'+esc(x)+'»').join(' ')+'</div>':'')
+(j.worst?'<div class="why">Худшее: '+esc(j.worst)+'</div>':'')
+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')
+'<div class="rate"><button data-m="ok" class="'+(r.mark==='ok'?'on':'')+'">Живо</button><button data-m="bad" class="'+(r.mark==='bad'?'on':'')+'">Не живо</button><input placeholder="что не так" value="'+esc(r.note||'')+'"></div>';
c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
c.querySelector('input').onchange=e=>{R[d.id]={...(R[d.id]||{}),note:e.target.value};save()};
m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
fsel.onchange=render;document.getElementById('v').onchange=render;
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,ratings:R},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ocenki-2026-10-02_03-49-04_rilsy_probe_h1.json';a.click()};
render();
</script></body></html>
