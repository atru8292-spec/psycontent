<script>
const DATA=[{"id":"r_post_1","author":"Юлия","format":"post","asked":"post","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Он не пишет первым, а ты весь вечер проверяешь телефон и запрещаешь себе написать.\n\nЕго сообщение уже должно ответить на целую кучу вопросов. Я ему нравлюсь? Он про меня помнит? Ему вообще хочется со мной общаться? Можно мне уже порадоваться, что мы познакомились?\n\nТелефон загорелся, ты сразу хватаешь его. Уведомление от доставки. Открываешь ваш чат: вдруг пропустила. Заодно смотришь, был ли он в сети. Был. Ну вот, время у него есть. Почему тогда мне не пишет?\n\nТы набираешь «как прошел день?» и стираешь. «Буду навязываться». Хотя вчера вы прекрасно общались. Но сегодня тебе снова нужно получить разрешение проявить интерес. Желательно от него, первым сообщением.\n\nВот что выматывает в таком ожидании: свое желание поговорить ты уже считаешь подозрительным. Почему я так хочу ему написать? Почему мне больше всех надо? В чем я опять ошиблась?\n\nИ его «привет» становится разрешением. Все, теперь можно отвечать, шутить, спрашивать про день.\n\nОдин вечер, второй, третий. Ты все лучше знаешь, когда он бывает в сети, и все чаще ругаешь себя за то, что скучаешь.\n\nА если бы ты точно знала, что за твое «привет» никто не назовет тебя навязчивой, ты бы уже написала?","caption":"","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не пишет первым, а"},{"rule":"dvoetochiya","quote":"домление от доставки. Открываешь ваш чат: вдруг пропустила. Заодно смотришь, был | Вот что выматывает в таком ожидании: "}],"cut":["Теперь твое желание общаться вроде как одобрено."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Боюсь, что на работе меня раскусят\n\nМожно годами хорошо работать и ждать разоблачения. Особенно если каждому своему успеху вы находите объяснение, в котором вашей заслуги почти нет.\n\nПроект сдали? Коллега помог.\nСложный вопрос решили? Просто уже попадалось похожее.\nРуководитель похвалил? Он еще не видел, сколько вы возились.\n\nЕсли вы уверены «я ничего не умею», ошибку легко записать на свой счет. А удачный результат приходится как-то объяснять: повезло, подсказали, задача легкая.\n\nЛюбой исход подтверждает, что с вами что-то не так. Даже хороший.\n\nВот вы полдня собирали отчет, уточняли данные, нашли расхождение, исправили. Отправили. Вам пишут: «Спасибо, все понятно».\n\nИ тут же внутри: «Ну это же просто отчет. Любой бы смог».\n\nПоверьте, с таким способом подсчета можно освоить еще десять навыков и по-прежнему чувствовать себя случайным человеком в профессии. Все, что вы освоили, будет постепенно переезжать в категорию «это и так все умеют».\n\nЯ бы начал с этой фразы: «Любой бы смог». Откуда вы это знаете? И почему умение перестает считаться вашим, как только вы его освоили?\n\nКогда в следующий раз захочется объяснить удачный результат чужой помощью, оставьте в объяснении место и себе: «Да, мне помогли. Моя работа здесь тоже есть».","caption":"","judge":null,"guard":[{"rule":"kancelyarit","quote":"данные"},{"rule":"dvoetochiya","quote":"ый результат приходится как-то объяснять: повезло, подсказали, задача легкая. | ождение, исправили. Отправили. Вам пишут"}],"cut":["У психики есть простая особенность: привычное мнение о себе влияет на то, какие доказательства мы принимаем.","Получается удобная система."],"before":null},{"id":"r_car_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Слайд 1: Подруга с депрессией перестала отвечать на сообщения\n\nСлайд 2: Вы пишете подруге: «Как ты? Погуляем? Что тебе привезти?» И ждете хоть пару слов.\n\nПри депрессии даже забота часто ощущается как ЕЩЕ одно задание. Нужно выбрать, объяснить свое состояние, поблагодарить. Подруга может откладывать ответ именно потому, что хочет ответить вам нормально.\n\nСлайд 3: Первое. Она читает сообщения и молчит.\n\nЧтобы ответить «как ты?», приходится разбираться, как вообще описать этот день. А потом думать, расстроитесь ли вы.\n\nМожно написать: «Просто шлю тебе обнимашку. Отвечать сейчас не нужно».\n\nСлайд 4: Второе. Она отказывается от прогулки, которую сама предложила.\n\nВчера выход из дома казался посильным. Сегодня душ, одежда и дорога уже забирают все силы.\n\n«Но ты же обещала» добавит ей еще одну причину ругать себя. Лучше: «Поняла. Сегодня отменяем».\n\nСлайд 5: Третье. Она раздражается на ваши советы.\n\n«Бл*н, я даже поесть не могу, какая йога?»\n\nСпросите: «Можно я просто побуду рядом?» И дайте ей возможность отказаться.\n\nСлайд 6: Четвертое. Вы помогли, а она совсем не повеселела.\n\nПродукты в холодильнике облегчают день. Улыбка и оживленный разговор могут пока быть ей недоступны.\n\nЕсли после каждой помощи спрашивать «Ну что, получше?», появляется обязанность показать улучшение.\n\nСлайд 7: Если подруге приходится после каждого вашего визита утешать вас, она может начать избегать встреч. «Мне все еще плохо» становится трудно произнести, когда человек напротив столько старался.\n\nЗаранее скажите: «Я понимаю, что тебе может оставаться тяжело и после моей помощи».\n\nСлайд 8: Вместо «Обращайся, если что» предложите что-то конкретное:\n\n«Я завтра могу привезти ужин и оставить у двери. Если подходит, пришли плюс. Разговаривать и принимать меня в гости не нужно».","caption":"Когда близкому плохо, очень хочется получить хоть какой-то знак, что вы помогли. Это ожидание иногда незаметно попадает в каждое сообщение.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 20 до 40.\nОтправьте тому, кто сейчас переживает за подругу.","judge":null,"guard":[{"rule":"rublenye","quote":"Лучше: «Поняла. Сегодня отменяем». Третье."},{"rule":"dvoetochiya","quote":"Вы пишете подруге: «Как ты? Погуляем? Что тебе привезти?» | Можно написать: «Просто шлю тебе обнимашку. Отвечать се | т "},{"rule":"ostorozhno","quote":"6 оговорок: часто, может, могут, иногда"}],"cut":["В совете она может услышать новое требование к себе.","Даже если вы очень хотите помочь.","Назовем это долгом за заботу."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Мама обижается, если вы пропускаете звонок\nРечь: Четыре признака, что вы звоните маме каждый день из страха ее обидеть.\nПервое. Вы заранее оправдываетесь. Еще рабочая встреча не началась, а вы уже пишете: «Мам, сегодня освобожусь поздно». Чтобы вечером обошлось без «могла бы минутку найти».\nВторое. Вы подбираете настроение для звонка. Даже после тяжелого дня изображаете бодрый голос. Иначе придется еще объяснять, почему вы «так разговариваете».\nТретье. Вам трудно радоваться без отчета. Купили билеты, забронировали отпуск, сразу мысль: «Как сказать, чтобы она не обиделась, что без нее?» Блядь, опять виновата.\nЧетвертое. Вы радуетесь, когда мама сама отменяет звонок. «Сегодня к подруге иду». И вы наконец спокойно проводите вечер. Получается, отдыхать от общения можно только с ее разрешения?","caption":"Иногда пропущенный звонок приходится отрабатывать: на следующий день слушать дольше, расспрашивать подробнее, соглашаться охотнее.\nМеня зовут Ольга, я психолог, работаю со взрослыми детьми 25-40 лет, которые живут отдельно от родителей.\nПодписывайтесь, если хочется еще такого: здесь говорим о родителях, обидах и своей взрослой жизни.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не началась, а"},{"rule":"dvoetochiya","quote":"чая встреча не началась, а вы уже пишете: «Мам, сегодня освобожусь поздно». Чтобы | илеты, забронировали отпуск, сразу м"}],"cut":["Как будто накопился долг."],"before":null}];const KEY='eval-2026-10-02_03-50-03_rilsy_probe_h3';
let R={};try{R=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}};
const V={publikovat:'публиковать',popravit:'поправить',v_korzinu:'в корзину'};
const fs=[...new Set(DATA.map(d=>d.format))];const fsel=document.getElementById('f');
fs.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;fsel.appendChild(o)});
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const f=fsel.value,v=document.getElementById('v').value;const m=document.getElementById('m');m.innerHTML='';let n=0;
DATA.forEach(d=>{const j=d.judge||{};if(f&&d.format!==f)return;if(v==='mine'&&R[d.id]&&R[d.id].mark)return;if(v&&v!=='mine'&&j.verdict!==v)return;n++;
const c=document.createElement('div');c.className='card';const r=R[d.id]||{};
c.innerHTML='<div class="meta"><b>'+esc(d.id)+'</b> · '+esc(d.author)+' · '+esc(d.format)+(d.asked!==d.format?' (просили '+esc(d.asked)+')':'')+' · '+esc(d.intent)+'<br>'+esc(d.topic)+'</div>'
+(d.error?'<div class="mk">Ошибка: '+esc(d.error)+'</div>':'')
+(j.verdict?'<div><span class="tag v-'+j.verdict+'">'+V[j.verdict]+'</span><span class="why">'+esc(j.why)+'</span></div>':'')
+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'
+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')
+((d.cut||[]).length?'<div class="cut">Вычеркнула: '+d.cut.map(x=>'<s>'+esc(x)+'</s>').join(' ')+'</div>':'')
+((j.ai_markers||[]).length?'<div class="mk">'+j.ai_markers.map(x=>'«'+esc(x)+'»').join(' ')+'</div>':'')
+(j.worst?'<div class="why">Худшее: '+esc(j.worst)+'</div>':'')
+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')
+'<div class="rate"><button data-m="ok" class="'+(r.mark==='ok'?'on':'')+'">Живо</button><button data-m="bad" class="'+(r.mark==='bad'?'on':'')+'">Не живо</button><input placeholder="что не так" value="'+esc(r.note||'')+'"></div>';
c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
c.querySelector('input').onchange=e=>{R[d.id]={...(R[d.id]||{}),note:e.target.value};save()};
m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
fsel.onchange=render;document.getElementById('v').onchange=render;
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,ratings:R},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ocenki-2026-10-02_03-50-03_rilsy_probe_h3.json';a.click()};
render();
</script></body></html>
