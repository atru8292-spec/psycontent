_vopros_1_post","author":"Ольга","format":"post","asked":"post","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"«Зачем платить психологу, если можно поговорить с подругой?» Такое мне попалось в комментариях, и меня бесит, как легко тут приравняли два совершенно разных разговора.\n\nУже слышу: «Ну конечно, сейчас нам объяснят, что бесплатно нас никто нормально выслушать не может».\n\nМожет, девочки. Подруга еще и приедет, привезет вкусного, вспомнит, что ваш парень обещал вам в прошлый раз.\n\nНо вот вы снова с ним помирились. И подруге уже говорите, что просто устали, поэтому плакали. Потому что она его терпеть не может, потому что вы вместе обсуждали, какой он мудак, потому что она отменяла свои планы, когда вы собирались от него уходить.\n\nИ теперь вы заранее представляете ее: «Ну мы же все обсудили, ты опять к нему?»\n\nПодруга может вас очень любить. И при этом злиться, переживать, уставать от повторений. У нее с вами общая жизнь, и ваши решения ее тоже касаются.\n\nВот эту х*рню легко пропустить: вы поговорили, вас поддержали, но самое стыдное вы снова оставили при себе.\n\nС психологом можно разбирать, почему вы остались, чего ждете от парня, что происходит между вами после каждой ссоры. Можно прийти после примирения и сказать, что уходить вы пока вообще не собираетесь. Вам не придется заодно успокаивать психолога, извиняться за его потраченный вечер и доказывать, что вы прислушались к советам.\n\nПодруге вы пишете: «Мы помирились. Я боялась тебе сказать, ты столько меня поддерживала. Давай сегодня без обсуждения, почему я опять с ним. Я хочу с тобой погулять».","caption":"","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"},{"rule":"dvoetochiya","quote":"Уже слышу: «Ну конечно, сейчас нам объяснят, что б | И теперь вы заранее представляете ее: «Ну мы же все обсудили, ты оп"}],"cut":["Иногда именно такой поддержки очень не хватает.","Вы дорожите дружбой, поэтому начинаете выбирать, сколько правды она сегодня выдержит."],"before":null},{"id":"r_post_1_post","author":"Юлия","format":"post","asked":"post","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Ко мне снова и снова приходят девушки, которые устали ждать, когда он напишет первым.\n\nТы уже придумала, что ему отправить, даже открыла вашу переписку, но останавливаешь себя: вчера я написала, сегодня пусть сам. И дальше проверяешь, заходил ли он в сеть, смотрел ли твою историю, сколько времени прошло с последнего разговора.\n\nМне особенно жаль этих потерянных вечеров, потому что ты ведь могла заняться своими делами, но боишься пропустить подтверждение, что он тоже хочет с тобой общаться.\n\nИ я замечаю еще одну вещь: написать самой бывает страшно именно потому, что он ответит. Вы поговорите, тебе станет легче, но вопрос останется: вспомнил бы он обо мне, если бы я промолчала?\n\nПоэтому ты ждешь, даже когда очень хочется поделиться чем-то смешным. Хочется хоть раз убедиться, что разговор начнется и без твоих усилий.\n\nИногда все проще, чем я привыкла искать в работе: он занят и напишет позже. Только ты за этот вечер уже успела решить, что надоела ему, вспомнить свое последнее сообщение и пожалеть, что вообще его отправила.\n\nОн еще ничего не объяснил, а ты уже готова меньше писать, меньше спрашивать, меньше рассказывать о себе, чтобы он совсем не исчез.\n\nПотом даже теплый ответ мало успокаивает, потому что она все равно думает: я опять сама его позвала.\n\nТы чаще проверяешь, был ли он в сети, или перечитываешь вашу переписку?","caption":"","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не объяснил, а"},{"rule":"dvoetochiya","quote":"а вашу переписку, но останавливаешь себя: вчера я написала, сегодня пусть сам. И | И я замечаю еще одну вещь: написать с"}],"cut":["За годы работы я стала замечать, сколько всего девушка пытается понять про отношения за один вечер без сообщения.","И вот это я замечаю особенно часто: пока девушка ждет его инициативы, она начинает отказываться от своей."],"before":null},{"id":"r_money_1_post","author":"Ольга","format":"post","asked":"post","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"«Как попросить повышение, чтобы начальник не подумал, что я обнаглела?» Меня спросили, и вот это «обнаглела» меня задело.\n\nВы уже работаете за себя и за коллегу, подхватываете срочное, отвечаете после работы. Но сказать, сколько хотите получать, стыдно. Вдруг начальник решит, что вы только ради денег и старались?\n\nИ вы берете еще одну задачу, соглашаетесь подменить коллегу, переносите свой отпуск. Пусть сначала убедится, какая вы полезная. Потом еще немного убедится. Желательно настолько, чтобы сам вызвал вас и извинился, что до сих пор платил мало.\n\nБл*ть, как же дорого вам обходится попытка заслужить разговор, в котором вам точно не откажут.\n\nПоэтому каждый раз, когда собираетесь заговорить о деньгах, находите еще что-нибудь, что надо сначала доделать. Зарплата прежняя, задач все больше, а просить почему-то все стыднее: вы ведь уже согласились столько делать за эти деньги.\n\nЯ тоже могу растеряться, когда нужно подобрать слова. И идеальных условий у меня нет: некоторые онлайн-сессии идут под чужие мультики, пока мамы прячутся от детей в ванной. «Синий трактор» я уже узнаю по звуку.\n\nВам нужны конкретная сумма и разговор с руководителем: что вы сейчас делаете, насколько вырос объем работы и сколько хотите за него получать. Услышать отказ неприятно, но дополнительными бесплатными задачами вы не сможете заранее обеспечить себе согласие.\n\nНачальник вполне может годами считать вас прекрасной сотрудницей и прекрасно экономить на вашей зарплате.","caption":"","judge":null,"guard":[{"rule":"kalka","quote":"дорого вам обходится"},{"rule":"dvoetochiya","quote":"больше, а просить почему-то все стыднее: вы ведь уже согласились столько делать | ть слова. И идеальных условий у меня н"}],"cut":["Вы стараетесь стать настолько нужной, чтобы начальник уже никак не мог остать
