<script>
const DATA=[{"id":"m07","author":"живой ролик","format":"reels_monolog","asked":"reels_monolog","intent":"mehanizm","topic":"живут в своей голове. Но я добавлю одну вещь, как психолог, который мн","text":"Дети, у которых было сложное детство, очень много думают. Про таких говорят: живут в своей голове. Но я добавлю одну вещь, как психолог, который много работает с такими людьми. Если человек очень много думает, скорее всего, он очень мало чувствует. Потому что он научился прятаться от всего пиздеца в голову. Анализировал обстановку дома, настроение родителей. Там было безопасно, только там был контроль. А чувствовать было больно, страшно и одиноко. Так что бесконечное обдумывание часто способ не встречаться с тревогой. В следующий раз, когда заметишь, что опять жуешь эту мыслительную жвачку, спроси себя по-доброму: котенок, а какое чувство я сейчас не хочу чувствовать? Если узнал себя, в описании есть еще.","caption":"","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":[],"worst":"«Но я добавлю одну вещь, как психолог, который много работает с такими людьми». Длинное представление себя тормозит переход к главной мысли.","best":"Потому что он научился прятаться от всего пиздеца в голову.","verdict":"publikovat","why":"Есть узнавание и понятный поворот: постоянный анализ может помогать прятаться от болезненных чувств. Конкретика про настроение родителей делает объяснение убедительным, а вопрос в конце хочется сохранить."},"guard":[],"cut":[],"before":null},{"id":"m12","author":"живой ролик","format":"reels_monolog","asked":"reels_monolog","intent":"mif","topic":"«ты сама притянула себе такого мужика». Давайте так. Мы никого не прит","text":"Умное говно, которое вам подают под соусом психологии: «ты сама притянула себе такого мужика». Давайте так. Мы никого не притягиваем. Мы просто живем свою жизнь, мы не управляем потоками вселенной и не знаем, кто к нам придет. Самое опасное в этой фразе, что она заставляет копаться в себе в поисках причины чужого говна. А почему я его притянула? А что со мной не так? Может, у меня с мамой плохие отношения? Стоп. В ваших руках другое. Оставить этого человека в жизни или вышвырнуть его нафиг. Сколько времени вы позволили ему остаться и на каких условиях.","caption":"","judge":{"zhivo":5,"zacep":5,"ponyatno":5,"polza":5,"interesno":5,"snyat":5,"ai_markers":[],"worst":"«Мы просто живем свою жизнь, мы не управляем потоками вселенной и не знаем, кто к нам придет» — затягивает уже понятное опровержение про «притянула».","best":"Самое опасное в этой фразе, что она заставляет копаться в себе в поисках причины чужого говна.","verdict":"publikovat","why":"Резкий заход, узнаваемое самокопание и ясная мысль: искать в себе причину чужого поведения — тупик, а решать, оставаться ли рядом, можно. Хочется переслать подруге, которая опять выясняет, что с ней не так."},"guard":[],"cut":[],"before":null},{"id":"m28","author":"живой ролик","format":"reels_monolog","asked":"reels_monolog","intent":"podderzhka","topic":"Если вы не можете перестать листать рилсы и заняться делом, я как клин","text":"Если вы не можете перестать листать рилсы и заняться делом, я как клинический психолог хочу терапевтически спросить. А может быть, вы... ну... заебались? А? Я понимаю, вы уже записали себя в конченые. Но вдруг есть маленький шанс, что вы в ахуе от нагрузки, и мозг пытается залипнуть хоть на чем-то приятном. А? Думаете все-таки, что ленивая скотина? Записала. Ну и все же предлагаю попробовать выключить. Нет, не рилсы, не пугаемся. Бесконечный поток требований к себе. Как вам идея? Вдруг дело в нем. Так, навскидку.","caption":"","judge":{"zhivo":5,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":["Нет, не рилсы, не пугаемся. Бесконечный поток требований к себе."],"worst":"Как вам идея? — пустоватая реплика, немного тормозит концовку.","best":"А может быть, вы... ну... заебались? А?","verdict":"publikovat","why":"Слышен живой психолог с юмором: зрительницу ловят на знакомом самобичевании и предлагают другое объяснение залипания. Хочется переслать уставшей подруге; противопоставление здесь работает как шутка, а не как нейросетевой шаблон."},"guard":[],"cut":[],"before":null},{"id":"m17","author":"живой ролик","format":"reels_monolog","asked":"reels_monolog","intent":"perevod_repliki","topic":"ты это выбирала, терпела и ничего не делала. Хорошая новость в том, чт","text":"Иногда нужно очень сильно охуеть, чтобы жизнь начала меняться. Охуеть это когда ты просыпаешься и видишь все как есть, и тебе противно, потому что ты наконец поняла правду. Больно, неприятно, но с этого все и сдвигается. Охуеть это когда видишь свой вклад: ты это выбирала, терпела и ничего не делала. Хорошая новость в том, что раз когда-то ты это выбрала, теперь можешь от этого отказаться. Охуеть это когда перестаешь ждать, что он изменится, деньги упадут с неба, проблемы решатся сами. Охуеть это когда выбираешь себя, даже если другим от этого неудобно. Эгоизм тут ни при чем. Ты просто вспомнила, что ты тоже есть.","caption":"","judge":{"zhivo":4,"zacep":5,"ponyatno":4,"polza":3,"interesno":3,"snyat":5,"ai_markers":["Охуеть это когда выбираешь себя, даже если другим от этого неудобно.","Эгоизм тут ни при чем. Ты просто вспомнила, что ты тоже есть."],"worst":"«Охуеть это когда выбираешь себя, даже если другим от этого неудобно.» — заезженное «выбираешь себя»: непонятно, что конкретно человек делает иначе.","best":"Иногда нужно очень сильно охуеть, чтобы жизнь начала меняться.","verdict":"popravit","why":"Начало останавливает, повтор «охуеть» держит ритм, говорить легко. Но дальше знакомые призывы без нового поворота: нужен конкретный момент узнавания, ради которого ролик перешлют подруге."},"guard":[],"cut":[],"before":null},{"id":"m10","author":"живой ролик","format":"reels_monolog","asked":"reels_monolog","intent":"kak_v_terapii","topic":"«я и так про себя все знаю и понимаю». Да, я тоже когда-то была прораб","text":"Когда люди говорят, что им не нужен психолог, они чаще всего добавляют: «я и так про себя все знаю и понимаю». Да, я тоже когда-то была проработанная, все прекрасно понимала. Вы можете вбить свой запрос в поиск, и он подберет вам вот столько книг. Как стать богаче, как построить отношения, как стать уверенней. Спросите чат-бота, он вам столько объяснений выдаст, что не унесете. И что, что-то поменялось? Проблема давно не в том, что мы чего-то не знаем. Мы не умеем чувствовать и боимся живого контакта, потому что в нем уязвимо и больно. А меняется что-то как раз там, в живом разговоре с человеком. Иначе так и будете говорить: головой я все понимаю, а в жизни ничего не меняется. Приходите в терапию, запись по ссылке в шапке профиля.","caption":"","judge":{"zhivo":4,"zacep":3,"ponyatno":4,"polza":3,"interesno":3,"snyat":5,"ai_markers":["Проблема давно не в том, что мы чего-то не знаем."],"worst":"«Мы не умеем чувствовать и боимся живого контакта, потому что в нем уязвимо и больно» — здесь вместо узнаваемой ситуации начинается абстрактное объяснение.","best":"Да, я тоже когда-то была проработанная, все прекрасно понимала.","verdict":"popravit","why":"Самоирония и «головой понимаю, а в жизни ничего не меняется» узнаваемы. Но почему живой разговор помогает там, где знания не помогли, зритель не поймет: нужен конкретный пример, иначе концовка воспринимается преимущественно как реклама терапии."},"guard":[],"cut":[],"before":null},{"id":"m56","author":"живой ролик","format":"reels_monolog","asked":"reels_monolog","intent":"svoya_istoriya","topic":"Я психолог, и это не помешало мне обосраться. Поделюсь историей своего","text":"Я психолог, и это не помешало мне обосраться. Поделюсь историей своего некрасивого успеха. В теории я знаю, что любой рост идет вместе со стыдом и страхом. Только знание не освобождает от того, чтобы все это прожить. С начала месяца у меня начало получаться то, к чему я шла. Как думаете, я обрадовалась? Да, конечно. Но честно, страха и стыда оказалось больше. Мне не хотелось никому рассказывать, начались бессонницы, а вчера я просто плакала от того, что у меня получается. Раньше в этом месте я сдувалась и возвращалась в точку ноль. Сейчас мне до одури страшно, мне стыдно, но я иду дальше. И для меня это большая победа.","caption":"","judge":{"zhivo":4,"zacep":5,"ponyatno":4,"polza":3,"interesno":3,"snyat":5,"ai_markers":["Только знание не освобождает от того, чтобы все это прожить.","возвращалась в точку ноль","И для меня это большая победа."],"worst":"С начала месяца у меня начало получаться то, к чему я шла. — Главная подробность спрятана: что получилось и почему от этого страшно и стыдно?","best":"Я психолог, и это не помешало мне обосраться.","verdict":"popravit","why":"Начало цепляет, уязвимость звучит живо. Но вместо обещанной истории — описание переживаний без самого события: нужна конкретная подробность, чтобы подписчица узнала себя, а не просто посочувствовала автору."},"guard":[],"cut":[],"before":null},{"id":"m52","author":"живой ролик","format":"reels_monolog","asked":"reels_monolog","intent":"obyasnenie","topic":"я про тебя помню, я тебя вижу, ты мне важна. Понятно, ситуации бывают ","text":"Он скинул тебе смешной рилс, а ты пролистала и даже реакцию не поставила. Вроде мелочь, да? Но если такие мелочи повторяются, они влияют на отношения намного сильнее, чем кажется. Отношения держатся на мелочах, которыми вы друг друга окликаете. Тот самый смешной рилс. Фотка заката из окна. Сообщение «как ты там». В них всегда есть что-то непроговоренное: я про тебя помню, я тебя вижу, ты мне важна. Понятно, ситуации бывают разные, мы не идеальны. Но если раз за разом никто не откликается, внутри появляется: я не интересна, я одна в этих отношениях. Отношения разрушают маленькие вещи, когда тебя раз за разом не замечают. Так что не жадничай на «ахаха» в ответ на рилс.","caption":"","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":["Тот самый смешной рилс. Фотка заката из окна. Сообщение «как ты там»."],"worst":"«Отношения разрушают маленькие вещи, когда тебя раз за разом не замечают.» — повторяет уже понятную мысль, формулировка тяжелее остальной речи.","best":"Так что не жадничай на «ахаха» в ответ на рилс.","verdict":"publikovat","why":"Заход узнаваемый, а связь между отправленным рилсом и желанием получить внимание дает бытовой мелочи новый смысл. Коротко, легко произнести, хочется переслать партнеру."},"guard":[],"cut":[],"before":null},{"id":"s41","author":"живой ролик","format":"reels_spisok","asked":"reels_spisok","intent":"uznavanie","topic":"я теперь что-то должен. Второй. Ему физически больно просить о помощи.","text":"Пять признаков, что человек прошел в жизни настоящий ад. Первый. Ему неловко, когда о нем искренне заботятся или делают комплименты. Забота для него что-то непривычное, с подвохом: я теперь что-то должен. Второй. Ему физически больно просить о помощи. Он лучше умрет. Третий. Он считывает настроение людей за полсекунды. По голосу, по тому, как человек моргает, как открывает дверь. Четвертый. Он не умеет отдыхать без чувства вины. Если ничего не делает, кажется, что сейчас кто-то придет и накажет за безделье. И пятый. Когда в жизни все хорошо, ему жутко тревожно. Мозг привык, что тишина бывает перед настоящим лютым пиздецом. Сколько пунктов насчитали у себя?","caption":"","judge":{"zhivo":5,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":[],"worst":"Сколько пунктов насчитали у себя? — шаблонный вопрос для комментариев, слабее самого списка.","best":"Если ничего не делает, кажется, что сейчас кто-то придет и накажет за безделье.","verdict":"publikovat","why":"Коротко, живо, с точными бытовыми деталями: открывание двери, ожидание наказания за отдых, тревога в спокойной жизни. Подписчица узнает себя и захочет переслать; до пятерки по интересу не хватает объяснения, как эти привычки связаны между собой."},"guard":[],"cut":[],"before":null},{"id":"s55","author":"живой ролик","format":"reels_spisok","asked":"reels_spisok","intent":"dlya_bl
