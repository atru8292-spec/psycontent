<script>
const DATA=[{"id":"otvet_1","author":"Михаил","format":"reels_otvet","asked":"reels_otvet","intent":"kak_v_terapii","topic":"«а если психолог мне не поможет?»","text":"Текст на экране: А если психолог мне не поможет?\nРечь: «А если психолог мне не поможет?» Такое возможно. Гарантию я вам не дам, даже если очень хочется ее получить.\n\nНо вы можете посмотреть, что именно мы делаем на встрече. Допустим, вы говорите: «Жду, когда станет не страшно, и тогда начну». Я бы спросил: «А сейчас вы тоже ждете, чтобы я пообещал, что все получится?»\n\nВот уже есть с чем работать. Когда для каждого шага нужна гарантия, можно долго стоять на месте.\n\nНапример, вам страшно отказать коллеге, и вы снова берете его работу. На встрече можем разобрать, чего вы ждете после отказа, подобрать слова и выбрать маленький шаг, который вы готовы попробовать. Потом обсудить, что получилось, что оказалось трудно.\n\nУверенность может расти, когда вы пробуете действовать и видите, как справляетесь со страхом.\n\nНа первой встрече спросите: «Что конкретно мы будем делать с моей проблемой?»\nПодпись: Можно сомневаться в терапии и говорить об этом психологу. Объяснить, как будет устроена работа, вполне обычная часть первой встречи.","judge":{"zhivo":3,"zacep":3,"ponyatno":4,"polza":3,"interesno":2,"snyat":4,"ai_markers":["Вот уже есть с чем работать.","Когда для каждого шага нужна гарантия, можно долго стоять на месте.","Уверенность может расти, когда вы пробуете действовать и видите, как справляетесь со страхом."],"worst":"А сейчас вы тоже ждете, чтобы я пообещал, что все получится? — Звучит как подловить клиента: обоснованное сомнение в терапии сразу превращается в его проблему.","best":"Жду, когда станет не страшно, и тогда начну","verdict":"popravit","why":"Конкретный пример с коллегой хорошо объясняет, что происходит на встречах. Но ответ уходит от вопроса об эффективности терапии к потребности клиента в гарантиях; стоит заменить подловку и сократить общие выводы."},"guard":[{"rule":"dvoetochiya","quote":"делаем на встрече. Допустим, вы говорите: «Жду, когда станет не страшно, и тогда | начну». Я бы спросил: «А сейчас вы то"}]},{"id":"monolog_1","author":"Михаил","format":"reels_monolog","asked":"reels_monolog","intent":"mif","topic":"«уверенность надо в себе воспитать»","text":"Текст на экране: Опять жду, когда стану увереннее\nРечь: «Уверенность надо в себе воспитать».\n\nТолько не делайте из этого условие: сначала стану уверенным, потом начну жить. Так можно годами ждать.\n\nВам предлагают задачу: перестаньте сомневаться, бояться, зависеть от чужого мнения. И вы начинаете себя ругать: «Все могут спокойно отказать. Что со мной опять не так?»\n\nВот коллега просит доделать его работу. У вас своих дел полно, но сказать об этом страшно. Вы соглашаетесь. Сегодня разговор удалось обойти. Завтра отказать может быть еще труднее, ведь вы так и не попробовали.\n\nУверенность может постепенно появляться, когда вы делаете что-то со страхом и замечаете: справился. Голос дрожал, человек был недоволен, но я смог сказать, что мне нужно.\n\nВы не можете приказать себе успокоиться. И чужое недовольство вам тоже неподвластно. Зато можете выбрать посильный шаг: «Сегодня я это взять не смогу».\n\nНачните с небольшого отказа там, где вам безопасно. Для этого не обязательно сначала почувствовать себя уверенно.\nПодпись: Если после отказа вы полчаса переживали, сам отказ все равно состоялся. Это тоже стоит учитывать, когда оцениваете себя.","judge":{"zhivo":3,"zacep":2,"ponyatno":4,"polza":3,"interesno":2,"snyat":4,"ai_markers":["Вам предлагают задачу: перестаньте сомневаться, бояться, зависеть от чужого мнения.","Сегодня разговор удалось обойти.","И чужое недовольство вам тоже неподвластно.","Зато можете выбрать посильный шаг"],"worst":"«Вам предлагают задачу: перестаньте сомневаться, бояться, зависеть от чужого мнения» — кто предлагает? Абстрактная подводка вместо узнаваемой ситуации.","best":"«Все могут спокойно отказать. Что со мной опять не так?»","verdict":"popravit","why":"Понятная основа и конкретный пример отказа, но звучит скорее как объяснение на консультации, чем цепляющий ролик. Усилить первую реплику, убрать безличную «задачу» и заменить книжные формулировки разговорными."},"guard":[{"rule":"dvoetochiya","quote":"Только не делайте из этого условие: сначала стану уверенным, потом начну жи | Вам предлагают задачу: перестаньте сомнева"}]},{"id":"spisok_1","author":"Ольга","format":"reels_spisok","asked":"reels_spisok","intent":"uznavanie","topic":"мама кричит на детей, а потом себя ненавидит","text":"Текст на экране: Кричите на детей, потом себя ненавидите?\nРечь: Девочки, если вы кричите на детей, а потом себя ненавидите, посмотрите, сколько из этого вам знакомо.\nПервое. Ребенок пролил воду, и вас уже трясет. Сегодня вы убираете за всеми двадцатый раз. Эта лужа стала последней каплей, потому что сил на очередную уборку уже нет.\nВторое. Вы сели с чаем, но в голове крутятся сменка, ужин, запись к врачу. Даже сидя вы продолжаете следить за всем домом. Отдохнуть так трудно.\nТретье. На обычное «мам, посмотри» хочется заорать: «Ну сколько можно!» Вы весь день кому-то нужны, и каждая новая просьба ощущается как еще одно дело, которое придется сделать.\nЧетвертое. После крика ребенок уже играет, а вы все еще ругаете себя: «Какая же я мать». Обещаете завтра терпеть ВСЕ. Только завтра вы снова усталая, дел столько же, и от этого обещания сил у вас больше не стало.\nСколько совпало?\nПодпись: После срыва можно сказать ребенку: «Прости, что накричала. Я устала. Кричать на тебя было неправильно». А когда успокоитесь, спросите себя: какое ежедневное дело можно целиком передать другому взрослому, вместе с напоминаниями и проверками?","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":4,"interesno":3,"snyat":4,"ai_markers":["Эта лужа стала последней каплей, потому что сил на очередную уборку уже нет.","Отдохнуть так трудно."],"worst":"Отдохнуть так трудно. — Пустой мини-вывод: предыдущая фраза уже показала, почему отдых не получается.","best":"Обещаете завтра терпеть ВСЕ.","verdict":"popravit","why":"Бытовые ситуации узнаваемы, а подпись предлагает конкретный шаг вместо очередного совета успокоиться. Уберите повтор заголовка в начале речи и сократите пояснения после примеров: сейчас знакомую мамам ситуацию слишком старательно разжевывают."},"guard":[{"rule":"dvoetochiya","quote":"обычное «мам, посмотри» хочется заорать: «Ну сколько можно!» Вы весь день кому-т | ок уже играет, а вы все еще ругаете с"}]},{"id":"istoriya_1","author":"Юлия","format":"reels_istoriya","asked":"reels_istoriya","intent":"svoya_istoriya","topic":"как я сама пришла в анализ и говорила, что все хорошо","text":"Текст на экране: Я плакала и говорила: все хорошо\nРечь: Я плакала перед сессиями и рассказывала аналитику, как у меня все хорошо. Когда я сама первый раз пришла в анализ, я два месяца говорила именно об этом. Потом он спросил, зачем я тогда плачу в машине перед каждой сессией. Вот такой вопрос. И вот такой у меня был первый заход в анализ. Я психолог. При этом мне тоже бывает трудно сказать, что со мной происходит. Можно знать много про чувства и с трудом говорить о своих. Можно рассказывать, что все хорошо, и плакать перед разговором об этом. Поэтому я бы предложила тебе чуть задержаться, когда в следующий раз захочется привычно ответить: «Все нормально». Как тебе сейчас, если можно ничего никому не объяснять? Ты вообще сама себя об этом спрашиваешь?\nПодпись: Бывало, что ты говорила «все хорошо», хотя хотелось плакать?","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Вот такой вопрос.","И вот такой у меня был первый заход в анализ.","Можно знать много про чувства и с трудом говорить о своих.","Как тебе сейчас, если можно ничего никому не объяснять?"],"worst":"«Потом он спросил, зачем я тогда плачу в машине перед каждой сессией». Откуда аналитик знал про слезы в машине? Пропущенная деталь делает историю похожей на придуманную.","best":"Я плакала перед сессиями и рассказывала аналитику, как у меня все хорошо.","verdict":"popravit","why":"Начало цепляет, личная история подходит аудитории и легко снимается. Нужно объяснить осведомленность аналитика, убрать повторы после его вопроса и заменить абстрактный финал: сейчас живой эпизод заканчивается стандартным психологическим наставлением."},"guard":[{"rule":"kancelyarit","quote":"При этом"},{"rule":"dvoetochiya","quote":"Я плакала и говорила: все хорошо | ледующий раз захочется привычно ответить: «Все нормально». Как тебе сейчас, если"}]},{"id":"poslanie_1","author":"Ольга","format":"reels_poslanie","asked":"reels_poslanie","intent":"podderzhka","topic":"мама, которая вечером считает, что опять ничего не успела","text":"Текст на экране: Мамам, которые вечером собой недовольны\nРечь: Если вы вечером смотрите на кухню и думаете: «Опять НИЧЕГО не успела», послушайте. А накормленные дети у нас сегодня сами обслуживались? Записались к врачу, нашли чистые трусы и вспомнили про завтрашнюю физкультуру?\n\n«Ну это же обычные дела, что тут считать». Конечно, девочки. Очень удобно. Полдня на них потратить, а вечером даже в зачет себе не поставить.\n\nУ домашних дел такая подстава: результат быстро исчезает. Поели, снова голодные. Помыли, снова грязное. И вы смотрите на новую гору посуды, будто предыдущую сегодня никто не мыл.\n\nЕще приходится помнить, что купить, кому что собрать, где что заканчивается. От этого тоже устают, даже если весь день провели дома.\n\nКогда кажется, что усилий никто не замечает, можно и злиться, и расстраиваться. В том числе на себя. Только сегодняшняя посуда не отменяет всего, что вы уже сделали.\n\nОбидно, когда ваш труд так легко пропустить.\nПодпись: Домашние дела быстро начинаются заново. К вечеру бывает трудно вспомнить, сколько раз вы уже с ними справились.","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Поели, снова голодные. Помыли, снова грязное.","Только сегодняшняя посуда не отменяет всего, что вы уже сделали.","Обидно, когда ваш труд так легко пропустить."],"worst":"«Обидно, когда ваш труд так легко пропустить.» — труд обычно не замечают или обесценивают; «пропустить труд» звучит неестественно.","best":"А накормленные дети у нас сегодня сами обслуживались?","verdict":"popravit","why":"Начало узнаваемое, бытовые подробности и ехидство попадают в аудиторию. Последние два абзаца теряют характер и превращаются в осторожное утешение: сократить их и закончить конкретнее."},"guard":[{"rule":"dvoetochiya","quote":"и вы вечером смотрите на кухню и думаете: «Опять НИЧЕГО не успела», послушайте. А | У домашних дел такая подстава: резул"}]},{"id":"scenka_1","author":"Юлия","format":"reels_scenka","asked":"reels_scenka","intent":"kak_v_terapii","topic":"первые месяцы терапии, когда «все хорошо»","text":"Текст на экране: «Даже психологу я говорю: все хорошо»\nПерсонажи: А это я, Б это психолог\nА: Даже психологу я говорю: «Все хорошо».\nБ: Что страшно сказать?\nА: Я вроде все делаю правильно, а рядом никого.\nБ: Как я могу на это отреагировать?\nА: Скажешь, что я сама во всем виновата.\nБ: Ты ждешь, что я осужу?\nА: Да. Поэтому улыбаюсь и рассказываю, как справляюсь.\nБ: Прямо сейчас тоже улыбаешься.\nА: Уже заметила. Боюсь заплакать, если перестану.\nБ: Можем побыть с этим.\nА: Я могу просто сказать, что мне плохо?\nБ: Да, можешь.\nПодпись: Тебе тоже трудно сказать вслух, что тебе плохо?","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Можем побыть с этим.","Как я могу на это отреагировать?"],"worst":"Можем побыть с этим. — терапевтический штамп: зрительнице непонятно, что именно предлагают делать.","best":"Уже заметила. Боюсь заплакать, если перестану.","verdict":"popravit","why":"Начало цепляет, а улыбка из страха заплакать дает узнаваемую сцену. Но психолог говорит заготовленными репликами, и героиня слишком складно объясняет себя: поправить два вопроса психолога и «побыть с этим»."},"guard":[{"rule":"dvoetochiya","quote":"«Даже психологу я говорю: все хорошо» | Даже психологу я говорю: «Все хорошо»."}]},{"id":"rol_1","author":"Ольга","format":"reels_rol","asked":"reels_rol","intent":"yumor","topic":"муж «помогает» по дому","text":"Текст на экране: Экскурсия по квартире. Муж помогает\nРечь: Проходите, девочки, начнем с кухни. Здесь все предусмотрено, чтобы муж мог помогать по дому. Вот посудомойка. Вы собираете посуду, убираете остатки еды, объясняете, что сковородку туда нельзя. Он нажимает кнопку. Очень удобно.\n\nДальше ванная. Стиральная машина тоже простая. Вы сортируете белье, проверяете карманы, выбираете режим. Мужу остается нажать «Пуск». Только попросите. Сам он может решить, что вы просто любуетесь кучей трусов.\n\nЗдесь детская. Муж вполне может уложить ребенка. Пижаму приготовьте, зубы почистите, книжку найдите. И будьте рядом. Вдруг ребенок захочет воды, а муж еще не освоил кухню.\n\nЭто диван. Здесь муж отдыхает после того, как ПОМОГ.\n\nА вы где будете отдыхать? Сейчас покажу. Вот розетка у кровати. Можно лежать и заряжать телефон, чтобы отвечать на вопросы из кухни.\n\nДа, стены толстые. Но «Маш, а где тряпка?» вы услышите из любой комнаты. Акустика прекрасная.\nПодпись: Меня бесят советы «попросите мужа помочь». Сколько домашних дел вы сначала должны организовать, чтобы их сделал другой взрослый?","judge":{"zhivo":4,"zacep":3,"ponyatno":5,"polza":4,"interesno":4,"snyat":4,"ai_markers":[],"worst":"Здесь все предусмотрено, чтобы муж мог помогать по дому. — Затянутая подводка: шутка начинается только с посудомойки.","best":"Сам он может решить, что вы просто любуетесь кучей трусов.","verdict":"publikovat","why":"Живая бытовая сатира: узнаваемые детали показывают, почему от такой «помощи» не легче. Начало слабее остального, а схема шуток повторяется, но трусы, розетка и финальная акустика удерживают внимание."},"guard":[{"rule":"skrytoe_protivopostavlenie","quote":"не освоил кухню.\n\nЭто"},{"rule":"rublenye","quote":"Он нажимает кнопку. Очень удобно. Дальше ванная."}]},{"id":"doska_1","author":"Михаил","format":"reels_doska","asked":"reels_doska","intent":"mehanizm","topic":"почему трудно отказать","text":"Текст на экране: Почему мне так трудно отказать?\nРечь: «Не могу отказать, потом злюсь на себя». Знакомо? Вы уже согласились помочь в субботу, хотя хотели просто выспаться. И теперь злитесь, пока человек радостно пишет: «Спасибо!»\nРисую: кружок со словом «страшно».\nПеред ответом вы представляете: человек обидится, решит, что на вас нельзя рассчитывать. Вы еще ничего не сказали, а уже тревожно.\nРисую: второй кружок «соглашаюсь», стрелка к нему от первого.\nВы отвечаете «да». Своя суббота жалко, зато отказать уже не придется.\nРисую: третий кружок «отпустило», стрелка от «соглашаюсь» и обратно к «страшно».\nВот здесь и закрепляется привычка. Согласились, тревога уменьшилась. Мозг запоминает: соглашаться помогает. При следующей просьбе снова хочется поскорее сказать «да», чтобы отпустило. Даже если потом будете злиться на себя.\n\nПосмотрите на этот круг. Каждый раз вы успокаиваетесь, так и не проверив, что случилось бы после отказа.\n\nПопробуйте с небольшой просьбы, которую действительно хотите отклонить. Скажите: «В субботу я не смогу». Тревога может остаться. Дайте себе время и посмотрите, как человек отреагирует в действительности.\nИтог на схеме: «страшно» → «соглашаюсь» → «отпустило» → обратно к «страшно».\nПодпись: Вспомните последнее согласие, после которого злились на себя. Чего вы ждали от человека, если бы отказали?","judge":{"zhivo":3,"zacep":3,"ponyatno":4,"polza":4,"interesno":3,"snyat":4,"ai_markers":["Своя суббота жалко, зато отказать уже не придется.","Вот здесь и закрепляется привычка.","Попробуйте с небольшой просьбы, которую действительно хотите отклонить.","Дайте себе время и посмотрите, как человек отреагирует в действительности."],"worst":"«Своя суббота жалко, зато отказать уже не придется.» — грамматически сломанная фраза, вслух звучит неестественно.","best":"И теперь злитесь, пока человек радостно пишет: «Спасибо!»","verdict":"popravit","why":"Узнаваемая ситуация, понятный механизм и посильный шаг для зрителя; схема помогает снять ролик. Исправить фразу про субботу, убрать повторное объяснение круга и сделать рекомендацию менее канцелярской."},"guard":[{"rule":"ne_x_a_y","quote":"не сказали, а"},{"rule":"dvoetochiya","quote":"ерь злитесь, пока человек радостно пишет: «Спасибо!» | Перед ответом вы представляете: человек обидится, решит, что на в"}]},{"id":"bezslov_1","author":"Ольга","format":"reels_bez_slov","asked":"reels_bez_slov","intent":"yumor","topic":"хочу просто полежать, чтобы никто ничего не хотел","text":"Экран 1: Вы легли: «Хочу просто полежать, чтобы никто ничего не хотел».\nЭкран 2: Муж из кухни: «А где у нас хлеб?»\nЭкран 3: «Нашел. Тебе тоже бутерброд сделать? С чем?»\nЭкран 4: «А детям какие? Они такое едят?»\nЭкран 5: «Я сказал маму не трогать. Они спрашивают, сколько минут».\nЭкран 6: «Ну чего ты злишься? Я же САМ все делаю».\nЭкран 7: «Ты только скажи, что конкретно делать, чтобы тебя не дергать».\nПодпись: Девочки, под пледом тоже можно работать. Например, руководить бутербродами.\nЯ бы обсуждала, какие дела муж берет целиком, включая решения, что детям намазать и где найти хлеб.","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":4,"ai_markers":[],"worst":"Я бы обсуждала, какие дела муж берет целиком, включая решения, что детям намазать и где найти хлеб. — После живой сценки звучит сухо, как рекомендация из консультации.","best":"Девочки, под пледом тоже можно работать. Например, руководить бутербродами.","verdict":"popravit","why":"Узнаваемая бытовая сценка: муж вроде помогает, но жена продолжает всем руководить. Поправить последнюю фразу подписи и уточнить, что в кадре: для ролика без слов пока расписаны только титры."},"guard":[{"rule":"dvoetochiya","quote":"Вы легли: «Хочу просто полежать, чтобы никто ниче | Муж из кухни: «А где у нас хлеб?»"}]},{"id":"auto_1","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"выходные в одиночестве","text":"Текст на экране: Тем, кому стыдно за одинокие выходные\nРечь: Это для тебя, если в выходные ты стесняешься признаться, что тебе даже позвать некого. Покупаешь продукты на один ужин. На вопрос про планы отвечаешь: «Хочу просто отдохнуть». И думаешь: «Я вроде все делаю правильно, а рядом никого».\n\nОсобенно больно, когда из этого получается: «Наверное, со мной что-то не так». К одиночеству добавляется стыд. И уже надо скрывать, как прошла суббота, будто ты в чем-то провинилась.\n\nЕсли ты привыкла оценивать себя по тому, выбирают ли тебя другие, пустой вечер легко принять за доказательство собственной никчемности.\n\nТы всю неделю работала, решала дела. Теперь еще и ругаешь себя за то, что тебе хочется с кем-то поужинать и поговорить. От этого тоже устают.\n\nВ твоем желании побыть с близким человеком нет ничего постыдного.\n\nМожно признаться, что сегодня тебе одиноко.\nПодпись: Иногда тяжелее всего признать, как сильно тебе сейчас не хватает компании. Особенно если привыкла говорить, что тебе и одной хорошо.","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["пустой вечер легко принять за доказательство собственной никчемности.","В твоем желании побыть с близким человеком нет ничего постыдного.","Можно признаться, что сегодня тебе одиноко."],"worst":"Если ты привыкла оценивать себя по тому, выбирают ли тебя другие, пустой вечер легко принять за доказательство собственной никчемности. — Учебниковое объяснение; «собственная никчемность» тяжеловесно звучит вслух.","best":"На вопрос про планы отвечаешь: «Хочу просто отдохнуть».","verdict":"popravit","why":"Начало точно попадает в знакомую ситуацию: скрываешь отсутствие компании за желанием отдохнуть. Дальше речь становится усредненно-психологической: упростить объяснение про самооценку и заменить две финальные фразы на менее шаблонное завершение."},"guard":[{"rule":"dvoetochiya","quote":"один ужин. На вопрос про планы отвечаешь: «Хочу просто отдохнуть». И думаешь | : «Я вроде все делаю правильно, а рядом н"}]},{"id":"post_1","author":"Ольга","format":"post","asked":"post","intent":"podderzhka","topic":"крикнула на ребенка и ненавижу себя","text":"Если вы после крика на ребенка уже мысленно лишили себя звания нормальной матери, подождите.\n\nА у нормальной матери по уставу вообще есть право злиться? Или ей вместе с ребенком выдали пожизненную обязанность говорить ласково, даже когда внутри все кипит?\n\n«Но он же маленький, я должна была сдержаться».\n\nДа, маленький. Поэтому вам сейчас так хреново. Вы видели, как он испугался, и вам больно от того, что вы сами его напугали. Я понимаю, почему вы себя ругаете.\n\nТолько в этом разборе почему-то учитываются последние десять секунд. А весь день куда делся?\n\nВот вы укладываете ребенка. Он просит воды. Потом другую пижаму. Потом еще одну сказку. Обычные детские просьбы. Но вы с утра всех собирали, работали, готовили, искали потерянное, отвечали на вопросы. Даже в туалет сходили под «мам, ты где?».\n\nИ тут еще вода. И вы орете. А потом сидите на кухне: господи, из-за стакана воды?\n\nК вечеру сил сдерживать раздражение может почти не остаться. Каждая новая просьба ощущается как еще одно «давай», когда вы уже еле стоите. Усталость накапливалась часами, а слышно ее стало в одном крике.\n\nРебенку от этого крика больно. Вам тоже. И ваша усталость никуда не исчезает от того, что вы теперь называете себя ужасной матерью.\n\nМожно жалеть, что накричали. Можно злиться и хотеть, чтобы сегодня от вас уже никто ничего не просил. За это желание тоже не нужно себя грызть.","judge":{"zhivo":3,"zacep":3,"ponyatno":4,"polza":3,"interesno":3,"snyat":null,"ai_markers":["мысленно лишили себя звания нормальной матери","Усталость накапливалась часами, а слышно ее стало в одном крике.","За это желание тоже не нужно себя грызть."],"worst":"«Усталость накапливалась часами, а слышно ее стало в одном крике.» — слишком старательная красивая формула среди нормальной разговорной речи.","best":"И тут еще вода. И вы орете. А потом сидите на кухне: господи, из-за стакана воды?","verdict":"popravit","why":"Бытовая сцена точная: мама узнает себя, и ее вину не обесценивают. Но начало перегружено, а финал повторяет поддержку: лучше добавить конкретный шаг, как после крика поговорить с ребенком."},"guard":[]},{"id":"tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"жду, когда станет не страшно, и тогда начну","text":"Пока ждете, страх набирает силу\n\n«Жду, когда станет не страшно, и тогда начну». Звучит разумно. Зачем лезть туда, где у вас уже от одной мысли потеют ладони?\n\nВот только у мозга есть привычка: если вы чего-то испугались, отложили и почувствовали облегчение, он запоминает, что отступать помогает. В следующий раз снова хочется отложить. Так можно месяцами ждать подходящего настроения.\n\nДопустим, вы хотите пойти на занятия. Открыли переписку с преподавателем, набрали: «Здравствуйте, можно к вам совсем без опыта?»\n\nИ тут началось. Вдруг вопрос глупый? Вдруг там все уже умеют? Ладно, завтра.\n\nЗакрыли переписку. Отпустило. Только вы по-прежнему ничего не знаете ни о преподавателе, ни о группе. Зато теперь есть еще один опыт: стало страшно, отступили, стало легче.\n\nКогда вы все-таки отправляете сообщение, появляется возможность проверить свои опасения. Возможно, вам спокойно ответят и расскажут, как проходят занятия. Возможно, условия вам не подойдут. В любом случае у вас появится информация, которой сейчас нет.\n\nПоэтому я предлагаю уменьшать первый шаг до того, который вы готовы сделать вместе со страхом. Спросить про занятия. Посмотреть расписание. Уточнить, можно ли прийти один раз, без покупки абонемента.\n\nИ важная вещь: после отправленного сообщения вы можете продолжать волноваться. Даже проверять телефон каждые пять минут. Само по себе это еще ничего не говорит о том, стоило ли писать. Вы уже сделали то, что собирались, хотя спокойствие пока не пришло.\n\nЧто вы сейчас откладываете до момента, когда станет не страшно? Какой первый шаг там можно сделать сегодня?","judge":{"zhivo":3,"zacep":2,"ponyatno":4,"polza":3,"interesno":3,"snyat":null,"ai_markers":["Пока ждете, страх набирает силу","появляется возможность проверить свои опасения","В любом случае у вас появится информация, которой сейчас нет.","который вы готовы сделать вместе со страхом"],"worst":"Поэтому я предлагаю уменьшать первый шаг до того, который вы готовы сделать вместе со страхом. — Тяжеловесно; «сделать вместе со страхом» звучит как калька из психологического пособия.","best":"Вдруг вопрос глупый? Вдруг там все уже умеют? Ладно, завтра.","verdict":"popravit","why":"Пример с неотправленным сообщением узнаваемый, механизм избегания объяснен понятно. Заменить заголовок-вывод, упростить фразу про первый шаг и сократить осторожные пояснения во второй половине: там текст начинает звучать как памятка."},"guard":[{"rule":"skrytoe_protivopostavlenie","quote":"ни о преподавателе, ни о группе. Зато"},{"rule":"rublenye","quote":"Ладно, завтра. Закрыли переписку. Отпустило."},{"rule":"dvoetochiya","quote":"Вот только у мозга есть привычка: если вы чего-то испугались, отложили и | рыли переписку с преподавателем, набрали: «Зд"}]}];const KEY='eval-2026-09-30_18-05';
