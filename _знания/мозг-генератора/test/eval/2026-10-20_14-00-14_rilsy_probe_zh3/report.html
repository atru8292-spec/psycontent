<script>
const DATA=[{"id":"r_mif_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: Я плачу, а он только кивает\nРечь: Меня раздражает этот совет: «Зачем вам психолог? Он просто слушает и кивает за ваши деньги». Особенно когда его дают человеку, который и так полгода собирается записаться и сомневается, стоит ли вообще говорить кому-то о своих трудностях.\n\nНо после чужого «послушает и покивает» вы начинаете спрашивать себя совсем другое. «Может, я просто жалуюсь и хочу, чтобы меня пожалели? Может, взрослые люди сами с таким справляются? Я что, настолько беспомощный, что мне приходится платить, чтобы меня выслушали?»\n\nВот это меня и злит. Вы еще ни разу не поговорили с психологом, а уже стыдитесь того, зачем хотите прийти. Можно еще потерпеть, можно еще самому попробовать. Вы ведь уже пробовали. Поэтому и задумались о помощи.\n\nИ отдельно скажу: если психолог действительно только кивает, а вы не понимаете, над чем работаете, ваше недовольство вполне понятно. Я бы тоже хотел понимать, за что плачу. Вы можете прямо об этом спросить.\n\nСамому придумывать оправдания его молчанию вам точно не придется.\n\nВы отвечаете за свое участие в работе. За работу психолога отвечает психолог.","caption":"На первой встрече можно сказать: «Я никогда не был у психолога и пока не понимаю, как это устроено». Заранее знать правила терапии от вас никто не требует.\n\nЯ Михаил, психолог. Работаю со взрослыми, которые впервые обращаются за помощью.\nОтправьте тому, кто давно думает о первой встрече.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не поговорили с психологом, а"},{"rule":"dvoetochiya","quote":"Меня раздражает этот совет: «Зачем вам психолог? Он просто слушает | И отдельно скажу: если психолог действительно тольк"}],"cut":["Потому что послушать этот совет всерьез, и получается странная вещь: если вы можете рассказать о своей проблеме бесплатно, платить вообще незачем.","Подруга послушает, муж послушает, кому-нибудь в интернете напишете.","Ну да, рассказать можно.","Только вы ведь собираетесь к психологу с надеждой, что в вашей жизни что-то изменится.","Вы хотите перестать отменять встречи из-за тревоги, научиться говорить о том, что вам неприятно, разобраться, почему снова соглашаетесь на то, чего совсем не хотите.","И у вас есть полное право спросить, как разговоры на встречах помогут с тем, ради чего вы пришли.","Что вы вместе будете делать?","Как поймете, что работа помогает?","Это нормальные вопросы перед тем, как тратить свое время и деньги.","И теперь вам приходится доказывать себе, что у вас достаточно серьезная проблема.","Психолог может объяснить, что предлагает и как это связано с вашим запросом, обсудить ваши сомнения.","Ему придется участвовать в этом разговоре, даже если вы недовольны его работой.","От вас потребуется участие: говорить, когда что-то непонятно, рассказывать, что получается, что вызывает трудности, пробовать то, о чем договорились.","Причем соглашаться со всем подряд совершенно необязательно.","Если предложенное вам не подходит, это тоже важно обсуждать.","За то, чтобы встречи имели понятный смысл, отвечает и психолог.","Вы вправе рассчитывать на его участие, задавать вопросы о ходе работы и получать понятные ответы."],"before":null},{"id":"r_vopros_1","author":"Ольга","format":"reels_otvet","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Зачем мне психолог, если есть подруги?\nРечь: А зачем мне психолог, если у меня есть подруги?\n\nСижу с телефоном, только что увидела очередное видео: зачем платить психологу, если можно поговорить с подругой. Она вас знает, бывшего вашего знает, маму вашу знает, еще и помнит, в какой момент надо сказать, что бывший мудак. Все, можно прием вести, осталось время в календаре открыть. Меня прямо задело, как легко предлагают считать это одним и тем же.\n\nВот, допустим, вы встречаетесь с подругой после тяжелой недели. Хотели рассказать, что дома опять поссорились, вы полночи плакали и теперь боитесь возвращаться к этому разговору. Заказываете кофе, спрашиваете, как она, и выясняется, что у нее на работе полный пиздец. Начальник наорал, коллега подставила, она думает увольняться. Вы слушаете, уточняете, помогаете составить сообщение начальнику. Она спрашивает: ну а ты как? И вы уже говорите: да у меня ничего особенного. Потому что она и так расстроена, куда еще вы со своими проблемами.\n\nТолько домой вы едете с тем самым разговором, ради которого вообще собирались встретиться.\n\nВ терапии для этого разговора есть отдельное время.\n\nВот с этим ко мне тоже можно прийти. В том числе когда вы уже собираетесь сказать: «Ладно, у меня ничего особенного».","caption":"Подруга может первой заметить, что вы давно отвечаете «нормально», и спросить еще раз. Мне очень нравится такая настойчивость.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nСохраните, если вам знакомо это «ничего особенного».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"оном, только что увидела очередное видео: зачем платить психологу, если можно пог | ить сообщение начальнику. Она спраши"}],"cut":["Потому что даже с любимой подругой вы можете привычно делать вид, что у вас все нормально.","У дружбы и терапии разные задачи.","И вот вы правда любите подругу, она любит вас, вы хорошо посидели, обнялись у метро.","Я тоже могу увлечься чужой историей, начать сочувствовать, включиться и забыть, что сама собиралась сказать.","Очень понимаю этот момент, когда уже как будто неудобно возвращаться к себе.","Особенно если вы привыкли быть той подругой, которая всегда выслушает.","И подруга вполне могла бы вас послушать.","Она же спросила, как вы.","Только вы уже решили за нее, сколько ваших переживаний она выдержит.","А она может даже гордиться тем, какая вы сильная, как спокойно со всем справляетесь.","Откуда ей знать про ту ночь, если вы сказали, что ничего особенного?","Вам нужно, чтобы кто-то оставался с вами в вашей теме, даже когда вы сами уже предлагаете ее закончить.","Я могу заметить, что вы собирались рассказать о ссоре, потом стали извиняться за жалобы и теперь спрашиваете, как у меня дела.","И спросить, что случилось в тот момент, когда вы решили, что мне уже хватит.","Мы можем прямо об этом поговорить.","Вам страшно показаться навязчивой?","Кажется, я начну скучать?","Вы ждете, что я скажу: сколько можно об одном и том же?"],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Вы живете отдельно, мама требует ежедневных звонков\n\nРечь: Четыре признака, что вы живете отдельно, но до сих пор планируете каждый день с учетом того, обидится ли мама.\n\nПервое, вам трудно закончить рабочий день, пока вы ей не позвонили.\n\nВторой признак, вы оправдываетесь перед партнером за то, что берете трубку. Вы вместе сели ужинать, мама звонит, вы говорите: «Я быстро, иначе она обидится». Потом возвращаетесь, ужин остыл, партнер уже убирает тарелку. Блядь, вот это меня особенно задевает: поссорились в итоге вы двое, хотя оба хотели спокойно поужинать.\n\nТретье, вы заранее придумываете уважительную причину для выходного без звонка. Работа, врач, разрядился телефон. Просто лежала на диване и смотрела сериал? Такое маме лучше не говорить.\n\nЧетвертое, вы скрываете от мамы, как хорошо провели время. У вас был прекрасный вечер с друзьями, вы смеялись, засиделись допоздна, утром хочется рассказать. Но мама вчера ждала звонка. И вы уже представляете: «Ну конечно, с ними тебе интереснее». Поэтому говорите, что устали и рано легли.\n\nВы тоже говорите маме «ничего особенного», когда на самом деле было хорошо?","caption":"Меня особенно задевает, когда после пропущенного звонка вы еще спрашиваете у мамы: «Ты точно не обиделась?» Она говорит, что все нормально, но вы продолжаете извиняться. И про свой день уже так ничего и не рассказываете.","judge":null,"guard":[{"rule":"na_samom_dele","quote":"на самом деле"},{"rule":"dvoetochiya","quote":"е сели ужинать, мама звонит, вы говорите: «Я быстро, иначе она обидится». Потом в | у. Блядь, вот это меня особенно заде"}],"cut":["Вы уже закрыли ноутбук, собираетесь домой и вспоминаете: вчера мама сказала, что совсем вам стала не нужна.","Теперь звоните прямо у лифта, потому что дома хочется поесть и помолчать, а позже она уже ответит таким голосом, что придется еще полчаса объяснять, почему вы набрали только сейчас.","До дома вы еще не добрались, а сил на разговор с кем угодно уже нет.","Партнер продолжает есть, вы выходите на кухню и слушаете, что мама купила в магазине.","И вы злитесь на него, потому что он мог бы и подождать.","Я недавно опять увидела совет: ну что вам стоит набрать маму, всего несколько минут.","И зависла.","Потому что вы ведь заранее знаете, какие вопросы услышите: «Для сериала время есть? А со мной поговорить некогда?»","И вот вы уже весь вечер поглядываете на телефон, хотя хотели наконец отдохнуть.","И фотографии ей не отправляете, хотя там вы такая довольная, что самой приятно смотреть.","Бывает, вы еще по дороге домой решаете, о чем завтра придется промолчать."],"before":null}];const KEY='eval-2026-10-20_14-00-14_rilsy_probe_zh3';
let R={};try{R=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

fs.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;fsel.appendChild(o)});
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const f=fsel.value,v=document.getElementById('v').value;const m=document.getElementById('m');m.innerHTML='';let n=0;

c.innerHTML='<div class="meta"><b>'+esc(d.id)+'</b> · '+esc(d.author)+' · '+esc(d.format)+(d.asked!==d.format?' (просили '+esc(d.asked)+')':'')+' · '+esc(d.intent)+'<br>'+esc(d.topic)+'</div>'

+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')

+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')

+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')
+'<div class="rate"><button data-m="ok" class="'+(r.mark==='ok'?'on':'')+'">Живо</button><button data-m="bad" class="'+(r.mark==='bad'?'on':'')+'">Не живо</button><input placeholder="что не так" value="'+esc(r.note||'')+'"></div>';
c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
c.querySelector('input').onchange=e=>{R[d.id]={...(R[d.id]||{}),note:e.target.value};save()};
m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
fsel.onchange=render;document.getElementById('v').onchange=render;
