дине несколько раз объясняется одна мысль; сократите повторы и замените финальный вопрос, чтобы отдых не превращался в очередную проверку."},"guard":[{"rule":"dvoetochiya","quote":"ж укладывает детей, а вы прислушиваетесь: зубы почистили? Будильник поставили? Вс | ело и оставить себе ВСЕ, что вокруг "}],"cut":["Это поможет понять, какую часть работы вы все еще держите на себе."],"before":null},{"id":"tema_2","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"выгорание: сил нет ни на что, а надо","text":"Текст на экране: Сил нет, а дома опять все надо\nРечь: Вот что бывает, когда сил уже нет, а вы все еще отвечаете за ВСЕ дома.\nПервое. Легли на диван и вспомнили: форма в стирке, хлеб закончился, ребенку завтра к врачу.\nВторое. Муж спрашивает, где пижама. Вас бесит уже сам вопрос. Чтобы он нашел пижаму, вам опять надо включиться.\nТретье. Дети уснули, вы листаете телефон до ночи. Завтра будете никакая, но сейчас наконец никто вас не дергает. Жалко заканчивать эти полчаса.\nЧетвертое. «Хочу просто полежать, чтобы никто ничего не хотел». Даже предложение погулять раздражает: опять одеваться, собирать детей, искать ключи.\nСколько совпало?\nПодпись: Когда вы лежите, кто помнит про стирку, продукты и завтрашний прием у врача?","judge":{"zhivo":3,"zacep":3,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":[],"worst":"«Сколько совпало?» — шаблонный вопрос: узнавание уже случилось, а нового понимания он не добавляет.","best":"«Завтра будете никакая, но сейчас наконец никто вас не дергает. Жалко заканчивать эти полчаса.»","verdict":"popravit","why":"Бытовые детали точные, речь легко произнести, мамы себя узнают. Но начало только объявляет тему, а финал превращает узнавание в подсчет: стоит усилить заход и объяснить, почему даже лежа женщина не отдыхает."},"guard":[{"rule":"dvoetochiya","quote":"Первое. Легли на диван и вспомнили: форма в стирке, хлеб закончился, ребенк | л». Даже предложение погулять раздражает: "}],"cut":[
