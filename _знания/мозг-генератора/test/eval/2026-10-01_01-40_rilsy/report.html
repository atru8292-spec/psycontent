const DATA=[{"id":"tema_1","author":"Михаил","format":"post","asked":"post","intent":"uznavanie","topic":"выгорание: сил нет ни на что, а надо","text":"Вы уже легли, но на сообщение «можете быстренько посмотреть?» отвечаете: «Да, конечно».\n\nВроде мелочь. Пять минут, человек же просит. Только вы перед этим полчаса сидели на краю кровати, потому что даже идти в душ было тяжело.\n\nСил нет. А отказать тоже страшно. Придется выдержать чужое недовольство, объяснить, почему вы устали, вдруг еще услышать: «Мы вообще все устаем».\n\nИ вы соглашаетесь. Так хотя бы никто не обидится. А потом злитесь на себя и лежите с открытыми глазами: теперь даже уснуть трудно.\n\nНа консультациях это звучит так: «Не могу отказать, потом злюсь на себя».\n\nКогда говорят о выгорании, обычно считают задачи. Но бывает, что к каждой задаче вы добавляете еще одну: сделать так, чтобы никто не заметил, как вам тяжело.\n\nПоэтому дома на вопрос «что будем есть?» вы начинаете перебирать продукты в холодильнике. Можно ведь сказать: «Сегодня я готовить не могу». Но вы уже представляете вздох в ответ. Ладно, сварю макароны. Заодно посуду помою.\n\nОни видят человека, который отвечает, помогает, готовит. И продолжают просить. А вы ждете, когда ваше состояние станет достаточно тяжелым, чтобы отказ наконец выглядел убедительно.\n\nСегодня попробуйте оставить одну просьбу на завтра. Ответить коротко: «Сегодня сил на это нет. Вернусь завтра».\n\nВозможно, после этого захочется дописать длинное объяснение и все-таки взяться за дело. Заметьте этот момент. Нужно ли еще доказывать, что вам можно отдохнуть?","caption":"","judge":{"zhivo":4,"zacep":4,"ponyatno":4,"polza":4,"interesno":4,"snyat":null,"ai_markers":["Когда говорят о выгорании, обычно считают задачи.","Нужно ли еще доказывать, что вам можно отдохнуть?"],"worst":"Когда говорят о выгорании, обычно считают задачи. — Непонятно, кто и зачем их считает; искусственная подводка к хорошему наблюдению.","best":"А вы ждете, когда ваше состояние станет достаточно тяжелым, чтобы отказ наконец выглядел убедительно.","verdict":"popravit","why":"Узнаваемые бытовые сцены и точное наблюдение: человек ждет, когда истощение станет убедительным оправданием отказа. Убрать повтор про консультации, заменить подводку про подсчет задач и закончить без назидательного вопроса."},"guard":[{"rule":"dvoetochiya","quote":"можете быстренько посмотреть?» отвечаете: «Да, конечно». | ть, почему вы устали, вдруг еще услышать: «Мы вообще все уста"}],"cut":["Так усталость остается незаметной для окружающих.","Вы ведь уже сообщили, сколько у вас сейчас сил."],"before":null},{"id":"tema_2","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"выгорание: сил нет ни на что, а надо","text":"Текст на экране: Сил нет, но вы опять соглашаетесь\nРечь: Вот что бывает, когда сил уже нет, но каждую свободную минуту вы считаете поводом еще что-нибудь сделать.\nПервое. Встреча отменилась, и вы сразу ставите стирку. Освободилось время, значит, надо его занять. Сколько осталось сил, вы даже не спросили.\nВторое. Вас просят помочь в выходной. Пишете «конечно», потом злитесь на себя.\nТретье. Закончили работу, заметили крошки на столе. Через полчаса уже моете плиту. Каждый раз кажется: вот еще это, и тогда отдохну.\nЧетвертое. Легли на диван, но в голове список дел. Даже лежа вы проверяете, достаточно ли сделали, чтобы иметь право лежать.\nСколько совпало?","caption":"Фраза «это же всего на пять минут» легко помогает согласиться еще на одну просьбу. Только после нее иногда приходится полчаса сидеть в тишине, чтобы больше никто ничего не спрашивал.","judge":{"zhivo":3,"zacep":3,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Сколько осталось сил, вы даже не спросили.","Фраза «это же всего на пять минут» легко помогает согласиться еще на одну просьбу."],"worst":"«Сколько осталось сил, вы даже не спросили.» — У кого спросили? Неестественная фраза вместо понятного «не подумали».","best":"Вас просят помочь в выходной. Пишете «конечно», потом злитесь на себя.","verdict":"popravit","why":"Бытовые сцены узнаваемые, текст легко произнести. Но список только подтверждает знакомое: стоит сократить вступление, поправить неестественную фразу и вместо подсчета совпадений объяснить, почему отдых приходится заслуживать."},"guard":[],"cut":["В календаре пусто, и этого вам достаточно, чтобы согласиться.","Эти полчаса мы редко учитываем, когда обещаем помочь."],"before":null}];const KEY='eval-2026-10-01_01-40_rilsy';

+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'
+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')
+((d.cut||[]).length?'<div class="cut">Вычеркнула: '+d.cut.map(x=>'<s>'+esc(x)+'</s>').join(' ')+'</div>':'')

c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
