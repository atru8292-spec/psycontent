ь психологу, что вас не устраивает, и получить внятный ответ."],"before":null},{"id":"z_zapis_2_post","author":"Юлия","format":"post","asked":"post","intent":"priglashenie","topic":"открываю запись на осень: с чем ко мне можно прийти","text":"Ты спрашиваешь, когда вы увидитесь, а потом извиняешься, что опять давишь на него.\n\nПеречитываешь переписку, ищешь, где сказала лишнее. Собираешься объяснить, что тебе обидно, но сначала долго думаешь, как бы он из-за этого не ушел.\n\nНедавно увидела в комментариях: «Лучше бы я вообще ничего не спрашивала». Мне горько это читать: женщина хотела договориться о встрече, а теперь готова отказаться от самого вопроса, лишь бы мужчина продолжал с ней общаться.\n\nЯ открываю запись на осень. Если ты узнаешь себя в этих ситуациях, с этим можно прийти ко мне, даже если ты пока сама не понимаешь, почему тебе так трудно.\n\nНа первой встрече я предложу рассказать, что сейчас происходит между вами и в какие моменты тебе особенно тяжело. Буду задавать вопросы, чтобы вместе разобраться, с чем тебе нужна помощь.\n\nПриглашаю тебя на консультацию. Для записи напиши мне в личные сообщения.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Недавно увидела в комментариях: «Лучше бы я вообще ничего не спрашивала | ». Мне горько это читать: женщина хотела догов"}],"cut":["Так можно постепенно привыкнуть считать отношения хорошими, пока ты ничего в них не просишь.","И каждую ссору переживать как доказательство, что ты слишком многого хочешь."],"before":null}];const KEY='eval-2026-10-21_15-23-04_rilsy_p_zh4_roli';
