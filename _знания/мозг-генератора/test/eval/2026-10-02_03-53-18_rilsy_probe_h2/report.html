<script>
const DATA=[{"id":"r_post_1","author":"Юлия","format":"post","asked":"post","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Ты уже открыла чат, чтобы написать ему, и закрыла: «Хочу, чтобы он сам вспомнил».\n\nИ вот телефон лежит рядом весь вечер. Экран загорелся, ты сразу смотришь. Доставка, рабочий чат. Да сколько можно, все пишут, кроме него.\n\nТебе важно узнать, вспомнит ли он о тебе без напоминания. Написать самой легко. Но тогда останется вопрос: «А если бы я промолчала, мы бы сегодня вообще поговорили?»\n\nИ ты ждешь.\n\nПотом начинаются эти почему. Он же был в сети. Почему не написал? Вчера сам пожелал спокойной ночи. Что сегодня изменилось? Открываешь переписку, перечитываешь последнее сообщение. «Может, я что-то лишнее сказала?»\n\nСколько всего ты уже успела решить про себя за один вечер. Даже виноватой себя почувствовать. А вы еще ни слова сегодня друг другу не сказали.\n\nКогда он наконец пишет, становится легче. Ты отвечаешь и уже ждешь следующего сообщения. Если он опять пропадает, вопросы возвращаются.\n\nТак ожидание превращается в ежедневную проверку: «Я ему еще нужна?» И ответ ты ищешь во времени последнего входа в сеть.\n\nЕсли тебе важно, чтобы он тоже начинал разговор, обсуди с ним это прямо. По одному вечеру без сообщения трудно понять, что между вами происходит. Но и делать вид, что тебя устраивает общение, которое каждый раз начинаешь ты, тебе незачем.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"крыла чат, чтобы написать ему, и закрыла: «Хочу, чтобы он сам вспомнил». | ь самой легко. Но тогда останется вопрос: «А "}],"cut":["Так хочется получить подтверждение, что он тоже хочет с тобой общаться.","Каждое новое сообщение успокаивает тебя только до следующей паузы."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"«Скоро поймут, что я ничего не умею»\n\nВы можете годами хорошо работать и продолжать ждать разоблачения. Особенно если после каждой выполненной задачи думаете: «Хорошо, что я все перепроверил. Иначе точно бы облажался».\n\nЕсли вы перед отправкой отчета проверили его шесть раз, потом еще раз вечером, а утром получили «спасибо, все подходит», вы легко делаете вывод: спасла седьмая проверка. В следующий раз без нее уже страшно.\n\nХотя вы даже не знаете, была ли она нужна.\n\nПредставьте: отчет готов еще в четыре. Но вы снова открываете таблицу, сверяете цифры, перечитываете пояснения. Коллеги уже ушли. Вы находите лишний пробел и думаете: «Вот, хорошо, что посмотрел».\n\nПробел! Из-за него никто бы не решил, что вы зря получаете зарплату. Но теперь у вас есть еще один повод в следующий раз сидеть допоздна.\n\nВсе удачные результаты объясняются тем, что вы вовремя подстраховались. Собственным знаниям почти ничего не достается.\n\nЯ бы предложил начать с одной знакомой задачи. Заранее определите, какая проверка ей действительно нужна по рабочим требованиям. Сделайте ее и отправьте результат. Дополнительную проверку, которую хочется устроить только ради успокоения, пропустите.\n\nПоначалу вам все равно будет страшно. Готовый отчет можно отправить, даже если вы еще волнуетесь.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"после каждой выполненной задачи думаете: «Хорошо, что я все перепроверил. Иначе | о, все подходит», вы легко делаете выв"}],"cut":["У мозга есть привычка запоминать, что помогло избежать неприятностей.","Так вы и остаетесь человеком, которого якобы вот-вот раскусят."],"before":null},{"id":"r_car_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Слайд 1: Подруга с депрессией перестала вам отвечать\n\nСлайд 2: Вы пишете подруге: «Как ты? Чем помочь?» Видите, что сообщение прочитано. Ответа нет.\n\nПри депрессии даже ответ близкому человеку может требовать сил, которых сейчас мало. Нужно объяснить свое состояние, подобрать слова. Она открывает переписку, думает «потом отвечу» и закрывает.\n\nСлайд 3: Подруга соглашается встретиться, потом отменяет.\n\nОна могла действительно хотеть вас увидеть. Но перед выходом нужно помыться, одеться, добраться. Сегодня это кажется неподъемным. А еще она думает: «Сейчас опять испорчу ей вечер». Отменяет и чувствует себя еще хуже.\n\nСлайд 4: На вопрос «Чего тебе хочется?» подруга отвечает: «Не знаю».\n\nВы предлагаете кафе, кино, прогулку. Она снова не знает. При депрессии бывает трудно почувствовать желание и принять даже маленькое решение. С каждым новым вариантом ей все неловче: вы стараетесь, а она ничего выбрать не может.\n\nСлайд 5: Подруга резко отвечает на ваше «Может, выйдем прогуляться?»\n\nРаздражительность тоже бывает при депрессии. Когда сил мало, даже доброе предложение звучит как еще одно дело, которое надо выполнить. Вас это может задеть. Но одна резкая реплика еще не означает, что ваша дружба ей безразлична.\n\nСлайд 6: Подруга извиняется каждый раз, когда вы ей пишете.\n\n«Прости, что пропала». «Прости, я опять ною».\n\nЕй плохо, и вдобавок кажется, что она вас подводит. Бл*ть, даже за свое молчание приходится оправдываться. Чем дольше она не отвечает, тем труднее вернуться в переписку.\n\nСлайд 7: Если каждый разговор начинается с «Почему ты опять пропала?», подруге придется объяснять еще и свое молчание.\n\nДаже теплое «Расскажи мне все» сейчас может быть слишком большой просьбой. Можно оставаться рядом и без подробного отчета о том, как ей плохо.\n\nСлайд 8: Предложите одну небольшую помощь, на которую легко ответить: привезти ужин или купить нужные продукты.\n\nСразу уточните, что встречать вас и разговаривать необязательно. Если она согласится, оставьте пакет у двери.","caption":"Когда близкий человек замолкает, легко решить: «Я ей больше не нужна». От этого тоже бывает больно. Поэтому я бы не стала требовать от вас бесконечного терпения.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40 лет.\nОтправьте тому, кто сейчас переживает за подругу.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Вы пишете подруге: «Как ты? Чем помочь?» Видите, что сообщ | то кажется неподъемным. А еще она думает: «Сейчас опять исп"},{"rule":"ostorozhno","quote":"8 оговорок: может, бывает, может быть"}],"cut":["Вы тоже живой человек.","Это чувство вины перед близкими.","Ваше участие ценно и в дни, когда разговор не получается.","Ей не придется собираться с силами, чтобы принять вашу помощь."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Уже съехали, все еще боитесь маминой обиды\nРечь: Четыре признака, что вы живете отдельно, но до сих пор планируете день с учетом маминых обид.\nПервое. Вы заранее оправдываетесь. Перед встречей с друзьями пишете маме, почему вечером будете недоступны. Как будто вам опять надо отпроситься.\nВторое. Отдыхаете с чувством вины. Сериал уже включили, но думаете: «Позвоню сначала, иначе потом начнется». Блядь, даже вечер на диване надо согласовать.\nТретье. Звоните без желания разговаривать. Новостей нет, сил тоже. Главное, чтобы мама потом не сказала: «Совсем про меня забыла».\nЧетвертое. Радуетесь, когда мама сама занята. Она говорит: «Сегодня некогда», и вам сразу легче.","caption":"Пропущенный звонок вы объясняете подробно, вплоть до того, во сколько закончилась встреча. Хотя вам давно уже тридцать.\nЯ Ольга, психолог. Работаю со взрослыми, которые съехали от родителей, а сложности в отношениях остались.\nПодписывайтесь, если хочется еще такого. Здесь говорим о своей жизни и отношениях с родителями.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ом вины. Сериал уже включили, но думаете: «Позвоню сначала, иначе потом начнется» | же. Главное, чтобы мама потом не ска"}],"cut":["Вы привыкли отвечать за то, чтобы она не расстраивалась.","Можно спокойно провести вечер без звонка, потому что на этот раз мама сама его отменила."],"before":null}];const KEY='eval-2026-10-02_03-53-18_rilsy_probe_h2';
let R={};try{R=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'

+((d.cut||[]).length?'<div class="cut">Вычеркнула: '+d.cut.map(x=>'<s>'+esc(x)+'</s>').join(' ')+'</div>':'')

+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')

c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});

m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
