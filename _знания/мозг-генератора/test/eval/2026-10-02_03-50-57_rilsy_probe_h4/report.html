<script>
const DATA=[{"id":"r_post_1","author":"Юлия","format":"post","asked":"post","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Ты открываешь чат с ним, хотя прекрасно знаешь: нового сообщения там нет.\n\nИ снова смотришь, когда он был в сети. Был десять минут назад. Значит, телефон в руках держал. «А мне почему не написал?»\n\nСамой написать хочется. Уже даже придумала что. Но тогда ведь так и не узнаешь, вспомнил бы он о тебе сам.\n\nВот чего ты ждешь весь вечер: чтобы он сам захотел с тобой поговорить. Без напоминания. Потому что после твоего сообщения даже теплый ответ можно обесценить: «Ну я же первая написала. Что ему, игнорировать меня?»\n\nПодруге отвечаешь сразу, а его чат оставляешь открытым. Включаешь сериал, потом перематываешь: опять пропустила, что там произошло. Думаешь: «Все, больше не проверяю». И через пять минут проверяешь.\n\nПотом он пишет обычное «как день?», и ты прямо оживаешь. Уже и вечер хороший, и сериал можно досмотреть. Хотя еще минуту назад думала, что ему вообще на тебя все равно.\n\nТак его инициатива становится для тебя доказательством: «Я ему нужна». Только хватает этого доказательства до следующего вечера, когда он снова молчит.\n\nНо по одному молчащему чату ты уже пытаешься решить, интересна ли ты ему вообще.\n\nПосмотри, как он общается с тобой в целом: предлагает ли увидеться, хочет ли узнать тебя. Один вечер без сообщения слишком мало говорит о ваших отношениях, чтобы из-за него отменять свой.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"рываешь чат с ним, хотя прекрасно знаешь: нового сообщения там нет. | Вот чего ты ждешь весь вечер: чтобы он сам захотел"}],"cut":["Тебе правда важно, чтобы он тоже проявлял интерес.","С этим все понятно."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Вас похвалили, и стало страшнее\n\nРуководитель доволен вашей работой, а вы думаете: «Теперь мне дадут что-нибудь посложнее. Вот тогда все и выяснится».\n\nПолучается странная вещь: вы справились, но уверенности больше не стало. Иногда после удачной задачи страх, что вас раскусят, даже усиливается.\n\nЕсли вы сдавали работу после бесконечных проверок, легко решить: «Хорошо, что все перепроверил. Иначе был бы позор». Так каждая удачная задача убеждает вас, что в следующий раз проверять надо еще тщательнее.\n\nДопустим, нужно отправить отчет. Вы его подготовили, проверили цифры. Уже пора отправлять, но вы снова открываете таблицу. Потом перечитываете письмо. Потом представляете, что руководитель спросит про каждую строчку.\n\nОтправили. Все приняли, вопросов нет.\n\n«Повезло. Я же весь вечер над этим сидел».\n\nВы почти не учитываете, что сами разобрались в задаче и нашли решение. Зато отлично помните, сколько нервничали. В следующий раз снова придется потратить весь вечер, чтобы почувствовать себя хоть немного спокойнее.\n\nЯ бы здесь обратил внимание на одну вещь: если для вас любой хороший результат объясняется тем, что вы перестраховались, откуда взяться уверенности в своих умениях? Вы каждый раз находите причину себе ее не засчитать.\n\nДля следующей обычной задачи заранее определите, какой проверки достаточно, чтобы ее сдать. Сверьте это с требованиями руководителя, если они непонятны.\n\nРаботу можно отправлять, даже если вы все еще волнуетесь. Ждать полной уверенности перед каждым письмом очень утомительно.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"тель доволен вашей работой, а вы думаете: «Теперь мне дадут что-нибудь посложнее. | Получается странная вещь: вы справил"}],"cut":["У психики есть привычка запоминать, что помогло избежать неприятностей.","И вот это «весь вечер сидел» становится объяснением успеха."],"before":null},{"id":"r_car_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Слайд 1: Вы помогли подруге, а она молчит\n\nСлайд 2: Вы привезли подруге еду, вечером спрашиваете «Ну как, поела?», а она так и не открыла сообщение.\n\nПри депрессии даже на этот ответ нужны силы. А теперь ей еще нужно объяснить, почему еда стоит в холодильнике. И она откладывает ответ еще дольше.\n\nСлайд 3: Помощь тоже может стать заданием.\n\nПоесть, выйти на прогулку, потом сообщить, что стало лучше. Вы хотите понять, помогли ли вы. Но подруга может начать думать, что теперь обязана порадовать вас результатом. А ей по-прежнему плохо.\n\nСлайд 4: Подруга говорит «Да, уже получше», но почти ничего не рассказывает.\n\nЕй может быть стыдно снова отвечать, что день прошел в кровати. Особенно если вы столько для нее сделали. «Мне и так п*здец, еще и ее расстроила».\n\nСлайд 5: Подруга отказывается от вашей идеи погулять, хотя вчера согласилась.\n\nВчера ей казалось, что получится. Сегодня она думает о душе и о том, что придется поддерживать разговор. Соглашаясь на прогулку, она правда могла хотеть увидеться с вами. Отказ сегодня этого не отменяет.\n\nСлайд 6: Подруга шутит при встрече, и вы решаете, что ей уже легче.\n\nХорошо, что вы смогли вместе посмеяться. Только этот смех еще ничего не говорит о том, как ей живется весь остальной день. Ей не нужно выглядеть несчастной каждую минуту, чтобы вы продолжали воспринимать ее состояние всерьез.\n\nСлайд 7: Если каждый разговор заканчивается вопросом «Ну тебе хоть немного лучше?», подруга может начать реже писать.\n\nОна уже знает, какой ответ вас обрадует, и ей трудно снова вас огорчать. Поэтому важно прямо сказать: вы готовы услышать, что ей все еще плохо. Даже после вашей помощи.\n\nСлайд 8: Спросите подругу, какая помощь ей сейчас удобна. И скажите, что отвечать сразу и отчитываться о самочувствии не обязательно.\n\nЕй можно оставаться с вами на связи, даже когда хороших новостей НЕТ.","caption":"Вам тоже может быть тяжело рядом с подругой, у которой депрессия. Если сегодня нет сил на разговор, об этом можно сказать.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40.\nОтправьте тому, кто хочет поддержать подругу и боится сделать хуже.","judge":null,"guard":[{"rule":"ostorozhno","quote":"5 оговорок: может, может быть"}],"cut":["Это понятно.","Так появляется стыд перед человеком, который помогает."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Мама обижается, если вы день не звоните\nРечь: Четыре признака для тех, кто боится пропустить звонок маме.\nПервое. Вы считаете часы до ее обиды. Вечером еще работаете, а в голове: «Блядь, надо позвонить, сейчас начнется».\nВторое. Вы заранее готовите оправдание. Просто захотеть тишины после работы недостаточно. Нужна причина, которую мама одобрит.\nТретье. Вам трудно радоваться, когда мама недовольна. Сидите с друзьями, проверяете телефон: «Она там одна расстроенная, а я тут смеюсь». Уже хочется домой, хотя вечер хороший.\nЧетвертое. После звонка вам легче, даже если поговорили ни о чем. Мама довольна, можно спокойно смотреть сериал. И завтра вы снова позвоните, чтобы весь вечер не мучиться чувством вины.","caption":"Можно жить отдельно и перед каждой покупкой для себя думать: «Лучше бы маме что-нибудь заказала». Особенно если вчера она сказала, что вы совсем про нее забыли.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые уже съехали от родителей.\nПодписывайтесь, если хочется еще таких разборов отношений с родителями.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"обиды. Вечером еще работаете, а в голове: «Блядь, надо позвонить, сейчас начнется | а. Сидите с друзьями, проверяете тел"}],"cut":["Вы чувствуете себя ОБЯЗАННОЙ исправить ее настроение."],"before":null}];const KEY='eval-2026-10-02_03-50-57_rilsy_probe_h4';

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}};

fs.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;fsel.appendChild(o)});
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')
+'<div class="rate"><button data-m="ok" class="'+(r.mark==='ok'?'on':'')+'">Живо</button><button data-m="bad" class="'+(r.mark==='bad'?'on':'')+'">Не живо</button><input placeholder="что не так" value="'+esc(r.note||'')+'"></div>';
c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
