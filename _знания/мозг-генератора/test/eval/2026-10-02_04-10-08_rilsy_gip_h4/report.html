<script>
const DATA=[{"id":"r_mif_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: Я и другу могу выговориться\n\nРечь: «Зачем платить психологу? Я и другу могу выговориться». Можете. Но слушать и сочувственно кивать для работы психолога недостаточно.\n\nВот начальник написал: «Зайдите ко мне». Вы уже вспоминаете, где ошиблись. Открываете вчерашний отчет, проверяете каждую цифру. Хотя он еще ничего не сказал.\n\nЯ бы спросил: «Почему вы решили, что вас будут ругать?» И мы бы разобрали, как вы из двух слов сделали вывод, из-за которого теперь страшно идти в кабинет.\n\nВы можете рассказывать как получается, хоть путаться, хоть повторяться. А объяснить, что мы делаем и зачем, обязан психолог. Просто сидеть и ждать, когда вам станет легче, недостаточно.","caption":"На первой встрече тоже можно спрашивать, как будет устроена работа.\nЯ Михаил, психолог, работаю с теми, кто впервые обращается за помощью.\nОтправьте тому, кто сомневается, стоит ли идти к психологу.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Вот начальник написал: «Зайдите ко мне». Вы уже вспоминаете, г | Я бы спросил: «Почему вы решили, что вас будут ругать"}],"cut":["Психолог помогает замечать такие выводы и проверять, насколько они верны.","Для этого не нужно разбираться в психологии."],"before":null},{"id":"r_vopros_1","author":"Ольга","format":"reels_otvet","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Зачем мне психолог, если у меня есть подруги?\nРечь: Зачем мне психолог, если у меня есть подруги? Вот подруга выходит замуж. Вы радуетесь за нее, но вас накрывает: «Блядь, почему у меня опять ничего?» И ей вы рассказываете только про радость. Потому что любите ее, хотите сохранить дружбу. А зависть куда? С кем ее обсудить, если вы в одной компании? С психологом можно сказать все это вслух. И всю встречу обсуждать свою зависть, без необходимости потом спрашивать: «Ну, а у тебя как дела?»","caption":"Подруга тоже может быть психологом. Но она уже участвует в вашей жизни, у вас есть своя история отношений.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nСохраните, если тоже задавались этим вопросом.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ж. Вы радуетесь за нее, но вас накрывает: «Блядь, почему у меня опять ничего?» И | исть, без необходимости потом спрашив"}],"cut":["Чтобы говорить о себе и не заботиться еще и обо мне.","С подругами у вас общая жизнь, вы учитываете их чувства."],"before":null},{"id":"r_post_1","author":"Юлия","format":"post","asked":"post","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Ты открываешь чат с ним, хотя телефон даже не вибрировал. Вдруг пропустила?\n\nПотом кладешь телефон экраном вверх. Включаешь сериал. Через две минуты снова проверяешь.\n\nТебе важно, чтобы он сам написал. Потому что тогда можно хоть ненадолго успокоиться: «Вспомнил обо мне. Значит, я ему нужна».\n\nНаписать первой ты вполне можешь. Уже даже придумала что. Но тут же: «Если напишу, он просто ответит. А сам бы он вообще вспомнил?»\n\nВот поэтому сообщение, которое отправляется за пять секунд, превращается в ожидание на весь вечер. Ты хочешь узнать, тянется ли он к тебе, когда ты сама ничего для этого не делаешь.\n\nИ начинаются проверки. В сети был? Сторис посмотрел? Посмотрел. «То есть в телефон зайти успел, а мне написать нет?»\n\nТы уже злишься. Решила, что сегодня точно писать не будешь. Потом видишь что-то смешное и думаешь: «Это можно скинуть. Я же просто делюсь». И опять останавливаешь себя.\n\nА когда он наконец пишет, облегчение быстро проходит. Теперь хочется понять, почему так поздно. Чем занимался. Почему раньше не мог. Вопросов снова много, много.\n\nА завтра вечером придется проверять заново.\n\nЕсли разговоры все время начинаешь ты, поговори с ним об этом прямо. Ему важно знать, что тебе тоже хочется получать сообщения первой.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"о тогда можно хоть ненадолго успокоиться: «Вспомнил обо мне. Значит, я ему нужна» | ожешь. Уже даже придумала что. Но ту"}],"cut":["Одного сообщения тебе мало, потому что ты пытаешься по нему понять, как он вообще к тебе относится.","Хотеть, чтобы он тоже проявлял инициативу, нормально."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"«Хоть бы не спросили, как я сделал»\n\nВы сдали задачу, получили «отлично», а потом подумали: «Знали бы они, сколько я гуглил».\n\nИ похвала уже как будто не считается. Вы же искали примеры, переделывали, в одном месте спросили коллегу. Теперь страшно, что вам дадут задачу посложнее и все выяснится.\n\nДавайте посмотрим, что именно должно выясниться. Что вы не знали готового ответа? Что первый вариант не получился? Пока что вы описали обычную работу специалиста. Но у себя в голове уже записали это в доказательства собственной непригодности.\n\nВы ждете от себя очень конкретного признака: если я действительно умею, я должен сразу знать, как сделать. Без поисков и чужой помощи. И все, что получилось с усилиями, вы отказываетесь считать своим умением.\n\nВы закрыли сложную задачу, но помните прежде всего тот вечер, когда сидели перед экраном и думали: «Вообще не понимаю, с чего начать». Разобрались потом? Да. Только это у вас почему-то уже не считается.\n\nУ коллеги вы видите готовый результат. Его открытые вкладки и переписку с вопросом «слушай, ты с таким сталкивался?» вы можете вообще не увидеть.\n\nЯ бы здесь пересмотрел само требование к себе. Почему специалист должен все знать заранее? На работе постоянно приходится разбираться с тем, чего раньше не делал.\n\nЕсли вы нашли решение, проверили его и сделали задачу, у вас есть вполне конкретное умение. Даже если по дороге пришлось много гуглить.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"чу, получили «отлично», а потом подумали: «Знали бы они, сколько я гуглил». | ждете от себя очень конкретного признака: "}],"cut":["Вот почему опыт прибавляется, а уверенности все нет.","И получается, что все вокруг умеют, а вы каким-то образом выкручиваетесь."],"before":null},{"id":"r_car_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Слайд 1: Подруга с депрессией не отвечает на сообщения\n\nСлайд 2: Вы пишете подруге: «Как ты?», видите, что прочитано, и ждете ответа.\n\nА ей теперь нужно подобрать слова. Решить, сколько рассказывать. Успокоить вас, если вы испугаетесь.\n\nСлайд 3: Подруга читает сообщения и молчит.\n\nПри депрессии бывает трудно даже коротко объяснить, как прошел день. Особенно когда весь день лежала и сама себя за это ругала. Она может хотеть вашего общения и при этом откладывать ответ до вечера. Потом до завтра.\n\nСлайд 4: Подруга опять отменяет встречу.\n\nВы уже выбрали тихое кафе, чтобы ей было комфортно. Но до кафе еще нужно помыться, одеться, выйти из дома. Она соглашалась, потому что хотела увидеться. А когда пришло время собираться, сил на все это не оказалось.\n\nСлайд 5: Подруга говорит «не знаю», когда вы спрашиваете, чем помочь.\n\nЧтобы ответить, ей нужно придумать задачу для вас. Потом решить, не слишком ли много она просит. В голове уже: «Бл*ть, даже это нормально объяснить не могу». Ваше предложение она услышала.\n\nСлайд 6: Подруга почти не реагирует на ваши попытки ее порадовать.\n\nВы принесли любимый десерт, а она съела пару ложек и убрала. При депрессии привычные вещи могут перестать радовать. Если ждать улыбки, ей придется ЕЩЕ и изображать, что стало лучше, чтобы вас не расстроить.\n\nСлайд 7: Подруга начинает отвечать «все нормально», хотя ей по-прежнему плохо.\n\nТак бывает, когда после каждого честного ответа начинается обсуждение: куда сходить, чем заняться, что попробовать. Ей приходится объяснять, почему она опять ничего не может. И в следующий раз проще промолчать.\n\nСлайд 8: Договоритесь с подругой об одном небольшом деле, которое вы возьмете на себя. Например, привезете готовый ужин, если она согласна.\n\nПусть ей не придется ради вашей помощи собираться, развлекать вас и показывать, что ей уже лучше.","caption":"Я бы убрала из поддержки проверку «ну что, помогло?». Подруга может быть рада, что вы рядом, даже если сегодня совсем этого не видно.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40.\nПодписывайтесь, если хочется еще таких разговоров. Здесь я пишу об отношениях и о том, как нам бывает трудно.","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"},{"rule":"dvoetochiya","quote":"Вы пишете подруге: «Как ты?», видите, что прочитано, и жде | лишком ли много она просит. В голове уже: «Бл*ть, даже это "},{"rule":"ostorozhno","quote":"7 оговорок: бывает, может, могут, может быть"}],"cut":["Даже заботливое сообщение может стать делом, на которое сейчас нет сил.","Сформулировать просьбу тоже бывает тяжело."],"before":null},{"id":"r_mif_2","author":"Юлия","format":"post","asked":"post","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"«Просто не думай о плохом, и тревога пройдет».\n\nЕсли бы мысли выключались по просьбе, ты бы давно это сделала.\n\nОн долго не отвечает. Ты уже думаешь: «Я что-то не то сказала?» Потом вспоминаешь, что сама себя накручиваешь, и начинаешь ругать себя: «Ну почему я опять так? Нормальные люди спокойно ждут».\n\nБудто тревога доказывает, что ты какая-то неправильная. Уже и спросить у кого-то поддержки стыдно. Тебе же объяснили: ты сама виновата, надо просто перестать.\n\nВот с этим я не согласна. Первая тревожная мысль приходит без твоего согласия. Ты еще ничего не успела сделать, а в голове уже: «Он больше не хочет со мной общаться».\n\nДальше у тебя есть выбор. Перечитывать переписку, искать, где ты все испортила, отправлять еще одно сообщение. Или оставить телефон и дождаться ответа, даже если внутри пока тревожно.\n\nТы отвечаешь за свои действия. Обязанности немедленно успокоиться у тебя нет. Чтобы отложить телефон, тебе не нужно сначала перестать переживать.","caption":"","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не успела сделать, а"},{"rule":"dvoetochiya","quote":"Он долго не отвечает. Ты уже думаешь: «Я что-то не то сказала?» Потом вспомин | бя накручиваешь, и начинаешь ругать себя"}],"cut":["Теперь ты переживаешь еще и из-за того, что не можешь успокоиться.","За появление этой мысли ругать себя бессмысленно."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Живете отдельно, но обязаны звонить маме\nРечь: Четыре признака, что ежедневные звонки маме вас уже достали, но пропустить страшно.\nПервое. Вы звоните заранее, если вечером куда-то идете. Иначе весь вечер будете думать: «ВСЕ, обиделась».\nВторое. Вы оправдываетесь за пропущенный звонок. Рассказываете про совещания, хотя могли просто смотреть сериал. «Блядь, опять объяснять, что я делала».\nТретье. На мамино «ну наконец-то» начинаете говорить веселее. Пусть рассказывает сколько хочет, лишь бы перестала обижаться. Свою усталость обсудите потом с мужем.\nЧетвертое. Вас бесит, когда мама спокойно обходится без звонка. Вы весь день мучились, а она гуляла с подругой и прекрасно себя чувствовала.\nВы уже привыкли отвечать за мамино настроение. Хотя она умеет справляться и без вас.","caption":"После маминого «можешь вообще не звонить» рука сама тянется набрать ее снова.\nЯ Ольга, психолог. Работаю со взрослыми детьми 25-40 лет, которые съехали от родителей, но все еще переживают из-за их обид.\nЕсли узнали себя, напишите в комментариях «звонки».","judge":null,"guard":[],"cut":["Вроде вам только что предложили закончить разговор, но спокойно положить трубку почему-то еще труднее."],"before":null},{"id":"r_men_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Папы, которые терпят, потом кричат\nРечь: Четыре признака у отцов, которые весь день терпят, а дома срываются на детей.\nПервое. Вы обрываете себя, когда хочется плакать. После тяжелого разговора ком в горле, но вы уже командуете себе: «Соберись, хватит».\nВторое. Признаться, что обидно, трудно. Сказать «все достали» гораздо проще. Даже жене вы рассказываете только, кто вас разозлил.\nТретье. Просьба ребенка становится последней каплей. Он просит помочь с конструктором, вы кричите: «Дайте мне хоть пять минут!» До этого вы весь вечер молчали, что сил уже нет.\nЧетвертое. Детские слезы раздражают особенно сильно. Хочется сказать: «Из-за такой ерунды реветь?» К себе у вас ровно такое же требование.\nЧто вы говорите себе, когда хочется плакать?","caption":"На вопрос «Что случилось?» легко ответить «Ничего», даже когда очень хочется рассказать.\nМеня зовут Михаил, я психолог, работаю с мужчинами 30-45 лет, в том числе с отцами.\nЕсли узнали себя, можете написать в комментариях свой пункт.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"а ком в горле, но вы уже командуете себе: «Соберись, хватит». | росит помочь с конструктором, вы кричите: «Дайте мне хот"}],"cut":["И близкие так и остаются в неведении."],"before":null},{"id":"r_vopros_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: «А что говорить психологу?»\nПерсонажи: А это клиентка, Б это психолог\nА: Я пришла к психологу, а что говорить, не знаю.\nБ: Что сейчас приходит в голову?\nА: Что у меня какая-то ерунда. Даже рассказывать стыдно.\nБ: Что за ерунда?\nА: Мама обиделась, что я отказалась приехать. Теперь переживаю.\nБ: О чем переживаешь?\nА: Что она там одна. И что я плохая дочь.\nБ: А рассказывать почему стыдно?\nА: Вам люди такое рассказывают. А я опять про маму.\nБ: Ты боишься, что я подумаю?\nА: Что я ною. И вам уже надоело меня слушать.\nБ: Кто тебе обычно говорит, что ты ноешь?","caption":"На первой встрече можно достать заметки из телефона, если так спокойнее.\nЯ Юлия, психолог, работаю с теми, кто впервые собирается на терапию.\nНапиши в комментариях «начало», если тоже не знаешь, с чего начать.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_money_1","author":"Ольга","format":"post","asked":"post","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"Взять еще чужую задачу вам проще, чем спросить про свою зарплату.\n\nПотому что просьба о повышении для вас звучит как признание: «Я хочу больше». И тут стыдно. Вдруг решат, что зажралась?\n\nА если начальник сам заметит, сколько вы делаете, и повысит зарплату, тогда спокойно. Вы ничего не выпрашивали. Вас ценят. САМИ заметили.\n\nКоллега в отпуске, вы подхватили ее работу. Новый проект тоже у вас. Начальник пишет вечером, вы отвечаете, хотя уже легли. И каждый раз где-то внутри: «Ну теперь-то он видит».\n\nОн видит, что вы справляетесь. Вы ждете, что он еще и поймет, сколько вам за это надо платить. У него такого пункта в голове может вообще не быть.\n\nИ вот это, б*ять, обидно. Вы уже столько сделали, что просьба о деньгах кажется почти унизительной. Как будто вам теперь еще надо доказывать очевидное.\n\nПоэтому вы берете следующую задачу. Вдруг после нее наконец предложат сами.\n\nПросить страшно еще и потому, что могут отказать. Пока вы молчите, остается надежда: «Просто пока не заметили».\n\nДля разговора о повышении хватит того, что у вас вырос объем работы. Начните с этого на встрече с руководителем и обсудите конкретную сумму. Вам не нужно брать еще один проект, чтобы получить право спросить про деньги.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"о повышении для вас звучит как признание: «Я хочу больше». И тут стыдно. Вдруг ре | тя уже легли. И каждый раз где-то вн"}],"cut":["Вот вы и пытаетесь заслужить повышение так, чтобы вообще не пришлось о нем говорить."],"before":null},{"id":"r_body_1","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Тем, кто ругает свое тело перед отпуском\nРечь: Если перед отпуском ты смотришь в зеркало и думаешь: «Ну как я в таком виде пойду на пляж», послушай. Ты уже представляешь, как кто-то посмотрит на твой живот, что подумает, с кем сравнит. До отпуска еще неделя, а ты уже переживаешь чужое осуждение. И сама говоришь себе все самое обидное первой. Будто если заранее себя поругать, чужие слова потом меньше заденут. Только тебе больно уже сейчас. Ты собиралась отдохнуть, но теперь еще должна срочно похудеть, чтобы спокойно раздеться. Ты можешь поехать в отпуск с тем телом, которое у тебя сейчас.","caption":"Даже покупка купальника превращается в мучение, когда единственное требование к нему: «Чтобы ничего не было видно». Тут уже трудно понять, какой цвет тебе вообще нравится.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от 20 до 40 лет.\nЕсли хочешь прийти на консультацию, ссылка на запись в шапке профиля.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"отпуском ты смотришь в зеркало и думаешь: «Ну как я в таком виде пойду на пляж», | ие, когда единственное требование к н"}],"cut":["От этих мыслей тоже устают."],"before":null},{"id":"r_teen_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Слайд 1: Подросток закрылся в комнате и молчит\n\nСлайд 2: Вы спрашиваете: «Как дела в школе?» Подросток отвечает «нормально» и закрывает дверь. А вы ведь просто хотели поговорить.\n\nНо если следом обычно идут вопросы про оценки, уроки и его настроение, даже короткий ответ обещает ему длинный разговор.\n\nСлайд 3: Подросток уходит в комнату сразу после школы.\n\nДома тоже нужно объяснять, что случилось и почему у него такое лицо. А он сам еще толком не понял. Закрытая дверь дает ему время, когда можно вообще ничего не объяснять.\n\nСлайд 4: На ваши вопросы подросток отвечает: «Не знаю».\n\nВы спрашиваете, что его расстроило, предлагаете варианты. Он пожимает плечами. Даже с близким человеком разговор становится еще одним заданием, если обязательно нужно дать понятный ответ.\n\nСлайд 5: Подросток резко говорит: «Да все нормально!»\n\nВы слышите грубость и хотите разобраться. Он ждет, что сейчас придется объяснять еще и свой тон. Когда короткого ответа регулярно недостаточно, подросток начинает обрывать разговор заранее. Вы только подошли, а он уже раздражен.\n\nСлайд 6: Подросток весь вечер молчит, потом присылает вам смешное видео.\n\nТак тоже можно побыть вместе. Посмеяться и ничего серьезного не обсуждать. Если в ответ сразу спросить: «Ну теперь расскажешь, что случилось?», в следующий раз он может оставить это видео у себя.\n\nСлайд 7: Когда подросток сам начинает что-то рассказывать, дайте ему договорить. С советами и дополнительными вопросами можно подождать.\n\nЕму важно убедиться, что с вами можно поделиться одной мелочью и на этом закончить разговор.","caption":"Родителю тоже тяжело стоять перед закрытой дверью. Хочется хоть что-нибудь узнать, чтобы меньше тревожиться.\n\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Вы спрашиваете: «Как дела в школе?» Подросток отвечает | На ваши вопросы подросток отвечает: «Не знаю». | Подросток резк"}],"cut":["Это может быть усталость от расспросов.","Отсюда и появляется следующий вопрос."],"before":null},{"id":"r_vybor_1","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Почему мне нужен тот, кому я не нужна?\nРечь: «Почему я опять жду сообщения от мужчины, которому явно не до меня?»\n\nКогда чужое равнодушие для вас означает «со мной что-то не так», очень хочется добиться внимания именно этого человека. Чтобы он передумал. Тогда и вы сможете перестать считать себя какой-то неправильной.\n\nВот он неделю не пишет. Вы уже решили, что хватит. А вечером от него: «Как ты?» Все, вы улыбаетесь в телефон, хотя днем злились. И снова тянете разговор. Блядь, опять все сама.\n\nЭти два слова так радуют, потому что появляется надежда: «Значит, я ему все-таки нужна».","caption":"Даже подругам уже стыдно рассказывать, что вы снова с ним общаетесь. И приходится защищать его перед ними, хотя самой хочется спросить, какого хр*на он вообще объявился.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nОтправьте этот ролик той, кому сейчас нужно это услышать.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"же решили, что хватит. А вечером от него: «Как ты?» Все, вы улыбаетесь в телефон, | ак радуют, потому что появляется над"}],"cut":["Поэтому так трудно закончить общение.","Очень хочется, чтобы именно он подтвердил, что вы достойны любви."],"before":null},{"id":"r_zlost_1","author":"Юлия","format":"post_tg","asked":"post_tg","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"«На близких злиться нельзя»\n\nЕще как можно. Я бы вообще с этой фразой была осторожна.\n\nПосле нее ты лежишь ночью и думаешь: «Почему меня все бесит? Они же ничего плохого не хотели». Потом вспоминаешь, сколько для тебя сделали, и становится стыдно. Уже и злость свою обсуждать вроде неприлично.\n\n«Она же добра тебе желает».\n\nДопустим, мама приехала помочь с ребенком. Ты правда рада, что удалось спокойно сходить к врачу. Но заодно услышала, что ребенка ты кормишь неправильно и дома у тебя вечный бардак. И вот ты уже убеждаешь себя: «Она устала. Нельзя было ее просить».\n\nХотя тебе было обидно это слушать. Помощь ты тоже заметила.\n\n«Он столько для тебя делает».\n\nДа, делает. Забрал тебя с работы, когда шел дождь. А вечером при друзьях рассказал то, что ты просила оставить между вами. Ты хочешь сказать, что злишься, но вспоминаешь про поездку. Как будто теперь должна промолчать.\n\nВот здесь и появляется это «я никогда не злюсь». Ты успеваешь запретить себе злость раньше, чем толком поймешь, что тебя задело. У близкого ведь нашлось оправдание. А у тебя сразу нашлась вина.\n\n«Надо быть благодарной».\n\nСогласна. Только благодарность за помощь не обязывает соглашаться со всем, что человек потом говорит и делает. Он помог тебе. Это важно. Тебе больно от его слов. Это тоже важно.\n\nТы отвечаешь за то, как обходишься со своей злостью. Кричать, унижать, мстить, конечно, нельзя. Но само чувство никому не причиняет вреда. И близкому человеку не обязательно понравится, что ты чем-то недовольна. Его недовольство еще не делает тебя виноватой.\n\nЕсли тебя задели, ты можешь сказать об этом и попросить больше так не делать. Даже если этот человек очень много тебе помогал.","caption":"","judge":null,"guard":[{"rule":"mini_vyvod","quote":"Это важно."},{"rule":"dvoetochiya","quote":"После нее ты лежишь ночью и думаешь: «Почему меня все бесит? Они же ничего п | чный бардак. И вот ты уже убеждаешь себя:"}],"cut":["Одно чувство другое не отменяет."],"before":null},{"id":"r_humor_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"Текст на экране: Голосовое подруге, которая психолог\nРечь: Слушай, ты же психолог, мне ПРОСТО поговорить. Ты сегодня после клиентов свободна? Отлично, будешь уже настроена. Я тебе пока переписку с мужем скину, там немного, с февраля. Прочитай до встречи, чтобы мы время не теряли. И скажи, почему я так реагирую. Только подробно, ты же меня знаешь. Нахуй мне объяснять чужому человеку всю жизнь, если у меня есть ты? Что с меня? Вино принесу! Только пить тебе нельзя, мне важно, чтобы ты внимательно слушала. А про тебя потом поговорим. Я нас записала на каждую среду. Если отменишь, предупреди заранее, я тяжело переношу отвержение.","caption":"После такого разговора подруга помнит все про ваш брак и даже не знает, что вы сменили работу. Зато вино принесла.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого, здесь я говорю про отношения и все, что в них бесит.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_malysh_1","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"Текст на экране: Почему так страшно сказать «нет»\nРечь: Хорошие мои, вас просят помочь, вы уже устали, но сказать «нет» страшно. Животик сжался. «Вдруг обидится?»\n\nЕсли раньше после вашего отказа с вами переставали разговаривать, вы запомнили: чтобы меня любили, надо соглашаться. Будто между вами дверца. Сказали «нет», и ее закроют.\n\nТеперь подруга просит приехать. Вы хотите остаться дома, но уже пишете: «Конечно, сейчас буду». Блядь, даже сумку собрали, хотя сил только лежать.\n\nДавайте дверцу пока оставим в покое. Не надо сразу писать следом: «Ладно, я приеду».\n\nПодруга может расстроиться из-за вашего отказа и все равно вас любить.","caption":"После отказа бывает особенно трудно выдержать паузу в переписке. Рука сама тянется отправить еще одно объяснение, хотя вы уже все объяснили.\nЯ Ольга, психолог, работаю с женщинами, которым трудно перестать быть удобными.\nЕсли знакомо, напишите в комментариях слово «нет».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"переставали разговаривать, вы запомнили: чтобы меня любили, надо соглашаться. Бу | . Вы хотите остаться дома, но уже пиш"}],"cut":["Вы боитесь, что после отказа человек больше не захочет с вами общаться.","Поэтому соглашаетесь еще до того, как он успел отреагировать."],"before":null},{"id":"r_malysh_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"Текст на экране: На маму обиделась, себя отругала\nРечь: Милая, тебе обидно на маму, и ты сразу себя ругаешь? «Она столько для меня сделала. Как я вообще могу на нее злиться?»\n\nСмотри, обида как заноза. Если ее получила от мамы, она все равно колется. Даже если мама тебя любит. Даже если много хорошего для тебя сделала.\n\nЕсли в детстве на твое «мне больно» мама отвечала «ты меня расстраиваешь», ты училась быстренько ее жалеть. Своя заноза подождет. Маме же плохо.\n\nИ теперь мама сказала что-то обидное, а ты уже переживаешь, как бы ее не огорчить.\n\nТы можешь любить маму и сердиться на нее.","caption":"Бывает, после маминого звонка плачешь, а потом сама ей перезваниваешь: вдруг она расстроилась. До своей обиды так и не добираешься.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nПодписывайся, если хочется еще таких разговоров. Здесь про отношения с мамой и свою взрослую жизнь.","judge":null,"guard":[],"cut":["Солнышко, можно пока побыть обиженной.","Без оправданий, какая мама хорошая."],"before":null},{"id":"r_drug_1","author":"Михаил","format":"post","asked":"post","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Друг молчал месяц, а после ссоры с партнером написал вам, и вы уже отложили свои дела, чтобы его выслушать.\n\nВы даже рады: наконец поговорим. Спрашиваете, что случилось, сидите с телефоном до ночи. Про свой день так и не рассказали. Ладно, ему сейчас тяжело.\n\nПотом у него все налаживается. Вы пишете: «Ну как ты?» Получаете «Все хорошо, спасибо!» И снова тишина.\n\nВы знаете подробности каждой ссоры, но о том, что они помирились и вместе уехали отдыхать, узнаете из сторис. Как все.\n\nИ вот что здесь трудно заметить: вы тоже начинаете ждать чужих неприятностей. Конечно, вы не желаете другу плохого. Просто после сообщения «Мне ужасно, можно позвонить?» у вас появляется знакомое чувство: «Я ему все еще нужен».\n\nА написать без повода уже неловко. «У него все хорошо, чего я буду лезть». Свои трудности вы придерживаете: «У него и так хватает проблем».\n\nДруг при этом вполне может быть к вам привязан. Только он привык обращаться к вам за помощью. А вы каждый раз соглашаетесь на разговор, в котором обсуждается только его жизнь. Так можно годами дружить и чувствовать себя одиноко.\n\nПредложите встретиться просто так, когда у него все спокойно. Вам тоже нужно понять, хочет ли он проводить с вами время, когда его не требуется спасать.","caption":"","judge":null,"guard":[{"rule":"skrytoe_protivopostavlenie","quote":"не желаете другу плохого. Просто"},{"rule":"kancelyarit","quote":"при этом"},{"rule":"dvoetochiya","quote":"Вы даже рады: наконец поговорим. Спрашиваете, что слу | Потом у него все налаживается. Вы пишете: «Ну как ты?» Получаете"}],"cut":["В такой дружбе легко привыкнуть, что вас вспоминают, когда вы нужны.","Постепенно для ваших новостей в этих разговорах вообще не остается места."],"before":null},{"id":"r_mama_1","author":"Ольга","format":"post","asked":"post","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Вы опять накричали на ребенка и теперь лежите с мыслью: «Какая же я хреновая мать»?\n\nА вы рассчитывали, что после пятого «мам» подряд у вас откроется дополнительный запас терпения? Где-то рядом с запасом сна?\n\n«Он же маленький. Я взрослая, должна себя контролировать». Да. Только, бл*ть, взрослым тоже нужно допивать чай и ходить в туалет.\n\nПосмотрите, что происходит перед этим криком.\n\nВы уже встали поесть, но ребенок потянул за руку. Ладно, сначала ему. Муж спросил, можно ли ему в душ. Конечно, идите. А вы все еще хотите в туалет, но малыш только устроился у вас на коленях. Потерпите.\n\nПотом он опрокидывает чашку. И вас срывает.\n\nОн просит как умеет. А вы считаете, что обязаны откликнуться СРАЗУ, даже когда уже совсем нечем.\n\nИ после крика опять занимаетесь только им: обнимаете, успокаиваете, обещаете себе больше никогда. Ваш обед так и стоит на столе.\n\nВот что меня здесь волнует: вы ругаете себя за крик и продолжаете жить так, что вам даже поесть некогда.\n\nЕсли накричали, стоит вернуться к ребенку и сказать, что кричать на него было неправильно. А с другим взрослым дома договориться о времени, когда ребенком целиком занимается он. Даже если малыш зовет маму. Вам нужен перерыв еще до того, как вы сорвались.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"чали на ребенка и теперь лежите с мыслью: «Какая же я хреновая мать»? | после крика опять занимаетесь только им: обнимае"}],"cut":["Вы злитесь на ребенка, потому что именно рядом с ним снова откладываете все свое."],"before":null},{"id":"r_stud_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: Опять весь день не пишу диплом\n\nРечь: «До сдачи диплома неделя. Почему я опять весь день ничего не пишу?»\n\nБывает, ты тянешь до последнего, потому что тогда плохую оценку можно объяснить: «Ну я же писала за три ночи». А если потратишь месяц, постараешься и все равно получишь тройку? Тут уже страшнее: «Получается, я больше ничего не умею?»\n\nВот ты открываешь документ. Читаешь последний абзац, он какой-то дурацкий. И идешь мыть кружку. Потом решаешь, что с чистым столом будет легче. До вечера диплом так и открыт.\n\nИ как тут начать, если ты собираешься по одному диплому решить, умная ты вообще или нет?","caption":"Даже замечание научрука про оформление может звучать в голове как «ты ничего не понимаешь». Хотя он просил всего лишь поправить ссылки.\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nЕсли узнаешь себя, напиши в комментариях «диплом».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"что тогда плохую оценку можно объяснить: «Ну я же писала за три ночи». А если по | равно получишь тройку? Тут уже страшн"}],"cut":["Пока ты откладываешь, остается объяснение: просто времени было мало."],"before":null},{"id":"r_gnezdo_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"podderzhka","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","text":"Дети съехали, и ничего не радует\n\nУтром можно спокойно выпить чай. Никто ничего не ищет, никого не надо будить. Вы столько раз мечтали о тишине. Теперь сидите на кухне и думаете: «И что мне сегодня делать?»\n\nПотом сами себя одергиваете: «У них все хорошо. Чего я опять недоволен?» И стараетесь пореже звонить, чтобы не мешать. А когда ребенок звонит сам, сразу спрашиваете, все ли у него есть. Хоть что-нибудь нужно купить, привезти?\n\nВам хочется снова поучаствовать в его жизни. Столько лет утром было понятно, зачем вставать. Даже когда вы злились и мечтали, чтобы вас оставили в покое, ваши заботы кому-то были нужны. Теперь приходится самим решать, чем занять день. И пока ничего особенно не хочется.\n\nВы уже очень многое сделали, чтобы дети могли жить самостоятельно. Но вместе с их отъездом закончилась и привычная жизнь, в которой вам каждый день находилось место. К такому трудно привыкнуть за неделю.\n\nЯ бы здесь не торопился с советом найти хобби. От него легко услышать еще один упрек: дети выросли, теперь срочно станьте интересным человеком.\n\nВам правда есть по чему скучать.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"тишине. Теперь сидите на кухне и думаете: «И что мне сегодня делать?» | Потом сами себя одергиваете: «У них все хорошо. "}],"cut":["Вы не обязаны немедленно обрадоваться свободе.","Можно радоваться, что у детей все складывается, и все равно тяжело переживать их отъезд."],"before":null},{"id":"r_razvod_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"mif","topic":"«ради детей надо сохранить семью»","text":"Слайд 1: «У нас дети, какой еще развод?»\n\nСлайд 2: Вы снова думаете о расставании и сами себя останавливаете: «Ребенку нужна полная семья».\n\nУдобно придумано: взрослым х*рово, но менять ничего нельзя, потому что дети. Только ребенку жить в этой же квартире. Он тоже слышит, как вы разговариваете.\n\nСлайд 3: «Ради детей» легко превращается в причину терпеть то, с чем вы давно не согласны. Муж опять вас унизил, вы проглотили. Потом ребенок просит поиграть, и вы срываетесь на него. Сил на спокойный разговор уже нет.\n\nСлайд 4: А потом вы говорите: «Я только ради тебя с твоим отцом живу».\n\nРебенок может услышать в этом: «Маме плохо из-за меня». И начать меньше просить, тише играть, следить за вашим настроением.\n\nСлайд 5: Сохранить брак можно. Для этого нужны изменения, в которых участвуют оба взрослых. Например, муж перестает оскорблять вас при разногласиях, и вы можете обсуждать проблемы без унижений.\n\nСамо по себе решение «ладно, останусь» ничего этого не меняет.\n\nСлайд 6: Вы отвечаете за свои решения и за то, как обращаетесь с ребенком. Вы не ОБЯЗАНЫ в одиночку добиваться, чтобы муж захотел сохранить отношения.\n\nЕсли он продолжает унижать вас и отказывается что-либо менять, ваших стараний на двоих не хватит.\n\nСлайд 7: Когда думаете, оставаться ли вместе, начните с простого вопроса: что конкретно изменится в нашей жизни, если я останусь?\n\nОтвет «у ребенка будут оба родителя дома» еще ничего не говорит о том, как ему будет дома жить.","caption":"Я бы особенно осторожно относилась к словам «потом ребенок спасибо скажет». Он ведь вас об этой жертве не просил.\n\nЯ Ольга, психолог. Работаю с женщинами, которые думают о разводе или уже развелись.\nОтправьте тому, кому сейчас нужно это прочитать.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"о расставании и сами себя останавливаете: «Ребенку нужна полная семья». | Удобно придумано: взрослым х*рово, но менять н"}],"cut":["Это чувство вины за жизнь родителей.","Ему с ним тяжело."],"before":null},{"id":"r_pereezd_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"переехала в другой город и за год ни с кем не подружилась","text":"Текст на экране: После переезда ждешь, когда тебя позовут\n\nРечь: Четыре признака, что после переезда ты хочешь подружиться, но боишься оказаться лишней.\nПервое. На работе идешь обедать одна. Коллеги собираются вместе, но лично тебя никто не позвал. «Наверное, у них своя компания».\nВторое. Чтобы написать знакомой, тебе нужен повод. Просто спросить, как дела, неловко. «Мы же пока не настолько близки».\nТретье. Тебя зовут в гости, а ты первым делом спрашиваешь, кто еще будет. Страшно весь вечер просидеть рядом с людьми, которые обсуждают общих знакомых.\nЧетвертое. Даже после хорошей встречи ты ждешь, когда тебе напишут первой. Хочется проверить: ей тоже понравилось или она просто была вежливой?\nСколько раз ты уже решила за других, что им не до тебя?","caption":"Со старыми друзьями можно написать «мне скучно» и ничего не объяснять. С новыми даже предложение выпить кофе перечитываешь перед отправкой.\nЯ Юлия, психолог, работаю с людьми 25-35 лет, которые осваиваются после переезда.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_dengi_1","author":"Михаил","format":"post","asked":"post","intent":"mehanizm","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","text":"Деньги на счете есть, а вы опять считаете, сколько протянете, если потеряете работу.\n\nИ вроде зарабатываете нормально. На расходы хватает, что-то откладываете. Но спокойно становится только сразу после зарплаты. Да и то ненадолго.\n\nУ мозга есть привычка запоминать, от чего стало легче. Если тревога отпустила после проверки счета, он усваивает: надо проверять, иначе опасно. И в следующий раз снова хочется открыть приложение. Даже если с деньгами за это время ничего не случилось.\n\nВот вы вечером сидите дома. Вспомнили про платеж за машину. Открыли банк, прикинули расходы. Все сходится. Выдохнули.\n\nЧерез полчаса: «А если на работе начнут сокращать?» Снова считаете. Теперь уже на сколько месяцев хватит накоплений. Цифра приличная, но тут же вспоминаете, что машина может сломаться.\n\nВсе, опять мало.\n\nПотому что вы ждете от расчета гарантии, что деньги точно будут всегда. Такую гарантию банковское приложение вам не даст.\n\nПланировать расходы полезно. Но если расчет уже готов, а вы десятый раз его проверяете, чтобы успокоиться, эта привычка поддерживает тревогу.\n\nДля начала назначьте время, когда вы разбираетесь с бюджетом. Если новых расходов или изменений в доходе нет, оставьте расчеты до этого времени.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"стила после проверки счета, он усваивает: надо проверять, иначе опасно. И в следу | Через полчаса: «А если на работе нач"}],"cut":["Так можно пересчитывать вполне достаточную сумму и каждый раз пугаться заново.","Вам не нужно каждый вечер заново решать, хватит ли вам денег."],"before":null}];const KEY='eval-2026-10-02_04-10-08_rilsy_gip_h4';
