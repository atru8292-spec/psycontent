зывают, почему болезнь иногда приносит облегчение. Убрать лишнее объяснение перед списком и поправить подпись: связь с мамой здесь возможна, но не очевидна."},"guard":[],"cut":["Хочется, чтобы твою усталость наконец признали.","Просто устать для тебя недостаточно."],"before":null}];const KEY='eval-2026-10-01_01-37_rilsy';
