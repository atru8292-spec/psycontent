ей и не сделать хуже","text":"Слайд 1: Подруга молчит на ваше «Чем помочь?»\n\nСлайд 2: Вы пишете подруге с депрессией: «Скажи, чем помочь», и ответа нет. Вы правда хотите поддержать. Но теперь ей нужно придумать для вас задачу, решить, удобно ли просить, и все объяснить.\n\nСлайд 3: Подруга отвечает: «Я не знаю».\n\nПри депрессии бывает трудно понять даже, чего хочется на обед. Вопрос «Что тебе привезти?» заставляет выбирать. Конкретное предложение еды из знакомого ей кафе проще: его можно принять или отклонить.\n\nСлайд 4: Подруга говорит: «Я потом напишу», и забывает.\n\nЧтобы воспользоваться вашей помощью, ей нужно вспомнить о сообщении и снова начать разговор. Поэтому «обращайся в любое время» может так и остаться без ответа. Даже когда продукты закончились и помощь очень нужна.\n\nСлайд 5: Подруга говорит: «Только не приезжай, у меня бардак».\n\nДля нее ваш визит может означать, что придется прибраться, одеться и чем-то вас угостить. Бл*ть, еще и полы ради поддержки мыть. Предложение оставить пакет у двери снимает хотя бы эти заботы.\n\nСлайд 6: Подруга спрашивает: «Ты точно не обидишься, если я не выйду?»\n\nОна уже думает, как вы воспримете отказ. Если раньше вы встречались на несколько часов, ей трудно попросить о десяти минутах рядом. Заранее договоритесь, что встречу можно закончить, как только ей станет тяжело.\n\nСлайд 7: Вы можете решить: «Наверное, ей моя помощь не нужна».\n\nИ постепенно перестать предлагать. А подруга так и остается с пустым холодильником, потому что каждый раз откладывала ответ.\n\nСлайд 8: Предложите подруге одну конкретную помощь, которую готовы взять на себя целиком. Например, купить привычные ей продукты и оставить у двери, если она согласна. Пусть ей не придется еще и организовывать вашу заботу.","caption":"У человека может лежать непрочитанное сообщение от того, кому он очень рад. Для ответа сегодня просто нет сил.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40.\nОтправьте тому, кто сейчас хочет поддержать подругу и теряется.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Вы пишете подруге с депрессией: «Скажи, чем помочь», и ответа нет. Вы п | Подруга отвечает: «Я не знаю». | едложение еды"}],"cut":["На это тоже нужны силы.","При депрессии трудно бывает даже принять помощь, которой вы искренне рады."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Звоните маме, чтобы она не обиделась?\n\nРечь: Четыре признака для тех, кто звонит маме каждый день, чтобы она не обиделась.\nПервое. Перед звонком вы проверяете, сколько времени прошло с прошлого. «Вчера разговаривали? Или позавчера? Блядь, теперь объясняться».\nВторое. Вы заранее готовите оправдание. Просто устали после работы? Для мамы этого мало, нужна причина посерьезнее.\nТретье. После разговора вам легче, только если мама довольна. Услышали сухое «ладно, пока» и сидите думаете: «Что я опять сказала?» Уже хочется перезвонить и все исправить.\nЧетвертое. Вы радуетесь, когда у мамы гости или она уехала на дачу с подругами. УРА, сегодня можно пропустить звонок. Вы скучаете по маме и одновременно ждете дня, когда ей будет некогда с вами разговаривать.","caption":"Даже фраза «Я же просто хочу услышать твой голос» начинает раздражать, когда за пропущенный звонок приходится выслушивать, какая вы дочь.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно, но все еще переживают из-за родителей.\nПодписывайтесь, если хочется еще таких разборов отношений с родителями.","judge":null,"guard":[],"cut":[],"before":null}];const KEY='eval-2026-10-02_03-51-54_rilsy_probe_h5';
