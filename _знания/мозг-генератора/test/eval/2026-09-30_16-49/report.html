<script>
const DATA=[{"id":"otvet_1","author":"Михаил","format":"reels_otvet","asked":"reels_otvet","intent":"kak_v_terapii","topic":"«а если психолог мне не поможет?»","text":"Текст на экране: А если я потрачу деньги впустую?\nКадр: сидя перед камерой, руки свободны.\nРечь: А если я потрачу деньги впустую? Такой риск есть. Никто не может честно обещать, что вам помогут.\n\nВот вы открыли на телефоне профиль психолога. Смотрите на стоимость и думаете, стоит ли вообще записываться. Ведь потом еще придется объяснять, что встречи вам ничего не дают. Неловко, да?\n\nЗа свои деньги еще и изображать, что вас все устраивает? Ну уж нет.\n\nЯ бы предложил сказать об этом сразу, на первой встрече. Прямо спросить: «Как мы поймем, что мне помогают наши разговоры?»\n\nДопустим, вы хотите перестать часами проверять телефон после сообщения близкому человеку. Тогда стоит обсудить, что должно измениться и зачем нужны задания между встречами.\n\nИ если вы пока никакой пользы не видите, об этом тоже стоит поговорить с психологом. «Я пока не понимаю, что мне это дает». Здесь не нужно делать вид.\nКрупно на экране: СОМНЕНИЕ на фразе «Я бы предложил сказать об этом сразу, на первой встрече».\nПодпись: Подробно рассказывать о личном бывает трудно. Вопрос о стоимости и пользе встреч тоже уместен.","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Здесь не нужно делать вид.","Вопрос о стоимости и пользе встреч тоже уместен."],"worst":"Тогда стоит обсудить, что должно измениться и зачем нужны задания между встречами. — Вместо конкретного ответа про проверку телефона предлагается еще что-то обсудить.","best":"За свои деньги еще и изображать, что вас все устраивает? Ну уж нет.","verdict":"popravit","why":"Страх потратить деньги и потом постесняться пожаловаться узнаваем, есть живая реплика и понятный вопрос психологу. Но примеру нужен конкретный признак улучшения, финалу — меньше повторов, а надпись «СОМНЕНИЕ» ничего не добавляет."},"guard":[],"hook":"strah_klienta","arc":"razbor"},{"id":"monolog_1","author":"Михаил","format":"reels_monolog","asked":"reels_monolog","intent":"mif","topic":"«уверенность надо в себе воспитать»","text":"Текст на экране: Сначала стану увереннее, потом попрошу\nКадр: на кухне у стола, руки свободны\nРечь: Чтобы попросить помощи с посудой, вам не нужно заранее стать увереннее. Вы вправе попросить и с дрожащим голосом.\n\nПосле ужина в раковине гора посуды. Вы хотите сказать близкому человеку «Поможешь помыть?», но тут же начинаете репетировать. Как встать, каким тоном сказать, как бы не показаться требовательным... Ну, пока репетировали, уже все помыли сами.\n\nВы устроили вступительный экзамен перед обычной просьбой.\n\nВот это меня раздражает в советах учиться уверенности у зеркала. Повторяйте сколько угодно, что вы смелый человек. Если вы каждый раз ждете полной уверенности, чтобы поговорить, вы так и не пробуете попросить.\n\nНу вот, голос дрожит, а вы все равно спрашиваете «Поможешь с посудой?» Было страшно, но сказать получилось. После этого у вас есть на что опереться.\n\nБлизкий человек вправе согласиться или отказать. За свой ответ отвечает он. Вы отвечаете за то, как просите, без оскорблений и давления. Разумеется, речь о разговоре, где вам безопасно просить.\n\nПопробуйте произнести «Поможешь с посудой?»\n\nДаже тихо.\nКрупно на экране: ЭКЗАМЕН на фразе «Вы устроили вступительный экзамен перед обычной просьбой».\nПодпись: Репетировать разговор полезно, пока после репетиции вы действительно разговариваете. Заодно проверьте, есть ли в вашей фразе сама просьба.","judge":{"zhivo":3,"zacep":3,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Вы вправе попросить и с дрожащим голосом.","После этого у вас есть на что опереться.","Близкий человек вправе согласиться или отказать.","Разумеется, речь о разговоре, где вам безопасно просить.","Даже тихо."],"worst":"«Разумеется, речь о разговоре, где вам безопасно просить.» — звучит как обязательная оговорка из методички; что значит «безопасно», не объяснено.","best":"Ну, пока репетировали, уже все помыли сами.","verdict":"popravit","why":"Бытовая сцена узнаваемая, есть характер в реплике про зеркало и удачная шутка про экзамен. Начало заранее выдает весь вывод, абзац про ответственность превращает речь в инструктаж, а финальное «Даже тихо» выглядит приклеенной поддержкой — эти три места стоит поправить."},"guard":[],"hook":"perevorot","arc":"vyvod_snachala"},{"id":"spisok_1","author":"Ольга","format":"reels_spisok","asked":"reels_spisok","intent":"uznavanie","topic":"мама кричит на детей, а потом себя ненавидит","text":"Текст на экране: Дети спят, вы ругаете себя за крик\nКадр: Сидите за столом, руки на столе, смотрите в камеру.\nРечь: Дети наконец уснули, и вы лежите с мыслью «Ну что я за мать». Девочки, вот как выглядит вечер, когда после крика вы продолжаете ругать себя.\nПервое. Вспоминаете, как резко сказали «Спать, я сказала!», прямо слышите свой голос. Прокручиваете эту реплику, потому что вам самой больно от того, как она прозвучала.\nВторое. Обещаете себе завтра вообще не раздражаться. Даже если опять зовут, спорят, просят воды. Ну, то есть завтра вы должны ни разу не разозлиться?\nТретье. На вопрос «Как прошел день?» хочется ответить «Ужасно, накричала». И я прям злюсь, что вы так считаете. Одной красной ручкой перечеркнули ВСЕ, что сделали за день. Теперь вы рассказываете только про крик.\nЧетвертое. Детям приготовили, помогли помыться, почитали перед сном. Но когда вспоминаете вечер, остается только «я кричу на детей, а потом ненавижу себя». Все остальное вы уже считаете чем-то само собой разумеющимся.\nСколько пунктов у вас совпало?\nПодпись: Дети уже спят, а вы все вспоминаете свой крик.","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":2,"interesno":2,"snyat":4,"ai_markers":["Девочки, вот как выглядит вечер, когда после крика вы продолжаете ругать себя.","Одной красной ручкой перечеркнули ВСЕ, что сделали за день."],"worst":"И я прям злюсь, что вы так считаете. — Мама уже ругает себя, а тут еще психолог злится на нее.","best":"Ну, то есть завтра вы должны ни разу не разозлиться?","verdict":"popravit","why":"Начало узнаваемое, снимать понятно, но третий и четвертый пункты повторяют друг друга. Убрать злость психолога, объединить повтор и вместо подсчета совпадений дать конкретный шаг: что делать после крика."},"guard":[],"hook":"primeta","arc":"spisok"},{"id":"istoriya_1","author":"Юлия","format":"reels_istoriya","asked":"reels_istoriya","intent":"svoya_istoriya","topic":"как я сама пришла в анализ и говорила, что все хорошо","text":"Текст на экране: Я плакала перед каждой сессией\nКадр: сидя перед камерой, крупный план\nРечь: Я начала ходить к психоаналитику и два месяца рассказывала, как у меня все хорошо. Два месяца, да. Перед каждой сессией я плакала в машине, потом приходила и рассказывала, что все хорошо.\n\nПотом аналитик спросил, зачем я тогда плачу в машине перед каждой сессией.\n\nВот такое у меня было «все хорошо». Со слезами перед каждой встречей.\n\nЕсли ты боишься идти, потому что пока даже не знаешь, что сказать, ну… вспомни мою историю. Возможно, ты тоже представляешь этот разговор: тебя спросят, как ты, и ты опять скажешь привычное «все хорошо». Хотя перед разговором о себе хочется плакать.\nПодпись: Ты тоже говоришь «все хорошо», когда хочется плакать?","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Вот такое у меня было «все хорошо».","Со слезами перед каждой встречей."],"worst":"Потом аналитик спросил, зачем я тогда плачу в машине перед каждой сессией. — Откуда он знал про слезы в машине? Пропущенная деталь делает историю похожей на придуманную.","best":"Перед каждой сессией я плакала в машине, потом приходила и рассказывала, что все хорошо.","verdict":"popravit","why":"Есть цепляющее личное противоречие, ролик легко снять. Нужно объяснить, откуда аналитик узнал про слезы, убрать повторный мини-вывод и сократить финал: сейчас история заканчивается раньше текста."},"guard":[],"hook":"priznanie_avtora","arc":"istoriya"},{"id":"poslanie_1","author":"Ольга","format":"reels_poslanie","asked":"reels_poslanie","intent":"podderzhka","topic":"мама, которая вечером считает, что опять ничего не успела","text":"Текст на экране: Тем, кто ругает себя за полную раковину\nКадр: На кухне, камера на уровне глаз.\nРечь: «Весь день что-то делала, а показать нечего». Если вы сейчас ругаете себя у полной раковины, оставшаяся посуда не отменяет всего сделанного за день. Даже если там уже чашку поставить некуда.\n\nНу как же так, девочки? По грязным тарелкам выносить себе приговор за целый день?!\n\nКогда приходится искать чистую футболку и разогревать ужин, на это тоже уходят силы. Поели, снова проголодались. Переоделись, снова испачкались. Домашние дела повторяются, и к вечеру снова есть что делать. Прям хоть круглосуточно стой у этой раковины.\n\nЯ злюсь, когда вы еще и требуете от себя ВСЕ успеть.\n\n«Хочу просто полежать, чтобы никто ничего не хотел». За такое желание вы еще и виноватой себя чувствуете? Когда даже на «принеси воды» хочется тяжело вздохнуть, вы уже устали от просьб и дел. Вам самой сейчас нужен отдых.\n\nЕще и за это себя грызть...\nПодпись: Для вечера, когда даже просьба принести воды уже слишком.","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["оставшаяся посуда не отменяет всего сделанного за день.","По грязным тарелкам выносить себе приговор за целый день?!","Поели, снова проголодались. Переоделись, снова испачкались.","Вам самой сейчас нужен отдых."],"worst":"Ну как же так, девочки? — звучит как укор женщинам, которых и так весь день воспитывают.","best":"Прям хоть круглосуточно стой у этой раковины.","verdict":"popravit","why":"Начало узнаваемое, снять легко, но дальше объясняют очевидное и повторяют поддержку. Убрать укор «Ну как же так, девочки?», сократить перечисление домашних дел и заменить дежурную фразу про отдых."},"guard":[],"hook":"golos_chitatelya","arc":"vyvod_snachala"},{"id":"scenka_1","author":"Юлия","format":"reels_scenka","asked":"reels_scenka","intent":"kak_v_terapii","topic":"первые месяцы терапии, когда «все хорошо»","text":"Текст на экране: «Дома все спокойно. Что рассказывать?»\nКадр: два места у стола, клиентка без очков, психолог в очках, руки свободны\nПерсонажи: А клиентка, Б психолог, условная сцена\nА: Я думала отменить встречу. Дома все спокойно.\nБ: А здесь тебе как?\nА: Неловко. Будто пришла с пустыми руками.\nБ: Что ты собиралась принести?\nА: Ну, проблему. А мы вечером вместе чай пили.\nБ: И теперь трудно начать?\nА: Да. Скажу «все хорошо» и дальше буду молчать.\nБ: Тебе хочется помолчать?\nА: Хочется. Только я думала, ты ждешь, что я расскажу.\nБ: Я готова тебя слушать. И подождать тоже.\nА: Тогда я пока посижу.\nПодпись: Ты заранее думаешь, что будешь рассказывать на встрече?","judge":{"zhivo":3,"zacep":3,"ponyatno":4,"polza":3,"interesno":2,"snyat":4,"ai_markers":[],"worst":"Б: И теперь трудно начать? — Повторяет уже понятное, тормозит сцену и делает психолога безликим.","best":"А: Неловко. Будто пришла с пустыми руками.","verdict":"popravit","why":"Узнаваемая неловкость перед встречей и простая постановка. Но после «пустых рук» сцена становится предсказуемой: стоит убрать дублирующий вопрос и оживить финальный обмен, чтобы это был разговор, а не демонстрация принимающего психолога."},"guard":[],"hook":"replika_scenki","arc":"s_serediny"},{"id":"rol_1","author":"Ольга","format":"reels_rol","asked":"reels_rol","intent":"yumor","topic":"муж «помогает» по дому","text":"Текст на экране: Инструктаж по ожиданию поручений\nКадр: Инструктор в строгой рубашке, держит папку, рядом полный пакет мусора у входной двери.\nРечь: Так, пакет у двери уже перешагнули? Отлично. Продолжаем ждать распоряжения.\n\nСамостоятельно полный пакет не трогаем. Вдруг жена просто украсила прихожую.\n\nКогда она спросит, почему мусор еще здесь, произносим обязательную фразу «Ну скажи, что сделать, я сделаю».\n\nВсе. Теперь жена должна заметить пакет, сказать, куда его вынести и во сколько. Вы готовы помогать. Пока просто стоите в ботинках.\n\nНу, дальше уточняем. Этот пакет? Прям сейчас? А куда второй?\n\nПеред выходом ждем напоминания. Без напоминания спокойно уходим, нам еще не все объяснили.\n\nЕсли жена начинает злиться, удивляемся. Мы же согласились! Откуда претензии к такому сотрудничеству?\n\nКогда вынесли мусор, возвращаемся узнать, все ли правильно. Пусть проверит, поблагодарит и выдаст следующее поручение.\n\nЖена предложила съесть папку инструкций? Уточните, вместе с обложкой или только листы.\nПодпись: Ой, девочки, еще и диспетчерскую дома открыли.","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":3,"interesno":4,"snyat":4,"ai_markers":[],"worst":"Все. Теперь жена должна заметить пакет, сказать, куда его вынести и во сколько. — Разжевывает уже понятную шутку и тормозит ролик.","best":"Жена предложила съесть папку инструкций? Уточните, вместе с обложкой или только листы.","verdict":"popravit","why":"Узнаваемая бытовая сцена, понятная роль и отличная последняя шутка. В середине несколько раз повторяется ожидание указаний: убрать объяснение после обязательной фразы и один из повторов, чтобы сохранить темп."},"guard":[],"hook":"v_roli","arc":"s_serediny"},{"id":"doska_1","author":"Михаил","format":"reels_doska","asked":"reels_doska","intent":"mehanizm","topic":"почему трудно отказать","text":"Текст на экране: Почему соглашаюсь, а потом злюсь на себя?\nКадр: рисую маркером на белой доске четыре прямоугольника со стрелками.\nРечь: «Не могу отказать, потом злюсь на себя». Вы уже сказали родным «приеду». Хотя на выходной хотели остаться дома. Посмотрите, что происходит за секунду до согласия.\nРисую: первый прямоугольник «Звонок, жду обиды».\nДопустим, родные звонят, зовут приехать. Вы еще ничего не ответили, но уже представляете упреки. «Обидятся. Придется оправдываться». Ну, весь неприятный разговор заранее.\nРисую: второй прямоугольник «Приеду», стрелка от первого.\nИ вы соглашаетесь. Просто чтобы закончить этот разговор. Друзья, вам уже страшно, хотя никто еще не успел возмутиться.\nРисую: третий прямоугольник «Уф», стрелка от второго.\nВот, отпустило. Вы согласились, объясняться сейчас не придется. Вам стало легче, и вы привыкаете соглашаться. При следующем звонке снова хочется поскорее сказать «да». Вы уже знаете, как быстро после этого становится легче.\nРисую: четвертый прямоугольник «Злюсь на себя», стрелка от третьего.\nА позже вы понимаете, что ради этого короткого «уф» отдали целый выходной. И если так соглашаться раз за разом, вы привыкаете поскорее отвечать «да», чтобы стало легче, хотя потом злитесь на себя.\nИтог на схеме: «Звонок, жду обиды» → «Приеду» → «Уф» → «Злюсь на себя».\nВот здесь, у последнего прямоугольника, вы вспоминаете, что вообще хотели остаться дома.\nПодпись: Что происходит между звонком родных и согласием приехать.","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":3,"interesno":2,"snyat":4,"ai_markers":["И если так соглашаться раз за разом, вы привыкаете поскорее отвечать «да»"],"worst":"И если так соглашаться раз за разом, вы привыкаете поскорее отвечать «да», чтобы стало легче, хотя потом злитесь на себя. — Повтор уже объясненного механизма: ролик топчется на месте.","best":"А позже вы понимаете, что ради этого короткого «уф» отдали целый выходной.","verdict":"popravit","why":"Узнаваемая ситуация и понятная схема, которую легко снять. Уберите повторные объяснения после «Уф» и сильной фразы про потерянный выходной; финал сейчас возвращает к исходной ситуации, ничего не добавляя."},"guard":[],"hook":"golos_chitatelya","arc":"s_serediny"},{"id":"bezslov_1","author":"Ольга","format":"reels_bez_slov","asked":"reels_bez_slov","intent":"yumor","topic":"хочу просто полежать, чтобы никто ничего не хотел","text":"Кадр: лежите на диване с закрытыми глазами, к последнему экрану накрываете лицо ладонью.\nЭкран 1: Только легла на диван. Уже «мам» из кухни.\nЭкран 2: Хочу просто полежать, чтобы никто ничего не хотел.\nЭкран 3: Ложки лежат там же. Найти их разрешаю без моего сопровождения.\nЭкран 4: Холодильник тоже открывайте. Смелее. Допуск у всех есть.\nЭкран 5: Папа даже может САМ выбрать себе еду. Сегодня такие полномочия!\nЭкран 6: «Мам, папа просит спросить...»\nПодпись: Ой, девочки, на «папа просит» я уже закатила глаза.","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":3,"interesno":4,"snyat":5,"ai_markers":["Найти их разрешаю без моего сопровождения.","Допуск у всех есть.","Сегодня такие полномочия!"],"worst":"Папа даже может САМ выбрать себе еду. Сегодня такие полномочия! — шутка уже понятна, но её повторяют и дожимают капсом.","best":"«Мам, папа просит спросить...»","verdict":"popravit","why":"Узнаваемая бытовая сцена, удачный заход и живой финал. На экранах 3–5 одна шутка повторяется трижды: сократить этот участок и убрать натужный канцелярский юмор."},"guard":[],"hook":"replika_scenki","arc":"tolko_scena"},{"id":"auto_1","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"выходные в одиночестве","text":"Текст на экране: Если стыдно завидовать чужим выходным вдвоем\nКадр: Сижу в кресле, камера на уровне глаз, без музыки.\nРечь: Ты смотришь на чужие фотографии вдвоем, и тебе стыдно, что ты завидуешь. Я скажу тебе прямо. Если ты проводишь субботу одна, это не значит, что ты хуже других или тебя нельзя любить.\n\nВ телефоне кто-то обнимается, куда-то едет. И вот ты уже вспоминаешь прошлые отношения. Зря тогда обиделась, зря сказала, надо было промолчать… Ну вот, дошла до привычного «со мной что-то не так».\n\nТы устроила себе суд, где доказательством стала чужая фотография.\n\nА тебе хочется, чтобы кто-то сам спросил, как прошел день. Чтобы рядом был человек, которому ты рада. Когда этого сейчас нет, смотреть на чужие фотографии вдвоем больно. Зависть здесь понятна. Ты еще и стыдишься, будто обязана радоваться за всех без единого неприятного чувства.\n\nТы хочешь близости и грустишь, что ее сейчас не хватает. За это нечего себя ругать.\n\nМне жаль, что сегодня тебе так одиноко.\nПодпись: Для субботнего вечера, когда особенно больно смотреть на чужие фотографии вдвоем.","judge":{"zhivo":3,"zacep":3,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Я скажу тебе прямо.","это не значит, что ты хуже других или тебя нельзя любить","Ты устроила себе суд, где доказательством стала чужая фотография.","Зависть здесь понятна.","За это нечего себя ругать.","Мне жаль, что сегодня тебе так одиноко."],"worst":"«Мне жаль, что сегодня тебе так одиноко.» — дежурное сочувствие: автор словно знает состояние каждой зрительницы.","best":"Зря тогда обиделась, зря сказала, надо было промолчать…","verdict":"popravit","why":"Узнаваемый переход от чужих фотографий к пересмотру своих отношений; снять легко. Но дальше переживание несколько раз объясняют и утешают: сократить повторную поддержку, убрать образ суда и заменить дежурный финал."},"guard":[],"hook":"tihoe_priznanie","arc":"vyvod_snachala"},{"id":"post_1","author":"Ольга","format":"post","asked":"post","intent":"podderzhka","topic":"крикнула на ребенка и ненавижу себя","text":"«Я себя ненавижу за то, как сейчас на него наорала».\n\nЗа завтраком ребенок пролил чай. Вы крикнули, потом вытерли стол. И снова слышите в голове собственный голос, вспоминаете его лицо. «Из-за чашки так орать. Что со мной вообще?»\n\nВам больно от того, что вы его напугали. Хотелось обойтись без крика, получилось вот так. И теперь за этот завтрак вы судите себя за ВСЕ свое материнство.\n\nВот эта жестокость к себе меня злит. Прям до слез себя довести, каждое резкое слово прокрутить, еще и добавить, что вы ужасная мать. Как же вы себя наказываете за одно утро!\n\nВы жалеете о крике, и за это не обязаны себя ненавидеть. Вы признаете, что ребенку было страшно, что зря так на него накричали. Для этого приговор «ужасная мать» вам не нужен.\n\n«Я жалею, что накричала. Зачем я еще и добиваю себя?»","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":null,"ai_markers":["Вы жалеете о крике, и за это не обязаны себя ненавидеть.","Для этого приговор «ужасная мать» вам не нужен.","«Я жалею, что накричала. Зачем я еще и добиваю себя?»"],"worst":"«Вот эта жестокость к себе меня злит» — мама уже ругает себя, а тут еще психолог злится.","best":"«Из-за чашки так орать. Что со мной вообще?»","verdict":"popravit","why":"Начало узнаваемое, но дальше несколько раз повторяется одна мысль: не надо себя добивать. Переформулировать злость психолога и вместо итогового самовопроса добавить конкретный шаг: как подойти к ребенку после крика."},"guard":[],"hook":"tihoe_priznanie","arc":"razbor"},{"id":"tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"жду, когда станет не страшно, и тогда начну","text":"Сообщение готово. Отправите потом.\n\nДопустим, вы хотите предложить знакомому встретиться. Пишете «Может, выпьем кофе на выходных?», перечитываете и оставляете в черновике.\n\nВ голове уже есть ответ. «Зачем я вообще лезу? Вдруг откажет? Лучше отправлю, когда перестану так переживать».\n\nЗакрываете чат. Уф, полегчало.\n\nВот в эту секунду вы запоминаете, как быстро успокоиться. Вы отложили сообщение, стало легче. В следующий раз, когда станет страшно отправлять, у вас уже будет знакомый способ быстро успокоиться. Снова закрыть чат.\n\nВ КПТ это называют избеганием. Облегчение после закрытого чата приучает вас закрывать его снова. Прямо сейчас выгодно. Поэтому повторить хочется еще.\n\nФраза «жду, когда станет не страшно, и тогда начну» звучит чертовски убедительно. Полегчало, значит, правильно сделали, что подождали. Вот так вы себе это объясняете.\n\nТолько посмотрите, почему именно вам стало легче. Потому что сегодня вопрос о встрече решать не придется. Ответ знакомого по-прежнему неизвестен. Когда вы снова откроете черновик, вы все еще будете бояться отказа.\n\nСпокойствия хватает до следующего открытия чата.\n\nЕсли узнаете себя, вот на что стоит посмотреть. В какой момент становится легче? Когда вы представляете встречу или когда решаете сегодня ничего не отправлять?\n\nДля начала достаточно заметить эту секунду. Сообщение все еще в черновике.","judge":{"zhivo":3,"zacep":3,"ponyatno":4,"polza":3,"interesno":2,"snyat":null,"ai_markers":["Прямо сейчас выгодно. Поэтому повторить хочется еще.","Если узнаете себя, вот на что стоит посмотреть.","Для начала достаточно заметить эту секунду."],"worst":"Прямо сейчас выгодно.","best":"Закрываете чат. Уф, полегчало.","verdict":"popravit","why":"Узнаваемая ситуация, понятное объяснение, но одну мысль про облегчение повторяют несколько раз. Сократить повторы, заменить неестественное «выгодно» и усилить финал: сейчас он оставляет читателя у того же черновика."},"guard":[],"hook":"primeta","arc":"razbor"}];const KEY='eval-2026-09-30_16-49';
