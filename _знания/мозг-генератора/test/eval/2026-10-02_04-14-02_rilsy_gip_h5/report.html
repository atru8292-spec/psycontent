<script>
const DATA=[{"id":"r_mif_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: Я плачу, а он кивает\nРечь: «Зачем платить психологу? Друг тоже может выслушать». Может. Но если на сессиях вас только слушают и больше ничего не происходит, вопрос вполне справедливый.\n\nДопустим, вы рассказываете, как десять раз проверяете сообщение начальнику. Друг скажет: «Да нормально вы написали, отправляйте уже».\n\nПсихологу важно разобраться: что случится, если вы проверите всего один раз? Вы боитесь ошибки. Перечитываете, становится спокойнее. И вот подвох: в следующий раз отправить без десяти проверок еще страшнее. Хотя сообщение было нормальным уже в первый раз.\n\nКивать тут маловато, согласен. Психолог должен помочь вам разобраться, как вы сами того не замечая усиливаете свою тревогу. И объяснить, что вы будете с этим делать на сессиях.","caption":"На первой встрече вполне уместен вопрос: «Как мы будем работать с моей проблемой?» Понятный ответ важнее количества умных слов.\nМеня зовут Михаил, я психолог, работаю с людьми 25-40 лет, которые впервые обращаются за помощью.\nОтправьте тому, кто сомневается, стоит ли идти к психологу.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"еряете сообщение начальнику. Друг скажет: «Да нормально вы написали, отправляйте | Психологу важно разобраться: что случ"}],"cut":["Проверки начинают казаться обязательными."],"before":null},{"id":"r_vopros_1","author":"Ольга","format":"reels_otvet","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Зачем мне психолог, если есть подруги?\nРечь: А зачем мне психолог, если у меня есть подруги? Чтобы можно было поговорить о себе и не переживать за собеседника. Вот вы рассказываете подруге, как мама опять вас достала. Подруга вспоминает свою маму, начинает плакать. И вы уже утешаете ее, хотя сами пришли поплакать. Охренеть, поговорили. Подруга ничего плохого не сделала, у нее тоже болит. Психолог сам отвечает за свои переживания. Вам не придется сворачивать свой разговор, потому что ему тоже надо выговориться.","caption":"Даже самой близкой подруге бывает стыдно признаться, что вы ей завидуете.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nОтправьте тому, кто тоже задается этим вопросом.","judge":null,"guard":[],"cut":["Просто в дружбе вы обе нуждаетесь в поддержке.","И вы можете привычно забыть про себя, как только другому стало плохо."],"before":null},{"id":"r_post_1","author":"Юлия","format":"post","asked":"post","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Ты опять открываешь переписку с ним, хотя телефон даже не вибрировал.\n\nМожно самой написать «как день?». Но ты уже писала вчера. И теперь хочется дождаться: вспомнит он о тебе сам или нет?\n\nЕго сообщение должно ответить на вопрос, который ты вслух ему пока не задаешь: «Я тебе вообще нужна?»\n\nТы даже знаешь, что отправить. Видела кое-что смешное, хотела рассказать. Уже открыла переписку. Потом закрыла: «Нет, пусть хоть сегодня сам».\n\nЕсли он ответит на твое сообщение, сомнения останутся. «Ну ответил. Я же спросила». Тебе важно, чтобы он сам захотел поговорить с тобой, без напоминания.\n\nИ вот ты смотришь, когда он был в сети. Заходишь в сторис. Он успел что-то выложить, а тебе ничего. Обидно же. Особенно когда ты весь вечер помнишь о нем.\n\nПостепенно ты уже считаешь, кто сколько раз написал первым. Вчера ты, позавчера тоже ты. Сегодня нельзя, иначе «я опять навязываюсь». Даже обычное желание поболтать приходится сдерживать.\n\nПо одному вечеру этого не понять. Но если общение постоянно начинается только с твоего сообщения, стоит обсудить с ним, хочет ли он сам поддерживать связь. Ты уже слишком много вечеров пытаешься угадать ответ по телефону.","caption":"","judge":null,"guard":[{"rule":"odushevlenie","quote":"вечер помнишь"},{"rule":"dvoetochiya","quote":"писала вчера. И теперь хочется дождаться: вспомнит он о тебе сам или нет? | ос, который ты вслух ему пока не задаешь: «Я"}],"cut":["Вот почему так трудно просто убрать телефон.","Так ожидание сообщения становится проверкой: выберет ли он тебя, если ты ничего для этого не сделаешь?"],"before":null},{"id":"r_tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Стыдно гуглить по работе?\n\nКоллега задал вопрос, вы быстро нашли ответ в интернете, написали ему и подумали: «Хорошо, что он не видел, как я гуглил».\n\nОтвет нашли, человеку помогли, но себе засчитали только одно: сразу не знали.\n\nВы ждете от настоящего специалиста, что он все умеет без подготовки. Поэтому все, что пришлось уточнить, перечитать или спросить, вычеркиваете из своих достижений. Получилось? Конечно, получилось, вы же весь вечер разбирались. Будто этот вечер работал кто-то другой.\n\nЯ бы спросил: а умение разобраться куда делось? Вы нашли нужную информацию, поняли ее и использовали. Но у вас оно проходит по разряду «выкрутился».\n\nТак и появляется страх разоблачения. Вы знаете всю свою работу изнутри: где запутались, к кому обратились, сколько раз переделали. Коллеги видят готовый результат. И вы решаете, что они просто многого о вас не знают. Узнали бы про черновики, сразу изменили бы мнение.\n\nС такими правилами опыта можно набраться сколько угодно. Уверенности больше не станет: каждую удачу вы объясните подготовкой, помощью или поиском в интернете.\n\nКогда будете рассказывать о своей работе, хоть на встрече с руководителем, включите туда и то, в чем пришлось разобраться. Не вычеркивайте половину сделанного только потому, что в начале вы этого еще не умели.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"вет в интернете, написали ему и подумали: «Хорошо, что он не видел, как я гуглил» | у помогли, но себе засчитали только "}],"cut":["Вот так даже решенная задача становится поводом сомневаться в себе.","Это вполне конкретное рабочее умение."],"before":null},{"id":"r_car_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Слайд 1: Подруга с депрессией перестала отвечать на сообщения\n\nСлайд 2: Вы пишете подруге: «Давайте вытащу вас погулять». Сообщение прочитано, ответа нет. Вы хотите помочь, но ей сейчас тяжело даже решить, сможет ли она выйти. Еще нужно подобрать ответ, чтобы вас не обидеть.\n\nСлайд 3: При депрессии даже простые дела могут требовать огромных усилий. И ваше предложение добавляет еще одно: ответить, договориться, собраться. «Она старается ради меня. А я даже ответить нормально не могу».\n\nСлайд 4: Подруга отвечает одним словом\n\nРаньше вы переписывались весь вечер, теперь получаете только «спасибо». На длинный разговор у нее может просто не хватать сил. Вопрос «Вы на меня обиделись?» добавит необходимость успокоить еще и вас.\n\nСлайд 5: Подруга соглашается, потом отменяет встречу\n\nВчера ей хотелось увидеться. Сегодня она с трудом встала с кровати. Обещание встретиться осталось, силы закончились. «Мы же договорились» она и сама прекрасно помнит. Именно поэтому ей так стыдно написать, что она снова останется дома.\n\nСлайд 6: Подруга перестает рассказывать, как ей плохо\n\nВы советовали прогулки, спорт, режим сна. Теперь на вопрос о самочувствии она отвечает: «Нормально». Признаться, что ничего из этого не сделала, тяжело. Она ждет нового вопроса: «А вы хоть попробовали?» И разговор хочется поскорее закончить.\n\nСлайд 7: Помощь начинает ощущаться как проверка\n\n«Ну что, погуляли? Записались? Стало лучше?» Кажется, вы просто интересуетесь. А подруга уже думает: «Бл*ть, я опять всех подвела». Если ей приходится отчитываться после каждого предложения, она начинает избегать даже тех, кто ей дорог.\n\nСлайд 8: Предложите одну конкретную помощь, на которую легко ответить: например, привезти готовую еду и оставить у двери.\n\nЗаранее уточните, подходит ли это ей. После такой помощи ей не нужно принимать вас в гостях или рассказывать, стало ли ей лучше.","caption":"Близким тоже бывает страшно: хочется срочно найти хоть что-нибудь, что поможет. Отсюда и десять советов подряд.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40 лет.\nПодписывайтесь, если хочется еще таких разборов про отношения и то, как нам бывает тяжело.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Вы пишете подруге: «Давайте вытащу вас погулять». Сообщени | й. И ваше предложение добавляет еще одно: ответить, договор"}],"cut":["Так появляется вина за чужую заботу.","Можно очень любить подругу и растеряться рядом с ее депрессией."],"before":null},{"id":"r_mif_2","author":"Юлия","format":"post","asked":"post","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"«Просто перестань себя накручивать», говорят тебе, когда ты тревожишься.\n\nСпасибо, осталось найти кнопку.\n\nПосле такого совета ты еще и ругаешь себя: «Он просто не ответил. Что я опять начинаю? Почему я не могу нормально?»\n\nИ теперь надо разобраться сразу с двумя вещами. Почему он молчит и что с тобой не так.\n\nТы ведь уже пытаешься успокоиться. Перечитываешь переписку: вроде все хорошо было. Проверяешь, когда он заходил. Думаешь: «Вот ответит, и я выдохну».\n\nОн отвечает. Ты выдыхаешь. Потом замечаешь, что как-то коротко. Сердечко обычно ставил. И опять хочется уточнить, все ли нормально.\n\nТы ищешь такую ясность, после которой тревожиться будет незачем. Чтобы точно знать: он доволен, отношениям ничего не угрожает, ты нигде не ошиблась. Только получить такую гарантию на все будущие сообщения невозможно. Даже от самого любящего человека.\n\nСовет «перестань накручивать» заставляет тебя считать каждую новую тревогу своим провалом. Будто ты плохо старалась.\n\nТы не выбираешь испугаться из-за короткого ответа. Зато можешь решать, что делать дальше. Проверять чужой телефон, требовать немедленного ответа, обвинять человека только потому, что тебе страшно, за это ты отвечаешь.\n\nЕсли его молчание мешает вам договориться о встрече, спроси про встречу. Выяснять по каждому сообщению, любит ли он тебя еще, можно бесконечно.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"осле такого совета ты еще и ругаешь себя: «Он просто не ответил. Что я опять начи | ься успокоиться. Перечитываешь переп"}],"cut":["Тебе может быть тревожно, даже когда ты ничего плохого не сделала.","За саму тревогу оправдываться не нужно."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Звоните маме, лишь бы не обиделась?\n\nРечь: Четыре признака для тех, кто звонит маме каждый день, лишь бы она не обиделась.\nПервое. Вы звоните, даже когда говорить совершенно не хочется. Стоите у кассы с пакетами: «Лучше сейчас, потом начнется».\nВторое. Вы заранее придумываете оправдание. Просто устали после работы? Слабовато. Надо объяснить, почему ПРАВДА не могли позвонить.\nТретье. Вы скрываете, что хорошо провели вечер. Скажете про ресторан с друзьями, услышите: «А для матери минуты нет». Блядь, уже и поужинать спокойно нельзя.\nЧетвертое. Вы радуетесь, когда мама сама не берет трубку. Сразу легче: вы позвонили, обижаться не на что.\nВы уже проверяете, довольна ли мама, прежде чем решить, как провести свой вечер. Знакомо?","caption":"Можно жить отдельно и все равно объяснять маме, почему вчера легли спать без звонка. Особенно бесит, когда после разговора вы еще пишете ей что-нибудь ласковое, чтобы точно не обиделась.\nЯ Ольга, психолог. Работаю со взрослыми детьми, которые съехали от родителей, но все еще отчитываются.\nЕсли узнали себя, напишите в комментариях свой пункт.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"но не хочется. Стоите у кассы с пакетами: «Лучше сейчас, потом начнется». | кажете про ресторан с друзьями, услышите: «А"}],"cut":["Можно наконец заняться собой."],"before":null},{"id":"r_men_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Терпите весь день, срываетесь на детей\nРечь: Четыре признака, что вы весь день терпите, а дома заводитесь от любой мелочи.\nПервое. Обиду вы проглатываете. Начальник при всех сказал обидную вещь, вы промолчали. Вечером все еще спорите с ним в голове.\nВторое. Признаться, что вам тяжело, стыдно. Жена спрашивает, что случилось, вы отвечаете: «Все нормально». Еще не хватало жаловаться.\nТретье. Детский шум становится невыносимым. Ребенок уронил карандаш, вы уже кричите. Карандаш! Утром вы бы даже внимания не обратили.\nЧетвертое. Слезы ребенка вызывают злость. Хочется сразу сказать: «Хватит ныть, ничего страшного». И себе вы говорите то же самое, когда хочется плакать.","caption":"После срыва стыдно, и вы снова молчите о том, как вам тяжело. Даже если очень хочется, чтобы кто-нибудь выслушал.\nМеня зовут Михаил, я психолог, работаю с мужчинами 30-45 лет, в том числе с отцами.\nЕсли узнали себя, напишите в комментариях «знакомо».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"спрашивает, что случилось, вы отвечаете: «Все нормально». Еще не хватало жаловат | а вызывают злость. Хочется сразу сказ"}],"cut":["Расстроиться нельзя, поэтому все, что накопилось за день, выходит криком."],"before":null},{"id":"r_vopros_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: «О чем говорить на первой сессии?»\nПерсонажи: А это клиентка, Б это психолог\nА: Я не знаю, о чем говорить на первой сессии.\nБ: Что сейчас приходит в голову?\nА: Что вы сидите и ждете, а я молчу.\nБ: Я тебя сейчас тороплю?\nА: Нет. Но вы же ждете чего-то толкового.\nБ: А молчать со мной страшно?\nА: Вы решите, что зря тратите на меня время.\nБ: Ох, еще и за меня переживаешь.\nА: Я просто хочу нормально начать.\nБ: Мы уже начали.\nА: С того, что я боюсь вам не понравиться?\nБ: С кем еще ты боишься не понравиться?","caption":"Перед встречей можно подготовить целый список и растеряться, когда тебя наконец слушают.\nЯ Юлия, психолог, работаю с теми, кто впервые собирается на терапию.\nНапиши «впервые», если пока только присматриваешься к терапии.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_money_1","author":"Ольга","format":"post","asked":"post","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"Вы опять доделываете работу за коллегой, а попросить прибавку к зарплате стыдно. Еще и думаете: «Вот закончу этот проект, тогда точно можно».\n\nТак вы можете годами готовиться к разговору о деньгах. И каждый раз находить себе еще работу.\n\nПотому что у вас есть условие: чтобы повышение считалось заслуженным, начальник должен предложить его САМ. Заметить, сколько вы делаете, позвать и сказать: «Пора вам поднять зарплату».\n\nА если пришлось попросить, внутри сразу: «Я напрашиваюсь. Вдруг он вообще считает, что мне и так много платят?»\n\nВы ждете, что вас оценят без подсказки. Тогда можно будет спокойно принять деньги и чувствовать, что вы их заслужили. Просьба будто портит все: теперь непонятно, вас правда ценят или вы просто выпросили.\n\nВот вы берете еще одну задачу. Отвечаете вечером. Подменяете коллегу. Ну теперь же он увидит?\n\nБл*н, начальнику удобно. Работа сделана, про деньги вы молчите. Ему вполне может казаться, что вас все устраивает.\n\nИ чем дольше вы ждете, тем обиднее. Вы ведь уже столько сделали, чтобы он догадался.\n\nДоговоритесь о встрече и обсудите оплату того объема работы, который уже выполняете. Еще один проект для допуска к этому разговору вам не нужен.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"рибавку к зарплате стыдно. Еще и думаете: «Вот закончу этот проект, тогда точно м | Потому что у вас есть условие: чтобы"}],"cut":["Вы имеете право обсуждать зарплату, даже если никто пока не собирался вас хвалить.","Этот разговор ничего не говорит о том, какая вы хорошая и достаточно ли стараетесь."],"before":null},{"id":"r_body_1","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Тем, кто ненавидит свое тело перед отпуском\nРечь: Если перед отпуском ты смотришь в зеркало и думаешь: «Как я вообще в таком виде выйду на пляж», послушай меня минуту. Ты примеряешь купальник, поворачиваешься боком, втягиваешь живот. И уже представляешь, кто что скажет. Даже если никто еще ничего не сказал.\n\nВ этот момент ты рассматриваешь себя глазами людей, чьей оценки боишься. И злишься на тело, потому что хочешь спокойно отдыхать, без чужих замечаний и стыда.\n\nНу вот, еще до моря надо выдержать пляж у себя в голове.\n\nТы уже устала от этой проверки.","caption":"Даже комплимент «ты похудела» может напомнить, что твой вес все время замечают. После такого бывает трудно поверить, что на пляже тебя оставят в покое.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли захочешь поговорить об этом на консультации, ссылка на запись в шапке профиля.","judge":null,"guard":[],"cut":["И за то, что тебе сейчас трудно смотреть на себя, ругать себя тоже не надо."],"before":null},{"id":"r_teen_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Слайд 1: После школы от подростка только «нормально»\n\nСлайд 2: Вы спрашиваете, как прошел день, подросток бросает «нормально» и закрывает дверь своей комнаты. Вы остаетесь в коридоре: «Я же просто спросил». Но если вчера рассказ о школе закончился советами и замечаниями, сегодня он уже ждет продолжения.\n\nСлайд 3: Подросток отвечает одним словом даже на простой вопрос.\n\nЕсли после «получил тройку» вы подробно выясняете, как он готовился, короткое «нормально» помогает избежать нового разбора. Вам хочется понять, что случилось. Он прикидывает, сколько вопросов придется выдержать, если ответить честно.\n\nСлайд 4: Подросток раздражается: «Можно меня сейчас не трогать?»\n\nВы еще ничего не успели сказать, а он уже защищается. Такое бывает, когда подросток заранее ждет замечаний.\n\nСлайд 5: Подросток рассказывает о неприятности, а потом обрывает разговор: «Все, забудь».\n\nНапример, он поссорился с другом, а вы сразу объясняете, как надо было ответить. Эх, мы уже помогаем, хотя даже историю не дослушали. В следующий раз он может решить, что проще вообще ничего не рассказывать.\n\nСлайд 6: Чем меньше подросток рассказывает, тем сильнее вам хочется расспросить его.\n\nВы заходите еще раз, уточняете за ужином, спрашиваете перед сном. Он начинает избегать даже обычных разговоров: вдруг опять придется объясняться.\n\nСлайд 7: Когда подросток снова начнет что-то рассказывать, дослушайте без советов и замечаний. Даже если очень хочется поправить его уже на второй фразе.\n\nПодростку нужен опыт разговора с вами, после которого ему не приходится защищать каждое свое решение.","caption":"Перед закрытой дверью легко почувствовать себя лишним. Особенно если раньше ребенок рассказывал вам даже то, о чем вы не спрашивали.\n\nЯ Михаил, психолог, помогаю родителям подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не успели сказать, а"},{"rule":"dvoetochiya","quote":"ь своей комнаты. Вы остаетесь в коридоре: «Я же просто спросил». Но если вчера ра | Подросток раздражается: «Можно меня "}],"cut":["Это ожидание разбора: он слышит вопрос и уже готовится объяснять, почему опять сделал что-то неправильно.","Так попытки узнать, что с ним, становятся еще одной причиной закрыть дверь.","К этому изменению правда трудно привыкнуть."],"before":null},{"id":"r_vybor_1","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Почему я ему опять пишу?\n\nРечь: «Он опять пропал. Наверное, я ему что-то не то написала».\n\nИ вот вы уже перечитываете переписку. Вчера собирались забить на него, сегодня думаете, как написать, чтобы он захотел встретиться.\n\nЕго молчание вы принимаете за доказательство, что с вами что-то не так. И теперь нужно добиться ответа, чтобы выдохнуть: «Фух, я ему все-таки нужна».\n\nБлядь, он уже третью встречу отменяет, а вы переживаете, достаточно ли интересно с вами общаться.\n\nВы так заняты тем, чтобы он вас выбрал, что даже не спрашиваете себя: вам самой нравится, как он с вами обращается?","caption":"Одно его «привет» после недели молчания, и вы уже забыли, как злились вчера. Только отмененная встреча от этого никуда не делась.\nЯ Ольга, психолог, работаю с девушками и женщинами 22-35 лет.\nОтправьте подруге, если она сейчас ждет такого сообщения.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ь нужно добиться ответа, чтобы выдохнуть: «Фух, я ему все-таки нужна». | вас выбрал, что даже не спрашиваете себя: вам с"}],"cut":["В такой момент очень легко перепутать желание быть с человеком и желание наконец ему понравиться."],"before":null},{"id":"r_zlost_1","author":"Юлия","format":"post_tg","asked":"post_tg","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"«Он же не хотел тебя обидеть»\n\nИ что, теперь тебе даже злиться нельзя?\n\nТебя перебили в третий раз. Ты еще договорить не успела, а тебе уже объясняют, почему ты неправильно думаешь. Хочется сказать: «Дай мне закончить». Но ты улыбаешься и замолкаешь. «Он просто такой. Не специально же».\n\nА потом говоришь про себя: «Я спокойная, меня сложно разозлить».\n\nТы успела разозлиться. И тут же потребовала от себя доказательств: он точно хотел сделать тебе больно? Он вообще понимает, что делает? Может, ты сама придираешься?\n\nЯ бы тут спросила: почему для твоей злости обязательно нужен человек, который намеренно тебе вредит?\n\n«Он же хотел как лучше». Допустим. Но он без спроса решил за тебя, что тебе делать. Добрые намерения у него есть. Согласия твоего нет.\n\n«На правду не обижаются». Ага, очень удобно. Теперь можно обсуждать твою внешность за общим столом, и ты еще должна поблагодарить за честность?\n\n«Ты слишком остро реагируешь». После этого так легко начать подбирать слова помягче, пока от твоего недовольства вообще ничего не останется.\n\nЕсли ты привыкла быть хорошей, тебе трудно злиться на человека, которого ты любишь. Сразу кажется, что ты несправедливая и неблагодарная. Поэтому ты объясняешь себе его поведение, пока уже сама не понимаешь, почему хочется плакать.\n\nТы отвечаешь за то, что делаешь со своей злостью. Оскорблять, унижать, мстить человеку нельзя. Но само чувство никому не причиняет вреда.\n\nТебе можно попросить человека больше так не делать, даже если он ничего плохого не хотел.","caption":"","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не успела, а"},{"rule":"dvoetochiya","quote":"ты неправильно думаешь. Хочется сказать: «Дай мне закончить». Но ты улыбаешься и | А потом говоришь про себя: «Я спокойн"}],"cut":["Оно возникает и рядом с хорошими людьми, которые тебе дороги."],"before":null},{"id":"r_humor_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"Текст на экране: Инструктаж для подруг психолога\nРечь: Девочки, если ваша подруга психолог, начинайте с «Я просто поболтать». Потом присылайте восемь голосовых про бывшего. Переписку тоже приложите, ей нужен контекст.\n\nНа кофе сразу спрашивайте, почему вас тянет к таким мужикам. Пусть поработает, пока капучино остывает.\n\nЕсли предложит записаться на консультацию, удивляйтесь: «Ой, теперь с подругами только за деньги?»\n\nОбязательно добавьте: «Я же тебя как психолога не спрашиваю». И следом: «Но это у него нарциссизм или что?»\n\nБлядь, удобно же. Она уже знает вашу маму.\n\nЕсли подруга тоже захочет выговориться, скажите, что у вас сейчас нет ресурса. Вы же пришли отдыхать.","caption":"А потом подруга еще думает, стоит ли рассказывать вам о своих проблемах. Вдруг упадет в ваших глазах как специалист.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого, здесь я говорю про отношения и привычку быть удобной.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"записаться на консультацию, удивляйтесь: «Ой, теперь с подругами только за деньг | Обязательно добавьте: «Я же тебя как "}],"cut":[],"before":null},{"id":"r_malysh_1","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"Текст на экране: Почему так страшно отказать\nРечь: Девочки, вы устали, вас просят помочь, и отказать страшненько. Вдруг обидятся?\n\nПредставьте маленький звоночек. Когда за ваше «нет» вас ругали или переставали с вами разговаривать, он учился звенеть: «СРОЧНО соглашайся, иначе с тобой опять будут плохо обращаться».\n\nТеперь подруга просит помочь с переездом. Вы хотели отлежаться в выходной. Уже набираете: «Извини, я не смогу». И представляете, как она недовольно читает сообщение.\n\nЗвоночек звенит. Вы стираете отказ и пишете: «Во сколько приехать?»\n\nБлядь, вы уже согласились, а она даже обидеться не успела.\n\nПусть звоночек чуть позвенит, пока вы отправляете свой ответ. Чужое недовольство не обязывает вас менять решение.","caption":"После отказа еще тянет дописать пять объяснений и предложить помощь на следующей неделе.\n\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nНапишите в комментариях, кому вам труднее всего отказать.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"с вами разговаривать, он учился звенеть: «СРОЧНО соглашайся, иначе с тобой опять | ели отлежаться в выходной. Уже набира"}],"cut":["Будто одного свободного выходного придется долго извиняться."],"before":null},{"id":"r_malysh_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"Текст на экране: Про обиду на маму и стыд\nРечь: Милая, ты обижаешься на маму и тут же себя ругаешь: «Она столько для меня сделала. Как я могу?»\n\nПредставь, что у тебя в пальчике заноза. Ты говоришь: «Больно». А мама отвечает: «Ну что ты опять выдумываешь».\n\nЗаноза осталась. Только теперь ты еще и стесняешься плакать.\n\nМама сказала что-то обидное, ты расстроилась. А потом услышала, что ты неблагодарная. И теперь каждый раз, когда больно, сама себе говоришь: «Какая же я плохая дочь».\n\nОх, еще и виноватой себя назначила.\n\nМожно хотя бы здесь признать: «Да, мне было больно». Даже если мама старалась и многое тебе дала.\n\nБлагодарность маме не отменяет обиду на нее.","caption":"Бывает, уже собираешься рассказать, что мама сказала, и сначала объясняешь, как ей самой было тяжело. До своей боли так и не доходишь.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми.\nПодписывайся, если хочется еще таких разговоров про маму и свою взрослую жизнь.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"обижаешься на маму и тут же себя ругаешь: «Она столько для меня сделала. Как я мо | то у тебя в пальчике заноза. Ты гово"}],"cut":["Так бывает и с обидой."],"before":null},{"id":"r_drug_1","author":"Михаил","format":"post","asked":"post","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Друг пишет «Можно вам позвонить?», и вы сразу думаете: «Что у него опять случилось?»\n\nВы уже привыкли: если он появился, значит, ему плохо. Когда у него все хорошо, вы узнаете о его жизни из сторис, как все остальные.\n\nИ постепенно даже радоваться его сообщениям перестаете. Еще не открыли переписку, уже прикидываете, есть ли сегодня силы долго его слушать.\n\nВ такой дружбе легко привыкнуть к мысли: «Я ему нужен, когда надо помочь». Вы знаете, как его успокоить, что спросить, когда лучше просто послушать. А вот зачем звонить ему в обычный вторник, уже непонятно. Проблемы нет. Повода вроде тоже.\n\nПотом он снова появляется, и вы откладываете свои новости. Он же сейчас переживает, куда тут с вашим повышением или смешной историей с работы.\n\nА когда ему становится легче, разговор заканчивается. Свои новости вы так и не рассказали.\n\nИ вы еще себя одергиваете: «У человека трудный период, а я тут обижаюсь». Но трудный период прошел. Вы ведь и после него никуда не делись.\n\nНо вам хочется, чтобы он интересовался вами и в спокойные дни.\n\nСкажите другу, что вам хочется общаться и тогда, когда у него все хорошо. Что вы скучаете по обычным разговорам и тоже хотите рассказывать, как у вас дела.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ожно вам позвонить?», и вы сразу думаете: «Что у него опять случилось?» | Вы уже привыкли: если он появился, значит, ему"}],"cut":["Человек может искренне дорожить вами и при этом вспоминать о вас только тогда, когда нужна поддержка.","Его благодарность после тяжелого разговора вполне настоящая."],"before":null},{"id":"r_mama_1","author":"Ольга","format":"post","asked":"post","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Ребенок уже играет после вашего крика, а вы все еще думаете: «Как я могла? Он же маленький».\n\nИ что, теперь до вечера нельзя ни поесть нормально, ни посмеяться? Хорошая мать после срыва обязана сидеть и ненавидеть себя?\n\n«Если я перестану себя ругать, значит, мне вообще пофиг».\n\nОхренеть, девочки. Еще и страдать надо как следует, чтобы доказать, что вы любите своего ребенка.\n\nВы вспоминаете, как он вздрогнул от вашего голоса. Он подходит с книжкой, вы его обнимаете, но внутри все равно: «Не заслужила я обниматься».\n\nВечером муж предлагает побыть с малышом, пока вы полежите. И тут же мысль: «Я и так сегодня плохая мать. Еще и ребенка на него скину».\n\nВы наказываете себя, потому что хотите хоть как-то исправить то, что случилось. Кажется, если достаточно себя сожрать, то вы точно усвоите урок и больше никогда не сорветесь.\n\nТолько к вечеру вы голодная, вымотанная, все еще прокручиваете этот крик. Ребенок снова не дает надеть ему пижаму. И у вас опять все кипит. Бл*ть, вы же весь день старались стать лучше.\n\nВы мучаетесь, значит, вроде бы что-то делаете с произошедшим. Но ребенок от ваших мучений не понимает, почему мама кричала и виноват ли он.\n\nКогда успокоитесь, подойдите к нему, простыми словами признайте, что накричали и так делать нельзя. Обнимите, если он хочет.\n\nА если вам предлагают передышку, соглашайтесь. После срыва вам нужна помощь, и ее не надо сначала заслужить идеальным поведением.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"после вашего крика, а вы все еще думаете: «Как я могла? Он же маленький». | й, вы его обнимаете, но внутри все равно: «Н"}],"cut":["Самоненависть легко принять за ответственность.","Даже маленькому это можно сказать."],"before":null},{"id":"r_stud_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: Диплом горит, а я опять тяну\nРечь: «Почему я не могу сесть за диплом? Времени уже почти нет».\n\nОткрываешь файл, перечитываешь начало. «Что за ерунда я написала». Закрываешь. Завтра попробуешь еще раз.\n\nЕсли каждая кривая фраза для тебя означает «я тупая», писать страшно. Черновик ведь обязательно будет кривым.\n\nНо ты уже представляешь, как научрук читает и думает: «И чему она вообще научилась?»\n\nПока диплом недописан, остается объяснение: «Я просто еще не успела нормально сделать».\n\nНичего себе задача для одного диплома. Как тут спокойно писать, если на защите будто решат, умная ты вообще или нет?","caption":"Замечание «здесь нужно переделать» легко услышать как «ты ничего не умеешь». Особенно когда самой хочется хоть раз сделать все без замечаний.\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nЕсли знакомо, можешь написать в комментариях «диплом».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"едставляешь, как научрук читает и думает: «И чему она вообще научилась?» | ка диплом недописан, остается объяснение: «Я "}],"cut":["В нем еще надо разбираться, что-то менять.","Ты откладываешь встречу с этой оценкой."],"before":null},{"id":"r_gnezdo_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"podderzhka","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","text":"Дети уехали. Для кого готовить завтрак?\n\nРаньше с утра уже было понятно, что делать. Кто во сколько встает, что нужно купить, о чем напомнить. Вы могли сердиться, что опять все на вас. Мечтали спокойно выпить чай.\n\nТеперь можно. А вы сидите на кухне и думаете: «И что мне делать весь день?»\n\nПотом еще себя ругаете: «У детей все хорошо. Живут своей жизнью. Чего я раскис?»\n\nУ них действительно может быть все хорошо. И вам при этом может быть очень тяжело.\n\nКогда годами многое делаешь для детей, их жизнь помогает устраивать и свою. Есть ради кого подняться, выйти из дома, приготовить ужин, даже если самому ничего не хочется. Ваши собственные желания все это время могли ждать. «Потом разберусь, сейчас некогда».\n\nИ вдруг это «потом» наступило. Только понять, чего вы хотите для себя, с первого свободного утра не получается.\n\nА вам уже советуют: займитесь собой, найдите увлечение, радуйтесь свободе. Будто вы столько лет только и ждали, когда наконец сможете записаться в бассейн. Да вы сейчас можете даже любимую еду не вспомнить. Все последние годы покупали то, что любят домашние.\n\nВы уже много сделали. Вырастили детей, участвовали в их жизни, привыкли каждый день быть им нужными в самых обычных делах. Теперь этих дел стало меньше, и вы чувствуете пустоту.\n\nМожно радоваться, что дети устроились, и скучать по жизни, в которой они каждый вечер приходили домой. Вам сейчас грустно, даже если все сложилось хорошо.","caption":"","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"},{"rule":"dvoetochiya","quote":"рь можно. А вы сидите на кухне и думаете: «И что мне делать весь день?» | Потом еще себя ругаете: «У детей все хорошо. Ж"}],"cut":["К ней еще нужно привыкнуть.","Ругать себя за эту пустоту точно незачем."],"before":null},{"id":"r_razvod_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"mif","topic":"«ради детей надо сохранить семью»","text":"Слайд 1: «Какой развод? У нас же дети»\n\nСлайд 2: Вы думаете о расставании и сразу представляете: дети вечером спрашивают, где папа. От этой мысли страшно. И вы снова решаете потерпеть, сгладить очередную ссору, ничего ему не предъявлять. «Лишь бы у них был отец».\n\nСлайд 3: Получается, чтобы он оставался отцом, вы должны оставаться его женой. Удобно устроено, бл*н. Вы ОДНА отвечаете даже за его отношения с детьми. Хотя позвонить ребенку, забрать его из школы, провести с ним выходной вполне может сам отец.\n\nСлайд 4: Муж снова обещал погулять с ребенком и забыл. Вы придумываете объяснение: «Папа устал». Потом молчите о своей обиде, чтобы не поссориться.\n\nСлайд 5: Вы боитесь, что после развода он перестанет заниматься детьми. Такой риск действительно есть, и от него больно. Но уже сейчас вы берете на себя его ответственность: напоминаете, уговариваете, организуете. Сохраненный брак сам по себе участия отца не гарантирует.\n\nСлайд 6: Вы отвечаете за свои решения и за то, как обращаетесь с детьми. Его участие зависит и от него самого. При разводе придется решать, где дети живут, как видятся с папой, кто оплачивает расходы. Это задачи обоих родителей. Вам не нужно заслуживать его помощь хорошим поведением.\n\nСлайд 7: Решение о разводе требует времени. Начните с конкретного: какие обязанности с детьми отец уже берет на себя без ваших напоминаний? Обсудите с ним, за что он готов отвечать дальше. Оценивайте и его поступки, когда решаете, как жить вашей семье.","caption":"Особенно тяжело, когда муж говорит: «Уйдешь, сама будешь с ними возиться». После такой фразы страшно даже обсуждать расставание.\n\nЯ Ольга, психолог. Работаю с женщинами 30-45 лет, которые думают о разводе или уже развелись.\nОтправьте тому, кому сейчас нужно это прочитать.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"аете о расставании и сразу представляете: дети вечером спрашивают, где папа. От э | нком и забыл. Вы придумываете объясн"}],"cut":["Из этой установки получается очень тяжелая жизнь.","Теперь вам приходится еще и прикрывать его перед детьми.","И этот страх заслуживает внимания."],"before":null},{"id":"r_pereezd_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"переехала в другой город и за год ни с кем не подружилась","text":"Текст на экране: Год в новом городе, близких друзей нет\nРечь: Четыре признака, что после переезда тебе хочется друзей, но страшно оказаться лишней.\nПервое. Ты ждешь, когда тебе напишут. Сама уже писала первой и теперь считаешь: «Следующий раз ее очередь». Ох, уже и тут приходится считать.\nВторое. На работе ты со всеми ладишь, но предложить вместе пообедать трудно. «Вдруг у них свои планы?» И снова ешь одна.\nТретье. Старой подруге можешь написать, что тебе плохо. С новой знакомой встречаешься только в хорошем настроении: «Кому нужны мои проблемы?»\nЧетвертое. Даже приглашению в гости ты не веришь: «Она просто из вежливости». Отказываешься и ждешь, позовут ли еще.\nТы хочешь сначала убедиться, что тебе рады. А другой человек после твоего отказа думает, что тебе с ним неинтересно.","caption":"Со старыми друзьями можно молчать и знать, что все хорошо. С новыми даже пауза в разговоре пугает: «Все, ей со мной скучно».\nМеня зовут Юлия, я психолог, помогаю людям после переезда освоиться на новом месте.\nЕсли хочешь поговорить об этом на консультации, ссылка на запись в шапке профиля.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Сама уже писала первой и теперь считаешь: «Следующий раз ее очередь». Ох, уже и т | встречаешься только в хорошем настро"}],"cut":[],"before":null},{"id":"r_dengi_1","author":"Михаил","format":"post","asked":"post","intent":"mehanizm","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","text":"Деньги на счете есть, но вы снова открываете приложение банка. Проверили, выдохнули. Через час опять хочется проверить.\n\nТакая проверка сама может поддерживать страх, что денег не хватит. Даже если вы нормально зарабатываете и на все обязательные расходы хватает.\n\nУ мозга есть привычка запоминать, после какого действия стало спокойнее. Испугались, посмотрели остаток, отпустило. Он усвоил: когда страшно, надо срочно проверить деньги.\n\nДопустим, вечером вы уже посчитали расходы до следующей зарплаты. Все сходится. Потом лежите в кровати и думаете: «А если машина сломается?»\n\nСнова берете телефон. Сумма прежняя, на минуту легче. Но завтра найдется новый повод испугаться. Машина, работа, зубы. На все случаи жизни гарантию банк вам, конечно, не выдаст.\n\nС каждой такой проверкой становится привычнее искать подтверждение, что все в порядке. Поэтому даже хороший остаток радует ненадолго.\n\nЕсли узнаете себя, назначьте время, когда будете смотреть счет и считать расходы. Между этими проверками не открывайте приложение только потому, что стало тревожно.\n\nВы уже посчитали, что денег хватает до зарплаты. Этот расчет остается верным и в тот момент, когда вам снова страшно.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"посмотрели остаток, отпустило. Он усвоил: когда страшно, надо срочно проверить де | одится. Потом лежите в кровати и дум"}],"cut":["И вот вы уже проверяете счет, чтобы успокоиться."],"before":null}];const KEY='eval-2026-10-02_04-14-02_rilsy_gip_h5';
