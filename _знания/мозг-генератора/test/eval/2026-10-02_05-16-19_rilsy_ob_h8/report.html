":"«тревогу надо просто перестать накручивать»","text":"Текст на экране: Инструктаж: как спокойно попросить вернуть долг\nРечь: Тревожишься, когда просишь вернуть долг? Сейчас научу тебя просто не накручивать. Сначала убери из сообщения «ты обещал». Человек почувствует давление. Дату тоже убери. У людей всякое бывает. Добавь «если тебе удобно». Еще смайлик. Ты же спокойно спрашиваешь, чего у тебя точка такая злая? Так. Теперь «мне нужны деньги» замени на «я тут вспомнила». Нужны ей. А человеку каково это читать? Все, отправляй. Что? Прочитал и молчит? Ну вот, опять ты накручиваешь. Напиши, что можно пока не возвращать. Чувствуешь, как сразу меньше поводов проверять телефон? И извинись. Человек из-за тебя чуть деньги не потерял.","caption":"Иногда после «просто не накручивай» ты начинаешь стыдиться самой просьбы. Вернуть долг вовремя обязан тот, кто его взял, даже если ты волнуешься и подбираешь слова.\nМеня зовут Юлия, я психолог, работаю с тревожными людьми от 20 до 40.\nПодписывайся, если хочется еще такого: здесь говорим о тревоге и отношениях.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Инструктаж: как спокойно попросить вернуть долг | Подписывайся, если хочется еще такого: здесь говорим о тревоге и отнош"}],"cut":[],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Звоните маме каждый день, чтобы не обиделась?\nРечь: Четыре признака, что вы звоните маме каждый день, чтобы она не обиделась.\nПервое. Вы заранее готовите оправдание. Задержались на работе, села батарейка. Просто «сегодня не хотелось разговаривать» звучит для вас как признание в преступлении.\nВторое. Свободное время хочется скрыть. Сказать, что весь вечер смотрели сериал? Блядь, тогда придется объяснять, почему для мамы десяти минут не нашлось.\nТретье. Вы раздражаетесь, когда партнер предлагает выключить телефон. Он хочет спокойно поужинать, а вы
