вушка перед отправкой сообщения убирает вопрос про встречу, чтобы показаться легкой. И оставляет только «как день?».\n\nЯ Ольга, психолог, работаю с девушками и молодыми женщинами.\nНапишите «знакомо», если узнали себя.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"занята, сижу с телефоном. Потом отвечаю: конечно, понимаю, напиши, как освободиш | Мне ведь говорят: отношения требуют у"}],"cut":["Думаю, может, сама предложу приехать.","Ему же тяжело, работа, дорога.","Могу привезти еды, посидеть тихонько рядом.","Тогда мы вообще можем не увидеться.","Он закрутится, забудет, встретит другую.","И я буду сидеть и думать, что сама все испортила, могла же проявить инициативу.","Что со мной опять что-то не так.","Видимо, я слишком много хотела, слишком быстро привязалась.","Надо было быть полегче, поинтереснее, поменьше спрашивать, когда увидимся.","Начинаю вспоминать, какой была, когда он сам писал.","Что рассказывала, как шутила.","Хочется снова так суметь, чтобы он увидел сообщение и сразу ответил.","Я даже переписку перечитываю, ищу, где все изменилось."],"before":null},{"id":"r_vybor_1_2","author":"Ольга","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Почему вы опять заслуживаете любовь\n\nРечь: Еще немножко, хорошая моя, еще немножко постарайтесь, и он обязательно вас выберет.\n\nТолько вы уже взрослая, сидите на кухне с телефоном, и вам очень хочется, чтобы мужчина сам спросил, как прошел ваш день.\n\nЕще немножко, и вы найдете правильное сообщение. Уже написали, что соскучились, потом стерли, потому что вдруг ему покажется, что вы слишком привязались, потом отправили смешное видео. Смешное видео вроде безопасно. Посмотрит, улыбнется, вспомнит про вас. И вы проверяете, посмотрел ли.\n\nЕще немножко, и вы станете совсем удобной: спокойно отнесетесь к тому, что он пропал, обрадуетесь, когда объявится, спросите про его работу и про то, как он устал, и про ваши сутки ожидания можно пока промолчать. Он же наконец написал. Жалко сейчас все испортить.\n\nЕще немножко, и он заметит, какая вы умница. И вот тут мне, блядь, очень хочется остановиться. Вы всерьез стараетесь хорошо справиться с общением, в котором вам все время одиноко.\n\nЕще немножко, и вы опять выбираете того, рядом с кем можно стараться. Вы уже знаете, чем заняться: подобрать слова, подождать, понять, простить отмененную встречу. А просто признать, что он сам почти ничего для вашего общения не делает, очень больно. Тогда придется допустить, что вы можете сделать все прекрасно и все равно остаться без его любви.\n\nЕще немножко. Вы опять стараетесь за двоих.","caption":"Иногда подруге вы говорите: «Я бы давно перестала ему писать». А свой чат открываете снова, потому что вчера он был такой нежный.\nЯ Ольга, психолог, работаю с девушками и женщинами, которым трудно в отношениях.\nСохраните, если хотите вернуться к этому разговору.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ще немножко, и вы станете совсем удобной: спокойно отнесетесь к тому, что он проп | о стараться. Вы уже знаете, чем заня"}],"cut":["Вот примерно так вы с собой разговариваете, когда он опять отвечает через сутки, и вы уже придумываете, что написать, чтобы ему наконец захотелось поговорить с вами.","Еще немножко, и получите звездочку за старание.","Как за красивую поделку: тут аккуратно приклеили, тут поправили, тут посидели подольше, и теперь вас похвалят.","Потому что вы уже оцениваете каждое свое слово: достаточно ли легко ответили, достаточно ли заинтересовали, вовремя ли поставили сердечко.","Еще немножко, потому что иногда он все-таки бывает теплым.","Вот вчера написал, что скучает, и вы сразу подумали: получилось, наконец получилось.","Значит, надо продолжать так же.","Поэтому после следующего молчания вы снова ищете, где ошиблись.","Может, зря спросили про встречу.","Может, слишком быстро ответили.","Может, надо было дать ему отдохнуть.","Еще немножко, и вы заслужите ту самую звездочку.","Вы ведь столько уже сделали, столько раз сдержались, столько вечеров оставили свободными.","И мне очень жаль этих вечеров, правда.","Вы сидели с телефоном и надеялись, что сегодня он захочет вас увидеть."],"before":null},{"id":"r_zlost_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"Текст на экране: Я на маму вообще не злюсь\nРечь: Меня сердит, когда женщине говорят: «На маму злиться нельзя, она тебе жизнь дала». Всегда.\n\nВот это требование быть благодарной каждую минуту меня особенно возмущает. Ты можешь помнить, сколько мама для тебя сделала. Можешь помогать ей, любить ее, беспокоиться о ее здоровье. И злиться, когда она опять говорит, что с твоим характером от тебя любой мужчина уйдет.\n\nЕще говорят: «Я же тебе добра желаю». И вроде бы после этого уже неудобно возражать. Только ты слышишь от нее, что неправильно живешь, неправильно выбираешь, неправильно выглядишь, и тебе от этого больно. Добрые намерения мамы ты должна учитывать, а собственную обиду куда девать?\n\nТы уже переживаешь, тебе и без того тяжело, и тут мама добавляет: «Я тебя предупреждала».\n\nА потом еще: «Будешь матерью, поймешь». И что, после этого ты обязана спокойно выслушивать любые замечания?\n\nСказать ей, с чем ты не согласна, закончить неприятный разговор, отказаться обсуждать свою внешность ты тоже можешь. Ты можешь расстроиться из-за ее слов.\n\nТы отвечаешь за то, как обходишься с мамой. Обеспечить ей дочь, которая никогда на нее не злится, ты не обязана.","caption":"Иногда «я никогда не злюсь» уточняется так: «Я боюсь даже представить, что скажу маме о своей злости». Уже за одно несогласие можно услышать, что ты жестокая.\nКакое слово ты обычно слышишь в ответ на свое «нет»? Напиши в комментариях.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Меня сердит, когда женщине говорят: «На маму злиться нельзя, она тебе жизнь | Еще говорят: «Я же тебе добра желаю». И вр"}],"cut":["Потому что после такого даже признаться себе, что мама тебя разозлила, уже как будто стыдно.","Мама дала тебе жизнь, растила, заботилась, и теперь ты должна быть довольна всем, что она говорит и делает.","Даже когда тебе обидно.","И ты начинаешь себя спрашивать: что со мной вообще такое?","Почему я раздражаюсь, когда мама звонит?","Может, я правда неблагодарная?","Все это ты можешь чувствовать к одной маме.","Тебе совершенно не обязательно выбирать что-то одно на всю жизнь.","Мама ведь старается.","Ты ее тоже чувствуешь.","Я сейчас даже не про то, согласна ли ты с маминым мнением.","Допустим, ты сама понимаешь, что ошиблась.","Ты можешь признать свою ошибку и все равно рассердиться на эти слова.","Соглашаться с мамой и радоваться тому, как она с тобой разговаривает, тоже совершенно необязательно одновременно.","Возможно, ты действительно многое поймешь.","Сколько мама уставала, чего боялась, почему ей хотелось все контролировать.","Даже если понимаешь, почему мама так говорит, тебе все равно может быть неприятно.","Когда я слышу «я вообще никогда на маму не злюсь», мне хочется оставить женщине возможность однажды сказать по-другому.","Без необходимости тут же перечислять все мамины заслуги и доказывать, что она хорошая дочь.","Просто признать: да, сейчас я злюсь.","Мне было обидно это слышать.","За то, чтобы не оскорблять маму, не угрожать ей, не унижать ее в ответ, ты отвечаешь.","Мама может расстроиться из-за твоего отказа."],"before":null},{"id":"r_zlost_1_2","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"Текст на экране: Тем, кто вообще никогда не злится\nРечь: Если ты говоришь «я вообще никогда не злюсь», а потом полвечера плачешь из-за отмененной встречи, хорошая моя, у меня к тебе вопрос. Куда ты свою злость дела?\n\nВот ты ждешь ее в гости. Договорились заранее, ты отказалась от других планов, после работы зашла в магазин, приготовила ужин. Она пишет за двадцать минут до встречи: «Слушай, я сегодня дома останусь, вообще сил нет».\n\nИ ты сидишь на кухне. Ужин готов на двоих. Уже отправила сердечко, уже пожелала ей отдохнуть. А самой хочется спросить: ты раньше сказать могла?\n\nМеня в этом месте прямо злит, сколько объяснений тебе приходится самой себе предъявлять, прежде чем признать: мне сейчас обидно, и я злюсь. Даже у себя на кухне, где тебя никто не слышит.\n\nА еще бывает: «Ты же добрая, чего ты злишься?» И ты опять проверяешь себя. Может, правда добрая бы сейчас спокойно убрала вторую тарелку, поела и пошла смотреть сериал? Ну конечно. Еще и контейнер подруге собрала бы, бедная же устала.\n\nДа, на любимых тоже можно злиться.","caption":"Иногда «я вообще никогда не злюсь» произносят с такой гордостью, что мне хочется спросить, сколько всего пришлось молча стерпеть ради этой репутации.\nЯ Юлия, психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nСохрани, если тебе трудно признать свою злость.","judge":null,"guard":[{"rule":"dvoetochiya","quote":". Она пишет за двадцать минут до встречи: «Слушай, я сегодня дома останусь, вообщ | а ей отдохнуть. А самой хочется спро"}],"cut":["Только давай без экзамена на хорошего человека.","Я уже представляю, как ты сейчас начнешь объяснять, что у подруги были причины, она устала, у нее тяжелая неделя.","А ты как?","Ты боишься даже подумать, что подруга поступила с тобой некрасиво?","Потому что вроде сразу становишься требовательной, обидчивой, той самой, с которой тяжело дружить.","Тебе ведь говорили: «Будь проще».","И ты стараешься.","Так стараешься, что подруга еще сообщение не дописала, а ты уже ответила: «Да все нормально».","Но тут же одергиваешь себя.","Ну что ты начинаешь.","«Нельзя быть такой эгоисткой».","Стоит тебе вспомнить про собственный вечер, сразу нужно доказать, что ты понимаешь чужую усталость.","Кстати, ты можешь прекрасно понимать, почему подруга отменила встречу, и все равно злиться.","Ты ведь тоже устала.","Ты тоже хотела провести этот вечер с ней.","Понимание ее причин ничего из этого не отменяет.","Ты уже сходила за продуктами, постояла у плиты, помыла сковородку, вытерла стол, нашла эту вторую одинаковую тарелку в глубине шкафа.","И теперь еще должна радостно отнестись к тому, что вечер, которого ты ждала, отменился.","Ты можешь любить подругу и сердиться на нее.","Можешь считать ее хорошей и быть недовольной тем, как она сегодня с тобой обошлась.","Можешь обходиться без оскорблений и при этом внутри совершенно отчетливо думать: ну вот какого черта.","Для злости тебе не нужно сначала окончательно разлюбить человека.","Верю.","Знакомое?","Подожди."],"before":null},{"id":"r_humor_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"Текст на экране: Мастер-класс: как дружить с психологом\nРечь: Девочки, добро пожаловать на мой мастер-класс «Как дружить с психологом и экономить».\n\nНачинаем с заботы. Пишем: «Привет, как ты?» И сразу записываем голосовое. Пока она отвечает, как у нее дела, вы как раз успеете рассказать, что у вас произошло. Очень удобно, обе поучаствовали.\n\nВот вчера, допустим, мужчина ответил мне «понятно». Без смайлика. Я отправила подруге скриншот, предыдущую переписку, объяснила, каким голосом он обычно говорит «понятно», и попросила просто глянуть.\n\nЕще я всегда говорю: «Можешь ответить, когда будет время». И через пятнадцать минут отправляю вопросительный знак.\n\nГлавное, не соглашайтесь на ее первое обычное человеческое мнение. Скажет она: «Спроси у него». Ну спасибо, блядь, спросить я и сама могла. Вы попросите профессионально. Какие у него особенности, почему он так написал, что мне ответить, чтобы он все понял, и желательно готовым сообщением, я скопирую.\n\nЕсли подруга заговорила про оплату, спокойно напомните, сколько лет вы знакомы. Вспомните, как помогли ей выбрать платье. Она тогда сорок минут крутилась перед зеркалом, и вы совершенно бесплатно сказали, что синее лучше.\n\nА она вам стоимость консультации. Охуеть, конечно.\n\nИ обязательно добавьте: «Я теперь вообще боюсь тебе что-нибудь рассказывать». Пусть успокоит вас, объяснит, что дружба ей дорога, и предложит, как вам дальше общаться.\n\nА если она скажет, что готова просто пить с вами кофе и разговаривать про отпуск, соглашайтесь. Встречу назначайте заранее, место выбирайте тихое, где вас никто не перебьет.\n\nИ захватите переписку. На большом экране ей удобнее будет.","caption":"Больше всего меня веселит уточнение «буквально одним словом», когда следом присылают переписку за весь август.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого: здесь про отношения, семью и привычку всем быть удобной.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Мастер-класс: как дружить с психологом | Начинаем с заботы. Пишем: «Привет, как ты?» И сразу записываем го | Еще я всегд"}],"cut":["Я сама подруга психолога, поэтому знаю, как важно поддерживать отношения.","Напоминать о себе.","Желательно вечером, когда она уже всех послушала и наконец может нормально послушать вас.","Я обычно захожу с простого: «Ты сейчас сильно занята?»","Если она говорит, что ужинает, прекрасно.","Слушать можно и с вилкой.","Я же разрешаю ей есть, у меня вообще очень бережное отношение к подруге.","Просто глянуть, девочки.","Очень важно так сказать.","Потому что если попросить подробно разобрать мои отношения, она может зачем-то прислать ссылку на запись.","А тут мы дружим.","Она спрашивает, что именно меня задело.","Какая молодец, сразу включилась.","Я говорю: «Вот ты мне и скажи. Ты же училась».","Я вообще считаю, что образование нужно применять.","Особенно когда близкие люди пишут в одиннадцать вечера.","Так, вижу вопрос.","Интересуюсь ли я ее жизнью?","Я же спросила, как дела.","У меня все сохранено, могу показать.","Вдруг она забыла, что я разрешила ей отвечать в удобное время.","Если прочитала и молчит, можно позвонить.","Переписываться ей, вероятно, неудобно.","Я стараюсь учитывать потребности другого человека.","Однажды она мне говорит: «Я сегодня очень устала».","Я сразу: «Бедная, понимаю. Давай тогда голосом, тебе печатать вообще ничего не придется».","Вот такие мелочи и показывают, кто вам настоящая подруга.","Она же умеет формулировать.","А я сейчас расстроена из-за этого «понятно», мне еще текст самой составлять?","Кстати, про благодарность.","Я всегда благодарю.","Пишу: «Ты лучший психолог».","Иногда еще сердечко ставлю.","Людям очень важно получать обратную связь о своей работе.","Дружба требует взаимности.","Я бы на ее месте еще подумала, почему ей так трудно принимать помощь от близких.","Я ведь тоже могу психологически выразиться, я ее давно слушаю.","Ну, когда она мне отвечает.","Она специалист, ей проще подобрать слова.","Конечно."],"before":null},{"id":"r_humor_1_2","author":"Ольга","format":"reels_scenka","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"Текст на экране: «Мы же просто по-дружески поговорим»\nПерсонажи: А это подруга, Б это я, психолог\nБ: Я тоже хочу поболтать с подругой.\nА: Так я и пришла поболтать! Вот кофе вам взяла, булочку. Сейчас расскажу, что он написал, вы скажете, почему я таких выбираю, и дальше уже нормально посидим. Я даже скриншоты по порядку разложила, чтобы вам удобнее было.\nБ: А булочку когда едим?\nА: Да хоть сейчас, я могу рассказывать, пока вы жуете. Вот тут мне нужно ваше профессиональное мнение. Как подруги, конечно.\nБ: А от подруги что хотите?\nА: Ну, чтобы вы сказали, что он охренел.\nБ: А про мой день спросите?\nА: Конечно! Устали?\nБ: Быстро получится?\nА: Наверное.\nБ: А если я просто посочувствую?\nА: Блядь. То есть я вам даже булочку спокойно съесть не даю? Сижу с кофе и жду, что вы сейчас со мной поработаете?\nБ: Ага.","caption":"Мне нравится, когда подруги рассказывают о своем. Иногда я сама хочу пожаловаться на ерунду и вместе посмеяться, без поиска причин.\n\nЯ Ольга, психолог, работаю с девушками и женщинами.\nНапишите «знакомо», если у вас тоже бывает работа после работы.","judge":null,"guard":[],"cut":["Вы только слушайте внимательно, потому что он сначала написал «посмотрим», потом поставил сердечко.","Мы же с вами близкие люди.","Но сначала проверьте, вдруг это я как-то неправильно реагирую.","Можете мне вопросы позадавать, как вы умеете.","Только сложные, я на простые уже сама себе ответила, пока к вам ехала.","Как вы?","Понимаю, весь день людей слушать.","Поэтому я вас надолго вообще не задержу.","Давайте только быстро разберемся, почему мне все время нужно чужое одобрение.","И потом сразу про вас, я правда очень хочу послушать.","Ну вы же психолог, вы наверняка уже все поняли.","Можно просто одним предложением?","Таким, чтобы я сразу перестала ему писать.","Я даже запишу, потом буду перечитывать.","И вам больше эту тему приносить не придется.","Если он ничего нового не напишет."],"before":null},{"id":"r_malysh_1","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"Текст на экране: Почему так страшно сказать маме «нет»\nРечь: Страшно, мои хорошие, сказать маме «я сегодня не приеду», хотя вы уже взрослая, сами платите за квартиру и можете вообще целую курицу приготовить, а тут смотрите на телефон и никак не решаетесь ответить.\n\nСтрашно, и вот вы стоите на кухне в субботу, только налили себе кофе, собирались весь день провести дома, потому что за неделю устали так, что даже разговаривать ни с кем не хочется. Мама звонит и спрашивает, во сколько вас завтра ждать. Именно во сколько. Вы ведь обычно приезжаете, помогаете, остаетесь поесть, потом еще сидите, потому что она просит побыть подольше. И вы уже открываете рот, чтобы сказать «часам к двенадцати».\n\nИ кофе уже остывает, и выходной вы уже мысленно отменили, хотя еще ничего ей не ответили. Вот тут мне очень жалко вас. Вы даже свое желание побыть дома успеваете обсудить с собой так, будто совершили что-то ужасное.\n\nСтрашно, потому что одним своим «да» вы можете быстро все поправить. Мама снова заговорит обычным голосом, спросит, что приготовить, и вы почувствуете облегчение. Блядь, как же хочется этого облегчения. Даже если завтра придется встать по будильнику и поехать, а вечером злиться на себя, что опять согласились. Зато сейчас мама с вами ласковая.\n\nСтрашно проверить, будет ли мама любить вас после вашего «нет».","caption":"Меня злит совет «просто откажите»: потом вы еще полвечера сочиняете сообщение, чтобы мама точно не обиделась.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли всем угождать.\nСохраните, если перед отказом долго подбираете слова.","judge":null,"guard":[],"cut":["Страшно, потому что вы уже знаете, как мама замолчит, потом скажет «ну понятно», и вы будете до вечера думать, как она там сидит обиженная, и проверять телефон, и придумывать, что бы ей еще написать.","У вас внутри будто есть маленькая кнопочка «да».","Нажали, мама довольна, можно выдохнуть.","И вы так привыкли соглашаться ради этого выдоха, что заранее готовитесь уступить, еще до того, как мама попросила.","Страшно признаться даже себе, что ехать вы сейчас совсем не хотите, потому что следом начинаете перечислять, сколько мама для вас сделала, как редко вы видитесь и как ей будет грустно.","Страшно перестать надеяться, что однажды вы найдете такие слова, после которых мама сразу скажет: конечно, отдыхайте, я понимаю.","Вы уже и про усталость рассказывали, и про дела, и тихонечко просили перенести встречу, и каждый раз следили за ее голосом.","Пока мама недовольна, вам трудно считать свой отказ допустимым.","Хочется еще объяснить, еще заслужить ее согласие."],"before":null},{"id":"r_malysh_1_2","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"Текст на экране: Как хорошая девочка боялась отказать\nРечь: Хорошая моя, вы опять сказали «да», а теперь хочется плакать? Я вот сейчас сижу с телефоном, прочитала совет: «Просто научитесь отказывать». И сижу, возмущаюсь. Просто скажите, просто перестаньте бояться, просто спокойно выдержите, когда подруга обидится, перестанет вам писать и еще общим знакомым расскажет, какая вы эгоистка. Ну да, блядь. Делов на минуту.\n\nА потом подруга просит помочь с переездом в субботу.\n\nВы всю неделю ждали выходного. Хотели проснуться без будильника и хотя бы позавтракать сидя. Подруга пишет: «Слушай, выручишь? Там немного вещей».\n\nИ вы смотрите на сообщение, уже понимаете, что придется встать рано, ехать через весь город, таскать коробки, а потом еще вечером доделывать свое. Вам совсем туда не хочется.\n\nНо вы печатаете: «Да, конечно».\n\nВот вы еще на кухне, даже чай не допили, а уже оправдываетесь перед подругой, которая пока ничего такого не сказала.\n\nИ меня ужасно злит это «просто откажите». Я сама сейчас разошлась, хотя собиралась объяснить ласково.\n\nВы боитесь, что после отказа она больше не позвонит.","caption":"Иногда после вашего «не смогу» подруга отвечает: «Хорошо, спрошу еще у кого-нибудь». А вы уже успели придумать объяснение на полстраницы.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nПодписывайтесь, если хочется еще таких разговоров о границах, близости и вечном желании всем угодить.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не допили, а"},{"rule":"dvoetochiya","quote":"сейчас сижу с телефоном, прочитала совет: «Просто научитесь отказывать». И сижу, | хотя бы позавтракать сидя. Подруга пи"}],"cut":["Вы ведь знаете это слово.","Коротенькое совсем.","Только когда надо его сказать близкому человеку, вы уже думаете, будете ли вы после этого ему нужны.","Давайте я совсем простыми словами.","Представьте, что за каждое ваше согласие вам дают наклеечку: «Хорошая девочка».","Вы помогли, вас похвалили.","Вы согласились, вам улыбнулись.","Вы подвинули свои дела, вам сказали: «Что бы я без тебя делала».","И вам так хорошо в эту секунду.","Вас любят, вам рады, с вами хотят общаться.","Потому что очень хочется снова получить эту наклеечку.","Особенно когда вы понятия не имеете, как подруга отнесется к отказу.","Вдруг скажет: «Понятно. Когда тебе надо, я всегда рядом».","И что вы тогда ответите?","Начнете вспоминать, сколько раз она вам помогала, достаточно ли вы сделали в ответ, имеете ли вообще право в эту субботу остаться дома.","Потому что вы уже заранее представляете, как подруга прочитает ваше сообщение и решит больше к вам не обращаться.","И вам страшно проверить, будет ли она дружить с вами, если иногда вы заняты, устали, хотите провести субботу дома.","Поэтому вы соглашаетесь, сразу чувствуете облегчение, а потом злитесь, когда ставите будильник на свой единственный выходной.","И в следующий раз опять соглашаетесь, потому что так вы хотя бы знаете, как сохранить привычное общение.","Можно сказать подруге: «В субботу я не смогу».","И очень бояться, пока она печатает ответ.","«Нет»."],"before":null},{"id":"r_malysh_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"Текст на экране: Когда стыдно обижаться на маму\n\nРечь: Девочки, мои хорошие, кто опять обиделся на маму и теперь ругает себя за то, что обиделся? Ты?\n\nВот ты ей звонишь. Тебя повысили. Ты ждала этого разговора с начальницей, переживала, согласуют ли, и теперь хочется рассказать маме. Даже улыбаешься, пока идут гудки.\n\nМама слушает и говорит: «Ну наконец-то. В твоем возрасте уже давно пора».\n\nИ ты замолкаешь. Потому что еще минуту назад радовалась, а сейчас чувствуешь себя какой-то отставшей, которую наконец согласились взять.\n\nМама спрашивает: «Что ты молчишь?» Ты отвечаешь: «Мам, мне обидно». И слышишь: «Господи, тебе слова нельзя сказать».\n\nВсе. Дальше ты объясняешь, что нормально к ней относишься, что понимаешь, она хотела как лучше, что ты благодарна. До новой должности вы уже толком и не договорили.\n\nДа уж. Повышение получила, начальнице ответила, документы подписала, домой продукты донесла. ВЗРОСЛАЯ. А после разговора с мамой сидишь на кухне и оправдываешься перед ней уже мысленно. Еще много, много, много раз.\n\nИ все равно хотеть, чтобы в тот вечер она сказала тебе что-нибудь теплое.\n\nТебе больно, когда мама тебя обесценивает.","caption":"Мне грустно, когда взрослые дочери начинают говорить о своей обиде с длинного объяснения, какая мама хорошая. Будто без этого я сразу подумаю о них что-то плохое. Со мной можно говорить о маме и без вступления в ее защиту.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Мама слушает и говорит: «Ну наконец-то. В твоем возрасте уже да | Мама спрашивает: «Что ты молчишь?» Ты отвечаешь | : «М"}],"cut":["И уже успела вспомнить, как она ради тебя старалась, сколько работала, что покупала, куда возила?","Подожди, маленькая.","Ты сейчас еще и за маму все объяснишь, и себя отчитаешь, и в конце извинишься за испорченный разговор.","Я прямо расстраиваюсь, когда думаю, сколько всего ты успеваешь сделать, прежде чем признать: мне было больно.","На ссадинку ведь можно посмотреть и сказать: щиплет.","С мамой почему-то надо сначала доказать, что тебе вообще разрешается чувствовать боль.","А потом сидишь с телефоном и думаешь: зачем вообще позвонила?","И тут же стыдишься.","Это же мама.","Она ждала звонка.","Обрадовалась, наверное.","Может, я действительно придираюсь?","Боишься признать обиду?","Потому что тогда будто придется согласиться, что ты неблагодарная дочь.","Та самая, которой сколько ни дай, все мало.","Сердишься на себя, что до сих пор хочется маминой радости?","Потому что взрослая уже.","Работаешь, платишь за квартиру, сама записываешься к врачам.","И вроде положено обходиться без этого маминого: «Как здорово, я за тебя рада».","Мне хочется здесь тебя остановить.","Ты ведь даже порадоваться толком не успела.","Уже разбираешь, каким тоном сказала «мам», достаточно ли мягко ответила, могла ли вообще промолчать.","И когда ты говоришь себе, что обижаться глупо, тебе приходится еще и прятать то, что ты почувствовала.","Даже наедине с собой.","Ты можешь быть благодарна маме за многое.","Помнить, как она заботилась.","Любить ее."],"before":null},{"id":"r_malysh_2_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"Текст на экране: Девочка, которой обидно на маму\nРечь: Моя хорошая, тебе на маму обидно, а ты уже себя за это отругала?\n\nВот ты звонишь рассказать, что тебя повысили. Ты еще до звонка улыбаешься, думаешь, как скажешь, с чего начнешь. Мама спрашивает, сколько теперь будут платить, ты отвечаешь, и она говорит: «Ну смотри, лишь бы со здоровьем потом не началось. Ты и так вечно уставшая».\n\nИ ты уже объясняешь, что справишься, что там нормальный график, что ты все обдумала. Повышение свое защищаешь. Перед мамой. Хотя позвонила порадоваться вместе.\n\nМеня очень трогает, как быстро ты находишь для мамы доброе объяснение. Даже с мокрыми глазами продолжаешь: она хотела как лучше.\n\nТы уже вынесла переезды с пакетами, собеседования, ремонт у соседей, рабочие созвоны с температурой, мамино «я только спросила» после получасового разговора. Господи, ты даже разобралась, куда у нее пропал звук в телефоне. Снова.\n\nИ все равно после звонка сидишь на кухне, а подруге про повышение пока не пишешь. Уже кажется, что радоваться особенно нечему. Хотя час назад тебе очень хотелось рассказать.\n\nИ позвонила самому близкому человеку, чтобы он побыл рядом с тобой в этой радости.\n\nТы ждала, что мама порадуется.","caption":"Иногда маме рассказывают хорошую новость только через неделю, когда уже отпраздновали с теми, кто обрадуется. А потом еще переживают, что рассказали ей последней.\nЕсли хочется, напиши в комментариях, каких слов тебе от мамы не хватает.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"дут платить, ты отвечаешь, и она говорит: «Ну смотри, лишь бы со здоровьем потом | ение. Даже с мокрыми глазами продолжа"}],"cut":["Опять сначала вспомнила, как ей было тяжело, как она работала, как тебя растила, и только потом заметила, что сама сидишь и плачешь?","Ну конечно.","Маму ты пожалела сразу.","С собой пока разбираешься, имеешь ли право.","Ты ведь у нас взрослая девочка.","Работаешь, счета оплачиваешь, маме телефон настраиваешь.","И вдруг так хочется, чтобы она сказала: «Как я за тебя рада».","Прямо как маленькой, которая принесла маме рисунок и ждет, когда мама посмотрит.","Почему тебе до сих пор это нужно?","Потому что ты ее дочь.","Ты и выросла, и осталась ее дочерью.","А потом кладешь телефон и думаешь: чего я опять ждала?","Она же беспокоится.","Другие вообще матерям не звонят, а моя хотя бы интересуется.","Подожди, маленькая.","Ты уже все про нее вспомнила.","И как она устает, и как волнуется, и как сама радоваться не умеет.","А тебе сейчас обидно.","Ты приготовила хорошую новость, выбрала минуту, позвонила, и весь разговор объясняла, почему тебе можно принять это повышение.","Стыдно признаться, что хотелось похвалы?","Конечно, стыдно, если на твое «мам, посмотри» часто отвечали: «Подожди, я занята», «Что ты все внимания требуешь».","Потом ты и сама начинаешь себе говорить: сколько можно, взрослая уже.","Да взрослая.","Вот это мне особенно жалко.","Ты ведь уже успела порадоваться."],"before":null},{"id":"r_drug_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Текст на экране: У нее все хорошо. Опять пропала.\n\nРечь: «Кажется, мы дружим, только когда у нее все плохо».\n\nВот вечером приходит голосовое. Она плачет, они опять поссорились, она не понимает, что делать. Вы уже собирались спать, но садитесь на кухне, включаете сообщение потише, отвечаете. Потом еще одно слушаете. Даже утром первым делом спрашиваете, как она.\n\nЧерез несколько дней они мирятся. Вы узнаете об этом из фотографии в сторис. Пишете, что рады за нее, заодно предлагаете встретиться в выходные. Она ставит сердечко. Про выходные ничего не отвечает.\n\nЯ, кстати, иногда начинаю искать сложные объяснения, а все оказывается проще: подруга правда закрутилась, отложила ответ, забыла. Написала позже, предложила другой день, спросила про вас. Такое бывает.\n\nМеня здесь особенно задевает, как постепенно вы перестаете что-либо ей рассказывать. Хорошую новость оставляете до встречи. Когда у нее случается очередная ссора, новость уже кажется несвоевременной. Ну куда вы сейчас со своим повышением, она вон плачет. Потом вы забываете, что вообще хотели поделиться.\n\nНо вдруг отвлечете, вдруг она с ним, вдруг ей сейчас совсем не до разговоров.\n\nВы ведь помните, как ей бывает тяжело.\n\nОна знает, как вам без нее?","caption":"Иногда подруга помнит все подробности своих ссор, которые вы вместе обсуждали, и даже не знает, что вы сменили работу. Мне грустно от того, сколько неловкости бывает вокруг обычного желания рассказать о себе.\nЕсли узнаете такую дружбу, напишите в комментариях «знакомо».","judge":null,"guard":[{"rule":"ostorozhno","quote":"5 оговорок: иногда, бывает"}],"cut":["За годы работы я замечаю, как трудно людям даже произнести такое про подругу.","Сразу хочется добавить, что она вообще хорошая, просто у нее сейчас отношения, работа, много всего.","А вы вроде бы взрослый человек, понимаете, что никто не обязан постоянно быть на связи.","И я каждый раз обращаю внимание: вы уже объяснили, почему она вам не пишет.","Про то, как вам без нее, пока ни слова.","Вам важно, чтобы она успокоилась, и вы правда переживаете.","И вот тут вам обидно.","Потому что на кухне вы с ней сидели до ночи, а выпить кофе вместе опять не получается.","Но сказать об этом неловко.","У нее наконец все хорошо, и вы сейчас со своими претензиями.","Еще решит, что вы ревнуете ее к отношениям или хотите, чтобы она снова плакала вам в телефон.","Хотя вы были бы рады просто посидеть с ней и посмеяться.","Без обсуждения очередной ссоры.","У вас ведь тоже за это время что-то произошло.","Но я сейчас про знакомое ожидание: вы уже знаете, при каких обстоятельствах она снова позвонит.","И когда видите ее имя на экране, первым делом спрашиваете, что случилось.","И со временем уже сами звоните ей все реже.","Вроде бы повода нет, у вас ничего ужасного не случилось.","Просто хотели услышать ее голос.","А когда ей снова плохо, вы отвечаете."],"before":null},{"id":"r_drug_1_2","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Текст на экране: Друзья, которые звонят только когда им плохо\n\nРечь: Четыре признака друзей, которые появляются, когда им плохо, и пропадают, когда все хорошо.\n\nПервое, они рассчитывают, что вы всегда сможете поговорить. Но другу плохо, поэтому вы берете трубку. А он может даже не знать, что вы сменили работу.\n\nВторое, встретиться с ними получается только срочно. Когда вы предлагаете спокойно поужинать в выходные, они отвечают: «Давай спишемся». И дальше тишина. И все-таки обидно: на ваше приглашение он так и не ответил. Вот это меня задевает.\n\nТретье, рядом с ними вы сокращаете собственные неприятности. Начинаете рассказывать, что вам тяжело, слышите: «Да, понимаю, у меня вообще ужас», и дальше снова слушаете.\n\nЧетвертое, вам бывает тревожно слышать, что у друга все наладилось. Вроде бы дорогой вам человек, надо радоваться, а вы уже понимаете, что теперь он исчезнет до следующей беды. А когда ему хорошо, вы скучаете по нему в одиночку.\n\nКогда вы в последний раз разговаривали просто потому, что он по вам соскучился?","caption":"Я замечаю, как трудно бывает признаться: вы уже устали отвечать, но по самому другу все равно скучаете. Особенно если раньше вы могли часами обсуждать любую ерунду.\nСохраните, если хотите вернуться к этому разговору.","judge":null,"guard":[{"rule":"zachin","quote":"Текст на экране: Друзья,"},{"rule":"dvoetochiya","quote":"койно поужинать в выходные, они отвечают: «Давай спишемся». И дальше тишина. И вс | е-таки обидно: на ваше приглашение о"}],"cut":["И почему вы можете долго этого не замечать, хотя уже обижаетесь и каждый раз обещаете себе больше не отвечать среди ночи.","Днем вы на работе, вечером укладываете ребенка, уже легли, уже выключили свет.","Вы знаете, как он поссорился с начальником, что ему написала девушка, почему он опять не спит.","Вы собирались рассказать, только подходящего момента все нет: у него опять что-то случилось.","А потом в четверг вечером друг пишет, что расстался, и вы отменяете кино, едете к нему, сидите на кухне до ночи.","Через неделю он мирится с девушкой, выкладывает фотографии из ресторана.","Вы рады, что они помирились.","Вы ведь тоже хотели с ним посидеть, поговорить, посмеяться, просто провести вечер вместе.","Постепенно вы уже заранее говорите, что у вас все нормально.","Так проще, чем начать про свое и остаться с ощущением, что вас даже не дослушали.","А потом близкие удивляются, почему вы ни к кому не обращаетесь за поддержкой.","Вы обращались.","Просто давно перестали ждать ответа.","И за это еще стыдно.","Снова будете смотреть на непрочитанное сообщение, вспоминать, не сказали ли лишнего, и придумывать повод написать.","Получается, больше всего вы общаетесь именно тогда, когда другу плохо."],"before":null},{"id":"r_mama_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Текст на экране: Мамы, которые ненавидят себя после срыва\nРечь: Четыре признака мамы, которая злится на ребенка, а потом еще долго себя за это наказывает.\nПервое, вы отменяете себе отдых. Ребенок уснул, вы идете оттирать стульчик, складывать вещи, делать хоть что-нибудь полезное.\nВторое, вы скрываете от мужа, насколько устали. Он спрашивает, как прошел день, вы отвечаете: нормально.\nТретье, вы пытаетесь срочно стать самой терпеливой мамой на свете. Вот вы укладывали ребенка, он снова встал, попросил пить, потом другую пижаму, вы рявкнули и увидели, как он замолчал. Все, блядь. И вот тут меня особенно цепляет, сколько требований вы себе добавляете за одну минуту.\nЧетвертое, вы перестаете верить, когда ребенку с вами хорошо. Он смеется, лезет обниматься, зовет играть, а вы смотрите на него и думаете: сейчас радуется, а потом вырастет и вспомнит, какая я была ужасная. Меня бесит, как легко мама может вычеркнуть все, что делала для ребенка целый день, и помнить только эти несколько секунд.\nА сколько времени вы потом разговариваете с собой тем самым голосом, за который себя ненавидите?","caption":"Иногда мама даже подруге пишет «я ужасная мать», стирает и отправляет фотографию ребенка.\nМне хочется знать, что она хотела написать до этой фотографии.\nЕсли узнали себя, напишите в комментариях одно слово: «знакомо».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"прашивает, как прошел день, вы отвечаете: нормально. | играть, а вы смотрите на него и думаете: сейчас радуется, а потом"}],"cut":["Вы уже помирились, ребенок принес вам книжку, устроился рядом, а вы все еще вспоминаете, каким голосом с ним разговаривали.","Собирались вечером посмотреть сериал, но после срыва как будто уже нельзя просто сесть и получить удовольствие.","Потому что хорошая мать сегодня из вас, по вашему ощущению, так себе, значит, хотя бы дома должно быть чисто.","И спать ложитесь позже, хотя завтра опять вставать с ребенком.","Потому что рассказать про усталость значит дойти до того момента, когда вы крикнули.","И тут уже страшно: вдруг он посмотрит на вас и решит, что ребенка с вами лучше вообще не оставлять.","Хотя вам очень хотелось просто сказать, что сегодня было тяжело, и чтобы вас обняли.","Но вы молчите, и он идет заниматься своими делами, уверенный, что у вас все нормально.","Теперь вы согласны еще читать, носить его на руках, лежать рядом сколько угодно, только бы он снова улыбнулся.","Вы уже еле держались, а теперь еще и пообещали себе больше НИКОГДА не раздражаться.","Даже мысленно.","Даже завтра, если снова почти не поспите.","Вы сидите с ним на ковре, он показывает вам машинку, вы киваете и снова вспоминаете свой крик."],"before":null},{"id":"r_mama_1_2","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Текст на экране: Разозлилась на ребенка. Теперь ненавижу себя\n\nРечь: Девочки, кто после резкого «да постой ты спокойно» уже мысленно лишил себя права называться хорошей мамой?\n\nИ меня прямо задевает, как быстро вы доходите до этого последнего пункта.\n\nВот вы собираетесь гулять. Ребенок уже просился на улицу, вы достали комбинезон, присели перед ним в коридоре, вам жарко, потому что свою куртку вы зачем-то надели первой. Он убирает ногу. Вы ловите носок, поправляете пятку, он садится на пол и стягивает то, что вы только что натянули.\n\nВы просите: ну дай ножку. Еще раз просите. Потом уже громче. Потом резко: «Да хватит уже!»\n\nРебенок смотрит на вас, и тут вы начинаете ненавидеть себя.\n\nА он сейчас вообще хочет снять второй носок. И вы сидите перед ним с этим ботинком, вам стыдно, вы целуете его в макушку и обещаете себе больше НИКОГДА.\n\nБлядь, вы даже сейчас продолжаете стоять в застегнутой куртке и потеть.\n\nНо к вечеру вы вспоминаете весь день и говорите мужу: «Я сегодня ужасно себя вела».\n\nА он спрашивает, что случилось. И вы рассказываете только про ботинок.","caption":"Еще можно услышать от близких: «Да ты же сама хотела ребенка». После такого в следующий раз проще промолчать, даже когда очень хочется с кем-нибудь поговорить.\nЯ злюсь, когда маме приходится сначала доказывать, что она любит своего ребенка, чтобы рассказать, как ей трудно.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Вы просите: ну дай ножку. Еще раз просите. Потом уж | е громче. Потом резко: «Да хватит уже!» | вы вспоминаете весь день"}],"cut":["Мои дорогие, вы еще ребенку второй ботинок не надели, а себе уже все объяснили: ужасная мать, бедный малыш, надо было вообще детей не заводить.","Что, уже думаете, что он вас боится?","Да, потому что увидели, как он замолчал, и вам самой стало страшно от своего голоса.","Хотите немедленно все исправить, обнять его, поцеловать?","Вам ужасно хочется снова увидеть, что он к вам тянется.","Вот это «никогда» меня особенно цепляет.","Вы же его всерьез обещаете.","В следующий раз спокойно, ласково, сколько понадобится, хоть до вечера будем обуваться.","Вы уже представляете себя мамой, которая всегда умеет подождать.","Боитесь признаться кому-нибудь, насколько сильно разозлились?","Еще бы.","В голове уже готов чужой ответ: он же маленький, ты взрослая, должна себя контролировать.","Вы и сами себе это сказали.","Несколько раз.","Пока обували, пока спускались, пока ребенок нажимал кнопку лифта.","И вот вы уже на улице.","Он бежит к луже, а вы продолжаете вспоминать его лицо в коридоре.","Можно было мягче.","Можно было подождать.","Зачем я так сказала.","Девочки, вы сегодня уже подмывали, вытирали, доставали еду с пола, искали именно ту ложку, переодевали мокрые штаны, уговаривали выплюнуть бумажку.","Господи, бумажку тоже пришлось обсуждать.","И в коридоре вы разозлились.","Сказали резко.","Вам жаль, что так вышло.","Конечно."],"before":null},{"id":"r_stud_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: Открою диплом, когда смогу нормально думать\n\nРечь: Откладываешь. До сдачи уже совсем мало времени, ты открываешь диплом, перечитываешь последние строчки и тут же находишь, что еще нужно посмотреть перед тем, как писать. Одну статью, требования кафедры, сообщение научной руководительницы. Ну надо же сначала разобраться. И вот ты уже час сидишь за ноутбуком, устала, а в документе все тот же абзац.\n\nОткладываешь, когда смотришь на этот абзац и заранее представляешь, как его прочитают. Здесь спросят, откуда ты это взяла, здесь скажут, что вывод слишком простой, здесь вообще станет понятно, что ты плохо разбираешься в собственной теме. И ты удаляешь предложение, которое только что написала. С ним ведь уже можно спорить, его можно назвать слабым. Пустое место пока никто не оценивал.\n\nОткладываешь, когда за одним неудачным предложением у тебя сразу следует: как я вообще доучилась до последнего курса? Но ты уже вспоминаешь, как отвечала на семинаре, что не поняла на лекции, где подсмотрела в конспект, и находишь еще много, много, много доказательств, что с дипломом ты тоже не справишься.\n\nОткладываешь, потому что боишься дописать и решить: вот на что я способна, даже когда стараюсь.","caption":"Можно весь вечер просидеть дома «за дипломом» и отказать себе даже в ужине с подругой. А потом еще ругать себя за то, что совсем не устала бы, если бы действительно работала.\nМне грустно, когда за такой вечер ты еще и называешь себя бездельницей.\nОтправь той, с кем сейчас пишешь диплом.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"дачным предложением у тебя сразу следует: как я вообще доучилась до последнего ку | шь, потому что боишься дописать и ре"}],"cut":["Откладываешь, когда очень хочется сохранить надежду, что вообще ты можешь написать хорошо, просто сегодня не получилось собраться.","Вот завтра выспишься, поймешь, с чего начать, и напишешь сразу нормально.","Мне очень жаль, сколько сил ты тратишь на это ожидание подходящего состояния.","Потому что вечером ты уже злишься на себя, утром садишься с еще большим страхом и снова ждешь момента, когда сможешь написать так, чтобы самой к себе не придраться.","Хотя ты пока написала всего одно неудачное предложение.","До следующей строчки ты так и не дошла, зато себя уже успела оценить целиком.","Откладываешь, когда даже признаться себе в этом страшно.","Ты ведь говоришь, что ленишься, что опять сидишь в телефоне, что у всех получается, и только ты никак не начнешь.","А если спросить, чего именно ты ждешь от завтрашнего утра, окажется: хочется наконец быть уверенной, что получится хорошо.","Ты садишься писать и одновременно требуешь от себя заранее знать, что написанное одобрят.","И пока такой уверенности нет, ты продолжаешь перечитывать тот же абзац.","Откладываешь, когда замечаешь, что завтра снова придется открыть этот документ, и уже трудно верить, что за ночь ты вдруг перестанешь бояться оценки.","Тут мне хочется задержаться.","Потому что ты можешь очень хотеть закончить диплом, думать о нем весь день и все равно закрывать файл.","Пока ты его не дописала, можно говорить себе, что тебе просто не хватило времени."],"before":null},{"id":"r_stud_1_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: «Я опять не села за диплом»\nПерсонажи: А это я, Б это психолог\nА: Только не говори мне «просто начни». Я каждый день собираюсь начать. Срок сдачи уже скоро, я даже друзьям перестала отвечать, потому что они спрашивают, как диплом.\nБ: Что происходит, когда открываешь файл?\nА: Открываю, читаю свой абзац, думаю, какая ерунда.\nБ: Что будет, если оставить этот абзац?\nА: Все уже присылают главы, обсуждают правки, а я отправлю вот это, и она поймет, что я ничего не понимаю.\nБ: Она уже видела этот абзац?\nА: Мне даже представить стыдно.\nБ: Какого ответа ты ждешь?\nА: Что с таким текстом меня вообще нельзя допускать к защите.\nБ: И что делаешь после этого?\nА: Закрываю его. Иду мыть чашку, потом еще зачем-нибудь встаю. Ладно, я поняла, что боюсь ее ответа. Только мне все еще страшно. Где обещанное желание писать?\nБ: А что ты сейчас заметила?\nА: Что я сижу над своим абзацем, а в голове уже слушаю, как меня отчитывают. Хотя руководительница даже не знает, что я сегодня открывала диплом.\nБ: Да. Ты уже ответила за нее.","caption":"Меня раздражает совет «просто сядь и сделай», когда его повторяют человеку, который уже сидит перед открытым документом. Он вполне может просидеть так весь вечер.\n\nЯ Юлия, психолог, работаю со студентами, которым тревожно учиться и взрослеть.\nПодписывайся, если хочется еще таких разговоров про учебу, отношения и тревогу.","judge":null,"guard":[],"cut":["Потом ищу еще одну статью, чтобы разобраться получше.","Статей уже столько, что я даже не помню, какую зачем сохранила.","Руководительница прочитает.","Спросит, чем я вообще занималась.","Нет, конечно.","Я же хочу сначала нормально написать.","Чтобы можно было отправить и потом не сидеть с телефоном, боясь открыть ее ответ.","И я понимаю, звучит ужасно, но именно это я представляю каждый раз, когда открываю документ."],"before":null},{"id":"r_gnezdo_1","author":"Михаил","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","text":"Текст на экране: Тем, у кого дети выросли и уехали\n\nРечь: Это для вас, если дети выросли, уехали, а вы утром лежите и думаете: ну и для чего мне теперь вставать?\n\nА вы почему-то плачете на кухне. И еще проверяете, чтобы по телефону голос был нормальный, бодрый. Вдруг услышат и начнут переживать.\n\nПоэтому рассказываете, что у вас все хорошо, спрашиваете, поел ли он, и заканчиваете разговор, хотя хотели еще немного послушать, как у него прошел день.\n\nЯ вот на этом «радоваться надо» каждый раз останавливаюсь.\n\nИ вот утром вы по привычке ставите на стол вторую чашку. Потом убираете ее обратно. Вы столько раз мечтали спокойно выпить чай. А теперь сидите и даже не знаете, чего вам самой или самому хочется на завтрак. Раньше покупали то, что любят дети.\n\nТеперь вам трудно признаться, что хочется услышать из комнаты самое обыкновенное: «А у нас есть что-нибудь поесть?» Даже смешно немного. Столько лет отвечали на этот вопрос, иногда сквозь зубы. Сейчас готовы подробно рассказать про все, что есть в холодильнике.\n\nВам их очень не хватает.","caption":"В разговоре с уехавшими детьми иногда все время уходит на бытовые вопросы. До рассказа о том, что сегодня вас рассмешило или расстроило, так и не доходят.\n\nЕсли вы подолгу не можете встать, почти ничего не радует и трудно заниматься обычными делами, стоит обратиться к психологу или психиатру. Об этом можно говорить, даже когда у детей все хорошо.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"сли, уехали, а вы утром лежите и думаете: ну и для чего мне теперь вставать? | я услышать из комнаты самое обыкновенное:"}],"cut":["Дорогие мои, вы уже и за это себя отругали?","Дети самостоятельные, у них все складывается, радоваться надо.","Боитесь, что ребенок решит, будто бросил вас?","Вы рады за своего ребенка.","Вы хотели, чтобы он мог жить самостоятельно, выбирать, где работать, с кем быть.","И одновременно вам очень тоскливо дома.","Оба чувства у вас есть, и от этого вы еще больше путаетесь: как же так, все получилось, чего мне тогда плохо?","А вы сколько лет утром вставали и сразу знали, кому что нужно?","Кого разбудить, кому напомнить, что сегодня к врачу, кто опять ушел без завтрака.","Даже когда дети уже вполне могли сами собраться, вы все равно держали в голове их день.","Иногда раздражались, конечно.","Еще бы.","Можно спокойно позавтракать, никто не занимает ванную, никто из комнаты не кричит, что потерял ключи.","Скучаете и стыдитесь этого?","Потому что уже успели сказать себе: взрослый человек, пора бы иметь собственную жизнь.","Ух, какие вы с собой строгие.","Вам и погрустить теперь надо так, чтобы никто не заметил и желательно к понедельнику закончить.","Да вы уже пережили эти подъемы затемно, родительские чаты, собрания после работы, поиски нужной тетради вечером в воскресенье, ожидание звонка, когда ребенок впервые пошел куда-то допоздна.","И вот это вот все.","Уставали, злились, мечтали, чтобы вас наконец оставили в покое."],"before":null},{"id":"r_gnezdo_1_2","author":"Михаил","format":"reels_malysh","asked":"reels_auto","intent":"podderzhka","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","text":"Текст на экране: Дети уехали. А утром куда вставать?\nРечь: Дорогие мои мамы и папы, у которых дети выросли, а вы теперь утром лежите и думаете: ну и зачем мне вставать? Ребенок устроился, живет отдельно, сам покупает продукты. Радоваться надо. А вам хочется, чтобы он хоть спросил, где у него носочки.\n\nСтыдно, что хочется быть нужными? Понимаю.\n\nВаш домик теперь тихий. Вы этой тишины когда-то очень хотели. Особенно когда в воскресенье в семь утра кто-нибудь начинал искать зарядку и заодно будил всех остальных. А теперь можно спать. И почему-то лежать грустно.\n\nИ вот утро. Вы ставите на стол лишнюю чашку. Рука сама потянулась. Потом убираете ее обратно и думаете: господи, ну что я как маленький, люди детей замуж выдают, в другие страны провожают, а я тут из-за чашки.\n\nТак, подождите. Давайте я сейчас тоже обойдусь без бодрого предложения немедленно найти хобби. Меня задевает, как быстро окружающие начинают занимать вас делами, когда вы говорите, что вам одиноко. Запишитесь туда, съездите сюда. Вы, может, сегодня просто хотели вместе позавтракать.\n\nВам тоже нужна близость.","caption":"Взрослые дети могут даже не догадываться, что родители ждут звонка: при встрече все улыбаются и говорят, что все хорошо. Если утро за утром вы чувствуете бессмысленность и вам трудно заниматься обычными делами, об этом стоит поговорить с психологом.\nЯ Михаил, психолог, работаю с женщинами и мужчинами от 45 до 60.\nЕсли знакомо, напишите в комментариях «скучаю».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"осли, а вы теперь утром лежите и думаете: ну и зачем мне вставать? Ребенок устрои | ась. Потом убираете ее обратно и дум"}],"cut":["Солнышки, вы ведь еще и ругаете себя за это.","Вы столько лет каждый день знали, кому и для чего нужны, что сейчас можете совсем растеряться.","Почему так пусто?","Потому что вы привыкли жить рядом.","Слышать, как ребенок ходит, видеть, что он поел, спрашивать, во сколько вернется.","Каждый день у вас было много маленьких поводов заговорить друг с другом.","Теперь для разговора приходится звонить.","Мне очень жаль, когда вы еще и за эту чашку себя отчитываете.","Вы ведь можете прекрасно понимать, что детям пора жить отдельно, помогать им собирать вещи, радоваться фотографиям новой квартиры, а утром заходить на кухню и скучать.","Вчера радовались, сегодня скучаете, к вечеру снова порадуетесь, когда позвонят.","Боитесь лишний раз набрать номер?","Кажется, что начнете мешать.","Поэтому смотрите, когда ребенок был в сети, и откладываете телефон.","Очень хочется услышать голос, но вы уже заранее сердитесь на себя за эту потребность.","Хотя вы пока даже никому не позвонили.","Вы уже пережили садик с утра пораньше, школьные чаты, мокрую сменку, экзамены, разговоры через закрытую дверь, сборы к переезду и вопрос «куда положили мои документы?», заданный взрослым самостоятельным голосом.","Вы столько раз привыкали к тому, что дети растут.","Сейчас снова приходится привыкать.","Можно пока скучать.","Можно сказать ребенку: «Мне тебя сегодня очень не хватает».","Без требования срочно приехать, без счета за все бессонные ночи.","Просто сказать, как у вас дела.","Одновременно."],"before":null},{"id":"r_razvod_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"mif","topic":"«ради детей надо сохранить семью»","text":"Текст на экране: Тренинг «Сохранить семью ради детей»\nРечь: Здравствуйте, мамы, я ведущая тренинга «Сохранить семью ради детей». Папы сегодня отсутствуют, у них дела. Начнем без них, мы уже привыкли.\n\nВот, например, у дочери школьный концерт. Она выучила песню, вечером вам на кухне спела, потом спросила, придет ли папа. Вы мужу написали, напомнили, костюм погладили, с работы отпросились. Он сказал, что постарается. Какой молодец, уже старается. Сразу его похвалите, чтобы у него закрепилось желание когда-нибудь постараться еще.\n\nДочь спрашивает, почему папа опять не пришел? Тут главное правильно ответить. Папа работает. У папы дела. Папа очень хотел. Что значит, вы не знаете, хотел ли он? Ну придумайте, господи, у вас же хорошо получается: костюм нашли, букет купили, теперь найдите папе уважительную причину.\n\nВас бесит, что вы ему уже три раза объясняли, как это для нее важно? Ну объясните в четвертый. Вы же мать, вы умеете находить подход к детям. С мужем тоже постарайтесь: выберите момент, подберите слова, дождитесь, когда он поест. Хрен с вашим вечером, у нас семья.\n\nУговорите. Пусть еще открытку ему сделает, напишет, как любит. Папам тоже нужно внимание, иначе откуда у них возьмется желание проводить время с семьей? Мы же здесь все взрослые женщины, понимаем.\n\nИ обязательно сделайте общее фото. Поставьте мужа рядом с дочерью, попросите его обнять ее, сами улыбайтесь. Подпишите: «Наша семья». Очень полезно потом пересматривать, когда опять захочется развестись. Вот же вы все вместе, вот же улыбается ребенок. Какие еще вам нужны доказательства?\n\nФото мужу отправьте. Пусть узнает, как хорошо вы сегодня провели время.","caption":"Меня злит, когда маме предлагают еще и объяснять ребенку каждый папин пропуск. Особенно когда папа сам вполне может позвонить дочери и поговорить с ней.","judge":null,"guard":[{"rule":"rublenye","quote":"Папа работает. У папы дела. Папа очень хотел."},{"rule":"dvoetochiya","quote":"йте, господи, у вас же хорошо получается: костюм нашли, букет купили, теперь найд | одход к детям. С мужем тоже постарай"}],"cut":["Кто у нас думает о разводе?","Так, руку опустите, ребенок увидит.","Вы вообще о ребенке подумали?","Прекрасно, значит, теперь будете думать еще и за мужа.","Записывайте главное: ребенку нужна полная семья.","Мама, папа, ребенок.","Все по документам на месте?","Что вы там друг другу говорите, кто с кем разговаривает, кто знает, в каком классе ребенок, это уже подробности.","Давайте без придирок, мы тут семью сохраняем.","На концерт он не пришел?","Ну бывает.","Вы же пришли.","Сняли видео, сфотографировали, цветы учительнице вручили, дочь домой отвели.","Видите, все получилось.","Зачем вам разводиться, вы прекрасно справляетесь в браке.","Только без подробностей, пожалуйста.","Про то, что он забыл, говорить не надо, про футбол тоже.","Ребенок должен уважать отца.","Поэтому следите, чтобы дочь случайно не узнала, как именно отец проводил время, пока она искала его глазами в зале.","Вы тоже работаете?","Конечно, мы помним.","Поэтому вечером посмотрите запись вместе с мужем.","Включите ему видео, найдите момент, где дочь выходит, попросите убрать телефон.","Потом позовите дочь, пусть папа скажет, что она молодец.","Только заранее напомните ему, во что она была одета, чтобы он похвалил вашего ребенка.","Да, организационной работы много.","Зато у девочки будет воспоминание: папа смотрел мое выступление.","Вы же хотели счастливое детство?","Вот, обеспечивайте.","И не стойте рядом с таким лицом, пока они смотрят, вы всю радость испортите.","А, вы хотели сами сесть и порадоваться за дочь, пока он снимает?","Да, запросы у вас, конечно.","Вам сколько лет?","Пора уже понимать, что семейное счастье требует усилий.","Ваших, вы же на тренинг пришли.","Мужа здесь нет, я ему ничего задать на дом не могу.","Так, возвращаемся к ребенку.","В следующий раз она уже папу звать не хочет?","Скажите, что он расстроится.","Отлично.","Чьих?"],"before":null},{"id":"r_razvod_1_2","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«ради детей надо сохранить семью»","text":"Текст на экране: А как же дети без семьи?\n\nРечь: Читаю сейчас комментарий «ради детей надо сохранить семью» и уже закрыла приложение, но сижу и думаю: почему после этого разговаривать с мужем, искать психолога, придумывать совместные выходные, звать его ужинать и напоминать ему, что у ребенка в субботу выступление, опять должна женщина? Еще и рубашку ему погладить, чтобы на семейной фотографии все получилось убедительно.\n\nБлядь, ну сколько у нее обязанностей.\n\nПредставьте обычный вечер. Вы позвали всех ужинать, муж пришел с телефоном, ребенок рассказывает, как его взяли в школьный спектакль. Муж угукнул, продолжает смотреть в экран. Ребенок спрашивает: «Пап, ты придешь?» Вы уже знаете, что сейчас услышите про работу, поэтому быстро говорите: «Папа постарается, кушай пока».\n\nПотом напоминаете мужу про спектакль. Потом еще раз. Потом он говорит, что ничего не обещал, а вы сидите рядом с ребенком, смотрите на дверь и злитесь на себя, потому что опять сказали ему, что папа постарается.\n\nЯ сама сейчас поймала себя на желании придумать для этой женщины такие слова, чтобы муж наконец услышал. Ну вот, тоже туда же.\n\nЕсли ради детей семью сохраняете только вы, что ради детей делает муж?","caption":"Иногда женщина уже выбрала семейного психолога, узнала стоимость и предложила время. Муж отказался, а родственники все равно спрашивают у нее: «Вы точно все попробовали?»\n\nЯ каждый раз злюсь на это «вы».\nНапишите «знакомо», если вам тоже так говорили.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не обещал, а"},{"rule":"dvoetochiya","quote":"уже закрыла приложение, но сижу и думаю: почему после этого разговаривать с муже | ает смотреть в экран. Ребенок спрашив"}],"cut":["Женщина одна сохранить семью не может.","Для этого мужу тоже придется в ней участвовать.","И меня особенно задевает, как легко советуют потерпеть именно ради детей.","Потому что женщине, которая думает о разводе, обычно и так страшно.","Как платить за квартиру, как сказать ребенку, как потом встречаться на школьном празднике.","А ей еще сообщают: если уйдете, значит, детям семью испортили вы.","Вам захотелось спокойствия, вот теперь и объясняйте.","Вот эту часть советчики почему-то пропускают.","Вы уже пытались сохранить семью.","Вы звали, напоминали, просили, объясняли, выбирали время, когда муж поел и у него хорошее настроение.","Вы даже его ответ ребенку смягчили, чтобы ребенок меньше расстроился.","И теперь вам предлагают продолжать, потому что вы же мать.","Еще чуть-чуть правильно объясним взрослому мужчине, что его ребенок ждет на выступлении.","Но муж уже слышал приглашение.","Он знает дату.","И за свое решение, прийти или снова остаться на работе, отвечает он.","Вы можете разговаривать с ним о вашем браке, можете решать, как будете жить дальше.","Его согласие участвовать вы за него дать не можете.","Ребенку нужны взрослые, которые замечают его, разговаривают с ним и выполняют свои обещания.","И женщине приходится учитывать, как дети живут дома сейчас, пока она старается сохранить брак.","Я не знаю, какое решение вы примете.","Меня злит эта уверенность посторонних, что вы ОБЯЗАНА справиться за двоих."],"before":null},{"id":"r_pereezd_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"переехала в другой город и за год ни с кем не подружилась","text":"Текст на экране: Год в новом городе, подруг так и нет\n\nРечь: Четыре признака, что после переезда ты хочешь подружиться, но боишься навязаться и поэтому остаешься одна.\n\nПервое, тебе нужно заранее знать, что тебе обрадуются. Коллега говорит, что собирается после работы выпить кофе, и ты спрашиваешь, где тут вообще хороший кофе, долго обсуждаешь меню, но предложить пойти вместе так и не решаешься.\n\nВторое, ты стесняешься сказать, что тебе нужна помощь. Но спросить у знакомой, можно ли указать ее телефон для экстренной связи в анкете, почти невозможно. Ты оставляешь номер мамы, которая живет за тысячу километров, и надеешься, что звонить ей никто не будет.\n\nТретье, ты откладываешь встречи до того момента, когда будешь поинтереснее. И снова ешь одна, листая чужие фотографии из ресторана.\n\nЧетвертое, ты до сих пор бережешь хорошие новости для подруг из прежнего города. Новым знакомым тоже ничего не рассказываешь, им придется долго объяснять, почему для тебя это так важно.\n\nА кто в новом городе знает, что у тебя сегодня был хороший день?","caption":"Иногда хочется позвать знакомую погулять, и ты полчаса придумываешь повод, хотя тебе просто хочется ее увидеть. Меня каждый раз трогает, сколько осторожности бывает в таком коротком сообщении.\nЕсли хочется, допиши в комментариях свой пункт.","judge":null,"guard":[],"cut":["Думаешь, если бы она хотела со мной, позвала бы прямо.","И уходишь домой, хотя тебе совершенно никуда не надо, вечер свободный, и ты бы с удовольствием еще с ней поболтала.","Потом вспоминаешь разговор и пытаешься понять, приглашала она тебя или просто рассказывала о своих планах.","Хочется сначала получить точный ответ и только потом рискнуть.","Мне здесь очень жаль этих вечеров, когда обе, возможно, были бы рады компании.","На работе можешь спокойно объяснить сложную задачу, договориться о сроках, переспросить, если непонятно.","Вы ведь всего несколько раз виделись.","Сейчас ты уставшая, рассказывать особо нечего, все разговоры про работу и цены на квартиры.","Вот устроишься получше, съездишь куда-нибудь, тогда появится что обсудить.","Ох, как же меня задевает это требование к себе.","Тебе хочется с кем-то просто поужинать, а ты уже проверяешь, достаточно ли увлекательно проведешь человеку вечер.","Это совершенно понятно, они знают, сколько ты всего ждала и как переживала.","Только у них уже поздно, у тебя еще рабочий день, потом одна занята, другая забыла ответить.","И вечером ты говоришь себе, что новость уже старая.","Так они и не узнают, чему ты радуешься."],"before":null},{"id":"r_pereezd_1_2","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"переехала в другой город и за год ни с кем не подружилась","text":"Текст на экране: Год в новом городе, подруг нет\n\nРечь: Девочки, кто год назад переехал и до сих пор в выходные разговаривает в основном с кассиром, ну что, опять решили, что с вами скучно? Милые мои, вы уже и кассиру, наверное, боитесь надоесть.\n\nМеня прямо задевает, как быстро ты начинаешь себя ругать.\n\nВот есть коллега, с которой вы вместе смеетесь на обеде.\n\nИ ты открываешь переписку. Пишешь: «Может, в субботу кофе?»\n\nПочему сразу хочется добавить «если ты, конечно, свободна»? Потому что страшно получить отказ. Дописываешь. Потом еще: «Если нет, вообще без проблем». Потом смотришь на все это и стираешь. У нее наверняка свои подруги, свои планы, зачем ей еще ты.\n\nИ я сейчас думаю: ты же квартиру искала, коробки таскала, ездила смотреть жилье с чужими шторами и подозрительным диваном, разбиралась, куда нести документы, где покупать продукты, почему автобус опять уехал куда-то без тебя.\n\nА тут кофе. Две чашки кофе, господи.\n\nСама ли начала разговор. Был ли вообще повод ее звать.\n\nВ субботу ты снова пойдешь за кофе одна. А в понедельник она спросит: «Как выходные?» И ты опять ответишь: «Да нормально».","caption":"После переезда иногда особенно не хватает возможности написать кому-то: «Я рядом, выйдешь?»\nМеня трогает, сколько близости бывает в таком коротком сообщении.\nОтправь той, с кем хотелось бы выпить кофе.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"И ты открываешь переписку. Пишешь: «Может, в субботу кофе?» | о получить отказ. Дописываешь. Потом еще: «Если нет, вообщ"}],"cut":["Город большой, люди вокруг есть, на работе с тобой разговаривают, а в субботу позвать на завтрак некого.","И ты сидишь с телефоном и думаешь: ну за год уже можно было с кем-нибудь подружиться.","Все как-то могут.","Что со мной такое?","Она спрашивает, как прошли выходные, помнит, что ты искала квартиру, присылает тебе смешное.","Тебе с ней хорошо.","Хочется встретиться уже спокойно, без этого рабочего «ладно, побежали».","Хотя, подожди.","Она тебе это говорила?","Ты просто уже представила, как она читает приглашение и думает, что ты навязываешься.","И тебе стало так неловко, будто она действительно это сказала.","Мне очень жаль, сколько таких приглашений остаются ненаписанными.","Потому что ты ведь хочешь вполне обычного: сидеть с кем-то за столиком, заказать еще кофе, рассказать какую-нибудь ерунду и услышать: «Да ладно, у меня тоже так было».","Но спросить про кофе почему-то значит признаться, что тебе одиноко.","Вдруг она поймет, что ты всю неделю ждала субботы и никаких других планов у тебя нет?","Вот это особенно стыдно.","Поэтому в понедельник ты скажешь, что отлично отдохнула дома.","И быстро спросишь, как отдохнула она.","Ты столько раз спрашивала, переспрашивала, ошибалась, возвращалась.","Только коллега может сказать, что занята, и ты потом весь вечер будешь вспоминать, как она вчера отвечала тебе на обеде.","Достаточно ли охотно смеялась.","Нет."],"before":null},{"id":"r_dengi_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","text":"Текст на экране: Зарабатываю нормально, а денег все мало\n\nРечь: Еще немного. Сейчас вроде хватает: за квартиру заплатили, продукты купили, на счете что-то осталось. Но вы вечером сидите на кухне, открываете приложение банка и считаете, сколько месяцев сможете прожить, если завтра останетесь без работы. Получается прилично. Вы даже выдыхаете. Потом думаете: ну это если ничего не случится. И начинаете считать заново, уже с учетом ремонта машины, лечения, помощи родителям. Ужин за это время остыл.\n\nНакопили. Меня беспокоит, что вы дошли до своей суммы и тут же решили, что ее мало.\n\nВот прямо сейчас сидите над остывшим ужином и вспоминаете, что собирались купить новые кроссовки. Старые уже протекают, вы их утром сушили. Деньги на новые есть. Но если купить, на счете останется меньше, чем вы сегодня решили иметь для спокойствия. Ну, походите пока в старых. Только ноги завтра опять будут мокрые, и злиться вы будете на себя: зарабатываю, работаю, почему мне даже это так трудно купить?\n\nМеня здесь задевает вот что: вы действительно стараетесь, действительно зарабатываете, а вечером снова сидите с ощущением, будто ничего не накопили. Еще немного, и купите кроссовки. Завтра пока снова сушить старые.","caption":"Иногда особенно трудно тратить после повышения зарплаты: теперь вы знаете, сколько могли бы откладывать, и за каждую покупку приходится перед собой отчитываться.\n\nЯ Михаил, психолог, работаю с мужчинами от 30 до 45.\nОтправьте тому, кто постоянно считает, хватит ли денег.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Еще немного. Сейчас вроде хватает: за квартиру заплатили, продукты купили, | илично. Вы даже выдыхаете. Потом думаете: н"}],"cut":["Еще немного, и вы наконец перестанете бояться, что денег не хватит.","Еще немного, и вы соберете сумму, с которой точно будет спокойно.","Вы ведь уже назначали себе такую сумму, помните?","Тогда она казалась большой, вы думали: вот накоплю, и смогу хотя бы вечером не проверять счет.","Только теперь вы знаете, сколько стоит замена коробки передач, и слышали про сокращения, и вообще цены видели?","Поэтому сумму надо увеличить.","Вроде разумно.","Каждый отдельный довод вполне убедительный, я с этим даже спорить не собираюсь.","Еще немного, и вы сможете потратить на себя без этого получасового обсуждения с самим собой.","И вроде никто вас не заставлял, вы сами все посчитали и приняли взрослое решение.","Еще немного, и вы получите подтверждение, что теперь точно справитесь.","Вот этого подтверждения вы и ждете от денег: что вас не уволят надолго, что близким не понадобится дорогая помощь, что вы все предусмотрели.","Но даже когда сумма растет, вы можете придумать расход побольше.","И снова открываете приложение.","На минуту становится легче, потому что деньги на месте.","А потом вы вспоминаете еще одну возможную неприятность.","Вы постепенно привыкаете успокаиваться только после проверки, и без проверки уже трудно просто доесть ужин.","Еще немного, и вы разрешите себе считать, что денег достаточно.","Но сегодня вы опять подняли нужную сумму, опять отложили покупку и закрыли приложение с мыслью, что надо больше работать."],"before":null},{"id":"r_dengi_1_2","author":"Михаил","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","text":"Текст на экране: «Зарабатываю нормально, а денег все равно мало»\nПерсонажи: А это я, Б это психолог\nА: Мне говорят: расслабьтесь, вы нормально зарабатываете. Спасибо, очень помогло. Только вечером опять считаю, хватит ли нам денег.\nБ: Что вы делаете, когда становится страшно?\nА: Открываю приложение банка, смотрю остаток, вычитаю квартиру, продукты, платежи. Потом еще раз, вдруг что забыл. Жена зовет ужинать, я говорю: сейчас, только проверю.\nБ: Посчитали. На расходы хватает?\nА: Хватает, еще остается. Закрываю приложение, иду на кухню, жена уже поела. Мой ужин остыл.\nБ: А потом снова открываете приложение?\nА: Кто будет платить?\nБ: Какую сумму вы хотите увидеть, чтобы успокоиться?\nА: Накопил.\nБ: Когда проверяете, надолго вам становится легче?\nА: Пока не придумаю следующий расход.\nБ: Вы каждый раз ищете уверенность, что денег хватит при любых обстоятельствах.\nА: Получается, я посмотрел остаток, успокоился, придумал новую беду и снова проверяю. Денег столько же. А я уже весь вечер с телефоном вместо ужина.\nБ: Да. Снова проверяете ради короткого облегчения.","caption":"Меня особенно задевает, сколько обычной жизни мужчины пропускают, пока пытаются предусмотреть каждый будущий расход. Даже покупку любимого кофе приходится отдельно себе обосновывать.\n\nЯ Михаил, психолог, работаю со взрослыми мужчинами.\nПодписывайтесь, если хочется еще такого: здесь про тревогу, работу и отношения.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Мне говорят: расслабьтесь, вы нормально зарабатывает | что забыл. Жена зовет ужинать, я говорю: сейчас, только проверю. "}],"cut":["Я и сам вижу зарплату.","И вроде выдыхаю.","Даже думаю: чего я опять завелся?","Да, потому что вдруг машину придется чинить.","Или с работой что случится.","Я же должен это учитывать, у меня семья.","Вот в том и дело, раньше хотел накопить побольше.","Теперь думаю: с нынешними ценами этого надолго хватит?","И опять лезу проверять.","Но подождите, я же проверяю, чтобы убедиться, что все нормально.","Где тогда эффект?","Почему мне опять страшно?"],"before":null}];const KEY='eval-2026-10-20_14-03-14_rilsy_r_zh3h7';
