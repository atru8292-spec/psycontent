<script>
const DATA=[{"id":"r_mif_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: За что я плачу психологу?\nРечь: Меня раздражает, когда про психолога говорят: «Он просто слушает и кивает за ваши деньги».\n\nИ вот вы думаете: ну расскажу я все это еще одному человеку. Дальше что? Он посочувствует? Скажет, что мне надо меньше переживать? Я за это должен платить?\n\nУ меня бы тоже возник вопрос, за что здесь платить.\n\nНо психолог во время разговора тоже работает.\n\nДопустим, вы никак не можете сказать начальнику, что больше не готовы работать по выходным. Вы уже обсуждали это с друзьями, они поддержали, вы даже придумали, как начать разговор. Наступает пятница, начальник снова пишет, и вы соглашаетесь. А потом злитесь на себя: ведь все же понятно, чего я опять промолчал?\n\nПросто посочувствовать вам здесь действительно мало. В работе с психологом можно подробно разобраться, чего именно вы ожидаете от начальника, почему вам настолько трудно отказать и что происходит в тот момент, когда вы уже собираетесь сказать, но снова соглашаетесь.\n\nСо своей стороны вы можете рассказывать, как у вас на самом деле, пробовать то, о чем договорились, говорить, если что-то вам не подходит. А объяснить, что вы вместе делаете и зачем, обязан психолог.","caption":"Можно прямо на первой встрече сказать: «Я впервые и пока вообще не понимаю, как здесь все устроено». Я бы хотел, чтобы об этом спрашивали свободнее.\n\nМеня зовут Михаил, я психолог, работаю с людьми 25-40 лет, которые впервые обращаются за помощью.\nОтправьте тому, кто давно думает о первой встрече.","judge":null,"guard":[{"rule":"na_samom_dele","quote":"на самом деле"},{"rule":"dvoetochiya","quote":"раздражает, когда про психолога говорят: «Он просто слушает и кивает за ваши ден | И вот вы думаете: ну расскажу я все э"}],"cut":["Потому что после такого вы можете месяцами откладывать обращение, хотя вам уже тяжело, вы опять плохо спите, переживаете из-за работы и срываетесь на близких.","Я понимаю эти вопросы.","Особенно если вы ни разу не были у психолога и вообще представляете встречу примерно так: вы говорите, напротив сидит человек с очень понимающим лицом.","Иногда спрашивает про маму.","В конце сообщает, что время закончилось.","Задает вопросы, уточняет, проверяет вместе с вами, правильно ли он вас понял.","И может объяснить, какое отношение все это имеет к тому, с чем вы пришли.","Причем психолог может ошибиться в своих предположениях.","И тогда ему нужно вас услышать и уточнить.","Мне вообще странно требовать от человека, который впервые пришел за помощью, чтобы он заранее знал, как должна выглядеть хорошая работа.","Вы можете волноваться, путаться, долго подбирать слова.","Можете пока понимать только одно: так, как сейчас, вам тяжело.","И при этом вы вправе спросить: что мы сейчас делаем?","Как это связано с моей проблемой?","Как мы будем понимать, что наши встречи мне помогают?","Я спокойно отношусь к таким вопросам.","Вы ведь выделяете время, тратите деньги, рассказываете то, о чем порой даже близким говорить трудно.","Конечно, вам хочется понимать, что происходит."],"before":null},{"id":"r_mif_1_2","author":"Михаил","format":"reels_rol","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: Голосовое от друга, заменяющего психолога\nРечь: Сейчас я вам как друг объясню, почему платить психологу вообще незачем. Вы мне позвоните, я вас послушаю, покиваю. Бесплатно. Я, кстати, очень хорошо киваю, у меня на рабочих созвонах большой опыт.\n\nЧто вы хотели обсудить? Начальник опять попросил поработать в выходные, вы согласились, теперь злитесь и на него, и на себя? Просто откажите.\n\nСейчас расскажу, что у нас вчера руководитель устроил, вы просто послушайте. Там такое было. Нет, вашу историю я помню, конечно. У вас тоже начальник.\n\nВсе. Только давайте покороче, я сейчас в магазин зайду, там связь плохая.\n\nВам хочется договорить? Конечно, говорите. Я умею слушать. Угу. Угу. Сейчас, тут скидка по карте или без? Это я кассиру. Продолжайте, я все слышу. Вы в субботу сидели за ноутбуком, друзья прислали фотографии со встречи, и вы даже отвечать им не захотели. Ну, зато работу сделали.\n\nВас злит, что я перебиваю и все упрощаю? Ого. С психологом вы тоже так разговариваете? Ему говорите, когда вам что-то не подходит? И он это с вами обсуждает? Да, за ваши деньги еще бы он спорил. Хотя со мной вы сейчас тоже спорите, а я совершенно бесплатно обижаюсь. Сервис тот же.\n\nЯ могу минут десять, пока до дома иду. Только без сложных вопросов, пожалуйста, я после работы.\n\nТак что договорились. Когда начальник снова напишет, звоните мне. Я вам еще раз скажу: просто откажите. Если опять согласитесь, тоже звоните. Я скажу, что предупреждал.","caption":"На первой встрече можно прямо спросить психолога: «Что мы будем делать, кроме разговоров?» Я бы хотел, чтобы вы понимали, зачем я задаю вопросы и что мы вместе пытаемся выяснить.\nМеня зовут Михаил, я психолог, работаю со взрослыми, которые впервые решились обратиться.\nПодписывайтесь, если хочется еще такого: здесь я рассказываю о психологии и о том, как проходит терапия.","judge":null,"guard":[{"rule":"rublenye","quote":"Конечно, говорите. Я умею слушать. Угу. Угу."},{"rule":"dvoetochiya","quote":"апишет, звоните мне. Я вам еще раз скажу: просто откажите. Если опять согласитесь | й встрече можно прямо спросить психо"}],"cut":["Иногда вообще никто ничего не замечает.","Ну, тут все понятно.","Вот видите, мы уже разобрались, можете переводить мне деньги.","Шучу, я же бесплатно.","Хотя за такую скорость могли бы и кофе заказать.","Вы пробовали отказаться, а потом весь вечер думали, что вас теперь уволят?","Да зачем вы об этом думаете?","Не думайте.","Я вот после работы вообще о работе не думаю.","Ну, почти.","Поэтому и рассказываю, у нас похожая ситуация.","Так, вернемся к вам.","Вы говорите, каждый раз соглашаетесь, даже когда уже купили билеты, договорились встретиться с друзьями, обещали провести субботу дома.","Ну, значит, надо быть увереннее.","Я бы на вашем месте сразу сказал: у меня выходной.","Почему вы так не можете?","А психолог что, спрашивает, что вы представляете, когда собираетесь отказать?","И вы вместе разбираете, почему после обычного сообщения от начальника вы уже готовы отменить свои планы?","Ну, это можно долго разговаривать.","Я вам сразу итог сказал: будьте увереннее.","Очень удобный совет, подходит практически ко всему.","На работе будьте увереннее, на свидании будьте увереннее, у кассы, если пакет забыли пробить, тоже пригодится.","Я за универсальные решения.","Что значит, вы умом все понимаете, а в пятницу опять пишете начальнику: «Да, конечно, сделаю»?","Так вы мой совет применили?","Ну вот.","Я же сказал, как надо.","Повторять одно и то же каждую неделю я, конечно, могу, но вы тоже как-то участвуйте.","А то я стараюсь, объясняю, время трачу, у меня уже мороженое в корзине тает.","Нужно искать плюсы.","Я всегда так делаю.","Между прочим, полезный навык, тоже можете себе записать.","Я вообще-то помочь хотел.","Мне теперь каждое слово подбирать?","В следующий раз сразу предупреждайте, что вам нужно, чтобы я слушал, уточнял, помнил, о чем вы рассказывали, и спокойно относился к тому, что вы со мной не согласны.","У меня вообще-то тоже дела есть.","Нет?"],"before":null},{"id":"r_vopros_1","author":"Ольга","format":"reels_otvet","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Зачем мне психолог, если есть подруги?\nРечь: А зачем мне психолог, если у меня есть подруги?\n\nВот сейчас сижу с телефоном, только что увидела очередное: поговорите с подругой, и никакой психолог вам не понадобится. И меня бесит, как легко подруге выдают дополнительную работу. Выслушать, успокоить, понять, почему вы снова согласились на то, чего совсем не хотели, подобрать слова, обязательно правильные, еще и быть на связи в тот момент, когда вас накрыло. Желательно ночью. Утром ей на работу, но это уже технические подробности.\n\nБлядь, она вообще соглашалась?\n\nНо вот вы собрались рассказать подруге, что опять дали маме денег, хотя сами откладывали на отпуск. Открыли переписку. И вспомнили, сколько подруга в прошлый раз вас поддерживала, как вы уверенно говорили, что больше такого не будет. И теперь придется признаться, что опять было.\n\nПоэтому вы пишете: «Да все нормально, у тебя как?»\n\nВсе. Поговорили.\n\nНа встрече с психологом у вас есть время, за которое вы договорились заниматься вашими трудностями. Вам можно снова прийти с тем, о чем уже говорили.\n\nДаже если вчера вы целый час убеждали меня, что больше маме денег не дадите.","caption":"Подруге тоже бывает страшно сказать лишнее, особенно когда она видит, как вам больно. Иногда она молчит просто потому, что дорожит вами.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nСохраните, если вам знакомо это «да все нормально».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"телефоном, только что увидела очередное: поговорите с подругой, и никакой психол | Поэтому вы пишете: «Да все нормально,"}],"cut":["Потому что даже любимой подруге вы можете рассказывать о себе так, чтобы она за вас сильно не переживала.","Я очень понимаю желание поговорить со своей.","Она знает вашу маму, помнит вашего бывшего, ей можно отправить голосовое без вступления и объяснений, кто все эти люди.","Иногда вы поговорили, посмеялись, поплакали, и вам действительно стало легче.","Это много.","Вы уже представляете ее ответ.","Может, она вообще ничего такого не скажет, но вам заранее стыдно.","И вот тут для меня важная разница.","С подругой вы еще и подруга.","Вам важно, как она себя чувствует, что она о вас подумает, сколько раз она уже слушала про вашу маму.","Вы можете одновременно нуждаться в поддержке и беречь ее от собственных переживаний.","Даже когда она готова слушать.","Психологу платят в том числе за то, чтобы внимательно разбираться вместе с вами, почему вы согласились, чего испугались, когда мама попросила, и почему потом скрыли это от подруги.","Я сейчас сама чуть не потребовала от подруги идеальной реакции.","Она может устать, растеряться, сказать что-то невпопад, и при этом очень вас любить.","Если вы постоянно замолкаете там, где вам стыдно, в терапии можно разбираться именно с этим.","Мне как психологу важно, чтобы вы могли сказать и про деньги, и про маму, и про то, что боитесь моего осуждения.","Увлеклась."],"before":null},{"id":"r_vopros_1_2","author":"Ольга","format":"reels_malysh","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Подружка, психолог и один трудный разговор\nРечь: Милая, вы сидите на кухне у подруги, чай уже остыл, вы опять рассказываете про свою ссору, и тут кто-нибудь обязательно скажет: «Вот зачем платить психологу, когда можно так поговорить?» Я с этим спорю.\n\nДевочки, подруги бывают такие умные, что я бы сама с удовольствием посидела у них на кухне. Еще и накормят. Очень серьезное преимущество, между прочим.\n\nВы говорите, что опять поссорились с мужчиной. Подруга помнит, как вы плакали в прошлый раз, и в позапрошлый, и как она сидела рядом, пока вы собирались ему позвонить. Она вас любит и уже злится: «Блять, ну сколько можно, уходи от него».\n\nИ вы киваете. Даже соглашаетесь. А про то, что утром хотели его обнять, уже молчите. Подруга столько вас поддерживала, и теперь вам стыдно признаться, что вы снова хотите к нему.\n\nС психологом можно разбирать и эту часть тоже. Говорить, что вы злитесь, скучаете, хотите уйти, хотите остаться, и вам самой уже неловко от того, сколько раз за один разговор вы передумали.\n\nИ в своей работе я должна замечать, когда уже слишком хочется решить за вас. Потому что дальше с вашим решением будете жить вы.\n\nКакую часть своей истории вы пока никому не рассказываете?","caption":"Иногда подруге тоже нужно спросить: «У тебя сегодня есть силы меня послушать?» Мне нравится, когда в дружбе можно честно ответить и сохранить близость.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nПодписывайтесь, если хочется еще таких разговоров: здесь про отношения, семью и то, как нам бывает рядом с близкими.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ору, и тут кто-нибудь обязательно скажет: «Вот зачем платить психологу, когда мож | му позвонить. Она вас любит и уже зл"}],"cut":["И уже слышу: «Ну конечно, психолог сейчас объяснит, почему деньги надо нести ей.","Подруги, видимо, недостаточно умные».","Подруга может вас обнять, приехать вечером, послушать голосовое на двенадцать минут, потом еще одно, потому что в первом вы забыли самое возмутительное.","И вам действительно станет легче.","Вы поплачете, посмеетесь, почувствуете, что вас любят.","Это много.","Я совершенно серьезно.","Только давайте останемся на той кухне еще на минутку.","Вот тут появляется маленький узелок.","Вам нужна поддержка, подруга хочет вас защитить, вы боитесь ее разочаровать, и часть того, что с вами происходит, оставляете при себе.","При этом вы обе стараетесь.","Вы обе хотите, чтобы вам стало лучше.","Психолог может спросить, чего вы ждете, когда снова звоните мужчине, в какой момент соглашаетесь с ним, о чем вам трудно попросить.","И вместе с вами постепенно распутывать этот узелок.","У психолога тоже возникают чувства, мысли, желание что-нибудь посоветовать.","Мы живые.","Меня прямо огорчает, когда женщине приходится выбирать, кому теперь можно рассказывать о себе.","С подругой можно дружить, любить ее, обсуждать жизнь, получать поддержку.","К психологу можно приходить с тем, о чем пока трудно говорить даже самой близкой подруге."],"before":null},{"id":"r_post_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Текст на экране: Он молчит, ты весь вечер ждешь\nРечь: Четыре признака того, что ты уже проводишь вечер в ожидании его сообщения, даже если говоришь себе, что просто иногда проверяешь телефон.\nПервое, ты перестаешь понимать, чем вообще занималась. Открыла ноутбук закончить работу, увидела телефон рядом, проверила переписку, потом еще раз.\nВторое, ты оставляешь вечер свободным, хотя вы ни о чем не договаривались. Мне так жалко этих вечеров, когда ты уже отказалась от встречи, а он даже не знает, что ты его ждешь.\nТретье, ты заранее оправдываешься за желание написать. Придумываешь вопрос про фильм, ищешь смешное видео, вспоминаешь, что он советовал тебе какую-то кофейню. Удаляешь набранное, потому что в прошлый раз тоже написала первая.\nЧетвертое, когда он наконец пишет, тебе уже почти безразлично, что именно. Он прислал короткое «как ты», и ты сразу оживаешь, отвечаешь подробно, спрашиваешь про него. А про свою хорошую новость расскажешь потом, когда он спросит. Весь вечер ты так хотела поговорить с ним, и теперь снова сидишь с телефоном и ждешь.\nА если он сегодня так и не спросит?","caption":"Увидела совет: «Просто убери телефон подальше». Я бы еще спросила, сколько раз за вечер девушка встанет за ним в другую комнату. Иногда она и сама уже злится, что снова идет проверять.","judge":null,"guard":[],"cut":["Перечитываешь один и тот же абзац, потому что думаешь: вчера он к этому времени уже написал.","Работу придется доделывать ночью, и ты заранее злишься на себя, что опять просидела столько времени.","Хотя все это время ты была очень занята: пыталась понять, почему сегодня он молчит.","Подруга зовет поужинать, ты отвечаешь, что устала.","И вроде правда устала, только потом сидишь дома одетая, потому что вдруг он предложит увидеться.","До кафе с подругой было бы двадцать минут, вы бы уже заказали еду, она бы рассказала, как прошел день.","Но ты решила подождать еще немного.","Просто спросить, как прошел день, кажется слишком явным: он ведь поймет, что ты о нем думала.","И вот ты уже полчаса выбираешь повод для сообщения человеку, с которым хочешь быть близкой.","Еще немного, и начинаешь стыдиться самого желания с ним поговорить.","Ты собиралась рассказать, что сегодня получилось на работе, но он отвечает только на твой вопрос и снова пропадает.","И ты даже не успеваешь расстроиться, потому что главное уже случилось: он вспомнил.","Можно больше не гадать, надоела ты ему или пока нет."],"before":null},{"id":"r_post_1_2","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Текст на экране: Он молчит, я опять навязчивая\nРечь: Ты сейчас смотришь это видео и заодно проверяешь, не написал ли он?\n\nДавай хотя бы слово «опять» пока уберем. Вы знакомы со вторника.\n\nМеня очень задевает, как быстро девушка начинает себя ругать за такой вечер.\n\nВот ты приготовила ужин, включила сериал, телефон положила рядом с тарелкой. Звук включен. Ты точно услышишь сообщение. Но все равно берешь телефон, потому что вдруг случайно выключила звук, вдруг уведомление не пришло, вдруг он написал в другом приложении. Проверила. Ничего.\n\nВозвращаешься к сериалу, а там уже непонятно, почему героиня плачет. Перематываешь назад. И тут же опять берешь телефон.\n\nИ ты сидишь с этим желанием, а потом начинаешь с собой торговаться. Если до девяти не напишет, я больше не смотрю. Ладно, до половины десятого. Он, наверное, еще занят. Хотя в приложение заходил. Хотя я тоже захожу и сразу никому не отвечаю. Вот, сама все понимаю, чего тогда сижу.\n\nА ужин уже холодный. Ты идешь греть его, берешь телефон с собой и по дороге придумываешь подпись к тому самому видео. Чтобы легко получилось. Чтобы он ни за что не догадался, сколько времени ты сегодня его ждала.","caption":"Я каждый раз цепляюсь за это «просто попалось». Иногда девушка долго выбирает, что отправить, чтобы у него нашелся повод ответить. А потом еще перечитывает собственное сообщение: достаточно ли беззаботно получилось.","judge":null,"guard":[],"cut":["Ну вот.","Он еще ничего не написал, а ты уже решила, что слишком много от него хочешь.","Даже сообщение не отправила, просто захотела поговорить.","И уже навязчивая.","Быстро ты себя.","Сидит с телефоном, ждет, ей обидно, что он сам не вспоминает, и она еще себе объясняет, какая же она неприятная со своим желанием получить обычное «как день?».","И мне хочется задержаться именно здесь.","Потому что со стороны легко сказать: ну займись чем-нибудь.","Ты ведь уже занялась.","Ужин приготовила, сериал включила.","Только все это время продолжаешь ждать, что он напишет сам.","Ты можешь написать ему.","Вы уже переписывались, он отвечал, присылал смешное, спрашивал что-то.","Но сегодня тебе хочется узнать, вспомнит ли он о тебе без твоего сообщения.","Захочет ли сам рассказать, что у него случилось.","Попросит ли прислать фотографию ужина, потому что ты вчера обещала приготовить что-то приличнее бутерброда.","Мне грустно от этого «чего сижу».","Ты ведь вполне понимаешь, чего ждешь.","Чтобы он тоже потянулся к тебе.","И одновременно тебе страшно, что ты перестанешь писать первой и вы вообще перестанете общаться.","Поэтому даже проверить это страшно.","Проще еще немного подождать, потом найти смешное видео и отправить, будто просто попалось.","Он ответит, ты обрадуешься, начнете разговаривать.","И вроде хороший вечер получился.","Только ты снова не узнаешь, написал бы он сам."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Текст на экране: А вдруг на работе меня раскусят?\nРечь: Милые мои, вы сейчас даже этот ролик смотрите и думаете, что остальные на работе умеют работать, а вы пока просто удачно притворяетесь?\n\nВот смотрите. Вы закончили отчет. Сидите дома за компьютером, отправляете файл руководителю, он пишет: «Спасибо, все понятно, забираю на встречу». И вы вроде бы можете закрыть ноутбук. Работу приняли.\n\nНо вам страшненько. Потому что вы знаете, как вы этот отчет делали.\n\nВы открывали прошлый отчет. Искали, как посчитать нужный показатель. Написали коллеге, правильно ли вы поняли вопрос. Потом еще исправили формулу, потому что сначала получили какую-то ерунду.\n\nИ теперь вы сидите перед этим «спасибо» и думаете: если бы руководитель видел, сколько я возился, он бы понял, кого вообще взял на работу.\n\nВы ведь сравниваете себя с коллегой, который, по вашему представлению, сразу все знает, сразу понимает задачу, открывает пустой файл и делает правильно. Причем желательно до обеда.\n\nОчень удобный коллега. Особенно потому, что вы никогда не видели, как он работает весь день.\n\nОн получил файл, с которым пойдет на встречу.\n\nЭтот файл собрали вы. Вместе со всеми своими вопросами и исправлениями.","caption":"Коллеги обычно видят готовый результат. Все ваши открытые вкладки видите только вы.\nКак вы объясняете себе удачно выполненную работу? Можно одним словом.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"отправляете файл руководителю, он пишет: «Спасибо, все понятно, забираю на встре | вы сидите перед этим «спасибо» и дума"}],"cut":["Уже назначили себя самым бестолковым сотрудником.","Без совещания, без руководителя, сами справились.","Давайте карандашиком рядом с вашей фамилией пока напишем: «Разбираемся».","Уволить себя мысленно вы сегодня еще успеете.","Как будто вы решили задачку, но подсмотрели правило в учебнике, и теперь правильный ответ себе засчитывать нельзя.","Вот это мне хочется разобрать.","А про себя вы знаете все.","Где зависли, у кого спросили, что забыли, сколько раз перечитали письмо.","И каждую такую подробность используете, чтобы объяснить себе, почему ваша работа вроде бы получилась, но вы все равно ничего не умеете.","Спросили совета?","Значит, без коллеги бы пропали.","Нашли решение в интернете?","Значит, своего ума не хватило.","Взяли прошлый отчет за основу?","Ну это вообще любой мог.","И вот это вот все.","Поэтому даже после удачной работы спокойнее становится ненадолго.","Вы уже придумали причину, по которой получилось.","Задание оказалось простым.","Руководитель пока недостаточно внимательно посмотрел.","Мне здесь особенно жалко ваших усилий.","Вы действительно сидели, разбирались, проверяли, переделывали, а потом сами же вычеркнули почти все, что сделали.","Оставили только момент, когда чего-то еще не знали.","И завтра снова будете бояться, что вас раскусят.","Потому что вчерашнюю выполненную работу вы себе уже не засчитали.","Руководитель написал вам спасибо за отчет.","Так.","Помогли. Повезло."],"before":null},{"id":"r_tg_1_2","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Текст на экране: Скоро все поймут, что я ничего не умею\n\nРечь: Недоверие к себе. Это когда вы отправляете рабочий отчет, который сами собрали, проверили, переделали после обсуждения, и теперь сидите перед открытым чатом, потому что руководитель начал что-то печатать. И вот приходит сообщение: «А откуда данные в последнем столбце?» Но вы уже думаете, как будете объяснять дома, почему вам снова нужно искать работу.\n\nОтчет получился, потому что задача простая, коллега подсказал, времени дали достаточно, похожую таблицу уже делали раньше. Меня здесь особенно задевает, как старательно можно перечислять обстоятельства своей работы и при этом вообще не учитывать, что работали вы.\n\nЭто когда вы замечаете в том же отчете опечатку и вот тут уже никаких обстоятельств не учитываете. Тут вы сразу готовы поверить, что ничего не умеете. Ну подумаешь, весь день собирали данные, сверяли, уточняли. Зато месяц написали неправильно.\n\nЯ в работе часто замечаю именно это: вы можете подробно рассказать, что сделали, и тут же объяснить, почему этого недостаточно. Вечером руководитель пишет, что отчет согласовали и завтра можно отправлять заказчику. Вы отвечаете «отлично», закрываете ноутбук и думаете: главное, чтобы в следующий раз тоже повезло.","caption":"В работе я часто спрашиваю, какой результат вы согласились бы признать своей заслугой. Иногда с ответом сложнее, чем с самой задачей.\nЯ Михаил, психолог, работаю с теми, кто тревожится о себе и своей работе в офисе или на удаленке.\nСохраните, если узнаете свои мысли после рабочего дня.","judge":null,"guard":[{"rule":"skrytoe_protivopostavlenie","quote":"не учитывать, что работали вы.\n\nЭто"},{"rule":"kancelyarit","quote":"данные"},{"rule":"kancelyarit","quote":"при этом"},{"rule":"kancelyarit","quote":"данные"},{"rule":"dvoetochiya","quote":"то-то печатать. И вот приходит сообщение: «А откуда данные в последнем столбце?» | Я в работе часто замечаю именно это: "}],"cut":["Вы уже представляете, как он спросит, кто вообще вас сюда взял.","Отчет у него открыт, сейчас он все увидит.","Обычный рабочий вопрос.","Это когда вы находите источник, отправляете ссылку, руководитель отвечает «спасибо», и вроде бы можно продолжать день.","Только вы считаете, что в этот раз удалось выкрутиться.","Хотя вы знали, откуда данные.","Сами их нашли, сами проверили, сами добавили в отчет.","Но себе вы рассказываете совсем другую историю: хорошо, что спросили именно об этом, тут я хотя бы смог ответить.","А если бы спросили что-нибудь другое?","Вот тогда бы точно выяснилось.","Это когда вы умеете объяснить любой свой удачный результат так, чтобы к вашим умениям он отношения не имел.","И вот это вот все.","Вы нашли коллегу, задали вопрос, разобрались в прошлой таблице.","Но все равно говорите себе, что самостоятельно ничего бы не смогли.","И вы возвращаетесь к сообщению руководителя, перечитываете его вопрос, и теперь вам кажется, что он уже тогда что-то заподозрил.","Вы даже собираетесь написать ему еще одно объяснение, хотя он давно поблагодарил вас и закончил разговор.","Это когда вы продолжаете ждать разоблачения, потому что каждый раз находите причину себе не верить.","Вам нужно подтверждение, что вы справляетесь, и одновременно вы заранее знаете, почему очередное подтверждение не считается."],"before":null},{"id":"r_car_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Текст на экране: Подруга с депрессией: что легко понять неправильно\nРечь: Четыре вещи, которые важно понимать, если у вашей подруги депрессия и вы хотите ее поддержать, но уже боитесь написать что-нибудь лишнее.\nПервое, она может любить вас и оставлять сообщения без ответа. Вы спросили, как она, она прочитала, и дальше тишина.\nВторое, она отменяет даже то, чего сама ждала. Допустим, вы собрались в кино, она выбрала фильм, купила билет, а перед выходом пишет, что останется дома. Но, блядь, ей сейчас еще и доказывать придется, что она правда не может.\nТретье, она может растеряться от вашего «скажи, чем помочь». Чтобы ответить, ей нужно понять, чего она хочет, решить, сколько вашего времени можно занять, и попросить. А она сегодня с обедом определиться не смогла. Конкретное предложение привезти еды ей бывает проще принять.\nЧетвертое, она смеется с вами, а завтра снова не может встать. Только ей после этого бывает страшно признаться, что утром опять плохо. Вы ведь так обрадовались. Чтобы получить поддержку, вашей подруге не нужно каждый раз доказывать, насколько ей плохо.","caption":"Если подруга говорит, что хочет умереть, отнеситесь к этому серьезно: при непосредственной опасности оставайтесь с ней и вызывайте экстренную помощь.\nМне важно, чтобы вы тоже могли обратиться за поддержкой.\nНапишите в комментариях, какую помощь вам было легче всего принять.","judge":null,"guard":[{"rule":"vvodnye","quote":"важно понимать"},{"rule":"dvoetochiya","quote":"Подруга с депрессией: что легко понять неправильно | чет умереть, отнеситесь к этому серьезно: при непосредственной опас"},{"rule":"ostorozhno","quote":"6 оговорок: может, бывает"}],"cut":["Вам обидно, вы тоже живой человек, вы волнуетесь.","А ей бывает трудно даже сформулировать, как прошел день, потому что она опять почти ничего не смогла сделать и теперь еще стыдится перед вами.","И чем дольше молчит, тем труднее вернуться в переписку: придется объяснять, куда пропала.","Поэтому короткое сообщение, на которое вы действительно не ждете ответа, иногда ей гораздо легче прочитать.","И вы думаете: может, все-таки уговорить, она же потом спасибо скажет.","Мне очень понятно это желание, хочется хоть как-то вытащить подругу из того, в чем ей плохо.","Она уже потеряла вечер, которого ждала.","Ссориться с вами из-за этого ей тоже тяжело.","Сама возможность выбирать иногда требует сил, которых у нее сейчас мало.","И отказать от него тоже должно быть можно, без отчета, почему вчера соглашалась, а сегодня передумала.","Вот тут особенно хочется выдохнуть: ну наконец-то, ей лучше.","Вы уже успели соскучиться по вашим разговорам, по ее шуткам.","И она начинает изображать улучшение, чтобы вас не расстроить, и остается со своим состоянием одна.","Пожалуйста, продолжайте всерьез относиться к тому, что она говорит.","При депрессии нужна профессиональная помощь, можно предложить вместе найти психиатра."],"before":null},{"id":"r_car_1_2","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Текст на экране: Тренинг: поддержать и немедленно развеселить\nРечь: Девочки, начинаем тренинг «Как поддержать подругу». Садитесь, я научу вас помогать так, чтобы уже завтра подруга написала: спасибо, мне лучше, дальше я сама. И больше вообще ничего вам не рассказывала. Очень удобно, сразу виден результат.\n\nИтак, у подруги депрессия, вы пришли ее навестить. Она открыла дверь в той же футболке, в которой вы видели ее в прошлый раз, на кухне чашки, продукты из доставки стоят в пакете. Вот тут сразу начинаем с бодрого: «Ну ты себя совсем запустила».\n\nПрекрасное начало. Подруга наверняка до вашего прихода считала, что у нее дома охуенно чисто.\n\nИ, девочки, самое главное: ждите улучшения при вас. Вы же пришли помогать. Улыбнулась вашей шутке? Все, можно выдохнуть: «Вот видишь, можешь же, когда захочешь».\n\nЕсли вдруг заплакала, срочно вспоминайте, у кого жизнь тяжелее. У вас наверняка найдется знакомая с кредитом, ремонтом и начальником, который пишет ночью. Чем подробнее расскажете, тем быстрее подруга поймет, что расстраиваться ей совершенно незачем. Слезы продолжаются? Можно немного обидеться. Вы старались, принесли еду, отменили свои дела, а она сидит и плачет. Где, блядь, положительный отзыв?\n\nВсе, я сейчас выйду из роли. Меня злит, когда от нее требуют еще и показать, как хорошо ей помогли.\n\nПредложить помочь записаться к психиатру, сходить вместе, если ей страшно. Если она говорит, что собирается причинить себе вред, оставайтесь рядом и вызывайте экстренную помощь.\n\nЗа ужин и ваше присутствие она может быть благодарна. Сил улыбнуться у нее сегодня может не быть.","caption":"Иногда подруга перестает рассказывать о своем состоянии, потому что каждый разговор заканчивается ее обещанием завтра собраться. Я бы хотела, чтобы рядом с близкими можно было честно сказать: сегодня все еще тяжело.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 20 до 40.\nОтправьте тому, кто сейчас старается поддержать подругу.","judge":null,"guard":[{"rule":"zachin","quote":"Итак,"},{"rule":"pafos","quote":"самое главное:"},{"rule":"dvoetochiya","quote":"Тренинг: поддержать и немедленно развеселить | ь так, чтобы уже завтра подруга написала: спасибо, мне лучше, дальше я са"}],"cut":["Вы, конечно, волнуетесь.","Хочется что-нибудь сделать, сказать, как-нибудь ее растормошить.","Теперь благодаря вам заметит чашки и быстренько соберется.","Она садится и молчит?","Задавайте вопросы.","«Что случилось? Почему молчишь? Ты на меня обиделась? Я что-то сделала?»","Если отвечает, что сил разговаривать нет, уточните: «Даже со мной?»","Обязательно выделите голосом вашу дружбу.","Пусть прямо сейчас докажет, что ценит вас.","Можно рассказать, как вы перенесли ради нее маникюр.","Для человека, которому трудно дойти до душа, это очень полезная информация: теперь еще надо придумать, как вас отблагодарить.","Дальше приглашаем гулять.","Значит, приглашайте убедительнее.","Она же дома сидит, никаких планов у нее нет, вы своими глазами видите.","Объясните, что собраться очень просто: встала, умылась, оделась, вышла.","Вы сегодня так сделали, у вас получилось.","Почему у нее должно быть иначе?","Кстати, про футболку обязательно напомните перед выходом.","Дружеское «ты в этом пойдешь?» отлично помогает человеку, который и так полчаса собирался с силами, чтобы открыть вам дверь.","Еду, которую вы принесли, она почти не тронула?","Тут пригодится ваше кулинарное резюме.","Сколько вы выбирали продукты, сколько готовили, как специально положили ее любимый сыр.","Аппетит должен появиться хотя бы из благодарности.","Можно сесть напротив и смотреть.","Очень многим нравится есть, пока близкий человек проверяет каждую ложку.","Пусть запомнит, какое выражение лица вам нравится.","В следующий раз встретит вас уже подготовленной.","И домашнее задание: вечером написать «Ну как ты?»","Если снова ответит «плохо», пришлите вчерашнее фото, где она улыбается.","Очень убедительный документ.","Мы же все знаем, что с депрессией на фотографиях положено исключительно лежать лицом к стене.","При депрессии подруга может долго отвечать, отменять встречи, оставлять еду и посуду, потому что ей тяжело делать даже привычные вещи.","И после приятного вечера ей все еще может быть плохо.","Можно написать: «Я могу привезти ужин и оставить у двери. Отвечать сразу не нужно».","Много.","Отказывается?"],"before":null},{"id":"r_mif_2","author":"Юлия","format":"reels_rol","asked":"reels_auto","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"Текст на экране: Голосовое от подруги: просто не накручивай\nРечь: Слушай, это я, твоя подруга, сейчас научу тебя спокойно жить. Я твое сообщение прочитала и сразу поняла: тебе надо просто перестать накручивать. Видишь, как удобно, даже встречаться не пришлось, я тебе голосовым помогла.\n\nЧто у вас там случилось? Ты спросила, как у него день, он ответил «нормально», и теперь ты думаешь, что он на тебя обиделся?\n\nТы уже разогревала ужин два раза, потому что сидишь с телефоном и перечитываешь переписку?\n\nНет, я тебя внимательно слушаю. Ты говоришь, что у тебя само получается возвращаться к переписке, даже когда телефон лежит экраном вниз. Ну переверни его еще раз. Убери подальше. Только звук оставь, вдруг он напишет. Хотя, если будешь ждать звук, тоже начнешь накручивать. Выключи звук. Но тогда придется проверять. Слушай, ну ты как-то сама определись, я за тебя все решить не могу.\n\nЧто значит, от моих советов тебе еще хуже? Подожди, я же ничего плохого не сказала. Я сказала перестать накручивать. Это хороший совет. Короткий, понятный, бесплатно.\n\nПолучается, тебе осталось всего ничего: перестать тревожиться, перестать себя ругать и перестать расстраиваться, что пока ничего из этого не вышло. Видишь, мы уже почти разобрались.\n\nТы замолчала. Полегчало? Ну слава богу. А то я уже думала, чем еще тебе помочь. Я же переживаю за тебя, правда. Мне хочется, чтобы ты могла вот так взять и спокойно провести вечер. Поэтому в следующий раз сразу мне пиши, без этих долгих объяснений. Можно одним словом: «тревожно». Я тебе сразу отвечу: «перестань». Сохрани мое голосовое, будешь включать, когда понадобится. И обязательно напиши потом, что помогло. Мне будет приятно.","caption":"Иногда после такого разговора ты еще и просишь прощения у подруги за испорченный вечер.\nМне грустно, когда за поддержкой становится стыдно обращаться.\nНапиши в комментариях свой вариант «полезного» совета.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Голосовое от подруги: просто не накручивай | твое сообщение прочитала и сразу поняла: тебе надо просто перестать накручи"}],"cut":["Вот прямо перестать.","Ты же сама говоришь, что устала весь вечер об этом думать.","Ну так больше об этом и не думай.","Ну зачем ты сразу так?","Может, занят.","Может, устал.","Может, просто день нормальный.","Все, мы выяснили.","Теперь можешь спокойно ужинать.","Вот видишь, сама себе вечер портишь.","Надо было поесть сразу.","Я всегда говорю: сначала поешь.","Хотя, конечно, если ты будешь есть и думать, что он обиделся, тогда ужин тут ничего не решит.","Так что сначала перестань думать, потом поешь.","Или одновременно.","Ты попробуй.","Я понимаю, что ты уже пыталась отвлечься.","Но ты, наверное, отвлекалась и проверяла, отвлеклась ли.","Так никто не отвлекается.","Надо отвлечься полностью.","Включи что-нибудь легкое.","Почему ты потом пересматриваешь один и тот же момент, потому что ничего не услышала?","Ну потому что опять думала о нем.","А я тебе что сказала?","Мне просто жалко, что ты столько времени на это тратишь.","Сидела бы сейчас, ела, смотрела сериал.","А ты сидишь, еда холодная, сериал идет, еще и мне рассказываешь, как тебе тревожно.","Я тоже начинаю переживать.","Поэтому давай ты уже успокоишься, и мы обе нормально проведем вечер.","Ты теперь переживаешь еще и потому, что у тебя не получается успокоиться?","Ну вот, опять.","У тебя уже была одна тема для переживаний, ты себе вторую придумала.","Я же ровно от этого тебя и предостерегала.","Ты хочешь, чтобы я просто послушала?","Я слушаю.","Уже сколько слушаю.","Только ты все время возвращаешься к тому, как страшно тебе сейчас ему написать и показаться навязчивой.","Ну так напиши спокойно.","Без тревоги.","Ты же умеешь сообщения писать?","Вот и напиши обычное сообщение, только перед этим перестань бояться ответа.","Совсем другое дело будет.","Я, кстати, очень за бережное отношение к себе.","Поэтому ругать себя за тревогу тоже прекращай."],"before":null},{"id":"r_mif_2_2","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"Текст на экране: Я опять себя накручиваю?\n\nРечь: «Ты всегда можешь успокоиться, если просто перестанешь себя накручивать». Меня раздражает это «всегда».\n\nВот тут бывают два разных случая.\n\nДопустим, он задержался и не написал.\n\nПотом он отвечает: затянулось на работе. При этом ты знаешь: за сам разговор он тебя наказывать не будет.\n\nА теперь тот же вечер, тот же телефон. Только вчера он сказал: еще раз спросишь, где я, можешь собирать вещи. Раньше он уже выгонял тебя ночью, забирал ключи, переставал отвечать после ссоры, а потом смеялся, когда ты рассказывала, как испугалась.\n\nИ сегодня ты думаешь, можно ли вообще ему написать. Потому что помнишь, что случилось в прошлый раз. Ты удаляешь набранное сообщение и сидишь одетая, хотя давно пора спать.\n\nКогда такой девушке предлагают просто перестать накручивать, я злюсь.\n\nТы отвечаешь за то, как разговариваешь с ним. Он отвечает за свои угрозы. Твоя тревожность эту ответственность с него не снимает.\n\nВ таком случае нужна помощь с безопасностью: близкий, у которого можно остаться, специалист по домашнему насилию, психолог.\n\nВ первом случае ты ждешь сообщения и боишься, что тебя разлюбили. Во втором ты сидишь с ключами в кармане, потому что боишься, что тебя снова выставят за дверь.","caption":"Иногда ты рассказываешь подруге только, сколько сообщений ему отправила. А про то, что он сказал тебе вчера, умалчиваешь, потому что стыдно снова это обсуждать. Мне хочется услышать и эту часть.","judge":null,"guard":[{"rule":"kancelyarit","quote":"При этом"},{"rule":"dvoetochiya","quote":"Потом он отвечает: затянулось на работе. При этом ты знаеш | ь: за сам разговор он тебя наказывать не б | , тот же телеф"}],"cut":["Особенно когда такой совет дают, даже не спросив, что у тебя происходит.","Ты уже тревожишься, уже проверяешь телефон, а теперь еще и ругаешь себя: ну почему я опять все испортила, почему я не могу спокойно ждать?","Снаружи ты делаешь одно и то же: сидишь вечером, смотришь, когда он был в сети, открываешь переписку.","Но давай посмотрим, как вы вообще живете.","Ты отправила сообщение, он пока не ответил.","И ты уже вспоминаешь, как он утром попрощался, достаточно ли тепло, почему вчера рано лег, вдруг ему с тобой скучно.","Заодно перечитываешь свое последнее сообщение.","Может, зря ты там спросила про выходные?","Дома вы можете поговорить.","Ты можешь сказать, что волновалась, попросить предупреждать.","Он может забыть, ты можешь рассердиться, вы можете еще раз это обсудить.","Тебе бывает тревожно рядом с ним, и вы можете с этим разбираться, договариваться и жить нормально.","Мне важно вот это уточнение.","Потому что иногда после любого волнения ты уже начинаешь проверять собственную пригодность к отношениям.","Как будто сначала надо научиться никогда ничего не бояться, а потом уже с кем-то встречаться.","Ну представь, сколько тогда пришлось бы ждать.","Она еще и должна считать себя виноватой в том, что ей страшно рядом с тем, кто ей угрожает.","Тут правда бывает нужно уходить."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Мама ждет звонка, я опять виновата\nРечь: Вы сейчас ролик смотрите и краем глаза проверяете, сколько времени, потому что маме еще не позвонили?\n\nЯ злюсь, когда вижу советы вроде «ну позвони, тебе что, сложно». Сидите вечером на кухне, ужин уже разогрели, телефон рядом, и вроде можно поесть, посмотреть что-нибудь, просто помолчать. Но вы помните, что вчера мама сказала: «Ну ладно, раз тебе некогда».\n\nИ сегодня вы звоните пораньше. Чтобы снова этого не услышать.\n\nИ вот это «тебе что, сложно» меня особенно бесит. Блять, вы уже собственный ужин согласовываете с тем, успеет ли мама расстроиться.\n\nА во вторник вы устали. Во вторник вам просто нечего сказать.\n\nНо пропустить вторник нельзя, потому что в среду вы услышите: «Я уж думала, ты про меня забыла». И будете перечислять, что делали, почему закрутились, почему поздно освободились. Хотя телефон вы вчера держали в руках. И ролики смотрели. И подруге ответили.\n\nВот за подругу вы себя отдельно доедаете. Ей, значит, написать смогли.\n\nА сегодня в девять вечера будете объяснять маме, куда вы вчера пропали.\n\nВы никуда не пропали. Вы вчера были дома.","caption":"Иногда мама сама заканчивает разговор словами «ну все, отдыхай». А на следующий вечер вы опять спешите позвонить до девяти, даже если еще едете домой. И заранее придумываете, что сегодня рассказать.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ь. Но вы помните, что вчера мама сказала: «Ну ладно, раз тебе некогда». | к нельзя, потому что в среду вы услышите: «Я у"}],"cut":["Ну все.","В плохие дочери вы себя уже записали.","Даже досмотреть спокойно нельзя.","Давайте хотя бы этот ролик засчитаем как время, когда вы были заняты.","Сидели, слушали психолога, очень серьезное мероприятие.","Потому что вы ведь и сами себе это говорите.","Мама спрашивает, что нового.","Да ничего нового.","Работали, зашли в магазин, сейчас будете есть.","Вы ей вчера примерно это же рассказывали.","И позавчера.","Вы даже заранее знаете, что она дальше спросит, и что вы ответите, и на каком месте скажете: «Ну ладно, мам, я пойду».","Только сказать это тоже надо аккуратно.","Слишком быстро попрощаетесь, мама обидится, что вы торопитесь закончить разговор.","Причем вы можете любить с ней разговаривать.","В воскресенье, например, сами набираете, потому что случилось что-то смешное и хочется рассказать.","Болтаете долго, вспоминаете, смеетесь.","И мне так жалко этого вашего вечера, в котором вы уже полчаса мысленно оправдываетесь за разговор, который еще даже не пропустили.","Еда остывает, вы перематываете ролик, потому что опять прослушали половину, смотрите на часы и прикидываете: сейчас позвонить, потом поесть, или сначала быстро поесть, но тогда мама уже спросит, почему так поздно.","Вы живете отдельно.","Сами платите за квартиру, решаете рабочие вопросы, покупаете продукты."],"before":null},{"id":"r_rod_1_2","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Живете отдельно, каждый день отчитываетесь маме\n\nРечь: Четыре признака, что вы живете отдельно, но до сих пор планируете свой день так, чтобы мама не обиделась.\n\nПервое. Подруга позвала в кино, вы покупаете билет и сразу пишете маме, во сколько начнется сеанс, когда закончится, почему телефон будет без звука.\n\nВторой признак. Увидели звонок на совещании, вышли в коридор, шепотом объясняете, что сейчас неудобно. Мама говорит: «Я тебя совсем не слышу». Вы повторяете громче, коллеги ждут.\n\nТретье. Муж спросил, будете ли ужинать, а вы ему рукой показываете: тихо, тихо. Потому что мама услышит и начнет: «Все, я поняла, я вам мешаю». Блядь, меня прямо бесит, сколько стараний иногда нужно приложить, чтобы спокойно закончить обычный звонок.\n\nЧетвертое. Иногда вы скрываете от мамы хорошее. Купили билеты на выходные, радуетесь, но рассказывать пока не будете. Она спросит, с кем едете, потом вспомнит, что вы давно к ней не приезжали, потом скажет: «На всех у тебя время находится».\n\nА мама потом скажет: «Ты мне совсем ничего о себе не рассказываешь».\n\nЧто вы в последний раз ей не рассказали?","caption":"Меня особенно цепляет мамино «могли бы и каждый день звонить, нам много не надо». Взрослая дочь при этом уже несколько минут подбирает причину закончить разговор.\nМожете добавить в комментариях свой пункт.","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"},{"rule":"dvoetochiya","quote":"няете, что сейчас неудобно. Мама говорит: «Я тебя совсем не слышу». Вы повторяете | е ли ужинать, а вы ему рукой показыв"}],"cut":["Вы заранее оправдываетесь за вечер, который еще даже не начался.","И добавляете, что завтра обязательно позвоните.","Вроде вам тридцать лет, свои деньги, своя квартира, а перед кино надо еще получить мамино «ну ладно».","Если она прочитала и промолчала, вы уже сидите в зале и проверяете, не ответила ли.","Подруга смеется, а вы думаете, сильно ли мама обиделась.","Вы отвечаете маме даже тогда, когда вам за это достанется на работе.","Можно было бы перезвонить через час, конечно.","Только тогда сначала придется выслушать: «А вдруг бы со мной что-то случилось?»","И вы уже знаете, что проще выйти.","Свое рабочее время вы потом наверстаете вечером.","Вы злитесь на того, кто прерывает ваш разговор с мамой.","Муж уже ест один, вы говорите маме «да, я слушаю», хотя сами голодные и половину пропустили.","Потом еще с мужем разговариваете раздраженно, хотя он всего лишь позвал вас есть.","И вы уже объясняете, почему вообще решили куда-то поехать.","Поэтому фотографию из поездки тоже придержите.","Вернетесь, позвоните, спросите про ее дела."],"before":null},{"id":"r_men_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Папа терпит, потом кричит\n\nРечь: Четыре признака отцов, которые привыкли сдерживать слезы и обиду, а теперь все чаще срываются на детей.\n\nПервое, вы подробно объясняете, почему злитесь, и почти никогда не говорите, что вам больно.\n\nВторой признак, вы сердитесь, когда о вас заботятся. Жена спрашивает, что случилось, предлагает поговорить, а вы отвечаете, что все нормально, хватит уже спрашивать. Жена уходит в другую комнату, вы сидите на кухне один. Поговорили.\n\nТретье, ребенку достается за то, за что взрослому вы бы ничего не сказали. Сын перед сном просит еще посидеть рядом. Вы уже согласились, потом он просит воды, потом поправить одеяло, и вы вдруг кричите: сколько можно, я тебе весь вечер посвятил! Он сразу замолкает и говорит, что уже ничего не надо. Вот это меня особенно задевает.\n\nЧетвертое, чужие слезы вам трудно выдерживать. В том числе слезы собственного ребенка. Он плачет из-за проигранного матча, а вы начинаете объяснять, что надо было лучше играть. Но сын уже вытирает лицо рукавом и отворачивается. Папа рядом, а поплакать при нем нельзя.\n\nЕсли сын однажды скажет вам, что у него все нормально, тем же голосом, каким вы отвечаете жене, вы ему поверите?","caption":"Иногда отец после срыва покупает ребенку что-нибудь вкусное, потому что заговорить о случившемся ему стыдно. А ребенок продолжает гадать, можно ли уже подойти к папе.\nПодписывайтесь, если хочется еще таких разговоров об отцовстве, злости и отношениях с детьми.","judge":null,"guard":[],"cut":["Начальник при всех назвал вашу работу ерундой.","Дома вы пересказываете, какой он идиот, спорите с женой, которая предлагает сменить работу.","Сказать, что вы старались и вам было унизительно это слышать, почему-то гораздо труднее.","Поэтому жена слышит очередной рассказ про дураков на работе и постепенно перестает расспрашивать.","Вы остаетесь с ощущением, что даже дома вас никто толком не слушает.","Потому что стоит начать рассказывать, и голос может задрожать.","И вот этого вы себе позволить не можете.","Особенно дома, где вы отец, взрослый, должны справляться.","Еще минуту назад ему хотелось побыть с вами.","Теперь он старается поскорее вас отпустить.","Потому что папа потом действительно может мучиться, лежать без сна, обещать себе завтра вести себя спокойнее.","А сын уже сегодня решил лишний раз ничего у него не просить.","Вы ведь хотите помочь, подготовить его, чтобы умел держаться.","И можете еще долго рассказывать про характер, дисциплину, жизнь, в которой никто жалеть не будет."],"before":null},{"id":"r_men_1_2","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Все терпите, потом кричите на детей\nРечь: Четыре признака отца, который привык все терпеть и потом срывается на детей.\nПервое, вы соглашаетесь, даже когда уже злитесь. На работе вам передают чужую задачу перед самым уходом, вы говорите: «Ладно, сделаю». Домой приезжаете поздно, ребенок просит помочь собрать конструктор, и тут вы можете резко ответить. Теперь он тихо собирает один.\nВторое, близкие узнают, что вам плохо, когда вы уже повысили голос. Жена спрашивает, как дела, вы отвечаете: «Нормально». Потом дома кто-то включает телевизор погромче. И вы взрываетесь: «Можно хоть немного обо мне подумать?» Меня здесь очень задевает, сколько всего мужчина успевает вынести молча, прежде чем вообще скажет, что ему тяжело.\nТретье, вам трудно принять помощь даже дома. Вы отвечаете ему, глядя в телефон, и надеетесь, что сегодня он быстро уснет.\nЧетвертое, вам особенно трудно выдержать детские слезы. Сын проиграл в настольную игру и плачет. Хочется, чтобы он немедленно собрался, вытер лицо и нормально разговаривал. Вы ведь сами весь день именно так и делали. Вы уже кричите «успокойся» громче, чем плачет ваш ребенок.","caption":"После крика бывает стыдно даже подойти к ребенку, и отец до вечера с ним почти не разговаривает. Если срывы повторяются, с этим стоит обратиться к психологу.\nЯ Михаил, психолог, работаю с мужчинами и отцами, чаще от тридцати до сорока пяти.\nЕсли узнали себя, можете написать в комментариях свой пункт.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ю задачу перед самым уходом, вы говорите: «Ладно, сделаю». Домой приезжаете поздн | Жена спрашивает, как дела, вы отвеча"}],"cut":["Вы же взрослый, ответственный, сейчас объяснять, спорить, еще подумают, что не справляетесь.","Он ведь уже большой, мог бы понять, что папа устал.","Хотя вы ему даже не сказали, что у вас был тяжелый день.","Голова болит, по работе неприятности, хочется хотя бы полчаса тишины.","Все это вы оставляете при себе, потому что жаловаться как будто стыдно.","И сколько обидного успевает сказать вместе с этим.","Проще самому донести, починить, разобраться, потому что вы должны справляться.","Даже когда вам предлагают отдохнуть, вы находите еще одно дело.","Отдыхать спокойно трудно: вдруг подумают, что вы обленились.","К вечеру сил на разговор с ребенком уже нет.","Вы сначала объясняете, что ничего страшного, предлагаете сыграть еще раз, потом начинаете сердиться: ну сколько можно, из-за такой ерунды.","И вот он сидит перед вами, всхлипывает, пытается что-то сказать, а вы уже требуете ответа.","Вам кажется, что он нарочно продолжает."],"before":null},{"id":"r_vopros_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: «Я даже не знаю, что рассказывать»\nПерсонажи: А это я на первой сессии, Б это психолог\nБ: Можно прийти без заготовленной темы.\nА: А если я сяду и буду молчать?\nБ: А пока представляла, что хотелось рассказать?\nА: Как мама звонит, а я смотрю на телефон и жду, когда перестанет. Потом сама перезваниваю, потому что вдруг что случилось. Хотя знаю, что она спросит, почему я сразу не ответила.\nБ: Что мешает рассказать об этом?\nА: Ну люди приходят, когда у них правда что-то случилось. Ты вообще поймешь, зачем я пришла?\nБ: Ты боишься, что я сочту это ерундой?\nА: Конечно.\nБ: И сейчас ты решаешь, что мне можно рассказать?\nА: Да.\nБ: А что тебе хотелось сказать до этих объяснений?\nА: Что я иногда очень не хочу брать трубку. И мне стыдно это произносить, даже тебе. Получается, я могу вот так и начать? Без всей этой речи про то, какая у меня хорошая мама?\nБ: Да.","caption":"Я могу спросить, как тебе было решиться и записаться. Иногда мы начинаем знакомство с того, что ты чуть не отменила встречу.\nМеня зовут Юлия, я психолог, помогаю тем, кто впервые решается на терапию.\nПодписывайся, если хочется еще таких сценок: здесь я рассказываю, как проходят встречи с психологом.","judge":null,"guard":[],"cut":["Я ведь уже представляла, как приду, ты спросишь, что меня привело, и я скажу: даже не знаю.","Здравствуйте, очень содержательно получилось.","Да много всего.","А я буду сидеть и жаловаться, что мама мне звонит.","Еще и скажу, что люблю ее.","Ты скажешь, что у меня все нормально, и я пойду домой.","Потом мама снова позвонит, я опять буду смотреть на телефон и злиться на себя.","Но второй раз записаться уже постесняюсь.","Я даже хотела сказать, что у нас хорошие отношения.","Чтобы ты сразу ничего плохого про маму не подумала.","Сижу у психолога и уже объясняю, почему вообще не должна была сюда приходить."],"before":null},{"id":"r_vopros_2_2","author":"Юлия","format":"reels_otvet","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: О чем говорить на первой сессии?\nРечь: А о чем вообще говорить на первой сессии?\n\nОткрывают заметки, составляют список, потом перечитывают и половину удаляют. Про это стыдно, это какая ерунда, а это я вообще должна была давно сама решить. И в итоге приходят с ощущением, что говорить особенно не о чем. Хотя еще вчера из-за того, что удалили, не могли уснуть.\n\nНу вот, допустим, ты весь вечер проверяла, ответил ли тебе мужчина. Отложила телефон, взяла обратно, открыла переписку, посмотрела, когда он был в сети. Хотела спросить, увидитесь ли вы в выходные, но решила подождать, пока сам напишет. Уже пора спать, а ты все проверяешь.\n\nА когда представляешь, как расскажешь это психологу, становится неловко. Взрослая женщина, работаешь, сама оплачиваешь квартиру, и вот пришла поговорить, почему тебе не ответили на сообщение.\n\nВот здесь я могу спросить: «Ты сейчас переживаешь, что я тоже сочту это глупостью?»\n\nПоэтому начало первой встречи вполне может звучать так: «Я даже записала, о чем хочу поговорить, а теперь мне стыдно это читать».\n\nС этого мы уже можем начать разговор.","caption":"Перед первой встречей можно спросить меня, как все устроено: сколько она длится, где мы встретимся, как пройдет оплата. Такие вопросы я тоже жду.\nМеня зовут Юлия, я психолог, помогаю решиться на первую встречу и освоиться в терапии.\nНапиши в комментариях, о чем тебе было бы неловко спросить психолога.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Вот здесь я могу спросить: «Ты сейчас переживаешь, что я тоже сочт | первой встречи вполне может звучать так: «Я даже за"}],"cut":["Можно начать с того, почему тебе сейчас трудно об этом заговорить.","Вот даже с того, что ты сидела перед встречей и думала: ну что я ей расскажу, у меня вроде ничего такого.","Меня часто об этом спрашивают.","И за годы работы я замечаю, сколько люди готовятся к первой встрече.","Мне всегда жаль, сколько сил ты можешь потратить еще до нашего знакомства, пытаясь решить, с чем ко мне прилично приходить.","И ты начинаешь объяснять заранее, что вообще-то понимаешь: он мог быть занят.","Что ты сама считаешь свою реакцию глупой.","Что обычно ты вполне нормально со всем справляешься.","Потому что ты уже сидишь передо мной и стараешься рассказать о себе так, чтобы я не подумала о тебе плохо.","Мне важно услышать и это.","Как тебе со мной говорить, чего ты ждешь от меня, какой моей реакции опасаешься.","Мы ведь только знакомимся, ты еще понятия не имеешь, как я отнесусь к тому, что для тебя болезненно.","И да, иногда все проще, чем я как психолог могу предположить.","Ты молчишь, потому что растерялась в новом месте и пока не знаешь, с чего начать.","Я могу спросить, ты можешь меня поправить.","Мне это тоже важно: чтобы у тебя была возможность сказать, что я тебя сейчас неправильно поняла."],"before":null},{"id":"r_money_1","author":"Ольга","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"Текст на экране: Хорошая девочка просит прибавку\n\nРечь: Стыдно, хорошая моя, вы столько всего делаете, а сказать начальнику, что хотите больше денег, почему-то стыдно. Как будто вы сейчас попросите наклеечку за хорошее поведение, и взрослая тетя посмотрит на вас и скажет: ну ты сама-то как считаешь, заслужила? И вы сразу начнете вспоминать, где ошиблись, куда опоздали, на какое письмо ответили только на следующий день.\n\nСтыдно, и вот уже пятница, вы сидите над чужим отчетом, потому что коллега ушла, а в понедельник его надо сдавать. Начальник пишет: спасибо, вы нас очень выручили. Вы смотрите на это спасибо, потом на время, потом опять на спасибо. И отвечаете: да, конечно, все будет готово. Хотя вы вообще-то хотели написать про зарплату. Даже открыли отдельное сообщение. И закрыли.\n\nБлядь, меня вот это очень злит: вы даже в собственном сообщении начальнику стараетесь ничего у него не попросить. Чтобы ему было приятно вас хвалить, чтобы вы остались той сотрудницей, с которой никаких сложностей.\n\nСтыдно попросить больше денег. Попросить вас поработать в выходные ему вполне удобно.","caption":"Перед разговором о зарплате так и хочется извиниться за беспокойство. Хотя начальник обсуждает с вами рабочие вопросы весь день.\nЯ Ольга, психолог, работаю с женщинами, которые устают на работе и продолжают требовать от себя еще.\nСохраните, если давно откладываете этот разговор.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"взрослая тетя посмотрит на вас и скажет: ну ты сама-то как считаешь, заслужила? | ельник его надо сдавать. Начальник пиш"}],"cut":["Стыдно, и поэтому вы решаете еще поработать.","Вот сейчас доделаете отчет, поможете коллеге, возьмете то, что никто брать не хочет, и тогда начальник сам увидит.","Потому что если он сам предложит прибавку, вы точно заслужили.","А если пришлось просить, вы еще будете переживать, что вам дали просто потому, что вы пристали.","Стыдно, потому что спасибо вы уже получили, и теперь как будто некрасиво следом про деньги.","Он вас похвалил, а вы тут со своим.","Стыдно, и вы опять выбираете дополнительную работу, потому что работать вы умеете, там понятно, что делать: открыть таблицу, проверить, отправить.","А в разговоре про повышение начальник может сказать, что пока рано.","И тогда вы услышите, что все эти вечера, все ваши старания оказались недостаточными.","Вот этого вы и боитесь.","Поэтому проще еще один вечер посидеть и еще немного понадеяться.","Стыдно, моя хорошая, потому что вы ждете ту самую наклейку, после которой уже точно можно будет попросить.","И мне очень хочется, чтобы у вас получилось произнести хотя бы простое: «Я хочу обсудить повышение зарплаты».","Без перечисления всех своих недостатков перед этим.","Вы ведь можете ошибаться в отчете и при этом делать работу, за которую хотите получать больше.","Начальник может быть доволен тем, сколько вы получаете сейчас.","Особенно если вы каждый раз соглашаетесь сделать еще."],"before":null},{"id":"r_money_1_2","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"Текст на экране: Мне стыдно просить больше денег\n\nРечь: Только что увидела совет: стесняетесь просить повышение, сначала покажите, на что способны. Сижу с чаем и думаю: девочки, куда еще показывать? Вы уже делаете свою работу, доделываете за коллегой, отвечаете после шести, обучаете новенькую, знаете, кому звонить, когда опять ничего не работает. Осталось начальнику на отпуск чемодан собрать, чтобы окончательно убедился.\n\nИ вот это «сначала заслужите» меня бесит.\n\nВот понедельник. Вы собирались поговорить с руководителем про зарплату. Даже вечером набрали в заметках, сколько задач у вас прибавилось. Открываете эти заметки перед работой и думаете: сейчас отчет сдам, он увидит результат, тогда будет удобнее зайти.\n\nСдали. Руководитель пишет: спасибо, отлично, и сразу спрашивает, сможете ли вы еще помочь с презентацией. Вы пишете: конечно. Хотя собирались сегодня уйти вовремя, у вас запись к врачу, и теперь опять придется звонить, переносить.\n\nБлядь, да он уже сказал, что вы отлично работаете.\n\nЯ сейчас сама разошлась и уже готова возмущаться вашим начальником, хотя вообще его не знаю.\n\nА вы пока добавляете себе еще задач, надеясь, что после них разговор наконец начнет руководитель.\n\nСколько еще нужно сделать, чтобы он сам догадался?","caption":"Особенно обидно потом услышать на увольнении: «А почему вы раньше не сказали, что вас зарплата не устраивает?» Вы ведь считали, что по количеству работы все понятно.\nПодписывайтесь, если хочется еще таких разговоров про работу, отношения и страх оказаться неудобной.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Только что увидела совет: стесняетесь просить повышение, сначала | те, на что способны. Сижу с чаем и думаю: девочки, ку"}],"cut":["Потому что вы, возможно, уже давно заслужили и все равно молчите.","Вы пытаетесь получить повышение так, чтобы самой его не просить.","Зато после презентации уж точно будет понятно, какая вы ценная.","Только вам хочется, чтобы он сам продолжил: и поэтому мы повышаем вам зарплату.","Тогда можно обрадоваться, поблагодарить, никому ничего не доказывать.","Особенно приятно, что никто не сможет сказать: с чего вы вообще взяли, что вам должны платить больше?","Вот этого ответа вы и боитесь.","Что руководитель посмотрит с удивлением, начнет перечислять ваши ошибки, скажет, что остальные тоже много работают.","И вы будете сидеть перед ним с ощущением, будто попросили лишнего, хотя еще минуту назад собирались обсудить свою работу.","Поэтому вы соглашаетесь на следующую задачу.","С задачей хотя бы понятно, что делать: открыть файл, собрать данные, отправить до вечера.","А потом можно еще немного подождать.","Вдруг заметит.","Вполне возможно, он искренне доволен и считает, что вас тоже все устраивает.","Вы же соглашаетесь.","И когда он просит задержаться, тоже соглашаетесь.","Но я понимаю, почему так трудно открыть рот.","Когда очень важно оставаться хорошей сотрудницей, страшно услышать, что ты слишком многого хочешь.","И вы снова берете работу, потому что за нее привычнее получать одобрение, чем обсуждать деньги.","Вам нужна ясность: сколько вам готовы платить за тот объем, который вы уже выполняете."],"before":null},{"id":"r_body_1","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Тем, кто ругает себя перед отпуском\nРечь: Это тебе, если до отпуска осталось несколько дней, а ты стоишь перед зеркалом в купальнике и думаешь: ну куда я такая поеду. Милая, ты уже и боком повернулась, и живот втянула, и ткань поправила. А потом ты злишься на себя: взрослая женщина, отпуск оплатила, купальник купила, стою тут, чуть не плачу из-за складки. Меня очень задевает, как быстро мы начинаем себя добивать именно там, где нам уже плохо. И вот ты берешь телефон, чтобы посмотреть, можно ли вернуть купальник, видишь фотографию девушки в таком же, увеличиваешь ее, снова смотришь в зеркало. Ну все, теперь еще и сравнила. Я сейчас думаю о том, сколько всего ты успела сделать до этого зеркала. На работе дела закончила, отпуск согласовала, билеты проверила, жилье забронировала, зарядку нашла, крем купила, сто раз прочитала, какого размера можно взять чемодан. Господи, с чемоданом уже разобралась, теперь бы еще самой себе пройти проверку перед вылетом. И мне хочется побыть с тобой именно в эту минуту, пока купальник еще на тебе и чемодан открыт. Ты можешь сейчас совсем себе не нравиться. И все равно хотеть на море.","caption":"Мне грустно, когда перед отпуском женщина заранее просит подругу: «Только меня не фотографируй». Иногда она уже знает, что потом весь вечер будет увеличивать снимок и разглядывать себя.\nСохрани, если перед поездкой начинаешь себя ругать.","judge":null,"guard":[{"rule":"schet_vsluh","quote":"сто раз"},{"rule":"dvoetochiya","quote":"шь перед зеркалом в купальнике и думаешь: ну куда я такая поеду. Милая, ты уже и | нь поправила. А потом ты злишься на с"}],"cut":["Проверила со всех сторон, придраться нашла к каждой.","И теперь еще ругаешь себя за то, что опять испортила себе настроение.","Почему нельзя просто надеть купальник и пойти собирать чемодан?","Потому что ты уже представляешь, как выйдешь на пляж и кто-нибудь посмотрит на твой живот.","Что кто-нибудь подумает: могла бы и похудеть.","Что на общей фотографии ты опять будешь той, которую хочется обрезать.","И тебе страшно еще до того, как ты вообще куда-то приехала.","Ты же сейчас смотришь на себя и заранее стыдишься перед совершенно незнакомыми людьми.","Перед женщиной с соседнего лежака, перед мужчиной у бассейна, перед всеми, кто случайно окажется рядом.","Они еще даже чемоданы свои, возможно, не собрали, а ты уже перед ними виновата.","За живот.","За бедра.","За то, что сядешь и у тебя будут складки.","И хочется отменить пляж, фотографии, платье, которое собиралась надеть вечером.","И от этого так обидно.","Ты ждала, когда наконец можно будет утром никуда не бежать, завтракать подольше, зайти в воду.","А сейчас стоишь и думаешь, что все это придется делать с оглядкой: как сесть, чем прикрыться, куда деть руки, когда будут фотографировать.","Конечно, ты устала.","Ты еще дома, а уже весь отпуск провела в голове, следя за каждым своим движением.","Без разговора о том, как срочно себя полюбить."],"before":null},{"id":"r_body_1_2","author":"Юлия","format":"reels_malysh","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Малышка собирается на море и ругает живот\nРечь: Так, мои хорошие, кто опять примеряет купальник и собирается оставить себя дома? Малышка, ты куда собралась? На море? А почему тогда стоишь перед зеркалом и говоришь себе такие гадости?\n\nЯ сейчас увидела очередное «успей привести тело в порядок к отпуску» и прямо разозлилась. Потому что ты, возможно, уже стоишь вот так. Купальник надела, повернулась боком, втянула животик. Выдохнула. Все, настроение испортила.\n\nИ ведь ты уже представляла этот отпуск. Как утром пойдешь к воде, как будешь долго плавать, как попросишь тебя сфотографировать. А перед зеркалом думаешь: ладно, на фотографиях буду только по плечи. В воду зайду побыстрее. Пока иду обратно, прикроюсь полотенцем.\n\nПодожди. Ты уже отпуск согласовала, рабочие дела доделала, билеты купила, чемодан достала, зарядку нашла, крем от солнца положила. Даже крошечный шампунь перелила, хотя крышечка у него, конечно, закрывается через раз. Столько всего сделала. И теперь еще должна за оставшиеся вечера срочно стать довольной каждым сантиметром?\n\nИ на фотографиях из отпуска тебе тоже можно быть.","caption":"Меня особенно огорчает совет повесить тесный купальник на видное место «для мотивации». Представляю, как женщина приходит домой уставшая и снова видит напоминание, что собой положено быть недовольной.","judge":null,"guard":[],"cut":["Что случилось?","Складочка появилась, когда села?","И ты теперь смотришь на себя как на рисунок, который хочется весь стереть и переделать.","Почему так стыдно выходить на пляж?","Потому что ты заранее ждешь, что кто-нибудь посмотрит и подумает: ну куда она в таком виде.","Кто именно?","Пока неизвестно.","Но ты уже за него подумала, уже себя обругала, уже достала из шкафа футболку подлиннее.","Знакомо, моя хорошая?","Купальник покупала, чтобы плавать, а теперь стоишь и проверяешь, достаточно ли хорошо ты в нем выглядишь, чтобы вообще выйти из номера.","Вот это мне очень жалко.","Ты еще никуда не приехала, а уже решила, сколько всего себе запретишь.","И злишься на себя за то, что опять переживаешь.","Вроде взрослая, вроде понимаешь, что на пляже будут самые разные женщины.","Но себя рассматриваешь вплотную, при верхнем свете, еще и наклонилась специально.","Ну конечно, нашла, к чему придраться.","Я бы очень хотела, чтобы тебе сейчас стало хоть немного спокойнее.","Можно пока расстраиваться из-за купальника.","Можно вообще не суметь себе понравиться сегодня.","Я понимаю, почему после всех этих советов про подготовку к лету тебе трудно просто одеться и пойти плавать.","Появилась."],"before":null},{"id":"r_teen_1","author":"Михаил","format":"reels_rol","asked":"reels_auto","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Текст на экране: Родительский комитет. Добиваемся откровенности\nРечь: Я как председатель родительского комитета предлагаю разобраться с подростками, которые закрываются у себя в комнате. Вы весь день ждали возможности поговорить, а он пришел, снял кроссовки, сказал «нормально» и закрыл дверь.\n\nОн просит немного побыть одному? Сразу уточните, сколько именно. Вам же нужно планировать вечер. Пять минут, десять, до ужина? И что конкретно он собирается делать один? Лежать? А вместе с вами лежать нельзя? Вы тоже можете молча посидеть рядом и через каждые полминуты спрашивать, долго ли еще.\n\nВот обычный вечер. Он пришел после школы, рюкзак бросил возле стола, даже любимый бутерброд на кухне не взял. Вы заглянули, спросили, будет ли есть. Он сказал: «Потом». Тут, конечно, можно тарелку оставить. Но у нас с вами родительское собрание по вопросам общения, поэтому с тарелкой придется зайти и остаться.\n\nВы же старались. Сыр нарезали. Огурец помыли. И теперь имеете полное право узнать, что у него с настроением, кто написал в чат и почему вчера он смеялся, а сегодня лежит. Огурец просто так никто не моет.\n\nИ обязательно скажите, что вам можно доверять. Для убедительности позвоните бабушке прямо при нем: «Представляешь, опять закрылся, ничего не говорит». Пусть услышит, сколько взрослых заинтересованы в его личной жизни. Можете еще в семейный чат написать, там обычно быстро подключаются.\n\nУжин остынет, уроки останутся, спать ляжете позже, зато вы покажете, насколько для вас важен душевный разговор.\n\nИ пусть своими словами объяснит, почему он больше ничего вам не рассказывает.","caption":"Когда подросток заранее просит «только бабушке не рассказывайте», ему важно знать, кто еще услышит его историю. Я бы отнесся к этой просьбе серьезно.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nОтправьте тому, кому сейчас трудно поговорить со своим подростком.","judge":null,"guard":[{"rule":"rublenye","quote":"Вы же старались. Сыр нарезали. Огурец помыли."},{"rule":"dvoetochiya","quote":"нули, спросили, будет ли есть. Он сказал: «Потом». Тут, конечно, можно тарелку ос | ельности позвоните бабушке прямо при"}],"cut":["Конечно, надо немедленно выяснить, почему он с вами такой необщительный.","Прямо через дверь.","Громко, чтобы точно понял, что дома его готовы выслушать.","Вы спрашиваете, как прошел день, он отвечает, что устал?","Прекрасно, у вас тоже был день.","Расскажите ему свой, подробно, с совещанием, очередью в магазине и ценами на помидоры.","Пусть сравнит.","Возможно, к концу вашего рассказа ему станет стыдно за собственную усталость и он наконец начнет доверять вам как следует.","Только телефон с собой возьмите.","Если он отвернулся к стене, можно написать ему в мессенджере.","Очень удобно: вы сидите рядом, а он получает уведомление «Ты почему меня игнорируешь?».","Тут уже точно никто никого не недопонял.","У нас же какая задача?","Добиться, чтобы подросток сам захотел рассказать.","Поэтому стойте в дверях, пока не захочет.","Можно еще ручку двери придерживать, а то он закроет, и весь разговор придется начинать сначала.","Он говорит: «Я пока не хочу рассказывать»?","Обратите внимание на слово «пока».","Значит, материал для разговора у него есть.","Очень обнадеживает.","Спросите еще раз, только другими словами: что случилось, тебя обидели, ты что-то натворил, мне классному руководителю написать?","Переберите все варианты.","На каком он поморщился, тот и проверяем.","Да, он уже раздражается.","Тут важно показать пример спокойного общения.","Скажите: «Со мной таким тоном разговаривать нельзя».","Особенно если до этого вы несколько раз спросили, чего он лежит с таким лицом.","Мы взрослые, нам приходится задавать сложные вопросы.","Он надел наушники?","Увеличивайте громкость.","Иногда родители ошибочно думают, что подросток хочет тишины, потому что за день устал от уроков, разговоров, людей.","Но если позволить ему посидеть в тишине, вы ведь так и останетесь без подробного отчета.","А уже вечер.","А если он после всего этого все равно молчит, садитесь рядом и ждите.","Свою."],"before":null},{"id":"r_teen_1_2","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Текст на экране: Подросток закрыл дверь и просит отстать\nРечь: Четыре признака, что подростку сейчас трудно, хотя из комнаты вы слышите только «отстаньте».\n\nПервое, подросток избегает даже приятных разговоров. Раньше мог долго рассказывать, что они с друзьями собираются делать в выходные, теперь на любое предложение отвечает: «Не знаю».\n\nВторой признак, он перестает отвечать друзьям. Но подросток может смотреть короткие видео и при этом неделю не открывать сообщение приятеля.\n\nТретье, он сердится, когда вы проявляете заботу. Вы приносите чай, заходите, ставите чашку, спрашиваете, что случилось. Он повышает голос, вы обижаетесь и уходите. Вот это меня особенно огорчает: вы действительно хотели побыть рядом, а он мог испугаться, что сейчас придется отвечать на вопросы, расплачется при вас или услышит, что сам во всем виноват.\n\nЧетвертое, подросток сам ищет повод выйти, но ничего важного не говорит. Спрашивает, где зарядка, стоит рядом, пока вы готовите, заглядывает в кастрюлю. Зарядку попросить проще, чем сказать: мне одиноко, побудьте со мной.\n\nСможет ли он побыть с вами, если пока не готов ничего объяснять?","caption":"Через закрытую дверь иногда проще спросить: «Тебе принести поесть или оставить на кухне?» На конкретный вопрос подростку бывает легче ответить. А вы сможете позаботиться о нем, даже если поговорить сегодня не получилось.","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"},{"rule":"dvoetochiya","quote":"ые, теперь на любое предложение отвечает: «Не знаю». | уходите. Вот это меня особенно огорчает: вы действительно хотели "}],"cut":["Если вы каждый вечер думаете, оставить его в покое или снова постучать, я понимаю вашу растерянность.","Дверь закрыта, вы волнуетесь, и очень хочется хоть какого-то ответа.","Вы спрашиваете про кино, про любимую еду, стараетесь найти хоть что-нибудь, что его заинтересует.","А ему бывает трудно поддерживать разговор, потому что следом вы можете спросить, как дела в школе.","И тогда придется объяснять то, с чем он сам еще толком не разобрался.","В итоге вы перестаете вместе делать даже то, что обоим нравилось.","Здесь родителю особенно легко ошибиться: телефон ведь все время в руках, значит, общается.","Уже неловко отвечать, придется объяснять, куда пропал, а потом еще решать, идти ли гулять.","Чем дольше откладывает, тем труднее вернуться к обычному общению.","И вы оба остаетесь по разным комнатам, хотя еще минуту назад у вас была возможность поговорить.","Вы можете подумать: ну вот, когда ему что-то нужно, разговаривать умеет.","А он, возможно, только на такой разговор сейчас и решился.","И если разговор сразу переходит к оценкам, подросток может снова уйти, так и не решившись остаться."],"before":null},{"id":"r_vybor_1","author":"Ольга","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: «Почему я опять жду его сообщения?»\nПерсонажи: А это я, Б это психолог\n\nА: Меня уже бесит это «выбирайте тех, кто выбирает вас». Спасибо, блядь, я бы с удовольствием. Только мне опять нравится тот, у кого на меня вечно какие-то другие планы. А я все равно жду.\n\nБ: Что он делает, когда встреча отменяется?\n\nА: Пишет, что завал, предлагает как-нибудь потом. Я уже оделась, подруге сказала, что занята, сижу с телефоном. Потом отвечаю: конечно, понимаю, напиши, как освободишься. И еще смайлик ставлю, чтобы никакого недовольства.\n\nБ: И что вы делаете потом?\n\nА: Господи, я уже согласна просто сидеть рядом, пока он отвечает кому-то в телефоне.\n\nБ: А если ничего ему не предлагать?\n\nА: Мне ведь говорят: отношения требуют усилий.\n\nБ: Что для вас будет значить его уход?\n\nА: Я прямо могу составить список, что исправить.\n\nБ: Когда он отдаляется, вы стараетесь сильнее?\n\nА: Да.\n\nБ: Что вы ждете вместе с ответом?\n\nА: Что я все-таки ему нужна. Получается, я уже пытаюсь заслужить его интерес и даже не спрашиваю себя, нравится ли мне вообще, как он со мной обращается.\n\nБ: Да, вы это заметили.","caption":"Мне грустно, когда де
