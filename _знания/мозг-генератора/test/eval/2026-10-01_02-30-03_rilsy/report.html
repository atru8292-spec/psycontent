дуктивности необходимость оправдываться. Убрать лозунг про удовольствие и поправить финальный вопрос: жалеть потраченный час можно не только из страха чужой оценки."},"guard":[{"rule":"dvoetochiya","quote":"Я бы тут спросила: вам вообще привычно делать что-то тольк | заодно учить язык. В кафе берете ноутбук: вдруг получится ч"}],"cut":["С ней спокойнее, меньше шансов получить критику."],"before":null}];const KEY='eval-2026-10-01_02-30-03_rilsy';
