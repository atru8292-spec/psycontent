 ей сказали, что сделали, о чем с ней договаривались, уже никто не спрашивает.\n\nЕсть еще мое нелюбимое: «Ты же понимаешь, он не специально». Допустим, понимаешь. Ты ведь можешь понимать человека и все равно сердиться из-за того, что он сделал. Тебе больно, ты потратила время, тебе придется отменять свои планы. Его намерения ты уже учла. А с тем, что случилось с тобой, куда теперь?\n\nТы отвечаешь за то, что делаешь со своей злостью. Чувствовать ее тебе можно.","caption":"Иногда «я никогда не злюсь» соседствует с длинным списком людей, которым больше не хочется звонить. Мне хочется, чтобы об этом тоже можно было говорить.\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть удобными и хорошими.\nСохрани, если снова захочется ругать себя за злость.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"меня для тебя особенно раздражает совет: «Будь добрее, на близких злиться нельзя | Еще говорят: «Ты же взрослая, могла б"}],"cut":["Но тебе говорят: «Хорошие дочери на маму не злятся».","И ты уже спрашиваешь себя: может, я правда неблагодарная?","Может, я слишком много требую?","Как я вообще могу сердиться, если она столько для меня сделала?","Ты помнишь, сколько она для тебя сделала.","И ты слышишь, как она сейчас с тобой разговаривает.","У тебя есть причины для благодарности и причины для злости.","Все это может быть в одних отношениях, с одним человеком, даже в одном разговоре.","На отказ, который тебе тяжело принять?","И вот ты начинаешь объяснять, что совсем не сердишься, просто устала, просто день тяжелый, просто неправильно выразилась.","Извиняешься за голос, подбираешь слова помягче, еще мягче, еще.","Хотя ты уже несколько раз спокойно сказала, что тебе это неприятно.","Тебя продолжили уговаривать.","Теперь ты злишься еще и на себя, потому что опять не получилось остаться хорошей.","Я совсем не хочу выдавать разрешение кричать на близких, унижать их или пугать молчанием.","За свои слова и поступки ты отвечаешь.","Если нагрубила, можно признать это и извиниться.","И при этом продолжить разговор о том, что тебя рассердило.","Без обещания больше никогда такого не чувствовать.","Ты можешь сказать: «Я зря тебя обозвала. Я все еще злюсь, потому что мы договорились, а ты решил за меня».","И тебе совершенно незачем добавлять, что ты глупая, слишком чувствительная и сама во всем виновата.","Можешь."],"before":null},{"id":"r_humor_1","author":"Ольга","format":"reels_auto","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"","caption":"","judge":null,"guard":[],"error":"The operation was aborted due to timeout","cut":[],"before":null},{"id":"r_humor_1_2","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"Текст на экране: Тренинг: как дружить с психологом\nРечь: Девочки, я подруга психолога, и сегодня я научу вас получать от дружбы максимум.\n\nНачинаете с сообщения: «Ты сейчас можешь просто по дружески поговорить?» Обязательно добавьте «минутку». Минутку человек найдет всегда. А дальше вы уже созвонились, куда она денется.\n\nДопустим, мужчина весь вечер был в сети и вам ничего не написал. Вы уже посмотрели, на кого он подписался, увеличили фотографию женщины с собакой, выяснили, что собака его сестры. Но осадочек остался. Вот с этим и звоните.\n\nПодруга говорит, что ужинает? Прекрасно, пусть ест, вы совершенно спокойно относитесь к звукам посуды. Мы же близкие люди. Можно даже сказать: «Жуй, жуй, я пока расскажу предысторию». Предысторию начинайте с вашего знакомства с этим мужчиной. У подруги как раз суп остынет.\n\nЯ вообще считаю, что нам с такими подругами охуенно повезло. Кто еще сможет по слову «понятно» определить, что именно мужчина имел в виду? Поэтому сразу отправляйте скриншоты. Все. Даже где вы обсуждаете доставку суши. Она специалист, сама найдет важное.\n\nИ вот здесь подруга может вдруг сообщить, что устала и сегодня весь день работала. Спокойно. Скажите: «Господи, со мной можешь расслабиться, я же своя». И продолжайте с того места, где он поставил точку вместо сердечка.\n\nНо я ей потом сердечко отправила.\n\nТак. Мне подруга написала, что ей тяжело от наших разговоров. Сейчас перешлю вам скриншот. Кто-нибудь здесь еще психолог?","caption":"Меня особенно цепляет момент, когда подруга уже третий раз говорит, что хочет спать, и все равно сидит с телефоном. А утром ей прилетает: «Ну что, ты подумала про мою ситуацию?»\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого: здесь про отношения, семью и наши привычки друг с другом.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Тренинг: как дружить с психологом | Начинаете с сообщения: «Ты сейчас можешь просто по дружески по | . Мы же близкие люд"}],"cut":["Записывать ничего не надо, потом попросите свою подругу прислать вам все голосовым.","Она же умеет структурировать.","Дальше очень важно напомнить, что вы пришли просто поговорить.","Потому что, если она начнет задавать вопросы, вам может стать неприятно.","Вы звонили получить человеческую поддержку.","Человеческая поддержка выглядит так: она внимательно слушает, задает правильные вопросы, объясняет, почему вы так реагируете, и к концу разговора вам становится легче.","Ну, обычная дружба.","Если скажет, что по переписке ничего определенного сказать нельзя, отправьте запись его голосового.","Мы же заинтересованы в качестве.","Да, она уже спрашивала, чего вы сами хотите от этих отношений.","Но вы тогда отвлеклись, потому что он наконец ответил.","Сейчас можно вернуться к разговору.","Только сначала надо вместе решить, через сколько минут открывать сообщение.","Я еще люблю говорить: «Ты хотя бы одним словом скажи».","Очень удобный формат.","Она говорит одно слово, вы уточняете, почему именно это слово, она объясняет, вы вспоминаете еще один эпизод.","И вот уже нормальный, содержательный вечер у обеих.","Что значит, у нее были планы?","Конечно, были.","У всех были.","Вы тоже собирались посмотреть сериал, но теперь у вас мужчина написал «спокойной» без «ночи».","Приоритеты иногда приходится менять.","Особенно ценю, когда подруга честно говорит: «Я сейчас совсем без сил».","Сразу видно, доверяет.","Обязательно поддержите: «Бедная, представляю. Кстати, я тоже сегодня вообще никакая».","И расскажите, как весь день проверяли телефон.","Ей будет приятно, что вы понимаете друг друга.","А если она предлагает обсудить все завтра, уточните время.","Прямо конкретно.","И попросите напомнить, потому что у вас сейчас голова забита.","Главное, девочки, интересуйтесь и ее жизнью.","Я всегда в конце спрашиваю: «Ну, ты как?»","Это очень важно для дружбы.","Правда, вчера мужчина как раз позвонил, пришлось свернуться."],"before":null},{"id":"r_malysh_1","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"Текст на экране: Почему страшно сказать «нет»\nРечь: Хорошая моя, вы сейчас ролик смотрите и одновременно придумываете, как бы отказать человеку, чтобы он ни капельки не расстроился?\n\nЯ сегодня опять увидела совет: просто научитесь говорить «нет». И меня прямо бесит это «просто».\n\nСестра пишет: забери меня завтра из аэропорта. Прилет в семь утра, значит, вам вставать в пять, а вы всю неделю ждали субботы, чтобы наконец поспать. Уже купили что к завтраку, чистую пижаму приготовили. Такой у вас был грандиозный план. Поспать и спокойно поесть.\n\nВы начинаете писать, что завтра не сможете. И тут внутри звоночек: сейчас она обидится. Напишет сухое «понятно». Потом маме расскажет, что на вас рассчитывать нельзя. И вот вы уже представляете следующий семейный ужин, где все разговаривают, а с вами как будто чуть холоднее.\n\nСестра пока вообще ничего такого не сказала. Она билет переслала и пошла чемодан собирать. А вы уже успели с ней поссориться у себя в голове, почувствовать себя виноватой, придумать оправдание и стереть свой ответ.\n\nИ пишете: конечно, встречу.\n\nПотом сидите злая. На нее, потому что могла бы такси взять. На себя, потому что опять согласились. И еще ругаете себя за злость: ну сестра же, что вам, трудно? Блядь, трудно. Вставать в пять трудно. Особенно когда вы этого совсем не хотели.\n\nРот уже умеет говорить «нет». Вы пока боитесь, что после этого вас перестанут любить.","caption":"Меня особенно цепляет, когда человек еще и извиняется за то, что долго отвечал: все это время он подбирал максимально безобидный отказ.\nЯ Ольга, психолог, работаю с женщинами, которым трудно перестать быть удобными.\nЕсли узнали себя, напишите в комментариях «знакомо».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Я сегодня опять увидела совет: просто научитесь говорить «нет». И меня | Сестра пишет: забери меня завтра из аэропорта. "}],"cut":["Он еще сообщение не прочитал, а вы уже записали себя в худшие люди района.","Давайте пока снимем с вас корону главной негодяйки.","Тяжелая, наверное.","Вы слово знаете.","Вы даже можете его вслух произнести.","Пока рядом никого, кому оно может не понравиться.","Смотрите, как бывает.","Вот тут мне очень хочется говорить с вами помедленнее.","Потому что вы и так уже себя отчитали за всех.","Если раньше близкие после вашего отказа обижались, замолкали, называли эгоисткой, вы могли научиться соглашаться заранее.","Чтобы с вами продолжали тепло разговаривать.","Чтобы не пришлось сидеть рядом с человеком, который демонстративно отвечает всем, кроме вас.","И теперь, когда нужно отказать, вы сразу вспоминаете, как с вами могут обойтись.","Даже если сегодня перед вами человек, который спокойно вызовет такси.","Поэтому вы можете прекрасно знать про границы, читать про них, подруге объяснять, что она имеет право отдыхать.","А потом все равно заводить будильник на пять утра.","Угу."],"before":null},{"id":"r_malysh_1_2","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"Текст на экране: Почему так страшно сказать «нет»\nРечь: Страшно, хорошая моя, сказать, что вы в субботу не можете посидеть с чужим ребенком, хотя вы правда не можете, вы всю неделю ждали выходного, чтобы проснуться без будильника, спокойно позавтракать и чтобы хотя бы до обеда никто ничего у вас не просил. И вот вы уже пишете, во сколько его привезут. А сами смотрите на эту переписку и чуть не плачете.\n\nСтрашно признаться себе, что вы согласились, потому что очень хотели поскорее получить в ответ: «Спасибо, ты меня так выручила». Получили, выдохнули. Человек доволен, все хорошо, вы по-прежнему нужны. А потом, блядь, вспомнили про свою субботу. И разозлились на человека, который попросил, хотя он пока даже не знает, что вы собирались отказать.\n\nСтрашно еще и потому, что вы надеетесь: сейчас он сам догадается. Вы напишете, что неделя была тяжелая, что вы совсем вымотались, и он скажет: «Господи, конечно, отдыхай». Сколько сил уходит на то, чтобы осторожно рассказать о своей усталости и дождаться, когда другой человек сам разрешит вам остаться дома. А он отвечает: «Да он спокойный, вы вместе мультики посмотрите».\n\nСтрашно сказать «нет» и узнать, останутся ли с вами.","caption":"Особенно тяжело, когда свободный вечер приходится оправдывать занятостью. Сказать «я иду к врачу» бывает проще, чем «я хочу побыть дома».\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nСохраните, если трудно отказывать.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"о очень хотели поскорее получить в ответ: «Спасибо, ты меня так выручила». Получи | Страшно еще и потому, что вы надеете"}],"cut":["Страшно, потому что вы уже представили, как человек прочитает ваш отказ, как перестанет присылать сердечки, как ответит одним коротким «понятно», и вам сразу хочется дописать, что вообще можно что-нибудь придумать, что вы подвинетесь, что ничего такого важного у вас и нет.","Вы еще даже не отказали, а уже пытаетесь помириться.","Страшно, моя хорошая, словно вы маленькая и перед вами сейчас закроют дверь.","И вы останетесь снаружи, потому что сказали что-то неудобное.","Вот это самое больное: вы собирались всего лишь оставить себе субботу, и вдруг вам кажется, что теперь вас могут больше никуда не позвать, ничего вам не рассказать, забыть спросить, как у вас дела.","Я очень сочувствую вам в этом месте.","Страшно выдержать даже маленькое чужое недовольство, потому что у вас в голове оно быстро заканчивается тем, что вас бросят.","Поэтому вы выбираете знакомое: субботу без отдыха, раздражение, головную боль к вечеру, зато в переписке все ласково.","И мне так жалко эту вашу субботу, которую вы уже отдали, лишь бы до вечера не проверять телефон: вам еще отвечают?","С вами еще хотят разговаривать?"],"before":null},{"id":"r_malysh_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"Текст на экране: Я на маму обиделась. Мне можно?\n\nРечь: Ну что, маленькая моя, мамина взрослая умница. На маму обиделась, а теперь еще и себя ругаешь?\n\nСмеешь, представляешь.\n\nВот ты приезжаешь к ней в воскресенье. По дороге покупаешь ее любимое печенье, потому что у тебя хорошая новость, тебя повысили, хочется вместе попить чаю и рассказать.\n\nРассказываешь. А мама спрашивает, кто теперь будет заниматься ребенком, если ты собираешься еще больше работать.\n\nИ ты уже объясняешь, что график останется прежним, что муж тоже умеет забирать из сада, что ты все продумала. Чай остывает. Про повышение ты больше ничего не рассказываешь.\n\nА потом мама складывает тебе с собой котлеты, ищет крышку для контейнера, говорит, чтобы ты осторожнее ехала. И тут ты сама себя начинаешь отчитывать. Вот же, заботится. А я сижу тут со своей дурацкой обидой.\n\nЯ опять увидела совет взрослым дочерям: вспоминайте, сколько мама для вас сделала. И я злюсь, потому что ты и так помнишь.\n\nОй, да ты уже целое министерство маминого понимания.\n\nИ верю, что тебе больно.","caption":"Иногда после разговора с мамой дочь еще пишет ей: «Доехала, спасибо за еду ❤️». А потом долго сидит в машине у дома. Я каждый раз думаю, как много мы можем чувствовать одновременно.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми.\nПодписывайся, если хочется еще таких разговоров. Здесь я пишу про мам, обиды и свою взрослую жизнь.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Я опять увидела совет взрослым дочерям: вспоминайте, сколько мама для вас сдела | осле разговора с мамой дочь еще пишет "}],"cut":["Мама ведь старалась.","Мама ведь помогала.","Как же ты смеешь на нее обижаться, такая большая уже?","Тебе стыдно даже произнести, что она тебя обидела?","Потому что ты уже знаешь, что услышишь в ответ.","Тебя кормили, одевали, ночами с тобой сидели.","И ты сразу начинаешь вспоминать все хорошее, словно сейчас тебя спросят, достаточно ли у тебя причин расстраиваться.","А у тебя внутри заноза.","Маленькая, сидит в ладошке.","Ты можешь сколько угодно объяснять, какая мама хорошая, и все равно будет больно, когда заденут.","Ты даже заранее представляешь, как она обрадуется.","Еще как.","Подожди, хорошая.","Котлеты ты взяла.","Спасибо сказала.","Ты правда рада, что мама приготовила тебе еду.","И тебе все еще больно, что она даже не спросила, рада ли ты сама своему повышению.","Ты помнишь ее тяжелую работу, усталость, помнишь, как ей самой было трудно.","У тебя этот список давно выучен.","Ты им себя каждый раз останавливаешь, когда хочется сказать: мам, мне сейчас обидно.","У тебя на каждое ее слово готово объяснение: устала, волнуется, привыкла так говорить.","Ты столько раз проглотила слезы, договорила обычным голосом, спросила, какие таблетки ей купить по дороге.","И теперь еще должна себя отругать за то, что по пути домой расплакалась?","Мне хочется, чтобы хотя бы здесь тебе не пришлось доказывать, что мама хорошая.","Я верю, что ты ее любишь.","Верю, что она многое тебе дала.","Обидно?"],"before":null},{"id":"r_malysh_2_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"Текст на экране: Девочка, которой обидно на маму\nРечь: Моя хорошая, ты опять от мамы приехала и плачешь? А потом еще ругаешь себя, потому что мама тебе контейнер с котлетами положила, а ты, неблагодарная такая, сидишь и обижаешься.\n\nВот ты приехала к ней в гости. Хотела просто чаю попить, рассказать, что на работе происходит. Даже пирог купила, который она любит. Села, куртку еще толком снять не успела, и мама говорит: ты опять поправилась? Ты отвечаешь, что тебе неприятно. А она удивляется: ну что ты такая обидчивая, я же любя.\n\nИ все. Про работу ты уже рассказывать не хочешь. Сидишь, чай мешаешь, ждешь, когда можно будет собираться, чтобы мама снова не расстроилась, что ты так быстро уходишь.\n\nЗнаешь, меня очень задевает, когда дочери приходится еще и доказывать, что ей достаточно больно, чтобы обижаться.\n\nДевочки, вы уже столько раз выдержали и обидное замечание, и мамины слезы, и собственные извинения, что я бы вам после таких чаепитий котлеты выдавала вместе с отпуском.\n\nТебе незачем отказываться от хороших воспоминаний, чтобы признать сегодняшний вечер тяжелым.\n\nТы можешь обижаться на маму.","caption":"Иногда дочь уже дома пишет маме: «Спасибо за котлеты». А мужу говорит, что просто устала, потому что пересказывать разговор опять больно.\nЯ Юлия, психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли знакомо, можешь написать в комментариях «обидно».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"е толком снять не успела, и мама говорит: ты опять поправилась? Ты отвечаешь, что | тебе неприятно. А она удивляется: ну"}],"cut":["Девочки, которые даже поплакать на маму без разрешения не могут, я сейчас к вам.","Ну что же вы себя так.","Стыдно сказать, что обидно?","Потому что сразу вспоминаешь, сколько она для тебя сделала.","Растила, лечила, ночами не спала.","И ты уже почти готова извиниться за то, что тебе больно.","Хотя мама пока вообще ничего об этом не знает.","Почему сразу не сказала, насколько тебе больно?","Вдруг она заплачет.","Вдруг скажет, что теперь с тобой вообще разговаривать нельзя.","И придется опять ее успокаивать, объяснять, что ты ее любишь, что она хорошая мама, что ты ничего такого не имела в виду.","Подожди, хорошая.","Ты ведь только попросила про твой вес не говорить.","Как будто с маленькой занозой плакать нельзя.","Надо сначала показать, какая она большая, и получить разрешение: да, теперь можно, поплачь.","А ты еще проверяешь: может, мама устала?","Может, у нее давление?","Может, я правда слишком остро реагирую?","И еще много, много, много причин находишь, почему маме можно было так сказать.","Почему себя жалко, если она столько для тебя сделала?","Потому что ты ехала к маме и хотела, чтобы она тебе обрадовалась.","Чтобы спросила, как ты живешь.","Тебе до сих пор этого хочется.","И за это тоже бывает стыдно: взрослая уже, чего пристала к человеку.","Можно любить маму, помнить все хорошее и все равно плакать после встречи с ней.","Да.","Страшно."],"before":null},{"id":"r_drug_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Текст на экране: Друг появляется, только когда ему плохо\n\nРечь: Четыре признака, что друг вспоминает о вас только тогда, когда ему плохо.\n\nПервое: вы заранее знаете, с чем он звонит. Увидели имя на экране и уже думаете: поссорились, уволили, опять кто-то подвел. Потом он мирится, находит работу, выдыхает. И на ваше сообщение про встречу отвечает через неделю.\n\nВторое: о хорошем в его жизни вы узнаете вместе со всеми. Из фотографий. И меня здесь злит совет просто порадоваться за человека.\n\nТретье: вы сокращаете собственные новости. Он позвонил после расставания, и как тут рассказывать, что вам предложили работу, о которой вы мечтали? Оставляете на потом.\n\nЧетвертое: вы ловите себя на том, что ждете его неприятностей. Но когда он пишет, что опять разошлись, вы вместе с тревогой чувствуете облегчение: теперь снова будете разговаривать каждый день. И вам стыдно за это облегчение, поэтому вы молчите о нем даже с другими близкими.\n\nЕсли у него завтра все наладится, вы снова останетесь без друга?","caption":"Меня настораживает, когда человек уже извиняется за обычное приглашение: «Понимаю, у тебя сейчас все хорошо, но, может, увидимся?»\nЯ Михаил, психолог, работаю с людьми от двадцати пяти до сорока.\nСохраните, если вам знакомо такое ожидание.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Первое: вы заранее знаете, с чем он звонит. Уви | дели имя на экране и уже думаете: поссорились, уволили, опять кто-то п"}],"cut":["Вы можете долго этого не замечать, потому что разговариваете очень близко, знаете подробности его жизни, которые он больше никому не рассказывает.","Только вот встречаетесь вы обычно после очередной катастрофы.","Вы откладываете ужин, садитесь на кухне с телефоном и слушаете.","Спрашиваете, как он, на следующий день тоже спрашиваете.","Вы все еще помните, какой у него был тяжелый вторник, хотя он уже прекрасно провел субботу.","Вот они компанией за городом, вот отмечают повышение, вот спонтанно собрались в том самом баре, куда вы давно предлагали сходить.","Да вы рады, что у него все наладилось.","Вы еще и хотели посидеть рядом, пока ему хорошо.","Посмеяться, заказать еды, хоть раз уйти со встречи без тревоги за него.","Но и в следующий разговор ему тяжело, и еще через неделю.","Постепенно вы уже сами пропускаете вопрос, спросил ли он вообще про вас.","У вас столько всего произошло, а рассказать за весь вечер получилось только, что вы тоже устали.","Вот это особенно трудно себе признать.","Конечно, вы хотите, чтобы у него все было хорошо.","Он будет отвечать сразу, просить приехать, говорить, как вы ему нужны."],"before":null},{"id":"r_drug_1_2","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Текст на экране: Опять пишет. Значит, что-то случилось\n\nРечь: Вы сейчас смотрите это видео и уже оправдываете подругу, которая месяцами молчит, пока у нее все хорошо?\n\nВот вечер, вы наконец легли, телефон рядом заряжается. Приходит сообщение: «Вы спите?» И вы уже знаете, что дальше. Она поссорилась с мужем. Или на работе ужас. Вы вытаскиваете провод, садитесь на кровати и пишете: рассказывайте.\n\nТолько общаетесь вы, конечно, на ты. Это я уже со своим «вы» в вашу переписку залез.\n\nА потом она присылает сердечко. Спасибо, вы очень помогли.\n\nИ пропадает.\n\nПричем вы узнаете, что у нее все наладилось. По фотографиям. Вот они вместе уехали на выходные, вот она смеется в ресторане, вот новая работа. И вы даже рады. Правда рады. Просто открываете вашу переписку, а там последнее сообщение от вас: «Как вы там?»\n\nЛадно, предлагаю хотя бы в телефоне переименовать ее в «У нее опять новости». Пусть будет немного интриги.\n\nИ вот вы знаете все подробности ее ссоры с мужем. Она до сих пор не знает, что вы сменили работу.","caption":"Иногда особенно обидно увидеть в общей компании, как внимательно подруга расспрашивает других. Оказывается, она умеет и слушать, и запоминать, и сама писать первой.\n\nМеня зовут Михаил, я психолог, работаю со взрослыми от 25 до 40.\nПодписывайтесь, если хочется еще таких разговоров об отношениях и о себе.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"фон рядом заряжается. Приходит сообщение: «Вы спите?» И вы уже знаете, что дальше | ете провод, садитесь на кровати и пи"}],"cut":["Ну конечно, у нее отношения, работа, поездки, жизнь насыщенная.","Вы все понимаете.","И даже успели записать себя в плохие друзья, потому что вчера увидели ее имя на экране и подумали: только бы сейчас ничего не случилось.","Очень интересно.","Человек вам еще ничего не написал, а вы уже виноваты за то, что устали.","И дальше вы час подбираете слова, слушаете голосовые, перечитываете сообщение перед отправкой, потому что человеку сейчас тяжело, хочется поддержать, хочется случайно еще больнее не сделать.","Вы помните, как зовут ее начальника, что муж сказал в прошлый раз, почему она боится увольняться.","Все помните.","Меня в таких историях особенно задевает, как быстро человек начинает стыдить себя.","Мол, я что, помощь по расписанию выдаю, мне теперь за каждый разговор благодарность нужна.","И сидит, уговаривает себя, что все нормально, хотя уже прячет телефон под подушку, когда приходит очередное вечернее сообщение.","Вы ведь даже претензию сформулировать толком не можете.","Она же вам доверяет.","Она же к вам в тяжелый момент идет.","Получается, вы важный человек.","Только рассказать ей, как прошла ваша неделя, все время как-то неудобно.","У нее сейчас такое происходит.","А когда у нее все хорошо, вы снова ждете подходящего случая.","Хотите отправить смешную фотографию, позвать куда-нибудь, рассказать, что вам наконец предложили ту работу.","Открываете переписку.","Видите свое предыдущее сообщение без ответа.","Закрываете."],"before":null},{"id":"r_mama_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Текст на экране: Мамы, которые ненавидят себя после срыва\n\nРечь: Четыре признака мамы, которая после злости на ребенка еще полдня себя наказывает.\n\nПервое, вы лишаете себя отдыха. Ребенок уснул, можно наконец сесть с кофе, но вы вспоминаете, как рявкнули на него перед сном, и идете оттирать стульчик. Потом раковину. Потом достаете из корзины белье. Кофе остывает, через сорок минут ребенок просыпается, и вы встречаете его еще более уставшей.\n\nВторой признак, вы перестаете просить мужа о помощи. Теперь попросить его остаться с ребенком страшно: вдруг скажет, что вы и так целый день дома, еще и орете.\n\nТретье, вы пытаетесь срочно стать идеальной. Вот это меня, блядь, особенно злит: мама уже на пределе, но после срыва требует от себя еще больше.\n\nЧетвертое, вам трудно поверить, что ребенку с вами хорошо. Он приносит книжку, забирается на колени, сует вам под нос любимый разворот. А вы смотрите на него и думаете: господи, как ты вообще ко мне идешь, я же такая хреновая мать.\n\nСколько времени после срыва вы еще проводите вот так, рядом с ребенком, ненавидя себя?","caption":"Меня особенно цепляет это обещание себе: завтра ни разу не раздражаться. Уже с утра приходится следить за каждым своим вздохом.\nЯ Ольга, психолог, работаю с мамами малышей до трех лет.\nПодписывайтесь, если хочется еще таких разговоров: здесь о декрете, материнской злости и отношениях в семье.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"опросить его остаться с ребенком страшно: вдруг скажет, что вы и так целый день д | ьной. Вот это меня, блядь, особенно "}],"cut":["Даже если уже обняла его, извинилась, и он давно играет с машинкой.","Потому что сидеть после такого как будто совсем уж наглость.","Хорошая мать хотя бы навела бы порядок.","А вечером опять едва сдерживаетесь, когда он выплевывает кашу.","Уже собирались сказать, что хотите в воскресенье выйти одна, просто походить без коляски и пакета с запасными штанами.","Но вы сегодня накричали.","Он ведь слышал.","И вы молчите, хотя он пока вообще ничего не сказал.","Потом злитесь, что он спокойно строит планы на выходные.","Он уже договорился с друзьями, а вы даже свою прогулку вслух не назвали.","Теперь надо весь вечер ласковым голосом, обязательно книжку, обязательно развивающую игру, хотя хочется, чтобы никто вас минут двадцать не трогал.","Вы соглашаетесь на пластилин, на четвертую сказку, на еще пять минут в ванной.","А когда ребенок снова требует, вы чувствуете, что сейчас заорете.","И от этого еще страшнее: вы же только что обещали себе больше никогда.","Уже можно вместе смеяться над нарисованным котом, но вы все еще вспоминаете его лицо, когда кричали.","Он снова показывает вам кота.","Вы киваете, а сами продолжаете ругать себя."],"before":null},{"id":"r_mama_1_2","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Текст на экране: Накричала и весь вечер себя ненавижу\n\nРечь: Девочки, кто после резкого «да хватит уже» мысленно собирается сдавать экзамен на право быть матерью? Мои хорошие, вы там себе хоть один пересдавать разрешаете?\n\nРебенок весь вечер висит на вас, вы идете в туалет, он следом, закрываете дверь, он плачет, открываете, пытаетесь застегнуть штаны одной рукой. Потом вы садитесь поесть, и он лезет к вам на колени, задевает тарелку, макароны летят на пол. И вы орете: «Да дай ты мне хоть поесть!»\n\nОн замирает. И вас тут же накрывает: господи, он же маленький. Он просто хотел ко мне. Какая же я ужасная мать.\n\nМеня прямо злит, как быстро мы начинаем добивать себя в этом месте. Блядь, вы еще даже со стула не встали, а уже вынесли себе приговор.\n\nНормальная мать, видимо, могла бы питаться запахом макарон с пола.\n\nЯ сейчас чуть в сторону, но меня особенно цепляет вот это: даже вечером вы можете решить, что отдыхать вам сегодня как-то стыдно. Хотели посмотреть сериал, а вместо этого ищете, чем крик вредит ребенку. Читаете до ночи, пугаетесь еще сильнее, утром встаете совершенно разбитая.\n\nИ чего вы от себя утром ждете? Терпения, конечно. Теперь вы обязаны быть еще терпеливее, ведь вчера провалились.\n\nСколько часов вы уже себя ругаете за те несколько секунд на кухне?","caption":"Иногда мама потом еще и мужу боится сказать, как прошел вечер. Вдруг он тоже посмотрит на нее с ужасом.\nЯ Ольга, психолог, работаю с мамами малышей до трех лет.\nЕсли знакомо, можете написать в комментариях «знакомо».","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не встали, а"},{"rule":"dvoetochiya","quote":"релку, макароны летят на пол. И вы орете: «Да дай ты мне хоть поесть!» | Он замирает. И вас тут же накрывает: господи, о"}],"cut":["Макароны можно даже не поднимать, вы уже заняты.","Вы вспоминаете его лицо, свой голос, как громко получилось это «дай», и вам так стыдно, что собственный голод кажется какой-то наглостью.","Как ты вообще можешь сейчас думать про еду?","Вы боитесь, что теперь он будет вас бояться?","Потому что видели, как он вздрогнул, и теперь этот момент крутится у вас в голове.","Пытаетесь срочно стать ласковее?","Потому что хочется поскорее увидеть, что он снова к вам тянется, что вы еще его мама, к которой можно прийти.","И вот вы сидите на полу рядом с ним, он возит машинку по вашей ноге, уже что-то вам показывает, а вы смотрите на него и продолжаете себя грызть.","Вы даже улыбаетесь ему с усилием, потому что внутри все еще идет разбор: нормальная мать бы сдержалась.","Нормальная мать бы понимала.","Девочки, вы уже весь день носили, кормили, уговаривали, ловили у края дивана, вытирали, снова кормили.","Целая смена, обед на полу, ночное дежурство впереди.","А у вас внутри еще заседает комиссия, которой НЕДОСТАТОЧНО, что вы сами испугались своего крика.","Все."],"before":null},{"id":"r_stud_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: Открою диплом, пойму, что ничего не могу\nРечь: Откладываешь, когда до сдачи диплома уже страшно считать дни, ты садишься за стол, открываешь ноутбук и вдруг решаешь, что сначала надо разобрать загрузки. Там документы с первого курса, какие-то билеты, фотографии расписания. Ты все это раскладываешь по папкам, и вроде даже занята учебой. Файл с дипломом тоже здесь. Ты его видишь. Только открывать пока не будешь, сначала закончишь уборку, чтобы уже спокойно сесть и начать.\n\nОткладываешь, когда представляешь, как откроешь этот файл, перечитаешь написанное и окажется, что ты вообще ничего не понимаешь в своей теме. Что научная руководительница спросит, какую мысль ты здесь хотела доказать, и ты будешь сидеть перед сообщением, печатать ответ, стирать, снова печатать.\n\nИ мне очень горько, что человек может так себя испугать, что даже собственный черновик становится страшно открыть.\n\nЧай уже остыл, в комнате темно, ты сидишь перед ноутбуком и считаешь, сколько дней осталось. С каждым днем страшнее, и ты все сильнее себя ругаешь, и все труднее открыть файл. Откладываешь, потому что боишься написать плохо и решить, что теперь про тебя все понятно.","caption":"Особенно тяжело бывает после вопроса в общем чате: «Кто уже отправил вторую главу?» Можно закрыть переписку и весь вечер представлять, как остальные уже заканчивают.\n\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nОтправь тому, кто сейчас боится открыть свой диплом.","judge":null,"guard":[],"cut":["И придется признаться, что ответить тебе нечего.","Вот этого момента ты боишься еще до того, как он случился.","Ты пока даже текст не перечитала, но разговор уже представила целиком, вплоть до ее разочарованного ответа.","Откладываешь, когда тебе легче сказать себе, что ты опять потратила вечер впустую, чем попробовать написать страницу и увидеть, что получается плохо.","Злиться на себя за потерянное время ты уже умеешь.","У тебя даже слова привычные есть: собралась бы уже, сколько можно, все давно пишут.","А сесть, постараться и все равно запутаться страшнее.","Потому что тут же приходит мысль: ну вот, я старалась, и даже так ничего не вышло.","Значит, я правда не справлюсь.","Откладываешь, когда все еще надеешься, что завтра сядешь за диплом и сразу поймешь, с чего начать.","Будешь писать уверенно, найдешь нужные статьи, свяжешь абзацы, и тебе самой понравится.","Еще много, много, много можно успеть за такой завтрашний день.","Мне хочется задержаться здесь, потому что в этом обещании себе столько надежды.","Сегодня ты снова закрыла ноутбук без единой строчки, зато еще можешь думать, что у тебя все получится, как только ты по-настоящему возьмешься.","Ты ведь пока толком и не начинала.","Откладываешь, когда выбираешь еще один вечер с виной, потому что боишься вечера, в который придется увидеть свой неровный, непонятный тебе самой текст."],"before":null},{"id":"r_stud_1_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: «Открою диплом, когда соберусь»\nПерсонажи: А это я, Б это психолог\nБ: Пока диплом только в голове, его никто не критикует.\nА: Скоро мне начнет сниться, как научная руководительница спрашивает, где текст, а я опять обещаю прислать.\nБ: Что мешает прислать хотя бы кусочек?\nА: Там нечего присылать. Я вчера открыла документ, написала предложение, прочитала, стерла. Потом пошла искать еще одну статью.\nБ: И что тогда скажет руководительница?\nА: Что я делала все это время? Как вообще дошла до диплома? Остальные уже главы отправляют, исправляют замечания, спорят о чем-то. А я даже спросить ничего не могу, сразу станет понятно, насколько я отстала.\nБ: Пока молчишь, она этого не узнает.\nА: Просто каждый раз кажется, что надо еще немного подготовиться.\nБ: Когда поймешь, что уже можно показывать?\nА: Без этого ужасного молчания, когда сидишь перед человеком и понимаешь, что сейчас он во всем разочаруется.\nБ: А если она найдет, что исправить?\nА: Вот этого и боюсь. Она просто пришлет замечания, а я решу, что она наконец поняла, какая я бестолковая. Пока ничего не отправляю, могу еще думать, что у меня получится хороший диплом.\nБ: Да.","caption":"Меня особенно цепляет этот момент: студентка уже стесняется написать руководительнице даже обычное «здравствуйте», потому что столько раз обещала прислать текст.\nИ теперь к документу страшно даже возвращаться.\n\nЯ Юлия, психолог, работаю со студентами.\nПодписывайся, если хочется еще такого: здесь про тревогу, учебу и взросление.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Меня особенно цепляет этот момент: студентка уже стесняется написать руков | Подписывайся, если хочется еще такого: здес"}],"cut":["А когда сдавать?","Я уже просыпаюсь и сразу думаю про диплом.","Ложусь и думаю про диплом.","Вдруг я вообще неправильно понимаю тему и сейчас напишу какую-нибудь ерунду, которую стыдно показывать.","Но я ведь правда собираюсь писать.","У меня статьи по папкам разложены, цитаты выписаны, план есть.","Я даже знаю, с какого раздела начать.","Когда смогу объяснить каждую фразу.","Чтобы она спросила, почему я так решила, и я сразу ответила."],"before":null},{"id":"r_gnezdo_1","author":"Михаил","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","text":"Текст на экране: Тем, у кого дети выросли и уехали\nРечь: Это для тех, у кого дети выросли, уехали, а вы утром открываете глаза и думаете: и зачем мне теперь вставать, кому я вообще нужен?\n\nИ еще себя ругаете? Вроде взрослый человек, пора бы заняться собой, столько лет мечтали спокойно выпить чай. Вот он, чай. Пейте сколько хотите. Только раньше вы его пили и прислушивались, как поворачивается ключ в двери. Теперь допили, помыли чашку, и до вечера никто не придет.\n\nМеня задевает, когда человеку в таком состоянии бодро предлагают наконец пожить для себя. Как будто он сейчас скажет: точно, что же я сразу не догадался, сейчас запишусь куда-нибудь и перестану скучать.\n\nПогодите вы с этим.\n\nИ теперь вы можете прекрасно понимать, что они взрослые, и все равно покупать лишний йогурт. Тот самый, который любили они. В магазине взяли как обычно, дома поставили в холодильник и только тут вспомнили.\n\nТеперь дома тихо, и вы впервые можете почувствовать, насколько устали за все эти годы.\n\nВы очень любите детей. И очень скучаете по ним.\n\nЗа это себя ругать еще и сверху?","caption":"Иногда тяжелее всего возвращаться из магазина: раньше по дороге домой вы знали, кого там застанете. И к этой перемене тоже приходится привыкать.\nЯ Михаил, психолог, работаю с женщинами и мужчинами от 45 до 60 лет.\nЕсли хочется, напишите в комментариях, по какой домашней мелочи вы скучаете.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"и, а вы утром открываете глаза и думаете: и зачем мне теперь вставать, кому я воо | ить для себя. Как будто он сейчас ск"}],"cut":["Дорогие мои родители, которые по телефону бодро говорят, что у них все нормально, а потом еще сидят с телефоном в руке.","Я хочу сейчас к вам обратиться.","Радуетесь за них?","Сами же хотели, чтобы поступили, нашли работу, жили отдельно, выбирали, как им лучше.","Почему тогда вечером так тоскливо, что даже телевизор включаете, лишь бы кто-нибудь говорил?","Потому что вы по ним скучаете.","По совершенно обычной жизни рядом с ними.","Когда можно было спросить что-то из соседней комнаты и получить ответ.","Иногда весьма недовольный, но живой.","Вы годами вставали, потому что нужно было кого-то разбудить, накормить, отвезти, дождаться.","Даже когда дети уже все делали сами, вы знали, что вечером встретитесь на кухне.","Боитесь лишний раз позвонить?","Думаете, начнут отвечать из вежливости, будут смотреть на часы, решат, что вы совсем без них не можете?","Поэтому заранее придумываете повод, хотя на самом деле хочется просто услышать голос.","И потом еще стыдно за то, как сильно хочется.","Вам тяжело привыкать к тому, что теперь вы редко видитесь.","Особенно если много лет вы откладывали свои желания, потому что сначала детям, потом опять детям, потом уж как-нибудь себе.","Сейчас вас спрашивают, чего вы хотите, а вы теряетесь.","Вы давно себе такого вопроса всерьез не задавали.","И послушайте.","Вы столько лет выдерживали болезни, экзамены, подростковое «отстаньте» и поиски второй сменки за минуту до выхода.","Целое родительское министерство работало.","Конечно."],"before":null},{"id":"r_gnezdo_1_2","author":"Михаил","format":"reels_malysh","asked":"reels_auto","intent":"podderzhka","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","text":"Текст на экране: Дети уехали. А мне теперь куда?\nРечь: Мои хорошие, у кого дети выросли и уехали, а вы теперь утром лежите и думаете: вставать для кого? Собрание родителей, которые всех вырастили, открыто. Хотя бы сегодня можно прийти без справки и домашней выпечки.\n\nИ вот ребенок живет отдельно. Сам покупает хлеб. Сам решает, надевать ли шапку. Тут, конечно, еще большой вопрос, но проверять уже неудобно.\n\nПотом все-таки встаете, достаете большую сковородку, потому что всегда жарили завтрак на всех, и стоите с ней посреди кухни. Одному человеку столько не нужно. Убираете обратно.\n\nИ вы еще себя ругаете: другие путешествуют, записываются куда-то, радуются свободе. А я сижу, жду сообщения. Уже написал, что доехал, уже все хорошо, можно выдохнуть. Только хочется, чтобы он еще что-нибудь написал. Хоть про то, что чайник купил.\n\nЯ против того, чтобы человека в этот момент торопили срочно наслаждаться жизнью. Особенно когда он сам уже весь вечер себя за это пилит.\n\nДорогие мои, да вы человека вырастили! Да за одни поделки из природных материалов вам положен отдельный отпуск.\n\nВы хотели, чтобы он вырос. И вы все равно по нему скучаете.","caption":"Иногда тяжелее всего становится после звонка: поговорили хорошо, а потом опять тишина. Если неделями ничего не радует и трудно делать обычные дела, я бы предложил обратиться за помощью к психологу или психиатру.\nЯ Михаил, психолог, работаю с женщинами и мужчинами от 45 до 60 лет.\nОтправьте тому, у кого сейчас опустел дом.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"хали, а вы теперь утром лежите и думаете: вставать для кого? Собрание родителей, | И вы еще себя ругаете: другие путешес"}],"cut":["Вам пусто?","Вы столько лет просыпались и сразу знали, кому что нужно.","Кто проспал, кто забыл ключи, кому надо позвонить, у кого завтра важный день.","Будто каждое утро кто-то нажимал вашу кнопочку: вы нужны, подъем.","А вы проснулись в субботу.","Лежите, прислушиваетесь.","Никто на кухне дверцей не хлопает.","Можно поспать еще, вы столько лет об этом мечтали.","И почему-то хочется плакать.","Вот это меня особенно трогает.","Вы ведь можете совершенно искренне радоваться: устроился, справляется, у него своя жизнь.","А потом убрать эту сковородку и сесть за стол, потому что вдруг очень одиноко.","Стыдно, что грустите?","Кажется, сейчас кто-нибудь скажет: вы что, хотели держать его возле себя до пенсии?","Нет, постойте.","Вы же ему помогали собираться, искали коробки, проверяли, положил ли документы.","Вы хотели, чтобы у него получилось.","Просто к тому, как тихо станет дома, подготовиться оказалось гораздо труднее.","С температурой по ночам сидели, школьные чаты читали, про первую любовь слушали, изображали спокойствие, когда он впервые ушел гулять до позднего вечера.","Вы привыкли любить его каждый день вот так: накормить, встретить, услышать из комнаты, что он дома.","Теперь вы учитесь любить его на расстоянии, и иногда вам очень не хватает самого обычного вечера вместе.","Можно пока тихонечко погрустить.","Без обвинений в эгоизме.","Конечно."],"before":null},{"id":"r_razvod_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"mif","topic":"«ради детей надо сохранить семью»","text":"Текст на экране: Родительское собрание: сохраняем семью ради детей\nРечь: Мамы, здравствуйте, я веду сегодняшнее родительское собрание. Кто собирается разводиться, пока уберите заявления, у нас еще чаепитие.\n\nЯ вообще считаю, мамы, мы слишком много внимания уделяем всяким настроениям. Любите вы друг друга, скучаете, хотите вместе проводить время. У нас в анкете таких граф нет. Мать есть? Есть. Отец есть? Есть. Адрес совпадает? Поздравляю, СЕМЬЯ сохранена. Даже ручку зеленую достану, приятно же поставить галочку за хороших людей.\n\nТак, вы руку тянули. У вас сын перед ужином спрашивает, папа сегодня в хорошем настроении? Какой внимательный мальчик. Другие дети в телефонах сидят, ваш уже по звуку ключей понимает, можно ли попросить помочь с математикой. Пригодится в коллективе.\n\nТолько давайте без этих ваших вздохов, я вам тут, блин, семью сохраняю.\n\nРебенок сидит между вами, жует и старается вилкой лишний раз по тарелке не стукнуть. Зато ужинаете вместе.\n\nНет, папу на собрание я не приглашала. Он работает. Вы тоже работаете? Ну вы же пришли, значит, можете. К тому же кто у вас переживает за семью? Вы. Вот с вами и обсуждаем, как вам еще постараться. Очень удобно, когда ответственный человек уже найден.\n\nЧто, он вчера сказал, что после школы не хочет домой? Ну конечно. Дома же надо следить, кто с кем разговаривает, кому сейчас можно задать вопрос, кого лучше развеселить. Ответственности много. Ничего, втянется.\n\nТак, мамы, собрание заканчиваем. Главное, чтобы вы оставались вместе. Кто будет следить, чтобы дома все друг друга выдерживали?\n\nПравильно. Ребенок. Вы же ради него все это затеяли, черт возьми.","caption":"Меня бесит, как легко матери поручают отвечать еще и за участие отца: сама попроси, сама напомни, сама придумай, как ему сблизиться с ребенком. После развода у него по-прежнему есть ребенок и своя родительская ответственность.\nЯ Ольга, психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nОтправьте той, кому сейчас это нужно услышать.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Родительское собрание: сохраняем семью ради детей | поручают отвечать еще и за участие отца: сама попроси, сама напомни,"}],"cut":["Тема сегодня простая: ради детей семью надо сохранить.","Какую именно, сейчас уточнять долго, у меня кабинет до шести.","Вы с мужем почти год разговариваете только про покупки?","Прекрасно, общий интерес имеется.","Молоко, хлеб, туалетная бумага.","Некоторые пары вообще совместный досуг организовать не могут, а вы регулярно составляете список.","Что значит, ребенок все замечает?","Вы же при нем говорите, что все хорошо?","Ну вот.","Значит, информацию до ребенка довели.","Если он продолжает спрашивать, почему мама спит на кухне, повторите погромче.","А дочь рассказывает про пятерку попозже, потому что вы весь вечер молчите и ей кажется, что сейчас лучше никого не трогать?","Ну вот, умеет выбрать момент.","Вырастет деликатным человеком.","Хорошая новость, она никуда не денется.","Полежит до выходных.","Вместе с рисунком, который она вам принесла показать.","Вы бы видели, сколько я собраний провела.","И каждый раз находится мама, которая спрашивает: а ребенку вообще хорошо в такой семье?","Девочки, ну откуда я знаю.","Мы сегодня проверяем, все ли ночуют дома.","Про хорошо у нас отдельное собрание, дату пока согласовать не удалось.","Давайте на конкретном примере.","Обычный вторник, вы накрыли ужин, картошка уже остыла, муж пришел, сел с телефоном.","Вы спросили, как прошел день, он сказал: нормально.","Все, разговор состоялся.","Чего вы еще ждете?","Чтобы он у вас спросил?","Вы же взрослая, можете сами рассказать.","Ну значит, со стороны уха рассказывайте, господи.","Вот это я понимаю, семейная традиция.","В воскресенье еще фотографию сделайте, только сначала договоритесь, кто кого обнимает, чтобы при ребенке организационные вопросы не решать.","И вот это ваше желание пожить спокойно тоже пока отложите.","Вы же мама, вам надо думать о ребенке.","Он, кстати, уже тоже о вас думает: сам собирает рюкзак, сам ищет чистые носки, вечером заходит проверить, плачете вы или просто устали.","Замечательный помощник растет.","Обязательно похвалите.","Говорите.","Отвернулся?"],"before":null},{"id":"r_razvod_1_2","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«ради детей надо сохранить семью»","text":"Текст на экране: Если уйду, дети меня не простят\nРечь: Читаю сейчас комментарий «ради детей надо сохранить семью» и никак не могу закрыть.\n\nБлядь, как удобно. Вы ОДНА должны сохранить то, в чем вас двое.\n\nВот обычный вечер. Вы зовете всех ужинать, ребенок рассказывает, как его выбрали выступать на школьном празднике. Муж смотрит в телефон. Вы тихо просите его послушать, он раздражается: ну слышу я, чего ты начинаешь. И вы сразу улыбаетесь ребенку, задаете еще вопрос, подкладываете картошку, только бы ужин прошел спокойно.\n\nЯ тоже могу разозлиться на такой совет и захотеть сразу сказать: да сколько можно, уходите уже. И мне приходится себя останавливать. Я ведь понятия не имею, как вы живете, чего хотите, о чем вы с мужем говорили и готов ли он что-то менять. Решать за вас мне тоже очень удобно. Мне потом с этим решением не жить.\n\nЯ против того, чтобы вас заранее назначали виноватой в разводе, если вы больше не можете все это вытягивать.\n\nЕсли ради детей стараетесь только вы, что именно собирается сохранять их отец?","caption":"Иногда женщина уже знает расписание возможных встреч детей с папой, но все еще боится произнести слово «развод» вслух. Слишком многие успели объяснить ей, какой матерью она после этого станет.\nМеня зовут Ольга, я психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nПодписывайтесь, если хочется еще таких разговоров про отношения, развод и жизнь после него.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"о просите его послушать, он раздражается: ну слышу я, чего ты начинаешь. И вы сра | на такой совет и захотеть сразу сказ"}],"cut":["Потому что дальше там все знакомое: вы женщина, будьте мудрее, промолчите, найдите подход, устройте вечер вдвоем, купите красивое белье, только сначала детей уложите, ужин приготовьте и мужа уговорите хотя бы прийти на этот вечер.","Он пока вообще не в курсе, что у него семья на грани развода.","И меня особенно злит вот это «ради детей».","Потому что женщина уже про детей подумала.","И про школу рядом с домом, и про воскресные завтраки, и про то, как дочь будет ждать папу, и что сказать сыну, если он спросит, почему папа теперь живет отдельно.","Она об этом ночью думает, пока все спят.","А утром ей еще раз объясняют, что надо бы подумать о детях.","Потом сын уходит, а вы остаетесь с тарелками и опять перебираете, как надо было попросить.","Может, после ужина.","Может, ласковее.","Может, вообще зря полезли, он устал.","И завтра вы уже заранее говорите ребенку: папе сейчас лучше не мешать.","Хотя сын всего лишь хотел рассказать про праздник.","И вот ради такого ужина вам предлагают постараться еще сильнее.","Вы уже за двоих поддерживаете разговор, помните, что у ребенка важный день, замечаете, когда он замолчал, и еще придумываете объяснение, почему папа сегодня опять занят.","Вы отвечаете за свои слова ребенку, за свои обещания, за то, как обсуждаете с ним перемены.","Муж отвечает за свои.","Чтобы сохранить семью, вам обоим нужно участвовать в том, что дома происходит."],"before":null},{"id":"r_pereezd_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"переехала в другой город и за год ни с кем не подружилась","text":"Текст на экране: Год в новом городе, подруг так и нет\n\nРечь: Четыре признака, что ты уже год живешь в новом городе, а близкого человека рядом так и не появилось, хотя с людьми ты общаешься почти каждый день.\n\nПервое, тебе проще помочь, чем попросить. Но когда сама заболеваешь, заказываешь доставку из аптеки и даже знакомой по соседству ничего не пишешь.\n\nВторое, на выходные у тебя много планов, которые ты снова откладываешь. В субботу ты долго выбираешь, куда сходить, потом уже поздно собираться, потом наступает воскресенье.\n\nТретье, со старыми друзьями ты становишься все бодрее. Они спрашивают, как тебе живется, и ты рассказываешь про район, работу, погоду, новый диван. Про диван можно долго. И вот это меня злит: человек еще ничего тебе не сказал, а ты уже приготовилась объяснять, почему тебе бывает плохо в городе, который ты сама выбрала.\n\nЧетвертое, ты скучаешь по человеку еще до того, как успела с ним подружиться. Хорошо поговорили после работы, вместе дошли до метро, она сказала, что надо как-нибудь повторить.\n\nА тебе кому можно написать: слушай, у меня сегодня такой день?","caption":"Иногда после переезда хочется услышать совсем простое: я рядом, могу зайти. И от вопроса «Ну что, уже освоилась?» почему-то хочется плакать.\nМеня зовут Юлия, я психолог, работаю с людьми, которые переехали и заново устраивают жизнь в свои 25-35.\nЕсли хочется, добавь в комментариях свой пункт.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не сказал, а"},{"rule":"dvoetochiya","quote":"о диван можно долго. И вот это меня злит: человек еще ничего тебе не сказал, а ты | А тебе кому можно написать: слушай, "}],"cut":["Ты можешь подменить коллегу, объяснить новенькой, где что лежит, скинуть всем адрес хорошего врача.","Вы же пока недостаточно близки.","Вдруг она решит, что ты появилась только тогда, когда тебе что-то понадобилось.","И люди знают, какая ты отзывчивая, но никто даже не знает, что ты лежишь дома с температурой.","Выставка, завтрак в красивом месте, поездка за город.","Одной идти уже надоело, звать кого-то страшновато.","Представляешь, как человек читает твое сообщение и думает: мы с ней всего пару раз разговаривали, с чего она вообще решила меня позвать?","В понедельник на работе говоришь, что просто отдыхала.","Хотя ты ведь хотела куда-то выйти.","Очень хотела.","А говорить, что тебе опять не с кем провести вечер, уже неловко, ты ведь сама хотела переехать.","В итоге даже самые близкие уверены, что ты прекрасно устроилась.","И ты весь вечер ждешь сообщения, хотя вы даже ни о чем не договорились.","Сама написать боишься, вдруг для нее это был обычный разговор по дороге домой.","И особенно обидно, когда она потом рассказывает, как весело провела выходные с подругами.","У нее уже есть кому написать просто так, без повода."],"before":null},{"id":"r_pereezd_1_2","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"переехала в другой город и за год ни с кем не подружилась","text":"Текст на экране: За год я так и не подружилась\n\nРечь: Ты сейчас смотришь этот ролик и думаешь, что все после переезда уже нашли себе друзей, кроме тебя?\n\nНу конечно. Даже незнакомые люди из ленты успели найти компанию, устроить совместный отпуск, поссориться, помириться, выложить фотографии с чужого дня рождения. Ты за год нашла хороший хлеб возле дома.\n\nДавай еще грамоту тебе выдадим: «Хуже всех переехала». За хлеб хотя бы похвалим.\n\nМне каждый раз обидно, когда человек вот так с собой разговаривает.\n\nВот ты лежишь вечером на диване, листаешь телефон. В комнате тихо, на кухне остывает чай. Попадается видео: компания сидит за столом, кто-то смеется, кто-то тянется через весь стол за картошкой.\n\nПотом заходишь в профиль. Проверяешь, давно ли девушка переехала. Полгода назад. Прекрасно. Ты тут вдвое дольше.\n\nЛюди просто хорошо проводят вечер, а ты сидишь с телефоном и стыдишь себя за то, что тебе больно на них смотреть.\n\nИ самое грустное для меня вот что. Ты ведь сначала смотрела на этот стол и думала, что тебе тоже хочется так сидеть, смеяться, тянуться за картошкой. Ты могла бы даже вслух сказать: «Я бы тоже пошла».\n\nНо к концу вечера говоришь уже другое: «Кто меня вообще позовет».","caption":"Иногда тяжелее всего в новом городе вечером в пятницу: рабочие чаты затихли, и до понедельника тебе может вообще никто не написать. Меня очень трогает, сколько стыда люди чувствуют, когда признаются, что им хочется компании.\nЯ Юлия, психолог, работаю с теми, кто после переезда привыкает к новой жизни.\nОтправь тому, кто тоже пока осваивается в новом городе.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Давай еще грамоту тебе выдадим: «Хуже всех переехала». За хлеб хотя бы | на кухне остывает чай. Попадается видео: компан"}],"cut":["И теперь сидишь и решаешь, что с тобой явно что-то серьезно не так.","Особенно когда и без этого одиноко, и хочется самого обычного: чтобы кто-нибудь написал в субботу, что собирается гулять, и позвал с собой.","И ты даже видео досматриваешь.","Хотя уже неприятно.","Смотришь еще пару фотографий, находишь знакомое кафе, мимо которого сама проходила вчера.","Значит, они буквально рядом сидят.","В твоем городе.","Возможно, в десяти минутах от твоего дома.","И тут ты начинаешь вспоминать ту коллегу, с которой сходила на кофе, и потом вы обе написали, что надо повторить.","Так и не повторили.","Вспоминаешь девушку с занятий, с которой каждый раз приятно болтаете у гардероба.","Но написать ей просто так ты пока не решаешься.","Вдруг она ответит из вежливости, и ты потом весь вечер будешь перечитывать ее короткое «ага, как-нибудь».","Хотела просто полежать.","Уже успела решить, что ты скучная, навязчивая, слишком закрытая, причем все сразу.","Что другие как-то умеют нравиться людям, а тебя приходится терпеть.","И теперь даже тому, с кем вчера нормально посмеялась, писать неловко.","Ты ведь уже решила за него, что он о тебе думает.","Я сейчас задержусь на этой субботе.","Потому что в ней ты успеваешь и погрустить, и позавидовать, и соскучиться по своим, и потом еще себя за все это отругать.","Даже за зависть."],"before":null},{"id":"r_dengi_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","text":"Текст на экране: Деньги есть, а мне опять страшно\nРечь: Только что увидел совет: если боитесь остаться без денег, накопите побольше. Отложите на случай увольнения, на случай болезни, на ремонт машины, на случай, если уволят, заболеете и машина решит поучаствовать. Желательно в один вторник.\n\nВы нормально зарабатываете, платите по счетам, у вас даже есть накопления. Но вечером все равно открываете приложение банка. Вроде утром уже смотрели. И что там могло измениться? Да ничего.\n\nА потом вспоминаете, что на работе обсуждали сокращение расходов. Никто вам ничего про увольнение не говорил, но мало ли. И вы снова открываете приложение, считаете, на сколько месяцев хватит денег, если завтра останетесь без работы. Сначала с привычными расходами, потом без отпуска, потом уже думаете, можно ли будет продать машину.\n\nУжин перед вами остывает. Жена спрашивает, будете ли вы есть. Вы говорите: сейчас, секунду, мне тут надо кое-что проверить.\n\nИ вот что меня в этом особенно цепляет: вы ведь действительно стараетесь.\n\nНо приложение банка такой гарантии вам не выдаст. Хоть всю ночь обновляйте.\n\nВы сейчас деньги считаете или пытаетесь наконец перестать бояться?","caption":"Иногда мужчина знает остаток на счете до рубля, а сколько можно спокойно потратить на себя, ответить затрудняется. Любая покупка кажется лишней, даже давно запланированная.\nМеня зовут Михаил, я психолог, работаю с мужчинами от тридцати до сорока пяти.\nПодписывайтесь, если хочется еще таких разговоров про тревогу, деньги и ответственность за близких.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Только что увидел совет: если боитесь остаться без денег, накопи | рашивает, будете ли вы есть. Вы говорите: сейчас, сек"}],"cut":["И записываю это, потому что вот это «побольше» меня зацепило.","Слушайте, так можно копить и бояться всю жизнь.","Зарплата пришла, платежи прошли, все примерно так, как вы и рассчитывали.","Вы смотрите на остаток, переводите еще немного на накопительный счет.","И становится спокойнее.","Можно ужинать.","Вы предусмотрительный человек.","Вы помните про платежи, умеете откладывать, держите в голове расходы семьи.","И именно поэтому вам так легко поверить, что еще одна проверка сейчас поможет.","Она и помогает.","На несколько минут.","А дальше вы замечаете новую причину для беспокойства и снова идете проверять счет.","Каждый раз, когда после проверки становится легче, вы привыкаете успокаиваться именно так.","Испугались, посмотрели, выдохнули.","Потом снова испугались.","И постепенно все труднее просто прожить вечер, ни разу не убедившись, что деньги еще на месте.","Я тоже хотел бы иметь возможность один раз все посчитать и больше никогда не переживать о будущем.","Понимаю, почему хочется получить такую гарантию.","Особенно когда от вашего дохода зависит семья и вы привыкли отвечать за всех.","Человеку нужна возможность закончить подсчеты и вернуться к ужину, даже если будущее пока остается неизвестным.","А когда вы проверяете счет при каждом испуге, вы все сильнее привыкаете верить, что без этой проверки опасно.","И тогда даже хорошая зарплата мало что меняет: вы получаете больше, откладываете больше, а проверяете все чаще.","Хорошо."],"before":null},{"id":"r_dengi_1_2","author":"Михаил","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","text":"Текст на экране: «Зарабатываю нормально, а денег все равно мало»\nПерсонажи: А это я, Б это психолог, в очках\nБ: Вы можете сильнее тревожиться, постоянно проверяя счет.\nА: Подождите, я нормально зарабатываю, платежи закрыты, деньги отложены. Но вдруг что случится? Я открываю приложение, смотрю остаток.\nБ: Надолго вам становится спокойнее?\nА: Потом думаю: машина сломается, работу потеряю, родителям понадобится помощь.\nБ: Вы забыли остаток?\nА: Нет, я его помню. Практически до копейки.\nБ: А потом снова хочется убедиться?\nА: Да. Вчера с сыном ужинали, он принес рисунок, положил рядом с тарелкой. Я сказал: сейчас посмотрю. И опять полез в банк, хотя поступлений никаких не ждал.\nБ: Что случится, если сразу не проверить?\nА: У других тоже семьи, кредиты, они же как-то спокойно ужинают.\nБ: Вы уже привыкли успокаиваться этой проверкой.\nА: Получается, я каждый раз лезу в приложение, чтобы отпустило, меня ненадолго отпускает, и я все больше привыкаю: пока счет не проверил, спокойно сидеть за столом не получится?\nБ: Именно.","caption":"Меня задевает, сколько обычных вечеров можно провести с банковским приложением в руке, когда дома вас ждут к столу.\nЯ Михаил, психолог, работаю с мужчинами от тридцати до сорока пяти.\nНапишите «знакомо», если тоже помните остаток, но все равно проверяете.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Потом думаю: машина сломается, работу потеряю, родит | унок, положил рядом с тарелкой. Я сказал: сейчас посмотрю. И опят"}],"cut":["Мне спокойнее становится.","Что тут плохого?","Ну, пока смотрю, спокойно.","Открываю еще раз, прикидываю расходы.","Я же должен понимать, сколько у меня есть.","Но хочется убедиться, что все нормально.","Смотрю на сумму и думаю: пока хватает.","М
