<script>
const DATA=[{"id":"r_mif_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: Я плачу, чтобы мне просто кивали?\nРечь: Меня раздражает, когда про психолога говорят: «Он просто слушает и кивает за ваши деньги».\n\nНо человеку, который еще ни разу не был у психолога, уже успели объяснить: вас там послушают, пожалеют, и за это придется заплатить. Ну и какие вопросы вы начинаете себе задавать? За что я вообще буду платить? Может, мне просто некому пожаловаться? Я что, совсем уже не могу сам со своей жизнью справиться?\n\nИ вот вы еще никуда не пришли, ни с кем не поговорили, но вам уже неловко. Как будто придется признаться, что вы покупаете себе внимание. Меня особенно злит вот это: человек и так долго собирается обратиться за помощью, а ему еще предлагают постыдиться того, что он собирается.\n\nИ еще мне хочется убрать отсюда одну неприятную обязанность, которую люди на себя берут. Вам совершенно незачем приходить и стараться быть таким интересным, глубоким, правильно отвечающим человеком, чтобы психологу было с вами приятно работать. Подбирать достойные обсуждения проблемы, заранее готовить умные выводы, извиняться, что опять говорите об одном и том же. И вот это вот все.\n\nВы отвечаете за то, что готовы рассказать, попробовать, обсудить. Психолог отвечает за свою работу и должен уметь объяснить, что он предлагает и зачем. Вам не нужно выполнять работу за двоих, чтобы потом еще решить, что вы недостаточно старались.","caption":"На первой встрече вполне можно сказать: «Я никогда у психолога не был и пока не понимаю, как тут все устроено». Я бы хотел услышать об этом сразу.\nМеня зовут Михаил, я психолог, работаю со взрослыми, которые впервые обращаются за помощью.\nОтправьте тому, кто давно собирается, но пока сомневается.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"раздражает, когда про психолога говорят: «Он просто слушает и кивает за ваши ден оконтролирует отправку. Все, можно открывать кабинет, диплом выдадим за салат.\n\nНапример, вы рассказываете подруге, что мужчина опять весь вечер говорил о своей работе. Вы тоже хотели рассказать, вас сегодня повысили, вы даже купили пирожные по дороге. Но он устал, у него начальник идиот, потом он включил сериал. И вы решили, что расскажете завтра. Пирожные вместе съели. За повышение так и не выпили.\n\nПодруга говорит: ну скажи ты ему! Ты имеешь право, это вообще-то важный день. И вы согласны. Вы даже знаете, какими словами сказать. Только приходите домой, он спрашивает, что на ужин, и вы идете разогревать суп.\n\nСука, вот это место хочется понять. Как вы каждый раз доходите до того, что ваша хорошая новость может подождать.\n\nЕсли хотите разобраться, почему вы так хорошо умеете рассказывать подругам о своей боли и так боитесь сказать о ней человеку рядом, приходите.","caption":"Иногда подруга уже злится на вашего мужчину, а вы начинаете его защищать. И под конец разговора еще чувствуете себя виноватой, что вообще рассказали.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 22 до 35 лет.\nСохраните, если хотите к этому вернуться.","judge":null,"guard":[],"cut":["Чтобы понять, почему вы все понимаете и продолжаете делать то, от чего вам плохо.","Блин, меня бесит, когда людям обещают, что достаточно один раз хорошо выговориться и дальше вы как-нибудь сами разберетесь.","Особенно если вы уже выговаривались.","И очень хорошо.","До трех ночи.","Вот тут и появляется вопрос: что происходит с вами в ту секунду, когда вы собираетесь заговорить?","Потому что сказать «мне обидно» вы умеете.","Подруге только что сказали.","А рядом с ним уже представляете, как он вздохнет, скажет, что вы опять начинаете, и остаток вечера будет молчать.","И вы заранее соглашаетесь остаться без своего праздника, лишь бы этот вечер прошел спокойно.","Я тоже могу очень захотеть сказать: да поговорите вы с ним уже!","Мне тоже хочется, чтобы человек услышал простую мысль и ему сразу стало легче.","Только вы ведь уже слышали.","У вас в переписке целая группа поддержки, и все за вас, и слова вам подобрали прекрасные.","В терапии мы можем задержаться именно здесь.","Вы еще ничего ему не сказали, а уже готовитесь пережить его недовольство.","И даже со мной можете согласиться, потому что страшно возразить психологу, вдруг я тоже начну вздыхать.","Тогда мы сможем поговорить и об этом, прямо в тот момент, когда вам захочется промолчать."],"before":null},{"id":"r_vopros_1_2","author":"Ольга","format":"reels_malysh","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Зачем психолог, если есть подружка\n\nРечь: Девочки, я против идеи, что с хорошими подругами психолог вам уже точно ни к чему. Вот вы сидите у подруги на кухне, чай остывает, вы рассказываете, как опять побоялись попросить прибавку. Она вас любит, слушает. Казалось бы, чего еще надо?\n\nВы говорите, что начальник опять добавил вам работу, а вы опять согласились. Подруга вздыхает: «Господи, у меня сегодня то же самое». И рассказывает свое. Вы спрашиваете, что ей ответили, вспоминаете ее начальницу, обсуждаете, куда ей отправить резюме. Уже достали телефон, уже ищете знакомую, которая вроде искала сотрудника.\n\nА про свою прибавку вы так и не договорили.\n\nИ вот это меня трогает: женщина пришла рассказать, как ей тяжело, а через полчаса уже помогает кому-то еще. Блядь, даже чай допить не успела.\n\nУ психолога можно тоже начать спрашивать: «А у вас как дела?» Только психолог вернет разговор к вам. У вас есть оплаченное время, в котором вам можно занимать место, долго подбирать слова, повторяться, злиться на начальника и потом вдруг признаться, что вы боитесь услышать: «С вашей работой вообще-то справится кто угодно».\n\nМожет, вы правда умеете дружить. И вам все равно трудно говорить о себе достаточно долго.","caption":"Иногда после хорошей встречи вы знаете все новости подруги, а она так и не узнала, зачем вы просили увидеться. И обе вполне искренне рады друг другу.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nПодписывайтесь, если хочется еще таких разговоров: здесь про отношения, семью и то, о чем трудно сказать вслух.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"а вы опять согласились. Подруга вздыхает: «Господи, у меня сегодня то же самое». | И вот это меня трогает: женщина пришл"}],"cut":["«Ну конечно, сейчас психолог объяснит, почему деньги надо нести ей. С подругой хоть печенье дают».","Да, мои хорошие.","Печенье дают.","И любят вас, и помнят имя вашего бывшего, хотя очень хотели бы забыть.","Я совершенно серьезно: близкий человек может очень помочь.","Можно выговориться, поплакать, услышать, что вы кому-то дороги, и наконец поесть.","Только давайте посмотрим, что еще происходит на этой кухне.","И подруга вполне может быть прекрасной.","Вы сами спросили про ее дела, сами включились, потому что она вам дорога.","Просто у вас обеих есть жизнь, усталость, обиды, и каждой иногда нужно, чтобы ее послушали.","В дружбе вы обе приходите со своим рюкзачком.","И обеим хочется его хоть ненадолго поставить.","Но если вы привыкли очень быстро замечать, что нужно другому человеку, то можете даже обрадоваться, когда разговор перейдет на подругу.","Фух, теперь понятно, что делать.","Помочь, найти, посоветовать.","Про себя говорить гораздо страшнее: вдруг она подумает, что вы сами виноваты, раз столько времени соглашаетесь работать бесплатно.","Психологу можно сказать и то, что вы обычно придерживаете, чтобы подруга за вас не расстроилась.","Ему положено выдерживать собственные чувства, пока вы говорите о своих.","Вам не придется потом утешать его за то, что вы принесли тяжелый разговор.","Если хотите понять, почему вы так быстро уступаете свое время, приходите."],"before":null},{"id":"r_post_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Текст на экране: Он молчит, а ты весь вечер ждешь\n\nРечь: Четыре признака того, что ты уже подстраиваешь свою жизнь под парня, который не пишет первым.\n\nПервое, ты боишься оказаться занятой. Подруга зовет прогуляться, ты отвечаешь, что пока не знаешь, хотя никаких планов у тебя нет. Просто вдруг он предложит встретиться? Только лежишь ты с телефоном в руке, полностью готовая за двадцать минут собраться и куда угодно поехать.\n\nВторое, ты перестаешь рассказывать про себя. Открываешь переписку, смотришь на свое последнее сообщение, закрываешь.\n\nТретье, тебя начинают раздражать люди, которые тебе пишут. Телефон загорается, ты хватаешь его, а там подруга прислала фотографию кота. И господи, ну зачем сейчас этот кот. Мне прямо обидно за эту подругу: она увидела смешное, вспомнила о тебе, захотела поделиться.\n\nЧетвертое, когда он наконец пишет, тебе уже почти нечего ему сказать. И тут приходит его обычное «как день?». Отправляешь «нормально, у тебя?». Все, что ты хотела рассказать, опять оставила при себе.","caption":"Меня особенно цепляет, сколько сил уходит на ответ, который должен выглядеть так, будто ты совсем его не ждала.\nМеня зовут Юлия, я психолог, работаю с девушками, которым тревожно в начале отношений.\nОтправь той, с кем хочется об этом поговорить.","judge":null,"guard":[{"rule":"skrytoe_protivopostavlenie","quote":"не знаешь, хотя никаких планов у тебя нет. Просто"}],"cut":["Даже если вы пока всего пару раз сходили на свидание.","И тогда придется выбирать, отказывать подруге, объясняться.","Проще сразу остаться дома.","Ты даже можешь сказать себе, что устала и хочется спокойно полежать.","Подруга тем временем уже гуляет с кем-то еще.","За день было столько всего, ты закончила сложную работу, тебя похвалили, ты наконец решилась попросить прибавку.","Хочется поделиться.","Но ты уже вчера писала первая, и позавчера тоже, поэтому сегодня держишься.","Хорошая новость так и остается при тебе.","К вечеру ты уже думаешь только о том, почему он молчит.","И как будто ничего хорошего сегодня вообще не случилось.","А ты смахнула уведомление и снова открыла его чат.","Потом отвечаешь ей одним смайликом, хотя обычно вы можете полчаса обсуждать совершенно дурацкую фотографию.","Сегодня тебе вообще трудно быть с теми, кто рядом.","Ты столько раз придумала, как ответишь, как долго подождешь, какой смайлик поставишь, чтобы он не понял, что ты ждала.","Успела обидеться, решить больше никогда ему не писать, потом испугаться, что сама все испортила.","Ты сразу оживаешь, улыбаешься, даже есть захотелось.","Начинаешь печатать и стираешь: слишком длинно, слишком радостно, сразу поймет."],"before":null},{"id":"r_post_1_2","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Текст на экране: Я ему, наверное, уже надоела\nРечь: Ты сейчас смотришь это видео и ждешь, когда сверху появится уведомление от него?\n\nТы хотела спокойно провести вечер. Заказала еду, включила сериал, устроилась поудобнее. Но он весь день не пишет первым, и ты уже несколько раз открывала вашу переписку. Последнее сообщение твое. Вчерашнее.\n\nВидишь смешную картинку, сохраняешь, открываешь чат. И закрываешь. Вчера ты написала первая, сегодня опять ты, он, наверное, уже думает, что у тебя вообще никаких других занятий нет.\n\nИ вот ты сидишь с остывшей едой, сериал идет, герои куда-то переехали, ты пропустила, куда именно, потому что смотрела, когда он был в сети. Был недавно. Тебе ничего не написал.\n\nМеня здесь особенно огорчает, как быстро ты начинаешь ругать себя. Сидишь, подбираешь слова для одного сообщения так, будто он уже попросил оставить его в покое.\n\nНу ты, конечно, быстро себя записала в самые надоедливые девушки. Даже сообщение для этого отправлять не понадобилось.\n\nТебе хочется с ним поговорить.\n\nА он даже не знает, что ты хотела написать.","caption":"Иногда подруга пишет в тот же вечер, и ты отвечаешь ей сразу, без черновика. С ним даже обычное «как дела» успеваешь отредактировать до пустой строки.\nМеня зовут Юлия, я психолог, работаю с девушками, которые начинают отношения.\nПодписывайся, если хочется еще таких разговоров о близости и тревоге рядом с тем, кто нравится.","judge":null,"guard":[],"cut":["Ну вот.","Телефон уже в руке.","Даже брать его специально не придется.","Можно быстро проверить, вдруг написал, пока ты смотрела.","И вернуться сюда.","Обычное, ничего такого.","Вы нормально поговорили, пожелали друг другу спокойной ночи.","А сегодня ты ждешь.","Сначала просто интересно, как у него дела.","Потом хочется что-нибудь отправить.","Хотя он тебе этого не говорил.","Ты сама уже все за него сказала.","Ты ждала, что он тоже захочет узнать, как прошел твой день.","У тебя даже есть что рассказать, ты еще днем подумала, что вечером ему напишешь.","Теперь уже кажется, что история глупая.","И картинка глупая.","И вообще лучше ничего не отправлять.","Еще утром тебе нравилось с ним разговаривать, ты вспоминала вашу встречу, улыбалась.","К вечеру ты уже навязчивая, слишком доступная, слишком заинтересованная.","Еще много, много, много всего про себя придумала.","Предлагаю на этот вечер назвать ваш чат «Я еще ничего не отправила».","Просто чтобы факты были перед глазами.","Потому что ты уже стираешь приветствие.","Убираешь смайлик.","Решила, что вопрос про его день звучит слишком заботливо.","Просто «привет» тоже странно, придется потом объяснять, зачем написала.","Можно отправить ту картинку, но вдруг он решит, что ты ищешь повод.","Ты действительно ищешь повод.","И вот это желание ты весь вечер прячешь, будто он уже несколько раз тебе отказал.","Обидно."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Текст на экране: Маленький сторож боится увольнения\n\nРечь: Мои хорошие, я сейчас сижу с телефоном, только что увидел совет: боитесь, что на работе вас раскусят, просто вспоминайте свои достижения. И меня прямо задело это «просто». Вспомните проекты, выпишите благодарности, перечитайте похвалу начальника, получите грамоту, кубок, пусть директор торжественно внесет вашу фотографию в переговорную.\n\nХочется спросить: а если вы и тогда решите, что фотограф удачно поймал единственный момент, когда у вас было умное лицо?\n\nДавайте я про маленького сторожа расскажу. Представьте, у вас внутри сидит такой сторож и собирает сведения о том, как вы работаете. Очень серьезный.\n\nИ вот вы сегодня показываете отчет. Вчера до вечера проверяли расчеты, нашли расхождение, переделали таблицу, утром еще раз все посмотрели. Начальник говорит: спасибо, теперь понятно, почему мы теряем деньги на этом проекте.\n\nНо сторож уже объясняет: таблицу помогла собрать коллега, данные вообще прислали готовые, начальник сегодня добрый. И потом, что тут сложного? Любой бы справился.\n\nА потом вы замечаете, что на последнем слайде оставили прошлогоднюю дату. И вот тут сторож сразу оживился. Вот! Нашел! Он же говорил, что вы ничего не умеете.\n\nВы сидите перед ноутбуком, ручки уже холодные, коллеги обсуждают следующий проект, а вы пытаетесь вспомнить, кто успел увидеть эту дату.\n\nВот что меня здесь особенно задевает: вы действительно работали, думали, проверяли, и к вечеру сами рассказываете об этом дне так, будто только перепутали дату.\n\nВы нашли, да. Коллега помогала. Вы тоже работали.","caption":"Особенно трудно бывает отвечать на вопрос о своих результатах на собеседовании: вы перечисляете задачи и тут же объясняете, кто вам помогал.\nЯ Михаил, психолог, работаю с теми, кто тревожится из-за работы в офисе и на удаленке.\nПодписывайтесь, если хочется еще таких объяснений: здесь говорю о работе, тревоге и сомнениях в себе.","judge":null,"guard":[{"rule":"kancelyarit","quote":"данные"},{"rule":"rublenye","quote":"Вы нашли, да. Коллега помогала. Вы тоже работали."},{"rule":"dvoetochiya","quote":"ижу с телефоном, только что увидел совет: боитесь, что на работе вас раскусят, пр | Хочется спросить: а если вы и тогда "}],"cut":["Потому что вы умеете себе объяснить, почему каждый ваш успех получился случайно.","Ему страшно пропустить вашу ошибку, потому что тогда большие дяди и тети заметят, что вас вообще зря взяли.","Можно обрадоваться.","Вы даже начинаете.","Похвалу он откладывает.","Начальник точно видел.","Теперь, наверное, жалеет, что поручил вам отчет.","И вечером вам звонит близкий человек, спрашивает, как прошла презентация.","Вы говорите: ужасно, я там ошибку оставили... оставил.","Даже рассказывая, уже путаетесь, потому что снова переживаете тот момент.","Про найденное расхождение вы можете вообще не вспомнить.","Я тоже могу оговориться, что-то объяснить путано и потом досадовать.","Очень понимаю желание поскорее перестать ошибаться вообще.","Но когда сторож принимает только ваши промахи, у него каждый день набираются доказательства, что вас скоро разоблачат.","Даже в день, когда вы хорошо справились.","Поэтому ему придется показывать весь отчет целиком.","Вместе с вашей ошибкой, вашей проверкой и тем расхождением, которое вы нашли.","Сомнительно."],"before":null},{"id":"r_tg_1_2","author":"Михаил","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Текст на экране: «Скоро поймут, что я ничего не умею»\nПерсонажи: А это я, Б это психолог\nБ: Вы можете хорошо работать и бояться, что вас раскусят.\nА: Тогда почему я каждый отчет проверяю до тошноты? Все уже отправили, ушли ужинать, а я сижу, открываю исходную таблицу, сверяю суммы. Потому что руководитель спросит, откуда взялась цифра, и я зависну.\nБ: И что он тогда про вас решит?\nА: И вот сейчас он задаст обычный вопрос, а я даже ответить нормально не смогу.\nБ: Что было с последним отчетом?\nА: Отправил. Руководитель написал, что все хорошо, можно показывать заказчику. Но я же перед этим весь вечер проверял, даже ужин остыл рядом с ноутбуком.\nБ: Чему вы приписали хороший результат?\nА: Ну, тому, что перепроверил.\nБ: И следующий отчет вы проверяете еще дольше?\nА: До следующего задания.\nБ: А хорошо выполненную работу себе засчитываете?\nА: Получается, вообще ни разу. Я же каждый раз говорю себе, что просто вовремя все проверил. Поэтому после удачного отчета я все равно ничего не умею, просто пока никто не заметил. И к следующему снова готовлюсь так, будто меня сейчас поймают.\nБ: Именно.","caption":"Меня особенно цепляет, сколько вечеров человек может потратить, чтобы потом сказать про свою работу: «Ну там любой бы справился». Коллегам достается готовый отчет, домашним обещание скоро освободиться.\nЯ Михаил, психолог, работаю с теми, кто трудится в офисе и на удаленке.\nМожете написать в комментариях свое привычное оправдание успеха.","judge":null,"guard":[],"cut":["Что меня вообще зря взяли.","На собеседовании я удачно поговорил, задания попались знакомые, коллеги потом помогали.","Конечно, там все хорошо.","Я каждую строчку просмотрел.","Если бы отправил сразу, наверняка пропустил бы какую-нибудь глупость.","Другие могут быстро сделать и спокойно закрыть ноутбук.","У меня так почему-то нельзя, мне обязательно нужно еще посидеть.","Да, потому что теперь его еще и заказчику покажут.","Я уже заранее представляю, как кто-нибудь открывает таблицу, замечает ошибку, пересылает руководителю.","Поэтому снова все проверяю, отправляю, выдыхаю."],"before":null},{"id":"r_car_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Текст на экране: Когда подруге тяжело даже отвечать вам\n\nРечь: Четыре реакции подруги с депрессией, из-за которых вы можете решить, что ваша поддержка ей вообще не нужна.\nПервое, она пропадает именно после вашего «пиши в любое время». Вы искренне хотите помочь, она читает и думает: с чем писать?\nВторой признак, от ваших предложений ей хочется плакать. А она сидит с телефоном в руке и прикидывает: надо помыть голову, найти чистую одежду, потом улыбаться, поддерживать разговор. Блядь, вот это особенно тяжело: очень хотеть увидеть подругу и понимать, что даже собраться сейчас трудно.\nТретье, она защищает от вас свои рабочие успехи. На работе кое-как собралась, провела созвон, получила похвалу. Рассказала вам, услышала «ну вот, значит, все уже хорошо» и замолчала. Потому что после созвона она легла и до вечера даже поесть не встала.\nЧетвертое, она может засмеяться рядом с вами, а вечером снова написать, что ей ужасно.\nЕй придется доказывать вам, что ей плохо, даже после того, как вы вместе посмеялись?","caption":"Я бы еще договорилась, можно ли приходить без гостевого режима: без уборки к моему приходу, угощения и извинений за посуду. Иногда человек отменяет встречу, потому что сил принимать гостей совсем нет.\n\nЯ Ольга, психолог, работаю с девушками и женщинами.\nНапишите в комментариях свой пункт: какая поддержка вам помогла.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ренне хотите помочь, она читает и думает: с чем писать? | а сидит с телефоном в руке и прикидывает: надо помыть голову, "}],"cut":["Что опять весь день пролежала, опять ничего не смогла, опять придется слушать, как я жалуюсь?","И откладывает ответ до момента, когда сможет сообщить хоть что-нибудь хорошее.","Вы уже начинаете обижаться, она остается одна.","Мне очень грустно, сколько близости люди так теряют, хотя обе стороны хотят сохранить дружбу.","Иногда ей гораздо легче ответить на ваше обычное «я сегодня вспомнила нашу поездку», потому что тут хотя бы понятно, что сказать.","Кино, прогулка, кафе, вы даже готовы заехать за ней.","Она уже отменила встречу на прошлой неделе.","Теперь еще и боится, что вы перестанете приглашать.","Иногда встреча выглядит как чай на кухне, пока вы обе сидите в домашних штанах.","Теперь про это рассказывать как-то стыдно, вы же уже обрадовались.","Я понимаю желание схватиться за любую хорошую новость.","Только ей может быть по-прежнему нужна помощь с самым простым, даже когда начальник ею доволен.","Вам хочется спросить: как же так, мы ведь прекрасно посидели?","Да, посидели.","Она правда смеялась.","И ей правда снова плохо.","По одному хорошему вечеру трудно понять, как человек себя чувствует в остальные дни.","При депрессии нужна профессиональная помощь, и иногда ваша поддержка заключается в том, чтобы вместе найти специалиста или проводить на прием."],"before":null},{"id":"r_car_1_2","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Текст на экране: Поддержка подруги. Инструктаж по бодрости\n\nРечь: Девочки, добро пожаловать на инструктаж для подруг. Куртки можете оставить, мы быстро. У нас человек третий день сообщения не открывает, придется срочно объяснить ему, как пользоваться телефоном.\n\nНачинаем с переписки. Вы написали, она молчит. Сразу отправляем вопросительные знаки, потом голосовое, потом еще одно, где вы уже обиделись. Я бы еще позвонила по видео. Пусть покажет лицо, мы проверим, достаточно ли убедительно она выглядит.\n\nТеперь представим: вы приехали к ней, стоите в прихожей, пакет с продуктами режет пальцы, она открывает в той же футболке, в которой была позавчера. На кухне чашка с засохшим чаем, хлеб прямо в пакете на столе, мусор приготовлен у двери и так там и остался. Тут главное сразу сказать: господи, я бы в таком сраче тоже загрустила. Отлично зашли.\n\nСадимся пить чай. Она говорит, что даже любимый сериал включать бессмысленно, все равно ничего не радует. Тут у нас готов целый развлекательный отдел: стендап, танцы, прогулка, поездка за город, собака, еще одна собака, ремонт. На каждое предложение она качает головой? Обязательно произнесите: тебе просто НРАВИТСЯ страдать.\n\nИ финальный прием: спрашиваем, чем помочь. Она отвечает, что не знает. Ну тут, блядь, можно спокойно уходить. Техническое задание отсутствует, помощь оказана в полном объеме.\n\nЕсли подруга говорит, что хочет умереть, спросите прямо, собирается ли она причинить себе вред. При непосредственной опасности оставайтесь рядом и вызывайте экстренную помощь.\n\nИ, пожалуйста, суп можно отдать до того, как человек повеселеет.","caption":"Меня особенно цепляет, когда подруга начинает извиняться за то, что с ней теперь скучно. Сидит у себя дома и переживает, что плохо вас развлекает.\nЯ Ольга, психолог, работаю с девушками и женщинами от двадцати до сорока.\nОтправьте тому, кто сейчас переживает за подругу.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Теперь представим: вы приехали к ней, стоите в прихожей, п | там и остался. Тут главное сразу сказать: господи, я бы в т"}],"cut":["Я научу вас поддерживать человека с депрессией так, чтобы к вечеру он уже улыбался, вымыл голову и поблагодарил вас за прекрасную организацию.","Она ведь вполне могла потратить оставшиеся силы на то, чтобы убедить вас, что вы хорошая подруга.","Очень удобно: ей плохо, зато у вас появилась возможность получить подтверждение дружбы.","Она прочитала и опять ничего?","Прекрасно, добавляем: ну хоть смайлик поставить можно?","Смайлик же маленький.","Для него всего лишь надо открыть чат, понять, что ответить, выбрать выражение лица, которого у вас сейчас вообще нет, и приготовиться к следующему вопросу.","Теперь она еще и стесняется, что позвала вас домой.","Конечно, хочется быстренько все исправить.","Я понимаю, вы же продукты купили, время нашли, волнуетесь.","Поэтому пакет пока держим при себе и приступаем к устной части помощи.","Рассказываем, сколько лично нам требуется минут, чтобы помыть одну чашку.","Можно даже засечь.","Устроим соревнование с человеком, которому сегодня пришлось долго собираться, чтобы просто открыть вам дверь.","Победителя я уже определила.","Мы столько вариантов придумали, должна же она хоть один одобрить.","Иначе получается, мы старались и никакой благодарности.","Кстати, насчет благодарности.","Очень полезно перечислить все хорошее, что у нее есть.","Квартира есть?","Работа пока есть?","Подруга с пакетом стоит?","Все, грустить запретили, основания закончились.","Можно добавить рассказ про знакомую, у которой обстоятельства тяжелее.","Пусть ваша подруга теперь еще объясняет, почему ей вообще плохо при таком приличном наборе имущества.","Все, здесь я остановлюсь.","При депрессии человеку бывает трудно ответить, помыться, почувствовать удовольствие, выбрать даже еду.","Он может хотеть вашего присутствия и при этом молчать весь вечер.","Близким тоже бывает страшно и непонятно, как к нему подступиться.","Можно написать: я зайду с супом, оставить у двери или побыть с вами?","Можно помочь записаться к психиатру и предложить поехать вместе.","Что? Пустяки.","Есть. Есть. Стоит."],"before":null},{"id":"r_mif_2","author":"Юлия","format":"reels_rol","asked":"reels_auto","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"Текст на экране: Тренинг «Просто перестань накручивать»\nРечь: Я твой тренер по спокойствию, и сегодня я научу тебя просто переставать накручивать. Так, что у тебя? Начальница вечером написала: «Завтра надо поговорить». И ты теперь думаешь, что тебя уволят? Ну вот зачем ты об этом думаешь? Не думай. Что значит, мысль сама возвращается? Ты ей скажи, что у нас занятие оплачено и мы сейчас заняты спокойствием. Прекрасно. Мне кажется, ты недостаточно хочешь спать. А, ты уже легла? Телефон поставила на зарядку, потом сняла, открыла переписку, посмотрела, была ли она в сети? Все. Нет? Подушку перевернула, воды попила, опять взяла телефон? Ты взрослый человек, у тебя работа, банковское приложение, контейнеры с крышками, ты способна управлять своей жизнью. Давай хотя бы одной мыслью поуправляем. Отмени ее. Кнопка где? Ну я же образно говорю, зачем ты все усложняешь. Только телефон для записи не бери, ты опять полезешь смотреть, прочитала ли начальница твое «Хорошо». Да, я поняла, она прочитала и ничего не ответила. И что? Ты же написала «Хорошо». На «Хорошо» можно ничего не отвечать. Хотя точку ты, конечно, зря поставила, выглядит суховато. Ой, только сейчас не начинай про точку, мы с тобой уже почти успокоились. Просто лежи. Глаза закрой. Расслабь лицо. Ты чего плачешь? Я же тебе помогаю. Давай так: утром напишешь мне, что все обошлось, и я выложу твой отзыв. Если все обошлось, значит, мой метод работает. Если тебя уволят, значит, ты все-таки плохо переставала.","caption":"Меня злит, когда после такого совета человек еще и извиняется за то, что ему страшно.\nТы можешь решить, будешь ли писать начальнице ночью, но заснуть по команде получается далеко не всегда.\nЯ Юлия, психолог, работаю со взрослыми, которым тревога мешает жить.\nЕсли знакомо, напиши в комментариях «перестань».","judge":null,"guard":[{"rule":"skrytoe_protivopostavlenie","quote":"не начинай про точку, мы с тобой уже почти успокоились. Просто"},{"rule":"rublenye","quote":"Просто лежи. Глаза закрой. Расслабь лицо."},{"rule":"dvoetochiya","quote":"что у тебя? Начальница вечером написала: «Завтра надо поговорить». И ты теперь д | го плачешь? Я же тебе помогаю. Давай "}],"cut":["Почему ты раньше сама до этого не додумалась, мы обязательно обсудим, когда ты перестанешь накручивать.","Все, основную часть занятия мы закончили, но я вижу, ты еще держишь телефон, поэтому побуду с тобой.","Я очень ответственная специалистка.","Начальница ничего конкретного не написала?","Значит, у тебя вообще нет повода переживать.","Она ведь могла написать про отпуск, про отчет, про то, где лежит дырокол.","Почему ты сразу выбрала увольнение?","Ну вот.","Сама себе устраиваешь.","Положи телефон экраном вниз.","Теперь ты не видишь сообщение, следовательно, можешь спокойно спать.","Ты его помнишь?","Какая у тебя, оказывается, хорошая память.","Используй ее с пользой, вспомни мой совет.","Просто перестань.","Так, я сейчас буду строгой.","Мне очень нравится, когда человек приходит за помощью и сразу начинает искать причины, почему мой совет ему не подходит.","Я тебе уже сколько раз сказала перестать?","А ты все еще тревожишься.","Получается, ты меня совсем не слушаешь.","Теперь переживаешь еще и потому, что даже успокоиться нормально не можешь?","Вот, кстати, это уже лишнее.","Перестань переживать, что ты переживаешь.","Можешь записать, у меня многие любят такие короткие формулировки.","Что значит, у тебя сердце колотится?","Ты ему объясни, что сейчас ночь, ты в своей кровати, начальницы здесь нет.","Очень простые вещи говорю.","Даже удивительно, что приходится объяснять.","Смотри, сколько мы уже времени потратили.","Ты могла бы давно спать, утром проснуться свежей, спокойно пойти на работу.","Но ты выбрала лежать и думать.","И завтра будешь сонная.","Только давай сразу договоримся: если на встрече начнешь путаться в словах, это потому, что ты себя накрутила.","Начальнице тоже бывает непросто, она просто хотела поговорить, а ты уже целую историю придумала.","Кстати, задай себе вопрос, почему тебе так важно все контролировать.","Хотя нет, вопросы сейчас не задавай, ты опять начнешь думать."],"before":null},{"id":"r_mif_2_2","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"Текст на экране: Я опять сама себя накрутила\n\nРечь: Меня раздражает совет «Просто перестань себя накручивать». Ну правда, если бы ты могла просто взять и выключить тревогу, ты бы уже это сделала.\n\nВот это «ты же сама понимаешь» меня особенно задевает. Да, понимаешь. Ты вообще можешь прекрасно понимать, что близкий человек занят, что у него работа, что он ответит позже. И при этом бояться, что он сердится, что ты ему надоела, что он больше не хочет с тобой общаться. Ты все разумные объяснения уже перебрала. Иногда даже вслух себе их повторила. И все равно тревожно.\n\nКогда тебе тревожно, ты можешь написать близкому двадцать сообщений, потребовать немедленного ответа, обвинить его в равнодушии. За эти действия ты отвечаешь. Другой человек может сказать, что ему тяжело от такого общения, может отказаться постоянно быть на связи. У него есть такое право, даже когда тебе страшно.\n\nЯ против того, чтобы человек извинялся уже за само свое состояние. Можно обсуждать, как ты поступила, что сказала, чем обидела, что теперь нужно исправить.\n\nТы отвечаешь за то, как обходишься с людьми, когда тебе страшно. За само чувство страха ты перед ними не виновата.","caption":"Иногда человек уже молчит о своей тревоге, потому что заранее знает, что ему ответят. И окружающим кажется, что он наконец успокоился.\nМеня зовут Юлия, я психолог, работаю со взрослыми, которым трудно справляться с тревогой.\nОтправь тому, кто устал слышать «просто не накручивай».","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"}],"cut":["Особенно когда его говорят человеку, который и так весь день пытается успокоиться, отвлечься, заняться делами, хоть немного перестать думать о том, что его пугает.","Тебе самой от нее тяжело.","Ты можешь еще сильнее себя напугать бесконечными проверками, можешь раз за разом представлять самый страшный исход.","Такое бывает.","Но человек, который советует тебе просто перестать, почему-то пропускает самое важное: ты уже хочешь перестать.","Очень хочешь.","У тебя с этим как раз никаких вопросов.","И вот ты начинаешь спрашивать себя: почему я опять все усложняю?","Почему другие могут спокойно жить, а я даже тут умудрилась найти повод переживать?","Что со мной вообще такое, если я понимаю, что надо успокоиться, и все равно боюсь?","И мне очень жаль, что к своему страху ты добавляешь еще и обвинения в свой адрес.","Тебе страшно, и ты тут же начинаешь себя ругать за то, что страшно.","Как будто тебе сейчас мало.","Мне совсем не хочется добавлять к этому еще одно требование: давай, соберись, ты ведь взрослая, сколько можно.","Взрослый человек тоже может бояться.","Даже когда ему объяснили, почему бояться вроде бы незачем.","Даже когда он сам согласен с этим объяснением.","И здесь важно договорить одну вещь.","Но требовать от себя вообще никогда не тревожиться, чтобы никому не доставлять неудобств, ты тоже можешь бесконечно.","И каждый раз считать себя виноватой, когда снова испугалась.","Здесь есть о чем говорить."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Мама обидится, если сегодня не позвоню\nРечь: Девочки, кто звонит маме каждый вечер, потому что иначе завтра придется выслушивать, как вы про нее забыли, вы мои ответственные.\n\nУвидела опять совет: ну позвоните маме, вам что, сложно? И я прямо разозлилась.\n\nВот вы пришли домой. Пакет с продуктами поставили у двери, ужин греется, телефон рядом. И вы вспомнили, что маме сегодня еще не звонили. Есть хочется? Хочется. Но сначала мама, потому что после ужина можно уснуть, а утром будет это тихое: ну здравствуй, вспомнила наконец.\n\nИ вы набираете. Мама спрашивает, почему голос такой. Устали? От чего это вы так устали? Вы объясняете, что день тяжелый, и тут же добавляете бодрости, потому что она уже притихла и вы знаете, что сейчас услышите: ладно, я поняла, тебе со мной разговаривать тяжело.\n\nБлять, ужин остыл.\n\nВы уже и поесть не успели, и виноваты, и теперь надо еще поговорить нормально, чтобы мама положила трубку довольная.\n\nИ вот это меня цепляет сильнее всего. Вы ведь даже злитесь тихо, чтобы она не услышала.\n\nСколько вечеров вы уже так провели, девочки? И сколько раз потом говорили себе: да ладно, всего-то позвонила маме.","caption":"Меня особенно цепляет, когда взрослый человек радуется, что у мамы разрядился телефон. Наконец можно провести вечер без объяснительной.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nПодписывайтесь, если хочется еще таких разговоров про маму, себя и чувство вины.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Увидела опять совет: ну позвоните маме, вам что, сложно? И я | на можно уснуть, а утром будет это тихое: ну здравствуй, "}],"cut":["Даже заболеть спокойно у вас получается только после доклада.","Потому что вы уже звоните.","С температурой, с работы, из кровати, когда хочется просто лежать и чтобы никто ничего у вас сегодня больше не спрашивал.","Боитесь пропустить один вечер?","Да, потому что следующий разговор начнется с обиды и вам придется оправдываться.","Заранее придумываете уважительную причину?","Просто захотеть тишины у вас дома почему-то недостаточно, нужна почти справка.","И меня особенно злит вот это: она же скучает.","Да я понимаю, что скучает.","Вы тоже можете скучать.","Вы можете любить маму, хотеть услышать ее голос, а сегодня смотреть на кнопку вызова и думать, господи, только бы она сама сказала, что занята.","Потому что тогда вы сможете спокойно поесть.","Заметьте, как вы ждете ее разрешения закончить разговор.","Сами уже сказали, что устали, что завтра рано вставать, но трубку все равно держите.","Вдруг она сейчас расскажет что-нибудь еще, а вы ее оборвете и весь завтрашний день будете вспоминать, каким голосом она попрощалась.","Ну и как вам совет просто позвонить?","Легче стало?","Вы же и так все это делаете, мои хорошие.","Вы уже ВЗРОСЛЫЕ, сами оплачиваете квартиру, покупаете продукты, возвращаетесь домой после работы, а потом стоите над остывшей тарелкой и подбираете голос, которым маме будет приятно вас услышать.","Потом еще себя ругаете: мама ждет звонка, а я тут раздражаюсь, что со мной вообще такое.","Конечно."],"before":null},{"id":"r_rod_1_2","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Мама обижается, если вы сегодня не позвонили\nРечь: Четыре признака того, что вы живете отдельно, но до сих пор планируете день так, чтобы мама не обиделась из-за звонка.\nПервое, вы заранее оправдываетесь за свою занятость. Рабочая встреча еще не началась, а вы уже отправили маме расписание, предупредили, когда освободитесь, объяснили, почему сегодня позже. И все равно посреди разговора с начальником проверяете телефон под столом. Потому что там может быть мамино «понятно, тебе некогда».\nВторое, рядом с близким человеком вы постоянно смотрите на время. Вы стоите у кафе без куртки, говорите «да, поела», «да, тепло оделась», и ваша тарелка остывает.\nТретье, вы злитесь, когда мама наконец берет трубку. И меня, блядь, бесит, сколько потом люди ругают себя за эту злость. Подробно.\nЧетвертое, вы скрываете от мамы хорошие дни. На вопрос, почему вчера не звонили, хочется сказать, что замотались, устали, рано легли. Говорите только, что устали. И вот вы уже оправдываетесь за то, что вам было хорошо.","caption":"Меня особенно цепляет мамино «я же не мешаю?», когда вы уже вышли из-за стола, чтобы ответить. Обед потом доедаете холодным.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые съехали от родителей, но все еще переживают из-за их обид.\nЕсли хочется, добавьте в комментариях свой пункт.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не началась, а"}],"cut":["После этого вы уже толком не слышите, что вам говорят.","В голове подбираете слова, чтобы она поняла: вы правда работаете, вы ее не бросили.","Сидите вдвоем в кафе, вам принесли еду, он рассказывает что-то смешное, и тут вы видите: обычно в это время вы уже звоните маме.","Все, надо выходить.","Потом возвращаетесь и просите повторить, на чем вы остановились.","Он говорит: «Да уже проехали».","Вы вроде весь вечер провели вместе.","Только кусок вечера опять пропустили.","Сами набирали, сами ждали, а теперь от ее «ну рассказывай» хочется выругаться.","Вы устали, хотели помолчать, у вас даже рассказать сегодня нечего.","Но пропустить нельзя, иначе завтра придется еще полчаса доказывать, что вы любите маму.","Поэтому рассказываете, что купили в магазине.","Потом кладете трубку и уже никому не хотите отвечать, даже подруге, которой сами обещали позвонить.","Вот это легко вообще за собой не заметить.","Хотя вы гуляли, ели пиццу, потом смотрели кино и впервые за неделю вообще забыли про телефон.","Но попробуйте это рассказать, когда уже слышите: «Ну конечно, тебе там весело, про мать и не вспомнила».","И вы убираете из рассказа пиццу, кино, смех."],"before":null},{"id":"r_men_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Все терпите, потом кричите на ребенка?\n\nРечь: Четыре признака отцов, которые привыкли держать себя в руках, а дома срываются на детей.\n\nПервое, вы рассказываете о трудностях, только когда уже справились. На работе сократили отдел, вы остались за троих, жена спрашивает, как день, вы говорите: нормально. А потом сидите на кухне и злитесь, что никто даже не представляет, как вам тяжело.\n\nВторой признак, вы замечаете усталость, когда уже невозможно никого слышать. Но ребенок зовет посмотреть рисунок, и у вас вырывается: сколько можно меня дергать! Он уходит с листком. И вот это меня особенно задевает: человек весь день терпел, а ребенок подошел как раз тогда, когда сил терпеть уже нет.\n\nТретье, вам трудно отдыхать рядом с семьей. Жена смеется, ребенок пересказывает вам шутку, а вы раздраженно просите тишины. Только теперь все сидят тихо и стараются вас лишний раз не трогать.\n\nЧетвертое, детские слезы злят вас сильнее самой неприятности. Но ребенок продолжает плакать, и вы начинаете требовать, чтобы он немедленно успокоился. Чем громче он плачет, тем громче говорите вы.\n\nКогда вам самому хочется плакать, кому дома достается?","caption":"Иногда отец после ссоры приносит ребенку яблоко, поправляет одеяло, спрашивает про уроки. Подойти и сказать «я накричал на тебя, прости» ему гораздо труднее.\nМеня зовут Михаил, я психолог, работаю с мужчинами и отцами от 30 до 45 лет.\nСохраните, если узнали себя и хотите вернуться к этому позже.","judge":null,"guard":[{"rule":"dvoetochiya","quote":", жена спрашивает, как день, вы говорите: нормально. А потом сидите на кухне и зл | т посмотреть рисунок, и у вас вырыва"}],"cut":["Потому что сейчас начнете рассказывать, она встревожится, придется еще и ее успокаивать.","Так вы себе объясняете.","Хотя вы весь вечер старательно показывали, что у вас все в порядке.","И попросить просто посидеть рядом почему-то труднее, чем доделать чужой отчет.","До этого можно отвечать на звонки, ехать за продуктами, обсуждать платежи.","Вы еще даже куртку не сняли, а уже успели его обидеть.","Сели смотреть кино, но в голове крутится, что машину надо записать в сервис, денег в этом месяце потратили много, завтра опять вставать.","Вы ведь специально освободили вечер, хотели побыть вместе.","И вы опять чувствуете себя чужим у себя дома.","Сок можно вытереть.","Коленку обработать.","Позже вам стыдно: ну чего я так завелся из-за ерунды?","И при этом вы сами уже несколько дней ходите с комом в горле, закрываетесь в ванной, умываетесь и выходите с привычным лицом.","Вам ведь тоже надо было как-то пережить этот день.","Но вы себе даже вслух сказать не дали, что вам тяжело."],"before":null},{"id":"r_men_1_2","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Терплю весь день, срываюсь дома\nРечь: Отцы, которые весь день держатся, а вечером орут из-за пролитого сока, ну что, крепкие вы мои.\n\nМеня злит, когда вам снова предлагают просто собраться.\n\nИ вот вы открываете дверь. Ребенок бежит показывать рисунок, вы киваете, снимаете ботинки, он тянет вас за рукав. Вам бы сейчас хоть немного тишины.\n\nА потом он опрокидывает стакан.\n\nСок течет по столу, капает на ваши брюки, и вы кричите так, будто ребенок сделал это специально, лично против вас, после всего вашего сегодняшнего дня.\n\nОн про ваш день ничего не знает. Он вам динозавра нес показать.\n\nВы потом стоите с тряпкой. Сок уже вытерли, брюки можно постирать, а он унес рисунок в комнату. И вам стыдно. Так стыдно, что даже подойти трудно. Проще спросить из коридора, собрал ли он рюкзак.\n\nПотому что окружающие вполне могут считать вас спокойным человеком.\n\nА дома сын уже умеет по тому, как вы положили ключи, понять, можно сегодня подойти с рисунком или лучше сразу уйти к себе.\n\nСколько ему еще учиться угадывать ваше настроение?","caption":"После крика ребенок иногда сам начинает вас успокаивать: «Пап, я больше не буду». И тогда особенно трудно услышать, насколько сильно он испугался.\nМеня зовут Михаил, я психолог, работаю с мужчинами и отцами.\nПодписывайтесь, если хочется еще таких разговоров о мужских переживаниях и отношениях с детьми.","judge":null,"guard":[],"cut":["Даже в машине после тяжелого дня посидеть себе запрещаете.","Дома ждут, надо идти.","Вы уже собрались.","Утром, когда начальник разговаривал с вами так, будто вы школьник.","Днем, когда пришло сообщение про очередной платеж.","Вечером, когда позвонил отец и вы опять сказали, что все нормально, хотя хотелось хоть раз рассказать, как вам тяжело.","Почему промолчали?","Возможно, вы уже знаете, что услышите: у всех проблемы, чего ты хотел, у тебя семья.","Но сказать дома, что вы еле держитесь, тоже как-то неловко.","Вроде взрослый мужик, до вечера дожил, чего жаловаться.","И вот это место меня очень задевает.","Потому что вы можете искренне любить сына, ждать выходных с ним, выбирать ему велосипед и помнить, какой йогурт он ест.","И при этом видеть, как он дергается, когда вы резко встаете из-за стола.","Почему опять про рюкзак?","Потому что про тетради вы умеете говорить.","А как сказать сыну, что папа испугался за работу, устал и сегодня чувствовал себя полным ничтожеством, вы понятия не имеете.","Плакать нельзя, жаловаться стыдно, признаться, что страшно, совсем караул.","На злость у вас хотя бы находятся знакомые слова.","Их вы слышали, их умеете произносить громко.","Мужики, да вы уже столько вытерпели, что вам бы медаль за молчание, с правом пожизненно отвечать «нормально» на любой вопрос.","Я сейчас с горечью говорю.","Вы же при них никогда голоса не повышаете."],"before":null},{"id":"r_vopros_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: «Я даже не знаю, что говорить»\nПерсонажи: А это я перед первой сессией, Б это психолог\nБ: Можно начать прямо с этого: я не знаю, что говорить.\nА: Ужасно же.\nБ: Какую, например?\nА: Ну, что мама позвонила, я не взяла трубку. Потом весь ужин смотрела на телефон, думала, она обиделась. Уже набрала ей сообщение, стерла, опять набрала. Но с таким вообще приходят?\nБ: А ты весь ужин переживала.\nА: Ну да. Взрослая женщина сидит перед тарелкой макарон и боится маме не перезвонить.\nБ: Чтобы я что подумала?\nА: Господи, я еще даже не пришла, уже объясняю, почему имею право про этот звонок рассказать.\nБ: Да. Я бы предложила здесь задержаться.\nА: У меня даже заметка в телефоне есть. Я ее все переписываю.\nБ: Что ты из нее убираешь?\nА: Все, что кажется глупым. Про звонок убрала, кстати. Получается, можно открыть эту заметку и сказать: вот это я хотела рассказать, но испугалась, что ты послушаешь и подумаешь, зачем она вообще ко мне пришла?\nБ: Да.","caption":"Мне хочется, чтобы перед первой встречей тебе не приходилось репетировать даже собственные переживания. Если пока трудно придумать, с чего начать, приходи с этим вопросом.\nЯ Юлия, психолог, помогаю тем, кто собирается на первую встречу.\nПодписывайся, если хочется еще: здесь я рассказываю, как проходит терапия.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Можно начать прямо с этого: я не знаю, что говорить. | тся, можно открыть эту заметку и сказать: вот это я хотела расска"}],"cut":["И дальше что?","Я сяду, ты будешь ждать, я буду смотреть на тебя, ты на меня.","Потом я начну рассказывать какую-нибудь ерунду, просто чтобы мы обе наконец перестали молчать.","Люди же приходят с серьезными проблемами.","Но я же понимаю, как это звучит.","Я пока тебе рассказываю, уже хочу добавить, что вообще у нас хорошие отношения.","Что я нормальная.","Что я понимаю, мама волнуется, у нее свои переживания.","И что я благодарная, просто иногда устаю.","И ты правда будешь про это спрашивать?","Я думала, надо заранее все собрать, вспомнить детство, записать, что меня беспокоит, чтобы тебе было понятно."],"before":null},{"id":"r_vopros_2_2","author":"Юлия","format":"reels_otvet","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: О чем говорить на первой сессии?\nРечь: А о чем вообще говорить на первой сессии? Можно прямо об этом. О том, что ты сидишь передо мной и понятия не имеешь, что сейчас говорить.\n\nИ вот ты вечером открываешь заметки в телефоне, пишешь, стираешь, снова пишешь.\n\nЯ против того, чтобы человек еще до нашей встречи успел себя за это отругать.\n\nДопустим, ты начинаешь рассказывать, как поссорилась с мамой. Хотела сказать коротко, но пришлось объяснить, почему вообще ей позвонила, что она сказала про твою работу, почему ты промолчала. И вдруг ты останавливаешься: «Ой, я, наверное, какую-то ерунду рассказываю. Я столько времени уже говорю».\n\nВот тут я могу спросить: «Ты сейчас переживаешь, что мне скучно тебя слушать?»\n\nИли: «Как ты решила, что рассказываешь ерунду?»\n\nКстати, я могу уточнить, кого ты сейчас имеешь в виду, попросить вернуться к твоим словам, спросить, что ты почувствовала. Я участвую в разговоре.\n\nЕсли у тебя есть вопросы ко мне, их тоже можно задать.\n\nМне хочется услышать тебя, в том числе когда ты путаешься, замолкаешь, вспоминаешь что-то по дороге. Так я и работаю: слушаю, спрашиваю и оставляю тебе возможность меня поправить.","caption":"Иногда перед первой встречей хочется спросить даже о том, где сесть. Я спокойно отношусь к таким вопросам.\nМеня зовут Юлия, я психолог, работаю с теми, кто впервые решается на терапию.\nНапиши в комментариях свой вопрос о первой встрече.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"промолчала. И вдруг ты останавливаешься: «Ой, я, наверное, какую-то ерунду расск | Вот тут я могу спросить: «Ты сейчас п"}],"cut":["Мне немного грустно, когда человек еще только собирается к психологу, а уже переживает, что как следует не подготовился.","Надо выбрать главное, вспомнить детство, объяснить отношения с мамой, ничего не забыть.","Еще и сформулировать, чего хочешь.","Как будто собираешь список покупок и боишься вернуться без самого нужного.","Причем в голову вполне может прийти: ну вот, даже к психологу нормально сходить не могу.","У других наверняка есть понятная проблема, а у меня все вперемешку.","Я спрашиваю, потому что ты только что говорила о том, что тебя задело, а теперь извиняешься передо мной.","Мне важно понять, что случилось между нами прямо сейчас.","Может быть, я долго молчала и ты решила, что я жду чего-то другого.","Может быть, тебе вообще трудно говорить о себе, когда тебя слушают и никто не перебивает.","Я пока этого не знаю.","Поэтому спрашиваю.","И ты вполне можешь ответить, что я ошиблась.","Что тебе просто трудно понять, сколько подробностей мне нужно.","Мне важно услышать и это.","При этом у меня не будет заранее готового объяснения, почему ты поссорилась с мамой.","И я не обещаю, что к концу встречи ты все про себя поймешь и уйдешь спокойной.","Мы можем начать с того, почему ты вообще решила записаться.","А можем с того, как тебе трудно сейчас заговорить."],"before":null},{"id":"r_money_1","author":"Ольга","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"Текст на экране: Хорошей девочке стыдно просить прибавку\nРечь: Стыдно. Хорошая моя, вы работаете за себя, за коллегу, которая заболела, доделываете вечером то, что начальник вспомнил перед самым уходом, и все равно вам стыдно спросить про повышение. Как будто сейчас большие дяди посмотрят на вас и скажут: ой, а мы думали, вы просто хорошая.\n\nСтыдно, и вот вы сидите вечером с ноутбуком на кухне, ужин уже холодный, дописываете презентацию к утру, и начальник присылает: «Спасибо, выручаете!» Вы отвечаете: «Да, конечно», ставите улыбочку, хотя заебались так, что хочется закрыть ноутбук прямо посреди слайда. И все равно где-то внутри надеетесь: ну теперь он точно понял. Теперь увидел. После такой презентации уже сам предложит.\n\nИ вот это ожидание меня злит: вы каждый вечер расплачиваетесь своим временем за надежду, что однажды вам ничего не придется просить.\n\nВы ведь собирались поговорить о зарплате, а уже приготовились узнать о себе что-нибудь ужасное.\n\nСтыдно, и вы снова выбираете еще одну задачу: с ней хотя бы понятно, что делать, куда нажать, кому отправить готовый файл. Можно снова почувствовать себя полезной и еще немного отложить тот разговор, в котором у вас есть собственная просьба.\n\nСтыдно попросить денег, когда привыкли ждать похвалы.","caption":"Начальник может искренне радоваться, что вы справляетесь, и месяцами не поднимать вопрос о зарплате. Особенно если на каждую новую задачу вы отвечаете: «Да, успею».\n\nЯ Ольга, психолог, работаю с женщинами, которые работают в найме.\nСохраните, если перед разговором о зарплате хочется взять еще одну задачу.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"с большие дяди посмотрят на вас и скажут: ой, а мы думали, вы просто хорошая. | резентацию к утру, и начальник присылает"}],"cut":["Стыдно, потому что вы ждете свою звездочку за хорошую работу, и очень хочется, чтобы начальник САМ увидел, сколько вы делаете, позвал к себе и сказал, что вам давно пора платить больше.","И тогда можно будет порадоваться, поблагодарить, даже немножко удивиться.","Все хорошо, вас заметили, вы ничего не выпрашивали.","Стыдно, потому что попросить самой как будто означает испортить всю эту хорошесть.","Вы же помогали, соглашались, оставались, и вдруг выяснится, что у вас тоже есть желания.","Деньги вам нужны.","И вы боитесь, что начальник теперь посмотрит на всю вашу работу и решит: понятно, она все это делала ради прибавки.","Будто вам положено очень любить работу и совершенно бесплатно любить еще кусочек работы сверху.","Стыдно, и мне так жалко вас в этот момент, потому что вы уже устали, вам хочется поесть и лечь, а вы еще уговариваете себя потерпеть до следующей задачи.","Уж следующая точно будет достаточно сложной, срочной, важной, чтобы вам наконец вручили эту звездочку.","Стыдно, потому что, пока вы ждете, можно верить, что вас обязательно оценят, просто начальник занят и пока не успел.","А если спросить, он может отказать.","И вы уже заранее слышите в этом отказе, что зря так старались, что переоценили себя, что сейчас вам объяснят, сколько вы на самом деле стоите.","Конечно, после такого страшно открыть рот."],"before":null},{"id":"r_money_1_2","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"Текст на экране: Мне стыдно просить больше денег\nРечь: Только что увидела совет: если стесняетесь просить повышение, сначала докажите свою ценность. Сижу, перечитываю и бешусь. Вы уже закрываете задачи за двоих, обучаете новенькую, отвечаете вечером, выходите из отпуска с ноутбуком, осталось директору кота к ветеринару отвезти. Потом, видимо, можно будет осторожно спросить про деньги.\n\nБлядь, сколько еще доказывать?\n\nВот вы вечером доделываете презентацию. Подруга присылает голосовое, зовет встретиться, вы отвечаете, что опять никак. Руководитель пишет: «Спасибо, очень выручили». Вы радуетесь, ну приятно же, когда заметили. И думаете: завтра скажу про повышение.\n\nУтром открываете переписку. Он просит срочно поправить еще пару слайдов. Вы пишете «конечно», а подготовленное сообщение про зарплату остается в заметках.\n\nПочему? Вы уже представляете, как он прочитает и подумает: вот ведь, все ей мало. Мы ее ценим, доверяем, а она деньги считает.\n\nИ вы соглашаетесь еще поработать. Чтобы он точно понял, какая вы хорошая. А потом еще чуть-чуть. Сука, вы уже ужин разогреваете второй раз, потому что первый остыл, пока вы вносили правки.\n\nЯ тоже сейчас чуть не сказала: «Да просто спросите уже». Поймала себя. Мне легко возмущаться советом в телефоне, а вам завтра сидеть напротив своего руководителя и ждать его ответа.\n\nВот это и трудно: попросить больше, когда очень хочется, чтобы вами всегда были довольны.","caption":"«Вы же наша палочка-выручалочка» звучит особенно паршиво, когда коллеги уже ушли домой, а вы все еще на работе.\nМеня зовут Ольга, я психолог, работаю с женщинами, которые устают тащить все на работе и дома.\nПодписывайтесь, если хочется еще таких разговоров про работу, отношения и чувство вины.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Только что увидела совет: если стесняетесь просить повышение, сна | ете, что опять никак. Руководитель пишет: «Спасибо, "}],"cut":["Меня бесит, что женщине, которая и так тащит лишнее, предлагают еще поработать, чтобы она наконец почувствовала себя вправе открыть рот.","Потому что часто вы прекрасно знаете, сколько делаете.","У вас список задач на два экрана.","И зарплаты в вакансиях вы видели.","Только представляете разговор с руководителем, и сразу хочется добавить, что вообще вам все нравится и вы никуда не собираетесь.","И вам стыдно заранее.","Даже если он вообще ничего такого вам не говорил.","Вы боитесь испортить отношения с человеком, который привык, что на вас можно рассчитывать.","Вдруг теперь каждую вашу помощь он будет оценивать: ну понятно, она же повышения хочет.","Вдруг пропадет это теплое «что бы мы без вас делали».","Просьбу о деньгах вы переживаете так, будто собираетесь подвести человека.","Будто после всех его благодарностей обязаны продолжать на прежних условиях.","Вам важно остаться для него хорошей, и ради этого вы снова откладываете разговор.","Вам нужно обсудить оплату своей работы и при этом пережить возможность, что собеседник будет недоволен."],"before":null},{"id":"r_body_1","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Тем, кто ругает себя перед отпуском\nРечь: Это тебе, если ты примеряешь купальник перед отпуском и думаешь: с таким животом я вообще куда собралась? Моя хорошая, ты ведь уже почти решила оставить его дома. И платье тоже. В чемодане лежит огромная футболка, в которой жарко, зато можно сесть и перестать каждую секунду втягивать живот.\n\nЯ каждый раз сержусь, когда вижу эти призывы срочно подготовить тело к морю. Ну конечно. Билеты купила, отпуск согласовала, чемодан достала, теперь еще изволь пройти осмотр у самой себя. Повернись боком. Наклонись. Сядь. О, сидя складка появилась, все, поездку отменяем.\n\nИ ведь ты можешь понимать, насколько это жестоко, и все равно продолжать. Подтянуть купальник повыше, отвернуться, снова посмотреть. Может, при другом свете будет лучше? На секунду нравится. Потом замечаешь еще что-нибудь.\n\nПослушай, ты до этого чемодана еще добралась. Доделывала работу, отвечала на сообщения, выясняла, что можно взять в ручную кладь, искала бронь, которую точно куда-то сохранила. ГОСПОДИ, ТЫ ДАЖЕ ОТПУСК ОРГАНИЗОВАЛА. Там отдельный отдел нужен, а ты одна.\n\nМне хочется сказать тебе это без уговоров полюбить каждую складку, без еще одного требования, которое придется выполнять перед вылетом.\n\nТы уже достаточно себя обругала.","caption":"Меня особенно злит реклама похудения рядом с фотографиями пляжа. Как будто вместе с билетом тебе уже выдали замечание к внешности.\nЯ Юлия, психолог, работаю с девушками и женщинами от 20 до 40.\nСохрани, чтобы включить себе перед отпуском.","judge":null,"guard":[{"rule":"rublenye","quote":"Повернись боком. Наклонись. Сядь."}],"cut":["Злишься на себя?","Еще бы.","Ты ведь обещала себе к отпуску выглядеть иначе.","И теперь стоишь перед зеркалом так, будто должна объяснить, почему опять подвела.","Кому объяснить?","Да всем сразу.","Людям на пляже, подругам, женщине из ленты, которая вообще понятия не имеет, что ты сейчас перед ней отчитываешься.","И вот ты уже плачешь из-за собственного отражения, а следом ругаешь себя еще и за слезы.","Взрослая женщина, скоро на море, чего тебе опять надо?","Тебе обидно.","Ты ждала этот отпуск, представляла, как наконец проснешься без будильника, пойдешь за кофе, будешь долго сидеть у воды.","А сейчас представляешь, как зайдешь на пляж и кто-нибудь посмотрит на твой живот.","Будто все люди там только тебя и ждут.","Головой понимаешь, что у них свои дети, полотенца, песок в бутерброде.","И все равно страшно.","Мне так жалко, что даже здесь, среди собранных вещей, ты снова должна у себя что-то заслужить.","Ты столько раз слышала про то, кому какой купальник можно, кому пора прикрыться, кто себя запустил.","Конечно, ты помнишь эти слова, когда раздеваешься.","И боишься услышать их уже в свой адрес.","И теперь тебе очень хочется хотя бы посмотреть на себя спокойно.","Без этого привычного: ну вот, опять ты.","Ты можешь сейчас себе совсем не нравиться.","Мне очень жаль, что тебе сейчас так больно смотреть на себя."],"before":null},{"id":"r_body_1_2","author":"Юлия","format":"reels_malysh","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Зайка собиралась на море и расстроилась\nРечь: Зайка, ты из тех, кто перед отпуском примеряет купальник и сразу хочет отменить море? И купальник, и билеты, и вообще, кто разрешил тебе так выглядеть?\n\nЧемодан открытый лежит, до отпуска несколько дней, ты вроде ждала его, считала, сколько осталось рабочих пятниц. А теперь стоишь перед зеркалом, тянешь ткань на животе, поворачиваешься боком, втягиваешь, отпускаешь. И снова втягиваешь. Уже дышать нормально себе запрещаешь.\n\nЧто, животик с собой едет? Да, маленькая. Он тоже.\n\nА сейчас стыдно? Будто ты обещала всем приехать красивой и подвела?\n\nВот тут мне очень хочется спросить: кому ты обещала? Людям на соседних лежаках? Женщине, которая будет выдавать полотенца? Мужчине, который пройдет мимо с кукурузой?\n\nМеня злит, сколько вокруг советов срочно привести себя в порядок перед отпуском. Читаешь их и начинаешь думать, что в нынешнем виде тебя туда выпускать рано. Еще чуть-чуть потерпи, еще поработай над собой, еще заслужи право спокойно лежать.\n\nЕще и купальник должна была весь год радовать? Ну серьезно.\n\nТы ничего не должна за этот отпуск своим телом.","caption":"Иногда еще до поездки решаешь, что на всех фотографиях будешь только по плечи. Мне грустно, сколько приятных моментов мы заранее себе урезаем.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от двадцати до сорока.\nПодписывайся, если хочется еще таких разговоров: здесь про тревогу, отношения и то, как мы с собой обращаемся.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Вот тут мне очень хочется спросить: кому ты обещала? Людям на соседних лежа | вайся, если хочется еще таких разговоров: "}],"cut":["Иди сюда.","Ох, как же ты себя сейчас ругаешь.","Тебе сейчас даже от этих слов может быть неприятно.","Потому что ты надеялась, что к отпуску будешь выглядеть иначе.","Тогда можно будет спокойно раздеться, пройти к воде, попросить тебя сфотографировать.","И потом смотреть на фотографии без этого немедленного желания все удалить.","Я сейчас улыбаюсь, а тебе перед зеркалом совсем не смешно.","Ты ведь правда боишься, что посмотрят и подумают: ну и зачем она такое надела.","Что подруга получится хорошо, а ты потом весь вечер будешь увеличивать свой живот на общем снимке.","Ты как будто берешь лупу и рассматриваешь только то, за что себя можно отругать.","Здесь складочка, здесь след от резинки, здесь кожа какая-то обычная, человеческая.","И все, уже забыла, что вообще хотела увидеть море.","Ты и так много терпела.","Работала, когда хотелось спать, отвечала на сообщения, когда уже ни с кем не хотелось разговаривать, переносила отдых, потому что сначала надо закончить дела.","А теперь еще перед зеркалом устроила себе проверку.","Дорогая, ты до этого отпуска целую рабочую жизнь дотащила.","С переписками, совещаниями, пакетами из магазина и вечным вопросом, что сегодня есть.","И мне жаль, что сейчас ты злишься на себя за то, как выглядишь, и тут же ругаешь себя за эту злость.","Ты ведь понимаешь, что хотелось бы любить себя.","И даже здесь находишь повод поставить себе плохую оценку.","Тебе сейчас больно смотреть на себя.","Я верю."],"before":null},{"id":"r_teen_1","author":"Михаил","format":"reels_auto","asked":"reels_auto","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"","caption":"","judge":null,"guard":[],"error":"The operation was aborted due to timeout","cut":[],"before":null},{"id":"r_teen_1_2","author":"Михаил","format":"reels_rol","asked":"reels_auto","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Текст на экране: Вебинар: разговорить подростка за вечер\nРечь: Добрый вечер, родители, начинаем вебинар «Как разговорить подростка за один вечер». Подросток закрылся в комнате, вы стоите в коридоре и думаете: вчера еще вместе смеялись над видео, сегодня из него слова не вытащишь. Поэтому главное сейчас обеспечить ему столько родительского внимания, чтобы спрятаться от него было физически невозможно.\n\nНачнем с простого. Вы постучали, он ответил: потом. Отлично, человек владеет речью, можем продолжать. Спросите, когда именно потом. Через минуту? После ужина? Во сколько записать ваше потом? Пусть сразу почувствует, что дома его готовы выслушать по предварительному согласованию с точностью до секунды.\n\nОн говорит, что устал? Напомните, во сколько вы сегодня встали. У вас работа, магазин, пакет порвался возле подъезда, огурцы собирали всем двором, и при этом силы на разговор с собственным ребенком нашлись.\n\nВот представьте: ужин готов, вы накрыли, его тарелка стоит на столе, вы уже второй раз греете котлету и злитесь, потому что тоже хотели спокойно поесть. Тут очень важно войти и сообщить: я вообще-то совершенно спокойно спрашиваю! Желательно погромче, чтобы он сквозь наушники точно услышал ваше спокойствие.\n\nОн начал отвечать резко? Прекрасно, разговор пошел. Немедленно обсудите тон. Сейчас разберемся с интонацией слова «потом». Я считаю, без правильной интонации вообще бессмысленно рассказывать родителям о своих неприятностях.\n\nПоздравляю, контакт установлен. Теперь он знает: если дома заметят, что ему плохо, вечер будет очень долгим.","caption":"Меня тревожит, когда родители уже стоят по разные стороны двери и каждый ждет от другого чего-то пугающего: один ждет беды, другой очередного допроса. Иногда подростку проще выйти на кухню, если там можно сначала молча съесть бутерброд.\nЯ Михаил, психолог, помогаю родителям подростков от 12 до 17 лет.\nНапишите «потом», если узнаете ваши разговоры через дверь.","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"},{"rule":"dvoetochiya","quote":"Вебинар: разговорить подростка за вечер | комнате, вы стоите в коридоре и думаете: вчера еще вместе смеялись над видео, "}],"cut":["Конечно, хочется понять, что случилось.","Очень полезно перед беседой выяснить, кому тяжелее.","Подростки обожают сначала проиграть соревнование по усталости, а потом рассказать, что у них на душе.","Так, он попросил оставить его одного.","Смотрите, тут многие родители уходят.","И теряют прекрасную возможность выяснить отношения прямо через дверь.","Дверь, кстати, удобная: можно прислониться, пока рассказываете, сколько всего вы для него делаете.","Можно даже сесть на табуретку.","У нас длинный вечер, устраивайтесь.","Да, я вижу ваш вопрос: вдруг у него правда был тяжелый день?","Тем более надо выяснять сейчас.","Если он сначала отдохнет, поест, придет в себя, вы упустите самое интересное.","Нам нужен разговор, пока у одного уже дрожит голос, а второй третий раз говорит: пожалуйста, выйди.","Кстати, про наушники.","Их обязательно снимите сами.","Так вы покажете, что готовы помочь ему справиться со всем, с чем он пока справляется без вашего участия.","Сидел, слушал музыку, пытался успокоиться?","Теперь у него появилась понятная семейная задача: объяснить, почему он недоволен вашей помощью.","Что произошло в школе, кто перестал с ним общаться, почему он пришел и сразу лег лицом к стене, это все подождет.","И обязательно добавьте: я же вижу, с тобой что-то происходит.","Это правда, вы видите, вы волнуетесь, вы уже придумали самое страшное.","Поэтому перечислите ему все ваши версии.","Двойку получил?","С телефоном что-то?","Только без пауз, а то он успеет подумать, что можно ответить, когда сам подберет слова.","Он молчит?","Скажите, что вам можно доверять, и сразу напишите в семейный чат: наш опять закрылся, никто ничего не знает?","Бабушка пришлет голосовое, папа позвонит, тетя вспомнит, каким общительным он был маленьким.","И вот это вот все.","К концу вечера он обязательно выйдет.","Хотя бы попросить, чтобы вы перестали обсуждать его с родственниками.","Поссорился? Влюбился?","Хорошо."],"before":null},{"id":"r_vybor_1","author":"Ольга","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: «Почему мне опять нужен именно он?»\nПерсонажи: А это я, Б это психолог\nБ: Иногда вы пытаетесь добиться выбора человека, которому вы уже отказали бы.\nА: В смысле отказала бы? Я вообще-то жду, когда он напишет.\nБ: А вы как живете, пока ждете?\nА: Ну вот подруга звала поужинать, я сказала, что пока не знаю. Потому что он обмолвился, что, возможно, освободится. Я даже голову заранее помыла. Вечером он выложил фотку из бара, и я осталась дома. С чистой головой, охуенно.\nБ: И чего захотелось после этой фотографии?\nА: Написать ему.\nБ: Что должно случиться на этой встрече?\nА: А от него жду хоть какого-нибудь вопроса про себя.\nБ: И если он наконец спросит?\nА: Хочется переиграть тот вечер, быть такой, от которой он телефон из рук не выпускает.\nБ: Чтобы что про себя почувствовать?\nА: Что со мной все нормально. Получается, я уже злюсь на него, мне даже рассказать ему особо нечего, я заранее знаю, что он пропустит мимо ушей. Но все равно хочу, чтобы именно он меня выбрал. Тогда вроде можно перестать себя переделывать?\nБ: Да.","caption":"Меня бесит совет «просто займитесь собой»: можно сидеть на любимой тренировке и проверять, посмотрел ли он сторис.\nЯ Ольга, психолог, работаю с девушками и женщинами, которым знакомы такие отношения.\nЕсли узнали себя, напишите «знакомо».","judge":null,"guard":[],"cut":["Он мне нравится, у нас бывает очень хорошо.","Просто он занят, устает, ему сложно планировать.","Я же понимаю, что человек имеет право на свою жизнь.","Только как-нибудь легко, без претензий, чтобы он понял, что со мной можно нормально общаться.","Хотя я уже набрала подруге сообщение, какой он козел.","Потом стерла, вдруг завтра встретимся, и придется опять его защищать.","Хочу, чтобы он сам предложил увидеться еще.","Чтобы спросил, как я добралась, запомнил, что я рассказываю.","Другие мужчины так делают, я даже удивляюсь, чего они столько пишут.","Я выдохну.","Значит, я ему все-таки интересна.","А то я уже думаю, что сама все испортила, слишком быстро ответила, слишком много рассказала."],"before":null},{"id":"r_vybor_1_2","author":"Ольга","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Почему вы опять ждете у телефона\n\nРечь: Ждете, милая, что он напишет, и телефон кладете рядышком, и звук проверяете, хотя прекрасно знаете, что звук включен.\n\nЖдете, и ведь у вас своя жизнь, работа, подруга зовет поужинать, вы даже платье приготовили, но он утром написал, что, возможно, вечером получится встретиться. И вы подруге отвечаете, что пока непонятно, хотя еще вчера все было понятно. Вы хотели с ней увидеться.\n\nЖдете, и мне так обидно за этот ваш вечер, потому что вы уже помыли голову, уже поглядываете на время, уже проголодались, и ужин откладываете: вдруг вместе поедите. А он появляется ближе к ночи и пишет, что замотался. И следом присылает: «Соскучился». Все. Вы улыбаетесь.\n\nЖдете, и постепенно у вас появляется очень важное дело: понравиться ему настолько, чтобы он наконец захотел быть с вами. И вы уже подбираете сообщение повеселее, убираете вопрос про встречу, чтобы не давить, перечитываете свои слова. Блядь, как же много работы у человека, который просто хотел сходить на свидание.\n\nЖдете, когда он выберет вас, чтобы перестать искать, что с вами не так.","caption":"Меня особенно цепляет это «возможно, увидимся». Один человек еще ничего не решил, а другая уже отменила свои планы.\nЯ Ольга, психолог, работаю с девушками и женщинами, которым знакомы такие отношения.\nОтправьте той, которая опять оставила вечер свободным.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не решил, а"},{"rule":"dvoetochiya","quote":", уже проголодались, и ужин откладываете: вдруг вместе поедите. А он появляется б | пишет, что замотался. И следом присы"}],"cut":["Как будто внутри вас маленькая девочка придвинула стульчик к двери и сидит: вдруг сейчас откроется.","Устала уже, кушать хочет, но вдруг именно сейчас.","Ждете, потому что после целого дня тишины от этого «соскучился» прямо хорошо становится, можно выдохнуть, он помнит, вы ему нужны.","И тут легко решить, что вас так сильно тянет к человеку.","Особенно если вы уже успели испугаться, что он больше вообще никогда вам не напишет.","Ждете, и каждый такой маленький привет начинаете замечать гораздо сильнее, чем все вечера, когда сидели одна.","Он вспомнил, как вы пьете кофе, спросил, доехали ли вы домой, назвал ласково.","Вы потом подруге именно это и рассказываете.","А про отмененную встречу думаете: ну правда же мог устать.","Ждете, и иногда самое болезненное тут признать, как сильно вам хочется однажды рассказать подруге: представляешь, он сам приехал, сам все предложил, сам захотел остаться.","Чтобы можно было наконец успокоиться и больше не гадать, достаточно ли вы ему нравитесь.","Вы уже столько раз представляли этот разговор, что с другим человеком придется отказаться еще и от него.","Ждете, и оттого так трудно перестать: тогда придется допустить, что он может остаться таким же, сколько бы вы ни старались.","Что вы можете очень ему нравиться, и он все равно будет появляться, когда удобно ему.","А вы все еще будете освобождать вечер."],"before":null},{"id":"r_zlost_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"Текст на экране: Я вообще никогда не злюсь\nРечь: А что, если иногда быть злой нормально?\n\n«Злая» женщина говорит, что устала и сегодня заказывать еду будут все вместе, потому что она тоже только пришла с работы, тоже голодная, и ей тоже хочется сесть, а ей отвечают: «Что ты сразу начинаешь? Мы же просто спросили, что у нас на ужин». И ты уже открываешь холодильник. Хотя ты даже пальто снять не успела. Вот это меня очень задевает: тебя уже поторопили с ужином, а ты еще чувствуешь себя виноватой за то, каким голосом ответила.\n\n«Злая» женщина после ужина просит всех убрать за собой тарелки, потому что она хочет посидеть с остальными, пока они пьют чай, а ей отвечают: «Ну зачем портить вечер из-за такой ерунды?» И вот ты стоишь у раковины, вода шумит, из комнаты доносится смех, и ты моешь, моешь, моешь. Ты ведь добрая. Ты же у нас никогда не злишься. А тебе в этот момент хочется оставить эту кастрюлю, зайти в комнату и спросить, почему вы все отдыхаете, а я до сих пор обслуживаю наш общий вечер.\n\nТы можешь сердиться на людей, которых любишь.","caption":"Бывает, на следующий день ты извиняешься за свой тон. И все еще ждешь, что кто-нибудь вспомнит, о чем ты тогда просила.\n\nЯ Юлия, психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nЕсли знакомо, напиши в комментариях «злюсь».","judge":null,"guard":[{"rule":"dvoetochiya","quote":", и ей тоже хочется сесть, а ей отвечают: «Что ты сразу начинаешь? Мы же просто с | ь не успела. Вот это меня очень заде"}],"cut":["Особенно когда ты говоришь: «Я вообще никогда не злюсь», а потом после семейного ужина лежишь без сна и вспоминаешь, как опять промолчала.","Потому что теперь еще надо показать, что ты рада гостям, что тебе совсем нетрудно, что никто тебя ничем не обидел.","«Злая» женщина просит за столом больше не обсуждать, сколько она ест и как на ней сидят джинсы, потому что ей хочется спокойно доесть свой ужин, а ей говорят: «Тебе уже ничего сказать нельзя, сразу обижаешься».","И все смотрят на тебя.","Вилка у тебя в руке, кусок так и лежит на тарелке, и почему-то именно ты сейчас должна улыбнуться, чтобы остальные могли спокойно продолжить вечер.","Ну пошутили же.","И ты улыбаешься.","А потом еще долго выбираешь, в чем прийти в следующий раз, чтобы снова не обсуждали твой живот.","Мне грустно, когда женщина столько сил тратит на то, чтобы близкие случайно не заметили, как сильно ее задели.","Но ты уже представляешь, как замолчат, как переглянутся, как потом скажут, что с тобой стало тяжело общаться.","И остаешься на кухне.","Я слушаю это «никогда не злюсь» и думаю, сколько раз ты уже сердилась и каждый раз молчала, чтобы тебя продолжали считать хорошей.","Сколько вечеров ты провела отдельно от всех, пока остальные были уверены, что ты прекрасно проводишь время."],"before":null},{"id":"r_zlost_1_2","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"Текст на экране: Тем, кто запрещает себе злиться\nРечь: Если ты говоришь «я вообще никогда не злюсь» и очень стараешься никого не обидеть, меня для тебя особенно раздражает совет: «Будь добрее, на близких злиться нельзя». Почему нельзя? Близкий человек может перебить, обмануть, пообещать и забыть. Ты можешь на него злиться и продолжать его любить.\n\nЕще говорят: «Ты же взрослая, могла бы спокойно реагировать». И мне хочется спросить того, кто это произносит: спокойно реагировать на что именно? На грубость? На то, что тебя снова поставили перед фактом? Потому что у нас как будто достаточно заметить, что женщина рассердилась, и все, можно обсуждать только ее тон. Что
