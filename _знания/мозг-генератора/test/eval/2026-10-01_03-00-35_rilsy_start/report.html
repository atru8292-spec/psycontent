<script>
const DATA=[{"id":"r_mif_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: Друг выслушает меня бесплатно\nРечь: «Я и другу могу все это рассказать бесплатно».\n\nМожете, конечно. Но представление, что психологу достаточно посидеть и покивать, сильно мешает понять, зачем вообще к нему идти.\n\nВот начальник попросил поправить отчет. Вы уже думаете: «Он понял, что я ничего не умею. Скоро уволит». Друг скажет: «Да ты что, ты отличный специалист!» Приятно. До следующей правки.\n\nПсихолог спросит: «Что именно начальник сказал про увольнение?» И тут выясняется: про увольнение ничего. Вы сами решили, что правка означает конец карьеры, и уже второй день переживаете.\n\nЗа ошибки в отчете вы отвечаете. Но почему вы решили, что одна правка доказывает вашу непригодность?","caption":"На встрече можно остановиться даже на слове «точно»: «Меня точно уволят».\nМеня зовут Михаил, я психолог, работаю с теми, кто впервые приходит на консультацию.\nОтправьте тому, кто пока не понимает, зачем идти к психологу.","judge":{"zhivo":3,"zacep":4,"ponyatno":5,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Но представление, что психологу достаточно посидеть и покивать, сильно мешает понять","Отправьте тому, кто пока не понимает, зачем идти к психологу."],"worst":"Но представление, что психологу достаточно посидеть и покивать, сильно мешает понять, зачем вообще к нему идти. — Длинное объяснение очевидного тормозит ролик перед хорошим примером.","best":"Приятно. До следующей правки.","verdict":"popravit","why":"Ситуация с отчетом узнаваемая, разницу между утешением друга и вопросами психолога видно. Но ролик заканчивается там, где хочется узнать, что делать с этой мыслью дальше: пока показан хороший вопрос, а не убедительная причина платить за консультацию."},"guard":[{"rule":"dvoetochiya","quote":"попросил поправить отчет. Вы уже думаете: «Он понял, что я ничего не умею. Скоро | уволит». Друг скажет: «Да ты что, ты "}],"cut":["И разобраться, откуда взялась эта уверенность."],"before":null},{"id":"r_post_1","author":"Юлия","format":"post","asked":"post","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Ты открываешь переписку с ним, хотя уведомления так и не было.\n\nПосмотрела, закрыла. Через пять минут опять открыла. Ну что такого, просто проверяешь телефон. Только фильм уже идет полчаса, а ты даже не поняла, кто там с кем поссорился.\n\nНаписать самой? Да легко. Но тут же мысль: «Я вчера первая написала. Посмотрим, вспомнит ли он сегодня».\n\nИ вот ты уже ждешь подтверждения, что ему тоже хочется с тобой поговорить. Чтобы он сам потянулся к телефону. Без твоего «привет, как день?».\n\nПриходит уведомление, ты хватаешь телефон. Подруга. Отвечаешь ей и снова смотришь, не появился ли он в сети.\n\nПотом начинаешь его оправдывать: занят, устал, уснул. Через минуту злишься: на телефон у него время есть. А следом ругаешь себя: «Мы всего две недели общаемся. Чего я вообще так прицепилась?»\n\nНапишет, можно выдохнуть. Промолчит, и ты уже перебираешь, что сказала лишнего на последней встрече.\n\nНо свое желание уже можно назвать прямо: «Я тоже хочу, чтобы меня искали».","caption":"","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":3,"interesno":3,"snyat":null,"ai_markers":["Но свое желание уже можно назвать прямо: «Я тоже хочу, чтобы меня искали»."],"worst":"Но свое желание уже можно назвать прямо: «Я тоже хочу, чтобы меня искали». — Искусственный итог: «чтобы меня искали» звучит скорее про пропавшего человека, чем про инициативу в отношениях.","best":"«Я вчера первая написала. Посмотрим, вспомнит ли он сегодня».","verdict":"popravit","why":"Проверки телефона, пропущенный фильм и раздражение на уведомление от подруги узнаются сразу. Но текст остается описанием знакомого вечера: хочется точнее раскрыть, как его молчание превращается в поиск собственной ошибки, вместо общего вывода в конце."},"guard":[{"rule":"dvoetochiya","quote":"аписать самой? Да легко. Но тут же мысль: «Я вчера первая написала. Посмотрим, вс | Потом начинаешь его оправдывать: зан"}],"cut":["Так его сообщение становится проверкой: нужна ли ты ему, когда сама о себе не напоминаешь.","По одному вечеру ты еще не узнаешь, насколько ты ему важна."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"«Сейчас поймут, что я ничего не умею»\n\nВы пятый раз перечитываете письмо коллеге, хотя там всего три предложения и обычный рабочий вопрос.\n\nНу что такого, лишний раз проверить. Только вы уже ищете в письме все, к чему можно придраться. «А вдруг вопрос глупый? А вдруг я должен это знать?»\n\nВы тратите уйму сил, чтобы никто не заметил предполагаемую некомпетентность. А когда все проходит хорошо, объясняете себе: «Ну, я же все перепроверил. Без этого точно опозорился бы».\n\nВы приписываете весь успех дополнительным проверкам.\n\nПодготовили отчет, получили «спасибо, все понятно». Казалось бы, можно выдохнуть. Но в голове уже готово: «Они просто не знают, сколько я с ним возился».\n\nИ что? Время, которое вы потратили на задачу, разве отменяет то, что вы с ней справились?\n\nС каждым следующим заданием проверок становится больше. Вы устаете, делаете медленнее и получаете еще один повод себя ругать: «Нормальный специалист давно бы закончил». Даже похвала не убеждает. Она относится к работе, которую вы сами уже обесценили.\n\nРаботу, за которую вас похвалили, сделали вы.","caption":"","judge":{"zhivo":3,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":["Вы тратите уйму сил, чтобы никто не заметил предполагаемую некомпетентность.","Вы приписываете весь успех дополнительным проверкам.","Работу, за которую вас похвалили, сделали вы."],"worst":"«Вы приписываете весь успех дополнительным проверкам.» — повторяет предыдущий абзац сухим языком психологического разбора.","best":"«Они просто не знают, сколько я с ним возился».","verdict":"publikovat","why":"Узнаваемые рабочие ситуации и полезное объяснение: перепроверки становятся оправданием успеха, поэтому даже похвала не успокаивает. Есть сухие связки и назидательный финал, но они не мешают дочитать и переслать коллеге."},"guard":[{"rule":"dvoetochiya","quote":"гда все проходит хорошо, объясняете себе: «Ну, я же все перепроверил. Без этого т | можно выдохнуть. Но в голове уже гот"}],"cut":["Здесь есть ловушка, на которую я бы обратил внимание.","Так даже удачно сделанная работа не помогает поверить в свои умения.","Если узнаете себя, в оценке своей работы учитывайте и результат, без привычной скидки за подготовку."],"before":null},{"id":"r_car_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Слайд 1: Подруга молчит на ваше «Как помочь?»\n\nСлайд 2: Вы спрашиваете подругу с депрессией: «Что тебе привезти?» Она читает сообщение и ничего не выбирает.\n\nОбычный вопрос про продукты. Но ей сейчас нужно вспомнить, что есть дома, придумать, что съесть, и решить, сколько вашей помощи можно попросить.\n\nСлайд 3: Вы хотите облегчить ей жизнь. А ей приходится организовывать собственную помощь: придумать задачу, объяснить ее вам, договориться о времени.\n\nВ голове вполне может звучать: «Бл*ть, я даже на этот вопрос ответить не могу».\n\nСлайд 4: «Я не знаю» в ответ на предложение помощи легко принять за «мне ничего не нужно».\n\nПри депрессии бывает трудно выбрать даже между супом и бутербродом. Подруга может быть голодной и все равно сидеть перед открытым холодильником.\n\nСлайд 5: Подруга пишет: «Извини, что со мной столько возни», хотя вы сами предложили помочь.\n\nОна уже считает, сколько времени у вас отняла. К тяжелому состоянию добавляется задача быть удобной: попросить поменьше, поблагодарить получше, поскорее показать, что ей полегчало.\n\nСлайд 6: Вы спрашиваете: «Ну что, после прогулки лучше?» Подруга отвечает: «Да, спасибо», хотя ей по-прежнему тяжело.\n\nЕй жалко ваших стараний. Она видит, как вы ждете хороших новостей, и выдает их. Теперь рядом с вами приходится еще и изображать улучшение.\n\nСлайд 7: Так помощь превращается в список дел: выбрать, объяснить, поблагодарить, рассказать о результате.\n\nПодруга начинает говорить «я справлюсь», чтобы этот список больше не рос. Вы можете решить, что она отдаляется. Она просто пытается сократить все, на что нужны силы.\n\nСлайд 8: Предложите что-то конкретное и простое для ответа: «Могу завтра оставить у двери готовую еду. Напиши “да”, если привезти».\n\nПодруге не нужно становиться бодрее в благодарность за вашу помощь.","caption":"Я бы отдельно убрала вопрос «Тебе уже лучше?» после каждого доброго жеста. Очень хочется убедиться, что помогли. Но у человека с депрессией может сегодня не быть хороших новостей.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40.\nОтправьте тому, кто хочет поддержать подругу и боится ошибиться.","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":5,"interesno":5,"snyat":null,"ai_markers":["Так помощь превращается в список дел: выбрать, объяснить, поблагодарить, рассказать о результате."],"worst":"«Так помощь превращается в список дел: выбрать, объяснить, поблагодарить, рассказать о результате» — повторяет уже понятное, седьмой слайд затягивает карусель.","best":"«Бл*ть, я даже на этот вопрос ответить не могу».","verdict":"publikovat","why":"Есть сильное открытие: даже благодарность и отчет об улучшении могут стать дополнительной нагрузкой. Узнаваемые ситуации и готовая фраза для помощи дают повод сохранить и переслать; небольшой повтор не мешает."},"guard":[{"rule":"dvoetochiya","quote":"Вы спрашиваете подругу с депрессией: «Что тебе привезти?» Она читает сообщен | одится организовывать собственную помощь:"}],"cut":["Когда сил мало, это целая работа.","Это усталость от решений."],"before":null},{"id":"r_vopros_1","author":"Ольга","format":"reels_otvet","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Зачем мне психолог, если есть подруги?\nРечь: «А зачем мне психолог, если у меня есть подруги?» Меня часто об этом спрашивают. С психологом вам не приходится еще и заботиться о том, кто вас слушает. Вот вы рассказываете подруге, что дома все хреново. Она пугается, начинает переживать. И вы уже сбавляете: «Да ладно, я справлюсь». Или вспоминаете, что у нее самой тяжелая неделя, и решаете: хватит ее грузить. В терапии все это время выделено для вас. Можно рассказать до конца, без привычного «ну все, хватит обо мне». Психолога не нужно успокаивать после вашего рассказа.","caption":"Даже с близкой подругой можно замолчать на полуслове: «Она потом всю ночь будет за меня переживать». И вот вы опять оставили самое тяжелое при себе.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nПодписывайтесь, если хочется еще таких разговоров про отношения и то, что мы в них чувствуем.","judge":{"zhivo":4,"zacep":3,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":[],"worst":"«Меня часто об этом спрашивают.» — дежурное вступление, задерживает переход к самому интересному.","best":"«Можно рассказать до конца, без привычного «ну все, хватит обо мне».»","verdict":"publikovat","why":"Есть узнаваемый момент: пришла выговориться, а сама успокаиваешь подругу. Разница между дружбой и терапией показана через конкретную ситуацию, без обесценивания подруг и рекламы собственной незаменимости."},"guard":[{"rule":"dvoetochiya","quote":"начинает переживать. И вы уже сбавляете: «Да ладно, я справлюсь». Или вспоминает | то у нее самой тяжелая неделя, и реша"}],"cut":["Вы любите подругу, поэтому учитываете, как ей сейчас.","Это часть дружбы."],"before":null},{"id":"r_mif_2","author":"Юлия","format":"post","asked":"post","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"«Просто не накручивай себя».\n\nНет. Тревогу по команде не выключишь.\n\nТы ведь и так пытаешься. Он долго не отвечает, ты говоришь себе: «Занят человек, успокойся». Откладываешь телефон. Через минуту снова проверяешь. И тут начинается: «Ну что со мной не так? Почему я даже такую ерунду спокойно пережить не могу?»\n\nТеперь ты переживаешь еще и из-за того, что переживаешь. Каждая проверка телефона становится доказательством: опять не справилась.\n\nБудто успокоиться легко, а ты зачем-то упорно выбираешь мучиться. Хотя ты бы с удовольствием перестала высматривать, когда он был в сети.\n\nМожно тревожиться и все равно дать человеку время ответить. Можно сказать, что тебя беспокоит, без обвинений и требования немедленно успокоить тебя.\n\nНо обещать себе, что больше никогда не испугаешься и не подумаешь о плохом, бессмысленно. Такая мысль может появиться раньше, чем ты успеешь себе что-то объяснить.\n\nТебе стало страшно. Ты этим никому ничего плохого не сделала.","caption":"","judge":{"zhivo":4,"zacep":3,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":["Тебе стало страшно. Ты этим никому ничего плохого не сделала."],"worst":"Тебе стало страшно. Ты этим никому ничего плохого не сделала. — Открыточное утешение: конкретная история заканчивается общей поддержкой.","best":"Теперь ты переживаешь еще и из-за того, что переживаешь.","verdict":"publikovat","why":"Проверки телефона и злость на себя узнаются сразу. Текст показывает дополнительную ловушку: попытка перестать тревожиться превращается в повод ругать себя — это хочется переслать подруге."},"guard":[{"rule":"pafos","quote":"И тут начинается"},{"rule":"dvoetochiya","quote":". Он долго не отвечает, ты говоришь себе: «Занят человек, успокойся». Откладываеш | инуту снова проверяешь. И тут начина"}],"cut":["Вот чем вредит это «просто».","Ты отвечаешь за свои действия."],"before":null},{"id":"r_zlost_1","author":"Юлия","format":"post_tg","asked":"post_tg","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"«Он же не со зла»\n\nЕсли ты опять объясняешь себе, почему человек имел право с тобой резко разговаривать, у меня вопрос. Ты случайно не устроилась его адвокатом? Зарплата хоть есть?\n\n«Ну у него тяжелый день. Я же понимаю».\n\nПонимаешь. Даже когда он огрызнулся на обычный вопрос, ты уже вспомнила его недосып, работу и сложное детство. Свою обиду пока отложила. Сейчас некогда, надо человека оправдать.\n\nЯ бы здесь спросила: почему тебе можно злиться только на того, кому совсем нечем оправдаться?\n\nПотому что признать «я злюсь» для тебя почти равно сказать «он плохой». А ты его любишь. Поэтому начинаешь искать, что с тобой не так: слишком чувствительная, много требуешь, опять все близко к сердцу.\n\nОсобенно если знакомы такие фразы.\n\n«Он же не со зла». Допустим. Тебе все равно было больно слышать, как с тобой разговаривают.\n\n«Ты тоже не подарок». Конечно, ты тоже ошибаешься. Это не обязывает тебя спокойно принимать каждую чужую грубость.\n\n«Из-за такой ерунды злиться?» После этих слов ты уже стыдишься своей реакции. И вместо разговора о том, что тебя задело, объясняешь, почему вообще посмела расстроиться.\n\nВот так и получается: «Я вообще никогда не злюсь». Ты успеваешь пожалеть другого и поругать себя раньше, чем скажешь: «Со мной так нельзя».\n\nМожно сказать проще: «Я понимаю, что ты устал. Мне неприятно, когда ты на меня срываешься».\n\nТебе не нужно считать человека плохим, чтобы злиться на то, как он с тобой поступил.","caption":"","judge":{"zhivo":4,"zacep":5,"ponyatno":5,"polza":5,"interesno":5,"snyat":null,"ai_markers":["Это не обязывает тебя спокойно принимать каждую чужую грубость.","Тебе не нужно считать человека плохим, чтобы злиться на то, как он с тобой поступил."],"worst":"«Это не обязывает тебя спокойно принимать каждую чужую грубость.» — сухая формулировка, больше похожа на памятку, чем на разговор.","best":"«Ты случайно не устроилась его адвокатом? Зарплата хоть есть?»","verdict":"publikovat","why":"Читательница узнает свои оправдания и получает точное объяснение: злиться страшно, потому что это будто означает признать любимого плохим. Есть характер, понятные ситуации и фраза для реального разговора; немного правильный финал не мешает сохранить или переслать."},"guard":[{"rule":"dvoetochiya","quote":"Я бы здесь спросила: почему тебе можно злиться только на тог | ому начинаешь искать, что с тобой не так: слишком чувстви"}],"cut":["Злость не требует доказательств, что тебя специально хотели обидеть."],"before":null},{"id":"r_teen_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Слайд 1: На все вопросы подросток отвечает: «Нормально»\n\nСлайд 2: Вы спрашиваете: «Как день?» Подросток бросает «нормально», уходит в комнату и закрывает дверь. Обычный вечер, ничего особенного. Но если так заканчивается каждый разговор, вы постепенно перестаете знать, чем он живет. Хотя спрашиваете каждый день.\n\nСлайд 3: Подросток может молчать, потому что заранее ждет продолжения. Расскажешь про плохую оценку, придется обсуждать, сколько сидел в телефоне. Пожалуешься на ссору, услышишь, как надо было ответить. Лучше сказать «нормально», тогда объясняться не придется.\n\nСлайд 4: «Ничего не случилось».\n\nТак подросток заканчивает разговор, который кажется ему слишком трудным. Чтобы рассказать о неприятности, нужно еще выдержать ваши вопросы. Если он уже расстроен, на это просто нет сил. Короткий ответ помогает быстрее остаться одному.\n\nСлайд 5: «Да отстаньте уже!»\n\nВы только спросили, а он уже сердится. Он может ожидать целую цепочку знакомых вопросов: «Почему? А ты что сказал? А раньше нельзя было подумать?» Вы еще не успели их задать, а он уже начал защищаться.\n\nСлайд 6: «С вами говорить не хочу».\n\nОбидно, особенно когда из комнаты слышно, как он оживленно разговаривает с другом. Другу можно сказать: «День ужасный» и вместе повозмущаться. С родителями подросток порой ждет обсуждения своих ошибок.\n\nСлайд 7: Можно сказать: «Если захотите рассказать, я сначала просто послушаю», и действительно обойтись без немедленных советов.\n\nСейчас ему нужен разговор, после которого проблем не станет больше.","caption":"Когда подросток молчит, легко начать перебирать вопросы в поисках нужного. Особенно если вы волнуетесь и хотите хоть что-нибудь понять.\n\nЯ Михаил, психолог, работаю с родителями подростков от 12 до 17 лет.\nЕсли хотите, напишите в комментариях, какой ответ вы чаще всего слышите от своего подростка.","judge":{"zhivo":3,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":["Сейчас ему нужен разговор, после которого проблем не станет больше."],"worst":"«Если захотите рассказать, я сначала просто послушаю» — «захотите» звучит как обращение к клиенту, а не к собственному ребенку.","best":"Вы еще не успели их задать, а он уже начал защищаться.","verdict":"popravit","why":"Есть узнавание и полезная мысль: подросток защищается от вопросов, которые родитель еще не задал. Но слайды 3–6 повторяют одно объяснение, а предложенная реплика звучит слишком официально для домашнего разговора."},"guard":[{"rule":"ne_x_a_y","quote":"не успели их задать, а"},{"rule":"skrytoe_protivopostavlenie","quote":"не случилось».\n\nТак"},{"rule":"dezhurnyy_final","quote":"напишите в комментари"},{"rule":"dvoetochiya","quote":"На все вопросы подросток отвечает: «Нормально» | Вы спрашиваете: «Как день?» Подросток бросает «нормальн | ожидать целую"}],"cut":["Получается разговор с последствиями.","Поэтому для этих разговоров у него разное количество сил."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Звоните маме, чтобы она не обиделась?\nРечь: Четыре признака, что вы звоните маме, потому что боитесь потом выслушивать претензии.\nПервое. Звонок приходится на рабочий день. Вы прячетесь в коридоре на пять минут, потому что вечером хотите побыть с мужем. Но сказать это маме страшно.\nВторое. Готовите отчет заранее. Что ели, куда ходили, почему голос уставший. Иначе начнутся расспросы, и придется еще доказывать, что все хорошо.\nТретье. Отдыхаете с оглядкой на телефон. Фильм уже включили, но думаете: «Бля, надо сначала позвонить, иначе весь вечер буду дергаться».\nЧетвертое. Радуетесь, когда она не берет трубку. Можно спокойно заниматься своим: звонок в истории есть, вы попытались. Мама занята, и вы наконец можете выдохнуть.","caption":"Даже радостную новость придерживаете: расскажете про поездку, придется объяснять, почему заранее не посоветовались. Так из разговоров постепенно исчезает все, чем хотелось поделиться.\nМеня зовут Ольга, я психолог, работаю со взрослыми, которые съехали от родителей, но все еще боятся их расстроить.\nЕсли узнали себя, напишите в комментариях свой пункт.","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":[],"worst":"«Звонок приходится на рабочий день» — само по себе ничего не говорит о страхе претензий; узнавание начинается со следующей фразы.","best":"Можно спокойно заниматься своим: звонок в истории есть, вы попытались.","verdict":"publikovat","why":"Коридор, заранее приготовленный отчет и облегчение от непринятого звонка дают точное узнавание. Последний пункт помогает заметить, что звонок давно стал способом избежать претензий: хочется переслать тому, кто тоже ежедневно отчитывается маме."},"guard":[{"rule":"skrytoe_protivopostavlenie","quote":"не посоветовались. Так"},{"rule":"dvoetochiya","quote":"телефон. Фильм уже включили, но думаете: «Бля, надо сначала позвонить, иначе вес | трубку. Можно спокойно заниматься сво"}],"cut":["Вы уже знаете, сколько потом будет обиды."],"before":null},{"id":"r_money_1","author":"Ольга","format":"post","asked":"post","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"«Если я заслужила повышение, они сами должны предложить».\n\nИ вот вы уже полгода ждете, когда руководство догадается. Берете дополнительные задачи, выручаете коллег, остаетесь после работы. Ну теперь-то заметят?\n\nВ этой мысли повышение становится проверкой: ценят ли меня вообще? Хочется, чтобы начальник сам позвал и сказал: «Мы видим, сколько вы делаете. Поднимаем зарплату». Тогда можно выдохнуть. Вас заметили.\n\nА если пришлось попросить, внутри сразу: «Ну я же сама напросилась. Вдруг согласились, лишь бы отвязалась?»\n\nВот почему так стыдно начинать разговор. Вы собираетесь обсуждать деньги, но чувствуете себя так, будто выпрашиваете признание.\n\nОткрываете переписку с руководителем. Пишете: «Хотела бы обсудить пересмотр зарплаты». Стираете. Зато через пять минут спокойно отвечаете: «Да, я возьму эту задачу».\n\nЕще поработать привычнее, чем спросить. И появляется надежда: вот после ЭТОЙ задачи уж точно оценят. Бл*дь, сколько еще задач должно быть?\n\nРазговор можно начать с конкретного: «За последний год у меня добавились такие-то обязанности. Хочу обсудить зарплату с учетом этой нагрузки».\n\nУ руководителя есть рабочий вопрос: сколько компания готова платить за вашу работу. У вас есть личный: видят ли мои старания? Эти вопросы легко смешать. Но сумма в расчетном листке не ответит на все, что вам хочется услышать о себе.\n\nПовышение, о котором вы сами попросили, тоже считается.","caption":"","judge":{"zhivo":4,"zacep":5,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":["Но сумма в расчетном листке не ответит на все, что вам хочется услышать о себе.","Повышение, о котором вы сами попросили, тоже считается."],"worst":"Но сумма в расчетном листке не ответит на все, что вам хочется услышать о себе. — Книжный мини-вывод: здесь вместо конкретной женщины уже слышно психологическую статью.","best":"Стираете. Зато через пять минут спокойно отвечаете: «Да, я возьму эту задачу».","verdict":"publikovat","why":"Точное узнавание: попросить денег страшно, а взять еще работу легко. Есть полезный поворот — ждешь не только повышения, но и признания без просьбы; это хочется переслать коллеге, а готовая формулировка помогает начать разговор."},"guard":[{"rule":"rublenye","quote":"Поднимаем зарплату». Тогда можно выдохнуть. Вас заметили."},{"rule":"dvoetochiya","quote":"той мысли повышение становится проверкой: ценят ли меня вообще? Хочется, чтобы на | чальник сам позвал и сказал: «Мы вид"}],"cut":["Пока вы ждете, что повышение подтвердит вашу ценность, собственная просьба кажется чем-то постыдным.","Будто вы подсказываете ответ человеку, который должен был догадаться сам."],"before":null},{"id":"r_men_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Когда тяжело вам, а достается детям\nРечь: Четыре признака отца, которому проще накричать, чем сказать, что ему тяжело.\nПервое. После неприятного разговора на работе дома бесит любой шум. Начальнику вы ничего не сказали. Зато ребенку за громкий мультик досталось сразу.\nВторое. На вопрос жены «Что случилось?» отвечаете «Ничего». Рассказать, как вас задели, стыдно. Рявкнуть «Отстань» почему-то легче.\nТретье. Замечаете свое состояние только по сжатым зубам. Уже хочется стукнуть по столу, хотя еще час назад вы убеждали себя: «Ерунда, чего расстраиваться».\nЧетвертое. Детские слезы раздражают сильнее самого проступка. Хочется немедленно прекратить это нытье. Ребенок открыто показывает, что ему плохо. Вы себе такое запрещаете.\nА как вашему ребенку понять, что папе тоже бывает больно?","caption":"«Меня сегодня унизили» бывает труднее произнести, чем «Все достали».\nМеня зовут Михаил, я психолог, работаю с мужчинами 30-45 лет, отцами.\nПодписывайтесь, если хочется еще таких разборов.","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":["А как вашему ребенку понять, что папе тоже бывает больно?"],"worst":"«А как вашему ребенку понять, что папе тоже бывает больно?» — назидательный финал: вместо конкретного продолжения разбора появл
