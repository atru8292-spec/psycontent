<script>
const DATA=[{"id":"r_mif_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: Я плачу, чтобы меня просто послушали?\nРечь: На днях в очереди услышал: «Психолог просто слушает и кивает за мои деньги». И меня зацепило, что к этому сразу добавили: «Ну, если выговориться некому, тоже вариант».\n\nПолучается, вы приходите, рассказываете, как опять согласились помочь маме и отменили свои планы, психолог сочувственно кивает, потом вы рассказываете еще подробнее. Вы уже объяснили, куда собирались, почему маме понадобилась помощь, что она сказала, когда вы попробовали отказаться. Осталось показать переписку и уточнить, сколько сумок вы в итоге донесли. А с чем вы уйдете, кроме ощущения, что вас внимательно выслушали?\n\nПсихолог должен помогать вам разбираться в том, что вы хотите изменить. Слушать для этого действительно нужно. По вашему рассказу можно понять, в какой момент вы решили, что отказать маме будет слишком жестоко, чего испугались и почему согласились, хотя уже злились.\n\nЯ тоже могу неверно понять ваши слова или задать вопрос, который вам сейчас совсем не помогает. И тогда мне важно услышать, что мы обсуждаем что-то мимо вашей проблемы.\n\nВы сидите на сессии и говорите: «Я вообще-то умею отказывать. Потом мама весь день со мной не разговаривает, и я сам звоню извиняться». Психолог уточняет: «А за что вы просите прощения?»","caption":"На первой встрече можно прямо спросить: «Как мы будем работать с тем, с чем я пришел?» Психолог может объяснить, зачем задает вопросы и что предлагает делать дальше. Бывает, что сначала вам трудно сформулировать, чего вы хотите от встреч, и это тоже можно обсудить вместе. Если несколько сессий подряд вы уходите с ощущением, что просто пересказали неделю, стоит сказать об этом вслух. Для такого разговора не требуется разбираться в психологии или подбирать профессиональные слова.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"На днях в очереди услышал: «Психолог просто слушает и кивает за мо | еня зацепило, что к этому сразу добавили: «Ну, если"}],"cut":["Зачем вам понимать именно этот момент? Потому что иначе в следующую субботу вы снова отмените встречу, а потом будете весь день ругать себя за слабость. На сессии можно разобрать, чего вы ожидаете от мамы в ответ на отказ и как собираетесь с этим справиться. У вас появляется что попробовать в следующем разговоре.","Вам нужно понимать, над чем вы вместе работаете и как сегодняшний разговор связан с тем, ради чего вы пришли."],"before":null},{"id":"r_mif_1_2","author":"Михаил","format":"reels_rol","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: Психолог по принципу «клиент всегда прав»\nРечь: Проходите, я ваш психолог, у меня за ваши деньги вы всегда правы. Буду слушать, кивать, со всем соглашаться. Я считаю, это очень удобно.\n\nМуж опять не догадался, что вам нужна помощь с уборкой? Конечно, должен был догадаться. Вы же при нем пылесосили, вздыхали, переставляли его тапочки. Совершенно понятное обращение за помощью.\n\nВы ему ничего не сказали? Прекрасно, давайте и здесь ничего менять не будем. Расскажите еще раз, как он сидел на диване.\n\nСпрашивать, почему вы промолчали, я, разумеется, не стану. Вы же деньги заплатили. Еще начнете разбираться, чего боитесь, когда просите мужа о помощи, придется подбирать слова, потом действительно с ним разговаривать. Зачем нам такие сложности?\n\nЯ вообще стараюсь, чтобы вы ни с чем трудным здесь не встречались. Бывает, вижу из окна: люди приезжают заранее и минут двадцать сидят в машине у подъезда, собираются зайти. Представляете, сколько волнения, а тут еще я со своими вопросами.\n\nПоэтому мы просто посидим. Вы расскажете, какой муж невнимательный, я кивну в нужном месте. Могу даже вздохнуть одновременно с вами, это входит в стоимость.\n\nЧто делать, когда вернетесь домой? Ну, можете еще раз переставить его тапочки. Вдруг наконец поймет.\n\nЕсли снова не поймет, обязательно приходите. Я уже знаю, где кивать.","caption":"Что вам хотелось бы получить от психолога, кроме возможности выговориться?","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_vopros_1","author":"Ольга","format":"reels_otvet","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Зачем психолог, если есть подруги?\nРечь: Зачем мне психолог, если у меня есть подруги? Подруги могут очень помочь. Но идея, что с ними психолог вообще никому не нужен, меня бесит: получается, от дружбы теперь ждут еще и бесплатной терапии.\n\nСейчас мне скажут: «Конечно, вам же надо, чтобы к вам ходили за деньги. Мы с подругой поговорим, поплачем, и уже легче». Да, бывает именно так, и иногда еще поедим, и обсудим ее бывшего, хотя собирались обсуждать вашего. Подруги правда поддерживают, помогают разобраться, говорят то, что вы сами боялись себе сказать.\n\nУ психолога вам тоже может быть стыдно повторяться. При этом вам не нужно беречь его от ваших проблем, выслушивать в ответ его семейные ссоры и добиваться, чтобы он наконец одобрил ваш выбор. Вы можете снова говорить о том же и вместе разбираться, почему все повторяется. Блин, возможность рассказать все без подготовки приличной версии иногда очень нужна.\n\nПодруга присылает: «Ну что, вы поговорили?» Вы пишете: «Да, вроде разобрались», стираете следующее предложение и спрашиваете, как прошло ее свидание.","caption":"Если хотите поговорить с подругой о сложном, можно заранее спросить: «У тебя сейчас есть время и силы меня послушать? Мне хочется выговориться, советы пока трудно воспринимать». Так ей проще понять, чего вы ждете от разговора. Если она сегодня откажется, можно договориться на другой день. И после разговора полезно сказать, что именно помогло: например, что она выслушала до конца и не стала торопить вас с решением.","judge":null,"guard":[{"rule":"kancelyarit","quote":"При этом"},{"rule":"dvoetochiya","quote":"холог вообще никому не нужен, меня бесит: получается, от дружбы теперь ждут еще и | Сейчас мне скажут: «Конечно, вам же "},{"rule":"ostorozhno","quote":"5 оговорок: могут, бывает, иногда, может быть"}],"cut":["Только у подруги тоже есть своя жизнь и свои переживания. Вот вы снова поругались с партнером из-за переписки с его бывшей. В прошлый раз подруга слушала вас два часа, потом вы помирились с ним, а ей теперь даже рассказывать неловко. Она же уже сказала, что думает о нем, вы уже обещали с ним поговорить, и теперь заранее объясняете, почему опять ничего не изменилось.","И вы начинаете выбирать, что ей рассказать. Вот это уже было, вот тут она разозлится, вот тут скажет, что предупреждала. А у нее самой сложная неделя, и вы решаете сегодня ее поберечь. Она даже могла бы вас выслушать, но вы уже сократили свой рассказ до «да все нормально»."],"before":null},{"id":"r_vopros_1_2","author":"Ольга","format":"reels_malysh","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Зачем вам психолог, если есть подруги\nРечь: «Зачем тебе психолог, ты же можешь мне рассказать», говорит подруга, когда вы опять жалуетесь, что согласились ехать к маме на все выходные. Девочки, миленькие, поговорить с подругой правда бывает очень хорошо. Особенно когда она помнит, что вы вообще собирались эти выходные проспать.\n\nМожно представить, что у вас есть домик. Мама просит зайти, и вы сразу открываете, хотя хотели побыть одна. Подруга говорит: «Ну скажи ей, что заняты». Вы это уже сами знаете, только при словах «я не приеду» представляете, как мама скажет, что совсем вам больше не нужна. И опять соглашаетесь.\n\nИдеально собраться для такого разговора тоже не требуется. У меня мамы выходят на онлайн-сессии из машины, чтобы побыть без детей, а я уже узнаю «Синий трактор» на слух. Меня бесит требование сначала устроить себе идеальную жизнь, чтобы наконец попросить помощи, блядь.\n\nЯ не обещаю, что мама спокойно примет ваш отказ. Мы можем вместе подготовить слова, которые вы сможете произнести, даже когда она расстроится. Справку «теперь всем удобна» я не выдаю.","caption":"Что вам советовали подруги, хотя вы и сами понимали, что надо сделать?","judge":null,"guard":[],"cut":["Вот здесь я начинаю спрашивать, что происходит между вами. Как мама зовет, что вы отвечаете, что она говорит после вашего отказа. Звонит ли потом папа, чтобы попросить вас уступить. Как получается, что в субботу вы снова едете к ней, злитесь и весь день отвечаете сквозь зубы.","На наших встречах можно потихоньку пробовать прикрывать эту дверцу. Сказать мне вслух: «Мам, в эти выходные я останусь дома». Остановиться там, где хочется немедленно добавить оправдание, предложить приехать вечером, пообещать следующие выходные целиком. Я спрошу, чего вы ждете от мамы, если закончите предложение прямо сейчас."],"before":null},{"id":"r_post_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Текст на экране: Он молчит, и ты весь вечер ждешь\nРечь: Четыре признака того, что ты откладываешь свой вечер, пока он не напишет первым. Увидела в комментариях: «Хочу проверить, вспомнит ли он обо мне, если сама писать не буду».\n\nТы оставляешь свободным время, о котором он даже не спрашивал. Подруга предлагает встретиться, а ты отвечаешь, что пока не знаешь, получится ли: вдруг он сегодня позовет. Вы ничего не планировали, но ты уже отказываешься от других планов, потому что боишься пропустить возможность увидеться.\n\nТы придумываешь повод написать и сама его отвергаешь. У вас есть общая шутка, ты нашла смешное видео, уже открыла переписку, но отправлять нельзя, иначе как ты узнаешь, вспомнил бы он сам? Вот здесь мне особенно жалко этого вечера: ты хочешь с ним посмеяться, но молчишь, чтобы выяснить, нужна ли ты ему без напоминания о себе.\n\nСколько пунктов у тебя совпало?","caption":"В начале отношений вы можете по-разному представлять себе, как часто будете переписываться и кто обычно начинает разговор. Если тебе важна его инициатива, можно сказать: «Мне приятно, когда ты сам пишешь и предлагаешь встретиться. Мне хочется, чтобы ты тоже это делал». После такого разговора у тебя будет больше ясности о том, готов ли он учитывать твои пожелания. При этом один вечер без сообщения мало говорит о его интересе. Больше можно понять по тому, как он общается с тобой со временем, предлагает ли встречи и выполняет ли то, о чем вы договорились.","judge":null,"guard":[{"rule":"kancelyarit","quote":"При этом"},{"rule":"dvoetochiya","quote":"е напишет первым. Увидела в комментариях: «Хочу проверить, вспомнит ли он обо мне | ечаешь, что пока не знаешь, получитс"}],"cut":["Ты выбираешь занятия, которые легко бросить. Включаешь знакомый сериал, листаешь магазин, снова открываешь переписку, хотя собиралась закончить рабочую задачу. Тебе трудно взяться за то, что требует внимания: хочется сразу увидеть его сообщение, и к ночи ты обнаруживаешь, что весь вечер была занята ожиданием.","Ты радуешься сообщению еще до того, как прочитала его. Он просто спросил, что делаешь, и ты уже довольна, хотя дальше разговор едва идет и тебе приходится самой придумывать вопросы. Ты так ждала подтверждения, что он тебя помнит, что почти не замечаешь, интересно ли тебе сейчас с ним разговаривать."],"before":null},{"id":"r_post_1_2","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Текст на экране: Напишу первая и опять все испорчу\nРечь: Ты весь вечер проверяешь, написал ли он, и сама ему писать не собираешься, мои упертые девочки, я вас узнала.\n\nПочему ты открываешь переписку, хотя уведомления не было? Вдруг пропустила, вдруг сообщение уже там, и можно наконец перестать гадать, нужна ли ты ему сегодня.\n\nУ меня в кабинете клиенты иногда считают использованные салфетки: вытащила три, значит, хорошо поработали. Мне понятна эта попытка посчитать что-то конкретное, когда трудно понять, что между вами происходит.\n\nВот и ты считаешь, кто сколько раз начал разговор. Милая, погоди, ты ведь уже придумала, что ему рассказать, уже хочешь с ним поговорить. Но если напишешь сама, так и не узнаешь, вспомнил бы он о тебе без напоминания.\n\nИ за этот вечер ты уже успела отказаться от сериала, потому что все равно отвлекаешься, перечитать вчерашнее «спокойной ночи», проверить, когда он заходил, и разозлиться на подругу, потому что уведомление пришло от нее.\n\nА когда он наконец пишет, ты смотришь на часы: почему так поздно, почему только сейчас, он что, весь вечер обо мне не вспоминал? Сообщение ты получила, теперь будешь выяснять, насколько сильно он хотел его отправить.","caption":"Что ты обычно думаешь, когда он отвечает, но сам разговор не начинает?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ы иногда считают использованные салфетки: вытащила три, значит, хорошо поработали | да он наконец пишет, ты смотришь на "}],"cut":["Сегодня увидела под роликом: «Если я опять напишу первая, как я пойму, что он сам хотел со мной поговорить?» Вот это «как я пойму» меня и зацепило: ты уже ждешь подтверждения, что он вообще хочет с тобой общаться.","Почему ты набираешь «Как прошел день?» и стираешь? Потому что ответ на твое сообщение еще ничего тебе не докажет, он ведь мог ответить просто из вежливости."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Текст на экране: Как вы стали самым плохим сотрудником\nРечь: Милые мои, вы сейчас смотрите ролик и думаете, что остальные давно умеют работать, только вас почему-то еще не раскусили?\n\nИ уже записали себя в самые бестолковые, хотя коллеги сейчас вообще могут искать, как в таблице закрепить верхнюю строчку. Вы ведь тоже иногда ищете. И после этого вам почему-то особенно страшно получать зарплату.\n\nДавайте представим вашу тетрадку, куда вы записываете, как справились с работой. Вы закончили задачу, коллега сказал спасибо, результатом пользуются. Но вы ничего туда не записали. Задача была легкая, коллега просто вежливый, еще и подсказку пришлось посмотреть. Получается, целый день работали, а в тетрадке про это пусто.\n\nЗато ошиблись в письме, и тут вы сразу достаете красную ручку. Подробно записываете, что перепутали, кто заметил и как теперь стыдно. Мне жалко, что обычное «спасибо, все подошло» вы так быстро пропускаете: вы же потом искренне не можете вспомнить, когда вообще сделали что-то хорошо.\n\nПредлагаю смешную маленькую вещь: верните в тетрадку одну выполненную задачу. Так и напишите: «Сделал сам, подсказку посмотрел, получилось». Подсказку тоже оставьте, пусть будет. Вы ведь работу доделали, даже если по дороге чего-то не знали. Иначе вы опять вычеркнете весь результат из-за одного вопроса коллеге.\n\nЗа что вас благодарили на работе в последний раз?","caption":"Подписывайтесь, если узнаете себя: здесь про тревогу и жизнь с постоянной оглядкой на чужое мнение.","judge":null,"guard":[{"rule":"dvoetochiya","quote":", все подошло» вы так быстро пропускаете: вы же потом искренне не можете вспомнит | Предлагаю смешную маленькую вещь: ве"}],"cut":["Вот вы и ждете, что вас раскусят. Вы каждую удачу объясняете так, чтобы себе ничего не засчитать, а каждую ошибку старательно запоминаете. Конечно, с таким учетом вам страшно браться за следующую задачу и называть цену за свою работу."],"before":null},{"id":"r_tg_1_2","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Текст на экране: Сейчас поймут, что я ничего не умею\nРечь: Самозванцем вы себя называете, когда коллега просит объяснить ваше решение и вы уже представляете, как он поймет, что взяли вас зря. Хотя он пока просто задал вопрос. Недавно увидел в комментариях знакомое: «Я справляюсь, потому что каждый раз долго готовлюсь». Меня здесь зацепило это «потому что»: вы сумели разобраться и тут же нашли причину себе этого не засчитать.\n\nСамозванцем вы себя называете по правилам, при которых у вас почти нет шансов признать свою работу хорошей. Справились быстро, значит, задача была легкая. Потратили время, значит, вам тяжело дается то, что остальные давно умеют. Попросили помощи, значит, сами бы вообще ничего не сделали.\n\nСамозванцем вы продолжаете себя считать, и постепенно начинаете прятать вопросы, молчать на встречах и отказываться от задач, на которых могли бы научиться новому. Вы надеетесь однажды научиться всему настолько хорошо, чтобы больше никогда не сомневаться и ничего не уточнять.\n\nСамозванцем вы себя называете даже после удачного результата, потому что засчитали бы его себе только при одном условии: вы должны были все знать еще до того, как начали разбираться.","caption":"Когда задаете вопрос коллеге, уточните, что уже проверили и на каком шаге возникло затруднение.","judge":null,"guard":[{"rule":"dvoetochiya","quote":". Недавно увидел в комментариях знакомое: «Я справляюсь, потому что каждый раз до | ь». Меня здесь зацепило это «потому "}],"cut":["Самозванцем вы себя называете, когда перед встречей перечитываете переписку, проверяете расчеты и выписываете возможные вопросы, и потом считаете, что настоящий специалист ответил бы сразу. Вы сравниваете свою подготовку с чужими ответами, хотя понятия не имеете, сколько коллега готовился перед тем, как уверенно выступить.","Самозванцем вы себя называете, даже когда вашу работу приняли и ничего переделывать не пришлось. Почему вы после этого все равно ждете разоблачения? Потому что успех вы объясняете удачным стечением обстоятельств, помощью коллег, простой задачей, и для следующей задачи вам снова придется искать доказательства, что вы хоть что-то умеете."],"before":null},{"id":"r_car_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Текст на экране: Подруга с депрессией отдалилась от вас?\nРечь: Четыре вещи, которые может делать подруга с депрессией, когда ей трудно даже принять вашу поддержку. Увидела в комментариях: «Я уже перестала ей писать, она все равно молчит». Давайте разберемся, почему подруга может так себя вести.\n\nОна отменяет встречу, которую сама предложила. Когда вы договаривались, она правда хотела увидеться, а сегодня собраться и выйти кажется непосильным. Она остается дома и еще ругает себя за то, что подвела вас. Предложите зайти ненадолго, если ей подходит такой вариант.\n\nОна говорит, что ей ничего не нужно, хотя дома закончились продукты. Ей бывает трудно даже составить список и попросить вас сходить в магазин. И меня бесит совет «пусть сама попросит»: блядь, она уже может целый день откладывать единственное сообщение. Здесь проще предложить конкретно: «Я могу привезти ужин сегодня, тебе подойдет?»\n\nОна смеется с вами, а завтра снова отменяет планы. После хорошего вечера вы надеетесь, что ей легче, и ваше разочарование она может принять за упрек. В следующий раз она начнет скрывать, как ей плохо, чтобы вас не расстроить.\n\nА ваша подруга чаще молчит или отменяет встречи?","caption":"Подписывайтесь, если хотите лучше понимать близких и поддерживать их, даже когда трудно понять, что сказать.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ь вашу поддержку. Увидела в комментариях: «Я уже перестала ей писать, она все рав | И меня бесит совет «пусть сама попро"},{"rule":"ostorozhno","quote":"5 оговорок: может, бывает"}],"cut":["Она читает сообщения и оставляет их без ответа. Чтобы ответить на «как дела», ей приходится решать, сколько рассказать, как объяснить свое состояние и хватит ли сил продолжать разговор. Она откладывает ответ, потом ей стыдно за молчание, и вы общаетесь все реже. Можно написать: «Отвечать сейчас необязательно, я завтра еще напишу».","При депрессии подруге нужна профессиональная помощь. Можно предложить вместе найти психиатра или проводить на прием, если одной ей трудно добраться."],"before":null},{"id":"r_car_1_2","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Текст на экране: Подруга записала инструкцию по поддержке\nРечь: Девочки, увидела в нашем чате, что вы собираетесь поддержать подругу с депрессией, и решила записать инструкцию. У меня прекрасно получается подбадривать, мне потом вообще никто не жалуется.\n\nОна несколько дней не отвечает? Обязательно напишите, что вы тоже, между прочим, переживаете. Пусть знает, сколько людей она подвела своим молчанием. Особенно если она сейчас даже на простое сообщение не может придумать ответ.\n\nОтменила встречу перед самым выходом? Напомните, что вчера она сама согласилась. Вчера же силы были, куда она их за ночь дела? Очень удобно, конечно, вы уже столик заказали, а у нее опять ничего не получается.\n\nГоворит, что дома накопилась посуда и она никак не может ее помыть? Тут я бы прислала видео про дисциплину. Только, блядь, без предложений приехать и помочь, иначе как она научится сама собираться?\n\nВыложила фотографию, где смеется? Сразу пишите, что вы рады ее выздоровлению. Теперь можно спросить, почему на кофе с коллегой силы нашлись, а на вас нет. Пусть объяснит, желательно подробно, раз уж сегодня разговорилась.\n\nЕсли после этого она перестала рассказывать, как ей плохо, поздравляю: при вас теперь держится молодцом. Я же говорила, что умею подбодрить.\n\nА теперь серьезно: при депрессии подруга может хотеть увидеться и все равно отменять встречи, потому что сил не хватает даже на привычные дела. Предложите конкретную помощь, например привезти продукты, и помогите найти специалиста, который работает с депрессией. Если она говорит, что хочет умереть, оставайтесь с ней и обращайтесь за экстренной помощью.","caption":"«Я могу в субботу приехать и помочь с посудой. Если тяжело разговаривать, побудем молча».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"а рассказывать, как ей плохо, поздравляю: при вас теперь держится молодцом. Я же | А теперь серьезно: при депрессии подр"}],"cut":[],"before":null},{"id":"r_mif_2","author":"Юлия","format":"reels_rol","asked":"reels_auto","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"Текст на экране: Голосовое от подруги: просто не накручивай\nРечь: Я тебе как подруга советую: просто перестань накручивать себя из-за его сообщений, и у вас сразу все наладится.\n\nОн написал, что, может быть, увидитесь в выходные, и до субботы ничего не уточнил? Ну зачем ты теперь сидишь и думаешь, можно ли договориться с кем-то еще, вдруг он все-таки позовет? Займись своими делами, ты же самостоятельная женщина.\n\nТолько далеко лучше не уезжай, вдруг он освободится и предложит встретиться, ты ведь сама этого хотела.\n\nТебе хочется спросить, ждать ли его сегодня? Ну вот, опять ты начинаешь, тебе обязательно нужно все выяснить. Просто расслабься, и он сам напишет, когда сможет.\n\nТы уже убралась, сходила за продуктами и посмотрела фильм, но все равно ждешь? Значит, ты все это время неправильно отвлекалась. Надо было заниматься делами и вообще о нем не думать.\n\nЯ же тебе сразу сказала, что все очень просто. Сама посуди, он ничего определенного не обещал, а ты уже весь день испортила себе ожиданием.\n\nИ ему теперь лучше ничего не говорить, он еще решит, что с тобой сложно. Сначала успокойся, потом напишешь что-нибудь легкое, как будто ты прекрасно провела субботу.\n\nКстати, ты мое голосовое прослушала и ничего не ответила. Я что-то не так сказала? Ты теперь на меня обиделась? Могла бы хотя бы смайлик поставить, я сижу переживаю.","caption":"Подписывайся, если узнаешь себя: здесь разбираем, почему ты продолжаешь ждать тех, кто оставляет тебя в неопределенности.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не обещал, а"},{"rule":"dvoetochiya","quote":"Голосовое от подруги: просто не накручивай | Я тебе как подруга советую: просто перестань накручивать себя из-за | Подпи"}],"cut":[],"before":null},{"id":"r_mif_2_2","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"Текст на экране: Я опять все себе придумала\n\nРечь: В ленте под видео про тревогу прочитала совет: «Просто перестань себя накручивать», и я с этим советом спорю.\n\nСейчас мне скажут: «Конечно, психологам выгодно, чтобы мы переживали, иначе кто к вам ходить будет». Да, я работаю с тревогой, совершенно добровольно выбрала профессию, где подробно обсуждают то, что родственники предлагают просто забыть.\n\nИ я согласна, что можно придумать ссору, которой еще не было, расставание, которого никто не предлагал, и уже мысленно объясняться с мужчиной, который написал тебе одно слово: «Понятно».\n\nТы перечитываешь переписку, проверяешь, что такого сказала, вспоминаешь, как он отвечал вчера. Может, обиделся? Может, устал от тебя? Может, ты опять слишком много от него хочешь? И вот ты уже дописываешь ему объяснение, хотя он тебя ни в чем не обвинял.\n\nПочему так трудно просто закрыть переписку? Потому что тогда придется какое-то время жить, не зная, сердится он или занят, вернется к разговору или действительно хочет отдалиться. А ты боишься пропустить момент, когда еще можно все исправить, извиниться, подобрать другие слова и сохранить отношения.\n\nИ тут ты говоришь себе: «Хватит накручивать, нормальная девушка давно бы своими делами занималась». Меня в этом совете злит именно это: тебе уже страшно потерять близкого, и теперь ты еще должна стыдиться того, как переживаешь.\n\nА с советом «просто перестань» вообще удобно устроились: объяснять ничего не надо, и виновата снова ты, потому что даже перестать у тебя нормально не получается.","caption":"Если ответ показался холодным, можно спросить: «Ты сейчас сердишься на меня или занят и ответил коротко?»","judge":null,"guard":[{"rule":"dvoetochiya","quote":"те под видео про тревогу прочитала совет: «Просто перестань себя накручивать», и | Сейчас мне скажут: «Конечно, психолог"}],"cut":["Ты можешь отвечать за сообщение, которое отправишь, за обвинения, которые ему предъявишь. Но заранее узнать, что он думает, у тебя не получится, сколько бы раз ты ни перечитала его ответ."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Я опять сегодня не позвонила маме\nРечь: Вы сейчас смотрите ролик и уже прикидываете, успеете ли позвонить маме, пока она не легла. Потому что вчера пропустили, сегодня опять, и завтра придется начинать разговор с оправданий.\n\nПосмотреть сериал после работы, конечно, страшное дело. Посидеть молча вообще пиздец, как вы могли предпочесть это разговору. Уже записали себя в худшие дочери, хотя вчера полчаса слушали, как мама выбирала занавески, и вместе решали, какие подойдут к обоям.\n\nА что вы сегодня так старательно собираетесь рассказать? Что купили хлеб и дома закончился порошок. Но вы все равно придумываете, о чем поговорить, чтобы мама не сказала, что вы звоните для галочки. Просто спросить, как она, уже кажется мало.\n\nДавайте сегодня обойдемся без подробного пересказа покупки хлеба. Можно сказать маме: «У меня сегодня ничего нового, я сейчас буду смотреть сериал. Позвоню тебе в воскресенье».\n\nМама говорит: «Ну смотри, конечно, раз тебе интереснее». Вы открываете рот, чтобы объяснить, что сериал тут вообще ни при чем, что вы ее любите, что вчера тоже устали. Но говорите: «Хорошо, мам, до воскресенья». Кладете телефон рядом и возвращаете серию к началу, потому что первые минуты уже пропустили, пока репетировали этот разговор.","caption":"Иногда к звонку маме готовишься дольше, чем потом разговариваешь. Какую фразу вы обычно слышите, если пропустили день?","judge":null,"guard":[{"rule":"skrytoe_protivopostavlenie","quote":"не сказала, что вы звоните для галочки. Просто"},{"rule":"dvoetochiya","quote":"есказа покупки хлеба. Можно сказать маме: «У меня сегодня ничего нового, я сейчас | Мама говорит: «Ну смотри, конечно, р"}],"cut":["Вы еще ничего ей не сказали, но уже знаете все ее реплики. «У тебя на мать совсем времени нет». «Ясно, пока сама не позвоню, ты и не вспомнишь». И вы уже вспоминаете, чем были так заняты, чтобы причина выглядела достаточно уважительной.","Мне досадно слышать это «совсем времени нет», когда дочь уже выбирает для звонка время, чтобы мама потом не обижалась весь вечер."],"before":null},{"id":"r_rod_1_2","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Вы звоните маме, чтобы она не обиделась\nРечь: Четыре признака, что вы живете отдельно, но до сих пор подстраиваете свой день под мамины обиды. Увидела комментарий: «Мне проще каждый день позвонить, чем потом слушать, как я про нее забыла».\n\nВы скрываете от мамы, как хорошо провели день. Потому что на рассказ про встречу с подругой она ответит: «На нее время нашлось». Вот это меня, сука, бесит: вы начинаете рассказывать только про дела и усталость, чтобы мама согласилась, что у вас была уважительная причина ей не звонить.\n\nВы даже наедине с собой готовите следующий разговор. Могли бы спокойно посидеть в припаркованной машине, но уже набираете маму, пока никто не отвлекает. На онлайн-сессиях мамы иногда прячутся от детей в машине, чтобы спокойно поговорить о себе. А вы, получив полчаса тишины, тратите их на то, чтобы завтра вам ничего не предъявили.\n\nМама может хотеть ежедневного звонка, но покупать для этого отдельную квартиру ей было совершенно необязательно.","caption":"Подписывайтесь, если тоже заранее придумываете, как объяснить маме пропущенный звонок. Здесь разбираем, как взрослые дочери подстраиваются под родных, злятся и потом еще ругают себя за эту злость.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"нь под мамины обиды. Увидела комментарий: «Мне проще каждый день позвонить, чем п | ссказ про встречу с подругой она отв"}],"cut":["Вы освобождаете время для звонка, даже когда его нет. Заканчиваете рабочий разговор, пропускаете обед, потому что мама уже написала: «Ну понятно, тебе некогда». Вы еще даже не поговорили, а уже доказываете, что она вам дорога, ценой собственного перерыва.","Вы заранее предупреждаете мужа, что вечером надо будет позвонить маме. Он предлагает погулять подольше, вы начинаете нервничать: мама привыкла, что вы звоните в восемь. И вот вы спорите с мужем из-за прогулки, хотя боитесь совсем другого: завтра мама скажет, что после замужества вы про нее забыли."],"before":null},{"id":"r_men_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Папа терпит, потом кричит на детей\nРечь: Четыре признака папы, который запрещает себе расстраиваться, а потом срывается на детей.\n\nВы начинаете придираться к домашним мелочам. После неприятного разговора на работе вы заходите домой, видите рюкзак посреди коридора и кричите на сына. В голове одно: да сколько можно повторять, почему меня здесь вообще никто не слушает? Сын убирает рюкзак и уходит к себе. Вы весь день ждали встречи с ним, теперь сидите по разным комнатам.\n\nВам особенно трудно выдержать детские слезы. Когда сын плачет из-за проигранной партии, вы сразу требуете успокоиться, хотя минуту назад спокойно объясняли ему правила. Вы боитесь, что он вырастет слабым, и торопитесь прекратить его плач. В следующий раз сын снова проигрывает, отворачивается и трет глаза рукавом. Вы спрашиваете, что случилось. Он смотрит в стол и отвечает: «Да ничего, пап, все нормально».","caption":"Иногда папа повышает голос из-за мелочи, которую в другой день даже не заметил бы. После каких дней вам труднее всего спокойно разговаривать с детьми?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"оридора и кричите на сына. В голове одно: да сколько можно повторять, почему меня | случилось. Он смотрит в стол и отвеч"}],"cut":["Вы рассказываете о неприятностях только шутками. Приятель спрашивает, как дела после конфликта с начальником, и вы отвечаете, что начальник опять забыл принять успокоительное. Приятель смеется, вы меняете тему, хотя весь день думаете, что вас могут уволить. Он так и не узнает, что вам нужна поддержка.","Вы злитесь, когда жена вас жалеет. Стоит ей сказать: «У тебя сегодня тяжелый день был», вы отвечаете, что все нормально, хватит вас расспрашивать. На днях услышал знакомое «мужики не ноют» и разозлился: такой фразой мужчине предлагают замолчать именно тогда, когда ему трудно. Жена перестает спрашивать, и вы остаетесь со своими переживаниями один."],"before":null},{"id":"r_men_1_2","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Все держите в себе, срываетесь на детей\n\nРечь: Четыре признака, что вы привыкли держать себя в руках и теперь слишком часто кричите на детей.\n\nНа работе вы спокойно проглатываете грубость. Начальник при всех сказал, что вы опять ничего не поняли, вы кивнули и продолжили обсуждать задачу. По дороге домой вы еще мысленно ему отвечаете, а дома ребенок переспрашивает, какую страницу читать, и слышит: «Ты вообще меня слушаешь?» За весь день вы впервые повышаете голос там, где вам за это ничего не будет.\n\nВы особенно стараетесь быстро успокоить ребенка. Предлагаете другую игрушку, обещаете купить такую же, уговариваете перестать плакать. Когда ничего не помогает, вы злитесь: ну сколько можно, я же уже все предложил. Чужие слезы трудно выдерживать, когда свои вы годами останавливали словами «соберись, ты мужик», и теперь ребенок тоже торопится спрятать от вас свое расстройство. Кричать на семилетнего оказывается проще, чем сказать взрослому: «Мне сейчас тяжело».","caption":"Если узнали себя, подписывайтесь. Здесь про тревогу, неловкость и жизнь мужчин, которые привыкли справляться молча и все время думают, что о них подумают.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ашивает, какую страницу читать, и слышит: «Ты вообще меня слушаешь?» За весь день | ть. Когда ничего не помогает, вы зли"}],"cut":["Друзьям вы рассказываете только то, над чем уже можете посмеяться. Если спросили, как дела, у вас заранее готова шутка про ипотеку и родительский чат. Признаться, что вы еле справляетесь, кажется жалобой, поэтому друзья даже не знают, когда вам нужна поддержка, а вы постепенно перестаете им звонить.","Жене вы подробно объясняете, почему устали. Перечисляете задачи, пробки, расходы, но сказать «я сегодня расстроен и хочу с тобой поговорить» почему-то гораздо труднее. Разговор быстро превращается в спор, кто больше сделал, и вы остаетесь без той близости, ради которой вообще начали рассказывать."],"before":null},{"id":"r_vopros_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: Я даже к психологу нормально не подготовилась\nПерсонажи: А это психолог, Б это клиентка\nА: На первой встрече можно рассказать, как ты к ней готовилась.\nБ: Я выписала, что меня беспокоит, но теперь читаю и думаю, что с такими мелочами стыдно приходить.\nА: Что ты называешь мелочами?\nБ: Мама обижается, когда я отказываюсь приехать. Я соглашаюсь, потом злюсь. Вы наверняка такое постоянно слушаете.\nА: И тебе хочется рассказать мне что-нибудь поинтереснее?\nБ: Ну другие приходят, плачут, у них хотя бы понятно, зачем.\nА: У меня в кабинете даже по салфеткам иногда оценивают, хорошо ли поработали. Меня это огорчает: получается, за встречу еще надо отчитаться слезами.\nБ: А если я весь разговор буду жаловаться на мамины звонки?\nА: Тогда я спрошу, что происходит, когда мама звонит.\nБ: Я уже хотела отменить запись, потому что мне нечего сказать. А про маму даже подруге надоело рассказывать.","caption":"Если ты тоже откладываешь первую встречу, потому что пока не можешь толком объяснить, что тебя беспокоит, приходи с тем, что получается сказать сейчас. На первой встрече я буду слушать и задавать вопросы, чтобы мы могли подробнее поговорить о том, с чем ты пришла. Можно начать с маминых звонков, недавней ссоры или сомнений, стоит ли вообще об этом рассказывать. Записаться ко мне можно по ссылке в шапке профиля.\nЯ Юлия, работаю в психоанализе, принимаю тех, кто впервые идет к психологу.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_vopros_2_2","author":"Юлия","format":"reels_otvet","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: О чем говорить на первой сессии?\nРечь: А о чем вообще говорить на первой сессии? Можно начать прямо с этого вопроса и рассказать, почему тебе трудно выбрать, с чего начать.\n\nДопустим, мама опять решила, что в воскресенье ты приедешь к ней. Ты хотела провести выходной дома, но согласилась, а потом весь вечер придумывала, как теперь отказаться. С этого вполне можно начать. Мне понятно, о чем тебя спрашивать, даже если ты пока сама считаешь эту историю ерундой.\n\nЯ могу спросить, что мама сказала, что ты ей ответила, чего испугалась, когда хотела отказаться. Может быть, ты боишься, что она бросит трубку, потом несколько дней не будет отвечать, и тебе опять придется звонить первой и просить прощения.\n\nА потом ты говоришь мне: «Наверное, я зря трачу ваше время, у людей бывают проблемы посерьезнее». Я могу спросить, почему ты решила, что мне жалко на тебя времени. Ты ведь уже ждешь, что и передо мной придется оправдывать свое желание поговорить о том, что тебя расстраивает.\n\nТебе не нужно заранее угадывать все мои вопросы и готовить ответы. Я и сама заранее их все не знаю, хотя с таким серьезным лицом, наверное, можно подумать, что у меня целый список.","caption":"Перед первой встречей бывает трудно выбрать, с чего начать. Какую тему ты дольше всего решалась бы поднять с психологом?","judge":null,"guard":[],"cut":["Возможно, ты уже перебираешь: про маму вроде несерьезно, про отношения слишком долго объяснять, про работу вообще все жалуются. И пока выбираешь достаточно вескую причину, чтобы прийти, откладываешь запись, хотя после каждого разговора с мамой плачешь от злости на себя.","Я не буду требовать, чтобы ты сначала подробно рассказала все детство. И готового ответа, как поговорить с мамой, я не обещаю. Мы можем задержаться на том моменте, когда ты согласилась приехать, хотя очень хотела отказаться, и попробовать понять, что тебе тогда помешало."],"before":null},{"id":"r_money_1","author":"Ольга","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"Текст на экране: Как умница боялась попросить прибавку\n\nРечь: Стыдно, девочки, просить прибавку, и вот сегодня я прочитала под постом: «Сначала покажите, что вы ее заслужили». Меня это, блядь, бесит, потому что вы уже делаете свою работу, доделываете за коллегой, остаетесь после шести и думаете, чем бы еще заслужить право открыть рот.\n\nСтыдно попросить денег, и вы берете еще один отчет, соглашаетесь подменить коллегу на время отпуска, отвечаете на рабочие вопросы в выходные. Вы как маленькая ждете наклейку за старание: сейчас взрослые увидят, какая вы умница, и сами все дадут. Тогда просить вообще не придется, и никто не скажет, что вы слишком много о себе думаете.\n\nСтыдно услышать отказ, потому что вы собираетесь спросить про зарплату и уже представляете, как руководитель удивится вашей наглости. Вы столько всего сделали, а теперь можете услышать, что этого все равно недостаточно. И вы откладываете разговор до следующего отчета, следующой подмены, следующего месяца, когда уж точно никто не сможет придраться.\n\nСтыдно просить, и все же разговор придется начать, пока вы еще допускаете отказ. Вы сможете назвать свою работу и сумму, которую хотите получать, и услышать ответ руководителя, даже если он вам совсем не понравится. Наклейки за старание можно ждать еще очень долго.\n\nСтыдно просить прибавку, когда отказ для вас означает: «Я плохая».","caption":"Перед разговором выпишите задачи, которые добавились с момента, когда вы договаривались о нынешней зарплате. Можно начать так: «За последнее время я взяла на себя вот эти задачи, хочу обсудить повышение зарплаты до такой суммы». При отказе уточните: «При каких условиях и когда мы сможем вернуться к этому вопросу?» Попросите назвать конкретный срок. Так у вас будет больше ясности, стоит ли продолжать брать дополнительную работу в расчете на прибавку.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ку, и вот сегодня я прочитала под постом: «Сначала покажите, что вы ее заслужили» | как маленькая ждете наклейку за стар"}],"cut":["Стыдно признаться себе, что вы надеетесь заслужить такую прибавку, в которой вам просто невозможно будет отказать. Поэтому вы продолжаете соглашаться, хотя уже злитесь на каждую новую просьбу и приходите домой без сил. Вы ведь хотите однажды зайти в кабинет и точно знать, что вас похвалят, поблагодарят и сразу согласятся."],"before":null},{"id":"r_money_1_2","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"Текст на экране: Мне стыдно просить больше денег\nРечь: На днях в очереди услышала, как женщина объясняла подруге: «Я уже за троих работаю, как мне еще заслужить повышение?» Меня зацепило это «еще заслужить». У нее уже чужие обязанности, а она ищет, что бы сверху добавить.\n\nИ ведь вы можете делать ровно так же. Сначала подхватываете срочную задачу, потом заменяете коллегу в отпуске, потом отвечаете после работы, потому что без вас никто не разберется. Потом уже сами предлагаете помочь, хотя вас даже не просили. Осталось САМОЙ составить список причин, почему зарплату пока можно оставить прежней. Охуенно удобно всем, кроме вас.\n\nПочему взять еще одну задачу бывает легче, чем попросить больше денег? Пока вы стараетесь, можно надеяться: начальник заметит, оценит и сам предложит. Если попросить прямо, он может отказать. И тогда придется пережить вполне конкретное: вы сказали, сколько хотите получать, а вам ответили, что столько платить не готовы.\n\nВам нужно обсудить, сколько теперь стоит ваша работа, с учетом обязанностей, которые вы уже выполняете. Для такого разговора достаточно назвать, что изменилось, и какую зарплату вы хотите.\n\nНачальник спрашивает, сможете ли вы подхватить еще один проект. Вы открываете список своих задач: «Давайте сначала обсудим мою зарплату. Сейчас у меня уже два проекта вместо одного».","caption":"Что вы обычно берете на себя, пока ждете, что вам предложат повышение?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"услышала, как женщина объясняла подруге: «Я уже за троих работаю, как мне еще за | нег? Пока вы стараетесь, можно надеят"}],"cut":["Вот вы и добавляете себе работы, чтобы однажды начальнику стало совершенно очевидно, что вам пора платить больше. Заодно пытаетесь сделать так, чтобы отказать вам было уже просто невозможно. Только начальник может привыкнуть к тому, что вы все успеваете за прежние деньги.","Дополнительная работа позволяет откладывать разговор, которого вы боитесь. Даже когда сил на эту работу уже почти нет.","Я тоже хотела бы уметь просить так, чтобы мне гарантированно соглашались. Особенно когда от ответа зависит, смогу ли я позволить себе то, что давно откладываю."],"before":null},{"id":"r_body_1","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Если перед отпуском придираешься к себе\nРечь: Если ты собираешь чемодан и после каждой примерки говоришь себе гадости, милая, давай хотя бы здесь обойдемся без очередного «сама виновата».\n\nСегодня увидела комментарий под видео про отпуск: девушка купила платье, примерила и теперь вообще никуда не хочет. Мне горько читать, как быстро радость от поездки заканчивается требованием срочно стать другой.\n\nБоишься, что кто-нибудь скажет: «И она еще такое надела»? Ты уже сама сказала себе это перед зеркалом. И еще добавила подробностей, которых другая женщина могла бы вообще не заметить.\n\nТы уже сравнила фотографии в отзывах, заказала несколько размеров, вернула половину, перечитала правила провоза багажа, договорилась, кто польет цветы, и проверила паспорт столько раз, будто он собирается уехать отдельно. Господи, сколько всего ты уже сделала ради этой поездки. Конечно, ты устала, если даже перед зеркалом продолжаешь сдавать себе какой-то экзамен.\n\nИ особенно обидно, что платье тебе понравилось. Ты представляла, как пойдешь в нем ужинать, выбирала к нему серьги. Теперь хочется убрать его подальше, чтобы снова себя не расстраивать.\n\nТы стоишь перед зеркалом и тянешь платье вниз. Из соседней комнаты подруга спрашивает: «Ты в этом пойдешь? Тогда я тоже свое нарядное достану, наконец-то будет куда надеть».","caption":"Иногда близкие пытаются поддержать словами «Да нормально ты выглядишь» и случайно продолжают обсуждать именно внешность. Тогда приходится доказывать, почему тебе все равно плохо, и перечислять свои недостатки вслух. Можно сказать: «Я сейчас очень к себе придираюсь, и обсуждать, как я выгляжу, мне тяжело. Давай лучше решим, куда пойдем в первый день». Так у вас появится возможность поговорить о поездке без спора о том, достаточно ли ты себе нравишься.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"увидела комментарий под видео про отпуск: девушка купила платье, примерила и тепе | Боишься, что кто-нибудь скажет: «И о"}],"cut":["Ты уже представляешь фотографии и заранее знаешь, какие удалишь? Возможно, ты столько раз рассматривала себя в поисках недостатков, что теперь ждешь такого же взгляда от всех остальных. Даже от подруги, которая вообще собиралась фотографировать вас вместе на память.","Злишься на себя за то, что опять испортила себе настроение? Подожди, дорогая, ты сейчас еще и за эту злость себя отчитаешь. Сначала потребуешь понравиться себе в каждом платье, потом потребуешь спокойно относиться к тому, что пока не получается."],"before":null},{"id":"r_body_1_2","author":"Юлия","format":"reels_malysh","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Малышка собирается в отпуск и ругает себя\n\nРечь: Милая, ты опять примерила платье для отпуска и решила, что с такой внешностью лучше вообще никуда не ехать? И теперь ругаешь себя еще и за то, что из-за какой-то фотографии заранее испортила себе настроение?\n\nПочему так страшно выйти на пляж, попасть в общий кадр, надеть то самое платье? Может быть, ты уже представляешь, как кто-то посмотрит, сравнит тебя с другими и решит, что ты похуже. И хочется самой заранее сказать себе все самое гадкое, чтобы чужое замечание хотя бы не застало врасплох.\n\nТы будто ищешь билетик, с которым тебя пустят отдыхать. Бронь есть, чемодан есть, платье сложила, а билетик все никак не получишь. Потому что каждый раз перед зеркалом находишь новую причину остаться дома. Ну погоди, маленькая, ты сейчас правда пытаешься заслужить несколько спокойных дней.\n\nТы уже работала, копила, согласовывала даты, выбирала рейс, выясняла, входит ли багаж, и читала отзывы про шумный кондиционер. Целую поездку организовала. И теперь еще должна за неделю понравиться себе во всех ракурсах, иначе отдыхать как-то неловко.\n\nТы можешь пока себе не нравиться и все равно хотеть гулять, купаться и быть на общих фотографиях. Соседям по пляжу ты ничего не обещала.","caption":"Подпишись, если узнаешь привычку заранее решать, что тебя никто не выберет. Здесь говорим о том, почему умные и самостоятельные женщины сомневаются в себе и выбирают тех, чье внимание приходится заслуживать.","judge":null,"guard":[],"cut":["Увидела в комментариях: «Отпуск через неделю, смотреть на себя не могу». Меня зацепило это «через неделю», словно за оставшиеся дни обязательно нужно стать другой, иначе зря собралась.","Почему хочется спрятаться и отказаться от фотографий? Потому что ты ждешь, что тебя будут рассматривать и оценивать, и заранее стыдишься. Даже когда никто еще ничего не сказал. Поэтому уговоры просто полюбить себя могут только сильнее раздражать: ты еще и это, получается, никак не можешь сделать правильно."],"before":null},{"id":"r_teen_1","author":"Михаил","format":"reels_rol","asked":"reels_auto","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Текст на экране: Родительское собрание. Как добиться молчания\nРечь: Родители, вы спросили в чате, как разговорить сына, который закрылся в комнате, поэтому я подготовил инструкцию.\n\nДля начала постучите и сразу заходите. Вы же постучали, все приличия соблюдены. Сын просит побыть одному? Объясните, что вы целый день ждали встречи, а он даже поговорить с вами не хочет. Теперь ему придется еще и утешить вас, прекрасное начало разговора.\n\nГоворит, что устал и ничего не случилось? Перечислите возможные причины: двойка, поссорился с другом, кто-то обидел, что-то скрывает. На каждом варианте внимательно смотрите ему в лицо. Пускай попробует спокойно отдохнуть при таком интересном опросе.\n\nОтвечает все короче? Значит, добавляем вопросы. Вы уже спросили, как дела в школе, теперь уточните по каждому предмету. Оценки, домашка, подготовка к контрольной и вот это вот все. Особенно полезно спросить, почему он с друзьями может разговаривать час, а с вами двух слов связать не может.\n\nНаконец рассказал, что поссорился с приятелем? Тут важно сразу напомнить, что вы давно предупреждали про эту дружбу. Потом объясните, где сын сам виноват. Пусть убедится, что вы действительно все понимаете с полуслова и продолжать ему незачем.\n\nНа следующий день снова закрыл дверь? Обязательно расскажите об этом при нем бабушке по громкой связи. Вдвоем вы наверняка выясните, почему он ничего вам не рассказывает.","caption":"Можно постучать, дождаться ответа и сказать: «Я хотел узнать, как ты. Если сейчас хочется побыть одному, давай поговорим после ужина». Важно потом действительно дать подростку это время, без повторных заходов каждые десять минут. Когда он начнет рассказывать, полезно уточнить: «Хочешь, я просто послушаю или вместе подумаем, что делать?» Если подросток рассказал о ссоре, можно сначала спросить, что его больше всего задело.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"случилось? Перечислите возможные причины: двойка, поссорился с другом, кто-то оби | но постучать, дождаться ответа и ска"}],"cut":["Так у него будет возможность договорить, прежде чем вы предложите решение."],"before":null},{"id":"r_teen_1_2","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Текст на экране: Подросток дома молчит, с друзьями смеется\nРечь: Четыре признака того, что подростку трудно говорить с вами, хотя с друзьями он общается часами.\n\nОн выходит из комнаты только по делу. Спрашивает, где зарядка, берет ее и сразу уходит. Если обычный разговор быстро переходит к оценкам и урокам, он старается закончить его заранее. Вместе с неприятными вопросами он пропускает и возможность просто побыть рядом с вами.\n\nОн перестает рассказывать даже о хорошем. Вы случайно узнаете, что он удачно выступил с докладом, хотя вчера на вопрос про школу ответил: «Нормально». Возможно, он уже ждет продолжения: раз можешь, почему по остальным предметам тройки? Тогда даже успех приходится скрывать, и разделить радость с вами у него не получается.\n\nОн заботится о вас, но о себе молчит. Спрашивает, как прошел ваш день, помогает донести пакеты, а на ваше «ты как?» отвечает: «Все нормально». Он может бояться, что вы расстроитесь, начнете срочно выяснять подробности, отмените свои планы. В итоге со своей неприятностью он остается один. Здесь полезнее сказать: «Я вижу, что тебе трудно. Могу послушать, с советами подожду». И действительно подождать с советами.","caption":"На какие темы ваш подросток еще разговаривает с вами охотно?","judge":null,"guard":[{"rule":"dvoetochiya","quote":", хотя вчера на вопрос про школу ответил: «Нормально». Возможно, он уже ждет прод | олжения: раз можешь, почему по остал"}],"cut":["Недавно увидел комментарий: «С нами слова не вытянешь, зато с друзьями хохочет». Меня настораживает, как легко из этого получается вывод: значит, дома он просто вредничает.","Он оживляется, когда звонит друг. Очень легко обидеться: для нас сил нет, для остальных нашлись. Но с другом можно обсуждать игру и знать, что через минуту тебя не спросят про несданную работу. Подросток все чаще выбирает такие разговоры, а вы все реже узнаете, что ему интересно."],"before":null},{"id":"r_vybor_1","author":"Ольга","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Он отказал, я придумываю, как понравиться\nПерсонажи: А это клиентка, Б это психолог\nА: Я опять залипла на парне, которому отношения не нужны. И совет «выбирайте тех, кто выбирает вас» меня уже заебал.\nБ: Он вам прямо сказал, что отношений не хочет?\nА: Сказал, но мы переписываемся. Вот думаю, как позвать его встретиться, чтобы не давить.\nБ: И как вы подбираете слова?\nА: Чтобы со мной было легко, весело, никаких претензий. Я даже удалила вопрос, почему он пропал.\nБ: А что будет, если он согласится встретиться?\nА: Значит, я все-таки ему понравилась. Меня ведь обычно цепляет сильнее, когда начинают морозиться.\nБ: Что вы тогда пытаетесь ему доказать?\nА: Что со мной стоит быть, блин. Вот сейчас опять хотела написать, какая я удобная.\nБ: А что вам самой хотелось написать?\nА: Хотела спросить, мы вообще будем видеться или я одна этого хочу.","caption":"Если вы уже прямо спросили про отношения, повторно объяснять свои достоинства не требуется. На предложение иногда встречаться можно ответить: «Мне нужны отношения, случайные встречи мне не подходят».","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_vybor_1_2","author":"Ольга","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Почему вы опять играете в догонялки\n\nРечь: Догонялки, милая, это когда мужчина опять вам не ответил, и вы уже придумываете, что написать повеселее, чтобы он наконец захотел поговорить. Увидела под рилсом вопрос: «Как стать той, ради которой он захочет отношений?» И меня бесит, сколько требований к себе можно придумать, пока мужчина просто ничего вам не предлагает.\n\nДогонялки продолжаются, когда вы замечаете, что вам приходится выпрашивать каждую встречу, и все равно радуетесь его сообщению после недели молчания. Вы уже отменили свои планы, потому что он сегодня может, и боитесь предложить другой день: вдруг больше вообще не позовет. Слишком дорого вам обходится это маленькое «привет».\n\nДогонялки затягивают даже тогда, когда рядом появляется мужчина, который сам зовет встретиться, и вы думаете, что с ним как-то скучновато. Вы привыкли ждать следующего сообщения и заслуживать встречу, поэтому вам трудно заинтересоваться тем, кто уже хочет вас видеть. Тут хотя бы можно сходить на свидание и узнать, нравится ли вам с ним разговаривать.\n\nДогонялки заканчиваются, когда вы перестаете придумывать, чем еще его заинтересовать, и говорите: «Я хочу встречаться, ты тоже этого хочешь?» Если он снова исчезнет, вы уже знаете достаточно. Догонялки в одиночку, девочки, заебали.","caption":"Что вы старались изменить в себе, чтобы вас наконец выбрали?","judge":null,"guard":[{"rule":"kalka","quote":"Слишком дорого вам обходится"},{"rule":"dvoetochiya","quote":"ел поговорить. Увидела под рилсом вопрос: «Как стать той, ради которой он захочет | может, и боитесь предложить другой д"}],"cut":["Догонялки начинаются, когда вы решаете: сейчас я еще немножко постараюсь, буду интереснее, спокойнее, перестану спрашивать, когда увидимся, и тогда он меня выберет. Как будто вы играете с мальчиком, который все время убегает, и верите, что он возьмет вас за ручку, если вы наконец его догоните.","Догонялки повторяются, потому что вы хотите наконец убедиться: вас можно полюбить, ради вас тоже можно захотеть стараться. И его редкое внимание кажется особенно важным, потому что его так трудно получить. Вы можете еще толком не знать, подходит ли вам этот мужчина, но уже очень хотите ему понравиться."],"before":null},{"id":"r_zlost_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"Текст на экране: Я на маму вообще никогда не злюсь\nРечь: «Мама всегда хочет как лучше», говорят тебе родные, когда ты сердишься, что она опять решает, как тебе жить. И ты соглашаешься: конечно, она переживает, чего тут злиться.\n\nМеня настораживает это «чего тут злиться», когда мама уже отменила твои планы, а ты все еще объясняешь себе, какая она заботливая. Потому что за словами «я на маму вообще никогда не злюсь» могут быть два разных случая.\n\nБывает, мама зовет тебя на выходные, ты говоришь, что уже договорилась встретиться с подругой. Мама расстраивается, предлагает приехать в другой день, вы договариваетесь. Ты спокойно говоришь ей, чего хочешь, и тебе действительно незачем злиться. Даже если иногда вы спорите, вам обеим хватает места для своих планов.\n\nА бывает, мама говорит: «Подруги тебе, значит, дороже матери». И ты уже отменяешь встречу, хотя еще минуту назад собиралась идти. По дороге к маме убеждаешь себя, что сама захотела приехать. Признаться себе, что злишься, тоже трудно: тогда придется заметить, сколько раз ты отказалась от своего ради ее спокойствия.\n\nВ первом случае вы можете договариваться и дальше. Во втором тебе может понадобиться помощь психолога, чтобы говорить маме о своих решениях, даже когда она сердится. Особенно если после каждой попытки отказаться ты просишь прощения и делаешь, как она велела.\n\nЧто ты чаще говоришь маме, когда вы спорите: «я злюсь» или «прости»?","caption":"Что тебе обычно говорят, когда ты сердишься на маму?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"решает, как тебе жить. И ты соглашаешься: конечно, она переживает, чего тут злить | А бывает, мама говорит: «Подруги теб"},{"rule":"ostorozhno","quote":"5 оговорок: могут, бывает, иногда, может"}],"cut":["Как понять, какой случай у тебя? По тому, что происходит, когда ты все-таки говоришь маме, что тебе что-то не подходит. Она может выслушать, поворчать, согласиться на другой день. Или называет тебя неблагодарной, перестает отвечать, а потом требует извинений за то, что ты ее расстроила."],"before":null},{"id":"r_zlost_1_2","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"Текст на экране: Если ты вообще никогда не злишься\nРечь: Ты говоришь, что вообще никогда не злишься, хотя после ссоры еще долго придумываешь, что могла бы ему ответить.\n\nСегодня прочитала в комментариях совет: «Будь мудрее, промолчи». Меня злит, как легко этим советом хвалят женщину, которая снова ничего не сказала о том, что ей неприятно. Особенно когда она уже промолчала вчера, позавчера и теперь боится даже начать разговор.\n\nНапример, он позвал друзей к вам домой, с тобой не договорился, и ты узнаешь об этом, когда он просит купить что-нибудь к столу. Ты собиралась провести вечер вдвоем. Теперь ты идешь в магазин, накрываешь на стол и стараешься, чтобы гости ничего не заметили. Когда он спрашивает, почему ты такая тихая, отвечаешь, что просто устала.\n\nТебе говорят: «Не начинай из-за ерунды». Но ты собиралась обсудить вполне конкретную вещь: почему он решил за вас обоих. Тебе говорят: «Ты же у нас спокойная». И теперь приходится поддерживать это впечатление, даже когда хочется спросить, почему с тобой вообще не посоветовались.\n\nТы можешь сердиться на него и при этом разговаривать без оскорблений. И сказать: «Я злюсь, что ты пригласил гостей, даже не спросив, какие у меня планы на вечер».","caption":"Если в ответ звучит «Так что, мне теперь ни с кем не встречаться?», можно вернуться к своему вопросу: «Ты можешь встречаться с друзьями. Когда зовешь их к нам домой, сначала договорись со мной».","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"},{"rule":"dvoetochiya","quote":"Сегодня прочитала в комментариях совет: «Будь мудрее, промолчи». Меня злит, как | Тебе говорят: «Не начинай из-за ерунды"}],"cut":["И вот ты уже спрашиваешь себя: почему я не могу нормально порадоваться гостям? Может, я правда все усложняю? Как сказать ему, чтобы он только не подумал, что я запрещаю встречаться с друзьями?","Ты еще ничего ему не сказала, но уже объясняешься за то, что тебе могло бы не понравиться. И еще долго выбираешь слова, чтобы он точно не обиделся.","У меня в кабинете стоит коробка салфеток, и бывает, что по количеству использованных салфеток оценивают, хорошо ли поработали. Плакать из-за обиды многим привычнее, чем вслух сказать, на кого они злятся."],"before":null},{"id":"r_humor_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"Текст на экране: Тренинг: как дружить с психологом\nРечь: Девочки, я веду тренинг для тех, чья подруга психолог и почему-то хочет просто дружить.\n\nВот вы увидели, что она подняла стоимость консультации, и сразу написали: «Ого, хорошо, что у меня ты есть». Отличное начало, вы уже обозначили условия вашей дружбы.\n\nТеперь записываете голосовое про ссору с мужем. Первое, второе, потом еще одно, потому что забыли рассказать, с чего все началось. В конце обязательно добавьте, что отвечать можно когда удобно. И через полчаса спросите, послушала ли она.\n\nОна предлагает созвониться завтра? Конечно, соглашайтесь. А пока отправьте переписку с мужем, пусть ознакомится. Там немного, только с пятницы.\n\nЧто значит, она сегодня устала слушать? Меня, блядь, бесит эта жадность: другим она помогает, а вы ей даже деньги предлагать не стали, чтобы дружбу не портить.\n\nДа, она тоже хотела рассказать, как у нее дела. Спросите обязательно, это же взаимность. Пока она отвечает, можно найти то самое сообщение мужа, с которого все началось.\n\nОна сказала, что в дружбе ей тяжело постоянно быть психологом? Похвалите за честность, скажите, как вы цените ваши отношения. И сразу уточните, почему вас так задели ее слова.\n\nЕсли подруга все-таки предлагает записаться на консультацию, уточните, будет ли скидка для близких.\n\nНа полную стоимость соглашайтесь только при условии, что потом она тоже час послушает вас как подруга.","caption":"При этом ей тоже нужны разговоры, в которых можно пожаловаться, отвлечься и обойтись без разбора чужих отношений. Перед тяжелым разговором можно спросить: «У тебя сейчас есть силы меня послушать? Я хочу выговориться, советы мне пока не нужны». Если она откажется, лучше сразу договориться, когда получится поговорить, или обратиться за поддержкой к кому-то еще.","judge":null,"guard":[{"rule":"kancelyarit","quote":"При этом"},{"rule":"dvoetochiya","quote":"Тренинг: как дружить с психологом | стоимость консультации, и сразу написали: «Ого, хорошо, что у меня ты есть». Отли | "}],"cut":["Когда подруга работает психологом, вы можете особенно ценить ее внимание и умение слушать.","Близость сохраняется, когда обеим есть место в разговоре."],"before":null},{"id":"r_humor_1_2","author":"Ольга","format":"reels_scenka","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"Текст на экране: Вы же психолог, просто послушайте\nПерсонажи: А это психолог, Б это подруга\nА: Я могу закончить наш разговор, даже если вы еще злитесь на мужа.\nБ: Я же к вам просто поговорить пришла, мы подруги вообще-то.\nА: А я сказала, что сегодня хочу побыть одна.\nБ: Ну вы хотя бы послушайте его голосовое, скажите, что он имел в виду.\nА: Вы уже прислали переписку и попросили проверить ваш ответ.\nБ: Потому что вы психолог, вы понимаете! Остальные подруги только пишут: «Вот козел, конечно».\nА: И от меня вам тоже подойдет «вот козел»?\nБ: От вас хотелось бы понять, что мне делать, чтобы он так больше не говорил.\nА: Меня злит, что мое «хочу побыть одна» вы вообще пропустили.\nБ: Блять, я даже не спросила, как вы. Сразу скриншоты отправила.","caption":"Подписывайтесь, если узнаете себя: здесь про отношения, в которых вы всех выслушали, а вас опять забыли спросить.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"онимаете! Остальные подруги только пишут: «Вот козел, конечно». | Подписывайтесь, если узнаете себя: здесь про отношения"}],"cut":[],"before":null},{"id":"r_malysh_1","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"Текст на экране: Как хорошая девочка боится сказать «нет»\nРечь: Страшно, милая, сказать маме, что в воскресенье вы не приедете, и потом услышать, как она сразу начинает говорить с вами холодно. Вы уже обещали себе выходной, но пишете, во сколько вас ждать, и опять остаетесь без своих планов.\n\nСтрашно, и я прямо злюсь, когда вижу под такими вопросами совет «просто научитесь отказывать»: блядь, вы прекрасно знаете, какие слова надо сказать, вы боитесь того, что мама скажет потом. И как потом придется звонить ей, спрашивать, обиделась ли она, и стараться, чтобы она снова разговаривала с вами ласково.\n\nСтрашно, потому что вы будто носите значок «хорошая девочка» и очень боитесь, что мама его заберет. Пока вы приезжаете, помогаете, соглашаетесь, мама говорит, какая вы у нее умница, и вам спокойно: мама вами довольна, вы ей нужны.\n\nСтрашно оставить себе воскресенье, когда мама все еще недовольна, и остаться без привычного подтверждения, что вы хорошая дочь. Вот этого вы и боитесь каждый раз, когда заранее придумываете уважительную причину для отказа. Что мама обычно говорит на ваше «нет»?","caption":"Иногда согласиться гораздо легче, чем выдержать разговор после отказа. Какой фразой родные обычно добиваются вашего согласия?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"сами совет «просто научитесь отказывать»: блядь, вы прекрасно знаете, какие слова | т, какая вы у нее умница, и вам спок"}],"cut":["Страшно, когда мама спрашивает: «У тебя что, для матери времени нет?» И вы уже собираетесь подробно объяснять, что всю неделю работали, что дома ничего не успели, и надеетесь, что мама сама скажет: конечно, доченька, отдохни. Очень хочется, чтобы мама сама отпустила вас отдыхать, и тогда значок останется при вас.","Страшно признать, что вы соглашаетесь приехать еще и ради того, чтобы поскорее услышать ее обычный теплый голос. Вы отменяете свой выходной, мама снова довольна, и в следующий раз отказать еще труднее: вы уже знаете, как быстро можно закончить этот неприятный разговор."],"before":null},{"id":"r_malysh_1_2","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"Текст на экране: Почему зайке страшно сказать «нет»\nРечь: Подруга написала: «Согласилась приехать к маме в субботу, теперь думаю, как отменить свои планы». Зайка, меня тут задело, как быстро вы решили: свои планы отменить проще, чем маме отказать.\n\nМама еще даже не обиделась, а вы уже объясняете, почему заняты, перечисляете все дела, предлагаете приехать в воскресенье, привезти продукты, заодно помыть окна. Вы всего лишь хотели одну свободную субботу, а теперь, блядь, еще и окна моете.\n\nСмотрите, у вас как будто есть кнопочка «да». Нажали, и можно пока выдохнуть: мама довольна, никто не спрашивает, что у вас за такие важные дела. А когда собираетесь сказать «нет», заранее слышите: «Ну конечно, тебе теперь некогда. Я уж как-нибудь сама».\n\nМне самой тоже приятнее слышать, что мной довольны. Я понимаю это желание устроиться так, чтобы никому не мешать. У меня мамы даже на онлайн-сессиях прячутся от детей в машине или ванной, и я уже узнаю «Синий трактор» по звуку.\n\nМама пишет: «Понятно, у тебя свои дела». Вы читаете, начинаете набирать объяснение, стираете его. В субботу вы встречаетесь с подругой, как и договаривались.","caption":"Если вам угрожают или наказывают за отказ, сначала стоит продумать, к кому вы обратитесь за поддержкой.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не обиделась, а"},{"rule":"dvoetochiya","quote":"Подруга написала: «Согласилась приехать к маме в субботу, | а, меня тут задело, как быстро вы решили: свои планы отменит"}],"cut":["И вы соглашаетесь, чтобы поскорее перестать бояться этой минуты. Поэтому кнопочку в следующий раз нажать еще легче. Вы уже знаете, как быстро становится спокойно, если пообещать приехать. Свои отмененные планы вы будете оплакивать потом.","Но чужое недовольство придется немного выдержать, иначе свою субботу вы так и будете отдавать еще до разговора. Маме достаточно сказать: «В эту субботу я занята, приехать смогу в воскресенье», и закончить на этом, без списка причин."],"before":null},{"id":"r_malysh_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"Текст на экране: Малышка обиделась на маму\nРечь: Милая, ты опять после разговора с мамой обиделась и уже успела себя за это отругать? Ну какая шустрая, даже поплакать себе времени не оставила.\n\nСегодня увидела комментарий: «Мама столько для меня сделала, какое я имею право обижаться». Мне горько читать это «какое право»: дочь уже расстроилась, а теперь еще должна доказать, что у нее была достаточно серьезная причина.\n\nТы рассказываешь, что тебя повысили, а мама спрашивает, когда ты займешься личной жизнью. И ты сидишь перед ней, совсем как маленькая девочка с рисунком: принесла показать, ждешь, что мама посмотрит. Только теперь тебе самой кажется глупым так ждать.\n\nТы уже выслушала про часы, которые тикают, про соседскую дочь, которая все успела, про свою сложность, занятость, разборчивость, про то, что мама в твоем возрасте уже тебя растила. И даже спросила, как у нее дела, чтобы разговор закончился нормально.\n\nА потом еще ругаешь себя за обиду. Потому что мама ведь ничего такого не сказала. Она просто переживает. И ты опять подробно объясняешь себе, почему ей можно было это сказать, хотя сама весь разговор старалась ее ничем не расстроить.\n\nМама спрашивает: «Ты чего замолчала, я что-то не то сказала?» Ты отвечаешь: «Мам, я хотела, чтобы ты за меня порадовалась».","caption":"После такого разговора мама может перечислить все, что когда-либо для тебя сделала. Эти воспоминания бывают важными и правдивыми, но ими легко увести разговор от сегодняшних слов. Можно ответить: «Я помню, сколько ты для меня сделала. Сейчас я говорю о том, что ты сказала, когда я поделилась хорошей новостью». Мама может по-прежнему с тобой не согласиться. Ее несогласие само по себе не означает, что ты неверно поняла собственную обиду.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Сегодня увидела комментарий: «Мама столько для меня сделала, какое я | ся». Мне горько читать это «какое право»: дочь уж"}],"cut":["Стыдно, потому что мама старалась? Ты помнишь ее старания и боишься, что своей обидой все перечеркнешь. Страшно признать, что она тебя задела? Тогда придется заметить, как сильно тебе до сих пор хочется услышать от нее что-нибудь доброе.","Да погоди ты себя стыдить, хорошая. Ты позвонила маме, потому что обрадовалась и захотела рассказать ей первой. Конечно, тебе больно, когда она пропускает твою радость и сразу находит, чего тебе еще недостает. Ты ведь уже и сама начинаешь думать: может, действительно нечему радоваться?"],"before":null},{"id":"r_malysh_2_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"Текст на экране: Мама, мне обидно, я не вредничаю\n\nРечь: Милая, ты тоже после маминых слов сначала обижаешься, а потом сама себя ругаешь, что опять к ней придираешься?\n\nСегодня увидела под видео фразу: «На маму обижаться стыдно, она тебе жизнь дала». Меня в этом «стыдно» задело, как быстро дочери запрещают даже сказать, что мама ее обидела.\n\nВот ты рассказала маме, что поссорилась с мужем, попросила никому не говорить. Пришла на семейный ужин, и тетя уже спрашивает, вы помирились или все еще ругаетесь.\n\nА сказать маме, что тебе обидно, страшно? Потому что она может ответить: «Я же переживаю, мне теперь вообще ничего сказать нельзя?» И ты уже объясняешь, что любишь ее, хотя собиралась сказать совсем другое.\n\nТы сейчас как маленькая девочка, которая принесла маме рисунок, а мама без спроса показала всем, что нарисовано с обратной стороны.\n\nТебе хотелось самой решить, кому показывать. Разве от любви к маме у тебя должно пропасть это желание?\n\nНет, погоди, моя хорошая, тебе еще и стыдно, что ты сидишь рядом и злишься. Ты ведь помнишь, сколько мама для тебя сделала, и боишься, что своей обидой все это перечеркиваешь.\n\nТы уже выслушала тетино мнение, объяснила, что разводиться не собираешься, успокоила маму, которая «теперь слова боится сказать», и еще извинилась за свой тон.\n\nРодственники как-нибудь поужинают без подробностей твоего брака.","caption":"Какими словами мама отвечает, когда ты говоришь, что тебе обидно?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Сегодня увидела под видео фразу: «На маму обижаться стыдно, она тебе жиз | , страшно? Потому что она может ответить: «Я "}],"cut":["Хочется встать и уйти, малышка? Потому что ты доверилась маме, и теперь родственники обсуждают то, что ты рассказала только ей.","Ты можешь помнить ее заботу и сердиться из-за того, что она рассказала тете. Тебе не придется доказывать, что мама ужасная, чтобы признать: здесь она тебя обидела."],"before":null},{"id":"r_drug_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Текст на экране: Когда вам плохо, вы про меня помните\n\nРечь: Ко мне снова и снова приходят люди, чьи друзья пропадают, когда у них все хорошо, и возвращаются, когда плохо.\n\nВы знаете, как подруга пережила ссору с мужем, что он сказал, что она ответила. Вы переписывались до ночи, утром спросили, как она. Потом они помирились, и ваше предложение встретиться она уже несколько дней оставляет без ответа.\n\nИногда все проще, чем я привык искать в таких отношениях: подруга закрутилась, забыла ответить, потом сама предложила встретиться. Но вы ведь замечаете, когда она регулярно находит время только после очередной ссоры.\n\nМеня настораживает именно тот момент, когда вы уже ждете этих сообщений. Когда у нее все хорошо, вы снова оказываетесь за пределами ее жизни. И можно поймать себя на неприятной мысли: скоро она опять с ним поссорится и хотя бы позвонит. Вам хочется обычной дружбы, где можно вместе выбрать подарок, посмеяться, рассказать про выходные. Но уверенность, что вам ответят, появляется только во время ее неприятностей.\n\nПодруга пишет: «Мы помирились, спасибо, что выслушали». Вы отвечаете, что рады за нее, набираете: «Может, в субботу встретимся?» Потом стираете вопрос и отправляете сердечко.","caption":"Можно сказать прямо: «Мне хочется встречаться с вами и тогда, когда у вас все хорошо. Давайте договоримся о встрече без повода». Дальше важно, предложит ли подруга время и состоится ли встреча.","judge":null,"guard":[{"rule":"dvoetochiya","quote":", чем я привык искать в таких отношениях: подруга закрутилась, забыла ответить, п | И можно поймать себя на неприятной м"}],"cut":["За годы работы я стал замечать одну подробность: постепенно вы перестаете рассказывать такой подруге про себя. Собираетесь пожаловаться на тяжелую неделю, открываете переписку, а там она опять пишет, что у них случилось. Вы решаете, что со своей неделей можете подождать. Ей сейчас тяжелее.","Почему вы тогда сразу отвечаете, когда она появляется через месяц? Потому что в этот момент совершенно понятно: вы ей нужны. Она спрашивает ваше мнение, помнит, что вы говорили в прошлый раз, просит побыть на связи. И вы снова откладываете свои дела."],"before":null},{"id":"r_drug_1_2","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Текст на экране: Друг появляется, только когда ему плохо\nРечь: Четыре признака дружбы, в которой друг пропадает, как только у него все налаживается.\n\nВы подробно знаете, как друг расстается. Он пересылает вам переписку, звонит после каждой ссоры, спрашивает, стоит ли отвечать. Потом они мирятся, и на ваше предложение встретиться он отвечает через неделю. Вы успели привязаться к ежедневным разговорам, а теперь даже спросить, как дела, кажется навязчивостью.\n\nВы узнаете о его успехах вместе со всеми. О новой работе он рассказывает в общей компании, хотя перед собеседованием вы несколько вечеров слушали, почему его наверняка не возьмут. И вам уже неловко признаться, что вы ждали хотя бы сообщения: «Меня взяли».\n\nДруг охотно поддерживает вас, когда плохо вам. Он действительно слушает, помнит подробности, сам перезванивает. Но стоит вам рассказать, как хорошо прошли выходные или как вы рады новым отношениям, разговор быстро заканчивается. И постепенно вы начинаете искать, на что пожаловаться, чтобы снова поговорить подольше.\n\nНа предложение выпить кофе тоже можно ответить, даже если сегодня никто никого не бросил.","caption":"О чем вы чаще разговариваете с друзьями: о том, что случилось плохого, или о том, что получилось?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"изнаться, что вы ждали хотя бы сообщения: «Меня взяли». | О чем вы чаще разговариваете с друзьями: о том, что случилось "}],"cut":["Недавно услышал: «Если он не пишет, значит, у него все хорошо». Меня зацепило, насколько привычным стало такое объяснение: получается, хорошую жизнь друга вы вообще не видите.","Вы заранее освобождаете вечер, когда друг пишет: «Можно позвонит
