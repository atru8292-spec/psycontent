ь?» Вы уже знаете, что разговор затянется, и переносите свои планы, потому что вдруг ему совсем плохо. Вот здесь мне особенно досадно: вы еще даже не узнали, что случилось, а свой вечер уже отменили."],"before":null},{"id":"r_mama_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Текст на экране: Вы накричали и теперь ненавидите себя\nРечь: Четыре признака того, что после крика на ребенка вы еще долго наказываете себя, даже когда уже извинились и помирились.\n\nВы отменяете собственный выходной, хотя муж уже собирается гулять с ребенком. После утреннего срыва уйти одной кажется совсем охреневшим поступком: сначала накричала, теперь еще отдыхать пошла. Вы остаетесь дома, беретесь собирать ребенка, поправляете мужа, ссоритесь с ним. В результате снова проводите день без перерыва, которого так ждали всю неделю.\n\nВы не сразу откликаетесь, когда ребенок снова зовет вас играть. Он приносит кубики, тянет за руку, а вы продолжаете вспоминать свое лицо и голос, потому что уже взял вас за руку, а вы еще не простили себе утренний крик. Вам даже веселиться рядом с ним кажется нечестным: как можно так быстро успокоиться после того, что вы сказали. Ребенок зовет вас строить гараж, и, блядь, ему сейчас нужна мама с кубиками.","caption":"Подписывайтесь, если тоже тащите все сами, срываетесь и потом весь день себя ругаете. Здесь говорим про материнскую злость, мужа, который «помогает», и жизнь в декрете, где маме тоже нужен перерыв.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"дной кажется совсем охреневшим поступком: сначала накричала, теперь еще отдыхать | веселиться рядом с ним кажется нечест"}],"cut":["Вы начинаете соглашаться на все, что ребенок просит. Еще мультик, печенье перед ужином, достать краски за десять минут до выхода. Увидела в комментариях: «После такого уже стыдно что-то запрещать». Меня эта фраза зацепила: получается, мама теперь должна заслужить возможность сказать обычное «пора выключать». К вечеру вы снова раздражены, потому что весь день соглашались на то, на что сил у вас давно нет.","Вы перестаете отвечать подруге, у которой тоже маленький ребенок. Хотели рассказать, как тяжело даются эти сборы на прогулку, но теперь боитесь, что она спросит, как именно вы кричали. Вдруг даже она решит, что с ребенком вас лучше не оставлять. В переписке остается ваше «все нормально», и поговорить по-человечески опять не получилось."],"before":null},{"id":"r_mama_1_2","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Текст на экране: Злюсь на ребенка и ненавижу себя\n\nРечь: Девочки, вы тоже после злости на ребенка начинаете вспоминать, что еще сегодня сделали хреново? Добираете, дорогие, чтобы уж точно себя добить?\n\nВы третий раз читаете одну книжку, ребенок возвращает вас на первую страницу, вы хотите уже закрыть ее и побыть одна. Злитесь, потом смотрите, как он тычет пальцем в картинку, и думаете: он так радуется, а я сижу и жду, когда все закончится.\n\nПочему от этой мысли хочется назвать себя ужасной матерью? Потому что вы решили: хорошая мама должна радоваться вместе с ним. Каждый раз, блин. Даже если она с утра только и делает, что читает, собирает, утешает и отвечает.\n\nИ вот ребенок уже принес другую книжку, вы снова читаете, отвечаете, показываете ему собаку. Только внутри продолжаете себя отчитывать. Прекратить страшно: будто тогда вы слишком легко отделаетесь за свое раздражение.\n\nДевочки, вы сегодня уже выдержали отказ надевать обе приготовленные кофты, просьбу снять носки сразу после того, как вы их надели, протест против разломанного печенья и поиски точно такого же, но ЦЕЛОГО. Вы остались рядом, помогали, искали это печенье, хотя хотелось послать к черту всю пачку.\n\nИ вечером все равно проверяете, достаточно ли ласково вы прочитали про собаку.","caption":"За какую мысль о ребенке вы потом дольше всего себя ругаете?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"к он тычет пальцем в картинку, и думаете: он так радуется, а я сижу и жду, когда | бя ужасной матерью? Потому что вы реш"}],"cut":["Увидела под роликом фразу: «Он ведь маленький, как я вообще могу на него злиться». И меня бесит это «как могу»: мама уже считает себя виноватой, хотя даже не сказала ребенку ничего обидного.","А перестать себя ругать страшно? Еще бы, вдруг тогда вы окончательно обнаглеете и вам станет плевать на ребенка. Получается, вы доказываете себе, что любите его, тем, как сильно себя ненавидите после злости."],"before":null},{"id":"r_stud_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: Я опять весь день ничего не написала\nРечь: Ты сейчас смотришь ролик про диплом, хотя собиралась открыть документ и дописать хотя бы один абзац. Документ, возможно, даже открыт, и ты уже несколько раз переключалась на него, смотрела на последнюю строчку и возвращалась сюда.\n\nУвидела под похожим видео комментарий: «Я уже поняла, что просто слишком тупая для диплома». Меня в этой фразе зацепило, как быстро девушка решила все про себя, хотя речь шла о нескольких ненаписанных страницах.\n\nТы тоже уже назначила себя самой тупой на курсе? Судя по тому, как уверенно ты себя ругаешь, работы остальных ты прочитала целиком, включая те, которые они еще даже не начали.\n\nТы садишься писать, набираешь предложение, перечитываешь и сразу представляешь, как научная руководительница спросит, чему тебя вообще учили все эти годы. Стираешь предложение, ищешь еще одну статью, открываешь чужое введение. У чужой студентки все звучит убедительно, а у тебя даже первая мысль какая-то глупая.\n\nПредлагаю хотя бы назвать файл честно: «Диплом, который я пока пишу плохо». Прямо так и сохранить, без обещания немедленно стать лучшей выпускницей кафедры. Можно даже оставить внутри то самое предложение, которое ты сегодня стерла. Руководительница пока его не видит, одногруппники тоже, зато ты уже успела представить, как они все разочарованы.\n\nКак сейчас называется твой файл с дипломом?","caption":"Подпишись, если узнаешь себя: здесь разбираем, почему ты так строго судишь себя и стараешься заслужить чужое одобрение.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Увидела под похожим видео комментарий: «Я уже поняла, что просто слишком тупая | Предлагаю хотя бы назвать файл честно: "}],"cut":["И вот ты уже сравниваешь ее готовую работу со своей попыткой начать. Писать после такого сравнения совсем не хочется. Пока страница пустая, можно еще надеяться, что ты способна написать хорошо. А написанный абзац придется прочитать самой, и вдруг он окажется таким же плохим, как ты боялась."],"before":null},{"id":"r_stud_1_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: Открываю диплом и сразу закрываю\nПерсонажи: А это клиентка, Б это психолог\nА: Все советуют просто начать диплом. Я открываю файл, читаю свой абзац и закрываю. Сдавать скоро.\nБ: Что ты говоришь себе про этот абзац?\nА: Что это позор. Столько училась, даже написать нормально не могу.\nБ: Меня удивляет, когда у меня сессию оценивают по использованным салфеткам: поплакала, значит, поработала. Тебе какой абзац засчитывается?\nА: Который можно сразу отправить научруку. Зачем писать ерунду?\nБ: А оставить ерунду в черновике ты пробовала?\nА: Чтобы еще раз убедиться, какая я тупая? Спасибо, отличный совет.\nБ: Напиши, что хочешь объяснить, как сказала бы подруге.\nА: Тут я хочу сравнить, что пишут разные авторы. Написала, дальше что?\nБ: Ты уже собираешься это стереть?\nА: Да, звучит несерьезно. Получается, я каждую строчку проверяю, достойна ли она диплома, и следующую написать не успеваю.","caption":"Можно спросить научрука: «Вам можно прислать сырой фрагмент, чтобы понять, в ту ли сторону я пишу?»","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ию оценивают по использованным салфеткам: поплакала, значит, поработала. Тебе как | Можно спросить научрука: «Вам можно "}],"cut":[],"before":null},{"id":"r_gnezdo_1","author":"Михаил","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","text":"Текст на экране: Тем, у кого дети выросли и уехали\nРечь: Если дети уехали, а вы утром лежите и думаете, зачем теперь вставать, эти слова для вас. Для тех, кто все спрашивает, взяли ли они теплую куртку, хотя детям давно за тридцать. Дорогие мои, вы даже на расстоянии проверяете прогноз в чужом городе.\n\nБоитесь позвонить лишний раз? Вы уже слышали: «Я занят, потом наберу», и теперь не хотите мешать. Все равно покупаете любимое печенье дочери? Вы много лет брали его почти не глядя, потому что знали, кто вечером полезет в пакет. А теперь еще и злитесь на себя за эту покупку. Ну конечно, печенье купили, опять не справились с самостоятельной жизнью.\n\nХотите, чтобы дети жили своей жизнью, и одновременно ждете, что они приедут на все выходные? У вас годами было место в их обычном дне. Они спрашивали, где рубашка, что поесть, как ответить преподавателю. Вы могли ворчать, мечтать о тишине, уставать от разговоров. И все равно каждое утро знали, кому сегодня понадобитесь.\n\nИ когда вам трудно вставать, вы еще добавляете себе: какая глупость, ведь ничего плохого не случилось. Но вы скучаете по возможности быть рядом каждый день, знать подробности, вместе ужинать без предварительной договоренности. К этому вы привыкали годами.\n\nКак давно ваши дети живут отдельно?","caption":"В разговоре с детьми можно сказать: «Я по вам скучаю, мне пока непривычно жить отдельно. Хочу иногда слышать, как у вас прошел день». С такой просьбой детям проще понять, чего именно вам хочется. Можно договориться о коротком звонке в удобное для обоих время. Предсказуемая связь помогает меньше гадать, когда можно позвонить и не помешать. При этом во время разговора вполне может оказаться, что больших новостей ни у кого нет, и вам просто приятно немного поговорить.","judge":null,"guard":[{"rule":"kancelyarit","quote":"При этом"},{"rule":"dvoetochiya","quote":"есь позвонить лишний раз? Вы уже слышали: «Я занят, потом наберу», и теперь не хо | трудно вставать, вы еще добавляете с"}],"cut":["Недавно прочитал совет таким родителям: наконец займитесь собой, сколько можно жить детьми. Меня в этом совете задело это «сколько можно». Вы и так себя ругаете, что дети устроились, у них все хорошо, а вы почему-то ходите по квартире и места себе не находите.","Вы уже пережили школьные чаты, забытые сменки, экзамены, поступление, сборы, поиски квартиры, разговоры про залог и «мам, я договор не прочитал». И вот это вот все вы годами помнили, проверяли, оплачивали, обсуждали. Теперь дети многое решают сами, а вы остались без привычных дел, вокруг которых строили день."],"before":null},{"id":"r_gnezdo_1_2","author":"Михаил","format":"reels_malysh","asked":"reels_auto","intent":"podderzhka","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","text":"Текст на экране: Дети уехали. А утром зачем вставать?\nРечь: Дорогие мои, вы детей вырастили, проводили, а утром лежите и думаете: для кого теперь завтрак готовить? Себе вроде и бутерброда хватит. И вставать особенно незачем, никто ничего не потеряет, если вы еще полежите.\n\nУвидел под видео про отъезд взрослых детей комментарий: «Стыдно признаться, но я даже по их разбросанным вещам скучаю». Меня задело это «стыдно признаться». Даже когда дома стало пусто, вы еще должны проверить, достаточно ли правильно радуетесь за детей.\n\nМилые мои, вы ведь радуетесь. Почему тогда ревете после звонка, хотя у них все хорошо? Потому что вам хотелось еще поговорить, а у них уже свои дела. И вы говорите, что тоже побежали, хотя бежать сейчас особенно некуда.\n\nПредставьте маленькую кнопочку «я нужен». Годами вы нажимали на нее с самого утра: разбудить, накормить, напомнить про ключи. И сразу понятно, зачем вставать. А теперь дети сами просыпаются, покупают хлеб, иногда даже вспоминают про ключи. Вот ведь какие самостоятельные получились.\n\nИ почему вы себе кажетесь бесполезными? Потому что раньше вы каждый день видели, кому без вас трудно. Сейчас такого подтверждения стало меньше. Вы еще толком не знаете, чем хотите занять утро, в котором никто вас не зовет.\n\nВы уже вынесли школьные чаты, забытые сменки, домашние задания, экзамены, сборы в дорогу и героическое «я сам», после которого все равно искали документы всей семьей. Вы столько лет знали, что делать дальше. Конечно, сейчас растерялись.\n\nВы по-прежнему заслуживаете заботы.","caption":"Подписывайтесь, если узнаете себя: здесь про тревогу, неловкость и жизнь без постоянной оглядки на чужое мнение.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"или, проводили, а утром лежите и думаете: для кого теперь завтрак готовить? Себе | ео про отъезд взрослых детей коммента"}],"cut":["И пока ответ про ваше утро может быть совсем скромным: вам тоже нужен завтрак, даже если больше некому его готовить. Собственное присутствие за столом пока кажется недостаточной причиной."],"before":null},{"id":"r_razvod_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"mif","topic":"«ради детей надо сохранить семью»","text":"Текст на экране: Родительское собрание: сохраняем семью ради детей\nРечь: Я как классная руководительница прошу вас пока отложить развод, у нас скоро праздник семьи. Вы же понимаете, ребенку хочется прийти с мамой и папой.\n\nПапа опять отказался идти, потому что ему скучно? Ну вы попробуйте как-нибудь заинтересовать, костюмы там будут, чаепитие. Пирог, кстати, тоже с вас, я записала.\n\nДома вы уже почти не разговариваете? Зато ребенок видит, что родители вместе, это самое главное. Вы ему прямо так и объясняйте: мы с папой живем ради тебя. Пусть знает, сколько вы для него делаете, чего уж скрывать.\n\nВы говорите, что заебались уговаривать мужа побыть с собственным ребенком? Я понимаю, но вы попробуйте помягче. Мужчины ведь тоже обижаются, когда им постоянно напоминают, чего они опять не сделали.\n\nРебенок уже спрашивает, почему папа с ним никуда не ходит? Скажите, что папа устал. Что мама тоже устала, уточнять совершенно необязательно, ребенок же тогда запутается.\n\nО, папа обещал прийти на праздник, если вы перестанете пилить? Ну видите, уже получается договориться. Я всегда говорю: когда мама старается, папа тоже идет навстречу.\n\nТолько вы его утром еще раз попросите, рубашку приготовьте и напомните, где школа. А если все-таки придете одна, мы опять скажем, что папа работает. Дети у нас уже привыкли, никто даже не спрашивает.","caption":"Если вы пока остаетесь в браке, можно сказать: «Мы с папой сами решаем, как нам жить дальше. Ты можешь говорить нам, что тебя расстраивает, даже когда мы сердимся друг на друга». Обещать, что вы всегда будете вместе, для этого не нужно.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Родительское собрание: сохраняем семью ради детей | е главное. Вы ему прямо так и объясняйте: мы с папой живем ради тебя"}],"cut":["Когда вы говорите ребенку «мы живем вместе ради тебя», он может решить, что из-за него вам приходится терпеть.","Тогда ему становится страшно просить о чем-то еще или рассказывать о своих трудностях: мама и так слишком многим пожертвовала."],"before":null},{"id":"r_razvod_1_2","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«ради детей надо сохранить семью»","text":"Текст на экране: Я боюсь, что дети обвинят меня\nРечь: «Ради детей надо сохранить семью», говорят вам родные, когда вы уже думаете о разводе. Меня бесит, как легко после этих слов все поручают вам.\n\nНо смотрите, что вам предлагают делать под этим «сохранить». Муж неделями с вами толком не разговаривает, вы одна занимаетесь детьми, а стоит сказать, что вы так больше не можете, вам напоминают, как детям нужен отец. И вы опять откладываете разговор, потому что теперь боитесь: вдруг именно ваши слова все разрушат.\n\nЧто в этот момент считается угрозой семье? Ваше желание что-то изменить. Пока вы молча справляетесь, окружающие могут считать, что у вас все нормально. Блядь, как удобно получается для всех, кому ничего менять не приходится.\n\nУ меня мамы даже на онлайн-сессии прячутся от детей в машине, в ванной, случалось и в кладовке с пылесосом. Я уже узнаю «Синий трактор» на слух. Даже чтобы разобраться, что делать со своей жизнью, мама сначала должна найти, куда спрятаться.\n\nВы можете сказать мужу, что вас больше не устраивает, выслушать его, предложить конкретные изменения. Но согласиться и что-то сделать придется и ему. Требование сохранить семью любой ценой позволяет вообще не спрашивать, собирается ли муж в этом участвовать.\n\nКто вам чаще говорит «подумай о детях»: муж, мама или свекровь?","caption":"Подписывайтесь, если тоже все тащите: здесь про мужа, который «помогает», и злость, за которую потом стыдно.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"аете разговор, потому что теперь боитесь: вдруг именно ваши слова все разрушат. | Кто вам чаще говорит «подумай о детях»"}],"cut":["Сейчас мне ответят: «Ну конечно, психологам только дай всех развести, дети потом спасибо скажут!» Да, детям дорого, когда родители вместе, и расставание родителей может тяжело им даваться. Тут я спорить не собираюсь, семейные фотографии детям тоже дороги.","И вот вы уже ищете, как еще мягче попросить мужа заниматься детьми, как выбрать момент, как обойтись без претензий. Кажется, осталось подобрать правильные слова, и он наконец включится. А потом вы ругаете себя за очередной разговор, после которого ничего не изменилось."],"before":null},{"id":"r_pereezd_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"переехала в другой город и за год ни с кем не подружилась","text":"Текст на экране: Год после переезда, а подруги так и нет\nРечь: Четыре признака того, что после переезда ты откладываешь дружбу, хотя уже год очень хочешь найти здесь своих людей.\n\nТы отказываешься от встреч, которые тебе подходят не полностью. В общий чат зовут гулять, но ты плохо знаешь маршрут, не любишь рано вставать и решаешь дождаться чего-нибудь поинтереснее. Жалко же тратить единственный выходной. Только потом весь выходной ты проводишь одна, а знакомые в понедельник обсуждают, как промокли и куда пойдут снова.\n\nТы сравниваешь каждую новую знакомую с подругой, которая осталась в прежнем городе. С той можно молчать, жаловаться на маму, рассказывать историю с середины. А здесь опять объяснять, кто такая Лена и почему ты с ней поссорилась. Ты устаешь от этих объяснений и решаешь, что вы вряд ли станете близки.\n\nПосле кофе новая знакомая пишет: «Мне было хорошо, давай еще увидимся». Ты улыбаешься, начинаешь отвечать и стираешь предложение встретиться в субботу. Вдруг она написала из вежливости.","caption":"С новыми знакомыми иногда особенно не хватает той легкости, которая уже есть со старыми друзьями. Что тебе труднее всего предложить первой: встретиться, созвониться или зайти в гости?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"После кофе новая знакомая пишет: «Мне было хорошо, давай еще увидимся». | Что тебе труднее всего предложить первой: встр"}],"cut":["Ты собираешься позвать знакомую в гости, когда обустроишься. Недавно услышала: «Вот куплю нормальный стол, тогда приглашу». Меня зацепило, сколько всего нужно купить, прежде чем станет можно просто попить с кем-то чай. Пока ты выбираешь стол, вы продолжаете только здороваться.","Ты охотно помогаешь, но сама ничего не просишь. Можешь забрать чужую посылку, подсказать, где дешевле купить мебель, а попросить компанию для похода в кино уже неловко. Вдруг знакомая решит, что ты совсем одинокая и теперь придется тебя развлекать. Так она знает, что к тебе можно обратиться, но даже не догадывается, что ты ждешь приглашения."],"before":null},{"id":"r_pereezd_1_2","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"переехала в другой город и за год ни с кем не подружилась","text":"Текст на экране: За год так и нет подруг\nРечь: Ко мне снова и снова приходят с тем, что после переезда так и не с кем встретиться.\n\nЗа годы работы я стала замечать, как часто ты ждешь от нового знакомства того, что раньше было с давней подругой. Ей можно было написать: «Пойдем куда-нибудь, мне дома надоело». Новой знакомой ты составляешь приглашение так долго, что уже наступают выходные.\n\nТы познакомилась с девушкой на курсах, вы вместе дошли до метро, посмеялись, обменялись контактами. Дома ты находишь ее в переписках и начинаешь прикидывать: вдруг она дала номер из вежливости, вдруг у нее уже есть компания, вдруг ты вообще ей навязываешься.\n\nИногда, конечно, все проще, чем я привыкла искать в работе: ты работаешь из дома и за неделю разговариваешь только с коллегами. Для знакомства тебе буквально негде встретить людей. Но бывает, что знакомая уже есть, ее контакт у тебя сохранен, и ты снова откладываешь приглашение.\n\nЗа этот год ты могла много раз захотеть с кем-то сблизиться и каждый раз остановиться на мысли, что сначала надо убедиться во взаимности. Девушка еще даже не прочитала приглашение на кофе, а ты уже решила, что никому в этом городе не нужна.","caption":"Подписывайся, если узнаешь себя в ожидании, что тебя сначала выберут и позовут. Здесь разбираемся, почему самостоятельным женщинам бывает трудно сближаться и как перестать выбирать тех, кто не выбирает тебя.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не прочитала приглашение на кофе, а"},{"rule":"dvoetochiya","quote":"давней подругой. Ей можно было написать: «Пойдем куда-нибудь, мне дома надоело». | ее в переписках и начинаешь прикидыва"}],"cut":["Что я здесь замечаю? Тебе хочется заранее знать, что она тоже рада знакомству. Настолько рада, что сама напишет и позовет. Тогда можно будет согласиться без страха, что ты ей нужнее, чем она тебе.","И вот это «сначала пусть сама» меня беспокоит, потому что так ты можешь месяцами ждать сообщения от девушки, которая тоже стесняется написать первой. Каждая сидит дома и думает, что другой вполне хватает общения."],"before":null},{"id":"r_dengi_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","text":"Текст на экране: Зарабатываю нормально, а денег все мало\n\nРечь: Перестраховываетесь, и в день зарплаты снова переводите деньги на накопительный счет, хотя там уже лежит сумма, с которой вы обещали себе наконец выдохнуть. На обычные расходы хватает, просроченных платежей нет, но потратить что-то сверх необходимого все равно страшно.\n\nПерестраховываетесь, и каждый раз находите причину увеличить запас: вдруг потеряете работу, вдруг придется помогать родителям, вдруг новую работу будете искать дольше. Все это действительно может случиться. И вы хотите накопить столько, чтобы больше об этом не думать.\n\nПерестраховываетесь, и постепенно замечаете: доход вырос, накопления выросли, а разрешить себе лишнюю покупку по-прежнему трудно. Почему прежней суммы вдруг недостаточно? Потому что вы по-прежнему можете потерять работу. Вы накопили деньги, но так и не получили гарантии, что они никогда не закончатся.\n\nПерестраховываетесь, и уже надеетесь, что следующая сумма наконец даст эту гарантию, хотя с предыдущей произошло ровно то же самое. Покупку откладываете, поездку переносите, и каждый раз вам становится немного спокойнее, потому что сегодня вы ничего лишнего не потратили.\n\nПерестраховываетесь, и жена присылает стоимость выходных за городом, которые вы вместе собирались провести еще весной. Вы открываете накопительный счет, смотрите на сумму, которой собирались обойтись при потере работы, и решаете, что надо бы добавить. Жене пишете: «Давай пока подождем, сейчас как-то неспокойно».","caption":"Какую трату вы давно откладываете, хотя деньги на нее есть? Что говорите себе, когда снова решаете подождать?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"дый раз находите причину увеличить запас: вдруг потеряете работу, вдруг придется | естраховываетесь, и постепенно замеча"}],"cut":["Перестраховываетесь, и советы создать финансовую подушку читаете как требование отложить еще. Недавно снова увидел обещание, что с хорошим запасом вы будете спокойны за будущее. Меня в таких обещаниях смущает уверенность: вы ведь можете продолжать бояться и с деньгами на счете."],"before":null},{"id":"r_dengi_1_2","author":"Михаил","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","text":"Текст на экране: Зарплата пришла, я опять проверяю остаток\nПерсонажи: А это мужчина, Б это психолог\nА: Я нормально зарабатываю, но постоянно проверяю счет. И только не советуйте вести бюджет, у меня даже порошок в таблице записан.\nБ: Что вы хотите узнать, когда снова открываете приложение?\nА: Хочу убедиться, что нам хватит. Посмотрю на остаток, вроде отпускает.\nБ: А почему потом смотрите снова?\nА: Вдруг что-то упустил. Жена предлагает заказать пиццу, я уже считаю, сколько мы так за месяц проедим.\nБ: Перед последней проверкой появились новые расходы?\nА: Нет, я просто опять начал переживать.\nБ: Попробуйте сейчас назвать сумму, с которой вам будет спокойно.\nА: Назову, потом подумаю, что машину придется чинить. И где эффект от вашего вопроса?\nБ: Вы заметили, почему вам снова хочется проверить счет?\nА: Получается, я каждый раз проверяю, чтобы успокоиться. Потом снова тревожусь и лезу проверять, хотя сумму уже знаю.","caption":"Для проверки бюджета можно заранее выбрать время и конкретный вопрос: хватит ли денег на обязательные расходы до следующего дохода.","judge":null,"guard":[],"cut":[],"before":null}];const KEY='eval-2026-10-21_15-09-29_rilsy_r_zh4h7m';
let R={};try{R=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}};

+(d.error?'<div class="mk">Ошибка: '+esc(d.error)+'</div>':'')
+(j.verdict?'<div><span class="tag v-'+j.verdict+'">'+V[j.verdict]+'</span><span class="why">'+esc(j.why)+'</span></div>':'')
+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'
+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')
+((d.cut||[]).length?'<div class="cut">Вычеркнула: '+d.cut.map(x=>'<s>'+esc(x)+'</s>').join(' ')+'</div>':'')
+((j.ai_markers||[]).length?'<div class="mk">'+j.ai_markers.map(x=>'«'+esc(x)+'»').join(' ')+'</div>':'')
+(j.worst?'<div class="why">Худшее: '+esc(j.worst)+'</div>':'')
+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')
+'<div class="rate"><button data-m="ok" class="'+(r.mark==='ok'?'on':'')+'">Живо</button><button data-m="bad" class="'+(r.mark==='bad'?'on':'')+'">Не живо</button><input placeholder="что не так" value="'+esc(r.note||'')+'"></div>';
c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
c.querySelector('input').onchange=e=>{R[d.id]={...(R[d.id]||{}),note:e.target.value};save()};
m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
fsel.onchange=render;document.getElementById('v').onchange=render;
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,ratings:R},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ocenki-2026-10-21_15-09-29_rilsy_r_zh4h7m.json';a.click()};
render();
