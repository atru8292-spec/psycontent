<script>
const DATA=[{"id":"r_post_1","author":"Юлия","format":"post","asked":"post","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Ты снова проверяешь телефон, хотя звук включен и его сообщение ты точно услышишь.\n\nПросто очень хочется, чтобы он написал сам. Ты уже придумала, что ему рассказать, но останавливаешь себя: «Я вчера первая писала. Сегодня пусть он».\n\nИ вот ты весь вечер ждешь подтверждения, что он тоже про тебя помнит. Без твоего напоминания. Что ему самому захотелось узнать, как ты.\n\nЗнакомо? Открываешь переписку, перечитываешь последнее сообщение. Вроде ответил тепло. Тогда почему молчит? Заходишь посмотреть, был ли в сети. Был. «На телефон время есть, на меня нет?»\n\nДа что же такое, ты уже даже злишься на себя за желание ему написать.\n\nКогда его сообщение становится доказательством, что ты ему нужна, самой начать разговор страшно. Напишешь, он ответит, и все равно останется вопрос: «А если бы я промолчала, он бы вообще вспомнил?»\n\nТак можно переписываться каждый день и все равно чувствовать себя ненужной. Потому что каждый раз ты считаешь, кто начал, и обесцениваешь его ответ: «Ну это же я написала».\n\nОдного сообщения первым тебе хватит до следующего вечера. Поэтому обсуди с ним саму инициативу в общении: тебе важно, чтобы он тоже писал и предлагал увидеться.","caption":"","judge":{"zhivo":4,"zacep":5,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":["Поэтому обсуди с ним саму инициативу в общении"],"worst":"Поэтому обсуди с ним саму инициативу в общении: тебе важно, чтобы он тоже писал и предлагал увидеться. — После живого узнавания появляется сухая рекомендация из памятки.","best":"Напишешь, он ответит, и все равно останется вопрос: «А если бы я промолчала, он бы вообще вспомнил?»","verdict":"publikovat","why":"Первая строка точно ловит знакомую привычку. Дальше есть важное узнавание: общение идет, но его ответы не успокаивают, потому что ждешь именно самостоятельного интереса; это ":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":["Я бы предложил здесь разделить два вопроса","Вам правда может быть легко делать работу, которой вы уже научились."],"worst":"Вам правда может быть легко делать работу, которой вы уже научились. — Повторяет уже понятную мысль и звучит как заготовленная поддержка.","best":"То есть к готовой работе еще надо приложить доказательства, что вы намучились. Серьезные требования, конечно.","verdict":"publikovat","why":"Есть узнаваемая рабочая сцена и небанальное объяснение: вы считаете профессионализмом только то, что дается с трудом. Автор говорит понятно, с легкой иронией; текст хочется переслать коллеге, который обесценивает свою работу."},"guard":[{"rule":"dvoetochiya","quote":", руководитель доволен, а у вас в голове: «Да что я такого сделал? Это любой може | Представьте: на созвоне все обсуждаю"}],"cut":["При таком подсчете собственные умения просто теряются."],"before":null},{"id":"r_car_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Слайд 1: Подруга в депрессии не отвечает на сообщения\n\nСлайд 2: Вы пишете подруге: «Как ты сегодня?» Ответа нет. Потом отправляете: «Я переживаю». Она читает и откладывает телефон. Теперь ей нужно рассказать, как ей плохо, и еще успокоить вас. При депрессии даже на такой ответ бывает трудно найти силы.\n\nСлайд 3: Поддержка тоже может стать заданием. Нужно придумать, о чем попросить, договориться, потом поблагодарить. Подруга понимает, что вы хотите помочь. Но думает: «Сейчас начну объяснять, только устану». Поэтому молчит, хотя помощь ей нужна.\n\nСлайд 4: Подруга говорит «ничего не нужно» на ваше «обращайся, если что». Чтобы обратиться, ей придется самой организовать помощь. Решить, что купить, когда встретиться, сколько у вас времени. Бл*н, даже помощь приходится организовывать.\n\nСлайд 5: Подруга согласилась встретиться, потом отменила. Когда договаривались, ей казалось, что получится. Сегодня душ и чистая одежда уже требуют сил. А еще она думает: «Приеду и буду сидеть молча. Испорчу ей вечер». После отмены ей стыдно написать вам снова.\n\nСлайд 6: Вы принесли подруге любимую еду, а она почти не обрадовалась. При депрессии привычные приятные вещи могут перестать радовать. Она замечает вашу заботу, но улыбка не получается. И тут же думает: «Она старалась, а я даже нормально спасибо сказать не могу». Ох, еще и за это себя ругать.\n\nСлайд 7: Подруга раздражается на советы сходить погулять или посмотреть хороший фильм. Она уже слышала их и могла пробовать. Когда ей по-прежнему плохо, очередной совет звучит как «ты еще недостаточно старалась». Прогулка может поддержать. Заменить лечение депрессии она не может.\n\nСлайд 8: Предложите подруге одну конкретную помощь, например привезти готовый ужин. Сразу уточните, что вам не нужно оставаться в гостях. Ей будет проще согласиться, если ради помощи не придется собираться и весь вечер поддерживать разговор.","caption":"Когда близкому плохо, очень хочется получить хоть какой-то отклик. Тишину тяжело выдерживать, даже когда понимаешь, почему человек молчит.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40.\nОтправьте тому, кто хочет поддержать подругу и боится навредить.","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":5,"interesno":4,"snyat":null,"ai_markers":[],"worst":"«Поддержка тоже может стать заданием». Суховатый тезис: следующие бытовые подробности объясняют это живее.","best":"Бл*н, даже помощь приходится организовывать.","verdict":"publikovat","why":"Узнаваемые ситуации дают новое понимание: помощь может требовать сил, которых у подруги сейчас нет. Есть конкретный способ облегчить ей жизнь — карусель хочется сохранить и переслать."},"guard":[{"rule":"dvoetochiya","quote":"Вы пишете подруге: «Как ты сегодня?» Ответа нет. Потом отп | равляете: «Я переживаю». Она читает и откладывает | онимает"},{"rule":"ostorozhno","quote":"5 оговорок: бывает, может, могут"}],"cut":["Это можно назвать усталостью от решений."],"before":null},{"id":"r_mif_2","author":"Юлия","format":"post","asked":"post","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"«Просто перестань думать о плохом».\n\nАга, сейчас. Если бы это работало, ты бы давно перестала.\n\nОн долго не отвечает. Ты уже думаешь: «Я что-то не то сказала?» Потом вспоминаешь, что надо мыслить позитивно. «Он занят. Все нормально». На минуту легче. Потом снова хочется посмотреть, прочитал ли.\n\nИ тут ты начинаешь ругать себя: «Ну что я опять? Сама себе весь вечер испортила».\n\nБыло страшно, что он отдаляется. Добавилось: «Со мной вообще что-то не так».\n\nВот спасибо за совет. Теперь еще и виновата.\n\nТревожная мысль приходит без твоего согласия. Ты ведь не садишься вечером с планом: «Так, сегодня буду бояться, что меня разлюбили». Требовать от себя, чтобы таких мыслей вообще не было, бесполезно. Будешь только проверять: «Я уже успокоилась? Почему опять думаю об этом?»\n\nПри этом ты отвечаешь за свои поступки. Можно тревожиться и все-таки не отправлять десятое сообщение с вопросом, почему он молчит.\n\nТебе не нужно сначала полностью успокоиться, чтобы решить, как поступить.","caption":"","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":[],"worst":"При этом ты отвечаешь за свои поступки. — Резкий переход от понимающего разговора к назиданию.","best":"Ты ведь не садишься вечером с планом: «Так, сегодня буду бояться, что меня разлюбили».","verdict":"publikovat","why":"Узнаваемая сцена с непрочитанным сообщением удерживает внимание. Есть полезное открытие: попытка запретить тревогу добавляет вину, а выбирать поступки можно и без полного спокойствия — это хочется сохранить."},"guard":[{"rule":"kancelyarit","quote":"При этом"},{"rule":"rublenye","quote":"«Он занят. Все нормально». На минуту легче."},{"rule":"dvoetochiya","quote":"Он долго не отвечает. Ты уже думаешь: «Я что-то не то сказала?» Потом вспомин | И тут ты начинаешь ругать себя: «Ну что "}],"cut":["Теперь ты переживаешь еще и из-за того, что никак не можешь успокоиться.","Если ты снова испугалась, это еще не значит, что ты сама все испортила."],"before":null},{"id":"r_teen_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Слайд 1: Подросток сидит в комнате и не разговаривает\n\nСлайд 2: Вы стучите к подростку: «Как день прошел?» Он отвечает: «Нормально», и снова закрывает дверь. Вы ведь просто хотели поговорить. Но если прошлый разговор закончился обсуждением оценок, он уже ждет продолжения: «А что по математике?»\n\nСлайд 3: На любой вопрос подросток отвечает одним словом. Когда за каждым ответом идут еще пять вопросов, он старается дать вам поменьше поводов. Даже обычное «гуляли» приходится объяснять: с кем, где, почему так долго.\n\nСлайд 4: Вы видите, что подросток расстроен, а он говорит: «Ничего не случилось». Возможно, он уже представляет ваши советы или звонок учителю. Рассказать о неприятности для него значит запустить целую историю, которую потом трудно остановить.\n\nСлайд 5: Подросток уходит к себе сразу после школы. Если на кухне его обычно встречают вопросами о домашке, комната становится местом, где можно какое-то время ничего не объяснять. И ведь вы еще даже спросить не успели. А он уже ждет проверки.\n\nСлайд 6: На ваше «Я же помочь хочу» подросток раздражается: «Оставь меня». Такая резкость обижает. Но если помощь каждый раз означает долгий разбор его ошибок, он заранее напрягается. Вы усиливаете расспросы, потому что волнуетесь. Он еще быстрее заканчивает разговор.\n\nСлайд 7: Когда подросток все-таки что-то расскажет, выслушайте его до конца и спросите, нужна ли ему ваша помощь. С советами стоит подождать. Ему важно убедиться, что после разговора с вами он сможет сам решать, что делать дальше.","caption":"Вопросы про школу нужны. Но если каждый разговор начинается с них, подростку трудно понять, что вам интересно что-то еще. Что вы знаете о том, что его сейчас радует?\n\nМеня зовут Михаил, я психолог, помогаю родителям подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов. Здесь говорим о том, как понимать подростков и общаться с ними.","judge":{"zhivo":3,"zacep":2,"ponyatno":5,"polza":4,"interesno":3,"snyat":null,"ai_markers":[],"worst":"Подросток сидит в комнате и не разговаривает — просто обозначение темы, без неожиданности или родительской мысли, которая остановит в ленте.","best":"И ведь вы еще даже спросить не успели. А он уже ждет проверки.","verdict":"popravit","why":"Есть полезное объяснение: подросток заранее ждет расспросов и вмешательства, даже когда родитель просто хочет поговорить. Но слайды 2–6 повторяют эту мысль почти без развития: стоит сократить повторы и усилить первый слайд, чтобы хотелось долистать."},"guard":[{"rule":"dvoetochiya","quote":"Вы стучите к подростку: «Как день прошел?» Он отвечает | : «Нормально», и снова закрывает дверь. В | уждением оценок, он"}],"cut":["Тут уже заранее думаешь, что безопаснее сказать.","Поэтому он оставляет все при себе."],"before":null},{"id":"r_zlost_1","author":"Юлия","format":"post_tg","asked":"post_tg","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"Тебя подвели, ты еще и извинилась\n\nЕсли ты опять написала «да ничего страшного», когда человек отменил встречу за десять минут до выхода, а потом весь вечер ругала себя за испорченное настроение, у меня вопрос. Того, кто тебя подвел, тоже надо утешить? Ему ведь неудобно получилось.\n\n«Но у него были причины. Чего я завелась?»\n\nКонечно, были. У тебя тоже были причины расстроиться: ты освободила вечер, собралась и хотела увидеться. Справку о том, что встреча была тебе важна, получать нигде не нужно.\n\nТы так быстро начинаешь оправдывать другого, что собственную злость даже не успеваешь заметить. Уже ищешь, где сама виновата: слишком многого ждала, слишком близко приняла, зря вообще настроилась.\n\nЯ бы здесь задержалась на слове «слишком». Откуда ты знаешь, сколько тебе положено расстраиваться?\n\n«Не устраивай сцен». Можно сказать, что тебе неприятно, обычным голосом.\n\n«Будь умнее». Обычно после этой фразы именно тебе предлагается промолчать. Очень удобно получилось: один подвел, другая должна проявить мудрость.\n\nА после «ты слишком остро реагируешь» ты уже обсуждаешь, что с тобой не так. Про отмененную встречу все как будто забыли.\n\nЕсли ты привыкла слышать такое, злиться становится страшно. Вдруг тебя сочтут тяжелой, капризной, неблагодарной? Проще сразу сказать себе: «Сама виновата».\n\nВ следующий раз, когда тебя подведут, не спеши извиняться за свое недовольство. Можно понимать чужие причины и все равно злиться на то, как с тобой поступили.","caption":"","judge":{"zhivo":4,"zacep":5,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":["В следующий раз, когда тебя подведут, не спеши извиняться за свое недовольство."],"worst":"В следующий раз, когда тебя подведут, не спеши извиняться за свое недовольство. — Стандартное наставление в конце, слабее конкретных наблюдений выше.","best":"Очень удобно получилось: один подвел, другая должна проявить мудрость.","verdict":"publikovat","why":"Узнаваемая ситуация и живая ирония удерживают внимание. Есть что переслать подруге: пока ты обсуждаешь свою «слишком острую» реакцию, чужой поступок уже исчез из разговора."},"guard":[{"rule":"dvoetochiya","quote":"и. У тебя тоже были причины расстроиться: ты освободила вечер, собралась и хотела | ь заметить. Уже ищешь, где сама вино"}],"cut":["Все, уже достаточно.","Само недовольство еще никому не причиняет вреда."],"before":null},{"id":"r_mama_1","author":"Ольга","format":"post","asked":"post","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"«Накричала на ребенка. Теперь весь вечер себя жру».\n\nНаказывать себя за злость на ребенка. Это когда он уже спокойно возится с игрушками, а вы все еще вспоминаете, как он испугался вашего голоса. Хотели сесть попить чай, но какой тут чай. «Как я вообще могла?»\n\nЭто когда муж предлагает погулять с малышом, чтобы вы отдохнули, а вы отказываетесь. «Я и так сегодня ужасная мать. Еще и спихну его». И остаетесь дома, хотя вас уже бесит даже звук мультика.\n\nЭто когда ребенок приходит обниматься, вы прижимаете его к себе и думаете: «Бедный. Ему бы другую маму». Он к вам пришел, ему хочется побыть с вами. А вы уже мысленно нашли ему кого-то получше.\n\nВы как будто должны теперь помучиться, чтобы доказать себе: вам не похуй. Вы любите ребенка. Вам стыдно. Вы все поняли и больше так не будете.\n\nБл*дь, еще и отдых после срыва становится чем-то, чего вы недостойны.\n\nНапряжение никуда не делось, и к следующему укладыванию вы опять на пределе.\n\nЗа крик стоит попросить у ребенка прощения.","caption":"","judge":{"zhivo":4,"zacep":5,"ponyatno":5,"polza":4,"interesno":5,"snyat":null,"ai_markers":["Вы любите ребенка. Вам стыдно. Вы все поняли и больше так не будете."],"worst":"«За крик стоит попросить у ребенка прощения.» — сухой, ожидаемый совет; обрывает разговор о том, как мама лишает себя отдыха.","best":"«Я и так сегодня ужасная мать. Еще и спихну его».","verdict":"publikovat","why":"Узнаваемые подробности и сильное открытие: отказываясь от отдыха в наказание за крик, мама остается на пределе перед следующим укладыванием. Хочется переслать подруге; суховатый финал не перечеркивает текст."},"guard":[{"rule":"dvoetochiya","quote":"ться, вы прижимаете его к себе и думаете: «Бедный. Ему бы другую маму». Он к вам | ы теперь помучиться, чтобы доказать с"}],"cut":["Но ребенок уже успокоился, а вы продолжаете себя ругать.","Отдых вам тоже нужен, даже если вы сегодня собой очень недовольны."],"before":null},{"id":"r_stud_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: Опять весь день не открывала диплом\n\nРечь: «До сдачи диплома две недели.
