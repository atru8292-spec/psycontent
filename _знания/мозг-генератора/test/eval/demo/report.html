<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Прогон демо (тексты из банка, оценки ненастоящие)</title>
<style>
:root{--bg:#F7F3EC;--ink:#2E2A45;--muted:#6B6680;--acc:#5B4FA0;--soft:#E7E2F2;--sage:#8F9D68;--line:#E4DED2;--bad:#B4533F}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;z-index:2}
h1{font-size:18px;margin:0 0 8px}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button,input{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;color:var(--ink)}
button{cursor:pointer}button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.meta{font-size:12px;color:var(--muted)}.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:8px;background:var(--soft);margin-right:4px}
.v-publikovat{background:#E3EAD2}.v-popravit{background:#F3E7C9}.v-v_korzinu{background:#F2D6CF}
pre{white-space:pre-wrap;font:inherit;margin:0;max-height:420px;overflow:auto;border-left:3px solid var(--soft);padding-left:10px}
.scores{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}.scores span{border:1px solid var(--line);border-radius:8px;padding:1px 6px}
.why{font-size:13px;color:var(--muted)}.mk{font-size:12px;color:var(--bad)}.cut{font-size:13px;color:var(--muted)}.cap{font-size:14px;background:var(--soft);border-radius:10px;padding:8px 10px;white-space:pre-wrap}.cut s{color:var(--bad)}
.rate{display:flex;gap:6px;align-items:center}.rate input{flex:1;min-width:0}
.hidden{display:none}
</style></head><body>
<header><h1>Прогон демо (тексты из банка, оценки ненастоящие)</h1><div class="bar">
<select id="f"><option value="">все форматы</option></select>
<select id="v"><option value="">все вердикты</option><option value="publikovat">публиковать</option><option value="popravit">поправить</option><option value="v_korzinu">в корзину</option><option value="mine">я еще не оценила</option></select>
<span id="cnt" class="meta"></span>
<button id="dl">Скачать мои оценки</button></div></header>
<main id="m"></main>
<script>
const DATA=[{"id":"k_nabor_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"uznavanie","topic":"виды усталости, от которых отпуск не спасает","text":"Дети, у которых было сложное детство, очень много думают. Про таких говорят: живут в своей голове. Но я добавлю одну вещь, как психолог, который много работает с такими людьми. Если человек очень много думает, скорее всего, он очень мало чувствует. Потому что он научился прятаться от всего пиздеца в голову. Анализировал обстановку дома, настроение родителей. Там было безопасно, только там был контроль. А чувствовать было больно, страшно и одиноко. Так что бесконечное обдумывание часто способ не встречаться с тревогой. В следующий раз, когда заметишь, что опять жуешь эту мыслительную жвачку, спроси себя по-доброму: котенок, а какое чувство я сейчас не хочу чувствовать? Если узнал себя, в описании есть еще.","caption":"","judge":{"zhivo":2,"zacep":3,"ponyatno":4,"polza":5,"interesno":4,"snyat":null,"ai_markers":["пример маркера"],"worst":"демо","best":"","verdict":"publikovat","why":"Демо-оценка, не настоящая."},"guard":[{"rule":"dvoetochiya","quote":"о, очень много думают. Про таких говорят: живут в своей голове. Но я добавлю одну | лительную жвачку, спроси себя по-доб"}],"hook":"golos_chitatelya","cut":[],"before":null},{"id":"k_nabor_2","author":"Михаил","format":"carousel","asked":"carousel","intent":"uznavanie","topic":"какие бывают внутренние критики","text":"Умное говно, которое вам подают под соусом психологии: «ты сама притянула себе такого мужика». Давайте так. Мы никого не притягиваем. Мы просто живем свою жизнь, мы не управляем потоками вселенной и не знаем, кто к нам придет. Самое опасное в этой фразе, что она заставляет копаться в себе в поисках причины чужого говна. А почему я его притянула? А что со мной не так? Может, у меня с мамой плохие отношения? Стоп. В ваших руках другое. Оставить этого человека в жизни или вышвырнуть его нафиг. Сколько времени вы позволили ему остаться и на каких условиях.","caption":"","judge":{"zhivo":3,"zacep":4,"ponyatno":5,"polza":2,"interesno":5,"snyat":null,"ai_markers":[],"worst":"демо","best":"","verdict":"popravit","why":"Демо-оценка, не настоящая."},"guard":[],"hook":"golos_chitatelya","cut":[],"before":null},{"id":"k_perevod_1","author":"Юлия","format":"carousel","asked":"carousel","intent":"perevod_repliki","topic":"«у меня низкая самооценка»: как это выглядит в обычном дне","text":"Если вы не можете перестать листать рилсы и заняться делом, я как клинический психолог хочу терапевтически спросить. А может быть, вы... ну... заебались? А? Я понимаю, вы уже записали себя в конченые. Но вдруг есть маленький шанс, что вы в ахуе от нагрузки, и мозг пытается залипнуть хоть на чем-то приятном. А? Думаете все-таки, что ленивая скотина? Записала. Ну и все же предлагаю попробовать выключить. Нет, не рилсы, не пугаемся. Бесконечный поток требований к себе. Как вам идея? Вдруг дело в нем. Так, навскидку.","caption":"","judge":{"zhivo":4,"zacep":5,"ponyatno":2,"polza":3,"interesno":2,"snyat":null,"ai_markers":[],"worst":"демо","best":"","verdict":"v_korzinu","why":"Демо-оценка, не настоящая."},"guard":[],"hook":"golos_chitatelya","cut":[],"before":null},{"id":"k_perevod_2","author":"Ольга","format":"carousel","asked":"carousel","intent":"obyasnenie","topic":"границы, созависимость, выгорание: как эти слова выглядят дома и на работе","text":"Иногда нужно очень сильно охуеть, чтобы жизнь начала меняться. Охуеть это когда ты просыпаешься и видишь все как есть, и тебе противно, потому что ты наконец поняла правду. Больно, неприятно, но с этого все и сдвигается. Охуеть это когда видишь свой вклад: ты это выбирала, терпела и ничего не делала. Хорошая новость в том, что раз когда-то ты это выбрала, теперь можешь от этого отказаться. Охуеть это когда перестаешь ждать, что он изменится, деньги упадут с неба, проблемы решатся сами. Охуеть это когда выбираешь себя, даже если другим от этого неудобно. Эгоизм тут ни при чем. Ты просто вспомнила, что ты тоже есть.","caption":"","judge":{"zhivo":5,"zacep":2,"ponyatno":3,"polza":4,"interesno":3,"snyat":null,"ai_markers":["пример маркера"],"worst":"демо","best":"","verdict":"publikovat","why":"Демо-оценка, не настоящая."},"guard":[],"hook":"golos_chitatelya","cut":[],"before":null},{"id":"k_golos_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"uznavanie","topic":"что думает человек, который всем отвечает «все нормально»","text":"Выбирай доброго. Если ты сейчас в поиске, ходишь на свидания, у меня для тебя один совет. Выбирай доброго человека. Самый яркий и самый остроумный пусть подождут. И я не про того, кто всегда удобный и на все согласен. Я про того, кто умеет быть внимательным, заботится, замечает и не хочет делать больно даже в ссоре. Сарказм, дерзость, флирт это весело, как смотреть на фейерверк. Но когда станет сложно, когда ссора, когда стресс, сарказм будет совсем не в кассу. Фейерверк впечатляет. А когда темно и холодно, хочется сидеть у костра, в тепле. Подписывайся, тут про отношения без сказок.","caption":"","judge":{"zhivo":2,"zacep":3,"ponyatno":4,"polza":5,"interesno":4,"snyat":null,"ai_markers":[],"worst":"демо","best":"","verdict":"popravit","why":"Демо-оценка, не настоящая."},"guard":[],"hook":"golos_chitatelya","cut":[],"before":null},{"id":"k_golos_2","author":"Юлия","format":"carousel","asked":"carousel","intent":"podderzhka","topic":"тревога в три часа ночи","text":"Когда люди говорят, что им не нужен психолог, они чаще всего добавляют: «я и так про себя все знаю и понимаю». Да, я тоже когда-то была проработанная, все прекрасно понимала. Вы можете вбить свой запрос в поиск, и он подберет вам вот столько книг. Как стать богаче, как построить отношения, как стать уверенней. Спросите чат-бота, он вам столько объяснений выдаст, что не унесете. И что, что-то поменялось? Проблема давно не в том, что мы чего-то не знаем. Мы не умеем чувствовать и боимся живого контакта, потому что в нем уязвимо и больно. А меняется что-то как раз там, в живом разговоре с человеком. Иначе так и будете говорить: головой я все понимаю, а в жизни ничего не меняется. Приходите в терапию, запись по ссылке в шапке профиля.","caption":"","judge":{"zhivo":3,"zacep":4,"ponyatno":5,"polza":2,"interesno":5,"snyat":null,"ai_markers":[],"worst":"демо","best":"","verdict":"v_korzinu","why":"Демо-оценка, не настоящая."},"guard":[{"rule":"zhargon","quote":"проработанная"},{"rule":"dvoetochiya","quote":"нужен психолог, они чаще всего добавляют: «я и так про себя все знаю и понимаю». | с человеком. Иначе так и будете говор"}],"hook":"golos_chitatelya","cut":[],"before":null},{"id":"k_mysl_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"poziciya","topic":"что я поняла про отношения за годы работы психологом","text":"Я психолог, и это не помешало мне обосраться. Поделюсь историей своего некрасивого успеха. В теории я знаю, что любой рост идет вместе со стыдом и страхом. Только знание не освобождает от того, чтобы все это прожить. С начала месяца у меня начало получаться то, к чему я шла. Как думаете, я обрадовалась? Да, конечно. Но честно, страха и стыда оказалось больше. Мне не хотелось никому рассказывать, начались бессонницы, а вчера я просто плакала от того, что у меня получается. Раньше в этом месте я сдувалась и возвращалась в точку ноль. Сейчас мне до одури страшно, мне стыдно, но я иду дальше. И для меня это большая победа.","caption":"","judge":{"zhivo":4,"zacep":5,"ponyatno":2,"polza":3,"interesno":2,"snyat":null,"ai_markers":["пример маркера"],"worst":"демо","best":"","verdict":"publikovat","why":"Демо-оценка, не настоящая."},"guard":[],"hook":"golos_chitatelya","cut":[],"before":null},{"id":"k_mysl_2","author":"Юлия","format":"carousel","asked":"carousel","intent":"podderzhka","topic":"слова для той, кто устала быть сильной","text":"Он скинул тебе смешной рилс, а ты пролистала и даже реакцию не поставила. Вроде мелочь, да? Но если такие мелочи повторяются, они влияют на отношения намного сильнее, чем кажется. Отношения держатся на мелочах, которыми вы друг друга окликаете. Тот самый смешной рилс. Фотка заката из окна. Сообщение «как ты там». В них всегда есть что-то непроговоренное: я про тебя помню, я тебя вижу, ты мне важна. Понятно, ситуации бывают разные, мы не идеальны. Но если раз за разом никто не откликается, внутри появляется: я не интересна, я одна в этих отношениях. Отношения разрушают маленькие вещи, когда тебя раз за разом не замечают. Так что не жадничай на «ахаха» в ответ на рилс.","caption":"","judge":{"zhivo":5,"zacep":2,"ponyatno":3,"polza":4,"interesno":3,"snyat":null,"ai_markers":[],"worst":"демо","best":"","verdict":"popravit","why":"Демо-оценка, не настоящая."},"guard":[{"rule":"zagotovka","quote":"Вроде мелочь"},{"rule":"dvoetochiya","quote":"В них всегда есть что-то непроговоренное: я про тебя помню, я тебя вижу, ты мне в | никто не откликается, внутри появляе"}],"hook":"golos_chitatelya","cut":[],"before":null}];const KEY='eval-demo';
let R={};try{R=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}};
const V={publikovat:'публиковать',popravit:'поправить',v_korzinu:'в корзину'};
const fs=[...new Set(DATA.map(d=>d.format))];const fsel=document.getElementById('f');
fs.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;fsel.appendChild(o)});
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const f=fsel.value,v=document.getElementById('v').value;const m=document.getElementById('m');m.innerHTML='';let n=0;
DATA.forEach(d=>{const j=d.judge||{};if(f&&d.format!==f)return;if(v==='mine'&&R[d.id]&&R[d.id].mark)return;if(v&&v!=='mine'&&j.verdict!==v)return;n++;
const c=document.createElement('div');c.className='card';const r=R[d.id]||{};
c.innerHTML='<div class="meta"><b>'+esc(d.id)+'</b> · '+esc(d.author)+' · '+esc(d.format)+(d.asked!==d.format?' (просили '+esc(d.asked)+')':'')+' · '+esc(d.intent)+'<br>'+esc(d.topic)+'</div>'
+(d.error?'<div class="mk">Ошибка: '+esc(d.error)+'</div>':'')
+(j.verdict?'<div><span class="tag v-'+j.verdict+'">'+V[j.verdict]+'</span><span class="why">'+esc(j.why)+'</span></div>':'')
+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'
+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')
+((d.cut||[]).length?'<div class="cut">Вычеркнула: '+d.cut.map(x=>'<s>'+esc(x)+'</s>').join(' ')+'</div>':'')
+((j.ai_markers||[]).length?'<div class="mk">'+j.ai_markers.map(x=>'«'+esc(x)+'»').join(' ')+'</div>':'')
+(j.worst?'<div class="why">Худшее: '+esc(j.worst)+'</div>':'')
+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')
+'<div class="rate"><button data-m="ok" class="'+(r.mark==='ok'?'on':'')+'">Живо</button><button data-m="bad" class="'+(r.mark==='bad'?'on':'')+'">Не живо</button><input placeholder="что не так" value="'+esc(r.note||'')+'"></div>';
c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
c.querySelector('input').onchange=e=>{R[d.id]={...(R[d.id]||{}),note:e.target.value};save()};
m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
fsel.onchange=render;document.getElementById('v').onchange=render;
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,ratings:R},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ocenki-demo.json';a.click()};
render();
</script></body></html>
