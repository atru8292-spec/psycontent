<script>
const DATA=[{"id":"r_mif_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: За что я плачу психологу?\n\nРечь: «Зачем платить психологу? Я и с другом могу поговорить». Да, можете. И хорошо, если есть с кем. Только на консультации ваши слова еще и проверяют.\n\nДопустим, вы говорите: «Друзья встретились без меня. Я им надоел». И уже решили больше им не писать.\n\nКивать тут действительно мало. Психолог спросит: откуда вы знаете, что надоели? Вам это сказали? Или вы увидели фотографию и сами все решили?\n\nВот это уже неприятный вопрос. Вы пришли рассказать, какие друзья плохие, а выясняется, что успели поссориться с ними у себя в голове.\n\nРешать, стоит ли выяснить у друзей, что произошло, будете вы.","caption":"На консультации можно спросить, зачем психолог задает конкретный вопрос.\n\nЯ Михаил, психолог, работаю со взрослыми, которые еще ни разу не были на консультации.\nОтправьте тому, кто сомневается, есть ли смысл идти к психологу.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Допустим, вы говорите: «Друзья встретились без меня. Я им надо | тут действительно мало. Психолог спросит: откуда вы зна"}],"cut":["Психолог помогает разобраться, на чем держится ваш вывод.","Понимать, что вы вместе делаете, важно и для вас."],"before":null},{"id":"r_vopros_1","author":"Ольга","format":"reels_otvet","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Зачем психолог, если у меня есть подруги?\nРечь: Зачем мне психолог, если у меня есть подруги? Чтобы говорить даже о том, что вы скрываете ради вашей дружбы. Вот вы расстались с мужчиной. Подруга слушала вас до двух ночи, потом приезжала, когда вам было хреново. Вместе решили: все, хватит. А через неделю вы к нему вернулись. И теперь перед звонком подруге думаете: «Только бы про него не спросила». Блядь, еще и здесь приходится выкручиваться. В терапии вам не приходится учитывать, сколько психолог уже потратила на вас сил. Можно сказать: «Я снова к нему вернулась» и разбираться, что вас туда тянет.","caption":"Подруга тоже может спокойно принять ваше возвращение. Но даже с ней бывает стыдно признаться, что вы снова сделали то, на что сами вчера ругались.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nОтправьте той, кто стесняется снова рассказать подруге про своего бывшего.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"а, когда вам было хреново. Вместе решили: все, хватит. А через неделю вы к нему в | . И теперь перед звонком подруге дум"}],"cut":["Подруга вам помогала, переживала.","Вы боитесь ее расстроить и выглядеть дурой."],"before":null},{"id":"r_post_1","author":"Юлия","format":"post","asked":"post","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Он весь вечер не пишет, и ты проверяешь телефон даже по дороге из комнаты на кухню.\n\nВ голове уже: «Я ему вообще нужна?» Хотя днем вы нормально общались и никто ни с кем не ссорился.\n\nНаписать самой? Ты даже открываешь чат. Но тут же: «Вчера я первая написала. Сегодня пусть он». Закрываешь. И ждешь дальше.\n\nТебе важно, чтобы он сам вспомнил о тебе. Без подсказки. Тогда можно будет хоть немного успокоиться: «Значит, тоже хочет со мной поговорить».\n\nЕсли напишешь сама и он ответит, останется вопрос: «А без моего сообщения он бы вообще написал?» Ты хочешь убедиться, что ему нужна, и засчитываешь только то, что он сделал сам.\n\nПриходит уведомление. Берешь телефон, там сообщение из общего чата. Да что ж такое, еще и они сегодня разговорились.\n\nА потом он наконец пишет. Ты рада, но сразу отвечать уже не хочется: «Я тут весь вечер ждала, а ты только сейчас?» Он еще даже не знает, что ты успела расстроиться и разозлиться.\n\nТак каждый вечер без его сообщения становится проверкой ваших отношений. И даже после хорошего разговора завтра снова хочется убедиться, что он про тебя помнит.\n\nЕсли ты постоянно ждешь, что он напишет первым, скажи ему, что тебе важно тоже получать от него сообщения, без твоей инициативы. Он вполне может считать, что у вас все хорошо, пока ты каждый вечер гадаешь, интересна ли ему вообще.","caption":"","judge":null,"guard":[{"rule":"skrytoe_protivopostavlenie","quote":"не знает, что ты успела расстроиться и разозлиться.\n\nТак"},{"rule":"rublenye","quote":"Сегодня пусть он». Закрываешь. И ждешь дальше."},{"rule":"dvoetochiya","quote":"В голове уже: «Я ему вообще нужна?» Хотя днем вы норм | самой? Ты даже открываешь чат. Но тут же: «Вчера я первая написа"}],"cut":["Вот поэтому начать разговор так трудно."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Вас хвалят, а вам неловко\n\nКоллега благодарит вас за помощь, а вы отвечаете: «Да там дел на пять минут», и сразу меняете тему.\n\nВы быстро разобрались. Получилось легко. Значит, хвалить особенно не за что.\n\nЯ бы здесь спросил: а почему пять минут обесценивают все, что вы умеете? Вы ведь потратили их на задачу, с которой другой человек пришел к вам за помощью.\n\nЕсть такая ловушка: все, что вы уже освоили, вы перестаете считать настоящим умением. «Это же очевидно». «Тут любой разберется». «Я просто знаю, куда нажать».\n\nЗамечательно. Даже знание, куда нажать, себе не засчитали.\n\nВспомните первые недели на работе. Вы могли полчаса искать нужный документ и уточнять, кому его отправить. Сейчас делаете это между делом. Но в голове никакой прибавки: просто задача теперь кажется слишком простой, чтобы считать ее доказательством своей компетентности.\n\nА вот незнакомая задача сразу идет в счет: «Ну все, сейчас выяснится, что я ничего не понимаю».\n\nИ получается, что вы каждый месяц узнаете больше, а уверенности столько же. Все знакомое вы уже исключили из оценки. Оцениваете себя только по тому, чего пока не знаете.\n\nКогда в следующий раз захочется сказать «это любой сможет», вспомните себя в первый месяц на этой работе. Вы тогда смогли бы?","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"благодарит вас за помощь, а вы отвечаете: «Да там дел на пять минут», и сразу мен | Я бы здесь спросил: а почему пять ми"}],"cut":["Так вы отмахиваетесь от того самого умения, которого, по вашим ощущениям, у вас нет.","Если пришлось учиться, это умение вполне можно учитывать, даже когда вы давно им пользуетесь."],"before":null},{"id":"r_car_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Слайд 1: Подруга в депрессии и перестала отвечать вам.\n\nСлайд 2: Вы пишете подруге: «Давай погуляем, тебе станет легче». Она молчит. Вы хотели помочь.\n\nНо ей сейчас трудно даже помыть голову. Чтобы встретиться, придется одеться, выйти из дома, поддерживать разговор. И выслушать вопросы, почему прогулка ее не развеселила.\n\nСлайд 3: Подруга читает сообщения и молчит.\n\nОтветить тоже бывает тяжело. Особенно когда надо объяснить, как дела, а сказать получается только «все так же».\n\nОтсутствие ответа само по себе ничего не говорит о вашей дружбе. Сообщение без вопроса в конце сейчас может оказаться легче.\n\nСлайд 4: Подруга снова отменяет встречу.\n\nКогда договаривались, она правда рассчитывала прийти. Утром встала, дошла до ванной и поняла, что больше ничего не может.\n\nПосле отмены ей еще и стыдно: «Опять подвела. Лучше вообще ничего не обещать».\n\nСлайд 5: Подруга соглашается с советами, но ничего не делает.\n\n«Да, надо наладить сон». «Да, попробую гулять».\n\nЗнать, что могло бы помочь, и суметь это сделать сейчас для нее две разные задачи. Новые советы добавляют ЕЩЕ одну: потом объяснять вам, почему она снова не справилась.\n\nСлайд 6: Подруга смеется с вами, а потом говорит, что ей по-прежнему плохо.\n\nПри депрессии бывают минуты, когда человек смеется и отвлекается. По одному такому вечеру нельзя понять, что он уже поправился.\n\n«Ты же вчера была веселая» заставляет ее доказывать, что ей действительно тяжело.\n\nСлайд 7: Подруга начинает отвечать: «Все нормально».\n\nОна заметила, что после честного ответа начинается разговор о том, что ей нужно сделать. Сил на этот разговор тоже нет.\n\nБл*ть, еще и отчитываться о прогулках. Проще сказать «нормально» и остаться со всем одной.\n\nСлайд 8: Предложите подруге одну конкретную помощь: привезти готовую еду и оставить у двери, если она согласна.\n\nБез обязательной встречи и разговора о самочувствии. Пусть ей не придется развлекать вас в благодарность за ужин.","caption":"При депрессии нужна профессиональная помощь. Дружеская поддержка тоже важна, но отвечать за выздоровление подруги вам не нужно.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40 лет.\nПодписывайтесь, если хочется еще таких разговоров. Здесь я пишу об отношениях и о том, что с нами происходит.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Вы пишете подруге: «Давай погуляем, тебе станет легче». Он | После отмены ей еще и стыдно: «Опять подвела. Лучше вообще "}],"cut":["При депрессии обычные дела могут требовать огромных усилий.","Так появляется усталость от самой помощи."],"before":null},{"id":"r_mif_2","author":"Юлия","format":"post","asked":"post","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"«Ты сама себя накручиваешь. Просто перестань».\n\nЕсли бы это работало, ты бы давно перестала. Уж поверь, желания у тебя хватает.\n\nОн долго не отвечает. Ты уже несколько раз открыла переписку, вспомнила вчерашний разговор и думаешь: «Я что-то лишнее сказала?»\n\nА после совета «не накручивай» появляется еще одна забота. Теперь надо следить, чтобы ты даже в голове ничего лишнего не подумала. «Опять начинаю. Ну что со мной такое».\n\nПрекрасно, теперь ты еще и виновата в том, что тебе страшно.\n\nТы можешь часами ругать себя за тревогу и все это время продолжать тревожиться.\n\nПервая тревожная мысль появляется без твоего согласия. Ты отвечаешь за то, что делаешь дальше. Написать человеку десять сообщений с вопросом «ты точно не злишься?» или дождаться ответа. Обвинить его или сказать, что тебя беспокоит.\n\nМожно пока тревожиться и оставить переписку в покое. За каждую мысль, которая пришла тебе в голову, ты отвечать не обязана.","caption":"","judge":null,"guard":[],"cut":["Получается, тебе страшно, а пожалеть себя нельзя: сама же устроила.","Не нужно сначала полностью успокоиться, чтобы выбрать, как поступить."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Мама обижается, если вы не звоните каждый день\nРечь: Четыре привычки тех, чья мама обижается, если ей не звонить каждый день.\nПервое. Вы заранее готовите оправдание. Еще даже телефон не взяли, уже решаете, достаточно ли убедительно звучит «задержалась на работе».\nВторое. Звоните, когда вам совершенно нечего сказать. Просто НАДО, иначе завтра выслушивать, какая вы неблагодарная.\nТретье. Не можете спокойно провести вечер с партнером. Смотрите на телефон: мама уже написала «Ты где?». Блядь, опять объяснять, почему вы были в кино.\nЧетвертое. Радуетесь, когда мама не берет трубку. Звонок был, теперь можно спокойно заняться своими делами.\nВы вообще хотели сегодня с ней поговорить или вам нужно было избежать ее обиды?","caption":"Даже после сорока минут разговора можно услышать: «Ну ладно, беги, тебе же некогда». И завтра снова звонить с ощущением, что вчера маме чего-то недодали.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nЕсли узнали себя, напишите в комментариях свой пункт.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"и вечер с партнером. Смотрите на телефон: мама уже написала «Ты где?». Блядь, опя | ле сорока минут разговора можно услы"}],"cut":[],"before":null},{"id":"r_men_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Срываетесь на детей, потом ругаете себя\nРечь: Четыре признака для отцов, которые срываются на детей, а потом себя ругают.\nПервое. Про обиду вам трудно говорить. Начальник унизил, вы промолчали. Дома ребенок разлил сок, и тут вы уже высказались.\nВторое. Испуг быстро превращается в крик. Ребенок потерялся в магазине, нашелся, вы его отчитываете. Сказать «я за тебя испугался» почему-то труднее.\nТретье. Даже усталость приходится оправдывать. «Другие справляются». Отлично, теперь еще и уставать стыдно.\nЧетвертое. Детские слезы особенно злят. В голове: «Я же терплю. Почему ему можно?»\nИ ребенок получает крик, хотя вы сами сейчас едва справляетесь.","caption":"После срыва отец может молча помогать ребенку с уроками, надеясь так помириться. Ребенок при этом все еще гадает, папа на него злится или уже нет.\nЯ Михаил, психолог, работаю с мужчинами от 30 до 45 лет, в том числе с отцами.\nЕсли узнали себя, можете написать в комментариях свой пункт.","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"}],"cut":["Если вам стыдно признаться, что больно или страшно, злиться оказывается проще."],"before":null},{"id":"r_vopros_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: «Я даже не знаю, что рассказывать»\nПерсонажи: А это клиентка на первой сессии, Б это психолог\nА: Я впервые у психолога. Даже не знаю, что рассказывать.\nБ: Что сейчас приходит в голову?\nА: Что вы ждете, а я ничего сказать не могу.\nБ: Я могу подождать.\nА: Вы же решите, что я какая-то глупая.\nБ: Ты боишься, что я тебя осужу?\nА: Конечно. Я даже дома репетировала, как все объяснить.\nБ: Ох, сколько подготовки.\nА: И все забыла. Теперь сижу и извиняюсь.\nБ: Перед кем ты еще так извиняешься?\nА: Перед всеми, наверное. Если сразу понятно объяснить не получается.\nБ: Что они делают, когда не понимают?","caption":"На первой встрече ты тоже можешь задавать вопросы психологу. Например, как устроена работа и что делать, если о чем-то пока трудно говорить.\nЯ Юлия, психолог. Помогаю тем, кто впервые собирается на терапию.\nНапиши в комментариях «впервые», если пока присматриваешься.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_money_1","author":"Ольга","format":"post","asked":"post","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"Вы уже делаете работу за двоих, а перед разговором о повышении думаете: «Может, еще рано просить?»\n\nХочется доработать до такого момента, когда руководитель сам скажет: «Вам пора поднять зарплату». Тогда и просить не придется. И чувствовать себя наглой тоже.\n\nВот поэтому можно месяцами брать дополнительные задачи.\n\nПотому что отказ в голове звучит совсем паршиво: «Я переоценила себя. Они теперь думают, что я охренела». Простите, охр*нела. Даже в посте приходится себя поправлять.\n\nИ вы снова соглашаетесь подхватить работу коллеги. Потом задерживаетесь, чтобы закончить свою. Начальник пишет «спасибо, вы очень выручили», и вы думаете: «Ну теперь он точно видит».\n\nВидит. Что вам можно поручить еще.\n\nБл*н, как удобно получается. Компания уже пользуется вашей дополнительной работой, а вы все еще доказываете себе, что имеете право за нее попросить денег.\n\nТолько гарантии согласия у вас все равно нет. Даже если вы сделаете больше всех.\n\nЗдесь придется допустить неприятную вещь: руководитель может отказать, а вы при этом можете вполне обоснованно просить повышение. Его ответ зависит и от бюджета, и от того, хочет ли компания вообще увеличивать расходы.\n\nНазначьте отдельный разговор о зарплате с учетом того, сколько работы вы теперь выполняете. Брать еще одну задачу, чтобы окончательно набраться смелости, уже не нужно.","caption":"","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"},{"rule":"dvoetochiya","quote":", а перед разговором о повышении думаете: «Может, еще рано просить?» | о момента, когда руководитель сам скажет: «Вам по"}],"cut":["Вы пытаетесь заслужить прибавку так убедительно, чтобы вам точно не отказали.","Дополнительные задачи дают надежду: еще немного, и разговор станет безопасным."],"before":null},{"id":"r_body_1","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Тем, кто ненавидит свое отражение перед отпуском\nРечь: Это для тебя, если перед отпуском ты примеряешь купальник и думаешь: «Господи, какая я ужасная». Втягиваешь живот, поворачиваешься боком. Уже и ехать никуда не хочется. Ты еще дома, а в голове уже кто то на пляже рассматривает тебя и критикует. И ты начинаешь ругать себя первой. Если твое тело постоянно обсуждали, ты привыкаешь заранее искать, к чему придерутся. Даже когда рядом никого нет. Ну сколько можно, ты ведь просто купальник надела. Ты можешь ехать в отпуск и с животом, который тебе сейчас не нравится.","caption":"Обидно купить купальник, который понравился, и потом выбирать другой, потому что он больше закрывает.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от 20 до 40 лет.\nЕсли захочешь поговорить об этом на консультации, ссылка на запись в шапке профиля.","judge":null,"guard":[],"cut":["Мне хочется, чтобы ты услышала: эта злость на себя понятна, когда годами ждешь чужих замечаний.","Даже свой вкус приходится отодвигать, когда ждешь чужой оценки."],"before":null},{"id":"r_teen_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Слайд 1: Подросток закрылся в комнате и молчит\n\nСлайд 2: Вы стучите в дверь: «Что случилось?» В ответ: «Ничего, отстань». Еще утром разговаривали, а теперь даже смотреть на вас не хочет. Вы волнуетесь и спрашиваете снова. Подросток раздражается сильнее, и уже хочется потребовать, чтобы он открыл дверь.\n\nСлайд 3: Если за рассказом о неприятностях сразу следуют советы и вопросы, подросток заранее ждет долгого разговора. Сказал, что поссорился с другом, и вот уже нужно объяснять, кто виноват и почему. У него на это сейчас нет сил. Проще вообще ничего не рассказывать.\n\nСлайд 4: «Все нормально» помогает быстро закончить разговор. Подростку может быть стыдно, обидно, он сам еще толком не понимает, что произошло. А тут нужно подобрать слова для родителей. Даже заботливый вопрос в такой момент требует сил.\n\nСлайд 5: «Да оставьте меня уже!» особенно больно слышать, когда вы просто хотите помочь. Но после третьего вопроса подросток может ждать, что сейчас придется отвечать на десять следующих. Конечно, обидно: вы пришли поддержать, а получилось почти собеседование.\n\nСлайд 6: Подросток вышел на кухню, взял чай и сел рядом, но ничего не рассказывает. Он уже выбрал побыть с вами. Если сразу спросить: «Ну, теперь объяснишь?», он может уйти обратно. Рядом с родителями тоже хочется посидеть молча, особенно после тяжелого дня.\n\nСлайд 7: Когда подросток сам начнет рассказывать, дайте ему закончить без расспросов и советов. Даже если решение кажется очевидным. Ему важно убедиться, что можно поделиться неприятным и потом спокойно пойти пить чай, без обязательного разбора всей ситуации.","caption":"После резкого «отстань» легко обидеться и самому замолчать до вечера. Родителю тоже бывает нужна пауза, чтобы спокойно вернуться к разговору.\n\nЯ Михаил, психолог, помогаю родителям подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Вы стучите в дверь: «Что случилось?» В ответ | : «Ничего, отстань». Еще утром разговарив | ать на десять следующих. Коне"}],"cut":["Это усталость от объяснений.","Так бывает и у очень заботливых родителей."],"before":null},{"id":"r_vybor_1","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Почему меня тянет к равнодушным?\nРечь: «Он сам мне вообще не пишет. Почему я все равно жду его сообщения?»\n\nВы можете так зацепиться за человека, потому что его внимание стало доказательством: со мной все нормально, меня можно любить.\n\nОн отвечает через сутки, вы решаете больше не писать. Потом приходит «Как дела?», и все. Вы уже улыбаетесь в телефон. Бля, одного сообщения хватило, чтобы вчерашнее «больше никогда» отменилось.\n\nЕсли любовь раньше приходилось заслуживать, это знакомая история: еще немного постараюсь, и меня наконец выберут.\n\nВ голове сразу: «Значит, я все-таки недостаточно хороша».\n\nИ вы продолжаете добиваться человека, рядом с которым постоянно сомневаетесь в себе.","caption":"Даже рассказывая о нем подруге, вы вспоминаете тот единственный вечер, когда он был внимательным. Остальные встречи почему-то пропускаете.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nОтправьте этот ролик той, кому сейчас нужно это услышать.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"у что его внимание стало доказательством: со мной все нормально, меня можно любит | дилось заслуживать, это знакомая ист"}],"cut":["Поэтому так трудно уйти."],"before":null},{"id":"r_zlost_1","author":"Юлия","format":"post_tg","asked":"post_tg","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"«На близких нельзя злиться»\n\nС чего бы? Близкий человек вполне может тебя разозлить. Даже любимый. Даже если он много для тебя сделал.\n\nНо ты говоришь: «Я вообще никогда не злюсь». И тут же объясняешь, почему: мама переживает, муж устал, подруга сейчас в тяжелом периоде.\n\nТы так хорошо понимаешь каждого, что до своей злости просто не доходишь. Уже нашла объяснение, уже пожалела человека. А сама почему весь вечер ходишь с комом в горле?\n\n«Он же не специально».\n\nИ ты начинаешь думать: «Тогда чего я обижаюсь? Глупо как-то». Но человек может задеть тебя без всякого намерения. Рассказать при всех то, что ты просила оставить между вами.\n\n«Ей сейчас и так тяжело».\n\nИ вот ты уже слушаешь резкие замечания и молчишь. Еще и спрашиваешь потом, как она себя чувствует. Твое «со мной так нельзя» придется отложить. У нее же проблемы.\n\n«Будь умнее, не обращай внимания».\n\nОх, сколько всего предлагают проглотить под видом ума. После такой фразы злиться еще и стыдно: «Я что, совсем не умею себя держать?»\n\nПохоже, ты считаешь, что для злости нужно сначала доказать: человек плохой и сделал все нарочно. А если у него нашлось объяснение, ты уже как будто не имеешь права сердиться.\n\nЯ бы вообще убрала этот суд над человеком.\n\nТы отвечаешь за то, что делаешь со своей злостью. Оскорблять человека, пугать его, унижать нельзя. Сказать, что тебя задело, и попросить больше так не делать вполне можно.\n\nЧтобы сказать близкому, что тебе больно, тебе не нужно сначала признать его плохим человеком.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Но ты говоришь: «Я вообще никогда не злюсь». И тут же о | бъясняешь, почему: мама переживает, муж устал, подруга сей | И"}],"cut":["Тебе все равно больно, даже если он правда ничего плохого не хотел.","Можно понимать, почему он так поступил, и все равно злиться на его поступок."],"before":null},{"id":"r_humor_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"Текст на экране: Подруга записывает психологу голосовое\nРечь: Слушай, давай вечером кофе попьем? Ты же психолог, я тебе про мужа расскажу. Только вопросы подготовь, я сама не знаю, с чего начать. И давай где потише, мне надо поплакать.\n\nТы сегодня после шести не работаешь? ОТЛИЧНО, значит, свободна.\n\nТолько без твоего «ну он козел». Так я и сама могу. Ты мне нормально объясни, почему я его выбрала.\n\nБлядь, ну чего ты вздыхаешь? Я же к тебе как к подруге пришла. Мне важно, чтобы ты была собой. Только собой спокойной, внимательной и чтобы про себя пока ничего не рассказывала.\n\nЗа кофе переведи мне половину. Мы же просто посидели.","caption":"А потом подруга спрашивает, как ваши дела, когда вы уже надеваете куртку.\nЯ [имя], психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого. Здесь говорим про отношения и все, что в них бесит.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_malysh_1","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"Текст на экране: Почему так страшно сказать «нет»\nРечь: Милые, вас просят помочь в выходной, и вам страшненько отказать? Хотя вы уже с ног валитесь.\n\nПредставьте домик, где вас любят. Если раньше за отказ с вами переставали разговаривать или называли эгоисткой, вы запомнили: чтобы меня впустили, надо говорить ДА.\n\nВы выросли. Коллега просит подменить ее в субботу. Вы хотите остаться дома, но уже отвечаете: «Конечно». И думаете: «Блядь, зачем я согласилась?»\n\nПотому что вам кажется: сейчас скажу «нет», и меня больше не захотят видеть в этом домике.\n\nНачните с маленького отказа человеку, который уже спокойно принимал ваши «нет».\n\nЧеловек может расстроиться и все равно хорошо к вам относиться.","caption":"После отказа так и тянет дописать пять сообщений с объяснениями. Как будто одного «в субботу я занята» недостаточно.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nЕсли знакомо, напишите в комментариях «знакомо».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ать или называли эгоисткой, вы запомнили: чтобы меня впустили, надо говорить ДА. | ы хотите остаться дома, но уже отвеча"}],"cut":["Ему можно отказать, даже если внутри хочется срочно согласиться."],"before":null},{"id":"r_malysh_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"Текст на экране: Почему стыдно обижаться на маму\nРечь: Милая, ты обиделась на маму и сразу себя ругаешь: «Она столько для меня сделала. Чего я опять начинаю?»\n\nСмотри, обида бывает как заноза. Мама сказала что-то больное, а тебе велели потерпеть: «Мама устала. Мама хотела как лучше». И ты решила, что жаловаться нельзя.\n\nЗаноза осталась. Ты выросла, мама сегодня ласковая, а тебе все еще больно. И ты думаешь: «Ну что я за дочь такая?»\n\nОх, еще и виноватой себя назначила. Больно тебе, а жалеть опять надо маму.\n\nМожно признать: «Да, мне обидно».\n\nТы можешь любить маму и все еще быть на нее обиженной.","caption":"После разговора ты еще час придумываешь, как надо было ответить. Особенно если опять промолчала, чтобы мама не расстроилась.\nЯ Юлия, психолог, работаю со взрослыми дочерьми.\nПодписывайся, если хочется еще таких разговоров о маме и о себе.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ы обиделась на маму и сразу себя ругаешь: «Она столько для меня сделала. Чего я о | что-то больное, а тебе велели потерп"}],"cut":["Без обещания немедленно все простить."],"before":null},{"id":"r_drug_1","author":"Михаил","format":"post","asked":"post","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Друг написал «Как вы?», и вы сразу подумали: «Что у него опять случилось?»\n\nВы уже знаете, что после пары сообщений будет длинный рассказ о ссоре, увольнении или очередном провале. И заранее прикидываете, хватит ли у вас сил сегодня его выслушать.\n\nВы помните, из-за чего он плакал месяц назад. А как он сейчас живет, приходится узнавать у общих знакомых. Встретиться за это время так и не получилось.\n\nПосле разговора он пишет: «Спасибо, только с вами могу нормально поговорить». Вам тепло. Значит, доверяет. Значит, вы важны.\n\nА потом снова тишина.\n\nВ такой дружбе легко привыкнуть чувствовать себя нужным именно тогда, когда человеку плохо. Его проблемы дают вам уверенность: «Без меня он бы не справился». Поэтому даже когда вы злитесь на эти исчезновения, отказать трудно. Вдруг подведете?\n\nПодождите, а куда делось ваше право просто поужинать и лечь спать? Почему ради дружбы вы опять должны разбирать чужую ссору до часу ночи?\n\nЧеловек правда может вам доверять. Но доверия в тяжелые дни мало, чтобы вы чувствовали себя близкими. Вам хочется, чтобы с вами тоже хотели погулять, посмеяться, узнать, как прошла ваша неделя.\n\nСкажите другу, что вам хочется общаться и тогда, когда у него все хорошо.","caption":"","judge":null,"guard":[{"rule":"rublenye","quote":"Вам тепло. Значит, доверяет. Значит, вы важны."},{"rule":"dvoetochiya","quote":"г написал «Как вы?», и вы сразу подумали: «Что у него опять случилось?» | После разговора он пишет: «Спасибо, только с в"}],"cut":["Вы вполне можете хотеть от дружбы большего, чем звонки с очередной бедой."],"before":null},{"id":"r_mama_1","author":"Ольга","format":"post","asked":"post","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Вы накричали на ребенка и теперь лежите рядом с ним: «Как же я себя ненавижу».\n\nА у вас после укладывания еще и суд над собой? Ребенок уснул, можно выдохнуть. Но вам срочно надо вспомнить каждую секунду и решить, что вы за мать такая.\n\n«Если я себя прощу, я вообще перестану сдерживаться».\n\nТо есть завтра вы будете терпеливее, если сегодня еще пару часов себя погрызете? Охрен*ть у нас требования к мамам. Даже мучиться надо с пользой.\n\nВы пытаетесь наказать себя так сильно, чтобы больше никогда не сорваться. И пока ругаете себя, есть ощущение, что вы что-то делаете: «Я же понимаю, как это ужасно. Мне же стыдно».\n\nТолько утром все остается как было.\n\nРебенок опять выплевывает кашу. Вы опять едите стоя. На предложение мужа отдохнуть отвечаете: «Сначала тут уберу». Вы уже злитесь, но просить сменить вас кажется стыдным. Сами же должны справляться.\n\nПотом кричите. И вот теперь отдыхать вам совсем нельзя, вы же виноваты. Бл*дь, так вы к следующему вечеру еще больше вымотаетесь.\n\nКрик может пугать ребенка. Но ребенку от вашей ненависти к себе спокойнее не становится. Ему нужно, чтобы вы успокоились и снова были рядом, могли обнять, поговорить без крика.\n\nПосле такого вечера договоритесь с мужем или другим близким взрослым, когда завтра он побудет с ребенком, а вы отдохнете. Помощь вам нужна ДО того, как вы снова сорветесь.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"и на ребенка и теперь лежите рядом с ним: «Как же я себя ненавижу». | бя, есть ощущение, что вы что-то делаете: «Я же по"}],"cut":["Это важно признать.","Даже если сегодня вы собой очень недовольны."],"before":null},{"id":"r_stud_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: Диплом горит, а я опять откладываю\n\nРечь: «Мне скоро сдавать диплом, почему я опять делаю что угодно, только бы его не писать?»\n\nОткрываешь документ. Перечитываешь заголовок. И вдруг надо срочно разобрать файлы на ноутбуке. Ну конечно, без порядка в папках диплом никак.\n\nЕсли тебе страшно показать, на что ты способна, откладывание дает удобную надежду: «Я бы написала хорошо, если бы времени было больше».\n\nПока текста нет, никто не может его прочитать и сказать, что получилось плохо. Даже ты сама.\n\nА когда садишься писать, приходится столкнуться с тем, что получается сейчас. С кривыми фразами, с пробелами в знаниях.\n\nИ вот вопрос: ты боишься плохого диплома или того, что после него сама решишь, что ты глупая?","caption":"Так и хочется еще поправить перед отправкой научруку.\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nЕсли узнаешь себя, напиши в комментариях «откладываю».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"собна, откладывание дает удобную надежду: «Я бы написала хорошо, если бы времени | И вот вопрос: ты боишься плохого дипл"}],"cut":["После хороших оценок бывает особенно трудно сдавать работу, в которой сама видишь недостатки."],"before":null},{"id":"r_gnezdo_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"podderzhka","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","text":"Дети съехали. Утром особенно пусто\n\nПросыпаетесь, и вроде можно спокойно выпить кофе. Никого не надо будить, никуда провожать. Только вставать почему-то не хочется. Лежите и думаете: «А зачем? Можно и еще полежать».\n\nПотом сами себя ругаете: «У детей все хорошо. Я должен радоваться. Люди мечтают пожить для себя, а мне опять все не так».\n\nИ тут еще обязательно найдется кто-нибудь с бодрым: «Зато теперь сколько свободного времени!» Спасибо, конечно. Только вы пока понятия не имеете, что с ним делать.\n\nГодами у вашего утра была понятная причина. Нужно приготовить завтрак, спросить, во сколько вернутся, решить что-то по дому. Даже когда это раздражало, вы знали, зачем встаете.\n\nВы уже многое сделали, чтобы дети могли жить самостоятельно. В это ушли годы заботы и сил. Теперь они справляются, а вы остались без привычного порядка, который каждый день подсказывал, чем заняться.\n\nИ скучаете вы еще по тому, как жили рядом. Можно было спросить что-нибудь из соседней комнаты. Услышать, как хлопнула входная дверь. Узнать, что случилось, без отдельного звонка. Теперь даже для обычного разговора приходится выбирать время.\n\nЯ бы не стал требовать от человека немедленно наслаждаться свободой после такой перемены. Откуда взяться этому наслаждению по расписанию?","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ь почему-то не хочется. Лежите и думаете: «А зачем? Можно и еще полежать». | Потом сами себя ругаете: «У детей все хорош"}],"cut":["Вас ждали вполне конкретные дела и люди.","Вы можете быть рады за детей и при этом тяжело переживать их отъезд.","Вам сейчас грустно без них, и ругать себя за эту грусть совершенно незачем."],"before":null},{"id":"r_razvod_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"mif","topic":"«ради детей надо сохранить семью»","text":"Слайд 1: «Ради детей я пока не буду разводиться»\n\nСлайд 2: Вы уже думаете, как будете жить отдельно. Потом смотрите на ребенка: «У него же будет праздник, все дети придут с папами. И что, я все испорчу?»\n\nИ снова откладываете разговор с мужем. Кажется, хорошая мать должна потерпеть.\n\nСлайд 3: Удобно придумали: за отношения двух взрослых теперь отвечает ваша любовь к ребенку. Сколько же на женщину навешали, бл*дь.\n\nЕсли муж вас унижает, запись «женат» в документах этого не отменяет.\n\nСлайд 4: У решения «терплю ради ребенка» есть неприятная ловушка. Вы можете начать ждать, что ребенок хотя бы оценит вашу жертву.\n\nВы весь вечер молчали после очередной ссоры с мужем, а он еще и уроки делать отказывается. В голове: «Я ради тебя здесь живу. Мог бы хоть слушаться».\n\nСлайд 5: Так у ребенка появляется долг за ваше терпение. Вы можете даже ни разу не сказать ему про этот долг вслух.\n\nНо его обычное недовольство начинает особенно злить. Вы столько вынесли ради него, а он смеет быть недовольным. Хотя ребенок вас оставаться не просил.\n\nСлайд 6: Сохранить отношения можно, если ОБА готовы что-то менять. Например, муж перестает оскорблять вас во время ссор, берет на себя ежедневные дела с детьми. Вы можете обсуждать разногласия без страха.\n\nСмотреть стоит на то, что происходит дома. Одного обещания «теперь все будет хорошо» мало.\n\nСлайд 7: Вы отвечаете за то, чтобы ребенок получал заботу и не участвовал в ваших ссорах. Отношения с мужем тоже требуют взрослого решения, которое нельзя поручить ребенку.\n\nНо обсуждать с мужем нужно конкретно: что каждый из вас готов менять, чтобы вместе стало возможно жить.","caption":"Фраза «я ради тебя осталась» может очень проситься наружу, особенно когда сил уже нет. С ребенком ей делать нечего. Ее нужно обсуждать со взрослым, который способен вас поддержать.\n\nМеня зовут Ольга, я психолог, работаю с женщинами 30-45 лет, которые думают о разводе или уже развелись.\nОтправьте тому, кому сейчас нужен этот разговор.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"жить отдельно. Потом смотрите на ребенка: «У него же будет праздник, все дети при | Удобно придумали: за отношения двух "}],"cut":["Само по себе решение остаться ничего между супругами не исправляет.","Разводиться прямо сейчас никто не обязывает."],"before":null},{"id":"r_pereezd_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"переехала в другой город и за год ни с кем не подружилась","text":"Текст на экране: Год в новом городе, подруг нет\nРечь: Четыре признака, что после переезда ты ищешь подруг, но ждешь от них близости, как со старыми.\nПервое. После встречи тебе хочется домой. Весь вечер подбирала слова, даже пошутить боялась. Со своими можно было просто сидеть и есть.\nВторое. Позвать знакомую погулять кажется навязчивостью. «Мы же еще толком не знакомы».\nТретье. Ты быстро решаешь: «Не мой человек». Разговор закончился на работе и погоде. Ну да, до разговоров про самое личное вы пока не добрались.\nЧетвертое. Даже хороший вечер ты не считаешь дружбой. Посмеялись, договорились встретиться снова. Но позвонить ей и поплакать пока нельзя. И ты опять говоришь себе: «У меня здесь никого».","caption":"Старой подруге ты отправляешь голосовое прямо из кровати. Новой знакомой переписываешь сообщение три раза, чтобы не показаться странной.\nЯ Юлия, психолог, работаю с людьми после переезда.\nЕсли хочешь прийти на консультацию, ссылка на запись в шапке профиля.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Третье. Ты быстро решаешь: «Не мой человек». Разговор закончился н | ть пока нельзя. И ты опять говоришь себе: «У меня з"}],"cut":["Так вы и остаетесь едва знакомыми."],"before":null},{"id":"r_dengi_1","author":"Михаил","format":"post","asked":"post","intent":"mehanizm","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","text":"Зарплаты хватает, запас есть, но вы все равно думаете: «Сейчас нормально. А вдруг потом все закончится?»\n\nУ тревоги есть неприятная особенность: вы можете начать считать ее полезной. Пока переживаете, вы внимательнее к расходам, лишний раз проверяете счет. Деньги пока не закончились. И появляется убеждение: «Вот поэтому и не закончились. Я же все время слежу».\n\nПолучается, даже успокоиться страшно. Вдруг расслабитесь и все упустите.\n\nПришла зарплата. Вы оплатили счета, отложили часть денег. Вроде хватает. Но вечером снова открываете приложение банка. Вспоминаете про страховку на машину, прикидываете расходы до конца месяца. Закрываете. Через полчаса хочется проверить еще раз.\n\nЦифры те же. На несколько минут стало спокойнее, и этого хватило, чтобы захотелось повторить проверку.\n\nВот ведь какая штука: деньги у вас есть, а почувствовать себя спокойно вы можете только после очередного подсчета.\n\nЕсли вы узнаете себя, полезно разделить две вещи. Следить за деньгами нужно, для этого достаточно понятного бюджета и проверки по делу. Постоянно беспокоиться о них тоже можно, только дополнительных денег от этого на счете не появится.\n\nПеред очередной проверкой спросите себя: появился новый расход или мне снова стало страшно? Если ничего не изменилось, пересчитывать остаток еще раз не нужно.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ает, запас есть, но вы все равно думаете: «Сейчас нормально. А вдруг потом все за | У тревоги есть неприятная особенност"}],"cut":["Так вы привыкаете проверять счет каждый раз, когда страшно.","Постепенно кажется, что без этого вообще нельзя."],"before":null}];const KEY='eval-2026-10-02_03-54-33_rilsy_gip_h0';
