<script>
const DATA=[{"id":"otvet_1","author":"Михаил","format":"reels_otvet","asked":"reels_otvet","intent":"kak_v_terapii","topic":"«а если психолог мне не поможет?»","text":"Текст на экране: А если психолог мне не поможет?\nРечь: А если психолог мне не поможет? Такое возможно. Я не могу заранее обещать вам результат. Но могу объяснить, что мы будем делать. Допустим, вам трудно отказывать. Я предлагаю упражнение, вам оно не подходит, но вы соглашаетесь. Знакомая история, да? Даже здесь хочется быть удобным. Если замечу, что вы сомневаетесь, спрошу об этом. И мы сможем прямо в разговоре попробовать то, что вам трудно в жизни: возразить, отказаться, предложить свое. Вот с чего можно начать: «Вы сейчас хотите согласиться или вам трудно мне отказать?»\nПодпись: На первой встрече можно спросить, как психолог предлагает работать с вашей трудностью. И сказать, если предложенный вариант вам не подходит.","judge":{"zhivo":3,"zacep":3,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Вот с чего можно начать"],"worst":"Вот с чего можно начать: «Вы сейчас хотите согласиться или вам трудно мне отказать?» — Непонятно, кому предлагается начать: зрителю или психологу. Вопрос звучит тяжеловесно.","best":"Я предлагаю упражнение, вам оно не подходит, но вы соглашаетесь.","verdict":"popravit","why":"Пример с отказом узнаваемый, речь можно снять без сложной постановки. Но страх «вдруг не поможет» быстро подменяется рассказом об упражнении: стоит добавить, как вы вместе поймёте, есть ли результат, и прояснить финальную реплику."},"guard":[{"rule":"dvoetochiya","quote":"е попробовать то, что вам трудно в жизни: возразить, отказаться, предложить свое. | Вот с чего можно начать: «Вы сейчас "}],"cut":["Уверенность может постепенно появляться, когда вы пробуете и видите, что происходит дальше."],"before":null},{"id":"monolog_1","author":"Михаил","format":"reels_monolog","asked":"reels_monolog","intent":"mif","topic":"«уверенность надо в себе воспитать»","text":"Текст на экране: Сначала стану увереннее, потом решусь\nРечь: «Уверенность надо в себе воспитать». Звучит так, будто сначала надо как следует поработать над собой. И только потом можно отказать начальнику.\n\nЯ с этим не согласен. Уверенность часто появляется уже после поступка.\n\nВот вас снова просят выйти в выходной. У вас планы, но сказать об этом страшно. И вы соглашаетесь. Потом еще ругаете себя: ну что я за тряпка.\n\nА откуда взяться уверенности, если вы каждый раз соглашаетесь и даже не проверяете, что будет после отказа?\n\nМожно сказать «в этот выходной я занят» с дрожащим голосом.\n\nКакой поступок вы сейчас откладываете до уверенности?\nПодпись: Чужое недовольство может остаться даже после самого вежливого отказа. Управлять чужой реакцией вы не можете.","judge":{"zhivo":3,"zacep":3,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Какой поступок вы сейчас откладываете до уверенности?","Управлять чужой реакцией вы не можете."],"worst":"«Какой поступок вы сейчас откладываете до уверенности?» — по-русски так не говорят; вопрос выглядит заготовкой для комментариев.","best":"Потом еще ругаете себя: ну что я за тряпка.","verdict":"popravit","why":"Понятный пример, узнаваемое самоедство, речь легко произнести. Но начало звучит как обсуждение тезиса, а финальный вопрос искусственный: стоит начать с ситуации и переписать концовку."},"guard":[],"cut":["Страх еще есть, но у вас уже появился опыт: я смог сказать, чего хочу."],"before":null},{"id":"spisok_1","author":"Ольга","format":"reels_spisok","asked":"reels_spisok","intent":"uznavanie","topic":"мама кричит на детей, а потом себя ненавидит","text":"Текст на экране: Кричите на детей, потом себя ненавидите?\nРечь: Если вы кричите на детей, а потом до ночи себя грызете, посмотрите, что бывает перед этим.\nПервое. Вы едите стоя и остывшее. Пока всем положили, себе уже некогда.\nВторое. Ребенок зовет «мам», и вы уже сжимаете зубы. Даже вопрос про носки ощущается как ЕЩЕ одно задание, когда вы вымотаны.\nТретье. Муж спокойно пьет чай, дети идут со всем к вам. Вы злитесь уже с первого «мам», потому что снова придется вставать вам.\nЧетвертое. Срываетесь из-за разлитого сока. Вечером вспоминаете лицо ребенка и думаете: «Что же я за мать».\nСколько совпало?\nПодпись: Что было сегодня перед криком? Попробуйте вспомнить весь день до него.","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Вы едите стоя и остывшее."],"worst":"Четвертое. Срываетесь из-за разлитого сока. — Обещали показать, что происходит перед криком, а описываете сам срыв.","best":"Муж спокойно пьет чай, дети идут со всем к вам.","verdict":"popravit","why":"Узнаваемые бытовые детали, легко снять и произнести. Поправить фразу про еду и четвертый пункт: сейчас список частично повторяет исходную проблему, вместо того чтобы помочь разобраться в ней."},"guard":[],"cut":["Ваши потребности весь день в конце очереди.","Вина занимает всю голову, и вы забываете, сколько всего было до этой лужи."],"before":null},{"id":"istoriya_1","author":"Юлия","format":"reels_istoriya","asked":"reels_istoriya","intent":"svoya_istoriya","topic":"как я сама пришла в анализ и говорила, что все хорошо","text":"Текст на экране: Я говорила, что все хорошо\nРечь: Я два месяца рассказывала аналитику, как у меня все хорошо. Это было, когда я сама впервые пришла в анализ. Два месяца. Прихожу на сессию и рассказываю, что все хорошо. Потом аналитик спросил, зачем я тогда плачу в машине перед каждой сессией. Я могу говорить о чувствах как психолог. И могу сама плакать перед сессией, а на ней рассказывать, что все хорошо. Мне важно рассказывать и об этой стороне своего опыта. А у тебя бывает, что говоришь «все хорошо», хотя только что плакала?\nПодпись: Кому ты чаще всего говоришь «все хорошо», когда тебе тяжело?","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Мне важно рассказывать и об этой стороне своего опыта."],"worst":"Потом аналитик спросил, зачем я тогда плачу в машине перед каждой сессией. — Откуда он это знает? Без пояснения поворот выглядит придуманным.","best":"Я два месяца рассказывала аналитику, как у меня все хорошо.","verdict":"popravit","why":"Личная история цепляет, особенно признание психолога, что она сама скрывала переживания. Нужно объяснить, откуда аналитик знал про слезы, сократить повторы и убрать декларацию о важности своего опыта."},"guard":[],"cut":["Вот такая деталь была у моего «все хорошо».","Обе вещи вполне помещаются в одном человеке."],"before":null},{"id":"poslanie_1","author":"Ольга","format":"reels_poslanie","asked":"reels_poslanie","intent":"podderzhka","topic":"мама, которая вечером считает, что опять ничего не успела","text":"Текст на экране: Мамам, которым вечером опять стыдно за день\nРечь: Это для тех, кто вечером видит грязную кухню и думает: весь день дома, и что я вообще сделала? Девочки, вы приготовили ужин. Его съели. Вы убрали со стола. На стол снова поставили чашку, тарелку, липкую какую-то хрень. И вот вы смотрите на это и чувствуете себя бездельницей. Хотя эту кухню сегодня уже убирали. ВЫ. Домашние дела часто приходится делать заново через пару часов. И к вечеру трудно увидеть, сколько всего вы сделали. Зато прекрасно видно, что еще осталось.\nПодпись: К вечеру дома снова бардак. Все, что вы сегодня сделали, по нему уже трудно разглядеть.","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Хотя эту кухню сегодня уже убирали. ВЫ.","Домашние дела часто приходится делать заново через пару часов."],"worst":"Домашние дела часто приходится делать заново через пару часов. — Объяснение очевидного: после живой бытовой сцены звучит как памятка.","best":"На стол снова поставили чашку, тарелку, липкую какую-то хрень.","verdict":"popravit","why":"Грязная кухня и липкая хрень дают узнавание, речь легко снять. Но отдельное «ВЫ» выглядит искусственным нажимом, а финал переходит в скучное объяснение: стоит поправить эти два места."},"guard":[],"cut":["Понятно, почему от этого и злость, и руки опускаются.","Можно устать от работы, результат которой уже успели съесть и испачкать."],"before":null},{"id":"scenka_1","author":"Юлия","format":"reels_scenka","asked":"reels_scenka","intent":"kak_v_terapii","topic":"первые месяцы терапии, когда «все хорошо»","text":"Текст на экране: «У меня все хорошо»\nПерсонажи: А это я в начале своего анализа, Б это аналитик\nА: У меня все хорошо. Правда. Даже рассказывать особо нечего.\nБ: Можно начать с этого.\nА: Ну, я справляюсь. Все нормально. Зря, наверное, пришла.\nБ: Почему зря?\nА: Люди приходят с проблемами. А я сижу, ваше время занимаю.\nБ: И все же ты приходишь.\nА: Да. Только рассказываю одно и то же. Что все хорошо.\nБ: А почему перед каждой сессией плачешь в машине?\nПодпись: Я тоже начинала с «у меня все хорошо».","judge":{"zhivo":3,"zacep":3,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["И все же ты приходишь."],"worst":"А почему перед каждой сессией плачешь в машине? — Откуда аналитик это знает? Без предыстории звучит как заготовленный эффектный разоблачающий вопрос.","best":"А я сижу, ваше время занимаю.","verdict":"popravit","why":"Узнаваемы неловкость и ощущение, что пришла недостаточно несчастной. Но финальный поворот выглядит подстроенным: лучше, чтобы о слезах рассказала сама героиня."},"guard":[],"cut":[],"before":null},{"id":"rol_1","author":"Ольга","format":"reels_rol","asked":"reels_rol","intent":"yumor","topic":"муж «помогает» по дому","text":"Текст на экране: Экскурсия для мужей по собственной квартире\nРечь: Проходите, вы здесь живете. Я проведу экскурсию. Слева кухня. Здесь можно помыть посуду, когда жена попросит. САМИ тоже можете. Для этого спросите жену, какую именно посуду помыть. Вот эту? И сковородку тоже? А где губка? Прекрасно, вы освоились. Под раковиной мусор. Если пакет полный, сообщите жене. Она подскажет, что с ним делать. Пакет вынесли? Обязательно доложите. Можно фотографию прислать, вдруг она с ребенком гуляет и пропустит ваш вклад. Теперь новый пакет. Да, ведро опять требует участия специалиста. Жена уже спит? Разбудите. Вы же помочь пришли.\nПодпись: Меня бесят советы «а вы попросите мужа помочь». Он вообще-то тоже там живет.","judge":{"zhivo":5,"zacep":4,"ponyatno":5,"polza":4,"interesno":5,"snyat":4,"ai_markers":[],"worst":"«Да, ведро опять требует участия специалиста». Чуть вымученная шутка: остальные попадают точнее.","best":"«Можно фотографию прислать, вдруг она с ребенком гуляет и пропустит ваш вклад».","verdict":"publikovat","why":"Знакомый мамам быт превращен в злую, смешную экскурсию: каждая следующая просьба мужа добавляет абсурда. Есть голос автора, узнавание и финальная реплика, которую захочется переслать подруге."},"guard":[],"cut":[],"before":null},{"id":"doska_1","author":"Михаил","format":"reels_doska","asked":"reels_doska","intent":"mehanizm","topic":"почему трудно отказать","text":"Текст на экране: Почему мне так трудно отказать?\nРечь: «Не могу отказать, потом злюсь на себя». Знакомо? Друзья мои, посмотрите, что происходит за несколько секунд.\nРисую: кружок со словом «Страшно».\nКоллега просит подменить его в субботу. У вас планы. Но сказать об этом страшно: вдруг обидится, начнет давить, придется объясняться.\nРисую: стрелка ко второму кружку «Соглашаюсь».\nИ вы говорите: «Ладно, выйду». Даже ответ придумать не успели, уже согласились.\nРисую: стрелка к третьему кружку «Отпустило».\nРазговор закончился. Можно выдохнуть. Мозг запоминает: согласился, стало легче.\nРисую: стрелка от третьего кружка обратно к первому.\nВ следующий раз снова страшно, и знакомое «ладно» опять вылетает раньше, чем вы успеваете подумать о своих планах. Посмотрите на этот круг. Вы сейчас хотите согласиться или хотите, чтобы скорее отпустило?\nИтог на схеме: «Страшно» → «Соглашаюсь» → «Отпустило» → обратно к «Страшно».\nПодпись: Облегчение после согласия может закреплять привычку соглашаться.","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":4,"interesno":3,"snyat":4,"ai_markers":["Друзья мои, посмотрите, что происходит за несколько секунд.","Облегчение после согласия может закреплять привычку соглашаться."],"worst":"Облегчение после согласия может закреплять привычку соглашаться. — Учебниковая формулировка, повторяет уже понятное и гасит удачный финальный вопрос.","best":"Даже ответ придумать не успели, уже согласились.","verdict":"popravit","why":"Узнаваемая ситуация и понятная схема: зритель увидит, почему соглашается против своих планов. Убрать дежурное «Друзья мои» и сухую подпись; переход обратно к страху стоит пояснить, иначе круг немного условный."},"guard":[{"rule":"dvoetochiya","quote":"У вас планы. Но сказать об этом страшно: вдруг обидится, начнет давить, придется | И вы говорите: «Ладно, выйду». Даже о"}],"cut":["Вот это облегчение и помогает привычке закрепиться."],"before":null},{"id":"bezslov_1","author":"Ольга","format":"reels_bez_slov","asked":"reels_bez_slov","intent":"yumor","topic":"хочу просто полежать, чтобы никто ничего не хотел","text":"Экран 1: Вы легли на диван. Муж заглядывает: «Макароны где?»\nЭкран 2: «Нашел. А сколько варить?»\nЭкран 3: «А детям сколько? А себе?»\nЭкран 4: «А они с сыром будут? Спроси у них».\nЭкран 5: «Да лежи ты, я сам все приготовлю».\nЭкран 6: «Ты только руководи. ЛЕЖА».\nПодпись: Девочки, хочу просто полежать. Без должности начальницы макарон.","judge":{"zhivo":4,"zacep":3,"ponyatno":3,"polza":3,"interesno":4,"snyat":4,"ai_markers":[],"worst":"«Макароны где?» — выглядит как поиск человека; следующий вопрос про варку сбивает.","best":"Без должности начальницы макарон.","verdict":"popravit","why":"Узнаваемая бытовая сцена: муж готовит, но жена продолжает всем управлять. Заменить «Макароны» на «макароны» — и можно выкладывать: финал смешной, без назидания."},"guard":[],"cut":[],"before":null}];const KEY='eval-2026-10-01_01-15_rilsy-korotko';

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const f=fsel.value,v=document.getElementById('v').value;const m=document.getElementById('m');m.innerHTML='';let n=0;
DATA.forEach(d=>{const j=d.judge||{};if(f&&d.format!==f)return;if(v==='mine'&&R[d.id]&&R[d.id].mark)return;if(v&&v!=='mine'&&j.verdict!==v)return;n++;
const c=document.createElement('div');c.className='card';const r=R[d.id]||{};
c.innerHTML='<div class="meta"><b>'+esc(d.id)+'</b> · '+esc(d.author)+' · '+esc(d.format)+(d.asked!==d.format?' (просили '+esc(d.asked)+')':'')+' · '+esc(d.intent)+'<br>'+esc(d.topic)+'</div>'
+(d.error?'<div class="mk">Ошибка: '+esc(d.error)+'</div>':'')
+(j.verdict?'<div><span class="tag v-'+j.verdict+'">'+V[j.verdict]+'</span><span class="why">'+esc(j.why)+'</span></div>':'')
+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'
+((d.cut||[]).length?'<div class="cut">Вычеркнула: '+d.cut.map(x=>'<s>'+esc(x)+'</s>').join(' ')+'</div>':'')
+((j.ai_markers||[]).length?'<div class="mk">'+j.ai_markers.map(x=>'«'+esc(x)+'»').join(' ')+'</div>':'')
+(j.worst?'<div class="why">Худшее: '+esc(j.worst)+'</div>':'')
+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')
+'<div class="rate"><button data-m="ok" class="'+(r.mark==='ok'?'on':'')+'">Живо</button><button data-m="bad" class="'+(r.mark==='bad'?'on':'')+'">Не живо</button><input placeholder="что не так" value="'+esc(r.note||'')+'"></div>';
c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
c.querySelector('input').onchange=e=>{R[d.id]={...(R[d.id]||{}),note:e.target.value};save()};
m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
fsel.onchange=render;document.getElementById('v').onchange=render;
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,ratings:R},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ocenki-2026-10-01_01-15_rilsy-korotko.json';a.click()};
render();
</script></body></html>
