<script>
const DATA=[{"id":"t_A_1","author":"Юлия","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"Запасной вариант всегда держит выходные свободными","text":"Текст на экране: Голосовое от подруги, которая знает лучше\nРечь: Я тебе как подруга говорю: подругам пока ничего не обещай, вдруг он захочет встретиться. Ты же сама потом расстроишься, что он наконец смог, а ты уже куда-то собралась.\n\nОн написал «может, на выходных»? Ну вот, уже обсуждаете совместные планы. Зачем уточнять, в какой день? У него работа, дела, он пока сам не знает. Освободи оба, чтобы потом спокойно выбрать.\n\nВ кино тебя зовут в субботу? Скажи, что ближе к делу ответишь. Билеты купят без тебя? Зато ты сможешь приехать к нему, если он освободится. Надо же иногда выбирать отношения.\n\nСлушай, только сама ему больше не пиши. Пусть проявит инициативу. Мы с тобой взрослые женщины, за мужчиной бегать не будем. Посидишь дома, займешься своими делами, вечером он вполне может объявиться. Дома тоже можно прекрасно провести время, особенно если все равно собиралась стирать.\n\nУже суббота, шесть вечера? Так еще весь вечер впереди. Я бы пока голову помыла, чтобы потом быстро собраться. И ужинать плотно не надо, вдруг он предложит куда-нибудь сходить. Хотя можешь заказать что-нибудь, что завтра тоже будет вкусно.\n\nОн с друзьями? Ну так вы же конкретно ничего не назначали. Мне нравится, что он честно отвечает. Другой бы вообще промолчал, а этот даже рассказал, где находится. И фотографию прислал. Видишь, помнит о тебе.\n\nТолько обиженное сообщение ему сейчас не отправляй, у вас все так легко начиналось. Напиши, что тоже отлично проводишь вечер. Про стирку можно не уточнять.\n\nНа следующие выходные опять зовут? Ты пока скажи, что у тебя планы. Какие именно, потом разберетесь, когда он ответит. Я же тебя знаю, ты у нас человек серьезный, тебе отношения нужны.","caption":"В ожидании тоже можно очень устать.","judge":null,"guard":[],"cut":[],"before":null},{"id":"t_A_2","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"На свидании отвечаешь правильно, а потом удивляешься, что тебя так и не узнали","text":"Текст на экране: На свидании ты отвечаешь слишком правильно\nРечь: Три признака того, что на свидании ты так стараешься понравиться, что узнать тебя почти невозможно.\nТы рассказываешь только о подходящих увлечениях. Он любит походы, и ты вспоминаешь единственную поездку с палаткой, хотя отпуск мечтаешь провести в городе.\nО своих обидах ты говоришь со смехом. Даже когда рассказываешь, как бывший отменял встречи за час до выхода, добавляешь, что сама слишком многого ждала. И новый знакомый слышит, что с тобой можно так же.\nПосле свидания ты просишь подругу оценить твои ответы. Пока вы обсуждаете, стоило ли говорить о желании выйти замуж, ты уже решаешь в следующий раз промолчать. Даже подруге теперь рассказываешь, какой собираешься ему понравиться.\nПодписывайся, здесь я рассказываю, почему умные и самостоятельные женщины остаются одни и как перестать выбирать тех, кто не выбирает тебя.","caption":"О чем ты обычно умалчиваешь на первых свиданиях?","judge":null,"guard":[],"cut":["Твои настоящие желания кажутся тебе недостаточно интересными, чтобы о них говорить.","Очень уж страшно показаться требовательной."],"before":null},{"id":"t_A_3","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"poziciya","topic":"Когда слышу «все делаю правильно», спрашиваю, кому ты сдаешь экзамен","text":"Текст на экране: Я же все делаю правильно\nРечь: Ты ходишь к психологу, стараешься все делать правильно и ждешь, когда наконец наладится личная жизнь.\n\nМеня злит, когда психологи поддерживают это ожидание обещаниями счастья. Получается, тебе опять надо постараться: разобраться с обидами, научиться говорить о своих желаниях, спокойно принимать отказ, еще и расставаться так, чтобы бывший остался доволен.\n\nИ кому ты сдаешь этот экзамен? Иногда все тому же мужчине, который никак тебя не выберет. Ты надеешься, что после терапии станешь настолько понимающей, спокойной и самостоятельной, что уж теперь ему будет с тобой хорошо.\n\nДаже когда учишься говорить, что тебе самой нужно, заранее подбираешь слова, от которых он точно не расстроится.\n\nТерапия действительно может помочь тебе стать счастливее. Но обещать тебе счастье я бы не стала. Возможно, ты поймешь, что тебе самой давно плохо в отношениях, которые ты так старалась сохранить.\n\nЯ считаю, что в терапии важно разобраться, как ты хочешь жить. И выдержать, что кто-то останется недоволен твоим выбором.","caption":"Подписывайся, если стараешься понравиться тем, кто тебя не выбирает.","judge":null,"guard":[],"cut":["Только ты по-прежнему стараешься ему понравиться."],"before":null},{"id":"t_A_4","author":"Юлия","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"Мне тридцать восемь, но мой диплом все еще ждет маминой подписи","text":"Текст на экране: Мама проверяет диплом взрослой дочери\nРечь: Покажи маме диплом, я посмотрю, правильно ли ты выучилась. В тридцать восемь, конечно, уже можно было успокоиться, но раз закончила, давай посмотрим.\n\nТак, а почему без отличия? Ты же у нас способная. Работала и училась одновременно? Ну я тоже работала, когда тебя растила. Мне за это диплом никто не дал.\n\nПоздравить? Конечно, поздравляю. Я просто хочу, чтобы ты понимала, что с этим дипломом дальше делать. На полку положишь? Тогда красивая папочка, да, хорошая.\n\nУже пригласили на новую работу? А сколько платить будут? Первое время меньше? Вот видишь, я же чувствовала, что ты торопишься. Столько учиться, чтобы потом еще и меньше получать. Ты только никому пока не рассказывай, подожди, пока будет чем похвастаться.\n\nТебе самой нравится? Ну тебе и прежняя работа сначала нравилась. Я помню, ты тоже радостная ходила, потом жаловалась. Мама ведь помнит, мама потом все это выслушивает.\n\nОбиделась? На что тут обижаться, я с тобой честно разговариваю. Чужие тебе, конечно, скажут: молодец. Им же все равно, что с тобой дальше будет.\n\nФотографию с дипломом пришли, я в семейную группу отправлю. Какую подпись? Напишу, что дочь наконец получила хорошую профессию. Да, я помню, у тебя уже есть образование. Ну так тем ты все равно не пользуешься.\n\nИ фотографию другую выбери, где ты посерьезнее. Тут ты смеешься, как будто тебе восемнадцать. Родственники же будут смотреть.\n\nЧто значит, ты хотела со мной порадоваться? Я радуюсь. Уже сестре своей отправила, она спрашивает, кто тебя надоумил снова учиться. Написала ей, что я всегда в тебя верила.\n\nТолько почему тебе обязательно нужно, чтобы я тебя похвалила? В твоем возрасте пора иметь свое мнение. Я тебе сколько раз говорила.","caption":"Мамино одобрение иногда хочется получить особенно сильно после большого собственного решения. Взрослая дочь уже справилась с учебой, нашла работу, устроила свою жизнь, но рядом с мамой снова начинает подробно объяснять, почему ее выбор имеет смысл. К обычной радости добавляется надежда, что теперь мама наконец признает: дочь умеет решать сама. Поэтому замечание про фотографию или оценки может задеть сильнее, чем серьезные трудности во время учебы. Особенно больно, когда мама потом с гордостью рассказывает родственникам о том самом достижении, которое при дочери так тщательно раскритиковала.","judge":null,"guard":[{"rule":"kalka","quote":"имеет смысл"},{"rule":"dvoetochiya","quote":"азговариваю. Чужие тебе, конечно, скажут: молодец. Им же все равно, что с тобой д | адежда, что теперь мама наконец приз"}],"cut":[],"before":null},{"id":"t_B_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"Будьте гостем в собственном доме и ждите, пока жена позовет ужинать","text":"Текст на экране: Урок этикета для женатых\nРечь: Я ваш преподаватель этикета, и сегодня мы учимся правильно ждать, пока жена позовет ужинать.\n\nВы пришли домой, сели и ждете приглашения. Даже если живете здесь двенадцать лет, без приглашения к столу подходить невежливо.\n\nЖена еще готовит? Прекрасно, у вас есть время спросить, скоро ли ужин. Спросите из комнаты, чтобы ей пришлось ответить погромче. Так она точно поймет, что вы дома.\n\nРебенок просит есть? Скажите ему, что мама сейчас приготовит. Вы уже помогли: сообщили ребенку, к кому обращаться.\n\nМожно ли самому достать тарелки? Какая прекрасная инициатива, я вами довольна. Сначала уточните у жены, какие именно. Потом сколько. Потом куда поставить. Пусть бросит свою, блядь, картошку и покажет, раз ей нужна помощь.\n\nОна говорит, что проще самой? Поблагодарите и вернитесь на диван. Хозяйке приятно делать все по своему вкусу.\n\nКогда вас наконец позовут, обязательно похвалите ужин. И скажите, что завтра можно приготовить котлеты. Гость, который собирается прийти еще, всегда очень радует хозяйку.","caption":"Особенно одиноко бывает вдвоем.","judge":null,"guard":[],"cut":[],"before":null},{"id":"t_B_2","author":"Ольга","format":"reels_poslanie","asked":"reels_auto","intent":"razreshenie","topic":"После ссоры можно молчать, чтобы успокоиться, а можно ждать, пока другой сдастся","text":"Текст на экране: Если вас стыдят за паузу после ссоры\nРечь: Вы после ссоры просите полчаса тишины и слышите, что думаете только о себе? А если быть такой эгоисткой нормально?\n\nЭгоистка просит остановить спор, потому что уже повышает голос и боится наговорить лишнего, и слышит: «С тобой вообще невозможно разговаривать». Эгоистка хочет полежать одна, заранее говорит, что вернется к разговору через полчаса, и слышит: «Тебе плевать, что я тут переживаю». Эгоистка возвращается обсуждать ссору, но по-прежнему считает, что муж сам может приготовить ужин, и слышит: «Я думал, ты уже успокоилась».\n\nВы можете успокоиться и остаться при своем мнении. Когда кто-то молчит до тех пор, пока другой не извинится и не уступит, он вынуждает согласиться, чтобы дома снова начали разговаривать.\n\nТребовать капитуляции под видом примирения уже наглость.\n\nПодписывайтесь, здесь про мам, которые все тащат, мужей, которые «помогают», и злость, за которую потом стыдно.","caption":"Как у вас заканчивается молчание после ссоры?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ос и боится наговорить лишнего, и слышит: «С тобой вообще невозможно разговариват | ется к разговору через полчаса, и сл"}],"cut":["Вот тут особенно интересно.","Муж может расстроиться из-за паузы, вы все равно вернетесь к разговору."],"before":null},{"id":"t_B_3","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"Перевешиваете белье после мужа, а потом злитесь, что без вас ничего не делается","text":"Текст на экране: Перевешиваете белье за мужем и злитесь?\nРечь: Три признака, что вы продолжаете отвечать за весь дом, даже когда муж уже делает свою часть.\nВы переделываете то, что уже можно оставить в покое. Муж развесил белье, оно высохнет, но вы снимаете футболки и вешаете заново, потому что он прицепил их как попало. Тут важно, что именно вас беспокоит: футболки действительно останутся мокрыми или вам трудно выдержать, что он сделал по своему усмотрению? А муж привыкает, что окончательно решать, годится ли результат, будете вы.\nВы уходите отдыхать, но остаетесь на связи по каждому домашнему вопросу. Сидите с подругой, а муж пишет: «Ну скажи, что сделать, я сделаю», и вы между делом составляете ему список, уточняете, что есть на ужин, напоминаете про стирку. Меня бесит, когда такое называют полноценным отдыхом: вы даже разговор с подругой прерываете, чтобы взрослый мужчина разобрался с делами в собственном доме.\nВас может задеть, что муж прекрасно справился без ваших подсказок. Вы возвращаетесь, дома все нормально, а он еще и говорит, что ничего сложного тут нет, и вам хочется перечислить все, что он упустил. Потому что вы ждали, что он наконец поймет, сколько сил у вас уходит каждый день, а он доволен собой после одного вечера. И вот вы уже проверяете белье, хотя собирались отдыхать. Вам хочется, чтобы он признал вашу усталость, и ради этого вы опять находите себе работу.\nСколько признаков у вас совпало?","caption":"Подписывайтесь, здесь про быт, мужа и злость от вечных поручений.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ало. Тут важно, что именно вас беспокоит: футболки действительно останутся мокрым | вопросу. Сидите с подругой, а муж пи"}],"cut":["Во втором случае вы тратите силы еще и на то, чтобы все выглядело так, будто вы сделали это сами.","Он выполняет поручения, а вы по-прежнему должны все помнить и объяснять."],"before":null},{"id":"t_B_4","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"poziciya","topic":"Она просит научить ее не злиться, а муж не знает, когда дети едят","text":"Текст на экране: Я даже ужин должна ему поручить?\nРечь: «Попроси мужа помочь», советует подруга, когда вы жалуетесь, что опять сорвались из-за ужина. Меня бесит, что вам добавляют еще работу: придумайте, поручите, напомните.\n\nМуж спрашивает, пора ли кормить детей, пока вы проверяете холодильник. Он здесь живет. Почему время ужина должны помнить только вы?\n\nДа, конкретную просьбу иногда нужно произнести. Но если каждый ужин начинается с ваших указаний, вы продолжаете все тащить.\n\nИ вы еще спрашиваете себя: может, я плохо объясняю? Почему я, блядь, опять злюсь? Как научиться молчать?\n\nА я должна научить вас спокойно напоминать папе, что дети едят каждый день? Офигенно я себе работу придумала.","caption":"Если узнаете свой быт, приходите разбираться вместе: пишите в директ слово «разбор».\nЯ Ольга, работаю в системной семейной терапии с мамами, уставшими от быта и мужа.","judge":null,"guard":[{"rule":"odushevlenie","quote":"время ужина должны помнить"},{"rule":"dvoetochiya","quote":"Меня бесит, что вам добавляют еще работу: придумайте, поручите, напомните. | И вы еще спрашиваете себя: может, я плохо о"}],"cut":["Он тоже может за ним следить.","Когда приходится еще и напоминать мужу о каждом деле, после его помощи вы вполне можете оставаться уставшей."],"before":null},{"id":"t_C_1","author":"Михаил","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"С утра я достоин лучшего, к обеду извиняюсь за просьбу закрыть окно","text":"Текст на экране: Тренинг уверенности. Просить пока рано\nРечь: Я ваш тренер по уверенности, и сегодня я научу вас чувствовать себя достойным, ничего ни у кого не прося.\n\nНачинаем утро у зеркала. Говорите: «Я достоин лучшего». Погромче, вы же должны себе поверить. Отлично. Уже совсем другой человек, я сразу вижу.\n\nК обеду хотите попросить партнера закрыть окно, потому что мешает шум со двора? Подождите. Вы уже достаточно уверенно смотрели себе в глаза? Вот именно, тут нужна подготовка.\n\nПока скажите как привыкли: «Извини, пожалуйста, можно закрыть? Если тебе не душно. Хотя ладно, пусть будет открыто». Прекрасно, отношения сохранили, никого своей просьбой не потревожили.\n\nЧто значит, утром вы были достойны лучшего, а сейчас даже окно закрыть неудобно? Утром у вас зеркало. Оно согласно. Партнер может спросить: «А тебе что, мешает?» К такому повороту наш базовый курс вас пока не готовит.\n\nПоэтому завтра снова к зеркалу. Добавим: «Мои желания имеют значение». У меня это отдельный урок, очень сильный.\n\nОкно пока не трогайте. Мы до просьб еще не дошли.","caption":"Просить труднее, когда заранее готовишься оправдываться.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Начинаем утро у зеркала. Говорите: «Я достоин лучшего». Погромче, вы же до | Пока скажите как привыкли: «Извини, пожалуй"}],"cut":[],"before":null},{"id":"t_C_2","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"poziciya","topic":"Клиент все еще боится звонить, а я уже вижу результат терапии","text":"Текст на экране: Все равно боюсь звонить\nРечь: «Всегда делайте то, чего боитесь», советуют в ленте, когда вы признаетесь, что страшно даже позвонить и записаться к парикмахеру.\n\nЗдесь бывают два разных случая. В одном вы волнуетесь, заранее прикидываете, что сказать, но звоните, уточняете время и записываетесь. Можете переспросить, если плохо расслышали. Страх пока есть, и с ним уже получается жить.\n\nВ другом вы третий день откладываете звонок, просите близких позвонить за вас и соглашаетесь на неудобное время, лишь бы скорее закончить разговор.\n\nПочему я могу видеть результат терапии, хотя вы все еще боитесь? Потому что вы уже можете сделать то, ради чего раньше приходилось уговаривать близких.\n\nНо если звонки продолжают срывать ваши планы, это повод вернуться к этой трудности вместе с психологом. Одного понимания причин страха здесь пока недостаточно.\n\nПодписывайтесь, здесь про тревогу, неловкость и жизнь с постоянной мыслью о том, что о вас подумают.","caption":"Что вы уже делаете сами, хотя по-прежнему страшно?","judge":null,"guard":[],"cut":["Уверенность появляется, когда вы сами справляетесь с такими разговорами.","Повторением слов перед зеркалом этот опыт получить трудно."],"before":null},{"id":"t_C_3","author":"Михаил","format":"reels_poslanie","asked":"reels_auto","intent":"razreshenie","topic":"Друг отказался встретиться один раз или отказывает уже полгода","text":"Текст на экране: Если друг снова отказался встретиться\nРечь: Если после отказа друга вы повторяете себе «Друзья всегда находят время», сейчас коротко объясню, почему вы так переживаете и что здесь стоит различать.\n\nВы предложили встретиться, услышали «не получится» и уже думаете, что стали лишним. Хочется спросить еще раз, но страшно получить подтверждение. И тут вам советуют: «Не навязывайтесь». Получается, даже уточнить, когда друг свободен, уже стыдно.\n\nНо бывают два разных случая.\n\nВ первом друг отказался сегодня, потому что занят, потом сам написал, спросил про выходные, предложил встретиться хотя бы на час. С ним можно договариваться, иногда сердиться из-за несовпавших планов и продолжать дружить. Правило «Друзья всегда находят время» делает каждую занятую субботу проверкой вашей значимости.\n\nВо втором случае вы уже полгода предлагаете даты, соглашаетесь на удобное другу место, пишете после очередного «давай попозже». Без ваших сообщений вы вообще не общаетесь. И совет «Будьте настойчивее» только добавляет вам работы.\n\nВы устали, потому что пытаетесь подобрать такое приглашение, на которое друг наконец согласится. Постепенно начинаете считать себя скучным, неудобным, слишком требовательным. Хотя по этим отказам вы знаете только одно: сейчас друг встречаться с вами не старается.\n\nИз такого одностороннего общения можно выходить без доказательств, что друг плохой. Его причины могут остаться вам неизвестны. Полгода ваших попыток уже достаточно, чтобы перестать считать себя недостаточно старательным другом.","caption":"Подписывайтесь, если часто думаете, что о вас подумают близкие.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"лучить подтверждение. И тут вам советуют: «Не навязывайтесь». Получается, даже ут | тя по этим отказам вы знаете только "}],"cut":["Да, вы могли расстроиться.","При этом друг тоже старается вас увидеть.","Когда ваш друг последний раз сам предлагал встретиться?"],"before":null},{"id":"t_C_4","author":"Михаил","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"Соглашайся на неудобные встречи, чтобы потом было за что злиться на партнера","text":"Текст на экране: Тренинг: как накопить обиды в паре\nРечь: Как ваш тренер по отношениям, советую соглашаться, когда партнер зовет в гости, а вы собирались провести вечер дома. Сразу говорите, что с удовольствием. Нам нужна убедительная обида, поэтому никаких предупреждений.\n\nУстали после работы? Прекрасно, будет что припомнить. Друзья партнера собираются только к девяти? Вообще замечательно. Вы уже заранее знаете, насколько вам будет плохо, а он пока радуется. Посмотрите, какая разница в отношении к вам.\n\nТолько про усталость молчите. Если он предложит остаться дома, весь вечер испортит.\n\nВ гостях поддерживайте разговор, улыбайтесь, соглашайтесь на чай. Пусть видит, как вы стараетесь. Что значит, он решил, что вам нравится? Ну вот, даже стараний ваших не замечает.\n\nПо дороге домой отвечайте коротко. На вопрос, что случилось, скажите: «Ничего». Я всегда советую давать партнеру возможность самому все понять.\n\nДома уже можно объяснить, что вы ради него потратили весь вечер. Он напомнит, что вы сами согласились? Запомните дословно. Это вам еще в следующей ссоре пригодится.","caption":"Иногда просьбу трудно произнести, потому что тогда партнер выполнит ее уже с вашей подсказкой. А хочется, чтобы сам заметил усталость, отменил встречу и выбрал вечер с вами. Такое внимание кажется более убедительным доказательством любви. Поэтому даже согласие остаться дома может разочаровать: пришлось объяснять. Партнер при этом может искренне считать, что вы вместе хорошо провели время.","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"},{"rule":"dvoetochiya","quote":"Тренинг: как накопить обиды в паре | ротко. На вопрос, что случилось, скажите: «Ничего». Я всегда советую давать партн |"}],"cut":[],"before":null}];const KEY='eval-2026-10-21_16-08-04_rilsy_t_zh5';

+(d.error?'<div class="mk">Ошибка: '+esc(d.error)+'</div>':'')
+(j.verdict?'<div><span class="tag v-'+j.verdict+'">'+V[j.verdict]+'</span><span class="why">'+esc(j.why)+'</span></div>':'')
+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'
+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')
+((d.cut||[]).length?'<div class="cut">Вычеркнула: '+d.cut.map(x=>'<s>'+esc(x)+'</s>').join(' ')+'</div>':'')
+((j.ai_markers||[]).length?'<div class="mk">'+j.ai_markers.map(x=>'«'+esc(x)+'»').join(' ')+'</div>':'')

+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')
+'<div class="rate"><button data-m="ok" class="'+(r.mark==='ok'?'on':'')+'">Живо</button><button data-m="bad" class="'+(r.mark==='bad'?'on':'')+'">Не живо</button><input placeholder="что не так" value="'+esc(r.note||'')+'"></div>';
c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
c.querySelector('input').onchange=e=>{R[d.id]={...(R[d.id]||{}),note:e.target.value};save()};
m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
fsel.onchange=render;document.getElementById('v').onchange=render;
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,ratings:R},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ocenki-2026-10-21_16-08-04_rilsy_t_zh5.json';a.click()};
render();
