<script>
const DATA=[{"id":"s_r_rod_1_A","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Звонишь маме, чтобы она не обиделась?\nРечь: Четыре признака того, что ты звонишь маме из страха перед ее обидой.\nНедавно прочитала комментарий: «Мама обижается, если я не звоню каждый день», и подумала, сколько приходится подстраивать под этот звонок.\nТы заранее сокращаешь встречи с подругами. Еще посидела бы, но мама скоро ложится, и завтра придется выслушивать, что для всех остальных у тебя время есть.\nТы готовишь объяснения еще по дороге с работы. Вспоминаешь, какие дела перечислить, чтобы мама поверила: ты действительно была занята.\nТы злишься на партнера, когда он просит отложить звонок до конца фильма. Он хочет досмотреть вместе, а ты уже представляешь мамино «ну конечно, теперь я тебе мешаю».\nТы сдерживаешь желание позвонить маме просто так, поделиться смешным. Вдруг она привыкнет к двум звонкам за день, и потом одного снова окажется мало.\nСколько пунктов у тебя совпало?","caption":"Если ты хочешь созваниваться реже, можно сказать: «Мам, я хочу с тобой общаться, но каждый день звонить у меня не получается. Давай договоримся на воскресенье». Лучше предложить время, которое ты действительно сможешь выделить, без обещания обязательно писать во все остальные дни. Мама может обидеться и после такого разговора. Тогда можно повторить договоренность, не перечисляя заново все свои дела и причины.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Недавно прочитала комментарий: «Мама обижается, если я не звоню каждый | ие дела перечислить, чтобы мама поверила: ты де"}],"cut":["Даже после тяжелого дня тебе предстоит доказывать, что ты устала.","Как же обидно еще и с ним из-за этого ссориться."],"before":null},{"id":"s_r_rod_1_C","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Звоните маме, чтобы она не обиделась\nРечь: Три признака, что вы звоните маме каждый день из страха перед ее обидой.\nНедавно увидел в комментариях: «Позвонить матери, что тут сложного?» Меня злит это «что сложного», когда за пропущенный звонок потом приходится весь разговор оправдываться.\nВы скрываете даже хорошие планы. Подруге предлагаете встретиться после восьми, чтобы сначала успеть позвонить маме. Саму встречу маме пропускаете в рассказе: иначе услышите, что на подруг у вас время находится.\nВы сомневаетесь в себе на работе. Мама звонит во время совещания, вы отклоняете вызов и до конца обсуждения мысленно готовите объяснение. Коллеги спрашивают ваше мнение, а вы пропустили, что они предлагают: думали, как доказать маме, что действительно были заняты.\nВы злитесь на партнера за приятные предложения. Он зовет прогуляться, и вы раздражаетесь, потому что еще надо позвонить маме. Совместный вечер начинается со ссоры, хотя вы тоже хотели выйти.\nПартнер уже обувается, а вы говорите: «Иди пока, я догоню», и набираете маму.","caption":"Если собираетесь менять привычку созваниваться ежедневно, лучше заранее назвать следующий день звонка. Например: «Мам, сегодня я побуду с друзьями, позвоню тебе в воскресенье». На вопрос «Тебе трудно выделить пять минут?» можно ответить: «Я хочу провести этот вечер без звонков, мы поговорим в воскресенье». Долгие объяснения могут превратить ваши планы в спор о том, достаточно ли у вас веская причина. Повторите, когда позвоните, и завершите разговор, если мама снова требует оправданий.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Недавно увидел в комментариях: «Позвонить матери, что тут сложного?» М | Саму встречу маме пропускаете в рассказе: иначе"}],"cut":["И подруге уже не можете сказать, во сколько вам действительно удобно."],"before":null},{"id":"s_r_men_1_A","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Опять накричал из-за ерунды\nРечь: Ты весь день держался, а потом сын заплакал над домашкой, и ты рявкнул: «Хватит уже реветь».\n\nНедавно услышала знакомое «мужчины не плачут» и подумала, как рано мальчикам объясняют, чего папе потом придется стыдиться.\n\nДорогой мой, ты ведь можешь спокойно говорить сыну, что ошибаться нормально, пока он не начинает всхлипывать. Почему именно тут тебя так разбирает? Возможно, тебе самому в такие минуты говорили: «Ты же мужик, соберись».\n\nИ теперь рядом с плачущим сыном тебе хочется немедленно его успокоить. Хотя погоди, успокоить или добиться, чтобы он замолчал? Его слезы слишком напоминают, как тебе самому хотелось плакать и как стыдно было попасться.\n\nУ меня в кабинете клиенты иногда считают сессию удачной по количеству использованных салфеток. А ты даже там можешь заранее решить, что уж тебе они точно не понадобятся.\n\nТы уже вынес ночные подъемы, детские истерики, сборку кровати с непонятной инструкцией, родительский чат с обсуждением сменки до полуночи. Почему признаться, что самому тяжело, до сих пор страшнее?\n\nСын слышал, как ты орешь через всю квартиру. А что ты иногда плачешь, ему знать нельзя.","caption":"Что тебе говорили взрослые, когда ты плакал?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"сын заплакал над домашкой, и ты рявкнул: «Хватит уже реветь». | жно, тебе самому в такие минуты говорили: «Ты же мужик, "}],"cut":["Потому что за это тебя когда-то стыдили."],"before":null},{"id":"s_r_men_1_B","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Папа терпит, потом срывается на детей\nРечь: Три признака отца, который запрещает себе плакать, а потом срывается на детей. Увидела под видео с плачущим мужчиной комментарий: «Что за пример сыну?» Меня бесит, что сыну предлагают показывать только ту часть себя, которая со всем справляется.\nВы молчите, когда вас унижают. Начальник отчитывает вас при коллегах, дома жена спрашивает, что случилось, и вы отвечаете: «Нормально все». Зато за пролитый сок сын выслушивает все, что вы побоялись сказать начальнику.\nВы встречаетесь с друзьями и ничего им не рассказываете. Даже когда все заебало и хочется выговориться, обсуждаете футбол, ремонт, чужие новости. Друзья уходят уверенные, что у вас порядок, а вы возвращаетесь домой без поддержки, с раздражением на каждый детский вопрос.\nВы торопитесь закончить даже приятный разговор, если подступают слезы. Ребенок читает вам открытку, которую сам подписал, а вы уже замечаете разбросанные карандаши. Он ждет, что вы его обнимете, а вы повышаете голос: «Сколько раз просить убрать за собой?» Ребенок кладет открытку на стол и собирает карандаши.","caption":"Если вы уже накричали, к разговору с ребенком стоит вернуться, когда сможете говорить спокойно. Можно сказать: «Я накричал на тебя из-за сока. Я был расстроен еще до этого, и ты тут ни при чем. Прости, что напугал». Карандаши и сок можно обсудить отдельно, без крика.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"од видео с плачущим мужчиной комментарий: «Что за пример сыну?» Меня бесит, что с | прашивает, что случилось, и вы отвеч"}],"cut":["Ребенку важно услышать, что папа понимает, что произошло, даже если он пока учится говорить о своих переживаниях."],"before":null},{"id":"s_r_vybor_1_A","author":"Юлия","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Почему ты опять ждешь, что тебя выберут\nРечь: На днях в очереди услышала, как девушка сказала подруге: «Он сам не пишет, может, я скучно отвечаю?»\n\nМилая, меня задело, как быстро она решила, что сама что-то сделала неправильно. Он не пишет, и ты уже придумываешь вопрос поинтереснее, убираешь лишний смайлик, просишь подругу проверить, достаточно ли весело ты написала «как дела».\n\nТы словно стучишь в закрытую дверцу и думаешь: может, надо потише, может, повеселее, может, сначала похвалить дверцу?\n\nПока ты ищешь ошибку в себе, ты надеешься, что можешь все исправить. Напишешь правильно, и он захочет быть с тобой.\n\nЯ тоже не умею говорить так, чтобы каждому хотелось со мной общаться.\n\nТебе нужно увидеть, хочет ли он сам с тобой встречаться, без твоих подсказок и уговоров. Для этого нужно оставить ему возможность самому предложить встречу.\n\nОн отвечает на приглашение: «Как-нибудь увидимся». Ты уже набираешь: «Могу и в пятницу, и в субботу». Потом стираешь: «Предложи день, когда сможешь».","caption":"Подписывайся, если узнаешь себя: здесь разбираем, почему ты выбираешь тех, кто не выбирает тебя.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ди услышала, как девушка сказала подруге: «Он сам не пишет, может, я скучно отвеч | овно стучишь в закрытую дверцу и дум"}],"cut":["Поэтому ты опять выбираешь того, с кем нужно стараться: тебе кажется, что от твоих стараний зависит, выберет ли он тебя."],"before":null},{"id":"s_r_vybor_1_C","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Почему я ему все еще пишу?\nРечь: Меня спросили: «Почему я снова выбираю мужчин, которым я особо не нужна?» И меня раздражает, когда в ответ советуют просто перестать за ними бегать. Как будто вы сами довольны: пишете первая, предлагаете встретиться, объясняете подруге, почему он опять занят, вместе с ней выясняете, считается ли сердечко под фотографией проявлением интереса.\n\nПочему после одного теплого сообщения вам снова так хочется к нему? Потому что вы уже столько пытались получить его внимание, что теперь особенно цените каждую крошечную удачу. Он написал, и вам сразу легче, вы снова чувствуете себя нужной. А то, что встретиться он опять не предложил, уже как-то забывается.\n\nЯ тоже могу увлечься психологическими объяснениями и слишком долго разбирать причины. Хотя здесь важно еще посмотреть, что у вас с ним вообще происходит: вы встречаетесь, он интересуется вами, сам предлагает побыть вместе?\n\nСердечко под фотографией пока даже свиданием назвать трудно.","caption":"Какой маленький знак внимания заставлял вас снова надеяться на отношения?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Меня спросили: «Почему я снова выбираю мужчин, которым | ними бегать. Как будто вы сами довольны: пишете первая, предлаг"}],"cut":["Вы можете все сильнее тянуться к мужчине именно потому, что вам постоянно недостает его участия.","Вам нужны отношения, в которых мужчина тоже делает шаги навстречу."],"before":null},{"id":"s_r_body_1_B","author":"Ольга","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Если перед отпуском противно смотреть на себя\nРечь: Девочки, которые перед отпуском примеряют платье, смотрят в зеркало и уже никуда не хотят ехать, я к вам.\n\nВы уже представляете, как будете удалять фотографии с моря? Потому что заранее уверены: опять себе не понравитесь, опять расстроитесь, еще и деньги потратили.\n\nИ платье меняете третий раз, хотя первое вам нравилось?\n\nВот от этого «как я могу такой куда-то ехать» меня прямо злость берет. Вы уже собираетесь весь отпуск стесняться, хотя даже чемодан еще не закрыли.\n\nМилые, вы можете сейчас себе ужасно не нравиться и все равно хотеть купаться, гулять, заказывать завтрак, фотографироваться с подругой. И от этой путаницы тоже устать: поездку ждете, себя ругаете, потом ругаете за то, что испортили себе настроение.\n\nВы уже доделали дела перед отъездом, нашли, кому оставить кота, вспомнили пароль от сайта с билетами, перестирали вещи и проверили, включен ли багаж.\n\nБлядь, вы в отпуск собрались. На конкурс красоты вы вроде вообще не записывались.","caption":"Вы перед отпуском чаще ждете поездку или переживаете, как будете выглядеть на фотографиях?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"рафии с моря? Потому что заранее уверены: опять себе не понравитесь, опять расстр | подругой. И от этой путаницы тоже ус"}],"cut":["Похоже, теперь вам мало просто выбрать, в чем удобно пойти ужинать.","Надо еще добиться, чтобы вы себе наконец разрешили радоваться поездке."],"before":null},{"id":"s_r_body_1_C","author":"Михаил","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Если перед отпуском вы ненавидите свое отражение\nРечь: Если перед отпуском вы смотрите в зеркало и думаете, что с такой внешностью лучше вообще никуда не ехать, дорогие, это вам.\n\nПрочитал похожий комментарий и зацепился за слово «лучше». Вы уже готовы отменить себе море, лишь бы никто вас не увидел.\n\nБоитесь попасть на общую фотографию? Вы заранее представляете, как ее будут рассматривать и обсуждать. Злитесь на себя, что опять думаете об этом вместо отпуска? Вы ведь еще и считаете, что портите всем настроение своей ерундой.\n\nХотя, подождите, какая же ерунда. Вы собираетесь отдыхать с людьми и одновременно ждете, что они вас осудят.\n\nВы уже перемерили все платья, отдельно проверили, как выглядите сидя, попросили подругу сразу удалять неудачные кадры, поругали себя за потраченные деньги, за испорченное настроение, за то, что опять придираетесь к себе. Ну и сборы, дорогие.\n\nВы перед отпуском сколько раз перепаковываете чемодан?","caption":"Подписывайтесь, если узнали себя: здесь про тревогу и жизнь с постоянной оглядкой на чужое мнение.","judge":null,"guard":[],"cut":["Конечно, вам трудно радоваться поездке.","Когда вы столько раз за день себя ругаете, трудно смотреть в зеркало спокойно.","И за это вы себя тоже ругаете."],"before":null},{"id":"s_r_post_1_B","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Текст на экране: Если я не напишу, мы вообще поговорим?\nРечь: Ко мне снова и снова приходят с тем, что весь вечер ждут сообщения от мужчины и проверяют телефон.\n\nЗа годы работы я заметила одну подробность: часто вы прекрасно знаете, что ему написать. Даже смешное видео уже выбрали, но отправлять придержали, потому что вчера тоже начали разговор сами.\n\nИ вот вы заходите в чат, смотрите, когда он был в сети, выходите, через десять минут заходите снова. Что вы хотите там увидеть? Что он сам вспомнил о вас и захотел поговорить, пока вы ему о себе ничего не напоминали.\n\nМеня бесит, как быстро девушки начинают себя за это ругать: блядь, опять я какая-то навязчивая. Хотя вы ему сегодня вообще ничего не написали.\n\nИногда все проще, чем я привыкла разбирать: он занят и напишет позже. Но я замечаю, что девушки часто считают, кто начал переписку, когда боятся: если я перестану писать, наше общение закончится. И весь вечер ждут возможности убедиться, что ему тоже хочется продолжать.\n\nКто у вас чаще пишет первым?","caption":"Подписывайтесь, если узнали себя: здесь про начало отношений и злость, за которую потом стыдно.","judge":null,"guard":[{"rule":"odushevlenie","quote":"вечер ждут"},{"rule":"odushevlenie","quote":"вечер ждут"},{"rule":"dvoetochiya","quote":"годы работы я заметила одну подробность: часто вы прекрасно знаете, что ему напи | стро девушки начинают себя за это руг"}],"cut":["Вы уже стыдите себя за желание с ним поговорить."],"before":null},{"id":"s_r_post_1_C","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Текст на экране: Он молчит, а вы ждете весь вечер\nРечь: Четыре признака, что вы уже живете с оглядкой на мужчину, который не пишет первым. Недавно прочитал комментарий: «Я ему не пишу, просто жду».\nВы оставляете вечер свободным. Подруге говорите, что пока не знаете насчет встречи, хотя никаких планов с ним нет. Вдруг он предложит увидеться, а вы уже согласились пойти куда-то еще.\nВы перестаете слушать подругу. Она рассказывает, как прошел день, вы замечаете уведомление, проверяете, возвращаетесь в разговор и уже не понимаете, на кого она обиделась.\nВы заранее сокращаете свои рассказы. Хотели отправить ему смешную историю с работы, но решаете, что это слишком длинно, слишком много внимания, подумает еще, что навязываетесь. В итоге он почти ничего про вас не узнает.\nВы радуетесь даже сообщению, которое вам не нравится. Он зовет приехать к нему ближе к ночи, хотя вы хотели сходить вместе куда-нибудь. Но вы так долго проверяли телефон, что уже соглашаетесь. О том, чего хотели вы, поговорите как-нибудь потом.","caption":"Можно сказать прямо: «Мне хочется, чтобы вы тоже предлагали встретиться. Я замечаю, что пока чаще пишу первой».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"шет первым. Недавно прочитал комментарий: «Я ему не пишу, просто жду». | Можно сказать прямо: «Мне хочется, чтобы вы тож"}],"cut":["Меня огорчает, сколько общения с близкими вы так пропускаете."],"before":null},{"id":"s_r_drug_1_A","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Текст на экране: Подруга появляется, только когда ей плохо\nРечь: Три признака, что подруга вспоминает о тебе, только когда ей плохо. Увидела комментарий: «Помирилась с парнем и опять пропала».\n\nТы узнаешь о ее жизни, когда все уже закончилось. Про совместный отпуск ты видела фотографии, зато после ссоры вы разговариваете до ночи. Ты знаешь каждое его обидное слово, хотя за полгода вас даже не познакомили.\n\nТы откладываешь собственные новости. Хотела рассказать, что тебя повысили, но у нее опять неприятности, и ты решаешь подождать. Меня злит это привычное «потом расскажешь», когда после твоего повышения она сразу начинает про свою ссору.\n\nТы радуешься, когда она снова жалуется. Даже отменяешь свои планы, чтобы поговорить, потому что наконец чувствуешь себя нужной. Когда у нее все налаживается, ты уже ждешь, что она исчезнет, и заранее перестаешь ей писать.\n\nМожно хоть раз позвонить тебе без жалобы на бывшего.","caption":"«Я хочу встречаться с тобой и тогда, когда у тебя все хорошо. Давай договоримся на выходные».","judge":null,"guard":[],"cut":["До твоей радости вы так и не добираетесь."],"before":null},{"id":"s_r_drug_1_B","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Текст на экране: Подруга появляется, только когда ей плохо\nРечь: Три признака, что подруга вспоминает о вас только в трудные времена. Прочитала комментарий: «Помирилась с мужем и опять пропала».\nВы заранее понимаете, зачем она звонит. На ваше предложение встретиться она неделю не отвечала, а после ссоры с мужем готова разговаривать до ночи. Вы откладываете свои дела, потому что встретиться просто так у вас давно не получается.\nВы знаете все ее неприятности и почти ничего хорошего. Про отпуск узнаете из фотографий, про новую работу случайно, зато каждую ссору обсуждаете подробно. Меня бесит это «ты же моя самая близкая», когда для вас у нее находится время исключительно на пиздец. Вам тоже хочется вместе посмеяться, куда-нибудь сходить, рассказать свое.\nВы радуетесь, когда она снова жалуется. Уже понимаете, что сегодня она будет отвечать сразу, расспросит вас, предложит увидеться. И ловите себя на том, что примирения с мужем ждете с досадой: потом она опять перестанет отвечать.","caption":"«Мне хочется встречаться с тобой и когда у тебя все хорошо. Давай договоримся, когда увидимся просто так».","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не отвечала, а"},{"rule":"dvoetochiya","quote":"в трудные времена. Прочитала комментарий: «Помирилась с мужем и опять пропала». | , что примирения с мужем ждете с досад"}],"cut":["И ведь к этому можно так привыкнуть, что даже перестать замечать."],"before":null}];const KEY='eval-2026-10-21_15-22-56_rilsy_s_zh4';
let R={};try{R=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}};
const V={publikovat:'публиковать',popravit:'поправить',v_korzinu:'в корзину'};
const fs=[...new Set(DATA.map(d=>d.format))];const fsel=document.getElementById('f');
fs.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;fsel.appendChild(o)});
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const f=fsel.value,v=document.getElementById('v').value;const m=document.getElementById('m');m.innerHTML='';let n=0;
DATA.forEach(d=>{const j=d.judge||{};if(f&&d.format!==f)return;if(v==='mine'&&R[d.id]&&R[d.id].mark)return;if(v&&v!=='mine'&&j.verdict!==v)return;n++;
const c=document.createElement('div');c.className='card';const r=R[d.id]||{};
c.innerHTML='<div class="meta"><b>'+esc(d.id)+'</b> · '+esc(d.author)+' · '+esc(d.format)+(d.asked!==d.format?' (просили '+esc(d.asked)+')':'')+' · '+esc(d.intent)+'<br>'+esc(d.topic)+'</div>'
+(d.error?'<div class="mk">Ошибка: '+esc(d.error)+'</div>':'')
+(j.verdict?'<div><span class="tag v-'+j.verdict+'">'+V[j.verdict]+'</span><span class="why">'+esc(j.why)+'</span></div>':'')
+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'
+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')
+((d.cut||[]).length?'<div class="cut">Вычеркнула: '+d.cut.map(x=>'<s>'+esc(x)+'</s>').join(' ')+'</div>':'')
+((j.ai_markers||[]).length?'<div class="mk">'+j.ai_markers.map(x=>'«'+esc(x)+'»').join(' ')+'</div>':'')
+(j.worst?'<div class="why">Худшее: '+esc(j.worst)+'</div>':'')
+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')
+'<div class="rate"><button data-m="ok" class="'+(r.mark==='ok'?'on':'')+'">Живо</button><button data-m="bad" class="'+(r.mark==='bad'?'on':'')+'">Не живо</button><input placeholder="что не так" value="'+esc(r.note||'')+'"></div>';
c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
c.querySelector('input').onchange=e=>{R[d.id]={...(R[d.id]||{}),note:e.target.value};save()};
m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
fsel.onchange=render;document.getElementById('v').onchange=render;
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,ratings:R},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ocenki-2026-10-21_15-22-56_rilsy_s_zh4.json';a.click()};
render();
</script></body></html>
