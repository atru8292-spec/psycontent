<script>
const DATA=[{"id":"d_rabota_1","author":"Михаил","format":"reels_scenka","asked":"reels_auto","intent":"kak_v_terapii","topic":"что на самом деле происходит на первой консультации у меня","text":"Текст на экране: «Я даже не знаю, что говорить»\nПерсонажи: А это я перед первой консультацией, Б это психолог\nБ: У меня на консультации можно говорить путано.\nА: Но я даже толком объяснить проблему не могу.\nБ: С чего вы хотели бы начать?\nА: Вот опять. Я же говорю, что не знаю.\nБ: Что сейчас мешает ответить?\nА: Думаю, вдруг скажу глупость, и вы удивитесь.\nБ: И что тогда?\nА: Вы поймете, что я зря пришел.\nБ: Вы уже решили, что я подумаю?\nА: Ну, другие наверняка приходят и нормально все рассказывают.\nБ: А вы сейчас что пытаетесь сделать?\nА: Угадать правильный ответ. Хотя вы просто спросили.\nБ: Да.","caption":"На первой встрече я спрашиваю и о самых обычных вещах: как вы спите, как проходит ваш день. На любой вопрос можно ответить: «Пока не хочу об этом говорить».\nМеня зовут Михаил, я психолог, работаю с теми, кто впервые обращается за помощью.\nОтправьте тому, кто волнуется перед первой консультацией.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"рече я спрашиваю и о самых обычных вещах: как вы спите, как проходит ваш день. На | любой вопрос можно ответить: «Пока н"}],"cut":[],"before":null},{"id":"d_rabota_1_2","author":"Михаил","format":"reels_otvet","asked":"reels_auto","intent":"kak_v_terapii","topic":"что на самом деле происходит на первой консультации у меня","text":"Текст на экране: Что говорить на первой консультации?\nРечь: А что мне говорить на первой консультации, если я сам не понимаю, что со мной? Я помогу начать. Спрошу, что в последнее время стало трудно. Допустим, вы говорите: после работы весь вечер думаю, что опять сделал что-то неправильно. Тогда я спрошу, что случилось на работе, какая мысль крутится, что вы делаете весь вечер. Допроса про все ваше детство у меня не будет. И обещать, что за одну встречу все станет понятно, я не стану. Начнем с того, что мешает вам сейчас.","caption":"Можно спросить меня, зачем я задаю конкретный вопрос. И сказать, что какую-то тему вы пока обсуждать не готовы.\nЯ Михаил, психолог, работаю с людьми, которые впервые решились прийти к психологу.\nПодписывайтесь, если хочется еще такого: здесь рассказываю, как проходит работа с психологом.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ремя стало трудно. Допустим, вы говорите: после работы весь вечер думаю, что опят | Подписывайтесь, если хочется еще так"}],"cut":["Меня часто об этом спрашивают, и я спокойно отношусь к тому, что человек приходит без готового объяснения.","Ну, берем один конкретный эпизод, как один провод из спутанного ящика, чтобы было за что взяться."],"before":null},{"id":"d_poziciya_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"poziciya","topic":"почему я не обещаю, что после терапии вы станете счастливой","text":"Текст на экране: Даже в терапии я какая-то несчастливая\nРечь: Я бы не стала обещать тебе: «После терапии ты обязательно станешь счастливой». Слишком много в этом обещании того, чем психолог вообще не может распоряжаться.\n\nДа, терапия может помочь тебе разобраться в себе, меньше винить себя, говорить о том, что тебе нужно. Но у тебя по-прежнему будут отношения с людьми, которые могут тебя разочаровать, будут потери, ссоры, тяжелые дни.\n\nИ вот ты слышишь обещание счастья, ходишь на терапию, а потом начинаются вопросы. Почему мне опять плохо? Я недостаточно стараюсь? Сколько еще надо в себе исправить, чтобы наконец жить нормально?\n\nПолучается, теперь даже за грусть надо отчитываться.\n\nТы отвечаешь за свои решения и поступки. Чужие решения тебе неподконтрольны. И постоянное счастье ты никому не обязана обеспечивать, даже своему психологу.","caption":"Я бы хотела, чтобы о разочаровании в терапии тоже можно было говорить на встречах. В том числе о разочаровании в самом психологе.\n\nЯ Юлия, психолог, работаю с женщинами от тридцати до сорока пяти.\nОтправь тому, кто ждет от себя постоянного счастья.","judge":null,"guard":[],"cut":["Ты все это будешь чувствовать."],"before":null},{"id":"d_poziciya_1_2","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"poziciya","topic":"почему я не обещаю, что после терапии вы станете счастливой","text":"Текст на экране: После терапии я наконец стану счастливой?\nРечь: Сижу, листаю ленту и вижу обещание: после терапии ты наконец станешь счастливой. Я психолог, и с таким обещанием у меня сразу вопросы. Счастливой утром в понедельник? Когда поссорилась с мужем? Когда мама снова недовольна? Когда мама недовольна, муж молчит, а ты еще и прекрасно понимаешь, почему тебя это задевает?\n\nЯ такого не обещаю.\n\nТы ведь можешь очень ждать, что однажды все про себя поймешь и тревога закончится. Почему так болезненно молчание, почему хочется переспросить, любит ли он тебя, почему его короткое сообщение испортило весь вечер. И вот ты поняла. А вечером опять ждешь ответа и проверяешь телефон.\n\nЯ сама люблю, когда все понятно, и тоже хочу, чтобы от понимания сразу становилось легче.\n\nВот и я сейчас понимаю, что могла спокойно пролистать. Но уже записываю ролик.","caption":"Обещание счастья еще и задает срок: пора бы уже чувствовать себя хорошо. Мне бы не хотелось, чтобы после трудной недели ты оценивала всю свою терапию по одному вечеру.\nМеня зовут Юлия, я психолог, работаю с женщинами от тридцати до сорока пяти.\nПодписывайся, если хочется еще таких разговоров про тревогу и отношения.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Сижу, листаю ленту и вижу обещание: после терапии ты наконец станешь счастл | Обещание счастья еще и задает срок: пора б"}],"cut":["Иногда действительно становится.","Терапия может помочь тебе меньше мучиться в отношениях, но понимание себя вполне уживается с тревогой, обидой и плохим днем."],"before":null},{"id":"d_sovety_1","author":"Ольга","format":"post_tg","asked":"post_tg","intent":"poziciya","topic":"почему я не даю советов «просто уйди от него»","text":"Я против этого «просто уйди»\n\nМеня бесит совет «просто уйди от него». Особенно это «просто», с которым женщине предлагают закончить отношения, собрать вещи, решить, где жить с детьми, на что жить, и еще как-нибудь выдержать все, что она при этом чувствует.\n\nЯ поддерживаю право прекратить отношения, после которых приходится неделями восстанавливаться. Даже если человек обидится, даже если близкие будут убеждать потерпеть. Но слово «просто» тут откуда?\n\nВы ведь и сами уже думали об уходе. И вот после такого совета к вашим вопросам добавляются новые: почему я до сих пор здесь? Что со мной за хуйня, если всем все понятно? Значит, раз я остаюсь, меня все устраивает?\n\nУдобно получилось. Сначала вам было плохо в отношениях, теперь еще стыдно, что вы недостаточно быстро из них вышли.\n\nЯ могу прямо сказать, что обращение с вами разрушительно. Могу обсуждать с вами расставание. Но выдавать уход за легкое действие, которое осталось взять и выполнить, я не буду.\n\nВы отвечаете за свои решения в тех обстоятельствах, в которых сейчас живете, с теми возможностями, которые у вас есть. За его унижения, угрозы и отказ считаться с вами отвечает он. Даже пока вы остаетесь рядом.","caption":"","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"}],"cut":["Да, расставание может быть нужным решением."],"before":null},{"id":"d_sovety_1_2","author":"Ольга","format":"post_tg","asked":"post_tg","intent":"poziciya","topic":"почему я не даю советов «просто уйди от него»","text":"«Просто уйдите». А дальше?\n\nСейчас сижу с телефоном, прочитала комментарии под роликом про унижения в браке и уже открыла поле ответа. Там женщине советуют собрать вещи, заблокировать мужа, снять квартиру, найти работу, перестать зависеть, полюбить себя и начать новую жизнь. Желательно до вечера, пока дети в садике.\n\nБлять, как удобно все получилось.\n\nЯ не даю советов «просто уйдите от него». Слово «просто» здесь особенно прекрасное. Вы можете прекрасно понимать, что вам плохо, и при этом считать, хватит ли денег на аренду, кто заберет ребенка, если смена до восьми, и куда вообще деваться сегодня.\n\nА вам еще пишут: ну значит, вас все устраивает.\n\nВот с этим я категорически не согласна. Можно хотеть уйти и одновременно бояться, зависеть от общих денег, надеяться, что муж все-таки перестанет вас унижать. Иногда женщина уже сто раз мысленно ушла, а потом открыла банковское приложение и вернулась.\n\nЯ тоже могу прочитать чужую историю и первым делом подумать: господи, уходите уже. И я знаю далеко не все о жизни человека по одному абзацу.\n\nПри этом я вовсе не считаю, что ради семьи нужно терпеть унижения. Чтобы решение уйти стало выполнимым, человеку нужны деньги, место, куда можно приехать, помощь с детьми, а при угрозах еще и продуманная безопасность. С этим стоит разбираться, даже если сегодня вы еще остаетесь.\n\nТак. Поле комментария я пока закрыла. Снять человеку квартиру одним уверенным комментарием у меня почему-то опять не получилось.","caption":"","judge":null,"guard":[{"rule":"schet_vsluh","quote":"сто раз"},{"rule":"kancelyarit","quote":"при этом"},{"rule":"kancelyarit","quote":"При этом"},{"rule":"dvoetochiya","quote":"А вам еще пишут: ну значит, вас все устраивает. | ть чужую историю и первым делом подумать: господи, уходите уже. И я зн"}],"cut":["У меня эта реакция есть."],"before":null},{"id":"d_ne_podhodit_1","author":"Михаил","format":"post","asked":"post","intent":"kak_v_terapii","topic":"что делать, если психолог вам не подошел","text":"Я психолог, и я против того, чтобы вы оставались в терапии из вежливости.\n\nВ комментариях спросили: как сказать психологу, что он вам не подошел? Уже хочется уйти, но неудобно, человек ведь старался. И вы снова записываетесь, чтобы его не обидеть.\n\nВы платите за возможность говорить о себе, а часть разговора тратите на то, чтобы психолог остался вами доволен.\n\nУ меня можно сказать прямо: «Я выхожу от вас и вообще не понимаю, что мы делаем». Я спрошу, в какой момент это ощущение появляется. Когда я задаю вопросы? Когда предлагаю что-то попробовать между встречами? Вам хочется, чтобы я подробнее объяснял, зачем мы это обсуждаем?\n\nМне важно разобраться в конкретном месте, где мы перестаем понимать друг друга. Как со стулом, на котором неудобно сидеть: сначала стоит выяснить, что именно мешает, можно ли его подвинуть.\n\nВ КПТ я объясняю, как связываю ваши мысли, чувства и действия с тем, с чем вы пришли. Вы можете со мной спорить. Мое объяснение тоже может оказаться неточным.\n\nПри этом неприятные чувства на встрече сами по себе еще не означают, что психолог вам не подходит. Важно, что происходит, когда вы об этом говорите. Есть ли место вашему несогласию? Готов ли психолог обсуждать свою работу?\n\nУ меня не будет требования сначала доказать, что вы имеете право уйти. И я не обещаю, что после такого разговора вам захочется остаться.\n\nМожно обсудить сомнения. Можно закончить работу коротким сообщением. Если вам подходит работа, в которой можно спрашивать, что мы делаем и зачем, напишите мне в личные сообщения.","caption":"","judge":null,"guard":[{"rule":"kancelyarit","quote":"При этом"},{"rule":"dvoetochiya","quote":"В комментариях спросили: как сказать психологу, что он вам не по | У меня можно сказать прямо: «Я выхожу от вас и вообще"}],"cut":["Получается терапия из вежливости.","Терпеть всю встречу молча довольно тяжело."],"before":null},{"id":"d_ne_podhodit_1_2","author":"Михаил","format":"post","asked":"post","intent":"kak_v_terapii","topic":"что делать, если психолог вам не подошел","text":"Я психолог, и с советом «просто скажите, что вам не подошло» у меня есть вопрос: а если вы боитесь обидеть даже психолога?\n\nВ комментариях спросили, как понять, стоит ли продолжать, если после встреч хочется все бросить. Особенно когда вы уже пробовали терапию и теперь думаете, что опять как-то неправильно ею пользуетесь.\n\nЯ бы начал с того, что происходит между нами прямо в разговоре. Допустим, вы говорите: «Да, все понятно», и тут же добавляете, что вряд ли сможете сделать то, о чем мы договорились. Я остановлюсь и спрошу: вы согласились, потому что вам это подходит? Или отказать мне было неудобно?\n\nВы киваете, берете задание, потом его откладываете и приходите с чувством, что подвели психолога. А мы так и продолжаем работу, на которую вы толком не согласились.\n\nПоэтому у меня можно сказать: вы слишком быстро спрашиваете, я теряюсь, это задание мне непонятно, я вообще хотел поговорить о другом. Я уточню, где именно мы разминулись, объясню, зачем предложил этот шаг, и мы обсудим, как двигаться дальше. Как со звуком на телефоне: пока вы молча терпите громкость, я могу считать ее удобной.\n\nОбязательного согласия со мной у меня не будет. И обещать, что после такого разговора я точно вам подойду, я тоже не могу.\n\nИногда продолжать действительно не хочется. Вы вправе закончить работу, даже если психолог хороший и старается. Объяснять ему свое решение до тех пор, пока он его одобрит, вы тоже не обязаны.\n\nЯ работаю так: мы можем обсуждать и вашу жизнь, и то, как вам со мной в кабинете.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":", что вам не подошло» у меня есть вопрос: а если вы боитесь обидеть даже психолог | прямо в разговоре. Допустим, вы гово"}],"cut":["Такое согласие из вежливости вполне может появиться и в кабинете.","Это тоже часть нашей работы."],"before":null},{"id":"z_zapis_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"priglashenie","topic":"зову на консультацию тех, кто устал тащить весь дом на себе","text":"Текст на экране: Весь дом на вас, и вы устали\nРечь: Три причины прийти ко мне, если весь дом на вас и вы уже заебались.\nПервое. Просить о помощи тяжелее, чем сделать самой. Муж готов, только скажите, что делать. И вам опять надо все продумать, объяснить, потом напомнить. Спасибо, отдохнули.\nВторое. На работе вы отдыхаете от дома. Там хотя бы понятно, когда задача закончена, и никто через минуту снова не хочет есть.\nТретье. Когда близкие справляются без вас, вам тревожно. Вроде можно полежать, но вы уже проверяете, правильно ли все сделали. Сами хотели помощи, сами теперь ходите следом.\nНа первой встрече я предложу разобраться, как обязанности в семье оказались на вас и что происходит, когда вы пытаетесь их разделить.\nПишите в директ слово «разбор».","caption":"Даже разговор о распределении дел обычно приходится начинать вам. И к нему тоже нужны силы.\nЯ Ольга, психолог, работаю с женщинами и мамами, которым слишком много приходится тащить на себе.\nЕсли узнаете себя, можете написать в комментариях слово «дом».","judge":null,"guard":[],"cut":["Можно прийти, даже если пока трудно сформулировать, чего вы хотите.","Приходите, будем разбираться вместе."],"before":null},{"id":"z_zapis_1_2","author":"Ольга","format":"reels_otvet","asked":"reels_auto","intent":"priglashenie","topic":"зову на консультацию тех, кто устал тащить весь дом на себе","text":"Текст на экране: А если я просто устала от быта?\nРечь: А если я просто устала от быта? Да, с этим можно ко мне. Я зову тех, у кого даже отдых начинается с того, что надо всем все приготовить и объяснить. Вы помните, что заканчивается молоко, ищете ребенку сменку, а когда просите помощи, вам отвечают: ну ты скажи, что сделать. Блядь, еще и задания раздать. И вот вы уже думаете, что просто плохо справляетесь, хотя весь дом держится на том, что вы постоянно все помните. На первой встрече поговорим, как у вас распределены домашние дела и что происходит, когда вы пытаетесь что-то передать другим. Пишите в директ слово «разбор».","caption":"К встрече можно ничего специально не готовить. Если дети слышны на фоне, об этом тоже можно сразу сказать.\nЯ Ольга, психолог, работаю с женщинами и мамами, которым тяжело все тащить.\nЕсли хотите на консультацию, пишите в директ слово «разбор».","judge":null,"guard":[],"cut":["Меня об этом часто спрашивают.","Приходите, с этой усталостью я работаю."],"before":null},{"id":"z_zapis_2","author":"Юлия","format":"post","asked":"post","intent":"priglashenie","topic":"открываю запись на осень: с чем ко мне можно прийти","text":"Я зову тебя на терапию, если после его короткого ответа ты снова ищешь, в чем виновата.\n\nОткрываю запись на осень. И хочу прямо сказать, с чем ко мне можно прийти.\n\nТы перечитываешь переписку, потому что вчера он писал теплее. Хочешь спросить, что случилось, но боишься показаться навязчивой. Он наконец отвечает, ты выдыхаешь, а через какое-то время опять ждешь подтверждения, что все хорошо.\n\nНа первой встрече я предложу рассказать, что сейчас происходит в твоих отношениях, что тревожит и с чем хочется разобраться. Можно говорить путано, возвращаться к одному и тому же, подбирать слова уже в разговоре.\n\nЕсли узнаешь себя и хочешь со мной об этом поговорить, приходи. Записаться ко мне можно по ссылке в шапке профиля.","caption":"","judge":null,"guard":[],"cut":["Каждый ответ становится проверкой: с тобой еще хотят быть?","И тогда даже обычное сообщение трудно просто прочитать и пойти дальше."],"before":null},{"id":"z_zapis_2_2","author":"Юлия","format":"post","asked":"post","intent":"priglashenie","topic":"открываю запись на осень: с чем ко мне можно прийти","text":"Я психолог, и я зову тебя к себе, если после его молчания ты опять ищешь, в чем виновата.\n\nОткрываю запись на осень. И сразу скажу, с чем ко мне можно прийти.\n\nКогда ты перечитываешь переписку, потому что вчера он был теплым, а сегодня ответил двумя словами. Когда хочется спросить, что между вами происходит, и ты боишься показаться навязчивой. Когда отношения занимают всю голову, даже пока ты сидишь одна и от него ничего нет.\n\nТы начинаешь обращаться с чужим молчанием как с обвинением в свой адрес. И уже оправдываешься внутри, хотя тебе еще никто ничего не сказал.\n\nНа первой встрече ты расскажешь, что сейчас происходит и что тебе трудно выдерживать. Я буду слушать, задавать вопросы, и мы обсудим, как можем работать с этим дальше. Можно прийти и с путаным рассказом.\n\nСсылка на запись в шапке профиля. Приходи, я приглашаю тебя на первую встречу.","caption":"","judge":null,"guard":[],"cut":["Я считаю, с этим достаточно тяжело, чтобы обратиться за помощью."],"before":null},{"id":"z_zapis_3","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"priglashenie","topic":"приходите, если тревога мешает жить, а «просто успокойся» не работает","text":"Текст на экране: Тревога мешает жить, советы уже надоели\nРечь: Три причины прийти ко мне, если тревога мешает жить и от совета «просто успокойтесь» толку никакого.\nПервое. Вам трудно поверить собственной проверке. Письмо уже отправлено, все правильно, но вы снова его открываете: вдруг пропустили ошибку. И проверка постепенно занимает больше времени, чем сама работа.\nВторое. Вам снова нужны подтверждения от близких. Вы спрашиваете, все ли между вами хорошо, получаете ответ, ненадолго выдыхаете, а потом хочется спросить еще раз. Уже неловко.\nТретье. Свободный вечер вас тревожит. Можно отдыхать, но именно сейчас вспоминается все, что может пойти плохо, и хочется срочно чем-нибудь заняться.\nНа первой встрече я расспрошу, как тревога влияет на вашу жизнь и что вы уже пробовали.\nЧтобы записаться, напишите мне в личные сообщения. Приходите.","caption":"На встрече можно начать с простого: «Я устал постоянно волноваться». Заранее готовить связный рассказ необязательно.\nМеня зовут Михаил, я психолог, работаю со взрослыми мужчинами и женщинами.\nОтправьте тому, кому сейчас это нужно.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"се правильно, но вы снова его открываете: вдруг пропустили ошибку. И проверка пос | На встрече можно начать с простого: "}],"cut":["Вместе обсудим, с чем будем работать."],"before":null},{"id":"z_zapis_3_2","author":"Михаил","format":"reels_otvet","asked":"reels_auto","intent":"priglashenie","topic":"приходите, если тревога мешает жить, а «просто успокойся» не работает","text":"Текст на экране: С тревогой уже пора к психологу?\nРечь: С тревогой уже пора к психологу? Да, если она мешает вам жить. Меня часто об этом спрашивают, и я зову к себе тех, у кого день все чаще проходит вот так: вечером вы хотите спать, а в голове перебираете все, что завтра может пойти плохо. Перечитываете обычное сообщение перед отправкой, потому что вдруг человека обидит ваш ответ. Откладываете важный разговор, и тревоги становится еще больше. Ну и совет просто успокоиться вы уже слышали. На первой встрече мы обсудим, в каких ситуациях вам трудно и как тревога влияет на ваши решения, сон, отношения. Я расскажу, как мы можем с этим работать. Если узнаете себя, приходите. Для записи напишите мне в личные сообщения.","caption":"На встречу можно прийти, даже если пока трудно объяснить, что именно с вами происходит. Можно начать с того, как прошел вчерашний день.\nЯ Михаил, психолог, работаю со взрослыми мужчинами и женщинами.\nПодписывайтесь, если хочется еще таких разговоров о тревоге и повседневной жизни.","judge":null,"guard":[],"cut":[],"before":null}];const KEY='eval-2026-10-02_05-01-27_rilsy_ob_zh_roli';
let R={};try{R=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}};
const V={publikovat:'публиковать',popravit:'поправить',v_korzinu:'в корзину'};
const fs=[...new Set(DATA.map(d=>d.format))];const fsel=document.getElementById('f');
fs.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;fsel.appendChild(o)});
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const f=fsel.value,v=document.getElementById('v').value;const m=document.getElementById('m');m.innerHTML='';let n=0;
DATA.forEach(d=>{const j=d.judge||{};if(f&&d.format!==f)return;if(v==='mine'&&R[d.id]&&R[d.id].mark)return;if(v&&v!=='mine'&&j.verdict!==v)return;n++;
const c=document.createElement('div');c.className='card';const r=R[d.id]||{};
c.innerHTML='<div class="meta"><b>'+esc(d.id)+'</b> · '+esc(d.author)+' · '+esc(d.format)+(d.asked!==d.format?' (просили '+esc(d.asked)+')':'')+' · '+esc(d.intent)+'<br>'+esc(d.topic)+'</div>'
+(d.error?'<div class="mk">Ошибка: '+esc(d.error)+'</div>':'')
+(j.verdict?'<div><span class="tag v-'+j.verdict+'">'+V[j.verdict]+'</span><span class="why">'+esc(j.why)+'</span></div>':'')
+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'
+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')
+((d.cut||[]).length?'<div class="cut">Вычеркнула: '+d.cut.map(x=>'<s>'+esc(x)+'</s>').join(' ')+'</div>':'')
+((j.ai_markers||[]).length?'<div class="mk">'+j.ai_markers.map(x=>'«'+esc(x)+'»').join(' ')+'</div>':'')
+(j.worst?'<div class="why">Худшее: '+esc(j.worst)+'</div>':'')
+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')
+'<div class="rate"><button data-m="ok" class="'+(r.mark==='ok'?'on':'')+'">Живо</button><button data-m="bad" class="'+(r.mark==='bad'?'on':'')+'">Не живо</button><input placeholder="что не так" value="'+esc(r.note||'')+'"></div>';
c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
c.querySelector('input').onchange=e=>{R[d.id]={...(R[d.id]||{}),note:e.target.value};save()};
m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
fsel.onchange=render;document.getElementById('v').onchange=render;
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,ratings:R},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ocenki-2026-10-02_05-01-27_rilsy_ob_zh_roli.json';a.click()};
render();
</script></body></html>
