<script>
const DATA=[{"id":"t_A_1","author":"Юлия","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"Как заслуживать его выбор годами: каждый раз находи, что еще в себе улучшить","text":"Текст на экране: Тренинг «Как заслужить серьезные отношения»\nРечь: На своем тренинге я научу тебя работать над собой, пока твой мужчина решает, хочет ли он быть с тобой.\n\nВы уже несколько лет вместе, а он пока не готов съезжаться? Прекрасно, значит, у тебя есть время стать женщиной, с которой ему захочется жить.\n\nТы уже научилась готовить то, что он любит, перестала обижаться на отмененные встречи и подружилась с его друзьями? Какая ты молодец, теперь будем учиться ничего за это не ждать.\n\nОн говорит, что ты слишком часто спрашиваешь про ваше будущее? Согласна, мужчине нужна легкость. Попробуй спрашивать пореже, обязательно после хорошего ужина и так, чтобы он мог принять это за шутку.\n\nТы уже полгода вообще ничего не спрашиваешь, а он все равно не готов? Тогда займись своей жизнью. Запишись на танцы, встречайся с подругами, только пятницу пока оставляй свободной, вдруг он захочет увидеться.\n\nЕму теперь кажется, что ты слишком самостоятельная и ему нет места в твоей жизни? Вот видишь, он уже заговорил про место. Отмени танцы, попроси его выбрать тебе роутер, мужчинам важно чувствовать себя нужными.\n\nМне нравится твой настрой, ты действительно готова работать над отношениями. Он пока готов приезжать по пятницам, и мы обязательно это учтем.\n\nНа следующем занятии разберем, как спросить, кто вы друг другу, чтобы он не почувствовал, что от него чего-то хотят.","caption":"Он может ответить, что его устраивают встречи без общих планов, и тогда тебе придется решать, подходят ли тебе такие отношения. Для начала можно сказать: «Я хочу жить вместе и строить семью. Ты хочешь этого со мной?» Если он снова объясняет свою нерешительность твоим характером, стоит вернуться к вопросу, хочет ли он сам совместной жизни.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не спрашиваешь, а"}],"cut":["Когда ты каждый раз находишь в себе очередной недостаток, у тебя сохраняется надежда: исправишь его, и мужчина наконец решится.","Поэтому прямой разговор может пугать сильнее, чем еще один год ожидания."],"before":null},{"id":"t_A_2","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"Он тебя не приглашал, но субботу ты уже отдала ему","text":"Текст на экране: Он молчит, а суббота уже занята\nРечь: Три признака, что ты уже отдала ему свое время, хотя он тебя никуда не приглашал.\nУвидела в комментариях вопрос: как узнать его планы на выходные и не показаться навязчивой.\nТы отказываешь подруге заранее. Она предлагает купить билеты на субботу, ты пишешь, что пока не знаешь. Его ты тоже не спрашиваешь: вдруг он собирался позвать, а ты все испортишь своим вопросом. В итоге подруга идет с другой.\nТы работаешь с открытой перепиской. Проверяешь, прочитал ли он твой ответ, возвращаешься к письму коллеге и снова перечитываешь начало. Меня злит, как легко потом назвать себя несобранной: ты полдня пытаешься угадать, понадобишься ли ему вечером.\nТы даже в терапии торопишься стать такой, какую он захочет пригласить. У меня в кабинете иногда считают салфетки: три использованных, значит, хорошо поработали. И ты можешь так же старательно разбирать свою тревогу, чтобы наконец спокойно ждать его сообщений. Субботу ты при этом продолжаешь держать свободной.","caption":"От каких планов ты отказывалась ради встречи, которую тебе еще никто не предложил?","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"},{"rule":"dvoetochiya","quote":"Увидела в комментариях вопрос: как узнать его планы на выходные и не п | ка не знаешь. Его ты тоже не спрашиваешь: вдруг"}],"cut":[],"before":null},{"id":"t_A_3","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"poziciya","topic":"«Я все делаю правильно, а рядом никого»: почему в кабинете мы откладываем список достижений","text":"Текст на экране: Я все делаю правильно, а рядом никого\nРечь: На днях в очереди услышала, как женщина говорила подруге: «Я вроде все делаю правильно, а рядом никого». И дальше перечисляла, сколько уже занимается собой.\n\nМеня зацепило это «правильно», потому что с таким списком легко начать требовать от себя еще больше. Ты работаешь, сама себя обеспечиваешь, умеешь слушать, научилась говорить о своих желаниях, теперь еще к психологу ходишь. Осталось научиться спокойно говорить о желаниях мужчине, который третью неделю никак не выберет день для встречи.\n\nИ что, теперь надо еще спокойнее? Вот тут мы в кабинете и откладываем список достижений. Когда ты его перечисляешь, ты словно спрашиваешь: сколько еще нужно сделать, чтобы меня наконец выбрали?\n\nПоэтому меня злят обещания, что после терапии ты обязательно станешь счастливой. Ты можешь услышать в этом очередное условие: хорошо поработаешь над собой, получишь любовь.\n\nМне самой хочется, чтобы у тебя все сложилось, и мне тоже бывает трудно удержаться от обнадеживающих слов. Только обещать тебе встречу я не могу.\n\nЯ хочу, чтобы ты могла выбирать, с кем тебе жить, даже когда очень страшно снова остаться одной. Именно такой помощи я жду от нашей работы.","caption":"Подписывайся, если устала стараться ради тех, кто тебя не выбирает. Здесь разбираемся, почему так происходит.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"и услышала, как женщина говорила подруге: «Я вроде все делаю правильно, а рядом н | его перечисляешь, ты словно спрашива"}],"cut":["В кабинете нужно место и для того, чего ты сама хочешь от отношений, с чем уже устала соглашаться."],"before":null},{"id":"t_B_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"Как стать начальницей мужа и остаться единственной ответственной за дом","text":"Текст на экране: Тренинг «Как правильно просить мужа помочь»\nРечь: Девочки, я веду тренинг для жен, которые устали делать по дому все сами. Сейчас научу вас делегировать, и вы наконец отдохнете.\n\nМуж говорит: «Ну скажи, что сделать, я сделаю»? Какой у вас замечательный муж, уже готов участвовать. Осталось только придумать ему занятие, выбрать время и убедиться, что он вас услышал.\n\nВозьмем стирку, начнем с самого простого. Попросили постирать? Прекрасно, теперь уточните, что именно. Он же откуда знает, что ребенку завтра нужна форма? Вы знаете, вы и скажите.\n\nПорошок где стоит, тоже покажите, даже если он там стоит с момента покупки машинки. Мужчина может смотреть на полку и думать о другом, уважайте его внутренний мир.\n\nА вот тут очень важно вовремя напомнить, что машинка закончила стирать. Он же выполнил вашу просьбу, он ПОСТИРАЛ. Вы про развесить ничего не говорили, тут я как специалист на его стороне.\n\nВам проще самой все сделать? Девочки, ну что за хуйня, мы же учимся отпускать контроль. Просто стойте рядом и спокойно подсказывайте, какую кофту нельзя в сушилку.\n\nПотом обязательно похвалите, чтобы он захотел повторить. Что значит, вас за стирку никто не хвалит? Вы сейчас опять отвлекаетесь от его успехов.\n\nИ уже завтра сможете спокойно уйти по своим делам. Только заранее рассортируйте белье, подпишите кучки и оставайтесь на связи. Если муж пришлет фотографию машинки с вопросом, какую кнопку нажать, ответьте сразу. Вы же хотели, чтобы он проявлял инициативу.","caption":"Попробуйте договориться об одном деле целиком: «Давай стирка будет полностью на тебе, включая проверку, что у детей есть чистая одежда на завтра». Сразу обсудите, где можно посмотреть, как стирать вещи, и к какому времени они обычно нужны. Дальше муж сам проверяет корзину, выбирает время и доводит стирку до сухого белья в шкафу. Если он каждый раз ждет напоминания, стоит прямо вернуться к договоренности: «Мы договаривались, что ты сам следишь, когда пора стирать».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Муж говорит: «Ну скажи, что сделать, я сделаю»? Како | буйте договориться об одном деле целиком: «Давай стирка будет пол"}],"cut":["Привычные мелочи придется передать, особенно если раньше ими занималась только жена."],"before":null},{"id":"t_B_2","author":"Ольга","format":"reels_poslanie","asked":"reels_auto","intent":"razreshenie","topic":"Кричу на ребенка: злюсь на него или ссорюсь с мужем через него?","text":"Текст на экране: Если срываетесь на ребенка из-за мужа\nРечь: Если вы кричите ребенку «сколько можно меня дергать», пока муж спокойно смотрит сериал, эти слова для вас.\n\nУвидела под роликом про уставшую маму знакомое: «Родила, теперь занимайся». Меня бесит, как легко папа вообще исчезает из этой истории.\n\nА что, если побыть «эгоисткой», которой вас пугают, вполне нормально?\n\nЭгоистка хочет спокойно помыться, закрывает дверь ванной, пока папа дома, и слышит: «Ты что, даже с ребенком посидеть не можешь?»\n\nЭгоистка хочет досмотреть свою серию, просит мужа самому собрать ребенку одежду на завтра и слышит: «Тебе сложно сказать, где что лежит?»\n\nЭгоистка хочет закончить разговор, отправляет ребенка с вопросом к папе и слышит: «Чего ты его гоняешь, он же к тебе пришел».\n\nНа моих онлайн-сессиях мамы порой прячутся в ванной, чтобы их хоть немного послушали.\n\nВы боитесь стать матерью, к которой нельзя подойти, поэтому снова встаете, ищете, отвечаете. Потом ребенок просит найти носки, и вы орете. Хотя злитесь еще и на мужа, который весь вечер свободен.\n\nИ злость на мужа никуда не девается, пока вы продолжаете молчать с ним.\n\nПапа, блин, нашел пульт среди диванных подушек, детские носки тоже найдет.","caption":"Из-за какой домашней мелочи вы срывались, когда на самом деле злились на мужа?","judge":null,"guard":[{"rule":"na_samom_dele","quote":"на самом деле"},{"rule":"dvoetochiya","quote":"а под роликом про уставшую маму знакомое: «Родила, теперь занимайся». Меня бесит, | т дверь ванной, пока папа дома, и сл"}],"cut":["Ребенку от вашего крика страшно."],"before":null},{"id":"t_B_3","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"Перемываю за мужем, а потом возмущаюсь, что посуда опять на мне","text":"Текст на экране: Перемываете за мужем, потом злитесь на него?\nРечь: Три признака, что вы переделываете за мужем, лишь бы снова не ругаться.\nВы молча достаете из сушилки тарелку с засохшей едой. Увидела в комментариях «проще самой перемыть», и меня бесит, сколько дел женщине предлагают забрать себе этим «проще». Потому что попросить мужа домыть тарелку означает еще и выслушать, что вам вечно все не так. Вы уже знаете, сколько будете спорить, и открываете кран.\nВы отказываетесь от встречи с подругой, хотя муж остается дома. Он сказал, что покормит детей, но вы уже представляете, что потом придется оттирать, и решаете никуда не идти.\nВам стыдно сказать, что вы заебались с посудой. Ведь муж ее помыл, а вы сами полезли перемывать, теперь вроде бы нечего жаловаться. И вот вы уже оправдываетесь перед ним за свою злость, хотя собирались попросить его смывать еду с тарелок.\nУ вас чаще получается попросить домыть или молча перемыть?","caption":"Подписывайтесь, если узнаете себя: здесь про быт, мужа, который «помогает», и злость, за которую потом стыдно.","judge":null,"guard":[],"cut":["Муж еще даже ужин не приготовил, а вы уже отменили свой вечер."],"before":null},{"id":"t_C_1","author":"Михаил","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"Зеркало уже знает, что мое мнение важно. Осталось сообщить его людям","text":"Текст на экране: Тренинг уверенности. Пока перед зеркалом\nРечь: На моем тренинге уверенности вы каждое утро говорите зеркалу, что ваше мнение важно. Я лично рекомендую смотреть себе в глаза, чтобы вы понимали, что разговор серьезный.\n\nМуж уже пригласил родственников на выходные, а вы хотели отдохнуть? Отличный материал для нашей практики. Подойдите к зеркалу и уверенно скажите: «Я хочу провести выходные спокойно». Муж пока пусть занимается гостями, мы с вами занимаемся уверенностью.\n\nВы уже неделю повторяете, а он все равно спрашивает, какой салат вы приготовите? Значит, добавляем осанку. Мне очень нравится работать с осанкой: сразу видно результат, и никому ничего неприятного говорить не приходится.\n\nСказать мужу, что вы вообще не собирались готовить? Я бы сейчас не торопился. Он ведь может спросить почему, расстроиться, сказать, что уже всех позвал. Вы представляете, сколько всего придется отвечать без подготовки?\n\nА у зеркала вы прекрасно справляетесь. Оно вас дослушивает, никаких претензий, никаких «мама уже купила билеты». Вот с такой поддержкой и нужно начинать.\n\nТеперь запишите свое утверждение в красивый блокнот. Подчеркните слово «важно». Если осталось время до приезда гостей, посмотрите мой урок про внутреннюю опору.\n\nКак быть с салатом? Пока приготовьте, конечно, вы же уже продукты купили. А после гостей обязательно похвалите себя перед зеркалом за то, что выбрали себя.","caption":"Иногда самое трудное в уверенном ответе начинается, когда близкий все услышал и остался недоволен. Можно ясно высказать свое желание и все равно столкнуться с уговорами или обидой. Полезно заранее подготовить ответ именно на уговоры: «Я понимаю, что ты уже пригласил гостей. Я собиралась отдыхать и готовить на всех в эти выходные не буду».","judge":null,"guard":[{"rule":"dvoetochiya","quote":". Подойдите к зеркалу и уверенно скажите: «Я хочу провести выходные спокойно». Му | у. Мне очень нравится работать с оса"}],"cut":["Такая подготовка помогает продолжить разговор, когда хочется немедленно уступить, лишь бы закончить спор.","Уверенность может появляться постепенно, уже после нескольких разговоров, в которых удалось сохранить свое решение."],"before":null},{"id":"t_C_2","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"poziciya","topic":"«Я спросил, но все равно боялся»: почему в кабинете это не провал","text":"Текст на экране: Я спросил, но все равно боялся\nРечь: «После психолога всегда должно становиться легче», говорят близкие, когда вы возвращаетесь с сессии и снова переживаете, правильно ли вы все сказали.\n\nТут бывают два разных случая, и разница существенная.\n\nВ первом вы наконец говорите психологу, что не поняли его объяснение, и просите повторить. Он объясняет другими словами, вы уточняете, но все равно боитесь показаться глупым. Потом еще по дороге домой вспоминаете, как задали вопрос.\n\nВы опять боялись, значит, ничего не получилось? Получилось: раньше вы кивали и уходили, ничего не поняв, теперь спросили и разобрались.\n\nЯ вижу из окна, как некоторые клиенты приезжают заранее и какое-то время сидят в машине перед встречей. В кабинет они заходят вместе со своей тревогой.\n\nВо втором случае психолог на вашу просьбу повторить раздражается, высмеивает вопрос, говорит, что вы невнимательно слушаете. Вы уже выбираете слова так, чтобы его не рассердить, и перестаете спрашивать вообще.\n\nС первым случаем можно продолжать работу и договариваться, как вам понятнее. Во втором стоит искать другого специалиста. Терпеть унижение ради уверенности довольно странно.","caption":"Что вы однажды смогли спросить, хотя все еще боялись?","judge":null,"guard":[{"rule":"vvodnye","quote":"другими словами"}],"cut":["Уверенность появляется постепенно, когда вы пробуете так поступать.","Страх вполне может сохраняться."],"before":null},{"id":"t_C_3","author":"Михаил","format":"reels_poslanie","asked":"reels_auto","intent":"razreshenie","topic":"Согласились и злитесь: вас продавили или вы сами решили, что отказать нельзя?","text":"Текст на экране: Если согласились на гостей и теперь злитесь\nРечь: «В отношениях всегда надо уступать», говорят вам близкие, когда вы согласились на гостей в выходной и теперь злитесь на партнера. Меня настораживает это «всегда»: под него можно потребовать уступить что угодно.\n\nЗдесь бывают два разных случая.\n\nВы хотели провести субботу вдвоем, партнер предложил позвать друзей, и вы сразу сказали: «Хорошо». Уже потом подумали, что опять придется готовить и убирать. Вы слышали: «Из-за таких мелочей не спорят», и теперь боитесь показаться придирчивыми. При этом партнер раньше спокойно принимал ваши отказы. Здесь можно договариваться, даже если вы сначала согласились: «Я поторопился с ответом, давай перенесем гостей».\n\nВо втором случае вы уже говорили, что хотите отдохнуть. Партнер продолжал уговаривать, называл вас эгоистом, говорил: «Если любишь, потерпишь». После отказа он несколько дней с вами не разговаривает. Вы соглашаетесь, потому что уже знаете, что будет дома.\n\nЕсли это повторяется, стоит обратиться к психологу за помощью: вы уже пытались договориться и знаете цену несогласия.\n\nУ вас отказ принимают или потом припоминают?","caption":"Подписывайтесь, если узнали себя: здесь про отношения, тревогу и страх того, что о вас подумают.","judge":null,"guard":[{"rule":"kancelyarit","quote":"При этом"},{"rule":"dvoetochiya","quote":"артнера. Меня настораживает это «всегда»: под него можно потребовать уступить что | ложил позвать друзей, и вы сразу ска"}],"cut":["Вы еще ничего не обсудили, но уже решили, что обсуждать нельзя.","Здесь просьба уступить сопровождается наказанием за отказ."],"before":null}];const KEY='eval-2026-10-21_15-22-58_rilsy_t_zh4';
let R={};try{R=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

const V={publikovat:'публиковать',popravit:'поправить',v_korzinu:'в корзину'};

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

c.innerHTML='<div class="meta"><b>'+esc(d.id)+'</b> · '+esc(d.author)+' · '+esc(d.format)+(d.asked!==d.format?' (просили '+esc(d.asked)+')':'')+' · '+esc(d.intent)+'<br>'+esc(d.topic)+'</div>'
+(d.error?'<div class="mk">Ошибка: '+esc(d.error)+'</div>':'')
+(j.verdict?'<div><span class="tag v-'+j.verdict+'">'+V[j.verdict]+'</span><span class="why">'+esc(j.why)+'</span></div>':'')
+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'
+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')
+((d.cut||[]).length?'<div class="cut">Вычеркнула: '+d.cut.map(x=>'<s>'+esc(x)+'</s>').join(' ')+'</div>':'')
+((j.ai_markers||[]).length?'<div class="mk">'+j.ai_markers.map(x=>'«'+esc(x)+'»').join(' ')+'</div>':'')
+(j.worst?'<div class="why">Худшее: '+esc(j.worst)+'</div>':'')
+((d.guard||[]).length?'<div class="meta">Код нашел: '+d.guard.map(g=>esc(g.rule)).join(', ')+'</div>':'')
+'<div class="rate"><button data-m="ok" class="'+(r.mark==='ok'?'on':'')+'">Живо</button><button data-m="bad" class="'+(r.mark==='bad'?'on':'')+'">Не живо</button><input placeholder="что не так" value="'+esc(r.note||'')+'"></div>';
c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
c.querySelector('input').onchange=e=>{R[d.id]={...(R[d.id]||{}),note:e.target.value};save()};
m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
fsel.onchange=render;document.getElementById('v').onchange=render;
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,ratings:R},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ocenki-2026-10-21_15-22-58_rilsy_t_zh4.json';a.click()};
render();
