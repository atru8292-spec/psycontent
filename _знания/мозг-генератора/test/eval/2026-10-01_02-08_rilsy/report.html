<script>
const DATA=[{"id":"tema_1","author":"Ольга","format":"post","asked":"post","intent":"uznavanie","topic":"хочу, чтобы никто не видел моих ошибок, снаружи у меня все идеально","text":"Вы трижды переделали работу, легли в четыре утра, а утром написали: «Да там все легко было».\n\nВроде мелочь, да? Ну зачем рассказывать, что вы перепутали файлы, сначала сделали вообще другое и полчаса плакали над ноутбуком. Главное, сдали. Снаружи все идеально.\n\nВ переписке остается «готово ❤️». Сообщение «я запуталась, можно спросить?» вы удалили еще вчера. Коллега предлагает помочь, вы отвечаете: «Спасибо, я уже разобралась». Хотя еще нихуя не разобрались.\n\nЧасто за этим стоит страх: если увидят ошибку, придется заново доказывать, что вы вообще чего-то стоите. Поэтому вы стараетесь успеть все исправить до того, как кто-нибудь заметит.\n\nИ постепенно окружающие привыкают: вам легко, вы умеете, вы всегда вывозите. Можно дать еще задачу. Можно даже не спрашивать, нужна ли помощь.\n\nА вы потом сидите и злитесь: «Почему все решили, что я железная?»\n\nДевочки, они видят только ту часть, которую вы оставили им в переписке. Все ваши «я не понимаю», «мне страшно», «я тут накосячила» остались в черновиках.\n\nИ с подругой так же. Рассказать про провал можно будет потом, когда вы все исправите и сможете смешно пересказать. Пока внутри пизд*ц, на вопрос «как ты?» отвечаете: «Да нормально».\n\nКак вас поддержать в том, что вы так тщательно скрыли?","caption":"","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":["Часто за этим стоит страх","Как вас поддержать в том, что вы так тщательно скрыли?"],"worst":"Как вас поддержать в том, что вы так тщательно скрыли? — Звучит как упрек: сама скрывала, сама виновата, что не помогают.","best":"Сообщение «я запуталась, можно спросить?» вы удалили еще вчера.","verdict":"popravit","why":"Точные бытовые детали и полезная связь: скрывая трудности, можно незаметно получить еще больше задач. Переписать обвиняющий финал и добавить ситуацию с мужем или детьми: сейчас текст преимущественно про работу, а не про основную аудиторию автора."},"guard":[{"rule":"dvoetochiya","quote":"у, легли в четыре утра, а утром написали: «Да там все легко было». | Коллега предлагает помочь, вы отвечаете: «Спасибо, "}],"cut":["Только вместе с ошибкой вы спрятали, сколько сил вам это стоило.","Получается странная штука: чем убедительнее вы показываете, что справились САМА, тем реже вам предлагают помощь."],"before":null}];const KEY='eval-2026-10-01_02-08_rilsy';

const V={publikovat:'публиковать',popravit:'поправить',v_korzinu:'в корзину'};
const fs=[...new Set(DATA.map(d=>d.format))];const fsel=document.getElementById('f');
fs.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;fsel.appendChild(o)});
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const f=fsel.value,v=document.getElementById('v').value;const m=document.getElementById('m');m.innerHTML='';let n=0;
DATA.forEach(d=>{const j=d.judge||{};if(f&&d.format!==f)return;if(v==='mine'&&R[d.id]&&R[d.id].mark)return;if(v&&v!=='mine'&&j.verdict!==v)return;n++;
const c=document.createElement('div');c.className='card';const r=R[d.id]||{};
c.innerHTML='<div class="meta"><b>'+esc(d.id)+'</b> · '+esc(d.author)+' · '+esc(d.format)+(d.asked!==d.format?' (просили '+esc(d.asked)+')':'')+' · '+esc(d.intent)+'<br>'+esc(d.topic)+'</div>'
+(d.error?'<div class="mk">Ошибка: '+esc(d.error)+'</div>':'')
+(j.verdict?'<div><span class="tag v-'+j.verdict+'">'+V[j.verdict]+'</span><span class="why">'+esc(j.why)+'</span></div>':'')
+(j.zhivo?'<div class="scores"><span>живо '+j.zhivo+'</span><span>цепляет '+j.zacep+'</span><span>понятно '+j.ponyatno+'</span><span>польза '+j.polza+'</span>'+(j.interesno?'<span>интересно '+j.interesno+'</span>':'')+(j.snyat?'<span>снять '+j.snyat+'</span>':'')+'</div>':'')
+(d.before?'<div class="meta">до ножниц: '+V[d.before.verdict]+', живо '+d.before.zhivo+', интересно '+(d.before.interesno||'')+'</div>':'')
+'<pre>'+esc(d.text)+'</pre>'
+(d.caption?'<div class="cap"><b>Описание к публикации</b><br>'+esc(d.caption)+'</div>':'')

+(j.worst?'<div class="why">Худшее: '+esc(j.worst)+'</div>':'')

m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}

render();
</script></body></html>
