<script>
const DATA=[{"id":"r_mif_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: Я плачу за то, что меня слушают?\nРечь: «Зачем платить психологу, если он просто слушает и кивает?» Я бы за одни кивки тоже платить не стал.\n\nДопустим, вы рассказываете, что опять взяли работу на выходные. Начальник попросил, пришлось согласиться. И психолог спрашивает, что случилось бы, если бы вы отказали.\n\nВы говорите, что вас бы уволили. А такое уже случалось? Нет. Кого-нибудь увольняли за отказ? Тоже нет. Но вы каждую пятницу соглашаетесь так, будто увольнение уже завтра.\n\nВот это я считаю важной работой.\n\nА если психолог только кивает, вы вправе спросить, что вы вместе делаете и зачем.","caption":"На первой встрече вполне уместен вопрос о том, как будут проходить ваши встречи. Психологу стоит объяснить это понятными словами.\nМеня зовут Михаил, я психолог, работаю с людьми 25-40 лет, которые впервые приходят за помощью.\nОтправьте тому, кто пока сомневается, стоит ли идти к психологу.","judge":null,"guard":[],"cut":["Разобраться, почему вы даже отказать не пробуете и насколько ваши опасения совпадают с тем, что происходит."],"before":null},{"id":"r_vopros_1","author":"Ольга","format":"reels_otvet","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Зачем мне психолог, если у меня есть подруги?\nРечь: Зачем мне психолог, если у меня есть подруги? Чтобы разобраться даже в том, за что вас хочется пожалеть. Вот вы рассказываете подруге, что опять согласились помочь, хотя сил нет, а потом весь вечер злились. Она говорит «Да они охуели уже, столько на вас вешать». И становится легче, вас поняли. Но мне как психологу еще интересно, почему вы согласились. Что случится, если вы откажете? Вы боитесь обидеть человека? Или потом будете считать себя плохой подругой? И вот тут я бы задержалась. Потому что все вокруг могут пожалеть вас, а вы завтра снова согласитесь и снова будете злиться.","caption":"Подруга тоже умеет задавать неудобные вопросы. Только дружба взаимная, ей тоже нужно место для своих переживаний. На встрече с психологом можно весь час говорить о себе.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nСохраните, если тоже задавались этим вопросом.","judge":null,"guard":[],"cut":["Это правда ценно."],"before":null},{"id":"r_post_1","author":"Юлия","format":"post","asked":"post","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Ты весь вечер проверяешь, не написал ли он, но сама первой писать не хочешь.\n\nУже и душ приняла, и сериал включила, а телефон все равно рядом, экраном вверх. Потому что сейчас его сообщение должно ответить на вопрос, который ты ему даже не задавала. Он вообще вспоминает обо мне сам?\n\nНаписать хочется. Открываешь чат, набираешь что-нибудь про свой день, стираешь. Если напишешь сама, так и не узнаешь, собирался ли он тебе написать. Придется ждать.\n\nЯ бы здесь обратила внимание на то, чего ты ждешь от этого сообщения. Тебе нужно почувствовать, что он сам захотел с тобой поговорить. Без напоминания о себе.\n\nНо дальше начинается мучительная штука. Он был в сети, сообщение так и не пришло, и ты уже думаешь, что ему с тобой скучно. Вспоминаешь, что говорила на свидании. Зачем вообще столько рассказывала? Надо было раньше уйти.\n\nОх, уже и свидание успела испортить себе задним числом. Хотя еще днем вспоминала его с улыбкой.\n\nА если все-таки пишешь и он отвечает тепло, успокоиться трудно. Сама ведь начала. Вдруг он просто вежливый?\n\nТак можно переписываться весь вечер и все равно чувствовать себя ненужной.\n\nПо одному вечеру ты не узнаешь, насколько ему нужны ваши отношения. Но если разговоры постоянно начинаешь только ты, скажи ему, что тебе хочется, чтобы он тоже сам тебе писал. Это желание не нужно прятать и молча ждать, догадается ли он.","caption":"","judge":null,"guard":[],"cut":["И это желание вполне понятное.","Потому что тебе хочется убедиться, что он выбирает тебя сам, а любое собственное движение к нему ты считаешь подсказкой, после которой его ответ уже не считается."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Вы опять перечитываете письмо перед отправкой?\n\nПисьмо готово, вы уже проверили цифры, но открываете его еще раз. Вдруг там такая глупость, что коллеги сразу поймут, кого вообще взяли на работу.\n\nИ вот вы уже подбираете другое слово вместо «предлагаю». Слишком уверенно звучит. Вдруг спросят, почему вы так решили, и придется объяснять.\n\nКогда страшно, что вас раскусят, даже обычное письмо становится проверкой того, имеете ли вы право здесь работать. Поэтому отправить его после обычной проверки трудно. Хочется сначала полностью успокоиться.\n\nЯ бы здесь обратил внимание на то, что происходит ПОСЛЕ отправки. Коллеги приняли ваше предложение, работа идет дальше. Казалось бы, можно выдохнуть и признать, что вы справились.\n\nНо вы думаете примерно так: «Хорошо, что десять раз проверил. Иначе точно опозорился бы».\n\nИ к следующей задаче снова подходите с ощущением, что ничего не умеете.\n\nОбидная штука. Работы сделано уже немало, а веры в себя столько же, сколько в первый день.\n\nПроверять работу полезно. Но если каждую проверку продолжать до полного спокойствия, можно потратить час и все равно найти повод сомневаться. Тревоге всегда найдется еще одно слово, которое стоит заменить.\n\nС обычным рабочим письмом попробуйте заранее решить, что именно нужно проверить, и отправить его, когда это сделано. Даже если вы еще волнуетесь. Чтобы узнать, как коллеги оценят вашу работу, придется однажды отправить ее без десятой проверки.","caption":"","judge":null,"guard":[],"cut":["Вот так и получается, что удачный результат каждый раз записывается на счет лишних проверок.","Вы подготовили нормальное предложение, но уверены, что вас спасла только эта возня с письмом."],"before":null},{"id":"r_car_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Слайд 1: Подруга в депрессии, вы не знаете, что сказать\n\nСлайд 2: Подруга пишет, что весь день лежит, и вы предлагаете ей выйти погулять, чтобы стало легче.\n\nВы хотите помочь. А ей уже тяжело даже сходить в душ. Теперь нужно еще объяснить вам, почему на прогулку она не пойдет.\n\nСлайд 3: Я бы убрала из поддержки ожидание, что подруга должна сразу почувствовать себя лучше.\n\nПри депрессии сил на разговор тоже может не хватать. А тут ЕЩЕ нужно обрадоваться вашему предложению, чтобы вы не расстроились. Бл*дь, еще и вас успокаивать.\n\nСлайд 4: Подруга читает сообщения и молчит.\n\nОтветить бывает трудно, особенно когда вы спрашиваете, стало ли лучше. Если все по-прежнему, она может откладывать ответ, потому что боится вас разочаровать. Напишите, что ответа не ждете. И правда оставьте ей эту возможность.\n\nСлайд 5: Подруга соглашается встретиться, потом отменяет.\n\nКогда договаривались, ей хотелось увидеться. К вечеру сил хватило только добраться до кровати. Это не значит, что ваша дружба ей безразлична. Если после каждой отмены приходится оправдываться, в следующий раз проще вообще ничего не планировать.\n\nСлайд 6: Подруга говорит, что ей ничего не помогает.\n\nВам хочется напомнить, сколько хорошего есть в ее жизни. Но она и сама это знает. От этого особенно хреново, потому что появляется вина за свое состояние. Я бы оставила разговор о том, как ей сейчас, без попытки ее переубедить.\n\nСлайд 7: Предложите подруге одну конкретную помощь, на которую легко ответить. Например, заказать ей ужин, если самой готовить тяжело.\n\nЕсли она согласится, помогите с едой и не ждите, что она сразу оживится.","caption":"Я бы спросила себя, выдержу ли я, если после моей помощи подруге все еще будет плохо.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 20 до 40.\nПодписывайтесь, если хочется еще таких разговоров, здесь я пишу про отношения и то, с чем нам бывает тяжело.","judge":null,"guard":[],"cut":["Ей не нужно изображать хорошее настроение в благодарность за вашу заботу.","Это трудный момент, особенно когда очень ее любишь."],"before":null},{"id":"r_mif_2","author":"Юлия","format":"post","asked":"post","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"«Просто перестань себя накручивать, и тревога пройдет».\n\nЯ с этим советом не согласна. Особенно с этим прекрасным «просто».\n\nТы ждешь ответа на сообщение и уже думаешь, что человек обиделся. Открываешь переписку, перечитываешь свое последнее сообщение. Вроде ничего такого. Тогда почему молчит?\n\nА потом вспоминаешь, что надо перестать накручивать. И начинаешь ругать себя еще и за это. Другие спокойно живут, а ты даже со своими мыслями справиться не можешь.\n\nТеперь тебе тревожно и стыдно, что тревожно. Спасибо, помогли.\n\nТы не выбираешь первую мысль, которая приходит в голову. Она уже появилась, пока ты вообще сообразила, что происходит. И от приказа себе успокоиться она не исчезнет.\n\nЗато дальше есть вещи, которые зависят от тебя. Открыть переписку в десятый раз. Написать еще одно сообщение, чтобы проверить, точно ли все хорошо. Эти проверки дают короткую передышку, и потом снова хочется проверить.\n\nТы можешь отвечать за свои действия, даже когда внутри тревожно.\n\nЕсли уже перечитала сообщение и ничего нового там нет, отложи телефон и займись тем, что собиралась делать. Для этого тебе не нужно сначала полностью успокоиться.","caption":"","judge":null,"guard":[{"rule":"schet_vsluh","quote":"в десятый раз"}],"cut":["Я хочу, чтобы ты разделяла это.","Винить себя за само чувство совершенно незачем."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Звоните маме, чтобы потом не оправдываться\nРечь: Четыре признака, что ежедневные звонки маме стали для вас обязанностью, которую страшно пропустить.\nПервое. Вы заранее готовите оправдание. Еще рабочий день не закончился, а вы уже придумываете, как объяснить маме, почему вчера не набрали.\nВторое. Отдых начинается только после звонка. Фильм включили, но сначала надо поговорить с мамой, иначе весь вечер будете ждать обиженного сообщения. Блядь, даже кино спокойно не посмотреть.\nТретье. Вы злитесь на близких, когда мама звонит. Муж что-то спрашивает, вы огрызаетесь, потому что сейчас важно услышать, каким тоном она сказала привет.\nЧетвертое. Вы радуетесь, когда мама не берет трубку. Звонок в списке есть, вы попытались, сегодня к вам никаких претензий.\nЯ бы здесь спросила себя, почему пропущенный разговор приносит ТАКОЕ облегчение.","caption":"Если мама обиделась, вы можете потом весь вечер проверять, прочитала ли она ваше сообщение.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nЕсли узнали себя, напишите в комментариях свой пункт.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не закончился, а"}],"cut":["Я считаю, что вот это ожидание тоже важно замечать, когда обсуждаем ежедневные звонки."],"before":null},{"id":"r_men_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Терпите весь день, срываетесь на детей\nРечь: Четыре признака для отцов, которые весь день терпят, а вечером кричат на детей.\nПервое. Вам трудно признать, что вас обидели. Начальник при всех отчитал, вы весь вечер прокручиваете разговор и убеждаете себя, что ерунда.\nВторое. Вы стыдитесь усталости. Хочется полчаса побыть без детей, но вы же отец, чего разнылись. Я не понимаю, почему отцовство должно отменять усталость.\nТретье. Предложение помочь вас задевает. Жена предлагает подменить вас с ребенком, и сразу хочется доказать, что сами справитесь.\nЧетвертое. Детские слезы раздражают сильнее самого проступка. Разбил чашку, ладно, но зачем теперь реветь? И вы требуете немедленно успокоиться.\nРебенку достаются те же слова, которыми вы затыкаете себя, когда вам тяжело.","caption":"После крика бывает стыдно даже подойти к ребенку. И вы снова молчите, потому что признать свой срыв тоже тяжело.\nМеня зовут Михаил, я психолог, работаю с мужчинами 30-45 лет, с отцами.\nЕсли узнали себя, напишите в комментариях свой пункт.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_vopros_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: Первая сессия\nПерсонажи: А это клиентка, Б это психолог\nА: Я пришла на первую сессию и не знаю, что говорить.\nБ: О чем думала по дороге?\nА: Что у меня ничего такого ужасного не случилось.\nБ: И что тогда?\nА: Вы послушаете и скажете, что я зря пришла.\nБ: Я пока слушаю.\nА: Я просто плачу после работы. Даже рассказывать особо нечего.\nБ: Погоди. Мне хочется про это услышать.\nА: Ну это же скучно. Все устают после работы.\nБ: Ты переживаешь, что мне скучно?\nА: Да. Хотела сначала придумать, как рассказать поинтереснее.","caption":"Я бы предложила начать даже с того, как ты собиралась на встречу. Что хотела рассказать и что решила оставить при себе.\nМеня зовут Юлия, я психолог, помогаю тем, кто впервые собирается в терапию.\nНапиши в комментариях слово «начало», если тоже думаешь, с чего начать.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_money_1","author":"Ольга","format":"post","asked":"post","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"«Если я сама попрошу повышение, получится, что выпросила».\n\nИ вы ждете, когда руководитель сам заметит, сколько вы делаете, и предложит больше денег. Тогда можно будет спокойно их взять. Он сам решил, значит, правда ценит.\n\nЯ бы здесь спросила, почему после вашей просьбы деньги вдруг становятся какими-то незаслуженными. Работу вы уже сделали. Откуда это ощущение, что теперь придется клянчить?\n\nПотому что вам хочется получить подтверждение, что вы нужны, без подсказки. Если человек сам заметил ваши усилия, ему веришь. А если пришлось сказать, внутри сразу начинается сомнение. Вдруг он согласится просто потому, что вы пристали?\n\nИ вот вы подхватываете задачи за коллегой, задерживаетесь, уже второй месяц делаете больше, чем договаривались. Перед встречей с руководителем решаете поднять вопрос о зарплате. Он хвалит вас, говорит, как хорошо, что на вас можно положиться. Вам приятно. И вы опять молчите. Сейчас еще про деньги спросить, как-то неудобно.\n\nБл*дь, даже после похвалы приходится искать разрешение попросить за свою работу больше.\n\nТак можно долго ждать повышения как доказательства, что вас наконец оценили. И каждое молчание руководителя воспринимать лично, хотя зарплату он может вообще не пересматривать, пока сотрудник сам этот вопрос не поднимет.\n\nЯ бы обсуждала с ним конкретно, сколько задач прибавилось и какую сумму вы хотите получать за эту работу. Ему придется ответить на ваш запрос.","caption":"","judge":null,"guard":[],"cut":["И да, повышение, которое вы попросили сами, вполне можно принять без стыда.","Вы же продолжаете делать ту же работу, за которую вам готовы платить больше."],"before":null},{"id":"r_body_1","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Тем, кто ненавидит свое тело перед отпуском\nРечь: Если перед отпуском ты примеряешь купальник и хочется вообще никуда не ехать, я хочу тебе кое-что сказать. Ты смотришь на живот, поворачиваешься боком, втягиваешь его и уже представляешь, как на тебя будут смотреть на пляже. И злишься на себя, что опять не похудела. Ты еще дома, до отпуска две недели, а уже пытаешься угадать, кому что в тебе не понравится. Как будто все эти незнакомые люди будут решать, можно ли тебе купаться. Я бы тут тоже устала. Можно ехать и с тем животом, который у тебя сейчас.","caption":"На фотографиях из отпуска потом бывает трудно вспомнить, было ли тебе хорошо в тот день. Ты занята тем, как получилась, и удаляешь даже снимок, на котором смеешься.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от 20 до 40 лет.\nЕсли захочешь поговорить об этом на консультации, ссылка на запись в шапке профиля.","judge":null,"guard":[],"cut":["В этой злости столько страха, что тебя увидят и осудят.","И мне жаль, что даже перед отдыхом ты чувствуешь, будто должна кому-то понравиться."],"before":null},{"id":"r_teen_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Слайд 1: Подросток закрылся в комнате и молчит\n\nСлайд 2: Вы спрашиваете, как прошел день. Подросток бросает «Нормально» и закрывает дверь. Хочется пойти следом, ведь вы просто спросили. Но если разговоры о школе обычно заканчиваются советами и проверкой уроков, он уже ждет продолжения.\n\nСлайд 3: Я бы предложил вспомнить, что происходит, когда подросток все же рассказывает о проблеме. Поссорился с другом, и вы сразу предлагаете позвонить его маме. Пожаловался на оценку, и вот вы уже открываете дневник. Поделился, и теперь придется останавливать вашу помощь. Уф, сколько хлопот после одного рассказа.\n\nСлайд 4: Подросток отвечает одним словом даже на простые вопросы. Так он пытается закончить разговор, пока вы не стали расспрашивать дальше. Особенно если за рассказом о прогулке обычно следуют вопросы о каждом участнике.\n\nСлайд 5: Подросток просит поговорить потом, а вы слышите отказ и обижаетесь. Ему бывает важно самому выбрать момент. Сразу после школы сил хватает только добраться до комнаты. Если приходится еще и доказывать, почему сейчас хочется тишины, проще вообще ничего не сказать.\n\nСлайд 6: Подросток рассказывает про смешное видео, но умалчивает о ссоре с другом. Шуткой можно поделиться спокойно. А после рассказа о ссоре взрослые могут начать звонить, выяснять отношения, требовать подробностей. И подросток остается с проблемой один, лишь бы все это не началось.\n\nСлайд 7: Когда подросток все же что-то расскажет, сначала спросите, нужна ли ему ваша помощь. И дождитесь ответа, прежде чем предлагать решение. Если он хочет только выговориться, побудьте рядом и послушайте. К решению можно вернуться, когда он будет готов его обсуждать.","caption":"Я понимаю родительское желание немедленно все исправить. Особенно когда ребенок сидит за закрытой дверью, а вы гадаете, что случилось.\n\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов.","judge":null,"guard":[],"cut":["Он заранее сокращает все, что потом придется объяснять.","Тут может быть страх вмешательства."],"before":null},{"id":"r_vybor_1","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Он меня игнорирует, а мне нужен\nРечь: «Почему я опять хочу быть с мужчиной, которому я не нужна?»\n\nЯ бы тут посмотрела, что происходит после его отказа. Он отвечает через сутки, встречу снова откладывает, и вы уже час выбираете, что ему написать. Надо как-то поинтереснее. Полегче. Чтобы точно ответил.\n\nЕго внимание становится доказательством, что с вами все в порядке.\n\nБлядь, сколько сил уходит на одно сухое сообщение.\n\nВам уже трудно понять, нравится ли вам вообще этот мужчина. Вы заняты другим вопросом, почему он вас не хочет. И ждете, что именно он поможет вам перестать чувствовать себя ненужной.","caption":"Одно теплое сообщение после недели молчания может обрадовать так, что вы тут же забудете, как злились накануне. Я бы не торопилась называть это сильными чувствами к человеку.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nОтправьте той, кому сейчас нужно это услышать.","judge":null,"guard":[{"rule":"rublenye","quote":"Надо как-то поинтереснее. Полегче. Чтобы точно ответил."}],"cut":["И вот тут легко застрять.","Если добьетесь, значит, вы достаточно хорошая, вас можно любить."],"before":null},{"id":"r_zlost_1","author":"Юлия","format":"post_tg","asked":"post_tg","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"«На маму нельзя злиться»\n\nЯ с этим совершенно не согласна. Даже если мама тебя любит. Даже если очень много для тебя сделала.\n\nКогда тебе говорят, что на маму злиться нельзя, ты все равно чувствуешь, как внутри все закипает. Только тут же начинаешь себя ругать. Она ведь волнуется, зачем я так реагирую, могла бы и промолчать.\n\nИ вот ты уже виновата. Хотя пять минут назад тебе было обидно.\n\nМама опять прокомментировала твой вес или объяснила, почему мужчина с тобой долго не останется. Ты замолчала, потом весь вечер прокручивала разговор, а утром позвонила ей как обычно. Еще и спросила, не обиделась ли она.\n\nА твоя обида куда делась? Ее ты даже обсудить с собой толком не успела.\n\n«Она же тебе добра желает». Допустим. Но от слов про твой вес тебе больно. Добрые намерения этого не отменяют.\n\nПотом добавляют, что ты слишком чувствительная. И ты уже пытаешься стать такой, которой можно сказать что угодно. Вот это меня возмущает. Человеку сказали гадость, а исправлять предлагают его чувствительность.\n\nЕсли ты привыкла считать свою злость чем-то недопустимым, тебе проще найти ошибку в себе. Надо было спокойнее ответить, надо было понять, надо было потерпеть.\n\nТы отвечаешь за то, что делаешь со своей злостью. За оскорбления, например. Но само чувство никого не оскорбляет и плохой дочерью тебя не делает.\n\nИ можешь закончить разговор, в котором снова обсуждают твой вес, даже если мама этим недовольна.","caption":"","judge":null,"guard":[],"cut":["Так можно годами считать себя виноватой каждый раз, когда с тобой обходятся плохо.","Ты можешь любить маму и злиться на ее слова."],"before":null},{"id":"r_humor_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"Текст на экране: Голосовое про подругу, которая психолог\nРечь: Девочки, если ваша подруга психолог, зовите ее на кофе. Скажите, что соскучились. Я бы сразу выбрала тихое место, чтобы нормально обсудить, почему вас все бесят. Начните с работы, потом про мужа, и маму обязательно. Она задает вопросы? Сука, как же она хорошо слушает. Если предложит записаться на консультацию, обидьтесь. Вы же подруги. Еще можете вечером прислать переписку с мужем. Там всего сорок скриншотов, пусть быстренько посмотрит, кто прав. А если она начнет рассказывать про себя, скажите, что сейчас совсем нет сил на чужие проблемы. Она психолог, она поймет.","caption":"Я бы насторожилась уже на сообщении «Ты только послушай, отвечать ничего не надо». Следом обычно прилетает «Ну и что мне теперь делать?».\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого, здесь я говорю про отношения и все, что в них бесит.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_malysh_1","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"Текст на экране: Почему так страшненько сказать нет\nРечь: Хорошие мои, вам страшненько отказать маме, даже когда на выходные уже есть планы?\n\nПредставьте, что у вас есть стульчик рядом с любимыми людьми. И вы привыкли, что сидеть на нем можно, пока вы соглашаетесь. Сказали ДА, вас любят. Отказали, и уже ждете, что стульчик заберут.\n\nМама просит приехать, и вы отменяете свои планы. Потом злитесь. Заебались уже все отменять. Но еще страшнее услышать ее холодное «понятно» и весь вечер думать, как теперь помириться. Хотя вы даже не ссорились.\n\nВы правда хотите приехать или боитесь, что мама перестанет с вами разговаривать?","caption":"Даже ответ без привычного сердечка потом можно перечитывать и искать, где человек обиделся.\nЯ Ольга, психолог, работаю с женщинами, которые привыкли быть удобными.\nЕсли узнали себя, напишите в комментариях слово «нет».","judge":null,"guard":[],"cut":["Я бы здесь сначала спросила, почему после обычного отказа вам уже нужно мириться."],"before":null},{"id":"r_malysh_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"Текст на экране: Почему стыдно обижаться на маму\nРечь: Милая, тебе обидно на маму, и ты сразу себя ругаешь? Она столько для тебя сделала, а ты опять чем-то недовольна.\n\nЕсли мама случайно прищемила тебе пальчик, он ведь болит. Даже если мама устала. Даже если она очень тебя любит.\n\nНо если на твои слезы тебе говорили, как маме тяжело, ты привыкла сначала жалеть ее. И теперь только вспомнишь что-то обидное, уже начинаешь маму оправдывать. До себя даже не доходишь.\n\nОх, маленькая, тебе же тоже было больно.\n\nТы можешь любить маму и обижаться на нее.","caption":"Вспоминаешь мамину резкую фразу и тут же думаешь, что у нее самой было тяжелое детство. Я бы хотела, чтобы в этом разговоре с собой нашлось место и тому, что пережила ты.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nПодписывайся, если хочется еще таких разговоров, здесь я пишу про отношения с мамой и жизнь взрослой дочери.","judge":null,"guard":[],"cut":["Давай я объясню.","Можно пока обижаться, без решения, кто из вас плохой."],"before":null},{"id":"r_drug_1","author":"Михаил","format":"post","asked":"post","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Друг пишет после месяца тишины, и вы уже понимаете, что у него опять что-то случилось.\n\nВы еще сообщение не открыли, а уже думаете, найдется ли вечером час его выслушать. И одновременно рады, что он наконец объявился. Вы скучали по человеку, а теперь снова будете разбирать его проблемы.\n\nВ такие вечера легко почувствовать близость. Он рассказывает личное, спрашивает вашего мнения, говорит, что только с вами может поговорить. Конечно, это трогает. Вы ему нужны.\n\nПотом у него все налаживается. На ваше предложение встретиться он отвечает, что неделя забита. Следующая тоже. Постепенно вы перестаете звать, чтобы опять не чувствовать себя навязчивым.\n\nИ тут новая беда. Время поговорить с вами сразу нашлось. Надо же.\n\nЧеловек привыкает обращаться к вам за поддержкой, а вы привыкаете получать его внимание именно в эти моменты. И соглашаетесь на очередной долгий разговор, потому что иначе общения вообще почти нет. Вы ведь хотите побыть с другом.\n\nМне кажется важным прямо назвать, чего здесь вам не хватает. Хочется быть нужным и тогда, когда у человека все хорошо. Просто поесть вместе, рассказать про свой день, посмеяться. Без обязательного происшествия.\n\nПредложите встретиться в обычный день и скажите, что скучаете по такому общению. В дружбе должно находиться время и на вашу жизнь.","caption":"","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не открыли, а"}],"cut":["Вот это сочетание я бы особенно выделил.","Отказаться трудно еще и поэтому."],"before":null},{"id":"r_mama_1","author":"Ольга","format":"post","asked":"post","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Ребенок наконец уснул, а вы вспоминаете, как на него орали, и ненавидите себя.\n\nИ сколько часов надо себя грызть, чтобы завтра стать спокойной мамой? До полуночи хватит или лучше вообще не спать?\n\nЯ бы очень хотела, чтобы это работало. Но вы и так знаете, что кричать на ребенка плохо.\n\nВы думаете, что если перестанете себя ругать, то совсем обнаглеете. Будете орать и считать, что все прекрасно. Охренеть, бл*ть, сколько доверия к себе. Даже пожалеть себя страшно.\n\nПосле срыва вы обещаете себе завтра быть самой терпеливой. Поэтому завтра снова терпите все подряд.\n\nРебенок лезет вам под футболку, вам уже неприятно, но вы позволяете. Он требует взять его на руки, пока вы едите, и вы откладываете ложку. С третьего раза закрываете дверь в туалет и тут же открываете, потому что он плачет, а вы же решили больше не злиться.\n\nЗлость при этом никуда не делась. Вы просто запретили себе замечать ее, пока еще можете спокойно сказать, что сейчас доедите.\n\nА потом ребенок разливает воду, и вы срываетесь. И опять обещаете себе стать еще терпеливее. Девочки, куда еще?\n\nЯ считаю, злость надо замечать раньше, чем вы начинаете кричать. Для этого придется перестать ругать себя уже за само чувство. Вам может быть неприятно, тесно, громко. Даже рядом с любимым ребенком.\n\nЕсли чувствуете, что сейчас сорветесь, положите малыша в безопасную кроватку и отойдите на пару минут. Он может плакать, и вам будет тяжело это слышать. Но вам обоим сейчас нужна пауза.","caption":"","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"}],"cut":["Именно поэтому сейчас так паршиво.","И вот что получается."],"before":null},{"id":"r_stud_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: Диплом горит, а я ничего не пишу\nРечь: «Мне скоро сдавать диплом, почему я опять весь день ничего не пишу?»\n\nТы открываешь файл, поправляешь титульный лист и уходишь искать еще одну статью. Ну надо же подготовиться. Хотя статей уже столько, что читать их до следующего выпуска.\n\nЯ бы здесь спросила, что тебе страшно увидеть, когда ты начнешь писать.\n\nПока текста нет, ты еще можешь думать, что напишешь хорошо, просто нужно собраться. А первые абзацы получаются корявыми, и ты сразу решаешь, что вообще ничего не умеешь.\n\nПоэтому тянешь, даже когда сроки уже горят.","caption":"В дипломе даже замечание про оформление легко принять на свой счет. Руководитель просит поправить ссылки, а тебе уже стыдно отправлять следующую версию.\n\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nЕсли узнаешь себя, напиши в комментариях «диплом».","judge":null,"guard":[],"cut":["Вот этого вывода о себе ты и боишься.","Сесть за диплом для тебя значит проверить, достаточно ли ты умная."],"before":null},{"id":"r_gnezdo_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"podderzhka","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","text":"Дети уехали. Дома непривычно тихо\n\nВы просыпаетесь и впервые можете спокойно полежать. Никого не нужно будить, никуда торопить. Только почему-то никакой радости от этого свободного утра.\n\nИ вы начинаете себя ругать. Дети устроились, живут своей жизнью, все получилось как вы хотели. Надо бы радоваться. А вы лежите и думаете, чем вообще занять этот день.\n\nЯ считаю, что мы слишком легко говорим родителям взрослых детей: «Ну вот, теперь поживите для себя». Спасибо, конечно. А как это делается, если столько лет утро начиналось с того, что кому-то что-то от вас нужно?\n\nУ вас годами был готовый ответ на вопрос, зачем вставать. Даже когда вы уставали и мечтали, чтобы вас хоть на выходных оставили в покое. Завтрак, разговор перед выходом, вечером услышать ключ в двери. Среди всех этих хлопот было простое чувство, что вас ждут и ваше участие нужно прямо сейчас.\n\nВы уже сделали огромную работу. Помогли детям вырасти и уйти в свою жизнь. Но вместе с их отъездом закончилась и привычная часть вашей жизни. Дела, которые задавали порядок каждому дню, вдруг исчезли. А желания, которые вы годами откладывали, по команде не просыпаются.\n\nВы скучаете по своему месту в их повседневной жизни. По возможности просто зайти в комнату и поговорить, без звонка и вопроса, удобно ли сейчас.","caption":"","judge":null,"guard":[],"cut":["Поэтому пустота вполне может быть и тогда, когда вы рады за детей.","За эту тоску не нужно себя стыдить.","Даже если вы сами помогали детям собирать вещи, вам все равно может быть тяжело после их отъезда."],"before":null},{"id":"r_razvod_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"mif","topic":"«ради детей надо сохранить семью»","text":"Слайд 1: «Разводиться нельзя, у нас же дети»\n\nСлайд 2: Вы уже думаете о разводе, но представляете, как ребенок спросит, почему папа теперь живет отдельно. И сразу решаете потерпеть еще.\n\nПочему сохранить семью считается вашей обязанностью, даже если муж ничего менять не собирается?\n\nСлайд 3: Удобно придумали, бл*дь. Муж может месяцами игнорировать ваши просьбы, а отвечать за сохранение семьи почему-то должны вы.\n\nВы снова подбираете слова, откладываете разговор, стараетесь его не раздражать. Но наладить отношения за ДВОИХ у вас не получится.\n\nСлайд 4: Ребенок может тяжело переживать развод. Скучать по папе, злиться, просить, чтобы все вернулось. Я бы не стала обещать вам, что он сразу все поймет.\n\nНо его грусть еще не доказывает, что вы приняли неправильное решение.\n\nСлайд 5: Это вина за детскую грусть. Ребенок плачет, и вы уже готовы отменить свое решение, лишь бы он снова улыбался.\n\nТак легко начать считать себя хорошей мамой только в те дни, когда ребенок доволен. Но вы не можете устроить ему жизнь, в которой он никогда не расстроится.\n\nСлайд 6: Вы отвечаете за то, как обращаетесь с ребенком во время развода. Например, когда злитесь на бывшего, можно позвонить подруге и выговориться ей. Ребенку не нужно слушать, какой у него ужасный отец, или решать, кого из родителей ему теперь жалеть.\n\nСлайд 7: Если думаете о разводе, продумайте, как сохранить ребенку привычный распорядок хотя бы в ближайшие недели. Кто заберет его из школы, где он будет ночевать.\n\nОбязанности оставаться в браке ради него у вас нет.","caption":"Я бы спросила себя, что именно ребенок получает от того, что мы продолжаем жить вместе. Ответ бывает гораздо сложнее, чем просто наличие папы дома.\n\nЯ Ольга, психолог, помогаю женщинам, которые думают о разводе или уже развелись.\nОтправьте это той, кто сейчас остается в браке ради детей.","judge":null,"guard":[],"cut":["Я хочу спросить одну вещь.","Дети переживают и перемены, которые взрослым действительно нужны.","Ему нужна ваша помощь с переменами."],"before":null},{"id":"r_pereezd_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"переехала в другой город и за год ни с кем не подружилась","text":"Текст на экране: Год в новом городе, друзей нет\nРечь: Четыре признака, в которых ты узнаешь себя, если за год в новом городе так и не нашла друзей.\nПервое. Тебя утомляет рассказывать о себе. Старой подруге можно сразу пожаловаться, а тут опять объясняй, где работаешь. Да сколько можно эту биографию!\nВторое. Разговоры с коллегами кажутся пустыми. Обсудили выходные, разошлись, и ты уже решила, что вам не о чем говорить.\nТретье. Ты ждешь, чтобы тебя позвали еще раз. Самой написать неловко, вдруг человеку просто было скучно в тот вечер.\nЧетвертое. После приятной встречи тебе особенно одиноко. Посмеялись, но никто пока не знает, почему звонок мамы испортил тебе настроение.\nЯ думаю, ты ждешь той близости, к которой привыкла. А со старой подругой тебе было так же легко в первый день?","caption":"В старом городе дружба могла начаться с того, что вы каждый день оказывались рядом. После переезда даже кофе приходится специально планировать, и меня раздражает, как легко эту трудность называют неумением дружить.\nЯ Юлия, психолог, работаю с людьми 25-35 лет, которые переехали и привыкают к новой жизни.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_dengi_1","author":"Михаил","format":"post","asked":"post","intent":"mehanizm","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","text":"Зарплата пришла, все платежи закрыты, а вы опять считаете, хватит ли денег.\n\nЯ бы здесь посмотрел, сколько раз вы пытаетесь себя успокоить расчетами. Проверки могут поддерживать страх остаться без денег, даже когда с доходом все в порядке.\n\nУ мозга есть привычка запоминать, после какого действия стало легче. Испугались, открыли приложение банка, пересчитали остаток, выдохнули. В следующий раз тревога появляется, и вы уже знаете, куда нажать.\n\nПостепенно становится трудно успокоиться без проверки. Хотя с деньгами за это время ничего не случилось.\n\nВот вы вечером сидите на диване. Днем уже считали, на продукты хватит, кредит оплачен, запас есть. Но вдруг машина сломается? Открываете банк еще раз. Потом прикидываете ремонт, вспоминаете про страховку и начинаете считать заново.\n\nДа сколько же можно считать одни и те же деньги. Очень хочется наконец увидеть такую сумму, после которой получится спокойно закрыть приложение.\n\nТолько очередной расчет помогает ненадолго. Завтра найдется еще один расход, который вы сегодня не предусмотрели. И снова захочется проверить.\n\nТак страх остается с вами даже после прибавки к зарплате.\n\nЕсли бюджет уже посчитан и обязательные расходы покрыты, назначьте время следующего расчета. До него возвращайтесь к цифрам, только если действительно изменились доходы или расходы.\n\nСчитать деньги полезно. Но заново пересчитывать весь бюджет каждый раз, когда стало страшно, вам не нужно.","caption":"","judge":null,"guard":[],"cut":["Мне важно, чтобы вы заметили эту привычку.","Каждый раз, когда вы сразу отвечаете на тревогу проверкой счета, мозг запоминает, что проверять нужно."],"before":null}];const KEY='eval-2026-10-02_03-58-25_rilsy_gip_h1';
