const DATA=[{"id":"r_mif_2","author":"Юлия","format":"post","asked":"post","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"Меня раздражает совет «тревогу надо просто перестать накручивать».\n\nЕсли бы тревогу можно было прекратить по команде, ты бы уже это сделал. Сколько раз ты обещал себе успокоиться, перестать думать об этом, наконец нормально уснуть?\n\nИ после такого совета у тебя появляется еще один повод себя ругать. Почему я опять начинаю? Почему все могут успокоиться, а я никак? Я что, сам себе все порчу?\n\nМне особенно не нравится это «просто». Как будто тебе уже дали решение, и теперь ты из упрямства продолжаешь мучиться.\n\nТы отвечаешь за свои поступки, в том числе когда тревожно: обвиняешь ли другого, требуешь ли немедленного ответа, проверяешь ли чужую переписку. За само появление тревоги ты себя винить не обязан.","caption":"","judge":null,"guard":[],"cut":["Тут еще приходится оправдываться за то, что совет тебе не помог."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Живете отдельно, боитесь не позвонить маме\n\nРечь: Пять признаков тех, кто звонит маме из страха ее обидеть, и меня эта обязанность бесит.\nПервое. От маминого пропущенного звонка сжимается живот, даже если вы просто были в душе. Уже готовите объяснение, почему не взяли трубку.\nВторое. На отдыхе вы рассчитываете время звонка раньше, чем выбираете, куда пойти вечером. Блядь, даже отпуск приходится согласовывать с маминым настроением.\nТретье. Просите партнера помолчать, пока говорите с мамой, иначе она услышит смех и решит, что вам там слишком хорошо без нее.\nЧетвертое. Получили повышение и сразу думаете, как сказать про новую занятость: мама ведь спросит, когда теперь вы собираетесь ей звонить.\nПятое. После пропущенного звонка заказываете ей доставку чего-нибудь вкусного. С подарком легче набрать номер, как будто уже немного загладили вину.\nСколько совпало?","caption":"Меня особенно цепляет это мамино «ну живи своей жизнью», после которого человек весь вечер проверяет телефон.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nСохраните, если хочется вернуться к этому разговору.","judge":null,"guard":[],"cut":["Формально разговор уже закончился, а вы все еще подбираете ответ."],"before":null},{"id":"r_men_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Папа терпит, а потом кричит\nРечь: Пять признаков папы, которому совет «мужчины не плачут» уже дорого обходится.\nПервое. Вы замечаете напряжение только по боли. Весь день сжимали челюсть, к вечеру уже трудно жевать.\nВторое. На отдыхе вас раздражает любой шум. Ребенок зовет показать рисунок, и вы кричите, хотя еще утром обещали себе сегодня быть спокойнее.\nТретье. Сказать близкому, что вам обидно, кажется унизительным. Проще перестать разговаривать до вечера. Меня злит, когда такую выдержку ставят мальчикам в пример.\nЧетвертое. Хорошая новость вызывает только выдох. Вас повысили, жена радуется, а вы уже прикидываете, сколько теперь придется работать.\nПятое. На ребенка деньги находятся сразу, себе новые ботинки покупаете, когда старые промокают.\nСколько у вас совпало?","caption":"Фраза «папа сегодня устал» иногда становится единственным объяснением крика. Ребенок при этом может решить, что слишком громко смеялся.\nЯ Михаил, психолог, работаю с мужчинами и отцами.\nСохраните, если узнали себя.","judge":null,"guard":[{"rule":"kancelyarit","quote":"при этом"},{"rule":"kalka","quote":"дорого обходится"}],"cut":["Даже собственное неудобство приходится сначала доказать."],"before":null},{"id":"r_humor_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"Текст на экране: Тренинг: как дружить с психологом\nРечь: Здравствуйте, я ваш тренер по дружбе с психологом. Сегодня учимся получать консультации под видом кофе. Садитесь, я подготовилась.\n\nПисать заранее? Зачем, вы же подруга. Просто присылаете голосовое, начинаете с вопроса, как у нее дела, и сразу рассказываете про мужа. Ответ про дела можно пропустить.\n\nОна спрашивает, вам поддержка нужна или профессиональный разбор? Конечно, просто поболтать. А потом уточняете, почему муж такой, что вам делать и сколько это еще терпеть.\n\nПредлагает записаться? Охуела. Вы же ей кофе купили.\n\nГоворит, устала? Отлично, пусть отвлечется от работы. Поговорите про вашу маму.\n\nЯ гарантирую: при правильном подходе она даже собственный отпуск проведет с пользой для вас.\n\nВсе, идите звоните. Она как раз написала, что хочет побыть одна.","caption":"Особенно меня веселит обещание рассказать в двух словах. Следом прилетают голосовое и скриншоты за всю неделю.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nПодписывайтесь, если хочется еще такого: здесь я говорю про отношения и наши привычки в них.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Тренинг: как дружить с психологом | Я гарантирую: при правильном подходе она даже собстве | Подписывайтесь, если хочется"}],"cut":[],"before":null},{"id":"r_stud_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: До сдачи неделя, диплом не открыт\nРечь: Сейчас листаю ленту, увидела совет про диплом: просто перестань лениться. И сижу возмущаюсь. Просто открой файл, просто начни писать, просто соберись, просто стань другим человеком до понедельника. Очень удобно.\n\nТы можешь откладывать диплом, потому что страшно увидеть, что у тебя получается. Пока текст существует в голове, он еще может быть хорошим.\n\nОткрываешь документ, пишешь абзац и сразу представляешь, как научрук его читает, морщится, спрашивает, чем ты вообще занималась. Закрываешь. И что, легче стало? На минуту, да. Текст пока никто не оценит. Даже ты сама.\n\nЯ тоже люблю, когда получается хорошо с первой попытки. Прямо очень люблю.\n\nТак, теперь самой надо пересмотреть запись. Желательно без заседания комиссии.","caption":"Иногда даже комментарий научрука «раскрой эту мысль» читается как «ты ничего не понимаешь». Меня в этом особенно цепляет, как быстро замечание к тексту становится приговором себе.\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nПодписывайся, если хочется еще таких разговоров про учебу, тревогу и отношения с собой.","judge":null,"guard":[],"cut":["Если каждый черновой абзац для тебя сразу отвечает на вопрос, достаточно ли ты умная, садиться за диплом становится страшно.","Откладывание дает тебе короткую передышку от этой оценки, поэтому ты снова к нему возвращаешься, хотя срок уже совсем рядом."],"before":null}];const KEY='eval-2026-10-02_04-59-11_rilsy_probe_zh';
