ц перестать считать перед каждой покупкой, но теперь проверяете, достаточно ли откладываете с нового дохода. Вы снова находите, о чем беспокоиться, и опять открываете счет, потому что в прошлый раз это помогло.\n\nПерепроверяете и выбираете пока обойтись без покупки, хотя заранее отложили на нее деньги. Вы пришли за джинсами взамен протертых, нашли подходящие, посмотрели цену и открыли банковское приложение. Денег хватает, вы это видите. Еще раз вычитаете предстоящие расходы, возвращаете джинсы на полку и уже у выхода снова проверяете остаток.","caption":"Чтобы оценить, хватает ли вам денег, полезно заранее выбрать срок, за который вы считаете расходы. Например, до следующего поступления зарплаты, с учетом обязательных платежей и обычных покупок. Отдельно можно записать, какой запас вы хотите собрать и для каких конкретных обстоятельств. Если каждый раз прибавлять к расчету новые возможные неприятности, получить окончательный ответ будет трудно. При общих финансах стоит договориться, какую сумму каждый из вас может тратить без дополнительного обсуждения. Тогда у повседневных покупок появятся понятные условия.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"окойнее. Недавно прочитал в комментариях: «Пока не посмотрю баланс, вообще ничего | здесь насторожило это «пока не посмо"}],"cut":[],"before":null}];const KEY='eval-2026-10-21_15-07-08_rilsy_probe_zh4h7m';
