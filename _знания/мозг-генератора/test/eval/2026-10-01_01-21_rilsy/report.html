const DATA=[{"id":"otvet_1","author":"Михаил","format":"reels_otvet","asked":"reels_otvet","intent":"kak_v_terapii","topic":"«а если психолог мне не поможет?»","text":"Текст на экране: А если психолог мне не поможет?\nРечь: А если психолог мне не поможет? Такое возможно. И это можно обсуждать со мной прямо на встрече. Допустим, вы приходите с фразой: «Я все время думаю, что обо мне подумают». Мы обсуждаем, что вы могли бы попробовать, и вы со всем соглашаетесь. Даже если вам страшно, непонятно или вообще не подходит. Поэтому я могу остановиться и спросить: «Вы сейчас согласны или вам неудобно мне возразить?» Мне важно услышать ваши сомнения, чтобы понять, что мы упускаем. Как я узнаю, что вам что-то не подходит, если вы стараетесь быть удобным даже здесь?\nПодпись: На встрече можно обсуждать и сам разговор с психологом. В том числе то, как он реагирует на ваше несогласие.","judge":{"zhivo":3,"zacep":3,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":[],"worst":"Как я узнаю, что вам что-то не подходит, если вы стараетесь быть удобным даже здесь? — Звучит как упрек: сам скрываешь сомнения, сам виноват.","best":"Вы сейчас согласны или вам неудобно мне возразить?","verdict":"popravit","why":"Конкретный пример и вопрос психолога оживляют текст, речь легко произнести. Но страх не получить помощь сведен к уступчивости клиента: стоит обозначить другие причины и убрать обвинительный финал."},"guard":[{"rule":"dvoetochiya","quote":"встрече. Допустим, вы приходите с фразой: «Я все время думаю, что обо мне подумаю | . Поэтому я могу остановиться и спро"}],"cut":["Ну вот, страх чужого мнения может появиться и в разговоре с психологом."],"before":null},{"id":"monolog_1","author":"Михаил","format":"reels_monolog","asked":"reels_monolog","intent":"mif","topic":"«уверенность надо в себе воспитать»","text":"Текст на экране: Жду, когда станет не страшно\nРечь: «Жду, когда станет не страшно, и тогда начну». Уверенность не обязана появиться первой. Если ждать ее перед каждым ди ТИШИНЫ. Потому что в остальных комнатах от вас постоянно чего-нибудь хотят.\nЧетвертое. Из-за пролитого сока орете, потом укладываете ребенка и думаете: «Какого х*ра я опять сорвалась?» Вспоминаете только свой крик. Все, что вы тащили до него, себе уже не засчитываете.\nСколько совпало?\nПодпись: Что у вас обычно происходит за час до крика?","judge":{"zhivo":4,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Все, что вы тащили до него, себе уже не засчитываете."],"worst":"Все, что вы тащили до него, себе уже не засчитываете. — Натянутый итог: звучит как подсчет заслуг, а не речь уставшей мамы.","best":"Еще одна просьба, когда за день их было столько, что уже бесит любое «мам».","verdict":"popravit","why":"Макароны, уроки и туалет ради тишины хорошо попадают в жизнь аудитории. Но четвертый пункт повторяет сам крик вместо обещанного «что было до», а финал просит посчитать совпадения вместо того, чтобы помочь заметить приближение срыва."},"guard":[],"cut":[],"before":null},{"id":"istoriya_1","author":"Юлия","format":"reels_istoriya","asked":"reels_istoriya","intent":"svoya_istoriya","topic":"как я сама пришла в анализ и говорила, что все хорошо","text":"Текст на экране: Я два месяца говорила: все хорошо\nРечь: Я плакала в машине перед каждой сессией. А аналитику рассказывала, как у меня все хорошо. Когда я сама первый раз пришла в анализ, это продолжалось два месяца. Потом он спросил, зачем я тогда плачу в машине перед каждой сессией. Можно многое понимать про чувства и при этом говорить: «У меня все хорошо». Даже когда ты уже пришла за помощью. Я тоже так делала. А у тебя бывает, что на вопрос «как ты?» отвечаешь «нормально», хотя только что плакала?\nПодпись: Как ты обычно отвечаешь на «как дела?», когда тебе тяжело?","judge":{"zhivo":3,"zacep":4,"ponyatno":4,"polza":3,"interesno":3,"snyat":4,"ai_markers":["Можно многое понимать про чувства и при этом говорить: «У меня все хорошо»."],"worst":"Потом он спросил, зачем я тогда плачу в машине пе
