<script>
const DATA=[{"id":"r_mif_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: Я плачу, а он просто кивает?\n\nРечь: «Психолог просто слушает и кивает за мои деньги». Если этим все и ограничивается, я тоже спрошу: за что тут платить?\n\nНо посмотрите. Вы рассказываете, что опять взяли чужую работу. Коллега попросил, вы согласились, сидели до ночи. «Ну неудобно же отказать».\n\nИ вот психолог задерживается на этом «неудобно». Что случится, если откажете? Коллега решит, что вы плохой человек? Почему его просьбы достаточно, чтобы вы отменили свои планы?\n\nНу вот, пришли пожаловаться на коллегу. И обнаружили, что сами считаете любой отказ чем-то постыдным.\n\nПри этом вы вправе понимать, над чем вы вместе работаете и зачем он задает эти вопросы.","caption":"На первой встрече вопросов бывает много, потому что психологу нужно разобраться в вашей ситуации.\nЯ Михаил, психолог, работаю с людьми от 25 до 40, которые еще ни разу не были у психолога.\nОтправьте тому, кто сомневается, стоит ли идти на первую консультацию.","judge":null,"guard":[{"rule":"kancelyarit","quote":"При этом"}],"cut":["Психологу нужно слушать внимательно, чтобы заметить такие вещи.","Спросить, как будут проходить следующие встречи, вполне уместно."],"before":null},{"id":"r_vopros_1","author":"Ольга","format":"reels_otvet","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Зачем мне психолог, если есть подруги?\nРечь: А зачем мне психолог, если у меня есть подруги? Чтобы у вас было место, где не надо заботиться еще и о дружбе. Вот вы рассказываете подруге про ссору с мужем. Она злится вместе с вами. И тут вы начинаете: «Ну вообще он хороший, просто устал». Блин, вы еще сами злитесь, но уже его защищаете. Вам ведь потом с ним жить, вместе к подруге в гости ходить. И вы заранее думаете, как она будет на него смотреть. У аписал сегодня вечером.","caption":"","judge":null,"guard":[{"rule":"kancelyarit","quote":"При этом"},{"rule":"dvoetochiya","quote":"ваешь переписку с ним, хотя точно знаешь: нового сообщения нет. | В голове уже: «Если бы хотел, написал бы». И все, веч "}],"cut":["Поэтому написать первой так трудно.","Так можно весь вечер искать доказательство его интереса и каждое полученное тут же ставить под сомнение."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Вас похвалили, а вы ждете подвоха\n\nРуководитель пишет: «Хорошая работа». Вы отвечаете «спасибо» и тут же думаете: «В следующий раз точно поймет, что я ничего не умею».\n\nПохвала прошла мимо. Уже вечером вы прикидываете, как справиться со следующей задачей, чтобы никто ничего не заподозрил. Хотя с этой вы справились. И с предыдущей тоже.\n\nПосмотрите, как вы объясняете себе хороший результат. «Просто задача была легкая». «Коллега подсказал». «Я же три вечера все перепроверял, иначе бы точно наделал ошибок».\n\nПомощь коллеги считается. Лишние часы считаются. Ваши умения? Нет, их пока недостаточно доказали.\n\nВот тут я бы поспорил. Чтобы воспользоваться подсказкой, тоже нужно понимать, что делаешь. И подготовка входит в работу. Почему все, что вы сделали для результата, вдруг стало доказательством вашей несостоятельности?\n\nТак страх и сохраняется. Перед новой задачей вы снова думаете: «Теперь точно не вывезу». Сидите допоздна, проверяете уже проверенное. Когда все получается, говорите себе: «Хорошо, что так долго возился». И убеждаетесь, что без этих лишних часов вас обязательно раскроют.\n\nПри таком подсчете можно годами хорошо работать и чувствовать себя человеком, которого взяли по ошибке.\n\nКогда обсуждаете выполненную задачу, называйте свой вклад конкретно: что вы решили, с чем разобрались. Помощь коллеги тоже упомяните. Только свою часть работы из рассказа не вычеркивайте.","caption":"","judge":null,"guard":[{"rule":"vvodnye","quote":"нужно понимать"},{"rule":"dvoetochiya","quote":"Руководитель пишет: «Хорошая работа». Вы отвечаете «спасибо | » и тут же думаете: «В следующий раз точно поймет, что я н"}],"cut":["Получается, вы каждый раз находите причину, по которой успех нельзя засчитать себе.","Вы просто не учитываете ни одного удачного результата как доказательство того, что умеете работать."],"before":null},{"id":"r_car_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Слайд 1: Подруга с депрессией снова отменила встречу\n\nСлайд 2: Вы уже собрались выходить, и тут от подруги: «Прости, сегодня не смогу».\n\nХочется ответить: «Давай все равно, тебе надо развеяться». Вы хотите помочь. Но теперь ей нужно еще и объяснять, почему она не может даже посидеть с вами в кафе.\n\nСлайд 3: При депрессии даже душ и короткий разговор могут требовать огромных усилий. А тут еще надо убедить близких, что тебе действительно плохо.\n\nБл*ть, как тяжело оправдываться, когда сил едва хватает встать с кровати.\n\nСлайд 4: Подруга отменяет планы в последний момент.\n\nКогда вы договаривались, она могла искренне хотеть встретиться. Сегодня собраться и выйти оказалось слишком трудно. Она и сама может злиться на себя: «Опять всех подвела». Уговоры добавляют еще одну задачу: отказать вам и выдержать ваше разочарование.\n\nСлайд 5: Подруга читает сообщения и молчит.\n\nОтветить бывает трудно даже любимому человеку. Нужно подобрать слова, рассказать, как дела, задать вопрос в ответ. Сообщение «Я думаю о тебе, отвечать сейчас необязательно» позволяет ей получить ваше тепло без еще одного обязательства.\n\nСлайд 6: На вопрос «Чем тебе помочь?» подруга отвечает: «Не знаю».\n\nЕй нужно придумать помощь и решить, о чем допустимо попросить. Это тоже силы. Конкретное предложение проще: например, привезти ужин. Тогда достаточно согласиться или отказаться.\n\nСлайд 7: При встрече подруга шутит и выглядит оживленной.\n\nС вами ей действительно может стать легче на какое-то время. Это НЕ означает, что депрессия прошла. После встречи сил опять может не быть. «Ты же вчера нормально смеялась» заставляет ее доказывать, что сегодняшнее состояние тоже настоящее.\n\nСлайд 8: Если подруге с депрессией тяжело общаться, предложите одну небольшую помощь, которую реально можете оказать. Например, привезти еду в удобное ей время.\n\nИ оставьте ей возможность отказаться без объяснений. Ей должно быть легко принять вашу помощь и легко сказать, что сегодня она не готова.","caption":"Когда подруга молчит, легко подумать: «Я ей больше не нужна». Понятно, что вам тоже хочется ответа и близости.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40.\nПодписывайтесь, если хочется еще таких разговоров. Здесь пишу об отношениях и о том, что с нами происходит.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"уже собрались выходить, и тут от подруги: «Прости, сегодня не смогу». | Хочется ответить: «Давай все равно, тебе надо ра"},{"rule":"ostorozhno","quote":"6 оговорок: может, могут, бывает"}],"cut":["От необходимости объясняться человек может еще сильнее закрываться.","Придумывать целый план помощи ей уже не придется."],"before":null},{"id":"r_mif_2","author":"Юлия","format":"post","asked":"post","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"«Просто перестань себя накручивать».\n\nЕсли бы это делалось по команде, ты бы уже перестала. Уж поверь, желающих часами мучиться из-за того, что еще даже не случилось, немного.\n\nНо после такого совета появляется еще одна мысль: «Я сама все порчу. Ничего же не произошло, зачем я опять об этом думаю?»\n\nИ вот ты уже тревожишься и ругаешь себя за тревогу. Отлично помогли, конечно.\n\nТы боишься перестать переживать. Потому что тогда будто потеряешь бдительность и что-нибудь пропустишь.\n\nОтправила важное письмо. Перечитала. Все правильно. Закрыла почту, но через пять минут снова открываешь: «А вдруг я все-таки что-то напутала?» Хочется проверить еще раз, чтобы потом не сказать себе: «Знала же, что надо было посмотреть».\n\nПока переживаешь, кажется, что делаешь все возможное, чтобы ничего плохого не случилось. Поэтому совет «перестань накручивать» звучит почти как «да брось ты, пусть все идет как идет».\n\nНо ты отвечаешь за содержание письма. Проверить его перед отправкой вполне достаточно. Даже если после проверки тебе все еще страшно.\n\nТебе не нужно оставаться в тревоге до вечера, чтобы доказать, что ты серьезно относишься к своей работе.","caption":"","judge":null,"guard":[{"rule":"rublenye","quote":"Отправила важное письмо. Перечитала. Все правильно."},{"rule":"dvoetochiya","quote":"такого совета появляется еще одна мысль: «Я сама все порчу. Ничего же не произош | ту, но через пять минут снова открыва"}],"cut":["Есть одна вещь, которую легко упустить.","Так тревога становится для тебя обязанностью."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Мама обижается, если вы день не звоните\n\nРечь: Четыре признака для тех, чья мама обижается, если ей не звонить каждый день.\nПервое. Вы заранее готовите оправдания. Еще работаете, а уже думаете: «Скажу, что совещание затянулось».\nВторое. Мамин вздох отменяет ваш отдых. Собирались смотреть сериал, но теперь выясняете: «Мам, ну что опять?» Блядь, вечер уже занят.\nТретье. Вам трудно закончить разговор. Уже нечего рассказывать, но страшно первыми положить трубку: вдруг решит, что надоела.\nЧетвертое. Вы злитесь, когда у мамы все хорошо. Звоните после работы, готовитесь выслушивать претензии, а она весело рассказывает про соседку.\nМама уже забыла, что обиделась. А вы весь день переживали, как ее успокоить.","caption":"После такого звонка еще можно сорваться на человека рядом, который вообще ничего не сделал. И потом сидеть с мыслью: «Почему меня все так раздражает?»\nЯ Ольга, психолог. Работаю со взрослыми, которые живут отдельно, но с родителями все еще сложно.\nЕсли узнали себя, напишите в комментариях свой пункт.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"оправдания. Еще работаете, а уже думаете: «Скажу, что совещание затянулось». | ись смотреть сериал, но теперь выясняете:"}],"cut":["Как будто придется доказывать, что вы правда были заняты."],"before":null},{"id":"r_men_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Папа терпит весь день, потом срывается\nРечь: Четыре признака папы, который привык скрывать переживания и срывается на детей.\nПервое. После неприятного разговора на работе вы говорите: «Да плевать». Но всю дорогу домой спорите с начальником в голове.\nВторое. На вопрос жены «Что случилось?» отвечаете: «Ничего». Рассказывать стыдно: «Подумает, что я ною».\nТретье. Детский шум становится последней каплей. Утром спокойно слушали эту игрушку, вечером готовы выкинуть ее в окно. Ну и зачем ей вообще десять мелодий?\nЧетвертое. Вас особенно раздражают детские слезы: «Из-за такой ерунды?» Себе вы тоже говорите: «Хватит ныть», даже когда действительно тяжело.\nВы можете злиться, но сказать «мне больно» вам до сих пор стыдно.","caption":"После крика можно весь вечер ругать себя и еще сильнее замкнуться. Так близкие и не узнают, что происходило с вами до срыва.\nМеня зовут Михаил, я психолог, работаю с мужчинами 30-45 лет, в том числе с отцами.\nЕсли хочется, добавьте в комментариях свой пункт.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"риятного разговора на работе вы говорите: «Да плевать». Но всю дорогу домой спори | а вопрос жены «Что случилось?» отвеч"}],"cut":[],"before":null},{"id":"r_vopros_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: «О чем говорить на первой сессии?»\nПерсонажи: А это клиентка, Б это психолог\nА: Я не знаю, о чем говорить на первой сессии.\nБ: Что хочется сказать сейчас?\nА: Мне плохо. Но это как-то глупо звучит.\nБ: Почему глупо?\nА: У всех проблемы. Я вас только загружу.\nБ: Боишься, что мне надоест тебя слушать?\nА: Да. Вы же тоже живой человек.\nБ: Конечно. И я пришла тебя слушать.\nА: А если я буду ныть и повторяться?\nБ: Ты уже заботишься, чтобы мне было удобно.\nА: Да я со всеми так. Вдруг надоем.\nБ: А кто тогда слушает тебя?","caption":"На первую встречу можно прийти без записей и готовой истории.\nЯ Юлия, психолог, работаю с теми, кто впервые собирается на терапию.\nЕсли хочется, напиши в комментариях, что тебя пугает в первой встрече.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_money_1","author":"Ольга","format":"post","asked":"post","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"«Я больше всех работаю. Почему я еще должна выпрашивать повышение?»\n\nВам хочется, чтобы он САМ заметил, сколько вы делаете, и предложил больше денег.\n\nПотому что тогда вы поверите: «Меня здесь ценят». А если пришлось просить, в голове сразу: «Ну да, выпросила. Сам бы он мне ничего не предложил».\n\nИ вот вы опять берете задачу, которую больше некому делать. Заканчиваете после работы. Начальник пишет «спасибо, выручили», и вы думаете: «Ну теперь он точно видит».\n\nЧерез месяц денег столько же. Задач уже больше. Бл*ть, хоть бы раз это «спасибо» в зарплату превратилось.\n\nИдти просить теперь еще обиднее. Вы столько сделали, а вам предлагают самой объяснять, почему вы заслуживаете больше.\n\nТак разговор о зарплате становится проверкой: насколько вы важны этому человеку? Если он сам предложит повышение, значит, важны. Если молчит, значит, можно еще постараться.\n\nОх, девочки. Начальник при этом вполне может думать: вас все устраивает. Вы же соглашаетесь на новые задачи и про деньги ничего не говорите. Он доволен. Вы ждете, когда он наконец оценит.\n\nНа встречу про зарплату стоит идти с тем, как выросла ваша работа и какую сумму вы хотите за нее получать. Просьба о повышении сама по себе ничего не говорит о том, насколько вас ценят. Это станет понятнее по тому, как с вами обсудят деньги.","caption":"","judge":null,"guard":[{"rule":"skrytoe_protivopostavlenie","quote":"не говорит о том, насколько вас ценят. Это"},{"rule":"kancelyarit","quote":"при этом"},{"rule":"dvoetochiya","quote":"Потому что тогда вы поверите: «Меня здесь ценят». А если пришлось про | сить, в голове сразу: «Ну да, выпросила. Сам бы "}],"cut":["В этой мысли уже есть причина, почему так стыдно идти к начальнику.","Получается, повышение засчитывается только при одном условии: вы о нем даже не заикнулись."],"before":null},{"id":"r_body_1","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Тем, кто ругает себя перед отпуском\nРечь: Если перед отпуском ты смотришь в зеркало и думаешь: «Ну куда я с таким животом», я хочу тебе кое-что сказать. Ты надеваешь купальник и уже представляешь, как кто-то посмотрит, что подумает, с кем тебя сравнит. Еще никуда не приехала, а уже столько претензий к себе. Даже боком повернулась, чтобы проверить, насколько все «плохо». Да что ж такое, тебе уже и перед зеркалом нельзя выдохнуть. От этого собственное тело раздражает еще сильнее. Тебе не нужно сначала понравиться себе, чтобы поехать отдыхать.","caption":"Можно очень хотеть на пляж и одновременно стесняться раздеться.\nЯ Юлия, психолог, работаю с девушками и женщинами от 20 до 40 лет.\nЕсли хочешь поговорить об этом на консультации, ссылка на запись в шапке профиля.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не приехала, а"}],"cut":["Когда ждешь чужой оценки, начинаешь сама искать в себе все, к чему могут придраться.","Оба чувства помещаются в одном человеке."],"before":null},{"id":"r_teen_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Слайд 1: Подросток закрыл дверь и больше не разговаривает\n\nСлайд 2: Вы стучите в комнату: «Как день прошел?» В ответ: «Нормально». Спрашиваете еще что-нибудь, и подросток уже раздражается. Вы ведь просто хотели поговорить. А теперь даже непонятно, как к собственному ребенку подойти.\n\nСлайд 3: Если разговоры регулярно заканчиваются советами или замечаниями, подросток заранее ждет продолжения. Расскажешь про двойку, придется объяснять, почему не подготовился. Про ссору с другом, услышишь, что сам виноват. Поэтому на вопрос «Как дела?» он старается ответить так, чтобы вопросов больше не было.\n\nСлайд 4: «Нормально», «не знаю», «ничего».\n\nКороткие ответы помогают быстрее закончить разговор. Подросток уже знает: скажешь, что устал, начнут выяснять, от чего. Ведь «ты только в школе был». Ох, после такого объяснять свою усталость второй раз совсем не хочется.\n\nСлайд 5: «Я же сказал, ничего не случилось».\n\nВы замечаете, что подросток расстроен, и спрашиваете снова. Он отрицает все еще громче. Рассказать ему сейчас трудно: придется вспоминать неприятное, отвечать на вопросы, еще и успокаивать вас. Проще остаться в комнате.\n\nСлайд 6: «Можно я спокойно поем?»\n\nПодросток вышел на кухню, а вы наконец можете спросить про оценки и невыполненные дела. Даже за ужином придется объясняться. В следующий раз он заберет тарелку к себе.\n\nСлайд 7: Чем меньше подросток рассказывает, тем сильнее вы тревожитесь и тем больше спрашиваете. Он начинает избегать даже обычных разговоров: вдруг опять дойдет до учебы? Так вы оба хотите спокойного общения, но каждый новый вопрос заканчивается закрытой дверью.\n\nСлайд 8: Предложите подростку попить с вами чай и оставьте школьные вопросы на другой разговор. Пусть он сможет посидеть рядом, даже молча, без необходимости рассказывать, что произошло.","caption":"Родителям тоже бывает одиноко возле этой закрытой двери. Особенно когда раньше ребенок рассказывал все еще с порога.\n\nМеня зовут Михаил, я психолог, помогаю родителям подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разговоров.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Вы стучите в комнату: «Как день прошел?» В ответ | : «Нормально». Спрашиваете еще что-нибудь | закончить разговор. Подро"}],"cut":["Для него это снова разговор с проверкой.","Ему важно убедиться, что вы рады ему и без подробного отчета за день."],"before":null},{"id":"r_vybor_1","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Почему меня цепляют те, кому я не нужна?\n\nРечь: «Он толком не пишет, а я все равно жду именно его».\n\nЕсли вы привыкли добиваться внимания, чужое равнодушие становится задачей: «Вот понравлюсь ему, значит, со мной все нормально».\n\nОн три дня молчит. Вы уже злитесь, собираетесь забить. Потом прилетает «как ты?», и вы улыбаетесь в телефон. Блять, всего два слова! А у вас такое облегчение, будто он наконец сказал, что хочет быть с вами.\n\nВы на минуту перестали сомневаться в себе. Он вспомнил, значит, вы ему нужны.\n\nВы уже хотите получить от него подтверждение, что вас можно любить. И когда он снова пропадает, приходится добиваться этого заново.","caption":"Даже подругам рассказываете прежде всего о том, что он наконец написал. До разговора о том, хорошо ли вам с ним, дело так и не доходит.\n\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nОтправьте тому, кому сейчас это нужно.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не пишет, а"}],"cut":["Что случилось?","Поэтому так трудно перестать ждать."],"before":null},{"id":"r_zlost_1","author":"Юлия","format":"post_tg","asked":"post_tg","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"«Хорошие девочки не злятся»\n\nС этим я категорически не согласна. Очень удобно получается для всех, кроме самой девочки.\n\nТы говоришь: «Я вообще никогда не злюсь». Но после разговора с мамой почему-то хочется выключить телефон. После просьбы коллеги доделать за нее работу болит голова. Ты соглашаешься, а потом лежишь и думаешь: «Почему опять я?»\n\nУ тебя есть объяснение для каждого. Мама переживает. Коллега устала. Ты понимаешь, почему они так поступают, и считаешь, что теперь злиться нельзя. Ведь у них причины! А твое «мне это надоело» даже рассматривать как-то неловко.\n\n«Она же тебе добра желает».\nИ ты снова слушаешь, что тебе пора похудеть или родить. Потом еще ругаешь себя: «Она заботится, чего я завелась?» Можно понимать ее намерения и злиться на ее слова. Одновременно.\n\n«Из-за такой ерунды?»\nДа, чашку можно помыть. Только ты уже просила убирать за собой. И вчера просила. Злость появилась еще до этой чашки, когда твою просьбу в очередной раз пропустили мимо ушей.\n\n«Будь умнее, промолчи».\nКак интересно: от тебя опять ждут, что ты все проглотишь. А тому, кто тебя задел, можно ничего в себе не менять.\n\nЕсли злиться для тебя означает быть плохой, ты начинаешь искать в себе вину раньше, чем успеваешь понять, что тебя обидело. «Я придираюсь. Я слишком чувствительная». Только обида никуда не девается.\n\nТы отвечаешь за то, что делаешь со своей злостью. За оскорбления, угрозы, удар. Само чувство никому не причиняет вреда и не требует оправданий.\n\nТебе не нужно сначала доказать, что он плохой.","caption":"","judge":null,"guard":[{"rule":"schet_vsluh","quote":"в очередной раз"},{"rule":"dvoetochiya","quote":"Ты говоришь: «Я вообще никогда не злюсь». Но после р | ы соглашаешься, а потом лежишь и думаешь: «Почему опять я?» | уде"}],"cut":["Так легче остаться хорошей в собственных глазах.","Ты можешь любить человека и злиться на него."],"before":null},{"id":"r_humor_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"Текст на экране: Голосовое подруге, которая работает психологом\nРечь: Привет! Вы сейчас свободны? Я просто поболтать. Тут с мужем опять. Я вам переписку переслала, там немного, сорок скринов. Посмотрите, кто из нас прав.\n\nТолько честно, как психолог. Как подруга вы меня уже поддержали, спасибо.\n\nА можно я ему дам ваш номер? Вы ему объясните, он вас послушает. Меня он вообще не слышит.\n\nЗавтра заняты? А во сколько заканчивается последняя консультация? Вот после нее и созвонимся. Вам же уже никуда не надо.\n\nИ, пожалуйста, все между нами. Я даже вашей подруге ничего не рассказываю. Ну, кроме Кати.\n\nЗа консультацию платить? Блядь, я же вам тоже мемы присылаю.","caption":"Еще переписку могут прислать с пометкой «прочитайте, когда отдохнете», чтобы вечер точно не пропал.\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 22 до 40 лет.\nПодписывайтесь, если хочется еще такого: здесь про отношения и привычку быть для всех удобной.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_malysh_1","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"Текст на экране: Почему так страшно сказать «нет»\nРечь: Хорошая моя, вас просят помочь, вы уже еле стоите, но отказать страшно? Сердечко стучит: «Сейчас обидится. Потом вообще со мной разговаривать перестанет».\n\nВнутри у вас звоночек. Он научился звенеть, когда близкий человек недоволен. Особенно если раньше за вашим «нет» следовало молчание, пока вы не уступите.\n\nТеперь подруга просит приехать. Вы хотите остаться дома. И уже набираете: «Да, конечно».\n\nБлядь, вы еще даже не отказали, а уже испугались, что вас бросят.\n\nЗвоночек торопит: «Соглашайтесь, скорее!»\n\nМожно сказать, что сегодня вы не приедете.\n\nПодруга может расстроиться из-за вашего отказа и завтра снова вам позвонить.","caption":"Длинное объяснение отказа тоже бывает попыткой добиться, чтобы человек совсем не расстроился. Даже температуру готовы подробно описать, лишь бы поверил.\nЯ Ольга, психолог. Работаю с женщинами, которым трудно перестать быть удобными.\nНапишите в комментариях «нет», если узнали себя.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не отказали, а"},{"rule":"dvoetochiya","quote":"те, но отказать страшно? Сердечко стучит: «Сейчас обидится. Потом вообще со мной | Вы хотите остаться дома. И уже набира"}],"cut":["Даже если внутри все звенит."],"before":null},{"id":"r_malysh_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"Текст на экране: Почему стыдно обижаться на маму\nРечь: Милая, ты обижаешься на маму, а потом ругаешь себя: «Она столько для меня сделала. Как я могу?»\n\nПредставь, что в пальчике заноза. Больно. А тебе говорят: «Ты что, хочешь сказать, мама плохая?» И ты прячешь ручку. Пусть лучше болит, только бы маму не расстроить.\n\nЕсли в ответ на твою обиду мама сама обижалась, ты училась сразу брать свои слова обратно. Даже когда она тебя правда задела. Ох, тебе еще и маму утешать пришлось.\n\nТебе не нужно оправдывать каждое мамино слово.","caption":"Бывает, рассказываешь, как мама тебя задела, и сразу добавляешь: «Но вообще она хорошая». Как будто без этой приписки тебя никто не станет слушать.\n\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nПодписывайся, если хочется еще таких разговоров про маму и про себя рядом с ней.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"обижаешься на маму, а потом ругаешь себя: «Она столько для меня сделала. Как я мо | пальчике заноза. Больно. А тебе гово"}],"cut":["Теперь признать обиду страшно: будто ты сразу обвиняешь маму во всем.","Можно хотя бы здесь не ругать себя за то, что больно."],"before":null},{"id":"r_drug_1","author":"Михаил","format":"post","asked":"post","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Друг неделями не отвечает, а потом пишет «мне очень плохо», и вы уже спрашиваете, когда ему удобно созвониться.\n\nХотя еще вчера думали: «Все, больше первым писать не буду». Но тут же человеку плохо. Свое недовольство можно отложить.\n\nИ вместе с тревогой за него приходит облегчение: он про вас помнит. Вы ему нужны. Значит, дружба еще есть.\n\nКогда вы скучали по человеку, его просьба о помощи ощущается как возвращение близости. Вы снова разговариваете по вечерам, знаете, что у него происходит. Даже появляется мысль: «Наконец-то нормально общаемся».\n\nПотом он мирится с партнером, находит работу, начинает выбираться из своей истории. Вы пишете: «Как ты?» Получаете «Все отлично!» и снова узнаете о его жизни из сторис, как все.\n\nТак, а куда делись ваши разговоры?\n\nВы можете искренне хотеть помочь и одновременно надеяться: теперь он останется, будет интересоваться вами, предложит встретиться. Поэтому каждый раз готовы забыть, сколько ваших сообщений осталось без ответа.\n\nПостепенно даже про свое трудно рассказать. У него расставание, какие тут ваши проблемы на работе. А когда у него все хорошо, до разговора опять не доходит.\n\nСама просьба о помощи еще не говорит о том, сколько места у вас в жизни друг друга. Это становится видно потом, когда помощь уже не нужна.\n\nЕсли узнаете эту историю, предложите встретиться в спокойный период. И скажите, что вам хочется общаться и тогда, когда у него все хорошо. Вам ведь тоже нужен друг, которому можно позвонить со своими новостями.","caption":"","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не отвечает, а"},{"rule":"skrytoe_protivopostavlenie","quote":"не говорит о том, сколько места у вас в жизни друг друга. Это"},{"rule":"dvoetochiya","quote":"Хотя еще вчера думали: «Все, больше первым писать не буду». Но | е с тревогой за него приходит облегчение: он про вас по"}],"cut":["Вот это легко пропустить."],"before":null},{"id":"r_mama_1","author":"Ольга","format":"post","asked":"post","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Вы накричали на ребенка, а теперь лежите рядом и думаете: «Какая же я ужасная мать».\n\nА сколько часов надо себя ненавидеть, чтобы завтра стать мамой, которая спокойно выдержит любое «не хочу»? До двух ночи хватит или лучше вообще не спать?\n\n«Но если я себя не отругаю, я опять сорвусь».\n\nДа вы себя уже так отругали, что страшно вспомнить. Почему же вчерашняя ругань не помогла сегодня?\n\nВы пытаетесь наказать себя так сильно, чтобы НИКОГДА больше не злиться на ребенка. Вспоминаете его лицо, когда повысили голос. Он уже спит, а вы снова прокручиваете эту минуту. Даже чай себе налить как будто стыдно. «Он плакал из-за меня, а я тут отдыхать собралась».\n\nБл*ть, даже после тяжелого дня вам теперь нельзя просто посидеть.\n\nСамонаказание дает ощущение, что вы что-то делаете: поняли, раскаялись, значит, в следующий раз удержитесь. Только утром ребенок снова отказывается одеваться. Вы снова торопитесь. И сил у вас ровно столько же, только теперь еще страшно: «Вдруг я опять начну орать».\n\nНо ненависть к себе не добавляет ни сна, ни помощи. Другой взрослый даже может не знать, насколько вы уже вымотаны. Вы ведь сами себе все объяснили: «Просто я плохая».\n\nКогда ребенок успокоится, договоритесь с близким взрослым о конкретном времени, когда он полностью берет заботу о нем на себя. Без ваших подсказок из соседней комнаты. Вам нужна возможность выдохнуть до следующего срыва, и просить об этом можно уже сейчас.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ребенка, а теперь лежите рядом и думаете: «Какая же я ужасная мать». | ние дает ощущение, что вы что-то делаете: поняли,"}],"cut":["Крик может пугать ребенка, и с этим действительно нужно разбираться."],"before":null},{"id":"r_stud_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: Опять весь день не пишу диплом\n\nРечь: «До сдачи диплома неделя. Почему я опять весь день его не пишу?»\n\nОткрываешь файл, читаешь первые две строчки. И надо срочно убрать со стола. Очень вовремя, конечно.\n\nЕсли тебе важно написать диплом так, чтобы никто не придрался, садиться за него страшно. Пока текста нет, можно думать: «Я бы хорошо написала, если бы собралась». А готовый текст уже можно прочитать и раскритиковать.\n\nИ ты тянешь. Когда останется одна ночь, появится объяснение: «Просто времени не хватило».\n\nТы уже боишься оценки за диплом, который еще даже не написан.","caption":"Даже просьба научрука уточнить формулировку может звучать в голове как «ты вообще ничего не понимаешь». Хотя он видел всего один абзац.\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nЕсли узнала себя, можешь написать в комментариях «диплом».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"о страшно. Пока текста нет, можно думать: «Я бы хорошо написала, если бы собралас | останется одна ночь, появится объясн"}],"cut":["С ним легче пережить замечания и сохранить мысль, что вообще ты способная."],"before":null},{"id":"r_gnezdo_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"podderzhka","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","text":"Дети уехали. Зачем теперь вставать?\n\nЕсли после отъезда детей вы просыпаетесь и думаете: «И что мне теперь делать весь день?» Эти слова для вас.\n\nДела, конечно, есть. Работа, магазин, стирка. Только раньше вы знали, ради чего торопитесь домой. По дороге прикидывали, что приготовить на ужин. Теперь можно задержаться сколько угодно. И от этого почему-то хочется плакать.\n\nА потом вы себя ругаете: «Сами же хотели, чтобы они стали самостоятельными. Вот и радуйтесь. У людей настоящие проблемы».\n\nВот еще, теперь и на тоску нужно получить право.\n\nВы годами вставали, потому что кому-то нужно было помочь собраться, что-то напомнить, куда-то отвезти. Даже когда дети стали старше, вы знали, кто сегодня придет домой. Это давало дню понятный смысл без долгих размышлений.\n\nИ вы уже сделали огромную работу. Дети выросли, у них появилась своя жизнь. Но ваша привычная жизнь тоже изменилась. Утром больше нет той спешки, от которой вы так уставали. А вместе с ней исчезло ощущение: «Без меня тут никак».\n\nСвободное время появилось сразу. Собственные желания после многих лет «потом, сейчас некогда» так быстро не возвращаются. Поэтому вопрос «зачем вставать?» может пугать даже человека, который очень рад за своих детей.\n\nЯ бы не стал требовать от вас немедленно найти хобби и наслаждаться свободой.\n\nВы можете радоваться за детей и все равно плакать, когда возвращаетесь в тихую квартиру.","caption":"","judge":null,"guard":[{"rule":"dvoetochiya","quote":"отъезда детей вы просыпаетесь и думаете: «И что мне теперь делать весь день?» Эт | А потом вы себя ругаете: «Сами же хот"}],"cut":["Скучать по жизни, от которой вы уставали, вполне понятно.","Вам нужно время, чтобы привыкнуть жить без них рядом."],"before":null},{"id":"r_razvod_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"mif","topic":"«ради детей надо сохранить семью»","text":"Слайд 1: «Ради детей я должна остаться с мужем»\n\nСлайд 2: Вы снова ждете, пока дети уснут, чтобы поговорить с мужем. Днем улыбались, вечером опять поругались. Уже думаете о разводе, потом вспоминаете детей и отменяете собственные мысли. Бл*дь, как будто детям вместе со свидетельством о рождении выдали право запретить вам уходить.\n\nСлайд 3: Сохранить брак ради детей звучит заботливо. Но у этой заботы появляется опасное продолжение: «Я столько терпела ради вас». Ребенок слышит, что мама годами жила плохо из-за него. Теперь ему еще и надо доказать, что все это было не зря.\n\nСлайд 4: Получил плохую оценку, нагрубил, захотел жить отдельно. И тут: «Я тебе всю жизнь отдала». Ох, девочки. Детство с таким счетом очень тяжело оплачивать.\n\nСлайд 5: За решение остаться вместе отвечаете вы с мужем. Дети НЕ должны оправдывать его хорошими оценками или благодарностью. И чинить ваши отношения им тоже не под силу. Даже если ребенок очень просит, чтобы вы никогда не разводились.\n\nСлайд 6: Само по себе «мы остались вместе» ничего не говорит о том, как живется детям. Важнее, могут ли родители прекратить унижать друг друга, договариваться и менять то, из-за чего дома страшно или тяжело.\n\nСлайд 7: Когда будете решать, оставаться ли с мужем, назовите конкретно, что должно измениться в вашей совместной жизни и готов ли он участвовать. Одного «ради детей» для такого решения недостаточно.","caption":"Меня настораживает, когда от женщины требуют сохранить семью, даже не спрашивая, что в этой семье происходит.\n\nМеня зовут Ольга, я психолог, помогаю женщинам, которые думают о разводе или уже развелись.\nОтправьте это той, кому сейчас нужно такое услышать.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ой заботы появляется опасное продолжение: «Я столько терпела ради вас». Ребенок с | , нагрубил, захотел жить отдельно. И"}],"cut":["Это можно назвать долгом за мамино терпение.","Он появляется, когда ребенку напоминают, чем ради него пожертвовали.","Для этого нужны действия обоих взрослых."],"before":null},{"id":"r_pereezd_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"переехала в другой город и за год ни с кем не подружилась","text":"Текст на экране: Год в новом городе, друзей нет\nРечь: Четыре привычки тех, кто год живет в новом городе и все еще без друзей.\nПервое. После встречи тебе кажется: «Все как-то поверхностно». Поговорили про работу, выпили кофе. Но ведь с подругой дома ты могла говорить обо всем.\nВторое. Ты стесняешься написать без повода. Смешное видео отправляешь старым друзьям. Новым знакомым пока только по делу.\nТретье. Тебя утомляет рассказывать о себе. Опять объяснять, где работала, почему переехала. Ну сколько можно знакомиться, хочется уже дружить!\nЧетвертое. Отмена встречи для тебя означает: «Я ей неинтересна». Даже если человек предложил другой день, тебе уже хочется отказаться.\nТы ждешь, что с новыми людьми сразу будет
