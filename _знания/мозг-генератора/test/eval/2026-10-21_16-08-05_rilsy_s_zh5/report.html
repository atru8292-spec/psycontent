<script>
const DATA=[{"id":"s_r_rod_1_A","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Звонишь маме, чтобы она не обиделась\nРечь: Четыре признака, что ты звонишь маме каждый день, потому что боишься ее обиды, даже когда сама считаешь это обычной заботой.\nТы торопишься закончить приятную встречу. Подруга еще рассказывает, а ты уже прикидываешь, успеешь ли позвонить маме до того, как она ляжет спать. Но когда за пропущенный звонок приходится долго оправдываться, ты начинаешь заранее сокращать время с другими, даже если мама сегодня ничего не требовала.\nРядом с партнером ты становишься раздражительной. Он предлагает досмотреть серию, а тебе еще надо набрать маму, иначе завтра услышишь, что совсем про нее забыла. И злишься ты на него: ну почему нельзя поставить на паузу! Просить маму созваниваться реже страшно, ведь она решит, что ты ее разлюбила. С партнером спорить привычнее, и ссора достается ему.\nПро свои планы ты рассказываешь все меньше. На вопрос, чем занималась, отвечаешь: ничего особенного, хотя весь день выбирала, куда поехать на выходные с друзьями. Ты уже знаешь, что мама спросит, почему для друзей время нашлось. Чем подробнее расскажешь, тем больше придется объяснять, поэтому ежедневные разговоры постепенно становятся одинаковыми, и мама все меньше знает о твоей жизни.\nА когда мама сама прекрасно обходится без звонка, тебе бывает обидно. Она гуляла с подругой и даже не заметила, что ты набрала позже. Ты весь день беспокоилась, как бы ее не расстроить, и вдруг выясняется, что она хорошо провела время без тебя. И порадоваться за нее трудно.\nСколько пунктов у тебя совпало?","caption":"«Мне хочется иногда звонить тебе без повода».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"сем про нее забыла. И злишься ты на него: ну почему нельзя поставить на паузу! Пр | ше. На вопрос, чем занималась, отвеч"}],"cut":["Взрослая дочь может скучать по маме и хотеть поговорить.","Если ты привыкла доказывать любовь ежедневными звонками, мамино хорошее настроение без твоего участия может пугать: вдруг ты ей уже не так нужна."],"before":null},{"id":"s_r_rod_1_C","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Мама обижается, если вы пропустили звонок\nРечь: Четыре признака, что вы уже подстраиваете свою жизнь под мамину обиду, если не звоните каждый день.\nВы торопитесь закончить свои дела. До конца рабочего дня еще час, но вы уже прикидываете, когда позвонить, пока мама не начала писать: «Опять про меня забыли». Сосредоточиться все труднее.\nС друзьями вы заранее оправдываетесь. «Я ненадолго отойду, надо маме набрать». Ужасно обидно пропускать половину разговора, но вернуться к друзьям проще, чем потом выслушивать, что для мамы времени нет.\nСвой свободный вечер вы считаете слабым оправданием. Сказать маме, что вы были заняты, легче, чем признаться, что собирали пазл и ни с кем не хотели разговаривать.\nПосле ссоры вы звоните особенно исправно. Страх новой обиды мешает сказать, чем мама вас задела. Вчера мама назвала вашего мужа бездельником. Сегодня вы набираете ее номер и бодро спрашиваете, что она приготовила.","caption":"Иногда мама даже не знает, сколько вы ей недоговариваете.","judge":null,"guard":[],"cut":["Так вы сами начинаете считать отдых недостаточной причиной."],"before":null},{"id":"s_r_men_1_A","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Опять накричал из-за ерунды\nРечь: Ты весь день держишься, а дома кричишь на сына из-за пролитого сока. При взрослых умеешь сдержаться, даже когда обидно до слез. Умеешь, еще как.\n\nПочему с ребенком выдержки вдруг меньше? Иногда ты рядом с ним наконец перестаешь сдерживать все, что накопилось за день. Сыну достается и за сок, и за то, как с тобой разговаривали взрослые.\n\nПризнаться, что тебя обидели, стыдно: ты же мужик, отец. А рассердиться на ребенка за беспорядок вроде бы есть основание. Только сын теперь боится пролить сок рядом с тобой.","caption":"За какую мелочь ты срывался на ребенка после тяжелого дня?","judge":null,"guard":[],"cut":["Подписывайся, здесь я говорю, почему умные и самостоятельные женщины остаются одни и как перестать выбирать тех, кто не выбирает тебя."],"before":null},{"id":"s_r_men_1_B","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Терпите весь день, срываетесь на детей?\nРечь: Три признака, что вы запрещаете себе расстраиваться, а потом срываетесь на детей.\nНа работе вы молчите, когда с вами обходятся несправедливо. Начальник при всех обесценил вашу работу, вы ответили «понял» и до вечера прокручиваете, что стоило сказать. Признаться себе, что вас задело, стыдно, поэтому домой вы приходите уже злым.\nС друзьями вы шутите даже о том, что вас мучает. На вопрос, как дела, отвечаете анекдотом про семейную жизнь, хотя вам страшно, что жена собирается уйти. Блин, друзья так и остаются уверены, что вы справляетесь, и вы снова остаетесь без поддержки.\nВас особенно злит, когда жена утешает плачущего сына. Хочется вмешаться: хватит его жалеть, пусть привыкает. Сын проиграл в настольную игру и плачет у мамы на коленях, а вы уже повышаете голос: «Ну все, больше с тобой играть не будем».","caption":"Ребенок может начать скрывать от папы все, что его огорчает.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"тешает плачущего сына. Хочется вмешаться: хватит его жалеть, пусть привыкает. Сын | амы на коленях, а вы уже повышаете г"}],"cut":["Когда вам самому стыдно просить утешения, чужие слезы могут казаться наглостью: почему ему столько внимания?"],"before":null},{"id":"s_r_vybor_1_A","author":"Юлия","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Почему опять тот, кто тебя не выбирает\nРечь: Ты опять ищешь, что с тобой не так, потому что он никак не предложит встретиться?\n\nУже записала себя в самые ненужные? Подожди немножко. Давай хотя бы сегодня обойдемся без конкурса на худшую девочку.\n\nИногда ты ждешь от него выбора, как маленькую наклейку за старание. Вот он наконец захочет быть с тобой, и тогда ты точно хорошая, интересная, тебя есть за что любить.\n\nПоэтому его редкое сообщение так радует. Ты столько старалась, ждала, подбирала слова, и вот он вспомнил. Теперь хочется постараться еще.\n\nДавай наклейку тебе выдадим сразу. Без конкурса.\n\nОн снова пишет, что надо бы увидеться. Ты отвечаешь: «Я свободна в субботу. Ты сможешь?» И оставляешь ему самому предложить время.","caption":"Подпишись, если снова выбираешь тех, чьего внимания приходится добиваться.","judge":null,"guard":[],"cut":["Ты уже пытаешься заслужить его внимание, и тебе все труднее спросить себя, нравится ли тебе вообще, как он с тобой обращается."],"before":null},{"id":"s_r_vybor_1_C","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Почему мне нужен именно он?\nРечь: Подруга написала: мужчина снова отменил встречу, и теперь она думает, чем бы его заинтересовать. Меня зацепило, как быстро она нашла себе работу после его отказа.\n\nОн встречу отменил, а вам теперь надо стать интереснее, придумать сообщение полегче, ничего лишнего не спросить, посмотреть, что ему нравится, и срочно этим тоже увлечься. Он даже время встречи не выбрал, а вы уже выбираете себе новое хобби.\n\nПочему после очередного отказа вас тянет к нему еще сильнее? Потому что теперь хочется доказать: он все-таки может выбрать вас, значит, с вами все в порядке. Поэтому вы снова задерживаетесь рядом с теми, кого приходится уговаривать на близость, и тратите на это месяцы.\n\nВам нужно постепенно перестать оценивать себя по тому, удалось ли добиться внимания именно этого мужчины. Его согласие на кофе слишком мало говорит о том, какая вы.\n\nВы вообще-то хотели отношений. Вступительные экзамены никто не объявлял.\n\nПодписывайтесь, здесь про тревогу, неловкость и жизнь с постоянной мыслью, что о вас подумают.","caption":"Что вы пытались изменить в себе, чтобы вас выбрали?","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не выбрал, а"},{"rule":"odushevlenie","quote":"кофе слишком мало говорит"},{"rule":"dvoetochiya","quote":"Подруга написала: мужчина снова отменил встречу, и теперь | ьнее? Потому что теперь хочется доказать: он все-таки может "}],"cut":["Чужой интерес становится проверкой вашей ценности.","И чем меньше он дает внимания, тем важнее кажется его добиться."],"before":null},{"id":"s_r_body_1_B","author":"Ольга","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Если перед отпуском вы себе противны\nРечь: Если вы перед отпуском переодеваетесь перед зеркалом и с каждым разом нравитесь себе меньше, я хочу вам кое-что сказать.\n\nБоитесь, что опять испортите все фотографии? Вы уже представляете, как будете рассматривать на них себя, искать недостатки и просить подругу ничего не выкладывать. Тут еще до поездки можно устать.\n\nЗлитесь на себя, потому что надо бы радоваться отпуску? Конечно, вы его ждали, выбирали отель, договаривались на работе. И теперь обидно: столько всего устроили, а собой опять недовольны.\n\nВы можете ненавидеть себя в зеркале еще сильнее от требования немедленно себя полюбить. Теперь вам мало хорошо выглядеть, надо еще правильно к себе относиться. Отлично, еще один повод себя поругать.\n\nВы мысленно уже сравниваете себя со всеми, кто туда приедет.\n\nЕще бы справку о красоте при заселении требовали.","caption":"Из-за чего вы чаще всего ругаете себя перед отпуском?","judge":null,"guard":[],"cut":["Когда вы заранее ждете, что будете хуже всех на фотографиях, вам трудно радоваться поездке.","Подписывайтесь, здесь про маму, которая все тащит сама, мужа, который «помогает», и злость, за которую потом стыдно."],"before":null},{"id":"s_r_body_1_C","author":"Михаил","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Если перед отпуском тяжело смотреть в зеркало\nРечь: Если вы перед отпуском примеряете одежду и думаете, зачем вообще купили эти билеты, я хочу к вам обратиться. Отпуск еще не начался, а вы уже себе его испортили и теперь за это тоже себя ругаете. Ну замечательно, еще и отдыхать надо было суметь правильно.\n\nСтыдно, что опять переживаете из-за внешности? Потому что вы уже сто раз себе объяснили: надо радоваться поездке, там море, там можно выспаться. Все понимаете. Потом надеваете купальник, смотрите в зеркало, и хочется остаться дома.\n\nБоитесь, что на пляже все будут смотреть? Когда вы сами придирчиво себя рассматриваете, легко представить, что окружающие займутся тем же самым. Будто у них в отпуске запланировано внимательно изучить именно вас.\n\nИ вот здесь очень тяжело: вы собираетесь туда, где хочется расслабиться, но заранее ждете, что придется весь день следить за собой. Как сесть, что надеть, соглашаться ли на фотографию.\n\nА потом вы сердитесь на себя за эту усталость, потому что другие мечтают об отпуске, а вы стоите перед зеркалом и чуть не плачете.\n\nВы уже тратите много сил на то, чтобы никто ничего плохого о вас не подумал. И ругаете себя за то, что вам трудно.\n\nПеред отпуском вы сколько раз переодеваетесь перед зеркалом?","caption":"Подписывайтесь, здесь про тревогу и жизнь с оглядкой на чужое мнение.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не начался, а"},{"rule":"schet_vsluh","quote":"сто раз"},{"rule":"dvoetochiya","quote":"Потому что вы уже сто раз себе объяснили: надо радоваться поездке, там море, там | И вот здесь очень тяжело: вы собирает"}],"cut":["От такого ожидания можно устать еще до вылета.","Эта злость на себя понятна: вы очень хотели наконец отдохнуть и боитесь, что даже там будете себя оценивать."],"before":null},{"id":"s_r_post_1_B","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Текст на экране: Если напишу сама, опять не считается\nРечь: Ко мне часто приходят с тем, что весь вечер ждут сообщения от мужчины и никак не могут заняться своими делами.\n\nИ я замечаю одну вещь: очень часто написать ему самой вообще не проблема. Вы знаете, что спросить, у вас есть смешное видео, вы вполне можете предложить встретиться. Но именно сегодня хочется, чтобы он САМ вспомнил про вас. Без подсказки, без вашего вопроса, без повода, который вы ему опять организовали.\n\nПотому что, когда вы каждый раз начинаете переписку, остается вопрос: а если бы я промолчала, мы бы сегодня вообще поговорили?\n\nВспомнил ли он. Захотел ли. Есть ли у него собственное желание с вами общаться, когда вы ничего для этого не сделали.\n\nПочему тогда так трудно написать первой? Ведь раньше писали спокойно. Потому что его ответ уже не даст вам того, чего вы ждете. Он может ответить тепло, прислать сердечко, спросить, как прошел день. И вы обрадуетесь, конечно. А завтра снова захотите проверить: сегодня он сам напишет?\n\nМеня здесь особенно цепляет, как быстро девушки начинают себя ругать: опять я навязчивая, опять мне больше всех надо. Хотя вы уже даже сообщение не отправляете. Вы сидите с готовым вопросом и запрещаете себе его задать, потому что хотите хоть раз увидеть его интерес без своего участия.\n\nПостепенно любой приятный разговор обесценивается вашей же мыслью: ну да, пообщались, но начала опять я.\n\nКто у вас чаще пишет первым?","caption":"Подписывайтесь, если узнаете себя в отношениях и злитесь на себя.","judge":null,"guard":[{"rule":"odushevlenie","quote":"вечер ждут"},{"rule":"dvoetochiya","quote":"И я замечаю одну вещь: очень часто написать ему самой вообще н | раз начинаете переписку, остается вопрос: а если бы я п"}],"cut":["Вот что вы проверяете вместе с телефоном.","И вам все труднее понять, насколько ему нужны эти отношения, если вы постоянно обеспечиваете вам обоим следующий разговор."],"before":null},{"id":"s_r_post_1_C","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Текст на экране: Он молчит, а вы весь вечер ждете\nРечь: Четыре признака, что вы весь вечер ждете его сообщения и уже подстраиваете под это свою жизнь.\nВам трудно заняться даже приятным. Сериал идет, но вы пропускаете разговор героев, потому что снова открыли переписку.\nПодруге вы отвечаете невпопад. Она рассказывает, как прошло свидание, а вы проверяете, появился ли он в сети. И потом приходится переспрашивать то, чем она хотела с вами поделиться.\nВы начинаете жалеть, что были откровенны. Вспоминаете, зачем рассказали ему про ссору с мамой, и решаете, что слишком много говорили о себе. Как же обидно: он даже ничего не сказал, а вы уже готовы быть посдержаннее.\nКогда сообщение приходит, вы изображаете такую же занятость. Хотели поговорить, но теперь выжидаете перед ответом, чтобы он не догадался, как вы ждали.","caption":"В начале отношений переписка часто становится единственным способом понять, вспоминает ли о вас другой. Между встречами еще мало общих привычек, и опереться особенно не на что. Поэтому короткое сообщение иногда приобретает огромное значение. При этом двое могут совсем по-разному понимать, что между ними происходит. Один уверен, что следующая встреча уже назначена и все хорошо, другая каждый вечер заново сомневается, состоится ли она вообще.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не сказал, а"},{"rule":"kancelyarit","quote":"При этом"}],"cut":["Пока он молчит, собственный вечер кажется чем-то второстепенным.","Даже когда он пишет, свободно пообщаться уже не получается."],"before":null},{"id":"s_r_drug_1_A","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Текст на экране: Друзья вспоминают тебя, только когда им плохо\nРечь: Четыре признака, что друг привык приходить к тебе со своими бедами, а хорошую жизнь проводит с другими.\nПереписка заканчивается, как только ему становится легче. Пока он ссорится с партнером, вы обсуждаете каждое сообщение, и ты уже знаешь, кто кому что написал. Когда они мирятся, на твой вопрос, как прошли выходные, он отвечает через несколько дней. Ты продолжаешь ждать той близости, которую вы оба чувствовали, пока ему было плохо.\nВстретиться получается только срочно. На кофе через неделю он пока ничего обещать не может, зато после очередной ссоры предлагает увидеться сегодня. Ты двигаешь свои планы, потому что другу тяжело, и постепенно привыкаешь: время вместе у вас бывает, когда ему требуется поддержка. Обычной встречи приходится добиваться, словно ты просишь слишком многого.\nСвою трудную неделю ты обсуждаешь с ним урывками. Стоит рассказать, что тебе сейчас тяжело, он вспоминает похожую историю и надолго уходит в подробности. Ты снова слушаешь, хотя сама позвонила за поддержкой. И вот это обидно: ты еще выбираешь слова, чтобы никого не нагрузить, а он уже даже не спрашивает, чем у тебя все закончилось.\nО хорошем в его жизни ты узнаешь последней. Оказывается, он давно помирился с партнером, съездил отдыхать, собирал друзей на день рождения. Ты удивляешься, потому что недавно вы разговаривали часами и ты считала себя близкой подругой. Ты даже оправдываешь его занятость, хотя для остальных он время нашел.\nКак пожаловаться на жизнь, так ты самый близкий друг. Как позвать на день рождения, так про тебя забыли.","caption":"После таких отношений бывает трудно верить, что дружба вообще может быть взаимной. Когда новый знакомый внимательно слушает, хочется поскорее закончить, спросить про него, вернуть привычный порядок разговора. Собственные переживания кажутся слишком долгими и скучными для чужого внимания.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не нагрузить, а"},{"rule":"dvoetochiya","quote":"то другу тяжело, и постепенно привыкаешь: время вместе у вас бывает, когда ему тр | озвонила за поддержкой. И вот это об"}],"cut":["Тебе достается столько откровенности в тяжелые дни, что отсутствие в счастливые долго кажется случайностью.","Даже рядом с отзывчивыми людьми можно еще долго ждать момента, когда им надоест тебя слушать.","Для доверия нужно время, в том числе время, когда тобой интересуются без всякой срочной причины."],"before":null},{"id":"s_r_drug_1_B","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Текст на экране: Друзья появляются, только когда им плохо\nРечь: Три признака, что друзья вспоминают о вас только тогда, когда им плохо.\nВы знаете все подробности ссор, но про примирение узнаете случайно. Подруга уже неделю выкладывает фотографии с парнем, с которым вы помогали ей расстаться до трех ночи. Сообщить, что они помирились, она забыла. Вы продолжаете за нее переживать, пока она выбирает ресторан на годовщину.\nВы заранее сокращаете рассказы о себе. У друга опять все хреново, куда тут с вашим повышением или ссорой с сестрой. Бесит, как быстро в такой дружбе вы приучаетесь считать свои переживания недостаточно серьезными. Ваши новости опять подождут.\nВам становится тревожно, когда у друзей все налаживается. Вы искренне хотели, чтобы подруга встретила кого-нибудь, но теперь понимаете: ближайшие месяцы вместе вы никуда не пойдете.","caption":"Иногда друзья надолго выпадают из общения, когда влюбляются или сильно чем-то увлечены. По одному такому периоду трудно понять, что происходит между вами. Больше говорит то, замечает ли подруга потом, сколько всего пропустила в вашей жизни, интересуется ли этим сама. Она может искренне считать вас очень близкой и даже не догадываться, что давно не знает, как вы живете.","judge":null,"guard":[],"cut":["Когда вас зовут только обсуждать неприятности, чужое счастье начинает означать, что общаться с вами больше незачем.","У вас при этом могут быть совсем разные представления о том, насколько вы дружны."],"before":null}];const KEY='eval-2026-10-21_16-08-05_rilsy_s_zh5';

c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});
