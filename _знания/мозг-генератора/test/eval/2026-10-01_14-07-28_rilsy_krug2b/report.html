<script>
const DATA=[{"id":"r_mif_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«психолог просто слушает и кивает за мои деньги»","text":"Текст на экране: Я плачу, а меня просто слушают?\nРечь: «Психолог просто слушает и кивает за мои деньги». Нет, выслушать человека еще недостаточно, чтобы ему помочь.\n\nДопустим, начальник попросил переделать отчет. Вы уже думаете: «Все, меня скоро уволят». Рассказываете психологу, как страшно остаться без работы.\n\nМожно всю встречу обсуждать этот страх. Но погодите, начальник вообще говорил об увольнении? Или вы сами уже решили, чем все закончится?\n\nВам достаточно честно рассказать, что вас беспокоит. Понимать, как с этим работать, обязан психолог.","caption":"Слушать внимательно важно, особенно когда человек впервые решился рассказать о трудном. Но вы вправе спросить, как разговор на встрече поможет с вашим запросом.\nМеня зовут Михаил, я психолог, работаю с людьми 25-40 лет, которые впервые обращаются за помощью.\nОтправьте тому, кто пока сомневается, зачем идти к психологу.","judge":{"zhivo":3,"zacep":4,"ponyatno":5,"polza":3,"interesno":3,"snyat":5,"ai_markers":["Понимать, как с этим работать, обязан психолог."],"worst":"Или вы сами уже решили, чем все закончится? — Пример обрывается на вопросе: что психолог дальше сделает со страхом, так и не показано.","best":"Но погодите, начальник вообще говорил об увольнении?","verdict":"popravit","why":"Начало цепляет сомневающегося, пример понятный и легко снимается. Но пока работа психолога выглядит как один здравый вопрос: нужна конкретная следующая реплика, чтобы стало понятно, за что платят."},"guard":[],"cut":["Вот здесь психолог помогает разобраться: что произошло и что вы успели себе сказать.","Потому что собственная мысль «меня уволят» пугает так, будто увольнение уже случилось."],"before":null},{"id":"r_vopros_1","author":"Ольга","format":"reels_otvet","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Зачем мне психолог, если у меня есть подруги?\nРечь: А зачем мне психолог, если у меня есть подруги? Чтобы вы могли говорить о себе, не заботясь еще и о собеседнике. Вот вы рассказываете подруге про ссору с мужем. Она слушает, поддерживает. Но вы помните, что у нее самой тяжелая неделя. И уже сокращаете: «Ладно, я опять про свое. Ты как?» Хотя еще нихуя не договорили. На сессии вы можете хоть весь час говорить об одной ссоре. Психологу не нужно, чтобы вы потом выслушали его проблемы. Вам не придется сворачивать разговор о себе, потому что пора поддержать его.","caption":"Даже с самой близкой подругой бывает мысль: «Я ей уже три раза это рассказывала». На сессии к одному разговору можно возвращаться столько, сколько вам нужно.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35 лет.\nОтправьте той, кто тоже задается этим вопросом.","judge":{"zhivo":4,"zacep":3,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":[],"worst":"«Вам не придется сворачивать разговор о себе, потому что пора поддержать его». Повторяет предыдущую фразу и затягивает концовку.","best":"Хотя еще нихуя не договорили.","verdict":"publikovat","why":"Узнаваемое «Ладно, я опять про свое. Ты как?» объясняет пользу психолога без обесценивания подруг. Есть небанальная мысль, которую захочется переслать: иногда ты заканчиваешь говорить раньше, чем действительно выговорилась."},"guard":[{"rule":"dvoetochiya","quote":"е самой тяжелая неделя. И уже сокращаете: «Ладно, я опять про свое. Ты как?» Хотя | же с самой близкой подругой бывает м"}],"cut":["В дружбе вам важно, как чувствует себя другой человек.","Это часть близости."],"before":null},{"id":"r_post_1","author":"Юлия","format":"post","asked":"post","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Ты открываешь чат с ним, хотя точно знаешь: новых сообщений нет.\n\nНо все равно проверяешь. Потому что сейчас его сообщение ответило бы на вопрос, который ты ему вслух не задаешь: «Он вообще хочет со мной общаться?»\n\nНаписать самой? Уже придумала что. Даже набрала, потом стерла. «Если захочет, сам напишет». Тебе важно, чтобы он вспомнил о тебе без подсказки. Тогда можно будет поверить, что он тоже ждал, тоже хотел поговорить.\n\nИ вот ты включила сериал, но пропустила половину. Телефон загорелся, сразу взяла. Уведомление от магазина. Да сколько можно с этими скидками, господи.\n\nПотом заходишь посмотреть, был ли он в сети. Был. «То есть в телефон зайти время есть». И теперь тебе уже обидно.\n\nТы устроила ему проверку, о которой он ничего не знает. Условие простое: напишет первым, значит, я ему нужна. Только каждый час тишины ты переживаешь как ответ. Хотя он пока ничего тебе не сказал.\n\nНо по одному вечеру ты уже пытаешься решить, насколько ты ему важна.\n\nЕсли ты постоянно ждешь и боишься написать, скажи ему прямо: «Мне хочется, чтобы ты тоже сам мне писал. Иначе я начинаю думать, что тебе наше общение не нужно». Он хотя бы будет знать, что с тобой происходит.","caption":"","judge":{"zhivo":4,"zacep":5,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":[],"worst":"«Но по одному вечеру ты уже пытаешься решить, насколько ты ему важна». Повторяет предыдущий абзац, притормаживает текст.","best":"«Уведомление от магазина. Да сколько можно с этими скидками, господи».","verdict":"publikovat","why":"Узнаваемые детали удерживают: стертое сообщение, пропущенный сериал, проверка онлайна. Текст помогает увидеть в ожидании негласную проверку своей нужности и дает понятные слова для разговора — есть что сохранить или переслать."},"guard":[{"rule":"dvoetochiya","quote":"открываешь чат с ним, хотя точно знаешь: новых сообщений нет. | вопрос, который ты ему вслух не задаешь: «Он вообще хоче"}],"cut":["Можно хотеть, чтобы мужчина проявлял инициативу.","Можно злиться, если все общение держится на тебе."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"post_tg","asked":"post_tg","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"«Опять пришлось гуглить»\n\nВы отправили готовую работу, закрыли вкладки с подсказками и подумали: «Если бы я правда в этом разбирался, сделал бы сам».\n\nЗадача решена, но уверенности почему-то меньше. Теперь вы знаете, сколько всего пришлось искать. И кажется, что коллегам достаточно увидеть вашу историю браузера, чтобы все про вас понять.\n\nЗдесь есть одна ловушка: вы засчитываете себе только то, что получилось сразу, без подготовки и чужой помощи. Все остальное идет с пометкой «сам бы не справился».\n\nНашли нужный способ, проверили, подходит ли он, применили. Но себе сказали: «Это я просто нагуглил». Уточнили у коллеги один момент: «Без него я бы вообще застрял».\n\nХотя разобраться, какой совет подходит к вашей задаче, тоже надо уметь.\n\nМеня в этом особенно цепляет требование знать все заранее. Вам дали задачу, вы с ней справились. И тут же устроили себе еще один экзамен: смогли бы вы сделать это без единой подсказки? На работе такого условия вообще могло не быть.\n\nТак можно годами набирать опыт и продолжать ждать разоблачения. Потому что после каждой выполненной задачи вы находите причину ее себе не засчитать. «Повезло», «подсказали», «слишком долго возился». И все, опять будто ничего не умеете.\n\nКогда в следующий раз подумаете «меня раскусят», вернитесь к условию задачи: от вас требовали готовый результат или выполнение по памяти? Если результат подходит, не вычеркивайте свою работу только потому, что пришлось что-то уточнить.","caption":"","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":[],"worst":"Меня в этом особенно цепляет требование знать все заранее. — Авторское «меня цепляет» ничего не добавляет: требование уже показано на примерах.","best":"И кажется, что коллегам достаточно увидеть вашу историю браузера, чтобы все про вас понять.","verdict":"publikovat","why":"Узнаваемая рабочая ситуация и полезный поворот: вы справились, но сами добавили условие «без подсказок» и обнулили результат. Текст хочется переслать коллеге; психолог объясняет просто, без позы и нравоучений."},"guard":[{"rule":"skrytoe_protivopostavlenie","quote":"не быть.\n\nТак"},{"rule":"dvoetochiya","quote":"закрыли вкладки с подсказками и подумали: «Если бы я правда в этом разбирался, сд | Здесь есть одна ловушка: вы засчитыв"}],"cut":["Получается, любую помощь вы принимаете как доказательство своей неумелости."],"before":null},{"id":"r_car_1","author":"Ольга","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Слайд 1: Подруга с депрессией перестала отвечать на сообщения\n\nСлайд 2: Вы пишете подруге: «Как ты? Я переживаю». Она читает и молчит. Вы уже думаете: «Я ей мешаю?»\n\nПри депрессии даже ответ близкому человеку может требовать сил. Нужно объяснить, как ты, успокоить его, поблагодарить. Сообщение прочитано, а на все это сил нет.\n\nСлайд 3: «Она даже сердечко поставить не может?»\n\nВы ждете маленького знака, что ваша поддержка дошла. Подруга откладывает ответ, потом ей стыдно, что прошло три дня. Теперь нужно еще извиняться.\n\nСлайд 4: «Сама согласилась встретиться и опять отменила»\n\nВчера подруге правда хотелось вас увидеть. Сегодня она представляет, как нужно помыть голову, одеться, доехать и разговаривать. Уже устала.\n\nЕсли встреча закончится обидой, в следующий раз она побоится согласиться. Вдруг снова вас подведет.\n\nСлайд 5: «Со мной она вроде нормально разговаривает»\n\nПодруга спрашивает про вашу работу, смеется над шуткой. Вы выдыхаете: ей лучше.\n\nНо разговор может быть единственным делом, на которое сегодня хватило сил. Она старается быть привычной вам подругой. Бл*ть, как тяжело еще и изображать бодрость, когда тебе плохо.\n\nСлайд 6: «Я предлагаю варианты, а ее все раздражает»\n\n«Может, погуляешь? Попробуй спорт». Вам хочется найти хоть что-нибудь, что поможет.\n\nА подруга слышит очередное дело, которое надо выполнить. Она и так ругает себя за то, что весь день лежит. Теперь кажется, что и вы ждете, когда она наконец соберется.\n\nСлайд 7: У подруги появляется еще одна задача: показать вам, что помощь работает.\n\nОтветить повеселее. Согласиться на прогулку. Сказать, что стало лучше.\n\nИ тогда ей трудно сказать вам честно: «Мне все еще хреново». Она боится, что вы расстроитесь или устанете от нее.\n\nСлайд 8: Предложите подруге одну конкретную помощь: «Я завтра могу привезти продукты и оставить у двери. Хочешь?»\n\nИ скажите прямо: «Со мной можно говорить, как вам правда плохо. Я понимаю, что после нашего разговора вам не обязательно станет лучше».","caption":"Я бы убрала из переписки вопрос «Ну что, уже получше?». На него бывает особенно трудно отвечать человеку, который сам очень ждет этого «получше».\n\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 20 до 40.\nПодписывайтесь, если хочется еще таких разговоров. Здесь пишу об отношениях и о том, как мы себя в них чувствуем.","judge":{"zhivo":4,"zacep":4,"ponyatno":4,"polza":5,"interesno":4,"snyat":null,"ai_markers":["Ответить повеселее. Согласиться на прогулку. Сказать, что стало лучше."],"worst":"«Со мной можно говорить, как вам правда плохо» — неестественная фраза, плюс внезапное «вам» вместо «ты» в обращении к подруге.","best":"«Подруга откладывает ответ, потом ей стыдно, что прошло три дня. Теперь нужно еще извиняться».","verdict":"publikovat","why":"Хочется переслать: понятно показано, как даже заботливой подруге приходится отвечать, успокаивать и изображать улучшение. Конкретная помощь в конце делает карусель полезной; неловкую реплику на последнем слайде стоит подправить."},"guard":[{"rule":"dvoetochiya","quote":"Вы пишете подруге: «Как ты? Я переживаю». Она читает и мол | чит. Вы уже думаете: «Я ей мешаю?» | работу, смеется над шу"},{"rule":"ostorozhno","quote":"5 оговорок: может, может быть, бывает"}],"cut":["Чем дольше она молчит, тем сложнее снова вам написать.","Это можно назвать обязанностью успокоить близких."],"before":null},{"id":"r_mif_2","author":"Юлия","format":"post","asked":"post","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"«Да просто перестань себя накручивать», говорят тебе, когда ты тревожишься.\n\nНет, тревога по команде не выключается.\n\nНо после такого совета ты начинаешь требовать от себя именно этого. Он долго не отвечает, тебе страшно, и тут же: «Опять я все порчу. Почему я не могу нормально реагировать?»\n\nТеперь ты еще и тревожишься, что не умеешь перестать тревожиться. Отлично помогли, конечно.\n\nТы откладываешь телефон, обещаешь себе больше не проверять. Через пять минут снова смотришь. И ругаешь себя уже за то, что посмотрела. Будто тебе мало переживаний из-за его молчания.\n\nПроверять телефон каждые пять минут действительно может усиливать тревогу.\n\nТы отвечаешь за то, что делаешь, когда тебе страшно. За обвинения, если начинаешь обвинять. За десять сообщений подряд, если отправляешь их. Само чувство вины на тебя не вешает.\n\nМожно сказать прямо: «Я волнуюсь, когда долго нет ответа. Давай договоримся, когда сможем поговорить». Тебе не нужно сначала полностью успокоиться, чтобы спокойно о чем-то попросить.","caption":"","judge":{"zhivo":4,"zacep":3,"ponyatno":4,"polza":4,"interesno":3,"snyat":null,"ai_markers":["Само чувство вины на тебя не вешает."],"worst":"«Само чувство вины на тебя не вешает.» — приходится перечитывать: какое чувство и что оно не вешает?","best":"Теперь ты еще и тревожишься, что не умеешь перестать тревожиться. Отлично помогли, конечно.","verdict":"popravit","why":"Сцена с телефоном узнаваемая, и дополнительная тревога из-за самокритики показана живо. Но переход к ответственности звучит отдельной вставкой, а фраза про чувство и вину ломает понимание — этот абзац стоит поправить."},"guard":[{"rule":"dvoetochiya","quote":"олго не отвечает, тебе страшно, и тут же: «Опять я все порчу. Почему я не могу но | Можно сказать прямо: «Я волнуюсь, ко"},{"rule":"monotonno","quote":"разброс длины фраз 2.5 слова"}],"cut":["Но требовать от себя немедленно успокоиться тоже бесполезно.","Особенно если каждую тревожную мысль ты считаешь своим провалом."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Мамин пропущенный вызов портит вам вечер\nРечь: Четыре признака, что вы звоните маме из страха снова оказаться плохой дочерью.\nПервое. Вы заранее придумываете оправдание. «Скажу, что работы много».\nВторое. Пропущенный вызов мешает отдыхать. Фильм идет, а вы думаете: «Теперь обидится». Блядь, ОПЯТЬ объясняться.\nТретье. Вы рассказываете маме только то, после чего она будет довольна. Даже усталость оставляете при себе: начнется «На меня у тебя никогда сил нет».\nЧетвертое. Вы радуетесь, когда мама сама занята и не может поговорить.\nВам знакомо это облегчение, когда мама сама отменяет звонок?","caption":"«Тебе что, трудно пять минут поговорить?» Сами пять минут найти легко. Трудно каждый вечер объяснять, почему сегодня вы хотели заняться своими делами.\nЯ Ольга, психолог. Работаю со взрослыми, которые живут отдельно, но все еще переживают из-за родителей.\nЕсли хочется, добавьте в комментариях свой признак.","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":3,"snyat":5,"ai_markers":[],"worst":"Вам знакомо это облегчение, когда мама сама отменяет звонок? — Повторяет четвертый пункт, вместо того чтобы добавить что-то к узнаванию.","best":"Блядь, ОПЯТЬ объясняться.","verdict":"publikovat","why":"Фильм, заготовленные оправдания и радость от отмененного звонка — узнаваемые ситуации, которые захочется переслать сестре или подруге. Автор понимает это напряжение изнутри, хотя нового объяснения почти не дает."},"guard":[{"rule":"dvoetochiya","quote":"ешает отдыхать. Фильм идет, а вы думаете: «Теперь обидится». Блядь, ОПЯТЬ объясня | льна. Даже усталость оставляете при "}],"cut":["Просто захотеть вечер без разговоров с мамой вам кажется недостаточной причиной.","Можно спокойно провести вечер, и никто не предъявит, что вы забыли мать."],"before":null},{"id":"r_men_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Молчите о своем, срываетесь на детей\nРечь: Четыре признака отца, который запрещает себе плакать и потом срывается на детей.\nПервое. Обиду вы молча проглатываете. Начальник унизил при всех, вы дома говорите: «Нормально все». Обидно же, даже рассказать хочется. Только «что я, жаловаться буду?».\nВторое. На вопросы о себе отвечаете резко. Жена спрашивает: «Что случилось?» Вы: «Дай спокойно поесть».\nТретье. После тяжелого дня бесит даже обычный детский шум. Ребенок уронил игрушку, вы уже кричите.\nЧетвертое. Детские слезы злят сильнее самого проступка. «Хватит реветь!» Себе вы тоже говорите: «Соберись».\nЧто вам говорили в детстве, когда вы плакали?","caption":"«Сейчас еще ныть начнешь?» Сын слышит это и учится скрывать, что ему больно. Даже от вас.\nМеня зовут Михаил, я психолог, работаю с мужчинами 30-45 лет, с отцами.\nЕсли хочется, напишите в комментариях свой пункт.","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":5,"ai_markers":[],"worst":"«Меня зовут Михаил, я психолог, работаю с мужчинами 30-45 лет, с отцами.» — анкетная вставка: после узнаваемых сцен начинается реклама специалиста.","best":"Обидно же, даже рассказать хочется. Только «что я, жаловаться буду?».","verdict":"publikovat","why":"Отец узнает свои привычные ответы и раздражение на детский шум. Связка «злюсь на детские слезы — себе тоже запрещаю слабость» дает повод задуматься и сохранить, а простая речь вызывает доверие."},"guard":[{"rule":"dvoetochiya","quote":"альник унизил при всех, вы дома говорите: «Нормально все». Обидно же, даже расска | о себе отвечаете резко. Жена спрашив"}],"cut":["Объяснять тяжело, придется признать, что вас задело.","Весь день молчали, дома хватает одного звука."],"before":null},{"id":"r_money_1","author":"Ольга","format":"post","asked":"post","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"«Если я хорошо работаю, почему я должна выпрашивать повышение?»\n\nВ этой мысли есть подвох: повышение вам хочется получить без просьбы. Чтобы начальник сам заметил, сколько вы делаете. Тогда можно поверить: «Меня правда ценят».\n\nА если пришлось попросить, внутри уже другое: «Ну я же сама напросилась». Как будто вашу работу после этого можно вообще не учитывать. Бл*ть, деньги те же, работа та же, а радоваться уже стыдно.\n\nТак бывает, когда вы привыкли считать похвалу заслуженной только при одном условии: человек должен сам догадаться вас похвалить. Подсказали ему, и все, уже как будто выпросили. С повышением получается та же история.\n\nВы закрываете задачи за уволившуюся коллегу. Начальник пишет: «Спасибо, очень выручили». Вы отвечаете: «Да, конечно». И ждете, что он наконец заговорит о зарплате.\n\nКоллега рассказывает, что попросила прибавку и получила. Первая мысль: «Мне бы ее наглость». Хотя она просто сказала, сколько хочет получать. Господи, уже и разговор о зарплате записали в наглость.\n\nСкажите руководителю: «Я взяла на себя задачи коллеги и хочу обсудить повышение зарплаты. Когда мы можем к этому вернуться?»\n\nНачальник может ценить вашу работу и при этом годами платить столько, сколько вы соглашаетесь получать. Я бы не ждала, пока он сам предложит платить больше.","caption":"","judge":{"zhivo":4,"zacep":5,"ponyatno":5,"polza":5,"interesno":4,"snyat":null,"ai_markers":[],"worst":"С повышением получается та же история. — Лишнее пояснение: связь уже понятна.","best":"Бл*ть, деньги те же, работа та же, а радоваться уже стыдно.","verdict":"publikovat","why":"Точно поймано: хочется не только денег, но и подтверждения, что тебя ценят без подсказки. Узнаваемые рабочие ситуации и готовая фраза для начальника дают повод сохранить или переслать коллеге."},"guard":[{"rule":"kancelyarit","quote":"при этом"},{"rule":"dvoetochiya","quote":"В этой мысли есть подвох: повышение вам хочется получить без прос | сколько вы делаете. Тогда можно поверить: «Меня прав"}],"cut":["Вам хочется, чтобы повышение заодно доказало: вас видят и ценят без напоминаний.","Поэтому обычная просьба ощущается почти унизительно."],"before":null},{"id":"r_teen_1","author":"Михаил","format":"carousel","asked":"carousel","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Слайд 1: Подросток закрыл дверь и молчит\n\nСлайд 2: Вы спрашиваете через дверь: «Что случилось?», а в ответ слышите: «Ничего, отстань».\n\nОбидно. Вы ведь хотите помочь. Но подросток может уже представлять продолжение: придется отвечать на вопросы, выслушивать советы, объяснять, почему он раньше ничего не сказал.\n\nСлайд 3: На вопрос «Как дела?» подросток отвечает «Нормально», даже если день был ужасный.\n\nЕсли прошлый рассказ о ссоре закончился вашим звонком классному руководителю, он это запомнил. Теперь, прежде чем рассказать, думает: «А что потом начнется?»\n\nСлайд 4: Подросток раздражается уже на второй вопрос: «А с кем ты поссорился?»\n\nВы пытаетесь разобраться. Он пока сам толком не понимает, что произошло, и отвечать ему тяжело. «Да оставь меня» помогает быстро закончить разговор. Звучит грубо, конечно. Услышать такое от своего ребенка больно.\n\nСлайд 5: Подросток рассказывает о неприятности через неделю, когда все уже закончилось.\n\nРодителю хочется спросить: «Почему сразу не сказал?» Но рассказывать сейчас спокойнее: вы уже вряд ли пойдете выяснять отношения с его другом.\n\nСлайд 6: Чем меньше подросток рассказывает, тем сильнее вам хочется расспросить его.\n\nВы волнуетесь и снова стучите в дверь. Он ждет очередных вопросов и отвечает еще короче. Вот что досадно: вы оба хотите, чтобы стало легче, но каждый следующий разговор заканчивается быстрее предыдущего.\n\nСлайд 7: Скажите подростку: «Если захочешь рассказать, я сначала просто послушаю. С советами подожду, пока ты попросишь».\n\nИ когда он заговорит, действительно дайте ему договорить. Прежде чем кому-то звонить или вмешиваться, обсудите это с ним.","caption":"Услышать «отстань» от ребенка неприятно, даже когда понимаешь, почему он так говорит.\n\nЯ Михаил, психолог, помогаю родителям подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов.","judge":{"zhivo":4,"zacep":3,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":[],"worst":"Подросток закрыл дверь и молчит — обозначает знакомую ситуацию, но не дает интриги: зачем листать дальше?","best":"Теперь, прежде чем рассказать, думает: «А что потом начнется?»","verdict":"publikovat","why":"Родитель узнает свои попытки помочь и понимает новое: подросток может скрывать неприятности, потому что помнит последствия откровенности. Конкретные ситуации и выполнимый совет хочется сохранить; автор понимает и ребенка, и родительскую обиду."},"guard":[{"rule":"dvoetochiya","quote":"Вы спрашиваете через дверь: «Что случилось?», а в ответ слышите | : «Ничего, отстань». | осток может уже представлять пр"}],"cut":["Это страх лишних разбирательств.","Он может поделиться переживаниями, сохранив право самому решить, что делать.","У родителей тоже есть чувства, и задетым быть вполне понятно."],"before":null},{"id":"r_zlost_1","author":"Юлия","format":"post_tg","asked":"post_tg","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"«Я же все понимаю»\n\nЕсли ты опять говоришь «да ладно, ничего страшного», хотя человек отменил ваши планы в последний момент, хочу спросить: ты правда никогда не злишься или тебе сначала нужно доказать, что имеешь право?\n\n«Ну у него же были причины».\nКонечно. У всех есть причины. Даже у тебя были причины освободить вечер и ждать встречи. Их куда теперь деть?\n\nМне хочется вступиться за тебя вот в каком месте: ты так быстро объясняешь чужой поступок, что до своего «мне это не нравится» даже не доходишь.\n\n«Он же не специально». И ты сразу считаешь вопрос закрытым. Но можно задеть человека случайно. Тебе все равно придется отменять бронь и придумывать, чем занять вечер.\n\n«Войди в положение». Ты входишь. Представляешь, как он устал, сколько у него дел. А потом еще утешаешь его: «Не переживай, все нормально». Хотя сама сидишь расстроенная.\n\n«Из-за такой ерунды злиться?» После этой фразы ты уже стыдишься своей реакции. Очень удобно. Особенно тому, кто тебя подвел.\n\nТы ждешь, что злость станет допустимой, когда другой человек окажется совсем уж неправ. Пока его можно понять, ты себя одергиваешь: «Ну чего я начинаю».\n\nНо понимать человека и злиться на него можно одновременно. Даже если он хороший. Даже если ты его любишь. И злиться можно без крика, оскорблений и наказания молчанием.\n\nВ следующий раз вместо привычного «все нормально» скажи: «Я понимаю, почему так вышло. Но я злюсь, потому что рассчитывала на нашу встречу».\n\nДоказывать, что человек плохой, для этого не нужно.","caption":"","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":["Даже если он хороший. Даже если ты его любишь.","Доказывать, что человек плохой, для этого не нужно."],"worst":"«Я понимаю, почему так вышло. Но я злюсь, потому что рассчитывала на нашу встречу». — Немного учебная реплика: объяснение сильнее готовой формулы.","best":"Даже у тебя были причины освободить вечер и ждать встречи. Их куда теперь деть?","verdict":"publikovat","why":"Есть узнавание и точное открытие: ты ждешь чужой неправоты, чтобы позволить себе злиться. Автор на стороне читательницы, а отмененная встреча делает объяснение конкретным — хочется переслать такой же понимающей подруге."},"guard":[{"rule":"dvoetochiya","quote":"планы в последний момент, хочу спросить: ты правда никогда не злишься или тебе с | тся вступиться за тебя вот в каком ме"}],"cut":["Событие маленькое, значит, и чувствовать вроде бы нечего.","Чтобы сказать, что ты злишься, тебе достаточно того, что случившееся тебя задело."],"before":null},{"id":"r_drug_1","author":"Михаил","format":"post","asked":"post","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Друг снова звонит выговориться, и вы выключаете сериал: «Ладно, ему сейчас нужнее».\n\nВы слушаете, потом еще пишете: «Как вы поговорили?» Ответа нет. Через несколько дней выясняется, что они давно помирились. Можно было хотя бы сообщить, вы вообще-то переживали.\n\nВ такие моменты легко решить: «Наверное, я слишком многого хочу». Особенно если во время разговора друг говорил, как вы ему помогли и что только вам можно все рассказать.\n\nВот это и сбивает. Когда человек делится самым тяжелым, вы чувствуете себя близким ему. Вы знаете, чего он боится, из-за чего плакал, какие сообщения ему прислали. Кажется, уж вам-то он доверяет.\n\nИ вы соглашаетесь поговорить, даже когда сами еле добрались до кровати. Свое «у меня тоже день ужасный» оставляете на потом. Сейчас бы его успокоить.\n\nА потом поговорить так и не получается. На ваше «как дела?» приходит короткое «все нормально». До следующей беды.\n\nТут больно еще и потому, что в тяжелые дни вы получаете подтверждение: «Я ему нужен». Отказать страшно. Вдруг тогда он вообще перестанет звонить? И вы продолжаете быть доступным, хотя уже злитесь каждый раз, когда видите его имя на экране.\n\nЕсли узнали себя, скажите прямо: «Я переживаю за тебя и хочу общаться, когда у тебя все хорошо тоже. Мне обидно, что после наших разговоров ты пропадаешь».","caption":"","judge":{"zhivo":4,"zacep":4,"ponyatno":5,"polza":4,"interesno":4,"snyat":null,"ai_markers":[],"worst":"Если узнали себя, скажите прямо: — шаблонный переход к совету; финал суше остального текста.","best":"Можно было хотя бы сообщить, вы вообще-то переживали.","verdict":"publikovat","why":"Узнаваемые детали и точное объяснение: чужие откровения дают ощущение близости, а страх потерять эту близость заставляет снова отвечать на звонки. Есть что переслать подруге; автор понима
