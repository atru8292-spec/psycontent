const DATA=[{"id":"d_rabota_1","author":"Михаил","format":"reels_scenka","asked":"reels_auto","intent":"kak_v_terapii","topic":"что на самом деле происходит на первой консультации у меня","text":"Текст на экране: «Я хочу нормально объяснить»\nПерсонажи: А это я перед первой консультацией, Б это психолог\nБ: Ко мне можно прийти без готового запроса.\nА: Но я же должен объяснить, что со мной.\nБ: Что вы уже можете сказать?\nА: Что вчера в кровати репетировал, как буду вам все рассказывать.\nБ: Чего боялись?\nА: Начну путаться, вы спросите, зачем я вообще пришел.\nБ: И сейчас подбираете слова?\nА: Да, хочу нормально объяснить, чтобы вы поняли.\nБ: А путаться при мне страшно?\nА: Конечно. Вы же психолог, сразу заметите, что я какой-то странный.\nБ: Мы уже можем об этом поговорить.\nА: То есть начать с того, как я боюсь вам рассказывать?\nБ: Да.","caption":"В начале я рассказываю, как проходит встреча и как соблюдается конфиденциальность. Вы тоже можете спрашивать меня о моей работе.\nМеня зовут Михаил, я психолог, работаю со взрослыми, которые впервые идут к психологу.\nОтправьте тому, кто волнуется перед первой встречей.","judge":null,"guard":[],"cut":[],"before":null},{"id":"d_sovety_1","author":"Ольга","format":"post_tg","asked":"post_tg","intent":"poziciya","topic":"почему я не даю советов «просто уйди от него»","text":"Меня бесит это «просто уйдите»\n\nЯ не даю советов «просто уйди от него», потому что слово «просто» здесь охренеть как много всего пропускает. Деньги, жилье, детей, страх, привязанность, надежду, что еще получится договориться. Совет произнести легко. Жить с последствиями придется вам.\n\nЯ совершенно не считаю, что семью нужно сохранять любой ценой. Но даже когда вы уже понимаете, что хотите уйти, между этим пониманием и уходом есть целая жизнь, которую придется как-то устроить.\n\nИ вот вам говорят: просто уйдите. А вы потом спрашиваете себя: почему я до сих пор с ним? Что со мной такое, если мне страшно? Получается, я сама виновата во всем, что он иходится тянуть самим.\nПодписывайтесь, если хочется еще таких разговоров про семью, усталость и отношения с близкими.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Отдохнуть хочется, и одновременно обидно: значит, все это время они могли сами? | особенно злит совет просто делегироват"}],"cut":["Будто вам нужно получить разрешение устать.","Я считаю, с этим вполне можно приходить."],"before":null}];const KEY='eval-2026-10-02_04-59-58_rilsy_probe_zh_roli';

c.querySelector('input').onchange=e=>{R[d.id]={...(R[d.id]||{}),note:e.target.value};save()};
m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
