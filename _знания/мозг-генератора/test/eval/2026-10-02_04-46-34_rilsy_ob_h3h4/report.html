отправл"}],"cut":["Конечно, вы переключились.","В дружбе вы обе нуждаетесь в поддержке."],"before":null},{"id":"r_vopros_1_2","author":"Ольга","format":"reels_malysh","asked":"reels_auto","intent":"obyasnenie","topic":"«а зачем мне психолог, если у меня есть подруги»","text":"Текст на экране: Подружки и клубок, который все запутал\nРечь: Вы спрашиваете: «Зачем мне психолог, если есть подруги?» Солнышки, сейчас объясню.\n\nВот вы рассказываете подруге про очередную ссору. Она говорит: «Да пошел он нахер». И вам тепло: моя, понимает.\n\nРисую: клубок, из которого торчит ниточка.\n\nА потом подруга говорит: «Слушайте, вы ведь тоже его задеваете». Все. Теперь еще надо выяснить, она вообще за кого.\n\nВот тут узелок. Можно начать спорить, оправдываться, беречь подругу от своей злости.\n\nУ психолога можно сказать: «Я сейчас на вас злюсь. Мне кажется, вы меня обвиняете». И мы этот узелок вместе разбираем. Я выдержу, что вам сейчас со мной неприятно.\n\nВам не нужно сначала помириться со мной, чтобы продолжить разговор.","caption":"Подруге тоже бывает нужна поддержка, даже когда вы пришли со своей бедой. На встрече с психологом можно весь час говорить о себе, без очереди «теперь ты».\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 22 до 35.\nПодписывайтесь, если хочется еще таких объяснений про отношения и себя в них.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Вы спрашиваете: «Зачем мне психолог, если есть подруги? | подруге про очередную ссору. Она говорит: «Да пошел он нахер»."}],"cut":["В дружбе вам важно, что будет с вами двумя после этого разговора."],"before":null},{"id":"r_post_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"он не пишет первым, а я весь вечер жду и проверяю телефон","text":"Текст на экране: Он молчит, и весь вечер пропал\nРечь: Четыре признака у девушек, которые весь вечер ждут, когда он напишет первым.\nПервое. Тебе трудно заняться своим. Сериал идет, рабочий файл открыт, но тношения.\nПодписывайся, если хочется еще таких разговоров про влюбленность, тревогу и близость.","judge":null,"guard":[],"cut":["Иногда его первое сообщение становится разрешением на твое собственное желание."],"before":null},{"id":"r_tg_1","author":"Михаил","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Текст на экране: Коробочка «Я ничего не умею»\nРечь: Хорошие мои, вы боитесь, что на работе вас раскусят и поймут: вы ничего не умеете?\n\nПредставьте, внутри есть коробочка с такой надписью. Вы складываете туда все, что про себя знаете. Только, смотрите, что получается.\n\nСдали сложную задачу. Вам говорят: «Отличная работа». Вы уже тянетесь положить это в коробочку, но тут: «Да просто повезло. Тема знакомая попалась». Все, убрали.\n\nА ошибку положили. Аккуратненько. Даже маленькую.\n\nКонечно, с такой коробочкой страшно идти на совещание.\n\nДавайте положим туда и выполненную задачу. Вместе со всеми вашими «повезло».\n\nЭту работу все равно сделали вы.","caption":"После повышения даже обычный вопрос коллеге может казаться признанием: «Зря вы меня сюда взяли».\nЯ Михаил, психолог, работаю со специалистами от 25 до 35 лет в офисе и на удаленке.\nЕсли знакомо, напишите в комментариях «повезло».","judge":null,"guard":[{"rule":"rublenye","quote":"Тема знакомая попалась». Все, убрали. А ошибку положили. Аккуратненько. Даже маленькую."},{"rule":"dvoetochiya","quote":"есь, что на работе вас раскусят и поймут: вы ничего не умеете? | Сдали сложную задачу. Вам говорят: «Отличная работа». В"}],"cut":["Получается, хорошую работу каждый раз приходится чем-нибудь объяснять.","Ошибка сразу считается правдой про вас."],"before":null},{"id":"r_tg_1_2","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"боюсь, что на работе меня раскусят и поймут, что я ничего не умею","text":"Текст на экране: Скоро поймут, что я ничего не умею\n\nРечь: «На работе меня скоро раскусят. Просто пока задачи попадались легкие».\n\nВы подготовили отчет, руководитель доволен. И вы тут же: «Да ладно, там любой бы справился». Хотя вчера сидели над ним весь вечер.\n\nВсе, что получилось, сразу списываете: задача простая, коллега подсказал, повезло.\n\nИ что, следующий удачный отчет поможет? Вы ведь и ему найдете объяснение.\n\nВы каждый раз меняете условия зачета, как только справились. Что вообще должно получиться, чтобы вы это себе засчитали?","caption":"В резюме бывает проще признать свои достижения: там хотя бы приходится написать, что именно вы сделали.\nМеня зовут Михаил, я психолог, работаю со специалистами от 25 до 35, в офисе и на удаленке.\nПодписывайтесь, если хочется еще таких разборов.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"отчет, руководитель доволен. И вы тут же: «Да ладно, там любой бы справился». Хот | Все, что получилось, сразу списывает"}],"cut":["Вот здесь вы сами себе закрываете возможность поверить в свои способности.","Получается, успехов полно, а доказательств, что вы что-то умеете, у вас как будто нет."],"before":null},{"id":"r_car_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Текст на экране: Подруга с депрессией: помощь тоже бывает тяжелой\nРечь: Четыре реакции подруги с депрессией, которые легко принять на свой счет.\nПервое. Она молчит в ответ на ваше «Как ты?». Чтобы ответить, приходится понять, как она, подобрать слова, еще и вас поберечь. Сообщение короткое, работы дофига.\nВторое. Раздражается на «Скажи, чем помочь». «Блядь, мне теперь еще придумать тебе задание».\nТретье. Отказывается от встречи. Даже с любимой подругой нужно разговаривать, реагировать, как-то участвовать. Сил на это может просто не быть.\nЧетвертое. Сама вас успокаивает: «Все нормально, честно». Ей плохо, и она еще переживает, что вы расстроитесь.\nМожно написать: «Оставлю тебе еду у двери. Отвечать необязательно».","caption":"«Я завтра заеду» тоже лучше согласовать: неожиданный визит может оказаться дополнительной нагрузкой. Достаточно короткого «Можно оставить пакет у двери?».\nМеня зовут Ольга, я психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хочется, напишите свой пункт: какая поддержка вам подходит?","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Подруга с депрессией: помощь тоже бывает тяжелой | Четвертое. Сама вас успокаивает: «Все нормально, честно». Ей плохо, и"}],"cut":["Вы искренне предлагаете помощь, а ей тяжело даже ВЫБРАТЬ."],"before":null},{"id":"r_car_1_2","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"dlya_blizkih","topic":"как поддержать подругу с депрессией и не сделать хуже","text":"Текст на экране: Курсы поддержки подруг. Тема: бодрость\nРечь: Если у подруги депрессия, главное, чтобы после вашей поддержки она выглядела повеселевшей. Я подготовила инструкцию. Отказывается встретиться? Скажите, что ради нее отменили планы. Теперь у нее есть мотивация. Отвечает одним словом? Напишите: «Ты на меня обиделась?» Пусть объяснит, успокоит вас. Плачет? Расскажите, как вам тяжело видеть ее такой. Получится взаимная поддержка, прекрасно. Говорит, что даже душ принять сил нет? Предложите вечеринку. Душ, одежда, такси, люди. ВЕСЕЛО же. И обязательно спросите: «Ну что, я тебя хоть немного отвлекла?» Вы же, блядь, старались. Так, улыбнулась? Отлично, помощь оказана. Можно расходиться.","caption":"Можно написать: «Привезу еды, оставлю у двери. Отвечать и встречать меня не нужно».\nЯ Ольга, психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хотите прийти на консультацию, пишите в директ слово «разбор».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Курсы поддержки подруг. Тема: бодрость | тивация. Отвечает одним словом? Напишите: «Ты на меня обиделась?» Пусть объясни"}],"cut":["При депрессии даже ответ на сообщение может требовать сил, а тут еще приходится успокаивать того, кто пришел поддержать."],"before":null},{"id":"r_mif_2","author":"Юлия","format":"reels_rol","asked":"reels_auto","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"Текст на экране: Инструктаж: как перестать накручивать\nРечь: Тебе не отвечают на сообщение, и ты тревожишься? Так, сейчас научу. Просто перестань накручивать. Как перестать? Ну просто. Ты же сама начала, сама и заканчивай. Телефон убери. Думаешь о сообщении без телефона? Тогда мысли убери тоже. Почему он молчит, почему был в сети, в чем я виновата? Вот это все выключай. Кнопки нет? Странно, в инструкции написано «просто». Так. Теперь ты еще и злишься на себя, что опять накрутила? Отлично, значит, ответственность приняла. Следующий пункт: успокойся немедленно. Нам тут тревожные люди портят статистику легкости метода.","caption":"После «сама себя накрутила» бывает стыдно даже попросить поддержки, будто сначала надо доказать, что ты пыталась успокоиться.\nЯ Юлия, психолог, работаю с тревожными людьми от 20 до 40.\nНапиши свой пункт из инструкций «просто успокойся».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Инструктаж: как перестать накручивать | ответственность приняла. Следующий пункт: успокойся немедленно. Нам тут тревожны"}],"cut":["За десять сообщений подряд ты отвечаешь, сам испуг вины тебе не добавляет."],"before":null},{"id":"r_mif_2_2","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«тревогу надо просто перестать накручивать»","text":"Текст на экране: Я опять сама себя накрутила\n\nРечь: «Он не отвечает? Просто перестань себя накручивать». Как будто ты сидела спокойно и решила: так, чем бы испортить себе вечер?\n\nТы видишь прочитанное сообщение, ждешь, открываешь переписку. Потом вспоминаешь: надо перестать накручивать. И начинаешь проверять уже себя. Почему я опять тревожусь? Почему не могу спокойно подождать? Что со мной такое?\n\nОн молчит. И ты опять не справилась с заданием быть спокойной.\n\nТы отвечаешь за свои поступки: что напишешь, что скажешь, будешь ли обвинять человека. А с этим «просто перестань» приходится еще оправдываться перед собой за каждую страшную мысль.\n\nКак будто тревога теперь еще и проступок.","caption":"Иногда после слов «возьми себя в руки» хочется еще и спрятать телефон, чтобы никто не видел, как часто ты его проверяешь. Стыдно становится даже ждать ответа.\nМеня зовут Юлия, я психолог, работаю с тревожными людьми от 20 до 40.\nЕсли хочется поговорить об этом на консультации, ссылка на запись в шапке профиля.","judge":null,"guard":[{"rule":"skrytoe_protivopostavlenie","quote":"не отвечает? Просто"},{"rule":"dvoetochiya","quote":"». Как будто ты сидела спокойно и решила: так, чем бы испортить себе вечер? | открываешь переписку. Потом вспоминаешь: н"}],"cut":["Вот теперь у тебя два повода переживать."],"before":null},{"id":"r_rod_1","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Мама обижается, если я не звоню\nРечь: «Мама обижается, если я не звоню каждый день».\n\nИ вот вы вечером набираете ее, хотя уже засыпаете. Спрашиваете, как дела, слушаете про соседку. Мама довольна. Фух, можно спать.\n\nА завтра закрутились, пропустили звонок. «Ну понятно, про мать совсем забыла».\n\nИ вы начинаете вспоминать: подождите, я же вчера звонила. И позавчера. Да всю неделю, блядь!\n\nНо эти звонки почему-то нигде не учитываются. Один пропущенный вечер, и вы СНОВА виноваты.\n\nИ постепенно вы уже проверяете время: успею сегодня, пока мама не начала?\n\nВы с мамой разговариваете или каждый вечер продлеваете себе статус хорошей дочери?","caption":"А фраза «могла бы и минутку найти» потом всплывает даже в отпуске, когда телефон лежит в номере.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые давно живут отдельно, а с родителями все еще сложно.\nОтправьте тому, кто тоже вечером смотрит на часы и вспоминает про звонок маме.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"И вы начинаете вспоминать: подождите, я же вчера звонила. И позавч | И постепенно вы уже проверяете время: успею сегодня"}],"cut":["Получается, каждый звонок дает вам ровно сутки до следующей обиды."],"before":null},{"id":"r_rod_1_2","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мама обижается, если я не звоню каждый день","text":"Текст на экране: Мама обижается, если вы день не звоните\nРечь: Четыре признака, что вы звоните маме каждый день из страха ее обидеть.\nПервое. Вы заранее готовите оправдания. «Работала, потом магазин». Даже свободный вечер приходится объяснять уважительной причиной.\nВторое. Чужая обида для вас срочное дело. Коллега недоволен вашим отказом, и вы уже готовы задержаться. Ну сука, опять кому-то надо доказать, что вы хорошая.\nТретье. Вы скрываете приятное. Фото из ресторана маме потом отправите. Вдруг скажет: «На это время есть, а матери позвонить некогда».\nЧетвертое. Вам легче отдыхать, когда мама сама занята. «Сегодня не звони, мы в гостях». И вы прямо выдыхаете.","caption":"Иногда короткий звонок заканчивается, а мамино недовольство остается с вами до ночи. И вы еще перед сном отправляете сердечко, чтобы завтра разговор начался спокойно.\nЯ Ольга, психолог, работаю со взрослыми детьми, которые живут отдельно от родителей.\nПодписывайтесь, если хочется еще таких разборов отношений с родителями.","judge":null,"guard":[],"cut":["Получается, даже в собственной квартире вы ждали ее разрешения на свободный вечер."],"before":null},{"id":"r_men_1","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Терпите весь день, срываетесь на детей\nРечь: Четыре признака отца, который запрещает себе плакать и срывается на детей.\nПервое. На работе вы проглатываете обиду. Начальник отчитал при всех, вы кивнули. Дома ребенок пролил сок, и голос уже слышно соседям.\nВторое. На вопрос «что случилось?» отвечаете «все нормально». Даже жене. Начнете рассказывать, еще голос дрогнет. Вот этого вы себе позволить не можете.\nТретье. Усталость тоже надо заслужить. Прилегли, увидели разбросанные игрушки, сразу встали: «Сколько можно за всеми убирать!»\nЧетвертое. Детские слезы вызывают злость: «Из такой ерунды реветь?» И тут же вспоминается: «Мне в его возрасте никто сопли не вытирал».\nВас больше злит, что он плачет, или что его утешают?","caption":"Иногда даже извинение перед ребенком застревает в горле: придется признать вслух, что самому было тяжело. Проще молча починить ему велосипед.\nМеня зовут Михаил, я психолог, работаю с мужчинами и отцами от 30 до 45 лет.\nСохраните, если хочется вернуться к этому разговору.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"идели разбросанные игрушки, сразу встали: «Сколько можно за всеми убирать!» | Четвертое. Детские слезы вызывают злость: "}],"cut":["Лежать спокойно у вас опять не получилось."],"before":null},{"id":"r_men_1_2","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"мужчины не плачут, а потом срываются на детей","text":"Текст на экране: Папы, которым нельзя раскисать\nРечь: Четыре признака отца, который запрещает себе раскисать и срывается на детей.\nПервое. Обиду вы сразу обесцениваете. Начальник унизил при коллегах, вы себе: «Переживу, маленький, что ли?» И продолжаете работать.\nВторое. Напряжение замечаете уже по голосу. Ребенок третий раз зовет посмотреть рисунок, и вы слышите собственное: «Да подожди ты!» Хотя еще минуту назад считали себя спокойным.\nТретье. Даже усталость надо заслужить. Сели на диван, тут же вспоминаете несобранный шкаф. Давайте так, у вас даже к дивану нужен допуск.\nЧетвертое. Детские слезы злят сильнее самого проступка. Разбил чашку, ладно. Но когда начинает плакать, хочется рявкнуть: «Прекрати!» Внутри уже звучит: «Я терплю. Почему ему можно?»","caption":"«Меня так воспитывали, я вырос нормальным» часто закрывает разговор именно там, где хочется спросить: какой ценой? Особенно если признаться в обиде на своего отца до сих пор стыдно.\nМеня зовут Михаил, я психолог, работаю с мужчинами от 30 до 45 лет, с отцами.\nПодписывайтесь, если хочется еще такого: здесь говорим об отцовстве, чувствах и отношениях.","judge":null,"guard":[{"rule":"dvoetochiya","quote":". Начальник унизил при коллегах, вы себе: «Переживу, маленький, что ли?» И продол | отреть рисунок, и вы слышите собстве"}],"cut":[],"before":null},{"id":"r_vopros_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: «О чем вообще говорить у психолога?»\nПерсонажи: А это клиентка, Б это психолог\nА: Я впервые у психолога и вообще не знаю, что говорить.\nБ: С чего хотела начать?\nА: Составила список. Потом почти все вычеркнула.\nБ: Что ты вычеркнула?\nА: Что устала. Что мне обидно, когда мама перебивает.\nБ: Почему это вычеркнула?\nА: Ну все устают. И мамы у всех такие.\nБ: И что осталось?\nА: Ничего. Я подумала, вам надоест слушать мои жалобы.\nБ: Я сказала, что надоело?\nА: Нет. Я еще ничего толком не успела рассказать.\nБ: А сейчас кто тебя перебил?","caption":"На первую встречу можно прийти со списком в телефоне и ни разу его не открыть.\nЯ Юлия, психолог, работаю с теми, кто впервые собирается в терапию.\nОтправь тому, кто пока собирается с духом.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_vopros_2_2","author":"Юлия","format":"reels_otvet","asked":"reels_auto","intent":"kak_v_terapii","topic":"«а о чем вообще говорить на первой сессии?»","text":"Текст на экране: О чем говорить на первой сессии?\nРечь: А о чем вообще говорить на первой сессии? Можно начать с того, что ты боишься выбрать какую-нибудь ерунду. Вот прямо так и сказать. Допустим, перед встречей ты перебираешь: про маму, про работу, про то, что он весь день не отвечал? Ну, последнее вроде стыдно. Люди с серьезными проблемами приходят, а ты со своими сообщениями. И уже сидя напротив меня, говоришь: «Наверное, это глупость». Вот тут я бы задержалась. Ты еще ничего не рассказала, а уже извиняешься за то, что тебе больно. И я бы спросила: «А чье согласие тебе нужно, чтобы считать это достаточно серьезным?»","caption":"Иногда перед первой встречей хочется даже записать все по пунктам. Я спокойно отношусь к тому, что ты принесешь список и в итоге заговоришь совсем о другом.\nМеня зовут Юлия, я психолог, помогаю разобраться тем, кто впервые собирается в терапию.\nПодписывайся, если хочется еще такого: здесь я рассказываю, что происходит у психолога.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не рассказала, а"},{"rule":"dvoetochiya","quote":"Допустим, перед встречей ты перебираешь: про маму, про работу, про то, что он ве | иями. И уже сидя напротив меня, говор"}],"cut":[],"before":null},{"id":"r_money_1","author":"Ольга","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"Текст на экране: Звездочка за работу, стыд за деньги\nРечь: Хорошие мои, вы работаете больше всех, а попросить повышение зарплаты стыдно?\n\nВ голове у вас звездочка за хорошее поведение. Ее дают, когда вы помогаете, соглашаетесь, ничего себе не просите. Вот какая ХОРОШАЯ.\n\nВ пятницу начальник приносит еще один отчет. Вы уже собирались домой, но берете. Еще звездочка.\n\nА заговорить про денежки страшненько. Вдруг звездочку снимут? Скажут: «Так вы ради денег старались?»\n\nБлядь, получается, за дополнительную работу вы расплачиваетесь еще и молчанием.\n\nВы ждете, когда заслуг станет столько, что просить будет прилично. Только у этой звездочки такое условие: хорошая девочка сама ничего не просит.\n\n«Я хочу обсудить повышение зарплаты».","caption":"Список своих задач вы можете написать за пять минут. А сообщение с просьбой о встрече переписывать весь вечер.\nЯ Ольга, психолог, работаю с женщинами, которые строят карьеру в найме.\nЕсли знакомо, напишите в комментариях «звездочка».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ашненько. Вдруг звездочку снимут? Скажут: «Так вы ради денег старались?» | о. Только у этой звездочки такое условие: хор"}],"cut":["Можно прийти на разговор вместе со своим стыдом."],"before":null},{"id":"r_money_1_2","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"стыдно просить повышение, хотя работаю больше всех","text":"Текст на экране: Работаю больше всех, стыдно просить повышение\nРечь: «Мне стыдно просить повышение, хотя я работаю больше всех».\n\nВы вечером доделываете отчет. Открываете чат начальницы, собираетесь попросить встречу про зарплату. И тут: «Может, сначала еще тот проект вытянуть?» Блядь, еще один. Чтобы уж точно заслужить.\n\nСмотрите, вы можете годами жить с негласным договором: я угадываю, что вам нужно, делаю больше, вы САМИ замечаете и меня награждаете. Красивый договор. Только начальница его вообще не подписывала.\n\nА попросить стыдно, потому что в этом договоре хорошую сотрудницу должны заметить без напоминаний. Приходится самой объявить: мой труд стоит дороже.\n\nСколько еще отчетов вы собираетесь написать вместо одного разговора?","caption":"У начальницы ваша готовность брать еще может давно записаться в «ее все устраивает». Особенно если на каждую новую задачу вы отвечаете: «Да, конечно».\nЯ Ольга, психолог, работаю с женщинами, которые строят жизнь и карьеру в найме.\nЕсли хотите обсудить это на консультации, пишите в директ слово «разбор».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"сь попросить встречу про зарплату. И тут: «Может, сначала еще тот проект вытянуть | можете годами жить с негласным догов"}],"cut":["И что получается?"],"before":null},{"id":"r_body_1","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Тем, кто ненавидит свое отражение перед отпуском\nРечь: Если перед отпуском ты смотришь на себя в купальнике и думаешь: «Господи, как я с этим телом поеду», послушай. Ты сейчас стоишь перед зеркалом и решаешь, можно ли тебе вообще радоваться поездке. Втянула живот, повернулась боком. Так вроде можно. Выдохнула, опять все испортила. И уже злишься на себя: почему я заранее собой не занялась? Сколько можно, ну сколько можно проверять, заслужила ли ты ходить в купальнике. Ты хотела отпуск, а получила еще одно место, где надо соответствовать. Даже радоваться страшно, вдруг слишком рано расслабилась. И да, живот тоже едет в отпуск.","caption":"На фотографиях из поездки потом можно искать только складку на боку и даже не заметить, как там смеешься.\nМеня зовут Юлия, я психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хочется, напиши в комментариях, что у тебя чаще звучит перед зеркалом.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"смотришь на себя в купальнике и думаешь: «Господи, как я с этим телом поеду», по | ять все испортила. И уже злишься на с"}],"cut":["Конечно, тут и злость, и стыд."],"before":null},{"id":"r_body_1_2","author":"Юлия","format":"reels_malysh","asked":"reels_auto","intent":"podderzhka","topic":"ненавижу себя в зеркале перед отпуском","text":"Текст на экране: Кто не пускает тебя на пляж\nРечь: Солнышко, ты перед отпуском смотришь в зеркало и прямо ненавидишь свой животик? Уже хочется отменить пляж. И еще ругаешь себя: ну почему я даже отдыху не могу порадоваться?\n\nПредставь, что внутри сидит строгий вахтер. Ты ему: «Я к морю». Он тебе: «С таким животом? Нельзя».\n\nОн очень боится, что тебя увидят и начнут обсуждать. Поэтому придирается первым. Все проверяет, все запрещает. Ему кажется: если оставить тебя дома, никто тебя не обидит.\n\nВот ты еще чемодан не собрала, а уже выслушала про себя столько гадостей. От себя же.","caption":"Перед отпуском даже привычный купальник вдруг хочется вернуть в магазин. Хотя еще месяц назад ты спокойно его носила.\nЯ Юлия, психолог, работаю с девушками и женщинами от 20 до 40.\nЕсли хочется поговорить об этом, ссылка на запись в шапке профиля.","judge":null,"guard":[{"rule":"ne_x_a_y","quote":"не собрала, а"},{"rule":"dvoetochiya","quote":"очется отменить пляж. И еще ругаешь себя: ну почему я даже отдыху не могу порадов | что внутри сидит строгий вахтер. Ты "}],"cut":["Можно пока себе не нравиться.","Для поездки к морю этого достаточно."],"before":null},{"id":"r_teen_1","author":"Михаил","format":"reels_rol","asked":"reels_auto","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Текст на экране: Подросток закрыл дверь. Родительское собрание\nРечь: Подросток закрылся в комнате и не разговаривает? Уважаемые родители, сейчас научимся вызывать его на откровенность. Сначала стучим: «Можешь мне все рассказать». Молчит? Добавляем: «Я с кем разговариваю?» Просит оставить его одного? Уточняем: «Что ты там скрываешь?» Тут важно стоять под дверью, чтобы человек чувствовал поддержку. Наконец сказал, что устал? Отлично, разговор пошел. Объясняем, кто в этой семье действительно устал. Сказал, что вы его не понимаете? Перечисляем все, что для него сделали. Только подробно, пусть проникнется. И обязательно в конце: «Почему ты мне ничего не рассказываешь?» Ответ ждем искренний. Правильный ответ я сейчас продиктую.","caption":"Можно сказать: «Я рядом, если понадоблюсь», и дать ему побыть одному.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nЕсли знакомо, напишите в комментариях «пауза».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ать его на откровенность. Сначала стучим: «Можешь мне все рассказать». Молчит? До | бавляем: «Я с кем разговариваю?» Про"}],"cut":["Если каждый ответ запускает новую лекцию, молчание становится самым коротким способом закончить разговор."],"before":null},{"id":"r_teen_1_2","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"dlya_blizkih","topic":"подросток закрылся в комнате и не разговаривает","text":"Текст на экране: Подросток закрылся в комнате и молчит\nРечь: Четыре вещи о подростке, который закрылся в комнате и не хочет с вами разговаривать.\nПервое. На вопросы отвечает «не знаю». Иногда он знает, но уже представляет следующие десять вопросов.\nВторое. Прячет даже небольшие неприятности. Рассказать про двойку для него значит сразу получить план, что теперь делать. А он еще сам переваривает.\nТретье. Злится на «ты же сам сказал». Сказал, потом передумал. Теперь каждую фразу приходится проверять: вдруг запомнят.\nЧетвертое. Выходит спросить, что на ужин, будто ничего не случилось. Можно побыть рядом, поговорить, и никто пока ничего про тебя не выясняет.","caption":"В переписке подростку иногда легче сказать что-то важное: фразу можно стереть, переписать, отправить позже. Поэтому сообщение из соседней комнаты тоже считается разговором.\nМеня зовут Михаил, я психолог, работаю с родителями подростков от 12 до 17 лет.\nПодписывайтесь, если хочется еще таких разборов.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Теперь каждую фразу приходится проверять: вдруг запомнят. | остку иногда легче сказать что-то важное: фразу можно стерет"}],"cut":["Давайте так, к целому разговору он сейчас тоже должен быть готов.","Вот этот вопрос ему задать легко."],"before":null},{"id":"r_vybor_1","author":"Ольга","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: «Опять выбрала того, кому не нужна»\nПерсонажи: А это клиентка, Б это психолог\nА: Опять залипла на мужчину, которому я особо не нужна.\nБ: Что вам в нем нравится?\nА: Когда отвечает, я прям оживаю. НАКОНЕЦ заметил, сука.\nБ: А на встрече как?\nА: Да скучно. Я даже подруге пишу под столом.\nБ: И потом опять ждете сообщения?\nА: Да! Думаю, что написать, чтобы он захотел встретиться.\nБ: Его интерес уже стал вашим призом.\nА: Блин, я даже забыла, как сама хотела домой.\nБ: Пока добиваетесь его, выбирать самой некогда.\nА: Ну вдруг он выберет меня, и все наладится?\nБ: А вы тогда выберете его?","caption":"Подруге уже отправлены скрины, его ответ разобран по словам. До обсуждения того, как вам было рядом с ним, опять не дошли.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 35.\nОтправьте той, с кем разбираете эти переписки.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_vybor_1_2","author":"Ольга","format":"reels_malysh","asked":"reels_auto","intent":"mehanizm","topic":"почему я снова выбираю тех, кто меня не выбирает","text":"Текст на экране: Почему вы опять у закрытой дверцы\nРечь: Девочки, вы снова выбираете того, кто вас не выбирает, и внутри больно-больно.\n\nПредставьте дверцу. Вам хочется, чтобы человек открыл ее и позвал вас к себе.\n\nЕсли раньше приходилось заслуживать внимание, закрытая дверца дает знакомое задание: постарайтесь еще. Будьте интереснее, терпеливее, удобнее. Тогда откроют.\n\nОн неделю молчит, потом присылает: «Соскучился». И все, блядь, вы опять стучите. Ну вот же, почти получилось!\n\nПоэтому человек, которому вы сразу понравились, может казаться скучным. Там ваше старание вообще никому не понадобилось. Даже обидно.\n\nА здесь хочется ДОКАЗАТЬ, что вас можно выбрать.\n\nМожно потихоньку отойти от дверцы.\n\nВы уже достаточно старались.","caption":"Особенно трудно остановиться после редкого теплого вечера: вы потом еще месяц помните, каким он бывает хорошим. И ждете повторения.\nЯ Ольга, психолог, работаю с девушками и женщинами 22-35 лет.\nПодписывайтесь, если хочется еще таких разговоров про отношения и про себя в них.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"е, закрытая дверца дает знакомое задание: постарайтесь еще. Будьте интереснее, те | Он неделю молчит, потом присылает: «"}],"cut":["Даже если очень хочется достучаться."],"before":null},{"id":"r_zlost_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"Текст на экране: Я вообще никогда не злюсь\n\nРечь: «Я вообще никогда не злюсь», говоришь ты, когда подруга опять отменяет встречу за час.\n\nТы уже собралась. Вечер освободила. Но у нее на работе завал, ну как тут злиться?\n\n«Войди в положение». Входишь. Сразу, даже пальто снять не успела.\n\n«Ты же понимаешь». Понимаешь. У нее сложный день, она устала.\n\n«Ну что ты из-за ерунды». И вот ты уже проверяешь, достаточно ли серьезная причина у тебя расстроиться.\n\nА у него найдутся. Всегда найдутся.\n\nМожно понимать, почему подруга отменила встречу, и злиться, что твой вечер сорвался. Ей даже не обязательно быть плохой, чтобы ты имела право сердиться.","caption":"Иногда после такого вечера хочется отменить уже следующую встречу. А сказать «я тогда разозлилась» все еще кажется ужасно невежливым.\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nОтправь той, которая всегда входит в чужое положение.","judge":null,"guard":[],"cut":["Ты как будто можешь злиться только после того, как докажешь, что у человека никаких оправданий."],"before":null},{"id":"r_zlost_1_2","author":"Юлия","format":"reels_poslanie","asked":"reels_auto","intent":"razreshenie","topic":"«я вообще никогда не злюсь»","text":"Текст на экране: Тем, кто говорит «я никогда не злюсь»\nРечь: Если ты говоришь «я вообще никогда не злюсь», а потом полвечера вспоминаешь, как с тобой разговаривали, послушай. Тебе опять отменили встречу в последний момент. Ты написала: «Все нормально». И сидишь, внутри кипит, но уже сама себя уговариваешь. «Ну войди в положение». Вошла. Уже придумала пять причин, почему человек так поступил. «Чего ты из-за ерунды?» И вот ты доказываешь себе, что встреча была важной, вечер ты освободила, вообще-то ждала. «Будь выше этого». Куда еще выше? Ты уже собственную злость услышать не можешь. Тебе можно злиться и на человека, которого ты понимаешь.","caption":"Иногда «я все понимаю» вылетает раньше, чем успеваешь сказать: «Мне жаль, я хотела тебя увидеть».\nМеня зовут Юлия, я психолог, работаю с женщинами, которые привыкли быть хорошими и удобными.\nПодписывайся, если хочется еще таких разговоров: здесь про отношения, злость и привычку всем угождать.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"встречу в последний момент. Ты написала: «Все нормально». И сидишь, внутри кипит | » вылетает раньше, чем успеваешь сказ"}],"cut":["Каждый раз устраиваешь суд: достаточно ли тебя обидели, чтобы тебе разрешалось злиться."],"before":null},{"id":"r_humor_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"Текст на экране: Инструктаж для подруг психолога\nРечь: Девочки, учимся приходить к подруге психологу «просто поговорить». Сначала спросите, как она. Ответ можно промотать. Теперь голосовое на восемнадцать минут. В конце обязательно: «Ты как специалист что скажешь?» Она устала? Скажите: «Мне даже поговорить с тобой теперь нельзя?» Отлично, чувство вины подключили. Блядь, работает. Она предлагает записаться на консультацию? «Ты что, на мне зарабатывать собралась?» Она отвечает как подруга? «А где твоя профессиональная этика?» Запомнили? Она у нас специалист, когда нужен разбор, и подруга, когда речь про оплату. Так, домашнее задание: написать ей в одиннадцать вечера «Ты спишь?» И сразу следом: «Мне кажется, ты меня ИЗБЕГАЕШЬ. С чем это связано?»","caption":"У фразы «тебе же самой интересно» тоже есть постоянная прописка в таких разговорах. Особенно когда уже открыли переписку с бывшим за последние полгода.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nДобавьте в комментариях свою фразу для этого инструктажа.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"восемнадцать минут. В конце обязательно: «Ты как специалист что скажешь?» Она ус | тала? Скажите: «Мне даже поговорить с"}],"cut":[],"before":null},{"id":"r_humor_1_2","author":"Ольга","format":"reels_scenka","asked":"reels_auto","intent":"yumor","topic":"когда ты психолог, а подруги приходят «просто поговорить»","text":"Текст на экране: «Я просто поговорить, вы же психолог»\nПерсонажи: А это подруга, Б это я, психолог\nА: Я к вам ПРОСТО поговорить. Вы же психолог.\nБ: Как подруги поболтаем?\nА: Конечно. Я переписку принесла. Почему я таких выбираю?\nБ: А обо мне спросите?\nА: Да! Вы как психолог что об этом думаете?\nБ: Думаю, я устала.\nА: От клиентов? Тогда отвлекитесь, давайте мой случай разберем.\nБ: Да я охуела.\nА: Вы злитесь? Это у вас контрперенос?\nБ: Это моя кухня.","caption":"Чай остывает, переписка листается. Где-то между «вам еще печеньку?» и «а что он этим хотел сказать?» встреча получила новую профессию.\nЯ Ольга, психолог, работаю с девушками и женщинами от 22 до 40.\nЕсли хотите на консультацию, пишите в директ слово «разбор».","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_malysh_1","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"Текст на экране: Колокольчик, который боится слова «нет»\nРечь: Вам страшно сказать «нет», хорошие мои, аж животик сжимается?\n\nВнутри у вас колокольчик. Только кто-то недоволен, он звенит: «СРОЧНО сделайте человеку хорошо!»\n\nВы привыкли отвечать за чужое настроение. Кто-то расстроился, вам надо что-то сделать, чтобы он снова был довольный. Тогда колокольчик замолкает.\n\nВот подруга просит приехать. Вы уже в пижамке, сил нет. Говорите: «Сегодня не смогу». Она: «Ну понятно».\n\nДзынь. Блядь, уже снимаем пижамку.\n\nМожно дать колокольчику позвенеть. Пусть подруга побудет недовольной вашим ответом.\n\nЕе недовольство не обязывает вас соглашаться.","caption":"Иногда после отказа вы отправляете еще пять сообщений с объяснениями, хотя вас уже ни о чем не спрашивают. И ждете заветное «да все нормально», чтобы наконец выдохнуть.\nЯ Ольга, психолог для женщин, которые устали быть удобными.\nОтправьте той, которая даже отказ старается сделать приятным.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ьчик. Только кто-то недоволен, он звенит: «СРОЧНО сделайте человеку хорошо!» | ать. Вы уже в пижамке, сил нет. Говорите:"}],"cut":["Заметьте, подруга даже ничего больше не попросила.","Вы сами услышали в ее недовольстве новое задание.","И побежали выполнять."],"before":null},{"id":"r_malysh_1_2","author":"Ольга","format":"reels_malysh","asked":"reels_malysh","intent":"mehanizm","topic":"почему так страшно сказать «нет»","text":"Текст на экране: Стульчик для девочки, которая всегда соглашается\nРечь: Милая, вам страшно сказать «нет», потому что вдруг с вами перестанут дружить?\n\nПредставьте стульчик за общим столом. Если раньше вас принимали, пока вы соглашались, вы привыкли: чтобы стульчик оставался вашим, надо говорить «да». Возражаете? Ой, сейчас заберут.\n\nИ вот подруга просит помочь с переездом в субботу. А вы хотели полежать. Просто полежать, девочки, ножки вытянуть. Но уже отвечаете: «Конечно, приеду». Блядь, опять без выходного.\n\nМожно оставить себе стульчик, даже когда подруга недовольна. Сказать: «В субботу я не смогу». И остаться сидеть.","caption":"Десять причин отказа дают собеседнику десять возможностей предложить, как вам все-таки согласиться.\nЯ Ольга, психолог, работаю с женщинами, которые устали быть удобными.\nПодписывайтесь, если хочется еще такого: здесь говорим об отношениях, в которых вашим желаниям тоже есть место.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"нимали, пока вы соглашались, вы привыкли: чтобы стульчик оставался вашим, надо го | евочки, ножки вытянуть. Но уже отвеч"}],"cut":["В голове все еще склеены две вещи: «я отказала в помощи» и «меня больше не хотят видеть»."],"before":null},{"id":"r_malysh_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"Текст на экране: Про обиду на маму, которую стыдно признать\nРечь: Милая, тебе обидно на маму, и ты себя за это ругаешь. Она столько для тебя сделала. Как же ты теперь на нее обижаешься, да?\n\nПредставь, что у тебя в пальчике заноза. Ты говоришь: «Ой, больно». А мама отвечает: «Я тебе эти варежки всю ночь вязала». И ты уже прячешь пальчик. Варежки хорошие. Мама старалась.\n\nВот и с обидой так. Вспоминаешь мамины старания и сразу замолкаешь. Даже внутри себя. Как будто сначала надо доказать, что мама совсем ничего хорошего тебе не дала. Тогда разрешат сказать, что больно.\n\nТы имеешь право обижаться на маму.","caption":"Иногда после маминого звонка хочется плакать, хотя весь разговор ты отвечала: «Да, мам, все хорошо». Признаться себе в этом бывает труднее, чем рассказать подруге.\nЯ Юлия, психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли хочется, напиши в комментариях одно слово: «обидно».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"то у тебя в пальчике заноза. Ты говоришь: «Ой, больно». А мама отвечает | : «Я тебе эти варежки всю ночь вязала». И | пл"}],"cut":["Получается, про занозу говорить стыдно.","Маленькая, обиду можно признать вместе со всем хорошим, что было."],"before":null},{"id":"r_malysh_2_2","author":"Юлия","format":"reels_malysh","asked":"reels_malysh","intent":"podderzhka","topic":"обида на маму, которую стыдно признать","text":"Текст на экране: Обида, за которую стыдно\nРечь: Милая, ты обижаешься на маму и сразу себя ругаешь: «Она столько для меня сделала, как я могу?»\n\nСмотри, у тебя в пальчике заноза. Ты говоришь: «Больно». А тебе отвечают: «Мама устала. Маме тоже тяжело». И ты такая: ой, тогда ладно. Только заноза осталась.\n\nТы выросла и теперь сама себе объясняешь, почему мама тогда так поступила. Она была одна. Она много работала. Она переживала. И ждешь, что теперь обида пройдет.\n\nНо той маленькой тебе тоже было больно. Она еще ничего про мамины трудности не знала. Она ждала, что мама пожалеет.\n\nМожно пожалеть ее сейчас. Без этого твоего «сама виновата».\n\nТы можешь понимать маму и все еще обижаться на нее.","caption":"Иногда даже мысленно сказать «мама меня обидела» страшно, будто она услышит. И ты снова подбираешь слова помягче.\nМеня зовут Юлия, я психолог, работаю со взрослыми дочерьми от 25 до 40 лет.\nЕсли хочется поговорить об этом, ссылка на запись на консультацию в шапке профиля.","judge":null,"guard":[{"rule":"rublenye","quote":"Она была одна. Она много работала. Она переживала."},{"rule":"dvoetochiya","quote":"обижаешься на маму и сразу себя ругаешь: «Она столько для меня сделала, как я мо | и, у тебя в пальчике заноза. Ты говор"}],"cut":["Ты уже все про нее поняла."],"before":null},{"id":"r_drug_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Текст на экране: У друзей все хорошо, и меня забыли\nРечь: «Когда у друга все хорошо, он пропадает. Как что случилось, сразу пишет мне».\n\nВот вечером прилетает голосовое: «Мы расстались». Вы сорок минут слушаете, потом еще спрашиваете, как он спал. Через неделю они помирились. Вы зовете его выпить кофе. «Да, надо как-нибудь». И тишина до следующей ссоры.\n\nОбидно еще и потому, что вчера вы чувствовали себя очень близкими. Он столько вам рассказал. Но откровенность легко принять за близость: вы знаете все, что у человека болит, и почти ничего о том, чем он живет, когда ему хорошо.\n\nИ вот вопрос: если у него все наладится, останется ли вам место в его жизни?","caption":"Иногда даже о примирении узнаешь из сторис. Хотя весь вечер после ссоры провели вместе в переписке.\nЯ Михаил, психолог, работаю с людьми от 25 до 40 лет.\nСохраните, если хочется вернуться к этому вопросу.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Вот вечером прилетает голосовое: «Мы расстались». Вы сорок минут слушает | откровенность легко принять за близость: вы з"}],"cut":[],"before":null},{"id":"r_drug_1_2","author":"Михаил","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"друзья пропадают, когда у них все хорошо, и появляются, когда плохо","text":"Текст на экране: Друзья вспоминают о вас, когда им плохо\nРечь: Четыре признака, что вы привыкли дружить с теми, кто пропадает, когда у них все хорошо.\nПервое. Вы радуетесь даже тревожному сообщению. «Можно позвонить? Все ужасно». Наконец появился. Что случилось, вы узнаете потом.\nВторое. Ради такого звонка вы отменяете свои планы. Ужин остынет, сериал подождет. Сейчас вы нужны, такое нельзя упустить.\nТретье. О своих трудностях говорить неловко. Уже набрали «у меня тоже тяжелый день» и стерли. У человека же проблемы, куда еще со своими.\nЧетвертое. От его хороших новостей вам становится грустно. Помирились, работу нашли, жизнь наладилась. Вы уже знаете, что дальше.\nПолучается, вы ждете следующего кризиса, чтобы снова побыть друзьями.","caption":"После двух часов разговора иногда выясняется, что вас даже не спросили, как вы. И все равно приятно, что позвонили.\nЯ Михаил, психолог, работаю с людьми от 25 до 40 лет.\nПодписывайтесь, если хочется еще такого: здесь говорим об отношениях и о том, что в них трудно заметить.","judge":null,"guard":[],"cut":[],"before":null},{"id":"r_mama_1","author":"Ольга","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Текст на экране: Злюсь на ребенка, потом ненавижу себя\nРечь: Четыре признака мамы, которая после злости на ребенка начинает себя наказывать.\nПервое. Вам стыдно просить помощи. Только что рявкнули, теперь сами укладывайте. Еще и отдыхать собрались? Какого хрена.\nВторое. Вы стараетесь срочно стать идеальной. Уже сил нет, но достаете краски: надо же перекрыть тот крик чем-нибудь хорошим.\nТретье. Вы молчите, когда обидно. Муж весь вечер в телефоне, а вы даже сказать боитесь. Сама сегодня орала, какие теперь претензии.\nЧетвертое. Вас бесит собственная усталость. Ребенок наконец уснул, вы легли и тут же: «Бедный малыш, еще и мать такая».\nСколько времени после крика вы еще живете без права на помощь?","caption":"Иногда даже рассказать мужу о тяжелом дне страшно: вдруг спросит, опять ли вы кричали. И весь разговор сведется к этому.\nМеня зовут Ольга, я психолог, работаю с мамами детей до трех лет, в декрете.\nЕсли хочется, добавьте в комментариях свой пункт.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"еальной. Уже сил нет, но достаете краски: надо же перекрыть тот крик чем-нибудь х | Ребенок наконец уснул, вы легли и ту"}],"cut":["После своей злости вам будто НЕЛЬЗЯ жаловаться вообще ни на что."],"before":null},{"id":"r_mama_1_2","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"я злюсь на ребенка, а потом ненавижу себя за это","text":"Текст на экране: Накричала и жду, когда он обнимет\nРечь: «Я злюсь на ребенка, а потом ненавижу себя за это».\n\nВот он размазал йогурт по дивану. Вы рявкнули. Блядь, опять. Сели рядом, извинились, обняли. А внутри все еще: «Ну какая же я ужасная мать».\n\nИ вы начинаете: «Ты любишь маму? Иди ко мне. Ну обними».\n\nРебенок уже машинку катает, а вам нужна его улыбка. СРОЧНО. Потому что с ней можно наконец выдохнуть: он меня любит, значит, я еще хорошая.\n\nВ какой-то момент вы начинаете ждать, что ребенок успокоит вас после вашего же крика.\n\nА если он пока сердится на вас?","caption":"После извинения очень хочется сразу услышать: «Все хорошо». У малыша может еще дрожать губа, даже когда вы уже готовы обниматься.\n\nЯ Ольга, психолог, работаю с мамами малышей до трех лет.\nЕсли хотите поговорить на консультации, пишите в директ слово «разбор».","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ом, извинились, обняли. А внутри все еще: «Ну какая же я ужасная мать». | И вы начинаете: «Ты любишь маму? Иди ко мне. Н"}],"cut":["Вот тут я бы задержалась.","Ему приходится подтверждать, что с мамой все хорошо."],"before":null},{"id":"r_stud_1","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: Диплом горит, я опять ничего не делаю\n\nРечь: «До сдачи диплома неделя, почему я опять не могу сесть и написать хоть страницу?»\n\nОткрываешь ноутбук, меняешь шрифт на титульном листе. Ну вот, уже полчаса дипломом занимаешься. Сам текст страшно трогать.\n\nПока ты ничего толком не написала, можно думать: я вообще способная, просто времени мало. А если постараешься, напишешь и получится средне? Вдруг решишь, что это и есть все, на что ты способна?\n\nПусть пока будет пустая страница. Зато еще можно представить, какой прекрасной она получится.\n\nКакую оценку себе ты боишься получить вместе с оценкой диплома?","caption":"Особенно тяжело, когда раньше учеба давалась легко. Сесть над трудной задачей бывает почти стыдно: как будто способная студентка должна сразу знать, что писать.\n\nЯ Юлия, психолог, работаю со студентами от 18 до 23 лет.\nОтправь тому, у кого тоже горит диплом.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ничего толком не написала, можно думать: я вообще способная, просто времени мало | над трудной задачей бывает почти стыд"}],"cut":["Тут уже страшнее.","Так можно откладывать работу, чтобы сохранить хорошее мнение о себе."],"before":null},{"id":"r_stud_1_2","author":"Юлия","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"не могу сесть за диплом, хотя времени почти нет","text":"Текст на экране: «Не могу сесть за диплом»\nПерсонажи: А это я, Б это психолог\nА: Не могу сесть за диплом, времени почти нет.\nБ: Что мешает начать?\nА: Вдруг напишу ерунду? Я же должна в этом разбираться.\nБ: И если ерунду?\nА: Значит, зря училась. Все поймут, что я ничего не умею.\nБ: Прямо по черновику?\nА: Ну да. Хотя черновик никто пока не увидит.\nБ: Ты его увидишь.\nА: Да. Пока ничего нет, я еще могу написать хорошо.\nБ: Можно оставаться способной.\nА: Ага. Просто способной, которая никак не соберется. Знакомая история.\nБ: Так меньше страшно?\nА: Получается, я откладываю момент, когда сама себя назову тупой.\nБ: Да.","caption":"Можно полвечера выбирать шрифт для титульного листа: диплом открыт, работа вроде идет. До собственных мыслей на странице так и не дошла.\nЯ Юлия, психолог, работаю со студентами.\nПодписывайся, если хочется еще такого: здесь про учебу, тревогу и отношения.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"чера выбирать шрифт для титульного листа: диплом открыт, работа вроде идет. До со | Подписывайся, если хочется еще таког"}],"cut":[],"before":null},{"id":"r_gnezdo_1","author":"Михаил","format":"reels_poslanie","asked":"reels_auto","intent":"podderzhka","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","text":"Текст на экране: Тем, чьи дети выросли и уехали\nРечь: Это для тех, у кого дети выросли и уехали, а утром появилась мысль: «И зачем теперь вставать?» Вы ведь ждали, когда можно будет выспаться, спокойно выпить чай. И вот тишина. Даже чай какой-то невкусный. Потом еще себя ругаете: дети устроились, все нормально, чего мне опять надо? Давайте так, годами у вашего утра был готовый ответ: кого разбудить, накормить, куда проводить. Вы открывали глаза и уже знали, зачем встаете. Теперь этот ответ исчез. А вопрос о себе остался, и с непривычки на него трудно ответить.","caption":"Иногда особенно больно от их «У нас все хорошо»: можно выдохнуть, а привычного разговора о том, чем помочь, уже нет. И вы еще держите телефон в руке.\nМеня зовут Михаил, я психолог, работаю с людьми от 45 до 60 лет.\nЕсли хочется, напишите в комментариях, чего вам сейчас не хватает.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ыросли и уехали, а утром появилась мысль: «И зачем теперь вставать?» Вы ведь ждал | кой-то невкусный. Потом еще себя руг"}],"cut":["Можно радоваться, что у детей своя жизнь, и чувствовать себя потерянно в своей.","Вам тоже есть по чему скучать."],"before":null},{"id":"r_gnezdo_1_2","author":"Михаил","format":"reels_malysh","asked":"reels_auto","intent":"podderzhka","topic":"дети выросли и уехали, а я не знаю, зачем теперь вставать утром","text":"Текст на экране: Дети уехали. А утром зачем вставать?\nРечь: Дорогие мои, дети выросли и уехали, а вы утром лежите и думаете: зачем вставать? И еще ругаете себя: ну что я совсем раскис.\n\nПредставьте календарик. Много лет в каждой клеточке было понятно: ребенка разбудить, накормить, вечером дождаться. Даже когда уставали, было ясно, для чего начинается день.\n\nА теперь клеточки пустые. И от этой пустоты бывает страшно. Получается, вы скучаете еще и по тому, как легко находился ответ на вопрос: что мне сегодня делать?\n\nСвои желания столько лет вписывали куда поместятся. Теперь для них целый день. Сразу и не сообразишь, чего хочется.","caption":"Даже долгожданная тишина в доме может оказаться тяжелой. Можно радоваться самостоятельности детей и хотеть, чтобы они еще немного пожили рядом.\nЯ Михаил, психолог, работаю с женщинами и мужчинами от 45 до 60 лет.\nПодписывайтесь, если хочется еще таких разговоров.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ли и уехали, а вы утром лежите и думаете: зачем вставать? И еще ругаете себя | : ну что я совсем раскис. | Много лет в к"}],"cut":["Можно пока этого не знать.","Вы вправе скучать по своей прежней жизни."],"before":null},{"id":"r_razvod_1","author":"Ольга","format":"reels_rol","asked":"reels_auto","intent":"mif","topic":"«ради детей надо сохранить семью»","text":"Текст на экране: Инструктаж: сохраняем семью ради детей\nРечь: Ради детей сохраняем семью, даже если дома все друг друга ненавидят. Я подготовила инструкцию. Ругаетесь на кухне? Закрывайте дверь. Ребенок все слышит? Включайте ему мультики погромче. Спрашивает, почему папа обзывает маму? Объясните: папа устал. Вы тоже устали? Ну вы же взрослая, потерпите. Блядь, у нас тут сохранение семьи, соберитесь. Так, ребенок просит вас развестись. Это он маленький, ничего не понимает. Обязательно скажите, что живете вместе ради НЕГО. Пусть знает, сколько стоит его счастливое детство. Итак, мама терпит, папа продолжает, ребенок чувствует себя виноватым. Все на месте. Семья сохранена.","caption":"«Я ради тебя осталась» ребенку потом тоже придется как-то переварить. Даже если вы сказали это всего один раз.\nЯ Ольга, психолог, работаю с женщинами 30-45, которые думают о разводе или уже развелись.\nОтправьте той, кому сейчас нужно это услышать.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"Инструктаж: сохраняем семью ради детей | ет, почему папа обзывает маму? Объясните: папа устал. Вы тоже устали? Ну вы же "}],"cut":[],"before":null},{"id":"r_razvod_1_2","author":"Ольга","format":"reels_monolog","asked":"reels_auto","intent":"mif","topic":"«ради детей надо сохранить семью»","text":"Текст на экране: Я терплю мужа ради детей\nРечь: «Ради детей надо сохранить семью», слышите вы, когда говорите о разводе. Любой ценой? Блядь, ребенку уже выставили счет.\n\nВот вы остались. Муж опять вас унизил, вы промолчали. Вечером он играет с сыном, сын хохочет. И вы думаете: «Ну вот, ради этого и терплю».\n\nА завтра сын грустит, огрызается. И хочется сказать: «Я ради тебя столько вынесла, а ты...»\n\nСлышите? Ему уже надо быть счастливым, чтобы ваши мучения имели смысл.\n\nРешение о браке принимаете вы, взрослые. А ребенок теперь еще и ОБЯЗАН показать, что оно того стоило?","caption":"«Я с твоим отцом только ради тебя» может вылететь в ссоре. И ребенок потом боится сказать, что ему дома тоже плохо.\nЯ Ольга, психолог, работаю с женщинами, которые думают о разводе или уже развелись.\nПодписывайтесь, если хочется еще таких разговоров о разводе, детях и чувстве вины.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"грает с сыном, сын хохочет. И вы думаете: «Ну вот, ради этого и терплю». | н грустит, огрызается. И хочется сказать: «Я "}],"cut":["Даже погрустить спокойно трудно: мама же ради него осталась."],"before":null},{"id":"r_pereezd_1","author":"Юлия","format":"reels_spisok","asked":"reels_auto","intent":"uznavanie","topic":"переехала в другой город и за год ни с кем не подружилась","text":"Текст на экране: Год в новом городе, друзей нет\nРечь: Четыре признака у тех, кто за год после переезда так и не нашел друзей.\nПервое. Ты готовишься к обычной встрече как к собеседованию. Даже историю про выходные выбираешь: эта скучная, тут я выгляжу глупо. Давайте так, с тобой кофе пьют. Тебя сейчас никто на работу не принимает.\nВторое. Тебе трудно предложить просто погулять. Надо найти выставку, классное место, еще что-нибудь. Иначе зачем человеку тратить на тебя вечер?\nТретье. Ты скрываешь мелкие трудности. Коллеге говоришь, что уже освоилась, хотя вчера расплакалась в автобусе. Хочется сначала стать человеком, с которым легко.\nЧетвертое. Когда встречу отменяют, тебе даже легче. Фух, сегодня можно никого не впечатлять.","caption":"Дружба часто начинается с разговора, в котором ты ничего интересного не сказала.\nЯ Юлия, психолог, работаю с людьми от 25 до 35, которые переехали.\nЕсли узнала себя, напиши свой пункт в комментариях.","judge":null,"guard":[],"cut":["Иногда именно такие встречи труднее всего себе позволить."],"before":null},{"id":"r_pereezd_1_2","author":"Юлия","format":"reels_monolog","asked":"reels_auto","intent":"uznavanie","topic":"переехала в другой город и за год ни с кем не подружилась","text":"Текст на экране: Год в новом городе, подруг нет\nРечь: «Я год живу в новом городе и ни с кем не подружилась». А знакомиться ты пробовала. Вот с коллегой сходили на кофе, посмеялись. На следующий день она сама тебе ничего не написала. И ты уже думаешь: ну понятно, ей со мной было скучно. Второй раз звать как-то унизительно, да?\n\nТы приходишь знакомиться и сразу проверяешь, нужна ли ты. Написала первой? Почему опять я? Не позвали на выходных? Все, я лишняя.\n\nИ ты отходишь. Вы еще только кофе выпили, а ты уже пережила конец дружбы.","caption":"Особенно обидно, когда дома были люди, которым можно было написать просто «пойдем?». Здесь даже приглашение на кофе сочиняешь полчаса.\nЯ Юлия, психолог, работаю с теми, кто в 25-35 переехал и привыкает к новой жизни.\nЕсли хочется об этом поговорить, ссылка на запись на консультацию в шапке профиля.","judge":null,"guard":[],"cut":["Тебе так хочется наконец стать своей, что обычное «мы пока мало знакомы» уже звучит как «ты нам не нужна»."],"before":null},{"id":"r_dengi_1","author":"Михаил","format":"reels_monolog","asked":"reels_auto","intent":"mehanizm","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","text":"Текст на экране: Зарабатываю нормально, а денег все время мало\nРечь: «Зарабатываю нормально, но все время боюсь, что денег не хватит».\n\nЗарплата пришла, счета оплачены, на накопления отложили. Садитесь вечером, открываете приложение банка и опять считаете: а если уволят? А если машина сломается?\n\nИ вроде все сходится. Можно выдохнуть. Но вы уже думаете: расслаблюсь, перестану шевелиться, вот тогда точно останусь без денег.\n\nБоялся, работал, деньги пришли. Значит, страх помог. Ну как его теперь отпустить, если вы ему каждый месяц приписываете свои результаты?\n\nВы сами работали, договаривались, решали задачи. А в конце месяца внутри опять: «Хорошо, что я переживал. Иначе бы ничего этого не было».","caption":"Даже отпуск тогда приходится оправдывать: «Отдохну, чтобы потом лучше работать».\nЯ Михаил, психолог, работаю с мужчинами от 30 до 45 лет.\nОтправьте тому, кто даже после зарплаты переживает о деньгах.","judge":null,"guard":[{"rule":"dvoetochiya","quote":"ываете приложение банка и опять считаете: а если уволят? А если машина сломается? | ится. Можно выдохнуть. Но вы уже дум"}],"cut":["Получается, тревогу вы считаете условием своего заработка.","Просто отдохнуть уже кажется финансовым риском."],"before":null},{"id":"r_dengi_1_2","author":"Михаил","format":"reels_scenka","asked":"reels_auto","intent":"mehanizm","topic":"зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит","text":"Текст на экране: «Деньги есть, а мне все равно страшно»\nПерсонажи: А это я, Б это психолог\nА: Зарабатываю нормально, но постоянно боюсь, что денег не хватит.\nБ: Что делаете, когда страшно?\nА: Открываю приложение банка. Проверяю, сколько осталось.\nБ: И отпускает?\nА: Да. Потом опять лезу проверять. Деньги ведь на месте.\nБ: А спокойствие уже кончилось.\nА: Ну и что плохого? Я же просто проверяю.\nБ: Вы привыкаете успокаиваться только проверкой.\nА: Получается, без приложения я уже себе не верю?\nБ: Вам снова нужно подтверждение.\nА: Деньги лежат. А я опять иду убеждаться, что выживу.\nБ: Именно.","caption":"Телефон всегда под рукой, поэтому проверка легко помещается между двумя рабочими сообщениями. Со стороны ее вообще никто не замечает.\nМеня зовут Михаил, я психолог, работаю с мужчинами от тридцати до сорока пяти.\nПодписывайтесь, если хочется еще таких разговоров: здесь про тревогу, деньги и отношения.","judge":null,"guard":[],"cut":[],"before":null}];const KEY='eval-2026-10-02_04-46-34_rilsy_ob_h3h4';

c.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>{R[d.id]={...(R[d.id]||{}),mark:b.dataset.m};save();render()});

m.appendChild(c)});document.getElementById('cnt').textContent=n+' шт.'}
