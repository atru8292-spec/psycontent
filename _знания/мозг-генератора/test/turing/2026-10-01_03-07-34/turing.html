<main id="m"><p class="n">Читай как подписчик в ленте. Отмечай чутьем, не разбирай по словам. Половина текстов от живых психологов, половина от нейросети.</p></main>
<script>
const D=[{"id":"olga_prokopova_s#1","k":"live","t":"Тут, девочки, пару дней назад я прочитала в новостях инициативу о том, чтобы принять у нас закон против домашнего насилия.\n\nМеня это удивило, ибо я почему-то была уверена, что у нас этот закон есть. Не знаю откуда такая уверенность,  наверное от здравого смысла.\nИ тут сегодня вижу другую новость. И в этой новости прекрасно (нет) всё. Следим за текстом:\n\"Председатель комитета Госдумы по защите семьи Нина Останина...\" - Мисс государственная заботушка о семье\n\"...заявила, что запрет домашнего насилия заставит россиян отказаться от вступления в брак.«Парни будут бояться» «импульсивных» заявлений в полицию от женщин и откажутся от брака\"\nЧего бл%ть? Прям вот заявила?\nНу давайте попробуем прочитать это с позиции здравого смысла, я думаю это звучит примерно так:\nОстанина: \"Вы что а&уели запрещать домашнее насилие? Ведь мужчины ради этого женятся,  а без этого не будут\"\nСюр!\n\n\n\nУ меня тоже есть заявление:\nА давайте перестанем в государственных масштабах считать мужчин пугливыми ланями, которые боятся женщин,  и одновременно козлами с поносом, которые ну никак не могут сдерживаться в своих порывах! Может тогда и они (мужчины) перестанут приписывать себе это поведение как нормальное, а?!","s":"живой пост, канал olga_prokopova_s"},{"id":"psikhologd#1","k":"live","t":"Взросление: Примирение через любовь\nВ финале «Бао» мать и взрослый сын вместе готовят пельмени. Это продолжения, нового этапа их отношений. Взросление не означает разрыва, а сепарация — не конец любви. Это переход к новому типу связи, где есть место и близости, и свободе. Мать учится принимать сына как взрослого, а сын ценит её любовь, возвращаясь, чтобы разделить с ней простые радости.\nПсихоанализ учит нас, что взросление — это всегда баланс между зависимостью и автономией. Если в детстве ребёнок получил достаточно тепла и поддержки, он может смело шагнуть в мир, зная, что у него есть надёжный тыл. Для матери этот процесс требует мужества: отпустить — значит довериться, что любовь не исчезнет, даже если ребёнок уходит.\nСлова поддержки для Вас\nЕсли вы, как мать из «Бао», боитесь отпустить своего ребёнка, помните: ваша любовь — это фундамент, который навсегда останется с ним. Отпуская, вы не теряете, а даёте ему крылья, зная, что он вернётся, потому что вы научили его ценить дом. Если вы — сын или дочь, стремящиеся к самостоятельности, не бойтесь идти вперёд. Ваше взросление — не предательство, а дар, который вы возвращаете миру, оставаясь связанными с теми, кто вас вырастил. Любовь не исчезает, она трансформируется, становясь глубже и свободнее.","s":"живой пост, канал psikhologd"},{"id":"labkovskiy#1","k":"live","t":"Всем плевать.\n«А можно я брошу работу?..»\n«Хочу быть домохозяйкой, это ужасно?..»\n«МИХАИЛ, А Я НОРМАЛЬНЫЙ?»\nДрузья мои, каждый день я получаю от вас десятки писем в Директ о том, что вы прямо точно «неправильные». «Со мной что-то не так» буквально звучит в каждом сообщении.\nЯ хочу открыть вам одну маленькую тайну.\nВСЕМ ПЛЕВАТЬ.\nПсихолог не знает, как вам «правильно жить», ведь такому на психфаке вообще не учат. Он без понятия, можно ли конкретно в вашем случае бросить вуз или нельзя, да и не ему это решать.\nЧто касается остальных, особенно тех, кто лезет с советами, своим ценным мнением и рекомендациями. Вы не поверите, но на самом деле им пофиг.\nРаботаете ли, за сколько вы снимаете квартиру и почему путешествуете, а не покупаете дачу.\nВсем по барабану, у людей своих задач полно. Единственное исключение — это родители. Им может и не плевать, но, по большому счёту, их вопросы и реакция — обычная тревожность.\nНапример, на месте «когда замуж» легко могло бы стоять «почему ты ешь так мало белка».\nДрузья мои, не надо класть себя в прокрустово ложе и пытаться свериться с миром, который якобы диктует вам правила жизни. Никто не диктует. Это вы так низко себя ставите, что вам какой угодно дегенерат из соцсетей может напеть, что ваше главное предназначение в жизни — жить на Бали и заниматься йогой.\nИ ему кстати тоже будет плевать, не поверите.\nДрузья, у нас полный sold-out вип-билетов на встречу в Москве 15-го июля.\nДобавили ещё немного доп. мест. Если вы тоже хотите встретиться со мной после лекции и в камерной атмосфере посидеть и пообщаться:\nдополнительные вип-билеты","s":"живой пост, канал labkovskiy"},{"id":"s41","k":"live","t":"Пять признаков, что человек прошел в жизни настоящий ад. Первый. Ему неловко, когда о нем искренне заботятся или делают комплименты. Забота для него что-то непривычное, с подвохом: я теперь что-то должен. Второй. Ему физически больно просить о помощи. Он лучше умрет. Третий. Он считывает настроение людей за полсекунды. По голосу, по тому, как человек моргает, как открывает дверь. Четвертый. Он не умеет отдыхать без чувства вины. Если ничего не делает, кажется, что сейчас кто-то придет и накажет за безделье. И пятый. Когда в жизни все хорошо, ему жутко тревожно. Мозг привык, что тишина бывает перед настоящим лютым пиздецом. Сколько пунктов насчитали у себя?","s":"живой ролик s41"},{"id":"2026-10-01_03-06-36_rilsy_krug2/r_zlost_1","k":"gen","t":"«Я вообще никогда не злюсь»\n\nЭто когда подруга опаздывает на сорок минут, а ты встречаешь ее словами: «Да ничего, я пока погуляла». Хотя ты замерзла и уже трижды хотела уйти.\n\n«Ну что ты из-за такой ерунды?» И ты сама себе это говоришь. Подумаешь, подождала. Теперь еще надо улыбаться, чтобы встречу не испортить.\n\nЭто когда коллега снова просит доделать за нее работу. Ты собиралась домой, но уже отвечаешь: «Ладно, присылай».\n\n«Ты же у нас добрая, всегда выручаешь». И как теперь отказать? Сидишь перед чужой таблицей и злишься на себя: зачем согласилась, сколько можно?\n\nЭто когда ты наконец говоришь близкому человеку, что тебе было обидно. Он перебивает: «Тебе вообще ничего сказать нельзя». И вот ты уже объясняешь, что сказать можно, что ты нормально относишься к шуткам. Даже вспоминаешь, над чем недавно смеялась. Обиду обсудить так и не успели.\n\nТы говоришь, что никогда не злишься, потому что каждый раз находишь причину, почему злиться нельзя. Мелочь же. Человеку помощь нужна. Он ничего плохого не имел в виду.\n\nМеня вот что здесь возмущает: тебе уже больно или ты уже устала, а ты все еще ждешь, чтобы другой согласился, что у тебя есть повод. Иначе чувствуешь себя придирчивой, злой, неблагодарной.\n\nНо человек может искренне считать, что сорок минут ничего не решают. Может очень нуждаться в твоей помощи. Может правда хотеть пошутить. Злость от этого никуда не девается, и тебе приходится прятать ее даже от себя.\n\nТы можешь злиться, даже если другой так и не понял, что тебя задело.","s":"Юлия, «я вообще никогда не злюсь»"},{"id":"2026-10-01_03-06-36_rilsy_krug2/r_car_1","k":"gen","t":"Слайд 1: Подруга извиняется, когда вы ей помогаете?\n\nСлайд 2: Вы привезли подруге продукты, потому что у нее депрессия и сходить в магазин сейчас тяжело. А она стоит у двери: «Прости, что тебе пришлось ехать».\n\nЕй стыдно, что вы потратили на нее время. Теперь она переживает еще и за вас.\n\nСлайд 3: У помощи может появиться условие, которое никто вслух не ставил: «Раз ради меня стараются, я должна хоть немного повеселеть».\n\nЭто вина за чужую заботу. Подруга начинает следить за вашей реакцией: вы расстроились? Устали от нее? Уже жалеете, что приехали?\n\nСлайд 4: Подруга говорит: «Да, мне уже лучше», хотя ей по-прежнему хр*ново.\n\nОсобенно когда вы с надеждой спрашиваете, помогла ли прогулка. Очень хочется вас порадовать. И сказать, что после всех ваших стараний ничего особо не изменилось, бывает ужасно неловко.\n\nСлайд 5: Подруга отказывается от вашей компании: «Давай потом, я сейчас никакая».\n\nОна может заранее представлять, как придется поддерживать разговор, предлагать чай, искать чистые чашки. Даже с любимой подругой трудно встречаться, если кажется, что гостью обязательно надо развлечь. Ну правда, еще и это сейчас?\n\nСлайд 6: Вы говорите: «Я так за тебя переживаю», и подруга тут же начинает вас успокаивать: «Да все нормально, справлюсь».\n\nВы говорите это из любви. Но если она привыкла заботиться о чужих чувствах, ей трудно просто принять ваше сочувствие. Она уже волнуется, как бы вы из-за нее не расстроились.\n\nСлайд 7: Помогайте конкретно и по договоренности, без проверки, стало ли подруге веселее после вашей помощи.\n\nПродукты пригодились, даже если вечером она снова плакала. Ей не нужно изображать улучшение, чтобы вы понимали, что приехали не зря.","s":"Ольга, как поддержать подругу с депрессией и не сделать хуже"},{"id":"dnevnik_psihologa#1","k":"live","t":"Родная страна — не просто точка на карте. Это\nконтейнер\n: язык, коды, ощущение «я свой/своя».\nИ когда человек уезжает, он теряет прежде всего этот контейнер. В этот момент активируется та же система привязанности, что и в отношениях с матерью.\nМы часто говорим: мама и деньги, мама и стыд, мама и отношения. Но задумывались ли вы, что отношения с матерью влияют и на проживание эмиграции?\nПочему в одной стране одни чувствуют возможности, а другие — холод и отвержение? Потому что эмиграция — это\nвторичная сепарация:\nона либо повторяет ранний сценарий, либо даёт шанс его завершить.\nЕсли ранняя сепарация была\nподдержана\n— человек может горевать и адаптироваться. Если\nтравматичной\n— новая страна бессознательно переживается как материнский объект: «меня не принимают» или «я должна заслужить право быть здесь».\n3 марта\nна\nбесплатном\nвебинаре Анна расскажет, как материнская фигура влияет на взрослую жизнь и как это видеть в терапии.\nТакже — подробнее о специализации, стартующей в апреле.\n\nРегистрация","s":"живой пост, канал dnevnik_psihologa"},{"id":"2026-10-01_03-06-36_rilsy_krug2/r_money_1","k":"gen","t":"Снова взяли чужую задачу, а про прибавку решили поговорить «потом, когда будет удобный момент».\n\nВ голове уже есть доводы. Вы знаете, сколько всего делаете. Но хочется, чтобы руководитель САМ сказал: «Ты столько работаешь, давай пересмотрим зарплату».\n\nПотому что тогда он правда вас ценит. А если пришлось попросить, сразу мысль: «Ну вот, выпросила».\n\nВам важно, чтобы ваши старания заметили без подсказки. Просить стыдно, потому что это ощущается как выпрашивать похвалу: «Посмотрите, какая я хорошая». Хотя разговор вообще-то про деньги.\n\nИ вы берете еще одну задачу. Задерживаетесь вечером. Подхватываете то, что коллега не успела. «Уж теперь он точно видит, сколько на мне».\n\nБл*дь, сколько еще надо сделать, чтобы этот разговор наконец начал кто-нибудь другой?\n\nРуководитель видит, что задачи закрываются. Зарплату вы не обсуждаете. Он вполне может считать, что вас все устраивает.\n\nА вы уже злитесь: «Как можно этого не замечать?» И продолжаете работать еще больше, чтобы наконец заметили.\n\nПросьба о прибавке не обязывает его согласиться. Но вы хотя бы перестанете молча ждать, что он догадается. Он ведь может так и не догадаться.","s":"Ольга, стыдно просить повышение, хотя работаю больше всех"},{"id":"2026-10-01_03-06-36_rilsy_krug2/r_men_1","k":"gen","t":"Четыре признака отца, который весь день терпит, а дома взрывается из-за мелочи.\nПервое. На работе вы проглатываете обиду. Начальник отчитал при всех, вы молчите: «Ладно, проехали». Вечером все еще прокручиваете его слова.\nВторое. На вопрос «Что случилось?» отвечаете: «Ничего». Рассказывать тяжело, еще голос дрогнет. Только этого не хватало.\nТретье. Дома вас раздражает буквально каждый звук. Ребенок зовет посмотреть рисунок, а у вас уже сжаты зубы: «Можно хоть пять минут тишины?»\nЧетвертое. Особенно злит, когда ребенок плачет из-за пустяка. В голове: «Я же терплю. И ты потерпишь». Стоп. Он вообще откуда должен знать, сколько вы сегодня вытерпели?\nВы устали терпеть, и ребенок тут ни при чем.","s":"Михаил, мужчины не плачут, а потом срываются на детей"},{"id":"2026-10-01_03-06-36_rilsy_krug2/r_mif_2","k":"gen","t":"«Хватит себя накручивать» может сделать тебе еще тревожнее.\n\nПотому что теперь ты пугаешься и того, что случилось, и собственной реакции. «Почему я опять об этом думаю? Что со мной не так?» К прежней тревоге добавляется вина: вроде сама виновата, могла бы уже успокоиться.\n\nКогда ты требуешь от себя перестать тревожиться, приходится постоянно проверять: «Ну что, прошло?» И снова возвращаться к тому, что тебя напугало.\n\nВот он прочитал сообщение и ничего не ответил. Ты подумала: «Обиделся?» Потом одернула себя: «Так, хватит. Он занят». Убрала телефон. Через минуту берешь его снова. Ответа нет. И тут уже злишься на себя: «Я же решила не проверять!»\n\nСтоп. Ты сейчас еще и должна отчитаться перед собой, почему не успокоилась за минуту?\n\nФраза «просто перестань накручивать» обещает, что тревогу можно выключить, если достаточно постараться. И ты начинаешь тратить силы на борьбу с каждой мыслью. Даже мысль «вдруг он обиделся» становится поводом себя ругать.\n\nТы отвечаешь за то, что делаешь, когда тревожно. Отправишь ли еще десять сообщений, начнешь ли ссору, потребуешь ли немедленного ответа. Здесь у тебя есть выбор. Мысль может появиться сама, без твоего согласия.\n\nДля этого выбора полное спокойствие не требуется. Можно волноваться и пока оставить телефон в покое.\n\nНу правда, ты же не выбирала сейчас испугаться.","s":"Юлия, «тревогу надо просто перестать накручивать»"},{"id":"m07","k":"live","t":"Дети, у которых было сложное детство, очень много думают. Про таких говорят: живут в своей голове. Но я добавлю одну вещь, как психолог, который много работает с такими людьми. Если человек очень много думает, скорее всего, он очень мало чувствует. Потому что он научился прятаться от всего пиздеца в голову. Анализировал обстановку дома, настроение родителей. Там было безопасно, только там был контроль. А чувствовать было больно, страшно и одиноко. Так что бесконечное обдумывание часто способ не встречаться с тревогой. В следующий раз, когда заметишь, что опять жуешь эту мыслительную жвачку, спроси себя по-доброму: котенок, а какое чувство я сейчас не хочу чувствовать? Если узнал себя, в описании есть еще.","s":"живой ролик m07"},{"id":"2026-10-01_03-06-36_rilsy_krug2/r_drug_1","k":"gen","t":"«Опять что-то случилось. Иначе бы не написал».\n\nДружба по вызову. Это когда вы уже по имени на экране понимаете: сейчас будет долгий разговор. Открываете сообщение, там «можешь поговорить?». И вы идете на кухню, чтобы спокойно выслушать, хотя вообще-то собирались спать.\n\nЭто когда потом видите в ленте фотографии друга из отпуска. Значит, помирились. Прекрасно. Вы еще неделю назад слушали, как он собирается разводиться. Теперь узнать, как у него дела, можно только по фотографиям. «Мог бы хоть написать, что все наладилось». Ну правда же.\n\nА самое неприятное начинается, когда он снова пишет о своих проблемах, и вы на секунду радуетесь. Сейчас опять будете разговаривать каждый день. Потом становится стыдно: «Я что, радуюсь, что ему плохо?»\n\nВы успели соскучиться. Когда человек общается с вами только в тяжелые дни, очередная неприятность становится еще и поводом наконец побыть вместе. Отсюда эта радость, за которую вы себя ругаете.\n\nИ злость тоже понятна. Вы знаете все подробности его ссор, а про отпуск узнаете вместе с остальными подписчиками.\n\nХочется ведь, чтобы вам звонили и когда все хорошо.","s":"Михаил, друзья пропадают, когда у них все хорошо, и появляются, когда плохо"}];const KEY='turing-2026-10-01_03-07-34';let A={};try{A=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let shown=false;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}};
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('m');m.querySelectorAll('.c').forEach(x=>x.remove());
D.forEach((d,i)=>{const c=document.createElement('div');c.className='c';const a=A[d.id];
const right=a&&((a==='live')===(d.k==='live'));
c.innerHTML='<div class="n">Текст '+(i+1)+' из '+D.length+'</div><div class="t">'+esc(d.t)+'</div>'
+'<div class="row"><button data-a="live" class="'+(a==='live'?'on':'')+'">Живой человек</button><button data-a="gen" class="'+(a==='gen'?'on':'')+'">Нейросеть</button></div>'
+(shown?'<div class="ans '+(a?(right?'ok':'bad'):'')+'">'+(d.k==='live'?'Живой':'Нейросеть')+' · '+esc(d.s)+(a?(right?' · угадала':' · не угадала'):'')+'</div>':'');
c.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{A[d.id]=b.dataset.a;save();render()});m.appendChild(c)});
const done=D.filter(d=>A[d.id]);const ok=done.filter(d=>(A[d.id]==='live')===(d.k==='live')).length;
document.getElementById('score').textContent=shown?('угадано '+ok+' из '+done.length+(done.length?' ('+Math.round(ok*100/done.length)+'%)':'')):(done.length+' из '+D.length+' отмечено')}
document.getElementById('reveal').onclick=()=>{shown=!shown;document.getElementById('reveal').textContent=shown?'Спрятать ответы':'Показать ответы';render()};
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,answers:A},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='turing-2026-10-01_03-07-34.json';a.click()};
render();
