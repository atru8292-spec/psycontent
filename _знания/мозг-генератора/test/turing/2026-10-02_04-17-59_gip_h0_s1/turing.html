<main id="m"><p class="n">Читай как подписчик в ленте. Отмечай чутьем, не разбирай по словам. Половина текстов от живых психологов, половина от нейросети.</p></main>
<script>
const D=[{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_money_1","k":"gen","t":"Вы уже делаете работу за двоих, а перед разговором о повышении думаете: «Может, еще рано просить?»\n\nХочется доработать до такого момента, когда руководитель сам скажет: «Вам пора поднять зарплату». Тогда и просить не придется. И чувствовать себя наглой тоже.\n\nВот поэтому можно месяцами брать дополнительные задачи.\n\nПотому что отказ в голове звучит совсем паршиво: «Я переоценила себя. Они теперь думают, что я охренела». Простите, охр*нела. Даже в посте приходится себя поправлять.\n\nИ вы снова соглашаетесь подхватить работу коллеги. Потом задерживаетесь, чтобы закончить свою. Начальник пишет «спасибо, вы очень выручили», и вы думаете: «Ну теперь он точно видит».\n\nВидит. Что вам можно поручить еще.\n\nБл*н, как удобно получается. Компания уже пользуется вашей дополнительной работой, а вы все еще доказываете себе, что имеете право за нее попросить денег.\n\nТолько гарантии согласия у вас все равно нет. Даже если вы сделаете больше всех.\n\nЗдесь придется допустить неприятную вещь: руководитель может отказать, а вы при этом можете вполне обоснованно просить повышение. Его ответ зависит и от бюджета, и от того, хочет ли компания вообще увеличивать расходы.\n\nНазначьте отдельный разговор о зарплате с учетом того, сколько работы вы теперь выполняете. Брать еще одну задачу, чтобы окончательно набраться смелости, уже не нужно.","s":"Ольга, стыдно просить повышение, хотя работаю больше всех"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_mama_1","k":"gen","t":"Вы накричали на ребенка и теперь лежите рядом с ним: «Как же я себя ненавижу».\n\nА у вас после укладывания еще и суд над собой? Ребенок уснул, можно выдохнуть. Но вам срочно надо вспомнить каждую секунду и решить, что вы за мать такая.\n\n«Если я себя прощу, я вообще перестану сдерживаться».\n\nТо есть завтра вы будете терпеливее, если сегодня еще пару часов себя погрызете? Охрен*ть у нас требования к мамам. Даже мучиться надо с пользой.\n\nВы пытаетесь наказать себя так сильно, чтобы больше никогда не сорваться. И пока ругаете себя, есть ощущение, что вы что-то делаете: «Я же понимаю, как это ужасно. Мне же стыдно».\n\nТолько утром все остается как было.\n\nРебенок опять выплевывает кашу. Вы опять едите стоя. На предложение мужа отдохнуть отвечаете: «Сначала тут уберу». Вы уже злитесь, но просить сменить вас кажется стыдным. Сами же должны справляться.\n\nПотом кричите. И вот теперь отдыхать вам совсем нельзя, вы же виноваты. Бл*дь, так вы к следующему вечеру еще больше вымотаетесь.\n\nКрик может пугать ребенка. Но ребенку от вашей ненависти к себе спокойнее не становится. Ему нужно, чтобы вы успокоились и снова были рядом, могли обнять, поговорить без крика.\n\nПосле такого вечера договоритесь с мужем или другим близким взрослым, когда завтра он побудет с ребенком, а вы отдохнете. Помощь вам нужна ДО того, как вы снова сорветесь.","s":"Ольга, я злюсь на ребенка, а потом ненавижу себя за это"},{"id":"m56","k":"live","t":"Я психолог, и это не помешало мне обосраться. Поделюсь историей своего некрасивого успеха. В теории я знаю, что любой рост идет вместе со стыдом и страхом. Только знание не освобождает от того, чтобы все это прожить. С начала месяца у меня начало получаться то, к чему я шла. Как думаете, я обрадовалась? Да, конечно. Но честно, страха и стыда оказалось больше. Мне не хотелось никому рассказывать, начались бессонницы, а вчера я просто плакала от того, что у меня получается. Раньше в этом месте я сдувалась и возвращалась в точку ноль. Сейчас мне до одури страшно, мне стыдно, но я иду дальше. И для меня это большая победа.","s":"живой ролик m56"},{"id":"m45","k":"live","t":"Выбирай доброго. Если ты сейчас в поиске, ходишь на свидания, у меня для тебя один совет. Выбирай доброго человека. Самый яркий и самый остроумный пусть подождут. И я не про того, кто всегда удобный и на все согласен. Я про того, кто умеет быть внимательным, заботится, замечает и не хочет делать больно даже в ссоре. Сарказм, дерзость, флирт это весело, как смотреть на фейерверк. Но когда станет сложно, когда ссора, когда стресс, сарказм будет совсем не в кассу. Фейерверк впечатляет. А когда темно и холодно, хочется сидеть у костра, в тепле. Подписывайся, тут про отношения без сказок.","s":"живой ролик m45"},{"id":"psikhologd#1","k":"live","t":"Взросление: Примирение через любовь\nВ финале «Бао» мать и взрослый сын вместе готовят пельмени. Это продолжения, нового этапа их отношений. Взросление не означает разрыва, а сепарация — не конец любви. Это переход к новому типу связи, где есть место и близости, и свободе. Мать учится принимать сына как взрослого, а сын ценит её любовь, возвращаясь, чтобы разделить с ней простые радости.\nПсихоанализ учит нас, что взросление — это всегда баланс между зависимостью и автономией. Если в детстве ребёнок получил достаточно тепла и поддержки, он может смело шагнуть в мир, зная, что у него есть надёжный тыл. Для матери этот процесс требует мужества: отпустить — значит довериться, что любовь не исчезнет, даже если ребёнок уходит.\nСлова поддержки для Вас\nЕсли вы, как мать из «Бао», боитесь отпустить своего ребёнка, помните: ваша любовь — это фундамент, который навсегда останется с ним. Отпуская, вы не теряете, а даёте ему крылья, зная, что он вернётся, потому что вы научили его ценить дом. Если вы — сын или дочь, стремящиеся к самостоятельности, не бойтесь идти вперёд. Ваше взросление — не предательство, а дар, который вы возвращаете миру, оставаясь связанными с теми, кто вас вырастил. Любовь не исчезает, она трансформируется, становясь глубже и свободнее.","s":"живой пост, канал psikhologd"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_mif_1","k":"gen","t":"«Зачем платить психологу? Я и с другом могу поговорить». Да, можете. И хорошо, если есть с кем. Только на консультации ваши слова еще и проверяют.\n\nДопустим, вы говорите: «Друзья встретились без меня. Я им надоел». И уже решили больше им не писать.\n\nКивать тут действительно мало. Психолог спросит: откуда вы знаете, что надоели? Вам это сказали? Или вы увидели фотографию и сами все решили?\n\nВот это уже неприятный вопрос. Вы пришли рассказать, какие друзья плохие, а выясняется, что успели поссориться с ними у себя в голове.\n\nРешать, стоит ли выяснить у друзей, что произошло, будете вы.","s":"Михаил, «психолог просто слушает и кивает за мои деньги»"},{"id":"c26","k":"live","t":"А (критик): Как же я себя ненавижу. Ничего не достигла, сижу на работе и даже сосредоточиться не могу. Какая я жалкая. Все коллеги нормально живут, семьи, улыбаются, а я...\nБ: Так, стоп. О чем мы говорили на сессии? Самокритика.\nА: Ну допустим.\nБ: Критик долбит, чтобы я была продуктивной. Работает?\nА: Нет. Сил вообще нет.\nБ: Хорошее в голове сейчас не найду, это понятно. Тогда просто встану, подышу воздухом пять минут.\nА: Может, поможет.\nБ: Как же сложно.","s":"живой ролик c26"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_malysh_1","k":"gen","t":"Милые, вас просят помочь в выходной, и вам страшненько отказать? Хотя вы уже с ног валитесь.\n\nПредставьте домик, где вас любят. Если раньше за отказ с вами переставали разговаривать или называли эгоисткой, вы запомнили: чтобы меня впустили, надо говорить ДА.\n\nВы выросли. Коллега просит подменить ее в субботу. Вы хотите остаться дома, но уже отвечаете: «Конечно». И думаете: «Блядь, зачем я согласилась?»\n\nПотому что вам кажется: сейчас скажу «нет», и меня больше не захотят видеть в этом домике.\n\nНачните с маленького отказа человеку, который уже спокойно принимал ваши «нет».\n\nЧеловек может расстроиться и все равно хорошо к вам относиться.","s":"Ольга, почему так страшно сказать «нет»"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_teen_1","k":"gen","t":"Слайд 1: Подросток закрылся в комнате и молчит\n\nСлайд 2: Вы стучите в дверь: «Что случилось?» В ответ: «Ничего, отстань». Еще утром разговаривали, а теперь даже смотреть на вас не хочет. Вы волнуетесь и спрашиваете снова. Подросток раздражается сильнее, и уже хочется потребовать, чтобы он открыл дверь.\n\nСлайд 3: Если за рассказом о неприятностях сразу следуют советы и вопросы, подросток заранее ждет долгого разговора. Сказал, что поссорился с другом, и вот уже нужно объяснять, кто виноват и почему. У него на это сейчас нет сил. Проще вообще ничего не рассказывать.\n\nСлайд 4: «Все нормально» помогает быстро закончить разговор. Подростку может быть стыдно, обидно, он сам еще толком не понимает, что произошло. А тут нужно подобрать слова для родителей. Даже заботливый вопрос в такой момент требует сил.\n\nСлайд 5: «Да оставьте меня уже!» особенно больно слышать, когда вы просто хотите помочь. Но после третьего вопроса подросток может ждать, что сейчас придется отвечать на десять следующих. Конечно, обидно: вы пришли поддержать, а получилось почти собеседование.\n\nСлайд 6: Подросток вышел на кухню, взял чай и сел рядом, но ничего не рассказывает. Он уже выбрал побыть с вами. Если сразу спросить: «Ну, теперь объяснишь?», он может уйти обратно. Рядом с родителями тоже хочется посидеть молча, особенно после тяжелого дня.\n\nСлайд 7: Когда подросток сам начнет рассказывать, дайте ему закончить без расспросов и советов. Даже если решение кажется очевидным. Ему важно убедиться, что можно поделиться неприятным и потом спокойно пойти пить чай, без обязательного разбора всей ситуации.","s":"Михаил, подросток закрылся в комнате и не разговаривает"},{"id":"s47","k":"live","t":"Если у твоей девушки тревожная привязанность, вот три вещи, которые помогут ее понять. Первое. Когда ее накрывает, она может казаться агрессивной и слишком эмоциональной. В ее семье чувства не слышали, и она научилась кричать громче, чтобы ее услышали. Унизить тебя она не хочет. Второе. Она просит много контакта, потому что боится, что ты уйдешь. Ей нужно убедиться, что ты правда рядом. Контроль тут ни при чем. Третье. Она может устроить ссору в людном месте и ударить по больному. Знай, что ей в этот момент безумно страшно. А когда ребенку страшно, его берут на руки и успокаивают. Подписывайся, тут прокачиваем отношения.","s":"живой ролик s47"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_drug_1","k":"gen","t":"Друг написал «Как вы?», и вы сразу подумали: «Что у него опять случилось?»\n\nВы уже знаете, что после пары сообщений будет длинный рассказ о ссоре, увольнении или очередном провале. И заранее прикидываете, хватит ли у вас сил сегодня его выслушать.\n\nВы помните, из-за чего он плакал месяц назад. А как он сейчас живет, приходится узнавать у общих знакомых. Встретиться за это время так и не получилось.\n\nПосле разговора он пишет: «Спасибо, только с вами могу нормально поговорить». Вам тепло. Значит, доверяет. Значит, вы важны.\n\nА потом снова тишина.\n\nВ такой дружбе легко привыкнуть чувствовать себя нужным именно тогда, когда человеку плохо. Его проблемы дают вам уверенность: «Без меня он бы не справился». Поэтому даже когда вы злитесь на эти исчезновения, отказать трудно. Вдруг подведете?\n\nПодождите, а куда делось ваше право просто поужинать и лечь спать? Почему ради дружбы вы опять должны разбирать чужую ссору до часу ночи?\n\nЧеловек правда может вам доверять. Но доверия в тяжелые дни мало, чтобы вы чувствовали себя близкими. Вам хочется, чтобы с вами тоже хотели погулять, посмеяться, узнать, как прошла ваша неделя.\n\nСкажите другу, что вам хочется общаться и тогда, когда у него все хорошо.","s":"Михаил, друзья пропадают, когда у них все хорошо, и появляются, когда плохо"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_zlost_1","k":"gen","t":"«На близких нельзя злиться»\n\nС чего бы? Близкий человек вполне может тебя разозлить. Даже любимый. Даже если он много для тебя сделал.\n\nНо ты говоришь: «Я вообще никогда не злюсь». И тут же объясняешь, почему: мама переживает, муж устал, подруга сейчас в тяжелом периоде.\n\nТы так хорошо понимаешь каждого, что до своей злости просто не доходишь. Уже нашла объяснение, уже пожалела человека. А сама почему весь вечер ходишь с комом в горле?\n\n«Он же не специально».\n\nИ ты начинаешь думать: «Тогда чего я обижаюсь? Глупо как-то». Но человек может задеть тебя без всякого намерения. Рассказать при всех то, что ты просила оставить между вами.\n\n«Ей сейчас и так тяжело».\n\nИ вот ты уже слушаешь резкие замечания и молчишь. Еще и спрашиваешь потом, как она себя чувствует. Твое «со мной так нельзя» придется отложить. У нее же проблемы.\n\n«Будь умнее, не обращай внимания».\n\nОх, сколько всего предлагают проглотить под видом ума. После такой фразы злиться еще и стыдно: «Я что, совсем не умею себя держать?»\n\nПохоже, ты считаешь, что для злости нужно сначала доказать: человек плохой и сделал все нарочно. А если у него нашлось объяснение, ты уже как будто не имеешь права сердиться.\n\nЯ бы вообще убрала этот суд над человеком.\n\nТы отвечаешь за то, что делаешь со своей злостью. Оскорблять человека, пугать его, унижать нельзя. Сказать, что тебя задело, и попросить больше так не делать вполне можно.\n\nЧтобы сказать близкому, что тебе больно, тебе не нужно сначала признать его плохим человеком.","s":"Юлия, «я вообще никогда не злюсь»"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_gnezdo_1","k":"gen","t":"Дети съехали. Утром особенно пусто\n\nПросыпаетесь, и вроде можно спокойно выпить кофе. Никого не надо будить, никуда провожать. Только вставать почему-то не хочется. Лежите и думаете: «А зачем? Можно и еще полежать».\n\nПотом сами себя ругаете: «У детей все хорошо. Я должен радоваться. Люди мечтают пожить для себя, а мне опять все не так».\n\nИ тут еще обязательно найдется кто-нибудь с бодрым: «Зато теперь сколько свободного времени!» Спасибо, конечно. Только вы пока понятия не имеете, что с ним делать.\n\nГодами у вашего утра была понятная причина. Нужно приготовить завтрак, спросить, во сколько вернутся, решить что-то по дому. Даже когда это раздражало, вы знали, зачем встаете.\n\nВы уже многое сделали, чтобы дети могли жить самостоятельно. В это ушли годы заботы и сил. Теперь они справляются, а вы остались без привычного порядка, который каждый день подсказывал, чем заняться.\n\nИ скучаете вы еще по тому, как жили рядом. Можно было спросить что-нибудь из соседней комнаты. Услышать, как хлопнула входная дверь. Узнать, что случилось, без отдельного звонка. Теперь даже для обычного разговора приходится выбирать время.\n\nЯ бы не стал требовать от человека немедленно наслаждаться свободой после такой перемены. Откуда взяться этому наслаждению по расписанию?","s":"Михаил, дети выросли и уехали, а я не знаю, зачем теперь вставать утром"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_rod_1","k":"gen","t":"Четыре привычки тех, чья мама обижается, если ей не звонить каждый день.\nПервое. Вы заранее готовите оправдание. Еще даже телефон не взяли, уже решаете, достаточно ли убедительно звучит «задержалась на работе».\nВторое. Звоните, когда вам совершенно нечего сказать. Просто НАДО, иначе завтра выслушивать, какая вы неблагодарная.\nТретье. Не можете спокойно провести вечер с партнером. Смотрите на телефон: мама уже написала «Ты где?». Блядь, опять объяснять, почему вы были в кино.\nЧетвертое. Радуетесь, когда мама не берет трубку. Звонок был, теперь можно спокойно заняться своими делами.\nВы вообще хотели сегодня с ней поговорить или вам нужно было избежать ее обиды?","s":"Ольга, мама обижается, если я не звоню каждый день"},{"id":"m10","k":"live","t":"Когда люди говорят, что им не нужен психолог, они чаще всего добавляют: «я и так про себя все знаю и понимаю». Да, я тоже когда-то была проработанная, все прекрасно понимала. Вы можете вбить свой запрос в поиск, и он подберет вам вот столько книг. Как стать богаче, как построить отношения, как стать уверенней. Спросите чат-бота, он вам столько объяснений выдаст, что не унесете. И что, что-то поменялось? Проблема давно не в том, что мы чего-то не знаем. Мы не умеем чувствовать и боимся живого контакта, потому что в нем уязвимо и больно. А меняется что-то как раз там, в живом разговоре с человеком. Иначе так и будете говорить: головой я все понимаю, а в жизни ничего не меняется. Приходите в терапию, запись по ссылке в шапке профиля.","s":"живой ролик m10"},{"id":"m12","k":"live","t":"Умное говно, которое вам подают под соусом психологии: «ты сама притянула себе такого мужика». Давайте так. Мы никого не притягиваем. Мы просто живем свою жизнь, мы не управляем потоками вселенной и не знаем, кто к нам придет. Самое опасное в этой фразе, что она заставляет копаться в себе в поисках причины чужого говна. А почему я его притянула? А что со мной не так? Может, у меня с мамой плохие отношения? Стоп. В ваших руках другое. Оставить этого человека в жизни или вышвырнуть его нафиг. Сколько времени вы позволили ему остаться и на каких условиях.","s":"живой ролик m12"},{"id":"dnevnik_psihologa#1","k":"live","t":"Родная страна — не просто точка на карте. Это\nконтейнер\n: язык, коды, ощущение «я свой/своя».\nИ когда человек уезжает, он теряет прежде всего этот контейнер. В этот момент активируется та же система привязанности, что и в отношениях с матерью.\nМы часто говорим: мама и деньги, мама и стыд, мама и отношения. Но задумывались ли вы, что отношения с матерью влияют и на проживание эмиграции?\nПочему в одной стране одни чувствуют возможности, а другие — холод и отвержение? Потому что эмиграция — это\nвторичная сепарация:\nона либо повторяет ранний сценарий, либо даёт шанс его завершить.\nЕсли ранняя сепарация была\nподдержана\n— человек может горевать и адаптироваться. Если\nтравматичной\n— новая страна бессознательно переживается как материнский объект: «меня не принимают» или «я должна заслужить право быть здесь».\n3 марта\nна\nбесплатном\nвебинаре Анна расскажет, как материнская фигура влияет на взрослую жизнь и как это видеть в терапии.\nТакже — подробнее о специализации, стартующей в апреле.\n\nРегистрация","s":"живой пост, канал dnevnik_psihologa"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_vybor_1","k":"gen","t":"«Он сам мне вообще не пишет. Почему я все равно жду его сообщения?»\n\nВы можете так зацепиться за человека, потому что его внимание стало доказательством: со мной все нормально, меня можно любить.\n\nОн отвечает через сутки, вы решаете больше не писать. Потом приходит «Как дела?», и все. Вы уже улыбаетесь в телефон. Бля, одного сообщения хватило, чтобы вчерашнее «больше никогда» отменилось.\n\nЕсли любовь раньше приходилось заслуживать, это знакомая история: еще немного постараюсь, и меня наконец выберут.\n\nВ голове сразу: «Значит, я все-таки недостаточно хороша».\n\nИ вы продолжаете добиваться человека, рядом с которым постоянно сомневаетесь в себе.","s":"Ольга, почему я снова выбираю тех, кто меня не выбирает"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_pereezd_1","k":"gen","t":"Четыре признака, что после переезда ты ищешь подруг, но ждешь от них близости, как со старыми.\nПервое. После встречи тебе хочется домой. Весь вечер подбирала слова, даже пошутить боялась. Со своими можно было просто сидеть и есть.\nВторое. Позвать знакомую погулять кажется навязчивостью. «Мы же еще толком не знакомы».\nТретье. Ты быстро решаешь: «Не мой человек». Разговор закончился на работе и погоде. Ну да, до разговоров про самое личное вы пока не добрались.\nЧетвертое. Даже хороший вечер ты не считаешь дружбой. Посмеялись, договорились встретиться снова. Но позвонить ей и поплакать пока нельзя. И ты опять говоришь себе: «У меня здесь никого».","s":"Юлия, переехала в другой город и за год ни с кем не подружилась"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_vopros_2","k":"gen","t":"А: Я впервые у психолога. Даже не знаю, что рассказывать.\nБ: Что сейчас приходит в голову?\nА: Что вы ждете, а я ничего сказать не могу.\nБ: Я могу подождать.\nА: Вы же решите, что я какая-то глупая.\nБ: Ты боишься, что я тебя осужу?\nА: Конечно. Я даже дома репетировала, как все объяснить.\nБ: Ох, сколько подготовки.\nА: И все забыла. Теперь сижу и извиняюсь.\nБ: Перед кем ты еще так извиняешься?\nА: Перед всеми, наверное. Если сразу понятно объяснить не получается.\nБ: Что они делают, когда не понимают?","s":"Юлия, «а о чем вообще говорить на первой сессии?»"},{"id":"psy_and_the_city#3","k":"live","t":"«Не могу без тебя!»\n\nЕсли этап автономии не прожит, часто возникает откат. Партнер раздражает, расстраивает и переодически выводит из себя, но мысль о расставании вызывает панику.\nВместо «могу быть одна» появляется «без тебя я не справлюсь».\nВозвращается страх потери, усиливается тревога\n,\nотношения становятся напряжёнными и эмоционально нестабильными.\nЭто состояние легко перепутать с сильной любовью. На самом деле это зависимость. В ней много страсти, слёз, драм и примирений, но мало спокойствия.\nПартнёр становится источником безопасности, а не выбором.\nФраза «я без тебя не могу» звучит романтично только в кино.В жизни за ней часто стоит страх одиночества и потеря опоры на себя.","s":"живой пост, канал psy_and_the_city"},{"id":"s55","k":"live","t":"Вот что люди с депрессией хотели бы, чтобы вы понимали. Первое. Депрессия не выбор и не вопрос силы воли. Человек не может просто взять себя в руки. Второе. Когда он отвечает через несколько дней или в последний момент отменяет встречу, дело в его состоянии. На вас он не злится. Третье. Причины не всегда видны со стороны. Бывает, снаружи все нормально, и от этого ему не легче. Четвертое. Вам может казаться, что он плохо старается. Но встать с кровати, принять душ, ответить на сообщение сейчас для него как мешки ворочать. И пятое. Это все тот же человек. Его характер и чувства никуда не делись, просто ему очень тяжело. И сейчас ему поддержка нужна больше, чем когда-либо.","s":"живой ролик s55"},{"id":"olga_prokopova_s#1","k":"live","t":"Тут, девочки, пару дней назад я прочитала в новостях инициативу о том, чтобы принять у нас закон против домашнего насилия.\n\nМеня это удивило, ибо я почему-то была уверена, что у нас этот закон есть. Не знаю откуда такая уверенность,  наверное от здравого смысла.\nИ тут сегодня вижу другую новость. И в этой новости прекрасно (нет) всё. Следим за текстом:\n\"Председатель комитета Госдумы по защите семьи Нина Останина...\" - Мисс государственная заботушка о семье\n\"...заявила, что запрет домашнего насилия заставит россиян отказаться от вступления в брак.«Парни будут бояться» «импульсивных» заявлений в полицию от женщин и откажутся от брака\"\nЧего бл%ть? Прям вот заявила?\nНу давайте попробуем прочитать это с позиции здравого смысла, я думаю это звучит примерно так:\nОстанина: \"Вы что а&уели запрещать домашнее насилие? Ведь мужчины ради этого женятся,  а без этого не будут\"\nСюр!\n\n\n\nУ меня тоже есть заявление:\nА давайте перестанем в государственных масштабах считать мужчин пугливыми ланями, которые боятся женщин,  и одновременно козлами с поносом, которые ну никак не могут сдерживаться в своих порывах! Может тогда и они (мужчины) перестанут приписывать себе это поведение как нормальное, а?!","s":"живой пост, канал olga_prokopova_s"},{"id":"p42","k":"live","t":"Ой, а кто это у нас тут? Люди из трудных семей? Не знаете, как жить в этом ебанутом мире? Да перестаньте. С вами уже случилось самое страшное. Помните, когда было больно, а кричать нельзя? Вы это пережили маленьким ребенком. Вы все еще боитесь осуждения, когда начинаете проявляться. Так вас тогда отвергли, никто не был на вашей стороне. Боитесь, что если все станет хорошо, отношения, деньги, то случится что-то страшное и вас накажут. Поэтому выбираете трудности и тащите чужие проблемы. Напоминаю: тогда вы просто не могли убежать из дома. А сейчас можете. Эй, оглянитесь назад. Это все прошли вы. Выжили. Вы все можете. Просто устали.","s":"живой ролик p42"},{"id":"o66","k":"live","t":"Как понять, что у тебя расстройство личности? Если ты не пролистала это видео, скорее всего, его у тебя нет. Все. Потому что при расстройстве личности человек обычно не сомневается в том, как он думает. Он не сидит и не гадает, все ли с ним в порядке. А если ты сидишь и гадаешь, то, скорее всего, у тебя просто яркие черты характера, с которыми можно прийти к психологу и разобраться. Диагноз по рилсу никто не ставит, и я тоже. Все, тема закрыта, всего хорошего.","s":"живой ролик o66"},{"id":"m07","k":"live","t":"Дети, у которых было сложное детство, очень много думают. Про таких говорят: живут в своей голове. Но я добавлю одну вещь, как психолог, который много работает с такими людьми. Если человек очень много думает, скорее всего, он очень мало чувствует. Потому что он научился прятаться от всего пиздеца в голову. Анализировал обстановку дома, настроение родителей. Там было безопасно, только там был контроль. А чувствовать было больно, страшно и одиноко. Так что бесконечное обдумывание часто способ не встречаться с тревогой. В следующий раз, когда заметишь, что опять жуешь эту мыслительную жвачку, спроси себя по-доброму: котенок, а какое чувство я сейчас не хочу чувствовать? Если узнал себя, в описании есть еще.","s":"живой ролик m07"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_vopros_1","k":"gen","t":"Зачем мне психолог, если у меня есть подруги? Чтобы говорить даже о том, что вы скрываете ради вашей дружбы. Вот вы расстались с мужчиной. Подруга слушала вас до двух ночи, потом приезжала, когда вам было хреново. Вместе решили: все, хватит. А через неделю вы к нему вернулись. И теперь перед звонком подруге думаете: «Только бы про него не спросила». Блядь, еще и здесь приходится выкручиваться. В терапии вам не приходится учитывать, сколько психолог уже потратила на вас сил. Можно сказать: «Я снова к нему вернулась» и разбираться, что вас туда тянет.","s":"Ольга, «а зачем мне психолог, если у меня есть подруги»"},{"id":"s37","k":"live","t":"Всем привет, меня зовут Паша, и вот пять причин выбрать меня своим психологом. Причина первая. Я понимаю, о чем вы, когда вы говорите «кринж», «вайб» и «пикми». И «получку» с «хохмой» тоже понимаю. Причина вторая. У меня медицинское образование, я врач-психиатр и психотерапевт. Я знаю, почему крышечка подтекает и когда с этим надо к врачу. Причина третья. Со мной можно по-разному. Можем на сессии разобраться, почему попросить денег для вас как утонуть, а можем просто посидеть в тишине, потому что все заебало. Причина четвертая. Я не из тех, кто мило кивает. Я буду рядом, с пониманием, но не на стороне привычек, которые ломают вам жизнь. Причина пятая. Принимаю очно во Владивостоке и онлайн. Пишите в личку в телеграм.","s":"живой ролик s37"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_humor_1","k":"gen","t":"Слушай, давай вечером кофе попьем? Ты же психолог, я тебе про мужа расскажу. Только вопросы подготовь, я сама не знаю, с чего начать. И давай где потише, мне надо поплакать.\n\nТы сегодня после шести не работаешь? ОТЛИЧНО, значит, свободна.\n\nТолько без твоего «ну он козел». Так я и сама могу. Ты мне нормально объясни, почему я его выбрала.\n\nБлядь, ну чего ты вздыхаешь? Я же к тебе как к подруге пришла. Мне важно, чтобы ты была собой. Только собой спокойной, внимательной и чтобы про себя пока ничего не рассказывала.\n\nЗа кофе переведи мне половину. Мы же просто посидели.","s":"Ольга, когда ты психолог, а подруги приходят «просто поговорить»"},{"id":"psyosychenko#4","k":"live","t":"КТО ОТВЕЧАЕТ ЗА УДОВОЛЬСТВИЕ ЖЕНЩИНЫ В ИНТИМНОЙ БЛИЗОСТИ — ТОЛЬКО МУЖЧИНА?\n— Ты должен сделать так, чтобы мне было хорошо.\n— А ты сама знаешь, что именно для тебя «хорошо»?\n…тишина.\nОчень часто разговор о близости выглядит именно так.\nОдин должен\nДОГАДАТЬСЯ\n.\nВторая —\nЖДАТЬ\n, что её почувствуют без слов.\nНо реальность сложнее.\n— Если мужчина любит, он сам всё поймёт.\n— А если женщина\nМОЛЧИТ\n, как он поймёт?\nПауза.\nПотому что правда, которую редко говорят вслух:\nУДОВОЛЬСТВИЕ ЖЕНЩИНЫ — ЭТО НЕ ТОЛЬКО ОТВЕТСТВЕННОСТЬ МУЖЧИНЫ.\nМужчина отвечает за\nВНИМАНИЕ, БЕРЕЖНОСТЬ, ЖЕЛАНИЕ БЫТЬ РЯДОМ\n, за готовность\nСЛЫШАТЬ И ЧУВСТВОВАТЬ\n.\nНо женщина отвечает за другое.\n— за\nКОНТАКТ СО СВОИМ ТЕЛОМ\n— за\nЧЕСТНОСТЬ СО СВОИМИ ЖЕЛАНИЯМИ\n— за способность\nГОВОРИТЬ\n, что ей нравится и что нет\nПарадокс в том, что многие женщины хотят, чтобы мужчина\nУГАДАЛ\n.\nНо при этом сами никогда не исследовали своё тело, свои реакции и свои границы.\nИ тогда появляется странная динамика:\n— мужчина\nПЫТАЕТСЯ УГАДАТЬ\n— женщина\nЖДЁТ\n— оба\nРАЗОЧАРОВЫВАЮТСЯ\nА близость начинает превращаться в напряжение.\nЗрелая близость начинается в тот момент, когда ответственность становится\nОБОЮДНОЙ\n.\nКогда мужчина НЕ\nБОИТСЯ СПРАШИВАТЬ.\nИ когда женщина\nНЕ БОИТСЯ ГОВОРИТЬ.\nКогда это уже не игра в угадайку,\nа\nДИАЛОГ ДВУХ ВЗРОСЛЫХ ЛЮДЕЙ.\nИ тогда происходит важный сдвиг.\nЖенщина перестаёт быть «объектом удовольствия»,\nа становится\nСОАВТОРОМ БЛИЗОСТИ.\nА это совсем другой уровень отношений","s":"живой пост, канал psyosychenko"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_car_1","k":"gen","t":"Слайд 1: Подруга в депрессии и перестала отвечать вам.\n\nСлайд 2: Вы пишете подруге: «Давай погуляем, тебе станет легче». Она молчит. Вы хотели помочь.\n\nНо ей сейчас трудно даже помыть голову. Чтобы встретиться, придется одеться, выйти из дома, поддерживать разговор. И выслушать вопросы, почему прогулка ее не развеселила.\n\nСлайд 3: Подруга читает сообщения и молчит.\n\nОтветить тоже бывает тяжело. Особенно когда надо объяснить, как дела, а сказать получается только «все так же».\n\nОтсутствие ответа само по себе ничего не говорит о вашей дружбе. Сообщение без вопроса в конце сейчас может оказаться легче.\n\nСлайд 4: Подруга снова отменяет встречу.\n\nКогда договаривались, она правда рассчитывала прийти. Утром встала, дошла до ванной и поняла, что больше ничего не может.\n\nПосле отмены ей еще и стыдно: «Опять подвела. Лучше вообще ничего не обещать».\n\nСлайд 5: Подруга соглашается с советами, но ничего не делает.\n\n«Да, надо наладить сон». «Да, попробую гулять».\n\nЗнать, что могло бы помочь, и суметь это сделать сейчас для нее две разные задачи. Новые советы добавляют ЕЩЕ одну: потом объяснять вам, почему она снова не справилась.\n\nСлайд 6: Подруга смеется с вами, а потом говорит, что ей по-прежнему плохо.\n\nПри депрессии бывают минуты, когда человек смеется и отвлекается. По одному такому вечеру нельзя понять, что он уже поправился.\n\n«Ты же вчера была веселая» заставляет ее доказывать, что ей действительно тяжело.\n\nСлайд 7: Подруга начинает отвечать: «Все нормально».\n\nОна заметила, что после честного ответа начинается разговор о том, что ей нужно сделать. Сил на этот разговор тоже нет.\n\nБл*ть, еще и отчитываться о прогулках. Проще сказать «нормально» и остаться со всем одной.\n\nСлайд 8: Предложите подруге одну конкретную помощь: привезти готовую еду и оставить у двери, если она согласна.\n\nБез обязательной встречи и разговора о самочувствии. Пусть ей не придется развлекать вас в благодарность за ужин.","s":"Ольга, как поддержать подругу с депрессией и не сделать хуже"},{"id":"psikhologd#2","k":"live","t":"Финал: шрамы в тишине\nФинал фильма — это психоаналитический тупик. Подрик и Колм, израненные, стоят у моря. Пожар, смерть Дженни, гибель Доминика — всё это оставляет их в пустоте, где нет примирения, только шрамы. Колм, лишившийся пальцев и дома, цепляется за музыку, как за иллюзию смысла. Подрик, потерявший друга и осла, обретает в гневе новую силу, но за ней — бездна. Этот финал — как сессия анализа, где нет ответов, только вопросы о том, как жить с болью.\nПочему это разрывает душу?\nФильм заставляет чувствовать: ужас, что мы не успеем, боль, когда нас отталкивают, и тоску по простому теплу — будь то друг или осёл. Он спрашивает: что держит нас в живых? Любовь? Творчество? Или способность выстоять, когда всё горит?","s":"живой пост, канал psikhologd"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_men_1","k":"gen","t":"Четыре признака для отцов, которые срываются на детей, а потом себя ругают.\nПервое. Про обиду вам трудно говорить. Начальник унизил, вы промолчали. Дома ребенок разлил сок, и тут вы уже высказались.\nВторое. Испуг быстро превращается в крик. Ребенок потерялся в магазине, нашелся, вы его отчитываете. Сказать «я за тебя испугался» почему-то труднее.\nТретье. Даже усталость приходится оправдывать. «Другие справляются». Отлично, теперь еще и уставать стыдно.\nЧетвертое. Детские слезы особенно злят. В голове: «Я же терплю. Почему ему можно?»\nИ ребенок получает крик, хотя вы сами сейчас едва справляетесь.","s":"Михаил, мужчины не плачут, а потом срываются на детей"},{"id":"r38","k":"live","t":"Служба поддержки встретившихся со взрослой жизнью, здравствуйте. Что у вас случилось? Девушка, дышите спокойно. Так. Вы хотите быть успешной бизнесвумен и еще, чтобы вас содержали. Поняла. И чтобы любили такой, какая вы есть, и похудеть до сорока пяти. Так. А еще никому ничего не доказывать, но чтобы бывший увидел и захлебнулся. Поняла. И мужчину с характером, но чтобы рот не открывал и делал, что скажете. А, еще на детокс-ретрит, и бургер вот этот съесть тоже не против. И отношения без драмы. Но чтобы он бежал за вами под дождем и всем за вас морды набил. Вот, уже спокойнее говорите. Все нормально, девушка, не вижу никаких противоречий. Обращайтесь.","s":"живой ролик r38"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_post_1","k":"gen","t":"Он весь вечер не пишет, и ты проверяешь телефон даже по дороге из комнаты на кухню.\n\nВ голове уже: «Я ему вообще нужна?» Хотя днем вы нормально общались и никто ни с кем не ссорился.\n\nНаписать самой? Ты даже открываешь чат. Но тут же: «Вчера я первая написала. Сегодня пусть он». Закрываешь. И ждешь дальше.\n\nТебе важно, чтобы он сам вспомнил о тебе. Без подсказки. Тогда можно будет хоть немного успокоиться: «Значит, тоже хочет со мной поговорить».\n\nЕсли напишешь сама и он ответит, останется вопрос: «А без моего сообщения он бы вообще написал?» Ты хочешь убедиться, что ему нужна, и засчитываешь только то, что он сделал сам.\n\nПриходит уведомление. Берешь телефон, там сообщение из общего чата. Да что ж такое, еще и они сегодня разговорились.\n\nА потом он наконец пишет. Ты рада, но сразу отвечать уже не хочется: «Я тут весь вечер ждала, а ты только сейчас?» Он еще даже не знает, что ты успела расстроиться и разозлиться.\n\nТак каждый вечер без его сообщения становится проверкой ваших отношений. И даже после хорошего разговора завтра снова хочется убедиться, что он про тебя помнит.\n\nЕсли ты постоянно ждешь, что он напишет первым, скажи ему, что тебе важно тоже получать от него сообщения, без твоей инициативы. Он вполне может считать, что у вас все хорошо, пока ты каждый вечер гадаешь, интересна ли ему вообще.","s":"Юлия, он не пишет первым, а я весь вечер жду и проверяю телефон"},{"id":"d36","k":"live","t":"Большие тети-дяди тебе этого не скажут, поэтому у тебя сердечко бо-бо, животик бо-бо, и бабайки в голове пугают. Сейчас тетя расскажет, как бабайкам дать пизды.\nТы думаешь, что бабайки настоящие. Если нападешь на бабайку, бабайки дадут тебе пизды. Ты будешь маленький и беззащитный, все будут смеяться и бросят тебя.\nПоэтому ты от бабаек убегаешь. Но бабайки придуманные. Вот тут мир, вот тут ты, а вот тут твои бабайки.\nЕсли бабайки придуманные, ты на них наорешь, пошлешь нахер, и ничего не случится. Они так и останутся придуманными. Мир не меняется. Меняются глаза.","s":"живой ролик d36"},{"id":"m28","k":"live","t":"Если вы не можете перестать листать рилсы и заняться делом, я как клинический психолог хочу терапевтически спросить. А может быть, вы... ну... заебались? А? Я понимаю, вы уже записали себя в конченые. Но вдруг есть маленький шанс, что вы в ахуе от нагрузки, и мозг пытается залипнуть хоть на чем-то приятном. А? Думаете все-таки, что ленивая скотина? Записала. Ну и все же предлагаю попробовать выключить. Нет, не рилсы, не пугаемся. Бесконечный поток требований к себе. Как вам идея? Вдруг дело в нем. Так, навскидку.","s":"живой ролик m28"},{"id":"labkovskiy#2","k":"live","t":"«Здравствуйте, Михаил! Вы говорите, что с собой надо общаться как с лучшим другом, поддерживать и тд. Но что делать, если не получается? Я действительно верю в своих близких, знаю, какой классный потенциал у них есть, но когда дело касается меня — сомневаюсь. С самооценкой все в порядке, она плавает только на моментах моей сильной неуверенности в своих силах, когда недостаточно практики и «доказательств». Как отпустить «поводья», расслабиться и позволить себе делать? И реально поддерживать себя так, как и своих друзей и семью?»\nНачнём с того, что сомневаться в себе, когда вы занимаетесь чем-то новым и в чём рука ещё «не набита» — нормально. Вы же адекватный человек и понимаете, что делать всё гениально с первого раза — такая себе история.\nПообщайтесь с собой и выясните, почему у вас к себе такие жёсткие требования и откуда эта чрезмерная требовательность вообще взялась? Если вы ориентируетесь на профи и думаете «как я могу встать рядом с ними, они такие классные, а я ещё ничего не умею», то нужно понять важную вещь — АБСОЛЮТНО каждый человек с чего-то начинал.\nФредди Меркьюри, к примеру, сначала играл на школьных вечерах и юбилеях, а не сразу на многотысячных аренах. Генри Форд, основавший Ford Motor, до этого потерпел крах с первой компанией по производству автомобилей. А Мерил Стрип на кастинге в Кинг-Конга и вовсе обозвали уродиной, но именно ей принадлежит рекорд по количеству номинаций на Оскар.\nЕсли у вас что-то не получается и вы где-то проваливаетесь, это не значит, что вы «тупой/недостаточно талантливый/какой-то не такой». Работайте над собой, поддерживайте и любите себя, продолжайте набираться опыта, перенимайте его у тех, кто вдохновляет вас.\nИ поймите главное — идеальный момент не настанет. Не будет такого дня, в который у вас вдруг раз и получится. Самореализация — это путь с ошибками и провалами. И пройти его вы должны, будучи в первую очередь опорой самой(самому) себе.\nУспехов!","s":"живой пост, канал labkovskiy"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_malysh_2","k":"gen","t":"Милая, ты обиделась на маму и сразу себя ругаешь: «Она столько для меня сделала. Чего я опять начинаю?»\n\nСмотри, обида бывает как заноза. Мама сказала что-то больное, а тебе велели потерпеть: «Мама устала. Мама хотела как лучше». И ты решила, что жаловаться нельзя.\n\nЗаноза осталась. Ты выросла, мама сегодня ласковая, а тебе все еще больно. И ты думаешь: «Ну что я за дочь такая?»\n\nОх, еще и виноватой себя назначила. Больно тебе, а жалеть опять надо маму.\n\nМожно признать: «Да, мне обидно».\n\nТы можешь любить маму и все еще быть на нее обиженной.","s":"Юлия, обида на маму, которую стыдно признать"},{"id":"psyosychenko#5","k":"live","t":"ЧТО ТАКОЕ ЭМОЦИИ И ДЛЯ ЧЕГО ОНИ НУЖНЫ\nЭМОЦИИ\n— это базовая система внутренних сигналов. Это то, как психика мгновенно реагирует на события, людей, слова и ситуации. Они появляются быстрее, чем мы успеваем их осознать, и выполняют важную функцию ориентирования в жизни.\nЭмоции показывают, что для Вас безопасно, что ценно, а что вызывает напряжение или дискомфорт.\nЗЛОСТЬ\nможет сигнализировать о нарушении границ,\nТРЕВОГА\n— о неопределённости или возможной угрозе,\nГРУСТЬ\n— о потере или завершении чего-то важного.\nРАДОСТЬ\n, наоборот, указывает на ресурс и удовлетворение потребностей.\nВажно понимать: эмоция — это первичная реакция тела и нервной системы. А\nЧУВСТВО\nформируется, когда к этой эмоции добавляется мысль и смысл, который Вы ей придаёте. Например, Вы можете почувствовать тревогу, а затем мысль «со мной что-то не так» или «я не справлюсь» превращает её в более сложное переживание. Так эмоция и интерпретация соединяются в чувство.\nЕсли эмоции подавлять или игнорировать, они не исчезают. Они остаются в теле, накапливаются в напряжении, в раздражении или в неожиданных реакциях на близких. Когда же Вы начинаете замечать их и давать им место, появляется больше ясности и внутренней устойчивости.\nКАК ВЫ ЧАЩЕ ВСЕГО ПРОЖИВАЕТЕ СВОИ ЭМОЦИИ — СРАЗУ ВЫРАЖАЕТЕ ИЛИ ДОЛГО ДЕРЖИТЕ ВНУТРИ?","s":"живой пост, канал psyosychenko"},{"id":"m52","k":"live","t":"Он скинул тебе смешной рилс, а ты пролистала и даже реакцию не поставила. Вроде мелочь, да? Но если такие мелочи повторяются, они влияют на отношения намного сильнее, чем кажется. Отношения держатся на мелочах, которыми вы друг друга окликаете. Тот самый смешной рилс. Фотка заката из окна. Сообщение «как ты там». В них всегда есть что-то непроговоренное: я про тебя помню, я тебя вижу, ты мне важна. Понятно, ситуации бывают разные, мы не идеальны. Но если раз за разом никто не откликается, внутри появляется: я не интересна, я одна в этих отношениях. Отношения разрушают маленькие вещи, когда тебя раз за разом не замечают. Так что не жадничай на «ахаха» в ответ на рилс.","s":"живой ролик m52"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_tg_1","k":"gen","t":"Вас хвалят, а вам неловко\n\nКоллега благодарит вас за помощь, а вы отвечаете: «Да там дел на пять минут», и сразу меняете тему.\n\nВы быстро разобрались. Получилось легко. Значит, хвалить особенно не за что.\n\nЯ бы здесь спросил: а почему пять минут обесценивают все, что вы умеете? Вы ведь потратили их на задачу, с которой другой человек пришел к вам за помощью.\n\nЕсть такая ловушка: все, что вы уже освоили, вы перестаете считать настоящим умением. «Это же очевидно». «Тут любой разберется». «Я просто знаю, куда нажать».\n\nЗамечательно. Даже знание, куда нажать, себе не засчитали.\n\nВспомните первые недели на работе. Вы могли полчаса искать нужный документ и уточнять, кому его отправить. Сейчас делаете это между делом. Но в голове никакой прибавки: просто задача теперь кажется слишком простой, чтобы считать ее доказательством своей компетентности.\n\nА вот незнакомая задача сразу идет в счет: «Ну все, сейчас выяснится, что я ничего не понимаю».\n\nИ получается, что вы каждый месяц узнаете больше, а уверенности столько же. Все знакомое вы уже исключили из оценки. Оцениваете себя только по тому, чего пока не знаете.\n\nКогда в следующий раз захочется сказать «это любой сможет», вспомните себя в первый месяц на этой работе. Вы тогда смогли бы?","s":"Михаил, боюсь, что на работе меня раскусят и поймут, что я ничего не умею"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_razvod_1","k":"gen","t":"Слайд 1: «Ради детей я пока не буду разводиться»\n\nСлайд 2: Вы уже думаете, как будете жить отдельно. Потом смотрите на ребенка: «У него же будет праздник, все дети придут с папами. И что, я все испорчу?»\n\nИ снова откладываете разговор с мужем. Кажется, хорошая мать должна потерпеть.\n\nСлайд 3: Удобно придумали: за отношения двух взрослых теперь отвечает ваша любовь к ребенку. Сколько же на женщину навешали, бл*дь.\n\nЕсли муж вас унижает, запись «женат» в документах этого не отменяет.\n\nСлайд 4: У решения «терплю ради ребенка» есть неприятная ловушка. Вы можете начать ждать, что ребенок хотя бы оценит вашу жертву.\n\nВы весь вечер молчали после очередной ссоры с мужем, а он еще и уроки делать отказывается. В голове: «Я ради тебя здесь живу. Мог бы хоть слушаться».\n\nСлайд 5: Так у ребенка появляется долг за ваше терпение. Вы можете даже ни разу не сказать ему про этот долг вслух.\n\nНо его обычное недовольство начинает особенно злить. Вы столько вынесли ради него, а он смеет быть недовольным. Хотя ребенок вас оставаться не просил.\n\nСлайд 6: Сохранить отношения можно, если ОБА готовы что-то менять. Например, муж перестает оскорблять вас во время ссор, берет на себя ежедневные дела с детьми. Вы можете обсуждать разногласия без страха.\n\nСмотреть стоит на то, что происходит дома. Одного обещания «теперь все будет хорошо» мало.\n\nСлайд 7: Вы отвечаете за то, чтобы ребенок получал заботу и не участвовал в ваших ссорах. Отношения с мужем тоже требуют взрослого решения, которое нельзя поручить ребенку.\n\nНо обсуждать с мужем нужно конкретно: что каждый из вас готов менять, чтобы вместе стало возможно жить.","s":"Ольга, «ради детей надо сохранить семью»"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_stud_1","k":"gen","t":"«Мне скоро сдавать диплом, почему я опять делаю что угодно, только бы его не писать?»\n\nОткрываешь документ. Перечитываешь заголовок. И вдруг надо срочно разобрать файлы на ноутбуке. Ну конечно, без порядка в папках диплом никак.\n\nЕсли тебе страшно показать, на что ты способна, откладывание дает удобную надежду: «Я бы написала хорошо, если бы времени было больше».\n\nПока текста нет, никто не может его прочитать и сказать, что получилось плохо. Даже ты сама.\n\nА когда садишься писать, приходится столкнуться с тем, что получается сейчас. С кривыми фразами, с пробелами в знаниях.\n\nИ вот вопрос: ты боишься плохого диплома или того, что после него сама решишь, что ты глупая?","s":"Юлия, не могу сесть за диплом, хотя времени почти нет"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_body_1","k":"gen","t":"Это для тебя, если перед отпуском ты примеряешь купальник и думаешь: «Господи, какая я ужасная». Втягиваешь живот, поворачиваешься боком. Уже и ехать никуда не хочется. Ты еще дома, а в голове уже кто то на пляже рассматривает тебя и критикует. И ты начинаешь ругать себя первой. Если твое тело постоянно обсуждали, ты привыкаешь заранее искать, к чему придерутся. Даже когда рядом никого нет. Ну сколько можно, ты ведь просто купальник надела. Ты можешь ехать в отпуск и с животом, который тебе сейчас не нравится.","s":"Юлия, ненавижу себя в зеркале перед отпуском"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_mif_2","k":"gen","t":"«Ты сама себя накручиваешь. Просто перестань».\n\nЕсли бы это работало, ты бы давно перестала. Уж поверь, желания у тебя хватает.\n\nОн долго не отвечает. Ты уже несколько раз открыла переписку, вспомнила вчерашний разговор и думаешь: «Я что-то лишнее сказала?»\n\nА после совета «не накручивай» появляется еще одна забота. Теперь надо следить, чтобы ты даже в голове ничего лишнего не подумала. «Опять начинаю. Ну что со мной такое».\n\nПрекрасно, теперь ты еще и виновата в том, что тебе страшно.\n\nТы можешь часами ругать себя за тревогу и все это время продолжать тревожиться.\n\nПервая тревожная мысль появляется без твоего согласия. Ты отвечаешь за то, что делаешь дальше. Написать человеку десять сообщений с вопросом «ты точно не злишься?» или дождаться ответа. Обвинить его или сказать, что тебя беспокоит.\n\nМожно пока тревожиться и оставить переписку в покое. За каждую мысль, которая пришла тебе в голову, ты отвечать не обязана.","s":"Юлия, «тревогу надо просто перестать накручивать»"},{"id":"psy_and_the_city#5","k":"live","t":"«Лучше без тебя?»\n\nИногда после череды конфликтов и разочарований появляется мысль, которая пугает своей честностью\n«а может, одной было бы проще?»\nНе потому что любовь исчезла, а потому что хочется тишины, воздуха и пространства для себя.\nЭто стадия, где человек начинает возвращать себе границы. Проверяет а кто я вообще в этих отношениях? Есть ли у меня место, желания, жизнь, не связанная только с партнёром? Здесь легко перепутать здоровую автономию с бегством. Но разница в том, что\nавтономия не разрушает связь, а делает ее устойчивее.\nОтношения, которые не выдерживают этой стадии, часто держались только на слиянии. А те, что выдерживают, переходят на другой уровень более зрелый и честный.","s":"живой пост, канал psy_and_the_city"},{"id":"2026-10-02_03-54-33_rilsy_gip_h0/r_dengi_1","k":"gen","t":"Зарплаты хватает, запас есть, но вы все равно думаете: «Сейчас нормально. А вдруг потом все закончится?»\n\nУ тревоги есть неприятная особенность: вы можете начать считать ее полезной. Пока переживаете, вы внимательнее к расходам, лишний раз проверяете счет. Деньги пока не закончились. И появляется убеждение: «Вот поэтому и не закончились. Я же все время слежу».\n\nПолучается, даже успокоиться страшно. Вдруг расслабитесь и все упустите.\n\nПришла зарплата. Вы оплатили счета, отложили часть денег. Вроде хватает. Но вечером снова открываете приложение банка. Вспоминаете про страховку на машину, прикидываете расходы до конца месяца. Закрываете. Через полчаса хочется проверить еще раз.\n\nЦифры те же. На несколько минут стало спокойнее, и этого хватило, чтобы захотелось повторить проверку.\n\nВот ведь какая штука: деньги у вас есть, а почувствовать себя спокойно вы можете только после очередного подсчета.\n\nЕсли вы узнаете себя, полезно разделить две вещи. Следить за деньгами нужно, для этого достаточно понятного бюджета и проверки по делу. Постоянно беспокоиться о них тоже можно, только дополнительных денег от этого на счете не появится.\n\nПеред очередной проверкой спросите себя: появился новый расход или мне снова стало страшно? Если ничего не изменилось, пересчитывать остаток еще раз не нужно.","s":"Михаил, зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит"}];const KEY='turing-2026-10-02_04-17-59_gip_h0_s1';let A={};try{A=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let shown=false;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}};

+'<div class="row"><button data-a="live" class="'+(a==='live'?'on':'')+'">Живой человек</button><button data-a="gen" class="'+(a==='gen'?'on':'')+'">Нейросеть</button></div>'
+(shown?'<div class="ans '+(a?(right?'ok':'bad'):'')+'">'+(d.k==='live'?'Живой':'Нейросеть')+' · '+esc(d.s)+(a?(right?' · угадала':' · не угадала'):'')+'</div>':'');
c.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{A[d.id]=b.dataset.a;save();render()});m.appendChild(c)});
const done=D.filter(d=>A[d.id]);const ok=done.filter(d=>(A[d.id]==='live')===(d.k==='live')).length;
document.getElementById('score').textContent=shown?('угадано '+ok+' из '+done.length+(done.length?' ('+Math.round(ok*100/done.length)+'%)':'')):(done.length+' из '+D.length+' отмечено')}
document.getElementById('reveal').onclick=()=>{shown=!shown;document.getElementById('reveal').textContent=shown?'Спрятать ответы':'Показать ответы';render()};
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,answers:A},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='turing-2026-10-02_04-17-59_gip_h0_s1.json';a.click()};
render();
