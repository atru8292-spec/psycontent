<header><h1>Живой психолог или нейросеть?</h1><span id="score" class="res"></span><button id="reveal">Показать ответы</button><button id="dl">Скачать ответы</button></header>
<main id="m"><p class="n">Читай как подписчик в ленте. Отмечай чутьем, не разбирай по словам. Половина текстов от живых психологов, половина от нейросети.</p></main>
<script>
const D=[{"id":"2026-10-01_02-08_rilsy/tema_1","k":"gen","t":"Вы трижды переделали работу, легли в четыре утра, а утром написали: «Да там все легко было».\n\nВроде мелочь, да? Ну зачем рассказывать, что вы перепутали файлы, сначала сделали вообще другое и полчаса плакали над ноутбуком. Главное, сдали. Снаружи все идеально.\n\nВ переписке остается «готово ❤️». Сообщение «я запуталась, можно спросить?» вы удалили еще вчера. Коллега предлагает помочь, вы отвечаете: «Спасибо, я уже разобралась». Хотя еще нихуя не разобрались.\n\nЧасто за этим стоит страх: если увидят ошибку, придется заново доказывать, что вы вообще чего-то стоите. Поэтому вы стараетесь успеть все исправить до того, как кто-нибудь заметит.\n\nИ постепенно окружающие привыкают: вам легко, вы умеете, вы всегда вывозите. Можно дать еще задачу. Можно даже не спрашивать, нужна ли помощь.\n\nА вы потом сидите и злитесь: «Почему все решили, что я железная?»\n\nДевочки, они видят только ту часть, которую вы оставили им в переписке. Все ваши «я не понимаю», «мне страшно», «я тут накосячила» остались в черновиках.\n\nИ с подругой так же. Рассказать про провал можно будет потом, когда вы все исправите и сможете смешно пересказать. Пока внутри пизд*ц, на вопрос «как ты?» отвечаете: «Да нормально».\n\nКак вас поддержать в том, что вы так тщательно скрыли?","s":"Ольга, хочу, чтобы никто не видел моих ошибок, снаружи у меня все идеально"},{"id":"2026-10-01_02-46-10_rilsy/spisok_1","k":"gen","t":"Четыре признака, что вы дома отвечаете вообще за все.\nПервое. На работе вспоминаете, что ребенку нужны сменные кроссовки. Рабочий день еще идет, а вы уже мысленно собираете рюкзак.\nВторое. Ложитесь отдохнуть и прислушиваетесь, что там на кухне. Сейчас кто-нибудь обязательно позовет. Какой, блядь, отдых, если вы все еще дежурите.\nТретье. От предложения мужа «ну скажи, что сделать, я сделаю» хочется орать.\nЧетвертое. После крика на ребенка вы ненавидите себя и обещаете лучше себя контролировать. Мысль, что дома пора всем разделить обязанности, даже не приходит. Вы уже решили: опять исправляться должны только вы.","s":"Ольга, мама кричит на детей, а потом себя ненавидит"},{"id":"d36","k":"live","t":"Большие тети-дяди тебе этого не скажут, поэтому у тебя сердечко бо-бо, животик бо-бо, и бабайки в голове пугают. Сейчас тетя расскажет, как бабайкам дать пизды.\nТы думаешь, что бабайки настоящие. Если нападешь на бабайку, бабайки дадут тебе пизды. Ты будешь маленький и беззащитный, все будут смеяться и бросят тебя.\nПоэтому ты от бабаек убегаешь. Но бабайки придуманные. Вот тут мир, вот тут ты, а вот тут твои бабайки.\nЕсли бабайки придуманные, ты на них наорешь, пошлешь нахер, и ничего не случится. Они так и останутся придуманными. Мир не меняется. Меняются глаза.","s":"живой ролик d36"},{"id":"s41","k":"live","t":"Пять признаков, что человек прошел в жизни настоящий ад. Первый. Ему неловко, когда о нем искренне заботятся или делают комплименты. Забота для него что-то непривычное, с подвохом: я теперь что-то должен. Второй. Ему физически больно просить о помощи. Он лучше умрет. Третий. Он считывает настроение людей за полсекунды. По голосу, по тому, как человек моргает, как открывает дверь. Четвертый. Он не умеет отдыхать без чувства вины. Если ничего не делает, кажется, что сейчас кто-то придет и накажет за безделье. И пятый. Когда в жизни все хорошо, ему жутко тревожно. Мозг привык, что тишина бывает перед настоящим лютым пиздецом. Сколько пунктов насчитали у себя?","s":"живой ролик s41"},{"id":"r32","k":"live","t":"Уважаемые родители, рассаживаемся. Тема урока: доверие. Как сделать, чтобы ребенок вам доверял? Правильно. Нужно, чтобы он не доверял больше никому. Особенно себе. Чтобы ни одна мысль, которая приходит ему в голову, не вызывала у него доверия. Это первый класс, вторая четверть. Он вам говорит: вы на меня орете. Кто на тебя орет? Никто на тебя не орет, я разговариваю, понятно? Он говорит: вы меня наказываете. Мы не наказываем. Мы воспитываем, это разные вещи. Он говорит: я не могу. Ты все можешь, ты просто не хочешь. Что за вопросы вы задаете? Вы что, тупая? Лично я не обзываюсь. Я выстраиваю гипотезу. Вот. Почувствовали? Сразу доверие между нами возникло. И с ребенком так же. Тогда в семье будут теплые доверительные отношения.","s":"живой ролик r32"},{"id":"2026-10-01_02-46-10_rilsy/post_1","k":"gen","t":"Если вы опять накричали на ребенка и теперь думаете: «Блядь, что я за мать», у меня есть вопрос.\n\nА сколько человек у вас дома могут просто спросить: «Что у нас на ужин?» И почему ответ обязаны знать именно вы?\n\n«Ну муж же помогает. Это я психованная, мне все мало».\n\nПомогает, да. Вы попросили сварить макароны, сказали, где кастрюля, напомнили выключить плиту. Потом из ванной ответили, что дать ребенку к макаронам. Охренеть, отдохнули.\n\nОн сделал поручение. Вы все это время помнили, что нужно сделать, объясняли и проверяли. Голова так и осталась занята ужином, хотя руки наконец освободились.\n\nИ тут ребенок третий раз зовет вас посмотреть какую-нибудь штуку. Вы орете. Потом сидите рядом со спящим ребенком и ненавидите себя. Вспоминаете только свой крик. Все, что вы тащили до него, уже будто не считается.\n\nКрик пугает ребенка, и вам больно, что вы его напугали.\n\nМуж здесь тоже живет. Вы хотите хоть часть вечера вообще не думать о кастрюле. Без просьб, объяснений и проверки.","s":"Ольга, крикнула на ребенка и ненавижу себя"},{"id":"2026-10-01_02-46-10_rilsy/otvet_1","k":"gen","t":"А если психолог мне не поможет? Такое бывает. И об этом можно говорить прямо, в том числе самому психологу. Допустим, вы приходите с мыслью: «Я все время думаю, что обо мне подумают». Мы обсуждаем вашу ситуацию, я предлагаю объяснение. Вы киваете, хотя внутри: «Вообще мимо. Но неудобно спорить, он же специалист». Я бы спросил: «Вам правда подходит то, что я сказал, или вы сейчас боитесь меня обидеть?» Если вы соглашаетесь из вежливости, я могу этого не заметить. Мне нужно услышать и ваше недовольство. Психологу тоже можно сказать: «Вы меня не поняли».","s":"Михаил, «а если психолог мне не поможет?»"},{"id":"m45","k":"live","t":"Выбирай доброго. Если ты сейчас в поиске, ходишь на свидания, у меня для тебя один совет. Выбирай доброго человека. Самый яркий и самый остроумный пусть подождут. И я не про того, кто всегда удобный и на все согласен. Я про того, кто умеет быть внимательным, заботится, замечает и не хочет делать больно даже в ссоре. Сарказм, дерзость, флирт это весело, как смотреть на фейерверк. Но когда станет сложно, когда ссора, когда стресс, сарказм будет совсем не в кассу. Фейерверк впечатляет. А когда темно и холодно, хочется сидеть у костра, в тепле. Подписывайся, тут про отношения без сказок.","s":"живой ролик m45"},{"id":"2026-10-01_02-46-10_rilsy/scenka_1","k":"gen","t":"А: Я к тебе хожу, почему меня все раздражает?\nБ: Например, что?\nА: Муж опять договорился, что в выходные едем к его маме.\nБ: Ты хочешь ехать?\nА: Я хочу спокойно собраться и никому не портить настроение.\nБ: А ехать хочешь?\nА: Нет. Но я же должна учиться спокойнее ко всему относиться.\nБ: Что тебе хочется самой?\nА: Остаться дома. Но тогда муж будет недоволен.\nБ: А сейчас кто недоволен?","s":"Юлия, первые месяцы терапии, когда «все хорошо»"},{"id":"p42","k":"live","t":"Ой, а кто это у нас тут? Люди из трудных семей? Не знаете, как жить в этом ебанутом мире? Да перестаньте. С вами уже случилось самое страшное. Помните, когда было больно, а кричать нельзя? Вы это пережили маленьким ребенком. Вы все еще боитесь осуждения, когда начинаете проявляться. Так вас тогда отвергли, никто не был на вашей стороне. Боитесь, что если все станет хорошо, отношения, деньги, то случится что-то страшное и вас накажут. Поэтому выбираете трудности и тащите чужие проблемы. Напоминаю: тогда вы просто не могли убежать из дома. А сейчас можете. Эй, оглянитесь назад. Это все прошли вы. Выжили. Вы все можете. Просто устали.","s":"живой ролик p42"},{"id":"o66","k":"live","t":"Как понять, что у тебя расстройство личности? Если ты не пролистала это видео, скорее всего, его у тебя нет. Все. Потому что при расстройстве личности человек обычно не сомневается в том, как он думает. Он не сидит и не гадает, все ли с ним в порядке. А если ты сидишь и гадаешь, то, скорее всего, у тебя просто яркие черты характера, с которыми можно прийти к психологу и разобраться. Диагноз по рилсу никто не ставит, и я тоже. Все, тема закрыта, всего хорошего.","s":"живой ролик o66"},{"id":"2026-10-01_02-46-10_rilsy/auto_1","k":"gen","t":"Это для тебя, если в субботу ты листаешь переписки и думаешь: «Кому бы написать, чтобы не выглядеть навязчивой?» Потом ругаешь себя: взрослая женщина, могла бы уже придумать, чем заняться. Ты умеешь себя занять. Убраться, сходить за продуктами, включить сериал. Только тебе хочется, чтобы кто-нибудь сам написал: «Ты как? Давай увидимся». Ты тоже помнишь о людях, спрашиваешь, как дела, предлагаешь встретиться. И устаешь каждый раз гадать: человек правда хочет меня видеть или просто соглашается? Тебе хочется знать, что о тебе вспоминают и без твоего «привет».","s":"Юлия, выходные в одиночестве"},{"id":"m17","k":"live","t":"Иногда нужно очень сильно охуеть, чтобы жизнь начала меняться. Охуеть это когда ты просыпаешься и видишь все как есть, и тебе противно, потому что ты наконец поняла правду. Больно, неприятно, но с этого все и сдвигается. Охуеть это когда видишь свой вклад: ты это выбирала, терпела и ничего не делала. Хорошая новость в том, что раз когда-то ты это выбрала, теперь можешь от этого отказаться. Охуеть это когда перестаешь ждать, что он изменится, деньги упадут с неба, проблемы решатся сами. Охуеть это когда выбираешь себя, даже если другим от этого неудобно. Эгоизм тут ни при чем. Ты просто вспомнила, что ты тоже есть.","s":"живой ролик m17"},{"id":"m28","k":"live","t":"Если вы не можете перестать листать рилсы и заняться делом, я как клинический психолог хочу терапевтически спросить. А может быть, вы... ну... заебались? А? Я понимаю, вы уже записали себя в конченые. Но вдруг есть маленький шанс, что вы в ахуе от нагрузки, и мозг пытается залипнуть хоть на чем-то приятном. А? Думаете все-таки, что ленивая скотина? Записала. Ну и все же предлагаю попробовать выключить. Нет, не рилсы, не пугаемся. Бесконечный поток требований к себе. Как вам идея? Вдруг дело в нем. Так, навскидку.","s":"живой ролик m28"},{"id":"b16","k":"live","t":"Он не ответил на сообщение два часа\nЯ до терапии: он меня разлюбил, я слишком навязчивая, надо удалить сообщение\nЯ после терапии: он на работе\nЯ после терапии через пять минут: но вдруг все-таки разлюбил\nТерапия работает. Просто не сразу","s":"живой ролик b16"},{"id":"m12","k":"live","t":"Умное говно, которое вам подают под соусом психологии: «ты сама притянула себе такого мужика». Давайте так. Мы никого не притягиваем. Мы просто живем свою жизнь, мы не управляем потоками вселенной и не знаем, кто к нам придет. Самое опасное в этой фразе, что она заставляет копаться в себе в поисках причины чужого говна. А почему я его притянула? А что со мной не так? Может, у меня с мамой плохие отношения? Стоп. В ваших руках другое. Оставить этого человека в жизни или вышвырнуть его нафиг. Сколько времени вы позволили ему остаться и на каких условиях.","s":"живой ролик m12"},{"id":"m10","k":"live","t":"Когда люди говорят, что им не нужен психолог, они чаще всего добавляют: «я и так про себя все знаю и понимаю». Да, я тоже когда-то была проработанная, все прекрасно понимала. Вы можете вбить свой запрос в поиск, и он подберет вам вот столько книг. Как стать богаче, как построить отношения, как стать уверенней. Спросите чат-бота, он вам столько объяснений выдаст, что не унесете. И что, что-то поменялось? Проблема давно не в том, что мы чего-то не знаем. Мы не умеем чувствовать и боимся живого контакта, потому что в нем уязвимо и больно. А меняется что-то как раз там, в живом разговоре с человеком. Иначе так и будете говорить: головой я все понимаю, а в жизни ничего не меняется. Приходите в терапию, запись по ссылке в шапке профиля.","s":"живой ролик m10"},{"id":"2026-10-01_02-46-10_rilsy/rol_1","k":"gen","t":"Мужчины, жена попросила приготовить ужин? Без паники. Она рядом, справится. Сначала спросите, что готовить. Потом, где макароны. Даже если знаете. Важно, чтобы она участвовала. Воду налили? Уточните, сколько. Закипела? Позовите жену посмотреть. Пачку не читайте, жена быстрее ответит. Теперь спросите, что будут дети. Если она скажет «то же самое», переспросите: «А они точно будут?» Отлично, она уже встала и сама достает котлеты. Стойте рядом. Спрашивайте, чем помочь. Сели есть? Обязательно скажите: «Ну вот, попросила, я приготовил. Почему ты злая?» Тарелки оставьте. Инструктаж по тарелкам вы еще не проходили, нахуй.","s":"Ольга, муж «помогает» по дому"},{"id":"2026-10-01_02-46-10_rilsy/bezslov_1","k":"gen","t":"Все, я легла. Сегодня детей укладывает муж.\nМуж: «А где их пижамы?»\nМуж: «Они говорят, что уже чистили зубы. Верить?»\nМуж: «Какую сказку читать? Эту они не хотят».\nЯ: «Бл*дь, я лежу или работаю техподдержкой?»\nМуж: «А чего ты не отдыхаешь?»","s":"Ольга, хочу просто полежать, чтобы никто ничего не хотел"},{"id":"p45","k":"live","t":"Это для тех, кто вечером лежит и думает: «я опять ничего не успела». Послушай меня минуту. Ты сегодня встала, хотя не хотелось. Отвела, приготовила, ответила, выслушала, не сорвалась. Или сорвалась, но потом извинилась. Это все делала ты. Просто в твоем списке дел этого нет, потому что ты считаешь только то, что не сделала. Я не буду говорить, что завтра станет легче. Я скажу, что уже сейчас ты делаешь очень много. А устала ты, потому что тащишь это одна и без выходных. Сохрани и включи себе, когда снова будешь лежать и считать.","s":"живой ролик p45"},{"id":"c53","k":"live","t":"А: (давит бутылку) Пытаюсь выдавить майонез. Опять кетчуп.\nБ: Так это же кетчуп. Возьми майонез.\nА: Мне нужен майонез из этой бутылки.\nБ: Зачем?\nА: Может, я просто мало стараюсь. Рано или поздно должно получиться.\nБ: Дави сколько хочешь. Это кетчуп.\nА: Я еще разок попробую.\nБ: Ладно. Майонез будет тут, если что.\nА: (давит) Давай, давай!","s":"живой ролик c53"},{"id":"2026-10-01_02-46-10_rilsy/monolog_1","k":"gen","t":"«Говорите себе у зеркала: я уверенный человек». Я не люблю этот совет. С ним легко начать ждать: вот поверю в себя, тогда и рот открою.\n\nНа совещании у вас есть идея. Вы уже три раза проговорили ее в голове, но молчите. Вдруг глупость? И потом еще ругаете себя: даже настроиться нормально не смог.\n\nА откуда возьмется уверенность, если вы каждый раз молчите и так и не узнаете, что будет, если высказаться?\n\nВолнение может остаться. Но после разговора у вас появится конкретный опыт: я волновался, высказался, меня выслушали.\n\nВы уже это делали.","s":"Михаил, «уверенность надо в себе воспитать»"},{"id":"2026-10-01_02-30-03_rilsy/tema_1","k":"gen","t":"Если даже прогулке вы придумываете цель, кому вы потом собираетесь отчитываться?\n\nПроветрить голову, набрать шаги, послушать полезный подкаст. Просто выйти, потому что захотелось, как будто недостаточно. Нужна уважительная причина потратить час своей жизни.\n\nЯ бы тут спросила: вам вообще привычно делать что-то только потому, что ВАМ хочется?\n\nЕсли в семье ваши желания постоянно проверяли на пользу, вы могли научиться их защищать. Зачем тебе танцы? Что даст эта поездка? Уроки уже сделаны? Постепенно к каждому «хочу» прилагается объяснительная.\n\nИ вот вы уже взрослая, выходной ваш, никто над душой не стоит. Но объяснительная все еще нужна.\n\nСериал выбираете на английском, чтобы заодно учить язык. В кафе берете ноутбук: вдруг получится что-то поделать. К вечеру вспоминаете, что сегодня сделали, и судорожно ищете хоть что-нибудь полезное. Иначе день просран, даже если вам было хорошо.\n\nБл*ть, даже удовольствие должно предъявить результаты.\n\nТак можно прекрасно знать свои цели и теряться от вопроса «чего вам сейчас хочется?». Потому что цель вы умеете обосновать. А желание полежать и смотреть в окно перед кем защищать?\n\nВ такие моменты вопрос к себе простой: «Мне самой жалко этого часа или я боюсь, что кто-то назовет меня бесполезной?»","s":"Ольга, не умею просто жить: без цели, плана и достижений мне плохо, отдых кажется пустой тратой времени"},{"id":"2026-10-01_02-46-10_rilsy/tg_1","k":"gen","t":"Уверенность приходит после\n\nЖдать уверенности перед первым шагом можно годами. Потому что вы ждете чувства, которое появляется, когда у вас уже есть опыт: «Я попробовал. Было страшно. Я справился».\n\nУ мозга есть привычка опираться на то, что с вами уже происходило. Если вы каждый раз откладываете трудный разговор, ему просто нечего вспомнить в вашу пользу. Откуда взяться мысли «я справлюсь», если до попытки дело так и не дошло?\n\nВот вы хотите написать, что предложенное время вам неудобно. Набрали сообщение. Перечитали. «Вдруг решат, что я капризничаю? Ладно, подстроюсь».\n\nСообщение удалено. Стало легче. Но вы так и не узнали, что случилось бы, если бы вы попросили перенести встречу. Поэтому в следующий раз снова страшно.\n\nЯ не люблю, когда самооценку пытаются лечить аффирмациями у зеркала. Можно сколько угодно говорить себе «я уверенный человек». Только вечером вы вспомните, как опять побоялись отправить обычное сообщение.\n\nНачать можно с небольшой просьбы, которую вы давно откладываете. Не обязательно сразу идти на самый трудный разговор в вашей жизни.\n\nИ здесь важно: вам могут отказать. Вы попросили, услышали ответ, расстроились и решили, что делать дальше. Оказалось, что отказ можно пережить.\n\nУверенный человек тоже думает: «А вдруг плохо отреагируют?» У него просто уже есть опыт, что он выдержит чужую реакцию.\n\nВы можете отправить сообщение с дрожащими руками. Оно все равно будет отправлено.","s":"Михаил, жду, когда станет не страшно, и тогда начну"},{"id":"2026-10-01_02-46-10_rilsy/doska_1","k":"gen","t":"«Скажу да, лишь бы от меня отстали». Знакомая мысль?\nКоллега просит доделать задачу вечером. У вас свои планы, но уже крутится: «Откажу, решит, что на меня нельзя положиться».\nВы говорите: «Ладно, присылай». И сразу становится легче. Все, объясняться не придется, коллега доволен.\nВот это облегчение и закрепляет привычку. Вы еще даже задачу не открыли, а уже получили награду за согласие: тревога стихла. Злость на себя придет позже.\nПри следующей просьбе снова хочется сказать «да».","s":"Михаил, почему трудно отказать"},{"id":"2026-10-01_02-46-10_rilsy/poslanie_1","k":"gen","t":"Это для тех, кто вечером злится на мужа и тут же себя ругает: «Он ведь помог. Какого черта я опять недовольна?» Вы попросили его постирать. Рассказали, что с чем можно класть. Потом он из ванной: «А какой режим?» Потом вы напомнили развесить. И вот он постирал, а вы свои дела опять отложили. Блядь, конечно, вы злитесь. Вам хочется хоть одно дело целиком убрать из головы. Совет «просто попроси» меня бесит именно поэтому. Муж здесь живет. Стирка тоже его дело. Вы уже весь день помните, объясняете, напоминаете. Даже когда делает он, помнить обо всем приходится вам.","s":"Ольга, мама, которая вечером считает, что опять ничего не успела"},{"id":"m07","k":"live","t":"Дети, у которых было сложное детство, очень много думают. Про таких говорят: живут в своей голове. Но я добавлю одну вещь, как психолог, который много работает с такими людьми. Если человек очень много думает, скорее всего, он очень мало чувствует. Потому что он научился прятаться от всего пиздеца в голову. Анализировал обстановку дома, настроение родителей. Там было безопасно, только там был контроль. А чувствовать было больно, страшно и одиноко. Так что бесконечное обдумывание часто способ не встречаться с тревогой. В следующий раз, когда заметишь, что опять жуешь эту мыслительную жвачку, спроси себя по-доброму: котенок, а какое чувство я сейчас не хочу чувствовать? Если узнал себя, в описании есть еще.","s":"живой ролик m07"},{"id":"2026-10-01_02-07_rilsy/tema_1","k":"gen","t":"Вы сделали семь дел из восьми и легли спать с ощущением, что опять нихрена не успели.\n\nВроде мелочь, да? Один пункт остался. Но вы уже лежите под одеялом и считаете, во сколько завтра встать, чтобы его закрыть. Желательно до работы. Чтобы дальше идти по плану.\n\nСемь готовых дел? Ну это само собой. А вот восьмое, сука, почему висит?\n\nИногда за этим стоит привычка засчитывать себе сделанное только тогда, когда закончено ВСЕ. Пока хоть что-то осталось, вы чувствуете себя человеком, который недоработал. И отдыхаете с этим ощущением. Если вообще удается.\n\nОтправили отчет, вспомнили про непрочитанное сообщение. Ответили на сообщение, заметили посуду. Уже засыпаете, и тут мысль: «Я же английским сегодня так и не позанималась».\n\nУстали вы вполне по-настоящему. Только внутри усталость ничего не доказывает.\n\nИ вы продолжаете, потому что очень хочется наконец лечь спокойно. Без претензий к себе.\n\nПроблема в том, что список пополняется быстрее, чем вы его закрываете. Спокойно лечь снова придется завтра.\n\nА семь сделанных дел вам когда-нибудь засчитают?","s":"Ольга, я достигаторша и перфекционистка, выгораю, но остановиться не могу"}];const KEY='turing-2026-10-01_02-54-17';let A={};try{A=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

document.getElementById('score').textContent=shown?('угадано '+ok+' из '+done.length+(done.length?' ('+Math.round(ok*100/done.length)+'%)':'')):(done.length+' из '+D.length+' отмечено')}
document.getElementById('reveal').onclick=()=>{shown=!shown;document.getElementById('reveal').textContent=shown?'Спрятать ответы':'Показать ответы';render()};
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,answers:A},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='turing-2026-10-01_02-54-17.json';a.click()};
