<main id="m"><p class="n">Читай как подписчик в ленте. Отмечай чутьем, не разбирай по словам. Половина текстов от живых психологов, половина от нейросети.</p></main>
<script>
const D=[{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_money_1","k":"gen","t":"«Я больше всех работаю. Почему я еще должна выпрашивать повышение?»\n\nВам хочется, чтобы он САМ заметил, сколько вы делаете, и предложил больше денег.\n\nПотому что тогда вы поверите: «Меня здесь ценят». А если пришлось просить, в голове сразу: «Ну да, выпросила. Сам бы он мне ничего не предложил».\n\nИ вот вы опять берете задачу, которую больше некому делать. Заканчиваете после работы. Начальник пишет «спасибо, выручили», и вы думаете: «Ну теперь он точно видит».\n\nЧерез месяц денег столько же. Задач уже больше. Бл*ть, хоть бы раз это «спасибо» в зарплату превратилось.\n\nИдти просить теперь еще обиднее. Вы столько сделали, а вам предлагают самой объяснять, почему вы заслуживаете больше.\n\nТак разговор о зарплате становится проверкой: насколько вы важны этому человеку? Если он сам предложит повышение, значит, важны. Если молчит, значит, можно еще постараться.\n\nОх, девочки. Начальник при этом вполне может думать: вас все устраивает. Вы же соглашаетесь на новые задачи и про деньги ничего не говорите. Он доволен. Вы ждете, когда он наконец оценит.\n\nНа встречу про зарплату стоит идти с тем, как выросла ваша работа и какую сумму вы хотите за нее получать. Просьба о повышении сама по себе ничего не говорит о том, насколько вас ценят. Это станет понятнее по тому, как с вами обсудят деньги.","s":"Ольга, стыдно просить повышение, хотя работаю больше всех"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_mama_1","k":"gen","t":"Вы накричали на ребенка, а теперь лежите рядом и думаете: «Какая же я ужасная мать».\n\nА сколько часов надо себя ненавидеть, чтобы завтра стать мамой, которая спокойно выдержит любое «не хочу»? До двух ночи хватит или лучше вообще не спать?\n\n«Но если я себя не отругаю, я опять сорвусь».\n\nДа вы себя уже так отругали, что страшно вспомнить. Почему же вчерашняя ругань не помогла сегодня?\n\nВы пытаетесь наказать себя так сильно, чтобы НИКОГДА больше не злиться на ребенка. Вспоминаете его лицо, когда повысили голос. Он уже спит, а вы снова прокручиваете эту минуту. Даже чай себе налить как будто стыдно. «Он плакал из-за меня, а я тут отдыхать собралась».\n\nБл*ть, даже после тяжелого дня вам теперь нельзя просто посидеть.\n\nСамонаказание дает ощущение, что вы что-то делаете: поняли, раскаялись, значит, в следующий раз удержитесь. Только утром ребенок снова отказывается одеваться. Вы снова торопитесь. И сил у вас ровно столько же, только теперь еще страшно: «Вдруг я опять начну орать».\n\nНо ненависть к себе не добавляет ни сна, ни помощи. Другой взрослый даже может не знать, насколько вы уже вымотаны. Вы ведь сами себе все объяснили: «Просто я плохая».\n\nКогда ребенок успокоится, договоритесь с близким взрослым о конкретном времени, когда он полностью берет заботу о нем на себя. Без ваших подсказок из соседней комнаты. Вам нужна возможность выдохнуть до следующего срыва, и просить об этом можно уже сейчас.","s":"Ольга, я злюсь на ребенка, а потом ненавижу себя за это"},{"id":"m56","k":"live","t":"Я психолог, и это не помешало мне обосраться. Поделюсь историей своего некрасивого успеха. В теории я знаю, что любой рост идет вместе со стыдом и страхом. Только знание не освобождает от того, чтобы все это прожить. С начала месяца у меня начало получаться то, к чему я шла. Как думаете, я обрадовалась? Да, конечно. Но честно, страха и стыда оказалось больше. Мне не хотелось никому рассказывать, начались бессонницы, а вчера я просто плакала от того, что у меня получается. Раньше в этом месте я сдувалась и возвращалась в точку ноль. Сейчас мне до одури страшно, мне стыдно, но я иду дальше. И для меня это большая победа.","s":"живой ролик m56"},{"id":"m45","k":"live","t":"Выбирай доброго. Если ты сейчас в поиске, ходишь на свидания, у меня для тебя один совет. Выбирай доброго человека. Самый яркий и самый остроумный пусть подождут. И я не про того, кто всегда удобный и на все согласен. Я про того, кто умеет быть внимательным, заботится, замечает и не хочет делать больно даже в ссоре. Сарказм, дерзость, флирт это весело, как смотреть на фейерверк. Но когда станет сложно, когда ссора, когда стресс, сарказм будет совсем не в кассу. Фейерверк впечатляет. А когда темно и холодно, хочется сидеть у костра, в тепле. Подписывайся, тут про отношения без сказок.","s":"живой ролик m45"},{"id":"psikhologd#1","k":"live","t":"Взросление: Примирение через любовь\nВ финале «Бао» мать и взрослый сын вместе готовят пельмени. Это продолжения, нового этапа их отношений. Взросление не означает разрыва, а сепарация — не конец любви. Это переход к новому типу связи, где есть место и близости, и свободе. Мать учится принимать сына как взрослого, а сын ценит её любовь, возвращаясь, чтобы разделить с ней простые радости.\nПсихоанализ учит нас, что взросление — это всегда баланс между зависимостью и автономией. Если в детстве ребёнок получил достаточно тепла и поддержки, он может смело шагнуть в мир, зная, что у него есть надёжный тыл. Для матери этот процесс требует мужества: отпустить — значит довериться, что любовь не исчезнет, даже если ребёнок уходит.\nСлова поддержки для Вас\nЕсли вы, как мать из «Бао», боитесь отпустить своего ребёнка, помните: ваша любовь — это фундамент, который навсегда останется с ним. Отпуская, вы не теряете, а даёте ему крылья, зная, что он вернётся, потому что вы научили его ценить дом. Если вы — сын или дочь, стремящиеся к самостоятельности, не бойтесь идти вперёд. Ваше взросление — не предательство, а дар, который вы возвращаете миру, оставаясь связанными с теми, кто вас вырастил. Любовь не исчезает, она трансформируется, становясь глубже и свободнее.","s":"живой пост, канал psikhologd"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_mif_1","k":"gen","t":"«Психолог просто слушает и кивает за мои деньги». Если этим все и ограничивается, я тоже спрошу: за что тут платить?\n\nНо посмотрите. Вы рассказываете, что опять взяли чужую работу. Коллега попросил, вы согласились, сидели до ночи. «Ну неудобно же отказать».\n\nИ вот психолог задерживается на этом «неудобно». Что случится, если откажете? Коллега решит, что вы плохой человек? Почему его просьбы достаточно, чтобы вы отменили свои планы?\n\nНу вот, пришли пожаловаться на коллегу. И обнаружили, что сами считаете любой отказ чем-то постыдным.\n\nПри этом вы вправе понимать, над чем вы вместе работаете и зачем он задает эти вопросы.","s":"Михаил, «психолог просто слушает и кивает за мои деньги»"},{"id":"c26","k":"live","t":"А (критик): Как же я себя ненавижу. Ничего не достигла, сижу на работе и даже сосредоточиться не могу. Какая я жалкая. Все коллеги нормально живут, семьи, улыбаются, а я...\nБ: Так, стоп. О чем мы говорили на сессии? Самокритика.\nА: Ну допустим.\nБ: Критик долбит, чтобы я была продуктивной. Работает?\nА: Нет. Сил вообще нет.\nБ: Хорошее в голове сейчас не найду, это понятно. Тогда просто встану, подышу воздухом пять минут.\nА: Может, поможет.\nБ: Как же сложно.","s":"живой ролик c26"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_malysh_1","k":"gen","t":"Хорошая моя, вас просят помочь, вы уже еле стоите, но отказать страшно? Сердечко стучит: «Сейчас обидится. Потом вообще со мной разговаривать перестанет».\n\nВнутри у вас звоночек. Он научился звенеть, когда близкий человек недоволен. Особенно если раньше за вашим «нет» следовало молчание, пока вы не уступите.\n\nТеперь подруга просит приехать. Вы хотите остаться дома. И уже набираете: «Да, конечно».\n\nБлядь, вы еще даже не отказали, а уже испугались, что вас бросят.\n\nЗвоночек торопит: «Соглашайтесь, скорее!»\n\nМожно сказать, что сегодня вы не приедете.\n\nПодруга может расстроиться из-за вашего отказа и завтра снова вам позвонить.","s":"Ольга, почему так страшно сказать «нет»"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_teen_1","k":"gen","t":"Слайд 1: Подросток закрыл дверь и больше не разговаривает\n\nСлайд 2: Вы стучите в комнату: «Как день прошел?» В ответ: «Нормально». Спрашиваете еще что-нибудь, и подросток уже раздражается. Вы ведь просто хотели поговорить. А теперь даже непонятно, как к собственному ребенку подойти.\n\nСлайд 3: Если разговоры регулярно заканчиваются советами или замечаниями, подросток заранее ждет продолжения. Расскажешь про двойку, придется объяснять, почему не подготовился. Про ссору с другом, услышишь, что сам виноват. Поэтому на вопрос «Как дела?» он старается ответить так, чтобы вопросов больше не было.\n\nСлайд 4: «Нормально», «не знаю», «ничего».\n\nКороткие ответы помогают быстрее закончить разговор. Подросток уже знает: скажешь, что устал, начнут выяснять, от чего. Ведь «ты только в школе был». Ох, после такого объяснять свою усталость второй раз совсем не хочется.\n\nСлайд 5: «Я же сказал, ничего не случилось».\n\nВы замечаете, что подросток расстроен, и спрашиваете снова. Он отрицает все еще громче. Рассказать ему сейчас трудно: придется вспоминать неприятное, отвечать на вопросы, еще и успокаивать вас. Проще остаться в комнате.\n\nСлайд 6: «Можно я спокойно поем?»\n\nПодросток вышел на кухню, а вы наконец можете спросить про оценки и невыполненные дела. Даже за ужином придется объясняться. В следующий раз он заберет тарелку к себе.\n\nСлайд 7: Чем меньше подросток рассказывает, тем сильнее вы тревожитесь и тем больше спрашиваете. Он начинает избегать даже обычных разговоров: вдруг опять дойдет до учебы? Так вы оба хотите спокойного общения, но каждый новый вопрос заканчивается закрытой дверью.\n\nСлайд 8: Предложите подростку попить с вами чай и оставьте школьные вопросы на другой разговор. Пусть он сможет посидеть рядом, даже молча, без необходимости рассказывать, что произошло.","s":"Михаил, подросток закрылся в комнате и не разговаривает"},{"id":"s47","k":"live","t":"Если у твоей девушки тревожная привязанность, вот три вещи, которые помогут ее понять. Первое. Когда ее накрывает, она может казаться агрессивной и слишком эмоциональной. В ее семье чувства не слышали, и она научилась кричать громче, чтобы ее услышали. Унизить тебя она не хочет. Второе. Она просит много контакта, потому что боится, что ты уйдешь. Ей нужно убедиться, что ты правда рядом. Контроль тут ни при чем. Третье. Она может устроить ссору в людном месте и ударить по больному. Знай, что ей в этот момент безумно страшно. А когда ребенку страшно, его берут на руки и успокаивают. Подписывайся, тут прокачиваем отношения.","s":"живой ролик s47"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_drug_1","k":"gen","t":"Друг неделями не отвечает, а потом пишет «мне очень плохо», и вы уже спрашиваете, когда ему удобно созвониться.\n\nХотя еще вчера думали: «Все, больше первым писать не буду». Но тут же человеку плохо. Свое недовольство можно отложить.\n\nИ вместе с тревогой за него приходит облегчение: он про вас помнит. Вы ему нужны. Значит, дружба еще есть.\n\nКогда вы скучали по человеку, его просьба о помощи ощущается как возвращение близости. Вы снова разговариваете по вечерам, знаете, что у него происходит. Даже появляется мысль: «Наконец-то нормально общаемся».\n\nПотом он мирится с партнером, находит работу, начинает выбираться из своей истории. Вы пишете: «Как ты?» Получаете «Все отлично!» и снова узнаете о его жизни из сторис, как все.\n\nТак, а куда делись ваши разговоры?\n\nВы можете искренне хотеть помочь и одновременно надеяться: теперь он останется, будет интересоваться вами, предложит встретиться. Поэтому каждый раз готовы забыть, сколько ваших сообщений осталось без ответа.\n\nПостепенно даже про свое трудно рассказать. У него расставание, какие тут ваши проблемы на работе. А когда у него все хорошо, до разговора опять не доходит.\n\nСама просьба о помощи еще не говорит о том, сколько места у вас в жизни друг друга. Это становится видно потом, когда помощь уже не нужна.\n\nЕсли узнаете эту историю, предложите встретиться в спокойный период. И скажите, что вам хочется общаться и тогда, когда у него все хорошо. Вам ведь тоже нужен друг, которому можно позвонить со своими новостями.","s":"Михаил, друзья пропадают, когда у них все хорошо, и появляются, когда плохо"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_zlost_1","k":"gen","t":"«Хорошие девочки не злятся»\n\nС этим я категорически не согласна. Очень удобно получается для всех, кроме самой девочки.\n\nТы говоришь: «Я вообще никогда не злюсь». Но после разговора с мамой почему-то хочется выключить телефон. После просьбы коллеги доделать за нее работу болит голова. Ты соглашаешься, а потом лежишь и думаешь: «Почему опять я?»\n\nУ тебя есть объяснение для каждого. Мама переживает. Коллега устала. Ты понимаешь, почему они так поступают, и считаешь, что теперь злиться нельзя. Ведь у них причины! А твое «мне это надоело» даже рассматривать как-то неловко.\n\n«Она же тебе добра желает».\nИ ты снова слушаешь, что тебе пора похудеть или родить. Потом еще ругаешь себя: «Она заботится, чего я завелась?» Можно понимать ее намерения и злиться на ее слова. Одновременно.\n\n«Из-за такой ерунды?»\nДа, чашку можно помыть. Только ты уже просила убирать за собой. И вчера просила. Злость появилась еще до этой чашки, когда твою просьбу в очередной раз пропустили мимо ушей.\n\n«Будь умнее, промолчи».\nКак интересно: от тебя опять ждут, что ты все проглотишь. А тому, кто тебя задел, можно ничего в себе не менять.\n\nЕсли злиться для тебя означает быть плохой, ты начинаешь искать в себе вину раньше, чем успеваешь понять, что тебя обидело. «Я придираюсь. Я слишком чувствительная». Только обида никуда не девается.\n\nТы отвечаешь за то, что делаешь со своей злостью. За оскорбления, угрозы, удар. Само чувство никому не причиняет вреда и не требует оправданий.\n\nТебе не нужно сначала доказать, что он плохой.","s":"Юлия, «я вообще никогда не злюсь»"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_gnezdo_1","k":"gen","t":"Дети уехали. Зачем теперь вставать?\n\nЕсли после отъезда детей вы просыпаетесь и думаете: «И что мне теперь делать весь день?» Эти слова для вас.\n\nДела, конечно, есть. Работа, магазин, стирка. Только раньше вы знали, ради чего торопитесь домой. По дороге прикидывали, что приготовить на ужин. Теперь можно задержаться сколько угодно. И от этого почему-то хочется плакать.\n\nА потом вы себя ругаете: «Сами же хотели, чтобы они стали самостоятельными. Вот и радуйтесь. У людей настоящие проблемы».\n\nВот еще, теперь и на тоску нужно получить право.\n\nВы годами вставали, потому что кому-то нужно было помочь собраться, что-то напомнить, куда-то отвезти. Даже когда дети стали старше, вы знали, кто сегодня придет домой. Это давало дню понятный смысл без долгих размышлений.\n\nИ вы уже сделали огромную работу. Дети выросли, у них появилась своя жизнь. Но ваша привычная жизнь тоже изменилась. Утром больше нет той спешки, от которой вы так уставали. А вместе с ней исчезло ощущение: «Без меня тут никак».\n\nСвободное время появилось сразу. Собственные желания после многих лет «потом, сейчас некогда» так быстро не возвращаются. Поэтому вопрос «зачем вставать?» может пугать даже человека, который очень рад за своих детей.\n\nЯ бы не стал требовать от вас немедленно найти хобби и наслаждаться свободой.\n\nВы можете радоваться за детей и все равно плакать, когда возвращаетесь в тихую квартиру.","s":"Михаил, дети выросли и уехали, а я не знаю, зачем теперь вставать утром"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_rod_1","k":"gen","t":"Четыре признака для тех, чья мама обижается, если ей не звонить каждый день.\nПервое. Вы заранее готовите оправдания. Еще работаете, а уже думаете: «Скажу, что совещание затянулось».\nВторое. Мамин вздох отменяет ваш отдых. Собирались смотреть сериал, но теперь выясняете: «Мам, ну что опять?» Блядь, вечер уже занят.\nТретье. Вам трудно закончить разговор. Уже нечего рассказывать, но страшно первыми положить трубку: вдруг решит, что надоела.\nЧетвертое. Вы злитесь, когда у мамы все хорошо. Звоните после работы, готовитесь выслушивать претензии, а она весело рассказывает про соседку.\nМама уже забыла, что обиделась. А вы весь день переживали, как ее успокоить.","s":"Ольга, мама обижается, если я не звоню каждый день"},{"id":"m10","k":"live","t":"Когда люди говорят, что им не нужен психолог, они чаще всего добавляют: «я и так про себя все знаю и понимаю». Да, я тоже когда-то была проработанная, все прекрасно понимала. Вы можете вбить свой запрос в поиск, и он подберет вам вот столько книг. Как стать богаче, как построить отношения, как стать уверенней. Спросите чат-бота, он вам столько объяснений выдаст, что не унесете. И что, что-то поменялось? Проблема давно не в том, что мы чего-то не знаем. Мы не умеем чувствовать и боимся живого контакта, потому что в нем уязвимо и больно. А меняется что-то как раз там, в живом разговоре с человеком. Иначе так и будете говорить: головой я все понимаю, а в жизни ничего не меняется. Приходите в терапию, запись по ссылке в шапке профиля.","s":"живой ролик m10"},{"id":"m12","k":"live","t":"Умное говно, которое вам подают под соусом психологии: «ты сама притянула себе такого мужика». Давайте так. Мы никого не притягиваем. Мы просто живем свою жизнь, мы не управляем потоками вселенной и не знаем, кто к нам придет. Самое опасное в этой фразе, что она заставляет копаться в себе в поисках причины чужого говна. А почему я его притянула? А что со мной не так? Может, у меня с мамой плохие отношения? Стоп. В ваших руках другое. Оставить этого человека в жизни или вышвырнуть его нафиг. Сколько времени вы позволили ему остаться и на каких условиях.","s":"живой ролик m12"},{"id":"dnevnik_psihologa#1","k":"live","t":"Родная страна — не просто точка на карте. Это\nконтейнер\n: язык, коды, ощущение «я свой/своя».\nИ когда человек уезжает, он теряет прежде всего этот контейнер. В этот момент активируется та же система привязанности, что и в отношениях с матерью.\nМы часто говорим: мама и деньги, мама и стыд, мама и отношения. Но задумывались ли вы, что отношения с матерью влияют и на проживание эмиграции?\nПочему в одной стране одни чувствуют возможности, а другие — холод и отвержение? Потому что эмиграция — это\nвторичная сепарация:\nона либо повторяет ранний сценарий, либо даёт шанс его завершить.\nЕсли ранняя сепарация была\nподдержана\n— человек может горевать и адаптироваться. Если\nтравматичной\n— новая страна бессознательно переживается как материнский объект: «меня не принимают» или «я должна заслужить право быть здесь».\n3 марта\nна\nбесплатном\nвебинаре Анна расскажет, как материнская фигура влияет на взрослую жизнь и как это видеть в терапии.\nТакже — подробнее о специализации, стартующей в апреле.\n\nРегистрация","s":"живой пост, канал dnevnik_psihologa"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_vybor_1","k":"gen","t":"«Он толком не пишет, а я все равно жду именно его».\n\nЕсли вы привыкли добиваться внимания, чужое равнодушие становится задачей: «Вот понравлюсь ему, значит, со мной все нормально».\n\nОн три дня молчит. Вы уже злитесь, собираетесь забить. Потом прилетает «как ты?», и вы улыбаетесь в телефон. Блять, всего два слова! А у вас такое облегчение, будто он наконец сказал, что хочет быть с вами.\n\nВы на минуту перестали сомневаться в себе. Он вспомнил, значит, вы ему нужны.\n\nВы уже хотите получить от него подтверждение, что вас можно любить. И когда он снова пропадает, приходится добиваться этого заново.","s":"Ольга, почему я снова выбираю тех, кто меня не выбирает"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_pereezd_1","k":"gen","t":"Четыре привычки тех, кто год живет в новом городе и все еще без друзей.\nПервое. После встречи тебе кажется: «Все как-то поверхностно». Поговорили про работу, выпили кофе. Но ведь с подругой дома ты могла говорить обо всем.\nВторое. Ты стесняешься написать без повода. Смешное видео отправляешь старым друзьям. Новым знакомым пока только по делу.\nТретье. Тебя утомляет рассказывать о себе. Опять объяснять, где работала, почему переехала. Ну сколько можно знакомиться, хочется уже дружить!\nЧетвертое. Отмена встречи для тебя означает: «Я ей неинтересна». Даже если человек предложил другой день, тебе уже хочется отказаться.\nТы ждешь, что с новыми людьми сразу будет так же легко, как с теми, кто знает тебя десять лет.","s":"Юлия, переехала в другой город и за год ни с кем не подружилась"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_vopros_2","k":"gen","t":"А: Я не знаю, о чем говорить на первой сессии.\nБ: Что хочется сказать сейчас?\nА: Мне плохо. Но это как-то глупо звучит.\nБ: Почему глупо?\nА: У всех проблемы. Я вас только загружу.\nБ: Боишься, что мне надоест тебя слушать?\nА: Да. Вы же тоже живой человек.\nБ: Конечно. И я пришла тебя слушать.\nА: А если я буду ныть и повторяться?\nБ: Ты уже заботишься, чтобы мне было удобно.\nА: Да я со всеми так. Вдруг надоем.\nБ: А кто тогда слушает тебя?","s":"Юлия, «а о чем вообще говорить на первой сессии?»"},{"id":"psy_and_the_city#3","k":"live","t":"«Не могу без тебя!»\n\nЕсли этап автономии не прожит, часто возникает откат. Партнер раздражает, расстраивает и переодически выводит из себя, но мысль о расставании вызывает панику.\nВместо «могу быть одна» появляется «без тебя я не справлюсь».\nВозвращается страх потери, усиливается тревога\n,\nотношения становятся напряжёнными и эмоционально нестабильными.\nЭто состояние легко перепутать с сильной любовью. На самом деле это зависимость. В ней много страсти, слёз, драм и примирений, но мало спокойствия.\nПартнёр становится источником безопасности, а не выбором.\nФраза «я без тебя не могу» звучит романтично только в кино.В жизни за ней часто стоит страх одиночества и потеря опоры на себя.","s":"живой пост, канал psy_and_the_city"},{"id":"s55","k":"live","t":"Вот что люди с депрессией хотели бы, чтобы вы понимали. Первое. Депрессия не выбор и не вопрос силы воли. Человек не может просто взять себя в руки. Второе. Когда он отвечает через несколько дней или в последний момент отменяет встречу, дело в его состоянии. На вас он не злится. Третье. Причины не всегда видны со стороны. Бывает, снаружи все нормально, и от этого ему не легче. Четвертое. Вам может казаться, что он плохо старается. Но встать с кровати, принять душ, ответить на сообщение сейчас для него как мешки ворочать. И пятое. Это все тот же человек. Его характер и чувства никуда не делись, просто ему очень тяжело. И сейчас ему поддержка нужна больше, чем когда-либо.","s":"живой ролик s55"},{"id":"olga_prokopova_s#1","k":"live","t":"Тут, девочки, пару дней назад я прочитала в новостях инициативу о том, чтобы принять у нас закон против домашнего насилия.\n\nМеня это удивило, ибо я почему-то была уверена, что у нас этот закон есть. Не знаю откуда такая уверенность,  наверное от здравого смысла.\nИ тут сегодня вижу другую новость. И в этой новости прекрасно (нет) всё. Следим за текстом:\n\"Председатель комитета Госдумы по защите семьи Нина Останина...\" - Мисс государственная заботушка о семье\n\"...заявила, что запрет домашнего насилия заставит россиян отказаться от вступления в брак.«Парни будут бояться» «импульсивных» заявлений в полицию от женщин и откажутся от брака\"\nЧего бл%ть? Прям вот заявила?\nНу давайте попробуем прочитать это с позиции здравого смысла, я думаю это звучит примерно так:\nОстанина: \"Вы что а&уели запрещать домашнее насилие? Ведь мужчины ради этого женятся,  а без этого не будут\"\nСюр!\n\n\n\nУ меня тоже есть заявление:\nА давайте перестанем в государственных масштабах считать мужчин пугливыми ланями, которые боятся женщин,  и одновременно козлами с поносом, которые ну никак не могут сдерживаться в своих порывах! Может тогда и они (мужчины) перестанут приписывать себе это поведение как нормальное, а?!","s":"живой пост, канал olga_prokopova_s"},{"id":"p42","k":"live","t":"Ой, а кто это у нас тут? Люди из трудных семей? Не знаете, как жить в этом ебанутом мире? Да перестаньте. С вами уже случилось самое страшное. Помните, когда было больно, а кричать нельзя? Вы это пережили маленьким ребенком. Вы все еще боитесь осуждения, когда начинаете проявляться. Так вас тогда отвергли, никто не был на вашей стороне. Боитесь, что если все станет хорошо, отношения, деньги, то случится что-то страшное и вас накажут. Поэтому выбираете трудности и тащите чужие проблемы. Напоминаю: тогда вы просто не могли убежать из дома. А сейчас можете. Эй, оглянитесь назад. Это все прошли вы. Выжили. Вы все можете. Просто устали.","s":"живой ролик p42"},{"id":"o66","k":"live","t":"Как понять, что у тебя расстройство личности? Если ты не пролистала это видео, скорее всего, его у тебя нет. Все. Потому что при расстройстве личности человек обычно не сомневается в том, как он думает. Он не сидит и не гадает, все ли с ним в порядке. А если ты сидишь и гадаешь, то, скорее всего, у тебя просто яркие черты характера, с которыми можно прийти к психологу и разобраться. Диагноз по рилсу никто не ставит, и я тоже. Все, тема закрыта, всего хорошего.","s":"живой ролик o66"},{"id":"m07","k":"live","t":"Дети, у которых было сложное детство, очень много думают. Про таких говорят: живут в своей голове. Но я добавлю одну вещь, как психолог, который много работает с такими людьми. Если человек очень много думает, скорее всего, он очень мало чувствует. Потому что он научился прятаться от всего пиздеца в голову. Анализировал обстановку дома, настроение родителей. Там было безопасно, только там был контроль. А чувствовать было больно, страшно и одиноко. Так что бесконечное обдумывание часто способ не встречаться с тревогой. В следующий раз, когда заметишь, что опять жуешь эту мыслительную жвачку, спроси себя по-доброму: котенок, а какое чувство я сейчас не хочу чувствовать? Если узнал себя, в описании есть еще.","s":"живой ролик m07"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_vopros_1","k":"gen","t":"А зачем мне психолог, если у меня есть подруги? Чтобы у вас было место, где не надо заботиться еще и о дружбе. Вот вы рассказываете подруге про ссору с мужем. Она злится вместе с вами. И тут вы начинаете: «Ну вообще он хороший, просто устал». Блин, вы еще сами злитесь, но уже его защищаете. Вам ведь потом с ним жить, вместе к подруге в гости ходить. И вы заранее думаете, как она будет на него смотреть. У психолога этой общей компании нет. Можно договорить, что вас бесит, без срочного «зато он хороший».","s":"Ольга, «а зачем мне психолог, если у меня есть подруги»"},{"id":"s37","k":"live","t":"Всем привет, меня зовут Паша, и вот пять причин выбрать меня своим психологом. Причина первая. Я понимаю, о чем вы, когда вы говорите «кринж», «вайб» и «пикми». И «получку» с «хохмой» тоже понимаю. Причина вторая. У меня медицинское образование, я врач-психиатр и психотерапевт. Я знаю, почему крышечка подтекает и когда с этим надо к врачу. Причина третья. Со мной можно по-разному. Можем на сессии разобраться, почему попросить денег для вас как утонуть, а можем просто посидеть в тишине, потому что все заебало. Причина четвертая. Я не из тех, кто мило кивает. Я буду рядом, с пониманием, но не на стороне привычек, которые ломают вам жизнь. Причина пятая. Принимаю очно во Владивостоке и онлайн. Пишите в личку в телеграм.","s":"живой ролик s37"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_humor_1","k":"gen","t":"Привет! Вы сейчас свободны? Я просто поболтать. Тут с мужем опять. Я вам переписку переслала, там немного, сорок скринов. Посмотрите, кто из нас прав.\n\nТолько честно, как психолог. Как подруга вы меня уже поддержали, спасибо.\n\nА можно я ему дам ваш номер? Вы ему объясните, он вас послушает. Меня он вообще не слышит.\n\nЗавтра заняты? А во сколько заканчивается последняя консультация? Вот после нее и созвонимся. Вам же уже никуда не надо.\n\nИ, пожалуйста, все между нами. Я даже вашей подруге ничего не рассказываю. Ну, кроме Кати.\n\nЗа консультацию платить? Блядь, я же вам тоже мемы присылаю.","s":"Ольга, когда ты психолог, а подруги приходят «просто поговорить»"},{"id":"psyosychenko#4","k":"live","t":"КТО ОТВЕЧАЕТ ЗА УДОВОЛЬСТВИЕ ЖЕНЩИНЫ В ИНТИМНОЙ БЛИЗОСТИ — ТОЛЬКО МУЖЧИНА?\n— Ты должен сделать так, чтобы мне было хорошо.\n— А ты сама знаешь, что именно для тебя «хорошо»?\n…тишина.\nОчень часто разговор о близости выглядит именно так.\nОдин должен\nДОГАДАТЬСЯ\n.\nВторая —\nЖДАТЬ\n, что её почувствуют без слов.\nНо реальность сложнее.\n— Если мужчина любит, он сам всё поймёт.\n— А если женщина\nМОЛЧИТ\n, как он поймёт?\nПауза.\nПотому что правда, которую редко говорят вслух:\nУДОВОЛЬСТВИЕ ЖЕНЩИНЫ — ЭТО НЕ ТОЛЬКО ОТВЕТСТВЕННОСТЬ МУЖЧИНЫ.\nМужчина отвечает за\nВНИМАНИЕ, БЕРЕЖНОСТЬ, ЖЕЛАНИЕ БЫТЬ РЯДОМ\n, за готовность\nСЛЫШАТЬ И ЧУВСТВОВАТЬ\n.\nНо женщина отвечает за другое.\n— за\nКОНТАКТ СО СВОИМ ТЕЛОМ\n— за\nЧЕСТНОСТЬ СО СВОИМИ ЖЕЛАНИЯМИ\n— за способность\nГОВОРИТЬ\n, что ей нравится и что нет\nПарадокс в том, что многие женщины хотят, чтобы мужчина\nУГАДАЛ\n.\nНо при этом сами никогда не исследовали своё тело, свои реакции и свои границы.\nИ тогда появляется странная динамика:\n— мужчина\nПЫТАЕТСЯ УГАДАТЬ\n— женщина\nЖДЁТ\n— оба\nРАЗОЧАРОВЫВАЮТСЯ\nА близость начинает превращаться в напряжение.\nЗрелая близость начинается в тот момент, когда ответственность становится\nОБОЮДНОЙ\n.\nКогда мужчина НЕ\nБОИТСЯ СПРАШИВАТЬ.\nИ когда женщина\nНЕ БОИТСЯ ГОВОРИТЬ.\nКогда это уже не игра в угадайку,\nа\nДИАЛОГ ДВУХ ВЗРОСЛЫХ ЛЮДЕЙ.\nИ тогда происходит важный сдвиг.\nЖенщина перестаёт быть «объектом удовольствия»,\nа становится\nСОАВТОРОМ БЛИЗОСТИ.\nА это совсем другой уровень отношений","s":"живой пост, канал psyosychenko"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_car_1","k":"gen","t":"Слайд 1: Подруга с депрессией снова отменила встречу\n\nСлайд 2: Вы уже собрались выходить, и тут от подруги: «Прости, сегодня не смогу».\n\nХочется ответить: «Давай все равно, тебе надо развеяться». Вы хотите помочь. Но теперь ей нужно еще и объяснять, почему она не может даже посидеть с вами в кафе.\n\nСлайд 3: При депрессии даже душ и короткий разговор могут требовать огромных усилий. А тут еще надо убедить близких, что тебе действительно плохо.\n\nБл*ть, как тяжело оправдываться, когда сил едва хватает встать с кровати.\n\nСлайд 4: Подруга отменяет планы в последний момент.\n\nКогда вы договаривались, она могла искренне хотеть встретиться. Сегодня собраться и выйти оказалось слишком трудно. Она и сама может злиться на себя: «Опять всех подвела». Уговоры добавляют еще одну задачу: отказать вам и выдержать ваше разочарование.\n\nСлайд 5: Подруга читает сообщения и молчит.\n\nОтветить бывает трудно даже любимому человеку. Нужно подобрать слова, рассказать, как дела, задать вопрос в ответ. Сообщение «Я думаю о тебе, отвечать сейчас необязательно» позволяет ей получить ваше тепло без еще одного обязательства.\n\nСлайд 6: На вопрос «Чем тебе помочь?» подруга отвечает: «Не знаю».\n\nЕй нужно придумать помощь и решить, о чем допустимо попросить. Это тоже силы. Конкретное предложение проще: например, привезти ужин. Тогда достаточно согласиться или отказаться.\n\nСлайд 7: При встрече подруга шутит и выглядит оживленной.\n\nС вами ей действительно может стать легче на какое-то время. Это НЕ означает, что депрессия прошла. После встречи сил опять может не быть. «Ты же вчера нормально смеялась» заставляет ее доказывать, что сегодняшнее состояние тоже настоящее.\n\nСлайд 8: Если подруге с депрессией тяжело общаться, предложите одну небольшую помощь, которую реально можете оказать. Например, привезти еду в удобное ей время.\n\nИ оставьте ей возможность отказаться без объяснений. Ей должно быть легко принять вашу помощь и легко сказать, что сегодня она не готова.","s":"Ольга, как поддержать подругу с депрессией и не сделать хуже"},{"id":"psikhologd#2","k":"live","t":"Финал: шрамы в тишине\nФинал фильма — это психоаналитический тупик. Подрик и Колм, израненные, стоят у моря. Пожар, смерть Дженни, гибель Доминика — всё это оставляет их в пустоте, где нет примирения, только шрамы. Колм, лишившийся пальцев и дома, цепляется за музыку, как за иллюзию смысла. Подрик, потерявший друга и осла, обретает в гневе новую силу, но за ней — бездна. Этот финал — как сессия анализа, где нет ответов, только вопросы о том, как жить с болью.\nПочему это разрывает душу?\nФильм заставляет чувствовать: ужас, что мы не успеем, боль, когда нас отталкивают, и тоску по простому теплу — будь то друг или осёл. Он спрашивает: что держит нас в живых? Любовь? Творчество? Или способность выстоять, когда всё горит?","s":"живой пост, канал psikhologd"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_men_1","k":"gen","t":"Четыре признака папы, который привык скрывать переживания и срывается на детей.\nПервое. После неприятного разговора на работе вы говорите: «Да плевать». Но всю дорогу домой спорите с начальником в голове.\nВторое. На вопрос жены «Что случилось?» отвечаете: «Ничего». Рассказывать стыдно: «Подумает, что я ною».\nТретье. Детский шум становится последней каплей. Утром спокойно слушали эту игрушку, вечером готовы выкинуть ее в окно. Ну и зачем ей вообще десять мелодий?\nЧетвертое. Вас особенно раздражают детские слезы: «Из-за такой ерунды?» Себе вы тоже говорите: «Хватит ныть», даже когда действительно тяжело.\nВы можете злиться, но сказать «мне больно» вам до сих пор стыдно.","s":"Михаил, мужчины не плачут, а потом срываются на детей"},{"id":"r38","k":"live","t":"Служба поддержки встретившихся со взрослой жизнью, здравствуйте. Что у вас случилось? Девушка, дышите спокойно. Так. Вы хотите быть успешной бизнесвумен и еще, чтобы вас содержали. Поняла. И чтобы любили такой, какая вы есть, и похудеть до сорока пяти. Так. А еще никому ничего не доказывать, но чтобы бывший увидел и захлебнулся. Поняла. И мужчину с характером, но чтобы рот не открывал и делал, что скажете. А, еще на детокс-ретрит, и бургер вот этот съесть тоже не против. И отношения без драмы. Но чтобы он бежал за вами под дождем и всем за вас морды набил. Вот, уже спокойнее говорите. Все нормально, девушка, не вижу никаких противоречий. Обращайтесь.","s":"живой ролик r38"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_post_1","k":"gen","t":"Ты открываешь переписку с ним, хотя точно знаешь: нового сообщения нет.\n\nВ голове уже: «Если бы хотел, написал бы». И все, вечер занят. Даже когда смотришь сериал, телефон лежит экраном вверх. Вдруг напишет.\n\nТы ждешь подтверждения, что он сам о тебе вспомнил. Без напоминания. Что ему тоже хочется поговорить с тобой.\n\nСообщение уже придумала, но останавливаешь себя: «Ну сколько можно самой». Если напишешь, потом ведь начнется: «Он просто ответил из вежливости. Я бы молчала, он бы и не вспомнил».\n\nИ вот ты проверяешь телефон, чтобы узнать, нужна ли ты ему. Только ответа на такой большой вопрос одно сообщение дать не может.\n\nОн наконец пишет. Ты радуешься, отвечаешь. Через пару минут замечаешь: про твой день не спросил. «Почему я у него все спрашиваю, а он у меня ничего?» Ну вот, сообщение дождались. Теперь ждем вопроса.\n\nНаписал, но поздно. Ответил тепло, но вдруг он со всеми такой.\n\nПри этом тебе действительно важно, чтобы он тоже проявлял инициативу. Особенно если ты постоянно начинаешь разговор и предлагаешь увидеться.\n\nПосмотри на ваше общение за последние недели: он сам ищет возможности побыть с тобой? Это скажет о его интересе больше, чем то, кто первым написал сегодня вечером.","s":"Юлия, он не пишет первым, а я весь вечер жду и проверяю телефон"},{"id":"d36","k":"live","t":"Большие тети-дяди тебе этого не скажут, поэтому у тебя сердечко бо-бо, животик бо-бо, и бабайки в голове пугают. Сейчас тетя расскажет, как бабайкам дать пизды.\nТы думаешь, что бабайки настоящие. Если нападешь на бабайку, бабайки дадут тебе пизды. Ты будешь маленький и беззащитный, все будут смеяться и бросят тебя.\nПоэтому ты от бабаек убегаешь. Но бабайки придуманные. Вот тут мир, вот тут ты, а вот тут твои бабайки.\nЕсли бабайки придуманные, ты на них наорешь, пошлешь нахер, и ничего не случится. Они так и останутся придуманными. Мир не меняется. Меняются глаза.","s":"живой ролик d36"},{"id":"m28","k":"live","t":"Если вы не можете перестать листать рилсы и заняться делом, я как клинический психолог хочу терапевтически спросить. А может быть, вы... ну... заебались? А? Я понимаю, вы уже записали себя в конченые. Но вдруг есть маленький шанс, что вы в ахуе от нагрузки, и мозг пытается залипнуть хоть на чем-то приятном. А? Думаете все-таки, что ленивая скотина? Записала. Ну и все же предлагаю попробовать выключить. Нет, не рилсы, не пугаемся. Бесконечный поток требований к себе. Как вам идея? Вдруг дело в нем. Так, навскидку.","s":"живой ролик m28"},{"id":"labkovskiy#2","k":"live","t":"«Здравствуйте, Михаил! Вы говорите, что с собой надо общаться как с лучшим другом, поддерживать и тд. Но что делать, если не получается? Я действительно верю в своих близких, знаю, какой классный потенциал у них есть, но когда дело касается меня — сомневаюсь. С самооценкой все в порядке, она плавает только на моментах моей сильной неуверенности в своих силах, когда недостаточно практики и «доказательств». Как отпустить «поводья», расслабиться и позволить себе делать? И реально поддерживать себя так, как и своих друзей и семью?»\nНачнём с того, что сомневаться в себе, когда вы занимаетесь чем-то новым и в чём рука ещё «не набита» — нормально. Вы же адекватный человек и понимаете, что делать всё гениально с первого раза — такая себе история.\nПообщайтесь с собой и выясните, почему у вас к себе такие жёсткие требования и откуда эта чрезмерная требовательность вообще взялась? Если вы ориентируетесь на профи и думаете «как я могу встать рядом с ними, они такие классные, а я ещё ничего не умею», то нужно понять важную вещь — АБСОЛЮТНО каждый человек с чего-то начинал.\nФредди Меркьюри, к примеру, сначала играл на школьных вечерах и юбилеях, а не сразу на многотысячных аренах. Генри Форд, основавший Ford Motor, до этого потерпел крах с первой компанией по производству автомобилей. А Мерил Стрип на кастинге в Кинг-Конга и вовсе обозвали уродиной, но именно ей принадлежит рекорд по количеству номинаций на Оскар.\nЕсли у вас что-то не получается и вы где-то проваливаетесь, это не значит, что вы «тупой/недостаточно талантливый/какой-то не такой». Работайте над собой, поддерживайте и любите себя, продолжайте набираться опыта, перенимайте его у тех, кто вдохновляет вас.\nИ поймите главное — идеальный момент не настанет. Не будет такого дня, в который у вас вдруг раз и получится. Самореализация — это путь с ошибками и провалами. И пройти его вы должны, будучи в первую очередь опорой самой(самому) себе.\nУспехов!","s":"живой пост, канал labkovskiy"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_malysh_2","k":"gen","t":"Милая, ты обижаешься на маму, а потом ругаешь себя: «Она столько для меня сделала. Как я могу?»\n\nПредставь, что в пальчике заноза. Больно. А тебе говорят: «Ты что, хочешь сказать, мама плохая?» И ты прячешь ручку. Пусть лучше болит, только бы маму не расстроить.\n\nЕсли в ответ на твою обиду мама сама обижалась, ты училась сразу брать свои слова обратно. Даже когда она тебя правда задела. Ох, тебе еще и маму утешать пришлось.\n\nТебе не нужно оправдывать каждое мамино слово.","s":"Юлия, обида на маму, которую стыдно признать"},{"id":"psyosychenko#5","k":"live","t":"ЧТО ТАКОЕ ЭМОЦИИ И ДЛЯ ЧЕГО ОНИ НУЖНЫ\nЭМОЦИИ\n— это базовая система внутренних сигналов. Это то, как психика мгновенно реагирует на события, людей, слова и ситуации. Они появляются быстрее, чем мы успеваем их осознать, и выполняют важную функцию ориентирования в жизни.\nЭмоции показывают, что для Вас безопасно, что ценно, а что вызывает напряжение или дискомфорт.\nЗЛОСТЬ\nможет сигнализировать о нарушении границ,\nТРЕВОГА\n— о неопределённости или возможной угрозе,\nГРУСТЬ\n— о потере или завершении чего-то важного.\nРАДОСТЬ\n, наоборот, указывает на ресурс и удовлетворение потребностей.\nВажно понимать: эмоция — это первичная реакция тела и нервной системы. А\nЧУВСТВО\nформируется, когда к этой эмоции добавляется мысль и смысл, который Вы ей придаёте. Например, Вы можете почувствовать тревогу, а затем мысль «со мной что-то не так» или «я не справлюсь» превращает её в более сложное переживание. Так эмоция и интерпретация соединяются в чувство.\nЕсли эмоции подавлять или игнорировать, они не исчезают. Они остаются в теле, накапливаются в напряжении, в раздражении или в неожиданных реакциях на близких. Когда же Вы начинаете замечать их и давать им место, появляется больше ясности и внутренней устойчивости.\nКАК ВЫ ЧАЩЕ ВСЕГО ПРОЖИВАЕТЕ СВОИ ЭМОЦИИ — СРАЗУ ВЫРАЖАЕТЕ ИЛИ ДОЛГО ДЕРЖИТЕ ВНУТРИ?","s":"живой пост, канал psyosychenko"},{"id":"m52","k":"live","t":"Он скинул тебе смешной рилс, а ты пролистала и даже реакцию не поставила. Вроде мелочь, да? Но если такие мелочи повторяются, они влияют на отношения намного сильнее, чем кажется. Отношения держатся на мелочах, которыми вы друг друга окликаете. Тот самый смешной рилс. Фотка заката из окна. Сообщение «как ты там». В них всегда есть что-то непроговоренное: я про тебя помню, я тебя вижу, ты мне важна. Понятно, ситуации бывают разные, мы не идеальны. Но если раз за разом никто не откликается, внутри появляется: я не интересна, я одна в этих отношениях. Отношения разрушают маленькие вещи, когда тебя раз за разом не замечают. Так что не жадничай на «ахаха» в ответ на рилс.","s":"живой ролик m52"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_tg_1","k":"gen","t":"Вас похвалили, а вы ждете подвоха\n\nРуководитель пишет: «Хорошая работа». Вы отвечаете «спасибо» и тут же думаете: «В следующий раз точно поймет, что я ничего не умею».\n\nПохвала прошла мимо. Уже вечером вы прикидываете, как справиться со следующей задачей, чтобы никто ничего не заподозрил. Хотя с этой вы справились. И с предыдущей тоже.\n\nПосмотрите, как вы объясняете себе хороший результат. «Просто задача была легкая». «Коллега подсказал». «Я же три вечера все перепроверял, иначе бы точно наделал ошибок».\n\nПомощь коллеги считается. Лишние часы считаются. Ваши умения? Нет, их пока недостаточно доказали.\n\nВот тут я бы поспорил. Чтобы воспользоваться подсказкой, тоже нужно понимать, что делаешь. И подготовка входит в работу. Почему все, что вы сделали для результата, вдруг стало доказательством вашей несостоятельности?\n\nТак страх и сохраняется. Перед новой задачей вы снова думаете: «Теперь точно не вывезу». Сидите допоздна, проверяете уже проверенное. Когда все получается, говорите себе: «Хорошо, что так долго возился». И убеждаетесь, что без этих лишних часов вас обязательно раскроют.\n\nПри таком подсчете можно годами хорошо работать и чувствовать себя человеком, которого взяли по ошибке.\n\nКогда обсуждаете выполненную задачу, называйте свой вклад конкретно: что вы решили, с чем разобрались. Помощь коллеги тоже упомяните. Только свою часть работы из рассказа не вычеркивайте.","s":"Михаил, боюсь, что на работе меня раскусят и поймут, что я ничего не умею"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_razvod_1","k":"gen","t":"Слайд 1: «Ради детей я должна остаться с мужем»\n\nСлайд 2: Вы снова ждете, пока дети уснут, чтобы поговорить с мужем. Днем улыбались, вечером опять поругались. Уже думаете о разводе, потом вспоминаете детей и отменяете собственные мысли. Бл*дь, как будто детям вместе со свидетельством о рождении выдали право запретить вам уходить.\n\nСлайд 3: Сохранить брак ради детей звучит заботливо. Но у этой заботы появляется опасное продолжение: «Я столько терпела ради вас». Ребенок слышит, что мама годами жила плохо из-за него. Теперь ему еще и надо доказать, что все это было не зря.\n\nСлайд 4: Получил плохую оценку, нагрубил, захотел жить отдельно. И тут: «Я тебе всю жизнь отдала». Ох, девочки. Детство с таким счетом очень тяжело оплачивать.\n\nСлайд 5: За решение остаться вместе отвечаете вы с мужем. Дети НЕ должны оправдывать его хорошими оценками или благодарностью. И чинить ваши отношения им тоже не под силу. Даже если ребенок очень просит, чтобы вы никогда не разводились.\n\nСлайд 6: Само по себе «мы остались вместе» ничего не говорит о том, как живется детям. Важнее, могут ли родители прекратить унижать друг друга, договариваться и менять то, из-за чего дома страшно или тяжело.\n\nСлайд 7: Когда будете решать, оставаться ли с мужем, назовите конкретно, что должно измениться в вашей совместной жизни и готов ли он участвовать. Одного «ради детей» для такого решения недостаточно.","s":"Ольга, «ради детей надо сохранить семью»"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_stud_1","k":"gen","t":"«До сдачи диплома неделя. Почему я опять весь день его не пишу?»\n\nОткрываешь файл, читаешь первые две строчки. И надо срочно убрать со стола. Очень вовремя, конечно.\n\nЕсли тебе важно написать диплом так, чтобы никто не придрался, садиться за него страшно. Пока текста нет, можно думать: «Я бы хорошо написала, если бы собралась». А готовый текст уже можно прочитать и раскритиковать.\n\nИ ты тянешь. Когда останется одна ночь, появится объяснение: «Просто времени не хватило».\n\nТы уже боишься оценки за диплом, который еще даже не написан.","s":"Юлия, не могу сесть за диплом, хотя времени почти нет"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_body_1","k":"gen","t":"Если перед отпуском ты смотришь в зеркало и думаешь: «Ну куда я с таким животом», я хочу тебе кое-что сказать. Ты надеваешь купальник и уже представляешь, как кто-то посмотрит, что подумает, с кем тебя сравнит. Еще никуда не приехала, а уже столько претензий к себе. Даже боком повернулась, чтобы проверить, насколько все «плохо». Да что ж такое, тебе уже и перед зеркалом нельзя выдохнуть. От этого собственное тело раздражает еще сильнее. Тебе не нужно сначала понравиться себе, чтобы поехать отдыхать.","s":"Юлия, ненавижу себя в зеркале перед отпуском"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_mif_2","k":"gen","t":"«Просто перестань себя накручивать».\n\nЕсли бы это делалось по команде, ты бы уже перестала. Уж поверь, желающих часами мучиться из-за того, что еще даже не случилось, немного.\n\nНо после такого совета появляется еще одна мысль: «Я сама все порчу. Ничего же не произошло, зачем я опять об этом думаю?»\n\nИ вот ты уже тревожишься и ругаешь себя за тревогу. Отлично помогли, конечно.\n\nТы боишься перестать переживать. Потому что тогда будто потеряешь бдительность и что-нибудь пропустишь.\n\nОтправила важное письмо. Перечитала. Все правильно. Закрыла почту, но через пять минут снова открываешь: «А вдруг я все-таки что-то напутала?» Хочется проверить еще раз, чтобы потом не сказать себе: «Знала же, что надо было посмотреть».\n\nПока переживаешь, кажется, что делаешь все возможное, чтобы ничего плохого не случилось. Поэтому совет «перестань накручивать» звучит почти как «да брось ты, пусть все идет как идет».\n\nНо ты отвечаешь за содержание письма. Проверить его перед отправкой вполне достаточно. Даже если после проверки тебе все еще страшно.\n\nТебе не нужно оставаться в тревоге до вечера, чтобы доказать, что ты серьезно относишься к своей работе.","s":"Юлия, «тревогу надо просто перестать накручивать»"},{"id":"psy_and_the_city#5","k":"live","t":"«Лучше без тебя?»\n\nИногда после череды конфликтов и разочарований появляется мысль, которая пугает своей честностью\n«а может, одной было бы проще?»\nНе потому что любовь исчезла, а потому что хочется тишины, воздуха и пространства для себя.\nЭто стадия, где человек начинает возвращать себе границы. Проверяет а кто я вообще в этих отношениях? Есть ли у меня место, желания, жизнь, не связанная только с партнёром? Здесь легко перепутать здоровую автономию с бегством. Но разница в том, что\nавтономия не разрушает связь, а делает ее устойчивее.\nОтношения, которые не выдерживают этой стадии, часто держались только на слиянии. А те, что выдерживают, переходят на другой уровень более зрелый и честный.","s":"живой пост, канал psy_and_the_city"},{"id":"2026-10-02_04-02-26_rilsy_gip_h2/r_dengi_1","k":"gen","t":"Зарплата выросла, а вы все так же думаете: «Вдруг денег не хватит?»\n\nВы рассчитывали, что начнете больше зарабатывать и наконец выдохнете. Доход поднялся. На обычные расходы хватает, откладывать получается. Почему тогда опять страшно?\n\nЕсли после каждого роста дохода вы находите новую причину переживать, у вас могло закрепиться одно условие: «Я успокоюсь, когда буду уверен, что денег хватит при любых обстоятельствах».\n\nВот это «при любых» и портит всю затею. Вы требуете от денег гарантии на всю будущую жизнь. Очень хотелось бы такую купить. Но кто ее продает?\n\nНа месяц хватает? Хорошо. А если потеряю работу? Есть запас? А если искать придется целый год?\n\nИ вот вы вечером считаете, сколько сможете прожить без зарплаты. Получается вполне приличный срок. На минуту легче. Потом вспоминаете, что машина уже старая. Пересчитываете с учетом ремонта.\n\nПри этом сегодня вас никто не увольнял, машина ездит. Но вы уже мысленно оплачиваете все неприятности сразу.\n\nТак сумма, с которой вы обещали себе успокоиться, постоянно растет. Ведь к ней каждый раз добавляется еще одно «а вдруг».\n\nЗаранее определите, на какие расходы и на какой срок вам нужен запас.\n\nДаже когда этот запас собран, тревога может остаться. Само по себе это еще не означает, что денег мало.","s":"Михаил, зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит"}];const KEY='turing-2026-10-02_04-17-59_gip_h2_s1';let A={};try{A=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let shown=false;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}};

D.forEach((d,i)=>{const c=document.createElement('div');c.className='c';const a=A[d.id];
const right=a&&((a==='live')===(d.k==='live'));
c.innerHTML='<div class="n">Текст '+(i+1)+' из '+D.length+'</div><div class="t">'+esc(d.t)+'</div>'
+'<div class="row"><button data-a="live" class="'+(a==='live'?'on':'')+'">Живой человек</button><button data-a="gen" class="'+(a==='gen'?'on':'')+'">Нейросеть</button></div>'
+(shown?'<div class="ans '+(a?(right?'ok':'bad'):'')+'">'+(d.k==='live'?'Живой':'Нейросеть')+' · '+esc(d.s)+(a?(right?' · угадала':' · не угадала'):'')+'</div>':'');
c.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{A[d.id]=b.dataset.a;save();render()});m.appendChild(c)});
const done=D.filter(d=>A[d.id]);const ok=done.filter(d=>(A[d.id]==='live')===(d.k==='live')).length;
document.getElementById('score').textContent=shown?('угадано '+ok+' из '+done.length+(done.length?' ('+Math.round(ok*100/done.length)+'%)':'')):(done.length+' из '+D.length+' отмечено')}
document.getElementById('reveal').onclick=()=>{shown=!shown;document.getElementById('reveal').textContent=shown?'Спрятать ответы':'Показать ответы';render()};
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,answers:A},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='turing-2026-10-02_04-17-59_gip_h2_s1.json';a.click()};
render();
