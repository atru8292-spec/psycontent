<main id="m"><p class="n">Читай как подписчик в ленте. Отмечай чутьем, не разбирай по словам. Половина текстов от живых психологов, половина от нейросети.</p></main>
<script>
const D=[{"id":"olga_prokopova_s#1","k":"live","t":"Тут, девочки, пару дней назад я прочитала в новостях инициативу о том, чтобы принять у нас закон против домашнего насилия.\n\nМеня это удивило, ибо я почему-то была уверена, что у нас этот закон есть. Не знаю откуда такая уверенность,  наверное от здравого смысла.\nИ тут сегодня вижу другую новость. И в этой новости прекрасно (нет) всё. Следим за текстом:\n\"Председатель комитета Госдумы по защите семьи Нина Останина...\" - Мисс государственная заботушка о семье\n\"...заявила, что запрет домашнего насилия заставит россиян отказаться от вступления в брак.«Парни будут бояться» «импульсивных» заявлений в полицию от женщин и откажутся от брака\"\nЧего бл%ть? Прям вот заявила?\nНу давайте попробуем прочитать это с позиции здравого смысла, я думаю это звучит примерно так:\nОстанина: \"Вы что а&уели запрещать домашнее насилие? Ведь мужчины ради этого женятся,  а без этого не будут\"\nСюр!\n\n\n\nУ меня тоже есть заявление:\nА давайте перестанем в государственных масштабах считать мужчин пугливыми ланями, которые боятся женщин,  и одновременно козлами с поносом, которые ну никак не могут сдерживаться в своих порывах! Может тогда и они (мужчины) перестанут приписывать себе это поведение как нормальное, а?!","s":"живой пост, канал olga_prokopova_s"},{"id":"m12","k":"live","t":"Умное говно, которое вам подают под соусом психологии: «ты сама притянула себе такого мужика». Давайте так. Мы никого не притягиваем. Мы просто живем свою жизнь, мы не управляем потоками вселенной и не знаем, кто к нам придет. Самое опасное в этой фразе, что она заставляет копаться в себе в поисках причины чужого говна. А почему я его притянула? А что со мной не так? Может, у меня с мамой плохие отношения? Стоп. В ваших руках другое. Оставить этого человека в жизни или вышвырнуть его нафиг. Сколько времени вы позволили ему остаться и на каких условиях.","s":"живой ролик m12"},{"id":"labkovskiy#2","k":"live","t":"«Здравствуйте, Михаил! Вы говорите, что с собой надо общаться как с лучшим другом, поддерживать и тд. Но что делать, если не получается? Я действительно верю в своих близких, знаю, какой классный потенциал у них есть, но когда дело касается меня — сомневаюсь. С самооценкой все в порядке, она плавает только на моментах моей сильной неуверенности в своих силах, когда недостаточно практики и «доказательств». Как отпустить «поводья», расслабиться и позволить себе делать? И реально поддерживать себя так, как и своих друзей и семью?»\nНачнём с того, что сомневаться в себе, когда вы занимаетесь чем-то новым и в чём рука ещё «не набита» — нормально. Вы же адекватный человек и понимаете, что делать всё гениально с первого раза — такая себе история.\nПообщайтесь с собой и выясните, почему у вас к себе такие жёсткие требования и откуда эта чрезмерная требовательность вообще взялась? Если вы ориентируетесь на профи и думаете «как я могу встать рядом с ними, они такие классные, а я ещё ничего не умею», то нужно понять важную вещь — АБСОЛЮТНО каждый человек с чего-то начинал.\nФредди Меркьюри, к примеру, сначала играл на школьных вечерах и юбилеях, а не сразу на многотысячных аренах. Генри Форд, основавший Ford Motor, до этого потерпел крах с первой компанией по производству автомобилей. А Мерил Стрип на кастинге в Кинг-Конга и вовсе обозвали уродиной, но именно ей принадлежит рекорд по количеству номинаций на Оскар.\nЕсли у вас что-то не получается и вы где-то проваливаетесь, это не значит, что вы «тупой/недостаточно талантливый/какой-то не такой». Работайте над собой, поддерживайте и любите себя, продолжайте набираться опыта, перенимайте его у тех, кто вдохновляет вас.\nИ поймите главное — идеальный момент не настанет. Не будет такого дня, в который у вас вдруг раз и получится. Самореализация — это путь с ошибками и провалами. И пройти его вы должны, будучи в первую очередь опорой самой(самому) себе.\nУспехов!","s":"живой пост, канал labkovskiy"},{"id":"s41","k":"live","t":"Пять признаков, что человек прошел в жизни настоящий ад. Первый. Ему неловко, когда о нем искренне заботятся или делают комплименты. Забота для него что-то непривычное, с подвохом: я теперь что-то должен. Второй. Ему физически больно просить о помощи. Он лучше умрет. Третий. Он считывает настроение людей за полсекунды. По голосу, по тому, как человек моргает, как открывает дверь. Четвертый. Он не умеет отдыхать без чувства вины. Если ничего не делает, кажется, что сейчас кто-то придет и накажет за безделье. И пятый. Когда в жизни все хорошо, ему жутко тревожно. Мозг привык, что тишина бывает перед настоящим лютым пиздецом. Сколько пунктов насчитали у себя?","s":"живой ролик s41"},{"id":"m28","k":"live","t":"Если вы не можете перестать листать рилсы и заняться делом, я как клинический психолог хочу терапевтически спросить. А может быть, вы... ну... заебались? А? Я понимаю, вы уже записали себя в конченые. Но вдруг есть маленький шанс, что вы в ахуе от нагрузки, и мозг пытается залипнуть хоть на чем-то приятном. А? Думаете все-таки, что ленивая скотина? Записала. Ну и все же предлагаю попробовать выключить. Нет, не рилсы, не пугаемся. Бесконечный поток требований к себе. Как вам идея? Вдруг дело в нем. Так, навскидку.","s":"живой ролик m28"},{"id":"labkovskiy#1","k":"live","t":"Всем плевать.\n«А можно я брошу работу?..»\n«Хочу быть домохозяйкой, это ужасно?..»\n«МИХАИЛ, А Я НОРМАЛЬНЫЙ?»\nДрузья мои, каждый день я получаю от вас десятки писем в Директ о том, что вы прямо точно «неправильные». «Со мной что-то не так» буквально звучит в каждом сообщении.\nЯ хочу открыть вам одну маленькую тайну.\nВСЕМ ПЛЕВАТЬ.\nПсихолог не знает, как вам «правильно жить», ведь такому на психфаке вообще не учат. Он без понятия, можно ли конкретно в вашем случае бросить вуз или нельзя, да и не ему это решать.\nЧто касается остальных, особенно тех, кто лезет с советами, своим ценным мнением и рекомендациями. Вы не поверите, но на самом деле им пофиг.\nРаботаете ли, за сколько вы снимаете квартиру и почему путешествуете, а не покупаете дачу.\nВсем по барабану, у людей своих задач полно. Единственное исключение — это родители. Им может и не плевать, но, по большому счёту, их вопросы и реакция — обычная тревожность.\nНапример, на месте «когда замуж» легко могло бы стоять «почему ты ешь так мало белка».\nДрузья мои, не надо класть себя в прокрустово ложе и пытаться свериться с миром, который якобы диктует вам правила жизни. Никто не диктует. Это вы так низко себя ставите, что вам какой угодно дегенерат из соцсетей может напеть, что ваше главное предназначение в жизни — жить на Бали и заниматься йогой.\nИ ему кстати тоже будет плевать, не поверите.\nДрузья, у нас полный sold-out вип-билетов на встречу в Москве 15-го июля.\nДобавили ещё немного доп. мест. Если вы тоже хотите встретиться со мной после лекции и в камерной атмосфере посидеть и пообщаться:\nдополнительные вип-билеты","s":"живой пост, канал labkovskiy"},{"id":"psikhologd#1","k":"live","t":"Взросление: Примирение через любовь\nВ финале «Бао» мать и взрослый сын вместе готовят пельмени. Это продолжения, нового этапа их отношений. Взросление не означает разрыва, а сепарация — не конец любви. Это переход к новому типу связи, где есть место и близости, и свободе. Мать учится принимать сына как взрослого, а сын ценит её любовь, возвращаясь, чтобы разделить с ней простые радости.\nПсихоанализ учит нас, что взросление — это всегда баланс между зависимостью и автономией. Если в детстве ребёнок получил достаточно тепла и поддержки, он может смело шагнуть в мир, зная, что у него есть надёжный тыл. Для матери этот процесс требует мужества: отпустить — значит довериться, что любовь не исчезнет, даже если ребёнок уходит.\nСлова поддержки для Вас\nЕсли вы, как мать из «Бао», боитесь отпустить своего ребёнка, помните: ваша любовь — это фундамент, который навсегда останется с ним. Отпуская, вы не теряете, а даёте ему крылья, зная, что он вернётся, потому что вы научили его ценить дом. Если вы — сын или дочь, стремящиеся к самостоятельности, не бойтесь идти вперёд. Ваше взросление — не предательство, а дар, который вы возвращаете миру, оставаясь связанными с теми, кто вас вырастил. Любовь не исчезает, она трансформируется, становясь глубже и свободнее.","s":"живой пост, канал psikhologd"},{"id":"psyosychenko#1","k":"live","t":"КОГДА РОДСТВЕННИКИ ДАВЯТ - КАК УДЕРЖАТЬ СЕБЯ И СВОИ ГРАНИЦЫ\nОн пришёл на сессию и рассказал:\n— «Родители жены буквально\nвторглись\nв наши решения по покупке новой техники для дома. Сначала казалось, что это просто советы: «Смотри, вот это удобнее», «Так дешевле», «А ты уверен, что это нужно?»… Но с каждым словом\nдавление росло\n. Мне становилось тяжело, казалось, что я теряю\nконтроль\nнад своим выбором и своей семьёй».\n— «И что вы почувствовали?» — спросила я.\n— «\nГнев\n, раздражение… и одновременно\nтревогу\n, что если скажу что-то прямо, жена обидится, родители расстроятся. Я хотел обороняться, но понимал — это приведёт к\nконфликту\n».\n— «Что сделали дальше?» — уточнила я.\n— «Я сделал\nпаузу\n. Глубоко вдохнул, спросил себя: „Что важно лично мне? Как хочу действовать?“ Потом сказал спокойно: „\nСпасибо за мнение, мы обсудим и примем решение сами\n“. Постановка границы была\nмягкой\n, без резких слов».\n— «И как это прошло?»\n— «Невероятно легко. Родители почувствовали мою\nуверенность\nи\nуважение\n. Мы не поссорились, атмосфера осталась\nдружелюбной\n. Я сам чувствовал\nспокойствие\n, и при этом сохранил своё мнение и\nконтроль\nнад своей семьёй».\nВывод:\nЧасто родственники уверены, что знают лучше, и это создаёт\nдавление\n.\nНо внутренняя опора и контакт с собой помогают:\n— услышать свои желания\n— мягко, но\nтвёрдо\nобозначить границы\n— сохранить\nмир\nи\nуважение\nвокруг\nТак мы учимся\nуправлять\nэмоциями\n, не теряя себя, и показываем, что можно сохранять себя в любых обстоятельствах.\nА как вы обычно справляетесь, когда кто-то пытается давить на ваши решения?","s":"живой пост, канал psyosychenko"},{"id":"m17","k":"live","t":"Иногда нужно очень сильно охуеть, чтобы жизнь начала меняться. Охуеть это когда ты просыпаешься и видишь все как есть, и тебе противно, потому что ты наконец поняла правду. Больно, неприятно, но с этого все и сдвигается. Охуеть это когда видишь свой вклад: ты это выбирала, терпела и ничего не делала. Хорошая новость в том, что раз когда-то ты это выбрала, теперь можешь от этого отказаться. Охуеть это когда перестаешь ждать, что он изменится, деньги упадут с неба, проблемы решатся сами. Охуеть это когда выбираешь себя, даже если другим от этого неудобно. Эгоизм тут ни при чем. Ты просто вспомнила, что ты тоже есть.","s":"живой ролик m17"},{"id":"2026-10-01_14-13-26_rilsy_krug3/r_teen_1","k":"gen","t":"Слайд 1: Подросток сидит в комнате и не разговаривает\n\nСлайд 2: Вы стучите к подростку: «Как день прошел?» Он отвечает: «Нормально», и снова закрывает дверь. Вы ведь просто хотели поговорить. Но если прошлый разговор закончился обсуждением оценок, он уже ждет продолжения: «А что по математике?»\n\nСлайд 3: На любой вопрос подросток отвечает одним словом. Когда за каждым ответом идут еще пять вопросов, он старается дать вам поменьше поводов. Даже обычное «гуляли» приходится объяснять: с кем, где, почему так долго.\n\nСлайд 4: Вы видите, что подросток расстроен, а он говорит: «Ничего не случилось». Возможно, он уже представляет ваши советы или звонок учителю. Рассказать о неприятности для него значит запустить целую историю, которую потом трудно остановить.\n\nСлайд 5: Подросток уходит к себе сразу после школы. Если на кухне его обычно встречают вопросами о домашке, комната становится местом, где можно какое-то время ничего не объяснять. И ведь вы еще даже спросить не успели. А он уже ждет проверки.\n\nСлайд 6: На ваше «Я же помочь хочу» подросток раздражается: «Оставь меня». Такая резкость обижает. Но если помощь каждый раз означает долгий разбор его ошибок, он заранее напрягается. Вы усиливаете расспросы, потому что волнуетесь. Он еще быстрее заканчивает разговор.\n\nСлайд 7: Когда подросток все-таки что-то расскажет, выслушайте его до конца и спросите, нужна ли ему ваша помощь. С советами стоит подождать. Ему важно убедиться, что после разговора с вами он сможет сам решать, что делать дальше.","s":"Михаил, подросток закрылся в комнате и не разговаривает"},{"id":"2026-10-01_14-13-26_rilsy_krug3/r_post_1","k":"gen","t":"Ты снова проверяешь телефон, хотя звук включен и его сообщение ты точно услышишь.\n\nПросто очень хочется, чтобы он написал сам. Ты уже придумала, что ему рассказать, но останавливаешь себя: «Я вчера первая писала. Сегодня пусть он».\n\nИ вот ты весь вечер ждешь подтверждения, что он тоже про тебя помнит. Без твоего напоминания. Что ему самому захотелось узнать, как ты.\n\nЗнакомо? Открываешь переписку, перечитываешь последнее сообщение. Вроде ответил тепло. Тогда почему молчит? Заходишь посмотреть, был ли в сети. Был. «На телефон время есть, на меня нет?»\n\nДа что же такое, ты уже даже злишься на себя за желание ему написать.\n\nКогда его сообщение становится доказательством, что ты ему нужна, самой начать разговор страшно. Напишешь, он ответит, и все равно останется вопрос: «А если бы я промолчала, он бы вообще вспомнил?»\n\nТак можно переписываться каждый день и все равно чувствовать себя ненужной. Потому что каждый раз ты считаешь, кто начал, и обесцениваешь его ответ: «Ну это же я написала».\n\nОдного сообщения первым тебе хватит до следующего вечера. Поэтому обсуди с ним саму инициативу в общении: тебе важно, чтобы он тоже писал и предлагал увидеться.","s":"Юлия, он не пишет первым, а я весь вечер жду и проверяю телефон"},{"id":"2026-10-01_14-13-26_rilsy_krug3/r_stud_1","k":"gen","t":"«До сдачи диплома две недели. Почему я опять ничего не написала?»\n\nТы открываешь ноутбук, ищешь еще одну статью. Потом еще одну. К вечеру у тебя двадцать вкладок и все тот же пустой документ. Ну хоть список литературы скоро можно будет отдельно защищать.\n\nСесть за текст страшно, если ты ждешь от себя сразу хорошей работы. Пока ты толком не начинала, можно думать: «Я бы нормально написала, если бы села». А тут села, старалась, перечитала. И тебе не нравится.\n\nВот этого ты и боишься. Что уже нельзя будет сказать «я просто не старалась». Придется увидеть свой текст и решить, что он показывает, насколько ты вообще способная.","s":"Юлия, не могу сесть за диплом, хотя времени почти нет"},{"id":"2026-10-01_14-13-26_rilsy_krug3/r_pereezd_1","k":"gen","t":"Четыре признака для тех, кому после переезда даже кофе выпить не с кем.\nПервое. Разговоры с новыми людьми быстро утомляют. «Опять рассказывать, кем работаю». Со старыми друзьями можно сразу говорить о своем. Тут еще попробуй объясни, почему тебя так задел звонок мамы.\nВторое. Позвать знакомую погулять кажется навязчивостью. «Мы же всего пару раз виделись». И ты ждешь, когда станете поближе, чтобы написать.\nТретье. Отказываешься от встречи, потому что придется следить за собой. Дома хочется наконец перестать подбирать слова.\nЧетвертое. Встреча прошла хорошо, а тебе все равно одиноко. «Почему я с ними какая-то чужая?» Эх, хочется сразу прийти к своим.","s":"Юлия, переехала в другой город и за год ни с кем не подружилась"},{"id":"2026-10-01_14-13-26_rilsy_krug3/r_mif_2","k":"gen","t":"«Просто перестань думать о плохом».\n\nАга, сейчас. Если бы это работало, ты бы давно перестала.\n\nОн долго не отвечает. Ты уже думаешь: «Я что-то не то сказала?» Потом вспоминаешь, что надо мыслить позитивно. «Он занят. Все нормально». На минуту легче. Потом снова хочется посмотреть, прочитал ли.\n\nИ тут ты начинаешь ругать себя: «Ну что я опять? Сама себе весь вечер испортила».\n\nБыло страшно, что он отдаляется. Добавилось: «Со мной вообще что-то не так».\n\nВот спасибо за совет. Теперь еще и виновата.\n\nТревожная мысль приходит без твоего согласия. Ты ведь не садишься вечером с планом: «Так, сегодня буду бояться, что меня разлюбили». Требовать от себя, чтобы таких мыслей вообще не было, бесполезно. Будешь только проверять: «Я уже успокоилась? Почему опять думаю об этом?»\n\nПри этом ты отвечаешь за свои поступки. Можно тревожиться и все-таки не отправлять десятое сообщение с вопросом, почему он молчит.\n\nТебе не нужно сначала полностью успокоиться, чтобы решить, как поступить.","s":"Юлия, «тревогу надо просто перестать накручивать»"},{"id":"2026-10-01_14-13-26_rilsy_krug3/r_mama_1","k":"gen","t":"«Накричала на ребенка. Теперь весь вечер себя жру».\n\nНаказывать себя за злость на ребенка. Это когда он уже спокойно возится с игрушками, а вы все еще вспоминаете, как он испугался вашего голоса. Хотели сесть попить чай, но какой тут чай. «Как я вообще могла?»\n\nЭто когда муж предлагает погулять с малышом, чтобы вы отдохнули, а вы отказываетесь. «Я и так сегодня ужасная мать. Еще и спихну его». И остаетесь дома, хотя вас уже бесит даже звук мультика.\n\nЭто когда ребенок приходит обниматься, вы прижимаете его к себе и думаете: «Бедный. Ему бы другую маму». Он к вам пришел, ему хочется побыть с вами. А вы уже мысленно нашли ему кого-то получше.\n\nВы как будто должны теперь помучиться, чтобы доказать себе: вам не похуй. Вы любите ребенка. Вам стыдно. Вы все поняли и больше так не будете.\n\nБл*дь, еще и отдых после срыва становится чем-то, чего вы недостойны.\n\nНапряжение никуда не делось, и к следующему укладыванию вы опять на пределе.\n\nЗа крик стоит попросить у ребенка прощения.","s":"Ольга, я злюсь на ребенка, а потом ненавижу себя за это"},{"id":"psy_and_the_city#1","k":"live","t":"Почему даже в браке понимание стадий не всегда приносит спокойствие\n\nКогда вы замужем не первый год,\nотношения неизбежно меняются.\nЭто не плохо. Это не «что-то пошло не так», это просто факт.\nМожно знать, что есть этапы, кризисы, переходы. Можно понимать, что романтика трансформируется, что близость становится глубже, но тише. Можно читать много об этом всем. И всё равно внутри может быть:\n\nтревога\n\nощущение отдаления\n\nбольше раздражения, чем раньше\n\nгрусть по тому «как было в начале»\n\nсомнение «это нормально или мы теряем друг друга?»\nПотому что каждый этап брака касается наших чувств очень глубоко. И тут у каждого свое:\nстрах быть ненужной, страх остаться одной внутри отношений, страх перестать быть важной.\nВ терапии\nмы не просто определяем на каком этапе пара, мы аккуратно разбираем:\n\nчто именно изменилось между вами\n\nчто изменилось внутри вас\n\nгде естественный этап брака, а где накопленная усталость или непроговорённая боль\nИногда становится легче уже от того, что вы перестаёте держать это в себе.\nЕсли вы сейчас в точке, где:\n\nотношения изменились\n\nвы стали чаще сомневаться\n\nустали все анализировать в одиночку\n\nне хотите разрушить то, что можно сохранить\nМожно разобрать это индивидуально!\n\nНапишите мне в личные сообщения\n@an_smy\nслово\n«брак»\n, и я расскажу, как проходит первая встреча.\nБывает достаточно одного честного разбора, чтобы перестать паниковать и начать понимать, что с вами происходит.","s":"живой пост, канал psy_and_the_city"},{"id":"m07","k":"live","t":"Дети, у которых было сложное детство, очень много думают. Про таких говорят: живут в своей голове. Но я добавлю одну вещь, как психолог, который много работает с такими людьми. Если человек очень много думает, скорее всего, он очень мало чувствует. Потому что он научился прятаться от всего пиздеца в голову. Анализировал обстановку дома, настроение родителей. Там было безопасно, только там был контроль. А чувствовать было больно, страшно и одиноко. Так что бесконечное обдумывание часто способ не встречаться с тревогой. В следующий раз, когда заметишь, что опять жуешь эту мыслительную жвачку, спроси себя по-доброму: котенок, а какое чувство я сейчас не хочу чувствовать? Если узнал себя, в описании есть еще.","s":"живой ролик m07"},{"id":"2026-10-01_14-13-26_rilsy_krug3/r_tg_1","k":"gen","t":"Вас хвалят, а вы ждете разоблачения\n\nОсобенно подозрительно, когда работа дается вам легко. Коллеги благодарят, руководитель доволен, а у вас в голове: «Да что я такого сделал? Это любой может».\n\nВы привыкли судить о сложности работы по тому, сколько сил она у вас отняла. Пришлось долго разбираться, переделывать, сидеть до ночи? Тогда вроде заслужили похвалу. Справились за полчаса? Значит, задача ерундовая и хвалить особенно не за что.\n\nТо есть к готовой работе еще надо приложить доказательства, что вы намучились. Серьезные требования, конечно.\n\nПредставьте: на созвоне все обсуждают задачу, но никак не могут договориться, что вообще нужно сделать. Вы задаете пару вопросов, коротко подводите итог, и наконец становится понятно, с чего начать. После встречи коллега пишет: «Спасибо, очень помогли».\n\nВы даже смущаетесь. «Я же просто спросил».\n\nДа, спросили. Вы поняли, чего не хватает для решения, и сумели это сформулировать. Вам уже привычно так делать, поэтому вы почти не замечаете этой работы.\n\nВот откуда берется ощущение «ничего не умею», даже когда задачи решаются. Все, что вы освоили, вы быстро записываете в разряд «это любой может». А доказательствами профессионализма признаете только то, что пока дается с трудом.\n\nЯ бы предложил здесь разделить два вопроса: легко ли вам было и удалось ли решить задачу. На первый вы можете ответить «да» и все равно заслуженно получить деньги и благодарность.\n\nВам правда может быть легко делать работу, которой вы уже научились.","s":"Михаил, боюсь, что на работе меня раскусят и поймут, что я ничего не умею"},{"id":"2026-10-01_14-13-26_rilsy_krug3/r_razvod_1","k":"gen","t":"Слайд 1: «Не развожусь, у нас же дети»\n\nСлайд 2: Вы уже думали, куда переехать и на что жить. Потом смотрите на детей: «Как я скажу им, что мы разводимся?»\n\nИ все, разговор с мужем опять откладывается. Как будто свидетельство о браке само умеет успокаивать детей после вашей ссоры. Вот бы.\n\nСлайд 3: Сохранять брак ради детей вы не ОБЯЗАНЫ.\n\nДети живут рядом с вами каждый день. Они слышат, как папа разговаривает с мамой. Замечают, что за ужином лучше молчать. Один адрес у родителей еще ничего не говорит о том, как ребенку дома.\n\nСлайд 4: «Я бы давно ушла, если бы не дети».\n\nВы можете сказать это подруге по телефону, пока ребенок сидит в соседней комнате. Он слышит и может решить: «Мама живет так из-за меня».\n\nБл*дь, ему ведь даже в голову не приходит, сколько у взрослых других причин оставаться вместе.\n\nСлайд 5: Это вина за мамину жизнь.\n\nРебенок старается хорошо учиться, меньше просить, лишний раз вас не расстраивать. Ему хочется, чтобы вы хотя бы из-за него радовались.\n\nСлайд 6: Вы отвечаете за свое решение о браке и за то, как обращаетесь с детьми. Детям бывает больно при разводе, и им нужна ваша поддержка.\n\nУ семейного психолога можно разобраться, готовы ли вы оба менять отношения и как помочь детям, какой бы выбор вы ни сделали.\n\nСлайд 7: Если обсуждаете с ребенком, почему остаетесь с мужем или расходитесь, уберите объяснение «ради тебя».\n\nОбъясните, что решение принимаете вы с папой. Ребенку не нужно заслуживать хорошим поведением ваше счастье или сохранение брака.","s":"Ольга, «ради детей надо сохранить семью»"},{"id":"2026-10-01_14-13-26_rilsy_krug3/r_gnezdo_1","k":"gen","t":"Дети уехали. Зачем теперь вставать?\n\nЕсли вы просыпаетесь и первым делом думаете: «И что мне сегодня делать?» Сами же себя за это ругаете. Дети устроились, у них своя жизнь. Радоваться надо. А вам пусто.\n\nДела, конечно, есть. Работа, магазин, стирка. Только раньше даже поход за хлебом был связан с кем-то: этот любит свежий, этому надо оставить на завтрак. Теперь стоите у полки и вспоминаете, что столько уже никто не съест.\n\nМожно скучать по детям и одновременно радоваться, что у них все складывается. Одно чувство другое не отменяет. Но вы еще и сердитесь на себя: «Неужели у меня своей жизни нет?»\n\nВот с этим обвинением я бы поспорил. Много лет ваша жизнь была устроена так, что каждое утро кто-то от вас чего-то ждал. Вы знали, когда вставать, куда ехать, что приготовить. Даже уставали с понятной мыслью: «Лишь бы все успеть».\n\nТеперь привычный распорядок закончился. Вместе с ним исчезло множество маленьких ответов на вопрос, ради чего вы сегодня встаете. Новые ответы еще не появились. Отсюда и растерянность, и тоска, которую трудно объяснить: вроде ничего плохого не случилось.\n\nВы уже сделали очень много. Вырастить детей до самостоятельной жизни занимает годы. Странно требовать от себя, чтобы сразу после их отъезда вы бодро придумали, как жить дальше.","s":"Михаил, дети выросли и уехали, а я не знаю, зачем теперь вставать утром"},{"id":"2026-10-01_14-13-26_rilsy_krug3/r_zlost_1","k":"gen","t":"Тебя подвели, ты еще и извинилась\n\nЕсли ты опять написала «да ничего страшного», когда человек отменил встречу за десять минут до выхода, а потом весь вечер ругала себя за испорченное настроение, у меня вопрос. Того, кто тебя подвел, тоже надо утешить? Ему ведь неудобно получилось.\n\n«Но у него были причины. Чего я завелась?»\n\nКонечно, были. У тебя тоже были причины расстроиться: ты освободила вечер, собралась и хотела увидеться. Справку о том, что встреча была тебе важна, получать нигде не нужно.\n\nТы так быстро начинаешь оправдывать другого, что собственную злость даже не успеваешь заметить. Уже ищешь, где сама виновата: слишком многого ждала, слишком близко приняла, зря вообще настроилась.\n\nЯ бы здесь задержалась на слове «слишком». Откуда ты знаешь, сколько тебе положено расстраиваться?\n\n«Не устраивай сцен». Можно сказать, что тебе неприятно, обычным голосом.\n\n«Будь умнее». Обычно после этой фразы именно тебе предлагается промолчать. Очень удобно получилось: один подвел, другая должна проявить мудрость.\n\nА после «ты слишком остро реагируешь» ты уже обсуждаешь, что с тобой не так. Про отмененную встречу все как будто забыли.\n\nЕсли ты привыкла слышать такое, злиться становится страшно. Вдруг тебя сочтут тяжелой, капризной, неблагодарной? Проще сразу сказать себе: «Сама виновата».\n\nВ следующий раз, когда тебя подведут, не спеши извиняться за свое недовольство. Можно понимать чужие причины и все равно злиться на то, как с тобой поступили.","s":"Юлия, «я вообще никогда не злюсь»"},{"id":"2026-10-01_14-13-26_rilsy_krug3/r_car_1","k":"gen","t":"Слайд 1: Подруга в депрессии не отвечает на сообщения\n\nСлайд 2: Вы пишете подруге: «Как ты сегодня?» Ответа нет. Потом отправляете: «Я переживаю». Она читает и откладывает телефон. Теперь ей нужно рассказать, как ей плохо, и еще успокоить вас. При депрессии даже на такой ответ бывает трудно найти силы.\n\nСлайд 3: Поддержка тоже может стать заданием. Нужно придумать, о чем попросить, договориться, потом поблагодарить. Подруга понимает, что вы хотите помочь. Но думает: «Сейчас начну объяснять, только устану». Поэтому молчит, хотя помощь ей нужна.\n\nСлайд 4: Подруга говорит «ничего не нужно» на ваше «обращайся, если что». Чтобы обратиться, ей придется самой организовать помощь. Решить, что купить, когда встретиться, сколько у вас времени. Бл*н, даже помощь приходится организовывать.\n\nСлайд 5: Подруга согласилась встретиться, потом отменила. Когда договаривались, ей казалось, что получится. Сегодня душ и чистая одежда уже требуют сил. А еще она думает: «Приеду и буду сидеть молча. Испорчу ей вечер». После отмены ей стыдно написать вам снова.\n\nСлайд 6: Вы принесли подруге любимую еду, а она почти не обрадовалась. При депрессии привычные приятные вещи могут перестать радовать. Она замечает вашу заботу, но улыбка не получается. И тут же думает: «Она старалась, а я даже нормально спасибо сказать не могу». Ох, еще и за это себя ругать.\n\nСлайд 7: Подруга раздражается на советы сходить погулять или посмотреть хороший фильм. Она уже слышала их и могла пробовать. Когда ей по-прежнему плохо, очередной совет звучит как «ты еще недостаточно старалась». Прогулка может поддержать. Заменить лечение депрессии она не может.\n\nСлайд 8: Предложите подруге одну конкретную помощь, например привезти готовый ужин. Сразу уточните, что вам не нужно оставаться в гостях. Ей будет проще согласиться, если ради помощи не придется собираться и весь вечер поддерживать разговор.","s":"Ольга, как поддержать подругу с депрессией и не сделать хуже"},{"id":"dnevnik_psihologa#1","k":"live","t":"Родная страна — не просто точка на карте. Это\nконтейнер\n: язык, коды, ощущение «я свой/своя».\nИ когда человек уезжает, он теряет прежде всего этот контейнер. В этот момент активируется та же система привязанности, что и в отношениях с матерью.\nМы часто говорим: мама и деньги, мама и стыд, мама и отношения. Но задумывались ли вы, что отношения с матерью влияют и на проживание эмиграции?\nПочему в одной стране одни чувствуют возможности, а другие — холод и отвержение? Потому что эмиграция — это\nвторичная сепарация:\nона либо повторяет ранний сценарий, либо даёт шанс его завершить.\nЕсли ранняя сепарация была\nподдержана\n— человек может горевать и адаптироваться. Если\nтравматичной\n— новая страна бессознательно переживается как материнский объект: «меня не принимают» или «я должна заслужить право быть здесь».\n3 марта\nна\nбесплатном\nвебинаре Анна расскажет, как материнская фигура влияет на взрослую жизнь и как это видеть в терапии.\nТакже — подробнее о специализации, стартующей в апреле.\n\nРегистрация","s":"живой пост, канал dnevnik_psihologa"},{"id":"2026-10-01_14-13-26_rilsy_krug3/r_dengi_1","k":"gen","t":"Зарплата пришла, до следующей точно хватит. Почему вы опять считаете, сколько останется после всех платежей?\n\nПостоянные проверки счета сами могут поддерживать страх, что денег не хватит. Да, именно то, чем вы пытаетесь себя успокоить.\n\nУ мозга есть привычка запоминать, после какого действия стало легче. Вы испугались, открыли приложение банка, пересчитали расходы. Выдохнули. Мозг запомнил: проверка помогла. В следующий раз снова хочется проверить, даже если с деньгами ничего не изменилось.\n\nВот вы вечером собираетесь заказать ужин. Деньги есть. Но сначала надо посмотреть остаток, вычесть коммуналку, вспомнить про страховку. Все сходится. Заказали.\n\nУтром мысль: «А вдруг я что-то забыл?» И вы снова открываете банк. Те же цифры, те же платежи. Ну сколько раз они должны сойтись, чтобы вы наконец им поверили?\n\nПостепенно даже обычная покупка требует доказательств, что вы можете себе ее позволить.\n\nДоход вырос, а привычка осталась.\n\nПопробуйте договориться с собой о конкретном времени для расчета бюджета. Если все уже посчитано и новых расходов нет, оставьте расчеты до этого времени.\n\nВы уже проверили, что денег хватит. Сегодня пересчитывать их еще раз не нужно.","s":"Михаил, зарабатываю нормально, но все равно постоянно боюсь, что денег не хватит"}];const KEY='turing-2026-10-01_14-17-33';let A={};try{A=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}

document.getElementById('reveal').onclick=()=>{shown=!shown;document.getElementById('reveal').textContent=shown?'Спрятать ответы':'Показать ответы';render()};
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,answers:A},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='turing-2026-10-01_14-17-33.json';a.click()};
