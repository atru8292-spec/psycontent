<main id="m"><p class="n">Читай как подписчик в ленте. Отмечай чутьем, не разбирай по словам. Половина текстов от живых психологов, половина от нейросети.</p></main>
<script>
const D=[{"id":"m12","k":"live","t":"Умное говно, которое вам подают под соусом психологии: «ты сама притянула себе такого мужика». Давайте так. Мы никого не притягиваем. Мы просто живем свою жизнь, мы не управляем потоками вселенной и не знаем, кто к нам придет. Самое опасное в этой фразе, что она заставляет копаться в себе в поисках причины чужого говна. А почему я его притянула? А что со мной не так? Может, у меня с мамой плохие отношения? Стоп. В ваших руках другое. Оставить этого человека в жизни или вышвырнуть его нафиг. Сколько времени вы позволили ему остаться и на каких условиях.","s":"живой ролик m12"},{"id":"o66","k":"live","t":"Как понять, что у тебя расстройство личности? Если ты не пролистала это видео, скорее всего, его у тебя нет. Все. Потому что при расстройстве личности человек обычно не сомневается в том, как он думает. Он не сидит и не гадает, все ли с ним в порядке. А если ты сидишь и гадаешь, то, скорее всего, у тебя просто яркие черты характера, с которыми можно прийти к психологу и разобраться. Диагноз по рилсу никто не ставит, и я тоже. Все, тема закрыта, всего хорошего.","s":"живой ролик o66"},{"id":"psyosychenko#1","k":"live","t":"КОГДА РОДСТВЕННИКИ ДАВЯТ - КАК УДЕРЖАТЬ СЕБЯ И СВОИ ГРАНИЦЫ\nОн пришёл на сессию и рассказал:\n— «Родители жены буквально\nвторглись\nв наши решения по покупке новой техники для дома. Сначала казалось, что это просто советы: «Смотри, вот это удобнее», «Так дешевле», «А ты уверен, что это нужно?»… Но с каждым словом\nдавление росло\n. Мне становилось тяжело, казалось, что я теряю\nконтроль\nнад своим выбором и своей семьёй».\n— «И что вы почувствовали?» — спросила я.\n— «\nГнев\n, раздражение… и одновременно\nтревогу\n, что если скажу что-то прямо, жена обидится, родители расстроятся. Я хотел обороняться, но понимал — это приведёт к\nконфликту\n».\n— «Что сделали дальше?» — уточнила я.\n— «Я сделал\nпаузу\n. Глубоко вдохнул, спросил себя: „Что важно лично мне? Как хочу действовать?“ Потом сказал спокойно: „\nСпасибо за мнение, мы обсудим и примем решение сами\n“. Постановка границы была\nмягкой\n, без резких слов».\n— «И как это прошло?»\n— «Невероятно легко. Родители почувствовали мою\nуверенность\nи\nуважение\n. Мы не поссорились, атмосфера осталась\nдружелюбной\n. Я сам чувствовал\nспокойствие\n, и при этом сохранил своё мнение и\nконтроль\nнад своей семьёй».\nВывод:\nЧасто родственники уверены, что знают лучше, и это создаёт\nдавление\n.\nНо внутренняя опора и контакт с собой помогают:\n— услышать свои желания\n— мягко, но\nтвёрдо\nобозначить границы\n— сохранить\nмир\nи\nуважение\nвокруг\nТак мы учимся\nуправлять\nэмоциями\n, не теряя себя, и показываем, что можно сохранять себя в любых обстоятельствах.\nА как вы обычно справляетесь, когда кто-то пытается давить на ваши решения?","s":"живой пост, канал psyosychenko"},{"id":"s55","k":"live","t":"Вот что люди с депрессией хотели бы, чтобы вы понимали. Первое. Депрессия не выбор и не вопрос силы воли. Человек не может просто взять себя в руки. Второе. Когда он отвечает через несколько дней или в последний момент отменяет встречу, дело в его состоянии. На вас он не злится. Третье. Причины не всегда видны со стороны. Бывает, снаружи все нормально, и от этого ему не легче. Четвертое. Вам может казаться, что он плохо старается. Но встать с кровати, принять душ, ответить на сообщение сейчас для него как мешки ворочать. И пятое. Это все тот же человек. Его характер и чувства никуда не делись, просто ему очень тяжело. И сейчас ему поддержка нужна больше, чем когда-либо.","s":"живой ролик s55"},{"id":"m28","k":"live","t":"Если вы не можете перестать листать рилсы и заняться делом, я как клинический психолог хочу терапевтически спросить. А может быть, вы... ну... заебались? А? Я понимаю, вы уже записали себя в конченые. Но вдруг есть маленький шанс, что вы в ахуе от нагрузки, и мозг пытается залипнуть хоть на чем-то приятном. А? Думаете все-таки, что ленивая скотина? Записала. Ну и все же предлагаю попробовать выключить. Нет, не рилсы, не пугаемся. Бесконечный поток требований к себе. Как вам идея? Вдруг дело в нем. Так, навскидку.","s":"живой ролик m28"},{"id":"dnevnik_psihologa#1","k":"live","t":"Родная страна — не просто точка на карте. Это\nконтейнер\n: язык, коды, ощущение «я свой/своя».\nИ когда человек уезжает, он теряет прежде всего этот контейнер. В этот момент активируется та же система привязанности, что и в отношениях с матерью.\nМы часто говорим: мама и деньги, мама и стыд, мама и отношения. Но задумывались ли вы, что отношения с матерью влияют и на проживание эмиграции?\nПочему в одной стране одни чувствуют возможности, а другие — холод и отвержение? Потому что эмиграция — это\nвторичная сепарация:\nона либо повторяет ранний сценарий, либо даёт шанс его завершить.\nЕсли ранняя сепарация была\nподдержана\n— человек может горевать и адаптироваться. Если\nтравматичной\n— новая страна бессознательно переживается как материнский объект: «меня не принимают» или «я должна заслужить право быть здесь».\n3 марта\nна\nбесплатном\nвебинаре Анна расскажет, как материнская фигура влияет на взрослую жизнь и как это видеть в терапии.\nТакже — подробнее о специализации, стартующей в апреле.\n\nРегистрация","s":"живой пост, канал dnevnik_psihologa"},{"id":"olga_prokopova_s#1","k":"live","t":"Тут, девочки, пару дней назад я прочитала в новостях инициативу о том, чтобы принять у нас закон против домашнего насилия.\n\nМеня это удивило, ибо я почему-то была уверена, что у нас этот закон есть. Не знаю откуда такая уверенность,  наверное от здравого смысла.\nИ тут сегодня вижу другую новость. И в этой новости прекрасно (нет) всё. Следим за текстом:\n\"Председатель комитета Госдумы по защите семьи Нина Останина...\" - Мисс государственная заботушка о семье\n\"...заявила, что запрет домашнего насилия заставит россиян отказаться от вступления в брак.«Парни будут бояться» «импульсивных» заявлений в полицию от женщин и откажутся от брака\"\nЧего бл%ть? Прям вот заявила?\nНу давайте попробуем прочитать это с позиции здравого смысла, я думаю это звучит примерно так:\nОстанина: \"Вы что а&уели запрещать домашнее насилие? Ведь мужчины ради этого женятся,  а без этого не будут\"\nСюр!\n\n\n\nУ меня тоже есть заявление:\nА давайте перестанем в государственных масштабах считать мужчин пугливыми ланями, которые боятся женщин,  и одновременно козлами с поносом, которые ну никак не могут сдерживаться в своих порывах! Может тогда и они (мужчины) перестанут приписывать себе это поведение как нормальное, а?!","s":"живой пост, канал olga_prokopova_s"},{"id":"s41","k":"live","t":"Пять признаков, что человек прошел в жизни настоящий ад. Первый. Ему неловко, когда о нем искренне заботятся или делают комплименты. Забота для него что-то непривычное, с подвохом: я теперь что-то должен. Второй. Ему физически больно просить о помощи. Он лучше умрет. Третий. Он считывает настроение людей за полсекунды. По голосу, по тому, как человек моргает, как открывает дверь. Четвертый. Он не умеет отдыхать без чувства вины. Если ничего не делает, кажется, что сейчас кто-то придет и накажет за безделье. И пятый. Когда в жизни все хорошо, ему жутко тревожно. Мозг привык, что тишина бывает перед настоящим лютым пиздецом. Сколько пунктов насчитали у себя?","s":"живой ролик s41"},{"id":"psy_and_the_city#1","k":"live","t":"Почему даже в браке понимание стадий не всегда приносит спокойствие\n\nКогда вы замужем не первый год,\nотношения неизбежно меняются.\nЭто не плохо. Это не «что-то пошло не так», это просто факт.\nМожно знать, что есть этапы, кризисы, переходы. Можно понимать, что романтика трансформируется, что близость становится глубже, но тише. Можно читать много об этом всем. И всё равно внутри может быть:\n\nтревога\n\nощущение отдаления\n\nбольше раздражения, чем раньше\n\nгрусть по тому «как было в начале»\n\nсомнение «это нормально или мы теряем друг друга?»\nПотому что каждый этап брака касается наших чувств очень глубоко. И тут у каждого свое:\nстрах быть ненужной, страх остаться одной внутри отношений, страх перестать быть важной.\nВ терапии\nмы не просто определяем на каком этапе пара, мы аккуратно разбираем:\n\nчто именно изменилось между вами\n\nчто изменилось внутри вас\n\nгде естественный этап брака, а где накопленная усталость или непроговорённая боль\nИногда становится легче уже от того, что вы перестаёте держать это в себе.\nЕсли вы сейчас в точке, где:\n\nотношения изменились\n\nвы стали чаще сомневаться\n\nустали все анализировать в одиночку\n\nне хотите разрушить то, что можно сохранить\nМожно разобрать это индивидуально!\n\nНапишите мне в личные сообщения\n@an_smy\nслово\n«брак»\n, и я расскажу, как проходит первая встреча.\nБывает достаточно одного честного разбора, чтобы перестать паниковать и начать понимать, что с вами происходит.","s":"живой пост, канал psy_and_the_city"},{"id":"2026-10-01_03-00-35_rilsy_start/r_vopros_1","k":"gen","t":"«А зачем мне психолог, если у меня есть подруги?» Меня часто об этом спрашивают. С психологом вам не приходится еще и заботиться о том, кто вас слушает. Вот вы рассказываете подруге, что дома все хреново. Она пугается, начинает переживать. И вы уже сбавляете: «Да ладно, я справлюсь». Или вспоминаете, что у нее самой тяжелая неделя, и решаете: хватит ее грузить. В терапии все это время выделено для вас. Можно рассказать до конца, без привычного «ну все, хватит обо мне». Психолога не нужно успокаивать после вашего рассказа.","s":"Ольга, «а зачем мне психолог, если у меня есть подруги»"},{"id":"2026-10-01_03-00-35_rilsy_start/r_mif_1","k":"gen","t":"«Я и другу могу все это рассказать бесплатно».\n\nМожете, конечно. Но представление, что психологу достаточно посидеть и покивать, сильно мешает понять, зачем вообще к нему идти.\n\nВот начальник попросил поправить отчет. Вы уже думаете: «Он понял, что я ничего не умею. Скоро уволит». Друг скажет: «Да ты что, ты отличный специалист!» Приятно. До следующей правки.\n\nПсихолог спросит: «Что именно начальник сказал про увольнение?» И тут выясняется: про увольнение ничего. Вы сами решили, что правка означает конец карьеры, и уже второй день переживаете.\n\nЗа ошибки в отчете вы отвечаете. Но почему вы решили, что одна правка доказывает вашу непригодность?","s":"Михаил, «психолог просто слушает и кивает за мои деньги»"},{"id":"2026-10-01_03-00-35_rilsy_start/r_teen_1","k":"gen","t":"Слайд 1: На все вопросы подросток отвечает: «Нормально»\n\nСлайд 2: Вы спрашиваете: «Как день?» Подросток бросает «нормально», уходит в комнату и закрывает дверь. Обычный вечер, ничего особенного. Но если так заканчивается каждый разговор, вы постепенно перестаете знать, чем он живет. Хотя спрашиваете каждый день.\n\nСлайд 3: Подросток может молчать, потому что заранее ждет продолжения. Расскажешь про плохую оценку, придется обсуждать, сколько сидел в телефоне. Пожалуешься на ссору, услышишь, как надо было ответить. Лучше сказать «нормально», тогда объясняться не придется.\n\nСлайд 4: «Ничего не случилось».\n\nТак подросток заканчивает разговор, который кажется ему слишком трудным. Чтобы рассказать о неприятности, нужно еще выдержать ваши вопросы. Если он уже расстроен, на это просто нет сил. Короткий ответ помогает быстрее остаться одному.\n\nСлайд 5: «Да отстаньте уже!»\n\nВы только спросили, а он уже сердится. Он может ожидать целую цепочку знакомых вопросов: «Почему? А ты что сказал? А раньше нельзя было подумать?» Вы еще не успели их задать, а он уже начал защищаться.\n\nСлайд 6: «С вами говорить не хочу».\n\nОбидно, особенно когда из комнаты слышно, как он оживленно разговаривает с другом. Другу можно сказать: «День ужасный» и вместе повозмущаться. С родителями подросток порой ждет обсуждения своих ошибок.\n\nСлайд 7: Можно сказать: «Если захотите рассказать, я сначала просто послушаю», и действительно обойтись без немедленных советов.\n\nСейчас ему нужен разговор, после которого проблем не станет больше.","s":"Михаил, подросток закрылся в комнате и не разговаривает"},{"id":"2026-10-01_03-00-35_rilsy_start/r_men_1","k":"gen","t":"Четыре признака отца, которому проще накричать, чем сказать, что ему тяжело.\nПервое. После неприятного разговора на работе дома бесит любой шум. Начальнику вы ничего не сказали. Зато ребенку за громкий мультик досталось сразу.\nВторое. На вопрос жены «Что случилось?» отвечаете «Ничего». Рассказать, как вас задели, стыдно. Рявкнуть «Отстань» почему-то легче.\nТретье. Замечаете свое состояние только по сжатым зубам. Уже хочется стукнуть по столу, хотя еще час назад вы убеждали себя: «Ерунда, чего расстраиваться».\nЧетвертое. Детские слезы раздражают сильнее самого проступка. Хочется немедленно прекратить это нытье. Ребенок открыто показывает, что ему плохо. Вы себе такое запрещаете.\nА как вашему ребенку понять, что папе тоже бывает больно?","s":"Михаил, мужчины не плачут, а потом срываются на детей"},{"id":"2026-10-01_03-00-35_rilsy_start/r_car_1","k":"gen","t":"Слайд 1: Подруга молчит на ваше «Как помочь?»\n\nСлайд 2: Вы спрашиваете подругу с депрессией: «Что тебе привезти?» Она читает сообщение и ничего не выбирает.\n\nОбычный вопрос про продукты. Но ей сейчас нужно вспомнить, что есть дома, придумать, что съесть, и решить, сколько вашей помощи можно попросить.\n\nСлайд 3: Вы хотите облегчить ей жизнь. А ей приходится организовывать собственную помощь: придумать задачу, объяснить ее вам, договориться о времени.\n\nВ голове вполне может звучать: «Бл*ть, я даже на этот вопрос ответить не могу».\n\nСлайд 4: «Я не знаю» в ответ на предложение помощи легко принять за «мне ничего не нужно».\n\nПри депрессии бывает трудно выбрать даже между супом и бутербродом. Подруга может быть голодной и все равно сидеть перед открытым холодильником.\n\nСлайд 5: Подруга пишет: «Извини, что со мной столько возни», хотя вы сами предложили помочь.\n\nОна уже считает, сколько времени у вас отняла. К тяжелому состоянию добавляется задача быть удобной: попросить поменьше, поблагодарить получше, поскорее показать, что ей полегчало.\n\nСлайд 6: Вы спрашиваете: «Ну что, после прогулки лучше?» Подруга отвечает: «Да, спасибо», хотя ей по-прежнему тяжело.\n\nЕй жалко ваших стараний. Она видит, как вы ждете хороших новостей, и выдает их. Теперь рядом с вами приходится еще и изображать улучшение.\n\nСлайд 7: Так помощь превращается в список дел: выбрать, объяснить, поблагодарить, рассказать о результате.\n\nПодруга начинает говорить «я справлюсь», чтобы этот список больше не рос. Вы можете решить, что она отдаляется. Она просто пытается сократить все, на что нужны силы.\n\nСлайд 8: Предложите что-то конкретное и простое для ответа: «Могу завтра оставить у двери готовую еду. Напиши “да”, если привезти».\n\nПодруге не нужно становиться бодрее в благодарность за вашу помощь.","s":"Ольга, как поддержать подругу с депрессией и не сделать хуже"},{"id":"2026-10-01_03-00-35_rilsy_start/r_zlost_1","k":"gen","t":"«Он же не со зла»\n\nЕсли ты опять объясняешь себе, почему человек имел право с тобой резко разговаривать, у меня вопрос. Ты случайно не устроилась его адвокатом? Зарплата хоть есть?\n\n«Ну у него тяжелый день. Я же понимаю».\n\nПонимаешь. Даже когда он огрызнулся на обычный вопрос, ты уже вспомнила его недосып, работу и сложное детство. Свою обиду пока отложила. Сейчас некогда, надо человека оправдать.\n\nЯ бы здесь спросила: почему тебе можно злиться только на того, кому совсем нечем оправдаться?\n\nПотому что признать «я злюсь» для тебя почти равно сказать «он плохой». А ты его любишь. Поэтому начинаешь искать, что с тобой не так: слишком чувствительная, много требуешь, опять все близко к сердцу.\n\nОсобенно если знакомы такие фразы.\n\n«Он же не со зла». Допустим. Тебе все равно было больно слышать, как с тобой разговаривают.\n\n«Ты тоже не подарок». Конечно, ты тоже ошибаешься. Это не обязывает тебя спокойно принимать каждую чужую грубость.\n\n«Из-за такой ерунды злиться?» После этих слов ты уже стыдишься своей реакции. И вместо разговора о том, что тебя задело, объясняешь, почему вообще посмела расстроиться.\n\nВот так и получается: «Я вообще никогда не злюсь». Ты успеваешь пожалеть другого и поругать себя раньше, чем скажешь: «Со мной так нельзя».\n\nМожно сказать проще: «Я понимаю, что ты устал. Мне неприятно, когда ты на меня срываешься».\n\nТебе не нужно считать человека плохим, чтобы злиться на то, как он с тобой поступил.","s":"Юлия, «я вообще никогда не злюсь»"},{"id":"psikhologd#1","k":"live","t":"Взросление: Примирение через любовь\nВ финале «Бао» мать и взрослый сын вместе готовят пельмени. Это продолжения, нового этапа их отношений. Взросление не означает разрыва, а сепарация — не конец любви. Это переход к новому типу связи, где есть место и близости, и свободе. Мать учится принимать сына как взрослого, а сын ценит её любовь, возвращаясь, чтобы разделить с ней простые радости.\nПсихоанализ учит нас, что взросление — это всегда баланс между зависимостью и автономией. Если в детстве ребёнок получил достаточно тепла и поддержки, он может смело шагнуть в мир, зная, что у него есть надёжный тыл. Для матери этот процесс требует мужества: отпустить — значит довериться, что любовь не исчезнет, даже если ребёнок уходит.\nСлова поддержки для Вас\nЕсли вы, как мать из «Бао», боитесь отпустить своего ребёнка, помните: ваша любовь — это фундамент, который навсегда останется с ним. Отпуская, вы не теряете, а даёте ему крылья, зная, что он вернётся, потому что вы научили его ценить дом. Если вы — сын или дочь, стремящиеся к самостоятельности, не бойтесь идти вперёд. Ваше взросление — не предательство, а дар, который вы возвращаете миру, оставаясь связанными с теми, кто вас вырастил. Любовь не исчезает, она трансформируется, становясь глубже и свободнее.","s":"живой пост, канал psikhologd"},{"id":"labkovskiy#1","k":"live","t":"Всем плевать.\n«А можно я брошу работу?..»\n«Хочу быть домохозяйкой, это ужасно?..»\n«МИХАИЛ, А Я НОРМАЛЬНЫЙ?»\nДрузья мои, каждый день я получаю от вас десятки писем в Директ о том, что вы прямо точно «неправильные». «Со мной что-то не так» буквально звучит в каждом сообщении.\nЯ хочу открыть вам одну маленькую тайну.\nВСЕМ ПЛЕВАТЬ.\nПсихолог не знает, как вам «правильно жить», ведь такому на психфаке вообще не учат. Он без понятия, можно ли конкретно в вашем случае бросить вуз или нельзя, да и не ему это решать.\nЧто касается остальных, особенно тех, кто лезет с советами, своим ценным мнением и рекомендациями. Вы не поверите, но на самом деле им пофиг.\nРаботаете ли, за сколько вы снимаете квартиру и почему путешествуете, а не покупаете дачу.\nВсем по барабану, у людей своих задач полно. Единственное исключение — это родители. Им может и не плевать, но, по большому счёту, их вопросы и реакция — обычная тревожность.\nНапример, на месте «когда замуж» легко могло бы стоять «почему ты ешь так мало белка».\nДрузья мои, не надо класть себя в прокрустово ложе и пытаться свериться с миром, который якобы диктует вам правила жизни. Никто не диктует. Это вы так низко себя ставите, что вам какой угодно дегенерат из соцсетей может напеть, что ваше главное предназначение в жизни — жить на Бали и заниматься йогой.\nИ ему кстати тоже будет плевать, не поверите.\nДрузья, у нас полный sold-out вип-билетов на встречу в Москве 15-го июля.\nДобавили ещё немного доп. мест. Если вы тоже хотите встретиться со мной после лекции и в камерной атмосфере посидеть и пообщаться:\nдополнительные вип-билеты","s":"живой пост, канал labkovskiy"},{"id":"2026-10-01_03-00-35_rilsy_start/r_post_1","k":"gen","t":"Ты открываешь переписку с ним, хотя уведомления так и не было.\n\nПосмотрела, закрыла. Через пять минут опять открыла. Ну что такого, просто проверяешь телефон. Только фильм уже идет полчаса, а ты даже не поняла, кто там с кем поссорился.\n\nНаписать самой? Да легко. Но тут же мысль: «Я вчера первая написала. Посмотрим, вспомнит ли он сегодня».\n\nИ вот ты уже ждешь подтверждения, что ему тоже хочется с тобой поговорить. Чтобы он сам потянулся к телефону. Без твоего «привет, как день?».\n\nПриходит уведомление, ты хватаешь телефон. Подруга. Отвечаешь ей и снова смотришь, не появился ли он в сети.\n\nПотом начинаешь его оправдывать: занят, устал, уснул. Через минуту злишься: на телефон у него время есть. А следом ругаешь себя: «Мы всего две недели общаемся. Чего я вообще так прицепилась?»\n\nНапишет, можно выдохнуть. Промолчит, и ты уже перебираешь, что сказала лишнего на последней встрече.\n\nНо свое желание уже можно назвать прямо: «Я тоже хочу, чтобы меня искали».","s":"Юлия, он не пишет первым, а я весь вечер жду и проверяю телефон"},{"id":"2026-10-01_03-00-35_rilsy_start/r_money_1","k":"gen","t":"«Если я заслужила повышение, они сами должны предложить».\n\nИ вот вы уже полгода ждете, когда руководство догадается. Берете дополнительные задачи, выручаете коллег, остаетесь после работы. Ну теперь-то заметят?\n\nВ этой мысли повышение становится проверкой: ценят ли меня вообще? Хочется, чтобы начальник сам позвал и сказал: «Мы видим, сколько вы делаете. Поднимаем зарплату». Тогда можно выдохнуть. Вас заметили.\n\nА если пришлось попросить, внутри сразу: «Ну я же сама напросилась. Вдруг согласились, лишь бы отвязалась?»\n\nВот почему так стыдно начинать разговор. Вы собираетесь обсуждать деньги, но чувствуете себя так, будто выпрашиваете признание.\n\nОткрываете переписку с руководителем. Пишете: «Хотела бы обсудить пересмотр зарплаты». Стираете. Зато через пять минут спокойно отвечаете: «Да, я возьму эту задачу».\n\nЕще поработать привычнее, чем спросить. И появляется надежда: вот после ЭТОЙ задачи уж точно оценят. Бл*дь, сколько еще задач должно быть?\n\nРазговор можно начать с конкретного: «За последний год у меня добавились такие-то обязанности. Хочу обсудить зарплату с учетом этой нагрузки».\n\nУ руководителя есть рабочий вопрос: сколько компания готова платить за вашу работу. У вас есть личный: видят ли мои старания? Эти вопросы легко смешать. Но сумма в расчетном листке не ответит на все, что вам хочется услышать о себе.\n\nПовышение, о котором вы сами попросили, тоже считается.","s":"Ольга, стыдно просить повышение, хотя работаю больше всех"},{"id":"2026-10-01_03-00-35_rilsy_start/r_rod_1","k":"gen","t":"Четыре признака, что вы звоните маме, потому что боитесь потом выслушивать претензии.\nПервое. Звонок приходится на рабочий день. Вы прячетесь в коридоре на пять минут, потому что вечером хотите побыть с мужем. Но сказать это маме страшно.\nВторое. Готовите отчет заранее. Что ели, куда ходили, почему голос уставший. Иначе начнутся расспросы, и придется еще доказывать, что все хорошо.\nТретье. Отдыхаете с оглядкой на телефон. Фильм уже включили, но думаете: «Бля, надо сначала позвонить, иначе весь вечер буду дергаться».\nЧетвертое. Радуетесь, когда она не берет трубку. Можно спокойно заниматься своим: звонок в истории есть, вы попытались. Мама занята, и вы наконец можете выдохнуть.","s":"Ольга, мама обижается, если я не звоню каждый день"},{"id":"2026-10-01_03-00-35_rilsy_start/r_mif_2","k":"gen","t":"«Просто не накручивай себя».\n\nНет. Тревогу по команде не выключишь.\n\nТы ведь и так пытаешься. Он долго не отвечает, ты говоришь себе: «Занят человек, успокойся». Откладываешь телефон. Через минуту снова проверяешь. И тут начинается: «Ну что со мной не так? Почему я даже такую ерунду спокойно пережить не могу?»\n\nТеперь ты переживаешь еще и из-за того, что переживаешь. Каждая проверка телефона становится доказательством: опять не справилась.\n\nБудто успокоиться легко, а ты зачем-то упорно выбираешь мучиться. Хотя ты бы с удовольствием перестала высматривать, когда он был в сети.\n\nМожно тревожиться и все равно дать человеку время ответить. Можно сказать, что тебя беспокоит, без обвинений и требования немедленно успокоить тебя.\n\nНо обещать себе, что больше никогда не испугаешься и не подумаешь о плохом, бессмысленно. Такая мысль может появиться раньше, чем ты успеешь себе что-то объяснить.\n\nТебе стало страшно. Ты этим никому ничего плохого не сделала.","s":"Юлия, «тревогу надо просто перестать накручивать»"},{"id":"2026-10-01_03-00-35_rilsy_start/r_tg_1","k":"gen","t":"«Сейчас поймут, что я ничего не умею»\n\nВы пятый раз перечитываете письмо коллеге, хотя там всего три предложения и обычный рабочий вопрос.\n\nНу что такого, лишний раз проверить. Только вы уже ищете в письме все, к чему можно придраться. «А вдруг вопрос глупый? А вдруг я должен это знать?»\n\nВы тратите уйму сил, чтобы никто не заметил предполагаемую некомпетентность. А когда все проходит хорошо, объясняете себе: «Ну, я же все перепроверил. Без этого точно опозорился бы».\n\nВы приписываете весь успех дополнительным проверкам.\n\nПодготовили отчет, получили «спасибо, все понятно». Казалось бы, можно выдохнуть. Но в голове уже готово: «Они просто не знают, сколько я с ним возился».\n\nИ что? Время, которое вы потратили на задачу, разве отменяет то, что вы с ней справились?\n\nС каждым следующим заданием проверок становится больше. Вы устаете, делаете медленнее и получаете еще один повод себя ругать: «Нормальный специалист давно бы закончил». Даже похвала не убеждает. Она относится к работе, которую вы сами уже обесценили.\n\nРаботу, за которую вас похвалили, сделали вы.","s":"Михаил, боюсь, что на работе меня раскусят и поймут, что я ничего не умею"},{"id":"m07","k":"live","t":"Дети, у которых было сложное детство, очень много думают. Про таких говорят: живут в своей голове. Но я добавлю одну вещь, как психолог, который много работает с такими людьми. Если человек очень много думает, скорее всего, он очень мало чувствует. Потому что он научился прятаться от всего пиздеца в голову. Анализировал обстановку дома, настроение родителей. Там было безопасно, только там был контроль. А чувствовать было больно, страшно и одиноко. Так что бесконечное обдумывание часто способ не встречаться с тревогой. В следующий раз, когда заметишь, что опять жуешь эту мыслительную жвачку, спроси себя по-доброму: котенок, а какое чувство я сейчас не хочу чувствовать? Если узнал себя, в описании есть еще.","s":"живой ролик m07"},{"id":"2026-10-01_03-00-35_rilsy_start/r_drug_1","k":"gen","t":"Друг пишет «Ты не спишь?», и вы уже понимаете: сейчас будете разговаривать до двух ночи.\n\nВыслушать человека, когда ему плохо, кажется обычным делом. Но после таких разговоров легко почувствовать себя гораздо ближе к нему, чем вы есть на самом деле.\n\nВам рассказывают самое личное. Вы знаете, кто его обидел, чего он боится, почему опять поссорился с партнером. И думаете: «Он мне доверяет. Значит, я для него важный человек».\n\nДа, доверяет. Только по этим разговорам еще трудно понять, есть ли в вашей дружбе место для вас.\n\nВот у него все наладилось. Вы отправляете что-то смешное, в ответ реакция. Предлагаете встретиться: «Да, надо как-нибудь». Про отпуск узнаете из фотографий. А через месяц снова длинное сообщение, и вы сразу откладываете свои дела.\n\nК концу звонка ему легче. Вы хотели рассказать, что у вас на работе совсем тяжело, но уже поздно. Ладно, в следующий раз.\n\nТакие разговоры могут крепко привязывать. Особенно когда вы слышите: «Только ты меня понимаешь». После этого даже обидеться на его исчезновение сложно. Вы же понимаете, ему было плохо.\n\nПостепенно вы привыкаете быть нужным именно тогда, когда у человека что-то случилось. И начинаете ждать очередного «Ты не спишь?», потому что хотя бы тогда он хочет с вами поговорить.\n\nА если сегодня плохо вам, вы можете ему позвонить, не чувствуя, что мешаете?","s":"Михаил, друзья пропадают, когда у них все хорошо, и появляются, когда плохо"}];const KEY='turing-2026-10-01_03-03-42';let A={};try{A=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let shown=false;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}};

+'<div class="row"><button data-a="live" class="'+(a==='live'?'on':'')+'">Живой человек</button><button data-a="gen" class="'+(a==='gen'?'on':'')+'">Нейросеть</button></div>'

c.querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>{A[d.id]=b.dataset.a;save();render()});m.appendChild(c)});

document.getElementById('score').textContent=shown?('угадано '+ok+' из '+done.length+(done.length?' ('+Math.round(ok*100/done.length)+'%)':'')):(done.length+' из '+D.length+' отмечено')}
document.getElementById('reveal').onclick=()=>{shown=!shown;document.getElementById('reveal').textContent=shown?'Спрятать ответы':'Показать ответы';render()};
document.getElementById('dl').onclick=()=>{const b=new Blob([JSON.stringify({run:KEY,answers:A},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='turing-2026-10-01_03-03-42.json';a.click()};
