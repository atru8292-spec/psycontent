server {
    listen 80;
    listen [::]:80;
    server_name psycont.ru www.psycont.ru;
    location / {
        return 301 https://psycont.ru$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name psycont.ru www.psycont.ru;

    ssl_certificate /etc/letsencrypt/live/psycont.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psycont.ru/privkey.pem;
    # вход через Москву (Caddy на 141.133.187.249): настоящий IP посетителя только от этого адреса
    set_real_ip_from 141.133.187.249;
    real_ip_header X-Real-IP;
    # Caddy в Москве склеивает куки из HTTP/2 в одну строку Cookie, у вошедшего она бывает больше 8 КБ (умолчание 4 8k) -> 400
    # Request Header Or Cookie Too Large (19.11). Директива уровня server: действует после выбора сервера по имени,
    # проверено куками 9-15 КБ через Москву (200); razbor не задевает (у него свое умолчание 8k). Дальше предел Node 16 КБ (431)
    large_client_header_buffers 4 32k;
    if ($host ~* ^www\.) { return 301 https://psycont.ru$request_uri; }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 30m;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
